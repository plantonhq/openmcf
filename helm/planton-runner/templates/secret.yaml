{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "planton-runner.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: {{ required "credentials.content is required when credentials.existingSecret is not set. Provide via: --set-file credentials.content=path/to/credentials.json" .Values.credentials.content | quote }}
{{- end }}
