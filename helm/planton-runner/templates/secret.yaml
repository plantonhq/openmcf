{{- if not .Values.enrollment.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "planton-runner.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "enrollment.token is required when enrollment.existingSecret is not set. Create one with: planton runner token create <token-name>" .Values.enrollment.token | quote }}
{{- end }}
