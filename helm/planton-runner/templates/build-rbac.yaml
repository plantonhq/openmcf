{{- if and .Values.build.enabled .Values.build.rbac.create -}}
# RBAC for the runner's build capability. The verb list mirrors exactly what
# the build activities perform (and what the readiness probe's rbac-build and
# rbac-logs checks assert): creating PipelineRuns and their supporting
# resources, reconciling by list, label-scoped deletecollection cleanup, and
# following task pod logs.
#
# There is no privilege-escalation hazard in the roles/rolebindings grants:
# every permission the runner's in-build Role hands to a build's
# ServiceAccount is held by the runner itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "planton-runner.fullname" . }}-build
  namespace: {{ include "planton-runner.buildNamespace" . }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
rules:
  # Create PipelineRuns, reconcile by list, clean up by label selector
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "list", "deletecollection"]
  # Reconcile reads TaskRuns before PipelineRuns (load-bearing ordering)
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["list"]
  # Per-build supporting resources, provisioned just-in-time and
  # label-cleaned after the build
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["create", "get", "deletecollection"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "deletecollection"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "deletecollection"]
  # Log streamer: watch task pods and follow their container logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "planton-runner.fullname" . }}-build
  namespace: {{ include "planton-runner.buildNamespace" . }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "planton-runner.fullname" . }}-build
subjects:
  - kind: ServiceAccount
    name: {{ include "planton-runner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Tekton publishes its cluster-wide CloudEvents sink in the config-defaults
# ConfigMap of its own install namespace. The runner's readiness probe reads
# it to report the events-sink check; without this grant the check would
# permanently report "could not determine" instead of a verdict.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "planton-runner.fullname" . }}-events-sink-read
  namespace: {{ .Values.build.tekton.installNamespace }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["config-defaults"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "planton-runner.fullname" . }}-events-sink-read
  namespace: {{ .Values.build.tekton.installNamespace }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "planton-runner.fullname" . }}-events-sink-read
subjects:
  - kind: ServiceAccount
    name: {{ include "planton-runner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
