# -- Planton Runner Helm Chart values.
# See README.md for full documentation.

image:
  # -- Container image repository.
  repository: ghcr.io/plantonhq/planton/runner
  # -- Container image tag (defaults to chart appVersion).
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Optional image pull secrets for private registries.
imagePullSecrets: []

# -- Override the release name prefix used in resource names.
nameOverride: ""
# -- Override the full resource name (disables prefix generation).
fullnameOverride: ""

# Runner credentials -- the complete identity and connectivity document.
# Generated by: planton runner generate-credentials <runner-name>
credentials:
  # -- Raw JSON content of the RunnerCredentials file.
  # Provide via: helm install ... --set-file credentials.content=path/to/credentials.json
  content: ""

  # -- Use a pre-existing Kubernetes Secret instead of creating one.
  # When set, credentials.content is ignored and no Secret is created by the chart.
  existingSecret: ""

  # -- Key within the existing Secret that holds the credentials JSON.
  # Only used when existingSecret is set.
  existingSecretKey: "credentials.json"

# Runner operational settings (independent of credentials).
runner:
  # -- gRPC server port. CloudOps routes to this port via the tunnel.
  port: 50051
  # -- Log level: debug, info, warn, error.
  logLevel: "info"
  # -- Execution mode: grpc, temporal, dual.
  executionMode: "grpc"

# Temporal worker settings. Only used when runner.executionMode includes temporal.
temporal:
  # -- Temporal server address (host:port). Required when executionMode is temporal or dual.
  address: ""
  # -- Temporal namespace.
  namespace: "default"
  # -- Maximum concurrent Temporal activities.
  maxConcurrency: 10

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  # -- Create a Kubernetes ServiceAccount for the runner pod.
  create: true
  # -- Annotations for the ServiceAccount (e.g., for IRSA or Workload Identity).
  annotations: {}
  # -- Override the ServiceAccount name. Defaults to the release fullname.
  name: ""

# -- Additional labels to apply to all resources.
commonLabels: {}

# -- Additional annotations for the Deployment pod template.
podAnnotations: {}

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}
