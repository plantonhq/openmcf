apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "planton-operator.fullname" . }}-manager
  labels:
    {{- include "planton-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      # nodes: read-only substrate detection (EKS vs plain AWS vs GKE/AKS) so
      # the runner component's status can suggest the right cloud-identity
      # setup for the cluster it is actually on.
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      # events: read-only, so a stuck volume's status can relay the storage
      # provisioner's own ProvisioningFailed message (e.g. a backend's
      # minimum-size rejection) instead of a generic wait.
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - acid.zalan.do
    resources:
      - operatorconfigurations
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - acid.zalan.do
    resources:
      - postgresqls
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - acid.zalan.do
    resources:
      - postgresqls/status
    verbs:
      - get
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      # Read-only: cert-manager owns the Certificate objects (the operator
      # only annotates the Ingress). Reading them lets the ingress status
      # gate on ACTUAL issuance and relay the issuer's own reason -- instead
      # of advertising an HTTPS door that answers with a placeholder cert.
      - certificates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - planton.ai
    resources:
      - plantonplatforms
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - planton.ai
    resources:
      - plantonplatforms/finalizers
    verbs:
      - update
  - apiGroups:
      - planton.ai
    resources:
      - plantonplatforms/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      # delete: opt-out reconciles remove namespaced grants they previously
      # created (the runner's build grant when builds are disabled).
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      # bind + escalate: Kubernetes refuses to let a caller grant permissions
      # it does not hold; the operator renders the control plane's
      # token-reviewer ClusterRole (TokenReview / SelfSubjectAccessReview
      # create), so it needs the escalation verbs the generated manager RBAC
      # (config/rbac/role.yaml) already carries -- this block is its
      # hand-synced chart copy.
      - clusterroles
    verbs:
      - bind
      - create
      - escalate
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      # delete: opt-out reconciles remove namespaced grants they previously
      # created (the runner's build grant when builds are disabled).
      - roles
    verbs:
      - bind
      - create
      - delete
      - escalate
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      # The vendored Tekton Pipelines release ships its own webhook
      # configurations; installing it means applying them.
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - solr.apache.org
    resources:
      - solrbackups
      - solrprometheusexporters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - solr.apache.org
    resources:
      - solrclouds
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - solr.apache.org
    resources:
      - solrclouds/status
    verbs:
      - get
  - apiGroups:
      - storage.k8s.io
    resources:
      # Read-only: the operator never installs storage drivers or mutates
      # classes (that would need cloud credentials the platform deliberately
      # never holds). It reads these to explain a stuck volume -- naming the
      # missing default class or the class whose CSI driver is not installed.
      - csidrivers
      - storageclasses
    verbs:
      - get
      - list
      - watch
