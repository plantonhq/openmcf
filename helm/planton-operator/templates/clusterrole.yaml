apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "planton-operator.fullname" . }}-manager
  labels:
    {{- include "planton-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      # nodes: read-only substrate detection (EKS vs plain AWS vs GKE/AKS) so
      # the runner component's status can suggest the right cloud-identity
      # setup for the cluster it is actually on.
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      # events: read-only, so a stuck volume's status can relay the storage
      # provisioner's own ProvisioningFailed message (e.g. a backend's
      # minimum-size rejection) instead of a generic wait.
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - acid.zalan.do
    resources:
      - operatorconfigurations
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - acid.zalan.do
    resources:
      - postgresqls
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - acid.zalan.do
    resources:
      - postgresqls/status
    verbs:
      - get
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - planton.ai
    resources:
      - plantonplatforms
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - planton.ai
    resources:
      - plantonplatforms/finalizers
    verbs:
      - update
  - apiGroups:
      - planton.ai
    resources:
      - plantonplatforms/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - solr.apache.org
    resources:
      - solrbackups
      - solrprometheusexporters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - solr.apache.org
    resources:
      - solrclouds
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - solr.apache.org
    resources:
      - solrclouds/status
    verbs:
      - get
  - apiGroups:
      - storage.k8s.io
    resources:
      # Read-only: the operator never installs storage drivers or mutates
      # classes (that would need cloud credentials the platform deliberately
      # never holds). It reads these to explain a stuck volume -- naming the
      # missing default class or the class whose CSI driver is not installed.
      - csidrivers
      - storageclasses
    verbs:
      - get
      - list
      - watch
