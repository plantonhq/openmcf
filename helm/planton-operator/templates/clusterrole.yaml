{{- /*
The manager's permissions are generated from the +kubebuilder:rbac markers in
the operator's Go sources and land in rbac/manager-role.yaml verbatim; the
reasons behind individual grants live beside those markers. This template owns
only the chart's naming and labels, so the permissions the chart grants are
always exactly the ones the operator's code declares.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "planton-operator.fullname" . }}-manager
  labels:
    {{- include "planton-operator.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "rbac/manager-role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
