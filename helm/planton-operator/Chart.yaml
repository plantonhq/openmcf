apiVersion: v2
name: planton-operator
description: Kubernetes operator that deploys the full Planton stack via a PlantonPlatform CRD
type: application
version: 0.2.0
# appVersion is the operator image tag this chart deploys. The operator image is
# built in the platform repo and published to ghcr.io/plantonhq/planton/operator;
# keep this pinned to a known-good published tag (bump deliberately when a new
# operator image is released).
appVersion: "v0.0.32-selfhosted-preview"
home: https://github.com/plantonhq/planton
sources:
  - https://github.com/plantonhq/planton
maintainers:
  - name: Planton
    url: https://planton.ai
keywords:
  - planton
  - operator
  - kubernetes
  - self-hosted
  - infrastructure
kubeVersion: ">=1.24.0-0"
