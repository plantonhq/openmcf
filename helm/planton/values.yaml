# -- Planton platform chart values.
#
# This chart declares one PlantonPlatform resource with proven defaults: the
# built-in front door (console + API + sign-in over one kubectl port-forward),
# the bundled identity server, the bundled secrets manager (OpenBAO --
# initialized, unsealed, and registered as the org's default secret store),
# and the in-cluster runner. No value below is required.
#
# The cluster must already run the Planton operator (the planton-operator
# chart), which brings the PlantonPlatform definition and reconciles the
# resource this chart creates.
#
# See README.md for full documentation and the per-cloud values files
# (values.eks.yaml, values.gke.yaml, ...) for publishing at your own URL.

platform:
  # -- Name of the PlantonPlatform resource (also the prefix of every
  # component object the operator creates, e.g. "<name>-gateway").
  name: planton

  # -- The PlantonPlatform spec, passed through verbatim. EVERY field of the
  # CRD is expressible here -- the chart curates nothing, so a new operator
  # capability never needs a chart release to become reachable. Field
  # reference: https://github.com/plantonhq/planton/tree/main/helm/planton-operator#the-plantonplatform-resource
  # spec.version defaults to this chart's appVersion when omitted.
  spec: {}
    # version: v0.0.41-selfhosted-preview
    # storage:                # platform-wide storage defaults (see README "Storage"):
    #   storageClassName: ""  #   the class EVERY volume provisions from (else the cluster default)
    #   size: 800Gi           #   one size for EVERY volume (else per-component defaults;
    #                         #   set at or above your backend's minimum volume size)
    # ingress:
    #   enabled: true
    #   hostname: planton.example.com
    #   tls:
    #     issuer: {name: letsencrypt, kind: ClusterIssuer}
    # runner:
    #   serviceAccountAnnotations:
    #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/planton-runner
    # vault:                  # the bundled secrets manager, deployed by default;
    #   enabled: false        #   opting out loses pasted-credential storage and
    #                         #   keyless connections (see README "Secrets")
