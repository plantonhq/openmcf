syntax = "proto3";

package dev.planton.finops.componentcapacityderivation.v1;

import "finops/componentcapacityderivation/v1/spec.proto";
import "shared/metadata.proto";

// ComponentCapacityDerivation is the machine-executable half of a
// cluster-capacity component's cost knowledge: the rules that turn ANY
// manifest's spec values into the capacity footprint the workload
// reserves from its target cluster. It is the capacity twin of
// ComponentCostDerivation -- where a priced component's rules select
// meters and price-book entries, a cluster-capacity component creates no
// cloud SKU, so its rules bind resources blocks, instance counts, and
// per-instance volumes instead, and the produced estimate states capacity
// (requests, limits, persistent storage) with a basis sentence tracing
// every total back to the manifest's values. Every catalog preset is
// replayed through these rules to generate the component's committed
// ComponentCostEstimate, so the rules are held to the hand-verified
// footprints by CI. One file per component, at
// catalog/_pricing/capacity/<component>.yaml (filename = metadata.name =
// the component directory name). Follows the KRM pattern (apiVersion +
// kind + metadata + spec).
//
// Ownership split, so every fact has exactly one home: this derivation
// owns the value-to-capacity bindings, exclusions, and notes; the
// component's cost.yaml owns the billing-model statement
// (cluster_capacity) and the driver prose; the generated estimate owns
// nothing -- it is arithmetic. A component carries either this document
// or a hand-authored ComponentCostEstimateModel, never both -- and never
// a ComponentCostDerivation beside it (capacity components price no
// meters).
//
// Example:
//   apiVersion: finops.planton.dev/v1
//   kind: ComponentCapacityDerivation
//   metadata:
//     name: kubernetespostgres
//   spec:
//     workloads:
//       - label: instance
//         resources_path: resources
//         instances:
//           field_value:
//             field_path: instances
//             default_when_unset: "1"
//         volumes:
//           - label: data
//             size_path: storage.size
//           - label: WAL
//             size_path: wal_storage.size
//     exclusions:
//       - text: the dollar value of this capacity is the target
//           cluster's node and storage-class economics
message ComponentCapacityDerivation {
  string api_version = 1;
  string kind = 2;
  dev.planton.shared.CloudResourceMetadata metadata = 3;
  ComponentCapacityDerivationSpec spec = 4;
}
