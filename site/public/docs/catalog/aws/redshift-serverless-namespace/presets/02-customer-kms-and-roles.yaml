apiVersion: aws.planton.dev/v1
kind: AwsRedshiftServerlessNamespace
metadata:
  name: my-analytics-data
spec:
  region: us-west-2
  dbName: analytics
  adminUsername: admin
  manageAdminPassword: true
  kmsKeyId:
    valueFrom:
      kind: AwsKmsKey
      name: my-data-key
      fieldPath: status.outputs.key_arn
  iamRoles:
    - valueFrom:
        kind: AwsIamRole
        name: my-redshift-copy-role
        fieldPath: status.outputs.role_arn
    - valueFrom:
        kind: AwsIamRole
        name: my-redshift-spectrum-role
        fieldPath: status.outputs.role_arn
  defaultIamRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: my-redshift-copy-role
      fieldPath: status.outputs.role_arn
  logExports:
    - connectionlog
    - useractivitylog
    - userlog
