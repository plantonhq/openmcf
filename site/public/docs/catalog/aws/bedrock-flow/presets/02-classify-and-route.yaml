apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockFlow
metadata:
  name: support-router
spec:
  region: us-west-2
  description: Classify a request and route it to docs retrieval or raw reply
  executionRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: bedrock-flow-role
      fieldPath: status.outputs.role_arn
  definition:
    nodes:
      - name: FlowInput
        type: Input
        outputs:
          - name: document
            type: String
      - name: Classify
        type: Prompt
        inputs:
          - name: input
            expression: $.data
            type: String
        outputs:
          - name: modelCompletion
            type: String
        prompt:
          inline:
            modelId: amazon.nova-micro-v1:0
            text:
              text: "Answer with exactly one word, docs or other: {{input}}"
              inputVariables:
                - input
            inferenceConfiguration:
              temperature: 0
      - name: Route
        type: Condition
        inputs:
          - name: category
            expression: $.data
            type: String
        condition:
          conditions:
            - name: docs
              expression: category == "docs"
            - name: default
      - name: AskKb
        type: KnowledgeBase
        inputs:
          - name: retrievalQuery
            expression: $.data
            type: String
        outputs:
          - name: outputText
            type: String
        knowledgeBase:
          knowledgeBaseId:
            valueFrom:
              kind: AwsBedrockKnowledgeBase
              name: product-docs
              fieldPath: status.outputs.knowledge_base_id
          modelId: amazon.nova-lite-v1:0
          numberOfResults: 5
      - name: FlowOutput
        type: Output
        inputs:
          - name: document
            expression: $.data
            type: String
      - name: RawOutput
        type: Output
        inputs:
          - name: document
            expression: $.data
            type: String
    connections:
      - name: InToClassify
        source: FlowInput
        target: Classify
        data:
          sourceOutput: document
          targetInput: input
      - name: ClassifyToRoute
        source: Classify
        target: Route
        data:
          sourceOutput: modelCompletion
          targetInput: category
      - name: ClassifyToKb
        source: Classify
        target: AskKb
        data:
          sourceOutput: modelCompletion
          targetInput: retrievalQuery
      - name: RouteDocs
        source: Route
        target: AskKb
        conditional:
          condition: docs
      - name: ClassifyToRaw
        source: Classify
        target: RawOutput
        data:
          sourceOutput: modelCompletion
          targetInput: document
      - name: RouteDefault
        source: Route
        target: RawOutput
        conditional:
          condition: default
      - name: KbToOut
        source: AskKb
        target: FlowOutput
        data:
          sourceOutput: outputText
          targetInput: document
