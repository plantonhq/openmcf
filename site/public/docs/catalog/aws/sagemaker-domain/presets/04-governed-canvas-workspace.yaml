apiVersion: aws.planton.dev/v1
kind: AwsSagemakerDomain
metadata:
  name: governed-canvas-workspace
spec:
  region: us-west-2
  authMode: IAM
  vpcId:
    value: "<vpc-id>"
  subnetIds:
    - value: "<private-subnet-id-az1>"
    - value: "<private-subnet-id-az2>"
  defaultUserSettings:
    executionRoleArn:
      value: "<sagemaker-execution-role-arn>"
    canvasAppSettings:
      # No direct endpoint deployment from Canvas -- models must go through
      # the model registry where they can be reviewed and approved.
      directDeployStatus: DISABLED
      modelRegisterSettings:
        status: ENABLED
      # Time-series forecasting via Amazon Forecast under a dedicated role.
      timeSeriesForecastingSettings:
        amazonForecastRoleArn:
          value: "<canvas-forecast-role-arn>"
        status: ENABLED
      # Pin where Canvas stores datasets, intermediate results, and models.
      workspaceSettings:
        s3ArtifactPath: "s3://<canvas-workspace-bucket>/artifacts/"
    # Business users get Canvas only; hide the code-first surfaces.
    studioWebPortalSettings:
      hiddenAppTypes:
        - JupyterServer
        - CodeEditor
