apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerDomain
metadata:
  name: my-team-ml-domain
spec:
  region: <aws-region>
  authMode: IAM
  vpcId:
    value: <vpc-id>
  subnetIds:
    - value: <private-subnet-id-az1>
    - value: <private-subnet-id-az2>
  defaultUserSettings:
    executionRoleArn:
      value: <sagemaker-execution-role-arn>
    jupyterLabAppSettings:
      defaultResourceSpec:
        instanceType: ml.t3.medium
      # Idle shutdown is the single most important cost control on a
      # Studio domain: without it, instances run 24/7.
      idleSettings:
        idleTimeoutInMinutes: 120
        minIdleTimeoutInMinutes: 60
        maxIdleTimeoutInMinutes: 480
  # The per-person plane: one profile per team member, each with its own
  # home directory and (optionally) its own settings overrides. Replace the
  # example names with your team roster (1-63 chars, alphanumeric+hyphens).
  userProfiles:
    - userProfileName: alice
    - userProfileName: bob
  # The collaboration plane: a shared space whose JupyterLab runtime and
  # EBS volume are shared by everyone with access — one notebook, many
  # editors. Ownership and sharing are declared together (AWS's contract).
  spaces:
    - spaceName: team-workspace
      displayName: Team Workspace
      ownershipSettings:
        ownerUserProfileName: alice
      spaceSharingSettings:
        sharingType: Shared
      spaceSettings:
        appType: JupyterLab
        jupyterLabAppSettings:
          defaultResourceSpec:
            instanceType: ml.t3.medium
          idleSettings:
            idleTimeoutInMinutes: 60
        spaceStorageSettings:
          ebsVolumeSizeInGb: 25
