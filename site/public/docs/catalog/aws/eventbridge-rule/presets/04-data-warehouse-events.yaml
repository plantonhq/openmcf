apiVersion: aws.planton.dev/v1alpha1
kind: AwsEventBridgeRule
metadata:
  name: warehouse-ingest-rule
spec:
  region: <aws-region>
  description: Run a Redshift ingestion statement whenever new data lands
  eventPattern:
    source:
      - aws.s3
    detail-type:
      - "Object Created"
    detail:
      bucket:
        name:
          - <landing-bucket-name>
  targets:
    - name: warehouse-ingest
      arn:
        value: <redshift-cluster-arn>
      roleArn:
        value: <events-redshift-role-arn>
      redshiftTarget:
        database: analytics
        secretsManagerArn: <redshift-credentials-secret-arn>
        sql: "CALL ingest_landing_zone();"
        statementName: landing-zone-ingest
        withEvent: true
      retryPolicy:
        maximumEventAgeInSeconds: 3600
        maximumRetryAttempts: 10
      deadLetterConfig:
        arn:
          value: <dlq-queue-arn>
