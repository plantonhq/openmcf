apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockKnowledgeBase
metadata:
  name: docs-site
spec:
  region: us-west-2
  description: Documentation site retrieval with an AWS-managed vector store
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: bedrock-kb-role
      fieldPath: status.outputs.role_arn
  managed: {}
  dataSources:
    - name: site
      description: Public documentation site crawl
      dataDeletionPolicy: DELETE
      web:
        seedUrls:
          - https://docs.example.com
        scope: HOST_ONLY
        maxPages: 1000
        rateLimit: 60
      vectorIngestion:
        chunking:
          strategy: HIERARCHICAL
          hierarchical:
            overlapTokens: 60
            levels:
              - maxTokens: 1500
              - maxTokens: 300
