apiVersion: aws.planton.dev/v1alpha1
kind: AwsKmsKey
metadata:
  name: xks-backed-key
spec:
  region: <aws-region>
  description: <key-description>
  deletion_window_days: 30
  aliases:
    - alias/xks-backed-key
  # The key lives in an EXTERNAL key store: cryptographic operations are
  # forwarded to <xks-key-id> in your external key manager. For a CloudHSM
  # key store, set custom_key_store_id only (KMS generates the material in
  # your CloudHSM cluster). Custom key store keys are symmetric-only, never
  # rotate automatically, and cannot be multi-Region (AWS's contract).
  custom_key_store_id: <custom-key-store-id>
  xks_key_id: <xks-key-id>
