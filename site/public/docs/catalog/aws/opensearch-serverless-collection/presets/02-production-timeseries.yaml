apiVersion: aws.planton.dev/v1alpha1
kind: AwsOpenSearchServerlessCollection
metadata:
  name: <app>-logs
spec:
  region: <aws-region>
  description: Production log analytics for <app>
  type: TIMESERIES
  # The production posture: warm standbys in a second AZ (the AWS
  # default; doubles the OCU floor).
  standbyReplicas: ENABLED
  # A customer-managed key -- the choice is fixed at create time.
  encryption:
    kmsKeyArn:
      valueFrom:
        kind: AwsKmsKey
        name: <kms-key-resource-name>
        fieldPath: status.outputs.key_arn
  dataAccess:
    # The ingest pipeline writes; index management included.
    - principals:
        - valueFrom:
            kind: AwsIamRole
            name: <ingest-role-resource-name>
            fieldPath: status.outputs.role_arn
      indexPermissions:
        - aoss:CreateIndex
        - aoss:WriteDocument
        - aoss:UpdateIndex
        - aoss:DescribeIndex
    # Analysts read only.
    - principals:
        - valueFrom:
            kind: AwsIamRole
            name: <analyst-role-resource-name>
            fieldPath: status.outputs.role_arn
      indexPermissions:
        - aoss:ReadDocument
        - aoss:DescribeIndex
  retentionRules:
    # Logs expire after 30 days; audit indexes are kept forever.
    - indexPatterns:
        - "logs-*"
      minIndexRetention: 30d
    - indexPatterns:
        - "audit-*"
      unlimited: true
