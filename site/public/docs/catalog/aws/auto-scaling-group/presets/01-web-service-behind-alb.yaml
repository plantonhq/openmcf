apiVersion: aws.planton.dev/v1
kind: AwsAutoScalingGroup
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  launchTemplate:
    launchTemplateId:
      valueFrom:
        kind: AwsLaunchTemplate
        name: <launch-template-resource-name>
        fieldPath: status.outputs.launch_template_id
  minSize: 2
  maxSize: 10
  healthCheckType: ELB
  healthCheckGracePeriodSeconds: 120
  targetGroups:
    - valueFrom:
        kind: AwsLbTargetGroup
        name: <target-group-resource-name>
        fieldPath: status.outputs.target_group_arn
  terminationPolicies:
    - OldestLaunchTemplate
    - Default
  instanceRefresh:
    strategy: Rolling
    preferences:
      minHealthyPercentage: 100
      maxHealthyPercentage: 110
      autoRollback: true
  scalingPolicies:
    - name: cpu-target
      policyType: TargetTrackingScaling
      targetTracking:
        targetValue: 60
        predefinedMetricType: ASGAverageCPUUtilization
  enabledMetrics:
    - GroupMinSize
    - GroupMaxSize
    - GroupDesiredCapacity
    - GroupInServiceInstances
