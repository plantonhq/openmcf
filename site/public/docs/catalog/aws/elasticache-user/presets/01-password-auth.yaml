apiVersion: aws.planton.dev/v1
kind: AwsElasticacheUser
metadata:
  name: <user-id>
spec:
  region: <aws-region>
  engine: redis
  # userName is what clients present in AUTH; it need not equal metadata.name.
  userName: <auth-user-name>
  accessString: "on ~<key-prefix>:* +@read +@write"
  authenticationMode:
    type: password
    # One password for a simple setup; add a second for zero-downtime rotation.
    passwords:
      - <strong-password-16-to-128-chars>
