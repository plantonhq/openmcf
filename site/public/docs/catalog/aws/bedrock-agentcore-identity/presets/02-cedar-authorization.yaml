apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreIdentity
metadata:
  name: my-agent-authz
spec:
  region: us-west-2
  policyEngine:
    engineName: agent_authz
    description: Tool-call authorization for the agent fleet
    policies:
      - name: allow_read_tools
        description: Every principal may call the read-only tools
        cedarStatement: 'permit(principal, action in [Action::"get_order", Action::"list_invoices"], resource);'
        validationMode: FAIL_ON_ANY_FINDINGS
      - name: forbid_writes_offhours
        description: Deny mutating tools outside business hours
        cedarStatement: 'forbid(principal, action == Action::"update_order", resource) when { context.hour < 9 || context.hour > 17 };'
        validationMode: FAIL_ON_ANY_FINDINGS
