apiVersion: aws.planton.dev/v1
kind: AwsHttpApiVpcLink
metadata:
  name: <vpc-link-name>
  org: <organization>
  env: <environment>
  id: <resource-id>
spec:
  region: <aws-region>
  # A single subnet is the minimum AWS accepts; reachability is limited to
  # this AZ. Fine for development; production links should span two AZs
  # (see the private-alb-link preset).
  subnetIds:
    - value: <subnet-id>
