apiVersion: aws.planton.dev/v1
kind: AwsHttpApiVpcLink
metadata:
  name: <vpc-link-name>
  org: <organization>
  env: <environment>
  id: <resource-id>
spec:
  region: <aws-region>
  # Two AZs so the link can reach targets wherever the internal load
  # balancer places them.
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b>
        fieldPath: status.outputs.subnet_id
  # An egress-scoped group gives the target's security group a stable
  # source to admit.
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: <vpc-link-security-group>
        fieldPath: status.outputs.security_group_id
