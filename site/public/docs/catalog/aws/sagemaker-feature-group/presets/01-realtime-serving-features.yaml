apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerFeatureGroup
metadata:
  name: realtime-serving-features
spec:
  region: us-west-2
  recordIdentifierFeatureName: customer_id
  eventTimeFeatureName: event_time
  description: Low-latency customer features for real-time model serving
  roleArn:
    value: arn:aws:iam::123456789012:role/sagemaker-execution
  featureDefinitions:
    - name: customer_id
      type: String
    - name: event_time
      type: Fractional
    - name: sessions_last_7d
      type: Integral
    - name: avg_order_value
      type: Fractional
    - name: days_since_last_order
      type: Integral
  onlineStore:
    enabled: true
    ttl:
      unit: Days
      value: 30
