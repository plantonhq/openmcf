apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerPipeline
metadata:
  name: s3-definition-pipeline
spec:
  region: us-west-2
  displayName: nightly-training
  description: Training pipeline reading its definition from S3
  roleArn:
    value: arn:aws:iam::123456789012:role/sagemaker-pipeline-execution
  definitionS3Location:
    bucket:
      value: my-pipeline-definitions
    objectKey: pipelines/nightly-training.json
  parallelismMaxSteps: 4
