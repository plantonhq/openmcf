apiVersion: aws.planton.dev/v1
kind: AwsEksNodeGroup
metadata:
  name: <node-group-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  nodeRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <node-role-resource-name>
      fieldPath: status.outputs.role_arn
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  # Several similar types is the Spot best practice: more capacity pools
  # means fewer simultaneous interruptions.
  instanceTypes:
    - m6i.large
    - m5.large
    - m6a.large
  amiType: AL2023_x86_64_STANDARD
  capacityType: spot
  scaling:
    minSize: 0
    maxSize: 10
    desiredSize: 3
  diskSizeGb: 100
  labels:
    node-lifecycle: spot
  # Keep interruption-sensitive pods off Spot capacity unless they opt in.
  taints:
    - key: node-lifecycle
      value: spot
      effect: NO_SCHEDULE
