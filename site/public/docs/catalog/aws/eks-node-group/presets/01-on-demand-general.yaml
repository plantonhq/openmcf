apiVersion: aws.planton.dev/v1
kind: AwsEksNodeGroup
metadata:
  name: <node-group-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  nodeRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <node-role-resource-name>
      fieldPath: status.outputs.role_arn
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  instanceTypes:
    - m6i.large
  amiType: AL2023_x86_64_STANDARD
  scaling:
    minSize: 2
    maxSize: 5
    desiredSize: 2
  diskSizeGb: 100
  # Surge rollouts: replacements launch before old nodes drain, so the
  # pool never dips below capacity during a version update.
  updateConfig:
    maxUnavailablePercentage: 25
    updateStrategy: MINIMAL
  # EKS replaces or reboots nodes the cluster reports unhealthy.
  nodeRepairConfig:
    enabled: true
