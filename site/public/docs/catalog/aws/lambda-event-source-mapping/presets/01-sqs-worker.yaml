apiVersion: aws.planton.dev/v1
kind: AwsLambdaEventSourceMapping
metadata:
  name: order-worker
spec:
  region: us-west-2
  function_arn:
    valueFrom:
      kind: AwsLambda
      name: order-processor
      fieldPath: status.outputs.function_arn
  event_source_arn:
    valueFrom:
      kind: AwsSqsQueue
      name: order-events
      fieldPath: status.outputs.queue_arn
  function_response_types:
    - ReportBatchItemFailures
