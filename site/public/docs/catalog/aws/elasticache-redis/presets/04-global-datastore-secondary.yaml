apiVersion: aws.planton.dev/v1alpha1
kind: AwsRedisElasticache
metadata:
  name: my-redis-dr-secondary
spec:
  region: us-west-2
  description: Disaster-recovery secondary joined to a global datastore
  # Joining an existing global datastore: the SECONDARY inherits engine,
  # engine version, node type, shard layout, encryption, and parameter
  # group from the global primary — leave all of those unset (validation
  # enforces it, and the provider rejects their presence).
  globalReplicationGroupId: ldgnf-payments-global
  numCacheClusters: 2
  automaticFailoverEnabled: true
  multiAzEnabled: true
  subnetIds:
    - value: <private-subnet-id-az1>
    - value: <private-subnet-id-az2>
  securityGroupIds:
    - value: <security-group-id>
