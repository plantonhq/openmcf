apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerEndpoint
metadata:
  name: my-serverless-endpoint
spec:
  region: us-west-2
  productionVariants:
    - variantName: AllTraffic
      model:
        value: my-sklearn-model
      serverless:
        maxConcurrency: 10
        memorySizeMb: 2048
