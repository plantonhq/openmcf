apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockGuardrail
metadata:
  name: pii-redaction
spec:
  region: us-west-2
  description: Mask personal and payment data in model traffic
  blockedInputMessaging: Your request contains sensitive data we can't process.
  blockedOutputsMessaging: The response contained sensitive data and was withheld.
  sensitiveInformationPolicy:
    piiEntities:
      - type: NAME
        action: ANONYMIZE
      - type: EMAIL
        action: ANONYMIZE
      - type: PHONE
        action: ANONYMIZE
      - type: ADDRESS
        action: ANONYMIZE
      - type: CREDIT_DEBIT_CARD_NUMBER
        action: BLOCK
      - type: US_SOCIAL_SECURITY_NUMBER
        action: BLOCK
      - type: US_BANK_ACCOUNT_NUMBER
        action: BLOCK
      - type: PASSWORD
        action: BLOCK
      - type: AWS_ACCESS_KEY
        action: BLOCK
      - type: AWS_SECRET_KEY
        action: BLOCK
    regexes:
      - name: internal-ticket-id
        pattern: "TICKET-[0-9]{8}"
        description: Internal support ticket identifiers
        action: ANONYMIZE
