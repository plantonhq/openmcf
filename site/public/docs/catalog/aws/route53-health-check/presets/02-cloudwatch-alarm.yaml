apiVersion: aws.planton.dev/v1
kind: AwsRoute53HealthCheck
metadata:
  name: my-alarm-health-check
spec:
  region: <aws-region>
  checkType: CLOUDWATCH_METRIC
  cloudwatchAlarmName: <alarm-name>  # the alarm whose state this check mirrors
  cloudwatchAlarmRegion: <alarm-region>  # alarms are regional; checks are global
  insufficientDataHealthStatus: LastKnownStatus  # sane default while the alarm lacks data
