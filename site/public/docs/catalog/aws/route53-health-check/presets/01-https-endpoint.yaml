apiVersion: aws.planton.dev/v1
kind: AwsRoute53HealthCheck
metadata:
  name: my-https-health-check
spec:
  region: <aws-region>
  checkType: HTTPS
  fqdn: <endpoint-domain>  # must be reachable from the public internet
  resourcePath: /healthz  # your application's health endpoint
  requestInterval: 30  # default from spec; use 10 for ~3x faster detection at higher cost
  failureThreshold: 3  # default from spec; consecutive results to flip the state
