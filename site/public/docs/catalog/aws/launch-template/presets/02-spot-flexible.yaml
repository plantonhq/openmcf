apiVersion: aws.planton.dev/v1
kind: AwsLaunchTemplate
metadata:
  name: <fleet-name>
spec:
  region: <aws-region>
  imageId: ami-<your-ami-id>
  instanceRequirements:
    memoryMib:
      min: 4096
      max: 16384
    vcpuCount:
      min: 2
      max: 8
    cpuManufacturers:
      - intel
      - amd
    instanceGenerations:
      - current
    bareMetal: excluded
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: <security-group-resource-name>
        fieldPath: status.outputs.security_group_id
  metadataOptions:
    httpTokens: required
