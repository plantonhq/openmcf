apiVersion: aws.planton.dev/v1
kind: AwsCloudwatchLogGroup
metadata:
  name: my-secure-logs
spec:
  region: <aws-region>
  retentionInDays: 90
  kmsKeyId:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key-name>  # key policy must allow logs.<region>.amazonaws.com
      fieldPath: status.outputs.key_arn
