apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchLogGroup
metadata:
  name: my-service-logs
spec:
  region: <aws-region>
  retentionInDays: 90
  transformer:
    processors:
      - parseJson: {}  # the first processor must be a parser; parses the raw @message JSON into fields
      - renameKeys:
          entries:
            - key: msg
              renameTo: message  # normalize the message key across services
      - addKeys:
          entries:
            - key: service
              value: <service-name>  # stamp every event with its owning service
      - typeConverter:
          entries:
            - key: statusCode
              type: integer  # numeric comparisons in Logs Insights without string casts
            - key: durationMs
              type: double
  metricFilters:
    - name: server-error-count
      pattern: '{ $.statusCode >= 500 }'
      applyOnTransformedLogs: true  # match against the transformer's output, not the raw line
      transformation:
        metricName: ServerErrorCount
        metricNamespace: <app-namespace>
        metricValue: "1"
        defaultValue: 0
