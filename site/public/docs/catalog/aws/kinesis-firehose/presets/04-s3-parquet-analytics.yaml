apiVersion: aws.planton.dev/v1alpha1
kind: AwsKinesisFirehose
metadata:
  name: analytics-parquet-firehose
  org: my-org
  env: prod
  id: analytics-parquet-firehose-prod
spec:
  region: us-east-1
  # Kinesis stream source — Firehose consumes from an existing stream
  kinesisStreamSource:
    streamArn:
      valueFrom:
        kind: AwsKinesisStream
        name: my-events-stream
        fieldPath: status.outputs.stream_arn
    roleArn:
      valueFrom:
        kind: AwsIamRole
        name: firehose-kinesis-consumer-role
        fieldPath: status.outputs.role_arn
  extendedS3:
    bucketArn:
      value: arn:aws:s3:::my-analytics-data-lake
    roleArn:
      value: arn:aws:iam::123456789012:role/firehose-glue-s3-role
    # Partition by a record field (extracted below) plus the event date —
    # the layout Athena/Spark prune on.
    prefix: analytics/event_type=!{partitionKeyFromQuery:event_type}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/
    compressionFormat: UNCOMPRESSED
    fileExtension: .parquet
    buffering:
      intervalInSeconds: 60
      sizeInMbs: 64
    # Extract the partition key from each JSON record with a JQ expression;
    # the prefix references it as !{partitionKeyFromQuery:event_type}.
    processing:
      enabled: true
      processors:
        - metadataExtraction:
            query: '{event_type: .event_type}'
            jsonParsingEngine: JQ-1.6
    dynamicPartitioning:
      enabled: true
      retryDurationInSeconds: 300
    dataFormatConversion:
      enabled: true
      # The OpenX JSON deserializer reads the incoming records. Keys that
      # collide with Hive reserved words map to safe column names; dotted
      # keys convert to underscores so they land in Glue columns.
      openXJson:
        columnToJsonKeyMappings:
          ts: timestamp
        convertDotsInJsonKeysToUnderscores: true
      # Parquet tuned for Athena/Spark scans: harder compression for cheap
      # storage, 128 MiB row groups aligned to the buffering ceiling, and
      # dictionary encoding for the low-cardinality event_type column.
      parquet:
        compression: GZIP
        blockSizeBytes: 134217728
        pageSizeBytes: 2097152
        enableDictionaryCompression: true
        writerVersion: V2
      schema:
        databaseName: analytics_db
        tableName: events
        roleArn:
          value: arn:aws:iam::123456789012:role/firehose-glue-access-role
