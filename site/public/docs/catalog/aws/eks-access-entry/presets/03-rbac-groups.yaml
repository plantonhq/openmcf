apiVersion: aws.planton.dev/v1
kind: AwsEksAccessEntry
metadata:
  name: <entry-resource-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  principalArn:
    valueFrom:
      kind: AwsIamRole
      name: <principal-role-resource-name>
      fieldPath: status.outputs.role_arn
  # Map the principal onto group names your own (Cluster)RoleBindings
  # reference -- the entry does authentication; your RBAC does
  # authorization. Reserved system: groups are rejected.
  kubernetesGroups:
    - <rbac-group-name>
  # A predictable username for RBAC bindings and audit logs. Keep the
  # {{SessionName}} template so logs still show who assumed the role.
  userName: "<prefix>:{{SessionName}}"
