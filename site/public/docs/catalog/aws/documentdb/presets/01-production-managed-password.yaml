apiVersion: aws.planton.dev/v1
kind: AwsDocumentDb
metadata:
  name: my-docdb
spec:
  region: us-west-2
  subnetIds:
    - value: subnet-replace-with-private-az1
    - value: subnet-replace-with-private-az2
  securityGroupIds:
    - value: sg-replace-with-database-sg
  # Empty engineVersion would keep the AWS default; pinning is the
  # production posture so upgrades are deliberate.
  engineVersion: "5.0.0"
  masterUsername: docadmin # AWS has no default master username -- pick one
  manageMasterUserPassword: true # recommended_default -- AWS generates, stores, and rotates the password in Secrets Manager
  storageEncrypted: true # recommended_default -- create-time-only, cannot be enabled later
  deletionProtection: true
  backupRetentionPeriod: 7
  skipFinalSnapshot: false
  finalSnapshotIdentifier: my-docdb-final
  # Audit logging needs both halves: the log export here and the
  # audit_logs cluster parameter below.
  enabledCloudwatchLogsExports:
    - audit
  parameters:
    - name: audit_logs
      value: enabled
  # The compute serving queries: one writer plus one reader for
  # high availability. The lowest promotion tier that is available
  # becomes the writer; the reader takes over on failover.
  instances:
    - name: writer
      instanceClass: db.r6g.large
      promotionTier: 0
    - name: reader-1
      instanceClass: db.r6g.large
      promotionTier: 1
