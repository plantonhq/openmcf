apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  name: my-data-lake
spec:
  region: <aws-region>
  versioningStatus: Enabled
  encryption:
    sseAlgorithm: AES256
    blockedEncryptionTypes:
      - SSE-C
  lifecycleRules:
    - id: tier-raw-at-ingest
      filter:
        prefix: raw/
      transitions:
        - days: 0
          storageClass: INTELLIGENT_TIERING
    - id: prune-noncurrent
      noncurrentVersionExpiration:
        noncurrentDays: 30
      abortIncompleteMultipartUploadDays: 7
  analyticsConfigurations:
    - name: curated-access-analysis
      filterPrefix: curated/
      export:
        bucketArn:
          value: arn:aws:s3:::my-data-lake
        prefix: governance/analytics/
  inventoryConfigurations:
    - name: weekly-object-audit
      includedObjectVersions: All
      frequency: Weekly
      optionalFields:
        - Size
        - StorageClass
        - EncryptionStatus
        - ReplicationStatus
      destination:
        bucketArn:
          value: arn:aws:s3:::my-data-lake
        format: Parquet
        prefix: governance/inventory/
  metricsConfigurations:
    - name: curated-requests
      filterPrefix: curated/
  metadataConfiguration:
    inventoryTableEnabled: true
    journalRecordExpiration:
      enabled: true
      days: 90
