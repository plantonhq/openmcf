apiVersion: aws.planton.dev/v1alpha1
kind: AwsLambda
metadata:
  name: order-fulfillment-workflow
spec:
  region: <aws-region>
  description: Durable order-fulfillment workflow with checkpointed progress
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: order-workflow-exec
      fieldPath: status.outputs.role_arn
  s3:
    bucket:
      valueFrom:
        kind: AwsS3Bucket
        name: build-artifacts
        fieldPath: status.outputs.bucket_id
    key: workflows/order-fulfillment.zip
  runtime: nodejs22.x
  handler: workflow.handler
  memorySizeMb: 512
  timeoutSeconds: 900
  durableConfig:
    executionTimeoutSeconds: 604800
    retentionPeriodDays: 30
  publish: true
  publishTo: LATEST_PUBLISHED
  asyncInvokeConfig:
    maximumRetryAttempts: 2
    onFailureDestinationArn:
      value: <failure-queue-arn>
