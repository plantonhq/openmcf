apiVersion: aws.planton.dev/v1
kind: AwsBatchComputeEnvironment
metadata:
  org: example-org
  env: prod
  name: spot-batch
  id: spot-batch-id
spec:
  region: <aws-region>
  computeResources:
    type: SPOT
    maxVcpus: 1024
    minVcpus: 0
    instanceTypes:
      - m5.xlarge
      - m5.2xlarge
      - c5.xlarge
      - c5.2xlarge
      - r5.xlarge
    allocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
    subnetIds:
      - value: <private-subnet-id-az1>
      - value: <private-subnet-id-az2>
      - value: <private-subnet-id-az3>
    securityGroupIds:
      - value: <security-group-id>
    instanceRole:
      value: <ecs-instance-profile-arn>
