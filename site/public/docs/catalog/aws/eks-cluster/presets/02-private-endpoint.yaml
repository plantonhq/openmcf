apiVersion: aws.planton.dev/v1
kind: AwsEksCluster
metadata:
  name: <cluster-name>
spec:
  region: <aws-region>
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  clusterRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <cluster-role-resource-name>
      fieldPath: status.outputs.role_arn
  # The pair that makes the cluster private: turn the public endpoint OFF
  # and the in-VPC private endpoint ON. Never disable public without
  # enabling private -- the API server would be unreachable.
  endpointPublicAccess: false
  endpointPrivateAccess: true
  accessConfig:
    authenticationMode: API
  enabledClusterLogTypes:
    - audit
    - authenticator
  # Customer-managed envelope encryption of Kubernetes secrets. Decide at
  # creation: enabling later works, but it can never be disabled.
  kmsKeyArn:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key-resource-name>
      fieldPath: status.outputs.key_arn
  deletionProtection: true
