apiVersion: aws.planton.dev/v1
kind: AwsEksCluster
metadata:
  name: <cluster-name>
spec:
  region: <aws-region>
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  clusterRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <cluster-role-resource-name>
      fieldPath: status.outputs.role_arn
  # EKS Auto Mode: AWS provisions and scales compute, provisions EBS
  # volumes, and manages load balancers for the cluster's workloads -- no
  # AwsEksNodeGroup resources to operate. One toggle covers AWS's three
  # underlying capabilities (compute, block storage, load balancing),
  # which its API requires to move together.
  autoMode:
    enabled: true
    # general-purpose runs workloads; system isolates cluster-critical
    # pods on dedicated capacity.
    nodePools:
      - general-purpose
      - system
    # The identity Auto Mode nodes assume. Required when nodePools is
    # non-empty; trust ec2.amazonaws.com and attach the worker policies
    # on the role itself.
    nodeRoleArn:
      valueFrom:
        kind: AwsIamRole
        name: <node-role-resource-name>
        fieldPath: status.outputs.role_arn
  accessConfig:
    authenticationMode: API
  # Auto Mode clusters skip the self-managed add-on bootstrap: AWS runs
  # the networking/storage/LB capabilities itself.
  bootstrapSelfManagedAddons: false
  enabledClusterLogTypes:
    - audit
    - authenticator
