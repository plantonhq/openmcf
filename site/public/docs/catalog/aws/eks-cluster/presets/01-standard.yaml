apiVersion: aws.planton.dev/v1
kind: AwsEksCluster
metadata:
  name: <cluster-name>
spec:
  region: <aws-region>
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  clusterRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <cluster-role-resource-name>
      fieldPath: status.outputs.role_arn
  # Access entries are the modern access model; keep API_AND_CONFIG_MAP only
  # while migrating a legacy aws-auth setup.
  accessConfig:
    authenticationMode: API
  # audit + authenticator answer "who did what" and "who got in" -- the two
  # highest-value control-plane logs; add api/controllerManager/scheduler
  # when debugging cluster internals.
  enabledClusterLogTypes:
    - audit
    - authenticator
  # Upgrade on the standard schedule instead of paying the extended-support
  # surcharge; drop this line to keep AWS's EXTENDED default.
  upgradeSupportType: STANDARD
