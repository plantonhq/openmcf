apiVersion: aws.planton.dev/v1
kind: AwsCloudwatchCompositeAlarm
metadata:
  name: prod-shared-cause
spec:
  region: <aws-region>
  # Page once when BOTH symptoms fire — a shared-cause outage — instead of
  # once per symptom. Alarms are addressed by their CloudWatch names (the
  # alarm_name output of each AwsCloudwatchAlarm).
  alarmRule: 'ALARM("<cpu-alarm-name>") AND ALARM("<error-rate-alarm-name>")'
  alarmDescription: "Shared-cause outage: CPU and error rate are both breaching. Page on-call once."
  alarmActions:
    - value: arn:aws:sns:us-east-1:123456789012:ops-critical
  okActions:
    - value: arn:aws:sns:us-east-1:123456789012:ops-resolved
