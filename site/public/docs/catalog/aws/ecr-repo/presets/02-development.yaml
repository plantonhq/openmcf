apiVersion: aws.planton.dev/v1
kind: AwsEcrRepo
metadata:
  name: my-development-ecr-repo
spec:
  region: <aws-region>
  repositoryName: <repository-name>
  imageTagMutability: MUTABLE  # allow tag overwriting for fast iteration
  encryptionType: AES256  # default from spec
  forceDelete: true  # easy cleanup for disposable dev repositories
  scanOnPush: true  # default from spec; keep scanning even in dev
  lifecycleRules:
    - rulePriority: 1
      description: Expire untagged images after 3 days
      tagStatus: untagged
      countType: sinceImagePushed
      countNumber: 3
    - rulePriority: 2
      description: Keep only the most recent 20 images
      tagStatus: any
      countType: imageCountMoreThan
      countNumber: 20
