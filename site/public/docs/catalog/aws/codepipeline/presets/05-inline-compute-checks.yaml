apiVersion: aws.planton.dev/v1alpha1
kind: AwsCodePipeline
metadata:
  name: my-inline-checks-pipeline
spec:
  region: us-east-1
  pipelineType: V2
  executionMode: QUEUED
  roleArn:
    value: "<codepipeline-service-role-arn>"
  artifactStores:
    - location:
        value: "<pipeline-artifacts-bucket-name>"
  stages:
    - name: Source
      actions:
        - name: GitHubSource
          category: Source
          owner: AWS
          provider: CodeStarSourceConnection
          version: "1"
          configuration:
            ConnectionArn: "<codeconnections-connection-arn>"
            FullRepositoryId: "<github-org>/<github-repo>"
            BranchName: main
          outputArtifacts:
            - SourceOutput
    # Inline checks WITHOUT a CodeBuild project: a Compute action runs shell
    # commands directly in CodePipeline-managed compute (CodeBuild logs and
    # permissions under the hood; compute time bills per execution).
    - name: Checks
      actions:
        - name: LintAndUnitTests
          category: Compute
          owner: AWS
          provider: Commands
          version: "1"
          namespace: CheckVars
          inputArtifacts:
            - SourceOutput
          commands:
            - npm ci
            - npm run lint -- --output-file reports/lint.xml
            - npm test -- --coverage --coverageDirectory=reports/coverage
            - export COVERAGE_PCT=$(node scripts/coverage-pct.js)
          # Exported variables flow to downstream actions as
          # #{CheckVars.COVERAGE_PCT}.
          outputVariables:
            - COVERAGE_PCT
          # Compute actions export FILE-based artifacts (instead of the
          # plain outputArtifacts every other category uses).
          outputArtifactsForComputeAction:
            - name: CheckReports
              files:
                - reports/lint.xml
                - reports/coverage/coverage-summary.json
    - name: Deploy
      actions:
        - name: ECSDeploy
          category: Deploy
          owner: AWS
          provider: ECS
          version: "1"
          configuration:
            ClusterName: "<ecs-cluster-name>"
            ServiceName: "<ecs-service-name>"
            FileName: imagedefinitions.json
          inputArtifacts:
            - SourceOutput
      onFailure:
        result: ROLLBACK
