apiVersion: aws.planton.dev/v1
kind: AwsEcsCluster
metadata:
  name: my-cost-optimized-cluster
spec:
  region: <aws-region>
  containerInsights: enabled
  capacityProviders:
    - FARGATE
    - FARGATE_SPOT
  defaultCapacityProviderStrategy:
    - capacityProvider: FARGATE
      base: 1  # guarantee at least 1 On-Demand task for stability
      weight: 1
    - capacityProvider: FARGATE_SPOT
      weight: 4  # ~80% of scaled tasks ride Spot for the discount
