apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsService
metadata:
  name: my-stateful-service
spec:
  region: <aws-region>
  clusterArn:
    valueFrom:
      kind: AwsEcsCluster
      name: <cluster-name>
      fieldPath: status.outputs.cluster_arn
  taskDefinition:
    valueFrom:
      kind: AwsEcsTaskDefinition
      name: <task-definition-name>  # must declare a configureAtLaunch volume named "data"
      fieldPath: status.outputs.task_definition_arn
  desiredCount: 2
  network:
    subnets:
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-1>
          fieldPath: status.outputs.subnet_id
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-2>
          fieldPath: status.outputs.subnet_id
  # The service supplies each task's EBS volume at deployment time,
  # against the task definition's configureAtLaunch volume of the same
  # name -- the other half of the launch-time volume contract.
  volumeConfiguration:
    name: data
    managedEbsVolume:
      roleArn:
        value: "<ebs-infrastructure-role-arn>"  # must trust ecs.amazonaws.com and carry AmazonECSInfrastructureRolePolicyForVolumes
      sizeInGb: 50
      volumeType: gp3
      tagSpecifications:
        - resourceType: volume
          propagateTags: SERVICE  # per-task volumes inherit the service's cost-allocation tags
  deploymentCircuitBreaker:
    enable: true
    rollback: true
