apiVersion: azure.planton.dev/v1alpha1
kind: AzureRecoveryServicesVault
metadata:
  name: backup-vault
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  # 2-50 chars, letters/digits/hyphens, starts with a letter -- what
  # backup policies and protected items address their vault by.
  name: backup-vault
  # GeoRedundant keeps a copy in the paired region -- the production
  # posture. Decide BEFORE the first protection: redundancy locks once
  # items are protected.
  storageModeType: GeoRedundant
  # Paired-region restore capability; enabling is in-place, disabling
  # replaces the vault.
  crossRegionRestoreEnabled: true
