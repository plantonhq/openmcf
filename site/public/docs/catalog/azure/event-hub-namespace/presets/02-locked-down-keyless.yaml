apiVersion: azure.planton.dev/v1
kind: AzureEventHubNamespace
metadata:
  name: my-secure-hubs
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-streaming-rg
      fieldPath: status.outputs.resource_group_name
  namespaceName: myorg-secure-hubs
  sku: STANDARD
  # Keyless posture: SAS keys (including the root rule surfaced in this
  # kind's outputs) stop working; clients authenticate with Entra
  # identities granted data-plane roles via AzureRoleAssignment.
  localAuthenticationEnabled: false
  # The firewall: reject everything except the admitted office range and
  # the delegated app subnet. Trusted Microsoft services (Azure Monitor
  # diagnostics, Event Grid) still deliver.
  networkRuleSets:
    defaultAction: DENY
    trustedServiceAccessEnabled: true
    ipRules:
      - 203.0.113.0/24
    virtualNetworkRules:
      - subnetId:
          valueFrom:
            kind: AzureSubnet
            name: my-app-subnet
            fieldPath: status.outputs.subnet_id
  tags:
    security-tier: restricted
