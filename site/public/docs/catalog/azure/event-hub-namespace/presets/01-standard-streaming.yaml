apiVersion: azure.planton.dev/v1
kind: AzureEventHubNamespace
metadata:
  name: my-telemetry-hubs
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-streaming-rg
      fieldPath: status.outputs.resource_group_name
  # Globally unique -- becomes {name}.servicebus.windows.net (and the
  # Kafka bootstrap host on port 9093).
  namespaceName: myorg-telemetry-hubs
  # STANDARD is also the spec default -- stated explicitly because the
  # tier is the one decision every namespace owner must make.
  sku: STANDARD
  # Elastic throughput: start at 2 TUs and let Azure grow to 10 under
  # load instead of throttling producers (auto-inflate never scales
  # back down -- trim capacity manually after a spike).
  capacity: 2
  autoInflateEnabled: true
  maximumThroughputUnits: 10
  tags:
    purpose: telemetry-ingestion
