apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorFirewallPolicy
metadata:
  name: my-edge-rate-limit
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  policyName: edgeratelimit
  # STANDARD covers custom rules (matching + rate limiting) -- the
  # right tier when you don't need Microsoft's managed rule sets.
  sku: STANDARD
  mode: PREVENTION
  customRules:
    # Per-client API rate limit: more than 300 requests to /api/ within
    # 5 minutes gets blocked at the edge, long before the origin feels
    # the load.
    - name: ratelimitapi
      priority: 10
      ruleType: RATE_LIMIT_RULE
      rateLimitDurationInMinutes: 5
      rateLimitThreshold: 300
      action: BLOCK
      matchConditions:
        - matchVariable: REQUEST_URI
          operator: BEGINS_WITH
          matchValues: ["/api/"]
    # Block requests from networks you never expect traffic from --
    # replace the CIDR with your own denylist.
    - name: blockbadnetworks
      priority: 20
      ruleType: MATCH_RULE
      action: BLOCK
      matchConditions:
        - matchVariable: SOCKET_ADDR
          operator: IP_MATCH
          matchValues: ["203.0.113.0/24"]
