apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorFirewallPolicy
metadata:
  name: my-edge-waf-detection
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  policyName: edgewafdetection
  sku: PREMIUM
  # DETECTION logs what WOULD have been blocked without acting -- run
  # this against real traffic first, review the WAF logs, add
  # exclusions for false positives, then flip mode to PREVENTION (an
  # in-place update).
  mode: DETECTION
  managedRules:
    - type: Microsoft_DefaultRuleSet
      version: "2.1"
      action: RULE_SET_BLOCK
