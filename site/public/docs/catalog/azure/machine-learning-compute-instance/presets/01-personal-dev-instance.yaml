apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningComputeInstance
metadata:
  name: alice-dev
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  # Reserved REGION-WIDE per subscription -- name it after its owner.
  name: alice-dev
  # A workstation size: notebooks and debugging here, heavy training
  # on a compute cluster.
  virtualMachineSize: STANDARD_DS3_V2
  # Lock the instance to one user -- the platform-team pattern.
  # Example UUIDs (tenant_id is format-validated): replace BOTH with
  # the owner's real tenant and object IDs.
  authorizationType: personal
  assignToUser:
    tenantId: 00000000-0000-0000-0000-000000000000
    objectId: 11111111-1111-1111-1111-111111111111
  identity:
    type: SYSTEM_ASSIGNED
