apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningOnlineDeployment
metadata:
  name: model-scoring-green
spec:
  endpointId:
    value: "<your-online-endpoint-id>"
  name: green
  region: eastus
  instanceType: Standard_DS3_v2
  instanceCount: 2
  model: "<your-registered-model-version-id>"
  # Outbound pulls go through the workspace's managed network -- the
  # registry and storage need private endpoints first.
  egressPublicNetworkAccessEnabled: false
  appInsightsEnabled: true
  # A slow-loading model gets a patient startup probe; the startup
  # probe gates the other two.
  startupProbe:
    failureThreshold: 60
    period: PT10S
  # Raise the scoring timeout above the client's own timeout, and align
  # concurrency with what the container actually parallelizes.
  requestSettings:
    requestTimeout: PT30S
    maxConcurrentRequestsPerInstance: 2
  # Capture a sample of scoring inputs and outputs to workspace storage
  # for drift monitoring.
  dataCollector:
    collections:
      model_inputs:
        enabled: true
        samplingRate: 0.2
      model_outputs:
        enabled: true
        samplingRate: 0.2
    rollingRate: Hour
