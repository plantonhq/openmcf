apiVersion: azure.planton.dev/v1
kind: AzureCosmosdbMongoDatabase
metadata:
  name: my-shared-database
spec:
  cosmosdbAccountId:
    valueFrom:
      kind: AzureCosmosdbAccount
      # A MONGO_DB-kind account with the ENABLE_MONGO capability.
      name: <cosmosdb-account-resource-name>
      fieldPath: status.outputs.cosmosdb_account_id
  databaseName: <database-name>
  # One autoscale budget SHARED by every collection in the database
  # that does not bring its own throughput. Azure scales between 10%
  # and 100% of this ceiling (here: 400-4000 RU/s), so many small
  # collections split one bill instead of each paying a dedicated
  # minimum. Ceiling: minimum 1000, increments of 1000. Mutually
  # exclusive with the fixed `throughput` field.
  autoscaleMaxThroughput: 4000
