apiVersion: azure.planton.dev/v1
kind: AzureLinuxWebApp
metadata:
  name: my-enterprise-webapp
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  webAppName: my-enterprise-webapp
  servicePlanId:
    value: "<your-premium-plan-id>"
  applicationInsightsConnectionString:
    value: "<your-app-insights-connection-string>"
  httpsOnly: true
  publicNetworkAccessEnabled: true
  virtualNetworkSubnetId:
    value: "<your-vnet-subnet-id>"
  identity:
    type: SYSTEM_ASSIGNED
  # Basic-auth publishing disabled: deployments go through
  # identity-based paths only.
  webdeployPublishBasicAuthenticationEnabled: false
  ftpPublishBasicAuthenticationEnabled: false
  appSettings:
    ENVIRONMENT: production
    DB_CONNECTION: "@Microsoft.KeyVault(SecretUri=https://<your-keyvault>.vault.azure.net/secrets/db-connection)"
  logs:
    applicationLogs:
      fileSystemLevel: INFORMATION
    httpLogs:
      fileSystem:
        retentionInMb: 50
        retentionInDays: 7
    failedRequestTracing: true
    detailedErrorMessages: false
  siteConfig:
    applicationStack:
      pythonVersion: "3.12"
    alwaysOn: true
    healthCheckPath: /health
    healthCheckEvictionTimeInMin: 5
    workerCount: 3
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    http2Enabled: true
    vnetRouteAllEnabled: true
    # Auto-heal: recycle the app when a 5xx storm hits, guarded against
    # recycle loops by the minimum-uptime setting.
    autoHealSetting:
      trigger:
        statusCodes:
          - statusCodeRange: 500-599
            count: 50
            interval: "00:05:00"
      minimumProcessExecutionTime: "00:01:00"
    ipRestrictions:
      - name: allow-office
        priority: 100
        action: ALLOW
        ipAddress: 203.0.113.0/24
        description: Corporate office CIDR
      - name: allow-vpn
        priority: 200
        action: ALLOW
        ipAddress: 198.51.100.0/24
        description: VPN gateway CIDR
    ipRestrictionDefaultAction: DENY
    scmUseMainIpRestriction: true
    cors:
      allowedOrigins:
        - https://portal.example.com
      supportCredentials: true
