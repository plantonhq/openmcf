apiVersion: azure.planton.dev/v1
kind: AzurePostgresqlFlexibleServer
metadata:
  name: hardened-postgres
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  serverName: <globally-unique-server-name>
  skuName: GP_Standard_D4ds_v5
  storageMb: 131072
  # Entra-only authentication: password auth is OFF, so no admin
  # login/password exists anywhere -- connections use Entra tokens.
  authentication:
    activeDirectoryAuthEnabled: true
    passwordAuthEnabled: false
  aadAdministrators:
    - objectId:
        value: <entra-group-object-id>
      principalName: <entra-group-name>
      principalType: GROUP
  # Customer-managed-key encryption: data is encrypted with a Key Vault
  # key you own, unwrapped through the user-assigned identity.
  identity:
    type: USER_ASSIGNED
    identityIds:
      - valueFrom:
          kind: AzureUserAssignedIdentity
          name: <cmk-identity-resource-name>
          fieldPath: status.outputs.identity_id
  customerManagedKey:
    keyVaultKeyId:
      valueFrom:
        kind: AzureKeyVaultKey
        name: <cmk-key-resource-name>
        fieldPath: status.outputs.versionless_id
    primaryUserAssignedIdentityId:
      valueFrom:
        kind: AzureUserAssignedIdentity
        name: <cmk-identity-resource-name>
        fieldPath: status.outputs.identity_id
  backupRetentionDays: 35
  # Pin sensitive parameters explicitly (each is a user override on
  # Azure's per-SKU default).
  serverParameters:
    log_connections: "on"
    log_disconnections: "on"
  tags:
    cost-center: <cost-center>
    data-classification: confidential
