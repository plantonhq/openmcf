apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbMongoCollection
metadata:
  name: my-user-profiles
spec:
  mongoDatabaseId:
    valueFrom:
      kind: AzureCosmosdbMongoDatabase
      name: <database-resource-name>
      fieldPath: status.outputs.mongo_database_id
  collectionName: profiles
  # Sharded even while sharing throughput -- partitioning and billing
  # are independent decisions.
  shardKey: userId
  # No throughput fields: the collection draws from the database's
  # shared budget (the database preset provisions it).
  indexes:
    - keys:
        - _id
      unique: true
    - keys:
        - email
      unique: true
