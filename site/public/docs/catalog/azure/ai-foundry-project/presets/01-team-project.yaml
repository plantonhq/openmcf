apiVersion: azure.planton.dev/v1alpha1
kind: AzureAiFoundryProject
metadata:
  name: team-project
spec:
  region: eastus
  # 3-33 chars, alphanumerics/hyphens/underscores.
  name: fraud-detection
  # The hub this project lives in. The project deploys into the HUB's
  # resource group and inherits its security/network posture.
  aiServicesHubId:
    valueFrom:
      kind: AzureAiFoundry
      name: team-hub
      fieldPath: status.outputs.ai_foundry_id
  identity:
    type: SYSTEM_ASSIGNED
  friendlyName: Fraud Detection
  description: The fraud-detection team's AI Foundry project
