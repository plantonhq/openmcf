apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningWorkspace
metadata:
  name: private-hardened-workspace
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  name: acme-ml-private
  applicationInsightsId:
    value: "<your-application-insights-id>"
  keyVaultId:
    value: "<your-key-vault-id>"
  storageAccountId:
    value: "<your-storage-account-id>"
  identity:
    type: SYSTEM_ASSIGNED
  # Reachable only through private endpoints.
  publicNetworkAccessEnabled: false
  managedNetwork:
    # Only the outbound rules below (plus Azure's built-in required
    # rules) are reachable. Tightening into this mode works in place;
    # loosening back out is rejected once the network provisions.
    isolationMode: ALLOW_ONLY_APPROVED_OUTBOUND
    # Materialize the managed VNet at deploy time instead of on the
    # first compute -- fail early, not on the first job.
    provisionOnCreationEnabled: true
  # Rule names share ONE namespace across all three rule types.
  fqdnOutboundRules:
    - name: allow-pypi
      destinationFqdn: pypi.org
    - name: allow-pythonhosted
      destinationFqdn: "*.pythonhosted.org"
  serviceTagOutboundRules:
    - name: allow-keyvault
      serviceTag: AzureKeyVault
      protocol: TCP
      portRanges: "443"
