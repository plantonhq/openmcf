apiVersion: azure.planton.dev/v1
kind: AzureCosmosdbSqlRoleAssignment
metadata:
  name: my-workload-data-contributor
spec:
  cosmosdbAccountId:
    valueFrom:
      kind: AzureCosmosdbAccount
      name: <cosmosdb-account-resource-name>
      fieldPath: status.outputs.cosmosdb_account_id
  # The built-in Data Contributor by its well-known ID, composed on
  # the account's ARM ID -- full read/write across the grant's scope.
  # Built-ins exist in every account; no definition resource needed.
  roleDefinitionId:
    value: /subscriptions/<subscription-id>/resourceGroups/<resource-group-name>/providers/Microsoft.DocumentDB/databaseAccounts/<account-name>/sqlRoleDefinitions/00000000-0000-0000-0000-000000000002
  # The workload's managed identity -- its OBJECT ID output, never the
  # client ID.
  principalId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: <identity-resource-name>
      fieldPath: status.outputs.principal_id
  # Account-wide: the workload owns every database in this account.
  scope:
    valueFrom:
      kind: AzureCosmosdbAccount
      name: <cosmosdb-account-resource-name>
      fieldPath: status.outputs.cosmosdb_account_id
