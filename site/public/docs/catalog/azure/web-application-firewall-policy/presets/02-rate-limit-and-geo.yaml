apiVersion: azure.planton.dev/v1
kind: AzureWebApplicationFirewallPolicy
metadata:
  name: waf-edge-protection
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  policyName: <policy-name>
  customRules:
    # Custom rules run before the managed sets, by ascending priority.
    - name: allowHealthChecks
      priority: 5
      ruleType: MATCH_RULE
      action: ALLOW
      matchConditions:
        - matchVariables:
            - variableName: REQUEST_URI
          operator: BEGINS_WITH
          matchValues:
            - /healthz
    - name: blockUntrustedGeos
      priority: 10
      ruleType: MATCH_RULE
      action: BLOCK
      matchConditions:
        - matchVariables:
            - variableName: REMOTE_ADDR
          operator: GEO_MATCH
          negationCondition: true
          matchValues:
            # Two-letter ISO country codes the application serves;
            # everything else is blocked.
            - <allowed-country-code>
    - name: throttleApiPerClient
      priority: 20
      ruleType: RATE_LIMIT_RULE
      action: BLOCK
      rateLimitDuration: ONE_MIN
      rateLimitThreshold: 300
      groupRateLimitBy: CLIENT_ADDR
      matchConditions:
        - matchVariables:
            - variableName: REQUEST_URI
          operator: BEGINS_WITH
          matchValues:
            - /api/
    - name: challengeSuspectedBots
      priority: 30
      ruleType: MATCH_RULE
      action: JS_CHALLENGE
      matchConditions:
        - matchVariables:
            - variableName: REQUEST_HEADERS
              selector: User-Agent
          operator: CONTAINS
          matchValues:
            - curl
            - python-requests
          transforms:
            - LOWERCASE
  managedRules:
    managedRuleSets:
      - version: "3.2"
      # Bot classification on top of the OWASP baseline.
      - type: MICROSOFT_BOT_MANAGER_RULE_SET
        version: "1.1"
  tags:
    cost-center: <cost-center>
