apiVersion: azure.planton.dev/v1
kind: AzurePublicIp
metadata:
  name: my-dns-labeled-ip
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: app-endpoint-pip
  zones:
    - "1"
    - "2"
    - "3"
  domainNameLabel: myapp-prod  # replace with your DNS label
  domainNameLabelScope: TENANT_REUSE
