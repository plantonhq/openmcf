apiVersion: azure.planton.dev/v1
kind: AzureApplicationGateway
metadata:
  name: internal-gateway
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  # Replace with the gateway name (alphanumerics, underscores, periods,
  # hyphens; starts alphanumeric).
  name: internal-gateway
  subnetId:
    value: <gateway-subnet-arm-id>
  sku: STANDARD_V2
  capacity: 2
  frontendIpConfigurations:
    # A private-only gateway: the frontend takes a fixed address in the
    # gateway subnet; internal DNS records point at it (the
    # private_ip_address output).
    - name: internal
      subnetId:
        value: <gateway-subnet-arm-id>
      privateIpAddress: <static-private-ip>
      privateIpAddressAllocation: STATIC
  frontendPorts:
    - name: http
      port: 80
  backendAddressPools:
    - name: services
  backendHttpSettings:
    - name: service-settings
      port: 8080
      protocol: HTTP
      # Keep long-lived connections alive while instances rotate out.
      connectionDraining:
        enabled: true
        drainTimeoutSec: 60
  httpListeners:
    - name: internal-listener
      frontendIpConfigurationName: internal
      frontendPortName: http
      protocol: HTTP
  requestRoutingRules:
    - name: internal-rule
      ruleType: BASIC_ROUTING
      httpListenerName: internal-listener
      priority: 100
      backendAddressPoolName: services
      backendHttpSettingsName: service-settings
  tags:
    cost-center: <cost-center>
