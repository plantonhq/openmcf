apiVersion: azure.planton.dev/v1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: my-raw-zone
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  filesystemName: raw-zone
  # The medallion posture: the owning user manages, the owning group
  # reads and traverses, everyone else is shut out -- and new children
  # inherit the same read posture through the DEFAULT entries.
  aces:
    - type: USER
      permissions: rwx
    - type: GROUP
      permissions: r-x
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: GROUP
      permissions: r-x
    - scope: DEFAULT
      type: OTHER
      permissions: "---"
