apiVersion: azure.planton.dev/v1
kind: AzureStorageEncryptionScope
metadata:
  name: my-tenant-scope
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # 4-63 letters and digits, NO hyphens; what containers and blobs
  # reference within the account.
  scopeName: <scopeName>
  # A platform-managed key Azure creates and rotates -- key isolation
  # without any Key Vault involvement.
  source: MICROSOFT_STORAGE
