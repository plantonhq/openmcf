apiVersion: azure.planton.dev/v1
kind: AzureStorageEncryptionScope
metadata:
  name: my-double-encrypted-scope
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  scopeName: <scopeName>
  source: MICROSOFT_STORAGE
  # A second, independent platform-managed encryption layer underneath
  # the scope's key -- defense against a single-algorithm or single-key
  # compromise, for JUST this scope's data. Fixed at creation.
  infrastructureEncryptionRequired: true
