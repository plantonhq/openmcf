apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningOnlineEndpoint
metadata:
  name: model-scoring
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  # Part of the scoring DNS and reserved region-wide per subscription --
  # pick an application-scoped name.
  name: model-scoring
  region: eastus
  # Static keys that never expire -- the pragmatic start; rotate them
  # deliberately like any long-lived credential.
  authMode: Key
  # The identity deployments use to pull images and models -- grant it
  # AcrPull on the registry and Storage Blob Data Reader on the model
  # store before the first deployment.
  identity:
    type: SYSTEM_ASSIGNED
  # All traffic to the first deployment; rollouts move this map in
  # steps (90/10 -> 50/50 -> 0/100).
  traffic:
    blue: 100
