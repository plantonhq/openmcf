apiVersion: azure.planton.dev/v1
kind: AzureStorageShare
metadata:
  name: my-team-files
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # 3-63 lowercase letters, digits, and hyphens; unique within the
  # account; becomes the mount path segment.
  shareName: <share-name>
  # The provisioned maximum size -- what SMB clients see as the drive
  # size. Grows in place; shrinking below used capacity fails.
  quotaGb: 500
  # SMB is the spec default -- stated explicitly because the protocol is
  # fixed at creation and gates who can mount the share.
  enabledProtocol: SMB
  metadata:
    purpose: <data-domain>
