apiVersion: azure.planton.dev/v1alpha1
kind: AzureVpnSite
metadata:
  name: my-branch
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-branch
  virtualWanId:
    value: "<your-virtual-wan-arm-id>"
  addressCidrs:
    - "192.168.10.0/24"
  links:
    - name: primary-isp
      ipAddress: "203.0.113.10"
      speedInMbps: 200
