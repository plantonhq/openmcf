apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRouteCircuit
metadata:
  name: my-direct-circuit
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-direct-circuit
  skuTier: STANDARD
  skuFamily: METERED_DATA
  expressRoutePortId: "<your-express-route-port-arm-id>"
  bandwidthInGbps: 5
  rateLimitingEnabled: true # cap the circuit at its configured bandwidth on the shared port
  authorizations:
    - name: spoke-subscription # issues a key a gateway in another subscription redeems
