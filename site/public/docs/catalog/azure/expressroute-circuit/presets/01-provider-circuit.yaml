apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRouteCircuit
metadata:
  name: my-circuit
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-circuit
  skuTier: STANDARD
  skuFamily: METERED_DATA
  serviceProviderName: "<your-connectivity-provider>" # e.g. Equinix, Megaport
  peeringLocation: "<your-peering-location>" # the provider's site, e.g. "Washington DC"
  bandwidthInMbps: 1000
