# Step 1: reserve the contiguous range.
apiVersion: azure.planton.dev/v1
kind: AzurePublicIpPrefix
metadata:
  name: my-shared-egress-prefix
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: shared-egress-prefix
  prefixLength: 28
  zones:
    - "1"
    - "2"
    - "3"
  tags:
    cost-center: <cost-center>
---
# Step 2: allocate an individual address from the range.
apiVersion: azure.planton.dev/v1
kind: AzurePublicIp
metadata:
  name: my-lb-frontend-from-prefix
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: lb-frontend-from-prefix
  publicIpPrefixId:
    valueFrom:
      name: my-shared-egress-prefix
  zones:
    - "1"
    - "2"
    - "3"
