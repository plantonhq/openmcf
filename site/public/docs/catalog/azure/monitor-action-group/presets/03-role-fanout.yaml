# Role-fan-out action group -- notifies every user holding an ARM role
# on the subscription (here the built-in Owner role). No address list to
# maintain: RBAC membership IS the notification list.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorActionGroup
metadata:
  name: my-subscription-owners
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  shortName: SubOwners
  armRoleReceivers:
    - name: notify-owners
      roleId:
        value: 8e3af657-a8ff-443c-a75c-2fe8c4bcb635
      useCommonAlertSchema: true
  tags:
    team: platform
