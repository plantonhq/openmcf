apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupInstance
metadata:
  name: storage-blob-backup
spec:
  vaultId:
    valueFrom:
      kind: AzureDataProtectionBackupVault
      name: "<your-backup-vault>"
      fieldPath: status.outputs.backup_vault_id
  name: storage-blob-backup
  # Must match the storage account's own region.
  region: eastus
  # A BLOB-STORAGE policy on the same vault (variant types must match).
  backupPolicyId:
    valueFrom:
      kind: AzureDataProtectionBackupPolicy
      name: "<your-blob-policy>"
      fieldPath: status.outputs.backup_policy_id
  # The variant block IS the datasource type -- set exactly one.
  blobStorage:
    # The vault's identity needs "Storage Account Backup Contributor"
    # on this account BEFORE the instance deploys (compose an
    # AzureRoleAssignment).
    storageAccountId:
      valueFrom:
        kind: AzureStorageAccount
        name: "<your-storage-account>"
        fieldPath: status.outputs.storage_account_id
    # Required when the policy has a VAULT tier; ONE-WAY once set --
    # the list can change but never be removed entirely. Leave it out
    # for an operational-only policy (whole-account continuous
    # protection).
    storageAccountContainerNames:
      - orders
      - invoices
