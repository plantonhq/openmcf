apiVersion: azure.planton.dev/v1alpha1
kind: AzureSearchService
metadata:
  name: dev-basic-search
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  # GLOBALLY unique -- forms the endpoint {name}.search.windows.net.
  name: acme-search-dev # replace with your globally-unique name
  # The cheapest dedicated tier (the free tier is one shared-cluster
  # service per subscription -- fine for a first look, too limited for
  # team development).
  sku: basic
