apiVersion: azure.planton.dev/v1
kind: AzureStorageContainer
metadata:
  name: public-assets
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  containerName: <container-name>
  # BLOB serves objects anonymously by direct URL with NO listing --
  # the public-website/CDN-origin pattern. Requires the ACCOUNT's
  # allowNestedItemsToBePublic to be true (Azure's default); prefer
  # CONTAINER only when anonymous enumeration is genuinely wanted.
  containerAccessType: BLOB
  metadata:
    purpose: public-assets
