apiVersion: azure.planton.dev/v1
kind: AzureStorageContainer
metadata:
  name: my-tenant-data
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # Replace: 3-63 lowercase letters, digits, and single hyphens.
  containerName: tenant-data
  containerAccessType: PRIVATE
  # Blobs written without their own scope encrypt under this one --
  # per-tenant key isolation inside a shared account. References an
  # AzureStorageEncryptionScope on the SAME account. Both fields are
  # fixed at creation.
  defaultEncryptionScope:
    valueFrom:
      kind: AzureStorageEncryptionScope
      name: <encryption-scope-resource-name>
      fieldPath: status.outputs.encryption_scope_name
  # Make the scope mandatory: individual blob writes cannot override it
  # with a different scope.
  encryptionScopeOverrideEnabled: false
  metadata:
    tenant: <tenant-id>
