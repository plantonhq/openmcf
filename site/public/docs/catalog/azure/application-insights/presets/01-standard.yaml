# Standard workspace-based Application Insights -- full-fidelity
# telemetry for a web application, wired to the platform workspace.
apiVersion: azure.planton.dev/v1
kind: AzureApplicationInsights
metadata:
  name: my-web-app-insights
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  applicationInsightsName: my-web-app-insights
  applicationType: WEB
  workspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: my-platform-logs
      fieldPath: status.outputs.workspace_id
  retentionInDays: 90
  tags:
    cost-center: platform
