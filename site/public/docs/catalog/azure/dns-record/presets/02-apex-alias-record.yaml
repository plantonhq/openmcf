apiVersion: azure.planton.dev/v1
kind: AzureDnsRecord
metadata:
  name: my-apex-alias-record
spec:
  resourceGroup:
    value: <your-resource-group>
  zoneName:
    value: example.com
  # "@" is the zone apex -- your-domain.com itself, where DNS forbids
  # CNAME; the alias A record is Azure's answer.
  name: "@"
  ttlSeconds: 300
  a:
    targetResourceId:
      valueFrom:
        kind: AzurePublicIp
        name: <your-public-ip-resource>
        fieldPath: status.outputs.public_ip_id
