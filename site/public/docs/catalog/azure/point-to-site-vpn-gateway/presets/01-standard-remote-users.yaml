apiVersion: azure.planton.dev/v1alpha1
kind: AzurePointToSiteVpnGateway
metadata:
  name: remote-users-gw
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  name: remote-users-gw
  virtualHubId:
    value: "<your-virtual-hub-arm-id>"
  vpnServerConfigurationId:
    value: "<your-vpn-server-configuration-arm-id>"
  connectionConfigurations:
    - name: default-clients
      addressPrefixes:
        - "172.16.201.0/24"
