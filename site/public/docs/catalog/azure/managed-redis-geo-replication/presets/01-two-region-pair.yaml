apiVersion: azure.planton.dev/v1
kind: AzureManagedRedisGeoReplication
metadata:
  name: my-global-cache-group
spec:
  # The member the group is managed through. Linking is reciprocal --
  # every member sees the same group state, so ONE resource manages the
  # whole group.
  managedRedisId:
    valueFrom:
      kind: AzureManagedRedis
      name: <primary-region-member-resource-name>
      fieldPath: status.outputs.managed_redis_id
  # The other members. Both instances must declare the SAME
  # geoReplicationGroupName and be BALANCED_B3 or larger.
  linkedManagedRedisIds:
    - valueFrom:
        kind: AzureManagedRedis
        name: <secondary-region-member-resource-name>
        fieldPath: status.outputs.managed_redis_id
