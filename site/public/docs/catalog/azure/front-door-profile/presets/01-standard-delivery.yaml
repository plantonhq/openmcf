apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorProfile
metadata:
  name: my-front-door
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-name>
      fieldPath: status.outputs.resource_group_name
  # 2-90 characters, unique within the resource group. Renaming replaces
  # the profile AND every endpoint/origin group/route nested under it.
  profileName: my-front-door
  # STANDARD covers global load balancing, caching, compression, and URL
  # routing -- the right tier unless you need Private Link to origins or
  # managed WAF rules (both PREMIUM-only). The sku cannot change later.
  sku: STANDARD
