apiVersion: azure.planton.dev/v1
kind: AzureKeyVault
metadata:
  name: prod-cmk-vault
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  vaultName: <globally-unique-vault-name>
  sku: PREMIUM
  purgeProtectionEnabled: true
  networkAcls:
    defaultAction: DENY
    ipRules:
      - <office-or-ci-cidr>
    virtualNetworkSubnetIds:
      - value: <app-subnet-arm-id>
  tags:
    cost-center: <cost-center>
