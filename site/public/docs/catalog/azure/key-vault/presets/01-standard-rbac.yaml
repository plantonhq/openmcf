apiVersion: azure.planton.dev/v1
kind: AzureKeyVault
metadata:
  name: platform-vault
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  # Replace: 3-24 chars, letters/digits/hyphens, globally unique -- it
  # becomes {name}.vault.azure.net.
  vaultName: myorg-platform-vault
  tags:
    cost-center: <cost-center>
