apiVersion: azure.planton.dev/v1
kind: AzureRedisLinkedServer
metadata:
  name: my-cache-relink
spec:
  # After a failover the OLD secondary is now serving traffic; this link
  # is created ON it (the new primary of record) ...
  targetRedisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <promoted-cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  # ... pulling the recovered region's cache back in as the replica.
  linkedRedisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <recovered-cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  linkedRedisCacheLocation:
    valueFrom:
      kind: AzureRedisCache
      name: <recovered-cache-resource-name>
      fieldPath: status.outputs.region
  serverRole: SECONDARY
