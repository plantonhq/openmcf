apiVersion: azure.planton.dev/v1
kind: AzureServiceBusSubscription
metadata:
  name: my-consumer
spec:
  topicId:
    valueFrom:
      kind: AzureServiceBusTopic
      name: my-event-topic
      fieldPath: status.outputs.topic_id
  subscriptionName: audit-consumer
  # Required -- Azure has no server default for delivery tolerance.
  maxDeliveryCount: 10
  # Expired messages stay inspectable in the dead-letter sub-queue.
  deadLetteringOnMessageExpiration: true
