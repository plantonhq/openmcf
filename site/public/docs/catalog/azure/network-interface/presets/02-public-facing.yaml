apiVersion: azure.planton.dev/v1
kind: AzureNetworkInterface
metadata:
  name: my-network-interface
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: edge-nic
  ipConfigurations:
    - name: primary
      subnetId:
        valueFrom:
          name: <your-subnet-resource-name>
      publicIpAddressId:
        valueFrom:
          name: <your-public-ip-resource-name>
  acceleratedNetworkingEnabled: true
  networkSecurityGroupId:
    valueFrom:
      name: <your-nsg-resource-name>  # NIC-level rules for the exposed workload
