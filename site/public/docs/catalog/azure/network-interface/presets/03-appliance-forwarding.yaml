apiVersion: azure.planton.dev/v1
kind: AzureNetworkInterface
metadata:
  name: my-network-interface
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: nva-inside-nic
  ipConfigurations:
    - name: primary
      subnetId:
        valueFrom:
          name: <your-subnet-resource-name>
      privateIpAllocation: STATIC
      privateIpAddress: <appliance-static-ip>  # the next-hop IP route tables point at
  ipForwardingEnabled: true  # without this, routed traffic is silently dropped
  acceleratedNetworkingEnabled: true
