apiVersion: azure.planton.dev/v1
kind: AzureNetworkInterface
metadata:
  name: my-network-interface
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: app-nic
  ipConfigurations:
    - name: primary
      subnetId:
        valueFrom:
          name: <your-subnet-resource-name>
  acceleratedNetworkingEnabled: true  # right for every supported VM size (2+ vCPU general purpose)
