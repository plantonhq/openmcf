apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorOriginGroup
metadata:
  name: my-app-backends
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  originGroupName: app-backends
  # No health probe on purpose: with a single origin, probes only add
  # load -- traffic has nowhere else to fail over to. Azure's
  # load-balancing defaults (sample 4 / require 3 / 50 ms) apply.
