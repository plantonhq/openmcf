apiVersion: azure.planton.dev/v1
kind: AzureCosmosdbAccount
metadata:
  name: my-app-cosmos
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-data-rg
      fieldPath: status.outputs.resource_group_name
  accountName: <globally-unique-account-name>
  # The SQL (NoSQL) API -- the default, stated for clarity.
  kind: GLOBAL_DOCUMENT_DB
  # Session consistency: read-your-writes within a session -- Azure's
  # recommendation for most applications.
  consistencyPolicy:
    consistencyLevel: SESSION
  # Two regions: eastus writes, westus2 reads and takes over on
  # failover. Adding regions later is an in-place update.
  geoLocations:
    - location: eastus
      failoverPriority: 0
    - location: westus2
      failoverPriority: 1
  # Promote westus2 automatically if eastus goes down.
  automaticFailoverEnabled: true
  # Point-in-time restore for the last 30 days -- the production-grade
  # backup posture (upgrading from Periodic later is in-place; going
  # back is not).
  backup:
    type: CONTINUOUS
    tier: CONTINUOUS_30_DAYS
  tags:
    workload: app-documents
