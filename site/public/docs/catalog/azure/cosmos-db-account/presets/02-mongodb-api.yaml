apiVersion: azure.planton.dev/v1
kind: AzureCosmosdbAccount
metadata:
  name: my-mongo-cosmos
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-data-rg
      fieldPath: status.outputs.resource_group_name
  accountName: <globally-unique-account-name>
  # The MongoDB-compatible API: existing drivers and tools work
  # unchanged. Fixed at creation.
  kind: MONGO_DB
  # A Mongo account declares its API capability explicitly -- it is
  # part of the account's real configuration, never injected.
  capabilities:
    - ENABLE_MONGO
    - ENABLE_MONGO_RETRYABLE_WRITES
  # The wire-protocol version MongoDB drivers negotiate.
  mongoServerVersion: MONGO_7_0
  consistencyPolicy:
    consistencyLevel: SESSION
  geoLocations:
    - location: eastus
      failoverPriority: 0
  tags:
    workload: mongo-compat
