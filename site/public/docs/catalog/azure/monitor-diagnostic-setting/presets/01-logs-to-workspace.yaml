# Route all of a resource's logs and metrics to a Log Analytics
# Workspace -- the everyday observability wiring, using the allLogs
# category group so new categories flow automatically as Azure adds them.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: my-vault-diagnostics
spec:
  settingName: route-to-workspace
  targetResourceId:
    valueFrom:
      kind: AzureKeyVault
      name: my-app-vault
      fieldPath: status.outputs.key_vault_id
  enabledLogs:
    - categoryGroup: allLogs
  enabledMetrics:
    - category: AllMetrics
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: my-platform-logs
      fieldPath: status.outputs.workspace_id
  logAnalyticsDestinationType: DEDICATED
