apiVersion: azure.planton.dev/v1
kind: AzureAksCluster
metadata:
  name: my-hardened-aks-cluster
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-hardened-aks-cluster
  skuTier: STANDARD
  kubernetesVersion: "<pinned-k8s-version>"
  networkProfile:
    networkPlugin: AZURE_CNI
    networkPluginMode: OVERLAY
    networkPolicy: NETWORK_POLICY_AZURE
  apiServerAccessProfile:
    # Replace with your office/VPN and CI egress CIDRs.
    authorizedIpRanges:
      - "203.0.113.0/24"
  azureActiveDirectoryRoleBasedAccessControl:
    azureRbacEnabled: true
  localAccountDisabled: true
  privateClusterEnabled: false
  defaultNodePool:
    name: system
    vmSize: Standard_D4s_v5
    autoScalingEnabled: true
    minCount: 3
    maxCount: 5
    vnetSubnetId:
      value: "<nodes-subnet-id>"
    zones:
      - "1"
      - "2"
      - "3"
    onlyCriticalAddonsEnabled: true
    hostEncryptionEnabled: true
  omsAgent:
    logAnalyticsWorkspaceId:
      value: "<log-analytics-workspace-id>"
    msiAuthForMonitoringEnabled: true
  microsoftDefender:
    logAnalyticsWorkspaceId:
      value: "<log-analytics-workspace-id>"
  azurePolicyEnabled: true
  oidcIssuerEnabled: true
  workloadIdentityEnabled: true
  costAnalysisEnabled: true
