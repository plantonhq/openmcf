apiVersion: azure.planton.dev/v1
kind: AzureMssqlServer
metadata:
  name: entra-only-sql
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  # Replace: lowercase letters, digits, and hyphens, globally unique -- it
  # becomes {name}.database.windows.net.
  serverName: myorg-entra-sql
  # Entra-only authentication: SQL logins are disabled server-wide, so no
  # admin login/password exists anywhere -- connections use Entra tokens.
  azureadAdministrator:
    loginUsername: <entra-group-name>
    objectId:
      value: <entra-group-object-id>
    azureadAuthenticationOnly: true
  # Microsoft Defender for SQL: threat detection on every database.
  securityAlertPolicy:
    state: ENABLED
    emailAccountAdmins: true
    emailAddresses:
      - <security-team-email>
  expressVulnerabilityAssessmentEnabled: true
  firewallRules:
    - name: allow-azure-services
      startIpAddress: "0.0.0.0"
      endIpAddress: "0.0.0.0"
  tags:
    cost-center: <cost-center>
