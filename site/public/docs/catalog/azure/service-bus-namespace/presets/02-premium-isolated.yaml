apiVersion: azure.planton.dev/v1
kind: AzureServiceBusNamespace
metadata:
  name: my-enterprise-bus
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-messaging-rg
      fieldPath: status.outputs.resource_group_name
  namespaceName: myorg-enterprise-bus
  sku: PREMIUM
  # Messaging units: 1 fits most workloads to start; scaling up later
  # updates in place.
  capacity: 1
  # 1 = not partitioned (the standard choice). The layout is fixed at
  # creation -- choose 2 or 4 only for throughput beyond one store.
  premiumMessagingPartitions: 1
  # BYOK: the unwrapping identity must be attached AND hold wrap/unwrap
  # on the key's vault. CMK cannot be removed once set.
  identity:
    type: USER_ASSIGNED
    userAssignedIdentityIds:
      - valueFrom:
          kind: AzureUserAssignedIdentity
          name: my-messaging-identity
          fieldPath: status.outputs.identity_id
  customerManagedKey:
    keyVaultKeyId:
      valueFrom:
        kind: AzureKeyVaultKey
        name: my-messaging-cmk
        fieldPath: status.outputs.versionless_id
    userAssignedIdentityId:
      valueFrom:
        kind: AzureUserAssignedIdentity
        name: my-messaging-identity
        fieldPath: status.outputs.identity_id
  # The production firewall posture: deny by default, admit the
  # application subnets.
  networkRuleSet:
    defaultAction: DENY
    trustedServicesAllowed: true
    networkRules:
      - subnetId:
          valueFrom:
            kind: AzureSubnet
            name: my-app-subnet
            fieldPath: status.outputs.subnet_id
  tags:
    purpose: payments
