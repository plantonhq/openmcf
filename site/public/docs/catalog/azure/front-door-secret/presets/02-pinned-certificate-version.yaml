apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorSecret
metadata:
  name: my-pinned-cert-secret
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  secretName: api-example-com-pinned
  # The VERSIONED certificate id pins one exact certificate version --
  # Front Door serves it until this secret is replaced, regardless of
  # what happens in Key Vault.
  keyVaultCertificateId:
    valueFrom:
      kind: AzureKeyVaultCertificate
      name: <key-vault-certificate-resource-name>
      fieldPath: status.outputs.certificate_id
