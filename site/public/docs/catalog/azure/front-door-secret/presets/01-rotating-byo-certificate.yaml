apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorSecret
metadata:
  name: my-wildcard-cert-secret
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  secretName: wildcard-example-com
  # The default reference is the certificate's VERSIONLESS id: Front
  # Door follows the latest version, so Key Vault rotation and
  # auto-renewal propagate to every domain without any redeploy.
  keyVaultCertificateId:
    valueFrom:
      kind: AzureKeyVaultCertificate
      name: <key-vault-certificate-resource-name>
      fieldPath: status.outputs.versionless_id
