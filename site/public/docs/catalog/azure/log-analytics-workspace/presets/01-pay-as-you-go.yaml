# Pay-as-you-go workspace -- the everyday shape: PerGB2018 billing,
# 90-day retention, a daily cap as a cost guard, and user tags.
apiVersion: azure.planton.dev/v1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: my-platform-logs
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  workspaceName: my-platform-logs
  sku: PER_GB_2018
  retentionInDays: 90
  dailyQuotaGb: 25
  tags:
    cost-center: platform
