apiVersion: azure.planton.dev/v1
kind: AzureEventHubNamespaceCustomerManagedKey
metadata:
  name: my-streaming-cmk
spec:
  # The namespace must have single-tenant capacity (dedicated cluster or
  # PREMIUM) and carry the unwrapping identity BEFORE this kind applies.
  eventhubNamespaceId:
    valueFrom:
      kind: AzureEventHubNamespace
      name: my-premium-hubs
      fieldPath: status.outputs.namespace_id
  # Versionless: vault-side key rotation propagates automatically.
  keyVaultKeyIds:
    - valueFrom:
        kind: AzureKeyVaultKey
        name: my-streaming-key
        fieldPath: status.outputs.versionless_id
  # The identity that unwraps the key -- must already ride the
  # namespace's identity block, with wrap/unwrap access on the vault
  # (compose an AzureRoleAssignment granting "Key Vault Crypto Service
  # Encryption User").
  userAssignedIdentityId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: my-cmk-identity
      fieldPath: status.outputs.identity_id
