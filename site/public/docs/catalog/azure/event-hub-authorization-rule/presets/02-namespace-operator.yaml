apiVersion: azure.planton.dev/v1
kind: AzureEventHubAuthorizationRule
metadata:
  name: my-operator-credential
spec:
  ruleName: streaming-operator
  # Namespace scope: rights over EVERY hub -- for operational tooling
  # that manages the whole streaming estate.
  namespaceId:
    valueFrom:
      kind: AzureEventHubNamespace
      name: my-telemetry-hubs
      fieldPath: status.outputs.namespace_id
  # The manage trio: Azure requires listen and send alongside manage.
  listen: true
  send: true
  manage: true
