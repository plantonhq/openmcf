apiVersion: azure.planton.dev/v1
kind: AzureNatGateway
metadata:
  name: my-nat-gateway
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: egress-nat
  zones:
    - "1"
  idleTimeoutInMinutes: 10  # 10 min balances connection reuse vs SNAT port hold time
  publicIpIds:
    - valueFrom:
        name: <your-public-ip-resource-name>
