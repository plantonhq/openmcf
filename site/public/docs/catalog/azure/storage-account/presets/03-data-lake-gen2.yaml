apiVersion: azure.planton.dev/v1
kind: AzureStorageAccount
metadata:
  name: my-analytics-lake
spec:
  region: <azure-region>
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  # Replace: 3-24 lowercase letters and digits ONLY (no hyphens), globally
  # unique across all of Azure -- it becomes the DNS prefix of every endpoint.
  accountName: myorgdatalake
  # Zone-redundant: analytics data is expensive to regenerate.
  replicationType: ZRS
  # The hierarchical namespace turns the blob service into Data Lake
  # Storage Gen2: real directories, POSIX ACLs, and the dfs endpoint
  # analytics engines (Spark, Databricks, Synapse) address. Fixed at
  # creation -- an account cannot gain or lose HNS later. Note:
  # incompatible with blob versioning (Azure's contract).
  isHnsEnabled: true
  # SFTP ingestion onto the lake (an HNS feature; local users carry the
  # SFTP credentials). Remove both if nothing uploads over SFTP.
  sftpEnabled: true
  blobProperties:
    deleteRetentionPolicy:
      days: 14
  # Raw-zone data ages out; curated zones live under different prefixes
  # with their own rules as the lake grows.
  lifecycleRules:
    - name: expire-raw-zone
      filters:
        blobTypes:
          - BLOCK_BLOB
        prefixMatch:
          - raw/
      actions:
        baseBlob:
          tierToCoolAfterDaysSinceModificationGreaterThan: 30
          deleteAfterDaysSinceModificationGreaterThan: 365
  tags:
    cost-center: <cost-center>
    workload: analytics
