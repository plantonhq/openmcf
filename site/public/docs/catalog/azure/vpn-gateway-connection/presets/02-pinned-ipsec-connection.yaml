apiVersion: azure.planton.dev/v1alpha1
kind: AzureVpnGatewayConnection
metadata:
  name: my-branch-connection
spec:
  name: my-branch-connection
  vpnGatewayId:
    value: "<your-vpn-gateway-arm-id>"
  remoteVpnSiteId:
    value: "<your-vpn-site-arm-id>"
  vpnLinks:
    - name: primary-isp
      vpnSiteLinkId:
        value: "<your-vpn-site-link-arm-id>"
      sharedKey:
        value: "<your-pre-shared-key>"
      dpdTimeoutSeconds: 45
      ipsecPolicies:
        - saLifetimeSec: 3600
          saDataSizeKb: 102400000
          encryptionAlgorithm: AES256
          integrityAlgorithm: SHA256
          ikeEncryptionAlgorithm: AES256
          ikeIntegrityAlgorithm: SHA256
          dhGroup: DHGroup14
          pfsGroup: PFS2048
