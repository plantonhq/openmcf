apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: my-postgresql-subnet
spec:
  virtualNetworkId:
    value: "<vnet-resource-id>"
  name: postgresql
  addressPrefixes:
    - 10.0.2.0/28
  delegations:
    - name: postgresql
      serviceName: Microsoft.DBforPostgreSQL/flexibleServers
      actions:
        - Microsoft.Network/virtualNetworks/subnets/join/action
