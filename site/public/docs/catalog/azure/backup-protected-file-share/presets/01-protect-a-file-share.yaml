apiVersion: azure.planton.dev/v1alpha1
kind: AzureBackupProtectedFileShare
metadata:
  name: protect-team-share
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  recoveryVaultName:
    valueFrom:
      kind: AzureRecoveryServicesVault
      name: "<your-recovery-services-vault>"
      fieldPath: status.outputs.recovery_services_vault_name
  # Wire the storage account THROUGH its vault registration (the
  # registration echoes the account's ARM ID): the reference carries
  # both the value and the deploy-order edge, so registration always
  # happens before protection.
  sourceStorageAccountId:
    valueFrom:
      kind: AzureBackupContainerStorageAccount
      name: "<your-backup-container-registration>"
      fieldPath: status.outputs.storage_account_id
  sourceFileShareName:
    valueFrom:
      kind: AzureStorageShare
      name: "<your-storage-share>"
      fieldPath: status.outputs.share_name
  backupPolicyId:
    valueFrom:
      kind: AzureBackupPolicyFileShare
      name: "<your-file-share-backup-policy>"
      fieldPath: status.outputs.backup_policy_id
