apiVersion: azure.planton.dev/v1alpha1
kind: AzureBastionHost
metadata:
  name: dev-bastion
spec:
  region: eastus2
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  name: dev-bastion
  # DEVELOPER: free, Azure-shared infrastructure -- no dedicated
  # subnet, no public IP; the host attaches to the network directly.
  # Region-limited: verify availability before deploying.
  sku: DEVELOPER
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "<your-virtual-network>"
      fieldPath: status.outputs.virtual_network_id
