apiVersion: gcp.planton.dev/v1
kind: GcpArtifactRegistryRepo
metadata:
  name: docker-all
spec:
  location: us-central1 # replace — must match the upstream repositories' location
  format: DOCKER
  mode: VIRTUAL_REPOSITORY
  description: single pull endpoint aggregating team images and the Docker Hub cache
  virtualRepositoryConfig:
    upstreamPolicies:
      # First-party images win on any name conflict...
      - id: team-images
        repository:
          valueFrom:
            kind: GcpArtifactRegistryRepo
            name: app-images
            fieldPath: status.outputs.repository_path
        priority: 100
      # ...and everything else falls through to the Docker Hub cache.
      - id: dockerhub-cache
        repository:
          valueFrom:
            kind: GcpArtifactRegistryRepo
            name: dockerhub-cache
            fieldPath: status.outputs.repository_path
        priority: 50
  labels:
    team: platform # replace with your cost-attribution labels
