apiVersion: gcp.planton.dev/v1alpha1
kind: GcpEventarcTrigger
metadata:
  name: audit-log-to-workflow
spec:
  location: global

  # React to control-plane changes: audit-log triggers watch GCP API
  # calls themselves. Enable audit logs for the watched service first
  # (IAM & Admin -> Audit Logs), or nothing fires.
  matchingCriteria:
    - attribute: type
      value: google.cloud.audit.log.v1.written
    - attribute: serviceName
      value: storage.googleapis.com
    - attribute: methodName
      value: storage.buckets.create

  destination:
    # An orchestrated response per event — the workflow decodes the
    # audit entry and fans out (notify, tag, remediate).
    workflow:
      value: projects/my-project/locations/us-central1/workflows/bucket-onboarding

  # REQUIRED for audit-log triggers; also needs
  # roles/workflows.invoker on the destination workflow.
  serviceAccount:
    value: eventarc-invoker@my-project.iam.gserviceaccount.com

  deletionPolicy: DELETE
