apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSchema
metadata:
  name: order-events-schema
spec:
  # Omitted projectId: the schema lands in the provider's default project.
  # Set projectId (literal or a GcpProject reference) to target another.
  schemaName: order-events
  # AVRO is the best default: human-readable, self-describing, and the
  # format Pub/Sub's BigQuery and Cloud Storage subscription integrations
  # understand natively (use_topic_schema / avro_config).
  type: AVRO
  definition: |
    {
      "type": "record",
      "name": "OrderEvent",
      "namespace": "com.example.orders",
      "fields": [
        {"name": "order_id", "type": "string"},
        {"name": "customer_id", "type": "string"},
        {"name": "amount_cents", "type": "long"},
        {"name": "currency", "type": "string"},
        {"name": "placed_at", "type": {"type": "long", "logicalType": "timestamp-millis"}}
      ]
    }
