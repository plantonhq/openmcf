apiVersion: gcp.planton.dev/v1
kind: GcpVertexAiNotebook
metadata:
  name: gpu-training
spec:
  location: us-central1-a
  # GPU accelerators require compatible machine types: n1-standard-* for
  # Tesla-class GPUs (T4/P100/V100), a2-* for A100, g2-* for L4.
  machineType: n1-standard-8
  labels:
    team: ml-platform
    workload: training
  acceleratorConfig:
    type: NVIDIA_TESLA_T4
    coreCount: 1
  bootDisk:
    diskType: PD_SSD
    diskSizeGb: 200
  # Separate data disk for datasets and model checkpoints — survives image
  # changes and can be resized in place.
  dataDisk:
    diskType: PD_SSD
    diskSizeGb: 500
  # GCP's maintained Workbench image family; the service installs GPU
  # drivers to match the accelerator config. (The legacy DL-VM families
  # like tf-latest-gpu were retired by GCP.)
  vmImage:
    project: cloud-notebooks-managed
    family: workbench-instances
  # Consume a pre-purchased GPU reservation so training capacity is
  # guaranteed. Remove this block to run purely on-demand.
  reservationAffinity:
    consumeReservationType: RESERVATION_SPECIFIC
    key: compute.googleapis.com/reservation-name
    values:
      - ml-gpu-reservation
