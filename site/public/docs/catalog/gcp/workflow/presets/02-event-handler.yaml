apiVersion: gcp.planton.dev/v1alpha1
kind: GcpWorkflow
metadata:
  name: event-handler
spec:
  region: us-central1

  # An event-driven step function: an Eventarc trigger delivers the
  # CloudEvent as the execution argument; the workflow routes on its
  # type and fans out the work.
  sourceContents: |
    main:
      params: [event]
      steps:
        - decode:
            assign:
              - message: ${json.decode(base64.decode(event.data.message.data))}
        - handle:
            call: http.post
            args:
              url: https://handler.internal.example.com/process
              auth:
                type: OIDC
              body: ${message}
            result: outcome
        - done:
            return: ${outcome.code}

  serviceAccount:
    value: event-handler@my-project.iam.gserviceaccount.com

  # Detailed history while the event shapes are still being learned.
  callLogLevel: LOG_ERRORS_ONLY
  executionHistoryLevel: EXECUTION_HISTORY_DETAILED

  deletionPolicy: DELETE
