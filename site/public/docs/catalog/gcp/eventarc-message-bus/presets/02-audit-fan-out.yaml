apiVersion: gcp.planton.dev/v1alpha1
kind: GcpEventarcMessageBus
metadata:
  name: audit-fan-out
spec:
  location: us-central1
  logSeverity: INFO

  # Google-service events (incl. audit logs) published into the bus —
  # auto-wired to THIS bus by the module.
  googleApiSources:
    - sourceId: google-events

  # Two consumers reading different slices of the same stream: storage
  # events to the analytics topic, everything else to the ops workflow.
  pipelines:
    - pipelineId: storage-to-analytics
      destination:
        topic:
          value: projects/my-project/topics/storage-events
    - pipelineId: rest-to-ops
      destination:
        workflow:
          value: projects/my-project/locations/us-central1/workflows/ops-handler
      authentication:
        googleOidc:
          serviceAccount:
            value: bus-invoker@my-project.iam.gserviceaccount.com

  enrollments:
    - enrollmentId: storage-slice
      celMatch: 'message.type.startsWith("google.cloud.storage")'
      pipeline: storage-to-analytics
    - enrollmentId: everything-else
      celMatch: '!message.type.startsWith("google.cloud.storage")'
      pipeline: rest-to-ops

  deletionPolicy: DELETE
