apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamCustomRole
metadata:
  name: my-workload-role
spec:
  projectId:
    value: "<gcp-project-id>"
  roleId: logBucketWriter  # replace: camelCase, 3-64 chars; hyphens are not allowed
  title: Log Bucket Writer  # replace with your role's console title
  description: Grants exactly the permissions this workload needs, nothing more
  permissions:
    - storage.objects.create
    - storage.objects.get
  stage: GA  # default; the right label for production roles
