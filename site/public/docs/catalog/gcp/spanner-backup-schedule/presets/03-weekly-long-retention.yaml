apiVersion: gcp.planton.dev/v1
kind: GcpSpannerBackupSchedule
metadata:
  name: orders-weekly-archive
spec:
  # project_id omitted: falls back to the provider's default project.
  instance:
    valueFrom:
      kind: GcpSpannerInstance
      name: prod-spanner # replace with your instance resource name
      fieldPath: status.outputs.instance_name
  database:
    valueFrom:
      kind: GcpSpannerDatabase
      name: orders-db # replace with your database resource name
      fieldPath: status.outputs.database_name
  cron: "0 4 * * 0" # weekly on Sunday at 04:00 UTC
  retentionDuration: 31622400s # keep each backup 366 days (the maximum)
  backupType: FULL
  encryptionConfig:
    # Archive copies encrypted with an explicit CMEK key instead of
    # inheriting the database's posture.
    encryptionType: CUSTOMER_MANAGED_ENCRYPTION
    kmsKeyName:
      valueFrom:
        kind: GcpKmsKey
        name: spanner-backup-cmek # replace with your key resource name
        fieldPath: status.outputs.key_id
