apiVersion: gcp.planton.dev/v1
kind: GcpBigQueryDataset
metadata:
  name: my-encrypted-dataset
spec:
  # project_id omitted: falls back to the provider's default project.
  datasetId: financial_data_prod # replace
  location: us-central1 # regional for data residency; must match the KMS key's location
  description: CMEK-encrypted dataset for regulated financial data
  storageBillingModel: PHYSICAL # compressed-byte billing; often 60-80% cheaper
  # Every new table is encrypted with this key. Grant the BigQuery service
  # agent cryptoKeyEncrypterDecrypter on the key before the first table write.
  kmsKeyName:
    valueFrom:
      kind: GcpKmsKey
      name: my-bq-key # replace with your GcpKmsKey resource name
      fieldPath: status.outputs.key_id
