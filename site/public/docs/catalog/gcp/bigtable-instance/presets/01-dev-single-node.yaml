apiVersion: gcp.planton.dev/v1
kind: GcpBigtableInstance
metadata:
  name: my-dev-bigtable
spec:
  instanceName: my-dev-bigtable
  # Dev instances tear down freely.
  deletionProtection: false
  clusters:
    # One single-node SSD cluster — the smallest footprint that behaves
    # like production (same API, same client libraries).
    - clusterId: my-dev-bigtable-c1
      zone: us-central1-a
      numNodes: 1
