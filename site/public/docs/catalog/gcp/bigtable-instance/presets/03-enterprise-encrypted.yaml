apiVersion: gcp.planton.dev/v1
kind: GcpBigtableInstance
metadata:
  name: my-enterprise-bigtable
spec:
  instanceName: my-enterprise-bigtable
  displayName: Enterprise Bigtable (CMEK)
  deletionProtection: true
  labels:
    team: data-platform
    compliance: cmek
  clusters:
    # CMEK-encrypted replicating pair. The key must be regional (matching
    # each cluster's region) and consistent across all clusters in the
    # instance. Reference the GcpKmsKey so the key resource ID resolves
    # automatically.
    - clusterId: my-ent-bigtable-c1
      zone: us-central1-a
      kmsKeyName:
        valueFrom:
          kind: GcpKmsKey
          name: bigtable-cmek
          fieldPath: status.outputs.key_id
      autoscalingConfig:
        minNodes: 5
        maxNodes: 50
        cpuTarget: 60
        storageTarget: 4096
    - clusterId: my-ent-bigtable-c2
      zone: us-central1-b
      kmsKeyName:
        valueFrom:
          kind: GcpKmsKey
          name: bigtable-cmek
          fieldPath: status.outputs.key_id
      autoscalingConfig:
        minNodes: 5
        maxNodes: 50
        cpuTarget: 60
        storageTarget: 4096
