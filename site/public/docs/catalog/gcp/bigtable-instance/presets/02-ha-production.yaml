apiVersion: gcp.planton.dev/v1
kind: GcpBigtableInstance
metadata:
  name: my-prod-bigtable
spec:
  instanceName: my-prod-bigtable
  displayName: Production Bigtable
  deletionProtection: true
  labels:
    team: data-platform
  clusters:
    # Two replicating clusters in different zones: automatic replication
    # and failover, handled transparently by the client library. Each
    # autoscales on CPU — Bigtable adds nodes above the target and
    # removes them below it.
    - clusterId: my-prod-bigtable-c1
      zone: us-central1-a
      autoscalingConfig:
        minNodes: 3
        maxNodes: 30
        cpuTarget: 65
    - clusterId: my-prod-bigtable-c2
      zone: us-central1-b
      autoscalingConfig:
        minNodes: 3
        maxNodes: 30
        cpuTarget: 65
