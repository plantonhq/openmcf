apiVersion: gcp.planton.dev/v1
kind: GcpComputeDisk
metadata:
  name: db-data
spec:
  zone: us-central1-a # replace — must match the database VM's zone
  # pd-ssd: high IOPS per GB for latency-sensitive databases.
  type: pd-ssd
  sizeGb: 500
  # CMEK: the Compute Engine service agent
  # (service-<project-number>@compute-system.iam.gserviceaccount.com)
  # must hold roles/cloudkms.cryptoKeyEncrypterDecrypter on this key
  # BEFORE the disk is created. Immutable after creation.
  kmsKey:
    valueFrom:
      kind: GcpKmsKey
      name: db-disk-key
      fieldPath: status.outputs.key_id
  # Last-resort recovery net: a destroy — even a mistaken one — leaves a
  # final snapshot behind (encrypted with the same key).
  createSnapshotBeforeDestroy: true
  labels:
    team: platform # replace with your cost-attribution labels
