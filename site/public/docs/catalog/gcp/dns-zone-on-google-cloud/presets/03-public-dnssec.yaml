apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDnsZone
metadata:
  name: example.com
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  visibility: public
  description: Production public zone with DNSSEC
  dnssecConfig:
    # Quoted deliberately: bare `on` is YAML 1.1 boolean true, not a string.
    state: "on"
    nonExistence: nsec
  cloudLoggingConfig:
    enableLogging: true
