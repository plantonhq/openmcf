apiVersion: gcp.planton.dev/v1
kind: GcpMemorystoreInstance
metadata:
  name: my-prod-memorystore
spec:
  instanceName: my-prod-memorystore
  location: us-central1

  # Sharded cluster with one replica per shard: horizontal write scaling
  # plus automatic failover. Clients need cluster-aware drivers.
  shardCount: 3
  mode: CLUSTER
  nodeType: HIGHMEM_MEDIUM
  replicaCount: 1

  # TLS on the wire; clients verify the server's identity.
  transitEncryptionMode: SERVER_AUTHENTICATION

  # Point-in-time snapshots every 12h — survives restarts and failovers
  # without AOF's per-write I/O cost.
  persistenceConfig:
    mode: RDB
    rdbConfig:
      rdbSnapshotPeriod: TWELVE_HOURS

  # Spread nodes across zones for availability.
  zoneDistributionConfig:
    mode: MULTI_ZONE

  maintenancePolicy:
    weeklyMaintenanceWindow:
      day: SUNDAY
      hour: 3

  pscAutoConnections:
    - network:
        valueFrom:
          kind: GcpVpcNetwork
          name: prod-vpc
          fieldPath: status.outputs.network_id
      projectId:
        value: my-gcp-project-123 # replace with your project ID

  # Explicit, though it is also the default: production data stores keep
  # deletion protection on.
  deletionProtectionEnabled: true
