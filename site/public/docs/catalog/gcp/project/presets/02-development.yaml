apiVersion: gcp.planton.dev/v1
kind: GcpProject
metadata:
  name: my-dev-project
spec:
  # Realistic sample values for pattern-validated fields (projectId,
  # parentId, billingAccountId) — replace with your own. Project IDs are
  # globally unique and reserved ~30 days after deletion, so bake the
  # uniqueness into the ID itself (e.g. a team or ticket suffix).
