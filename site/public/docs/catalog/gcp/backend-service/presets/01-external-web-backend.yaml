apiVersion: gcp.planton.dev/v1
kind: GcpBackendService
metadata:
  name: my-web-backend
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Serves the web application through the global external ALB
  protocol: HTTP
  loadBalancingScheme: EXTERNAL
  # Named port defined on the instance groups below.
  portName: http
  # Reference the probe; or set healthCheck.value to a literal self-link.
  healthCheck:
    valueFrom:
      kind: GcpHealthCheck
      name: web-hc  # replace with your GcpHealthCheck resource name
      fieldPath: status.outputs.self_link
  backends:
    # One instance-group backend balanced on CPU utilization.
    - group:
        value: https://www.googleapis.com/compute/v1/projects/my-project/zones/us-central1-a/instanceGroups/web-ig  # replace with your instance group
      balancingMode: UTILIZATION
      maxUtilization: 0.8
      description: primary web pool
  # Drain gracefully on rollouts before closing connections.
  connectionDrainingTimeoutSec: 120
  # Log a 10% sample of requests — enough to debug, cheap at scale.
  logConfig:
    enable: true
    sampleRate: 0.1
