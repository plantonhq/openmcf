apiVersion: gcp.planton.dev/v1
kind: GcpCloudSchedulerJob
metadata:
  name: daily-report-trigger
spec:
  location: us-central1
  # 09:00 New York time on weekdays.
  schedule: "0 9 * * 1-5"
  timeZone: America/New_York
  description: Triggers daily report generation on weekdays at 9am ET
  # Allow the report handler up to 10 minutes before the attempt is
  # marked DEADLINE_EXCEEDED (HTTP targets accept 15s–30m).
  attemptDeadline: "600s"
  httpTarget:
    uri: https://reports-abc123-uc.a.run.app/api/generate # replace with your Cloud Run URL
    httpMethod: POST
    # Base64 of {"action":"generate_report"}.
    body: eyJhY3Rpb24iOiJnZW5lcmF0ZV9yZXBvcnQifQ==
    headers:
      Content-Type: application/json
    oidcToken:
      # The designed composition: reference the service account resource so
      # the job authenticates with its identity wherever it is deployed.
      serviceAccountEmail:
        valueFrom:
          kind: GcpServiceAccount
          name: report-invoker
          fieldPath: status.outputs.email
      # For Cloud Run, the audience is the service URL.
      audience: https://reports-abc123-uc.a.run.app
  retryConfig:
    retryCount: 3
    maxRetryDuration: "1800s"
    minBackoffDuration: "5s"
    maxBackoffDuration: "600s"
    maxDoublings: 3
