apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeNodePool
metadata:
  name: spot-batch-pool
spec:
  clusterName:
    valueFrom:
      kind: GcpGkeCluster
      name: my-gke-cluster # replace with your GcpGkeCluster resource name
      fieldPath: status.outputs.name
  location:
    valueFrom:
      kind: GcpGkeCluster
      name: my-gke-cluster # replace with your GcpGkeCluster resource name
      fieldPath: status.outputs.location
  autoscaling:
    minNodes: 0 # scale to zero — the pool costs nothing while idle
    maxNodes: 10
    locationPolicy: ANY # hunt Spot capacity anywhere; reduces preemption risk
  nodeConfig:
    machineType: e2-standard-4
    diskSizeGb: 100
    diskType: pd-balanced
    # Spot VMs: 60-91% discount, preemptible with 30s notice — the current
    # model (no 24h lifetime), superseding legacy preemptible VMs.
    spot: true
    # The taint fences general workloads off Spot capacity; only pods that
    # tolerate workload-class=batch (and therefore preemption) land here.
    labels:
      workload-class: batch
    taints:
      - key: workload-class
        value: batch
        effect: NO_SCHEDULE
