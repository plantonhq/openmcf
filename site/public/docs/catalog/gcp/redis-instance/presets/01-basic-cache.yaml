apiVersion: gcp.planton.dev/v1alpha1
kind: GcpRedisInstance
metadata:
  name: my-redis-cache
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  instanceName: app-cache
  region: us-central1
  tier: BASIC
  memorySizeGb: 1
  redisVersion: REDIS_7_2
  authorizedNetwork:
    valueFrom:
      kind: GcpVpcNetwork
      name: my-app-vpc # replace with your GcpVpcNetwork resource name
      fieldPath: status.outputs.network_self_link
  # A dev cache comes and goes with its stack — allow destroy.
  deletionProtection: false
