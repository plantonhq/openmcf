apiVersion: gcp.planton.dev/v1alpha1
kind: GcpRedisInstance
metadata:
  name: my-ha-redis
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  instanceName: session-store-prod
  region: us-central1
  tier: STANDARD_HA
  memorySizeGb: 5
  redisVersion: REDIS_7_2
  # Pin both zones so the primary and replica land next to zonal workloads;
  # omit to let GCP spread them automatically.
  locationId: us-central1-a
  alternativeLocationId: us-central1-b
  authorizedNetwork:
    valueFrom:
      kind: GcpVpcNetwork
      name: my-prod-vpc # replace with your GcpVpcNetwork resource name
      fieldPath: status.outputs.network_self_link
  authEnabled: true
  transitEncryptionMode: SERVER_AUTHENTICATION
  maintenanceWindow:
    day: SUNDAY
    hour: 3
    minute: 30
    description: post-midnight window, after the nightly batch completes
  persistenceConfig:
    persistenceMode: RDB
    rdbSnapshotPeriod: TWELVE_HOURS
    rdbSnapshotStartTime: "2026-01-01T03:00:00Z" # snapshots align to this clock
  # Destroying a production session store must be a deliberate two-step:
  # flip this to false, apply, then destroy.
  deletionProtection: true
