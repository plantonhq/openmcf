apiVersion: gcp.planton.dev/v1
kind: GcpCloudSqlUser
metadata:
  name: my-ci-runner-user
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  instance:
    valueFrom:
      kind: GcpCloudSql
      name: my-postgres-prod # replace with your instance's resource name
      fieldPath: status.outputs.instance_name
  # The service account's full email is the user name for IAM auth.
  userName: ci-runner@my-gcp-project-123.iam.gserviceaccount.com # replace
  type: CLOUD_IAM_SERVICE_ACCOUNT
  # No password — authentication goes through IAM. On PostgreSQL, the
  # instance must set databaseFlags: {"cloudsql.iam_authentication": "on"}.
