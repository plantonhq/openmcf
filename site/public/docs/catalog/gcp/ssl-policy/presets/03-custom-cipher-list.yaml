apiVersion: gcp.planton.dev/v1
kind: GcpSslPolicy
metadata:
  name: custom-cipher-list
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Hand-picked cipher suites for an exact security-review allowlist
  # CUSTOM requires an explicit cipher allowlist in customFeatures.
  profile: CUSTOM
  minTlsVersion: TLS_1_2
  # Exact suites to allow (TLS 1.2 AEAD suites with forward secrecy shown).
  # TLS 1.3 suites are not listable — GCP always enables them.
  customFeatures:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
