apiVersion: gcp.planton.dev/v1
kind: GcpSslPolicy
metadata:
  name: modern-tls12
spec:
  projectId:
    value: "<gcp-project-id>"
  description: TLS 1.2 floor with MODERN ciphers — the recommended production baseline
  # MODERN drops broken ciphers while keeping broad client compatibility.
  profile: MODERN
  # TLS 1.2 minimum satisfies PCI DSS and most compliance regimes.
  minTlsVersion: TLS_1_2
