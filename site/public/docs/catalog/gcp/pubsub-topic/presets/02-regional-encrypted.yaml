apiVersion: gcp.planton.dev/v1
kind: GcpPubSubTopic
metadata:
  name: secure-audit-events
spec:
  topicName: secure-audit-events
  # CMEK: the Pub/Sub service agent must hold
  # roles/cloudkms.cryptoKeyEncrypterDecrypter on this key. Reference a
  # GcpKmsKey resource (shown) or set a literal key path.
  kmsKeyName:
    valueFrom:
      kind: GcpKmsKey
      name: audit-events-key
      fieldPath: status.outputs.key_id
  # Pin message storage to one region and reject publishes from
  # non-allowed regions outright (data-residency posture).
  messageStoragePolicy:
    allowedPersistenceRegions:
      - us-central1
    enforceInTransit: true
