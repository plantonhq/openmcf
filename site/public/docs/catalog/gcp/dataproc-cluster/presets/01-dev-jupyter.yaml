apiVersion: gcp.planton.dev/v1
kind: GcpDataprocCluster
metadata:
  name: dev-jupyter
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  region: us-central1
  clusterName: dev-jupyter

  labels:
    environment: dev
    purpose: notebooks

  clusterConfig:
    # Minimal topology: 1 master + 2 workers on cost-effective machines.
    masterConfig:
      numInstances: 1
      machineType: e2-standard-4
      diskConfig:
        bootDiskSizeGb: 100
    workerConfig:
      numInstances: 2
      machineType: e2-standard-4
      diskConfig:
        bootDiskSizeGb: 100

    # JupyterLab on the current stable image.
    softwareConfig:
      imageVersion: "2.2-debian12"
      optionalComponents:
        - JUPYTER

    # Component Gateway: authenticated HTTPS access to Jupyter, the
    # Spark UI, and YARN ResourceManager.
    endpointConfig:
      enableHttpPortAccess: true

    # Auto-delete after 30 minutes idle — forgotten dev clusters never
    # run overnight.
    lifecycleConfig:
      idleDeleteTtl: "1800s"
