apiVersion: gcp.planton.dev/v1alpha1
kind: GcpKmsKey
metadata:
  name: cmek-data-key
spec:
  # The designed composition: reference the key ring resource so the key
  # follows the ring wherever it is deployed.
  keyRingId:
    valueFrom:
      kind: GcpKmsKeyRing
      name: prod-encryption
      fieldPath: status.outputs.key_ring_id
  keyName: cmek-data-key # replace — permanent, never reusable within the ring
  # 90-day automatic rotation: a new primary version is minted on the
  # cadence; old versions keep decrypting existing data until destroyed.
  rotationPeriod: "7776000s"
  # Destroy protection for a key real data depends on: a destroy fails
  # instead of scheduling every version (and the data under them) for
  # destruction. Flip to DELETE only for disposable keys.
  deletionPolicy: PREVENT
  labels:
    team: platform # replace with your cost-attribution labels
