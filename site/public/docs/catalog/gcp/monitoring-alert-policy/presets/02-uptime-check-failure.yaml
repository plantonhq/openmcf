apiVersion: gcp.planton.dev/v1alpha1
kind: GcpMonitoringAlertPolicy
metadata:
  name: website-down
spec:
  combiner: OR
  severity: CRITICAL
  conditions:
    - displayName: uptime check failing
      conditionThreshold:
        filter: metric.type="monitoring.googleapis.com/uptime_check/check_passed" AND resource.type="uptime_url" AND metric.label.check_id="your-uptime-check-id"
        comparison: COMPARISON_GT
        thresholdValue: 1
        duration: 300s
        aggregations:
          - alignmentPeriod: 1200s
            perSeriesAligner: ALIGN_NEXT_OLDER
            crossSeriesReducer: REDUCE_COUNT_FALSE
            groupByFields:
              - resource.label.host
