apiVersion: gcp.planton.dev/v1
kind: GcpGkeNodePool
metadata:
  name: general-pool
spec:
  # clusterName and location resolve from the parent cluster's outputs, so
  # the pool always addresses the cluster exactly as GKE named it.
  clusterName:
    valueFrom:
      kind: GcpGkeCluster
      name: my-gke-cluster # replace with your GcpGkeCluster resource name
      fieldPath: status.outputs.name
  location:
    valueFrom:
      kind: GcpGkeCluster
      name: my-gke-cluster # replace with your GcpGkeCluster resource name
      fieldPath: status.outputs.location
  # Per-zone bounds: a regional cluster in 3 zones can reach 3 x maxNodes.
  autoscaling:
    minNodes: 1
    maxNodes: 5
    locationPolicy: BALANCED # spread nodes evenly across zones
  # Surge upgrades: one extra node at a time, no capacity dip.
  upgradeSettings:
    maxSurge: 1
    maxUnavailable: 0
  nodeConfig:
    machineType: n2-standard-4 # 4 vCPU, 16 GB — a real general-purpose size
    diskSizeGb: 100
    diskType: pd-balanced # SSD-class performance at a lower price than pd-ssd
    # A dedicated minimal service account; workload permissions come from
    # Workload Identity, not node scopes.
    serviceAccount:
      valueFrom:
        kind: GcpServiceAccount
        name: gke-nodes # replace with your GcpServiceAccount resource name
        fieldPath: status.outputs.email
    shieldedInstanceConfig:
      enableSecureBoot: true # on unless you load unsigned kernel modules
