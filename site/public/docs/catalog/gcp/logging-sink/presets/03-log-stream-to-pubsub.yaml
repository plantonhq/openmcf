apiVersion: gcp.planton.dev/v1alpha1
kind: GcpLoggingSink
metadata:
  name: log-stream
spec:
  destination:
    pubsubTopic:
      value: projects/my-project/topics/log-stream
  exclusions:
    - name: sample-debug-noise
      filter: severity<=DEBUG AND sample(insertId, 0.9)
      description: Keep only 10% of debug entries in the stream
  description: Streams logs to the external observability pipeline
