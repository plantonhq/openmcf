apiVersion: gcp.planton.dev/v1
kind: GcpDataprocAutoscalingPolicy
metadata:
  name: aggressive-batch
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  policyId: aggressive-batch
  location: us-central1

  # Keep the on-demand base small — just enough for HDFS stability.
  workerConfig:
    maxInstances: 4
    minInstances: 2
    weight: 1

  # Secondary-heavy: weight 4 sends ~80% of new capacity to the spot
  # group, which scales to zero the moment the queue drains.
  secondaryWorkerConfig:
    maxInstances: 50
    minInstances: 0
    weight: 4

  basicAlgorithm:
    cooldownPeriod: "120s"
    yarnConfig:
      # Batch tasks are retryable — a short 5-minute drain window keeps
      # scale-down fast.
      gracefulDecommissionTimeout: "300s"
      # Maximum-speed scaling in both directions: act on everything the
      # YARN memory metrics suggest, every evaluation.
      scaleUpFactor: 1.0
      scaleDownFactor: 1.0
