apiVersion: gcp.planton.dev/v1alpha1
kind: GcpMonitoringUptimeCheck
metadata:
  name: api-health-authed
spec:
  timeout: 10s
  period: 300s
  monitoredResource:
    type: uptime_url
    labels:
      host: api.example.com
  httpCheck:
    path: /healthz
    useSsl: true
    validateSsl: true
    authInfo:
      username: probe
      password: your-probe-password
    acceptedResponseStatusCodes:
      - statusClass: STATUS_CLASS_2XX
  contentMatchers:
    - content: ok
      matcher: MATCHES_JSON_PATH
      jsonPathMatcher:
        jsonPath: "$.status"
        jsonMatcher: EXACT_MATCH
