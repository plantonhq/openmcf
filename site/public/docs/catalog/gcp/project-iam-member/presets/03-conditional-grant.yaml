apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: my-temporary-access-grant
spec:
  projectId:
    value: "<gcp-project-id>"
  role:
    value: roles/storage.objectViewer
  member:
    value: "user:<user-email>"  # conditions commonly gate human access
  condition:
    title: expires-end-of-quarter
    # CEL expression; the grant applies only while it evaluates true
    expression: request.time < timestamp("<expiry-timestamp>")  # e.g. "2027-01-01T00:00:00Z"
    description: Temporary read access for the data migration, auto-expires
