apiVersion: gcp.planton.dev/v1
kind: GcpBigtableTable
metadata:
  name: orders
spec:
  instance:
    valueFrom:
      kind: GcpBigtableInstance
      name: prod-bigtable
      fieldPath: status.outputs.instance_name

  columnFamilies:
    - family: order-data
      gcPolicy:
        # Keep both a version cap and an age bound: a cell is collected
        # when EITHER condition is met.
        mode: UNION
        maxAge: 8760h # 1 year
        maxVersions: 5

  # Retain a change-stream (CDC) feed for downstream Dataflow pipelines.
  # 1-7 days; consumers must keep up within the window.
  changeStreamRetention: 72h0m0s

  # Built-in automated backups: daily, retained 3 days.
  automatedBackupPolicy:
    retentionPeriod: 72h
    frequency: 24h
