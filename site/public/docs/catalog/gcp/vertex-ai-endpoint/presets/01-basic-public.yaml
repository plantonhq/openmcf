apiVersion: gcp.planton.dev/v1
kind: GcpVertexAiEndpoint
metadata:
  name: recommendations
spec:
  # Omitted projectId: the endpoint lands in the provider's default project.
  # Set projectId (literal or a GcpProject reference) to target another.
  #
  # Omitted endpointName: a stable numeric ID is derived from the resource
  # identity — the same manifest always produces the same endpoint ID.
  location: us-central1
  displayName: Recommendations Serving
  labels:
    team: ml-platform
  # Request/response logging: sample 10% of online predictions into the
  # given BigQuery dataset for drift monitoring and audit (the dataset
  # must already exist; the table is created on first write).
  requestResponseLoggingConfig:
    enabled: true
    samplingRate: 0.1
    bigqueryDestinationUri: bq://my-project.ml_logging
