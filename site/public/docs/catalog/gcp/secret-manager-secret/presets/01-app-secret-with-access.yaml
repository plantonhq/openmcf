apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSecretManagerSecret
metadata:
  name: db-password
spec:
  initialVersion:
    data:
      value: replace-with-real-secret
  iamMembers:
    - role: roles/secretmanager.secretAccessor
      member:
        value: serviceAccount:app@my-project.iam.gserviceaccount.com
