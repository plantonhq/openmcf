apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamDenyPolicy
metadata:
  name: block-destructive-apis
spec:
  parent:
    organizationId: "123456789012"
  displayName: Block project deletion org-wide
  rules:
    - description: Nobody deletes projects, anywhere in the org, except tagged sandboxes
      denyRule:
        deniedPrincipals:
          - principalSet://goog/public:all
        deniedPermissions:
          - cloudresourcemanager.googleapis.com/projects.delete
        denialCondition:
          expression: "!resource.matchTag('12345678/env', 'sandbox')"
          title: exempt-sandboxes
          description: Sandbox-tagged resources stay deletable for experimentation
  deletionPolicy: PREVENT
