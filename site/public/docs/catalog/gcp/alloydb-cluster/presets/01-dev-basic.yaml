apiVersion: gcp.planton.dev/v1
kind: GcpAlloydbCluster
metadata:
  name: my-dev-alloydb
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  clusterName: dev-alloydb # replace with your cluster name
  location: us-central1 # replace with your region
  network:
    value: projects/my-gcp-project-123/global/networks/dev-vpc # replace with your VPC path
  primaryInstance:
    instanceId: dev-primary # replace with your instance ID
    cpuCount: 2
    availabilityType: ZONAL
