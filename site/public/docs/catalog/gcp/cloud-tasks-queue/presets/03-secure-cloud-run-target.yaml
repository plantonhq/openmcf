apiVersion: gcp.planton.dev/v1
kind: GcpCloudTasksQueue
metadata:
  name: cloud-run-dispatch
spec:
  queueName: cloud-run-dispatch
  location: us-central1
  httpTarget:
    httpMethod: POST
    oidcToken:
      # The designed composition: reference the service account resource so
      # the queue dispatches with its identity wherever it is deployed.
      serviceAccountEmail:
        valueFrom:
          kind: GcpServiceAccount
          name: task-invoker
          fieldPath: status.outputs.email
      # For Cloud Run, the audience is the service URL. Replace with the
      # real URL of the receiving service.
      audience: https://my-service-abc123-uc.a.run.app
    uriOverride:
      scheme: HTTPS
      # Every task in the queue is routed to this host regardless of the
      # URI the producer enqueued — the queue owns routing.
      host: my-service-abc123-uc.a.run.app # replace with your Cloud Run host
      enforceMode: ALWAYS
    headerOverrides:
      - key: Content-Type
        value: application/json
  rateLimits:
    maxDispatchesPerSecond: 100
    maxConcurrentDispatches: 50
  retryConfig:
    maxAttempts: 3
    minBackoff: "5s"
    maxBackoff: "300s"
    maxDoublings: 4
  stackdriverLoggingConfig:
    # Full sampling: every dispatch is logged — the production-observability
    # posture for security-sensitive queues.
    samplingRatio: 1.0
