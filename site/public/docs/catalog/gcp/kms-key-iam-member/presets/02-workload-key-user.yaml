apiVersion: gcp.planton.dev/v1
kind: GcpKmsKeyIamMember
metadata:
  name: my-app-key-user-grant
spec:
  cryptoKeyId:
    valueFrom:
      kind: GcpKmsKey
      name: <kms-key-resource-name>
      fieldPath: status.outputs.key_id
  role:
    value: roles/cloudkms.cryptoKeyEncrypterDecrypter
  member:
    # The workload's own identity; its `member` output is the ready-made
    # serviceAccount:<email> string.
    valueFrom:
      kind: GcpServiceAccount
      name: <service-account-resource-name>
      fieldPath: status.outputs.member
