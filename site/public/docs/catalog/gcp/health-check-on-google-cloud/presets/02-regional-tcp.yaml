apiVersion: gcp.planton.dev/v1alpha1
kind: GcpHealthCheck
metadata:
  name: my-internal-tcp-probe
spec:
  projectId:
    value: "<gcp-project-id>"
  # A set region creates a REGIONAL health check — required by regional
  # backend services (internal load balancers) and regional MIGs.
  region: us-central1  # replace with your region
  description: TCP connectability probe for the internal service tier
  tcp:
    port: 5432  # replace: the fixed port your service listens on
  # Slightly relaxed cadence for an internal tier: ~20s detection.
  checkIntervalSec: 10
  timeoutSec: 5
