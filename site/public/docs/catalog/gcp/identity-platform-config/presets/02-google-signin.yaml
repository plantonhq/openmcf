apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIdentityPlatformConfig
metadata:
  name: app-auth
spec:
  signIn:
    email:
      enabled: true
      passwordRequired: true
  defaultSupportedIdps:
    - idpId: google.com
      # Both values come from the Google Cloud console's OAuth consent
      # screen (APIs & Services -> Credentials) — consent-screen clients
      # have no programmatic creation path.
      clientId: 000000000000-placeholder.apps.googleusercontent.com
      # Managed secret — the platform stores a reference and resolves it
      # at deploy; this literal is a placeholder shape.
      clientSecret: GOCSPX-placeholder
