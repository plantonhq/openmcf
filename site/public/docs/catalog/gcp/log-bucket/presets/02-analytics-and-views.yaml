apiVersion: gcp.planton.dev/v1alpha1
kind: GcpLogBucket
metadata:
  name: analytics-and-views
spec:
  bucketId: app-logs
  retentionDays: 90
  description: Application logs — SQL analytics on, stderr view granted to on-call
  enableAnalytics: true
  # View filters speak a RESTRICTED grammar — log source, resource type,
  # apphub fields, user labels, or LOG_ID() only; severity is NOT a legal
  # view dimension (GCP rejects it at create).
  logViews:
    - viewId: run-stderr
      filter: resource.type="cloud_run_revision" AND LOG_ID("run.googleapis.com/stderr")
      description: The on-call slice — Cloud Run stderr without the noise
  linkedBigqueryDataset:
    linkId: app_logs
    description: Read-only BigQuery access to the app-logs bucket
