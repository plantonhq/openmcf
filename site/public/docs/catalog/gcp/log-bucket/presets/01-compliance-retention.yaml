apiVersion: gcp.planton.dev/v1alpha1
kind: GcpLogBucket
metadata:
  name: compliance-retention
spec:
  bucketId: audit-logs
  retentionDays: 400
  description: Audit archive — 400-day retention per compliance policy
  indexConfigs:
    - fieldPath: jsonPayload.request.status
      type: INDEX_TYPE_INTEGER
  deletionPolicy: PREVENT
