apiVersion: gcp.planton.dev/v1
kind: GcpGcsBucket
metadata:
  name: app-data
spec:
  bucketName: acme-app-data-prod # replace — globally unique across ALL of GCP
  location: us-central1 # replace — co-locate with the workloads that read it
  # The modern security posture: IAM-only access, no public access ever.
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  # Overwrites and deletes keep the previous version...
  versioningEnabled: true
  lifecycleRules:
    # ...and version history is bounded: keep the 3 newest noncurrent
    # versions, delete older ones.
    - action:
        type: Delete
      condition:
        withState: ARCHIVED
        numNewerVersions: 3
  iamMembers:
    # The application service account reads and writes objects (reference
    # your GcpServiceAccount resource; its member output is exactly this
    # value).
    - role: roles/storage.objectAdmin
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: app-runtime
          fieldPath: status.outputs.member
  labels:
    team: platform # replace with your cost-attribution labels
