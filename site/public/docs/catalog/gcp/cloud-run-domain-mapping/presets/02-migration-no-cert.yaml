apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunDomainMapping
metadata:
  name: migrating-domain
spec:
  region: us-central1
  # MUST already be verified by the deploying identity (Search Console /
  # `gcloud domains verify`) — GCP rejects the mapping otherwise.
  domain: www.example.com
  route:
    valueFrom:
      kind: GcpCloudRun
      name: my-service
      fieldPath: status.outputs.service_name
  # NONE: no managed certificate yet. The mapping exists and emits its
  # DNS records while the domain still serves from its old host — flip to
  # AUTOMATIC (a cheap replacement) once DNS has cut over.
  certificateMode: NONE
  # Protects the mapping during the cutover window: a destroy fails
  # instead of silently un-mapping a domain mid-migration.
  deletionPolicy: PREVENT
