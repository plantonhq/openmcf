apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSubscription
metadata:
  name: webhook-delivery
spec:
  subscriptionName: webhook-delivery
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: user-events
      fieldPath: status.outputs.topic_id
  ackDeadlineSeconds: 30
  pushConfig:
    pushEndpoint: https://my-app-529430244813.us-central1.run.app/webhook
    oidcToken:
      # Reference the invoker identity; the FK resolves to its email.
      # The deployer must hold iam.serviceAccounts.actAs on this account.
      serviceAccountEmail:
        valueFrom:
          kind: GcpServiceAccount
          name: push-invoker
          fieldPath: status.outputs.email
      # Defaults to the push endpoint URL when omitted; Cloud Run
      # audiences typically use the service URL.
      audience: https://my-app-529430244813.us-central1.run.app
