apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSubscription
metadata:
  name: payment-processing
spec:
  subscriptionName: payment-processing
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: payment-events
      fieldPath: status.outputs.topic_id
  ackDeadlineSeconds: 60
  # 14-day backlog with acked-message retention: the replay window for
  # reprocessing after a consumer bug.
  messageRetentionDuration: "1209600s"
  retainAckedMessages: true
  enableExactlyOnceDelivery: true
  # Poison messages divert to the DLQ topic after 10 failed deliveries
  # instead of blocking the stream forever.
  deadLetterPolicy:
    deadLetterTopic:
      valueFrom:
        kind: GcpPubSubTopic
        name: payments-dlq
        fieldPath: status.outputs.topic_id
    maxDeliveryAttempts: 10
  # Exponential backoff between retries instead of hot-looping a
  # failing consumer.
  retryPolicy:
    minimumBackoff: "30s"
    maximumBackoff: "300s"
  # Never expire this subscription, even if consumers go quiet.
  expirationPolicy:
    ttl: ""
