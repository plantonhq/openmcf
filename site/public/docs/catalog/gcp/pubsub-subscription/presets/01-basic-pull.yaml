apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSubscription
metadata:
  name: order-events-worker
spec:
  # Omitted projectId: the subscription lands in the provider's default
  # project. Set projectId to target another.
  subscriptionName: order-events-worker
  # Reference the topic resource; the FK resolves to the fully qualified
  # projects/{project}/topics/{name} path. Immutable after creation.
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: order-events
      fieldPath: status.outputs.topic_id
