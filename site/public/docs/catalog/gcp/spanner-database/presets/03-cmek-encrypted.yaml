apiVersion: gcp.planton.dev/v1
kind: GcpSpannerDatabase
metadata:
  name: payments-db
spec:
  # project_id omitted: falls back to the provider's default project.
  instance:
    valueFrom:
      kind: GcpSpannerInstance
      name: prod-spanner # replace with your instance resource name
      fieldPath: status.outputs.instance_name
  encryptionConfig:
    # Regional CMEK: the key must live in the instance config's location.
    # For multi-region instances use kmsKeyNames (one key per region).
    kmsKeyName:
      valueFrom:
        kind: GcpKmsKey
        name: spanner-cmek # replace with your key resource name
        fieldPath: status.outputs.key_id
  enableDropProtection: true
  versionRetentionPeriod: "3d"
  defaultTimeZone: UTC
