apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStorageClass
metadata:
  name: aws-ebs-gp3
spec:
  name: aws-ebs-gp3
  provisioner: ebs.csi.aws.com
  parameters:
    type: gp3
    encrypted: "true"
  volume_binding_mode: wait_for_first_consumer
  allow_volume_expansion: true
  is_default_class: false
