apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPerconaMongoOperator
metadata:
  name: psmdb-operator # also the Helm release name
spec:
  namespace:
    # Own-namespace watch (the upstream default): KubernetesMongodb
    # databases are declared in THIS namespace. Set watch.cluster_wide
    # or watch.namespaces to widen instead.
    value: percona-mongo
  create_namespace: true # the module creates (and owns) the namespace
  chart_version: "1.22.0" # spec default — chart and operator move together; pin deliberately
  # No version/usage pings to check.percona.com.
  disable_telemetry: true
  log:
    structured: true # JSON logs — the log-pipeline-friendly posture
  # Explicit control-plane sizing — the chart ships NO requests/limits
  # by default, and an unbounded control plane is a failure mode.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
