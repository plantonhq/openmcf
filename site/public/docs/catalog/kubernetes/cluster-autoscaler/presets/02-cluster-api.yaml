apiVersion: kubernetes.planton.dev/v1
kind: KubernetesClusterAutoscaler
metadata:
  name: cluster-autoscaler
spec:
  namespace:
    value: kube-system # upstream convention
  createNamespace: false
  chartVersion: "9.59.0" # spec default — pin deliberately
  clusterApi:
    # Chart default made explicit: both the workload cluster and the
    # Cluster API management objects live in THIS cluster. Kubeconfig
    # modes additionally need a kubeconfig_secret mounted per upstream's
    # Cluster API guidance.
    mode: incluster-incluster
    # Namespace fence: only MachineDeployments/MachineSets in this
    # namespace are considered for autoscaling.
    namespace: '<capi-cluster-namespace>'
    # Least-privilege posture: RBAC restricted to namespace scope
    # (rbac.clusterScoped=false) since the autoscaler only manages
    # machines in the fenced namespace.
    namespaceScopedRbac: true
