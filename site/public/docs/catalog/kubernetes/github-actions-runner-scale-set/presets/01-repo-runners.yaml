apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGhaRunnerScaleSet
metadata:
  # metadata.name is the fleet's GitHub registration name — workflows
  # target it with `runs-on: build-runners` (≤ 45 characters).
  name: build-runners
spec:
  namespace:
    value: ci-runners
  create_namespace: true
  github_config_url: https://github.com/my-org/my-repo
  auth:
    # The recommended posture: the credential lives in a Secret you
    # created (key `github_token`) — it never rides this manifest.
    #   kubectl create secret generic github-credential \
    #     --namespace ci-runners --from-literal=github_token='ghp_...'
    existing_secret_name: github-credential
  # Scale-to-zero: runners exist only while jobs run (one pod schedule
  # of cold-start latency per job).
  min_runners: 0
  max_runners: 10
