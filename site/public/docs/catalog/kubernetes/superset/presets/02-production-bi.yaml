apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSuperset
metadata:
  name: superset
spec:
  namespace:
    value: analytics
  create_namespace: false
  # Production posture: the composed metadata database plus a composed
  # Valkey cache — query caching, async SQL Lab execution through
  # Celery workers, and scheduled alerts & reports (beat). Both
  # credentials ride environment references to the composed resources'
  # own Secrets; nothing renders.
  metadata_database:
    host:
      value_from:
        kind: KubernetesPostgres
        name: superset-pg
        field_path: status.outputs.rw_service
    password_secret:
      secret_name:
        value_from:
          kind: KubernetesPostgres
          name: superset-pg
          field_path: status.outputs.password_secret.name
  cache:
    host:
      value_from:
        kind: KubernetesValkey
        name: superset-cache
        field_path: status.outputs.service
    password_secret:
      secret_name:
        value_from:
          kind: KubernetesValkey
          name: superset-cache
          field_path: status.outputs.password_secret.name
  web:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 3Gi
  worker:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 3Gi
  beat:
    enabled: true
  feature_flags:
    DASHBOARD_RBAC: true
    ALERT_REPORTS: true
