apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStrimziKafkaOperator
metadata:
  name: strimzi-operator
spec:
  namespace:
    value: strimzi-system # a dedicated control-plane namespace — clusters live elsewhere
  create_namespace: true
  chart_version: "1.1.0"
  watch:
    # One operator, every namespace (cluster-wide RBAC). KubernetesKafka
    # clusters can be declared in any namespace on the cluster.
    any_namespace: true
  # A cluster-wide control plane reconciling many Kafka clusters
  # deserves explicit sizing (the chart defaults: requests 200m/384Mi,
  # limits 1000m/384Mi — the memory headroom is what matters at scale).
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
