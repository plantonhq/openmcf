apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTrino
metadata:
  name: trino
spec:
  namespace:
    value: analytics
  create_namespace: false
  # Production posture: percent-based JVM heaps that follow the
  # container limits, autoscaled workers that drain gracefully before
  # termination, JMX metrics scraped by the Prometheus operator, and a
  # composed PostgreSQL catalog — the warehouse becomes queryable as
  # `SELECT ... FROM warehouse.<schema>.<table>` and JOINs against any
  # other catalog. The catalog password never renders: it reaches
  # Trino as an environment variable the catalog references through
  # `${ENV:...}` (Trino's own secrets mechanism).
  coordinator:
    jvm:
      max_heap_percent: 70
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
  workers:
    jvm:
      max_heap_percent: 75
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        memory: 6Gi
    graceful_shutdown:
      enabled: true
    hpa:
      max_replicas: 6
      target_cpu_utilization_percent: 60
  catalogs:
    # Keep the samples off in production — only declared data sources.
    sample_catalogs_enabled: false
    postgres:
      - name: warehouse
        # The host and credential compose a KubernetesPostgres named
        # `warehouse-pg` — swap the ref names for yours.
        host:
          value_from:
            kind: KubernetesPostgres
            name: warehouse-pg
            field_path: status.outputs.rw_service
        database: warehouse
        password_secret:
          secret_name:
            value_from:
              kind: KubernetesPostgres
              name: warehouse-pg
              field_path: status.outputs.password_secret.name
  metrics:
    enabled: true
    service_monitor_enabled: true
