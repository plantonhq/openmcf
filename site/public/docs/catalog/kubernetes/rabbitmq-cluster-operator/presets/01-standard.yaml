apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRabbitMqOperator
metadata:
  name: rabbitmq-operator
# The release manifest's own defaults ARE the production-standard
# posture: the operator watching ALL namespaces (the upstream default),
# the pinned images, 200m CPU / 500Mi memory requests and limits, one
# replica. The namespace is fixed at rabbitmq-system and there is no
# version field — the operator is pinned to the release the catalog's
# typed SDK was generated against.
spec: {}
