apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIngressNginx
metadata:
  name: ingress-nginx
spec:
  namespace:
    value: ingress-nginx
  createNamespace: true
  controllerKind: daemon_set # one controller pod per node
  hostPorts: true # listeners on node ports 80/443 via hostPort (CNI-friendly)
  service:
    type: node_port # no cloud LB controller on bare metal — a load_balancer type would time out at install
