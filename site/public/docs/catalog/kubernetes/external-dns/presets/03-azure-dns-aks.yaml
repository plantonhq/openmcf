apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalDns
metadata:
  name: my-external-dns-azure
spec:
  namespace:
    value: external-dns
  createNamespace: true
  azureDns:
    resourceGroup: '<dns-zone-resource-group>'
    subscriptionId: '<azure-subscription-id>'
    zoneIdFilters:
      - value: '<azure-dns-zone-id>'
  workloadIdentity:
    aks:
      clientId:
        value: '<managed-identity-client-id>'
  sources:
    - service
    - ingress
  policy: sync # dedicated zone: full reconciliation, including deletes of owned records
  txtOwnerId: '<cluster-name>' # must be distinct per instance sharing a zone
  domainFilters:
    - '<example.com>'
