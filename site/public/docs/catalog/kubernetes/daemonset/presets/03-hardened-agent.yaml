apiVersion: kubernetes.planton.dev/v1
kind: KubernetesDaemonSet
metadata:
  name: my-hardened-agent
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-agent-image>"
        tag: "<your-image-tag>"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
          emptyDir:
            sizeLimit: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  pod:
    serviceAccount:
      valueFrom:
        kind: KubernetesServiceAccount
        name: "<your-service-account-resource>"
        fieldPath: "status.outputs.service_account_name"
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
