apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGhaRunnerScaleSetController
metadata:
  name: arc
spec:
  namespace:
    value: arc-system
  create_namespace: true
  # Everything else is the chart's defaults: one replica watching all
  # namespaces — every KubernetesGhaRunnerScaleSet on the cluster is
  # served by this one controller (the sane default; fence with
  # flags.watch_single_namespace only for hard multi-tenancy).
