apiVersion: kubernetes.planton.dev/v1
kind: KubernetesManifest
metadata:
  name: config-bundle
spec:
  namespace:
    value: app-config
  create_namespace: true
  manifest_yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: app-settings
    data:
      LOG_LEVEL: info
      CACHE_TTL_SECONDS: "300"
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: app-credentials
    type: Opaque
    stringData:
      api-key: "<your-api-key>"
