apiVersion: kubernetes.planton.dev/v1
kind: KubernetesManifest
metadata:
  name: vendor-install
spec:
  namespace:
    value: vendor-system
  create_namespace: true
  skip_await: true
  manifest_yaml: |
    # Replace everything below with the vendor's published install
    # manifest, pasted exactly as downloaded — for example the contents of:
    #   https://github.com/<vendor>/<project>/releases/download/<version>/install.yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: replace-with-vendor-manifest
