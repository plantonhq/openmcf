apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarapace
metadata:
  name: dev-registry
spec:
  namespace:
    value: dev-registry
  create_namespace: true
  kafka:
    # The Kafka cluster that stores the schemas (a KubernetesKafka
    # reference in an infra chart; the literal is its in-cluster
    # bootstrap endpoint). PLAINTEXT is the default protocol — fine
    # against a dev cluster's plain listener.
    bootstrap_servers:
      value: dev-kafka-kafka-bootstrap.dev-kafka.svc.cluster.local:9092
  # Everything else rides the defaults: one replica, the _schemas
  # topic (created on first start, RF 1 — dev only), BACKWARD
  # compatibility, port 8081, INFO logs.
