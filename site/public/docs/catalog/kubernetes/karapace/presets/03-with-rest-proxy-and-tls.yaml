apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarapace
metadata:
  name: secure-registry
spec:
  namespace:
    value: kafka
  # ONE replica, deliberately: with server_tls, followers forward
  # writes to the leader at its POD IP — which a DNS-name certificate
  # does not cover. Multi-replica TLS postures terminate TLS at an
  # Ingress/Gateway in front of plain-HTTP replicas instead (the spec
  # carries this caveat on the field).
  replicas: 1
  kafka:
    bootstrap_servers:
      value: events-kafka-bootstrap.kafka.svc.cluster.local:9092
  # Serve the registry API over HTTPS from a certificate Secret — the
  # cert-manager seam: a KubernetesCertificate reference in an infra
  # chart (cert-manager writes tls.crt/tls.key, the defaults).
  server_tls:
    secret_name:
      value: secure-registry-tls
  # HTTP Basic authentication: a Karapace authfile (JSON
  # users/permissions document) mounted from a Secret under the
  # authfile.json key; the engine hot-reloads it on change. /_health
  # stays unauthenticated so probes keep working.
  http_authentication:
    basic:
      secret_name:
        value: secure-registry-authfile
  # The REST-PROXY role: the same engine as a second Deployment
  # (<name>-rest) — produce/consume/admin over HTTP, wired to this
  # registry for schema-aware payloads. Always plain HTTP (server_tls
  # covers the registry API only).
  rest_proxy:
    enabled: true
    replicas: 1
    port: 8082
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
