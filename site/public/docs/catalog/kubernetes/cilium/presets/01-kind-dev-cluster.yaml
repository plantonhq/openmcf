apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCilium
metadata:
  name: cilium
spec:
  namespace:
    value: kube-system # upstream convention — the agent is cluster infrastructure
  createNamespace: false # kube-system always exists
  ipam:
    # kind's control plane already allocates per-node PodCIDRs — use them.
    mode: kubernetes
  operator:
    # Single-node dev cluster: the chart-default 2 replicas cannot both
    # schedule under pod anti-affinity and the rollout never settles.
    replicas: 1
