apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHorizontalPodAutoscaler
metadata:
  name: behavior-tuned
spec:
  name: behavior-tuned
  namespace:
    value: "<your-namespace>"
  scale_target:
    name:
      value: "<your-workload-name>"
  min_replicas: 2
  max_replicas: 20
  metrics:
    - type: resource
      resource:
        name: cpu
        target:
          type: utilization
          average_utilization: 60
  behavior:
    scale_down:
      stabilization_window_seconds: 600
      policies:
        - type: percent
          value: 10
          period_seconds: 60
