apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHorizontalPodAutoscaler
metadata:
  name: queue-driven
spec:
  name: queue-driven
  namespace:
    value: "<your-namespace>"
  scale_target:
    name:
      value: "<your-workload-name>"
  min_replicas: 1
  max_replicas: 30
  metrics:
    - type: external
      external:
        metric:
          name: queue_messages_ready
          match_labels:
            queue: "<your-queue-name>"
        target:
          type: average_value
          average_value: "30"
