apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRbac
metadata:
  name: app-reader
spec:
  namespaceScope:
    namespace:
      value: "<your-namespace>"
  createRole:
    rules:
      - verbs: ["get", "list", "watch"]
        apiGroups: [""]
        resources: ["pods", "services", "configmaps"]
  subjects:
    - serviceAccount:
        name:
          value: "<your-service-account>"
