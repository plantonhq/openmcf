apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSolrOperator
metadata:
  name: solr-operator-search
spec:
  namespace:
    value: solr-operator
  create_namespace: true
  # Fence the operator to an explicit namespace set: KubernetesSolr
  # resources anywhere else are ignored by this install. The
  # namespaces need only exist by the time SolrCloud resources appear
  # in them. (Empty = watch ALL namespaces, the chart default.)
  watch_namespaces:
    - search
    - search-staging
  # A warm standby: extra replicas are leader-elected — one active
  # reconciler, instant takeover when the leader's node dies.
  replicas: 2
  # Explicit sizing for quota-governed namespaces — the chart ships no
  # default resources (the operator is lightweight).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
