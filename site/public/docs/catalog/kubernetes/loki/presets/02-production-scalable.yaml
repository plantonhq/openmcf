apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLoki
metadata:
  name: prod-loki
spec:
  namespace:
    value: logging
  create_namespace: true
  # Write/read/backend tiers that scale independently — the production
  # shape. REQUIRES object storage; this points at an in-cluster
  # KubernetesSeaweedFs S3 endpoint (swap in AWS S3 by dropping the
  # endpoint and setting a region, or leave credentials empty for keyless
  # IRSA).
  simple_scalable:
    write_replicas: 3
    read_replicas: 3
    backend_replicas: 3
    disk_size: 20Gi
  storage:
    s3:
      bucket: loki-chunks
      endpoint: http://seaweedfs-s3.storage.svc.cluster.local:8333
      force_path_style: true
      insecure: true
      credentials:
        access_key_id_secret:
          name: loki-object-store
          key: access-key-id
        secret_access_key_secret:
          name: loki-object-store
          key: secret-access-key
  # Keep 31 days of logs; the compactor enforces it.
  retention_period: 744h
  limits:
    ingestion_rate_mb: 16
    max_global_streams_per_user: 25000
