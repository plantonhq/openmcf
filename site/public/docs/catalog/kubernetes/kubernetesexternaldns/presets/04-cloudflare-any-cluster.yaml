apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalDns
metadata:
  name: my-external-dns-cloudflare
spec:
  namespace:
    value: external-dns
  createNamespace: true
  cloudflare:
    apiToken: '<cloudflare-api-token>' # materialized as a Kubernetes Secret, never in chart values
    zoneIdFilters:
      - value: '<cloudflare-zone-id>'
    proxied: true # orange-cloud: CDN/WAF in front of created records
  sources:
    - service
    - ingress
  policy: upsert-only # safe default for zones shared with hand-managed records
  txtOwnerId: '<cluster-name>' # must be distinct per instance sharing a zone
  domainFilters:
    - '<example.com>'
