apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesVelero
metadata:
  name: velero
spec:
  namespace:
    value: velero # upstream convention
  createNamespace: true # the module creates (and owns) the namespace
  chartVersion: "12.1.0" # spec default — pin deliberately
  crds:
    upgradeOnInstall: true # chart default — keeps the pinned CRDs current across chart upgrades
    # Chart default — backup records survive removing the component (the
    # DR-safety posture; upstream reserves the cleanup switch for CI).
    cleanupOnUninstall: false
  backupStorage:
    s3:
      bucket: '<velero-backups-bucket>'
      region: '<aws-region>'
      # IRSA: the keyless posture on EKS — the role's trust policy must
      # allow the cluster's OIDC provider and Velero's service account.
      # Replace the account id and role name.
      irsaRoleArn: arn:aws:iam::123456789012:role/velero-backups
    # One bucket, one prefix per cluster — the multi-cluster pattern.
    prefix: '<cluster-name>'
  volumeSnapshots:
    enabled: true # chart default — the default VolumeSnapshotLocation for AWS
    # CSI snapshots: PVCs snapshot through the CSI snapshot API instead of
    # provider-native instance snapshots — the modern path on EKS with the
    # EBS CSI driver.
    enableCsi: true
  schedules:
    - name: nightly
      schedule: 0 2 * * * # 02:00 every night
      ttl: 720h # Velero default — 30 days of nightly backups before GC
