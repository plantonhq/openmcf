apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesVelero
metadata:
  name: velero
spec:
  namespace:
    value: velero # upstream convention
  createNamespace: true
  chartVersion: "12.1.0" # spec default — pin deliberately
  crds:
    upgradeOnInstall: true # chart default
    cleanupOnUninstall: false # chart default — backup records survive uninstall
  backupStorage:
    gcs:
      bucket: '<velero-backups-bucket>'
      # Workload Identity: the keyless posture on GKE — the GSA needs
      # storage permissions on the bucket and a WI binding to Velero's
      # Kubernetes service account. Replace with your GSA email
      # (placeholder value; the field requires the gserviceaccount.com
      # email format).
      workloadIdentityServiceAccountEmail: velero-backups@my-project.iam.gserviceaccount.com
    prefix: '<cluster-name>' # one bucket, one prefix per cluster
  fsBackup:
    # Node-agent DaemonSet (kopia): reads volume data directly from pods —
    # works on ANY volume type. Runs privileged host-path mounts of the
    # kubelet pod directory; that is how it reads volume data.
    deployNodeAgent: true
    # Opt-in per pod via the backup.velero.io/backup-volumes annotation;
    # flip this to true to fs-backup every pod volume by default.
    defaultVolumesToFsBackup: false
  schedules:
    - name: nightly
      schedule: 0 2 * * *
      ttl: 720h # Velero default — 30 days
