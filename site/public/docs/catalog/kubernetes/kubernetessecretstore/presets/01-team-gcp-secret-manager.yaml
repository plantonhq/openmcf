apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSecretStore
metadata:
  name: team-gcp-secret-manager
spec:
  namespace:
    value: <team-namespace>
  config:
    gcpSecretManager:
      projectId:
        value: <gcp-project-id>
      serviceAccountName:
        value: <team-secrets-reader-service-account>
      # ServiceAccount defaults to the store's own namespace on a SecretStore
