apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRayCluster
metadata:
  name: ray-lab
spec:
  namespace:
    value: ml-platform
  createNamespace: true
  rayVersion: 2.52.0
  head:
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    scheduleTasksOnHead: true
