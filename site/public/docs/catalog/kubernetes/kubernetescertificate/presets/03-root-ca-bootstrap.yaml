apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCertificate
metadata:
  name: root-ca
spec:
  namespace:
    value: "<your-namespace>"
  secretName: root-ca-tls
  issuerRef:
    issuer:
      name:
        value: "<selfsigned-issuer-name>"
  commonName: root-ca
  isCa: true
  privateKey:
    algorithm: ecdsa
    size: 256
  duration: 87600h
