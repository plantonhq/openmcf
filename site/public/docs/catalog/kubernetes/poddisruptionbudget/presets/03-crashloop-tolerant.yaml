apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPodDisruptionBudget
metadata:
  name: crashloop-tolerant
spec:
  name: crashloop-tolerant
  namespace:
    value: "<your-namespace>"
  selector:
    match_labels:
      app: "<your-workload-name>"
  min_available: "1"
  unhealthy_pod_eviction_policy: always_allow
