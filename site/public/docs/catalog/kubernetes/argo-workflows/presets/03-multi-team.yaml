apiVersion: kubernetes.planton.dev/v1
kind: KubernetesArgoWorkflows
metadata:
  name: team-a-workflows
spec:
  namespace:
    value: team-a-workflows
  create_namespace: true
  controller:
    # This controller claims an instance ID: it reconciles ONLY
    # Workflows labeled `workflows.argoproj.io/controller-instanceid:
    # team-a` and ignores everything else — several engines coexist in
    # one cluster without stealing each other's work.
    instance_id: team-a
    # The runner identity also lands in these namespaces (each gets the
    # ServiceAccount + Role/RoleBinding), so the team's app namespaces
    # can run workflows without their own install.
    workflow_namespaces:
      - team-a-apps
      - team-a-batch
    # Caps keep one noisy pipeline from starving the cluster.
    parallelism: 50
    namespace_parallelism: 20
  server:
    enabled: true
    auth_modes:
      - client
  # A team-scoped runner name keeps IRSA/workload-identity annotations
  # and RBAC grants unmistakably this team's.
  workflow_service_account: team-a-runner
  retention_policy:
    completed: 10
    failed: 5
    errored: 5
