apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSignoz
metadata:
  name: observability
spec:
  namespace:
    value: telemetry
  # Production posture against a composed KubernetesClickHouse named
  # "telemetry" in this same namespace (its own preset carries the
  # production database sizing): TLS on the database connection, alert
  # email over secret-safe SMTP, the external URL that makes alert
  # links resolve, and an autoscaling ingestion collector.
  clickhouse:
    host:
      valueFrom:
        kind: KubernetesClickHouse
        name: telemetry
        fieldPath: status.outputs.service_name
    cluster_name:
      valueFrom:
        kind: KubernetesClickHouse
        name: telemetry
        fieldPath: status.outputs.cluster_name
    username: signoz
    password_secret:
      secret_name:
        valueFrom:
          kind: KubernetesClickHouse
          name: telemetry
          fieldPath: status.outputs.auth_secret_name
      secret_key: signoz
    secure: true
    verify: true
  server:
    disk_size: 5Gi
    external_url: https://signoz.example.com
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    smtp:
      address: smtp.example.com:587
      from: signoz@example.com
      username: signoz-mailer
      password_secret:
        name: signoz-smtp-auth
        key: password
  otel_collector:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    autoscaling:
      enabled: true
      min_replicas: 2
      max_replicas: 8
  cluster_name: production-primary
