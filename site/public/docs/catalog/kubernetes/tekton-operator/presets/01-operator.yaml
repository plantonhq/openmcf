apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTektonOperator
metadata:
  name: tekton-operator
spec: {}
  # The operator needs no configuration: it installs from the pinned
  # official release manifest into its fixed `tekton-operator` namespace
  # with automatic component installation DISABLED — installing the
  # operator alone deploys no Tekton components. Declare a
  # KubernetesTekton resource to choose the profile, feature flags and
  # pruner policy; the operator reconciles that declaration. The typed
  # overrides (images, resources, scheduling) exist for air-gapped and
  # quota-governed clusters.
