apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCronJob
metadata:
  name: my-monthly-report
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  # 02:00 on the first day of every month.
  schedule: "0 2 1 * *"
  timeZone: "<your-iana-time-zone>"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    container:
      app:
        image:
          repo: "<your-container-registry>/<your-report-image>"
          tag: "<your-image-tag>"
        command:
          - /bin/sh
          - -c
          - "<your-report-command>"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
    completionMode: Indexed
    completions: 6
    parallelism: 3
    restartPolicy: Never
    backoffLimitPerIndex: 2
    activeDeadlineSeconds: 14400
