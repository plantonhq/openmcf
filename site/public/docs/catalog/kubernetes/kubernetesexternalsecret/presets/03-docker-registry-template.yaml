apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalSecret
metadata:
  name: registry-pull-secret
spec:
  namespace:
    value: <app-namespace>
  storeRef:
    name:
      value: <cluster-secret-store-name>
    kind: ClusterSecretStore # SecretStore (the default) for a namespaced store
  target:
    name: registry-pull-secret # what pods reference in imagePullSecrets
    template:
      type: kubernetes.io/dockerconfigjson
      # mergePolicy defaults to Replace: only the templated key lands in the
      # Secret; the synced username/password keys are template inputs only
      data:
        .dockerconfigjson: '{"auths":{"<registry-server>":{"username":"{{ .username }}","password":"{{ .password }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: <registry-credentials-backend-key>
        property: username
    - secretKey: password
      remoteRef:
        key: <registry-credentials-backend-key>
        property: password
