apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalSecret
metadata:
  name: app-database-credentials
spec:
  namespace:
    value: <app-namespace>
  storeRef:
    name:
      value: <cluster-secret-store-name>
    kind: ClusterSecretStore # SecretStore (the default) for a namespaced store
  refreshInterval: 1h # upstream default; rotation propagates within this window
  data:
    - secretKey: username
      remoteRef:
        key: <backend-secret-path> # e.g. prod/app/database
        property: username # field within the structured backend entry
    - secretKey: password
      remoteRef:
        key: <backend-secret-path>
        property: password
