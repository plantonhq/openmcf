apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNetworkPolicy
metadata:
  name: allow-from-namespace
spec:
  name: allow-from-namespace
  namespace:
    value: "<your-namespace>"
  pod_selector:
    match_labels:
      app: "<your-workload-name>"
  policy_types:
    - ingress
  ingress_rules:
    - from:
        - namespace_selector:
            match_labels:
              kubernetes.io/metadata.name: "<source-namespace>"
      ports:
        - protocol: TCP
          port: "8080"
