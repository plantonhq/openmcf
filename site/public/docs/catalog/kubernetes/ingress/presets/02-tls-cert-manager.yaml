apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngress
metadata:
  name: secure-web
spec:
  name: secure-web
  namespace:
    value: web
  ingress_class_name: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - app.example.com
      secret_name:
        value: app-example-com-tls
  rules:
    - host: app.example.com
      paths:
        - path: /
          path_type: prefix
          backend:
            service_name:
              value: web-svc
            port_number: 8080
