apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafka
metadata:
  name: prod-kafka
spec:
  namespace:
    value: kafka
  create_namespace: true
  node_pools:
    # Separate pools — the production norm: brokers scale without
    # disturbing the metadata quorum. Three controllers tolerate one
    # loss; keep controller counts odd.
    - name: controller
      roles:
        - controller
      replicas: 3
      storage:
        size: 20Gi
        storage_class:
          value: <fast-ssd-storage-class>
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
    - name: broker
      roles:
        - broker
      replicas: 3
      # JBOD: multiple persistent volumes per broker, striped across —
      # the high-throughput shape. Volume IDs are part of the on-disk
      # layout; never renumber existing volumes.
      storage:
        type: jbod
        volumes:
          - id: 0
            size: 500Gi
            storage_class:
              value: <fast-ssd-storage-class>
            kraft_metadata: true
          - id: 1
            size: 500Gi
            storage_class:
              value: <fast-ssd-storage-class>
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 8Gi
  listeners:
    # SCRAM over TLS for applications, mutual TLS for services with
    # certificate identity — both credential flavors issued by
    # KubernetesKafkaUser resources.
    - name: scram
      port: 9092
      tls: true
      authentication:
        type: scram-sha-512
    - name: mtls
      port: 9093
      tls: true
      authentication:
        type: tls
  # The durability contract: RF 3 + min ISR 2 survives one broker loss
  # without losing acknowledged writes (producers using acks=all).
  # Values are Kafka configuration STRINGS — the operator serializes
  # them into Java properties.
  config:
    default.replication.factor: "3"
    min.insync.replicas: "2"
    offsets.topic.replication.factor: "3"
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    auto.create.topics.enable: "false"
  # simple = Kafka's built-in ACL authorizer, enforcing the ACLs
  # declared on KubernetesKafkaUser resources. Super users FIRST —
  # turning on an authorizer without them can lock every client out.
  authorization:
    type: simple
    super_users:
      - User:CN=platform-admin
  # Spread partition replicas across zones and fetch from the closest
  # replica. Requires zone-labeled nodes.
  rack:
    topology_key: topology.kubernetes.io/zone
  # JMX Prometheus metrics (port 9404 in the pods) + consumer-lag
  # metrics from the exporter — the pair covers broker health and
  # client backlog.
  metrics:
    enabled: true
  kafka_exporter:
    enabled: true
  # CA policy: two-year cluster CA renewed 60 days out; one-year
  # clients CA renewed 30 days out. Renewal-triggered rolling updates
  # run only in the Sunday 00:00-03:59 window.
  cluster_ca:
    validity_days: 730
    renewal_days: 60
  clients_ca:
    validity_days: 365
    renewal_days: 30
  maintenance_time_windows:
    - "* * 0-3 ? * SUN"
  # Fixed heap (Xms = Xmx): heap growth causes GC pauses that look
  # like broker failures to the controller quorum. The rest of the
  # container memory goes to the OS page cache Kafka relies on.
  jvm:
    xms: 4g
    xmx: 4g
