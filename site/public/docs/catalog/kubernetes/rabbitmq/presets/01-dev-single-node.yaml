apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRabbitMq
metadata:
  name: dev-rabbitmq
spec:
  namespace:
    value: dev-rabbitmq
  create_namespace: true
  # One node — the spec default, stated for the reader. No redundancy:
  # a restart interrupts the broker. Production runs an ODD count
  # (3, 5, 7); growing later is only a replicas change (scaling DOWN
  # is not supported by the operator — size down by migrating).
  replicas: 1
  # EPHEMERAL: the CR's storage-0 + emptyDir posture — every queue,
  # message and user vanishes with each pod restart. Throwaway dev
  # only. Mutually exclusive with disk_size / storage_class (the spec
  # rejects the combination).
  ephemeral: true
  # Small, and memory requests = limits ON PURPOSE: RabbitMQ derives
  # its memory high watermark from the container memory LIMIT, so the
  # same value on both keeps flow control honest even in dev. The
  # operator defaults (1 CPU / 2Gi requests, 2 CPU / 2Gi limits) are
  # more than a dev broker needs.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  # The operator default is 604800 seconds — 7 DAYS, deliberately
  # generous so draining production nodes never lose messages. A dev
  # cluster wants fast teardown instead.
  termination_grace_period_seconds: 60
