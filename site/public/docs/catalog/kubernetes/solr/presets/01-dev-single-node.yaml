apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSolr
metadata:
  name: dev-solr
spec:
  namespace:
    value: dev-solr
  create_namespace: true
  # One Solr node — enough for the full SolrCloud API surface, no
  # shard/replica placement to speak of.
  replicas: 1
  version: 9.10.0
  # Heap at the operator's own dev-sized default; keep it around half
  # the container memory when you raise resources.
  java_mem: -Xms300m -Xmx300m
  # A single-member provided ensemble, managed by the
  # zookeeper-operator the KubernetesSolrOperator chart bundles. One
  # member is NOT a quorum — any ZooKeeper restart pauses Solr — which
  # is fine for development only.
  zookeeper:
    provided:
      replicas: 1
  # Ephemeral: emptyDir, the operator default made explicit — data is
  # LOST whenever a pod leaves its node. Cores and collections here
  # are throwaway by design.
  storage:
    ephemeral: {}
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi
