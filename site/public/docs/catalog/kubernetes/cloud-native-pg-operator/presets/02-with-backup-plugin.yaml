apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCloudNativePgOperator
metadata:
  name: cnpg
spec:
  namespace:
    value: cnpg-system # upstream convention; the plugin installs here too
  create_namespace: true
  chart_version: "0.29.0" # spec default (ships operator 1.30.0) — pin deliberately
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # The Barman Cloud plugin — the object-store backup path for every
  # KubernetesPostgres on the cluster. A separate Helm release
  # ("plugin-barman-cloud") in the same namespace, installed after the
  # operator. REQUIRES cert-manager on the cluster (KubernetesCertManager):
  # the plugin's internal TLS certificates are cert-manager-issued and the
  # release fails to install without it.
  barman_cloud_plugin:
    enabled: true
    chart_version: "0.7.0" # spec default (ships plugin v0.13.0) — its own pin
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  priority_class_name: system-cluster-critical
