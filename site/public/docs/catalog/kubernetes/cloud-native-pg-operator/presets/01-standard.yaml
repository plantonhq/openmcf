apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCloudNativePgOperator
metadata:
  name: cnpg
spec:
  namespace:
    value: cnpg-system # upstream convention
  create_namespace: true # the module creates (and owns) the namespace
  chart_version: "0.29.0" # spec default (ships operator 1.30.0) — pin deliberately
  # Chart default — one operator replica; extras are leader-elected warm
  # standbys that shorten failover of the OPERATOR itself, not capacity.
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Databases stop failing over without their operator — keep it above
  # workload priority.
  priority_class_name: system-cluster-critical
