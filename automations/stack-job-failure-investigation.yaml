# Stack Job Failure Investigation
#
# The proving case for the automation definition machinery. The trigger
# grammar and the runtime env contract are BOUND (see the README's authoring
# contract): the predicate is CEL over the event resource's document, and
# runtime values ride the engine's `${.env_vars.KEY}` / `${.secrets.KEY}`
# placeholder form, verified against the live engine. One seam remains
# DRAFT CONTRACT below: how the investigation's conclusion lands on the
# run's finding record — the run reconciler defines that contract.
slug: stack-job-failure-investigation
displayName: Stack Job Failure Investigation
description: >-
  When a deployment fails, the assistant investigates immediately: it reads
  the failed stack job's diagnostics — the error messages, the per-resource
  failures, the operation summary — reasons over what actually went wrong,
  and writes up a finding with the likely root cause and suggested next
  steps. Read-only: it never touches your infrastructure, it only
  investigates and reports.
automationClass: automation_class_read
triggerBindings:
  - resourceKind: stack_job
    eventType: status_updated
    # CEL over the event resource's protobuf-JSON document, bound as
    # `resource` (enum values read as their NAMES, as strings). Fires only
    # when the job's execution has completed with a failed result; a
    # re-saved terminal record fires again by design (events carry no
    # previous state) — the dispatcher's deterministic run identity is what
    # makes refires idempotent.
    predicate: 'resource.status.progress.status == "completed" && resource.status.progress.result == "failed"'
budget:
  # $2.00 per run, engine-enforced, terminate on exceeded (the publish lane
  # applies the terminate policy; it is deliberately not authorable here).
  maxCostMicros: 2000000
# DRAFT: model slug finalized against the engine's model registry when the
# first automation ships end to end.
pinnedModel: gpt-4o-mini
dailyRunCapDefault: 25
workflow:
  description: |
    Two steps, deterministic hands then agent judgment: an http_call fetches
    the failed stack job's full document (diagnostics, per-operation errors,
    progress snapshot) from the platform API using the run's own read-only
    credential; an agent_call then reasons over the fetched bundle and
    produces the investigation finding. The agent never fetches — every fact
    it sees was retrieved deterministically first.
  tasks:
    - name: fetch_stack_job
      kind: http_call
      config:
        method: POST
        endpoint:
          # The platform API base URL and the run-scoped credential arrive
          # in the run's env, threaded by the trigger bridge at dispatch.
          # The placeholder form is the engine's runtime grammar
          # (`${.env_vars.KEY}` / `${.secrets.KEY}` — no space after `${`),
          # resolved by the runner against the execution's runtime_env.
          uri: ${.env_vars.PLANTON_API_BASE_URL}/ai.planton.infrahub.stackjob.v1alpha1.StackJobQueryController/get
        headers:
          Authorization: Bearer ${.secrets.PLANTON_RUN_CREDENTIAL}
          Content-Type: application/json
        body:
          value: ${.env_vars.PLANTON_TRIGGER_RESOURCE_ID}
    - name: investigate
      kind: agent_call
      config:
        # org/slug reference form; the run executes in the org's own engine
        # workspace, so the org segment resolves per run.
        agent: ${.env_vars.PLANTON_ENGINE_ORG}/planton-assistant
        message: |
          A deployment just failed. The complete stack job document,
          including diagnostics and per-operation errors, is in this run's
          context from the fetch_stack_job task. Investigate the failure:
          identify the likely root cause, distinguish infrastructure causes
          (quota, permission, provider outage) from configuration causes
          (bad input, missing dependency), and write a concise finding with
          the root cause and the concrete next step you recommend. Do not
          attempt any fix — this is a read-only investigation.
