# Example manifest with Terraform/Tofu S3 backend configuration in annotations
# This manifest configures remote state storage in AWS S3
apiVersion: aws.planton.dev/v1
kind: EksCluster
metadata:
  id: main-cluster
  name: Main EKS Cluster
  annotations:
    # Terraform/Tofu backend configuration for S3
    terraform.planton.dev/backend.type: "s3"
    terraform.planton.dev/backend.bucket: "my-terraform-state-bucket"
    terraform.planton.dev/backend.key: "eks/main-cluster/terraform.tfstate"
    terraform.planton.dev/backend.region: "us-west-2"
spec:
  awsProviderConfigId: aws-prod-creds
  region: us-west-2
  kubernetesVersion: "1.28"
  nodeGroups:
    - name: default
      instanceType: t3.medium
      minSize: 2
      maxSize: 5
      desiredSize: 3
