# Example manifest with Terraform/Tofu GCS backend configuration in annotations
# This manifest configures remote state storage in Google Cloud Storage
apiVersion: gcp.planton.dev/v1alpha1
kind: GkeCluster
metadata:
  id: staging-cluster
  name: Staging GKE Cluster
  annotations:
    # Terraform/Tofu backend configuration for Google Cloud Storage
    terraform.planton.dev/backend.type: "gcs"
    terraform.planton.dev/backend.bucket: "project-terraform-state"
    terraform.planton.dev/backend.key: "gke/staging-cluster/default.tfstate"
spec:
  gcpProviderConfigId: gcp-staging-creds
  projectId: my-project-staging
  region: us-central1
  zone: us-central1-a
  kubernetesVersion: "1.28"
  nodePools:
    - name: default
      machineType: n2-standard-2
      initialNodeCount: 3
      minNodeCount: 1
      maxNodeCount: 10
