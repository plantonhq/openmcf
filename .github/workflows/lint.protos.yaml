# =============================================================================
# Proto Contract Gate
# =============================================================================
# The protos under apis/ ARE the product's API contract: stored documents,
# IaC modules, and every client surface are projections of them. This gate
# runs the two buf checks on every PR that touches them:
#
#   buf-lint     (BLOCKING)  -- style/structure rules from apis/buf.yaml.
#   buf-breaking (CHANNEL-AWARE) -- wire/API compatibility against main,
#                 classified by the maturity channel each finding's version
#                 directory declares: alpha findings are advisory (alpha may
#                 break in place, visibly), beta/stable/shared findings FAIL
#                 the job (those channels forbid in-place breaks). Policy and
#                 classification live in
#                 tools/ci/proto/buf_breaking_channel_gate.sh.
#
# Local equivalents: `make buf-lint` and `make buf-breaking`.
# =============================================================================

name: lint.protos

on:
  pull_request:
    paths:
      - 'apis/**/*.proto'
      - 'apis/buf.yaml'
      - '.github/workflows/lint.protos.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  buf-lint:
    name: buf lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        working-directory: apis
        run: buf lint

  bundle-conformance:
    name: catalog bundle conforms to the compiled registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: build and verify the bundle
        run: |
          make build-catalog-bundle
          make verify-catalog-bundle

  buf-breaking:
    name: buf breaking vs main (channel-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: classifier self-test
        run: bash tools/ci/proto/buf_breaking_channel_gate.sh --self-test
      - name: buf breaking against main (alpha advisory, beta/stable/shared blocking)
        working-directory: apis
        run: bash ../tools/ci/proto/buf_breaking_channel_gate.sh '../.git#branch=origin/main,subdir=apis'
