# =============================================================================
# Infra Chart Guards
# =============================================================================
# Two gates run on every chart change:
#
# 1. Structure guard -- fails the PR if any infra chart under
#    charts/<provider>/<name>/ is structurally incomplete: missing Chart.yaml,
#    values.yaml (with a params block), or a non-empty templates/ directory, or
#    a Chart.yaml missing the InfraChart identity. This enforces the chart
#    project contract that downstream discovery, loading, and the released
#    catalog bundle depend on. See hack/guards/ensure_chart_structure.sh.
#
# 2. Offline render validation -- builds the CLI from this checkout and runs
#    `planton chart validate` over every chart in the tree: every template is
#    rendered (defaults plus each bool toggle flipped), and every rendered
#    manifest must load against the local kind registry, pass protovalidate,
#    and have all its valueFrom references resolve. This makes proto/chart
#    drift unshippable at PR time. The authoritative Platform build remains
#    the engine-of-record gate for publishing. When the tree holds no charts,
#    the step passes with an honest log line -- `chart validate --all`
#    deliberately errors on zero discovered charts (typo protection for
#    users), which is the wrong signal for CI on an intentionally chart-less
#    tree.
# =============================================================================

name: lint.charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'hack/guards/ensure_chart_structure.sh'
      - 'pkg/infrachart/**'
      - '.github/workflows/lint.charts.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'hack/guards/ensure_chart_structure.sh'
      - 'pkg/infrachart/**'
      - '.github/workflows/lint.charts.yaml'

permissions:
  contents: read

jobs:
  chart-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify chart structure
        run: bash ./hack/guards/ensure_chart_structure.sh

  chart-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -o /tmp/planton .

      - name: Validate all charts offline
        run: |
          if find charts -type f -name 'Chart.yaml' -not -path '*/build/*' | grep -q .; then
            /tmp/planton chart validate --all charts/
          else
            echo "no charts in the tree; nothing to validate"
          fi
