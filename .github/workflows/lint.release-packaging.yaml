# =============================================================================
# Release Packaging Guard
# =============================================================================
# Two invariants of the release content pipeline, enforced on every change
# that could break them:
#
#   1. Every content zip selector still matches the repository layout -- the
#      packager hard-fails on an empty selection, so a directory rename can
#      never ship a silently empty (or silently shrunken) zip.
#   2. The _test provider never reaches a user surface: it carries the full
#      per-kind file shape as permanent test infrastructure, and packaging,
#      the catalog site, and module auto-tagging all exclude it explicitly.
#      See hack/guards/ensure_test_provider_stays_internal.sh for the
#      contract.
# =============================================================================

name: lint.release-packaging

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/ci/release/**'
      - 'site/scripts/copy-component-docs.ts'
      - '.github/workflows/auto-tag.yaml'
      - 'hack/guards/ensure_test_provider_stays_internal.sh'
      - '.github/workflows/lint.release-packaging.yaml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'tools/ci/release/**'
      - 'site/scripts/copy-component-docs.ts'
      - '.github/workflows/auto-tag.yaml'
      - 'hack/guards/ensure_test_provider_stays_internal.sh'
      - '.github/workflows/lint.release-packaging.yaml'

permissions:
  contents: read

jobs:
  release-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Content selectors match the tree and _test stays internal
        run: bash ./hack/guards/ensure_test_provider_stays_internal.sh
