# =============================================================================
# Definitions Release (Reusable Workflow)
# =============================================================================
# Packages the skill and agent definition trees (skills/, agents/) into a
# definitions release and uploads it to Cloudflare R2 (downloads.planton.dev):
# one deterministic zip per skill, each agent's instructions file, and a
# definitions-manifest.json carrying the release version, per-artifact
# SHA-256 checksums, and the compatibility floor from skills/compat.yaml.
#
# Consumers resolve the manifest at a pinned tag and verify every artifact's
# checksum before installing -- which is why the manifest publishes checksums
# explicitly rather than relying on transport integrity alone.
#
# Job shape -- the Actions UI shows exactly what a release ships:
#   package                  builds everything ONCE (the manifest's checksums
#                            cover all artifacts, so packaging is atomic) and
#                            discovers the skill/agent slugs from the output
#   skill (<slug>)           one job per skill, uploads skill-<slug>.zip
#   agent (<slug>)           one job per agent, uploads agent-<slug>-instructions.md
#   publish-manifest         uploads definitions-manifest.json, then moves the
#                            stable channel pointer -- it needs every upload
#                            job, so the DAG itself enforces that the pointer
#                            never names a release whose artifacts are not yet
#                            retrievable
#
# Upload path: s3://downloads-dot-planton-dot-dev-bucket/releases/{tag}/definitions/{file}
# Public URL:  https://downloads.planton.dev/releases/{tag}/definitions/{file}
#
# Channel pointer:
#   s3://downloads-dot-planton-dot-dev-bucket/definitions/stable/version.txt
#   https://downloads.planton.dev/definitions/stable/version.txt
# Runtime consumers (the desktop daemon's definitions roll-forward) resolve
# this pointer to discover the current definitions release, then fetch the
# manifest at that tag and verify every artifact checksum. ROLLBACK is a
# pointer rewrite -- point it back at a previous good tag and every install
# re-adopts that version on its next seed:
#   echo "v0.X.Y" | aws s3 cp - \
#     s3://downloads-dot-planton-dot-dev-bucket/definitions/stable/version.txt \
#     --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --content-type text/plain
#
# Called by: .github/workflows/release.yaml (after CLI release creates the release)
# =============================================================================

name: release.definitions

on:
  workflow_call:
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_R2_ENDPOINT:
        required: true

permissions:
  contents: read

env:
  R2_BUCKET: downloads-dot-planton-dot-dev-bucket

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skills: ${{ steps.discover.outputs.skills }}
      agents: ${{ steps.discover.outputs.agents }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Package definitions release
        run: |
          TAG="${GITHUB_REF_NAME}"
          go run ./pkg/skills/defspack -version "$TAG" -out build/definitions

      # The slug lists are derived from what defspack actually built, so a
      # new skill or agent gets its own upload job with zero workflow edits.
      # Any file outside the three contractual name patterns fails the
      # release -- a straggler would upload nowhere.
      - name: Discover skills and agents
        id: discover
        run: |
          cd build/definitions
          for f in *; do
            case "$f" in
              definitions-manifest.json|skill-*.zip|agent-*-instructions.md) ;;
              *)
                echo "ERROR: unexpected artifact '$f' matches no upload job"
                exit 1
                ;;
            esac
          done
          skills=$(find . -maxdepth 1 -name 'skill-*.zip' | sed -E 's|^\./skill-(.+)\.zip$|\1|' | sort | jq -R . | jq -cs .)
          agents=$(find . -maxdepth 1 -name 'agent-*-instructions.md' | sed -E 's|^\./agent-(.+)-instructions\.md$|\1|' | sort | jq -R . | jq -cs .)
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "skills: $skills"
          echo "agents: $agents"

      - name: Share the packaged release with the upload jobs
        uses: actions/upload-artifact@v4
        with:
          name: definitions
          path: build/definitions/
          if-no-files-found: error

  skill:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.package.outputs.skills) }}
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload skill-${{ matrix.slug }}.zip to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/skill-${{ matrix.slug }}.zip"
          aws s3 cp "skill-${{ matrix.slug }}.zip" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}"
          echo "uploaded: https://downloads.planton.dev/${R2_KEY}"

  agent:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.package.outputs.agents) }}
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload agent-${{ matrix.slug }}-instructions.md to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/agent-${{ matrix.slug }}-instructions.md"
          aws s3 cp "agent-${{ matrix.slug }}-instructions.md" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}"
          echo "uploaded: https://downloads.planton.dev/${R2_KEY}"

  # Runs only after EVERY artifact upload succeeded: the manifest that names
  # the artifacts, then the channel pointer that names the release. A consumer
  # can never resolve a tag whose content is missing -- the ordering is
  # enforced by the job DAG, not by step order inside one job.
  publish-manifest:
    needs: [skill, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload definitions-manifest.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/definitions-manifest.json"
          aws s3 cp "definitions-manifest.json" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}"
          echo "uploaded: https://downloads.planton.dev/${R2_KEY}"

      - name: Move the stable channel pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | aws s3 cp - "s3://${R2_BUCKET}/definitions/stable/version.txt" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --content-type text/plain \
            --cache-control "no-cache"
          echo "  stable channel -> ${TAG} (https://downloads.planton.dev/definitions/stable/version.txt)"
