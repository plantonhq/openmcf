# =============================================================================
# Component Anatomy Guard
# =============================================================================
# Fails the PR when a component's folder shape drifts from the canonical
# anatomy (version dirs hold only the versioned contract; the component root
# holds the living component) and the drift is not in the accepted baseline --
# the machine-enforced constitution of the catalog's shape. Also fails on a
# stale baseline entry, so the burn-down list can only shrink truthfully.
#
# To fix a failure: bring the component up to shape (the violation detail says
# how), or -- for a deliberate, parity-routed gap -- regenerate the baseline
# with PLANTON_REGEN_ANATOMY_BASELINE=1 and justify the growth in review.
# See pkg/anatomy.
# =============================================================================

name: lint.component-anatomy

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'pkg/anatomy/**'
      - '.github/workflows/lint.component-anatomy.yaml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'pkg/anatomy/**'
      - '.github/workflows/lint.component-anatomy.yaml'

permissions:
  contents: read

jobs:
  component-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run component-anatomy gate
        run: go test ./pkg/anatomy/...
