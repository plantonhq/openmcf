# =============================================================================
# Catalog Reference Freshness Guard (pull-request lane)
# =============================================================================
# Fails the PR when the committed catalog docs artifacts are out of sync with
# the schemas that generate them:
#
#   - The per-kind reference.md pages, provider/root reference-index.md files,
#     reference-graph.yaml, and reference-commons.md must be byte-identical to
#     a fresh whole-catalog generation, with no orphans in either direction,
#     and every embedded example manifest must protovalidate. To fix: run
#     `make generate-reference` and commit the result. A failing example
#     manifest is a real catalog bug -- fix the manifest, never suppress it.
#   - The embedded proto-docs index (the comment source those pages render
#     from) must cover every compiled-in proto. To fix: run
#     `make generate-proto-docs` and commit the result.
#
# Freshness enforcement is split across two lanes, each with exactly one
# owner. This workflow owns pull requests: the `reference-freshness` job is a
# REQUIRED status check on the default branch, so a stale PR cannot merge.
# Direct pushes to the default branch are owned by
# auto-heal.reference-freshness, which runs the same gate and heals drift by
# regenerating and pushing the result back.
#
# This workflow deliberately has NO path filter, for two reasons that
# reinforce each other: a required status check must report on every PR (a
# filtered-out required check leaves the PR unmergeable forever), and the
# generated output is a function of the schemas AND the full import graph of
# the generators, including dependency versions -- a hand-enumerated path
# list would silently rot as imports evolve. See pkg/explain/refgen and
# pkg/protodocs.
# =============================================================================

name: lint.reference-freshness

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  reference-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Catalog reference freshness
        run: go test ./pkg/explain/...

      - name: Proto-docs index freshness
        run: go test ./pkg/protodocs/
