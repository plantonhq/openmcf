# =============================================================================
# Skills / Agent Definitions Structure + Specification Guard
# =============================================================================
# Fails the PR when the skills/ or agents/ definition trees violate the
# contract documented in skills/README.md. Two rule families:
#
# Agent Skills specification conformance (agentskills.io is the binding
# standard; drift fails here instead of accumulating):
#   - name: lowercase alphanumerics and single hyphens, <=64 chars, equal
#     to the directory slug (the serving engine derives identity from it).
#   - description: non-empty and <=1024 chars -- the surface every agent
#     loads at startup.
#   - frontmatter carries only the spec's field set (custom properties
#     belong under its `metadata` map).
#   - SKILL.md body <=500 lines -- it loads whole on activation; detail
#     belongs in references, which load on demand.
#
# House structure contract:
#   - Reference integrity is bidirectional: every references/<file>.md that
#     SKILL.md cites must exist and be non-empty, and every file present
#     under references/ must be cited. An empty or orphaned reference is
#     content an agent would silently load blank at runtime.
#   - References are FLAT files named by the dot taxonomy
#     (<domain>.<topic>.md); a DIRECTORY under references/ is refused --
#     packaging and the citation check both operate on the flat list, so a
#     nested file would ship in no release while appearing to exist in git.
#   - Every agents/<slug>/ carries a non-empty instructions.md, and
#     skills/compat.yaml declares a valid compatibility floor.
#
# The gate runs the same validator the release lane uses to package a
# definitions release (pkg/skills/defspack), so a tree that passes here is
# a tree that packages.
# =============================================================================

name: lint.skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'pkg/skills/**'
      - '.github/workflows/lint.skills.yaml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'pkg/skills/**'
      - '.github/workflows/lint.skills.yaml'

permissions:
  contents: read

jobs:
  skills-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Validator unit tests
        run: go test ./pkg/skills/...

      - name: Validate the committed definition trees
        run: go run ./pkg/skills/defspack
