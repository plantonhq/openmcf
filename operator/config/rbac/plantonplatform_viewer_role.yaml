# This rule is not used by the project planton-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to planton.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: planton-operator
    app.kubernetes.io/managed-by: kustomize
  name: plantonplatform-viewer-role
rules:
- apiGroups:
  - planton.ai
  resources:
  - plantonplatforms
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - planton.ai
  resources:
  - plantonplatforms/status
  verbs:
  - get
