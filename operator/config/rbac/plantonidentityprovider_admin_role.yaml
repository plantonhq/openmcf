# This rule is not used by the project planton-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over planton.ai.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: planton-operator
    app.kubernetes.io/managed-by: kustomize
  name: plantonidentityprovider-admin-role
rules:
- apiGroups:
  - planton.ai
  resources:
  - plantonidentityproviders
  verbs:
  - '*'
- apiGroups:
  - planton.ai
  resources:
  - plantonidentityproviders/status
  verbs:
  - get
