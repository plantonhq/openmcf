# Minimal cert-manager Certificate CRD for envtest ONLY. The operator reads
# Certificates (never creates them), so the tests need just enough schema to
# create fixture objects with a spec.secretName and Ready conditions. The
# status subresource is deliberately OMITTED so a test writes spec and status
# in one Create; the operator's reads are identical either way. Never
# installed on a real cluster -- cert-manager owns the real CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
