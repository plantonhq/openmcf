syntax = "proto3";

package dev.planton.shared.foreignkey.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "shared/cloudresourcekind/cloud_resource_kind.proto";

// Extend google.protobuf.FieldOptions to store default kind & field path metadata
extend google.protobuf.FieldOptions {
  dev.planton.shared.cloudresourcekind.CloudResourceKind default_kind = 200001;
  string default_kind_field_path = 200002;

  // Declares that this reference expresses ACCESS, not PLACEMENT, for diagram
  // containment purposes.
  //
  // References into a kind marked `container_kind: true` (see
  // dev.planton.shared.cloudresourcekind.CloudResourceKindMeta.container_kind)
  // normally mean "this resource lives INSIDE that container" — a NAT gateway
  // referencing a subnet is deployed into it, so diagrams nest the gateway
  // inside the subnet's boundary. But some references into container kinds mean
  // only "let me talk to it" or "admit traffic from it": a storage account's
  // firewall rule referencing a subnet admits that subnet's traffic — the
  // account does NOT sit inside the subnet, and drawing it there would be a
  // false diagram.
  //
  // Set this on exactly those access-style reference fields. The dependency
  // edge still exists and still renders as a relationship line; the exemption
  // only prevents the referencing resource from being NESTED inside the
  // referenced container. It has no effect on references to non-container
  // kinds (harmless, but don't author it there — it would only mislead).
  bool containment_exempt = 200003;
}

// ValueFromRef describes a reference to another resource field (kind, env, name, field_path).
message ValueFromRef {
  dev.planton.shared.cloudresourcekind.CloudResourceKind kind = 1;
  string env = 2;
  string name = 3 [(buf.validate.field).required = true];
  string field_path = 4;
}

// StringValueOrRef holds either a literal string or a reference to another resource's field.
//
// A message-level CEL rule enforces that whenever this message is present, it must carry
// meaningful content: either a non-empty literal value or a ValueFromRef. This matters because
// buf.validate's `required = true` on a message-type field only checks presence (not nil) --
// it does NOT verify the oneof has content. Without this rule, a consumer field like
// `StringValueOrRef namespace = 2 [(buf.validate.field).required = true]` would accept
// `namespace: { value: "" }` (message present, oneof set to empty string) as valid.
//
// The rule fires on ANY instance of StringValueOrRef regardless of the consumer field's
// annotations. For optional fields, the only way to bypass this validation is to leave the
// field nil (absent). If the message is present, it must have content.
message StringValueOrRef {
  option (buf.validate.message).cel = {
    id: "string_value_or_ref.non_empty"
    message: "a non-empty value or a resource reference must be provided"
    expression: "(has(this.value) && this.value != '') || has(this.value_from)"
  };

  oneof literal_or_ref {
    // A literal string value (must be non-empty per the message-level CEL rule above):
    string value = 1;

    // A reference to another resource's field:
    ValueFromRef value_from = 2;
  }
}
