name: 'Planton Deploy'
description: >-
  Keyless deploy to Planton: exchange the workflow's own OIDC token for a
  short-lived Planton credential, optionally register the service from its
  manifest, deploy a container image into one environment, and fail the job
  unless the deployment verifiably succeeded.
author: 'Planton'
branding:
  icon: 'upload-cloud'
  color: 'purple'

inputs:
  org:
    description: 'Planton organization slug.'
    required: true
  service:
    description: 'Service slug or id (svc_...) to deploy.'
    required: true
  environment:
    description: >-
      Environment slug to deploy into. Must be among the service's declared
      deploy environments. A protected environment pauses at its approval
      gate — with follow enabled, the job waits for the approval.
    required: true
  image:
    description: 'Container image reference to deploy (host/path:tag or @digest).'
    required: true
  audience:
    description: >-
      The OIDC token audience — must be EXACTLY the audience your
      organization's workload identity binding declares. There is no
      default: the binding authors this value, and the audience check is
      what makes Planton the token's only valid consumer.
    required: true
  register:
    description: >-
      Set "true" to register (apply) the service from its manifest before
      deploying — the manifest's declared repository is proven against this
      workflow's own token, never trusted as typed.
    required: false
    default: 'false'
  service-file:
    description: 'Path to the service manifest, used when register is "true".'
    required: false
    default: 'service.yaml'
  follow:
    description: >-
      Set "false" to fire-and-forget. With "true" (the default) the job
      waits for the run and tells the truth: it fails when the run fails
      AND when rollout verification reports the service demonstrably not
      online. An honestly-unverifiable rollout passes with a warning.
    required: false
    default: 'true'
  cli-version:
    description: 'Planton CLI version to install (default: the latest release).'
    required: false
    default: 'latest'

outputs:
  run-id:
    description: 'The delivery run this deploy started (svcpipe_...).'
    value: ${{ steps.deploy.outputs.run-id }}

runs:
  using: 'composite'
  steps:
    - name: Install the Planton CLI
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.cli-version }}"
        if [ "${VERSION}" = "latest" ]; then
          VERSION="$(curl -fsSL https://downloads.planton.app/cli/latest/version.txt | tr -d '[:space:]')"
        fi
        case "${RUNNER_OS}" in
          Linux)  OS=linux ;;
          macOS)  OS=darwin ;;
          *) echo "::error::unsupported runner OS '${RUNNER_OS}' — use a Linux or macOS runner" ; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64)   ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "::error::unsupported runner architecture '${RUNNER_ARCH}'" ; exit 1 ;;
        esac
        BIN="planton-${VERSION}-${OS}-${ARCH}"
        DIR="${RUNNER_TEMP}/planton-cli"
        mkdir -p "${DIR}"
        curl -fsSL -o "${DIR}/${BIN}" "https://downloads.planton.app/cli/${VERSION}/${BIN}"
        curl -fsSL -o "${DIR}/checksums.txt" "https://downloads.planton.app/cli/${VERSION}/checksums.txt"
        # The release's checksums are the integrity contract: a binary that
        # does not match is never executed.
        EXPECTED="$(grep -E "  ?${BIN}\$" "${DIR}/checksums.txt" | awk '{print $1}')"
        if [ -z "${EXPECTED}" ]; then
          echo "::error::release ${VERSION} publishes no checksum for ${BIN}" ; exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL="$(sha256sum "${DIR}/${BIN}" | awk '{print $1}')"
        else
          ACTUAL="$(shasum -a 256 "${DIR}/${BIN}" | awk '{print $1}')"
        fi
        if [ "${EXPECTED}" != "${ACTUAL}" ]; then
          echo "::error::checksum mismatch for ${BIN} (expected ${EXPECTED}, got ${ACTUAL})" ; exit 1
        fi
        mv "${DIR}/${BIN}" "${DIR}/planton"
        chmod +x "${DIR}/planton"
        echo "${DIR}" >> "${GITHUB_PATH}"
        echo "installed planton ${VERSION} (${OS}/${ARCH})"

    - name: Exchange this workflow's OIDC token for a Planton credential
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::this job cannot mint an OIDC token — add 'permissions: id-token: write' to the job" ; exit 1
        fi
        OIDC_TOKEN="$(curl -fsSL \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ inputs.audience }}" | jq -r '.value')"
        # The CI token is exchange-only: it buys exactly one thing — a
        # short-lived Planton credential scoped to this repository's service.
        PLANTON_API_KEY="$(PLANTON_OIDC_TOKEN="${OIDC_TOKEN}" planton iam federate --org "${{ inputs.org }}")"
        echo "::add-mask::${PLANTON_API_KEY}"
        echo "PLANTON_API_KEY=${PLANTON_API_KEY}" >> "${GITHUB_ENV}"

    - name: Register the service from its manifest
      if: ${{ inputs.register == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        planton service register -f "${{ inputs.service-file }}" --org "${{ inputs.org }}"

    - name: Deploy
      id: deploy
      shell: bash
      run: |
        set -euo pipefail
        FOLLOW_FLAGS=""
        if [ "${{ inputs.follow }}" = "true" ]; then
          FOLLOW_FLAGS="--follow --plain"
        fi
        # tee keeps the run's progress in the job log while the run id is
        # extracted for downstream steps; pipefail keeps the CLI's honest
        # exit code (run failed, or rollout verification failed) as the
        # job's own.
        planton service deploy "${{ inputs.service }}" \
          --org "${{ inputs.org }}" \
          --env "${{ inputs.environment }}" \
          --image "${{ inputs.image }}" \
          --commit "${GITHUB_SHA}" \
          --branch "${GITHUB_REF_NAME}" \
          ${FOLLOW_FLAGS} | tee "${RUNNER_TEMP}/planton-deploy.log"
        RUN_ID="$(grep -oE 'svcpipe_[A-Za-z0-9]+' "${RUNNER_TEMP}/planton-deploy.log" | head -1 || true)"
        echo "run-id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
