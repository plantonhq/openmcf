apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabasereplica
spec:
  # pending_proof: authored to the full offline bar (spec/CEL tests, both
  # engine builds, tofu validate green, checker-green parity manifest,
  # import map, presets, README/catalog/GUIDE). Live dual-engine proof has
  # not yet run. TWO scenarios on the PostgreSQL cluster registry
  # prerequisite: `minimal` is a same-region same-size replica (region and
  # size explicit by design -- the spec requires them to kill the
  # provider's omitted-value drift/replacement class); `sized` proves a
  # larger slug, custom storage (the bare-MiB string), and the tag set.
  # THE BILLING CLASS: a replica is a second cluster-sized node that also
  # takes ~cluster-create time (DigitalOcean retries through 412 while the
  # primary's first backup completes), so each lane is roughly TWO cluster
  # creates end to end -- hence the longer timeout. Proof-lane watch items:
  # the in-place resize transition (size/storage edits on a live replica)
  # and cross-region + VPC placement (needs a second-region VPC fixture)
  # are recorded deferrals; replica tags are create-only upstream (a retag
  # REPLACES the replica -- never "fix" that as if it were drift).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 50
