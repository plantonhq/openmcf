apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanDatabaseCluster
metadata:
  name: my-postgresql-ha
spec:
  clusterName: my-postgresql-ha
  engine: pg
  engineVersion: "16"
  region: nyc3
  sizeSlug: db-s-2vcpu-4gb
  nodeCount: 3
  vpc:
    valueFrom:
      kind: DigitalOceanVpc
      name: my-vpc
      fieldPath: status.outputs.vpc_id
  storageAutoscale:
    enabled: true
    thresholdPercent: 80
  maintenanceWindow:
    day: sunday
    hour: "02:00"
