# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# spec.storage_gib is deliberately NOT mapped to storage_size_mib: the
# Terraform module's current wiring for it does not match the provider's
# schema at the pin, so recording the mapping would claim coverage the
# module does not deliver. Both sides stay on the checker's work list until
# the kind's storage wiring is rebuilt.
resources:
  digitalocean_database_cluster:
    mappings:
      - spec: spec.cluster_name
        arg: name
      - spec: spec.engine_version
        arg: version
      - spec: spec.size_slug
        arg: size
      # The VPC reference is a StringValueOrRef FK to the DigitalOceanVpc
      # kind.
      - spec: spec.vpc
        arg: private_network_uuid
