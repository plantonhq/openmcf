syntax = "proto3";

package dev.planton.digitalocean.digitaloceandatabasecluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceandatabasecluster/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceandatabasecluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-database-cluster
message DigitalOceanDatabaseCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanDatabaseCluster'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanDatabaseClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanDatabaseClusterStatus status = 5;
}

// digital-ocean-database-cluster status
message DigitalOceanDatabaseClusterStatus {
  //stack-outputs
  //  digital-ocean-database-cluster stack-outputs
  DigitalOceanDatabaseClusterStackOutputs outputs = 1;
}
