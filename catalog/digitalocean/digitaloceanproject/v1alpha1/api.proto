syntax = "proto3";

package dev.planton.digitalocean.digitaloceanproject.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanproject/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanproject/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-project
message DigitalOceanProject {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanProject'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanProjectSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanProjectStatus status = 5;
}

// digital-ocean-project status
message DigitalOceanProjectStatus {
  //stack-outputs
  //  digital-ocean-project stack-outputs
  DigitalOceanProjectStackOutputs outputs = 1;
}
