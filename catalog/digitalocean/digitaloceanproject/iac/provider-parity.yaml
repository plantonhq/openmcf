# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Membership is carried on the project itself (the resources argument); the
# provider's standalone digitalocean_project_resources rows are a recorded
# composed disposition, deliberately not created by the modules.
resources:
  digitalocean_project:
    mappings:
      # The spec qualifies the bare provider argument with the kind noun.
      - spec: spec.project_name
        arg: name
