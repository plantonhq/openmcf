apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanDnsZone
metadata:
  name: my-production-zone
spec:
  domainName: example.com
  records:
    - name: "@"
      type: A
      values:
        - value: 203.0.113.10
      ttlSeconds: 3600
    - name: www
      type: CNAME
      values:
        - value: example.com.
      ttlSeconds: 3600
    - name: "@"
      type: MX
      values:
        - value: aspmx.l.google.com.
      priority: 1
      ttlSeconds: 3600
    - name: "@"
      type: MX
      values:
        - value: alt1.aspmx.l.google.com.
      priority: 5
      ttlSeconds: 3600
    - name: "@"
      type: TXT
      values:
        - value: v=spf1 include:_spf.google.com ~all
      ttlSeconds: 3600
    - name: "@"
      type: CAA
      values:
        - value: letsencrypt.org
      flags: 0
      tag: issue
