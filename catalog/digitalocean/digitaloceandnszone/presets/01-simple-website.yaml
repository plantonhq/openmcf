apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanDnsZone
metadata:
  name: my-simple-website-zone
spec:
  domainName: example.com
  records:
    - name: "@"
      type: A
      values:
        - value: 203.0.113.10
      ttlSeconds: 3600
    - name: www
      type: CNAME
      values:
        - value: example.com.
      ttlSeconds: 3600
