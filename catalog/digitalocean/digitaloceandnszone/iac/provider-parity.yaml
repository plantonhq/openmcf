# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The kind manages the zone plus its records: the domain resource is the
# zone itself, and each entry of the spec's records list instantiates one
# record resource (multi-value records flatten to one resource per value).
resources:
  digitalocean_domain:
    mappings:
      - spec: spec.domain_name
        arg: name
  digitalocean_record:
    specRoot: spec.records
    mappings:
      # The spec names the unit; the provider's ttl is seconds.
      - spec: spec.records.ttl_seconds
        arg: ttl
      # The spec's repeated values flatten to one record resource per value.
      - spec: spec.records.values
        arg: value
    exclusions:
      - arg: domain
        reason: wired by the module to the zone it creates -- inline records always belong to this kind's own domain
