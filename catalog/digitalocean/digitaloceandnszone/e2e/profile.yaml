apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandnszone
spec:
  # pending_proof: authored to the full offline bar (spec/CEL tests, both
  # engine builds, tofu validate green, checker-green parity manifest,
  # import map, presets, README/catalog/GUIDE). Live dual-engine proof has
  # not yet run. TWO scenarios: `minimal` is a bare zone (it doubles as the
  # DigitalOceanDnsRecord kind's install fixture -- the harness falls back
  # to a kind's minimal scenario when no prerequisite.yaml exists); `full`
  # proves the inline record fan-out across every per-type argument class
  # (MX priority, SRV trio, CAA flags/tag), multi-value flattening, and the
  # create-only ip_address. Both scenarios carry ${E2E_RUN_ID} in the
  # domain name: DigitalOcean domain names are unique across ALL accounts,
  # so fixed names would eventually collide with someone's zone. Zones and
  # records are free API objects that create in seconds -- the whole
  # dual-engine sweep costs nothing. Watch on first live run: the blind
  # import round-trip imports the domain by NAME, and ip_address never
  # reads back (recorded config-only tolerance).
  tier: 1
