  DigitalOceanReservedIpSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanReservedIpStatus status = 5;
}

// digital-ocean-reserved-ip status
message DigitalOceanReservedIpStatus {
  //stack-outputs
  //  digital-ocean-reserved-ip stack-outputs
  DigitalOceanReservedIpStackOutputs outputs = 1;
}
