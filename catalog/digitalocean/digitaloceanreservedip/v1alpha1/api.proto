syntax = "proto3";

package dev.planton.digitalocean.digitaloceanreservedip.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanreservedip/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanreservedip/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-reserved-ip
message DigitalOceanReservedIp {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanReservedIp'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

