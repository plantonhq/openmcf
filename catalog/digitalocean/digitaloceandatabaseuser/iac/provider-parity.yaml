# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. mysql_auth_plugin matches by name; the
# renames below are the whole story. The ACL lists are typed per engine in
# the spec (kafka_acls / opensearch_acls) against the provider's acl /
# opensearch_acl blocks.
resources:
  digitalocean_database_user:
    mappings:
      # The cluster reference is a StringValueOrRef FK to the
      # DigitalOceanDatabaseCluster kind.
      - spec: spec.cluster
        arg: cluster_id
      - spec: spec.user_name
        arg: name
      - spec: spec.settings.kafka_acls
        arg: settings.acl
      - spec: spec.settings.opensearch_acls
        arg: settings.opensearch_acl
