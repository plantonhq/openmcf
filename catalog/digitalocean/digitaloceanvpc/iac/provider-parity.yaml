# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
resources:
  digitalocean_vpc:
    mappings:
      # The spec names the CIDR field for what it holds; empty means let
      # DigitalOcean auto-generate a non-conflicting /20.
      - spec: spec.ip_range_cidr
        arg: ip_range
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name -- the VPC's name is its Planton identity, never separate spec surface
