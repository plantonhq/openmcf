# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
resources:
  digitalocean_database_kafka_schema_registry:
    mappings:
      # The spec wires the owning cluster by reference.
      - spec: spec.cluster
        arg: cluster_id
