apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanLoadBalancer
metadata:
  name: my-http-lb
spec:
  loadBalancerName: my-http-lb
  region: nyc3
  vpc:
    valueFrom:
      kind: DigitalOceanVpc
      name: app-network
      fieldPath: status.outputs.vpc_id
  forwardingRules:
    - entryPort: 80
      entryProtocol: http
      targetPort: 8080
      targetProtocol: http
  healthCheck:
    port: 8080
    protocol: http
    path: /health
    checkIntervalSec: 10
  dropletIds:
    - valueFrom:
        kind: DigitalOceanDroplet
        name: web-1
        fieldPath: status.outputs.droplet_id
    - valueFrom:
        kind: DigitalOceanDroplet
        name: web-2
        fieldPath: status.outputs.droplet_id
