# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
resources:
  digitalocean_loadbalancer:
    mappings:
      - spec: spec.load_balancer_name
        arg: name
      # The VPC reference is a StringValueOrRef FK to the DigitalOceanVpc
      # kind.
      - spec: spec.vpc
        arg: vpc_uuid
      # The spec pluralizes the repeated forwarding_rule block; its leaves
      # mirror the provider (certificate_name is the provider's
      # non-deprecated certificate reference -- Let's Encrypt renewals
      # rotate certificate IDs, so names are the stable handle).
      - spec: spec.forwarding_rules
        arg: forwarding_rule
      # The spec separates the block-name and unit renames: health_check
      # wraps the provider's healthcheck block, and the interval leaf names
      # its unit.
      - spec: spec.health_check
        arg: healthcheck
      - spec: spec.health_check.check_interval_sec
        arg: healthcheck.check_interval_seconds
