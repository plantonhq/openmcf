syntax = "proto3";

package dev.planton.digitalocean.digitaloceanappplatformservice.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanappplatformservice/v1alpha1/spec.proto";
import "catalog/digitalocean/digitaloceanappplatformservice/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// digital-ocean-app-platform-service
message DigitalOceanAppPlatformService {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = "DigitalOceanAppPlatformService"];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanAppPlatformServiceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanAppPlatformServiceStatus status = 5;
}

// digital-ocean-app-platform-service status
message DigitalOceanAppPlatformServiceStatus {
  //stack-outputs
  //  digital-ocean-app-platform-service stack-outputs
  DigitalOceanAppPlatformServiceStackOutputs outputs = 1;
}
