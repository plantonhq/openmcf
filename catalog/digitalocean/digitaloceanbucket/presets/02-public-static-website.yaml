apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanBucket
metadata:
  name: static-site-assets
spec:
  bucketName: static-site-assets
  region: nyc3
  accessControl: PUBLIC_READ
  corsRules:
    - allowedMethods:
        - GET
        - HEAD
      allowedOrigins:
        - "https://www.example.com"
      allowedHeaders:
        - "*"
      exposeHeaders:
        - ETag
      id: site-read
      maxAgeSeconds: 3600
