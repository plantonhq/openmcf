apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanFirewall
metadata:
  name: my-database-tier-firewall
spec:
  firewallName: database-tier
  tags:
    - database
  inboundRules:
    - protocol: tcp
      portRange: "5432"
      sourceTags:
        - web
    - protocol: tcp
      portRange: "22"
      sourceAddresses:
        - 203.0.113.0/24
  outboundRules:
    - protocol: udp
      portRange: "53"
      destinationAddresses:
        - 0.0.0.0/0
        - "::/0"
    - protocol: tcp
      portRange: "443"
      destinationAddresses:
        - 0.0.0.0/0
        - "::/0"
