apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanFirewall
metadata:
  name: my-web-tier-firewall
spec:
  firewallName: web-tier
  tags:
    - web
  inboundRules:
    - protocol: tcp
      portRange: "443"
      sourceAddresses:
        - 0.0.0.0/0
        - "::/0"
    - protocol: tcp
      portRange: "80"
      sourceAddresses:
        - 0.0.0.0/0
        - "::/0"
    - protocol: tcp
      portRange: "22"
      sourceAddresses:
        - 203.0.113.0/24
  outboundRules:
    - protocol: tcp
      portRange: all
      destinationAddresses:
        - 0.0.0.0/0
        - "::/0"
    - protocol: udp
      portRange: all
      destinationAddresses:
        - 0.0.0.0/0
        - "::/0"
    - protocol: icmp
      destinationAddresses:
        - 0.0.0.0/0
        - "::/0"
