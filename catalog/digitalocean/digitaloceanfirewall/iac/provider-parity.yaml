# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
resources:
  digitalocean_firewall:
    mappings:
      # The spec qualifies the bare provider argument with the kind noun.
      - spec: spec.firewall_name
        arg: name
      # The spec pluralizes the provider's repeated rule blocks; the leaves
      # under each subtree mirror the provider exactly.
      - spec: spec.inbound_rules
        arg: inbound_rule
      - spec: spec.outbound_rules
        arg: outbound_rule
