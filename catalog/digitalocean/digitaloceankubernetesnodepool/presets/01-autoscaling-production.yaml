apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanKubernetesNodePool
metadata:
  name: app-pool
spec:
  nodePoolName: app-pool
  cluster:
    valueFrom:
      kind: DigitalOceanKubernetesCluster
      name: my-doks-cluster
      fieldPath: status.outputs.cluster_id
  size: s-4vcpu-8gb
  nodeCount: 3
  autoScale: true
  minNodes: 2
  maxNodes: 6
  labels:
    workload: app
  tags:
    - env:production
