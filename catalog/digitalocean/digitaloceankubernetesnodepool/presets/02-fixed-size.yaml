apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanKubernetesNodePool
metadata:
  name: system-pool
spec:
  nodePoolName: system-pool
  cluster:
    valueFrom:
      kind: DigitalOceanKubernetesCluster
      name: my-doks-cluster
      fieldPath: status.outputs.cluster_id
  size: s-2vcpu-4gb
  nodeCount: 2
  labels:
    workload: system
  taints:
    - key: dedicated
      value: system
      effect: NoSchedule
  tags:
    - env:production
