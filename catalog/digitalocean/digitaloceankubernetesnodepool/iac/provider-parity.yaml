# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
resources:
  digitalocean_kubernetes_node_pool:
    mappings:
      - spec: spec.node_pool_name
        arg: name
      # The cluster reference is a StringValueOrRef FK to the
      # DigitalOceanKubernetesCluster kind.
      - spec: spec.cluster
        arg: cluster_id
      # The spec pluralizes the repeated taint block.
      - spec: spec.taints
        arg: taint
