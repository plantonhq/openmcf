# Provider-parity manifest: this kind's recorded judgment against the pinned
# digitalocean provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
resources:
  digitalocean_volume:
    mappings:
      - spec: spec.volume_name
        arg: name
      # The spec names the unit; the provider's size is GiB.
      - spec: spec.size_gib
        arg: size
      # The spec's typed filesystem enum wires to the provider's
      # non-deprecated initial_filesystem_type (never the deprecated
      # filesystem_type attribute).
      - spec: spec.filesystem_type
        arg: initial_filesystem_type
