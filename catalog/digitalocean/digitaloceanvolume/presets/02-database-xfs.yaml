apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanVolume
metadata:
  name: my-database-volume
spec:
  volumeName: my-database-volume
  region: nyc1
  sizeGib: 100
  filesystemType: xfs # Optimized for database write patterns
  initialFilesystemLabel: dbdata # Mount by label (LABEL=dbdata) instead of device path
  description: Database block storage with XFS
  tags:
    - production
    - database
