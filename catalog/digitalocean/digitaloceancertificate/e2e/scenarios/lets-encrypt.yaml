# Let's Encrypt scenario: DigitalOcean issues and auto-renews the
# certificate. LIVE ARM DEFERRED (environmental gate): issuance requires
# every listed domain to be managed by DigitalOcean DNS in the test account
# -- a delegated domain the account does not have yet. Until then this
# scenario proves the branch's wiring through the offline plan only.
# The ${E2E_RUN_ID} token keeps the domain globally unique if the arm ever
# runs against a delegated zone.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanCertificate
metadata:
  name: planton-oss-e2e-digitaloceancertificate-le
  id: planton-oss-e2e-digitaloceancertificate-le
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceancertificate
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  certificateName: planton-e2e-le-cert
  letsEncrypt:
    domains:
      - pltn-e2e-cert-${E2E_RUN_ID}.com
      - "*.pltn-e2e-cert-${E2E_RUN_ID}.com"
