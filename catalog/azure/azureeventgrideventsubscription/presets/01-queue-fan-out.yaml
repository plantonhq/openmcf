apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventgridEventSubscription
metadata:
  name: orders-to-queue
spec:
  # The custom topic whose events this subscription consumes.
  scope:
    valueFrom:
      name: <your-eventgrid-topic>
  name: orders-to-queue
  # Must match the source topic's input schema: Azure rejects the
  # create when a CloudEvents-input topic is asked to deliver
  # EventGridSchema (the check is server-side only). The catalog's
  # topic examples use CloudEventSchemaV1_0; drop this line only for
  # an EventGridSchema-input topic.
  eventDeliverySchema: CloudEventSchemaV1_0
  destination:
    storageQueue:
      storageAccountId:
        valueFrom:
          name: <your-storage-account>
      # The queue must exist -- an AzureStorageQueue manages one.
      queueName: order-events
  # Park undeliverable events instead of dropping them -- the
  # production-grade default.
  deadLetter:
    storageAccountId:
      valueFrom:
        name: <your-storage-account>
    storageBlobContainerName: eventgrid-dead-letters
