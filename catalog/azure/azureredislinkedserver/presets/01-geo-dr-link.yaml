apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisLinkedServer
metadata:
  name: my-cache-geo-link
spec:
  # The PRIMARY cache -- serves writes and replicates to the secondary.
  targetRedisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <primary-cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  # The SECONDARY cache in another region -- the warm DR target. Both
  # caches must be PREMIUM and the secondary at least as large.
  linkedRedisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <secondary-cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  # Derived from the SAME referenced cache -- the location can never
  # disagree with the cache it describes.
  linkedRedisCacheLocation:
    valueFrom:
      kind: AzureRedisCache
      name: <secondary-cache-resource-name>
      fieldPath: status.outputs.region
  serverRole: SECONDARY
