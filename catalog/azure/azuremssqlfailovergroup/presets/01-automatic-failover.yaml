apiVersion: azure.planton.dev/v1alpha1
kind: AzureMssqlFailoverGroup
metadata:
  name: my-failover-group
spec:
  name: prod-sql-fog
  serverId:
    valueFrom:
      name: <primary-server>
  partnerServers:
    - serverId:
        valueFrom:
          name: <partner-server>
  databaseIds:
    - valueFrom:
        name: <database>
  readWriteEndpointFailoverPolicy:
    mode: AUTOMATIC
    graceMinutes: 60
  tags:
    cost-center: <cost-center>
