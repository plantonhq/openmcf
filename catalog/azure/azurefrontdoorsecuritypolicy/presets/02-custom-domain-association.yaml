apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorSecurityPolicy
metadata:
  name: my-domains-waf-attach
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  securityPolicyName: domains-waf-attach
  firewallPolicyId:
    valueFrom:
      kind: AzureFrontDoorFirewallPolicy
      name: <firewall-policy-resource-name>
      fieldPath: status.outputs.firewall_policy_id
  # One association covering the endpoint's default hostname AND the
  # validated custom domains -- endpoint and custom-domain IDs mix
  # freely in the same list.
  domainIds:
    - valueFrom:
        kind: AzureFrontDoorEndpoint
        name: <front-door-endpoint-resource-name>
        fieldPath: status.outputs.endpoint_id
    - valueFrom:
        kind: AzureFrontDoorCustomDomain
        name: <custom-domain-resource-name>
        fieldPath: status.outputs.custom_domain_id
