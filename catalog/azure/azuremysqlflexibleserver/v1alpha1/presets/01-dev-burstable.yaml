apiVersion: azure.planton.dev/v1alpha1
kind: AzureMysqlFlexibleServer
metadata:
  name: dev-mysql
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  # Replace: lowercase letters, digits, and hyphens, globally unique -- it
  # becomes {name}.mysql.database.azure.com.
  serverName: myorg-dev-mysql
  # Replace: letters, digits, and underscores only; reserved names
  # (admin, administrator, root, guest, public, azure_superuser) rejected.
  administratorLogin: mysqladmin
  administratorPassword:
    value: <admin-password>
  # Burstable compute: the cheapest way to run a real MySQL server.
  # Burstable SKUs do not support high availability or read replicas.
  skuName: B_Standard_B1ms
  databases:
    - name: <application-database-name>
  firewallRules:
    # 0.0.0.0-0.0.0.0 admits Azure-internal services only (not the
    # internet); add your workstation or CI ranges as separate rules.
    - name: allow-azure-services
      startIpAddress: "0.0.0.0"
      endIpAddress: "0.0.0.0"
  tags:
    cost-center: <cost-center>
