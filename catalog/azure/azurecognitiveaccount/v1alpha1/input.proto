syntax = "proto3";

package dev.planton.azure.azurecognitiveaccount.v1alpha1;

import "catalog/azure/azurecognitiveaccount/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureCognitiveAccountStackInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureCognitiveAccountStackInput {
  // The Azure AI services account resource to deploy.
  AzureCognitiveAccount target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
