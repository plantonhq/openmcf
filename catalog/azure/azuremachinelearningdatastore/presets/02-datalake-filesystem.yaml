apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningDatastore
metadata:
  name: lake-features
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  name: lake_features
  dataLakeGen2:
    storageContainerId:
      value: "<your-datalake-filesystem-id>"
    # Service-principal auth: all three come together or not at all.
    # Realistic example UUIDs -- replace with your app registration's
    # tenant and client IDs.
    tenantId: "72f988bf-86f1-41af-91ab-2d7cd011db47"
    clientId: "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d"
    clientSecret:
      value: "<your-client-secret>"
