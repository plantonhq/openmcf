syntax = "proto3";

package dev.planton.azure.azuremachinelearningdatastore.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// **AzureMachineLearningDatastoreSpec** defines a datastore on an
// Azure Machine Learning workspace (ARM:
// Microsoft.MachineLearningServices/workspaces/{ws}/dataStores/{name})
// -- the saved connection that tells the workspace where data lives
// and how to reach it. ONE kind covers the three storage flavors as
// variants: a blob container (blob_storage), a Data Lake Gen2
// filesystem (data_lake_gen2), or an Azure Files share (file_share).
// Exactly one variant block is set; the block IS the datastore type.
//
// **Nearly everything is fixed at creation.** Only the credentials
// inside the variant blocks and service_data_identity update in
// place; `name`, the storage target, `description` and `tags` are all
// ForceNew (the provider's own contract -- description and tags
// included, unusually).
//
// **Credentials are write-only.** ARM never returns account keys, SAS
// tokens or client secrets -- the provider echoes them from
// configuration. Reference secrets rather than embedding literals in
// manifests.
//
// **The datastore is an ARM child of its workspace** -- it has no
// region or resource group of its own (ARM derives both through the
// workspace).
message AzureMachineLearningDatastoreSpec {
  // The Machine Learning workspace the datastore is registered on, by
  // ARM ID. Fixed at creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef workspace_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureMachineLearningWorkspace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.machine_learning_workspace_id"
  ];

  // The datastore's name, unique on the workspace: 1-255 characters,
  // starting with an alphanumeric character, then alphanumerics,
  // hyphens or underscores (the provider's own rule) -- what jobs and
  // data assets reference as their datastore. Changing the name
  // replaces the datastore.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9][a-zA-Z0-9_-]{0,254}$"
  ];

  // What the datastore is for. Fixed at creation (the provider's own
  // contract -- changing the description replaces the datastore).
  string description = 3;

  // How the WORKSPACE SERVICE reaches the data for service-side
  // operations (data profiling, previews) -- distinct from the
  // credentials jobs use. Unspecified applies the provider default,
  // NONE. The workspace-identity modes require the corresponding
  // identity to hold data access on the storage target.
  AzureMachineLearningDatastoreServiceDataIdentity service_data_identity = 4;

  // Free-form tags applied to the datastore object, merged over the
  // Planton-derived resource tags (organization, environment,
  // resource id); a user tag with the same key wins. Fixed at
  // creation (the provider's own contract).
  map<string, string> tags = 5;

  // The blob-container variant: the datastore points at a blob
  // container. The only variant where is_default can be set.
  AzureMachineLearningDatastoreBlobStorage blob_storage = 6;

  // The Data Lake Gen2 variant: the datastore points at a filesystem
  // on a hierarchical-namespace storage account. Authenticates with a
  // service principal or workspace identity (no account key / SAS).
  AzureMachineLearningDatastoreDataLakeGen2 data_lake_gen2 = 7;

  // The Azure Files variant: the datastore points at a file share.
  // Requires exactly one of account key or SAS token (the provider's
  // own contract -- identity modes do not relax it here).
  AzureMachineLearningDatastoreFileShare file_share = 8;

  // The provider enforces every contract below in its own code or
  // schema at apply time; front-loaded here so the error lands in
  // seconds.
  option (buf.validate.message).cel = {
    id: "exactly_one_variant"
    message: "exactly one of blob_storage, data_lake_gen2 or file_share must be set -- the block is the datastore type"
    expression: "(has(this.blob_storage) ? 1 : 0) + (has(this.data_lake_gen2) ? 1 : 0) + (has(this.file_share) ? 1 : 0) == 1"
  };
  option (buf.validate.message).cel = {
    id: "blob_auth_requires_credentials_when_identity_none"
    message: "the blob_storage variant requires account_key or shared_access_signature when service_data_identity is NONE (or unset)"
    expression: "!has(this.blob_storage) || this.service_data_identity == 2 || this.service_data_identity == 3 || has(this.blob_storage.account_key) || has(this.blob_storage.shared_access_signature)"
  };
}

// How the workspace service authenticates for service-side data
// access.
enum AzureMachineLearningDatastoreServiceDataIdentity {
  // Not specified: the provider applies "None".
  azure_machine_learning_datastore_service_data_identity_unspecified = 0;

  // No service-side identity access (wire value "None") -- the blob
  // variant then requires explicit credentials.
  NONE = 1;

  // The workspace's system-assigned identity (wire value
  // "WorkspaceSystemAssignedIdentity").
  WORKSPACE_SYSTEM_ASSIGNED_IDENTITY = 2;

  // The workspace's user-assigned identity (wire value
  // "WorkspaceUserAssignedIdentity").
  WORKSPACE_USER_ASSIGNED_IDENTITY = 3;
}

// The blob-container variant.
message AzureMachineLearningDatastoreBlobStorage {
  // The blob container the datastore points at, by ARM ID
  // (.../blobServices/default/containers/{name}). Fixed at creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef storage_container_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureStorageContainer,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.container_id"
  ];

  // Make this the workspace's default datastore (where job outputs
  // land unless directed elsewhere). Only settable on the blob
  // variant -- the other variants read it back from the service.
  bool is_default = 2;

  // The storage account's access key. Reference a secret rather than
  // embedding the literal. When both account_key and
  // shared_access_signature are set, the provider sends the SAS token
  // (its own precedence). ARM never returns the value.
  dev.planton.shared.foreignkey.v1.StringValueOrRef account_key = 3 [(dev.planton.shared.options.sensitive) = true];

  // A SAS token scoped to the container. Reference a secret rather
  // than embedding the literal. ARM never returns the value.
  dev.planton.shared.foreignkey.v1.StringValueOrRef shared_access_signature = 4 [(dev.planton.shared.options.sensitive) = true];
}

// The Data Lake Gen2 variant.
message AzureMachineLearningDatastoreDataLakeGen2 {
  // The Data Lake Gen2 filesystem the datastore points at, by ARM ID
  // (.../blobServices/default/containers/{name} -- a filesystem IS a
  // container on a hierarchical-namespace account). Fixed at
  // creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef storage_container_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureStorageDataLakeGen2Filesystem,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.filesystem_id"
  ];

  // Service-principal auth: the Entra ID tenant ID. All three of
  // tenant_id, client_id and client_secret come together or not at
  // all; leave all unset to use workspace-identity or no credentials.
  string tenant_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // Service-principal auth: the application (client) ID.
  string client_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // Service-principal auth: the client secret. Reference a secret
  // rather than embedding the literal. ARM never returns the value.
  dev.planton.shared.foreignkey.v1.StringValueOrRef client_secret = 4 [(dev.planton.shared.options.sensitive) = true];

  // The authority URL used for service-principal authentication --
  // only for sovereign/custom clouds; leave unset for public Azure.
  string authority_url = 5;

  option (buf.validate.message).cel = {
    id: "service_principal_triad_all_or_none"
    message: "tenant_id, client_id and client_secret must be set together (service-principal auth) or all left unset"
    expression: "(this.tenant_id == '' && this.client_id == '' && !has(this.client_secret)) || (this.tenant_id != '' && this.client_id != '' && has(this.client_secret))"
  };
}

// The Azure Files variant.
message AzureMachineLearningDatastoreFileShare {
  // The file share the datastore points at, by ARM ID
  // (.../fileServices/default/shares/{name}). Fixed at creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef storage_fileshare_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureStorageShare,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.share_id"
  ];

  // The storage account's access key. Reference a secret rather than
  // embedding the literal. ARM never returns the value.
  dev.planton.shared.foreignkey.v1.StringValueOrRef account_key = 2 [(dev.planton.shared.options.sensitive) = true];

  // A SAS token scoped to the share. Reference a secret rather than
  // embedding the literal. ARM never returns the value.
  dev.planton.shared.foreignkey.v1.StringValueOrRef shared_access_signature = 3 [(dev.planton.shared.options.sensitive) = true];

  // The provider's schema requires exactly one credential here
  // regardless of service_data_identity -- identity modes do not
  // relax it for file shares.
  option (buf.validate.message).cel = {
    id: "exactly_one_credential"
    message: "exactly one of account_key or shared_access_signature must be set on the file_share variant"
    expression: "(has(this.account_key) ? 1 : 0) + (has(this.shared_access_signature) ? 1 : 0) == 1"
  };
}
