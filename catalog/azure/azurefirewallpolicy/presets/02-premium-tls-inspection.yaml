apiVersion: azure.planton.dev/v1alpha1
kind: AzureFirewallPolicy
metadata:
  name: inspected-egress
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: <resource-group-name>
  name: inspected-egress
  sku: PREMIUM
  threatIntelligenceMode: DENY
  dns:
    proxyEnabled: true
  identity:
    type: USER_ASSIGNED
    userAssignedIdentityIds:
      - valueFrom:
          name: <tls-identity-name>
  tlsCertificate:
    keyVaultSecretId:
      valueFrom:
        name: <ca-certificate-name>
    name: egress-ca
  intrusionDetection:
    mode: IDPS_DENY
  tags:
    cost-center: <cost-center>
