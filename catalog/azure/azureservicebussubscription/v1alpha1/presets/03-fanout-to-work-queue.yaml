apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusSubscription
metadata:
  name: my-routing-subscription
spec:
  topicId:
    valueFrom:
      kind: AzureServiceBusTopic
      name: my-event-topic
      fieldPath: status.outputs.topic_id
  subscriptionName: priority-route
  maxDeliveryCount: 10
  # The fan-out-then-collect pattern: this subscription filters, and
  # matches are funneled into a work queue the processing fleet drains.
  # The target is an entity NAME in the same namespace.
  forwardTo:
    valueFrom:
      kind: AzureServiceBusQueue
      name: my-work-queue
      fieldPath: status.outputs.queue_name
  rules:
    # Additive alongside the service-created $Default catch-all --
    # remove the catch-all once (az servicebus topic subscription rule
    # delete --name '$Default' ...) so ONLY matches forward.
    - ruleName: label-route
      filterType: CORRELATION_FILTER
      correlationFilter:
        label: order-created
