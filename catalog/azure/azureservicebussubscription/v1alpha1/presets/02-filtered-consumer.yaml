apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusSubscription
metadata:
  name: my-filtered-consumer
spec:
  topicId:
    valueFrom:
      kind: AzureServiceBusTopic
      name: my-event-topic
      fieldPath: status.outputs.topic_id
  subscriptionName: emea-consumer
  maxDeliveryCount: 10
  rules:
    # Declared rules are ADDITIVE alongside Azure's auto-created
    # $Default catch-all. For restrictive delivery (ONLY matches), remove
    # the catch-all once after creation:
    #   az servicebus topic subscription rule delete --name '$Default' \
    #     --namespace-name <ns> --topic-name <topic> --subscription-name emea-consumer \
    #     --resource-group <rg>
    - ruleName: emea-priority
      filterType: SQL_FILTER
      sqlFilter: "region = 'emea' AND priority > 3"
