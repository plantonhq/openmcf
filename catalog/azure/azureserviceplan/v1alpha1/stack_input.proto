syntax = "proto3";

package dev.planton.azure.azureserviceplan.v1alpha1;

import "catalog/azure/azureserviceplan/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureServicePlanStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureServicePlanStackInput {
  // target cloud-resource to be deployed
  AzureServicePlan target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
