apiVersion: azure.planton.dev/v1alpha1
kind: AzureServicePlan
metadata:
  name: my-service-plan
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  servicePlanName: my-service-plan
  # LINUX is the spec default -- stated here for clarity.
  osType: LINUX
  # Standard S1: auto-scale to 10 instances, 5 staging slots, daily
  # backups -- the entry-level production tier.
  skuName: STANDARD_S1
  workerCount: 1
