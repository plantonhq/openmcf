apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorProfile
metadata:
  name: my-compliant-front-door
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-name>
      fieldPath: status.outputs.resource_group_name
  profileName: my-compliant-front-door
  sku: STANDARD
  # Mask sensitive request data out of the access logs before they are
  # written: client IPs, request URIs (which can embed tokens and PII in
  # paths), and query-string arguments. Presence of entries is what
  # enables scrubbing.
  logScrubbingVariables:
    - REQUEST_IP_ADDRESS
    - REQUEST_URI
    - QUERY_STRING_ARG_NAMES
  # Governance tags ride every log line and cost report.
  tags:
    data-classification: pii
    cost-center: <cost-center>
