apiVersion: azure.planton.dev/v1alpha1
kind: AzureBackupPolicyVm
metadata:
  name: daily-backup-policy
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  recoveryVaultName:
    valueFrom:
      kind: AzureRecoveryServicesVault
      name: "<your-recovery-services-vault>"
      fieldPath: status.outputs.recovery_services_vault_name
  name: daily-backup-policy
  # V2 (enhanced) unlocks hourly schedules and longer instant restore
  # later -- and policyType is ForceNew, so decide the generation
  # before VMs bind to the policy.
  policyType: V2
  # One nightly backup in a low-traffic window; the time also stamps
  # every retention layer (the provider wires them together).
  backup:
    frequency: Daily
    time: "23:00"
  timezone: UTC
  # The classic grandfather-father-son ladder: 30 dailies, 12 weeklies,
  # 12 monthlies, 7 yearlies -- each kept point is incremental storage.
  retentionDaily:
    count: 30
  retentionWeekly:
    count: 12
    weekdays: [Sunday]
  retentionMonthly:
    count: 12
    weeks: [First]
    weekdays: [Sunday]
  retentionYearly:
    count: 7
    months: [January]
    weeks: [First]
    weekdays: [Sunday]
