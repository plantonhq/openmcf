# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name (nested block arguments derive as
# spec.<block>.<arg>: the backup schedule, tiering policy,
# instant-restore resource group, and all four retention blocks match
# that way). Every exclusion carries its reason: omission is a decision,
# never an accident.

resources:
  azurerm_backup_policy_vm:
    mappings:
      # The family-wide rename: the spec says what the field IS (a
      # resource group), where the provider inherits ARM's terser name.
      - spec: spec.resource_group
        arg: resource_group_name
