apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorRuleSet
metadata:
  name: my-https-and-caching
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  ruleSetName: httpsandcaching
  rules:
    # Upgrade any plain-HTTP request with a 308 and STOP -- later rules
    # never see the request; the client retries over HTTPS and gets the
    # full policy then.
    - name: httpsupgrade
      order: 1
      behaviorOnMatch: STOP
      conditions:
        requestScheme:
          - matchValue: HTTP
      actions:
        urlRedirect:
          redirectType: PERMANENT_REDIRECT
          redirectProtocol: HTTPS_ONLY
    # Force long edge caching for immutable static assets, keyed without
    # tracking parameters so campaign links share one cache entry.
    - name: staticassets
      order: 2
      conditions:
        urlFileExtension:
          - operator: EQUAL
            matchValues: [css, js, woff2, svg, png, jpg]
            transforms: [LOWERCASE]
      actions:
        routeConfigurationOverride:
          cacheBehavior: OVERRIDE_ALWAYS
          cacheDuration: 7.00:00:00
          queryStringCachingBehavior: IGNORE_SPECIFIED_QUERY_STRINGS
          queryStringParameters: [utm_source, utm_medium, utm_campaign]
          compressionEnabled: true
    # Authenticated API traffic never caches at the edge.
    - name: nocacheapi
      order: 3
      conditions:
        urlPath:
          - operator: BEGINS_WITH
            matchValues: [api/]
      actions:
        routeConfigurationOverride:
          cacheBehavior: DISABLED
