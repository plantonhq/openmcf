apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azurefrontdoorruleset
spec:
  # The harness deploys the fixture resource group and the fixture Front
  # Door profile (registry prerequisite), creates the rule set with a
  # three-rule delivery policy (redirect, security headers, caching
  # override), verifies it via the ARM API, destroys it, and verifies it
  # is gone -- on both provisioners. Observed runs 21-24 min per engine
  # (the profile fixture's ~18-min deletion dominates, the Front Door
  # family timing class). The route's rule-set-attach scenario
  # additionally live-proves the attach seam through this kind's install
  # profile.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
