  # sources (each needs an external artifact -- an uploaded VHD / a
  # legacy managed image -- that the lane cannot honestly stand up);
  # per-region disk-encryption-set replicas (needs a KV key + DES
  # fixture chain; exercised by the canonical manifest's offline
  # plan); Shallow replication (dev-loop form; its CEL and plan
  # coverage carry the contract).
