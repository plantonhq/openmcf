# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The kind spans TWO provider resources: the image definition plus
# azurerm_shared_image_version, COMPOSED into the definition's manifest
# as the spec's versions list (versions are the image owner's own
# release artifacts -- one ARM child per entry, keyed by version name).

resources:
  azurerm_shared_image:
    mappings:
      # Family-wide renames: the spec says what the field IS (a resource
      # group, a region), where the provider inherits ARM's property
      # names.
      - spec: spec.resource_group
        arg: resource_group_name
      - spec: spec.region
        arg: location
  azurerm_shared_image_version:
    mappings:
      # The composed versions live under the definition spec's versions
      # list; the version's own identity and parent binding derive from
      # the definition's fields.
      - spec: spec.versions.name
        arg: name
      - spec: spec.gallery_name
        arg: gallery_name
      - spec: spec.name
        arg: image_name
      - spec: spec.resource_group
        arg: resource_group_name
      - spec: spec.region
        arg: location
      # Plural list name over the provider's singular block name.
      - spec: spec.versions.target_regions.name
        arg: target_region.name
      - spec: spec.versions.target_regions.regional_replica_count
        arg: target_region.regional_replica_count
      - spec: spec.versions.target_regions.disk_encryption_set_id
        arg: target_region.disk_encryption_set_id
      - spec: spec.versions.target_regions.exclude_from_latest_enabled
        arg: target_region.exclude_from_latest_enabled
      - spec: spec.versions.target_regions.storage_account_type
        arg: target_region.storage_account_type
      - spec: spec.versions.blob_uri
        arg: blob_uri
      - spec: spec.versions.storage_account_id
        arg: storage_account_id
      - spec: spec.versions.os_disk_snapshot_id
        arg: os_disk_snapshot_id
      - spec: spec.versions.managed_image_id
        arg: managed_image_id
      - spec: spec.versions.replication_mode
        arg: replication_mode
      - spec: spec.versions.exclude_from_latest
        arg: exclude_from_latest
      - spec: spec.versions.deletion_of_replicated_locations_enabled
        arg: deletion_of_replicated_locations_enabled
      - spec: spec.versions.end_of_life_date
        arg: end_of_life_date
      - spec: spec.versions.tags
        arg: tags
