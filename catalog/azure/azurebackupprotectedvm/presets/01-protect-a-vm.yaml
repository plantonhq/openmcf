apiVersion: azure.planton.dev/v1alpha1
kind: AzureBackupProtectedVm
metadata:
  name: protect-app-vm
spec:
  # The VAULT's resource group (not necessarily the VM's).
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  recoveryVaultName:
    valueFrom:
      kind: AzureRecoveryServicesVault
      name: "<your-recovery-services-vault>"
      fieldPath: status.outputs.recovery_services_vault_name
  # The machine to protect -- must live in the vault's region.
  sourceVmId:
    valueFrom:
      kind: AzureVirtualMachine
      name: "<your-virtual-machine>"
      fieldPath: status.outputs.vm_id
  # Schedule and retention come from the policy; re-pointing to a
  # different policy later updates in place.
  backupPolicyId:
    valueFrom:
      kind: AzureBackupPolicyVm
      name: "<your-backup-policy>"
      fieldPath: status.outputs.backup_policy_id
