apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCache
metadata:
  name: my-enterprise-cache
spec:
  region: <region>
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  # Replace: 1-63 letters, digits, and hyphens (no repeats), globally
  # unique -- it becomes {name}.redis.cache.windows.net.
  cacheName: myorg-prod-cache
  # PREMIUM unlocks clustering, persistence, zone pinning, VNet
  # injection, and geo-replication (AzureRedisLinkedServer).
  skuName: PREMIUM
  # P1 = 6 GB PER SHARD: with 3 shards below, 18 GB total.
  capacity: 1
  # Three primary/replica shard pairs -- throughput and memory scale
  # together; clients must speak the Redis Cluster protocol.
  shardCount: 3
  # Spread the shards across availability zones for datacenter-failure
  # resilience. Fixed at creation.
  zones:
    - "1"
    - "2"
    - "3"
  # Private-only: no public endpoint; reach the cache through an
  # AzurePrivateEndpoint (the recommended isolation for new designs).
  publicNetworkAccessEnabled: false
  redisConfiguration:
    activeDirectoryAuthenticationEnabled: true
    # Never silently drop data on memory pressure -- writes fail instead
    # (monitor memory; right for caches that double as data structures).
    maxmemoryPolicy: noeviction
    # RDB snapshots every hour to a storage account, authenticated by
    # the cache's managed identity -- no storage secret in the spec.
    dataPersistenceAuthenticationMethod: MANAGED_IDENTITY
    rdbBackupEnabled: true
    rdbBackupFrequency: 60
    rdbBackupMaxSnapshotCount: 1
  # The identity behind managed-identity persistence: grant it "Storage
  # Blob Data Contributor" on the persistence account.
  identity:
    type: SYSTEM_ASSIGNED
  # Pin patching to a low-traffic weekend window.
  patchSchedules:
    - dayOfWeek: SUNDAY
      startHourUtc: 2
      maintenanceWindow: PT5H
