apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataFactoryLinkedService
metadata:
  name: sql-database-key-vault-secrets
spec:
  dataFactoryId:
    valueFrom:
      name: <your-data-factory>
  name: warehouse-sqldb
  description: Azure SQL over a Key-Vault-held connection string.
  azureSqlDatabase:
    # The whole connection string lives in the vault -- rotation is a
    # vault operation; this manifest never changes.
    keyVaultConnectionString:
      linkedServiceName:
        valueFrom:
          name: <your-key-vault-connection>
      secretName: warehouse-sqldb-connection-string
