# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# ONE kind covers TWENTY-THREE provider resources as variants --
# exactly one of the spec's connection blocks is set, and the module
# creates the matching linked service resource (all 23 share one
# factory-scoped linked-service namespace,
# {factory_id}/linkedservices/{name}). Fields every type shares (name,
# data_factory_id, description, annotations, parameters,
# additional_properties, integration_runtime_name) live at the spec
# root and match by exact name; variant-scoped arguments map into
# their variant block below. Key-Vault-sourced secret blocks map at
# block level -- their linked_service_name/secret_name leaves carry
# the provider's own names.
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_data_factory_linked_service_azure_blob_storage:
    mappings:
      - spec: spec.azure_blob_storage.connection_string
        arg: connection_string
      - spec: spec.azure_blob_storage.connection_string_insecure
        arg: connection_string_insecure
      - spec: spec.azure_blob_storage.sas_uri
        arg: sas_uri
      - spec: spec.azure_blob_storage.service_endpoint
        arg: service_endpoint
      - spec: spec.azure_blob_storage.sas_token_linked_key_vault_key
        arg: sas_token_linked_key_vault_key
      - spec: spec.azure_blob_storage.service_principal_linked_key_vault_key
        arg: service_principal_linked_key_vault_key
      - spec: spec.azure_blob_storage.storage_kind
        arg: storage_kind
      - spec: spec.azure_blob_storage.use_managed_identity
        arg: use_managed_identity
      - spec: spec.azure_blob_storage.service_principal_id
        arg: service_principal_id
      - spec: spec.azure_blob_storage.service_principal_key
        arg: service_principal_key
      - spec: spec.azure_blob_storage.tenant_id
        arg: tenant_id

