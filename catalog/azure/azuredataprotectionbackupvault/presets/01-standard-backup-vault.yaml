apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupVault
metadata:
  name: backup-vault
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  # 2-50 chars, letters/digits/hyphens -- what backup policies and
  # backup instances reference their vault by (via its ARM ID).
  name: backup-vault
  # VaultStore is the standard tier -- the right choice for almost
  # everything. Fixed at creation.
  datastoreType: VaultStore
  # GeoRedundant keeps a copy in the paired region -- the production
  # posture. Fixed at creation.
  redundancy: GeoRedundant
  # Paired-region restore capability; enabling is in-place, disabling
  # replaces the vault.
  crossRegionRestoreEnabled: true
