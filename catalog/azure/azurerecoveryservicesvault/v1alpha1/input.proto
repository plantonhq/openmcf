syntax = "proto3";

package dev.planton.azure.azurerecoveryservicesvault.v1alpha1;

import "catalog/azure/azurerecoveryservicesvault/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureRecoveryServicesVaultStackInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureRecoveryServicesVaultStackInput {
  // The Recovery Services vault resource to deploy.
  AzureRecoveryServicesVault target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
