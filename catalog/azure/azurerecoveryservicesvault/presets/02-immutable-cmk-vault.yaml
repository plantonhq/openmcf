apiVersion: azure.planton.dev/v1alpha1
kind: AzureRecoveryServicesVault
metadata:
  name: compliance-vault
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  name: compliance-vault
  storageModeType: GeoRedundant
  crossRegionRestoreEnabled: true
  # Unlocked enforces immutability (no backup deletion, no retention
  # reduction) but stays reversible -- move to Locked only when the
  # retention settings have proven themselves; Locked is PERMANENT.
  immutability: Unlocked
  # Private-endpoint-only posture.
  publicNetworkAccessEnabled: false
  # A user-assigned identity lets the Key Vault grant be composed
  # BEFORE the vault exists -- no bootstrap hop.
  identity:
    type: USER_ASSIGNED
    identityIds:
      - valueFrom:
          kind: AzureUserAssignedIdentity
          name: "<your-identity>"
          fieldPath: status.outputs.identity_id
  # Backup data encrypted with YOUR key. The versionless reference
  # rotates automatically. Once enabled: never removable, the
  # infrastructure-encryption choice never changes, the sku freezes.
  encryption:
    keyId:
      valueFrom:
        kind: AzureKeyVaultKey
        name: "<your-key-vault-key>"
        fieldPath: status.outputs.versionless_id
    infrastructureEncryptionEnabled: true
    useSystemAssignedIdentity: false
    userAssignedIdentityId:
      valueFrom:
        kind: AzureUserAssignedIdentity
        name: "<your-identity>"
        fieldPath: status.outputs.identity_id
