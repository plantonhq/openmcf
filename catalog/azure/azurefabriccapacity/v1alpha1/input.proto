syntax = "proto3";

package dev.planton.azure.azurefabriccapacity.v1alpha1;

import "catalog/azure/azurefabriccapacity/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureFabricCapacityStackInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureFabricCapacityStackInput {
  // The Fabric capacity resource to deploy.
  AzureFabricCapacity target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
