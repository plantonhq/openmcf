# Production Application Insights with cost controls -- 50% sampling,
# a tight daily cap with notifications, one-year retention, and the
# keyless (Entra-only) ingestion posture.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureApplicationInsights
metadata:
  name: my-prod-app-insights
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  applicationInsightsName: my-prod-app-insights
  applicationType: WEB
  workspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: my-platform-logs
      fieldPath: status.outputs.workspace_id
  retentionInDays: 365
  dailyDataCapInGb: 10
  dailyDataCapNotificationsEnabled: true
  samplingPercentage: 50
  localAuthenticationEnabled: false
  tags:
    cost-center: platform
    environment: production
