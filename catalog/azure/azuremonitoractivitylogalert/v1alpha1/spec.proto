syntax = "proto3";

package dev.planton.azure.azuremonitoractivitylogalert.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// **AzureMonitorActivityLogAlertSpec** defines an Azure Monitor Activity Log
// Alert: a rule that fires an action (notify an action group, post a
// webhook) when a matching entry appears in the Azure Activity Log -- the
// subscription-level record of control-plane operations, service-health
// incidents, resource-health transitions, policy events, and Advisor
// recommendations. It is the only way to alert on the events that never
// show up as metrics: a VM someone deleted, a region-wide service incident,
// a resource going Unavailable, a policy denial.
//
// The alert watches one or more scopes (a subscription, a resource group,
// or specific resources) and matches on a criteria block whose `category`
// selects which slice of the Activity Log to watch; the remaining criteria
// fields narrow within that category. When an entry matches, every action
// fires.
message AzureMonitorActivityLogAlertSpec {
  // The Azure resource group the alert is created in. Can be a literal
  // resource-group name or a reference to an AzureResourceGroup's name
  // output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_group = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_name"
  ];

  // The name of the alert, unique within the resource group. Fixed at
  // creation.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The region the alert RESOURCE lives in. Activity Log Alerts are only
  // supported in a handful of regions; unspecified applies "global" (the
  // correct choice for virtually every alert -- the alert evaluates the
  // subscription-global Activity Log regardless). The others exist for data
  // residency of the alert definition itself.
  AzureMonitorActivityLogAlertLocation location = 3;

  // The scopes the alert watches -- a subscription, resource group, or
  // specific resources, by ARM ID. At least one required. Events under a
  // scope are evaluated (a subscription scope watches everything in it).
  // Each entry defaults to referencing an AzureResourceGroup's ARM ID (the
  // common resource-group scope); the scope is polymorphic, so a
  // subscription or any resource id works via an explicit valueFrom.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef scopes = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_id"
  ];

  // The matching criteria -- which Activity Log entries fire the alert.
  // Required: an alert with no criteria matches nothing.
  AzureMonitorActivityLogAlertCriteria criteria = 5 [(buf.validate.field).required = true];

  // The actions fired when an entry matches -- most commonly notifying an
  // action group. An alert with no actions still records matches but
  // notifies nobody.
  repeated AzureMonitorActivityLogAlertAction actions = 6;

  // A human-readable description of what the alert watches for and why.
  string description = 7;

  // Whether the alert is active. Unspecified applies Azure's default
  // (enabled). Set false to keep the definition but stop it firing.
  optional bool enabled = 8;

  // Free-form tags applied to the alert, merged over the Planton-derived
  // resource tags (organization, environment, resource id); a user tag with
  // the same key wins. Updatable in place.
  map<string, string> tags = 9;
}

// The region an Activity Log Alert resource lives in. Unspecified means
// "global" -- correct for virtually every alert.
enum AzureMonitorActivityLogAlertLocation {
  // Not specified: "global".
  azure_monitor_activity_log_alert_location_unspecified = 0;

  // Global -- the alert definition is not pinned to a region (the norm).
  GLOBAL = 1;

  // West Europe (for data residency of the alert definition).
  WEST_EUROPE = 2;

  // North Europe (for data residency of the alert definition).
  NORTH_EUROPE = 3;

  // East US 2 EUAP (for data residency of the alert definition).
  EAST_US_2_EUAP = 4;
}

// The matching criteria for an Activity Log Alert. `category` selects the
// slice of the Activity Log; the other fields narrow within it. The plural
// list fields are the single source of truth (Azure's equivalent singular
// forms are folded away -- a one-element list expresses the single case).
message AzureMonitorActivityLogAlertCriteria {
  // WHICH slice of the Activity Log to watch. Required.
  AzureMonitorActivityLogAlertCategory category = 1 [(buf.validate.field).required = true];

  // The specific operation to match (e.g.
  // "Microsoft.Compute/virtualMachines/delete"). Empty matches any
  // operation in the category.
  string operation_name = 2;

  // The identity (user or service principal) that performed the operation.
  // Empty matches any caller. Cannot be combined with resource_health or
  // service_health (those categories have no caller).
  string caller = 3;

  // The severity levels to match (Verbose, Informational, Warning, Error,
  // Critical). Empty matches any level.
  repeated AzureMonitorActivityLogAlertLevel levels = 4;

  // The resource providers to match (e.g. "Microsoft.Compute"). Empty
  // matches any.
  repeated string resource_providers = 5;

  // The resource types to match (e.g.
  // "Microsoft.Compute/virtualMachines"). Empty matches any.
  repeated string resource_types = 6;

  // The resource groups (by name) to match. Empty matches any.
  repeated string resource_groups = 7;

  // The specific resources (by ARM ID) to match. Empty matches any.
  repeated string resource_ids = 8;

  // The operation statuses to match (e.g. "Succeeded", "Failed",
  // "Started"). Empty matches any.
  repeated string statuses = 9;

  // The operation sub-statuses to match (e.g. "OK", "Created", HTTP-like
  // codes). Empty matches any.
  repeated string sub_statuses = 10;

  // For the Recommendation category: the Advisor recommendation category to
  // match. Cannot be combined with recommendation_type.
  AzureMonitorActivityLogAlertRecommendationCategory recommendation_category = 11;

  // For the Recommendation category: the Advisor impact to match. Cannot be
  // combined with recommendation_type.
  AzureMonitorActivityLogAlertRecommendationImpact recommendation_impact = 12;

  // For the Recommendation category: match a specific recommendation type
  // id. Cannot be combined with recommendation_category or
  // recommendation_impact.
  string recommendation_type = 13;

  // For the ResourceHealth category: match resource-health transitions.
  // Cannot be combined with caller or service_health.
  AzureMonitorActivityLogAlertResourceHealth resource_health = 14;

  // For the ServiceHealth category: match Azure service-health incidents.
  // Cannot be combined with caller or resource_health.
  AzureMonitorActivityLogAlertServiceHealth service_health = 15;

  option (buf.validate.message).cel = {
    id: "recommendation_type_exclusivity"
    message: "recommendation_type cannot be combined with recommendation_category or recommendation_impact"
    expression: "this.recommendation_type == '' || (!has(this.recommendation_category) && !has(this.recommendation_impact))"
  };

  option (buf.validate.message).cel = {
    id: "resource_health_exclusivity"
    message: "resource_health cannot be combined with caller or service_health"
    expression: "!has(this.resource_health) || (this.caller == '' && !has(this.service_health))"
  };

  option (buf.validate.message).cel = {
    id: "service_health_exclusivity"
    message: "service_health cannot be combined with caller or resource_health"
    expression: "!has(this.service_health) || (this.caller == '' && !has(this.resource_health))"
  };
}

// A resource-health criteria (ResourceHealth category): match transitions
// between health states.
message AzureMonitorActivityLogAlertResourceHealth {
  // The current health states to match.
  repeated AzureMonitorActivityLogAlertHealthStatus current = 1;

  // The previous health states to match.
  repeated AzureMonitorActivityLogAlertHealthStatus previous = 2;

  // The reasons for the health transition to match.
  repeated AzureMonitorActivityLogAlertHealthReason reason = 3;
}

// A service-health criteria (ServiceHealth category): match Azure incidents.
message AzureMonitorActivityLogAlertServiceHealth {
  // The event types to match (Incident, Maintenance, Informational,
  // ActionRequired, Security).
  repeated AzureMonitorActivityLogAlertServiceHealthEvent events = 1;

  // The Azure regions the incident affects (e.g. "East US"). Empty matches
  // any region.
  repeated string locations = 2;

  // The Azure services the incident affects (e.g. "Virtual Machines").
  // Empty matches any service.
  repeated string services = 3;
}

// An action fired when an Activity Log Alert matches.
message AzureMonitorActivityLogAlertAction {
  // The action group to notify. Defaults to referencing an
  // AzureMonitorActionGroup's action_group_id output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef action_group_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureMonitorActionGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.action_group_id"
  ];

  // Extra key-value properties passed to the action group's webhook
  // receivers when this alert fires.
  map<string, string> webhook_properties = 2;
}

// The Activity Log category an alert watches.
enum AzureMonitorActivityLogAlertCategory {
  azure_monitor_activity_log_alert_category_unspecified = 0;
  ADMINISTRATIVE = 1;
  AUTOSCALE = 2;
  POLICY = 3;
  RECOMMENDATION = 4;
  RESOURCE_HEALTH = 5;
  SECURITY = 6;
  SERVICE_HEALTH = 7;
}

// An Activity Log entry severity level.
enum AzureMonitorActivityLogAlertLevel {
  azure_monitor_activity_log_alert_level_unspecified = 0;
  VERBOSE = 1;
  INFORMATIONAL = 2;
  WARNING = 3;
  ERROR = 4;
  CRITICAL = 5;
}

// An Advisor recommendation category (Recommendation category).
enum AzureMonitorActivityLogAlertRecommendationCategory {
  azure_monitor_activity_log_alert_recommendation_category_unspecified = 0;
  COST = 1;
  RELIABILITY = 2;
  OPERATIONAL_EXCELLENCE = 3;
  PERFORMANCE = 4;
  HIGH_AVAILABILITY = 5;
  SECURITY_RECOMMENDATION = 6;
}

// An Advisor recommendation impact (Recommendation category).
enum AzureMonitorActivityLogAlertRecommendationImpact {
  azure_monitor_activity_log_alert_recommendation_impact_unspecified = 0;
  HIGH = 1;
  MEDIUM = 2;
  LOW = 3;
}

// A resource-health state (ResourceHealth category).
enum AzureMonitorActivityLogAlertHealthStatus {
  azure_monitor_activity_log_alert_health_status_unspecified = 0;
  AVAILABLE = 1;
  DEGRADED = 2;
  UNAVAILABLE = 3;
  UNKNOWN = 4;
}

// A reason for a resource-health transition (ResourceHealth category).
enum AzureMonitorActivityLogAlertHealthReason {
  azure_monitor_activity_log_alert_health_reason_unspecified = 0;
  PLATFORM_INITIATED = 1;
  USER_INITIATED = 2;
  REASON_UNKNOWN = 3;
}

// A service-health event type (ServiceHealth category).
enum AzureMonitorActivityLogAlertServiceHealthEvent {
  azure_monitor_activity_log_alert_service_health_event_unspecified = 0;
  INCIDENT = 1;
  MAINTENANCE = 2;
  EVENT_INFORMATIONAL = 3;
  ACTION_REQUIRED = 4;
  EVENT_SECURITY = 5;
}
