apiVersion: azure.planton.dev/v1alpha1
kind: AzureMonitorActivityLogAlert
metadata:
  name: my-service-health-alert
spec:
  resourceGroup:
    value: <resource-group-name>
  name: service-health-incidents
  scopes:
    - value: /subscriptions/<subscription-id>
  criteria:
    category: SERVICE_HEALTH
    serviceHealth:
      events:
        - INCIDENT
        - MAINTENANCE
  actions:
    - actionGroupId:
        valueFrom:
          name: <action-group>
  description: Notify on Azure service-health incidents and maintenance in the subscription
