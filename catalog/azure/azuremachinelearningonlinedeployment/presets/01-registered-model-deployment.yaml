apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningOnlineDeployment
metadata:
  name: model-scoring-blue
spec:
  endpointId:
    value: "<your-online-endpoint-id>"
  # The endpoint's traffic map routes by this name (e.g. traffic:
  # {blue: 100}).
  name: blue
  region: eastus
  # The fleet: type is fixed at creation; count is the in-place scale
  # dial. Managed-endpoint VM quota (separate from compute quota)
  # gates provisioning.
  instanceType: Standard_DS3_v2
  instanceCount: 1
  # A registered model version from the workspace. MLflow models need
  # neither code nor environment -- the service infers both.
  model: "<your-registered-model-version-id>"
