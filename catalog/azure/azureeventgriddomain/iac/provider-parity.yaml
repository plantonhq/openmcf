# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_eventgrid_domain:
    mappings:
      # Family-wide renames: the spec says what the field IS (a resource
      # group, a region), where the provider inherits ARM's property
      # names.
      - spec: spec.resource_group
        arg: resource_group_name
      - spec: spec.region
        arg: location
      # The spec name says what the list IS (a plural collection), where
      # the provider uses the singular block name.
      - spec: spec.inbound_ip_rules
        arg: inbound_ip_rule
