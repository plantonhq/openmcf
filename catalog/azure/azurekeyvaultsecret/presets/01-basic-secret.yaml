apiVersion: azure.planton.dev/v1alpha1
kind: AzureKeyVaultSecret
metadata:
  name: storage-connection-string
spec:
  # 1-127 characters, letters/digits/hyphens, unique in the vault.
  name: storage-connection-string
  keyVaultId:
    valueFrom:
      kind: AzureKeyVault
      name: "<your-key-vault>"
      fieldPath: status.outputs.key_vault_id
  # Reference another resource's sensitive output (here a storage
  # account's connection string) -- never a literal in a manifest.
  # Swap kind/name/fieldPath for whatever emits your value.
  value:
    valueFrom:
      kind: AzureStorageAccount
      name: "<your-storage-account>"
      fieldPath: status.outputs.primary_connection_string
  # A hint for consumers; Key Vault stores it verbatim.
  contentType: text/plain
