# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_key_vault_secret:
    exclusions:
      - arg: value_wo
        reason: the provider's write-only value variant is an ephemeral input that duplicates `value` for a plaintext-in-config problem this catalog does not have -- secret values are reference-resolved at deploy time, never stored in manifests (the established write-only exclusion treatment)
      - arg: value_wo_version
        reason: the write-only value's update trigger -- meaningless without value_wo, excluded with it
