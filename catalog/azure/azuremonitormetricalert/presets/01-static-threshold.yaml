# Static-threshold metric alert -- the classic "metric crossed a line"
# rule: storage availability below 99.9% over 15 minutes, paging the
# on-call action group.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMonitorMetricAlert
metadata:
  name: my-storage-availability
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  alertName: storage-availability-low
  scopes:
    - valueFrom:
        kind: AzureStorageAccount
        name: my-app-storage
        fieldPath: status.outputs.storage_account_id
  description: Storage availability dropped below 99.9% -- check the storage account's health blade and recent throttling.
  severity: 1
  frequency: PT1M
  windowSize: PT15M
  staticCriteria:
    - metricNamespace: Microsoft.Storage/storageAccounts
      metricName: Availability
      aggregation: AVERAGE
      operator: LESS_THAN
      threshold: 99.9
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: my-platform-oncall
          fieldPath: status.outputs.action_group_id
  tags:
    team: platform
