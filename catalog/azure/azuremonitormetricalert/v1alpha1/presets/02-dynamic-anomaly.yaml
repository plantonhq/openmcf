# Dynamic-threshold metric alert -- Azure learns the metric's normal
# band and alerts on deviation in either direction. The right shape for
# metrics with daily/weekly rhythm where no fixed line exists.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMonitorMetricAlert
metadata:
  name: my-traffic-anomaly
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  alertName: transactions-anomaly
  scopes:
    - valueFrom:
        kind: AzureStorageAccount
        name: my-app-storage
        fieldPath: status.outputs.storage_account_id
  description: Transaction volume deviates from the learned pattern -- traffic drop (outage upstream?) or spike (abuse?).
  severity: 2
  frequency: PT5M
  windowSize: PT15M
  dynamicCriteria:
    metricNamespace: Microsoft.Storage/storageAccounts
    metricName: Transactions
    aggregation: TOTAL
    operator: GREATER_OR_LESS_THAN
    alertSensitivity: MEDIUM
    evaluationTotalCount: 4
    evaluationFailureCount: 3
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: my-platform-oncall
          fieldPath: status.outputs.action_group_id
  tags:
    team: platform
