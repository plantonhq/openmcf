syntax = "proto3";

package dev.planton.azure.azurecosmosdbaccount.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecosmosdbaccount/v1alpha1/spec.proto";
import "catalog/azure/azurecosmosdbaccount/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// AzureCosmosdbAccount is the top-level API resource for an Azure Cosmos
// DB account -- the globally distributed, multi-model database account
// that owns regions, consistency, network posture, encryption, and backup.
// The data containers are first-class kinds referencing the account:
// AzureCosmosdbSqlDatabase / AzureCosmosdbSqlContainer for the SQL (NoSQL)
// API and AzureCosmosdbMongoDatabase / AzureCosmosdbMongoCollection for
// the MongoDB API.
message AzureCosmosdbAccount {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbAccount'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbAccountSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbAccountStatus status = 5;
}

// AzureCosmosdbAccountStatus holds the deployment status and outputs.
message AzureCosmosdbAccountStatus {
  // stack-outputs
  AzureCosmosdbAccountStackOutputs outputs = 1;
}
