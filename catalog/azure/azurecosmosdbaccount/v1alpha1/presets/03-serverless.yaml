apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbAccount
metadata:
  name: my-serverless-cosmos
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-data-rg
      fieldPath: status.outputs.resource_group_name
  # Replace: 3-50 lowercase letters, digits, and hyphens, globally unique --
  # it becomes {name}.documents.azure.com.
  accountName: myorg-events-cosmos
  # Serverless billing: pay per request, no provisioned RU/s anywhere
  # in the account. Databases and containers must not declare
  # throughput.
  capabilities:
    - ENABLE_SERVERLESS
  consistencyPolicy:
    consistencyLevel: SESSION
  geoLocations:
    - location: eastus
      failoverPriority: 0
  # The locked-down posture: no public endpoint, no key-based access --
  # every data-plane caller authenticates through Entra ID and reaches
  # the account through a private endpoint.
  publicNetworkAccessEnabled: false
  localAuthenticationEnabled: false
  accessKeyMetadataWritesEnabled: false
  tags:
    workload: spiky-dev
