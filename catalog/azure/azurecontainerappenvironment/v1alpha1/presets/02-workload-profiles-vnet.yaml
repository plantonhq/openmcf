apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironment
metadata:
  name: my-production-env
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  environmentName: my-production-env
  infrastructureSubnetId:
    value: "<infrastructure-subnet-id>"
  logsDestination: LOG_ANALYTICS
  logAnalyticsWorkspaceId:
    value: "<log-analytics-workspace-id>"
  internalLoadBalancerEnabled: true
  zoneRedundancyEnabled: true
  mutualTlsEnabled: true
  workloadProfiles:
    - name: dedicated
      workloadProfileType: D4
      minimumCount: 1
      maximumCount: 5
  identity:
    type: SYSTEM_ASSIGNED
  tags:
    environment: production
