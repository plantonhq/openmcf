apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusDisasterRecoveryConfig
metadata:
  name: my-bus-dr
spec:
  # Becomes the failover-stable DNS identity
  # {alias}.servicebus.windows.net -- globally unique, like a namespace
  # name.
  aliasName: myorg-app-bus-alias
  primaryNamespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: my-bus-eastus
      fieldPath: status.outputs.namespace_id
  # PREMIUM, in a DIFFERENT region, and EMPTY at pairing time.
  partnerNamespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: my-bus-westus
      fieldPath: status.outputs.namespace_id
  # Least-privilege alias credentials (unset would default to the
  # namespace's root rule).
  aliasAuthorizationRuleId:
    valueFrom:
      kind: AzureServiceBusAuthorizationRule
      name: my-dr-clients-rule
      fieldPath: status.outputs.authorization_rule_id
