# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_mongo_cluster_user:
    mappings:
      # Plural list name over the provider's singular block name; the
      # role's name argument is called what it IS in the spec.
      - spec: spec.roles.database
        arg: role.database
      - spec: spec.roles.role
        arg: role.name
    exclusions:
      # Single legal value today ("MicrosoftEntraID" -- the service's
      # only identity provider on this resource). Deliberately not part
      # of the spec; both engines send it explicitly. The field widens if
      # Azure ships more providers.
      - arg: identity_provider_type
        reason: single-legal-value
