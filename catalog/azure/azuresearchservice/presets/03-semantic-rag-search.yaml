apiVersion: azure.planton.dev/v1alpha1
kind: AzureSearchService
metadata:
  name: semantic-rag-search
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  # GLOBALLY unique -- forms the endpoint {name}.search.windows.net.
  name: acme-search-rag # replace with your globally-unique name
  sku: standard
  replicaCount: 2
  # Unlimited semantic ranking, billed per 1000 queries. Use "free"
  # for the capped evaluation tier (1000 requests/month).
  semanticSearchSku: standard
  identity:
    type: SYSTEM_ASSIGNED
