apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorEndpoint
metadata:
  name: my-web-endpoint
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  # 2-46 characters; becomes the prefix of the generated public hostname
  # ({name}-{hash}.z01.azurefd.net), so pick something recognizable.
  # Renaming replaces the endpoint and CHANGES the hostname -- every DNS
  # record pointing at the old one breaks.
  endpointName: my-web
