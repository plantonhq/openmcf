apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRouteCircuitPeering
metadata:
  name: my-microsoft-peering
spec:
  resourceGroup:
    value: "<your-resource-group-name>"
  expressRouteCircuitName:
    value: "<your-circuit-name>"
  peeringType: MICROSOFT_PEERING
  vlanId: 200
  primaryPeerAddressPrefix: "<your-primary-slash-30>" # PUBLIC IPs for Microsoft peering
  secondaryPeerAddressPrefix: "<your-secondary-slash-30>"
  microsoftPeeringConfig:
    advertisedPublicPrefixes:
      - "<your-registered-public-prefix>" # must be registered to you in an internet routing registry
  routeFilterId: "<your-route-filter-arm-id>" # selects the Microsoft service communities you receive
