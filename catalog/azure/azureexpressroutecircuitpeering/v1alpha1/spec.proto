syntax = "proto3";

package dev.planton.azure.azureexpressroutecircuitpeering.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// **AzureExpressRouteCircuitPeeringSpec** defines a peering (a BGP
// routing configuration) on an ExpressRoute circuit. The circuit is the
// physical pipe; peerings are what make routes flow through it. A
// circuit carries AT MOST ONE peering of each type -- the peering type IS
// the ARM child's name -- so a fully-used circuit has up to two peerings
// (private + Microsoft).
//
// **Peering types**:
// - **AZURE_PRIVATE_PEERING**: routes your VNets' private address space
//   over the circuit -- the type virtually every deployment needs. A
//   virtual network gateway (type EXPRESS_ROUTE) connects the VNet to
//   this peering.
// - **MICROSOFT_PEERING**: routes Microsoft public services (Microsoft
//   365, Azure public IPs) over the circuit. Requires
//   microsoft_peering_config with your registered public prefixes, and
//   optionally a route filter to select service communities.
// - **AZURE_PUBLIC_PEERING**: deprecated by Azure for new circuits --
//   Microsoft peering is its successor.
//
// **Addressing**: IPv4 peering uses a /30 pair (primary + secondary --
// one per physical link); IPv6 adds /126 pairs via the `ipv6` block.
// The VLAN id must be unique on the circuit.
//
// **Provisioning order**: ARM accepts and STORES peering configuration
// on a circuit whose provider state is still "NotProvisioned"
// (live-verified for private peering) -- deploying the peering before
// the carrier handoff is legal sequencing, and the BGP session simply
// cannot establish until the provider completes the cross-connect.
// Microsoft peering validates advertised public prefixes server-side
// and has not been exercised on an unprovisioned circuit -- do not
// assume its create behaves the same way.
//
// **ForceNew fields**: `express_route_circuit_name`, `resource_group`,
// and `peering_type` (the ARM identity) -- the routing configuration
// itself updates in place.
message AzureExpressRouteCircuitPeeringSpec {
  // The Azure resource group the parent circuit lives in. Can be a
  // literal resource-group name or a reference to an
  // AzureResourceGroup's name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_group = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_name"
  ];

  // The parent ExpressRoute circuit, by NAME (ARM addresses peerings as
  // children of the circuit name, not the circuit id). Can be a literal
  // name or a reference to an AzureExpressRouteCircuit's name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef express_route_circuit_name = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureExpressRouteCircuit,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.express_route_circuit_name"
  ];

  // The peering type -- also the ARM child's NAME, so a circuit carries
  // at most one peering of each type. Fixed at creation.
  AzureExpressRouteCircuitPeeringType peering_type = 3 [(buf.validate.field).enum.defined_only = true];

  // The 802.1Q VLAN id the provider tags this peering's traffic with,
  // 1-4094. Must be unique across the circuit's peerings (your
  // connectivity provider assigns or confirms it).
  int32 vlan_id = 4 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 4094
  ];

  // The IPv4 /30 for the PRIMARY link's point-to-point BGP session --
  // your router gets the first usable address, Microsoft's the second.
  // Set with secondary_peer_address_prefix (the pair travels together).
  string primary_peer_address_prefix = 5;

  // The IPv4 /30 for the SECONDARY link's point-to-point BGP session.
  // Set with primary_peer_address_prefix.
  string secondary_peer_address_prefix = 6;

  // Whether the IPv4 peering is enabled. Disabling keeps the
  // configuration but withdraws the routes -- useful for maintenance
  // without tearing the peering down.
  optional bool ipv4_enabled = 7 [(dev.planton.shared.options.default) = "true"];

  // Your side's BGP Autonomous System Number. Leave 0 to let Azure
  // record the ASN your router presents; set it when the provider
  // requires it declared up front.
  int64 peer_asn = 8 [(buf.validate.field).int64.gte = 0];

  // The MD5 hash key for the BGP sessions, 1-25 characters. Reference a
  // secret rather than embedding the literal in manifests. ARM never
  // returns it on reads.
  dev.planton.shared.foreignkey.v1.StringValueOrRef shared_key = 9 [(dev.planton.shared.options.sensitive) = true];

  // MICROSOFT_PEERING only: the public-prefix advertisement contract --
  // which of your registered public prefixes Microsoft accepts routes
  // for. REQUIRED (by ARM) when the peering type is MICROSOFT_PEERING
  // and IPv4 prefixes are configured.
  AzureExpressRouteCircuitPeeringMicrosoftConfig microsoft_peering_config = 10;

  // The IPv6 half of the peering: /126 address pairs and (for Microsoft
  // peering) its own advertisement contract. Private and Microsoft
  // peering only -- ARM rejects IPv6 on the deprecated public peering.
  AzureExpressRouteCircuitPeeringIpv6 ipv6 = 11;

  // MICROSOFT_PEERING only: a Route Filter's ARM id selecting which
  // Microsoft service communities (BGP communities for Microsoft 365,
  // Azure regions) are advertised to you. Without one, Microsoft
  // peering advertises nothing.
  string route_filter_id = 12;

  // GLOBAL REACH: connections from THIS circuit's private peering to
  // OTHER circuits' private peerings, linking the on-premises sites
  // behind them across the Microsoft backbone. Each entry creates an
  // ARM circuit-connection child under this peering. Private peering
  // only.
  repeated AzureExpressRouteCircuitPeeringConnection connections = 13;

  // The peering type is the ARM identity -- it is chosen explicitly.
  option (buf.validate.message).cel = {
    id: "peering_type_required"
    message: "Choose the peering type explicitly -- AZURE_PRIVATE_PEERING for VNet connectivity (the common case) or MICROSOFT_PEERING for Microsoft public services"
    expression: "this.peering_type != 0"
  };
  option (buf.validate.message).cel = {
    id: "address_prefix_pair_travels_together"
    message: "primary_peer_address_prefix and secondary_peer_address_prefix are set together -- one /30 per physical link"
    expression: "(this.primary_peer_address_prefix == '') == (this.secondary_peer_address_prefix == '')"
  };
  option (buf.validate.message).cel = {
    id: "route_filter_is_microsoft_peering_only"
    message: "route_filter_id applies to MICROSOFT_PEERING only -- private peering carries no service communities to filter"
    expression: "this.route_filter_id == '' || this.peering_type == 3"
  };
  option (buf.validate.message).cel = {
    id: "microsoft_config_is_microsoft_peering_only"
    message: "microsoft_peering_config applies to MICROSOFT_PEERING only"
    expression: "!has(this.microsoft_peering_config) || this.peering_type == 3"
  };
  // ARM's Microsoft-peering co-requirements, front-loaded from the
  // provider's own create-time checks.
  option (buf.validate.message).cel = {
    id: "microsoft_ipv4_requires_config"
    message: "Microsoft peering with IPv4 prefixes needs microsoft_peering_config (the advertised-prefix contract)"
    expression: "!(this.peering_type == 3 && this.primary_peer_address_prefix != '') || has(this.microsoft_peering_config)"
  };
  option (buf.validate.message).cel = {
    id: "microsoft_config_requires_ipv4_prefixes"
    message: "microsoft_peering_config configures the IPv4 session -- set primary_peer_address_prefix and secondary_peer_address_prefix with it"
    expression: "!has(this.microsoft_peering_config) || this.primary_peer_address_prefix != ''"
  };
  option (buf.validate.message).cel = {
    id: "ipv6_not_on_public_peering"
    message: "IPv6 configuration applies to AZURE_PRIVATE_PEERING and MICROSOFT_PEERING only (public peering is deprecated and IPv4-only)"
    expression: "!has(this.ipv6) || this.peering_type != 2"
  };
  option (buf.validate.message).cel = {
    id: "connections_are_private_peering_only"
    message: "Global Reach connections link PRIVATE peerings -- set peering_type to AZURE_PRIVATE_PEERING or remove connections"
    expression: "this.connections.size() == 0 || this.peering_type == 1"
  };
  option (buf.validate.message).cel = {
    id: "connection_names_unique"
    message: "Global Reach connection names must be unique on the peering"
    expression: "this.connections.all(c, this.connections.filter(o, o.name == c.name).size() == 1)"
  };
}

// The peering type -- the ARM child name on the circuit.
enum AzureExpressRouteCircuitPeeringType {
  // Not specified -- invalid: the type is the peering's ARM identity
  // (see the peering_type_required contract).
  azure_express_route_circuit_peering_type_unspecified = 0;

  // Private connectivity to your VNets -- what an EXPRESS_ROUTE virtual
  // network gateway connects to. Wire value "AzurePrivatePeering".
  AZURE_PRIVATE_PEERING = 1;

  // DEPRECATED by Azure for new circuits -- Microsoft peering is the
  // successor. Wire value "AzurePublicPeering".
  AZURE_PUBLIC_PEERING = 2;

  // Microsoft public services (Microsoft 365, Azure public IPs) over
  // the circuit. Wire value "MicrosoftPeering".
  MICROSOFT_PEERING = 3;
}

// The Microsoft-peering advertisement contract: which of your PUBLIC
// prefixes Microsoft accepts, and how ownership is validated.
message AzureExpressRouteCircuitPeeringMicrosoftConfig {
  // The public IPv4 prefixes you will advertise to Microsoft. Each must
  // be registered to you (or to customer_asn) in an internet routing
  // registry -- Microsoft validates ownership before activating the
  // peering.
  repeated string advertised_public_prefixes = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  // The customer ASN the prefixes are registered under, when routes are
  // advertised on behalf of a downstream customer of yours. 0 (the
  // default) means the prefixes are registered to peer_asn itself.
  int64 customer_asn = 2 [(buf.validate.field).int64.gte = 0];

  // The internet routing registry Microsoft validates prefix ownership
  // against (e.g. "ARIN", "RIPE", "AFRINIC"). "NONE" (the default) lets
  // Microsoft use its standard validation.
  optional string routing_registry_name = 3 [(dev.planton.shared.options.default) = "NONE"];

  // BGP community values tagged onto the advertised routes (e.g.
  // "12076:20000" service selectors).
  repeated string advertised_communities = 4 [(buf.validate.field).repeated.items.string.min_len = 1];
}

// The IPv6 half of a peering: its own /126 pairs, enable switch, route
// filter, and (Microsoft peering) advertisement contract.
message AzureExpressRouteCircuitPeeringIpv6 {
  // The IPv6 /126 for the PRIMARY link's BGP session.
  string primary_peer_address_prefix = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The IPv6 /126 for the SECONDARY link's BGP session.
  string secondary_peer_address_prefix = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Whether the IPv6 peering is enabled. Disabling withdraws the IPv6
  // routes while keeping the configuration.
  optional bool enabled = 3 [(dev.planton.shared.options.default) = "true"];

  // MICROSOFT_PEERING only: a Route Filter's ARM id for the IPv6
  // session's service communities.
  string route_filter_id = 4;

  // MICROSOFT_PEERING only: the IPv6 advertisement contract (public
  // IPv6 prefixes registered to you).
  AzureExpressRouteCircuitPeeringMicrosoftConfig microsoft_peering = 5;
}

// One Global Reach connection: links THIS circuit's private peering to
// another circuit's private peering, so the on-premises sites behind
// both circuits reach each other over the Microsoft backbone.
message AzureExpressRouteCircuitPeeringConnection {
  // The connection's name, unique on the peering. 1-80 characters; must
  // begin with a letter or number, end with a letter, number, or
  // underscore, and may contain only letters, numbers, underscores,
  // periods, or hyphens. Fixed at creation.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 80,
    (buf.validate.field).cel = {
      id: "connection_name_format"
      message: "Connection names start with a letter or number, end with a letter, number, or underscore, and may contain alphanumerics, underscores, periods, and hyphens"
      expression: "this == '' || this.matches('^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9_])?$')"
    }
  ];

  // The FAR side: the other circuit's private peering, by ARM id.
  // References another AzureExpressRouteCircuitPeering's id output.
  // Fixed at creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef peer_peering_id = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureExpressRouteCircuitPeering,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.express_route_circuit_peering_id"
  ];

  // A /29 IPv4 block used for the connection's tunnel addressing. Must
  // not overlap either side's address space. Fixed at creation.
  string address_prefix_ipv4 = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // A /125 IPv6 block for the connection's tunnel addressing.
  // ARM-enforced at deploy time: not allowed when the parent circuit is
  // ExpressRoute-Direct (port) based.
  string address_prefix_ipv6 = 4;

  // The authorization key redeemed when the FAR circuit belongs to a
  // different subscription -- issued by that circuit's authorizations
  // list. A UUID. Reference a secret rather than embedding the literal
  // in manifests. ARM masks it on reads, so an imported connection
  // legitimately plans an in-place update on it.
  dev.planton.shared.foreignkey.v1.StringValueOrRef authorization_key = 5 [(dev.planton.shared.options.sensitive) = true];
}
