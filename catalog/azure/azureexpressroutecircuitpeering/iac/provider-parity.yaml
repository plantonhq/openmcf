# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_express_route_circuit_peering:
    mappings:
      # Family-wide rename: the spec says what the field IS (a resource
      # group), where the provider inherits ARM's terser property name.
      - spec: spec.resource_group
        arg: resource_group_name

  azurerm_express_route_circuit_connection:
    # Instantiated per spec.connections entry (Global Reach links from
    # this private peering to other circuits' private peerings).
    specRoot: spec.connections
    exclusions:
      - arg: peering_id
        reason: wired by the module to the peering it creates (the near side) -- only the far side is user surface
