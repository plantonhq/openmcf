apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCacheAccessPolicy
metadata:
  name: my-app-writer-policy
spec:
  redisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  policyName: <policyName>
  # Full data access on the app's prefix with the dangerous category
  # carved out -- no FLUSHALL, no CONFIG, no SHUTDOWN. What the built-in
  # "Data Contributor" would be if it also scoped keys.
  permissions: "+@all -@dangerous ~<keyPrefix>:*"
