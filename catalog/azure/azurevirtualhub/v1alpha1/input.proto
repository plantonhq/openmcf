syntax = "proto3";

package dev.planton.azure.azurevirtualhub.v1alpha1;

import "catalog/azure/azurevirtualhub/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureVirtualHubStackInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureVirtualHubStackInput {
  // The Virtual Hub resource to deploy.
  AzureVirtualHub target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
