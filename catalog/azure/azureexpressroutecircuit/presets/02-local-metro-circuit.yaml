apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRouteCircuit
metadata:
  name: my-metro-circuit
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-metro-circuit
  skuTier: LOCAL # metro-only reach, NO egress fees
  skuFamily: UNLIMITED_DATA # LOCAL pairs naturally with unlimited
  serviceProviderName: "<your-connectivity-provider>"
  peeringLocation: "<your-peering-location>"
  bandwidthInMbps: 1000
