apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualNetworkGatewayConnection
metadata:
  name: my-pinned-connection
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: hq-to-azure-pinned
  type: IPSEC
  virtualNetworkGatewayId:
    valueFrom:
      name: <your-virtual-network-gateway-resource-name>
  localNetworkGatewayId:
    valueFrom:
      name: <your-local-network-gateway-resource-name>
  sharedKey:
    valueFrom:
      kind: Secret
      name: <your-tunnel-psk-secret-name>
  dpdTimeoutSeconds: 45
  ipsecPolicy:
    dhGroup: DHGroup14
    ikeEncryption: AES256
    ikeIntegrity: SHA256
    ipsecEncryption: AES256
    ipsecIntegrity: SHA256
    pfsGroup: PFS2048
