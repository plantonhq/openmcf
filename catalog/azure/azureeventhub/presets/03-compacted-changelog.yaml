apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventHub
metadata:
  name: my-changelog-stream
spec:
  namespaceId:
    valueFrom:
      kind: AzureEventHubNamespace
      name: my-telemetry-hubs
      fieldPath: status.outputs.namespace_id
  eventHubName: entity-changelog
  partitionCount: 4
  # Kafka-style log compaction: the hub keeps the LATEST event per
  # partition key forever -- changelog/table semantics for materialized
  # views and cache warming. Tombstones (null-value events marking a
  # key deleted) stay readable for 24 hours so consumers observe
  # deletions. The cleanup policy is fixed at creation.
  retentionDescription:
    cleanupPolicy: COMPACT
    tombstoneRetentionTimeInHours: 24
