syntax = "proto3";

package dev.planton.azure.azuremanageddisk.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// **AzureManagedDiskSpec** defines the configuration for creating an Azure
// Managed Disk: the standalone block storage volume virtual machines
// attach for data that must outlive any one VM.
//
// The disk is a first-class resource in Azure's own model -- it has its
// own lifecycle, SKU, encryption, and network posture, and a VM ATTACHES
// it rather than containing it:
// - an AzureVirtualMachine's data_disk_attachments references this disk's
//   disk_id output (with a LUN and caching mode),
// - a shared disk (max_shares) attaches to SEVERAL VMs at once -- the
//   clustered-database seam that only a standalone disk can express,
// - detaching and re-attaching to a replacement VM is the disk's whole
//   point: the data outlives the machine.
//
// The create_option is the disk's origin story -- an empty volume, a copy
// of a snapshot or another disk, a platform or gallery image's disk, an
// imported VHD, or a direct-upload target -- and the source fields it
// requires are enforced by spec-level validation exactly as ARM enforces
// them.
message AzureManagedDiskSpec {
  // The Azure region the disk lives in, e.g. "eastus". A disk can only
  // attach to VMs in its own region (and zone, when pinned). Changing the
  // region replaces the disk.
  string region = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The Azure resource group the disk will be created in. Can be a
  // literal resource-group name or a reference to an AzureResourceGroup's
  // name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_group = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_name"
  ];

  // The name of the disk, unique within the resource group. 1-80
  // characters (alphanumerics, underscores, periods, and hyphens).
  // Changing the name replaces the disk -- name it after the data it
  // carries ("orders-db-data"), not the VM it happens to attach to.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 80,
    (buf.validate.field).cel = {
      id: "managed_disk_name_format"
      message: "Managed disk names start with a letter or number, end with a letter, number, or underscore, and may contain alphanumerics, underscores, periods, and hyphens"
      expression: "this == '' || this.matches('^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9_])?$')"
    }
  ];

  // The disk's storage SKU -- the fundamental performance/redundancy
  // choice. STANDARD_LRS (HDD) for cold data; STANDARD_SSD_LRS/_ZRS for
  // light workloads; PREMIUM_LRS/_ZRS for production databases and OS
  // disks (fixed per-size performance tiers, credit-based bursting);
  // PREMIUM_V2_LRS and ULTRA_SSD_LRS decouple capacity from performance
  // -- size, IOPS, and throughput are dialed independently (the
  // disk_iops_*/disk_mbps_* fields). The ZRS variants replicate across
  // availability zones and cannot also be zone-pinned. Updatable in place
  // between compatible SKUs (the attached VM size must support the
  // target).
  AzureManagedDiskStorageAccountType storage_account_type = 4 [(buf.validate.field).required = true];

  // How the disk is created -- its origin story. Fixed at creation:
  // EMPTY provisions a blank volume (set disk_size_gb); COPY clones an
  // existing disk or snapshot (set source_resource_id); FROM_IMAGE copies
  // a platform/marketplace image's disk (set image_reference_id) or a
  // Shared Image Gallery version (set gallery_image_reference_id);
  // IMPORT/IMPORT_SECURE wrap an existing VHD blob (set source_uri +
  // storage_account_id); RESTORE materializes a backup recovery point
  // (set source_resource_id); UPLOAD creates a direct-upload target (set
  // upload_size_bytes).
  AzureManagedDiskCreateOption create_option = 5 [(buf.validate.field).required = true];

  // The disk's size in GiB (1-65536; the upper reaches need
  // PREMIUM_V2_LRS/ULTRA_SSD_LRS). Required for EMPTY; for COPY and
  // FROM_IMAGE it may be omitted to inherit the source's size, or set
  // larger to grow at creation. Size can only ever INCREASE -- growing an
  // attached disk may briefly detach or deallocate the VM except where
  // Azure supports live resize.
  optional int32 disk_size_gb = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65536
  }];

  // For COPY: the ARM ID of the managed disk or snapshot to clone. For
  // RESTORE: the recovery point to materialize. Fixed at creation.
  string source_resource_id = 7;

  // For IMPORT/IMPORT_SECURE: the URI of the VHD blob to wrap. Fixed at
  // creation.
  string source_uri = 8;

  // For IMPORT/IMPORT_SECURE: the ARM ID of the storage account holding
  // source_uri. Fixed at creation.
  string storage_account_id = 9;

  // For FROM_IMAGE: the ARM ID of the platform/marketplace image to copy.
  // Exactly one of image_reference_id / gallery_image_reference_id.
  // Fixed at creation.
  string image_reference_id = 10;

  // For FROM_IMAGE: the ARM ID of the Shared Image Gallery version to
  // copy. Exactly one of image_reference_id / gallery_image_reference_id.
  // Fixed at creation.
  string gallery_image_reference_id = 11;

  // For UPLOAD: the upload target's size in BYTES, which must equal the
  // source VHD's byte size exactly (footer included). Fixed at creation.
  int64 upload_size_bytes = 12;

  // For disks carrying an operating system (IMPORT/IMPORT_SECURE/COPY of
  // an OS disk): which OS it holds. Leave unspecified for data disks.
  AzureManagedDiskOsType os_type = 13;

  // The Hyper-V boot generation for OS-carrying disks (V2 = UEFI, the
  // modern default for trusted launch and confidential VMs; V1 = BIOS).
  // IMPORT_SECURE requires V2. Leave unspecified for data disks. Fixed at
  // creation.
  AzureManagedDiskHyperVGeneration hyper_v_generation = 14;

  // The availability zone to pin the disk to ("1", "2", or "3"). A zonal
  // disk only attaches to VMs in the same zone. Leave unset for regional
  // (non-zonal) or ZRS disks -- a ZRS SKU must not also be zone-pinned.
  // Fixed at creation.
  string zone = 15 [(buf.validate.field).string = {
    in: [
      "",
      "1",
      "2",
      "3"
    ]
  }];

  // Provisioned read/write IOPS, for PREMIUM_V2_LRS and ULTRA_SSD_LRS
  // only (other SKUs have fixed per-size performance). One I/O operation
  // moves 4k-256k bytes. Updatable in place.
  optional int32 disk_iops_read_write = 16 [(buf.validate.field).int32.gte = 1];

  // Provisioned read/write throughput in MBps, for PREMIUM_V2_LRS and
  // ULTRA_SSD_LRS only. Updatable in place.
  optional int32 disk_mbps_read_write = 17 [(buf.validate.field).int32.gte = 1];

  // IOPS budget shared by VMs mounting a SHARED disk read-only (requires
  // max_shares; PREMIUM_V2_LRS/ULTRA_SSD_LRS only). Updatable in place.
  optional int32 disk_iops_read_only = 18 [(buf.validate.field).int32.gte = 1];

  // Throughput budget (MBps) shared by VMs mounting a SHARED disk
  // read-only (requires max_shares; PREMIUM_V2_LRS/ULTRA_SSD_LRS only).
  // Updatable in place.
  optional int32 disk_mbps_read_only = 19 [(buf.validate.field).int32.gte = 1];

  // The performance tier for PREMIUM_LRS/PREMIUM_ZRS disks (e.g. "P30"),
  // decoupling performance from size -- a small disk can buy a bigger
  // tier's IOPS for bursty workloads, and pre-provisioned tiers avoid
  // resize-for-performance. Leave unset for the size's default tier.
  // Changing it on an attached disk briefly deallocates the VM.
  string tier = 20;

  // The maximum number of VMs that can attach this disk simultaneously
  // (2-10) -- the shared-disk seam clustered workloads (failover
  // databases, scale-out file systems) build on. Leave unset for a
  // normal single-attach disk. The limit depends on SKU and size.
  optional int32 max_shares = 21 [(buf.validate.field).int32 = {
    gte: 2
    lte: 10
  }];

  // Whether on-demand bursting is enabled, for PREMIUM_LRS/PREMIUM_ZRS
  // disks larger than 512 GiB: the disk bursts beyond its provisioned
  // tier on demand (billed per burst) instead of relying on the
  // credit-based bursting smaller premium disks get automatically.
  bool on_demand_bursting_enabled = 22;

  // The disk's logical sector size in bytes (512 or 4096), for
  // PREMIUM_V2_LRS/ULTRA_SSD_LRS only. Azure's default is 4096; choose
  // 512 only for legacy applications that require it. Fixed at creation.
  optional int32 logical_sector_size = 23 [(buf.validate.field).int32 = {
    in: [
      512,
      4096
    ]
  }];

  // The customer-managed-key disk encryption set encrypting this disk.
  // A disk encryption set by ARM ID, or a reference to an
  // AzureDiskEncryptionSet's output. Conflicts with
  // secure_vm_disk_encryption_set_id.
  dev.planton.shared.foreignkey.v1.StringValueOrRef disk_encryption_set_id = 24 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDiskEncryptionSet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.disk_encryption_set_id"
  ];

  // For CONFIDENTIAL_VM_DISK_ENCRYPTED_WITH_CUSTOMER_KEY security: the
  // disk encryption set encrypting the confidential VM's guest state.
  // A disk encryption set by ARM ID, or a reference to an
  // AzureDiskEncryptionSet's output. Conflicts with
  // disk_encryption_set_id. Fixed at creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef secure_vm_disk_encryption_set_id = 25 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDiskEncryptionSet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.disk_encryption_set_id"
  ];

  // The confidential-VM security profile for OS disks of confidential
  // VMs. Leave unspecified for everything else. When set to
  // CONFIDENTIAL_VM_DISK_ENCRYPTED_WITH_CUSTOMER_KEY, create_option must
  // be FROM_IMAGE or IMPORT_SECURE and secure_vm_disk_encryption_set_id
  // is required. Cannot be combined with trusted_launch_enabled. Fixed
  // at creation.
  AzureManagedDiskSecurityType security_type = 26;

  // Whether trusted launch (secure boot + vTPM support) is enabled for
  // this OS disk. Only valid when create_option is FROM_IMAGE or IMPORT
  // and the image supports it; cannot be combined with security_type.
  // Fixed at creation.
  bool trusted_launch_enabled = 27;

  // The disk's network access posture. Unspecified applies Azure's
  // default (ALLOW_ALL: the disk's export endpoint is reachable over the
  // network with proper authorization). ALLOW_PRIVATE restricts export
  // to the disk-access resource's private endpoints (set disk_access_id);
  // DENY_ALL disables network export entirely -- the lockdown posture
  // for disks that never need SAS-based export.
  AzureManagedDiskNetworkAccessPolicy network_access_policy = 28;

  // For ALLOW_PRIVATE: the disk-access resource whose private endpoints
  // export traffic uses, by ARM ID. Plain ARM ID: disk-access resources
  // are not modeled as a Planton kind.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Compute/diskAccesses/{name}
  string disk_access_id = 29;

  // Whether the disk's export endpoint is reachable over the public
  // network at all. Azure's default is true; false pairs with
  // ALLOW_PRIVATE for a fully private posture. Updatable in place.
  optional bool public_network_access_enabled = 30 [(dev.planton.shared.options.default) = "true"];

  // Whether the disk skips fault-domain alignment with its VM to
  // optimize for very frequent attach/detach cycles (more than 5 a day).
  // Azure's default is false; leaving alignment on is right for
  // virtually all disks.
  bool optimized_frequent_attach_enabled = 31;

  // Whether performance-plus is enabled, raising the baseline IOPS/
  // throughput of an eligible disk (512 GiB+, deployed from a supported
  // create option). Fixed at creation.
  bool performance_plus_enabled = 32;

  // The Azure Edge Zone the disk is deployed in, for edge-computing
  // workloads. Leave unset for regular regional deployment. Fixed at
  // creation.
  string edge_zone = 33;

  // Free-form tags applied to the disk, merged over the Planton-derived
  // resource tags (organization, environment, resource id); a user tag
  // with the same key wins. Tags are Azure's governance surface -- Azure
  // Policy enforces them and Microsoft Cost Management groups by them.
  // Updatable in place.
  map<string, string> tags = 34;

  option (buf.validate.message).cel = {
    id: "disk_empty_requires_size"
    message: "create_option EMPTY requires disk_size_gb"
    expression: "this.create_option != 1 || has(this.disk_size_gb)"
  };

  option (buf.validate.message).cel = {
    id: "disk_copy_restore_requires_source_resource"
    message: "create_option COPY and RESTORE require source_resource_id (the disk/snapshot to clone or the recovery point to restore)"
    expression: "(this.create_option != 2 && this.create_option != 6) || this.source_resource_id != ''"
  };

  option (buf.validate.message).cel = {
    id: "disk_import_requires_source_uri_and_account"
    message: "create_option IMPORT and IMPORT_SECURE require source_uri and storage_account_id"
    expression: "(this.create_option != 4 && this.create_option != 5) || (this.source_uri != '' && this.storage_account_id != '')"
  };

  option (buf.validate.message).cel = {
    id: "disk_from_image_requires_exactly_one_image"
    message: "create_option FROM_IMAGE requires exactly one of image_reference_id (platform/marketplace) or gallery_image_reference_id (Shared Image Gallery)"
    expression: "this.create_option != 3 || ((this.image_reference_id != '') != (this.gallery_image_reference_id != ''))"
  };

  option (buf.validate.message).cel = {
    id: "disk_image_sources_only_for_from_image"
    message: "image_reference_id and gallery_image_reference_id are only valid with create_option FROM_IMAGE"
    expression: "this.create_option == 3 || (this.image_reference_id == '' && this.gallery_image_reference_id == '')"
  };

  option (buf.validate.message).cel = {
    id: "disk_upload_requires_byte_size"
    message: "create_option UPLOAD requires upload_size_bytes (the exact byte size of the VHD to upload, footer included)"
    expression: "(this.create_option == 7) == (this.upload_size_bytes != 0)"
  };

  option (buf.validate.message).cel = {
    id: "disk_performance_dials_need_flexible_sku"
    message: "disk_iops_*/disk_mbps_*/logical_sector_size are only settable on PREMIUM_V2_LRS and ULTRA_SSD_LRS (other SKUs have fixed per-size performance)"
    expression: "(this.storage_account_type == 6 || this.storage_account_type == 7) || (!has(this.disk_iops_read_write) && !has(this.disk_mbps_read_write) && !has(this.disk_iops_read_only) && !has(this.disk_mbps_read_only) && !has(this.logical_sector_size))"
  };

  option (buf.validate.message).cel = {
    id: "disk_read_only_dials_need_shared_disk"
    message: "disk_iops_read_only/disk_mbps_read_only require max_shares (they budget the read-only mounts of a shared disk)"
    expression: "has(this.max_shares) || (!has(this.disk_iops_read_only) && !has(this.disk_mbps_read_only))"
  };

  option (buf.validate.message).cel = {
    id: "disk_bursting_and_tier_need_premium"
    message: "tier and on_demand_bursting_enabled apply to PREMIUM_LRS/PREMIUM_ZRS disks only"
    expression: "(this.storage_account_type == 4 || this.storage_account_type == 5) || (this.tier == '' && !this.on_demand_bursting_enabled)"
  };

  option (buf.validate.message).cel = {
    id: "disk_encryption_sets_conflict"
    message: "disk_encryption_set_id and secure_vm_disk_encryption_set_id are mutually exclusive"
    expression: "!(has(this.disk_encryption_set_id) && has(this.secure_vm_disk_encryption_set_id))"
  };

  option (buf.validate.message).cel = {
    id: "disk_secure_vm_set_pairs_with_cvm_customer_key"
    message: "secure_vm_disk_encryption_set_id is required when security_type is CONFIDENTIAL_VM_DISK_ENCRYPTED_WITH_CUSTOMER_KEY, and only valid then"
    expression: "(this.security_type == 3) == has(this.secure_vm_disk_encryption_set_id)"
  };

  option (buf.validate.message).cel = {
    id: "disk_cvm_customer_key_create_options"
    message: "security_type CONFIDENTIAL_VM_DISK_ENCRYPTED_WITH_CUSTOMER_KEY requires create_option FROM_IMAGE or IMPORT_SECURE"
    expression: "this.security_type != 3 || this.create_option == 3 || this.create_option == 5"
  };

  option (buf.validate.message).cel = {
    id: "disk_trusted_launch_conflicts_security_type"
    message: "trusted_launch_enabled cannot be combined with security_type (a disk is trusted-launch or confidential, not both)"
    expression: "!this.trusted_launch_enabled || this.security_type == 0"
  };

  option (buf.validate.message).cel = {
    id: "disk_trusted_launch_create_options"
    message: "trusted_launch_enabled requires create_option FROM_IMAGE or IMPORT"
    expression: "!this.trusted_launch_enabled || this.create_option == 3 || this.create_option == 4"
  };

  option (buf.validate.message).cel = {
    id: "disk_access_pairs_with_allow_private"
    message: "disk_access_id is required when network_access_policy is ALLOW_PRIVATE, and only valid then"
    expression: "(this.network_access_policy == 2) == (this.disk_access_id != '')"
  };

  option (buf.validate.message).cel = {
    id: "disk_zrs_cannot_be_zonal"
    message: "a ZRS disk replicates across zones and cannot also be pinned to one (leave zone unset)"
    expression: "(this.storage_account_type != 3 && this.storage_account_type != 5) || this.zone == ''"
  };
}

// The storage SKU of a managed disk.
enum AzureManagedDiskStorageAccountType {
  // Not specified -- invalid; the SKU is the disk's fundamental choice
  // and must be explicit.
  azure_managed_disk_storage_account_type_unspecified = 0;

  // HDD, locally redundant: cold data, dev/test, infrequent access.
  STANDARD_LRS = 1;

  // SSD, locally redundant: light production, web servers, small
  // databases.
  STANDARD_SSD_LRS = 2;

  // SSD, zone redundant: light workloads that must survive a zone
  // outage.
  STANDARD_SSD_ZRS = 3;

  // Premium SSD, locally redundant: the production default for OS disks
  // and databases (fixed per-size tiers, credit-based bursting).
  PREMIUM_LRS = 4;

  // Premium SSD, zone redundant: premium performance that survives a
  // zone outage.
  PREMIUM_ZRS = 5;

  // Premium SSD v2: capacity, IOPS, and throughput dialed independently
  // (data disks only; no OS disks).
  PREMIUM_V2_LRS = 6;

  // Ultra Disk: the highest performance envelope, dialed independently;
  // zonal only, data disks only.
  ULTRA_SSD_LRS = 7;
}

// How a managed disk is created -- its origin story. Fixed at creation.
enum AzureManagedDiskCreateOption {
  // Not specified -- invalid; every disk has an origin.
  azure_managed_disk_create_option_unspecified = 0;

  // A blank volume of disk_size_gb.
  EMPTY = 1;

  // A clone of an existing managed disk or snapshot (source_resource_id).
  COPY = 2;

  // A copy of a platform/marketplace image's disk (image_reference_id)
  // or a Shared Image Gallery version (gallery_image_reference_id).
  FROM_IMAGE = 3;

  // Wraps an existing VHD blob (source_uri + storage_account_id).
  IMPORT = 4;

  // Securely imports a VHD for confidential-VM scenarios (source_uri +
  // storage_account_id; hyper_v_generation must be V2).
  IMPORT_SECURE = 5;

  // Materializes a backup recovery point (source_resource_id).
  RESTORE = 6;

  // A direct-upload target for streaming a VHD without a staging
  // storage account (upload_size_bytes).
  UPLOAD = 7;
}

// The operating system a disk carries, for OS-carrying imports/copies.
// Unspecified means a data disk.
enum AzureManagedDiskOsType {
  // Not specified: a data disk.
  azure_managed_disk_os_type_unspecified = 0;

  // The disk carries Linux.
  LINUX = 1;

  // The disk carries Windows.
  WINDOWS = 2;
}

// The Hyper-V boot generation of an OS-carrying disk. Unspecified means a
// data disk (or Azure's default for the image).
enum AzureManagedDiskHyperVGeneration {
  // Not specified: data disk, or the image's own generation.
  azure_managed_disk_hyper_v_generation_unspecified = 0;

  // BIOS boot -- legacy images only.
  V1 = 1;

  // UEFI boot -- the modern generation; required for IMPORT_SECURE,
  // trusted launch, and confidential VMs.
  V2 = 2;
}

// The confidential-VM security profile of an OS disk. Unspecified means a
// regular (or trusted-launch) disk.
enum AzureManagedDiskSecurityType {
  // Not specified: not a confidential-VM disk.
  azure_managed_disk_security_type_unspecified = 0;

  // Only the VM guest state is encrypted, with a platform-managed key.
  CONFIDENTIAL_VM_VMGUEST_STATE_ONLY_ENCRYPTED_WITH_PLATFORM_KEY = 1;

  // The full disk is encrypted with a platform-managed key.
  CONFIDENTIAL_VM_DISK_ENCRYPTED_WITH_PLATFORM_KEY = 2;

  // The full disk is encrypted with a customer-managed key (set
  // secure_vm_disk_encryption_set_id; create_option FROM_IMAGE or
  // IMPORT_SECURE).
  CONFIDENTIAL_VM_DISK_ENCRYPTED_WITH_CUSTOMER_KEY = 3;
}

// The disk's network export posture. Unspecified means Azure's default
// (AllowAll).
enum AzureManagedDiskNetworkAccessPolicy {
  // Not specified: Azure's default (AllowAll).
  azure_managed_disk_network_access_policy_unspecified = 0;

  // The disk's export endpoint is reachable with proper authorization.
  ALLOW_ALL = 1;

  // Export only through the disk-access resource's private endpoints
  // (set disk_access_id).
  ALLOW_PRIVATE = 2;

  // Network export disabled entirely -- the lockdown posture.
  DENY_ALL = 3;
}
