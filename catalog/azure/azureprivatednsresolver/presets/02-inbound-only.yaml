apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsResolver
metadata:
  name: inbound-dns-resolver
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  name: inbound-dns-resolver
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "<your-hub-vnet>"
      fieldPath: status.outputs.virtual_network_id
  # STATIC pins the address so datacenter forwarder configurations
  # never need to change -- pick a free address from the endpoint
  # subnet's range.
  inboundEndpoints:
    - name: inbound
      subnetId:
        valueFrom:
          kind: AzureSubnet
          name: "<your-dns-inbound-subnet>"
          fieldPath: status.outputs.subnet_id
      privateIpAllocationMethod: STATIC
      privateIpAddress: "10.0.4.4"
