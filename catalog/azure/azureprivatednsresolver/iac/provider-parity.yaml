# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_private_dns_resolver:
    mappings:
      # Family-wide renames: the spec says what the field IS (an Azure
      # region, a resource group), where the provider inherits ARM's
      # terser property names.
      - spec: spec.region
        arg: location
      - spec: spec.resource_group
        arg: resource_group_name

  azurerm_private_dns_resolver_inbound_endpoint:
    # Instantiated per spec.inbound_endpoints entry (composed ARM
    # children; the effective private IPs surface in the name-keyed
    # inbound_endpoint_ips output, the first entry's in the singular
    # inbound_endpoint_ip).
    specRoot: spec.inbound_endpoints
    mappings:
      # The provider wraps the endpoint's three network fields in a
      # single-item ip_configurations block (MaxItems 1); the spec
      # flattens them onto the endpoint entry itself.
      - spec: spec.inbound_endpoints
        arg: ip_configurations
      # Endpoints deploy into the resolver's region and carry the
      # component's one tag set.
      - spec: spec.region
        arg: location
      - spec: spec.tags
        arg: tags
    exclusions:
      - arg: private_dns_resolver_id
        reason: wired by the module to the resolver it creates -- never user surface

  azurerm_private_dns_resolver_outbound_endpoint:
    # Instantiated per spec.outbound_endpoints entry (composed ARM
    # children; ids surface in the name-keyed outbound_endpoint_ids
    # output, the first entry's in the singular outbound_endpoint_id).
    specRoot: spec.outbound_endpoints
    mappings:
      - spec: spec.region
        arg: location
      - spec: spec.tags
        arg: tags
    exclusions:
      - arg: private_dns_resolver_id
        reason: wired by the module to the resolver it creates -- never user surface
