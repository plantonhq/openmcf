apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsResolverForwardingRuleset
metadata:
  name: onprem-forwarding
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  name: onprem-forwarding
  # The resolver's outbound endpoint the rules steer -- the reference
  # is also the deploy-order edge (the resolver deploys first).
  outboundEndpointIds:
    - valueFrom:
        kind: AzurePrivateDnsResolver
        name: "<your-dns-resolver>"
        fieldPath: status.outputs.outbound_endpoint_id
  forwardingRules:
    # Queries for the corporate domain (and everything under it) go to
    # the datacenter's DNS servers. ARM stores domains WITH the
    # trailing dot -- write them that way.
    - name: corp-domain
      domainName: corp.contoso.com.
      targetDnsServers:
        - ipAddress: "10.100.0.10"
        - ipAddress: "10.100.0.11"
