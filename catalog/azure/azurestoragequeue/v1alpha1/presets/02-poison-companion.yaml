apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageQueue
metadata:
  name: my-work-items-poison
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # Functions moves repeatedly-failing messages to {queue}-poison BY
  # NAMING CONVENTION -- declaring the companion makes the dead-letter
  # destination owned infrastructure instead of an implicitly-created
  # accident.
  # Replace the prefix with the work queue's name -- keep the -poison
  # suffix so tooling pairs the two by convention.
  queueName: order-processing-poison
  metadata:
    purpose: dead-letter
    companion-of: <work-queue-name>
