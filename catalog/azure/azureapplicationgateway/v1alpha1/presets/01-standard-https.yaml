apiVersion: azure.planton.dev/v1alpha1
kind: AzureApplicationGateway
metadata:
  name: web-gateway
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  # Replace with the gateway name (alphanumerics, underscores, periods,
  # hyphens; starts alphanumeric).
  name: web-gateway
  subnetId:
    value: <gateway-subnet-arm-id>
  sku: STANDARD_V2
  autoscale:
    minCapacity: 2
    maxCapacity: 10
  zones: ["1", "2", "3"]
  # Key Vault certificates authenticate through a user-assigned identity
  # with GET on the vault's secrets.
  identity:
    type: USER_ASSIGNED
    identityIds:
      - value: <gateway-identity-arm-id>
  frontendIpConfigurations:
    - name: public
      publicIpAddressId:
        value: <public-ip-arm-id>
  frontendPorts:
    - name: http
      port: 80
    - name: https
      port: 443
  backendAddressPools:
    # Join member-side instead by referencing
    # status.outputs.backend_address_pool_ids.web from a NIC or scale set.
    - name: web
      ipAddresses:
        - <backend-ip>
  backendHttpSettings:
    - name: web-settings
      port: 8080
      protocol: HTTP
      probeName: web-health
  httpListeners:
    - name: http-listener
      frontendIpConfigurationName: public
      frontendPortName: http
      protocol: HTTP
    - name: https-listener
      frontendIpConfigurationName: public
      frontendPortName: https
      protocol: HTTPS
      sslCertificateName: tls-cert
      requireSni: true
      hostNames:
        - <public-host-name>
  requestRoutingRules:
    # The universal HTTP -> HTTPS redirect.
    - name: http-to-https
      ruleType: BASIC_ROUTING
      httpListenerName: http-listener
      priority: 10
      redirectConfigurationName: to-https
    - name: https-rule
      ruleType: BASIC_ROUTING
      httpListenerName: https-listener
      priority: 100
      backendAddressPoolName: web
      backendHttpSettingsName: web-settings
  probes:
    - name: web-health
      protocol: HTTP
      path: /healthz
      pickHostNameFromBackendHttpSettings: true
      interval: 30
      timeout: 10
      unhealthyThreshold: 3
  sslCertificates:
    # Versionless Key Vault reference: certificate renewals propagate to
    # the gateway automatically.
    - name: tls-cert
      keyVaultSecretId:
        value: <key-vault-certificate-secret-id>
  sslPolicy:
    policyType: PREDEFINED
    policyName: AppGwSslPolicy20220101S
  tags:
    cost-center: <cost-center>
