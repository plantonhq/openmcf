syntax = "proto3";

package dev.planton.azure.azurednszone.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurednszone/v1alpha1/outputs.proto";
import "catalog/azure/azurednszone/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-dns-zone
message AzureDnsZone {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureDnsZone'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureDnsZoneSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureDnsZoneStatus status = 5;
}

// azure-dns-zone status
message AzureDnsZoneStatus {
  //stack-outputs
  //  azure-dns-zone stack-outputs
  AzureDnsZoneStackOutputs outputs = 1;
}
