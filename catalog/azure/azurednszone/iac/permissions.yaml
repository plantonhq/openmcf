# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: azurednszone
spec:
  azure:
    groups:
      - purpose: ManageZone
        actions:
          - Microsoft.Network/dnsZones/read
          - Microsoft.Network/dnsZones/write
          - Microsoft.Network/dnsZones/delete
        provenance: derived
        notes: Covers azurerm_dns_zone -- create, read/refresh, SOA updates, and destroy. Held via DNS Zone Contributor, Network Contributor, or narrower custom roles.
      - purpose: ReadResourceGroup
        actions:
          - Microsoft.Resources/subscriptions/resourceGroups/read
        provenance: derived
        notes: The provider resolves the target resource group before creating the zone in it.
