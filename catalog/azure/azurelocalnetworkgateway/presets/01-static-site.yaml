apiVersion: azure.planton.dev/v1alpha1
kind: AzureLocalNetworkGateway
metadata:
  name: my-site
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: hq-datacenter
  gatewayAddress: "<your-device-public-ip>"
  addressSpaces:
    - "<your-onprem-cidr>" # e.g. 192.168.0.0/16 -- exactly what lives behind the device
