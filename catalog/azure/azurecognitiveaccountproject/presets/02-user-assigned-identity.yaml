apiVersion: azure.planton.dev/v1alpha1
kind: AzureCognitiveAccountProject
metadata:
  name: data-science
spec:
  cognitiveAccountId:
    value: "<your-cognitive-account-id>"
  name: data-science
  region: eastus
  # A pre-created identity whose storage/search grants exist BEFORE the
  # project does -- agents work on first run.
  identity:
    type: USER_ASSIGNED
    identityIds:
      - value: "<your-user-assigned-identity-id>"
  displayName: Data Science
