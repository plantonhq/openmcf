apiVersion: azure.planton.dev/v1alpha1
kind: AzureBackupPolicyFileShare
metadata:
  name: hourly-vault-standard-policy
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "<your-resource-group>"
      fieldPath: status.outputs.resource_group_name
  recoveryVaultName:
    valueFrom:
      kind: AzureRecoveryServicesVault
      name: "<your-recovery-services-vault>"
      fieldPath: status.outputs.recovery_services_vault_name
  name: hourly-vault-standard-policy
  # Hourly schedules configure a WINDOW instead of a time: every 4
  # hours inside a 12-hour window opening at 06:00 -- three backups
  # across business hours, none at night.
  backup:
    frequency: Hourly
    hourly:
      interval: 4
      startTime: "06:00"
      windowDuration: 12
  timezone: UTC
  # vault-standard copies backups INTO the vault (they survive
  # storage-account deletion and compromise); five local snapshot days
  # ride alongside for fast operational restores -- strictly less than
  # retentionDaily.count (the provider's own contract).
  backupTier: vault-standard
  snapshotRetentionInDays: 5
  retentionDaily:
    count: 30
  retentionMonthly:
    count: 12
    days: [1]
    includeLastDays: true
