  optional int32 priority = 4 [(buf.validate.field).required = true];
}

// Selects which backups a Kubernetes retention rule keeps. Set any
// combination (no days-of-month here -- the provider's own surface).
message AzureDataProtectionBackupPolicyKubernetesClusterCriteria {
  // An absolute marker (the wire values).
  string absolute_criteria = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "AllBackup",
        "FirstOfDay",
        "FirstOfWeek",
        "FirstOfMonth",
        "FirstOfYear"
      ]
    }
  ];

  // Days of the week, e.g. "Sunday".
  repeated string days_of_week = 2 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ]
    }
  }];

  // Months of the year, e.g. "January".
  repeated string months_of_year = 3 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ]
    }
  }];

  // Specific backup times as RFC-3339 timestamps (only the time of
  // day is honored), e.g. "2024-01-01T05:30:00Z".
  repeated string scheduled_backup_times = 4;

  // Weeks of the month (the wire values).
  repeated string weeks_of_month = 5 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "First",
        "Second",
        "Third",
        "Fourth",
        "Last"
      ]
    }
  }];
}

// How long matched Kubernetes backups are kept and where.
message AzureDataProtectionBackupPolicyKubernetesClusterLifeCycle {
  // The store the retention applies to. "OperationalStore" is the
  // only value the service accepts today (the provider mirrors the
  // service team's own statement; the vocabulary widens when the AKS
  // vault tier lands).
  string data_store_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: ["OperationalStore"]
    }
  ];

  // The retention duration, ISO-8601 (e.g. "P14D").
  string duration = 2 [
