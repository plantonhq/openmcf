// The PostgreSQL flexible-server variant: scheduled full backups on
// the vault tier.
message AzureDataProtectionBackupPolicyPostgresqlFlexibleServer {
  // When backups run: ISO-8601 repeating intervals, e.g.
  // "R/2024-01-01T00:00:00+00:00/P1W" (weekly). At least one interval
  // is required.
  repeated string backup_repeating_time_intervals = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items = {
      cel: [
        {
          id: "dpbp_pg_interval_iso8601_repeating"
          message: "each interval must be an ISO-8601 repeating interval, e.g. R/2024-01-01T00:00:00+00:00/P1W"
          expression: "this.matches('^R/.+/P((\\\\d+Y)?(\\\\d+M)?(\\\\d+W)?(\\\\d+D)?)(T(\\\\d+H)?(\\\\d+M)?(\\\\d+S)?)?$')"
        }
      ]
    }
  ];

  // The default retention applied to every backup no rule tags.
  AzureDataProtectionBackupPolicyFlexibleServerDefaultRetentionRule default_retention_rule = 2 [(buf.validate.field).required = true];

  // Named retention rules that keep SPECIFIC backups longer than the
  // default.
  repeated AzureDataProtectionBackupPolicyFlexibleServerRetentionRule retention_rules = 3;

  // The Windows time zone the schedule is interpreted in, e.g. "UTC".
  // Unspecified leaves the service interpretation (UTC).
  string time_zone = 4;
}

// The default retention layer shared by the two flexible-server
// variants.
message AzureDataProtectionBackupPolicyFlexibleServerDefaultRetentionRule {
  // How long default-retained backups live, per store.
  repeated AzureDataProtectionBackupPolicyFlexibleServerLifeCycle life_cycles = 1 [(buf.validate.field).repeated.min_items = 1];
}

// A named retention rule shared by the two flexible-server variants.
message AzureDataProtectionBackupPolicyFlexibleServerRetentionRule {
  // The rule's name (also the tag ARM stamps on the backups it
  // keeps).
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // WHICH backups this rule keeps.
  AzureDataProtectionBackupPolicyFlexibleServerCriteria criteria = 2 [(buf.validate.field).required = true];

  // HOW LONG the matched backups are kept, per store.
  repeated AzureDataProtectionBackupPolicyFlexibleServerLifeCycle life_cycles = 3 [(buf.validate.field).repeated.min_items = 1];

  // The rule's priority -- when several rules tag the same backup,
  // the LOWEST priority number wins. Required (the provider's own
  // contract); modeled with explicit presence so 0 stays expressible.
  optional int32 priority = 4 [(buf.validate.field).required = true];
}

// Selects which backups a flexible-server retention rule keeps. Set
// any combination (no days-of-month here -- the provider's own
// surface).
message AzureDataProtectionBackupPolicyFlexibleServerCriteria {
  // An absolute marker (the wire values).
  string absolute_criteria = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "AllBackup",
        "FirstOfDay",
        "FirstOfWeek",
        "FirstOfMonth",
        "FirstOfYear"
      ]
    }
  ];

  // Days of the week, e.g. "Sunday".
  repeated string days_of_week = 2 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ]
    }
  }];

  // Months of the year, e.g. "January".
  repeated string months_of_year = 3 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ]
    }
  }];

  // Specific backup times as RFC-3339 timestamps (only the time of
  // day is honored), e.g. "2024-01-01T05:30:00Z".
  repeated string scheduled_backup_times = 4;

  // Weeks of the month (the wire values).
  repeated string weeks_of_month = 5 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "First",
        "Second",
        "Third",
        "Fourth",
        "Last"
      ]
    }
  }];
}

// How long matched flexible-server backups are kept and where.
message AzureDataProtectionBackupPolicyFlexibleServerLifeCycle {
  // The store the retention applies to. "VaultStore" is the only
  // value the service accepts today (the provider mirrors the service
  // team's own statement; the vocabulary widens if ArchiveStore ever
  // arrives).
  string data_store_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: ["VaultStore"]
    }
  ];

  // The retention duration, ISO-8601 (e.g. "P3M").
  string duration = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "dpbp_flex_lifecycle_duration_iso8601"
      message: "duration must be an ISO-8601 duration, e.g. P3M"
      expression: "this == '' || this.matches('^P((\\\\d+Y)?(\\\\d+M)?(\\\\d+W)?(\\\\d+D)?)(T(\\\\d+H)?(\\\\d+M)?(\\\\d+S)?)?$')"
    }
  ];
}

