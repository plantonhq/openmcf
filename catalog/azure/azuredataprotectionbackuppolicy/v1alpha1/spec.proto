// The Data Lake storage variant: scheduled vault-tier backups of a
// hierarchical-namespace account's ADLS blob services. Retention
// rules here are FLAT (criteria fields sit directly on the rule --
// the provider's own shape for this datasource) and rule priorities
// are assigned by ORDER: the first rule gets priority 1, the second
// 2, and so on (the provider's own encoding -- there is no priority
// field).
message AzureDataProtectionBackupPolicyDataLakeStorage {
  // When backups run: 1-5 ISO-8601 repeating intervals, e.g.
  // "R/2024-01-01T00:00:00+00:00/P1D" (daily).
  repeated string backup_schedule = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 5,
    (buf.validate.field).repeated.items = {
      cel: [
        {
          id: "dpbp_adls_schedule_iso8601_repeating"
          message: "each backup_schedule entry must be an ISO-8601 repeating interval, e.g. R/2024-01-01T00:00:00+00:00/P1D"
          expression: "this.matches('^R/.+/P((\\\\d+Y)?(\\\\d+M)?(\\\\d+W)?(\\\\d+D)?)(T(\\\\d+H)?(\\\\d+M)?(\\\\d+S)?)?$')"
        }
