// A named retention rule on the Data Lake variant -- criteria fields
// sit directly on the rule (the provider's own flat shape for this
// datasource). Each rule requires absolute_criteria or days_of_week
// (the provider's create contract, front-loaded below).
message AzureDataProtectionBackupPolicyDataLakeStorageRetentionRule {
  // The rule's name (also the tag ARM stamps on the backups it
  // keeps).
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The retention duration for matched backups, ISO-8601 (e.g.
  // "P12W"). Data Lake retains on the vault store (the provider pins
  // it).
  string duration = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "dpbp_adls_rule_duration_iso8601"
      message: "duration must be an ISO-8601 duration, e.g. P12W"
      expression: "this == '' || this.matches('^P((\\\\d+Y)?(\\\\d+M)?(\\\\d+W)?(\\\\d+D)?)(T(\\\\d+H)?(\\\\d+M)?(\\\\d+S)?)?$')"
    }
  ];

  // An absolute marker (the wire values).
  string absolute_criteria = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "AllBackup",
        "FirstOfDay",
        "FirstOfWeek",
        "FirstOfMonth",
        "FirstOfYear"
      ]
    }
  ];

  // Days of the week, e.g. "Sunday".
  repeated string days_of_week = 4 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ]
    }
  }];

  // Months of the year, e.g. "January".
  repeated string months_of_year = 5 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ]
    }
  }];

  // Specific backup times as RFC-3339 timestamps (only the time of
  // day is honored), e.g. "2024-01-01T05:30:00Z".
  repeated string scheduled_backup_times = 6;

  // Weeks of the month (the wire values).
  repeated string weeks_of_month = 7 [(buf.validate.field).repeated.items = {
    string: {
      in: [
        "First",
        "Second",
        "Third",
        "Fourth",
        "Last"
      ]
    }
  }];

  // The provider's create-time contract for this datasource,
  // front-loaded so the error lands in seconds.
  option (buf.validate.message).cel = {
    id: "dpbp_adls_rule_needs_absolute_or_days"
    message: "each Data Lake retention rule requires absolute_criteria or days_of_week (the provider's own contract)"
    expression: "this.absolute_criteria != '' || this.days_of_week.size() > 0"
  };
}
