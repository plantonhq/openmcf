apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupPolicy
metadata:
  name: aks-backup-policy
spec:
  vaultId:
    valueFrom:
      kind: AzureDataProtectionBackupVault
      name: "<your-backup-vault>"
      fieldPath: status.outputs.backup_vault_id
  name: aks-backup-policy
  kubernetesCluster:
    # Every four hours -- AKS backup's typical operational cadence.
    backupRepeatingTimeIntervals:
      - R/2024-01-01T00:00:00+00:00/PT4H
    # AKS retains on the operational store (the service's surface
    # today). Every backup kept 14 days by default.
    defaultRetentionRule:
      lifeCycles:
        - dataStoreType: OperationalStore
          duration: P14D
    # The first backup of each day kept for 8 weeks.
    retentionRules:
      - name: daily
        criteria:
          absoluteCriteria: FirstOfDay
        lifeCycles:
          - dataStoreType: OperationalStore
            duration: P8W
        priority: 25
