apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupPolicy
metadata:
  name: blob-dual-tier-policy
spec:
  vaultId:
    valueFrom:
      kind: AzureDataProtectionBackupVault
      name: "<your-backup-vault>"
      fieldPath: status.outputs.backup_vault_id
  name: blob-dual-tier-policy
  blobStorage:
    # The operational tier: continuous point-in-time restore INSIDE
    # the storage account, 30 days back.
    operationalDefaultRetentionDuration: P30D
    # The vault tier: scheduled copies INTO the vault (survive
    # account deletion/compromise), kept 90 days by default.
    vaultDefaultRetentionDuration: P90D
    backupRepeatingTimeIntervals:
      - R/2024-01-01T00:00:00+00:00/P1D
    timeZone: UTC
    # The first vaulted backup of each month kept for a year.
    retentionRules:
      - name: monthly
        criteria:
          absoluteCriteria: FirstOfMonth
        lifeCycle:
          dataStoreType: VaultStore
          duration: P12M
        priority: 20
