syntax = "proto3";

package dev.planton.azure.azurefirewallpolicyrulecollectiongroup.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// **AzureFirewallPolicyRuleCollectionGroupSpec** defines a rule collection
// group inside an Azure Firewall Policy: an ordered document of rule
// collections (application, network, and DNAT) that the policy's firewalls
// enforce. A policy carries many groups -- typically one per team or per
// application -- each deployed and updated independently, which is exactly
// why the group is its own resource rather than a fold inside the policy.
//
// **Processing order**: groups are evaluated by group priority, then
// collections by collection priority. Across collection TYPES Azure always
// processes DNAT rules first, then network rules, then application rules,
// regardless of priorities -- priorities order collections WITHIN a type.
// Lower numbers run first (100 is the highest precedence).
//
// **Rules fold inside the group.** A rule has no ARM identity of its own
// and nothing references an individual rule -- the group is the unit of
// deployment, so the rules travel with it as one ordered document.
//
// **ForceNew fields**: `name`, `firewall_policy_id`. Priority and all
// collections update in place.
message AzureFirewallPolicyRuleCollectionGroupSpec {
  // The firewall policy this group belongs to -- references an
  // AzureFirewallPolicy's ARM id. The policy is the group's parent: the
  // group deploys into it, and the policy's resource group and name are
  // derived from this id. Changing it replaces the group.
  dev.planton.shared.foreignkey.v1.StringValueOrRef firewall_policy_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureFirewallPolicy,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.firewall_policy_id"
  ];

  // The group's name, unique within the policy. 2-80 characters; must
  // begin with a letter or number, end with a letter, number, or
  // underscore, and may contain only letters, numbers, underscores,
  // periods, or hyphens. Changing the name replaces the group. Name it
  // after the team or application whose rules it carries
  // ("platform-baseline", "payments-app").
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 80,
    (buf.validate.field).cel = {
      id: "rule_collection_group_name_format"
      message: "Rule collection group names are 2-80 characters, start with a letter or number, end with a letter, number, or underscore, and may contain alphanumerics, underscores, periods, and hyphens"
      expression: "this == '' || this.matches('^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9_]$')"
    }
  ];

  // The group's evaluation priority among the policy's groups: 100-65000,
  // lower runs first. Leave gaps (100, 200, 300...) so future groups can
  // slot between existing ones without renumbering.
  int32 priority = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 100
      lte: 65000
    }
  ];

  // Application rule collections: allow/deny by HTTP(S)/MSSQL destination
  // -- FQDNs, URLs (Premium), FQDN tags, and web categories (Premium).
  // Application rules are evaluated LAST (after DNAT and network rules).
  repeated AzureFirewallPolicyApplicationRuleCollection application_rule_collections = 4;

  // Network rule collections: allow/deny by protocol, source, destination
  // address/FQDN, and port -- classic L3/L4 filtering. Evaluated after
  // DNAT rules and before application rules.
  repeated AzureFirewallPolicyNetworkRuleCollection network_rule_collections = 5;

  // DNAT rule collections: translate traffic arriving at the firewall's
  // public IP to an internal address/FQDN and port. Evaluated FIRST; a
  // matching DNAT rule also implicitly allows the translated flow.
  repeated AzureFirewallPolicyNatRuleCollection nat_rule_collections = 6;
}

// The action vocabulary for application and network (filter) rule
// collections. DNAT collections carry no action field -- their action is
// always Azure's "Dnat" (a one-value vocabulary both engines send
// unconditionally).
enum AzureFirewallPolicyFilterAction {
  // Not specified -- invalid; every filter collection declares its action.
  azure_firewall_policy_filter_action_unspecified = 0;

  // Permit matching traffic.
  ALLOW = 1;

  // Block matching traffic.
  DENY = 2;
}

// The protocol vocabulary for network and DNAT rules. Network rules accept
// all four values; DNAT rules accept only TCP and UDP (enforced on the
// rule).
enum AzureFirewallPolicyRuleProtocol {
  // Not specified -- invalid; every rule declares its protocols.
  azure_firewall_policy_rule_protocol_unspecified = 0;

  // Match any protocol (network rules only).
  ANY = 1;

  // Match TCP.
  TCP = 2;

  // Match UDP.
  UDP = 3;

  // Match ICMP (network rules only).
  ICMP = 4;
}

// An ordered collection of application rules sharing one action.
message AzureFirewallPolicyApplicationRuleCollection {
  // The collection's name, unique within the group.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The collection's priority among the group's collections of the same
  // type: 100-65000, lower runs first.
  int32 priority = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 100
      lte: 65000
    }
  ];

  // Whether matching traffic is allowed or denied.
  AzureFirewallPolicyFilterAction action = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The collection's rules, evaluated in order.
  repeated AzureFirewallPolicyApplicationRule rules = 4 [(buf.validate.field).repeated.min_items = 1];
}

// One application rule: match L7 destinations from given sources.
//
// ARM requires every rule to carry at least one source (addresses or IP
// Groups) and at least one destination (addresses, FQDNs, URLs, FQDN tags,
// or web categories); Premium-only destinations (destination_urls,
// web_categories) and TLS termination are rejected on non-Premium
// policies at apply time.
message AzureFirewallPolicyApplicationRule {
  // The rule's name, unique within the collection.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // What this rule permits or blocks -- operator documentation.
  string description = 2;

  // The L7 protocols (type + port) the rule matches, e.g. HTTPS on 443.
  // Required for FQDN/URL/category destinations.
  repeated AzureFirewallPolicyApplicationProtocol protocols = 3;

  // Source IP addresses/CIDRs (or "*" for any).
  repeated string source_addresses = 4 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Source IP Groups -- references to AzureIpGroup ARM ids, the reusable
  // alternative to literal source_addresses.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef source_ip_groups = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureIpGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.ip_group_id"
  ];

  // Destination IP addresses/CIDRs (or "*"). Use for L7 filtering to
  // fixed addresses; prefer FQDNs for anything DNS-named.
  repeated string destination_addresses = 6 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Destination fully-qualified domain names, e.g. "api.github.com" or
  // "*.ubuntu.com". FQDN filtering without TLS termination matches the
  // TLS SNI; with terminate_tls the firewall sees the decrypted host.
  repeated string destination_fqdns = 7 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Destination URLs including paths, e.g.
  // "github.com/planton/*". URL (path-level) filtering is Premium-only
  // and requires terminate_tls for HTTPS traffic -- without decryption
  // the firewall cannot see the path.
  repeated string destination_urls = 8 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Azure-curated FQDN tags naming well-known service endpoint sets,
  // e.g. "WindowsUpdate", "AzureKubernetesService". The tag tracks
  // Microsoft's endpoint list so you do not have to.
  repeated string destination_fqdn_tags = 9 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Decrypt, inspect, and re-encrypt matching TLS traffic using the
  // policy's tls_certificate (Premium only). Required for URL filtering
  // and full web-category classification of HTTPS traffic.
  bool terminate_tls = 10;

  // Azure web categories to match, e.g. "Gambling", "SocialNetworking"
  // (Premium only). Category classification of HTTPS traffic is
  // SNI-based unless terminate_tls is on.
  repeated string web_categories = 11 [(buf.validate.field).repeated.items.string.min_len = 1];

  // HTTP headers to ADD to matching requests before forwarding (e.g. a
  // token an upstream requires). Applies to HTTP and TLS-terminated
  // HTTPS traffic.
  repeated AzureFirewallPolicyHttpHeader http_headers = 12;
}

// An L7 protocol entry on an application rule.
message AzureFirewallPolicyApplicationProtocol {
  // The protocol type.
  AzureFirewallPolicyApplicationProtocolType type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The port the protocol runs on: 0-64000 (the provider's enforced
  // bound), e.g. 80 for HTTP, 443 for HTTPS, 1433 for MSSQL.
  int32 port = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 64000
    }
  ];
}

// The application-rule protocol vocabulary.
enum AzureFirewallPolicyApplicationProtocolType {
  // Not specified -- invalid; every protocol entry declares its type.
  azure_firewall_policy_application_protocol_type_unspecified = 0;

  // Plain HTTP.
  HTTP = 1;

  // HTTP over TLS. SNI-matched unless the rule terminates TLS.
  HTTPS = 2;

  // The Microsoft SQL Server TDS protocol (used with Azure SQL through
  // the firewall).
  MSSQL = 3;
}

// A header added to matching requests.
message AzureFirewallPolicyHttpHeader {
  // The header name, e.g. "X-Forwarded-For-Org".
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The header value.
  string value = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// An ordered collection of network rules sharing one action.
message AzureFirewallPolicyNetworkRuleCollection {
  // The collection's name, unique within the group.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The collection's priority among the group's collections of the same
  // type: 100-65000, lower runs first.
  int32 priority = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 100
      lte: 65000
    }
  ];

  // Whether matching traffic is allowed or denied.
  AzureFirewallPolicyFilterAction action = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The collection's rules, evaluated in order.
  repeated AzureFirewallPolicyNetworkRule rules = 4 [(buf.validate.field).repeated.min_items = 1];
}

// One network rule: classic L3/L4 filtering by protocol, source,
// destination, and port.
//
// ARM requires every rule to carry at least one source (addresses or IP
// Groups) and at least one destination (addresses, IP Groups, or FQDNs);
// FQDN destinations require the policy's DNS proxy to be enabled so the
// firewall resolves names the same way clients do.
message AzureFirewallPolicyNetworkRule {
  // The rule's name, unique within the collection.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // What this rule permits or blocks -- operator documentation.
  string description = 2;

  // The protocols the rule matches: ANY, TCP, UDP, or ICMP.
  repeated AzureFirewallPolicyRuleProtocol protocols = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  // Source IP addresses/CIDRs (or "*" for any).
  repeated string source_addresses = 4 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Source IP Groups -- references to AzureIpGroup ARM ids.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef source_ip_groups = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureIpGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.ip_group_id"
  ];

  // Destination IP addresses/CIDRs, "*", or Azure service tags
  // (e.g. "AzureCloud.EastUS", "Storage").
  repeated string destination_addresses = 6 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Destination IP Groups -- references to AzureIpGroup ARM ids.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef destination_ip_groups = 7 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureIpGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.ip_group_id"
  ];

  // Destination FQDNs, e.g. "time.windows.com". Requires the policy's
  // DNS proxy so the firewall and clients resolve identically.
  repeated string destination_fqdns = 8 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Destination ports: a port ("443"), a range ("1000-2000"), or "*".
  repeated string destination_ports = 9 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
}

// An ordered collection of DNAT rules. The collection's action is always
// Azure's "Dnat" -- a one-value vocabulary, so it is not modeled; both
// engines send it unconditionally.
message AzureFirewallPolicyNatRuleCollection {
  // The collection's name, unique within the group.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The collection's priority among the group's collections of the same
  // type: 100-65000, lower runs first.
  int32 priority = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 100
      lte: 65000
    }
  ];

  // The collection's rules, evaluated in order.
  repeated AzureFirewallPolicyNatRule rules = 3 [(buf.validate.field).repeated.min_items = 1];
}

// One DNAT rule: translate traffic arriving at the firewall's public IP
// to an internal destination. A matching DNAT rule implicitly allows the
// translated flow -- no companion network rule is needed.
message AzureFirewallPolicyNatRule {
  // The rule's name, unique within the collection.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // What this rule translates -- operator documentation.
  string description = 2;

  // The protocols the rule matches. DNAT supports only TCP and UDP.
  repeated AzureFirewallPolicyRuleProtocol protocols = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  // Source IP addresses/CIDRs (or "*" for any).
  repeated string source_addresses = 4 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Source IP Groups -- references to AzureIpGroup ARM ids.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef source_ip_groups = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureIpGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.ip_group_id"
  ];

  // The destination the inbound traffic arrives at: one of the
  // firewall's public IP addresses. A single address or CIDR.
  string destination_address = 6;

  // The destination port(s) the inbound traffic arrives on. ARM accepts
  // exactly ONE entry today (a port or a range, 1-64000; no wildcard) --
  // the list shape mirrors ARM's own, which may lift the cap.
  repeated string destination_ports = 7 [(buf.validate.field).repeated = {
    max_items: 1
    items: {
      string: {min_len: 1}
    }
  }];

  // The internal IP address the traffic is translated TO. Exactly one of
  // translated_address / translated_fqdn.
  string translated_address = 8;

  // The internal FQDN the traffic is translated TO (requires the
  // policy's DNS proxy so the name resolves deterministically). Exactly
  // one of translated_address / translated_fqdn.
  string translated_fqdn = 9;

  // The internal port the traffic is translated to, 1-65535.
  int32 translated_port = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  option (buf.validate.message).cel = {
    id: "nat_translated_target_exactly_one"
    message: "Set exactly one of translated_address or translated_fqdn -- the rule needs one translation target"
    expression: "(this.translated_address != '') != (this.translated_fqdn != '')"
  };
  option (buf.validate.message).cel = {
    id: "nat_protocols_tcp_udp_only"
    message: "DNAT rules support only TCP and UDP protocols"
    expression: "this.protocols.all(p, p == 2 || p == 3)"
  };
}
