apiVersion: azure.planton.dev/v1alpha1
kind: AzureFirewallPolicyRuleCollectionGroup
metadata:
  name: inbound-dnat
spec:
  firewallPolicyId:
    valueFrom:
      name: <firewall-policy-name>
  name: inbound-dnat
  priority: 100
  natRuleCollections:
    - name: published-services
      priority: 100
      rules:
        - name: https-to-internal-lb
          description: public HTTPS published to the internal load balancer
          protocols: [TCP]
          sourceAddresses: ["*"]
          destinationAddress: "<firewall-public-ip>"
          destinationPorts: ["443"]
          translatedAddress: "<internal-frontend-ip>"
          translatedPort: 443
