apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusAuthorizationRule
metadata:
  name: my-namespace-operator
spec:
  ruleName: platform-operator
  # Namespace scope: rights over EVERY queue and topic -- for tooling
  # that manages entities, not for application workloads.
  namespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: my-app-bus
      fieldPath: status.outputs.namespace_id
  # Azure's contract: manage requires listen AND send.
  listen: true
  send: true
  manage: true
