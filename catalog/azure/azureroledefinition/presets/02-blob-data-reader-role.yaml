apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleDefinition
metadata:
  name: my-blob-auditor-role
spec:
  name: <org-prefix>-blob-auditor
  scope:
    value: <subscription-arm-id>
  description: Read blob data for audits -- list accounts and containers, read blob contents, nothing else
  permissions:
    - actions:
        # Control-plane reads: discover accounts and containers. These grant
        # NO access to the data inside -- that is what dataActions are for.
        - Microsoft.Storage/storageAccounts/read
        - Microsoft.Storage/storageAccounts/blobServices/containers/read
      dataActions:
        # Data-plane read: the actual blob contents.
        - Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read
