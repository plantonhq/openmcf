apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateEndpoint
metadata:
  name: my-blob-private-endpoint
spec:
  region: <azure-region>
  resourceGroup:
    value: <your-resource-group-name>
  # Replace with the endpoint name (alphanumerics, underscores, periods,
  # hyphens; starts alphanumeric, ends alphanumeric or underscore).
  name: blob-private-endpoint
  subnetId:
    value: <subnet-resource-id>
  privateServiceConnection:
    privateConnectionResourceId:
      value: <storage-account-resource-id>
    subresourceNames:
      - blob
  privateDnsZoneIds:
    - value: <privatelink-blob-core-windows-net-zone-id>
