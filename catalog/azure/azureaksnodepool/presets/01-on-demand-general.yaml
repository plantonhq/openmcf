apiVersion: azure.planton.dev/v1alpha1
kind: AzureAksNodePool
metadata:
  name: my-node-pool
spec:
  kubernetesClusterId:
    value: "<aks-cluster-arm-id>"
  name: general
  vmSize: Standard_D4s_v5
  autoScalingEnabled: true
  minCount: 2
  maxCount: 10
  zones:
    - "1"
    - "2"
    - "3"
  mode: USER
