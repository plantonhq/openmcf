apiVersion: azure.planton.dev/v1alpha1
kind: AzurePublicIpPrefix
metadata:
  name: my-partner-allowlist
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: partner-allowlist
  prefixLength: 30
  zones:
    - "1"
    - "2"
    - "3"
  tags:
    cost-center: <cost-center>
