apiVersion: azure.planton.dev/v1alpha1
kind: AzureDiskEncryptionSet
metadata:
  name: my-user-assigned-des
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: prod-des-ua
  keyVaultKeyId:
    valueFrom:
      name: <disk-cmk-key>
  autoKeyRotationEnabled: true
  identity:
    type: USER_ASSIGNED
    identityIds:
      - valueFrom:
          name: <des-identity>
  tags:
    cost-center: <cost-center>
