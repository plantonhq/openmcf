apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbMongoCollection
metadata:
  name: my-user-sessions
spec:
  mongoDatabaseId:
    valueFrom:
      kind: AzureCosmosdbMongoDatabase
      name: <database-resource-name>
      fieldPath: status.outputs.mongo_database_id
  collectionName: sessions
  shardKey: userId
  throughput: 1000
  # Every session dies 24 hours after its last write -- deletion is
  # automatic, storage stays flat. Use -1 instead for per-document
  # opt-in expiry (documents carry their own ttl field).
  defaultTtlSeconds: 86400
  indexes:
    - keys:
        - _id
      unique: true
