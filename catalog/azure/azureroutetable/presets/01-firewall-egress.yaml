apiVersion: azure.planton.dev/v1alpha1
kind: AzureRouteTable
metadata:
  name: egress-via-firewall
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: egress-via-firewall
  routes:
    - name: default-via-firewall
      addressPrefix: "0.0.0.0/0"
      nextHopType: VIRTUAL_APPLIANCE
      # References the hub firewall's private IP output directly -- no
      # hand-copied address; the route follows the firewall.
      nextHopInIpAddress:
        valueFrom:
          name: <firewall-resource-name>
  bgpRoutePropagationEnabled: false
  tags:
    cost-center: <cost-center>
