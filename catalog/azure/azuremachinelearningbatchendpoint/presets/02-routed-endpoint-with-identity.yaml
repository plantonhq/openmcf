apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningBatchEndpoint
metadata:
  name: churn-scoring
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  name: churn-scoring
  region: eastus
  # A system identity for organizations whose role-grant conventions
  # target the endpoint object (the batch data path itself runs under
  # the submitter's token plus the compute pool's identity).
  identity:
    type: SYSTEM_ASSIGNED
  # Which deployment answers job submissions that do not name one --
  # batch's routing dial. Points at the recipe you attach next; the
  # pointer updates in place as recipes roll over.
  defaultDeploymentName: production
  description: Churn model batch scoring
