apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningBatchEndpoint
metadata:
  name: nightly-scoring
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  # Part of the batch scoring DNS -- pick an application-scoped name.
  name: nightly-scoring
  region: eastus
  # auth_mode is deliberately unset: the platform applies AADToken --
  # Microsoft Entra tokens, the only mode the batch service accepts.
  # Job submitters authenticate as Entra principals; there are no
  # endpoint keys to manage.
