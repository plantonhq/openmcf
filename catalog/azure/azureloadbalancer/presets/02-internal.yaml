apiVersion: azure.planton.dev/v1alpha1
kind: AzureLoadBalancer
metadata:
  name: my-internal-lb
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: <your-lb-name>
  frontendIpConfigurations:
    - name: internal
      # An internal frontend gets a private address in this subnet.
      subnetId:
        value: "<subnet-resource-id>"
      # Pin the address so DNS records and firewall rules stay stable.
      privateIpAddress: <static-private-ip>
      # Zone-redundant private frontend -- the production default posture.
      zones: ["1", "2", "3"]
  backendPools:
    - name: app
  healthProbes:
    - name: tcp-health
      protocol: PROBE_TCP # default; port-open means healthy
      port: 8080
  rules:
    - name: app
      protocol: TCP
      frontendPort: 8080
      backendPort: 8080
      backendPoolNames: [app]
      probeName: tcp-health
      tcpResetEnabled: true
      # Long-lived east-west connections (databases, gRPC) benefit from a
      # raised idle timeout.
      idleTimeoutInMinutes: 30
