syntax = "proto3";

package dev.planton.azure.azurecognitivedeployment.v1alpha1;

// **AzureCognitiveDeploymentStackOutputs** captures the outputs of
// provisioning a model deployment.
message AzureCognitiveDeploymentStackOutputs {
  // The Azure Resource Manager ID of the deployment.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.CognitiveServices/accounts/{account}/deployments/{name}
  string deployment_id = 1;

  // The deployment's name -- what applications pass as the
  // model/deployment parameter when calling the account's endpoint.
  string deployment_name = 2;

  // The deployed model's version as ARM reports it -- the resolved
  // value when the spec left version unset.
  string model_version = 3;
}
