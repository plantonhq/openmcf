apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageObjectReplication
metadata:
  name: my-blob-dr
spec:
  sourceStorageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <primary-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  destinationStorageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <dr-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  rules:
    # Everything: backfill the whole container so the replica is
    # complete, not just forward-looking -- the DR posture.
    - sourceContainerName:
        valueFrom:
          kind: AzureStorageContainer
          name: <source-container-resource-name>
          fieldPath: status.outputs.container_name
      destinationContainerName:
        valueFrom:
          kind: AzureStorageContainer
          name: <destination-container-resource-name>
          fieldPath: status.outputs.container_name
      copyBlobsCreatedAfter: Everything
