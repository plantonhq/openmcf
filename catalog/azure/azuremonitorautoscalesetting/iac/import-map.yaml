apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: azuremonitorautoscalesetting
spec:
  # The autoscale setting imports by its full ARM resource ID.
  values:
    - name: autoscale_setting_id
      derivations:
        - from_stack_output: autoscale_setting_id
      where_to_find: >-
        `az monitor autoscale show -g <resource-group> -n <name> --query
        id`, or the component's own autoscale_setting_id stack output.
