apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedRedis
metadata:
  name: my-search-cache
spec:
  region: <region>
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  clusterName: my-search-cache
  # MEMORY_OPTIMIZED: large in-memory datasets -- search indexes live in
  # memory alongside the data. M10 = 10 GB.
  skuName: MEMORY_OPTIMIZED_M10
  defaultDatabase:
    # Keyless (the default): consumers connect under
    # AzureManagedRedisAccessPolicyAssignment grants.
    accessKeysAuthenticationEnabled: false
    # RediSearch REQUIRES the Enterprise clustering policy (all shards
    # behind one endpoint -- any client works) and NoEviction (an index
    # over silently-evicted data would lie).
    clusteringPolicy: ENTERPRISE_CLUSTER
    evictionPolicy: NO_EVICTION
    modules:
      # Secondary indexes + full-text search over hashes and JSON.
      - name: RediSearch
      # Native JSON documents -- the document store RediSearch indexes.
      - name: RedisJSON
