apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedRedis
metadata:
  name: my-global-cache-east
spec:
  region: <region>
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  clusterName: my-global-cache-east
  # Geo-replication requires BALANCED_B3 or larger.
  skuName: BALANCED_B3
  defaultDatabase:
    # Keyless (the default): consumers connect under
    # AzureManagedRedisAccessPolicyAssignment grants in every region.
    accessKeysAuthenticationEnabled: false
    # Every member of the group declares the SAME name -- this instance
    # becomes the group's first member; deploy siblings in other regions
    # with the same name and link them with
    # AzureManagedRedisGeoReplication. Persistence cannot be enabled on
    # geo-replicated databases (the replicas ARE the durability story).
    geoReplicationGroupName: my-global-cache-group
