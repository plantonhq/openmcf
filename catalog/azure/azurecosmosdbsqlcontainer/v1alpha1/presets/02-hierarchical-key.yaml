apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbSqlContainer
metadata:
  name: my-user-events
spec:
  sqlDatabaseId:
    valueFrom:
      kind: AzureCosmosdbSqlDatabase
      name: my-app-data
      fieldPath: status.outputs.sql_database_id
  containerName: user-events
  # A hierarchical (MultiHash) key: queries carrying /tenantId alone,
  # or /tenantId + /userId, route to the right partitions without
  # fanning out -- and single tenants can exceed the 20 GB
  # single-partition-key-value limit.
  partitionKeyPaths:
    - /tenantId
    - /userId
  partitionKeyKind: MULTI_HASH
  # Hierarchical keys require partition key definition version 2
  # (large-key support).
  partitionKeyVersion: 2
  # Fixed throughput for a steady ingest workload.
  throughput: 2000
  # A composite index serving "WHERE tenantId = X ORDER BY createdAt
  # DESC" without a per-document sort.
  indexingPolicy:
    includedPaths:
      - path: /*
    compositeIndexes:
      - entries:
          - path: /tenantId
            order: ASCENDING
          - path: /createdAt
            order: DESCENDING
