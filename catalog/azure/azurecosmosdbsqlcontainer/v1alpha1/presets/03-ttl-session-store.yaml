apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbSqlContainer
metadata:
  name: my-sessions
spec:
  sqlDatabaseId:
    valueFrom:
      kind: AzureCosmosdbSqlDatabase
      name: my-app-data
      fieldPath: status.outputs.sql_database_id
  containerName: sessions
  partitionKeyPaths:
    - /sessionId
  # No throughput fields: this container shares the database's
  # provisioned throughput -- the right shape for small auxiliary
  # containers beside the main workload.
  # Documents expire 24 hours after their last write unless they carry
  # their own ttl property.
  defaultTtl: 86400
  # A session store is pure key-value: point reads by id only, so
  # indexing is disabled entirely and writes pay no indexing RU.
  indexingPolicy:
    indexingMode: NONE
  # One session document per sessionId within the partition.
  uniqueKeys:
    - paths:
        - /userId
