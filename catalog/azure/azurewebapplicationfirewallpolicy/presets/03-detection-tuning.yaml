apiVersion: azure.planton.dev/v1alpha1
kind: AzureWebApplicationFirewallPolicy
metadata:
  name: waf-tuning
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  policyName: <policy-name>
  managedRules:
    # Exclusions skip specific request parts that trip rules on legitimate
    # traffic -- the surgical alternative to disabling whole rules.
    exclusions:
      - matchVariable: REQUEST_COOKIE_NAMES
        selectorMatchOperator: SELECTOR_EQUALS
        selector: <session-cookie-name>
        excludedRuleSet:
          ruleGroups:
            - ruleGroupName: REQUEST-942-APPLICATION-ATTACK-SQLI
    managedRuleSets:
      - version: "3.2"
        ruleGroupOverrides:
          - ruleGroupName: REQUEST-920-PROTOCOL-ENFORCEMENT
            rules:
              # Listing a rule with enabled=false (the default) disables
              # it; enabled=true + action retunes it.
              - id: "920300"
              - id: "920440"
                enabled: true
                action: OVERRIDE_LOG
  policySettings:
    # Detection mode: log matches without blocking while tuning.
    mode: DETECTION
    # Redact secrets and PII from the WAF logs the tuning reads.
    logScrubbing:
      rules:
        - matchVariable: SCRUB_REQUEST_HEADER_NAMES
          selectorMatchOperator: SELECTOR_EQUALS
          selector: Authorization
        - matchVariable: SCRUB_REQUEST_COOKIE_NAMES
          selectorMatchOperator: SELECTOR_EQUALS_ANY
  tags:
    cost-center: <cost-center>
