# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_network_watcher_flow_log:
    mappings:
      # Family-wide rename: the spec says what the field IS (an Azure
      # region) where the provider inherits ARM's terser property name.
      - spec: spec.region
        arg: location
      # The provider's resource_group_name is the NETWORK WATCHER's
      # resource group (the flow log is a watcher child), not the
      # target's -- the spec names it for what it addresses. Unset, the
      # module resolves "NetworkWatcherRG", the group Azure auto-creates
      # its regional watchers in.
      - spec: spec.network_watcher_resource_group
        arg: resource_group_name
