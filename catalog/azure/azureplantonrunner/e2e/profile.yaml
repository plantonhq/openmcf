apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azureplantonrunner
spec:
  # A runner appliance under live E2E: the harness deploys the resource
  # group and Container App Environment prerequisites, then runs deploy ->
  # app-exists verify -> destroy -> verify-absent on both provisioners.
  # The scenario supplies an obviously-fake runner token, so the container
  # never joins any control plane -- deliberately: Container Apps reports
  # the app provisioned independently of replica health, so app-level
  # verification proves the full provisioning surface (the app, its secret
  # store, the single-replica template) and clean teardown without live
  # credentials.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
