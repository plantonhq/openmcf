apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupInstance
metadata:
  name: aks-cluster-backup
spec:
  vaultId:
    valueFrom:
      kind: AzureDataProtectionBackupVault
      name: "<your-backup-vault>"
      fieldPath: status.outputs.backup_vault_id
  name: aks-cluster-backup
  # Must match the cluster's own region.
  region: eastus
  # A KUBERNETES policy on the same vault (variant types must match).
  # On this variant the policy binding is REPLACE-ONLY: changing it
  # recreates the instance.
  backupPolicyId:
    valueFrom:
      kind: AzureDataProtectionBackupPolicy
      name: "<your-kubernetes-policy>"
      fieldPath: status.outputs.backup_policy_id
  # The variant block IS the datasource type -- set exactly one.
  kubernetesCluster:
    # The cluster must already carry the AKS Backup extension and its
    # trusted-access role binding to the vault -- cluster-side setup
    # Azure validates at create time.
    kubernetesClusterId:
      valueFrom:
        kind: AzureAksCluster
        name: "<your-aks-cluster>"
        fieldPath: status.outputs.cluster_id
    snapshotResourceGroupName:
      valueFrom:
        kind: AzureResourceGroup
        name: "<your-snapshot-resource-group>"
        fieldPath: status.outputs.resource_group_name
    backupDatasourceParameters:
      # Back up the workload namespaces; leave cluster plumbing out.
      excludedNamespaces:
        - kube-system
      # Include persistent-volume data, not just configuration.
      volumeSnapshotEnabled: true
