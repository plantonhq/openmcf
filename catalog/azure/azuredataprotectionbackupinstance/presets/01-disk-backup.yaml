apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupInstance
metadata:
  name: app-disk-backup
spec:
  vaultId:
    valueFrom:
      kind: AzureDataProtectionBackupVault
      name: "<your-backup-vault>"
      fieldPath: status.outputs.backup_vault_id
  name: app-disk-backup
  # Must match the disk's own region.
  region: eastus
  # A DISK policy on the same vault (variant types must match).
  backupPolicyId:
    valueFrom:
      kind: AzureDataProtectionBackupPolicy
      name: "<your-disk-policy>"
      fieldPath: status.outputs.backup_policy_id
  # The variant block IS the datasource type -- set exactly one.
  disk:
    # The vault's identity needs "Disk Backup Reader" on this disk
    # BEFORE the instance deploys (compose an AzureRoleAssignment).
    diskId:
      valueFrom:
        kind: AzureManagedDisk
        name: "<your-managed-disk>"
        fieldPath: status.outputs.disk_id
    # Where snapshots land; the vault's identity needs "Disk Snapshot
    # Contributor" here.
    snapshotResourceGroupName:
      valueFrom:
        kind: AzureResourceGroup
        name: "<your-snapshot-resource-group>"
        fieldPath: status.outputs.resource_group_name
