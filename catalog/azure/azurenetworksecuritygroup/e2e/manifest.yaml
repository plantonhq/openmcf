apiVersion: azure.planton.dev/v1alpha1
kind: AzureNetworkSecurityGroup
metadata:
  name: test-nsg
spec:
  region: eastus
  resourceGroup:
    value: test-rg
  name: test-nsg
  securityRules:
    - name: allow-https
      priority: 100
      direction: INBOUND
      access: ALLOW
      protocol: TCP
      destinationPortRange: "443"
    - name: allow-web-multi
      priority: 200
      direction: INBOUND
      access: ALLOW
      protocol: TCP
      destinationPortRanges:
        - "80"
        - "8080"
      sourceAddressPrefixes:
        - "10.1.0.0/16"
        - "10.2.0.0/16"
    - name: deny-all-inbound
      priority: 4096
      direction: INBOUND
      access: DENY
      protocol: ANY
      destinationPortRange: "*"
  tags:
    purpose: hack-test
