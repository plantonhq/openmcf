apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningBatchDeployment
metadata:
  name: churn-production
spec:
  endpointId:
    value: "<your-batch-endpoint-id>"
  # The key the endpoint's default-deployment pointer routes by.
  name: production
  region: eastus
  # The compute pool jobs run on -- typically a scale-to-zero cluster
  # so idle cost is zero.
  computeId:
    value: "<your-compute-cluster-id>"
  # The registered model version this recipe scores with (the standard
  # id arm; dataPath and outputPath are the other reference arms).
  model:
    id:
      assetId: "<your-registered-model-version-id>"
  resources:
    # Nodes each JOB spreads across -- the compute pool's max node
    # count is the real ceiling, checked at job time.
    instanceCount: 4
  # Parallelism per node; raise only for I/O-bound scoring code.
  maxConcurrencyPerInstance: 1
  # Input units per scoring invocation -- size it so one invocation
  # stays inside retrySettings.timeout.
  miniBatchSize: 10
  retrySettings:
    maxRetries: 3
    timeout: PT1M
  # Abort the job when this many failures accumulate (unset/-1 ignores
  # all failures -- wrong for pipelines that assume completeness).
  errorThreshold: 100
  outputAction: AppendRow
  outputFileName: predictions.csv
