apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azurelinuxwebapp
spec:
  # The scenario deploys the fixture resource group and the fixture
  # Basic B1 plan (registry prerequisites), creates a Python web app
  # with always-on, a health probe, enum dials, and the Front Door
  # origin-lockdown ip-restriction (FDID-header GUIDs), verifies it via
  # the ARM API, destroys it, and verifies it is gone. Site names
  # release immediately on delete, so both engine runs can own the same
  # globally-unique name sequentially.
  #
  # The x_azure_fdid repeated-StringValueOrRef retrofit was live-proven
  # on the Pulumi engine (2026-07-15, 294.1s); the Terraform re-run was
  # stopped mid-flight by the owner's project-wide live-E2E closure the
  # same day. Terraform's green stands on its pre-retrofit run plus the
  # tfvars flattening contract (references arrive pre-resolved as
  # literals, so the module change is comment-only).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
