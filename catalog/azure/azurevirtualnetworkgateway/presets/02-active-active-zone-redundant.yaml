apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualNetworkGateway
metadata:
  name: my-ha-vpn-gateway
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: hub-vpn-gateway-ha
  sku: VPN_GW_2_AZ # zone-redundant; Generation2-capable
  generation: GENERATION2
  activeActive: true
  ipConfigurations:
    - name: instance-one
      subnetId:
        valueFrom:
          name: <your-gateway-subnet-resource-name>
      publicIpAddressId:
        valueFrom:
          name: <your-first-public-ip-resource-name>
    - name: instance-two
      subnetId:
        valueFrom:
          name: <your-gateway-subnet-resource-name>
      publicIpAddressId:
        valueFrom:
          name: <your-second-public-ip-resource-name>
  bgpEnabled: true
  bgpSettings:
    asn: 65515
    peeringAddresses:
      - ipConfigurationName: instance-one
        apipaAddresses:
          - "169.254.21.4"
      - ipConfigurationName: instance-two
        apipaAddresses:
          - "169.254.22.4"
