apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualNetworkGateway
metadata:
  name: my-p2s-gateway
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: client-vpn-gateway
  sku: VPN_GW_1_AZ
  ipConfigurations:
    - subnetId:
        valueFrom:
          name: <your-gateway-subnet-resource-name>
      publicIpAddressId:
        valueFrom:
          name: <your-public-ip-resource-name>
  vpnClientConfiguration:
    addressSpaces:
      - "172.16.201.0/24" # client pool; must not overlap the VNet or any connected network
    aadTenant: "https://login.microsoftonline.com/<your-tenant-id>"
    aadAudience: "<azure-vpn-application-client-id>"
    aadIssuer: "https://sts.windows.net/<your-tenant-id>/"
    vpnClientProtocols:
      - OpenVPN # Entra ID auth requires OpenVPN
    vpnAuthTypes:
      - AAD
