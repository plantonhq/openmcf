syntax = "proto3";

package dev.planton.azure.azurevirtualnetworkgateway.v1alpha1;

import "catalog/azure/azurevirtualnetworkgateway/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureVirtualNetworkGatewayStackInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureVirtualNetworkGatewayStackInput {
  // The virtual network gateway resource to deploy.
  AzureVirtualNetworkGateway target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
