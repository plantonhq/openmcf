# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_point_to_site_vpn_gateway:
    mappings:
      # Family-wide renames: the spec says what the field IS (an Azure
      # region, a resource group), where the provider inherits ARM's
      # terser property names.
      - spec: spec.region
        arg: location
      - spec: spec.resource_group
        arg: resource_group_name
      # The spec pluralizes repeated fields; the provider names blocks
      # in the singular.
      - spec: spec.connection_configurations
        arg: connection_configuration
      # The provider nests the client pool one block deeper
      # (vpn_client_address_pool holds only address_prefixes); the spec
      # flattens it onto the configuration.
      - spec: spec.connection_configurations.address_prefixes
        arg: connection_configuration.vpn_client_address_pool.address_prefixes
      # The provider names the propagation targets `ids`; the spec says
      # what they ARE (hub route table IDs -- the sibling connection
      # kinds' route_table_ids shape).
      - spec: spec.connection_configurations.route.propagated_route_table.route_table_ids
        arg: connection_configuration.route.propagated_route_table.ids
