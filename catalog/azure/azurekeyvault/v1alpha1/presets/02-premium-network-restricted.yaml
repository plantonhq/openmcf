apiVersion: azure.planton.dev/v1alpha1
kind: AzureKeyVault
metadata:
  name: prod-cmk-vault
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  # Replace: 3-24 chars, letters/digits/hyphens, globally unique -- it
  # becomes {name}.vault.azure.net.
  vaultName: myorg-prod-cmk-vault
  sku: PREMIUM
  purgeProtectionEnabled: true
  networkAcls:
    defaultAction: DENY
    ipRules:
      - <office-or-ci-cidr>
    virtualNetworkSubnetIds:
      - value: <app-subnet-arm-id>
  tags:
    cost-center: <cost-center>
