apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedRedisGeoReplication
metadata:
  name: my-global-cache-mesh
spec:
  # The member the group is managed through; the mesh below makes a
  # four-region group (the maximum is five: this member + four linked).
  managedRedisId:
    valueFrom:
      kind: AzureManagedRedis
      name: <americas-member-resource-name>
      fieldPath: status.outputs.managed_redis_id
  # Every member accepts writes in its own region; Azure merges all
  # datasets conflict-free. All members share the group name and the
  # BALANCED_B3+ SKU floor.
  linkedManagedRedisIds:
    - valueFrom:
        kind: AzureManagedRedis
        name: <europe-member-resource-name>
        fieldPath: status.outputs.managed_redis_id
    - valueFrom:
        kind: AzureManagedRedis
        name: <asia-member-resource-name>
        fieldPath: status.outputs.managed_redis_id
    - valueFrom:
        kind: AzureManagedRedis
        name: <oceania-member-resource-name>
        fieldPath: status.outputs.managed_redis_id
