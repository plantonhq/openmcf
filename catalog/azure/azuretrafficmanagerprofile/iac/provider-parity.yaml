# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_traffic_manager_profile:
    mappings:
      # Family-wide rename: the spec says what the field IS (a resource
      # group), where the provider inherits ARM's terser property name.
      - spec: spec.resource_group
        arg: resource_group_name
      # The provider's verbose name shortened to the concept -- the
      # kind's name already says whose traffic is routed.
      - spec: spec.routing_method
        arg: traffic_routing_method
      # The family's bool shape for a two-value Enabled/Disabled
      # surface -- the module renders the provider's vocabulary from
      # the spec's bool (unset applies Enabled, the provider default).
      - spec: spec.enabled
        arg: profile_status
      # The spec names say what the fields ARE (a header list, a TTL in
      # seconds), where the provider uses singular/terser names.
      - spec: spec.monitor_config.custom_headers
        arg: monitor_config.custom_header
      - spec: spec.dns_config.ttl_seconds
        arg: dns_config.ttl
