apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: azuretrafficmanagerprofile
spec:
  # The profile imports by its full ARM resource ID.
  values:
    - name: traffic_manager_profile_id
      derivations:
        - from_stack_output: traffic_manager_profile_id
      where_to_find: >-
        `az network traffic-manager profile show -g <resource-group> -n
        <name> --query id`, or the component's own
        traffic_manager_profile_id stack output.
