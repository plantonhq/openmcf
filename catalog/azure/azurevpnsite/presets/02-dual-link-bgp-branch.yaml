apiVersion: azure.planton.dev/v1alpha1
kind: AzureVpnSite
metadata:
  name: my-branch
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-branch
  virtualWanId:
    value: "<your-virtual-wan-arm-id>"
  deviceVendor: Cisco
  deviceModel: ISR4331
  links:
    - name: primary-isp
      providerName: "<primary-isp-name>"
      ipAddress: "203.0.113.10"
      speedInMbps: 200
      bgp:
        asn: 65010
        peeringAddress: "169.254.21.2"
    - name: backup-isp
      providerName: "<backup-isp-name>"
      ipAddress: "198.51.100.7"
      speedInMbps: 100
      bgp:
        asn: 65010
        peeringAddress: "169.254.22.2"
