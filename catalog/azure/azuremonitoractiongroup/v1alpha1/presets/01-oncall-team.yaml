# On-call team action group -- email + SMS + Azure mobile app push for
# the humans who answer pages. The stable routing node every alert rule
# references.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMonitorActionGroup
metadata:
  name: my-platform-oncall
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  shortName: PltOnCall
  emailReceivers:
    - name: oncall-email
      emailAddress: oncall@example.com
      useCommonAlertSchema: true
  smsReceivers:
    - name: oncall-sms
      countryCode: "1"
      phoneNumber: "5555550100"
  azureAppPushReceivers:
    - name: oncall-push
      emailAddress: oncall@example.com
  tags:
    team: platform
