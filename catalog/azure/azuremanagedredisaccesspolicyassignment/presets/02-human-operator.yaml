apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedRedisAccessPolicyAssignment
metadata:
  name: my-oncall-cache-grant
spec:
  managedRedisId:
    valueFrom:
      kind: AzureManagedRedis
      name: <managed-redis-resource-name>
      fieldPath: status.outputs.managed_redis_id
  # A human user or an Entra group, by its object ID -- personal,
  # auditable access without a key in a team vault. Granting a GROUP
  # gives the whole on-call rotation access with one assignment.
  objectId:
    value: <user-or-group-object-id>
