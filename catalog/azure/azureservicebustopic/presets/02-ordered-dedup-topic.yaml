apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusTopic
metadata:
  name: my-ordered-topic
spec:
  namespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: my-app-bus
      fieldPath: status.outputs.namespace_id
  topicName: ledger-entries
  # Fixed at creation: publish order is preserved for session-aware
  # subscriptions.
  supportOrdering: true
  # Fixed at creation: retried publishes within the window are dropped.
  requiresDuplicateDetection: true
  duplicateDetectionHistoryTimeWindow: PT10M
