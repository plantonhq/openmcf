apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventHubAuthorizationRule
metadata:
  name: my-producer-credential
spec:
  ruleName: telemetry-producer
  # Hub scope: rights over ONE stream only -- the least-privilege
  # credential for a producer service.
  eventHubId:
    valueFrom:
      kind: AzureEventHub
      name: my-telemetry-stream
      fieldPath: status.outputs.event_hub_id
  send: true
