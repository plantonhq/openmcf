syntax = "proto3";

package dev.planton.azure.azuremachinelearningcomputecluster.v1alpha1;

import "catalog/azure/azuremachinelearningcomputecluster/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureMachineLearningComputeClusterStackInput is the input to the IaC
// modules (Pulumi/Terraform). It contains the target resource
// definition and Azure provider credentials.
message AzureMachineLearningComputeClusterStackInput {
  // The compute cluster resource to deploy.
  AzureMachineLearningComputeCluster target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
