apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorCustomDomain
metadata:
  name: my-www-domain
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  domainName: www-example-com
  hostName: www.example.com
  # DNS lives in Azure DNS: Azure watches the zone for the validation
  # TXT record. Drop this field when DNS is hosted elsewhere.
  dnsZoneId:
    valueFrom:
      kind: AzureDnsZone
      name: <dns-zone-resource-name>
      fieldPath: status.outputs.zone_id
  # Empty TLS block = Azure-managed certificate at the TLS 1.2 floor --
  # free, auto-issued, auto-rotated.
  tls: {}
