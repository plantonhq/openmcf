apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorCustomDomain
metadata:
  name: my-wildcard-domain
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  domainName: wildcard-example-com
  # Wildcard hostnames REQUIRE a customer certificate -- Azure's managed
  # certificates cover exact names only.
  hostName: "*.example.com"
  tls:
    certificateType: CUSTOMER_CERTIFICATE
    secretId:
      valueFrom:
        kind: AzureFrontDoorSecret
        name: <front-door-secret-resource-name>
        fieldPath: status.outputs.secret_id
