apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRoutePort
metadata:
  name: my-encrypted-port
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-encrypted-port
  peeringLocation: "<your-peering-location>" # ExpressRoute Direct vocabulary, e.g. "Equinix-Ashburn-DC2"
  bandwidthInGbps: 10
  encapsulation: DOT1Q
  identity:
    type: USER_ASSIGNED
    identityIds:
      - valueFrom:
          name: <your-user-assigned-identity>
  link1:
    adminEnabled: true
    macsecCipher: GCM_AES_256
    macsecCknKeyvaultSecretId: "<your-ckn-secret-id>" # versioned Key Vault secret URL
    macsecCakKeyvaultSecretId: "<your-cak-secret-id>" # versioned Key Vault secret URL
  link2:
    adminEnabled: true
    macsecCipher: GCM_AES_256
    macsecCknKeyvaultSecretId: "<your-ckn-secret-id>"
    macsecCakKeyvaultSecretId: "<your-cak-secret-id>"
