apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRoutePort
metadata:
  name: my-port
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: my-port
  peeringLocation: "<your-peering-location>" # ExpressRoute Direct vocabulary, e.g. "Equinix-Ashburn-DC2"
  bandwidthInGbps: 10
  encapsulation: DOT1Q
  link1:
    adminEnabled: true
  link2:
    adminEnabled: true
