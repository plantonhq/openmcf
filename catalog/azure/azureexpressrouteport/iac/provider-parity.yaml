# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_express_route_port:
    mappings:
      # Family-wide renames: the spec says what the field IS (an Azure
      # region, a resource group), where the provider inherits ARM's
      # terser property names.
      - spec: spec.region
        arg: location
      - spec: spec.resource_group
        arg: resource_group_name

  azurerm_express_route_port_authorization:
    # Instantiated per spec.authorizations entry (the keys this port
    # ISSUES; ARM generates each key into the name-keyed
    # authorization_keys output).
    specRoot: spec.authorizations
    exclusions:
      - arg: express_route_port_name
        reason: wired by the module to the port it creates -- never user surface
      - arg: resource_group_name
        reason: wired by the module to the port's resource group -- never user surface
