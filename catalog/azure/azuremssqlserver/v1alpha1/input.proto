syntax = "proto3";

package dev.planton.azure.azuremssqlserver.v1alpha1;

import "catalog/azure/azuremssqlserver/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureMssqlServerStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureMssqlServerStackInput {
  // target cloud-resource to be deployed
  AzureMssqlServer target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
