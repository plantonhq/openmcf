apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningWorkspace
metadata:
  name: team-workspace
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  # 3-33 chars, alphanumerics/hyphens/underscores; the name is held by
  # the soft-deleted ghost after deletion until purged.
  name: acme-ml-team
  applicationInsightsId:
    value: "<your-application-insights-id>"
  keyVaultId:
    value: "<your-key-vault-id>"
  # A general-purpose account with hierarchical namespace OFF -- ARM
  # rejects Data Lake Gen2 accounts as default workspace storage.
  storageAccountId:
    value: "<your-storage-account-id>"
  identity:
    type: SYSTEM_ASSIGNED
  friendlyName: Team ML Workspace
  description: Shared workspace for the data-science team
