syntax = "proto3";

package dev.planton.azure.azuremachinelearningworkspace.v1alpha1;

import "catalog/azure/azuremachinelearningworkspace/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureMachineLearningWorkspaceStackInput is the input to the IaC
// modules (Pulumi/Terraform). It contains the target resource
// definition and Azure provider credentials.
message AzureMachineLearningWorkspaceStackInput {
  // The Machine Learning workspace resource to deploy.
  AzureMachineLearningWorkspace target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
