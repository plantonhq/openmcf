apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageContainer
metadata:
  name: my-app-uploads
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # 3-63 lowercase letters, digits, and hyphens; unique within the
  # account; becomes the URL path segment.
  # Replace: 3-63 lowercase letters, digits, and single hyphens.
  containerName: app-data
  # Private is the spec default -- stated explicitly here because the
  # access posture is the one decision every container owner must make.
  containerAccessType: PRIVATE
  metadata:
    purpose: <data-domain>
