apiVersion: azure.planton.dev/v1alpha1
kind: AzureFunctionApp
metadata:
  name: my-container-fn
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  functionAppName: my-container-fn
  servicePlanId:
    value: "<your-elastic-premium-plan-id>"
  storageAccountName:
    value: "<your-storage-account-name>"
  storageAccountAccessKey:
    value: "<your-storage-access-key>"
  httpsOnly: true
  identity:
    type: SYSTEM_ASSIGNED
  siteConfig:
    applicationStack:
      docker:
        registryUrl: https://<your-registry>.azurecr.io
        imageName: <your-org>/<your-function-app>
        imageTag: latest
    # Managed-identity image pulls: no registry password to manage.
    # Grant the app's identity AcrPull on the registry.
    containerRegistryUseManagedIdentity: true
    healthCheckPath: /api/health
    alwaysOn: true
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
