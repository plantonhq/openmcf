apiVersion: azure.planton.dev/v1alpha1
kind: AzureFunctionApp
metadata:
  name: my-python-api
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  functionAppName: my-python-api
  servicePlanId:
    value: "<your-service-plan-id>"
  storageAccountName:
    value: "<your-storage-account-name>"
  storageAccountAccessKey:
    value: "<your-storage-access-key>"
  applicationInsightsConnectionString:
    value: "<your-app-insights-connection-string>"
  httpsOnly: true
  appSettings:
    PYTHON_ENABLE_WORKER_EXTENSIONS: "1"
  siteConfig:
    applicationStack:
      pythonVersion: "3.12"
    healthCheckPath: /api/health
    # TLS_1_2 is the spec default -- stated here for clarity.
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    cors:
      allowedOrigins:
        - https://myapp.example.com
