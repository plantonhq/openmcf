apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsZoneVirtualNetworkLink
metadata:
  name: my-zone-link
spec:
  # Replace with the link name -- one per VNet, so the VNet's name is the
  # natural choice.
  name: app-vnet-link
  privateDnsZoneId:
    value: <private-dns-zone-arm-id>
  virtualNetworkId:
    value: <virtual-network-arm-id>
