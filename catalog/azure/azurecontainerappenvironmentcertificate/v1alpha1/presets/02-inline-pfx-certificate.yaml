apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironmentCertificate
metadata:
  name: my-inline-pfx-certificate
spec:
  certificateName: app.example.com
  containerAppEnvironmentId:
    valueFrom:
      kind: AzureContainerAppEnvironment
      name: <your-environment>
      fieldPath: status.outputs.environment_id
  # Both fields are secret-bearing: reference managed secrets, never
  # paste the PFX or its password.
  certificateBlobBase64: $secret/<your-pfx-secret>
  certificatePassword: $secret/<your-pfx-password-secret>
