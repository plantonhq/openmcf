apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualHubConnection
metadata:
  name: my-spoke
spec:
  name: my-spoke
  virtualHubId:
    value: "<your-virtual-hub-arm-id>"
  remoteVirtualNetworkId:
    value: "<your-virtual-network-arm-id>"
  routing:
    associatedRouteTableId:
      value: "<your-isolated-route-table-arm-id>"
    propagatedRouteTable:
      labels:
        - shared
