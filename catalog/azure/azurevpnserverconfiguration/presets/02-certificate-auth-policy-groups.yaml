apiVersion: azure.planton.dev/v1alpha1
kind: AzureVpnServerConfiguration
metadata:
  name: segmented-cert-access
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  name: segmented-cert-access
  vpnAuthenticationTypes:
    - Certificate
  clientRootCertificates:
    - name: corp-root
      publicCertData: "<your-root-certificate-base64-body>"
  vpnProtocols:
    - OpenVPN
  policyGroups:
    - name: engineering
      isDefault: true
      priority: 0
      policies:
        - name: engineering-cn
          type: CertificateGroupId
          value: engineering
    - name: contractors
      priority: 10
      policies:
        - name: contractor-cn
          type: CertificateGroupId
          value: contractor
