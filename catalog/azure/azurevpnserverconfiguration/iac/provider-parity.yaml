# Provider-parity manifest: this kind's recorded judgment against the
# pinned azurerm provider (checked by `planton provider-parity --check`;
# format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  azurerm_vpn_server_configuration:
    mappings:
      # Family-wide renames: the spec says what the field IS (an Azure
      # region, a resource group), where the provider inherits ARM's
      # terser property names.
      - spec: spec.region
        arg: location
      - spec: spec.resource_group
        arg: resource_group_name
      # The spec uses the current product name's short form; the
      # provider carries the older full product name.
      - spec: spec.aad_authentication
        arg: azure_active_directory_authentication
      # The spec pluralizes repeated fields; the provider names blocks
      # in the singular.
      - spec: spec.client_root_certificates
        arg: client_root_certificate
      - spec: spec.client_revoked_certificates
        arg: client_revoked_certificate
      - spec: spec.radius.servers
        arg: radius.server
      - spec: spec.radius.client_root_certificates
        arg: radius.client_root_certificate
      - spec: spec.radius.server_root_certificates
        arg: radius.server_root_certificate

  azurerm_vpn_server_configuration_policy_group:
    # Instantiated per spec.policy_groups entry (the configuration's
    # composed member-matching children, keyed by name into the
    # policy_group_ids output).
    specRoot: spec.policy_groups
    mappings:
      # The spec pluralizes repeated fields; the provider names blocks
      # in the singular.
      - spec: spec.policy_groups.policies
        arg: policy
    exclusions:
      - arg: vpn_server_configuration_id
        reason: wired by the module to the configuration it creates -- never user surface
