syntax = "proto3";

package dev.planton.azure.azurevpnserverconfiguration.v1alpha1;

import "catalog/azure/azurevpnserverconfiguration/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureVpnServerConfigurationStackInput is the input to the IaC
// modules (Pulumi/Terraform). It contains the target resource
// definition and Azure provider credentials.
message AzureVpnServerConfigurationStackInput {
  // The VPN server configuration resource to deploy.
  AzureVpnServerConfiguration target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
