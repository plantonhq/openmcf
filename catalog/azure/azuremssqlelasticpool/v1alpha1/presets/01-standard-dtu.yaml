apiVersion: azure.planton.dev/v1alpha1
kind: AzureMssqlElasticPool
metadata:
  name: standard-pool
spec:
  serverId:
    valueFrom:
      kind: AzureMssqlServer
      name: <server-resource-name>
      fieldPath: status.outputs.server_id
  region: <server-region>
  poolName: <pool-name>
  # A 100-eDTU Standard pool: the classic bundled-compute economics for
  # many small databases with non-overlapping peaks.
  skuName: StandardPool
  capacity: 100
  perDatabaseSettings:
    # Reserve nothing per database (let the pool oversubscribe); cap any
    # one database at 50 eDTUs so no tenant starves the rest.
    minCapacity: 0
    maxCapacity: 50
  tags:
    cost-center: <cost-center>
