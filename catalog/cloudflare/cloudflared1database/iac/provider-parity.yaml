# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  cloudflare_d1_database:
    mappings:
      # Renames: the spec says what the field IS (a database name, a region)
      # where the provider inherits terser or API-internal names.
      - spec: spec.database_name
        arg: name
      - spec: spec.region
        arg: primary_location_hint
      # The provider's read_replication object attribute carries exactly one
      # configurable leaf; the spec models it under the same nested name.
      - spec: spec.read_replication.mode
        arg: read_replication
