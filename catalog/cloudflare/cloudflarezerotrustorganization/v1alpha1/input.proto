syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustorganization.v1alpha1;

import "catalog/cloudflare/cloudflarezerotrustorganization/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareZeroTrustOrganizationStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareZeroTrustOrganizationStackInput {
  // target cloud-resource to be deployed
  CloudflareZeroTrustOrganization target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
