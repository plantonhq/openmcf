apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustOrganization
metadata:
  name: acme-zero-trust-org-hardened
spec:
  account_id: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d"
  auth_domain: acme.cloudflareaccess.com
  name: Acme Zero Trust
  session_duration: 12h
  deny_unmatched_requests: true
  mfa_config:
    allowed_authenticators:
      - security_key
      - totp
    session_duration: 12h
  mfa_required_for_all_apps: true
  is_ui_read_only: true
  ui_read_only_toggle_reason: Managed by IaC -- change via the infrastructure repo
  key_rotation_interval_days: 30
