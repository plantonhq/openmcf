# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22); the per-endpoint mapping is confirmed by the
# "Accepted Permissions" sections of the Zero Trust organizations and Access
# keys endpoint references
# (https://developers.cloudflare.com/api/resources/zero_trust/subresources/organizations/methods/update/
# and
# https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/keys/methods/update/,
# retrieved 2026-08-22). Note the reference also lists a narrower
# "Access: Organizations Write" group, but the endpoint references accept
# only the combined group below:
#
#   "Access: Organizations, Identity Providers, and Groups Write"
#     -- account-scoped; upsert the Zero Trust organization singleton via
#        PUT /{accounts_or_zones}/{account_or_zone_id}/access/organizations
#        (one endpoint serving both the account_id and zone_id spec scopes)
#        and update the folded Access service-key rotation cadence via
#        PUT /accounts/{account_id}/access/keys (named by both endpoint
#        references' Accepted Permissions) (provenance: derived)
#   "Access: Organizations, Identity Providers, and Groups Read"
#     -- account-scoped; refresh/import the organization and the key
#        configuration via GET on the same paths (named by the endpoint
#        references' Accepted Permissions) (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's cloudflare_zero_trust_organization singleton plus its
# conditional cloudflare_zero_trust_access_key_configuration companion, and
# the Pulumi module's matching ZeroTrustOrganization and
# ZeroTrustAccessKeyConfiguration resources; neither engine performs
# secondary lookups). The live capture lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarezerotrustorganization
spec: {}
