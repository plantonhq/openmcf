apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareCustomSslCertificate
metadata:
  name: www-custom-certificate
spec:
  zone_id:
    value: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your zone id
  certificate: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CERTIFICATE_PEM
    -----END CERTIFICATE-----
  private_key:
    value: REPLACE_WITH_PRIVATE_KEY_REFERENCE # prefer a managed-secret reference
  type: sni_custom
  bundle_method: ubiquitous
