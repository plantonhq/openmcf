syntax = "proto3";

package dev.planton.cloudflare.cloudflarecustomsslcertificate.v1alpha1;

// CloudflareCustomSslCertificateStackOutputs captures the observable outputs
// after uploading a custom SSL certificate.
message CloudflareCustomSslCertificateStackOutputs {
  // The ID of the uploaded certificate.
  string certificate_id = 1;

  // The zone the certificate belongs to.
  string zone_id = 2;

  // When the certificate expires (RFC3339).
  string expires_on = 3;

  // The certificate's deployment status (for example active or pending).
  // Deployment is asynchronous -- a fresh upload may report a pending state
  // before turning active.
  string status = 4;
}
