apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarezerotrustdnslocation
spec:
  # DNS locations under live E2E: account-scoped creates with a real delete
  # and an honest 404 (both scenarios cheap and self-contained). Watch items
  # for the proving session: (1) the basic upstream acceptance test blanks
  # CLOUDFLARE_API_TOKEN (the Access/Gateway auth-defect class) -- a 403
  # under our token credential is the expected ambush; (2) client_default is
  # deliberately never set -- flipping the account's default location is a
  # real account-level mutation; (3) update is a full replace at the API, so
  # the endpoints-doh arm keeps max_ttl declared to prove the idempotent
  # re-plan.
  tier: 1
  cost_class: cheap_ephemeral
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
