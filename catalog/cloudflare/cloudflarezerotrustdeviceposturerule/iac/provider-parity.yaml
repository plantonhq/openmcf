# Provider-parity manifest for CloudflareZeroTrustDevicePostureRule.
# Records only divergences from exact-name matching against
# cloudflare_zero_trust_device_posture_rule at the pinned provider version.
# Unlisted arguments (account_id, name, type, description, expiration,
# schedule) match spec fields by exact name.
