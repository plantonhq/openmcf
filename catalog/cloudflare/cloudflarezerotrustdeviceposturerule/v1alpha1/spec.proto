syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustdeviceposturerule.v1alpha1;

import "buf/validate/validate.proto";

// CloudflareZeroTrustDevicePostureRuleSpec creates a device posture rule: a
// health check (disk encrypted? OS current? EDR agent healthy?) that WARP
// evaluates on enrolled devices and that Access and Gateway policies can
// then require before admitting a device. A plain CRUD object -- real
// create, update, delete.
//
// The rule's `type` selects WHICH check runs, and `input` carries that
// check's parameters. Which input fields a given type reads is owned by
// Cloudflare's API (23 types x ~36 input fields is an API-side pairing);
// each input field's comment names the check families that use it.
message CloudflareZeroTrustDevicePostureRuleSpec {
  // The Cloudflare account the rule belongs to.
  string account_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "account_id.hex32"
      message: "account_id must be a 32-character hex string"
      expression: "this.matches('^[0-9a-fA-F]{32}$')"
    }
  ];

  // The rule's name, shown in the dashboard and in policy builders.
  // Required here although the provider marks it optional -- an unnamed
  // posture rule is indistinguishable in every surface that lists rules.
  string name = 2 [(buf.validate.field).required = true];

  // The check this rule runs. The 23 values are the provider's own list at
  // v5.23.0. WARP-client checks (file, application, os_version,
  // disk_encryption, firewall, domain_joined, serial_number,
  // unique_client_id, client_certificate, client_certificate_v2, gateway,
  // warp, antivirus, carbonblack, sentinelone, tanium, kolide) run on the
  // device; *_s2s and vendor types (crowdstrike_s2s, intune, workspace_one,
  // sentinelone_s2s, tanium_s2s, custom_s2s) read a service-to-service
  // posture integration.
  string type = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "type.values"
      message: "type must be one of the provider's posture rule types (file, application, tanium, gateway, warp, disk_encryption, serial_number, sentinelone, carbonblack, firewall, os_version, domain_joined, client_certificate, client_certificate_v2, antivirus, unique_client_id, kolide, tanium_s2s, crowdstrike_s2s, intune, workspace_one, sentinelone_s2s, custom_s2s)"
      expression: "this in ['file', 'application', 'tanium', 'gateway', 'warp', 'disk_encryption', 'serial_number', 'sentinelone', 'carbonblack', 'firewall', 'os_version', 'domain_joined', 'client_certificate', 'client_certificate_v2', 'antivirus', 'unique_client_id', 'kolide', 'tanium_s2s', 'crowdstrike_s2s', 'intune', 'workspace_one', 'sentinelone_s2s', 'custom_s2s']"
    }
  ];

  // A description of what the rule checks.
  string description = 4;

  // How long a posture result stays valid before it must be refreshed
  // (e.g. "1h", "30m"). Empty keeps results valid until overwritten by new
  // data from the client.
  string expiration = 5;

  // How often the WARP client re-runs the check (e.g. "5m", "1h").
  // Cloudflare's default is 5m; the minimum is 1m.
  string schedule = 6;

  // Which platforms the rule runs on. Empty runs wherever the check type
  // applies.
  repeated CloudflareZeroTrustDevicePostureRuleMatch match = 7;

  // The check's parameters. Which fields apply depends on `type` -- see
  // each field's comment.
  CloudflareZeroTrustDevicePostureRuleInput input = 8;
}

// CloudflareZeroTrustDevicePostureRuleMatch scopes the rule to a platform.
message CloudflareZeroTrustDevicePostureRuleMatch {
  // The platform the rule runs on.
  string platform = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "platform.values"
      message: "platform must be one of windows, mac, linux, android, ios, chromeos"
      expression: "this in ['windows', 'mac', 'linux', 'android', 'ios', 'chromeos']"
    }
  ];
}

// CloudflareZeroTrustDevicePostureRuleInput carries the parameters for the
// selected check type. Every field is optional at the proto level; the
// comment on each names the check families that read it.
message CloudflareZeroTrustDevicePostureRuleInput {
  // Operating system the check targets (os_version and file-family
  // checks).
  string operating_system = 1 [(buf.validate.field).cel = {
    id: "operating_system.values"
    message: "operating_system must be one of windows, linux, mac, android, ios, chromeos"
    expression: "this == '' || this in ['windows', 'linux', 'mac', 'android', 'ios', 'chromeos']"
  }];

  // File path to check (file and application checks).
  string path = 2;

  // Whether the file must exist (file check).
  optional bool exists = 3;

  // Expected SHA-256 of the file (file check).
  string sha256 = 4;

  // Signing certificate thumbprint (application check).
  string thumbprint = 5;

  // Zero Trust list ID holding allowed values (serial_number and
  // unique_client_id checks read a list of device identifiers).
  string id = 6;

  // The Windows domain the device must be joined to (domain_joined check).
  string domain = 7;

  // Version comparison operator (os_version check).
  string operator = 8 [(buf.validate.field).cel = {
    id: "operator.values"
    message: "operator must be one of <, <=, >, >=, =="
    expression: "this == '' || this in ['<', '<=', '>', '>=', '==']"
  }];

  // OS version compared against (os_version check).
  string version = 9;

  // Linux distribution name (os_version check on linux).
  string os_distro_name = 10;

  // Linux distribution version (os_version check on linux).
  string os_distro_revision = 11;

  // Extra OS version detail: Windows UBR, macOS/iOS Product Version Extra,
  // or the Linux distro name+version (os_version check).
  string os_version_extra = 12;

  // Whether the checked feature must be enabled (firewall and
  // disk_encryption checks).
  optional bool enabled = 13;

  // Volume names to check for encryption (disk_encryption check). Empty
  // with require_all checks every disk.
  repeated string check_disks = 14;

  // Whether every disk must be encrypted (disk_encryption check).
  optional bool require_all = 15;

  // UUID of the Cloudflare-managed certificate (client_certificate and
  // client_certificate_v2 checks). The WARP client certificate is minted by
  // Cloudflare's zero-trust certificate surface, which has no catalog kind
  // -- a literal UUID is the only form.
  string certificate_id = 16;

  // Common Name the certificate must protect (client_certificate checks).
  string cn = 17;

  // Confirm the certificate was not imported from another device
  // (client_certificate_v2 check). Keep enabled unless the certificate was
  // deployed without a private key.
  optional bool check_private_key = 18;

  // Allowed certificate public key purposes (client_certificate_v2 check).
  repeated string extended_key_usage = 19 [(buf.validate.field).cel = {
    id: "extended_key_usage.values"
    message: "extended_key_usage entries must be clientAuth or emailProtection"
    expression: "this.all(v, v in ['clientAuth', 'emailProtection'])"
  }];

  // Where to look for the client certificate (client_certificate_v2
  // check).
  CloudflareZeroTrustDevicePostureRuleCertificateLocations locations = 20;

  // Certificate Subject Alternative Names that must be present
  // (client_certificate_v2 check).
  repeated string subject_alternative_names = 21;

  // Days within which the antivirus must have updated (antivirus check).
  optional int64 update_window_days = 22 [(buf.validate.field).int64.gte = 0];

  // Required compliance state reported by the MDM (intune and
  // workspace_one checks).
  string compliance_status = 23 [(buf.validate.field).cel = {
    id: "compliance_status.values"
    message: "compliance_status must be one of compliant, noncompliant, unknown, notapplicable, ingraceperiod, error"
    expression: "this == '' || this in ['compliant', 'noncompliant', 'unknown', 'notapplicable', 'ingraceperiod', 'error']"
  }];

  // The posture integration this service-to-service check reads (*_s2s,
  // intune, workspace_one types). Posture integrations are managed outside
  // this catalog today, so the value is the integration's UUID.
  string connection_id = 24;

  // How recently the vendor must have seen the device, per the vendor's
  // own format (crowdstrike_s2s check).
  string last_seen = 25;

  // Vendor-reported OS version constraint (crowdstrike_s2s check).
  string os = 26;

  // Vendor-reported overall posture score constraint (crowdstrike_s2s
  // check).
  string overall = 27;

  // Vendor-reported sensor configuration constraint (crowdstrike_s2s
  // check).
  string sensor_config = 28;

  // Required device state at the vendor (crowdstrike_s2s check).
  string state = 29 [(buf.validate.field).cel = {
    id: "state.values"
    message: "state must be one of online, offline, unknown"
    expression: "this == '' || this in ['online', 'offline', 'unknown']"
  }];

  // Operator applied to the vendor version comparison (crowdstrike_s2s
  // check).
  string version_operator = 30 [(buf.validate.field).cel = {
    id: "version_operator.values"
    message: "version_operator must be one of <, <=, >, >=, =="
    expression: "this == '' || this in ['<', '<=', '>', '>=', '==']"
  }];

  // Kolide device authentication states that pass the check -- the device
  // must be in one of them (kolide check). Values are Kolide's own,
  // capitalized exactly as its API reports them.
  repeated string auth_state = 31 [(buf.validate.field).cel = {
    id: "auth_state.values"
    message: "auth_state entries must be one of Good, Notified, Will Block, Blocked"
    expression: "this.all(v, v in ['Good', 'Notified', 'Will Block', 'Blocked'])"
  }];

  // Operator applied to the Kolide issue count (kolide check).
  string count_operator = 32 [(buf.validate.field).cel = {
    id: "count_operator.values"
    message: "count_operator must be one of <, <=, >, >=, =="
    expression: "this == '' || this in ['<', '<=', '>', '>=', '==']"
  }];

  // The Kolide issue count compared against (kolide check). Cloudflare's
  // API takes this as a string.
  string issue_count = 33;

  // How recently Tanium must have seen the device, per Tanium's format
  // (tanium and tanium_s2s checks).
  string eid_last_seen = 34;

  // Maximum Tanium risk level that passes (tanium and tanium_s2s checks).
  string risk_level = 35 [(buf.validate.field).cel = {
    id: "risk_level.values"
    message: "risk_level must be one of low, medium, high, critical"
    expression: "this == '' || this in ['low', 'medium', 'high', 'critical']"
  }];

  // Operator applied to the Tanium total score (tanium and tanium_s2s
  // checks).
  string score_operator = 36 [(buf.validate.field).cel = {
    id: "score_operator.values"
    message: "score_operator must be one of <, <=, >, >=, =="
    expression: "this == '' || this in ['<', '<=', '>', '>=', '==']"
  }];

  // The Tanium total score compared against (tanium and tanium_s2s
  // checks).
  optional double total_score = 37;

  // Maximum number of active threats that passes (sentinelone_s2s check).
  optional int64 active_threats = 38 [(buf.validate.field).int64.gte = 0];

  // Whether the device may be flagged infected (sentinelone_s2s check).
  optional bool infected = 39;

  // Whether the vendor must report the device active (sentinelone_s2s
  // check).
  optional bool is_active = 40;

  // Required network status at the vendor (sentinelone_s2s check).
  string network_status = 41 [(buf.validate.field).cel = {
    id: "network_status.values"
    message: "network_status must be one of connected, disconnected, disconnecting, connecting"
    expression: "this == '' || this in ['connected', 'disconnected', 'disconnecting', 'connecting']"
  }];

  // Required agent operational state (sentinelone_s2s check).
  string operational_state = 42 [(buf.validate.field).cel = {
    id: "operational_state.values"
    message: "operational_state must be one of na, partially_disabled, auto_fully_disabled, fully_disabled, auto_partially_disabled, disabled_error, db_corruption"
    expression: "this == '' || this in ['na', 'partially_disabled', 'auto_fully_disabled', 'fully_disabled', 'auto_partially_disabled', 'disabled_error', 'db_corruption']"
  }];

  // Posture score 0-100 assigned by the third-party provider (custom_s2s
  // check).
  optional double score = 43 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];
}

// CloudflareZeroTrustDevicePostureRuleCertificateLocations names where the
// client_certificate_v2 check looks for the certificate.
message CloudflareZeroTrustDevicePostureRuleCertificateLocations {
  // Filesystem paths to check on linux.
  repeated string paths = 1;

  // OS trust stores to check.
  repeated string trust_stores = 2 [(buf.validate.field).cel = {
    id: "trust_stores.values"
    message: "trust_stores entries must be system or user"
    expression: "this.all(v, v in ['system', 'user'])"
  }];
}
