# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Divergences recorded here:
#   - `filters` is a provider list that "can only contain a single value"
#     (API-enforced); the spec models it as the singular `filter` string and
#     the modules wrap it into the one-element list.
#   - `expiration`, `schedule`, and `rule_settings` are single-nested
#     attributes (one configurable argument each); the spec models their full
#     field surfaces as typed messages under the provider's own field names.
#     Fan-in mappings record every spec leaf each argument realizes. The
#     spec's add_headers/set_headers wrapper messages ({values: [...]})
#     realize the provider's map-of-lists shape.

resources:
  cloudflare_zero_trust_gateway_policy:
    mappings:
      - spec: spec.filter
        arg: filters
      - spec: spec.expiration.expires_at
        arg: expiration
      - spec: spec.expiration.duration
        arg: expiration
      - spec: spec.schedule.mon
        arg: schedule
      - spec: spec.schedule.tue
        arg: schedule
      - spec: spec.schedule.wed
        arg: schedule
