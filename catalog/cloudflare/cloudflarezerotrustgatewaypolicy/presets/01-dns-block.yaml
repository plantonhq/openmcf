apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustGatewayPolicy
metadata:
  name: block-gambling
spec:
  account_id: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: block-gambling-domains
  action: block
  filter: dns
  enabled: true
  precedence: 1000
  traffic: any(dns.domains[*] == "gambling.example.com") # replace with your domains or a list expression
  rule_settings:
    block_page_enabled: true
    block_reason: Blocked by company policy
