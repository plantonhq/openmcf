# The free-plan live arm: enable Bot Fight Mode. Cloudflare REQUIRES the
# zone's JavaScript detections to be on before Fight Mode can enable (400
# code 10400 "cannot enable Fight_Mode while EnableJS is disabled", measured
# live 2026-08-27 -- a fresh zone has them off), so the scenario declares the
# pair. Runs FIRST (filename order); revert-off runs last and returns the
# toggles to off (the no-op-destroy revert discipline).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareBotManagement
metadata:
  name: e2e-botmgmt-fight-${E2E_RUN_ID}
spec:
  zone_id:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  fight_mode: true
  enable_js: true
