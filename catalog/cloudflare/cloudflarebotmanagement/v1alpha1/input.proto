syntax = "proto3";

package dev.planton.cloudflare.cloudflarebotmanagement.v1alpha1;

import "catalog/cloudflare/cloudflarebotmanagement/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareBotManagementStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareBotManagementStackInput {
  // target cloud-resource to be deployed
  CloudflareBotManagement target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
