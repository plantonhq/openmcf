syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustdevicedefaultprofile.v1alpha1;

import "catalog/cloudflare/cloudflarezerotrustdevicedefaultprofile/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareZeroTrustDeviceDefaultProfileStackInput is the input to the IaC
