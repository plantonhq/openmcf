# Offline-plan arm: the folded per-zone WARP client certificate provisioning
# toggle. Offline because the ENTIRE endpoint (GET and PATCH
# zones/{zone_id}/devices/policy/certificates) refuses ACCOUNT-OWNED API
# tokens with 401 code 1039 "malformed actor email claim" -- measured live
# 2026-08-27 on both a run-scoped pending zone and the active test zone, so
# the wall is the CREDENTIAL CLASS, not zone state. The endpoint wants a
# user-actor credential (a user-owned token or API key + email, which carry
# an actor email claim); upstream's own acceptance test blanks
# CLOUDFLARE_API_TOKEN for exactly this reason. This program's harness
# deliberately authenticates with the account-owned token, so the toggle's
# live proof waits for a user-actor credential lane (the unblock condition).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustDeviceDefaultProfile
metadata:
  name: test-device-default-profile-zone-certificates
spec:
  account_id: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d"
  zone_certificates:
    zone_id:
      value: "023e105f4ecef8ad9ca31a8372d0c353"
    enabled: true
