# Zone-certificates scenario: proves the folded per-zone WARP client
# certificate provisioning toggle -- the one ZONE-scoped surface on this
# account-scoped kind -- against the run-scoped zone fixture (never a real
# zone). The companion has no delete and no import; enabling it on the
# throwaway pending zone is harmless, and the zone's own destroy retires the
# surface with it. The companion's upstream test blanks CLOUDFLARE_API_TOKEN
# -- a 403 here under our token credential is the expected ambush.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustDeviceDefaultProfile
metadata:
  name: planton-oss-e2e-cloudflarezerotrustdevicedefaultprofile-zone-certificates
  id: planton-oss-e2e-cloudflarezerotrustdevicedefaultprofile-zone-certificates
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: cloudflarezerotrustdevicedefaultprofile
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: CloudflareDnsZone
  tags:
    - planton-e2e
spec:
  account_id: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  zone_certificates:
    zone_id:
      valueFrom:
        kind: CloudflareDnsZone
        name: planton-oss-e2e-cloudflarednszone-prereq
        fieldPath: status.outputs.zone_id
    enabled: true
