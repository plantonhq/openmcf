apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflareauthenticatedoriginpulls
spec:
  # Authenticated Origin Pulls under live E2E: the harness deploys the
  # CloudflareDnsZone prerequisite, resolves zone_id, manages the zone
  # toggle and/or hostname associations, and verifies via the zone's
  # origin_tls_client_auth settings surface. Watch items for the proving
  # session: (a) THE NO-OP DESTROY CLASS -- the zone toggle has NO delete at
  # Cloudflare; verify-absent asserts the surface STILL answers (the
  # settings-singleton contract), and zero-orphan cleanup rides the
  # run-scoped zone fixture's own destroy; (b) an association "delete" is a
  # revert-PUT (enabled: null) the provider issues FROM STATE, and it sends
  # the cert_id state holds -- an association created without a certificate
  # must still revert cleanly (the void call sends an empty cert_id; watch
  # for a 4xx there); (c) the association's config list never survives
  # import (no_refresh) -- the blind round-trip must re-assert it from
  # configuration.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
