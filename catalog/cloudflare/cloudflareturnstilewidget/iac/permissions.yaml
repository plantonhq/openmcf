# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the "Accepted Permissions"
# sections of the Turnstile widgets API endpoint docs
# (https://developers.cloudflare.com/api/resources/turnstile/subresources/widgets/,
# create/get method pages, retrieved 2026-08-22), cross-checked against the
# Cloudflare API token permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22):
#
#   "Turnstile Sites Write"  -- account-scoped; create/update/delete the
#                               widget via POST/PUT/DELETE
#                               /accounts/{account_id}/challenges/widgets
#                               [/{sitekey}]. The create endpoint's Accepted
#                               Permissions list names this group verbatim
#                               (alongside the much broader "Account
#                               Settings Write"). The general reference
#                               publishes the display names "Turnstile
#                               Write"/"Turnstile Read" instead; the
#                               endpoint docs do not list those names, so we
#                               do not claim they suffice.
#                               (provenance: documented)
#   "Turnstile Sites Read"   -- account-scoped; refresh/import the widget
#                               via GET
#                               /accounts/{account_id}/challenges/widgets/{sitekey}
#                               (the get endpoint accepts Read or Write;
#                               Write alone covers the whole lifecycle, so
#                               Read is only needed for read-only
#                               credentials) (provenance: documented)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_turnstile_widget resource and the
# Pulumi module's matching TurnstileWidget resource; neither engine performs
# secondary lookups), with both groups upgraded to documented provenance by
# the endpoint pages cited above. The live capture lane upgrades entries to
# proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflareturnstilewidget
spec: {}
