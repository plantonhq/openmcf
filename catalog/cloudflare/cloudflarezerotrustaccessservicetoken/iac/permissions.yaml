# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22), cross-checked against the "Accepted Permissions"
# sections of the Access service token API endpoint docs
# (https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/service_tokens/,
# create/get/update/delete method pages, retrieved 2026-08-22):
#
#   "Access: Service Tokens Write"
#       -- account-scoped; create the token via POST
#          /accounts/{account_id}/access/service_tokens (or the
#          /zones/{zone_id}/... variant when the spec targets a zone), update
#          name/duration and rotate via PUT on
#          .../service_tokens/{service_token_id}, and delete it via DELETE on
#          the same path (each endpoint's docs name this group as the accepted
#          permission)
#          (provenance: derived)
#   "Access: Service Tokens Read"
#       -- account-scoped; refresh/import the token's metadata (the client
#          secret is returned only at creation/rotation, never on reads) via
#          GET .../service_tokens/{service_token_id} (the get endpoint accepts
#          Read or Write; Write alone covers the whole lifecycle, so Read is
#          only needed for read-only credentials)
#          (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_zero_trust_access_service_token
# resource and the Pulumi module's matching ZeroTrustAccessServiceToken
# resource; neither engine performs secondary lookups or data-source reads).
# The live capture lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarezerotrustaccessservicetoken
spec: {}
