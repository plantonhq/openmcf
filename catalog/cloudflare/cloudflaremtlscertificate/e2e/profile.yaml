apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflaremtlscertificate
spec:
  # mTLS certificate under live E2E: account-scoped (no zone fixture) -- the
  # harness uploads the env-supplied CA certificate to the account store,
  # verifies via the account's mtls_certificates API, destroys (real
  # delete). A self-signed CA is the product's own use case here, so the
  # proof session mints one at setup (openssl, documented in the program's
  # account-setup guide); without the env var the lane skips honestly.
  # Watch items for the proving session: (a) EVERY field is create-only at
  # the API -- the idempotency re-plan must be empty, and any in-place
  # change plan is a replace; (b) the private key never returns from the
  # API -- the blind import round-trip lands with an empty key and must
  # re-assert it from configuration (CA uploads carry no key at all).
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
