# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Every nested tree here (CORS, SaaS SAML/OIDC, SCIM, OAuth dynamic client
# registration, private-app destinations, infrastructure target criteria)
# is one nested provider attribute realized by a typed spec message under
# the provider's own names; fan-in mappings record every spec leaf each
# argument realizes.
#
# policies: the provider's list accepts either full inline policy
# definitions or references to existing policies with a precedence. The
# spec models the reference form -- a {policy ref, precedence} pair
# pointing at the CloudflareZeroTrustAccessPolicy kind -- which is
# Cloudflare's own recommendation for reusable policies; inline
# definitions are deliberately not modeled (composition covers them).
# Known asymmetry recorded: SSH connection rules exist ONLY on inline app
# policies in the provider (the standalone policy resource carries RDP
# rules only), so that sub-surface is unreachable by this design until
# Cloudflare serves it on the standalone resource.
#
# target_criteria: the provider's target_attributes map-of-lists is
# restructured as a repeated {name, values} message (proto3 maps cannot
# hold repeated values) -- same shape, fully representable.

resources:
  cloudflare_zero_trust_access_application:
    mappings:
