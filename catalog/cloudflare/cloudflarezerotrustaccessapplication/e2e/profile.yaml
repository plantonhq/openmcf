apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarezerotrustaccessapplication
spec:
  # An Access application under live E2E: the live scenarios are
  # ACCOUNT-scoped (the kind is dual-scope; account is the common case -- the
  # zone-scoped arm is offline-proven and recorded as not-wired in the
  # verifier, the ruleset precedent) -- deploy -> GET
  # accounts/{account_id}/access/apps/{app_id} verify -> destroy ->
  # verify-destroyed on both provisioners. Two scenarios: `bookmark-minimal`
  # (a bookmark tile -- the cheapest type, no domain ownership, no fixtures)
  # and `self-hosted` (the flagship type on a hostname of the run-scoped
  # pending-zone fixture, with a standalone policy attached by reference --
  # proving the app->policy graph edge live; both fixtures are
  # scenario-declared because an application requires neither). Deliberately
  # not live: saas/oauth, scim, and IdP-coupled surfaces -- they need a
  # configured identity provider no throwaway lane owns; they are
  # preset-proven. Entitlement: requires the account's Zero Trust
  # organization (team name) to exist -- one-time setup, Zero Trust Free.
  # Whether Access accepts a self_hosted app on a PENDING (undelegated) zone
  # is unverified offline -- the proof-queue watch-list carries it. Objects
  # create in seconds at zero cost.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 15
