apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessApplication
metadata:
  name: internal-dashboard
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: internal-dashboard
  type: self_hosted
  domain: dashboard.example.com
  sessionDuration: 24h
  autoRedirectToIdentity: true
  # Attach a standalone Access policy by reference.
  policies:
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          name: allow-staff
          fieldPath: status.outputs.policy_id
      precedence: 1
