syntax = "proto3";

package dev.planton.cloudflare.cloudflarecertificatepack.v1alpha1;

// CloudflareCertificatePackStackOutputs captures the outputs after ordering a
// certificate pack.
message CloudflareCertificatePackStackOutputs {
  // The certificate pack identifier.
  string certificate_pack_id = 1;

  // Field 2 (status) was removed: pack issuance is asynchronous (a fresh
  // order transitions initializing -> pending_validation -> active as DCV
  // completes), so a point-in-time phase can never be a stable stack
  // output -- it flips on the first refresh after the transition and
  // re-plans forever (the same class measured live on the Authenticated
  // Origin Pulls certificate, 2026-08-28). Read issuance status from the
  // Cloudflare API or dashboard instead.
  reserved 2;
  reserved "status";

  // The identifier of the primary certificate in the pack.
  string primary_certificate = 3;

  // The Cloudflare Zone ID the pack was ordered in. A pack's API identity is
  // (zone_id, certificate_pack_id), so downstream consumers -- verification
  // tooling, imports, chart blocks composing on the pack -- need the zone
  // alongside the pack's own id.
  string zone_id = 4;
}
