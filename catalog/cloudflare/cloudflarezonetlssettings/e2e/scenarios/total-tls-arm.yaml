# The Total TLS arm, SEPARATE from the base scenario so an entitlement
# failure never sinks the free-surface lane: whether Total TLS requires the
# zone's Advanced Certificate Manager subscription is UNVERIFIED offline
# (the profile's recorded watch item). Total TLS and auto origin key
# exchange are both no-op-destroy singletons on a throwaway zone.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZoneTlsSettings
metadata:
  name: e2e-tls-total-${E2E_RUN_ID}
spec:
  zone_id:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  total_tls:
    enabled: true
    certificate_authority: google
  auto_origin_tls_kex: true
