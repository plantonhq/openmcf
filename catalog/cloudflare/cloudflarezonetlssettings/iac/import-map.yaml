# Import map: where each {placeholder} in this component's import IDs comes
# from (formats live in catalog/cloudflare/aa_import/catalog.yaml). The
# singletons import as the bare zone id; hostname overrides add setting_id
# (with the provider's recorded import defect -- re-assert from config); CA
# associations add the mTLS certificate id when adopting a certificate's list.
apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: cloudflarezonetlssettings
spec:
  values:
    - name: zone_id
      derivations:
        - from_stack_output: zone_id
      where_to_find: >-
        Cloudflare dashboard -> the zone's Overview page (Zone ID in the
        right-hand API panel), or `GET /zones?name=<domain>` on the
        Cloudflare v4 API (the id field).
    - name: setting_id
      where_to_find: >-
        The per-hostname override's setting id: min_tls_version, http2, or
        ciphers -- exactly the hostname_settings row attribute being adopted.
        NOTE the provider's ImportState never restores the hostname at
        v5.23.0, so a post-import plan replaces the override; prefer
        re-asserting from configuration (idempotent for identical values).
    - name: mtls_certificate_id
      where_to_find: >-
        The mTLS certificate whose hostname-association list is being
        adopted -- the spec's ca_hostname_associations[].mtls_certificate_id
        value, listed by `GET /accounts/{account_id}/mtls_certificates`.
        Omit the segment (bare zone id) for the managed-CA list row.
