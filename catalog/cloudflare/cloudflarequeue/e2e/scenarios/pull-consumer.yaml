# Pull-consumer CloudflareQueue scenario: queue-level delivery settings plus
# an http_pull consumer -- the consumer resource's full lifecycle without
# needing a Worker (external clients would pull batches over the REST API).
# script_name is deliberately absent: it applies only to worker (push)
# consumers, which are offline-plan-proven (see e2e/worker-consumer-plan.yaml).
# The name carries the run id (queue names are unique within an account).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareQueue
metadata:
  name: planton-oss-e2e-cloudflarequeue-pull-consumer
  id: planton-oss-e2e-cloudflarequeue-pull-consumer
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: cloudflarequeue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  queueName: planton-e2e-${E2E_RUN_ID}-q-pull
  settings:
    deliveryDelay: 5
    messageRetentionPeriod: 3600
  consumer:
    type: http_pull
    settings:
      batchSize: 5
      maxRetries: 3
      visibilityTimeoutMs: 60000
