apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareQueue
metadata:
  name: ingestion-queue
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  queueName: ingestion-queue
  consumer:
    type: http_pull
    settings:
      batchSize: 50
      maxRetries: 3
      retryDelay: 30
      visibilityTimeoutMs: 60000
