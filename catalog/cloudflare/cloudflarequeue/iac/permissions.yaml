# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22; the page lists this account-scoped group in two
# naming variants -- "Queues Edit" and "Queues Write" -- both verbatim on
# the page; the Write form is used here):
#
#   Queues Write  -- account-scoped; create/update/delete the queue via
#                    POST/PUT/DELETE /accounts/{account_id}/queues[/{queue_id}]
#                    and manage its single consumer via POST/PUT/DELETE
#                    /accounts/{account_id}/queues/{queue_id}/consumers[/{consumer_id}]
#                    (derived from the modules' API surface)
#                    (provenance: derived)
#   Queues Read   -- account-scoped; refresh/import the queue and consumer via
#                    GET on the same paths
#                    (derived from the modules' API surface)
#                    (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's cloudflare_queue + cloudflare_queue_consumer resources
# and the Pulumi module's matching Queue + QueueConsumer resources; neither
# engine performs secondary lookups or data-source reads). A worker (push)
# consumer references the consuming Worker by script name resolved from that
# component's outputs -- the modules never call the Workers API. The
# component README and catalog.md carried no named permission prose to
# migrate. The live capture lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarequeue
spec: {}
