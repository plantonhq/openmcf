# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The kind composes the queue with its (at most one) consumer: the consumer
# resource's arguments match under spec.consumer, and its identity arguments
# are wired by the module, never user surface.

resources:
  cloudflare_queue:
    mappings:
      # The provider's settings is one nested object attribute (a single
      # configurable argument); the spec models its contents as a typed
      # message under the same nested names. Fan-in mappings record every
      # spec leaf the argument realizes.
      - spec: spec.settings.delivery_delay
        arg: settings
      - spec: spec.settings.delivery_paused
        arg: settings
      - spec: spec.settings.message_retention_period
        arg: settings
  cloudflare_queue_consumer:
    specRoot: spec.consumer
    mappings:
      # Same nested-object fan-in as the queue's settings: the consumer's
      # tuning knobs live in one settings argument.
      - spec: spec.consumer.settings.batch_size
        arg: settings
      - spec: spec.consumer.settings.max_concurrency
        arg: settings
      - spec: spec.consumer.settings.max_retries
        arg: settings
      - spec: spec.consumer.settings.max_wait_time_ms
        arg: settings
      - spec: spec.consumer.settings.retry_delay
        arg: settings
      - spec: spec.consumer.settings.visibility_timeout_ms
        arg: settings
    exclusions:
      - arg: account_id
        reason: shared account scope -- wired by the module from the same credential-resolved account the queue uses
      - arg: queue_id
        reason: wired by the module to the queue this kind just created -- the consumer has no independent target
