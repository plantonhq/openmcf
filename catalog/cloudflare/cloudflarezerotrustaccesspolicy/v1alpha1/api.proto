syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustaccesspolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarezerotrustaccesspolicy/v1alpha1/spec.proto";
import "catalog/cloudflare/cloudflarezerotrustaccesspolicy/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// cloudflare-zero-trust-access-policy
message CloudflareZeroTrustAccessPolicy {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareZeroTrustAccessPolicy'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareZeroTrustAccessPolicySpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareZeroTrustAccessPolicyStatus status = 5;
}

// cloudflare-zero-trust-access-policy status
message CloudflareZeroTrustAccessPolicyStatus {
  //stack-outputs
  //  cloudflare-zero-trust-access-policy stack-outputs
  CloudflareZeroTrustAccessPolicyStackOutputs outputs = 1;
}
