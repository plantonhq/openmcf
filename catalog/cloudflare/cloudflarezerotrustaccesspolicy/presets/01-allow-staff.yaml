apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessPolicy
metadata:
  name: allow-staff
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: allow-staff
  decision: allow
  sessionDuration: 24h
  # Allow anyone with a corporate email, connecting from an allowed country.
  include:
    - emailDomain:
        domain: example.com
  require:
    - geo:
        countryCode: US
