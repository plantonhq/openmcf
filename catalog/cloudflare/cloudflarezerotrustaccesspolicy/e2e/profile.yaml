apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarezerotrustaccesspolicy
spec:
  # A standalone (reusable) Access policy under live E2E: account-scoped by
  # contract (the spec has no zone_id -- zone-scoped access is expressed by
  # attaching the policy to a zone-scoped application), no prerequisites --
  # deploy -> GET accounts/{account_id}/access/policies/{policy_id} verify ->
  # destroy -> verify-destroyed on both provisioners. Two scenarios: `minimal`
  # (allow + include everyone) and `deny-require` (deny + include everyone +
  # require geo -- decision and the require list on self-contained rule
  # types). This kind is also the Access application's self-hosted fixture
  # (a scenario-declared prerequisite), so its verifier serves both. Note for
  # the proof lane: Cloudflare refuses to delete a policy still attached to
  # applications (app_count), so the application's lane must destroy before
  # the policy fixture uninstalls -- the framework's reverse-order teardown
  # already guarantees that. Entitlement: requires the account's Zero Trust
  # organization (team name) to exist -- one-time setup, Zero Trust Free.
  # Objects create in seconds at zero cost.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
