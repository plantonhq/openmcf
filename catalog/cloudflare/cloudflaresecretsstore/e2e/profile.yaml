apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflaresecretsstore
spec:
  # Secrets Store under live E2E: account-scoped create of the vault, verify
  # via the store GET-by-id, destroy (real delete). Watch items for the
  # proving session: Cloudflare allows ONE store per account -- the create
  # fails on any account that already has a store (dashboard-created, or a
  # leaked fixture from an earlier failed lane). If the test account carries
  # a permanent store, adopting it by import (rather than create/delete) is
  # the honest fallback, a proof-lane call under its design authority. Every
  # field is create-only; the idempotency re-plan must be empty.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
