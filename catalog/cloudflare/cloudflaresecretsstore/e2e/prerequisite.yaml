# CloudflareSecretsStore install profile used as a prerequisite by
# CloudflareSecretsStoreSecret (its registry prerequisite): every secret
# lives inside a store, so one must exist before the secret's lane deploys.
# The store name is run-scoped; metadata.name stays stable -- it is the key
# consumers' valueFrom references resolve against. KNOWN LANE HAZARD:
# Cloudflare allows ONE store per account, so this install fails on any
# account that already has a store (dashboard-created or a leaked earlier
# fixture) -- the proof lane's watch-list carries it.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareSecretsStore
metadata:
  name: planton-oss-e2e-cloudflaresecretsstore-prereq
  id: planton-oss-e2e-cloudflaresecretsstore-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: cloudflaresecretsstore
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  account_id: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  name: e2e-store-${E2E_RUN_ID}
