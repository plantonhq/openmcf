# One-time PIN scenario: Cloudflare's built-in email-PIN login -- the one
# provider type that needs NO config (the module sends the empty config object
# the API expects). WATCH ITEM (recorded in the profile): the OTP endpoint
# rejects API-token auth on UPDATE; if the idempotency re-plan triggers an
# update that 403s, record the defect and defer this arm with the reason.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessIdentityProvider
metadata:
  name: planton-oss-e2e-cloudflarezerotrustaccessidentityprovider-onetimepin
  id: planton-oss-e2e-cloudflarezerotrustaccessidentityprovider-onetimepin
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: cloudflarezerotrustaccessidentityprovider
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  name: planton-e2e-${E2E_RUN_ID}-otp
  type: onetimepin
