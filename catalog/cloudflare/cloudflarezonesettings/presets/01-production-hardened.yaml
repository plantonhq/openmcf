apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZoneSettings
metadata:
  name: my-production-hardened
spec:
  zone_id:
    value: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your zone id
  always_use_https: true
  ssl: strict
  min_tls_version: "1.2"
  security_level: medium
  http3: true
  security_header:
    enabled: true
    include_subdomains: true
    max_age: 31536000
    nosniff: true
    preload: false
