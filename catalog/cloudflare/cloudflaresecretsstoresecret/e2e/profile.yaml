apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflaresecretsstoresecret
spec:
  # Store secret under live E2E: the secret deploys into the run-scoped
  # store fixture (the store's install profile -- its first live use, and
  # the ONE-store-per-account limit applies to the fixture install too).
  # The scenario's value is a throwaway run-scoped literal, not a real
  # credential. Watch items for the proving session: (a) the value is
  # write-only -- the blind import round-trip lands with an empty value and
  # must re-assert it from configuration; (b) scopes are CEL-walled to
  # canonical alphabetical order at the spec, which should make the
  # provider's documented ordered-list drift unreachable -- confirm the
  # re-plan is clean.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
