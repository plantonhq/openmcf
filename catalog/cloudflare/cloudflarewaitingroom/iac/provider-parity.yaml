# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# cookie_attributes and additional_routes are nested provider attributes;
# the spec models each as a typed message. bypass_rules is a spec list
# that fans into the folded cloudflare_waiting_room_rules resource's
# `rules` argument (the module supplies action = bypass_waiting_room).

resources:
  cloudflare_waiting_room:
    mappings:
      - spec: spec.cookie_attributes.samesite
        arg: cookie_attributes
      - spec: spec.cookie_attributes.secure
        arg: cookie_attributes
      - spec: spec.additional_routes.host
        arg: additional_routes
      - spec: spec.additional_routes.path
        arg: additional_routes
  cloudflare_waiting_room_rules:
    mappings:
      - spec: spec.bypass_rules.expression
        arg: rules
      - spec: spec.bypass_rules.description
        arg: rules
      - spec: spec.bypass_rules.enabled
        arg: rules
    exclusions:
      - arg: waiting_room_id
        reason: wired by the module to the room it creates

