apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareCacheSettings
metadata:
  name: my-image-cache-settings
spec:
  zone_id:
    value: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your zone id
  smart_tiered_cache: true
  cache_variants:
    jpg:
      - image/webp
      - image/avif
    jpeg:
      - image/webp
      - image/avif
    png:
      - image/webp
      - image/avif
