syntax = "proto3";

package dev.planton.cloudflare.cloudflarecachesettings.v1alpha1;

import "catalog/cloudflare/cloudflarecachesettings/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareCacheSettingsStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareCacheSettingsStackInput {
  // target cloud-resource to be deployed
  CloudflareCacheSettings target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
