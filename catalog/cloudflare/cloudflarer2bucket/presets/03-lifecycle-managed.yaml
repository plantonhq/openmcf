apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareR2Bucket
metadata:
  name: my-managed-data-bucket
spec:
  bucketName: replace-with-your-bucket-name
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  location: auto
  storageClass: Standard
  publicAccess: false
  lifecycle:
    rules:
      - id: tier-then-expire
        enabled: true
        conditions:
          prefix: ""
        abortMultipartUploadsTransition:
          maxAgeSeconds: 604800
        storageClassTransitions:
          - condition:
              type: Age
              maxAgeSeconds: 2592000
        deleteObjectsTransition:
          condition:
            type: Age
            maxAgeSeconds: 31536000
  lock:
    rules:
      - id: compliance-retention
        enabled: true
        prefix: audit/
        condition:
          type: Age
          maxAgeSeconds: 220752000
