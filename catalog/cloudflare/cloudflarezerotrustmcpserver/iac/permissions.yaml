# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. The MCP Portals groups are not yet listed on the general API
# token permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22); their names are verbatim from the "Accepted
# Permissions" section of the MCP Servers API endpoint reference
# (https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/ai_controls/subresources/mcp/subresources/servers/methods/list/,
# retrieved 2026-08-22), which gates the server endpoints with the same
# groups as portals:
#
#   MCP Portals Write   -- account-scoped; create/update/delete the MCP
#                          server registration via
#                          POST/PUT/DELETE /accounts/{account_id}/access/ai-controls/mcp/servers[/{server_id}]
#                          (named by the endpoint reference's Accepted
#                          Permissions) (provenance: derived)
#   MCP Portals Read    -- account-scoped; refresh/import the registration
#                          via
#                          GET /accounts/{account_id}/access/ai-controls/mcp/servers/{server_id}
#                          (named by the endpoint reference's Accepted
#                          Permissions; the write-only credentials are never
#                          returned by reads) (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_zero_trust_access_ai_controls_mcp_server
# resource and the Pulumi module's matching ZeroTrustAccessAiControlsMcpServer
# resource; neither engine performs secondary lookups). The live capture
# lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarezerotrustmcpserver
spec: {}
