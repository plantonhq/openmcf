apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustGatewaySettings
metadata:
  name: acme-gateway
spec:
  account_id: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d"
  settings:
    activity_log:
      enabled: true
    block_page:
      enabled: true
      name: Blocked by Acme IT
      header_text: This site is blocked by policy
      footer_text: Questions? Contact IT.
      background_color: "#0f172a"
      mailto_address: it@example.com
      mailto_subject: Blocked site report
  logging:
    redact_pii: true
    settings_by_rule_type:
      dns:
        log_all: false
        log_blocks: true
      http:
        log_all: false
        log_blocks: true
      l4:
        log_all: false
        log_blocks: false
