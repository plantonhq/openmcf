# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22):
#
#   Zero Trust Write   -- account-scoped; update the Gateway account
#                         configuration singleton via
#                         PUT /accounts/{account_id}/gateway/configuration,
#                         the logging singleton via
#                         PUT /accounts/{account_id}/gateway/logging, and
#                         create/update/delete custom PAC files via the
#                         Gateway PAC-file endpoints under
#                         /accounts/{account_id}/gateway. The reference
#                         publishes no narrower group for Gateway
#                         configuration (derived from the module's API
#                         surface) (provenance: derived)
#   Zero Trust Read    -- account-scoped; refresh/import the configuration,
#                         logging settings, and PAC files via GET on the
#                         same paths (derived from the module's API surface)
#                         (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's conditional cloudflare_zero_trust_gateway_settings and
# cloudflare_zero_trust_gateway_logging singletons plus per-row
# cloudflare_zero_trust_gateway_pacfile resources, and the Pulumi module's
# matching ZeroTrustGatewaySettings, ZeroTrustGatewayLogging, and
# ZeroTrustGatewayPacfile resources; neither engine performs secondary
# lookups). The live capture lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarezerotrustgatewaysettings
spec: {}
