syntax = "proto3";

package dev.planton.cloudflare.cloudflareauthenticatedoriginpullscertificate.v1alpha1;

// CloudflareAuthenticatedOriginPullsCertificateStackOutputs captures the
// observable outputs after uploading an Authenticated Origin Pulls client
// certificate.
message CloudflareAuthenticatedOriginPullsCertificateStackOutputs {
  // The ID of the uploaded certificate -- what per-hostname associations
  // reference.
  string certificate_id = 1;

  // The zone the certificate belongs to.
  string zone_id = 2;

  // When the certificate expires (RFC3339).
  string expires_on = 3;

  // The certificate's deployment status (for example active or
  // pending_deployment). Deployment and deletion are asynchronous.
  string status = 4;
}
