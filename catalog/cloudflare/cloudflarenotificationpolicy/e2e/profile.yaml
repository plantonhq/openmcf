apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarenotificationpolicy
spec:
  # Notification policies under live E2E: plain CRUD objects (real create,
  # update, delete), account-scoped, free -- self-cleaning lanes. Both live
  # arms deliver to EMAIL only, deliberately: the webhook-mechanism shape is
  # plan-proven offline because webhook destinations sit in the API-token
  # auth-defect class (see the webhook kind's profile) and a live policy
  # lane must not stack a second kind's 403 risk on top of its own. Watch
  # item: many alert types are plan- or product-gated at create time -- the
  # chosen live types (tunnel_health_event, incident_alert) are free-tier
  # facts to verify.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes pass.
  status: pending_proof
  timeout_minutes: 10
