# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. The general API token permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22) lists NO Snippets group; the name below is verbatim
# from the "Configure Snippets via API" page
# (https://developers.cloudflare.com/rules/snippets/create-api/, retrieved
# 2026-08-22), which states the token needs "Zone > Snippets > Edit" (API
# token permission name "Snippets Write") and that such a token is valid for
# all the Snippets endpoints it lists, including the GETs:
#
#   Snippets Write  -- zone-scoped; create/update the snippet via PUT
#                      /zones/{zone_id}/snippets/{snippet_name}, refresh/import
#                      it via GET /zones/{zone_id}/snippets/{snippet_name} and
#                      GET .../content, and delete it via DELETE on the same
#                      path (the docs name no separate read-level group for
#                      these endpoints)
#                      (derived from the module's API surface)
#                      (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_snippet resource and the Pulumi
# module's matching Snippet resource; neither engine performs secondary
# lookups or data-source reads -- the provider does refetch stored snippet
# content on refresh, which the same group covers). The live capture lane
# upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflaresnippet
spec: {}
