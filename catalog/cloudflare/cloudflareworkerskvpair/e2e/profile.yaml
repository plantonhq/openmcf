apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflareworkerskvpair
spec:
  # A KV entry under live E2E: account-scoped, one registry prerequisite
  # (CloudflareKvNamespace -- the run-scoped namespace fixture) -- deploy ->
  # GET accounts/{account_id}/storage/kv/namespaces/{namespace_id}/values/{key_name}
  # verify -> destroy -> verify-destroyed on both provisioners. The minimal
  # scenario resolves namespace_id from the fixture's outputs and writes one
  # entry with a metadata JSON document, proving the reference wiring and the
  # metadata path in one lifecycle. The key needs no run-scoping (it is
  # namespace-scoped, and the namespace title carries the run id) and stays
  # slash-free: the provider path-escapes keys on API calls, so a key with
  # "/" would break the slash-delimited terraform import ID. Objects create
  # in seconds at zero cost (Workers Free includes KV).
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
