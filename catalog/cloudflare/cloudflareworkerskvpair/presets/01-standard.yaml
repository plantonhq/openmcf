apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareWorkersKvPair
metadata:
  name: app-config-entry
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  namespaceId:
    valueFrom:
      kind: CloudflareKvNamespace
      name: <kv-namespace-name>
      fieldPath: status.outputs.namespace_id
  keyName: <key-name>
  value: <value>
  metadata: '{}'
