# CloudflareEmailRoutingZone install profile used as a prerequisite by
# CloudflareEmailRoutingRule (its registry prerequisite): routing rules live
# in a zone's Email Routing configuration, which must be ENABLED before the
# API accepts rules. The fixture is minimal -- enable only, no catch-all, no
# DNS locking -- and rides the run-scoped pending fixture zone (its own
# registry prerequisite), so nothing here needs run-scoping of its own.
# metadata.name stays stable -- it is the key consumers' valueFrom references
# resolve against.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareEmailRoutingZone
metadata:
  name: planton-oss-e2e-cloudflareemailroutingzone-prereq
  id: planton-oss-e2e-cloudflareemailroutingzone-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: cloudflareemailroutingzone
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
