syntax = "proto3";

package dev.planton.cloudflare.cloudflareemailroutingzone.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// The action a catch-all rule takes on mail that no other rule matched.
enum CloudflareEmailRoutingCatchAllActionType {
  catch_all_action_type_unspecified = 0; // Must not be used.
  drop = 1; // Silently discard unmatched mail (the default).
  forward = 2; // Forward to one or more verified destination addresses.
  worker = 3; // Hand the message to an Email Worker.
}

// CloudflareEmailRoutingCatchAllAction is one action the catch-all rule takes
// on unmatched mail. The catch-all carries a LIST of actions (matching the
// Cloudflare API), so it can, for example, forward to addresses AND invoke an
// Email Worker. The provider models each action as a generic {type, value[]};
// this typed shape exposes real foreign keys and the module maps it back.
message CloudflareEmailRoutingCatchAllAction {
  // The action type.
  CloudflareEmailRoutingCatchAllActionType type = 1 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).cel = {
      id: "catch_all_action.type_not_unspecified"
      message: "catch-all action type must be one of drop, forward, worker"
      expression: "this != 0"
    }
  ];

  // Destination addresses to forward to (required when type is forward). Each is
  // a verified destination email, or a reference to a CloudflareEmailRoutingAddress.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef forward_to = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareEmailRoutingAddress,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // The Email Worker script to invoke (required when type is worker). A script
  // name or a reference to a CloudflareWorker.
  dev.planton.shared.foreignkey.v1.StringValueOrRef worker = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareWorker,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.script_name"
  ];

  // forward requires forward_to; worker requires worker.
  option (buf.validate.message).cel = {
    id: "catch_all_action.forward_requires_forward_to"
    message: "forward_to is required when catch-all action type is forward"
    expression: "this.type != 2 || size(this.forward_to) > 0"
  };
  option (buf.validate.message).cel = {
    id: "catch_all_action.worker_requires_worker"
    message: "worker is required when catch-all action type is worker"
    expression: "this.type != 3 || has(this.worker)"
  };
}

// CloudflareEmailRoutingZoneCatchAll configures the single catch-all rule that
// applies to mail addressed to the zone that no other routing rule matched.
// (The rule's matcher is always the fixed "all" matcher — Cloudflare permits no
// other matcher type on the catch-all, so the module supplies it.)
message CloudflareEmailRoutingZoneCatchAll {
  // Whether the catch-all rule is active.
  bool enabled = 1;

  // The actions taken on unmatched mail, applied in order (at least one).
  repeated CloudflareEmailRoutingCatchAllAction actions = 2 [(buf.validate.field).repeated.min_items = 1];

  // An optional descriptive name for the catch-all rule.
  string name = 3;
}

// CloudflareEmailRoutingZoneSpec enables Email Routing on a zone — the anchor for
// the Email Routing family. Enabling provisions the zone's required MX/SPF/DKIM
// DNS records automatically. The single per-zone catch-all rule is folded in
// (spec.catch_all) since it is 1:1 with the zone; individual routing rules and
// destination addresses are separate kinds (CloudflareEmailRoutingRule,
// CloudflareEmailRoutingAddress).
message CloudflareEmailRoutingZoneSpec {
  // The zone to enable Email Routing on. A literal zone ID or a reference to a
  // CloudflareDnsZone resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef zone_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareDnsZone,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.zone_id"
  ];

  // Optional catch-all rule for mail no other rule matched. Omit to leave the
  // zone's catch-all at Cloudflare's default (drop, disabled).
  CloudflareEmailRoutingZoneCatchAll catch_all = 2;

  // Lock the Email Routing DNS records so they cannot be modified out-of-band.
  // The records are created automatically on enable regardless; locking manages
  // them explicitly. Defaults to false.
  bool lock_dns_records = 3;

  // The domain to create the managed Email Routing DNS records for. Leave empty
  // for the zone apex (the common case). Set a subdomain of the zone (e.g.
  // "mail.example.com" on zone "example.com") to route email addressed to that
  // subdomain. Applies only when lock_dns_records is true (that is what
  // instantiates the managed DNS records).
  string dns_name = 4;

  // dns_name only has effect through the managed DNS records.
  option (buf.validate.message).cel = {
    id: "spec.dns_name_requires_lock"
    message: "dns_name requires lock_dns_records to be true"
    expression: "this.dns_name == '' || this.lock_dns_records"
  };
}
