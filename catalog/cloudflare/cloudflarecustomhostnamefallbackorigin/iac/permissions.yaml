# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22):
#
#   SSL and Certificates Write  -- zone-scoped; create/update/delete the
#                                  zone's fallback origin via PUT/DELETE
#                                  /zones/{zone_id}/custom_hostnames/fallback_origin
#                                  (the Cloudflare-for-SaaS custom-hostname
#                                  surface lives in the SSL and Certificates
#                                  product family; the mapping from that API
#                                  path to this group is derived from the
#                                  module's API surface)
#                                  (provenance: derived)
#   SSL and Certificates Read   -- zone-scoped; refresh/import the fallback
#                                  origin via GET
#                                  /zones/{zone_id}/custom_hostnames/fallback_origin
#                                  (provenance: derived)
#
# The component's catalog.md states the same requirement in prose ("a
# Cloudflare API token that has SSL and Certificates edit access") --
# migrated here losslessly; "edit access" is the dashboard-name spelling of
# the same write grant on the permissions reference.
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_custom_hostname_fallback_origin
# resource and the Pulumi module's matching CustomHostnameFallbackOrigin
# resource; neither engine performs secondary lookups). The live capture
# lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarecustomhostnamefallbackorigin
spec: {}
