syntax = "proto3";

package dev.planton.cloudflare.cloudflarecustomhostnamefallbackorigin.v1alpha1;

// CloudflareCustomHostnameFallbackOriginStackOutputs captures the outputs after
// setting a zone's fallback origin.
message CloudflareCustomHostnameFallbackOriginStackOutputs {
  // Field 1 (status) was removed: fallback-origin deployment is
  // asynchronous (a fresh origin transitions pending_deployment -> active
  // seconds later), so a point-in-time phase can never be a stable stack
  // output -- it flips on the first refresh after the transition and
  // re-plans forever (the same class measured live on the Authenticated
  // Origin Pulls certificate, 2026-08-28). Read deployment status from the
  // Cloudflare API or dashboard instead.
  reserved 1;
  reserved "status";

  // RFC3339 timestamp of when the fallback origin was created.
  string created_at = 2;

  // RFC3339 timestamp of when the fallback origin was last updated.
  string updated_at = 3;

  // Any errors reported while deploying the fallback origin.
  repeated string errors = 4;

  // The Cloudflare Zone ID this singleton belongs to. The fallback origin has
  // no resource id of its own -- its API identity IS the zone
  // (GET zones/{zone_id}/custom_hostnames/fallback_origin) -- so this is the
  // handle verification, import, and chart blocks consume.
  string zone_id = 5;
}
