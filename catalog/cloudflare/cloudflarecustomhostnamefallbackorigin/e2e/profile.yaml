apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarecustomhostnamefallbackorigin
spec:
  # A custom-hostname fallback origin under live E2E: a zone singleton (one
  # per SaaS zone). The harness installs the CloudflareDnsZone prerequisite
  # first, then deploy -> GET zones/{zone_id}/custom_hostnames/fallback_origin
  # verify -> destroy -> verify-destroyed. The origin hostname composes the
  # fixture zone's run token. MEASURED WALL (live, 2026-08-28): the account
  # is NOT enrolled in Cloudflare for SaaS -- the fallback-origin PUT
  # answers 400 code 1456 "This feature is available with SSL for SaaS"
  # before either watch-list risk can fire. Unblock: enroll Cloudflare for
  # SaaS on the test zone (same gate and ask as CloudflareCustomHostname,
  # sent 2026-08-28); both lanes then run unchanged. Standing watches for
  # that run: the provider's own test unsets CLOUDFLARE_API_TOKEN because
  # the PUT "does not yet support API tokens" (Create=Update, so the
  # idempotency re-apply may 403), and the API may reject an origin with no
  # DNS record (if measured, author a cloudflarednsrecord install profile
  # -- that kind is PROVEN and released, so its fixture is legal now). The
  # verifier treats GET 200 with status pending_deletion as gone (async
  # delete).
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
