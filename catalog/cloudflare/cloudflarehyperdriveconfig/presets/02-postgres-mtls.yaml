apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareHyperdriveConfig
metadata:
  name: app-prod-pg-mtls
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: app-prod-pg-mtls
  origin:
    database: <database-name>
    scheme: postgres
    user: <database-user>
    host: <database-host>
    port: 5432
    password:
      value: <database-password>
  mtls:
    caCertificateId: <ca-certificate-id>
    mtlsCertificateId: <client-certificate-id>
    sslmode: verify-full
  caching:
    disabled: false
  originConnectionLimit: 25
