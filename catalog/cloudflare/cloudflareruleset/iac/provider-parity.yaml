# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The v5 Stainless provider nests the ENTIRE rule tree (actions, all
# action_parameters families, ratelimit, logging, overrides) inside the one
# nested `rules` attribute -- a single configurable argument at the checker's
# flat grain. The spec mirrors that tree block-for-block as typed messages
# (restructuring three provider MapAttributes into typed map-value messages:
# headers, cache_key header contains, vary headers). Fan-in mappings record
# every spec leaf the one argument realizes.

resources:
  cloudflare_ruleset:
    mappings:
      # kind is a proto-reserved word hazard and reads ambiguously beside the
      # resource kind; the spec names it ruleset_kind.
      - spec: spec.ruleset_kind
        arg: kind
      - spec: spec.rules.action
        arg: rules
      - spec: spec.rules.action_parameters.additional_cacheable_ports
