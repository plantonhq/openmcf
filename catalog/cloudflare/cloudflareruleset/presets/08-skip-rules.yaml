apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareRuleset
metadata:
  name: skip-noisy-managed-rules
spec:
  zone_id:
    value: "<cloudflare-zone-id>"
  ruleset_kind: zone
  phase: http_request_firewall_custom
  name: "Skip noisy managed rules for trusted paths"
  rules:
    - ref: "skip-for-webhooks"
      expression: 'starts_with(http.request.uri.path, "/webhooks")'
      action: skip
      description: "Skip two specific managed rules that false-positive on webhook payloads"
      enabled: true
      action_parameters:
        rules:
          # Key: the ruleset containing the rules to skip (32-char hex; this is
          # Cloudflare's managed WAF ruleset id -- replace with your target).
          "efb7b8c949ac4650a09736fc376e9aee":
            values:
              # Replace with the rule ids to skip inside that ruleset (32-char hex,
              # from the ruleset's own rules list). Remove the second if not needed.
              - "5de7edfa648c4d6891dc3e7f84534ffa"
              - "75a0060762034a6cb663fd51a02344cb"
