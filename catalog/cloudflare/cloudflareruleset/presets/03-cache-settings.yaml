apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareRuleset
metadata:
  name: my-cache-rules
spec:
  zone_id:
    value: "<cloudflare-zone-id>"
  ruleset_kind: zone
  phase: http_request_cache_settings
  name: "Custom cache settings"
  rules:
    - ref: "cache-static-assets"
      expression: >-
        starts_with(http.request.uri.path, "/assets") or
        starts_with(http.request.uri.path, "/_next/static") or
        starts_with(http.request.uri.path, "/_site")
      action: set_cache_settings
      description: "Aggressively cache static assets at edge for 24 hours"
      enabled: true
      action_parameters:
        cache: true
        edge_ttl:
          mode: "override_origin"
          default_ttl: 86400
        browser_ttl:
          mode: "override_origin"
          default_ttl: 3600
    - ref: "bypass-api-cache"
      expression: 'starts_with(http.request.uri.path, "/api")'
      action: set_cache_settings
      description: "Never cache API responses"
      enabled: true
      action_parameters:
        cache: false
