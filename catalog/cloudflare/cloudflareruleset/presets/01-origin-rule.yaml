apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareRuleset
metadata:
  name: my-origin-routing
spec:
  zone_id:
    value: "<cloudflare-zone-id>"
  ruleset_kind: zone
  phase: http_request_origin
  name: "Route non-marketing traffic to application origin"
  rules:
    - ref: "route-app-to-backend"
      expression: >-
        not (
          http.request.uri.path eq "/" or
          starts_with(http.request.uri.path, "/docs") or
          starts_with(http.request.uri.path, "/features") or
          starts_with(http.request.uri.path, "/pricing") or
          starts_with(http.request.uri.path, "/_site")
        )
      action: route
      description: "Route application paths to backend origin"
      enabled: true
      action_parameters:
        host_header: "<your-domain>"
        origin:
          host: "<backend-hostname>"
          port: 443
