# The zone-scoped arm: a managed challenge on one country, on the run-scoped
# fixture zone. The zone is a SCENARIO-declared prerequisite (the annotation
# below) because the kind has no registry prerequisite -- account scope is the
# canonical case and a zone is not structurally required.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareIpAccessRule
metadata:
  name: e2e-ipar-zone-${E2E_RUN_ID}
  annotations:
    planton.dev/e2e-prerequisites: "CloudflareDnsZone"
    # The catalog records the ACCOUNT import form (one id_format per resource
    # type) and its account_id placeholder derives from the spec field, which
    # this zone-scoped manifest leaves empty -- the blind derivation is
    # structurally impossible for this arm. The account arm proves the import
    # recipe on the same upstream importer (one dual-format ImportState parses
    # both prefixes at v5.23.0); the zone form is documented on the catalog
    # row for human adopters.
    planton.dev/e2e-import-roundtrip-skip: >-
      dual-scope resource: the recorded account-form import ID cannot derive
      from a zone-scoped manifest (account_id is empty); the account arm
      carries the round-trip proof on the same importer
spec:
  zone_id:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  mode: managed_challenge
  configuration:
    target: country
    value: "T1"
  notes: "planton-e2e zone-scoped Tor challenge"
