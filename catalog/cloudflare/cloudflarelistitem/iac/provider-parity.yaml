# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The provider's hostname and redirect are single nested object attributes
# (one configurable argument each); the spec models their contents as typed
# messages inside a oneof. Fan-in mappings record every spec leaf each
# argument realizes.

resources:
  cloudflare_list_item:
    mappings:
      - spec: spec.hostname.url_hostname
        arg: hostname
      - spec: spec.hostname.exclude_exact_hostname
        arg: hostname
      - spec: spec.redirect.source_url
        arg: redirect
      - spec: spec.redirect.target_url
        arg: redirect
      - spec: spec.redirect.include_subdomains
        arg: redirect
      - spec: spec.redirect.preserve_path_suffix
        arg: redirect
      - spec: spec.redirect.preserve_query_string
        arg: redirect
      - spec: spec.redirect.status_code
        arg: redirect
      - spec: spec.redirect.subpath_matching
        arg: redirect
