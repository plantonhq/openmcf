apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareListItem
metadata:
  name: redirect-entry
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  listId:
    valueFrom:
      kind: CloudflareList
      name: <redirect-list-name>
      fieldPath: status.outputs.list_id
  redirect:
    sourceUrl: <source-url>
    targetUrl: <target-url>
    statusCode: 301
    preserveQueryString: true
