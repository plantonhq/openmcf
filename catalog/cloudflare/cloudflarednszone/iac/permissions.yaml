# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22); per-endpoint mappings are confirmed by the
# "Accepted Permissions" sections of the endpoint references (retrieved
# 2026-08-22):
#
#   Zone Write     -- zone-scoped; create/delete the zone via POST/DELETE
#                     /zones[/{id}] (the create endpoint's Accepted
#                     Permissions lists the dashboard-flavored "Zone Zone
#                     Edit" and "Zone DNS Edit" --
#                     https://developers.cloudflare.com/api/resources/zones/methods/create/)
#                     and manage the zone hold via POST/DELETE
#                     /zones/{zone_id}/hold (that endpoint's Accepted
#                     Permissions names "Zone Write" verbatim --
#                     https://developers.cloudflare.com/api/resources/zones/subresources/holds/methods/create/)
#                     (provenance: derived)
#   Zone Read      -- zone-scoped; refresh/import the zone and hold via GET
#                     on the same paths (derived from the modules' API
#                     surface) (provenance: derived)
#   DNS Write      -- zone-scoped; create/update/delete the zone's DNS
#                     records via POST/PATCH/DELETE
#                     /zones/{zone_id}/dns_records[/{id}]
#                     (https://developers.cloudflare.com/api/resources/dns/subresources/records/methods/create/
#                     names "DNS Write"), enable DNSSEC via PATCH
#                     /zones/{zone_id}/dnssec
#                     (https://developers.cloudflare.com/api/resources/dns/subresources/dnssec/methods/edit/
#                     names "DNS Write"), and write zone-wide DNS settings
#                     via PATCH /zones/{zone_id}/dns_settings
#                     (https://developers.cloudflare.com/api/resources/dns/subresources/settings/subresources/zone/methods/edit/
#                     accepts "DNS Write" alongside "Zone DNS Settings
#                     Write", a group the general reference does not list)
#                     (provenance: derived)
#   DNS Read       -- zone-scoped; refresh/import records, DNSSEC, and DNS
#                     settings via GET on the same paths (derived from the
#                     modules' API surface) (provenance: derived)
#   Billing Write  -- account-scoped; CONDITIONAL -- needed only when the
#                     spec sets a subscription: the zone plan is created via
#                     PUT /zones/{zone_id}/subscription, whose endpoint
#                     reference's Accepted Permissions names "Billing Write"
#                     verbatim
#                     (https://developers.cloudflare.com/api/resources/zones/subresources/subscriptions/methods/create/),
#                     matching the spec's own contract comment; the group
#                     exists verbatim in the reference's account-permissions
#                     table (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's cloudflare_zone resource plus conditional
# cloudflare_zone_subscription, cloudflare_zone_dnssec, cloudflare_zone_hold,
# and cloudflare_zone_dns_settings singletons and per-record
# cloudflare_dns_record resources, and the Pulumi module's matching Zone,
# ZoneSubscription, ZoneDnssec, ZoneHold, ZoneDnsSettings, and DnsRecord
# resources; neither engine performs secondary lookups). The live capture
# lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarednszone
spec: {}
