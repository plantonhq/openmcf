apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarednszone
spec:
  # The DNS zone under live E2E: the root Cloudflare kind, no prerequisites.
  # Each scenario creates its own run-scoped pending zone (a domain nobody
  # registers -- Cloudflare rejects duplicate zone names account-wide, so the
  # name carries the run id), runs deploy -> GET zones/{zone_id} verify ->
  # destroy -> verify-destroyed on both provisioners. The minimal scenario
  # proves the bare zone; the records-portfolio scenario proves the folded
  # satellites in one lane: inline records through both value paths (simple
  # content and typed structured data), record tags and settings, zone-wide
  # DNS settings, and DNSSEC.
  #
  # Scenario zoneName fields carry ${E2E_RUN_ID}, which the strict FQDN CEL
  # rejects RAW -- the fixture-integrity test (token substitution first) is
  # their validation gate, the same class as this kind's prerequisite file.
  #
  # Watch: whether zone_dnssec activates on a PENDING (undelegated) zone is
  # unverified offline -- the API is expected to accept it (signing state is
  # zone-internal), but if the live lane finds otherwise the fallback is
  # dropping dnssec from the portfolio scenario into an env-gated ACTIVE-zone
  # arm. Deliberately not in the live scenarios: hold (semantics of a hold on
  # a throwaway zone at destroy time are unverified) and subscription (needs
  # Billing Write token scope; a paid rate_plan bills real money) -- both are
  # proven offline by the kind's e2e/manifest.yaml plan; vanity_name_servers,
  # foundation_dns, and multi_provider are plan-gated (Business+/paid add-on).
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 15
