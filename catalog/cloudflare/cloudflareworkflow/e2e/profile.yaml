apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflareworkflow
spec:
  # Workflow under live E2E: account-scoped registration of a workflow class
  # exported by a deployed Worker script (the Worker fixture installs via the
  # consumer-scoped profile in this kind's e2e/prerequisites/ -- its first
  # live use). Watch items for the proving session: (a) the post-destroy
  # probe reads the is_deleted flag (the Workflows soft-delete variant) --
  # its live behavior is unconfirmed; (b) create IS a PUT (name-as-upsert),
  # so a leaked earlier workflow of the same name is silently adopted, never
  # a conflict; (c) whether registration validates the class exists in the
  # script is unknown -- the fixture exports a real WorkflowEntrypoint
  # subclass so the lane answers it either way; (d) production instance
  # runs need Workers Paid -- registration itself is expected free,
  # verify at proof.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
