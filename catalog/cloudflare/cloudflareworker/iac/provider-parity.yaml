      - spec: spec.tail_consumers.environment
        arg: tail_consumers
      - spec: spec.tail_consumers.namespace
        arg: tail_consumers
    exclusions:
      - arg: content_file
        reason: composed via content (inline) or r2_bundle (fetched into content) — a second source path would fork the oneof
      - arg: content_sha256
        reason: companion of content_file; the module hashes inline/R2 content itself when the provider needs a change trigger
  cloudflare_workers_script_subdomain:
    specRoot: spec.workers_dev
    mappings:
      - spec: spec.workers_dev.enabled
        arg: enabled
      - spec: spec.workers_dev.previews_enabled
        arg: previews_enabled
    exclusions:
      - arg: account_id
        reason: shared account scope -- wired by the module from the same credential-resolved account the script uses
      - arg: script_name
        reason: wired by the module to the script this kind just created
  cloudflare_workers_custom_domain:
    specRoot: spec.custom_domains
    mappings:
      - spec: spec.custom_domains.hostname
        arg: hostname
      - spec: spec.custom_domains.zone_id
        arg: zone_id
    exclusions:
      - arg: account_id
        reason: shared account scope -- wired by the module from the same credential-resolved account the script uses
      - arg: service
        reason: wired by the module to the script this kind just created
      - arg: zone_name
        reason: alternative addressing of the zone the spec already identifies by zone_id (or that Cloudflare infers from the hostname)
  cloudflare_workers_route:
    specRoot: spec.routes
    mappings:
      - spec: spec.routes.zone_id
        arg: zone_id
      - spec: spec.routes.pattern
        arg: pattern
    exclusions:
      - arg: script
        reason: wired by the module to the script this kind just created
  cloudflare_workers_cron_trigger:
    mappings:
      - spec: spec.schedules
        arg: schedules
    exclusions:
      - arg: account_id
        reason: shared account scope -- wired by the module from the same credential-resolved account the script uses
      - arg: script_name
        reason: wired by the module to the script this kind just created
