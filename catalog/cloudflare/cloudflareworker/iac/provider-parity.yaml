# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Bindings, migrations, observability, assets, placement, limits,
# cache_options, exports, package_dependencies, annotations, and
# tail_consumers are each ONE nested provider argument. The spec models
# those trees as typed messages (and bindings as wrangler.toml-grain
# lists). Fan-in mappings record every spec leaf each argument realizes.

resources:
  cloudflare_workers_script:
    mappings:
      - spec: spec.worker_name
        arg: script_name
      - spec: spec.content
        arg: content
      - spec: spec.r2_bundle.bucket
        arg: content
      - spec: spec.r2_bundle.path
        arg: content
      - spec: spec.vars
        arg: bindings
      - spec: spec.secrets.name
