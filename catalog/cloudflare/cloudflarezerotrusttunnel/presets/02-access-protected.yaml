apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustTunnel
metadata:
  name: secure-tunnel
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: secure-tunnel
  configSrc: cloudflare
  ingress:
    - hostname: admin.example.com
      service: http://localhost:3000
      originRequest:
        access:
          teamName: <zero-trust-org>
          required: true
          audTag:
            - valueFrom:
                kind: CloudflareZeroTrustAccessApplication
                name: <access-app-name>
                fieldPath: status.outputs.aud
    - service: http_status:404
