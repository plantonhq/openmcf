apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarezerotrusttunnel
spec:
  # A cloudflared tunnel under live E2E: account-scoped, no prerequisites --
  # deploy -> GET accounts/{account_id}/cfd_tunnel/{tunnel_id} verify ->
  # destroy -> verify-destroyed on both provisioners. Two scenarios: `minimal`
  # (bare remotely-managed tunnel -- the config-absent module branch) and
  # `remote-ingress` (ingress rules with the mandatory catch-all plus origin
  # settings -- the separate config resource's lifecycle). Tunnel names carry
  # the run id; no scenario sets tunnel_secret (Cloudflare generates one, and
  # a secret never belongs in a manifest). Cloudflare SOFT-DELETES tunnels:
  # the GET answers 200 with a non-null deleted_at after destroy, so this
  # kind's verifier uses the deleted_at-aware probe, not the plain existence
  # check. The config resource's provider Delete is a no-op -- the config
  # rides the tunnel, and the tunnel's own destroy retires it (zero-orphan
  # reasoning recorded in the proof-queue entry). Objects create in seconds
  # at zero cost (part of Zero Trust Free).
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 15
