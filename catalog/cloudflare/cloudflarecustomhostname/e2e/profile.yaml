apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarecustomhostname
spec:
  # A custom hostname under live E2E: the harness installs the
  # CloudflareDnsZone prerequisite first, then deploy -> GET
  # zones/{zone_id}/custom_hostnames/{id} verify -> destroy ->
  # verify-destroyed on both provisioners. Two scenarios: `minimal`
  # (hostname only -- Cloudflare provisions the DV cert with defaults) and
  # `ssl-txt` (explicit TXT DCV). The hostname composes the fixture zone's
  # run token by construction (Access self-hosted precedent). Ownership
  # verification will sit pending on an undelegated zone -- that is the
  # lifecycle we can prove. The verifier treats GET 200 with status
  # pending_deletion/deleted as gone. Deliberately not live: BYO certificate
  # (Enterprise + secrets). Cloudflare for SaaS is free-tier; whether a
  # PENDING zone accepts the create is unverified offline.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
