# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The provider's ssl is one nested object attribute (a single configurable
# argument); the spec models its contents as a typed message under the same
# nested names. Fan-in mappings record every spec leaf the argument realizes.

resources:
  cloudflare_custom_hostname:
    mappings:
      - spec: spec.ssl.bundle_method
        arg: ssl
      - spec: spec.ssl.certificate_authority
        arg: ssl
      - spec: spec.ssl.cloudflare_branding
        arg: ssl
      - spec: spec.ssl.custom_cert_bundle.custom_certificate
        arg: ssl
      - spec: spec.ssl.custom_cert_bundle.custom_key
        arg: ssl
      - spec: spec.ssl.custom_certificate
        arg: ssl
      - spec: spec.ssl.custom_csr_id
        arg: ssl
      - spec: spec.ssl.custom_key
        arg: ssl
      - spec: spec.ssl.method
        arg: ssl
      - spec: spec.ssl.settings.ciphers
        arg: ssl
      - spec: spec.ssl.settings.early_hints
        arg: ssl
      - spec: spec.ssl.settings.http2
        arg: ssl
      - spec: spec.ssl.settings.min_tls_version
        arg: ssl
      - spec: spec.ssl.settings.tls_1_3
        arg: ssl
      - spec: spec.ssl.type
        arg: ssl
      - spec: spec.ssl.wildcard
        arg: ssl
