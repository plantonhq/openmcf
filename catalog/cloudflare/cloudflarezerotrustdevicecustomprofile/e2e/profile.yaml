apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflarezerotrustdevicecustomprofile
spec:
  # Custom device profiles under live E2E: plain CRUD objects (real create,
  # update, delete -- deleting a profile returns its devices to the default
  # profile), so lanes are self-cleaning. Watch items for the proving
  # session: (1) precedence is account-unique in practice -- both scenarios
  # derive run-scoped precedence values so concurrent lanes cannot collide;
  # (2) the folded per-profile fallback list rides the profile (its own
  # destroy is a no-op, but deleting the profile retires the rows), so
  # zero-orphan cleanup is the profile delete itself; (3) the fallback
  # companion's upstream tests blank CLOUDFLARE_API_TOKEN (the API-token
  # defect class): a 403 on that write under our token credential is the
  # expected ambush, and a recorded deferral is the honest outcome.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes pass.
  status: pending_proof
  timeout_minutes: 10
