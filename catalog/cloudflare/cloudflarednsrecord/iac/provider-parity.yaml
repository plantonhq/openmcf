# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# data: the provider models every record type's payload in ONE shared
# union object (CAA's tag beside LOC's lat_degrees), with number-typed
# fields loosened to floats and CAA flags to a dynamic type. The spec
# restructures that union into thirteen typed per-record-type messages
# inside a oneof, with CEL rules tying each block to its record type --
# the same payloads, strongly typed. Fan-in mappings record every spec
# leaf the one data argument realizes.

resources:
  cloudflare_dns_record:
    mappings:
      - spec: spec.caa.flags
        arg: data
      - spec: spec.caa.tag
        arg: data
      - spec: spec.caa.value
        arg: data
      - spec: spec.cert.algorithm
        arg: data
      - spec: spec.cert.certificate
        arg: data
      - spec: spec.cert.key_tag
        arg: data
      - spec: spec.cert.type
        arg: data
      - spec: spec.dnskey.algorithm
        arg: data
      - spec: spec.dnskey.flags
        arg: data
      - spec: spec.dnskey.protocol
        arg: data
      - spec: spec.dnskey.public_key
        arg: data
      - spec: spec.ds.algorithm
        arg: data
      - spec: spec.ds.digest
        arg: data
      - spec: spec.ds.digest_type
        arg: data
      - spec: spec.ds.key_tag
        arg: data
      - spec: spec.https.priority
        arg: data
      - spec: spec.https.target
        arg: data
      - spec: spec.https.value
        arg: data
      - spec: spec.loc.altitude
        arg: data
      - spec: spec.loc.lat_degrees
        arg: data
      - spec: spec.loc.lat_direction
        arg: data
      - spec: spec.loc.lat_minutes
