      - spec: spec.loc.precision_vert
        arg: data
      - spec: spec.loc.size
        arg: data
      - spec: spec.naptr.flags
        arg: data
      - spec: spec.naptr.order
        arg: data
      - spec: spec.naptr.preference
        arg: data
      - spec: spec.naptr.regex
        arg: data
      - spec: spec.naptr.replacement
        arg: data
      - spec: spec.naptr.service
        arg: data
      - spec: spec.settings.flatten_cname
        arg: settings
      - spec: spec.settings.ipv4_only
