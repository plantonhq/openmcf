apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsRecord
metadata:
  name: my-caa-record
spec:
  zoneId:
    value: <cloudflare-zone-id>
  name: "@"
  type: CAA
  ttl: 3600
  # The typed record data is a proto oneof: its active case (caa, srv, ...)
  # sits at the spec top level -- never under a `data:` wrapper key.
  caa:
    flags: 0
    tag: issue
    value: letsencrypt.org
