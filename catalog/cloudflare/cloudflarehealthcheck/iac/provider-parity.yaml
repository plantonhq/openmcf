# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The provider's `http_config` and `tcp_config` are nested attributes; the
# spec models each as a typed message. Fan-in mappings record every spec
# leaf those arguments realize. The spec's `headers` wrapper (name →
# {values: [...]}) is unwrapped in locals.tf to the nested `header` map
# inside `http_config` -- not a top-level argument.

resources:
  cloudflare_healthcheck:
    mappings:
      - spec: spec.http_config.method
        arg: http_config
      - spec: spec.http_config.path
        arg: http_config
      - spec: spec.http_config.port
        arg: http_config
      - spec: spec.http_config.expected_codes
        arg: http_config
      - spec: spec.http_config.expected_body
        arg: http_config
      - spec: spec.http_config.follow_redirects
        arg: http_config
      - spec: spec.http_config.allow_insecure
        arg: http_config
      - spec: spec.http_config.headers
        arg: http_config
      - spec: spec.http_config.headers.values
        arg: http_config
      - spec: spec.tcp_config.method
        arg: tcp_config
      - spec: spec.tcp_config.port
        arg: tcp_config
    exclusions:
      - arg: description
        reason: deliberately unmodeled -- a dashboard note with no probe effect; the check is identified by name

