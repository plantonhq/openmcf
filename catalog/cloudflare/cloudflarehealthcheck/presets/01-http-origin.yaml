apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareHealthcheck
metadata:
  name: origin-http
spec:
  zone_id:
    value: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your zone id
  name: origin-http
  address: example.com
  type: HTTP
  http_config:
    path: /health
    expected_codes:
      - "200"
