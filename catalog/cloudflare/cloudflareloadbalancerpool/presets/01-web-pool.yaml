apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancerPool
metadata:
  name: web-pool
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: web-pool
  origins:
    - name: origin-1
      address:
        value: <origin-1-address>
      weight: 1
    - name: origin-2
      address:
        value: <origin-2-address>
      weight: 1
  monitor:
    valueFrom:
      kind: CloudflareLoadBalancerMonitor
      name: web-https
      fieldPath: status.outputs.monitor_id
  minimumOrigins: 1
