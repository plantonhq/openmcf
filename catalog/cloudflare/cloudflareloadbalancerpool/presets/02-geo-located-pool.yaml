apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancerPool
metadata:
  name: us-west-pool
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: us-west-pool
  origins:
    - name: us-west-1
      address:
        value: <origin-address>
      weight: 1
  monitor:
    valueFrom:
      kind: CloudflareLoadBalancerMonitor
      name: web-https
      fieldPath: status.outputs.monitor_id
  latitude: 37.77
  longitude: -122.42
  checkRegions:
    - WNAM
  originSteering:
    policy: least_connections
