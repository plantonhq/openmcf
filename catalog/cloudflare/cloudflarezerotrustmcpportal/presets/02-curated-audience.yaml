apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustMcpPortal
metadata:
  name: support-tools
spec:
  account_id: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d"
  portal_id: support-tools
  hostname: mcp-support.example.com
  name: Support Tools
  description: The support team's curated tool set
  allow_code_mode: false
  servers:
    - server_id:
        value: docs-search
    - server_id:
        value: tickets
      updated_tools:
        - name: close_ticket
          alias: Resolve ticket
          enabled: true
        - name: delete_ticket
          enabled: false
