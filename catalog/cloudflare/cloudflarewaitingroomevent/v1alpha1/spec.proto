syntax = "proto3";

package dev.planton.cloudflare.cloudflarewaitingroomevent.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// CloudflareWaitingRoomEventSpec defines one scheduled event on a waiting room:
// a time window (a product launch, a ticket on-sale) during which the event's
// override values temporarily replace the room's own settings, with an optional
// prequeue that gathers early arrivals before the doors open.
//
// Events live on their own cadence -- created and deleted per launch while the
// room persists -- which is why they are their own kind rather than a field of
// the room.
//
// Every override field is OPTIONAL and null-means-inherit: an unset override
// leaves the room's value in charge for the event window; a set one replaces it
// while the event is active. Cloudflare's API enforces the time rules (start at
// least one minute before end; prequeue at least five minutes before start) --
// this spec validates them up front so a bad window fails at manifest time, not
// at apply.
message CloudflareWaitingRoomEventSpec {
  option (buf.validate.message).cel = {
    id: "spec.start_before_end"
    message: "event_start_time must be at least one minute before event_end_time"
    expression: "!this.event_start_time.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$') || !this.event_end_time.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$') || timestamp(this.event_start_time) + duration('60s') <= timestamp(this.event_end_time)"
  };
  option (buf.validate.message).cel = {
    id: "spec.prequeue_five_minutes_before"
    message: "prequeue_start_time must be at least five minutes before event_start_time"
    expression: "this.prequeue_start_time == '' || !this.prequeue_start_time.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$') || !this.event_start_time.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$') || timestamp(this.prequeue_start_time) + duration('300s') <= timestamp(this.event_start_time)"
  };
  option (buf.validate.message).cel = {
    id: "spec.shuffle_requires_prequeue"
    message: "shuffle_at_event_start needs a prequeue to shuffle -- set prequeue_start_time"
    expression: "!this.shuffle_at_event_start || this.prequeue_start_time != ''"
  };
  option (buf.validate.message).cel = {
    id: "spec.users_pair_both_or_neither"
    message: "new_users_per_minute and total_active_users override each other's math -- Cloudflare requires setting both together or neither"
    expression: "has(this.new_users_per_minute) == has(this.total_active_users)"
  };

  // The waiting room the event runs on.
  // When using value_from, defaults to CloudflareWaitingRoom kind and
  // status.outputs.waiting_room_id field path.
  dev.planton.shared.foreignkey.v1.StringValueOrRef waiting_room_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareWaitingRoom,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.waiting_room_id"
  ];

  // The zone the waiting room belongs to.
  // When using value_from, defaults to CloudflareDnsZone kind and status.outputs.zone_id field path.
  dev.planton.shared.foreignkey.v1.StringValueOrRef zone_id = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareDnsZone,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.zone_id"
  ];

  // A name for the event (shown in the dashboard).
  string name = 3 [(buf.validate.field).string.min_len = 1];

  // When the event window opens, as RFC3339 (e.g. 2026-09-01T10:00:00Z). Must
  // be at least one minute before event_end_time.
  string event_start_time = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "event_start_time.rfc3339"
      message: "event_start_time must be an RFC3339 timestamp (e.g. 2026-09-01T10:00:00Z)"
      expression: "this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
    }
  ];

  // When the event window closes, as RFC3339.
  string event_end_time = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "event_end_time.rfc3339"
      message: "event_end_time must be an RFC3339 timestamp (e.g. 2026-09-01T14:00:00Z)"
      expression: "this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
    }
  ];

  // When early arrivals may start gathering in the prequeue, as RFC3339. Must
  // be at least five minutes before event_start_time. Unset means no prequeue.
  string prequeue_start_time = 6 [(buf.validate.field).cel = {
    id: "prequeue_start_time.rfc3339"
    message: "prequeue_start_time must be an RFC3339 timestamp (e.g. 2026-09-01T09:30:00Z) or empty"
    expression: "this == '' || this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
  }];

  // Randomize the order of prequeued users when the event starts, instead of
  // first-come-first-served -- fairness for on-sales where arrival time is a
  // bot advantage. Requires a prequeue.
  optional bool shuffle_at_event_start = 7;

  // Description shown in the dashboard's event list.
  string description = 8;

  // Suspend the event without deleting it -- the window comes and goes with no
  // effect while suspended.
  optional bool suspended = 9;

  // Override: custom queue-page HTML while the event is active (the room's
  // Advanced entitlement applies). Unset inherits the room's page.
  string custom_page_html = 10;

  // Override: freeze session renewal during the event (see the room field of
  // the same name). Unset inherits the room's setting.
  optional bool disable_session_renewal = 11;

  // Override: new-users-per-minute admission rate during the event. Cloudflare
  // requires setting this together with total_active_users (both or neither);
  // the floor is 200. Unset inherits the room's rate.
  optional int32 new_users_per_minute = 12 [(buf.validate.field).int32.gte = 200];

  // Override: total concurrent active users during the event. Set together
  // with new_users_per_minute (both or neither); the floor is 200. Unset
  // inherits the room's cap.
  optional int32 total_active_users = 13 [(buf.validate.field).int32.gte = 200];

  // Override: queueing method during the event. Cloudflare's own schema leaves
  // this unvalidated on events -- the wall here mirrors the room's documented
  // set (a deliberate tightening).
  optional string queueing_method = 14 [(buf.validate.field).string = {
    in: [
      "fifo",
      "random",
      "passthrough",
      "reject"
    ]
  }];

  // Override: session duration in minutes during the event (1-30). Unset
  // inherits the room's duration.
  optional int32 session_duration = 15 [(buf.validate.field).int32 = {
    gte: 1
    lte: 30
  }];

  // Override: Turnstile action during the event (see the room field). Unset
  // inherits the room's action.
  optional string turnstile_action = 16 [(buf.validate.field).string = {
    in: [
      "log",
      "infinite_queue"
    ]
  }];

  // Override: Turnstile mode during the event (see the room field). Unset
  // inherits the room's mode.
  optional string turnstile_mode = 17 [(buf.validate.field).string = {
    in: [
      "off",
      "invisible",
      "visible_non_interactive",
      "visible_managed"
    ]
  }];
}
