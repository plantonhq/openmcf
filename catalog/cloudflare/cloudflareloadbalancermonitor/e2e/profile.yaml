apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflareloadbalancermonitor
spec:
  # A load-balancer monitor under live E2E: account-scoped, no catalog
  # prerequisites -- deploy -> GET
  # accounts/{account_id}/load_balancers/monitors/{id} verify -> destroy ->
  # verify-destroyed on both provisioners. Two scenarios: `http-minimal`
  # (provider defaults -- type http, no port) and `tcp-port` (CEL requires
  # a port for tcp). Entitlement gate: the Load Balancing paid add-on gates
  # the WHOLE chain (monitors, pools, and the load balancer itself -- the
  # same gate already on the load-balancer proof group). Objects create in
  # seconds.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
  cost_class: cheap_ephemeral
