syntax = "proto3";

package dev.planton.cloudflare.cloudflareloadbalancer.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareloadbalancer/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareloadbalancer/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-load-balancer
message CloudflareLoadBalancer {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareLoadBalancer'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareLoadBalancerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareLoadBalancerStatus status = 5;
}

// cloudflare-load-balancer status
message CloudflareLoadBalancerStatus {
  //stack-outputs
  //  cloudflare-load-balancer stack-outputs
  CloudflareLoadBalancerStackOutputs outputs = 1;
}
