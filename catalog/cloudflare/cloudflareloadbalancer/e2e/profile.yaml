apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflareloadbalancer
spec:
  # A load balancer under live E2E: the harness installs the CloudflareDnsZone
  # and CloudflareLoadBalancerPool prerequisites first (the kind's registry
  # prerequisites), resolves the zone and pool references against their
  # outputs, then runs deploy -> GET zones/{zone_id}/load_balancers/{id}
  # verify -> destroy -> verify-destroyed on both provisioners. The minimal
  # scenario proves the static-failover path; the rules-steering scenario
  # proves the traffic-rules surface (a fixed-response rule plus a
  # steering-overrides rule) and session affinity.
  #
  # Entitlement gate: Cloudflare Load Balancing is a paid account add-on
  # (~$5/mo + per-origin) and it gates the WHOLE chain -- pools included. The
  # proving session enables the subscription before running these lanes.
  # Watch: whether Cloudflare accepts load balancer creation on a PENDING
  # (undelegated) fixture zone is unverified offline; if the live lane finds
  # it needs an ACTIVE zone, the fallback is the env-gated arm pattern
  # (planton.dev/e2e-required-env + PLANTON_E2E_CLOUDFLARE_ZONE_ID).
  # Deliberately not in the live scenarios: pop_pools (Enterprise-only
  # entitlement) and networks (needs a private-network setup; the send path
  # is proven by the offline plan).
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 15
