apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancerMonitor
metadata:
  name: failover-https
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  type: https
  path: /
  expectedCodes: "2xx"
---
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancerPool
metadata:
  name: failover-pool
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: failover-pool
  origins:
    - name: primary
      address:
        value: 192.0.2.1
      weight: 1
    - name: secondary
      address:
        value: 192.0.2.2
      weight: 1
  monitor:
    valueFrom:
      kind: CloudflareLoadBalancerMonitor
      name: failover-https
      fieldPath: status.outputs.monitor_id
---
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancer
metadata:
  name: my-active-passive-failover
spec:
  hostname: <app-subdomain>.<your-domain.com>
  zoneId:
    value: <cloudflare-zone-id>
  defaultPools:
    - valueFrom:
        kind: CloudflareLoadBalancerPool
        name: failover-pool
        fieldPath: status.outputs.pool_id
  fallbackPool:
    valueFrom:
      kind: CloudflareLoadBalancerPool
      name: failover-pool
      fieldPath: status.outputs.pool_id
  proxied: true
  steeringPolicy: off
