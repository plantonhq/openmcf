# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22):
#
#   Load Balancers Write   -- zone-scoped; create/update/delete the zone's
#                             load balancer via POST/PUT/DELETE
#                             /zones/{zone_id}/load_balancers[/{id}]
#                             (derived from the module's API surface; the
#                             shared create endpoint reference's "Accepted
#                             Permissions" section names "Load Balancers
#                             Account Write" for its account-level arm --
#                             https://developers.cloudflare.com/api/resources/load_balancers/methods/create/,
#                             retrieved 2026-08-22 -- while these modules
#                             use only the zone-scoped arm, which the
#                             general reference covers with this group)
#                             (provenance: derived)
#   Load Balancers Read    -- zone-scoped; refresh/import the load balancer
#                             via GET /zones/{zone_id}/load_balancers/{id}
#                             (derived from the module's API surface)
#                             (provenance: derived)
#
# The catalog page additionally names the account-scoped "Load Balancing:
# Monitors and Pools Edit" group -- that group belongs to the companion
# CloudflareLoadBalancerPool and CloudflareLoadBalancerMonitor components
# (this load balancer only REFERENCES pools by ID; its modules never call
# the account-level pool or monitor APIs), so it lives in those components'
# inventories, not this one.
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_load_balancer resource and the
# Pulumi module's matching LoadBalancer resource; neither engine performs
# secondary lookups -- pool references arrive pre-resolved as IDs). The
# live capture lane upgrades entries to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflareloadbalancer
spec: {}
