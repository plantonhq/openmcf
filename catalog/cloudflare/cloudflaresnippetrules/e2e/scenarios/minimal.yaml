# The live arm: a one-rule table invoking the snippet fixture by reference.
# The rule omits enabled -- proving the spec's enabled-defaults-TRUE promise
# (Cloudflare's own default is false; the module makes ours real).
#
# MEASURED WALLS (live, 2026-08-27): (1) Snippets -- and therefore snippet
# rules -- are a paid-plan product ("snippets are not allowed" on any free
# zone), so this arm runs on the env-injected paid test zone and skips
# honestly when the token is unset; the snippet fixture installs on the same
# zone. (2) The expression uses the FUNCTION form starts_with(...) -- the
# operator form is rejected with error 20127 even on a Pro zone (the paid
# grammar extension sits higher still). CAUTION: destroy wipes ALL snippet
# rules in the zone -- the sanctioned test zone must carry no snippet rules
# owned by anyone else (verified empty 2026-08-27 pre-lane).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareSnippetRules
metadata:
  name: e2e-sniprules-minimal-${E2E_RUN_ID}
  annotations:
    planton.dev/e2e-required-env: PLANTON_E2E_CLOUDFLARE_ZONE_ID
spec:
  zone_id:
    value: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ZONE_ID}
  rules:
    - expression: 'starts_with(http.request.uri.path, "/planton-e2e")'
      snippet_name:
        valueFrom:
          kind: CloudflareSnippet
          name: planton-oss-e2e-cloudflaresnippet-prereq
          fieldPath: status.outputs.snippet_name
      description: "planton-e2e routing rule"
