apiVersion: iac.planton.dev/v1
kind: ProviderImportCatalog
metadata:
  name: cloudflare
spec:
  # Import-ID formats per Cloudflare resource type, as documented by the
  # upstream terraform-provider-cloudflare (v5 line). The FORMAT lives here
  # (provider knowledge, shared by every component); which concrete value
  # fills each {placeholder} lives in the owning component's import-map.yaml.
  # Correctness is machine-proven by the E2E import round-trip (deploy a
  # fixture, set state aside, re-import blind, plan must show zero diff) --
  # never by review alone.
  #
  # Cloudflare import IDs follow the API's resource hierarchy: zone-scoped
  # objects import as "<zone_id>/<id>", account-scoped objects as
  # "<account_id>/<id>", and the zone itself as "<zone_id>". There is no
  # scan-side correspondence here (cloud_control_type_name is an AWS-only
  # concept); account discovery happens through the Cloudflare API itself.
  resource_types:
    # --- DNS ------------------------------------------------------------------
    # The zone and its zone-singleton satellites (dns settings, dnssec, hold,
    # subscription) all carry the bare zone id as their identity.
    - terraform_type: cloudflare_zone
      pulumi_type: cloudflare:index/zone:Zone
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_dns_settings
      pulumi_type: cloudflare:index/zoneDnsSettings:ZoneDnsSettings
      id_format: "{zone_id}"
      notes: >-
        The v5.23.0 terraform provider ships NO importer for this resource
        (docs: "This resource does not currently support terraform import";
        the package has no ImportState). The id_format records the API
        identity (GET /zones/{zone_id}/dns_settings). A blind round-trip must
        expect the import step to fail for this address and instead re-assert
        the settings from configuration -- safe, because the resource is a
        zone-singleton PUT whose create is idempotent for identical values.
    - terraform_type: cloudflare_zone_dnssec
      pulumi_type: cloudflare:index/zoneDnssec:ZoneDnssec
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_hold
      pulumi_type: cloudflare:index/zoneHold:ZoneHold
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_subscription
      pulumi_type: cloudflare:index/zoneSubscription:ZoneSubscription
      id_format: "{zone_id}"
    - terraform_type: cloudflare_dns_record
      pulumi_type: cloudflare:index/dnsRecord:DnsRecord
      id_format: "{zone_id}/{dns_record_id}"
    # --- Workers --------------------------------------------------------------
    - terraform_type: cloudflare_workers_script
      pulumi_type: cloudflare:index/workersScript:WorkersScript
      id_format: "{account_id}/{script_name}"
    - terraform_type: cloudflare_workers_script_subdomain
      pulumi_type: cloudflare:index/workersScriptSubdomain:WorkersScriptSubdomain
      id_format: "{account_id}/{script_name}"
    - terraform_type: cloudflare_workers_custom_domain
      pulumi_type: cloudflare:index/workersCustomDomain:WorkersCustomDomain
      id_format: "{account_id}/{domain_id}"
    - terraform_type: cloudflare_workers_route
      pulumi_type: cloudflare:index/workersRoute:WorkersRoute
      id_format: "{zone_id}/{route_id}"
    - terraform_type: cloudflare_workers_cron_trigger
      pulumi_type: cloudflare:index/workersCronTrigger:WorkersCronTrigger
      id_format: "{account_id}/{script_name}"
    # --- Load Balancing ---------------------------------------------------------
    # The load balancer's documented import ID carries a literal scope prefix
    # ("{accounts|zones}/{scope_id}/{lb_id}"); the catalog kind is zone-scoped,
    # so the zones/ arm is the one recorded here.
    - terraform_type: cloudflare_load_balancer
      pulumi_type: cloudflare:index/loadBalancer:LoadBalancer
      id_format: "zones/{zone_id}/{load_balancer_id}"
    # --- Email Routing ----------------------------------------------------------
    # Settings, the managed DNS records, and the catch-all rule are zone
    # singletons -- their import identity is the bare zone id. Rules are
    # zone-scoped objects; destination addresses are account-scoped objects.
    - terraform_type: cloudflare_email_routing_settings
      pulumi_type: cloudflare:index/emailRoutingSettings:EmailRoutingSettings
      id_format: "{zone_id}"
    - terraform_type: cloudflare_email_routing_dns
      pulumi_type: cloudflare:index/emailRoutingDns:EmailRoutingDns
      id_format: "{zone_id}"
    - terraform_type: cloudflare_email_routing_catch_all
      pulumi_type: cloudflare:index/emailRoutingCatchAll:EmailRoutingCatchAll
      id_format: "{zone_id}"
    - terraform_type: cloudflare_email_routing_rule
      pulumi_type: cloudflare:index/emailRoutingRule:EmailRoutingRule
      id_format: "{zone_id}/{rule_id}"
    - terraform_type: cloudflare_email_routing_address
      pulumi_type: cloudflare:index/emailRoutingAddress:EmailRoutingAddress
      id_format: "{account_id}/{address_id}"
    # --- Rulesets -----------------------------------------------------------------
    # The ruleset's documented import ID carries a literal scope prefix
    # ("{accounts|zones}/{account_id|zone_id}/{ruleset_id}"); the catalog
    # kind's live scenarios are zone-scoped, so the zones/ arm is the one
    # recorded here (an account-scoped ruleset imports via the accounts/ arm).
    - terraform_type: cloudflare_ruleset
      pulumi_type: cloudflare:index/ruleset:Ruleset
      id_format: "zones/{zone_id}/{ruleset_id}"
