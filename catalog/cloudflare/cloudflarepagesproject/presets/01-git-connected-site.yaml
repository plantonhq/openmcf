apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflarePagesProject
metadata:
  name: git-connected-site
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: git-connected-site
  productionBranch: main
  # Cloudflare builds a new deployment on every push to the connected repo.
  # Requires a one-time git authorization in the Cloudflare dashboard.
  source:
    type: github
    config:
      owner: <github-owner>
      repoName: <repo-name>
      productionBranch: main
      prCommentsEnabled: true
      previewDeploymentSetting: all
  buildConfig:
    buildCommand: npm run build
    destinationDir: dist
  deploymentConfigs:
    production:
      compatibilityDate: "2025-01-15"
      compatibilityFlags:
        - nodejs_compat
      vars:
        ENVIRONMENT: production
