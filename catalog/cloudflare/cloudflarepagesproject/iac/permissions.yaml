# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22; the page lists this account-scoped group in two
# naming variants -- "Cloudflare Pages Edit" and "Pages Write" -- both
# verbatim on the page; the Write form is used here):
#
#   Pages Write  -- account-scoped; create/update/delete the project via
#                   POST/PATCH/DELETE
#                   /accounts/{account_id}/pages/projects[/{project_name}]
#                   and attach/detach each custom domain via POST/DELETE
#                   /accounts/{account_id}/pages/projects/{project_name}/domains[/{domain_name}]
#                   (derived from the modules' API surface)
#                   (provenance: derived)
#   Pages Read   -- account-scoped; refresh/import the project and its domains
#                   via GET on the same paths
#                   (derived from the modules' API surface)
#                   (provenance: derived)
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's cloudflare_pages_project + cloudflare_pages_domain
# resources and the Pulumi module's matching PagesProject + PagesDomain
# resources; neither engine performs secondary lookups or data-source
# reads). Binding targets (KV namespaces, D1 databases, R2 buckets, Queues,
# Workers) are referenced by ID/name resolved from other components'
# outputs -- the modules never call those services' APIs. The git-provider
# authorization for git-connected projects is a one-time, browser-driven
# dashboard step outside any token this inventory covers (the spec's own
# contract records this). The component README and catalog.md carried no
# named permission prose to migrate. The live capture lane upgrades entries
# to proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflarepagesproject
spec: {}
