# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The project's nested trees (build_config, source, and the two deployment
# configs) are nested provider attributes, each one configurable argument;
# the spec models the same trees as typed messages -- with each deployment
# config's generic env_vars {type, value} split into a plain vars map plus
# a typed secrets list, and every binding class given a named message.
# Fan-in mappings record every spec leaf each argument realizes.
#
# Two sub-surfaces inside these trees are deliberately restructured away,
# with no capability loss:
#   - source.config.owner_id / repo_id: numeric alternative addressing of
#     the repository the spec already identifies canonically by
#     owner + repo_name.
#   - deployment_configs.*.wrangler_config_hash: drift-detection
#     bookkeeping for wrangler-managed projects; Planton is the manager
#     here, so there is no wrangler state to fingerprint.

resources:
  cloudflare_pages_project:
    mappings:
      - spec: spec.build_config.build_caching
        arg: build_config
      - spec: spec.build_config.build_command
        arg: build_config
      - spec: spec.build_config.destination_dir
        arg: build_config
      - spec: spec.build_config.root_dir
        arg: build_config
      - spec: spec.build_config.web_analytics_tag
        arg: build_config
      - spec: spec.build_config.web_analytics_token
        arg: build_config
      - spec: spec.deployment_configs.preview.ai_bindings.name
        arg: deployment_configs
      - spec: spec.deployment_configs.preview.ai_bindings.project_id
        arg: deployment_configs
      - spec: spec.deployment_configs.preview.always_use_latest_compatibility_date
        arg: deployment_configs
      - spec: spec.deployment_configs.preview.analytics_engine_datasets.dataset
