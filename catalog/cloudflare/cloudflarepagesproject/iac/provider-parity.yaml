  cloudflare_pages_domain:
    mappings:
      # One domain resource per entry of the spec's domains list; the
      # argument is the custom domain itself. Recorded explicitly because
      # exact matching would otherwise bind it to the project-name field.
      - spec: spec.domains
        arg: name
      # The attachment names the same project the primary resource creates
      # -- one spec field consumed by both resources.
      - spec: spec.name
