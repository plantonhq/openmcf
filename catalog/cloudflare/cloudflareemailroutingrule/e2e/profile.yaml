apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: cloudflareemailroutingrule
spec:
  # An Email Routing rule under live E2E: the harness installs the
  # prerequisite chain -- the run-scoped pending fixture zone, then
  # CloudflareEmailRoutingZone enabling Email Routing on it (rules are only
  # accepted on a routing-enabled zone) -- resolves zone_id, then runs deploy
  # -> GET zones/{zone_id}/email/routing/rules/{rule_id} verify -> destroy ->
  # verify-destroyed on both provisioners. The literal-drop scenario proves
  # the rule lifecycle with a literal recipient matcher and a drop action --
  # the one action type needing no verified destination address or deployed
  # Email Worker. Forward and worker actions (including the multi-action
  # list, this kind's widened surface) share the same typed-action send path,
  # proven by the offline plan (the e2e manifest carries a forward+worker
  # rule) and spec tests. Watch: whether a PENDING (undelegated) zone accepts
  # Email Routing enablement + rules is unverified offline. Objects create in
  # seconds at zero cost.
  tier: 1
  # Authored to the full offline bar; awaiting the first live proof session
  # (no Cloudflare account exists yet). The proving session flips this to
  # green after both engine lanes and the blind import round-trip pass.
  status: pending_proof
  timeout_minutes: 10
