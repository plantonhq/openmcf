apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareEmailRoutingRule
metadata:
  name: forward-and-process
spec:
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      name: <zone-name>
      fieldPath: status.outputs.zone_id
  name: <rule-name>
  matchers:
    - type: literal
      field: to
      value: <matched-address>
  actions:
    - type: forward
      forwardTo:
        - value: <destination-email>
    - type: worker
      worker:
        valueFrom:
          kind: CloudflareWorker
          name: <email-worker-name>
          fieldPath: status.outputs.script_name
