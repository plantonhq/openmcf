# Provider-parity manifest: this kind's recorded judgment against the pinned
# cloudflare provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The provider's generic {type, value[]} action list is restructured into
# typed actions with real foreign keys (forward_to ->
# CloudflareEmailRoutingAddress, worker -> CloudflareWorker); the module maps
# each typed action back. Matchers keep the provider's own shape.

resources:
  cloudflare_email_routing_rule:
    mappings:
      # The actions list is ONE argument; the typed per-action leaves fan in.
      - spec: spec.actions.type
        arg: actions
      - spec: spec.actions.forward_to
        arg: actions
      - spec: spec.actions.worker
        arg: actions
      # Matchers are modeled 1:1 ({type, field, value}); the nested leaves fan
      # into the one matchers argument.
      - spec: spec.matchers.type
        arg: matchers
      - spec: spec.matchers.field
        arg: matchers
      - spec: spec.matchers.value
        arg: matchers
    exclusions:
      - arg: owner_worker_tag
        reason: wrangler rule-ownership bookkeeping -- meaningful only with source=wrangler, which an IaC-managed rule never is
      - arg: source
        reason: declares who manages the rule (api vs wrangler); an IaC-managed rule is by definition source=api (the provider default) -- claiming wrangler ownership from IaC would misrepresent management and break wrangler round-tripping
