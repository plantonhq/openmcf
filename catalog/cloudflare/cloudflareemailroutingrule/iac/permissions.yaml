# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Schema: iac/componentpermissions/v1.
#
# Cloudflare authenticates with a bearer API token built from named
# permission groups, not IAM-statement policies, so none of the schema's
# provider sections (aws/gcp/azure/kubernetes) applies -- their absence is
# the schema's own claim that the modules touch no such API. The Cloudflare
# least-privilege story lives in the token's PERMISSION GROUPS until the
# schema grows a Cloudflare section, at which point this inventory converts
# mechanically. Group names are verbatim from the Cloudflare API token
# permissions reference
# (https://developers.cloudflare.com/fundamentals/api/reference/permissions/,
# retrieved 2026-08-22):
#
#   Email Routing Rules Write  -- zone-scoped; create/update/delete the
#                                 routing rule via POST/PUT/DELETE
#                                 /zones/{zone_id}/email/routing/rules[/{id}]
#                                 (dedicated group, direct name match; the
#                                 path mapping is derived from the module's
#                                 API surface)
#                                 (provenance: derived)
#   Email Routing Rules Read   -- zone-scoped; refresh/import the rule via
#                                 GET /zones/{zone_id}/email/routing/rules/{id}
#                                 (provenance: derived)
#
# The component's catalog.md states the requirement in prose ("Email Routing
# edit access (and Workers Scripts access when routing to an Email Worker)")
# -- migrated here losslessly. The Workers Scripts clause is catalog.md's
# claim, NOT derivable from the modules' API surface: both engines call only
# the email-routing-rules endpoint and pass the worker script name as an
# action value, performing no Workers API call. Whether Cloudflare's rule
# endpoint itself demands a Workers permission to accept a worker action is
# unverified -- an honest unknown for the live capture lane to settle.
#
# All entries are derived from static analysis of the official modules (the
# Terraform module's single cloudflare_email_routing_rule resource and the
# Pulumi module's matching EmailRoutingRule resource; neither engine
# performs secondary lookups). The live capture lane upgrades entries to
# proven.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: cloudflareemailroutingrule
spec: {}
