syntax = "proto3";

package dev.planton.openstack.openstacknetwork.v1alpha1;

import "catalog/openstack/openstacknetwork/v1alpha1/api.proto";
import "catalog/openstack/provider.proto";

// OpenStackNetworkStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message OpenStackNetworkStackInput {
  // target cloud-resource to be deployed
  OpenStackNetwork target = 1;
  // provider-config for OpenStack authentication
  dev.planton.openstack.OpenStackProviderConfig provider_config = 2;
}
