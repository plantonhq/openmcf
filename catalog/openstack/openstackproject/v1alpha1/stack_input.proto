syntax = "proto3";

package dev.planton.openstack.openstackproject.v1alpha1;

import "catalog/openstack/openstackproject/v1alpha1/api.proto";
import "catalog/openstack/provider.proto";

// OpenStackProjectStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message OpenStackProjectStackInput {
  // target cloud-resource to be deployed
  OpenStackProject target = 1;
  // provider-config for OpenStack authentication
  dev.planton.openstack.OpenStackProviderConfig provider_config = 2;
}
