syntax = "proto3";

package dev.planton.openstack.openstackinstance.v1alpha1;

import "catalog/openstack/openstackinstance/v1alpha1/api.proto";
import "catalog/openstack/provider.proto";

// OpenStackInstanceStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message OpenStackInstanceStackInput {
  // target cloud-resource to be deployed
  OpenStackInstance target = 1;
  // provider-config for OpenStack authentication
  dev.planton.openstack.OpenStackProviderConfig provider_config = 2;
}
