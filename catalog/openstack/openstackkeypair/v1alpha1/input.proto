syntax = "proto3";

package dev.planton.openstack.openstackkeypair.v1alpha1;

import "catalog/openstack/openstackkeypair/v1alpha1/api.proto";
import "catalog/openstack/provider.proto";

// OpenStackKeypairStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message OpenStackKeypairStackInput {
  // target cloud-resource to be deployed
  OpenStackKeypair target = 1;
  // provider-config for OpenStack authentication
  dev.planton.openstack.OpenStackProviderConfig provider_config = 2;
}
