# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_s3vectors_vector_bucket:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The provider leaves encryption_configuration UNTYPED (an
      # ObjectAttribute awaiting plugin protocol v6), so the argument
      # is one opaque leaf at the pin; the spec types its two fields.
      - arg: encryption_configuration
        spec: spec.encryption.sse_type
      - arg: encryption_configuration
        spec: spec.encryption.kms_key_arn
    exclusions:
      - arg: vector_bucket_name
        reason: metadata.name is the bucket name on both engines -- never free-form spec surface
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
  aws_s3vectors_vector_bucket_policy:
    mappings:
      - arg: region
        spec: spec.region
    exclusions:
      - arg: vector_bucket_arn
        reason: wired by the module to the folded bucket's own AWS-generated ARN -- the policy always governs THIS bucket, never a foreign one
  aws_s3vectors_index:
    mappings:
      - arg: region
        spec: spec.region
      # Indexes fold in as the name-keyed spec.indexes list.
      - arg: index_name
        spec: spec.indexes.name
      - arg: dimension
        spec: spec.indexes.dimension
      - arg: distance_metric
        spec: spec.indexes.distance_metric
      # The provider leaves encryption_configuration UNTYPED (an
      # ObjectAttribute awaiting plugin protocol v6) - one opaque leaf
      # at the pin, typed by the spec.
      - arg: encryption_configuration
        spec: spec.indexes.encryption.sse_type
      - arg: encryption_configuration
        spec: spec.indexes.encryption.kms_key_arn
      - arg: metadata_configuration.non_filterable_metadata_keys
        spec: spec.indexes.non_filterable_metadata_keys
    exclusions:
      - arg: vector_bucket_name
        reason: wired by the module to the folded bucket's own name -- an index always lives in THIS bucket, never a foreign one
      - arg: data_type
        reason: module-pinned to float32 -- the provider's DataType enum holds exactly that one value
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
