apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxOntapFileSystem
metadata:
  org: example-org
  env: prod
  name: ha-ontap-fs
  id: awsfxo-ha-ontap-fs-prod
spec:
  region: <aws-region>
  deployment_type: MULTI_AZ_2
  storage_capacity_gib: 2048
  storage_type: SSD
  throughput_capacity_per_ha_pair: 768
  ha_pairs: 1
  subnet_ids:
    - value: "<subnet-id-az-a>"
    - value: "<subnet-id-az-b>"
  preferred_subnet_id:
    value: "<subnet-id-az-a>"
  endpoint_ip_address_range: 198.19.255.0/24
  route_table_ids:
    - value: "<route-table-id>"
  security_group_ids:
    - value: "<security-group-id>"
  kms_key_id:
    value: arn:aws:kms:us-east-1:123456789012:key/your-kms-key-id
  automatic_backup_retention_days: 7
  daily_automatic_backup_start_time: "05:00"
  weekly_maintenance_start_time: "7:02:00"
