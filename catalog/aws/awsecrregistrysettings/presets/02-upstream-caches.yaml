apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcrRegistrySettings
metadata:
  name: us-east-1-registry-caches
spec:
  region: us-east-1
  pullThroughCacheRules:
    - ecrRepositoryPrefix: docker-hub
      upstreamRegistryUrl: registry-1.docker.io
      # ECR requires credentialed pull-through-cache secrets to be NAMED
      # under the `ecr-pullthroughcache/` prefix (slash, not hyphen).
      # Create the Secrets Manager secret with exactly that name shape and
      # replace the region, account id, and suffix in this ARN.
      credentialArn:
        value: arn:aws:secretsmanager:us-east-1:123456789012:secret:ecr-pullthroughcache/dockerhub-AbCdEf
    - ecrRepositoryPrefix: k8s
      upstreamRegistryUrl: registry.k8s.io
    - ecrRepositoryPrefix: quay
      upstreamRegistryUrl: quay.io
  repositoryCreationTemplates:
    - prefix: docker-hub
      description: Cached Docker Hub images
      appliedFor:
        - PULL_THROUGH_CACHE
      imageTagMutability: IMMUTABLE
      lifecyclePolicy: '{"rules":[{"rulePriority":1,"description":"expire stale cached images","selection":{"tagStatus":"any","countType":"sinceImagePushed","countUnit":"days","countNumber":90},"action":{"type":"expire"}}]}'
    - prefix: k8s
      description: Cached registry.k8s.io images
      appliedFor:
        - PULL_THROUGH_CACHE
      imageTagMutability: IMMUTABLE
      lifecyclePolicy: '{"rules":[{"rulePriority":1,"description":"expire stale cached images","selection":{"tagStatus":"any","countType":"sinceImagePushed","countUnit":"days","countNumber":90},"action":{"type":"expire"}}]}'
