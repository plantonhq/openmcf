          403,
          404,
          416,
          500,
          502,
          503,
          504
        ]
      }
    }
  ];
}

// How matched requests are cached and forwarded to one origin (or
// origin group).
//
// Caching is configured through ONE of two generations:
//
//   - MODERN (recommended): cache_policy_id + origin_request_policy_id
//     (+ response_headers_policy_id). AWS ships managed policies that
//     cover most cases -- e.g. cache policy "Managed-CachingOptimized"
//     (658327ea-f89d-4fab-a63d-7e88639e58f6) for static content,
//     "Managed-CachingDisabled" (4135ea2d-6df8-44a3-9df3-4b5a84be39ad)
//     for APIs, and origin-request policy "Managed-AllViewer"
//     (216adef6-5c7f-47e4-b989-5492eafa07d3) to forward everything.
//   - LEGACY: the inline forwarded_values block with per-behavior
//     TTLs. Kept for existing configurations; mutually exclusive with
//     cache_policy_id.
//
// One of the two generations must be chosen -- AWS rejects a behavior
// with neither a cache policy nor forwarded values.
message AwsCloudFrontCacheBehavior {
  // The origin_id or origin_group_id this behavior routes to.
  string target_origin_id = 1 [(buf.validate.field).required = true];

  // How viewers reach this content: "redirect-to-https" (the
  // sensible default for websites), "https-only" (APIs; no redirect
  // round-trip), or "allow-all" (legacy plain-HTTP viewers).
  string viewer_protocol_policy = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "allow-all",
        "https-only",
        "redirect-to-https"
      ]
    }
  ];

  // HTTP methods CloudFront forwards to the origin. Empty keeps
  // ["GET", "HEAD"] -- static content. Use the full seven
  // (GET/HEAD/OPTIONS/PUT/POST/PATCH/DELETE) for APIs; only GET/HEAD
  // (+OPTIONS) responses are ever cached.
  repeated string allowed_methods = 3 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {
        in: [
          "GET",
          "HEAD",
          "OPTIONS",
          "PUT",
          "POST",
          "PATCH",
          "DELETE"
        ]
      }
    }
  ];

  // Methods whose responses CloudFront caches -- ["GET", "HEAD"] (the
  // default when empty) or ["GET", "HEAD", "OPTIONS"] (cache CORS
  // preflights).
  repeated string cached_methods = 4 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {
        in: [
          "GET",
          "HEAD",
          "OPTIONS"
        ]
      }
    }
  ];

  // Automatically gzip/brotli-compress responses for viewers that
  // accept it -- almost always what you want for text content (the
  // cache policy must enable the compression formats too when using
  // the modern generation).
  bool compress = 5;

  // MODERN generation: the cache policy controlling the cache key and
  // TTLs, by ID -- a managed policy ID (see the message comment) or
  // your own. Mutually exclusive with forwarded_values and the
  // per-behavior TTLs.
  string cache_policy_id = 6;

  // MODERN generation: the origin-request policy controlling which
  // headers/cookies/query strings are forwarded (WITHOUT joining the
  // cache key), by ID.
  string origin_request_policy_id = 7;

  // The response-headers policy adding/removing headers on responses
  // (security headers, CORS, server-timing), by ID. Works with both
  // generations.
  string response_headers_policy_id = 8;

  // LEGACY generation: inline forwarding rules; forwarded values join
  // the cache key. Mutually exclusive with cache_policy_id.
  AwsCloudFrontForwardedValues forwarded_values = 9;

  // LEGACY generation TTL floor in seconds (with forwarded_values
  // only). Default 0.
  int64 min_ttl_seconds = 10 [(buf.validate.field).int64.gte = 0];

  // LEGACY generation default TTL in seconds, used when the origin
  // sends no caching headers (with forwarded_values only). 0 keeps
  // the AWS default (86400 -- one day).
  int64 default_ttl_seconds = 11 [(buf.validate.field).int64.gte = 0];

  // LEGACY generation TTL ceiling in seconds (with forwarded_values
  // only). 0 keeps the AWS default (31536000 -- one year).
  int64 max_ttl_seconds = 12 [(buf.validate.field).int64.gte = 0];

  // CloudFront Functions (sub-millisecond JavaScript at every edge)
  // attached to this behavior -- viewer-request/viewer-response only,
  // at most one per event type. The lightweight choice for URL
  // rewrites, redirects, and header manipulation.
  repeated AwsCloudFrontFunctionAssociation function_associations = 13 [(buf.validate.field).repeated.max_items = 2];

  // Lambda@Edge functions (full Lambda at regional edges) attached to
  // this behavior -- all four event types, at most one per type. For
  // logic that needs the network, the body, or more than 1ms.
  repeated AwsCloudFrontLambdaFunctionAssociation lambda_function_associations = 14 [(buf.validate.field).repeated.max_items = 4];

  // Restrict this behavior's content to signed URLs/cookies from
  // these key groups (the modern private-content mechanism).
  repeated string trusted_key_group_ids = 15 [(buf.validate.field).repeated.unique = true];

  // LEGACY private content: AWS account numbers whose CloudFront key
  // pairs may sign URLs. Prefer trusted_key_group_ids.
  repeated string trusted_signers = 16 [(buf.validate.field).repeated.unique = true];

  // The field-level encryption configuration ID applied to this
  // behavior (encrypts specific POST fields at the edge with your
  // public key).
  string field_level_encryption_id = 17;

  // The real-time log configuration ARN streaming this behavior's
  // requests to Kinesis within seconds.
  string realtime_log_config_arn = 18;

  // Serve Microsoft Smooth Streaming media from this behavior.
  bool smooth_streaming = 19;

  // Allow gRPC viewer traffic over HTTP/2 (requires POST in
  // allowed_methods and http_version http2 or above).
  bool grpc_enabled = 20;

  // Exactly one caching generation.
  option (buf.validate.message).cel = {
    id: "exactly_one_caching_generation"
    message: "set exactly one of cache_policy_id (modern, recommended) or forwarded_values (legacy) -- CloudFront requires a caching configuration"
    expression: "(this.cache_policy_id != '') != has(this.forwarded_values)"
  };

  // Per-behavior TTLs belong to the legacy generation only.
  option (buf.validate.message).cel = {
    id: "ttls_require_forwarded_values"
    message: "min_ttl_seconds/default_ttl_seconds/max_ttl_seconds only apply with forwarded_values -- with cache_policy_id the policy owns the TTLs"
    expression: "has(this.forwarded_values) || (this.min_ttl_seconds == 0 && this.default_ttl_seconds == 0 && this.max_ttl_seconds == 0)"
  };
}

// A path-matched cache behavior, evaluated in list order before the
// default behavior.
message AwsCloudFrontOrderedCacheBehavior {
  // The path pattern this behavior matches, e.g. "/api/*",
  // "/images/*.jpg", "*.css". First matching behavior wins.
  string path_pattern = 1 [(buf.validate.field).required = true];

  // The behavior applied to matching requests.
  AwsCloudFrontCacheBehavior behavior = 2 [(buf.validate.field).required = true];
}

// LEGACY inline forwarding rules -- what CloudFront forwards to the
// origin AND includes in the cache key. Prefer the modern cache-policy
// generation for new configurations.
message AwsCloudFrontForwardedValues {
  // Forward query strings to the origin (and cache on them).
  bool query_string = 1;

  // When query_string is true, cache only on these parameters (empty
  // caches on all of them).
  repeated string query_string_cache_keys = 2 [(buf.validate.field).repeated.unique = true];

  // Header names forwarded to the origin and joined into the cache
  // key. "*" forwards all headers and effectively disables caching.
  repeated string headers = 3 [(buf.validate.field).repeated.unique = true];

  // Cookie forwarding: "none" (the safe default for cacheable
  // content), "whitelist" (only whitelisted_cookie_names), or "all"
  // (destroys cache efficiency -- every cookie combination is its own
  // cache entry).
  string cookies_forward = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "none",
        "whitelist",
        "all"
      ]
    }
  ];

  // Cookie names forwarded when cookies_forward is "whitelist".
  repeated string whitelisted_cookie_names = 5 [(buf.validate.field).repeated.unique = true];

  // Whitelisted cookies only make sense in whitelist mode.
  option (buf.validate.message).cel = {
    id: "whitelist_names_require_whitelist_mode"
    message: "whitelisted_cookie_names requires cookies_forward: whitelist"
    expression: "this.whitelisted_cookie_names.size() == 0 || this.cookies_forward == 'whitelist'"
  };
}

// A CloudFront Function attached to a behavior event.
message AwsCloudFrontFunctionAssociation {
  // The event: "viewer-request" (before the cache lookup) or
  // "viewer-response" (before returning to the viewer).
  string event_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "viewer-request",
        "viewer-response"
      ]
    }
  ];

  // The CloudFront Function ARN.
  string function_arn = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^arn:aws[a-zA-Z-]*:cloudfront::[0-9]{12}:function/.+$"
  ];
}

// A Lambda@Edge function attached to a behavior event.
message AwsCloudFrontLambdaFunctionAssociation {
  // The event: "viewer-request"/"viewer-response" (every request; 5s
  // limit) or "origin-request"/"origin-response" (cache misses only;
  // 30s limit -- the usual choice for origin rewrites).
  string event_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "viewer-request",
        "viewer-response",
        "origin-request",
        "origin-response"
      ]
    }
  ];

  // The Lambda function VERSION ARN (Lambda@Edge requires a numbered
  // version, never $LATEST or an alias). The function must live in
  // us-east-1.
  string lambda_arn = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^arn:aws[a-zA-Z-]*:lambda:us-east-1:[0-9]{12}:function:[^:]+:[0-9]+$"
  ];

  // Expose the request body to the function (viewer-request and
  // origin-request events).
  bool include_body = 3;
}

// The certificate presented to viewers. Absent means the default
// *.cloudfront.net certificate.
message AwsCloudFrontViewerCertificate {
  // The ACM certificate ARN -- MUST be in us-east-1 regardless of
  // where anything else lives. Can reference an AwsCertManagerCert
  // resource. The recommended arm.
  dev.planton.shared.foreignkey.v1.StringValueOrRef acm_certificate_arn = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCertManagerCert,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cert_arn"
  ];

  // A certificate uploaded to IAM, by ID -- the legacy arm for
  // regions/paths where ACM is unavailable.
  string iam_certificate_id = 2;

  // How CloudFront serves HTTPS for custom certificates: "sni-only"
  // (the default -- free, supported by every modern client),
  // "static-ip" (dedicated static IPs for clients that must pin
  // addresses; contact AWS support to enable, billed), or "vip" (the
  // legacy dedicated-IP tier at significant monthly cost, for ancient
  // non-SNI clients). Empty keeps sni-only.
  string ssl_support_method = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "sni-only",
        "static-ip",
        "vip"
      ]
    }
  ];

  // The minimum TLS version viewers must speak -- an AWS security
  // policy name. "TLSv1.2_2021" is the module default for custom
  // certificates; "TLSv1.3_2025" (TLS 1.3 only) and "TLSv1.2_2025"
  // are the current-generation policies. "TLSv1.2_2019",
  // "TLSv1.2_2018", "TLSv1.1_2016", "TLSv1_2016", and "TLSv1" remain
  // for older clients, and "SSLv3" exists ONLY for the legacy
  // dedicated-IP tier serving ancient clients -- never choose it for
  // new configurations. Empty keeps TLSv1.2_2021.
  string minimum_protocol_version = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "SSLv3",
        "TLSv1",
        "TLSv1_2016",
        "TLSv1.1_2016",
        "TLSv1.2_2018",
        "TLSv1.2_2019",
        "TLSv1.2_2021",
        "TLSv1.2_2025",
        "TLSv1.3_2025"
      ]
    }
  ];

  // The certificate arms are mutually exclusive.
  option (buf.validate.message).cel = {
    id: "at_most_one_certificate_arm"
    message: "set at most one of acm_certificate_arn or iam_certificate_id"
    expression: "!(has(this.acm_certificate_arn) && this.iam_certificate_id != '')"
  };
}

// Replace an origin error with a custom response and control its
// caching.
message AwsCloudFrontCustomErrorResponse {
  // The origin HTTP status code to intercept.
  int32 error_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      in: [
        400,
        403,
        404,
        405,
        414,
        416,
        500,
        501,
        502,
        503,
        504
      ]
    }
  ];

  // The status code returned to the viewer (e.g. map S3's
  // 403-for-missing-object to 404). 0 passes the original code
  // through.
  int32 response_code = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 200
      lte: 599
    }
  ];

  // The page served for this error, as a distribution path (e.g.
  // "/errors/404.html"). The path must be servable by a behavior.
  string response_page_path = 3 [(buf.validate.field).string.pattern = "^$|^/.*$"];

  // Seconds CloudFront caches this error response. 0 keeps the AWS
  // default (300); errors caching too long can mask origin recovery.
  int64 error_caching_min_ttl_seconds = 4 [(buf.validate.field).int64.gte = 0];

  // A custom page needs a response code to serve it with.
  option (buf.validate.message).cel = {
    id: "page_requires_response_code"
    message: "response_page_path requires response_code"
    expression: "this.response_page_path == '' || this.response_code != 0"
  };
}

// Country-level access control.
message AwsCloudFrontGeoRestriction {
  // "whitelist" (serve ONLY the listed countries) or "blacklist"
  // (serve everyone EXCEPT the listed countries).
  string restriction_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "whitelist",
        "blacklist"
      ]
    }
  ];

  // ISO 3166-1 alpha-2 country codes, e.g. "US", "DE", "IN".
  repeated string locations = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {pattern: "^[A-Z]{2}$"}
    }
  ];
}

// Standard (v1) access logs to S3.
message AwsCloudFrontLogging {
  // The S3 bucket receiving logs, as a bucket DOMAIN NAME
  // ("my-logs.s3.amazonaws.com"). The bucket must have ACLs enabled
  // (object ownership "Bucket owner preferred") -- CloudFront writes
  // logs via the awslogsdelivery canonical user. May be left empty to
  // keep v1 log DELIVERY off while still recording the cookie
  // preference -- the transition shape for distributions moving to
  // v2 (CloudWatch-delivered) access logs, which are configured
  // outside the distribution.
  string bucket = 1 [(buf.validate.field).string.pattern = "^$|^[A-Za-z0-9\\-\\.]+\\.s3(\\.[a-z0-9-]+)?\\.amazonaws\\.com$"];

  // Key prefix for log objects, e.g. "cdn/".
  string prefix = 2;

  // Include cookies in the logs.
  bool include_cookies = 3;
}

// A continuous-deployment policy owned by this (primary) distribution:
// the blue/green rollout mechanism. CloudFront routes a slice of
// production traffic -- selected by weight or by a request header --
// to a STAGING distribution carrying the candidate configuration;
// promote by copying the staging configuration to the primary, then
// drop the slice.
message AwsCloudFrontContinuousDeployment {
  // Whether the policy is in effect. True (the default) shifts
  // traffic per the routing choice below; false keeps the policy
  // attached but dormant -- the pause button for a rollout.
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  // The CloudFront domain names of the staging distributions
  // receiving the traffic slice (e.g. "d111111abcdef8.cloudfront.net"
  // -- the domain_name output of a distribution deployed with
  // staging: true). CloudFront currently supports one staging
  // distribution per policy.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef staging_distribution_dns_names = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCloudFront,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.domain_name"
  ];

  // Weight-based routing: send a fixed percentage of ALL traffic to
  // staging. The canary shape. Set exactly one of single_weight or
  // single_header.
  AwsCloudFrontContinuousDeploymentSingleWeight single_weight = 3;

  // Header-based routing: send only requests carrying a specific
  // header/value pair to staging. The team-testing shape -- testers
  // opt in by sending the header; regular viewers never hit staging.
  AwsCloudFrontContinuousDeploymentSingleHeader single_header = 4;

  // Exactly one routing choice drives the policy.
  option (buf.validate.message).cel = {
    id: "exactly_one_traffic_arm"
    message: "set exactly one of single_weight (percentage-based routing) or single_header (header-based routing)"
    expression: "has(this.single_weight) != has(this.single_header)"
  };
}

// Percentage-based staging traffic.
message AwsCloudFrontContinuousDeploymentSingleWeight {
  // The fraction of traffic sent to staging, as a decimal between 0
  // and 0.15 (AWS caps staged traffic at 15%). Example: 0.10 sends
  // 10% of requests to the staging distribution.
  float weight = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).float = {
      gt: 0
      lte: 0.15
    }
  ];

  // Pin each viewer to one side for the session, so a user does not
  // bounce between primary and staging responses mid-visit. Absent
  // means requests are split without stickiness.
  AwsCloudFrontSessionStickiness session_stickiness = 2;
}

// Session stickiness for weight-based staging traffic.
message AwsCloudFrontSessionStickiness {
  // Seconds of inactivity after which a viewer's session ends,
  // 300-3600. Must not exceed maximum_ttl_seconds.
  int32 idle_ttl_seconds = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 300
      lte: 3600
    }
  ];

  // The longest a viewer's requests count as one session regardless
  // of activity, 300-3600 seconds.
  int32 maximum_ttl_seconds = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 300
      lte: 3600
    }
  ];

  // AWS requires idle <= maximum.
  option (buf.validate.message).cel = {
    id: "idle_within_maximum"
    message: "idle_ttl_seconds must be less than or equal to maximum_ttl_seconds"
    expression: "this.idle_ttl_seconds <= this.maximum_ttl_seconds"
  };
}

// Header-based staging traffic.
message AwsCloudFrontContinuousDeploymentSingleHeader {
  // The request header that opts a request into staging. AWS requires
  // the "aws-cf-cd-" prefix. Example: "aws-cf-cd-canary".
  string header = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^aws-cf-cd-.+$"
  ];

  // The header value that must match exactly for the request to route
  // to staging.
  string value = 2 [(buf.validate.field).required = true];
}

// Mutual TLS for viewer connections: CloudFront requests (or
// requires) a client certificate during the TLS handshake and
// validates it against a CloudFront trust store. Requires a custom
// viewer certificate (aliases + viewer_certificate); the default
// *.cloudfront.net certificate cannot serve mTLS viewers.
message AwsCloudFrontViewerMtls {
  // The enforcement mode: "required" (reject connections without a
  // valid client certificate), "optional" (request one, admit
  // connections either way -- origins see the validation result in
  // headers), or "passthrough" (forward the certificate to the origin
  // without CloudFront validating it). Empty keeps the AWS default
  // (required).
  string mode = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "required",
        "optional",
        "passthrough"
      ]
    }
  ];

  // The CloudFront trust store holding the CA bundle that client
  // certificates are validated against, by ID. Required for the
  // "required" and "optional" modes; "passthrough" needs no trust
  // store (the origin does the validating).
  string trust_store_id = 2;

  // Advertise the trust store's CA names in the TLS handshake, so
  // clients holding multiple certificates can pick the right one.
  bool advertise_trust_store_ca_names = 3;

  // Accept client certificates past their expiry date -- a migration
  // escape hatch while a client fleet rotates certificates, never a
  // steady state.
  bool ignore_certificate_expiry = 4;

  // The trust-store knobs live inside the provider's trust-store
  // wrapper -- they are meaningless without a trust store attached.
  option (buf.validate.message).cel = {
    id: "trust_store_knobs_require_trust_store"
    message: "advertise_trust_store_ca_names and ignore_certificate_expiry require trust_store_id"
    expression: "this.trust_store_id != '' || (!this.advertise_trust_store_ca_names && !this.ignore_certificate_expiry)"
  };
}
