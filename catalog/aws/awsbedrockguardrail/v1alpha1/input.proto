syntax = "proto3";

package dev.planton.aws.awsbedrockguardrail.v1alpha1;

import "catalog/aws/awsbedrockguardrail/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockGuardrailStackInput is the input for the IaC modules that
// deploy the Bedrock guardrail.
message AwsBedrockGuardrailStackInput {
  // target is the AwsBedrockGuardrail resource to deploy.
  AwsBedrockGuardrail target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
