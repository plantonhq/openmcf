apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockGuardrail
metadata:
  name: content-safety-baseline
spec:
  region: us-west-2
  description: Baseline content safety for a customer-facing assistant
  blockedInputMessaging: Sorry, I can't help with that request.
  blockedOutputsMessaging: Sorry, I can't provide that response.
  contentPolicy:
    filters:
      - type: SEXUAL
        inputStrength: HIGH
        outputStrength: HIGH
      - type: VIOLENCE
        inputStrength: HIGH
        outputStrength: HIGH
      - type: HATE
        inputStrength: HIGH
        outputStrength: HIGH
      - type: INSULTS
        inputStrength: MEDIUM
        outputStrength: MEDIUM
      - type: MISCONDUCT
        inputStrength: MEDIUM
        outputStrength: MEDIUM
      - type: PROMPT_ATTACK
        inputStrength: HIGH
        outputStrength: NONE
  wordPolicy:
    profanityFilter: {}
  versions:
    - name: prod
      description: Baseline content safety
