apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxLustreFileSystem
metadata:
  org: example-org
  env: prod
  name: datalake-fsx
  id: awsfxl-datalake-fsx-prod
spec:
  region: <aws-region>
  deployment_type: PERSISTENT_1
  storage_capacity_gib: 6000
  storage_type: HDD
  per_unit_storage_throughput: 12
  # HDD file systems must state their read-cache decision. READ provisions an
  # SSD cache (20% of storage) so hot data gets SSD-like latency.
  drive_cache_type: READ
  data_compression_type: LZ4
  subnet_id:
    value: "<subnet-id>"
  security_group_ids:
    - value: "<security-group-id>"
  automatic_backup_retention_days: 14
  daily_automatic_backup_start_time: "02:00"
  copy_tags_to_backups: true
  weekly_maintenance_start_time: "1:05:00"
