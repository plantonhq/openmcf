apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksAccessEntry
metadata:
  name: <entry-resource-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  principalArn:
    valueFrom:
      kind: AwsIamRole
      name: <principal-role-resource-name>
      fieldPath: status.outputs.role_arn
  # Read-only across the whole cluster -- the safe default grant for
  # engineers, dashboards, and CI that only inspects.
  policyAssociations:
    - policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy
      accessScope:
        type: cluster
