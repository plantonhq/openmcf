apiVersion: aws.planton.dev/v1alpha1
kind: AwsVpcEndpoint
metadata:
  name: <endpoint-resource-name>
spec:
  region: <aws-region>
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: <vpc-resource-name>
      fieldPath: status.outputs.vpc_id
  endpointType: Interface
  # The vendor's endpoint-service name, from their PrivateLink
  # onboarding docs (always the com.amazonaws.vpce.<region>.vpce-svc-*
  # form for third-party services).
  serviceName: com.amazonaws.vpce.us-west-2.vpce-svc-0a1b2c3d4e5f67890
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: <endpoint-sg-resource-name>
        fieldPath: status.outputs.security_group_id
  # Third-party services have no AWS public DNS name to override --
  # clients use the endpoint's own DNS name from the dns_name output
  # (or a private Route53 alias you create onto it).
