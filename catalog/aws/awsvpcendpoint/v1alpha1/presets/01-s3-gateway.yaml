apiVersion: aws.planton.dev/v1alpha1
kind: AwsVpcEndpoint
metadata:
  name: <endpoint-resource-name>
spec:
  region: <aws-region>
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: <vpc-resource-name>
      fieldPath: status.outputs.vpc_id
  # Gateway is AWS's default type; stated explicitly here because the
  # choice IS the preset -- free, route-based S3 access.
  endpointType: Gateway
  serviceName: com.amazonaws.us-west-2.s3
  # Attach every route table whose subnets should reach S3 privately.
  # A subnet that owns its route table (inline routes) exports it as
  # route_table_id; subnets riding the VPC main table are covered by
  # referencing the AwsVpc's main_route_table_id output instead.
  routeTableIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-resource-name>
        fieldPath: status.outputs.route_table_id
