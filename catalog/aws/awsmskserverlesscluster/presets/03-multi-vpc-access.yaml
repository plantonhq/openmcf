apiVersion: aws.planton.dev/v1alpha1
kind: AwsMskServerlessCluster
metadata:
  name: shared-events-kafka
spec:
  region: us-west-2
  # Two VPC placements: AWS provisions client-facing network interfaces in
  # BOTH VPCs, so the application VPC and the analytics VPC each reach the
  # cluster privately -- no peering, no PrivateLink setup.
  vpcConfigs:
    - subnetIds:
        - value: subnet-0aaa1111bbb222333
        - value: subnet-0bbb2222ccc333444
      securityGroupIds:
        - value: sg-0abc1234def567890
    - subnetIds:
        - value: subnet-0ccc3333ddd444555
        - value: subnet-0ddd4444eee555666
      securityGroupIds:
        - value: sg-0def5678abc901234
