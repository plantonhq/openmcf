# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_msk_serverless_cluster:
    mappings:
      # One vpc_config block per spec.vpc_configs entry -- the spec names the
      # repeated placement list in the plural; the per-entry leaves keep the
      # provider's names.
      - spec: spec.vpc_configs.subnet_ids
        arg: vpc_config.subnet_ids
      - spec: spec.vpc_configs.security_group_ids
        arg: vpc_config.security_group_ids
    exclusions:
      - arg: cluster_name
        reason: wired by the module from metadata.name -- the cluster name is platform naming, never free-form spec surface
      - arg: client_authentication.sasl.iam.enabled
        reason: hardcoded true by both modules -- SASL/IAM is the only client-authentication scheme serverless MSK supports and it is mandatory; a field could only ever hold one value
      - arg: tags
        reason: wired by the module from metadata (planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
