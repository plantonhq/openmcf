apiVersion: aws.planton.dev/v1alpha1
kind: AwsCostAnomalyMonitor
metadata:
  name: team-platform-monitor
spec:
  region: us-east-1
  monitorName: Team Platform Spend Monitor
  monitorType: CUSTOM
  # The expression is authored in the provider's canonical stored
  # form: every root member present (unused ones null) and the tag
  # key "user:"-prefixed - a sparser or unprefixed document makes
  # every re-plan after create propose a replacement.
  monitorSpecification:
    And: null
    CostCategories: null
    Dimensions: null
    Not: null
    Or: null
    Tags:
      Key: user:team
      MatchOptions:
        - EQUALS
      Values:
        - platform
  subscriptions:
    - name: platform-alerts
      frequency: IMMEDIATE
      subscribers:
        # AWS validates the ARN at apply time -- replace the region, account
        # id, and topic name (angle brackets would malform the ARN).
        - address:
            value: arn:aws:sns:us-east-1:123456789012:platform-cost-alerts
          type: SNS
      thresholdExpression:
        and:
          - dimension:
              key: ANOMALY_TOTAL_IMPACT_ABSOLUTE
              matchOptions:
                - GREATER_THAN_OR_EQUAL
              values:
                - "50"
          - dimension:
              key: ANOMALY_TOTAL_IMPACT_PERCENTAGE
              matchOptions:
                - GREATER_THAN_OR_EQUAL
              values:
                - "10"
