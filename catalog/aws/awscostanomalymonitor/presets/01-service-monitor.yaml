# NOTE: AWS permits exactly ONE services (DIMENSIONAL) monitor per
# account and auto-creates it ("Default-Services-Monitor") on every
# account that enabled Cost Explorer on or after 2023-03-27. If your
# account already has it, creating this preset fails with "Limit
# exceeded on dimensional spend monitor creation" - import the
# existing monitor instead, or start from the custom-slice preset.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCostAnomalyMonitor
metadata:
  name: service-spend-monitor
spec:
  region: us-east-1
  monitorName: Service Spend Monitor
  monitorType: DIMENSIONAL
  monitorDimension: SERVICE
  subscriptions:
    - name: finops-daily-summary
      frequency: DAILY
      subscribers:
        - address:
            value: <finops-team@your-company.com>
          type: EMAIL
      thresholdExpression:
        dimension:
          key: ANOMALY_TOTAL_IMPACT_ABSOLUTE
          matchOptions:
            - GREATER_THAN_OR_EQUAL
          values:
            - "100"
