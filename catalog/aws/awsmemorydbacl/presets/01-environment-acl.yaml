apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbAcl
metadata:
  # metadata.name IS the AWS ACL name clusters attach (max 40 chars).
  name: <acl-name>
spec:
  region: <aws-region>
  # Membership references AwsMemorydbUser resources by their exported user
  # name -- granting or revoking an application's access is an in-place edit
  # here, never a cluster change.
  userNames:
    - valueFrom:
        kind: AwsMemorydbUser
        name: <app-user-name>
        fieldPath: status.outputs.user_name
