apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awselasticfilesystem
spec:
  # A file system under live E2E: the registry-declared AwsSubnet +
  # AwsSecurityGroup prerequisites deploy first, then the file system proves
  # create (encrypted + elastic + full lifecycle trio + backup policy +
  # resource policy with a literal ${...} policy variable), verify
  # (DescribeFileSystems, lifecycle-state-aware), destroy, and
  # verify-destroyed on both provisioners. Two distinct-AZ mount targets
  # exercise the per-subnet map outputs. Recorded exclusions: One Zone
  # (an alternate create shape, not additive surface), static IPv4/IPv6 and
  # DUAL_STACK mount targets (the shared subnet fixture carries no IPv6 CIDR),
  # and replication (a second file system in another region with 20-minute
  # waiters and overwrite-protection teardown interplay -- wiring is proven by
  # the offline gate and the conformance case).
  #
  # PENDING PROOF (2026-08-12, depth closure): the Terraform module's tag
  # map dropped its metadata.labels merge and converged to the canonical
  # six-key identity map (the Pulumi parity) -- and the full-surface
  # scenario SETS labels, so the prior proven lanes deployed
  # differently-tagged file systems per engine. The prior green predates
  # the converged sends -- demoted per the badge-honesty rule.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
