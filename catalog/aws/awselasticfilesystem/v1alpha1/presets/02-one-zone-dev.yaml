apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticFileSystem
metadata:
  org: example-org
  env: dev
  name: dev-efs-one-zone
  id: dev-efs-one-zone-id
spec:
  region: us-east-1
  encrypted: true
  throughputMode: bursting
  availabilityZoneName: us-east-1a
  mountTargets:
    - subnetId:
        value: "<subnet-id-us-east-1a>"
  securityGroupIds:
    - value: "<security-group-id>"
