apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticFileSystem
metadata:
  org: example-org
  env: prod
  name: app-efs-regional
  id: app-efs-regional-id
spec:
  region: <aws-region>
  encrypted: true
  throughputMode: bursting
  backupEnabled: true
  mountTargets:
    - subnetId:
        value: "<subnet-id-az-a>"
    - subnetId:
        value: "<subnet-id-az-b>"
  securityGroupIds:
    - value: "<security-group-id>"
