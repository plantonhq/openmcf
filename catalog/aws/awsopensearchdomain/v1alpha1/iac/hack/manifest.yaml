apiVersion: aws.planton.dev/v1alpha1
kind: AwsOpenSearchDomain
metadata:
  name: awsos-demo
spec:
  region: us-west-2
  engineVersion: "OpenSearch_2.17"
  clusterConfig:
    instanceType: r6g.large.search
    instanceCount: 3
    dedicatedMasterEnabled: true
    dedicatedMasterType: r6g.large.search
    dedicatedMasterCount: 3
    zoneAwarenessEnabled: true
    availabilityZoneCount: 3
  ebsOptions:
    ebsEnabled: true
    volumeType: gp3
    volumeSize: 100
  encryptAtRestEnabled: true
  nodeToNodeEncryptionEnabled: true
  vpcOptions:
    subnetIds:
      - value: subnet-0aaa1111bbb222333
      - value: subnet-0bbb2222ccc333444
      - value: subnet-0ccc3333ddd444555
    securityGroupIds:
      - value: sg-0abc1234def567890
  domainEndpointOptions:
    enforceHttps: true
    tlsSecurityPolicy: "Policy-Min-TLS-1-2-PFS-2023-10"
  advancedSecurityOptions:
    enabled: true
    internalUserDatabaseEnabled: true
    masterUserName: admin
    masterUserPassword:
      value: "Sup3r$ecret!"
  autoTuneOptions:
    desiredState: ENABLED
    useOffPeakWindow: true
  offPeakWindowOptions:
    enabled: true
    windowStartHour: 23
    windowStartMinute: 30
