apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsopensearchdomain
spec:
  # An OpenSearch domain under E2E: a true leaf (no prerequisites -- the
  # scenario is a public single-node t3.small.search domain outside any
  # VPC), so the harness runs the lifecycle directly. Verification is
  # DescribeDomain keyed on the domain name. Auto-Tune is excluded from
  # the scenario because t3 instance types do not support it.
  #
  # pending_proof: the recorded offline-only deferral (domain creation
  # runs 15-25 minutes each way per engine; both engines were validated
  # offline against the hack manifest) is REOPENED by owner decision --
  # the cost is trivial (t3.small.search pennies per hour, ~$0.20 per
  # lane pair) and only the wall clock is heavy, the class the
  # CloudFront proof already handled. The depth closure also changed the
  # live send surface (encryption/node-to-node/software-update blocks
  # always sent, off-peak default-on, warm value gates, the SAML and
  # VPC-endpoint-grant satellites), so the lane rides Q29.
  tier: 1
  status: pending_proof
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 90
