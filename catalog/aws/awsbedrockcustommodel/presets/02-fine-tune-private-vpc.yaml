apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockCustomModel
metadata:
  name: fine-tune-private-vpc
spec:
  region: us-east-1
  baseModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-text-express-v1
  customizationType: FINE_TUNING
  jobName: fine-tune-private-vpc-001
  hyperparameters:
    epochCount: "2"
    batchSize: "1"
    learningRate: "0.00001"
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: bedrock-customization
  customModelKmsKeyArn:
    valueFrom:
      kind: AwsKmsKey
      name: model-encryption
  trainingDataS3Uri: s3://my-training-bucket/data/train.jsonl
  outputDataS3Uri: s3://my-training-bucket/output/
  validationDataS3Uris:
    - s3://my-training-bucket/data/validate.jsonl
  vpcConfig:
    subnetIds:
      - valueFrom:
          kind: AwsSubnet
          name: private-a
      - valueFrom:
          kind: AwsSubnet
          name: private-b
    securityGroupIds:
      - valueFrom:
          kind: AwsSecurityGroup
          name: training-data-access
