apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awscloudwatchdashboard
spec:
  # A two-widget dashboard (text + metric) proving the Struct-to-JSON
  # body path, the PutDashboard upsert, and the no-tags contract.
  # Minutes-lived, ~$0 (the monthly dashboard charge prorates to
  # nothing).
  #
  # PROVEN live 2026-08-25 (Q44): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate. Live catch fixed at the bar: the
  # widget key "y" must be QUOTED in YAML manifests (YAML 1.1 parses
  # bare y as boolean true - the body reached AWS with "true" keys).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
