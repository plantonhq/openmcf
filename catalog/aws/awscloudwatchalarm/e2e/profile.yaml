apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awscloudwatchalarm
spec:
  # A CloudWatch metric alarm under live E2E: deploy -> DescribeAlarms verify
  # -> destroy -> verify-destroyed on both provisioners. The scenario runs
  # metric-query mode (the deepest arm): a three-query error-rate expression
  # with M-of-N evaluation and an explicit actions_enabled: false — proving
  # the presence-aware tri-state reaches the provider on both engines. The
  # alarm is a true leaf (INSUFFICIENT_DATA against placeholder dimensions is
  # a valid, expected state — no live traffic is required). Deliberately not
  # in the live scenario: PromQL mode (evaluation_criteria needs an Amazon
  # Managed Service for Prometheus workspace — a separate product surface;
  # its wiring is proven by spec tests, tofu validate, and both engines'
  # builds) and anomaly-detection bands (the same metric-query plumbing with
  # an expression function). Simple-metric mode is exercised by the
  # prerequisite fixture that composite-alarm lanes deploy.
  #
  # pending_proof: the depth closure converged two Pulumi sends — metric
  # query return_data is now state-pinned (explicit false, matching
  # Terraform) and metric.namespace is send-when-set (an unset namespace no
  # longer reaches AWS as "") — and the existing scenario's three queries
  # exercise both paths. Prior green proofs predate the convergence.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 10
