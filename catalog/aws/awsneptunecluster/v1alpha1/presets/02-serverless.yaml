apiVersion: aws.planton.dev/v1alpha1
kind: AwsNeptuneCluster
metadata:
  name: my-neptune-serverless
spec:
  region: us-west-2
  subnetIds:
    - value: subnet-replace-with-private-az1
    - value: subnet-replace-with-private-az2
  securityGroupIds:
    - value: sg-replace-with-database-sg
  storageEncrypted: true # recommended_default -- create-time-only, cannot be enabled later
  # Neptune's only credential mechanism: SigV4-signed requests from IAM
  # identities. Off would rely purely on network reachability.
  iamDatabaseAuthenticationEnabled: true
  backupRetentionPeriod: 7
  skipFinalSnapshot: false
  finalSnapshotIdentifier: my-neptune-serverless-final
  # Neptune Serverless: these NCU bounds + db.serverless instances.
  # Capacity tracks demand between the bounds; minCapacity 1 is the
  # idle cost floor (Neptune Serverless does not pause to zero).
  serverlessV2Scaling:
    minCapacity: 1
    maxCapacity: 32
  instances:
    - name: writer
      instanceClass: db.serverless
