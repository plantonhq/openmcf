apiVersion: aws.planton.dev/v1alpha1
kind: AwsEc2Instance
metadata:
  name: my-appliance
spec:
  region: <aws-region>
  ami: ami-0123456789abcdef0  # replace with your appliance/vendor AMI
  instanceType: c6i.large
  # The pre-provisioned ENI IS the network identity: it carries the subnet,
  # the security groups, the fixed private IP and MAC. Replacing the
  # instance (new AMI, new type family) keeps every one of them, so
  # license bindings, firewall rules, and DNS entries never move.
  primaryNetworkInterfaceId: eni-0123456789abcdef0  # replace with your ENI id
  # NOTE: no subnetId, securityGroupIds, private/IPv6 addressing, or
  # sourceDestCheck here -- the ENI defines all of it, and validation
  # rejects the mix (the EC2 API would too). Set source/dest-check ON THE
  # ENI for router/NAT appliances.
  instanceProfile:
    value: "<instance-profile-name>"
  metadataOptions:
    httpTokens: required
  rootBlockDevice:
    volumeSizeGb: 40
    volumeType: gp3
    encrypted: true
