apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awssesemailidentity
spec:
  # An SES domain identity under live E2E: composes the shared configuration
  # set fixture via the scenario's e2e-prerequisites annotation, then
  # verifies GetEmailIdentity on the domain string. The identity remains
  # PENDING (no DNS verification in E2E) but exists as an AWS resource --
  # SES has no verification waiter, so PENDING never blocks create/destroy.
  # Deliberately not in the live scenario: identity policies -- AWS
  # requires the document's Resource to be the identity's own ARN (account
  # + region embedded), which a static committed manifest cannot carry;
  # the fold is proven by spec/CEL tests and the offline plan gate.
  # Also deliberately not live: BYODKIM (needs a real signing key pair --
  # newly REACHABLE after the validation heal; proven by spec/CEL tests
  # and the offline gate; reopen when a fixture key ships).
  #
  # PENDING PROOF (2026-08-12, depth closure): the contract's
  # email_forwarding_enabled default annotation was dropped (it was
  # materialized by the manifest loader, so the feedback satellite rendered
  # on EVERY identity against the authored absent-means-unmanaged design)
  # -- default-shaped manifests now compose one fewer AWS resource. The
  # prior green predates this composition -- demoted per the badge-honesty
  # rule.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 10
