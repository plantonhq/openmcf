# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_vpc_peering_connection:
    specRoot: spec.request
    mappings:
      - arg: region
        spec: spec.region
      # The provider's one-member option blocks flatten onto named
      # booleans (options are managed in-line as the single owner - the
      # standalone options resource records composed).
      - arg: requester.allow_remote_vpc_dns_resolution
        spec: spec.request.requester_allow_remote_vpc_dns_resolution
      - arg: accepter.allow_remote_vpc_dns_resolution
        spec: spec.request.accepter_allow_remote_vpc_dns_resolution
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_vpc_peering_connection_accepter:
    specRoot: spec.accept
    mappings:
      - arg: region
        spec: spec.region
      - arg: accepter.allow_remote_vpc_dns_resolution
        spec: spec.accept.accepter_allow_remote_vpc_dns_resolution
    exclusions:
      # The accepter resource mirrors the connection's schema; the
      # requester-side option belongs to the requester's instance.
      # (peer_owner_id / peer_region / peer_vpc_id / vpc_id are
      # computed-only on the accepter at the pin and sit outside the
      # walk.)
      - arg: requester
        reason: the requester side's option belongs to the requester instance (the request arm) -- setting it from the accepter fights that instance
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
