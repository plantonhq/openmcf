apiVersion: aws.planton.dev/v1alpha1
kind: AwsTransitGatewayRouteTable
metadata:
  org: example-org
  env: prod
  name: spoke-to-inspection
  id: spoke-to-inspection-id
spec:
  region: <aws-region>
  transitGatewayId:
    valueFrom:
      kind: AwsTransitGateway
      name: segmented-hub
      fieldPath: status.outputs.transit_gateway_id
  associations:
    - attachmentId:
        valueFrom:
          kind: AwsTransitGatewayVpcAttachment
          name: prod-vpc-attachment
          fieldPath: status.outputs.attachment_id
    - attachmentId:
        valueFrom:
          kind: AwsTransitGatewayVpcAttachment
          name: dev-vpc-attachment
          fieldPath: status.outputs.attachment_id
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      attachmentId:
        valueFrom:
          kind: AwsTransitGatewayVpcAttachment
          name: inspection-vpc-attachment
          fieldPath: status.outputs.attachment_id
