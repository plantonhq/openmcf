# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_backup_restore_testing_plan:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # AWS restore testing names forbid hyphens and periods (stricter
      # than metadata.name conventions), so the name is an explicit spec
      # field.
      - arg: name
        spec: spec.plan_name
    exclusions:
      # (No tags_all exclusion: on this Plugin Framework resource tagsAll
      # is computed-only at the pin -- outside the audit's configurable
      # surface.)
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
  aws_backup_restore_testing_selection:
    mappings:
      - arg: region
        spec: spec.region
      # Selections fold into the plan as the name-keyed selections list.
      - arg: name
        spec: spec.selections.name
      - arg: protected_resource_type
        spec: spec.selections.protected_resource_type
      - arg: iam_role_arn
        spec: spec.selections.iam_role_arn
      - arg: protected_resource_arns
        spec: spec.selections.protected_resource_arns
      - arg: protected_resource_conditions.string_equals.key
        spec: spec.selections.protected_resource_conditions.string_equals.key
      - arg: protected_resource_conditions.string_equals.value
        spec: spec.selections.protected_resource_conditions.string_equals.value
      - arg: protected_resource_conditions.string_not_equals.key
        spec: spec.selections.protected_resource_conditions.string_not_equals.key
      - arg: protected_resource_conditions.string_not_equals.value
        spec: spec.selections.protected_resource_conditions.string_not_equals.value
      - arg: restore_metadata_overrides
        spec: spec.selections.restore_metadata_overrides
      - arg: validation_window_hours
        spec: spec.selections.validation_window_hours
    exclusions:
      - arg: restore_testing_plan_name
        reason: wired by the module to the folded plan's own name -- a selection always tests under THIS plan, never a foreign one
