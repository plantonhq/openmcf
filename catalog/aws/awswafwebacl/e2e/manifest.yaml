apiVersion: aws.planton.dev/v1alpha1
kind: AwsWafWebAcl
metadata:
  name: test-waf-acl
  org: acme
  env: dev
spec:
  region: us-west-2
  scope: REGIONAL
  defaultAction:
    type: allow
  rules:
    - name: aws-managed-common
      priority: 1
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesCommonRuleSet
          vendorName: AWS
          scopeDownStatement:
            notStatement:
              statement:
                byteMatch:
                  searchString: /health
                  positionalConstraint: STARTS_WITH
                  fieldToMatch:
                    uriPath: true
                  textTransformations:
                    - priority: 0
                      type: NONE
    - name: rate-limit-per-api-key
      priority: 2
      action: block
      statement:
        rateBased:
          limit: 2000
          aggregateKeyType: CUSTOM_KEYS
          customKeys:
            - header:
                name: x-api-key
                textTransformations:
                  - priority: 0
                    type: NONE
            - ip: true
    - name: block-bad-paths
      priority: 3
      action: block
      customResponse:
        responseCode: 403
      statement:
        orStatement:
          statements:
            - byteMatch:
                searchString: /wp-admin
                positionalConstraint: STARTS_WITH
                fieldToMatch:
                  uriPath: true
                textTransformations:
                  - priority: 0
                    type: LOWERCASE
            - sqliMatch:
                fieldToMatch:
                  body:
                    oversizeHandling: MATCH
                textTransformations:
                  - priority: 0
                    type: URL_DECODE
  # Request logging with the full redaction surface and a keep-only-enforcement
  # filter: BLOCK and COUNT records are kept, everything else is dropped.
  logging:
    destinationArn:
      value: arn:aws:logs:us-west-2:111122223333:log-group:aws-waf-logs-test-waf-acl
    redactedHeaderNames:
      - authorization
      - cookie
    redactUriPath: true
    redactQueryString: true
    redactMethod: true
    filter:
      defaultBehavior: DROP
      filters:
        - behavior: KEEP
          requirement: MEETS_ANY
          conditions:
            - action: BLOCK
            - action: COUNT
