      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.block.custom_response.response_header.name
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.block.custom_response.response_header.value
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.captcha.custom_request_handling.insert_header.name
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.captcha.custom_request_handling.insert_header.value
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.challenge.custom_request_handling.insert_header.name
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.challenge.custom_request_handling.insert_header.value
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.count.custom_request_handling.insert_header.name
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.managed_rule_group_statement.rule_action_override.action_to_use.count.custom_request_handling.insert_header.value
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.rule_group_reference_statement.rule_action_override.action_to_use.allow.custom_request_handling.insert_header.name
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
      - arg: rule.statement.rule_group_reference_statement.rule_action_override.action_to_use.allow.custom_request_handling.insert_header.value
        reason: per-override action customization deliberately not modeled -- the override carries the action string; custom handling is modeled on the rule's own action
