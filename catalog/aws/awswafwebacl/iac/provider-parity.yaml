  aws_wafv2_web_acl_logging_configuration:
    specRoot: spec.logging
    mappings:
      # AWS allows exactly one logging destination per web ACL (SDK: "You
      # can associate one logging destination to a web ACL"); the provider's
      # set-of-100 shape is looser than the service contract, so the spec
      # deliberately models the single destination.
      - spec: spec.logging.destination_arn
        arg: log_destination_configs
      # The spec names the filter wrapper `filter` and pluralizes the
      # nested lists; conditions flatten the provider's one-field
      # action/label wrappers (exactly one per condition, CEL-enforced).
      - spec: spec.logging.filter.default_behavior
        arg: logging_filter.default_behavior
      - spec: spec.logging.filter.filters.behavior
        arg: logging_filter.filter.behavior
      - spec: spec.logging.filter.filters.requirement
        arg: logging_filter.filter.requirement
      - spec: spec.logging.filter.filters.conditions.action
        arg: logging_filter.filter.condition.action_condition.action
      - spec: spec.logging.filter.filters.conditions.label_name
        arg: logging_filter.filter.condition.label_name_condition.label_name
      # One-field redaction block flattened to a repeated string.
      - spec: spec.logging.redacted_header_names
        arg: redacted_fields.single_header.name
    exclusions:
      - arg: resource_arn
        reason: wired by the module to the web ACL it creates -- never user surface
      - arg: region
        reason: wired by the module to the web ACL's own region (the logging configuration cannot live anywhere else) -- never user surface

