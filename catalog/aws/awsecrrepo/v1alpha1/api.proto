syntax = "proto3";

package dev.planton.aws.awsecrrepo.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsecrrepo/v1alpha1/spec.proto";
import "catalog/aws/awsecrrepo/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//aws-ecr-repo
message AwsEcrRepo {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsEcrRepo'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsEcrRepoSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsEcrRepoStatus status = 5;
}

//aws-ecr-repo status
message AwsEcrRepoStatus {
  //stack-outputs
  AwsEcrRepoStackOutputs outputs = 1;
}
