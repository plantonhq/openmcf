apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcrRepo
metadata:
  name: my-production-ecr-repo
spec:
  region: <aws-region>
  # Replace with your repository's registry path.
  repositoryName: team-blue/checkout-service
  # Release tags are frozen forever; "latest" stays movable for convenience.
  imageTagMutability: IMMUTABLE_WITH_EXCLUSION
  imageTagMutabilityExclusionFilters:
    - latest
  encryptionType: AES256  # default from spec
  forceDelete: false  # deletion fails while images exist
  scanOnPush: true  # default from spec; vulnerability scanning on push
  lifecycleRules:
    - rulePriority: 1
      description: Expire untagged images after 7 days
      tagStatus: untagged
      countType: sinceImagePushed
      countNumber: 7
    - rulePriority: 2
      description: Keep the most recent 100 images
      tagStatus: any
      countType: imageCountMoreThan
      countNumber: 100
