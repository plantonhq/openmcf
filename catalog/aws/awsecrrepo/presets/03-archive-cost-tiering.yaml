apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcrRepo
metadata:
  name: my-archive-tiered-ecr-repo
spec:
  region: <aws-region>
  # Replace with your repository's registry path.
  repositoryName: team-blue/checkout-service
  imageTagMutability: IMMUTABLE
  encryptionType: AES256 # default from spec
  scanOnPush: true # default from spec; vulnerability scanning on push
  forceDelete: false # deletion fails while images exist
  # The canonical archive policy: move images nobody pulls to the cheaper
  # archive storage class, then delete them after a year in archive.
  # Archived images are pulled back transparently (with a retrieval delay).
  lifecycleRules:
    - rulePriority: 1
      description: Expire untagged images after 7 days
      tagStatus: untagged
      countType: sinceImagePushed
      countNumber: 7
    - rulePriority: 2
      description: Archive images not pulled in 90 days
      tagStatus: any
      countType: sinceImagePulled
      countNumber: 90
      actionType: transition
      targetStorageClass: archive
    - rulePriority: 3
      description: Delete images archived for more than 365 days
      tagStatus: any
      countType: sinceImageTransitioned
      countNumber: 365
      storageClass: archive
