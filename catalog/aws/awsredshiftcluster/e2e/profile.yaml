apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsredshiftcluster
spec:
  # A Redshift cluster under live E2E: the harness deploys the AwsVpc +
  # two-AZ AwsSubnet prerequisites (the Redshift subnet group spans two
  # AZs), runs deploy -> Redshift DescribeClusters verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario is a single
  # ra3.large node (the smallest ORDERABLE class -- the legacy dc2 family
  # is no longer creatable for new clusters) with the AWS-managed admin
  # password: it proves the managed-credential path and the folded
  # subnet-group materialization on the cheapest footprint. Cluster
  # provisioning dominates the runtime at roughly five to ten minutes
  # each way per engine.
  #
  # pending_proof (depth closure, T02 s24): the governance satellites
  # folded in -- usage limits, scheduled actions (incl. the
  # scheduler.redshift.amazonaws.com trust contract via the
  # consumer-scoped AwsIamRole prerequisite), managed VPC endpoint
  # accesses (per-endpoint address outputs), endpoint authorizations,
  # and the snapshot-schedule association -- plus four provider-mirrored
  # format CELs and the secret_kms_requires_managed heal. The scenario
  # carries the free arms (usage limit, DISABLED scheduled action,
  # self-VPC endpoint access); endpoint AUTHORIZATION (needs a second
  # AWS account) and the schedule ASSOCIATION (needs the future
  # AwsRedshiftSnapshotSchedule kind) are offline-proven arms with named
  # unblocks. The prior green predates this surface -- demoted per the
  # badge-honesty rule.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 60
