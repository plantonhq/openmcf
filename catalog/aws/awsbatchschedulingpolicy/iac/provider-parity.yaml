# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_batch_scheduling_policy:
    mappings:
      # The provider wraps the whole fair-share surface in a MaxItems-1
      # fair_share_policy block; the spec carries its dials flat (the
      # in-kind wrapper-flattening idiom). Both modules emit the block
      # unconditionally -- an all-defaults block and an absent one are the
      # same policy AWS-side.
      - spec: spec.compute_reservation
        arg: fair_share_policy.compute_reservation
      - spec: spec.share_decay_seconds
        arg: fair_share_policy.share_decay_seconds
      # The spec pluralizes the repeated entries.
      - spec: spec.share_distributions.share_identifier
        arg: fair_share_policy.share_distribution.share_identifier
      - spec: spec.share_distributions.weight_factor
        arg: fair_share_policy.share_distribution.weight_factor
    exclusions:
      # Identity is the kind's own contract.
      - arg: name
        reason: derived from metadata.name -- never free-form user surface
      # Tag machinery.
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
