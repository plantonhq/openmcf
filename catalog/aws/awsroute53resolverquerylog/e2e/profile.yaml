  name: awsroute53resolverquerylog
spec:
  # One scenario: a config writing to a consumer-scoped CloudWatch log
  # group, associated to the chain VPC. Free at AWS beyond negligible
  # log ingestion. Watch: the association can FAIL asynchronously when
  # the destination is unwritable - the verifier asserts ACTIVE; and
  # whether resolver accepts the log group's bare ARN (expected) or
  # demands the ":*"-suffixed form (the CloudWatch wildcard class) is
  # settled by this first live run.
  #
  # Deliberately not exercised live:
  #   - the S3 and Firehose destination arms -- one destination proves
  #     the config+association machinery; the destination is a plain
  #     ForceNew string either way. Unblock: fold an S3-destination
  #     scenario into a future proof session if drift appears.
  #
  # pending_proof: forged this session to the full offline bar -- Q47
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
