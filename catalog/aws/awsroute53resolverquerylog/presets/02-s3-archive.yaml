apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53ResolverQueryLog
metadata:
  name: vpc-dns-archive
spec:
  region: us-east-1
  destinationArn:
    valueFrom:
      kind: AwsS3Bucket
      name: dns-query-archive
      fieldPath: status.outputs.bucket_arn
  vpcIds:
    - valueFrom:
        kind: AwsVpc
        name: app-vpc
        fieldPath: status.outputs.vpc_id
