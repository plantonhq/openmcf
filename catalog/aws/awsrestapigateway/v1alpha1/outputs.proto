syntax = "proto3";

package dev.planton.aws.awsrestapigateway.v1alpha1;

// AwsRestApiGatewayStackOutputs captures observable identifiers from a
// provisioned REST API. Downstream resources (custom domains' base-path
// mappings, usage plans' api_stages) wire dependencies via
// StringValueOrRef.
message AwsRestApiGatewayStackOutputs {
  // The REST API ID (the {restapi-id} in invoke URLs and import IDs).
  string rest_api_id = 1;

  // The REST API ARN.
  string rest_api_arn = 2;

  // The execution ARN prefix
  // (arn:aws:execute-api:{region}:{account}:{restapi-id}) - the base
  // Lambda resource policies and IAM invoke statements scope to.
  string execution_arn = 3;

  // The root ("/") resource ID - the parent new resources attach
  // under.
  string root_resource_id = 4;

  // The stage name serving the API.
  string stage_name = 5;

  // The stage ARN (the WAF web-ACL association target).
  string stage_arn = 6;

  // The stage invoke URL
  // (https://{restapi-id}.execute-api.{region}.amazonaws.com/{stage}).
  string invoke_url = 7;

  // The deployment ID the stage currently serves.
  string deployment_id = 8;

  // The generated client certificate's ID (set only when
  // stage.client_certificate.generate is true).
  string client_certificate_id = 9;

  // The generated client certificate's PEM body - backends add it to
  // their trust store to verify calls come through the API.
  string client_certificate_pem = 10;

  // API Gateway resource IDs keyed by route path (every derived tree
  // node, e.g. "/users" and "/users/{id}").
  map<string, string> resource_ids = 11;

  // Authorizer IDs keyed by each `authorizers` entry's name.
  map<string, string> authorizer_ids = 12;

  // Model IDs keyed by each `models` entry's name.
  map<string, string> model_ids = 13;

  // Request validator IDs keyed by each `request_validators` entry's
  // name.
  map<string, string> request_validator_ids = 14;

  // Documentation part IDs keyed by each `documentation.parts` entry's
  // position ("0", "1", ...) - the order they are declared in the spec.
  map<string, string> documentation_part_ids = 15;
}
