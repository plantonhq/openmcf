apiVersion: aws.planton.dev/v1alpha1
kind: AwsMskCluster
metadata:
  name: orders-kafka
spec:
  region: us-west-2
  kafkaVersion: "3.6.0"
  numberOfBrokerNodes: 3
  instanceType: kafka.m5.large
  subnetIds:
    - value: subnet-0aaa1111bbb222333
    - value: subnet-0bbb2222ccc333444
    - value: subnet-0ccc3333ddd444555
  securityGroupIds:
    - value: sg-0abc1234def567890
  authentication:
    saslIamEnabled: true
  # Topic auto-creation is off: the contract topics below are the ONLY
  # topics applications may rely on, and they deploy with the cluster.
  serverProperties:
    auto.create.topics.enable: "false"
    default.replication.factor: "3"
    min.insync.replicas: "2"
  # Declared through the MSK topic API -- no Kafka client, bootstrap
  # connectivity, or credentials needed at deploy time.
  topics:
    - name: orders.events
      partitionCount: 6
      replicationFactor: 3
      configs:
        retention.ms: "604800000"
        cleanup.policy: delete
        min.insync.replicas: "2"
    - name: orders.events.dlq
      partitionCount: 1
      replicationFactor: 3
      configs:
        retention.ms: "2592000000"
    - name: orders.snapshots
      partitionCount: 3
      replicationFactor: 3
      configs:
        cleanup.policy: compact
        min.insync.replicas: "2"
