# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_elasticache_user:
    # The nested authentication_mode block is the kind's single
    # authentication surface; the provider's three alternative input shapes
    # for the same capability (the legacy flat arms and the write-only
    # twins) are recorded exclusions, not lost function.
    exclusions:
      - arg: user_id
        reason: wired by the module from metadata.name -- the user id is platform naming, never free-form spec surface
      - arg: no_password_required
        reason: legacy flat arm superseded by authentication_mode.type "no-password-required" -- one honest authentication shape, not lost capability
      - arg: passwords
        reason: legacy flat arm superseded by authentication_mode.passwords -- one honest authentication shape, not lost capability
      - arg: passwords_wo
        reason: write-only ephemeral password variant of the covered authentication_mode.passwords -- the platform never round-trips raw credentials through manifests; the recorded write-only exclusion class
      - arg: passwords_wo_version
        reason: version companion of the excluded write-only passwords
      - arg: tags
        reason: wired by the module from metadata (user labels merged beneath the Name tag and planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
