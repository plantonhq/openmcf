apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticacheUser
metadata:
  name: <user-id>
spec:
  region: <aws-region>
  engine: redis
  # IAM auth requires userName to equal the user id (metadata.name).
  userName: <user-id>
  accessString: "on ~* +@read +@write"
  authenticationMode:
    type: iam
