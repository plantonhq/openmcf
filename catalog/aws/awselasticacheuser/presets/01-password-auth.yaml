apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticacheUser
metadata:
  name: <user-id>
spec:
  region: <aws-region>
  engine: redis
  # userName is what clients present in AUTH; it need not equal metadata.name.
  userName: <auth-user-name>
  accessString: "on ~<key-prefix>:* +@read +@write"
  authenticationMode:
    type: password
    # Passwords are sensitive: reference a managed secret ($secret/<slug>) --
    # never a plaintext value. One entry for a simple setup; add a second for
    # zero-downtime rotation.
    passwords:
      - $secret/elasticache-user-password
