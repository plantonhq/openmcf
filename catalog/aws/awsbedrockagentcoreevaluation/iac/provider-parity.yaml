      - arg: truncation
        spec: spec.harnesses.truncation.summarization.summarization_system_prompt
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface

  aws_bedrockagentcore_online_evaluation_config:
    specRoot: spec.online_evaluation_configs
    mappings:
      - arg: region
        spec: spec.region
      - arg: online_evaluation_config_name
        spec: spec.online_evaluation_configs.name
      - arg: evaluation_execution_role_arn
        spec: spec.online_evaluation_configs.execution_role_arn
      # The spec's single enabled knob fans out to the provider's TWO
      # lifecycle fields (create-time intent + post-create status).
      - arg: enable_on_create
        spec: spec.online_evaluation_configs.enabled
      - arg: execution_status
        spec: spec.online_evaluation_configs.enabled
      # The data-source wrapper's cloudwatch_logs member collapses.
      - arg: data_source_config
        spec: spec.online_evaluation_configs.data_source
      - arg: data_source_config.cloudwatch_logs
        spec: spec.online_evaluation_configs.data_source
      - arg: data_source_config.cloudwatch_logs.log_group_names
        spec: spec.online_evaluation_configs.data_source.log_group_names
      - arg: data_source_config.cloudwatch_logs.service_names
        spec: spec.online_evaluation_configs.data_source.service_names
      # The single-field evaluator block flattens to an ID list.
      - arg: evaluator
        spec: spec.online_evaluation_configs.evaluator_ids
      - arg: evaluator.evaluator_id
        spec: spec.online_evaluation_configs.evaluator_ids
      - arg: rule
        spec: spec.online_evaluation_configs.rule
      # The sampling and session wrappers flatten to their one leaf each.
      - arg: rule.sampling_config
        spec: spec.online_evaluation_configs.rule.sampling_percentage
      - arg: rule.sampling_config.sampling_percentage
        spec: spec.online_evaluation_configs.rule.sampling_percentage
      - arg: rule.session_config
        spec: spec.online_evaluation_configs.rule.session_timeout_minutes
      - arg: rule.session_config.session_timeout_minutes
        spec: spec.online_evaluation_configs.rule.session_timeout_minutes
      - arg: rule.filter
        spec: spec.online_evaluation_configs.rule.filters
      - arg: rule.filter.key
        spec: spec.online_evaluation_configs.rule.filters.key
      - arg: rule.filter.operator
        spec: spec.online_evaluation_configs.rule.filters.operator
      # The typed-value wrapper flattens onto the filter entry.
      - arg: rule.filter.value
        spec: spec.online_evaluation_configs.rule.filters
      - arg: rule.filter.value.string_value
        spec: spec.online_evaluation_configs.rule.filters.string_value
      - arg: rule.filter.value.boolean_value
        spec: spec.online_evaluation_configs.rule.filters.boolean_value
      - arg: rule.filter.value.double_value
        spec: spec.online_evaluation_configs.rule.filters.double_value
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
