# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_backup_framework:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # AWS framework names forbid hyphens (stricter than metadata.name
      # conventions), so the name is an explicit spec field.
      - arg: name
        spec: spec.framework_name
      # The provider's singular "control" block is the spec's plural
      # controls list.
      - arg: control.name
        spec: spec.controls.name
      - arg: control.input_parameter.name
        spec: spec.controls.input_parameters.name
      - arg: control.input_parameter.value
        spec: spec.controls.input_parameters.value
      - arg: control.scope.compliance_resource_ids
        spec: spec.controls.scope.compliance_resource_ids
      - arg: control.scope.compliance_resource_types
        spec: spec.controls.scope.compliance_resource_types
      - arg: control.scope.tags
        spec: spec.controls.scope.tags
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
