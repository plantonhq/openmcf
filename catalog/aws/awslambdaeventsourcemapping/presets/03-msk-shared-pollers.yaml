apiVersion: aws.planton.dev/v1alpha1
kind: AwsLambdaEventSourceMapping
metadata:
  name: orders-topic-consumer
spec:
  region: <aws-region>
  functionArn:
    valueFrom:
      kind: AwsLambda
      name: orders-processor
      fieldPath: status.outputs.function_arn
  eventSourceArn:
    valueFrom:
      kind: AwsMskCluster
      name: events-cluster
      fieldPath: status.outputs.cluster_arn
  topics:
    - orders
  startingPosition: TRIM_HORIZON
  kafkaConsumerGroupId: orders-consumers
  batchSize: 200
  maximumBatchingWindowSeconds: 5
  provisionedPollers:
    minimumPollers: 2
    maximumPollers: 50
    pollerGroupName: shared-ingest-fleet
  schemaRegistry:
    uri: <glue-schema-registry-arn>
    eventRecordFormat: JSON
    validationAttributes:
      - VALUE
  metrics:
    - EventCount
    - ErrorCount
    - KafkaMetrics
