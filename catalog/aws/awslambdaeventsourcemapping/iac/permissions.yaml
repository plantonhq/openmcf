# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: awslambdaeventsourcemapping
spec:
  aws:
    statements:
      - sid: ManageEventSourceMapping
        actions:
          - lambda:CreateEventSourceMapping
          - lambda:GetEventSourceMapping
          - lambda:UpdateEventSourceMapping
          - lambda:DeleteEventSourceMapping
          - lambda:ListEventSourceMappings
          - lambda:TagResource
          - lambda:UntagResource
          - lambda:ListTags
        resources:
          - arn:aws:lambda:*:*:event-source-mapping:*
          - arn:aws:lambda:*:*:function:*
        provenance: derived
        notes: The module is a single aws_lambda_event_source_mapping resource. CreateEventSourceMapping authorizes against the function ARN (the mapping's UUID does not exist yet), while get/update/delete/tag act on the mapping ARN -- both scopes are required.
      - sid: UseCustomerManagedKey
        actions:
          - kms:DescribeKey
          - kms:CreateGrant
        resources:
          - arn:aws:kms:*:*:key/*
        provenance: derived
        notes: Required only when kms_key_arn references a customer-managed key for filter-criteria encryption -- Lambda grants itself decrypt access through the configuring principal. Scope to the actual key ARN in a hardened deployment.
