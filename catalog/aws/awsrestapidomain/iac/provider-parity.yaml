# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_api_gateway_domain_name:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The certificate reference fans in by endpoint type: EDGE and
      # PRIVATE domains take certificate_arn (matched by exact name; the
      # SDK documents that argument as "edge-optimized endpoint or
      # private endpoint"), REGIONAL domains take
      # regional_certificate_arn -- ONE spec field, wired to the right
      # argument by the modules.
      - arg: regional_certificate_arn
        spec: spec.certificate_arn
      # Uploaded certificate material follows the same fan-in
      # (certificate_name for EDGE/PRIVATE, regional_certificate_name
      # for REGIONAL).
      - arg: certificate_name
        spec: spec.uploaded_certificate.name
      - arg: regional_certificate_name
        spec: spec.uploaded_certificate.name
      - arg: certificate_body
        spec: spec.uploaded_certificate.body
      - arg: certificate_chain
        spec: spec.uploaded_certificate.chain
      - arg: certificate_private_key
        spec: spec.uploaded_certificate.private_key
      # The provider's max-1 types list is a singular choice.
      - arg: endpoint_configuration.types
        spec: spec.endpoint_configuration.type
      - arg: mutual_tls_authentication
        spec: spec.mutual_tls
      - arg: mutual_tls_authentication.truststore_uri
        spec: spec.mutual_tls.truststore_uri
      - arg: mutual_tls_authentication.truststore_version
        spec: spec.mutual_tls.truststore_version
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  aws_api_gateway_base_path_mapping:
    specRoot: spec.base_path_mappings
    mappings:
      - arg: region
        spec: spec.region
      - arg: api_id
        spec: spec.base_path_mappings.rest_api_id
    exclusions:
      - arg: domain_name
        reason: module-wired parent linkage to the domain created in the same plan
      - arg: domain_name_id
        reason: wired by the module from its own created domain on PRIVATE endpoints (AWS permits many private domains sharing one hostname account-wide, so the name alone is ambiguous there) -- never free-form user surface

  aws_api_gateway_domain_name_access_association:
    specRoot: spec.access_associations
    mappings:
      - arg: region
        spec: spec.region
      - arg: access_association_source
        spec: spec.access_associations.vpc_endpoint_id
    exclusions:
      - arg: domain_name_arn
        reason: module-wired parent linkage to the domain created in the same plan
      - arg: access_association_source_type
        reason: VPCE is the only source type at the pin -- the module sends the constant; a second type becomes spec surface when AWS ships one
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
