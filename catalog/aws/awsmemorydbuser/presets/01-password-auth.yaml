apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbUser
metadata:
  # metadata.name IS the AWS user name -- the AUTH identity ACLs reference.
  name: <user-name>
spec:
  region: <aws-region>
  accessString: "on ~<key-prefix>:* +@read +@write"
  authenticationMode:
    type: password
    # Passwords are sensitive: reference a managed secret ($secret/<slug>) --
    # never a plaintext value. One entry for a simple setup; add a second for
    # zero-downtime rotation.
    passwords:
      - $secret/memorydb-user-password
