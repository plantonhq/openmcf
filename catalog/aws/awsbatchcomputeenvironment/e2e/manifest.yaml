apiVersion: aws.planton.dev/v1alpha1
kind: AwsBatchComputeEnvironment
metadata:
  name: test-batch
  id: test-batch
  org: test-org
  env: dev
  annotations:
    planton.dev/provisioner: pulumi
spec:
  region: us-west-2
  computeResources:
    type: FARGATE
    maxVcpus: 256
    subnetIds:
      - value: subnet-0a1b2c3d4e5f00001
      - value: subnet-0a1b2c3d4e5f00002
    securityGroupIds:
      - value: sg-0a1b2c3d4e5f00001
