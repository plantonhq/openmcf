apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreGateway
metadata:
  name: my-partner-gateway
spec:
  region: us-west-2
  description: JWT-authorized gateway calling a partner API with vaulted OAuth
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: my-gateway-role
      fieldPath: status.outputs.role_arn
  authorizerType: CUSTOM_JWT
  customJwtAuthorizer:
    discoveryUrl: https://idp.example.com/.well-known/openid-configuration
    allowedAudience:
      - agents
  mcp:
    instructions: Tools for the partner CRM.
    enableSemanticSearch: true
    sessionTimeoutSeconds: 1800
  targets:
    - name: partner-crm
      description: The partner CRM's MCP server
      backend:
        mcpServer:
          endpoint: https://mcp.partner.example.com/mcp
          listingMode: DYNAMIC
      credentials:
        oauth:
          providerArn:
            valueFrom:
              kind: AwsBedrockAgentCoreIdentity
              name: my-agent-identity
              fieldPath: status.outputs.oauth2_provider_arns.partner-crm
          scopes:
            - crm.read
          grantType: CLIENT_CREDENTIALS
