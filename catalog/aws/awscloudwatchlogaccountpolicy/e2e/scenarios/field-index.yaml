# An account-wide field-index policy live, narrowed by selection
# criteria to an E2E prefix so it never touches real log groups. Field
# index policies are free; the account allows one policy per type, so
# this lane must never run concurrently with another FIELD_INDEX_POLICY
# lane in the region (run-scoped criteria keep the blast radius zero
# either way).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchLogAccountPolicy
metadata:
  name: planton-oss-e2e-awscwlap-fi
  id: planton-oss-e2e-awscwlap-fi
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awscloudwatchlogaccountpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  policyName: planton-oss-e2e-awscwlap-fi
  policyType: FIELD_INDEX_POLICY
  policyDocument:
    Fields:
      - requestId
      - sourceIp
  selectionCriteria: LogGroupNamePrefix IN ["/planton-e2e/absent"]
