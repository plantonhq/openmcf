apiVersion: aws.planton.dev/v1alpha1
kind: AwsRestApiVpcLink
metadata:
  name: my-shared-backend-link
spec:
  region: <aws-region>
  description: Shared NLB attachment for every REST API in this VPC
  targetArn:
    valueFrom:
      kind: AwsNlb
      name: <shared-internal-nlb>
      fieldPath: status.outputs.load_balancer_arn
