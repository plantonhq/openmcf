apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreMemory
metadata:
  name: my-agent-episodic-memory
spec:
  region: us-west-2
  memoryName: my_agent_episodic
  description: Episodic memory with analytics streaming
  eventExpiryDays: 90
  executionRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: my-memory-role
      fieldPath: status.outputs.role_arn
  indexedKeys:
    - key: customer_id
      type: STRING
  strategies:
    - name: episodes
      type: EPISODIC
      description: Experience episodes with reflection
      namespaceTemplates:
        - /episodes/{actorId}
      # Reflection namespaces must equal, or be a whole-segment prefix
      # of, a namespaceTemplates entry (AWS rejects the mismatch with a
      # 400) - "/episodes" consolidates reflections across all actors'
      # episode namespaces.
      reflectionNamespaceTemplates:
        - /episodes
  kinesisDelivery:
    dataStreamArn:
      valueFrom:
        kind: AwsKinesisStream
        name: my-memory-analytics
        fieldPath: status.outputs.stream_arn
    contentLevel: METADATA_ONLY
