apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsbedrockagentcorememory
spec:
  # An AgentCore memory under live E2E: two lanes (memories bill per
  # stored event and retrieval -- an empty memory costs ~nothing; record
  # the first live at-rest datapoint in this profile). The minimal lane
  # proves the create -> ACTIVE lifecycle. The full-surface lane adds
  # indexed keys and all four built-in strategy types incl. EPISODIC with
  # reflection namespaces -- proving the strategy satellites' serialized
  # attach through the parent memory (AWS serializes strategy writes per
  # memory; strategy operations can take tens of minutes, hence the
  # raised timeout). Verification is GetMemory keyed on memory_id (status
  # ACTIVE) plus the per-strategy echoes.
  #
  # Deliberately not exercised live: the CUSTOM strategy override arm
  # (its extraction/consolidation models must be strategy-capable models
  # the account can invoke -- an unverified vocabulary at the pin;
  # offline-proven arm-for-arm via e2e/manifest.yaml -- unblock: a $0
  # probe of CreateMemoryStrategy with a nova/claude model settles the
  # vocabulary, then extend the full-surface scenario), Kinesis stream
  # delivery (needs a Kinesis fixture and the execution role's write
  # grant -- unblock: compose the AwsKinesisStream install profile via
  # the e2e-prerequisites annotation), and the KMS encryption arm
  # (ForceNew; offline-proven).
  #
  # pending_proof: forged this session to the full offline bar -- Q35
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 60
