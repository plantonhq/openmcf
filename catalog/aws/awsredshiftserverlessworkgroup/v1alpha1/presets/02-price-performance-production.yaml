apiVersion: aws.planton.dev/v1alpha1
kind: AwsRedshiftServerlessWorkgroup
metadata:
  name: my-analytics-prod
spec:
  region: us-west-2
  namespaceName:
    valueFrom:
      kind: AwsRedshiftServerlessNamespace
      name: my-analytics-data
      fieldPath: status.outputs.namespace_name
  pricePerformanceTarget:
    enabled: true
    level: 50
  maxCapacity: 512
  subnetIds:
    - value: "<private-subnet-id-az1>"
    - value: "<private-subnet-id-az2>"
    - value: "<private-subnet-id-az3>"
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: my-warehouse-sg
        fieldPath: status.outputs.security_group_id
  enhancedVpcRouting: true
  configParameters:
    - name: require_ssl
      value: "true"
    - name: max_query_execution_time
      value: "14400"
