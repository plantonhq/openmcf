apiVersion: aws.planton.dev/v1alpha1
kind: AwsRdsInstance
metadata:
  name: my-oracle-enterprise
spec:
  region: us-west-2
  subnetIds:
    - value: subnet-replace-with-private-az1
    - value: subnet-replace-with-private-az2
  securityGroupIds:
    - value: sg-replace-with-database-sg
  engine: oracle-ee
  # Inline parameters and options both derive their group identity from
  # the pinned engine + version (oracle-ee-19).
  engineVersion: "19.0.0.0.ru-2025-04.rur-2025-04.r1"
  # Oracle EE on RDS runs bring-your-own-license; oracle-se2 offers
  # license-included.
  licenseModel: bring-your-own-license
  characterSetName: AL32UTF8
  ncharCharacterSetName: AL16UTF16
  instanceClass: db.r6i.large
  allocatedStorageGb: 200
  maxAllocatedStorageGb: 500
  storageType: gp3
  storageEncrypted: true # recommended_default -- create-time-only, cannot be enabled later
  username: dbadmin # AWS has no default master username -- pick one (avoid reserved names like rdsadmin)
  manageMasterUserPassword: true # recommended_default -- AWS generates, stores, and rotates the password in Secrets Manager
  multiAz: true
  # Instance-owned parameter group: engine tunables as reviewable spec,
  # applied through a group this instance owns.
  parameters:
    - name: open_cursors
      value: "1000"
      applyMethod: immediate
  # Instance-owned option group: engine features activated as a named
  # option list. STATSPACK is the classic performance-diagnostics pack;
  # TDE (Transparent Data Encryption) is the EE at-rest encryption
  # option for regulated data.
  options:
    - optionName: STATSPACK
    - optionName: TDE
  backupRetentionPeriod: 14
  deletionProtection: true
  skipFinalSnapshot: false
  finalSnapshotIdentifier: my-oracle-enterprise-final
