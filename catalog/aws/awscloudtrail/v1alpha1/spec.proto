syntax = "proto3";

package dev.planton.aws.awscloudtrail.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsCloudTrailSpec defines the desired configuration for an AWS
// CloudTrail trail - the account's API audit log.
//
// A trail records AWS API calls (management events, and optionally
// data and Insights events) and delivers them as log files to an S3
// bucket, with optional fan-out to CloudWatch Logs and SNS. The trail
// name is metadata.name (AWS requires 3-128 characters: letters,
// digits, '.', '-', '_'; it must start and end with a letter or
// digit).
//
// The delivery bucket must carry a bucket POLICY granting
// "cloudtrail.amazonaws.com" s3:PutObject on the trail's prefix and
// s3:GetBucketAcl on the bucket - AWS rejects trail creation without
// it ("Incorrect S3 bucket policy is detected"). The policy lives on
// the bucket (AwsS3Bucket spec.policy), not on this component.
//
// Destroying this component deletes the trail (a real delete); the
// delivered log files stay in the bucket.
message AwsCloudTrailSpec {
  // The AWS region the trail lives in (its "home region"). A
  // multi-region trail still has exactly one home region - manage it
  // from there.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The S3 bucket that receives the trail's log files. The bucket
  // needs the CloudTrail service-principal bucket policy (see the
  // message comment) BEFORE the trail is created.
  dev.planton.shared.foreignkey.v1.StringValueOrRef s3_bucket_name = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsS3Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // Key prefix for the delivered log files inside the bucket
  // (logs land under "<prefix>/AWSLogs/<account-id>/...").
  string s3_key_prefix = 3 [(buf.validate.field).string.max_len = 2000];

  // Record API activity in ALL regions, not just the home region.
  // The posture AWS recommends for audit trails - a single-region
  // trail misses activity everywhere else.
  bool is_multi_region_trail = 4;

  // Record global-service events (IAM, STS, CloudFront). Unset =
  // enabled (the AWS default). Disable only when another trail
  // already captures them - duplicate global events double storage.
  optional bool include_global_service_events = 5;

  // Capture activity from EVERY account in the AWS Organization into
  // this one trail. Requires running in the organization's management
  // account (or its delegated CloudTrail administrator - see
  // organization_delegated_admin_account_id) with all-features
  // organizations enabled.
  bool is_organization_trail = 6;

  // Start delivering events as soon as the trail exists. Unset =
  // logging on (the AWS default). Set false to create the trail
  // stopped (e.g. staging a trail before cutover).
  optional bool enable_logging = 7;

  // Write a digest file every hour so log tampering is detectable
  // (SHA-256 chain over delivered files). Audit-grade trails want
  // this on.
  bool enable_log_file_validation = 8;

  // KMS key that encrypts the delivered log files (SSE-KMS instead of
  // SSE-S3). The key policy must allow CloudTrail to encrypt with it
  // ("Allow CloudTrail to encrypt logs" grant for
  // cloudtrail.amazonaws.com). Unset = SSE-S3.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_id = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // SNS topic notified on every log-file delivery (the topic policy
  // must allow cloudtrail.amazonaws.com to publish). Unset = no
  // notifications.
  dev.planton.shared.foreignkey.v1.StringValueOrRef sns_topic_name = 10 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSnsTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_name"
  ];

  // Mirror events to a CloudWatch Logs group for live querying and
  // metric filters (S3 delivery continues regardless). AWS requires
  // the group and the delivery role TOGETHER - presence of this
  // message wires both.
  AwsCloudTrailCloudwatchLogs cloudwatch_logs = 11;

  // Classic event selectors: management-event scope plus coarse data
  // events for S3 objects, Lambda functions, and DynamoDB tables. At
  // most 5. Mutually exclusive with advanced_event_selectors - AWS
  // keeps exactly one selector style per trail.
  repeated AwsCloudTrailEventSelector event_selectors = 12 [(buf.validate.field).repeated.max_items = 5];

  // Advanced event selectors: fine-grained field matching (eventName,
  // resources.ARN prefixes, eventCategory, ...) over management, data,
  // and network-activity events. The style AWS recommends for new
  // trails. Mutually exclusive with event_selectors.
  repeated AwsCloudTrailAdvancedEventSelector advanced_event_selectors = 13;

  // CloudTrail Insights engines to run on this trail: anomaly
  // detection over call rates and error rates. Insights events bill
  // separately.
  repeated string insight_types = 14 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "ApiCallRateInsight",
          "ApiErrorRateInsight"
        ]
      }
    }
  }];

  // Register this AWS account ID as the organization's delegated
  // CloudTrail administrator - an ACCOUNT-GLOBAL act (one delegation
  // per organization, performed from the management account), kept
  // here because it exists to run organization trails from a member
  // account. Most deployments leave this unset. The delegation is
  // deregistered on destroy.
  string organization_delegated_admin_account_id = 15 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[0-9]{12}$"
  ];

  // AWS keeps exactly one selector style per trail.
  option (buf.validate.message).cel = {
    id: "one_selector_style"
    message: "event_selectors and advanced_event_selectors are mutually exclusive - pick one style"
    expression: "size(this.event_selectors) == 0 || size(this.advanced_event_selectors) == 0"
  };

  // An organization trail only works from the management or delegated
  // admin account, and delegation itself requires an organization
  // trail posture - delegating from a trail that is not an
  // organization trail configures nothing.
  option (buf.validate.message).cel = {
    id: "delegated_admin_requires_org_trail"
    message: "organization_delegated_admin_account_id requires is_organization_trail = true"
    expression: "this.organization_delegated_admin_account_id == '' || this.is_organization_trail"
  };
}

// AwsCloudTrailCloudwatchLogs mirrors trail events to a CloudWatch
// Logs group. AWS requires BOTH the group and the role: the role must
// trust "cloudtrail.amazonaws.com" and allow logs:CreateLogStream +
// logs:PutLogEvents on the group.
message AwsCloudTrailCloudwatchLogs {
  // The CloudWatch Logs group ARN. AWS expects the ":*" suffix form
  // (e.g. "arn:aws:logs:us-west-2:123456789012:log-group:my-trail:*");
  // both engines append ":*" when the referenced value lacks it.
  dev.planton.shared.foreignkey.v1.StringValueOrRef log_group_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCloudwatchLogGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.log_group_arn"
  ];

  // The IAM role CloudTrail assumes to write into the group.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];
}

// AwsCloudTrailEventSelector is one classic selector: which
// management events to record, plus coarse data-event scopes.
message AwsCloudTrailEventSelector {
  // Which API calls to record. Unset = "All".
  string read_write_type = 1 [(buf.validate.field).string = {
    in: [
      "",
      "ReadOnly",
      "WriteOnly",
      "All"
    ]
  }];

  // Record management events (control-plane calls). Unset = enabled
  // (the AWS default); disabling leaves only the data events below.
  optional bool include_management_events = 2;

  // Management-event sources to EXCLUDE (only "kms.amazonaws.com" and
  // "rdsdata.amazonaws.com" are accepted by AWS) - high-volume
  // sources that drown audit logs.
  repeated string exclude_management_event_sources = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "kms.amazonaws.com",
          "rdsdata.amazonaws.com"
        ]
      }
    }
  }];

  // Data-event scopes: which objects/functions/tables to record
  // data-plane activity for. Data events bill per event - scope
  // deliberately.
  repeated AwsCloudTrailDataResource data_resources = 4;
}

// AwsCloudTrailDataResource is one classic data-event scope.
message AwsCloudTrailDataResource {
  // The data-resource type.
  string type = 1 [(buf.validate.field).string = {
    in: [
      "AWS::DynamoDB::Table",
      "AWS::Lambda::Function",
      "AWS::S3::Object"
    ]
  }];

  // ARN scopes: e.g. "arn:aws:s3:::my-bucket/" records every object
  // in the bucket; "arn:aws:s3" records ALL buckets;
  // "arn:aws:lambda" records all functions.
  repeated string values = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 250
  }];
}

// AwsCloudTrailAdvancedEventSelector is one advanced selector: a
// named AND-set of field conditions. An event is recorded when EVERY
// field selector matches; multiple advanced selectors OR together.
message AwsCloudTrailAdvancedEventSelector {
  // Display name for the selector (shown in the CloudTrail console).
  string name = 1 [(buf.validate.field).string.max_len = 1000];

  // The AND-set of field conditions. Every advanced selector needs at
  // least a field selector on "eventCategory" (AWS rejects selectors
  // without one).
  repeated AwsCloudTrailFieldSelector field_selectors = 2 [(buf.validate.field).repeated.min_items = 1];
}

// AwsCloudTrailFieldSelector is one field condition inside an
// advanced selector.
message AwsCloudTrailFieldSelector {
  // The event field to match.
  string field = 1 [(buf.validate.field).string = {
    in: [
      "errorCode",
      "eventCategory",
      "eventName",
      "eventSource",
      "eventType",
      "readOnly",
      "resources.ARN",
      "resources.type",
      "sessionCredentialFromConsole",
      "userIdentity.arn",
      "vpcEndpointId"
    ]
  }];

  // Exact-match values (OR within the list).
  repeated string equals = 2;

  // Exact-mismatch values.
  repeated string not_equals = 3;

  // Prefix-match values.
  repeated string starts_with = 4;

  // Prefix-mismatch values.
  repeated string not_starts_with = 5;

  // Suffix-match values.
  repeated string ends_with = 6;

  // Suffix-mismatch values.
  repeated string not_ends_with = 7;

  // AWS requires each field selector to carry at least one condition
  // list.
  option (buf.validate.message).cel = {
    id: "field_selector_has_condition"
    message: "set at least one of equals, not_equals, starts_with, not_starts_with, ends_with, not_ends_with"
    expression: "size(this.equals) + size(this.not_equals) + size(this.starts_with) + size(this.not_starts_with) + size(this.ends_with) + size(this.not_ends_with) > 0"
  };
}
