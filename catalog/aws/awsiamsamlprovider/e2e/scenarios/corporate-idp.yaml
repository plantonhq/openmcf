  id: planton-oss-e2e-awssaml
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsiamsamlprovider
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
