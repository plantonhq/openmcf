# The full provider surface live: a SAML trust anchor created from a
# structurally realistic metadata stand-in (over AWS's 1000-character
# floor; IAM validates structure, not the certificate chain). IAM is
# free and global; provider names free immediately on delete, so the
# name is fixed. ~$0.
