# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_fsx_windows_file_system:
    mappings:
      # The provider counts capacity in a bare "storage_capacity"; the spec
      # names the unit (GiB) per the catalog convention.
      - spec: spec.storage_capacity_gib
        arg: storage_capacity

      # The provider passes the Secrets Manager reference as a bare
      # "...secret"; the spec names what the string IS (an ARN) per the
      # catalog convention.
      - spec: spec.self_managed_active_directory.domain_join_service_account_secret_arn
        arg: self_managed_active_directory.domain_join_service_account_secret

    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
      - arg: self_managed_active_directory.password_wo
        reason: Terraform write-only argument (never persisted to state) -- an engine-specific alternative delivery path for the modeled password, not additional configuration surface
      - arg: self_managed_active_directory.password_wo_version
        reason: version counter for the write-only password argument -- exists only to trigger updates of password_wo, carries no configuration of its own
