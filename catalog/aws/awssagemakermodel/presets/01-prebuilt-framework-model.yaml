apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerModel
metadata:
  name: my-sklearn-model
spec:
  region: us-west-2
  executionRoleArn:
    value: arn:aws:iam::123456789012:role/sagemaker-execution
  primaryContainer:
    image: 746614075791.dkr.ecr.us-west-2.amazonaws.com/sagemaker-scikit-learn:1.2-1
    modelDataUrl: s3://my-models/sklearn/model.tar.gz
    environment:
      SAGEMAKER_PROGRAM: inference.py
