syntax = "proto3";

package dev.planton.aws.awsapigatewayaccountsettings.v1alpha1;

import "catalog/aws/awsapigatewayaccountsettings/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsApiGatewayAccountSettingsStackInput is the input for the IaC
// modules that manage the region's API Gateway account settings.
message AwsApiGatewayAccountSettingsStackInput {
  // target is the AwsApiGatewayAccountSettings resource to deploy.
  AwsApiGatewayAccountSettings target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
