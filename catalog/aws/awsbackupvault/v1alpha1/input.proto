syntax = "proto3";

package dev.planton.aws.awsbackupvault.v1alpha1;

import "catalog/aws/awsbackupvault/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBackupVaultStackInput is the input for the IaC modules that
// manage an AWS Backup vault.
message AwsBackupVaultStackInput {
  // target is the AwsBackupVault resource to deploy.
  AwsBackupVault target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
