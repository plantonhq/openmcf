syntax = "proto3";

package dev.planton.aws.awscognitoresourceserver.v1alpha1;

import "catalog/aws/awscognitoresourceserver/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCognitoResourceServerStackInput is the input for the
// aws-cognito-resource-server IaC modules.
message AwsCognitoResourceServerStackInput {
