# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_dsql_cluster:
    mappings:
      # The multi-region arm nests under spec.multi_region.
      - arg: multi_region_properties.witness_region
        spec: spec.multi_region.witness_region
    exclusions:
      - arg: multi_region_properties.clusters
        reason: wired by the module through the folded peering resource -- the peer list lands via the one-shot pairing call, never a second declaration on the cluster itself
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
  aws_dsql_cluster_peering:
    mappings:
      # The pairing folds in as the spec.multi_region arm.
      - arg: clusters
        spec: spec.multi_region.peer_cluster_arns
      - arg: witness_region
        spec: spec.multi_region.witness_region
    exclusions:
      - arg: identifier
        reason: wired by the module to the folded cluster's own AWS-generated identifier -- the pairing always configures THIS cluster
