apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53DnsRecord
metadata:
  name: my-alb-dns-record
spec:
  region: us-east-1
  zoneId:
    value: "<route53-hosted-zone-id>"
  name: app.example.com  # replace with your record's fully qualified name
  type: A
  aliasTarget:
    dnsName:
      value: "<alb-dns-name>"
    zoneId:
      value: "<alb-hosted-zone-id>"
    evaluateTargetHealth: true  # Recommended for ALB health monitoring
