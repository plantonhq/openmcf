apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awscognitouserpoolclient
spec:
  # An app client under live E2E: the registry-declared AwsCognitoUserPool
  # prerequisite deploys first (seconds), then the client proves create,
  # verify (DescribeUserPoolClient on the composite pool-id/client-id
  # identity), destroy, and verify-destroyed on both provisioners. The lane
  # exercises the confidential arm (generate_secret), OAuth code flow,
  # unit-carrying token lifetimes, and refresh-token rotation with the
  # EXPLICIT-ZERO grace period (the tri-state repair's newly expressible
  # state). Pinpoint analytics is excluded (needs a Pinpoint project); the
  # client-scoped risk-configuration arm is excluded (requires the pool's
  # PLUS-tier threat protection -- billing posture unverified); wiring for
  # both is proven by the offline gate.
  #
  # pending_proof: the Cognito family depth closure presence-typed the
  # rotation grace period (Terraform previously forced an unset field to
  # explicit 0 -- grace silently disabled), converged three Pulumi
  # only-when-true sends (generate_secret, allowed_oauth_flows_user_pool_client,
  # analytics user_data_shared now state-pinned), and folded the
  # client-scoped risk configuration -- the live lane must re-prove both
  # engines at the new surface.
  tier: 1
  status: pending_proof
  timeout_minutes: 20
