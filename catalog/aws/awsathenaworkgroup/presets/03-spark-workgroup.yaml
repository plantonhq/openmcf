apiVersion: aws.planton.dev/v1alpha1
kind: AwsAthenaWorkgroup
metadata:
  name: spark-notebooks
spec:
  region: us-west-2
  description: PySpark notebook workgroup with encrypted session content
  resultConfiguration:
    outputLocation: "s3://spark-results/notebooks/"
    encryptionOption: SSE_S3
  executionRole:
    value: "arn:aws:iam::123456789012:role/AthenaSparkExecutionRole-REPLACE-ME"
  customerContentEncryptionKmsKey:
    value: "arn:aws:kms:us-east-1:123456789012:key/mrk-REPLACE-ME"
  selectedEngineVersion: "PySpark engine version 3"
  forceDestroy: true
