apiVersion: aws.planton.dev/v1alpha1
kind: AwsAthenaWorkgroup
metadata:
  name: prod-analytics
spec:
  region: us-west-2
  description: Production analytics workgroup with enforced encryption and cost controls
  resultConfiguration:
    outputLocation: "s3://prod-athena-results/queries/"
    encryptionOption: SSE_KMS
    kmsKeyArn:
      value: "arn:aws:kms:us-east-1:123456789012:key/mrk-REPLACE-ME"
  bytesScannedCutoffPerQuery: 10737418240
  enforceWorkgroupConfiguration: true
  publishCloudwatchMetricsEnabled: true
  enableMinimumEncryptionConfiguration: true
  selectedEngineVersion: "Athena engine version 3"
