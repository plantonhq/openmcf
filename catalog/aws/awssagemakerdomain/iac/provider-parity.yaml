# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The mapping tables below encode the spec's systematic renames against the
# provider tree: the app_lifecycle_management wrapper is unwrapped (the spec
# folds idle_settings directly under each app-settings block), repeated
# blocks are pluralized (custom_image -> custom_images, code_repository ->
# code_repositories, custom_file_system_config -> custom_file_system_configs),
# single-purpose wrappers are flattened (domain_settings.*, retention_policy,
# the Canvas status wrappers, default_ebs_storage_settings), and role/group
# fields carry the catalog's _arn/_ids naming.

