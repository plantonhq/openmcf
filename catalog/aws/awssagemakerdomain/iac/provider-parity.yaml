      # manifest level.
      - arg: domain_name
        reason: derived from metadata.name (create-time-immutable) -- never free-form user surface
      # Tag machinery.
      - arg: tags
        reason: wired by the module from metadata (the planton.ai identity keys; no Name tag -- the domain carries its own name argument) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

