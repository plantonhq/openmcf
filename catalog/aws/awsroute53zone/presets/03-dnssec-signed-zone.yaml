apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53Zone
metadata:
  # metadata.name IS the zone's domain name (create-time immutable).
  name: <domain-name>
spec:
  region: <aws-region>
  isPrivate: false  # DNSSEC signing is a public-zone feature
  dnssec:
    # The KMS key MUST live in us-east-1, be asymmetric ECC_NIST_P256 with
    # SIGN_VERIFY usage, and allow dnssec-route53.amazonaws.com in its key
    # policy (kms:DescribeKey, kms:GetPublicKey, kms:Sign, kms:CreateGrant).
    kmsKeyArn:
      valueFrom:
        name: <kms-key-name>  # an AwsKmsKey meeting the requirements above
    keySigningKeyStatus: ACTIVE  # INACTIVE is the diagnostics lever: signatures stop refreshing while the key is deactivated
