syntax = "proto3";

package dev.planton.aws.awscloudwatchsynthetics.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsCloudwatchSyntheticsSpec defines CloudWatch Synthetics resources:
// a CANARY (a scheduled scripted probe - a Synthetics-managed Lambda
// that runs your script from an S3-staged code bundle and writes run
// artifacts to S3) and/or owned GROUPS (name-and-tags containers the
// console uses to aggregate canary results).
//
// Two independently deployable arms: a canary instance monitors an
// endpoint (optionally joining groups by name); a groups-only instance
// manages shared groups for many canaries. Group joins reference the
// group NAME, so shared groups are referenced, never fought over.
//
// The canary's name is metadata.name (lowercase letters, digits,
// hyphens, underscores - the canary charset). Renaming replaces the
// canary. AWS deletes and recreates a canary that lands in
// CREATE_FAILED - reprovisioning is the only repair AWS offers.
message AwsCloudwatchSyntheticsSpec {
  // At least one arm must be configured.
  option (buf.validate.message).cel = {
    id: "spec.at_least_one_arm"
    message: "configure a canary, at least one owned group, or both - an empty spec manages nothing"
    expression: "has(this.canary) || this.groups.size() > 0"
  };
  // Group joins hang off the canary arm.
  option (buf.validate.message).cel = {
    id: "spec.joins_require_canary"
    message: "group_names associates THIS canary with groups - configure the canary arm or drop the joins"
    expression: "this.group_names.size() == 0 || has(this.canary)"
  };
  // Owned group names key the for_each entries in both engines.
  option (buf.validate.message).cel = {
    id: "spec.group_names_unique"
    message: "groups entries must have unique names"
    expression: "this.groups.map(g, g.name).unique()"
  };

  // The AWS region the canary and groups live in. Example:
  // "us-east-1".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The canary arm: one scripted probe.
  AwsSyntheticsCanary canary = 2;

  // Owned groups - each entry creates one Synthetics group this
  // instance owns. Groups shared by many canaries belong in ONE
  // owning instance; other instances join them via group_names.
  repeated AwsSyntheticsGroup groups = 3;

  // Groups THIS canary joins, by group name - owned groups from this
  // spec or groups that exist elsewhere. Group names are user-chosen
  // (never cloud-generated), so literal names compose across chart
  // instances.
  repeated string group_names = 4 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

// AwsSyntheticsGroup is one owned Synthetics group.
message AwsSyntheticsGroup {
  // The group's name in AWS (its identity - renaming replaces the
  // group). Also the key for the outputs maps.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// AwsSyntheticsCanary is the canary arm: the probe's code, schedule,
// runtime sizing, network placement, and artifact handling.
message AwsSyntheticsCanary {
  // Artifact-encryption KMS keys only pair with the SSE_KMS mode.
  option (buf.validate.message).cel = {
    id: "canary.kms_requires_sse_kms"
    message: "artifact_encryption_kms_key_arn requires artifact_encryption_mode SSE_KMS"
    expression: "!has(this.artifact_encryption_kms_key_arn) || this.artifact_encryption_mode == 'SSE_KMS'"
  };

  // The S3 bucket receiving run artifacts (screenshots, HAR files,
  // logs). Reference an AwsS3Bucket bucket_id output or pass a literal
  // bucket name.
  dev.planton.shared.foreignkey.v1.StringValueOrRef artifact_bucket = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsS3Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // Key prefix inside the artifact bucket ("canary/prod" stores under
  // s3://bucket/canary/prod/). Unset stores at the bucket root.
  string artifact_prefix = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // The role the canary's Lambda executes under. Needs the canary
  // permissions AWS documents (s3:PutObject on the artifact bucket,
  // logs, cloudwatch:PutMetricData, ...). Reference an AwsIamRole
  // role_arn output or pass a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef execution_role_arn = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // The script's entry point. For Node.js runtimes
  // "<fileName>.handler" where the file sits at
  // nodejs/node_modules/<fileName>.js inside the code bundle; for
  // Python, "<fileName>.<functionName>" under python/.
  string handler = 4 [(buf.validate.field).string.min_len = 1];

  // The Synthetics runtime the script runs on (e.g.
  // "syn-nodejs-puppeteer-9.1", "syn-python-selenium-4.1"). Runtimes
  // deprecate on AWS's schedule - upgrading is an in-place update.
  string runtime_version = 5 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^syn-.+$"
  }];

  // The canary's code bundle: a zip staged in S3, laid out per the
  // runtime's convention (nodejs/node_modules/<file>.js for Node.js,
  // python/<file>.py for Python). Local-path uploads are deliberately
  // not modeled - stage code through a bucket (an AwsS3ObjectSet
  // carries small bundles inline as base64).
  AwsSyntheticsCanaryCode code = 6 [(buf.validate.field).required = true];

  // When the canary runs.
  AwsSyntheticsCanarySchedule schedule = 7 [(buf.validate.field).required = true];

  // Per-run sizing and environment. Unset keeps every AWS default.
  AwsSyntheticsCanaryRunConfig run_config = 8;

  // VPC placement for canaries probing private endpoints. Unset runs
  // the canary outside any VPC (public probing).
  AwsSyntheticsCanaryVpcConfig vpc_config = 9;

  // How run artifacts are encrypted at rest in S3. Unset keeps AWS's
  // default (SSE_S3-managed keys).
  string artifact_encryption_mode = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "SSE_S3",
        "SSE_KMS"
      ]
    }
  ];

  // The customer-managed key for SSE_KMS artifact encryption.
  // Reference an AwsKmsKey key_arn output or pass a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef artifact_encryption_kms_key_arn = 11 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // Days to retain failing-run artifacts (1-455). Unset keeps AWS's
  // default (31).
  optional int32 failure_retention_period = 12 [(buf.validate.field).int32 = {
    gte: 1
    lte: 455
  }];

  // Days to retain successful-run artifacts (1-455). Unset keeps
  // AWS's default (31).
  optional int32 success_retention_period = 13 [(buf.validate.field).int32 = {
    gte: 1
    lte: 455
  }];

  // Start the canary's schedule after create/update. False creates
  // the canary READY but not running - runs (and their Lambda/S3
  // costs) only begin once started.
  bool start_canary = 14;

  // On destroy, also delete the Synthetics-managed Lambda behind the
  // canary. False (AWS's default) leaves the Lambda behind for
  // forensics - set true for a clean teardown.
  bool delete_lambda = 15;
}

// AwsSyntheticsCanaryCode locates the canary's code bundle in S3.
message AwsSyntheticsCanaryCode {
  // The bucket holding the code zip. Reference an AwsS3Bucket
  // bucket_id output or pass a literal bucket name.
  dev.planton.shared.foreignkey.v1.StringValueOrRef s3_bucket = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsS3Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // The zip's object key.
  string s3_key = 2 [(buf.validate.field).string.min_len = 1];

  // A specific object version of the zip (versioned buckets). Unset
  // uses the latest.
  string s3_version = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// AwsSyntheticsCanarySchedule is the canary's run cadence.
message AwsSyntheticsCanarySchedule {
  // A rate ("rate(5 minutes)", "rate(1 hour)") or cron
  // ("cron(0 8 * * ? *)") expression. "rate(0 minute)" means run once
  // per manual start.
  string expression = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^(rate\\(.+\\)|cron\\(.+\\))$"
  }];

  // How long the canary keeps running per schedule activation, in
  // seconds. Unset runs the script once per activation.
  int64 duration_in_seconds = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // Automatic retries after a failed run (0-2). Unset keeps AWS's
  // default (no retries). Presence-typed so an explicit 0 is
  // expressible.
  optional int32 max_retries = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 2
  }];
}

// AwsSyntheticsCanaryRunConfig sizes each canary run.
message AwsSyntheticsCanaryRunConfig {
  // Memory must land on Lambda's 64MB granularity at or above
  // Synthetics' 960MB floor.
  option (buf.validate.message).cel = {
    id: "run_config.memory_shape"
    message: "memory_in_mb must be a multiple of 64 and at least 960"
    expression: "!has(this.memory_in_mb) || (this.memory_in_mb >= 960 && this.memory_in_mb % 64 == 0)"
  };

  // Enable AWS X-Ray tracing for the canary's runs (supported
  // runtimes only; adds Lambda tracing cost).
  bool active_tracing = 1;

  // Environment variables the script reads at run time. Keys and
  // values land in the Synthetics-managed Lambda - AWS does not
  // return them on reads, so treat them as write-only configuration
  // and never put secrets here (use Secrets Manager lookups in the
  // script instead).
  map<string, string> environment_variables = 2;

  // Ephemeral /tmp storage per run, in MB (1024-5120). Unset keeps
  // AWS's default (1024).
  optional int32 ephemeral_storage = 3 [(buf.validate.field).int32 = {
    gte: 1024
    lte: 5120
  }];

  // Memory per run, in MB - a multiple of 64, at least 960. Unset
  // keeps the runtime's default.
  optional int32 memory_in_mb = 4;

  // Per-run timeout, in seconds (3-840). Unset defaults to the
  // schedule frequency, capped at 840.
  optional int32 timeout_in_seconds = 5 [(buf.validate.field).int32 = {
    gte: 3
    lte: 840
  }];
}

// AwsSyntheticsCanaryVpcConfig places canary runs inside a VPC.
message AwsSyntheticsCanaryVpcConfig {
  // The subnets the canary's Lambda attaches to. Reference AwsSubnet
  // subnet_id outputs or pass literal IDs.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // The security groups on the canary's network interfaces. Reference
  // AwsSecurityGroup security_group_id outputs or pass literal IDs.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_group_ids = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // Allow IPv6 egress from dual-stack subnets.
  bool ipv6_allowed_for_dual_stack = 3;
}
