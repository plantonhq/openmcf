apiVersion: aws.planton.dev/v1alpha1
kind: AwsClientVpn
metadata:
  name: my-split-tunnel-vpn
spec:
  region: <aws-region>
  description: Split-tunnel VPN for secure VPC access
  # Mutual TLS: clients present certificates issued from the client CA
  # chain. For a self-signed setup the same imported ACM certificate may
  # serve as both the server certificate and the client CA.
  authenticationOptions:
    - type: certificate-authentication
      rootCertificateChainArn:
        value: <client-ca-certificate-arn>
  serverCertificateArn:
    value: <server-certificate-arn>
  clientCidrBlock: 10.100.0.0/22
  # Split tunnel: only traffic destined for the endpoint's route table goes
  # through the VPN; everything else stays local to the client.
  splitTunnel: true
  vpcId:
    value: <vpc-id>
  subnetIds:
    - value: <private-subnet-id>
  # Nothing is reachable until a rule authorizes it. Replace with your
  # VPC's CIDR.
  authorizationRules:
    - targetNetworkCidr: 10.0.0.0/16
      authorizeAllGroups: true
      description: reach the whole VPC
  connectionLog:
    cloudwatchLogGroup:
      value: <vpn-log-group-name>
