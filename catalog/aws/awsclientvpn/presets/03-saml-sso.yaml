apiVersion: aws.planton.dev/v1alpha1
kind: AwsClientVpn
metadata:
  name: my-sso-vpn
spec:
  region: <aws-region>
  description: SAML SSO VPN with the self-service portal
  # Federated authentication: SAML 2.0 single sign-on through an IAM SAML
  # provider (Okta, Entra ID, ...). The only type that supports the
  # self-service portal, where users download their own client
  # configuration.
  authenticationOptions:
    - type: federated-authentication
      # Replace with your IAM SAML identity provider's ARN (IAM console →
      # Identity providers). The shape below is what the field validates.
      samlProviderArn: arn:aws:iam::123456789012:saml-provider/okta-workforce
  serverCertificateArn:
    value: <server-certificate-arn>
  clientCidrBlock: 10.100.0.0/22
  splitTunnel: true
  selfServicePortalEnabled: true
  sessionTimeoutHours: 12
  disconnectOnSessionTimeout: true
  vpcId:
    value: <vpc-id>
  subnetIds:
    - value: <private-subnet-id-az1>
    - value: <private-subnet-id-az2>
  authorizationRules:
    # Engineering reaches the whole VPC; contractors only the tools subnet.
    # Group-scoped rules use the IdP's group attribute value; replace the
    # CIDRs with your VPC and subnet ranges.
    - targetNetworkCidr: 10.0.0.0/16
      accessGroupId: <idp-engineering-group-id>
      description: engineering reaches the whole VPC
    - targetNetworkCidr: 10.0.42.0/24
      accessGroupId: <idp-contractors-group-id>
      description: contractors reach only the tools subnet
  connectionLog:
    cloudwatchLogGroup:
      value: <vpn-log-group-name>
