apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awseventbridgescheduler
spec:
  # A rate schedule to the SQS queue fixture in an owned group, under a
  # consumer-scoped scheduler-trusting role. The first create rides the
  # provider's two-minute IAM-propagation retry - expected, not a
  # hang. ~$0 (free tier dwarfs a minutes-lived schedule).
  #
  # Deliberately not exercised live:
  #   - the ECS/Kinesis/SageMaker/EventBridge parameter blocks -- each
  #     needs its service's fixture chain; the SQS block is the family
  #     representative and the spec's at-most-one CEL is the
  #     load-bearing guard. Unblock: per-service scenarios on their
  #     fixture chains.
  #   - action_after_completion = DELETE -- AWS deletes the schedule
  #     out from under IaC state (taught in spec/GUIDE); a lane
  #     asserting absence-after-completion needs a one-time "at()"
  #     schedule and a wait. Unblock: a run-scoped at() scenario.
  #
  # pending_proof: forged this session to the full offline bar -- Q45
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 25
