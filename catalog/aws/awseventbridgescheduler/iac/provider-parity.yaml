# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_scheduler_schedule:
    mappings:
      # The DLQ wrapper flattens onto a chart-wireable named reference.
      - arg: target.dead_letter_config.arn
        spec: spec.target.dead_letter_queue_arn
      # The provider's singular block name vs the spec's honest plural.
      - arg: target.sagemaker_pipeline_parameters.pipeline_parameter
        spec: spec.target.sagemaker_pipeline_parameters.pipeline_parameters
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name (the schedule's identity is the component's name)
      - arg: name_prefix
        reason: covered alternative -- the catalog names deterministically from metadata.name; prefix-generated names defeat chart wiring
      - arg: group_name
        reason: two homes -- the module wires the owned group's name or the spec's group_name join, else AWS's default group
  aws_scheduler_schedule_group:
    specRoot: spec.group
    mappings:
      - arg: region
        spec: spec.region
    exclusions:
      - arg: name_prefix
        reason: covered alternative -- the catalog names deterministically; prefix-generated names defeat chart wiring
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
specExclusions:
  # The join half of the group's own-XOR-existing pair (the owned
  # group's name maps to aws_scheduler_schedule_group.name).
  - field: spec.group_name
    reason: second home of aws_scheduler_schedule.group_name -- joins an existing group by name; the owned-group arm is the other home
