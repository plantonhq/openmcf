syntax = "proto3";

package dev.planton.aws.awsdynamodb.v1alpha1;

import "catalog/aws/awsdynamodb/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsDynamodbStackInput is the input envelope passed to IaC modules for provisioning.
message AwsDynamodbStackInput {
  // target
  AwsDynamodb target = 1;
  // provider-credential
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
