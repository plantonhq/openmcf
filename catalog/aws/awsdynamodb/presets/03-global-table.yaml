apiVersion: aws.planton.dev/v1alpha1
kind: AwsDynamodb
metadata:
  name: my-global-table
spec:
  region: <aws-region>
  billingMode: PAY_PER_REQUEST
  attributeDefinitions:
    - name: pk
      type: S
    - name: sk
      type: S
  keySchema:
    - attributeName: pk
      keyType: HASH
    - attributeName: sk
      keyType: RANGE
  streamEnabled: true
  streamViewType: NEW_AND_OLD_IMAGES
  pointInTimeRecovery:
    enabled: true
  deletionProtectionEnabled: true
  replicas:
    - regionName: <replica-region>
      pointInTimeRecovery: true
      deletionProtectionEnabled: true
      propagateTags: true
