apiVersion: aws.planton.dev/v1alpha1
kind: AwsDynamodb
metadata:
  name: my-global-table
spec:
  region: <aws-region>
  billingMode: PAY_PER_REQUEST
  attributeDefinitions:
    - name: pk
      type: S
    - name: sk
      type: S
  keySchema:
    - attributeName: pk
      keyType: HASH
    - attributeName: sk
      keyType: RANGE
  streamEnabled: true
  streamViewType: NEW_AND_OLD_IMAGES
  pointInTimeRecovery:
    enabled: true
  deletionProtectionEnabled: true
  replicas:
    # Replica regions must be real region codes (the field's own pattern
    # rejects placeholders) -- replace with your replica region, which must
    # differ from spec.region.
    - regionName: us-west-2
      pointInTimeRecovery: true
      deletionProtectionEnabled: true
      propagateTags: true
