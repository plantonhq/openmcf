apiVersion: aws.planton.dev/v1alpha1
kind: AwsDynamodb
metadata:
  name: my-autoscaled-table
spec:
  region: <aws-region>
  billingMode: PROVISIONED
  provisionedThroughput:
    readCapacityUnits: 5
    writeCapacityUnits: 5
  autoscaling:
    read:
      minCapacity: 5
      maxCapacity: 100
      targetUtilizationPercent: 70
    write:
      minCapacity: 5
      maxCapacity: 50
      targetUtilizationPercent: 70
    scheduledAdjustments:
      - name: business-hours-floor
        dimension: READ
        schedule: "cron(0 6 ? * MON-FRI *)"
        timezone: America/Los_Angeles
        minCapacity: 20
      - name: after-hours-floor
        dimension: READ
        schedule: "cron(0 20 ? * MON-FRI *)"
        timezone: America/Los_Angeles
        minCapacity: 5
  attributeDefinitions:
    - name: pk
      type: S
    - name: sk
      type: S
  keySchema:
    - attributeName: pk
      keyType: HASH
    - attributeName: sk
      keyType: RANGE
  pointInTimeRecovery:
    enabled: true
  serverSideEncryption:
    enabled: true
  deletionProtectionEnabled: true
