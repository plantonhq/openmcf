apiVersion: aws.planton.dev/v1alpha1
kind: AwsAppRunnerService
metadata:
  org: example-org
  env: prod
  name: my-internal-api
  id: my-internal-api-id
spec:
  region: us-west-2
  # Replace the example path with your own account/region/repo/tag (the
  # format is validated: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/REPO:TAG).
  imageSource:
    imageIdentifier: "123456789012.dkr.ecr.us-west-2.amazonaws.com/internal-api:v1.0.0"
    imageRepositoryType: "ECR"
    accessRoleArn:
      valueFrom:
        kind: AwsIamRole
        name: ecr-access-role
        fieldPath: status.outputs.role_arn

  port: "8080"
  cpu: "1024"
  memory: "2048"

  # The service is NOT reachable from the internet -- no public URL serves
  # traffic. Clients reach it only through the VPC Ingress Connections
  # declared below.
  isPubliclyAccessible: false

  # Publish the service into one VPC through an interface VPC endpoint
  # (AWS PrivateLink). The endpoint must be an interface endpoint for the
  # App Runner requests service (com.amazonaws.REGION.apprunner.requests)
  # in the target VPC. Clients inside that VPC resolve the per-connection
  # domain name exported in status.outputs.vpc_ingress_connections.
  vpcIngressConnections:
    - name: my-internal-api-ingress
      vpcId:
        valueFrom:
          kind: AwsVpc
          name: main-vpc
          fieldPath: status.outputs.vpc_id
      vpcEndpointId:
        valueFrom:
          kind: AwsVpcEndpoint
          name: apprunner-requests-endpoint
          fieldPath: status.outputs.vpc_endpoint_id
