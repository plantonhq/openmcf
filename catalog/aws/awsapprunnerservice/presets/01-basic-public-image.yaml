apiVersion: aws.planton.dev/v1alpha1
kind: AwsAppRunnerService
metadata:
  org: example-org
  env: prod
  name: my-web-app
  id: my-web-app-id
spec:
  region: <aws-region>
  # ECR Public image -- no IAM access role needed for pulling. Replace the
  # example path with your own (the format is validated:
  # public.ecr.aws/ALIAS/REPO:TAG). Note: automatic deployments are not
  # supported for public images; deploy by applying this resource with a
  # new tag.
  imageSource:
    imageIdentifier: "public.ecr.aws/aws-containers/hello-app-runner:latest"
    imageRepositoryType: "ECR_PUBLIC"
  # Port your application listens on (App Runner routes HTTPS:443 -> this port)
  port: "<application-port>"
  # Default instance size: 1 vCPU / 2 GB RAM
  cpu: "1024"
  memory: "2048"
  # Scaling defaults to the account's default auto scaling configuration
  # (1 min / 25 max / 100 concurrency unless changed); health checks default
  # to TCP on the configured port.
