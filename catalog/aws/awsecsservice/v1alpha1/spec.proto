  }];

  // The cluster query for memberOf, e.g.
  // "attribute:ecs.instance-type =~ m5.*". Unused for distinctInstance.
  string expression = 2;
}

// AwsEcsServiceAutoscaling scales desired_count between bounds with
// target-tracking policies. Each configured policy creates its own
// AWS-managed CloudWatch alarms; the service scales on whichever policy
// demands the most capacity.
message AwsEcsServiceAutoscaling {
  // The floor. 0 allows scale-to-zero (with a metric that can get there,
  // e.g. a custom metric -- CPU tracking never reaches zero tasks).
  int32 min_tasks = 1 [(buf.validate.field).int32.gte = 0];

  // The ceiling -- also the cost guardrail.
  int32 max_tasks = 2 [(buf.validate.field).int32.gte = 1];

  // Track average CPU utilization across tasks (e.g. target 70 scales to
  // hold CPU near 70%). The bread-and-butter policy for compute-bound
  // services.
  AwsEcsServiceAutoscalingTarget cpu = 3;

  // Track average memory utilization across tasks. Note memory rarely
  // shrinks under reduced load -- prefer CPU or request tracking for
  // scale-in behavior.
  AwsEcsServiceAutoscalingTarget memory = 4;

  // Track requests-per-target on the load balancer -- the most direct
  // signal for request-serving services, reacting before CPU climbs.
  AwsEcsServiceAutoscalingRequestCountTarget requests_per_target = 5;

  option (buf.validate.message).cel = {
    id: "max_gte_min"
    message: "max_tasks must be greater than or equal to min_tasks"
    expression: "this.max_tasks >= this.min_tasks"
  };

  option (buf.validate.message).cel = {
    id: "at_least_one_policy"
    message: "configure at least one tracking policy (cpu, memory, or requests_per_target)"
    expression: "has(this.cpu) || has(this.memory) || has(this.requests_per_target)"
  };
}

// AwsEcsServiceAutoscalingTarget is one utilization-tracking policy.
message AwsEcsServiceAutoscalingTarget {
  // The utilization percentage to hold (1-100). 70-75 is the usual
  // production sweet spot: headroom for spikes without paying for idle.
  int32 target_percent = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // Seconds to wait after a scale-in before another may follow. Longer
  // cooldowns damp flapping. AWS default: 300.
  optional int32 scale_in_cooldown_seconds = 2 [(dev.planton.shared.options.default) = "300"];

  // Seconds to wait after a scale-out before another may follow. Keep it
  // short -- under-capacity hurts more than a brief overshoot. AWS
  // default: 60.
  optional int32 scale_out_cooldown_seconds = 3 [(dev.planton.shared.options.default) = "60"];

  // Only ever scale out on this policy; never remove capacity. For
  // services where a human decides when to scale in.
  bool disable_scale_in = 4;
}

