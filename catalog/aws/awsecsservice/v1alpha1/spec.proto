  // random.
  string field = 2;
}

// AwsEcsServicePlacementConstraint restricts which container instances may
// host the tasks.
message AwsEcsServicePlacementConstraint {
  // "memberOf" (instances matching a cluster query expression) or
  // "distinctInstance" (never co-locate two of this service's tasks).
  string type = 1 [(buf.validate.field).string = {
    in: [
      "distinctInstance",
      "memberOf"
