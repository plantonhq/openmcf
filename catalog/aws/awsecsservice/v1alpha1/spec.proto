    id: "propagate_tags_valid"
    message: "propagate_tags must be 'SERVICE', 'TASK_DEFINITION', or 'NONE' when set"
    expression: "this.propagate_tags == '' || this.propagate_tags in ['SERVICE', 'TASK_DEFINITION', 'NONE']"
  };
}

// AwsEcsServicePlacementStrategy is one ordered placement rule for EC2
// tasks.
message AwsEcsServicePlacementStrategy {
  // "spread" (distribute across the field's values), "binpack" (fill the
