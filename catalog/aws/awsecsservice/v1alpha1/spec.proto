    message: "log_driver must be one of: awslogs, awsfirelens, splunk, fluentd, gelf, syslog, journald, json-file"
    expression: "this.log_driver in ['awslogs', 'awsfirelens', 'splunk', 'fluentd', 'gelf', 'syslog', 'journald', 'json-file']"
