  dev.planton.shared.foreignkey.v1.StringValueOrRef target_group_arn_suffix = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLbTargetGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.arn_suffix"
  ];

  // Scale-in cooldown, seconds. AWS default: 300.
  optional int32 scale_in_cooldown_seconds = 4 [(dev.planton.shared.options.default) = "300"];

  // Scale-out cooldown, seconds. AWS default: 60.
  optional int32 scale_out_cooldown_seconds = 5 [(dev.planton.shared.options.default) = "60"];

  // Only ever scale out on this policy; never remove capacity.
  bool disable_scale_in = 6;
}
