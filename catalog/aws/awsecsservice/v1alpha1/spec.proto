    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // The VPC Lattice target group (by ARN) the tasks register into. A
  // literal ARN -- Planton has no VPC Lattice kinds yet.
