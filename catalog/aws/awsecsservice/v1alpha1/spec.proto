    expression: "this.size_in_gb > 0 || this.snapshot_id != ''"
  };

  option (buf.validate.message).cel = {
    id: "volume_type_valid"
    message: "volume_type must be one of: gp2, gp3, io1, io2, st1, sc1, standard"
    expression: "this.volume_type == '' || this.volume_type in ['gp2', 'gp3', 'io1', 'io2', 'st1', 'sc1', 'standard']"
  };

  option (buf.validate.message).cel = {
    id: "throughput_gp3_only"
    message: "throughput only applies to gp3 volumes (125-1000 MiB/s)"
    expression: "this.throughput == 0 || (this.volume_type == 'gp3' && this.throughput >= 125 && this.throughput <= 1000)"
  };

  option (buf.validate.message).cel = {
    id: "iops_provisioned_types_only"
    message: "iops only applies to gp3, io1, and io2 volumes"
    expression: "this.iops == 0 || this.volume_type in ['gp3', 'io1', 'io2']"
  };

  option (buf.validate.message).cel = {
    id: "file_system_type_valid"
    message: "file_system_type must be 'xfs', 'ext4', 'ext3', or 'ntfs' when set"
    expression: "this.file_system_type == '' || this.file_system_type in ['xfs', 'ext4', 'ext3', 'ntfs']"
  };
}

// AwsEcsServiceVpcLatticeConfiguration registers the service's tasks into
