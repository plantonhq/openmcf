apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsService
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  clusterArn:
    valueFrom:
      kind: AwsEcsCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.cluster_arn
  taskDefinition:
    valueFrom:
      kind: AwsEcsTaskDefinition
      name: <task-definition-resource-name>
      fieldPath: status.outputs.task_definition_arn
  desiredCount: 3
  network:
    subnets:
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-a-resource-name>
          fieldPath: status.outputs.subnet_id
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-b-resource-name>
          fieldPath: status.outputs.subnet_id
  loadBalancers:
    - targetGroupArn:
        valueFrom:
          kind: AwsLbTargetGroup
          name: <blue-target-group-resource-name>
          fieldPath: status.outputs.target_group_arn
      containerName: app
      containerPort: 8080
      advancedConfiguration:
        alternateTargetGroupArn:
          valueFrom:
            kind: AwsLbTargetGroup
            name: <green-target-group-resource-name>
            fieldPath: status.outputs.target_group_arn
        productionListenerRule:
          valueFrom:
            kind: AwsLbListenerRule
            name: <production-rule-resource-name>
            fieldPath: status.outputs.rule_arn
        roleArn:
          valueFrom:
            kind: AwsIamRole
            name: <blue-green-role-resource-name>
            fieldPath: status.outputs.role_arn
  deploymentConfiguration:
    strategy: BLUE_GREEN
    bakeTimeInMinutes: 10
    canaryConfiguration:
      canaryPercent: 5
      canaryBakeTimeInMinutes: 5
