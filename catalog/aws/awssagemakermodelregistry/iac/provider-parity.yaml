# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_sagemaker_model_package_group:
    mappings:
      - arg: model_package_group_description
        spec: spec.description
    exclusions:
      - arg: model_package_group_name
        reason: wired by the module from metadata.name -- the component's name IS the group name
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  aws_sagemaker_model_package_group_policy:
    mappings:
      # v6 per-resource region override -- the module wires every
      # resource to spec.region.
      - arg: region
        spec: spec.region
      # The spec carries the policy as structured JSON; the module
      # serializes on send.
      - arg: resource_policy
        spec: spec.resource_policy
    exclusions:
      - arg: model_package_group_name
        reason: wired by the module to the folded parent group; never user surface
