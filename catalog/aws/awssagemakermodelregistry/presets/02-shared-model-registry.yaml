apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerModelRegistry
metadata:
  name: shared-model-registry
spec:
  region: us-west-2
  description: Model versions shared with the production account
  resourcePolicy:
    Version: "2012-10-17"
    Statement:
      - Sid: AllowCrossAccountDescribe
        Effect: Allow
        Principal:
          AWS: arn:aws:iam::210987654321:root
        Action:
          - sagemaker:DescribeModelPackage
          - sagemaker:ListModelPackages
        Resource: "*"
