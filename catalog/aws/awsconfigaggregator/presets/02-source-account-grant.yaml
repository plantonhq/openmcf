apiVersion: aws.planton.dev/v1alpha1
kind: AwsConfigAggregator
metadata:
  name: grant-to-security-account
spec:
  region: <aws-region>
  authorizations:
    # Account ids must be 12 digits (the field's own pattern rejects
    # placeholders) -- replace with the aggregator account's real id.
    - accountId: "123456789012"
      authorizedAwsRegion: <aggregator-home-region>
