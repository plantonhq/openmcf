# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_config_configuration_aggregator:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      - arg: account_aggregation_source.account_ids
        spec: spec.aggregation.account_source.account_ids
      - arg: account_aggregation_source.all_regions
        spec: spec.aggregation.account_source.all_regions
      - arg: account_aggregation_source.regions
        spec: spec.aggregation.account_source.regions
      - arg: organization_aggregation_source.role_arn
        spec: spec.aggregation.organization_source.role_arn
      - arg: organization_aggregation_source.all_regions
        spec: spec.aggregation.organization_source.all_regions
      - arg: organization_aggregation_source.regions
        spec: spec.aggregation.organization_source.regions
    exclusions:
      - arg: name
        reason: metadata.name is the aggregator name on both engines -- never free-form spec surface
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  # The grant's region override is DISABLED at the provider
  # (@Region(overrideEnabled=false)) -- authorized_aws_region is a real
  # argument naming the aggregator's home region, not a placement knob.
  # The provider's deprecated "region" alias of authorized_aws_region is
  # outside the audit's configurable surface (deprecated args are not
  # counted); the modules render only the surviving argument.
  aws_config_aggregate_authorization:
    mappings:
      - arg: account_id
        spec: spec.authorizations.account_id
      - arg: authorized_aws_region
        spec: spec.authorizations.authorized_aws_region
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
