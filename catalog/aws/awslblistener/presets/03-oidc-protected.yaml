apiVersion: aws.planton.dev/v1alpha1
kind: AwsLbListener
metadata:
  name: https-oidc
spec:
  region: <aws-region>
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: <alb-resource-name>
      fieldPath: status.outputs.load_balancer_arn
  port: 443
  protocol: HTTPS
  certificateArn:
    valueFrom:
      kind: AwsCertManagerCert
      name: <certificate-resource-name>
      fieldPath: status.outputs.cert_arn
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  defaultActions:
    - type: authenticate-oidc
      authenticateOidc:
        issuer: <oidc-issuer-url>
        authorizationEndpoint: <oidc-authorization-endpoint>
        tokenEndpoint: <oidc-token-endpoint>
        userInfoEndpoint: <oidc-user-info-endpoint>
        clientId: <oidc-client-id>
        # The client secret is sensitive: reference a managed secret
        # ($secret/<slug>) -- never a plaintext value.
        clientSecret: $secret/oidc-client-secret
        scope: openid email
    - type: forward
      forward:
        targetGroups:
          - arn:
              valueFrom:
                kind: AwsLbTargetGroup
                name: <target-group-resource-name>
                fieldPath: status.outputs.target_group_arn
