apiVersion: iac.planton.dev/v1
kind: ProviderImportCatalog
metadata:
  name: aws
spec:
  # Import-ID formats per AWS resource type, as documented by the upstream
  # terraform-provider-aws / pulumi-aws providers. The FORMAT lives here
  # (provider knowledge, shared by every component); which concrete value
  # fills each {placeholder} lives in the owning component's import-map.yaml.
  # Correctness is machine-proven by the E2E import round-trip (deploy a
  # fixture, set state aside, re-import blind, plan must show zero diff) --
  # never by review alone.
  #
  # cloud_control_type_name is the scan-side correspondence: the
  # CloudFormation type name under which a read-only account scan (the Cloud
  # Control API) reports this resource. It is declared ONLY for types
  # verified listable via `aws cloudcontrol list-resources` with no extra
  # list parameters; a covered type may legitimately carry none because it
  # is unlistable (AWS::IAM::RolePolicy does not support LIST), needs
  # scoping input Cloud Control cannot default (AWS::EC2::VPCCidrBlock
  # requires a ResourceModel), or exists only as properties of a parent
  # type's model (every S3 satellite except the bucket policy). Consumers
  # treat absence as "not discoverable by scanning", never as an error.
  resource_types:
    # --- S3 ------------------------------------------------------------------
    # Every S3 satellite imports by the bucket name; several accept optional
    # suffixes (",{expected_bucket_owner}") that the platform never needs for
    # same-account imports.
    - terraform_type: aws_s3_bucket
      pulumi_type: aws:s3/bucketV2:BucketV2
      id_format: "{bucket}"
      cloud_control_type_name: AWS::S3::Bucket
      # force_destroy is engine behavior (empty-before-delete), not a bucket
      # property -- import can never carry it, so post-import plans showing
      # only this attribute are clean.
      config_only_attributes: [force_destroy]
    - terraform_type: aws_s3_bucket_versioning
      pulumi_type: aws:s3/bucketVersioningV2:BucketVersioningV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_server_side_encryption_configuration
      pulumi_type: aws:s3/bucketServerSideEncryptionConfigurationV2:BucketServerSideEncryptionConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_public_access_block
      pulumi_type: aws:s3/bucketPublicAccessBlock:BucketPublicAccessBlock
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_ownership_controls
      pulumi_type: aws:s3/bucketOwnershipControls:BucketOwnershipControls
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_acl
      pulumi_type: aws:s3/bucketAclV2:BucketAclV2
      id_format: "{bucket}"
      notes: >-
        When the bucket ACL was set with a canned ACL, the provider also
        accepts "{bucket},{acl}"; the plain bucket form round-trips for
        module-managed buckets.
    - terraform_type: aws_s3_bucket_policy
      pulumi_type: aws:s3/bucketPolicy:BucketPolicy
      id_format: "{bucket}"
      cloud_control_type_name: AWS::S3::BucketPolicy
    - terraform_type: aws_s3_bucket_lifecycle_configuration
      pulumi_type: aws:s3/bucketLifecycleConfigurationV2:BucketLifecycleConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_replication_configuration
      pulumi_type: aws:s3/bucketReplicationConfig:BucketReplicationConfig
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_website_configuration
      pulumi_type: aws:s3/bucketWebsiteConfigurationV2:BucketWebsiteConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_logging
      pulumi_type: aws:s3/bucketLoggingV2:BucketLoggingV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_cors_configuration
      pulumi_type: aws:s3/bucketCorsConfigurationV2:BucketCorsConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_notification
      pulumi_type: aws:s3/bucketNotification:BucketNotification
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_object_lock_configuration
      pulumi_type: aws:s3/bucketObjectLockConfigurationV2:BucketObjectLockConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_accelerate_configuration
      pulumi_type: aws:s3/bucketAccelerateConfigurationV2:BucketAccelerateConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_request_payment_configuration
      pulumi_type: aws:s3/bucketRequestPaymentConfigurationV2:BucketRequestPaymentConfigurationV2
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_intelligent_tiering_configuration
      pulumi_type: aws:s3/bucketIntelligentTieringConfiguration:BucketIntelligentTieringConfiguration
      id_format: "{bucket}:{intelligent_tiering_name}"
      notes: >-
        The colon-joined second segment is the per-configuration name (the
        module keys these off spec.intelligent_tiering_configurations[].name;
        it also appears in the enumerated address's for_each key).
    - terraform_type: aws_s3_bucket_abac
      pulumi_type: aws:s3/bucketAbac:BucketAbac
      id_format: "{bucket}"
    - terraform_type: aws_s3_bucket_analytics_configuration
      pulumi_type: aws:s3/analyticsConfiguration:AnalyticsConfiguration
      id_format: "{bucket}:{analytics_name}"
      notes: >-
        Same name-keyed convention as intelligent tiering (the module keys
        these off spec.analytics_configurations[].name).
    - terraform_type: aws_s3_bucket_inventory
      pulumi_type: aws:s3/inventory:Inventory
      id_format: "{bucket}:{inventory_name}"
      notes: >-
        Same name-keyed convention as intelligent tiering (the module keys
        these off spec.inventory_configurations[].name).
    - terraform_type: aws_s3_bucket_metric
      pulumi_type: aws:s3/bucketMetric:BucketMetric
      id_format: "{bucket}:{metric_name}"
      notes: >-
        Same name-keyed convention as intelligent tiering (the module keys
        these off spec.metrics_configurations[].name).
    - terraform_type: aws_s3_bucket_metadata_configuration
      pulumi_type: aws:s3/bucketMetadataConfiguration:BucketMetadataConfiguration
      id_format: "{bucket}"

    # --- VPC -----------------------------------------------------------------
    - terraform_type: aws_vpc
      pulumi_type: aws:ec2/vpc:Vpc
      id_format: "{vpc_id}"
      cloud_control_type_name: AWS::EC2::VPC
    - terraform_type: aws_vpc_ipv4_cidr_block_association
      pulumi_type: aws:ec2/vpcIpv4CidrBlockAssociation:VpcIpv4CidrBlockAssociation
      id_format: "{cidr_association_id}"
      notes: >-
        The "vpc-cidr-assoc-..." association id (aws ec2 describe-vpcs shows
        each association under CidrBlockAssociationSet).
    - terraform_type: aws_vpc_ipv6_cidr_block_association
      pulumi_type: aws:ec2/vpcIpv6CidrBlockAssociation:VpcIpv6CidrBlockAssociation
      id_format: "{cidr_association_id}"
      notes: >-
        The "vpc-cidr-assoc-..." association id (aws ec2 describe-vpcs shows
        each association under Ipv6CidrBlockAssociationSet). The provider also
        accepts an optional ",ipam-pool-id,netmask" suffix for IPAM-allocated
        blocks; the bare association id is the canonical form.
    - terraform_type: aws_vpc_encryption_control
      pulumi_type: aws:ec2/vpcEncryptionControl:VpcEncryptionControl
      id_format: "{vpc_encryption_control_id}"
      notes: >-
        The "vpcec-..." VPC Encryption Control id (aws ec2
        describe-vpc-encryption-controls).

    # --- Security group ------------------------------------------------------
    - terraform_type: aws_security_group
      pulumi_type: aws:ec2/securityGroup:SecurityGroup
      id_format: "{security_group_id}"
      cloud_control_type_name: AWS::EC2::SecurityGroup
      # revoke_rules_on_delete is engine delete behavior (revoke every rule
      # before deleting, for groups other groups reference) -- EC2 never
      # reports it, so it can never round-trip through import.
      config_only_attributes: [revoke_rules_on_delete]
    # The group's share into another VPC (spec.additional_vpc_ids) imports
    # by both halves of its config-time identity, comma-separated.
    - terraform_type: aws_vpc_security_group_vpc_association
      pulumi_type: aws:vpc/securityGroupVpcAssociation:SecurityGroupVpcAssociation
      id_format: "{security_group_id},{vpc_id}"

    # --- ECR -----------------------------------------------------------------
    - terraform_type: aws_ecr_repository
      pulumi_type: aws:ecr/repository:Repository
      id_format: "{repository_name}"
      cloud_control_type_name: AWS::ECR::Repository
      # force_delete mirrors S3's force_destroy: engine-only delete behavior.
      config_only_attributes: [force_delete]
    - terraform_type: aws_ecr_lifecycle_policy
      pulumi_type: aws:ecr/lifecyclePolicy:LifecyclePolicy
      id_format: "{repository_name}"
    - terraform_type: aws_ecr_repository_policy
      pulumi_type: aws:ecr/repositoryPolicy:RepositoryPolicy
      id_format: "{repository_name}"

    # --- Subnet (subnet + its owned route table + the association) -----------
    - terraform_type: aws_subnet
      pulumi_type: aws:ec2/subnet:Subnet
      id_format: "{subnet_id}"
      cloud_control_type_name: AWS::EC2::Subnet
    - terraform_type: aws_route_table
      pulumi_type: aws:ec2/routeTable:RouteTable
      id_format: "{route_table_id}"
      cloud_control_type_name: AWS::EC2::RouteTable
    - terraform_type: aws_route_table_association
      pulumi_type: aws:ec2/routeTableAssociation:RouteTableAssociation
      id_format: "{subnet_id}/{route_table_id}"
      cloud_control_type_name: AWS::EC2::SubnetRouteTableAssociation
      notes: >-
        Subnet associations import by "subnet-id/rtb-id" (gateway
        associations use "igw-id/rtb-id" -- not a shape Planton modules
        create today).

    # --- Internet gateway -----------------------------------------------------
    - terraform_type: aws_internet_gateway
      pulumi_type: aws:ec2/internetGateway:InternetGateway
      id_format: "{internet_gateway_id}"
      cloud_control_type_name: AWS::EC2::InternetGateway

    # --- NAT gateway -----------------------------------------------------------
    - terraform_type: aws_nat_gateway
      pulumi_type: aws:ec2/natGateway:NatGateway
      id_format: "{nat_gateway_id}"
      cloud_control_type_name: AWS::EC2::NatGateway

    # --- IAM role (role + inline policies + managed-policy attachments) -------
    - terraform_type: aws_iam_role
      pulumi_type: aws:iam/role:Role
      id_format: "{role_name}"
      cloud_control_type_name: AWS::IAM::Role
      # force_detach_policies is engine delete behavior (detach before
      # delete), never readable from IAM -- same class as S3's force_destroy.
      config_only_attributes: [force_detach_policies]
    - terraform_type: aws_iam_role_policy
      pulumi_type: aws:iam/rolePolicy:RolePolicy
      id_format: "{role_name}:{inline_policy_name}"
    - terraform_type: aws_iam_role_policy_attachment
      pulumi_type: aws:iam/rolePolicyAttachment:RolePolicyAttachment
      id_format: "{role_name}/{managed_policy_arn}"

    # --- DynamoDB (table + folded satellites) ----------------------------------
    - terraform_type: aws_dynamodb_table
      pulumi_type: aws:dynamodb/table:Table
      id_format: "{table_name}"
      cloud_control_type_name: AWS::DynamoDB::Table
    - terraform_type: aws_dynamodb_resource_policy
      pulumi_type: aws:dynamodb/resourcePolicy:ResourcePolicy
      id_format: "{table_arn}"
      # DynamoDB normalizes the stored policy document (whitespace, key
      # order, principal shapes), so a faithful import plans a semantically
      # identical policy rewrite plus the computed revision bump. The
      # provider's own import test ignores "policy" for the same reason.
      write_normalized_attributes: [policy, revision_id]
    - terraform_type: aws_dynamodb_kinesis_streaming_destination
      pulumi_type: aws:dynamodb/kinesisStreamingDestination:KinesisStreamingDestination
      id_format: "{table_name},{kinesis_stream_arn}"
    - terraform_type: aws_dynamodb_contributor_insights
      pulumi_type: aws:dynamodb/contributorInsights:ContributorInsights
      id_format: "name:{table_name}/index:{index_name?}/{account_id}"
      notes: >-
        Table-level insights leave the index segment empty
        ("name:tbl/index:/123456789012") -- the optional marker renders it
        as such.

    # --- Application Auto Scaling (the DynamoDB capacity fold's scalers) ------
    - terraform_type: aws_appautoscaling_target
      pulumi_type: aws:appautoscaling/target:Target
      id_format: "{service_namespace}/{scaling_resource_id}/{scalable_dimension}"
      notes: >-
        The provider's documented format is
        service-namespace/resource-id/scalable-dimension. The resource-id may
        itself contain slashes (DynamoDB's "table/<table_name>") -- the
        provider's parser re-joins the middle segments, so the composed ID
        stays unambiguous.
    - terraform_type: aws_appautoscaling_policy
      pulumi_type: aws:appautoscaling/policy:Policy
      id_format: "{service_namespace}/{scaling_resource_id}/{scalable_dimension}/{policy_name}"
      notes: >-
        The target's composed identity plus the policy name. For DynamoDB the
        parser special-cases the resource-id's known "table/<name>" (and
        "table/<name>/index/<name>") shapes, so the slash inside
        {scaling_resource_id} is safe here too.
    - terraform_type: aws_appautoscaling_scheduled_action
      pulumi_type: aws:appautoscaling/scheduledAction:ScheduledAction
      not_importable_upstream_reason: >-
        The upstream resource ships no importer at v6.58.0 (its target and
        policy siblings both carry one; the scheduled action does not).
        PutScheduledAction is an idempotent upsert keyed by
        service-namespace/resource-id/scalable-dimension/name, so an
        adopter's first apply takes ownership by re-putting the same action
        -- the round-trip lane proves exactly that path.

    # --- SQS -------------------------------------------------------------------
    - terraform_type: aws_sqs_queue
      pulumi_type: aws:sqs/queue:Queue
      id_format: "{queue_url}"
      cloud_control_type_name: AWS::SQS::Queue
      notes: >-
        The full queue URL ("https://sqs.<region>.amazonaws.com/<account>/
        <name>"), not the queue name or ARN.

    # --- SNS -------------------------------------------------------------------
    - terraform_type: aws_sns_topic
      pulumi_type: aws:sns/topic:Topic
      id_format: "{topic_arn}"
      cloud_control_type_name: AWS::SNS::Topic
    - terraform_type: aws_sns_topic_data_protection_policy
      pulumi_type: aws:sns/dataProtectionPolicy:DataProtectionPolicy
      id_format: "{topic_arn}"

    # --- KMS -------------------------------------------------------------------
    - terraform_type: aws_kms_key
      pulumi_type: aws:kms/key:Key
      id_format: "{kms_key_id}"
      cloud_control_type_name: AWS::KMS::Key
      notes: >-
        The key id (UUID), not the alias or ARN. Imported keys also need
        their policy/rotation read back, which the import's refresh does.
      # deletion_window_in_days only exists as scheduling input to
      # ScheduleKeyDeletion; KMS never reports it back.
      config_only_attributes: [deletion_window_in_days]
    - terraform_type: aws_kms_grant
      pulumi_type: aws:kms/grant:Grant
      id_format: "{kms_key_id}:{grant_id}"
      notes: >-
        Key ID and Grant ID separated by a colon (aws kms list-grants
        --key-id shows each grant's GrantId).
    - terraform_type: aws_kms_alias
      pulumi_type: aws:kms/alias:Alias
      id_format: "{kms_alias_name}"
      cloud_control_type_name: AWS::KMS::Alias
      notes: >-
        The full alias name including the "alias/" prefix
        (e.g. "alias/my-key-alias").

    # --- Secrets Manager -------------------------------------------------------
    # The secret and its satellites all import by the secret ARN (the
    # provider's ArnIdentity); only the version adds its own segment.
    - terraform_type: aws_secretsmanager_secret
      pulumi_type: aws:secretsmanager/secret:Secret
      id_format: "{secret_arn}"
      cloud_control_type_name: AWS::SecretsManager::Secret
      # recovery_window_in_days is delete-time scheduling input and
      # force_overwrite_replica_secret is replication apply behavior --
      # DescribeSecret reports neither back.
      config_only_attributes: [recovery_window_in_days, force_overwrite_replica_secret]
    - terraform_type: aws_secretsmanager_secret_policy
      pulumi_type: aws:secretsmanager/secretPolicy:SecretPolicy
      id_format: "{secret_arn}"
      cloud_control_type_name: AWS::SecretsManager::ResourcePolicy
      # block_public_policy is PutResourcePolicy validation input;
      # GetResourcePolicy never echoes it.
      config_only_attributes: [block_public_policy]
    - terraform_type: aws_secretsmanager_secret_version
      pulumi_type: aws:secretsmanager/secretVersion:SecretVersion
      id_format: "{secret_arn}|{version_id}"
      notes: >-
        Secret ARN and version id separated by a pipe
        (`aws secretsmanager list-secret-version-ids --secret-id <arn>`
        shows each version's VersionId).
    - terraform_type: aws_secretsmanager_secret_rotation
      pulumi_type: aws:secretsmanager/secretRotation:SecretRotation
      id_format: "{secret_arn}"
      cloud_control_type_name: AWS::SecretsManager::RotationSchedule
      # rotate_immediately is RotateSecret invocation input; DescribeSecret
      # never reports it back.
      config_only_attributes: [rotate_immediately]

    # --- OpenSearch Serverless -------------------------------------------------
    # The collection imports by its service-generated id; the three policy
    # objects import by "{name}/{type}" (the provider's composite identity;
    # types: encryption|network for security policies, data for access
    # policies, retention for lifecycle policies). The policy types are not
    # Cloud Control-listable without type-scoping input, so only the
    # collection carries a scan correspondence.
    - terraform_type: aws_opensearchserverless_collection
      pulumi_type: aws:opensearch/serverlessCollection:ServerlessCollection
      id_format: "{collection_id}"
      cloud_control_type_name: AWS::OpenSearchServerless::Collection
      notes: >-
        The service-generated collection id (the leading label of the
        collection endpoint; `aws opensearchserverless list-collections`
        shows it as id), never the collection name.
    - terraform_type: aws_opensearchserverless_security_policy
      pulumi_type: aws:opensearch/serverlessSecurityPolicy:ServerlessSecurityPolicy
      id_format: "{policy_name}/{security_policy_type}"
    - terraform_type: aws_opensearchserverless_access_policy
      pulumi_type: aws:opensearch/serverlessAccessPolicy:ServerlessAccessPolicy
      id_format: "{policy_name}/{access_policy_type}"
    - terraform_type: aws_opensearchserverless_lifecycle_policy
      pulumi_type: aws:opensearch/serverlessLifecyclePolicy:ServerlessLifecyclePolicy
      id_format: "{policy_name}/{lifecycle_policy_type}"

    # --- Bedrock ----------------------------------------------------------------
    # The guardrail imports by "{id},{version}" (DRAFT for the managed
    # draft); its published versions by "{arn},{version}". The custom model
    # imports by its JOB ARN (the provider's ArnIdentity -- the job is the
    # tracked object), provisioned throughput by the provisioned-model ARN,
    # the agreement by the bare model id, and the account use-case form by
    # the account id (a singleton). None of the Bedrock control-plane types
    # are Cloud Control-listable at the pin, so no scan correspondences.
    - terraform_type: aws_bedrock_guardrail
      pulumi_type: aws:bedrock/guardrail:Guardrail
      id_format: "{guardrail_id},{version}"
      notes: >-
        Guardrail id and version separated by a comma; the mutable working
        draft imports with the literal version DRAFT
        (`aws bedrock list-guardrails` shows each guardrail's id).
      # timeouts is Terraform plan/apply scheduling input, never echoed.
      config_only_attributes: [timeouts]
    - terraform_type: aws_bedrock_guardrail_version
      pulumi_type: aws:bedrock/guardrailVersion:GuardrailVersion
      id_format: "{guardrail_arn},{version}"
      notes: >-
        Guardrail ARN and the published version number separated by a comma
        (`aws bedrock list-guardrails --guardrail-identifier <arn>` lists
        the numbered versions).
      # skip_destroy is delete-time behavior input; GetGuardrail never
      # reports it.
      config_only_attributes: [skip_destroy, timeouts]
    - terraform_type: aws_bedrock_custom_model
      pulumi_type: aws:bedrock/customModel:CustomModel
      id_format: "{job_arn}"
      notes: >-
        The model-customization JOB ARN, not the model ARN
        (`aws bedrock list-model-customization-jobs` shows jobArn). The
        provider re-derives the model from the job.
      # base_model_identifier is create-request input; the job echo carries
      # the resolved base model ARN instead (the provider importIgnores it).
      config_only_attributes: [base_model_identifier, timeouts]
    - terraform_type: aws_bedrock_inference_profile
      pulumi_type: aws:bedrock/inferenceProfile:InferenceProfile
      id_format: "{inference_profile_id}"
      notes: >-
        The application inference profile's id/name
        (`aws bedrock list-inference-profiles
        --type-equals APPLICATION` shows inferenceProfileId).
      # model_source is create input AWS never echoes back (GetInferenceProfile
      # reports the resolved models list); the provider importIgnores it.
      config_only_attributes: [model_source, timeouts]
    - terraform_type: aws_bedrock_provisioned_model_throughput
      pulumi_type: aws:bedrock/provisionedModelThroughput:ProvisionedModelThroughput
      id_format: "{provisioned_model_arn}"
      notes: >-
        The provisioned model ARN
        (`aws bedrock list-provisioned-model-throughputs` shows
        provisionedModelArn).
      config_only_attributes: [timeouts]
    - terraform_type: aws_bedrock_foundation_model_agreement
      pulumi_type: aws:bedrockfoundation/modelAgreement:ModelAgreement
      id_format: "{model_id}"
      notes: >-
        The bare foundation model id the agreement covers (e.g.
        "mistral.mistral-7b-instruct-v0:2").
      # offer_token is a short-lived create-request credential; nothing
      # echoes it back (the provider importIgnores it).
      config_only_attributes: [offer_token, timeouts]
    - terraform_type: aws_bedrock_use_case_for_model_access
      pulumi_type: aws:bedrock/useCaseForModelAccess:UseCaseForModelAccess
      id_format: "{aws_account_id}"
      notes: >-
        The 12-digit AWS account id -- the form is an account-global
        singleton.
    - terraform_type: aws_bedrock_model_invocation_logging_configuration
      pulumi_type: aws:bedrockmodel/invocationLoggingConfiguration:InvocationLoggingConfiguration
      id_format: "{region}"
      notes: >-
        The region name itself -- the configuration is a region
        singleton (one per account+region; the provider's identity IS
        the region).
    # --- Bedrock Agents --------------------------------------------------------
    # The agent-family composites join parts with a comma; satellites of the
    # agent all address the DRAFT version. None of the bedrockagent
    # control-plane types are Cloud Control-listable at the pin, so no scan
    # correspondences.
    - terraform_type: aws_bedrockagent_agent
      pulumi_type: aws:bedrock/agentAgent:AgentAgent
      id_format: "{agent_id}"
      notes: >-
        The bare agent id (`aws bedrock-agent list-agents` shows agentId).
      # prepare_agent and skip_resource_in_use_check are apply/delete-time
      # behavior inputs; GetAgent never reports them (the provider force-sets
      # prepare_agent on import and its tests importIgnore the skip flag).
      config_only_attributes: [prepare_agent, skip_resource_in_use_check, timeouts]
    - terraform_type: aws_bedrockagent_agent_action_group
      pulumi_type: aws:bedrock/agentAgentActionGroup:AgentAgentActionGroup
      id_format: "{action_group_id},{agent_id},{agent_version}"
      notes: >-
        Action group id, agent id, and the version (DRAFT for
        platform-managed groups) separated by commas
        (`aws bedrock-agent list-agent-action-groups --agent-id <id>
        --agent-version DRAFT` shows actionGroupId).
      config_only_attributes: [prepare_agent, skip_resource_in_use_check, timeouts]
    - terraform_type: aws_bedrockagent_agent_alias
      pulumi_type: aws:bedrock/agentAgentAlias:AgentAgentAlias
      id_format: "{agent_alias_id},{agent_id}"
      notes: >-
        Alias id and agent id separated by a comma
        (`aws bedrock-agent list-agent-aliases --agent-id <id>` shows
        agentAliasId).
      config_only_attributes: [timeouts]
    - terraform_type: aws_bedrockagent_agent_collaborator
      pulumi_type: aws:bedrock/agentAgentCollaborator:AgentAgentCollaborator
      id_format: "{agent_id},{agent_version},{collaborator_id}"
      notes: >-
        Agent id, version (DRAFT for platform-managed collaborators), and
        collaborator id separated by commas
        (`aws bedrock-agent list-agent-collaborators --agent-id <id>
        --agent-version DRAFT` shows collaboratorId).
      config_only_attributes: [prepare_agent, timeouts]
    - terraform_type: aws_bedrockagent_agent_knowledge_base_association
      pulumi_type: aws:bedrock/agentAgentKnowledgeBaseAssociation:AgentAgentKnowledgeBaseAssociation
