      # Bedrock stores variant inference floats as float32: a value that is
      # not float32-exact (0.9, 0.7, ...) reads back widened
      # (0.8999999761581421), and the pinned provider has no semantic float
      # equality on the import path, so a blind import plans a one-time
      # in-place update on exactly these leaves (live-caught 2026-08-14:
      # top_p 0.9). Post-APPLY state keeps the config value (idempotency
      # holds), and the reconcile apply is a server-side no-op -- the wart
      # is import-only.
      write_normalized_attributes:
        - variant.inference_configuration.text.temperature
