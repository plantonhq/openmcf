apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awssnstopic
spec:
  # An SNS topic under E2E: the harness runs deploy -> GetTopicAttributes
  # verify -> destroy -> verify-destroyed on both provisioners. The scenario
  # is a standard topic with SHA256 signatures, active X-Ray tracing, and an
  # explicit access policy struct -- the smallest honest policy/tracing
  # surface without KMS encryption or delivery-feedback roles. Deliberately
  # not in the live scenario: FIFO topics, message archiving, data
  # protection policies, and per-protocol delivery logging -- all proven by
  # CEL spec tests and the offline gate.
  tier: 1
  # Proven live 2026-08-12, both engines, plus the blind import round-trip
  # on the Terraform lane (topic_arn re-imported, plan zero-diff) -- the
  # re-proof after the Pulumi FIFO content_based_deduplication send
  # converged to state-pinned.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
