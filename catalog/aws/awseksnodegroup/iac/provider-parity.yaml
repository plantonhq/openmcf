# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_eks_node_group:
    mappings:
      # The spec says what the value IS (a size in GiB); the provider name
      # is unitless.
      - spec: spec.disk_size_gb
        arg: disk_size
      # Repeated-message fields are plural per proto style; provider
      # blocks are singular. Exact matching resumes below.
      - spec: spec.taints
        arg: taint
      - spec: spec.scaling
        arg: scaling_config
      # The reference names WHAT it references; the provider's `id` is
      # bare because its block supplies the context.
      - spec: spec.launch_template.launch_template_id
        arg: launch_template.id
      # The provider repeats its block name inside itself; the spec says
      # `overrides` once. Exact matching resumes below.
      - spec: spec.node_repair_config.overrides
        arg: node_repair_config.node_repair_config_overrides
    exclusions:
      - arg: node_group_name
        reason: derived from metadata.name -- never free-form user surface
      - arg: node_group_name_prefix
        reason: alternative naming form; names always derive from metadata.name
      - arg: launch_template.name
        reason: alternative form to launch_template.id (provider ConflictsWith); the spec models the id arm, which the AwsLaunchTemplate reference resolves to
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
