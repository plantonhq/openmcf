apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxOpenzfsFileSystem
metadata:
  org: example-org
  env: production
  name: elastic-openzfs
  id: awsfxz-elastic-openzfs-production
spec:
  region: <aws-region>
  # INTELLIGENT_TIERING: elastic, pay-for-what-you-store capacity — no
  # provisioned storage_capacity_gib. MULTI_AZ_1 only.
  deployment_type: MULTI_AZ_1
  storage_type: INTELLIGENT_TIERING
  throughput_capacity: 1280
  # Let AWS size the SSD read cache from the provisioned throughput.
  read_cache_configuration:
    sizing_mode: PROPORTIONAL_TO_THROUGHPUT_CAPACITY
  subnet_ids:
    - value: subnet-0123456789abcdef0
    - value: subnet-0987654321fedcba0
  preferred_subnet_id:
    value: subnet-0123456789abcdef0
  route_table_ids:
    - value: rtb-0123456789abcdef0
  security_group_ids:
    - value: sg-0123456789abcdef0
  root_volume_configuration:
    data_compression_type: ZSTD
    nfs_exports:
      client_configurations:
        - clients: "10.0.0.0/16"
          options:
            - rw
            - crossmnt
  automatic_backup_retention_days: 7
  weekly_maintenance_start_time: "7:02:00"
