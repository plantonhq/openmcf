apiVersion: aws.planton.dev/v1alpha1
kind: AwsRdsCluster
metadata:
  name: my-aurora-mysql
spec:
  region: us-west-2
  subnetIds:
    - value: subnet-replace-with-private-az1
    - value: subnet-replace-with-private-az2
  securityGroupIds:
    - value: sg-replace-with-database-sg
  engine: aurora-mysql
  # Empty engineVersion would keep the AWS default; pinning is the
  # production posture so upgrades are deliberate.
  engineVersion: "8.0.mysql_aurora.3.08.0"
  databaseName: appdb
  masterUsername: dbadmin # AWS has no default master username -- pick one (avoid reserved names like rdsadmin)
  manageMasterUserPassword: true # recommended_default -- AWS generates, stores, and rotates the password in Secrets Manager
  storageEncrypted: true # recommended_default -- create-time-only, cannot be enabled later
  deletionProtection: true
  backupRetentionPeriod: 7
  skipFinalSnapshot: false
  finalSnapshotIdentifier: my-aurora-mysql-final
  copyTagsToSnapshot: true
  # In-place rewind for fat-fingered writes -- Aurora MySQL only, and
  # only enableable at create time (24-hour window here).
  backtrackWindowSeconds: 86400
  enabledCloudwatchLogsExports:
    - error
    - slowquery
  performanceInsightsEnabled: true # free at the default 7-day retention
  # The compute serving queries: one writer plus one reader for
  # high availability.
  instances:
    - name: writer
      instanceClass: db.r6g.large
      promotionTier: 0
    - name: reader-1
      instanceClass: db.r6g.large
      promotionTier: 1
