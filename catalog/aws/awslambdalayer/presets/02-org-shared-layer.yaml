apiVersion: aws.planton.dev/v1alpha1
kind: AwsLambdaLayer
metadata:
  name: org-runtime-layer
spec:
  region: us-east-1
  code:
    bucket:
      valueFrom:
        kind: AwsS3Bucket
        name: build-artifacts
        fieldPath: status.outputs.bucket_id
    key: layers/org-runtime.zip
  # sourceCodeHash is deliberately omitted: empty means a new version
  # publishes whenever the S3 key or object version changes - the right
  # starter behavior. Pipelines that want content-addressed republishes
  # set it to base64(sha256(zip)) at build time.
  description: Organization-wide custom runtime layer
  compatibleRuntimes:
    - provided.al2023
  skipDestroy: true
  permissions:
    - statementId: org-wide
      principal: "*"
      # Placeholder - replace with your organization's real o-... id
      # (AWS Organizations console). Spelled as a VALID id (lowercase
      # letters and digits only): the spec validates the o- pattern, so
      # an uppercase REPLACE-style placeholder fails validation as
      # shipped.
      organizationId: o-replaceme0000
