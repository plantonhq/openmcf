apiVersion: aws.planton.dev/v1alpha1
kind: AwsEventBridgeApiDestination
metadata:
  name: crm-events
spec:
  region: us-east-1
  connection:
    name: crm-oauth
    description: CRM events API (OAuth client credentials)
    # Every credential-bearing field on this kind is sensitive: the
    # backend accepts ONLY $secret/<slug> org-secret references here,
    # never plaintext. Create the named org secrets first (or pick
    # existing ones in the wizard).
    oauth:
      authorizationEndpoint: https://auth.crm.example.com/oauth2/token
      httpMethod: POST
      clientId: planton-events
      clientSecret: $secret/crm-oauth-client-secret
      # AWS masks every connection http-parameter value on read, so
      # the spec secret-types them ALL - even conventionally
      # non-secret token-request values (grant_type, scope) must be
      # $secret references in this kind.
      oauthHttpParameters:
        body:
          - key: grant_type
            value: $secret/crm-oauth-grant-type
          - key: scope
            value: $secret/crm-oauth-scope
  destination:
    name: crm-events
    description: CRM activity-stream endpoint
    invocationEndpoint: https://api.crm.example.com/v2/activities
    httpMethod: POST
    invocationRateLimitPerSecond: 25
