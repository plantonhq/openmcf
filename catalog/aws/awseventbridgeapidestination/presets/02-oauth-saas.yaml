apiVersion: aws.planton.dev/v1alpha1
kind: AwsEventBridgeApiDestination
metadata:
  name: crm-events
spec:
  region: us-east-1
  connection:
    name: crm-oauth
    description: CRM events API (OAuth client credentials)
    oauth:
      authorizationEndpoint: https://auth.crm.example.com/oauth2/token
      httpMethod: POST
      clientId: planton-events
      clientSecret: replace-with-real-secret
      oauthHttpParameters:
        body:
          - key: grant_type
            value: client_credentials
          - key: scope
            value: events:write
  destination:
    name: crm-events
    description: CRM activity-stream endpoint
    invocationEndpoint: https://api.crm.example.com/v2/activities
    httpMethod: POST
    invocationRateLimitPerSecond: 25
