apiVersion: aws.planton.dev/v1alpha1
kind: AwsEventBridgeApiDestination
metadata:
  name: partner-webhook
spec:
  region: us-east-1
  connection:
    name: partner-api
    description: Partner ingestion API (api-key auth)
    # Every credential-bearing field on this kind is sensitive: the
    # backend accepts ONLY $secret/<slug> org-secret references here,
    # never plaintext. Create the named org secret first (or pick an
    # existing one in the wizard).
    apiKey:
      key: x-api-key
      value: $secret/partner-api-key
    invocationHttpParameters:
      # AWS masks every connection http-parameter value on read, so
      # the spec secret-types them ALL - even a static routing header
      # value must be a $secret reference in this kind.
      header:
        - key: x-source
          value: $secret/partner-webhook-source-header
  destination:
    name: partner-webhook
    description: Partner order-events webhook
    invocationEndpoint: https://api.example.com/events
    httpMethod: POST
    invocationRateLimitPerSecond: 50
