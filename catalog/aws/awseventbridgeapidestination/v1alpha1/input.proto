syntax = "proto3";

package dev.planton.aws.awseventbridgeapidestination.v1alpha1;

import "catalog/aws/awseventbridgeapidestination/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsEventBridgeApiDestinationStackInput is the input for the IaC
// modules that manage an EventBridge API destination and its
// connection.
message AwsEventBridgeApiDestinationStackInput {
  // target is the AwsEventBridgeApiDestination resource to deploy.
  AwsEventBridgeApiDestination target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
