# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_cloudwatch_event_bus:
    exclusions:
      # Identity is the kind's own contract.
      - arg: name
        reason: derived from metadata.name (plan-time guarded against the reserved "default" bus name) -- never free-form user surface
      # Tag machinery.
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  # The bus's resource-based policy (cross-account / cross-org PutEvents
  # grants) -- AWS models it as its own PutPermission call, so it
  # materializes as a satellite resource rendered from spec.resource_policy.
  aws_cloudwatch_event_bus_policy:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      - arg: policy
        spec: spec.resource_policy
    exclusions:
      - arg: event_bus_name
        reason: module-wired to the bus this kind creates -- the satellite always attaches to its own bus, never free-form user surface

  # Event archives -- one aws_cloudwatch_event_archive per spec.archives
  # entry, recorded from THIS bus (replay is the imperative StartReplay
  # operation, not declarative surface).
  aws_cloudwatch_event_archive:
    specRoot: spec.archives
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
    exclusions:
      - arg: event_source_arn
        reason: module-wired to the ARN of the bus this kind creates -- archives are bus-scoped children, never free-form user surface
