# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_ebs_snapshot:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
    exclusions:
      - arg: outpost_arn
        reason: Outposts surface -- the catalog's recorded Outposts exclusion (no Outposts capacity to model or prove against)
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_ebs_snapshot_copy:
    mappings:
      - arg: region
        spec: spec.region
      # The copy arm folds in as spec.copy_from; the shared tiering
      # dials reuse the top-level spec fields.
      - arg: source_snapshot_id
        spec: spec.copy_from.source_snapshot_id
      - arg: source_region
        spec: spec.copy_from.source_region
      - arg: encrypted
        spec: spec.copy_from.encrypted
      - arg: kms_key_id
        spec: spec.copy_from.kms_key_id
      - arg: completion_duration_minutes
        spec: spec.copy_from.completion_duration_minutes
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_ebs_snapshot_import:
    mappings:
      - arg: region
        spec: spec.region
      # The import arm folds in as spec.import_from.
      - arg: role_name
        spec: spec.import_from.role_name
      - arg: encrypted
        spec: spec.import_from.encrypted
      - arg: kms_key_id
        spec: spec.import_from.kms_key_id
      - arg: disk_container.format
        spec: spec.import_from.disk_container.format
      - arg: disk_container.description
        spec: spec.import_from.disk_container.description
      - arg: disk_container.url
        spec: spec.import_from.disk_container.url
      - arg: disk_container.user_bucket.s3_bucket
        spec: spec.import_from.disk_container.s3_bucket
      - arg: disk_container.user_bucket.s3_key
        spec: spec.import_from.disk_container.s3_key
    exclusions:
      - arg: client_data
        reason: import-task upload bookkeeping (client comment and upload start/end/size stamps), not disk-image configuration -- the module never sends it and AWS never acts on it for module-driven imports
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_ebs_fast_snapshot_restore:
    mappings:
      - arg: region
        spec: spec.region
      # One provider resource per zone in the spec's list.
      - arg: availability_zone
        spec: spec.fast_restore_availability_zones
    exclusions:
      - arg: snapshot_id
        reason: wired by the module to the folded snapshot's own AWS-generated ID -- FSR always targets THIS snapshot, never a foreign one
  aws_snapshot_create_volume_permission:
    mappings:
      - arg: region
        spec: spec.region
      # One provider resource per account in the spec's list.
      - arg: account_id
        spec: spec.share_with_account_ids
    exclusions:
      - arg: snapshot_id
        reason: wired by the module to the folded snapshot's own AWS-generated ID -- a grant always shares THIS snapshot, never a foreign one
