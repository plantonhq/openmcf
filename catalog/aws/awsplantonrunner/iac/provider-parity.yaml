# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# AwsPlantonRunner is the Planton-internal runner APPLIANCE: a composite of
# ten provider resources (ECS Fargate worker + IAM + secret + logs + security
# group) whose spec deliberately models INTENT — placement, sizing, version,
# execution mode, credentials — and not the underlying resources. Every
# consumed resource is module-shaped plumbing (the internal judgment); every
# spec field drives one or more of those internal resources and is accounted
# below. No resource here is user-configurable provider surface: adopters who
# want first-class ECS/IAM/Secrets/CloudWatch configuration use those kinds.

resources:
  aws_ecs_cluster:
    internal: module-shaped appliance plumbing -- a dedicated single-service cluster hosting the runner; name and settings are module decisions

  aws_ecs_task_definition:
    internal: module-shaped appliance plumbing -- the runner's Fargate task; spec.cpu/spec.memory size it, spec.image_repository + spec.runner_version compose its container image, spec.execution_mode selects the container command, spec.task_role wires its task role

  aws_ecs_service:
    internal: module-shaped appliance plumbing -- the always-on runner service; spec.subnets/spec.security_groups/spec.assign_public_ip form its network configuration

  aws_iam_role:
    internal: module-shaped appliance plumbing -- two module-owned roles (the execution role that pulls the image and reads the credentials secret, and a runtime fallback used only when spec.task_role is not provided); trust policies and names are module decisions

  aws_iam_role_policy:
    internal: module-shaped appliance plumbing -- the execution role's inline read grant on the module-owned credentials secret

  aws_iam_role_policy_attachment:
    internal: module-shaped appliance plumbing -- the AWS-managed ECS task execution policy attached to the module-owned execution role

  aws_cloudwatch_log_group:
    internal: module-shaped appliance plumbing -- the runner's log destination; spec.log_retention_days sets its retention, everything else is a module decision

  aws_secretsmanager_secret:
    internal: module-shaped appliance plumbing -- the module-owned secret holding spec.credentials so the connection document never rides the task definition in plaintext

  aws_secretsmanager_secret_version:
    internal: module-shaped appliance plumbing -- the credentials payload written into the module-owned secret

  aws_security_group:
    internal: module-shaped appliance plumbing -- the egress-only fallback group used when spec.security_groups is not provided; rules are module decisions

specExclusions:
  # Every spec field drives internal appliance resources (judged above);
  # none is a 1:1 provider-argument pass-through surface.
  - field: spec.region
    reason: provider-connection region for the whole appliance -- drives where every internal resource is created
  - field: spec.subnets
    reason: drives the internal aws_ecs_service's network configuration (awsvpc subnets)
  - field: spec.security_groups
    reason: drives the internal aws_ecs_service's network configuration; when unset the module creates the internal fallback aws_security_group
  - field: spec.assign_public_ip
    reason: drives the internal aws_ecs_service's network configuration (public-IP assignment for NAT-less subnets)
  - field: spec.cpu
    reason: sizes the internal aws_ecs_task_definition (Fargate cpu units; the spec CEL enforces AWS's cpu/memory pairing matrix)
  - field: spec.memory
    reason: sizes the internal aws_ecs_task_definition (Fargate memory MiB; the spec CEL enforces AWS's cpu/memory pairing matrix)
  - field: spec.runner_version
    reason: composes the internal aws_ecs_task_definition's container image tag
  - field: spec.image_repository
    reason: composes the internal aws_ecs_task_definition's container image repository
  - field: spec.execution_mode
    reason: selects the runner process's mode (temporal/dual/grpc) in the internal aws_ecs_task_definition's container command
  - field: spec.credentials
    reason: the Planton connection document, stored in the internal aws_secretsmanager_secret and injected into the task as a secret -- never a provider argument in plaintext
  - field: spec.task_role
    reason: wires the internal aws_ecs_task_definition's task role; when unset the module creates the internal runtime fallback aws_iam_role
  - field: spec.log_retention_days
    reason: sets the internal aws_cloudwatch_log_group's retention_in_days
