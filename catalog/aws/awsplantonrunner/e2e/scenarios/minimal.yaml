# Minimal AwsPlantonRunner scenario: the appliance on the two-AZ subnet
# pair with a synthetic credentials document (obviously-fake placeholder
# values -- the container never authenticates anywhere; see
# ../profile.yaml for why service-level verification makes that the
# right lane shape). Full metadata is supplied for tagging/orphan
# cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsPlantonRunner
metadata:
  name: planton-oss-e2e-planton-runner
  id: planton-oss-e2e-planton-runner
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsplantonrunner
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  credentials: '{"type":"planton_runner","org":"planton-oss","runner":"planton-oss-e2e-planton-runner","channel_identifier":"org.planton-oss.runner.planton-oss-e2e-planton-runner","api_key":"pak_FAKE_E2E_PLACEHOLDER","planton_api_endpoint":"api.example.invalid:443"}'
