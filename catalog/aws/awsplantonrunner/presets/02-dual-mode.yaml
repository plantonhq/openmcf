apiVersion: aws.planton.dev/v1alpha1
kind: AwsPlantonRunner
metadata:
  name: <runner-name>
spec:
  region: <aws-region>
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  credentials: $secret/<runner-credentials-secret-slug>
  # dual adds the real-time CloudOps channel beside the deploy worker;
  # the channel reaches the runner through an outbound-initiated tunnel,
  # so the network posture stays outbound-only.
  executionMode: dual
