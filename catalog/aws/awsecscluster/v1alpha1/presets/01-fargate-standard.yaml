apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsCluster
metadata:
  name: my-fargate-cluster
spec:
  region: <aws-region>
  containerInsights: enhanced  # container-level observability with automatic dashboards
  capacityProviders:
    - FARGATE
  executeCommandConfiguration:
    logging: DEFAULT  # exec sessions audited via each task's own log configuration
