syntax = "proto3";

package dev.planton.aws.awsbedrockinferenceprofile.v1alpha1;

import "catalog/aws/awsbedrockinferenceprofile/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockInferenceProfileStackInput is the input for the IaC modules
// that deploy the Bedrock inference profile.
message AwsBedrockInferenceProfileStackInput {
  // target is the AwsBedrockInferenceProfile resource to deploy.
  AwsBedrockInferenceProfile target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
