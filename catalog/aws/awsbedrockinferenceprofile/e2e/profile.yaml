apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsbedrockinferenceprofile
spec:
  # A Bedrock application inference profile under live E2E: one free,
  # seconds-scale lane (the profile is pure metadata; invocations bill at
  # the underlying model's rates and the lane never invokes). The lane
  # routes to a foundation model directly. Verification is
  # GetInferenceProfile keyed on inference_profile_id (status ACTIVE, type
  # APPLICATION, the resolved models list naming the source model) plus
  # per-engine tag echoes (ListTagsForResource -- the canonical six-key
  # identity map including Name).
  #
  # The system-defined cross-region source shape (copy_from =
  # arn:...:inference-profile/us.<model>) is NOT a separate lane:
  # copy_from is a single string both modules forward verbatim, so the
  # foundation-model lane proves the forwarding path, and the cross-region
  # ARN embeds the caller's account id, which a committed manifest cannot
  # carry honestly.
  #
  # pending_proof: forged this session to the full offline bar -- Q33
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
