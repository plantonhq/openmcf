apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: awsbackupsettings
spec:
  # Settings singletons import by their identity: the global arm by
  # the ACCOUNT ID, the region arm by the REGION - both are stack
  # outputs (no name involved; metadata.name never reaches AWS).
  values:
    - name: account_id
      derivations:
        - from_stack_output: account_id
      where_to_find: >-
        The AWS account ID (`aws sts get-caller-identity` shows
        Account) -- the global settings resource's identity at AWS.
    - name: region
      derivations:
        - from_stack_output: region
      where_to_find: >-
        The region the instance manages (spec.region) -- the region
        settings resource's identity at AWS.
