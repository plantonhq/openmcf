apiVersion: aws.planton.dev/v1alpha1
kind: AwsEbsVolume
metadata:
  name: db-data
spec:
  region: us-east-1
  availabilityZone: us-east-1a
  type: gp3
  sizeGb: 200
  iops: 6000
  throughputMibps: 250
  encrypted: true
  attachments:
    - deviceName: /dev/sdf
      instanceId:
        value: i-0123456789abcdef0
