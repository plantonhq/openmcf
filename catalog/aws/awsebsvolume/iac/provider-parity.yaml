# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_ebs_volume:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # Leaf names that differ carry the unit.
      - arg: size
        spec: spec.size_gb
      - arg: throughput
        spec: spec.throughput_mibps
    exclusions:
      - arg: outpost_arn
        reason: Outposts surface -- the catalog's recorded Outposts exclusion (no Outposts capacity to model or prove against)
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_ebs_volume_copy:
    mappings:
      - arg: region
        spec: spec.region
      # The copy arm folds in as spec.copy_from; the shared perf dials
      # reuse the create arm's spec fields.
      - arg: source_volume_id
        spec: spec.copy_from.source_volume_id
      - arg: size
        spec: spec.size_gb
      - arg: volume_type
        spec: spec.type
      - arg: throughput
        spec: spec.throughput_mibps
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
  aws_volume_attachment:
    mappings:
      - arg: region
        spec: spec.region
      # Attachments fold in as the spec.attachments list.
      - arg: device_name
        spec: spec.attachments.device_name
      - arg: instance_id
        spec: spec.attachments.instance_id
      - arg: force_detach
        spec: spec.attachments.force_detach
      - arg: skip_destroy
        spec: spec.attachments.skip_destroy
      - arg: stop_instance_before_detaching
        spec: spec.attachments.stop_instance_before_detaching
    exclusions:
      - arg: volume_id
        reason: wired by the module to the folded volume's own AWS-generated ID -- an attachment always attaches THIS volume, never a foreign one
