apiVersion: aws.planton.dev/v1alpha1
kind: AwsBudget
metadata:
  name: monthly-cost-guardrail
spec:
  region: us-east-1
  budgetName: Monthly Cost Guardrail
  budgetType: COST
  timeUnit: MONTHLY
  limit:
    amount: "1000"
    unit: USD
  notifications:
    - comparisonOperator: GREATER_THAN
      notificationType: ACTUAL
      threshold: 80
      thresholdType: PERCENTAGE
      subscriberEmailAddresses:
        # Placeholder - replace with your real list. Spelled as a
        # VALID address (no angle brackets): the spec validates email
        # format, so the bracketed placeholder convention fails here.
        - finops-team@your-company.com
    - comparisonOperator: GREATER_THAN
      notificationType: FORECASTED
      threshold: 100
      thresholdType: PERCENTAGE
      subscriberEmailAddresses:
        # Placeholder - replace with your real list. Spelled as a
        # VALID address (no angle brackets): the spec validates email
        # format, so the bracketed placeholder convention fails here.
        - finops-team@your-company.com
