apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecretsManagerSecret
metadata:
  name: <env>/<app>/db
spec:
  region: <aws-region>
  description: Database credentials with 30-day automatic rotation
  stringValue: $secret/<app>-db-credentials
  # A customer-managed key -- required in practice when other accounts must
  # read the secret, and the right posture for regulated workloads.
  kmsKeyId:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key-resource-name>
      fieldPath: status.outputs.key_arn
  rotation:
    # The rotation Lambda implements the four rotation steps (createSecret,
    # setSecret, testSecret, finishSecret) and must grant Secrets Manager
    # invoke permission (principal secretsmanager.amazonaws.com).
    rotationLambdaArn:
      valueFrom:
        kind: AwsLambda
        name: <rotation-function-resource-name>
        fieldPath: status.outputs.function_arn
    automaticallyAfterDays: 30
    # Rotate once immediately so the deployed credential is one the
    # rotation function issued -- the bootstrap value never reaches
    # production use.
    rotateImmediately: true
