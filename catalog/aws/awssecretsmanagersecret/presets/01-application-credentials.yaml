apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecretsManagerSecret
metadata:
  name: <app>-credentials
spec:
  region: <aws-region>
  # The explicit AWS-side name: hierarchical paths live HERE (resource
  # names cannot carry slashes) -- replace the example path segments, or
  # omit the field entirely to name the secret after metadata.name.
  secretName: prod/myapp/credentials
  description: Application credentials for <app>
  # A managed-secret reference -- the platform resolves it just-in-time at
  # deploy; plaintext never lives in the control plane. The JSON key/value
  # shape is what the Secrets Manager console and rotation functions expect.
  stringValue: $secret/<app>-credentials
  # 7 days of recoverable soft-delete on destroy -- enough to catch an
  # accidental deletion without reserving the name for a full month.
  recoveryWindowInDays: 7
