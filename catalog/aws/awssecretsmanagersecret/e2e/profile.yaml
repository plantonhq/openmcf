apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awssecretsmanagersecret
spec:
  # A Secrets Manager secret under live E2E: two free, seconds-scale lanes.
  # The minimal lane proves the secret + managed version lifecycle with
  # recovery_window 0 (the name frees immediately, keeping re-runs clean).
  # The full-surface lane adds the resource policy (through the standalone
  # policy resource with block_public_policy), a custom staging label
  # riding AWSCURRENT, and a us-east-1 replica -- the zero-orphan sweep
  # must treat the replica region too. Verification is DescribeSecret keyed
  # on the secret name (a secret with DeletedDate set counts as absent --
  # the soft-delete class).
  #
  # Deliberately not exercised live: rotation (both arms need real rotation
  # infrastructure -- a Lambda implementing the four rotation steps with
  # invoke permission for secretsmanager.amazonaws.com, or a partner-side
  # external integration; offline plans/previews prove the render
  # arm-for-arm) and binary_value (same PutSecretValue path as
  # string_value). Unblock: a rotation-function fixture (a minimal Python
  # rotation handler packaged as an AwsLambda prerequisite shape).
  #
  # pending_proof: forged this session to the full offline bar -- Q32
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
