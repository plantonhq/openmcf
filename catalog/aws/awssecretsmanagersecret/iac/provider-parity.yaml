# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_secretsmanager_secret:
    mappings:
      # The provider's replica set IS the spec's replica_regions list
      # (region + per-replica kms_key_id map one-to-one beneath it).
      - arg: replica
        spec: spec.replica_regions
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name -- the secret name is platform naming, never free-form spec surface
      - arg: name_prefix
        reason: provider auto-naming (random suffix) -- unused by design; the secret name is metadata.name on both engines
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  aws_secretsmanager_secret_policy:
    # policy and block_public_policy exact-match their spec fields under the
    # default root. The module renders the policy through THIS resource
    # (never the secret's inline policy argument) because only this
    # resource carries block_public_policy; the inline argument matches the
    # same spec.policy field -- one setting, two provider homes.
    exclusions:
      - arg: secret_arn
        reason: wired by the module to the secret it creates -- parent linkage, never user surface

  aws_secretsmanager_secret_version:
    mappings:
      - arg: secret_string
        spec: spec.string_value
      - arg: secret_binary
        spec: spec.binary_value
    exclusions:
      - arg: secret_id
        reason: wired by the module to the secret it creates -- parent linkage, never user surface
      - arg: secret_string_wo
        reason: the write-only twin of secret_string (exists to keep the value out of Terraform state) -- on this platform the value is a managed-secret reference resolved just-in-time and the state backend is encrypted, so one value arm per encoding is the honest spec surface
      - arg: secret_string_wo_version
        reason: the write-only arm's change-detection counter -- excluded with secret_string_wo

  aws_secretsmanager_secret_rotation:
    specRoot: spec.rotation
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The provider's rotation_rules block flattens onto the spec's
      # rotation message (cadence + window duration).
      - arg: rotation_rules
        spec: spec.rotation
      # The provider spells the external arm "external_secret_rotation_*";
      # the spec drops the redundant "secret" (the whole kind is a secret).
      - arg: external_secret_rotation_role_arn
        spec: spec.rotation.external_rotation_role_arn
      - arg: external_secret_rotation_metadata
        spec: spec.rotation.external_rotation_metadata
    exclusions:
      - arg: secret_id
        reason: wired by the module to the secret it creates -- parent linkage, never user surface
