apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsekscluster
spec:
  # An EKS control plane under live E2E: deploy -> DescribeCluster verify ->
  # destroy -> verify-destroyed on both provisioners. The control plane is
  # the slowest single resource in the AWS suite -- AWS takes ~10-15 minutes
  # to create one and ~10 to delete it -- so the timeout is sized for a full
  # cycle plus the subnet/role prerequisite chain.
  # pending_proof: the depth-closure wave added the provisioned scaling
  # tier, hybrid-node remote networks, and the Pulumi engine's first
  # control_plane_egress_mode wiring -- the prior green predates this
  # surface, so the badge is revoked until the proof lane re-earns it.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 60
