apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksCluster
metadata:
  name: <cluster-name>
spec:
  region: <aws-region>
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  clusterRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <cluster-role-resource-name>
      fieldPath: status.outputs.role_arn
  # Hybrid nodes reach the API server over VPN/Direct Connect, so the
  # private endpoint is the one that matters; keep the public endpoint
  # for operator access or turn it off once tooling moves inside.
  endpointPrivateAccess: true
  accessConfig:
    authenticationMode: API
  # EKS Hybrid Nodes: the on-premises/edge networks whose nodes and pods
  # join this cluster. Declaring the ranges is free -- billing starts
  # only when hybrid nodes register (per vCPU). Both ranges must be
  # routable from the VPC and must not overlap it.
  remoteNetworks:
    # Where the on-prem machines' own addresses live -- kubelet
    # registrations are accepted from these blocks.
    nodeCidrs:
      - <on-prem-node-cidr>
    # Where the on-prem CNI assigns pod addresses -- needed when pods
    # must be directly routable from the cluster (webhooks, east-west).
    podCidrs:
      - <on-prem-pod-cidr>
  enabledClusterLogTypes:
    - audit
    - authenticator
