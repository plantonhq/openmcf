# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_api_gateway_usage_plan:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      - arg: api_stages.api_id
        spec: spec.api_stages.rest_api_id
      - arg: api_stages.stage
        spec: spec.api_stages.stage_name
      # The per-method throttle set pluralizes descriptively in the spec.
      - arg: api_stages.throttle
        spec: spec.api_stages.method_throttles
      - arg: api_stages.throttle.path
        spec: spec.api_stages.method_throttles.path
      - arg: api_stages.throttle.burst_limit
        spec: spec.api_stages.method_throttles.burst_limit
      - arg: api_stages.throttle.rate_limit
        spec: spec.api_stages.method_throttles.rate_limit
      # The provider's settings wrappers; the spec names the concepts
      # directly.
      - arg: quota_settings
        spec: spec.quota
      - arg: quota_settings.limit
        spec: spec.quota.limit
      - arg: quota_settings.period
        spec: spec.quota.period
      - arg: quota_settings.offset
        spec: spec.quota.offset
      - arg: throttle_settings
        spec: spec.throttle
      - arg: throttle_settings.burst_limit
        spec: spec.throttle.burst_limit
      - arg: throttle_settings.rate_limit
        spec: spec.throttle.rate_limit
    exclusions:
      - arg: name
        reason: metadata.name is the naming basis on both engines -- never free-form spec surface
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  aws_api_gateway_api_key:
    specRoot: spec.api_keys
    mappings:
      - arg: region
        spec: spec.region
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  # The membership attaching each created key to this plan: pure join
  # resource, every argument module-wired.
  aws_api_gateway_usage_plan_key:
    internal: module-shaped join attaching each spec.api_keys entry to the plan (key_id/usage_plan_id wire to resources created in the same plan; key_type is the constant API_KEY)
