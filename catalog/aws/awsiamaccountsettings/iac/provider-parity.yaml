# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  # The alias resource's one argument matches spec.account_alias under
  # the default root -- no recorded judgment needed.
  aws_iam_account_password_policy:
    # The password-policy arm is a typed message: the resource's
    # top-level arguments all live under it, names matching 1:1.
    specRoot: spec.password_policy
  aws_iam_security_token_service_preferences:
    # The STS arm is a typed message; the one argument lives under it.
    specRoot: spec.sts
specExclusions:
  # IAM is a GLOBAL service: none of the consumed resources carries a
  # region argument. The spec's region drives only the provider
  # connection.
  - field: spec.region
    reason: provider-connection region only -- IAM is global and none of the consumed resources has a region argument
