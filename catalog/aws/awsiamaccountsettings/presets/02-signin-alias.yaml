apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamAccountSettings
metadata:
  name: iam-account-alias
spec:
  region: us-east-1
  # The alias must be lowercase letters, digits, and hyphens (the field's
  # own pattern rejects placeholders), globally unique across ALL AWS
  # accounts, and it REPLACES your account's sign-in URL when applied.
  accountAlias: replace-me-signin-alias
