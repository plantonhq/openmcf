apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamOidcProvider
metadata:
  name: partner-oidc
spec:
  region: <aws-region>
  url:
    value: <https-issuer-url>
  clientIdList:
    - <audience>
  # thumbprintList is deliberately omitted: leaving it empty is the correct
  # default -- AWS derives thumbprints for publicly trusted root CAs. Supply
  # entries (40-hex-char SHA-1 values) only when the issuer's root CA is NOT
  # publicly trusted.
