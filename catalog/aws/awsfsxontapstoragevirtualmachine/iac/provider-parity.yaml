# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_fsx_ontap_storage_virtual_machine:
    mappings:
      # ONTAP SVMs support self-managed Active Directory ONLY (no AWS Managed
      # AD arm, no Secrets Manager arm), so the provider's intermediate
      # self_managed_active_directory_configuration wrapper under
      # active_directory_configuration is nesting without meaning -- the spec
      # flattens the self-managed leaves one level up, alongside netbios_name
      # (which stays at the provider's own depth and matches by name).
      - spec: spec.active_directory_configuration.dns_ips
        arg: active_directory_configuration.self_managed_active_directory_configuration.dns_ips
      - spec: spec.active_directory_configuration.domain_name
        arg: active_directory_configuration.self_managed_active_directory_configuration.domain_name
      - spec: spec.active_directory_configuration.username
        arg: active_directory_configuration.self_managed_active_directory_configuration.username
      - spec: spec.active_directory_configuration.password
        arg: active_directory_configuration.self_managed_active_directory_configuration.password
      - spec: spec.active_directory_configuration.file_system_administrators_group
        arg: active_directory_configuration.self_managed_active_directory_configuration.file_system_administrators_group
      - spec: spec.active_directory_configuration.organizational_unit_distinguished_name
        arg: active_directory_configuration.self_managed_active_directory_configuration.organizational_unit_distinguished_name

    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
