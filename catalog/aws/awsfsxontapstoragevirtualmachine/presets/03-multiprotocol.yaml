apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxOntapStorageVirtualMachine
metadata:
  name: multi-svm
  id: awsfxosvm-multi-svm-prod
  org: example-org
  env: prod
spec:
  region: <aws-region>
  file_system_id:
    value: fs-0123456789abcdef0
  name: svm_multi
  root_volume_security_style: MIXED
  # Passwords are sensitive: reference managed secrets ($secret/<slug>) --
  # never plaintext values.
  svm_admin_password: $secret/svm-admin-password
  active_directory_configuration:
    netbios_name: SVMMULTI
    domain_name: corp.example.com
    dns_ips:
      - "10.0.0.1"
      - "10.0.0.2"
    username: svc_fsx_join
    password: $secret/fsx-ad-join-password
    file_system_administrators_group: FSx Admins
    organizational_unit_distinguished_name: "OU=FSx,DC=corp,DC=example,DC=com"
