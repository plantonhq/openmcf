apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsecstaskdefinition
spec:
  # A task definition under live E2E: deploy -> DescribeTaskDefinition
  # verify (ACTIVE) -> destroy -> verify-deregistered (INACTIVE) on both
  # provisioners. Registering a revision is a pure control-plane call --
  # no task ever launches, so the run is fast and free; the CloudWatch
  # log group the module creates alongside it is likewise free. The one
  # prerequisite is the shared execution-role fixture, which AWS requires
  # at registration time for Fargate tasks on the awslogs default.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
