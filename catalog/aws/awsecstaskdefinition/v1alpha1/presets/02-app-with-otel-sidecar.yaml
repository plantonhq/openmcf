apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsTaskDefinition
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  cpu: 1024
  memory: 2048
  executionRole:
    valueFrom:
      kind: AwsIamRole
      name: <execution-role-resource-name>
      fieldPath: status.outputs.role_arn
  taskRole:
    valueFrom:
      kind: AwsIamRole
      name: <task-role-resource-name>
      fieldPath: status.outputs.role_arn
  containers:
    - name: app
      image: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/<repository>:<tag>
      cpu: 768
      memory: 1536
      portMappings:
        - containerPort: 8080
          name: http
          appProtocol: http
      environment:
        OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      healthCheck:
        command: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
        startPeriodSeconds: 30
      dependsOn:
        - containerName: otel-collector
          condition: START
    - name: otel-collector
      image: public.ecr.aws/aws-observability/aws-otel-collector:latest
      essential: false
      cpu: 256
      memory: 512
      restartPolicy:
        enabled: true
