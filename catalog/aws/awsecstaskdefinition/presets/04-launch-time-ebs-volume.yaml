apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsTaskDefinition
metadata:
  name: my-stateful-task
spec:
  region: <aws-region>
  cpu: 512
  memory: 1024
  executionRole:
    value: "<execution-role-arn>"  # or reference an AwsIamRole's role_arn output
  containers:
    - name: app
      image: <container-image>
      portMappings:
        - containerPort: 8080
          name: http
          appProtocol: http
      mountPoints:
        - sourceVolume: data
          containerPath: /var/data
  volumes:
    # Only the NAME is declared here: the AwsEcsService running this task
    # supplies the managed-EBS backing through its volumeConfiguration
    # under the same name (see the service's 04-stateful-managed-ebs
    # preset -- the two halves of one contract).
    - name: data
      configureAtLaunch: true
