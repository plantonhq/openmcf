apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsecstaskdefinition
spec:
  # A task definition under live E2E: deploy -> DescribeTaskDefinition
  # verify (ACTIVE) -> destroy -> verify-deregistered (INACTIVE) on both
  # provisioners. Registering a revision is a pure control-plane call --
  # no task ever launches, so the run is fast and free; the CloudWatch
  # log group the module creates alongside it is likewise free. The one
  # prerequisite is the shared execution-role fixture, which AWS requires
  # at registration time for Fargate tasks on the awslogs default.
  #
  # pending_proof: the spec surface deepened (launch-time configure_at_launch
  # volumes, Docker and S3-backed volume backings, EFS transit-encryption
  # port, ipc/pid namespace modes, task-level placement constraints, fault
  # injection, the MANAGED_INSTANCES compatibility) after the prior green
  # run, so that proof no longer covers the current surface. Offline plans
  # and previews passed on both engines, including the configure_at_launch
  # arm; the live lanes re-earn the badge.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
