syntax = "proto3";

package dev.planton.aws.awscloudmapnamespace.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsCloudMapNamespaceSpec defines one AWS Cloud Map namespace - the
// service-discovery registry ECS services and custom applications look
// each other up in - with its services and their statically registered
// instances managed in-line.
//
// The namespace type shapes the whole surface:
//
// HTTP namespaces are API-only - consumers discover instances by
// calling DiscoverInstances; no DNS records exist, so services here
// carry no dns_config.
//
// PRIVATE_DNS namespaces create a private hosted zone visible inside
// one VPC; services publish A/AAAA/SRV/CNAME records there.
//
// PUBLIC_DNS namespaces create a public hosted zone; services publish
// records resolvable from the internet.
//
// Services fold here because a service belongs to exactly one
// namespace for life. Statically registered instances fold under
// their service - the declarative registration surface for things
// that do not register themselves (an RDS endpoint, an on-prem
// address). Never declare instances on services that runtime
// platforms (ECS service discovery) register into: the runtime owns
// those registrations.
message AwsCloudMapNamespaceSpec {
  // The VPC pairs with the private type - a private zone must know
  // its VPC, and no other type takes one.
  option (buf.validate.message).cel = {
    id: "spec.private_dns_requires_vpc"
    message: "type PRIVATE_DNS requires vpc_id - the VPC the private hosted zone is visible in"
    expression: "this.type != 'PRIVATE_DNS' || has(this.vpc_id)"
  };
  option (buf.validate.message).cel = {
    id: "spec.vpc_only_private_dns"
    message: "vpc_id applies only when type is PRIVATE_DNS"
    expression: "!has(this.vpc_id) || this.type == 'PRIVATE_DNS'"
  };
  // HTTP namespaces are API-only - no DNS records exist to configure.
  option (buf.validate.message).cel = {
    id: "spec.http_services_carry_no_dns_config"
    message: "services in an HTTP namespace cannot set dns_config - discovery is API-only"
    expression: "this.type != 'HTTP' || this.services.all(s, !has(s.dns_config))"
  };
  // Route 53 health checks only see the public internet.
  option (buf.validate.message).cel = {
    id: "spec.health_check_config_public_only"
    message: "health_check_config (Route 53 health checks) applies only in a PUBLIC_DNS namespace - use health_check_custom_config elsewhere"
    expression: "this.type == 'PUBLIC_DNS' || this.services.all(s, !has(s.health_check_config))"
  };
  // Service names key the for_each on both engines and the output
  // maps.
  option (buf.validate.message).cel = {
    id: "spec.service_names_unique"
    message: "service names must be unique within the namespace"
    expression: "this.services.map(s, s.name).unique()"
  };

  // The AWS region the namespace lives in. Example: "us-west-2".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The namespace's discovery model. Fixed for life. A PUBLIC_DNS
  // namespace creates a real Route 53 public hosted zone for
  // metadata.name, and Route 53 REFUSES reserved documentation
  // domains there - example.com and its subdomains fail
  // CANNOT_CREATE_HOSTED_ZONE "reserved by AWS" (live-proven); .test
  // names are accepted, and you never need to own or delegate the
  // domain just to create the namespace.
  string type = 2 [(buf.validate.field).string = {
    in: [
      "HTTP",
      "PRIVATE_DNS",
      "PUBLIC_DNS"
    ]
  }];

  // The VPC a PRIVATE_DNS namespace's hosted zone is visible in.
  // Reference an AwsVpc vpc_id output or pass a literal vpc-... id.
  // Fixed for life. (The provider never reads this back from AWS -
  // imports must supply it.)
  dev.planton.shared.foreignkey.v1.StringValueOrRef vpc_id = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsVpc,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.vpc_id"
  ];

  // What this namespace is for. Updatable on DNS namespaces; on an
  // HTTP namespace the provider has no update path, so changing it
  // REPLACES the namespace (and everything registered in it).
  string description = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 1024
  ];

  // The services registered in this namespace, keyed by name.
  repeated AwsCloudMapService services = 5;
}

// AwsCloudMapService is one discoverable service in the namespace.
message AwsCloudMapService {
  // A service uses Route 53 health checks or a custom heartbeat,
  // never both.
  option (buf.validate.message).cel = {
    id: "service.at_most_one_health_check"
    message: "health_check_config and health_check_custom_config are mutually exclusive"
    expression: "!(has(this.health_check_config) && has(this.health_check_custom_config))"
  };
  // Instance ids key the registrations.
  option (buf.validate.message).cel = {
    id: "service.instance_ids_unique"
    message: "instance ids must be unique within the service"
    expression: "this.instances.map(i, i.instance_id).unique()"
  };
  // An alias registration is the whole record - AWS rejects it
  // combined with any other instance attribute.
  option (buf.validate.message).cel = {
    id: "service.alias_stands_alone"
    message: "an instance's alias_dns_name cannot combine with ip, ipv6, port, cname, or ec2_instance_id"
    expression: "this.instances.all(i, !has(i.alias_dns_name) || (i.ip == '' && i.ipv6 == '' && i.port == 0 && i.cname == '' && !has(i.ec2_instance_id)))"
  };
  // AWS derives the IP from the EC2 instance - supplying both is a
  // conflict (the provider itself drops the derived IP on read).
  option (buf.validate.message).cel = {
    id: "service.ec2_instance_derives_ip"
    message: "an instance's ec2_instance_id and ip are mutually exclusive - AWS derives the IP from the instance"
    expression: "this.instances.all(i, !has(i.ec2_instance_id) || i.ip == '')"
  };
  // Route 53 probes health-checked endpoints at ip:port, so an
  // IP-bearing instance under a health-checked service must say which
  // port - RegisterInstance fails server-side without it ("A port
  // must be supplied in order to register this instance", live-proven
  // 2026-08-26). Alias/CNAME registrations are exempt (no ip probe).
  option (buf.validate.message).cel = {
    id: "service.health_checked_instances_need_port"
    message: "instances with an ip under a health-checked service must set port - Route 53 probes ip:port"
    expression: "!has(this.health_check_config) || this.instances.all(i, i.ip == '' || i.port > 0)"
  };

  // Service name - the for_each key on both engines, the key in the
  // service_ids output, and the DNS label records publish under
  // (e.g. service "api" in namespace "corp.local" resolves at
  // "api.corp.local").
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 127
  }];

  // What this service is.
  string description = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 1024
  ];

  // The DNS records instances of this service publish (DNS
  // namespaces only).
  AwsCloudMapServiceDnsConfig dns_config = 3;

  // Route 53 health checks against instance endpoints (PUBLIC_DNS
  // namespaces only - Route 53 health checkers live on the public
  // internet).
  AwsCloudMapServiceHealthCheckConfig health_check_config = 4;

  // A custom heartbeat: your workload reports instance health via
  // UpdateInstanceCustomHealthStatus instead of Route 53 probing it.
  AwsCloudMapServiceHealthCheckCustomConfig health_check_custom_config = 5;

  // On destroy, deregister EVERYTHING registered in the service first
  // - including instances runtime platforms (ECS) registered that
  // this manifest never declared. Leave false unless this service's
  // registrations are fully owned here.
  bool force_destroy = 6;

  // Statically registered instances, keyed by instance_id - the
  // declarative registration surface for endpoints that do not
  // register themselves.
  repeated AwsCloudMapInstance instances = 7;
}

// AwsCloudMapServiceDnsConfig shapes the DNS records a service
// publishes in the namespace's hosted zone.
message AwsCloudMapServiceDnsConfig {
  // A CNAME record can answer with only one value, so AWS rejects a
  // CNAME service under the (default) MULTIVALUE policy - CreateService
  // fails server-side with "WEIGHTED routing policy must be used with
  // DNS Record Type CNAME" (live-proven 2026-08-26). Require the
  // explicit WEIGHTED so the manifest fails offline, not at deploy.
  option (buf.validate.message).cel = {
    id: "dns_config.cname_requires_weighted"
    message: "a CNAME record requires routing_policy WEIGHTED - AWS rejects CNAME under the default MULTIVALUE policy"
    expression: "!this.records.exists(r, r.type == 'CNAME') || this.routing_policy == 'WEIGHTED'"
  };

  // The record types instances publish. Fixed per record entry at the
  // provider (changing a type replaces the service's records).
  repeated AwsCloudMapServiceDnsRecord records = 1 [(buf.validate.field).repeated = {min_items: 1}];

  // How queries pick among healthy instances. MULTIVALUE answers with
  // up to eight healthy records; WEIGHTED answers with one, picked by
  // weight. Unset means AWS's default (MULTIVALUE). Fixed for life.
  // CNAME records REQUIRE the explicit WEIGHTED (see the message rule).
  string routing_policy = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "MULTIVALUE",
        "WEIGHTED"
      ]
    }
  ];
}

// AwsCloudMapServiceDnsRecord is one record type the service
// publishes.
message AwsCloudMapServiceDnsRecord {
  // The record type. A/AAAA publish instance IPs, SRV publishes
  // host+port, CNAME publishes an alias to the instance's cname
  // attribute.
  string type = 1 [(buf.validate.field).string = {
    in: [
      "A",
      "AAAA",
      "SRV",
      "CNAME"
    ]
  }];

  // The record's TTL in seconds.
  int64 ttl = 2 [(buf.validate.field).cel = {
    id: "record.ttl_range"
    message: "ttl must be between 1 and 2147483647 seconds"
    expression: "this >= 1 && this <= 2147483647"
  }];
}

// AwsCloudMapServiceHealthCheckConfig is a Route 53 health check
// applied to each registered instance (public DNS namespaces).
message AwsCloudMapServiceHealthCheckConfig {
  // HTTP/HTTPS probe resource_path; TCP just connects.
  option (buf.validate.message).cel = {
    id: "health_check.resource_path_not_tcp"
    message: "resource_path applies only to HTTP and HTTPS health checks"
    expression: "this.resource_path == '' || this.type != 'TCP'"
  };

  // How the checker probes instances. Unset means AWS's default
  // (HTTP). Fixed for life.
  string type = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "HTTP",
        "HTTPS",
        "TCP"
      ]
    }
  ];

  // The path HTTP/HTTPS probes request (e.g. "/health"). Unset means
  // "/".
  string resource_path = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 255
  ];

  // Consecutive probe results (1-10) before Route 53 flips an
  // instance's health state. Unset means AWS's default (3).
  int64 failure_threshold = 3 [(buf.validate.field).cel = {
    id: "health_check.failure_threshold_range"
    message: "failure_threshold must be between 1 and 10"
    expression: "this == 0 || (this >= 1 && this <= 10)"
  }];
}

// AwsCloudMapServiceHealthCheckCustomConfig marks the service as
// custom-health: workloads push instance health instead of Route 53
// probing it. (AWS retired the configurable failure threshold - it is
// always 1 - so the marker carries no dials.)
message AwsCloudMapServiceHealthCheckCustomConfig {}

// AwsCloudMapInstance is one statically registered instance. The
// typed fields cover AWS's documented instance attributes; anything
// else rides custom_attributes.
message AwsCloudMapInstance {
  // A CNAME value only makes sense when the service publishes CNAME
  // records.
  option (buf.validate.message).cel = {
    id: "instance.at_most_one_address_form"
    message: "set at most one of ip and cname - an instance resolves to an address or an alias, not both"
    expression: "this.ip == '' || this.cname == ''"
  };

  // The registration's identity within the service - the for_each key
  // on both engines and half of the import ID
  // ("{service_id}/{instance_id}"). Re-registering the same id
  // updates the instance in place (AWS upserts).
  string instance_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[0-9A-Za-z_/:.@-]+$"
  }];

  // The instance's IPv4 address (publishes A records; SRV targets
  // resolve to it). When the service carries health_check_config,
  // Route 53 REJECTS reserved/documentation/private-range addresses
  // at registration (RegisterInstance 400 "IPv4 address ... is
  // forbidden for healthChecks" - TEST-NET included; health-checked
  // endpoints must be publicly routable).
  string ip = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.ipv4 = true
  ];

  // The instance's IPv6 address (publishes AAAA records).
  string ipv6 = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.ipv6 = true
  ];

  // The port the instance serves on (SRV records and health checks).
  int64 port = 4 [(buf.validate.field).cel = {
    id: "instance.port_range"
    message: "port must be between 1 and 65535"
    expression: "this == 0 || (this >= 1 && this <= 65535)"
  }];

  // The domain name CNAME records point at (services whose dns_config
  // publishes CNAME) - e.g. an RDS endpoint address. Reference
  // another kind's endpoint output or pass a literal hostname.
  string cname = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 255
  ];

  // Publish a Route 53 ALIAS to an ELB DNS name instead of address
  // records. Cannot combine with any other attribute. Reference an
  // AwsAlb load_balancer_dns_name output or pass a literal DNS name.
  dev.planton.shared.foreignkey.v1.StringValueOrRef alias_dns_name = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsAlb,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.load_balancer_dns_name"
  ];

  // Register an EC2 instance by id - AWS derives the IPv4 attribute
  // from it. Reference an AwsEc2Instance instance_id output or pass a
  // literal i-... id.
  dev.planton.shared.foreignkey.v1.StringValueOrRef ec2_instance_id = 7 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsEc2Instance,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.instance_id"
  ];

  // Any additional AWS instance attributes (e.g.
  // AWS_INIT_HEALTH_STATUS) or custom key-value metadata returned by
  // DiscoverInstances. Keys and values follow AWS's attribute charset
  // rules.
  map<string, string> custom_attributes = 8 [(buf.validate.field).map = {
    keys: {
      string: {
        min_len: 1
        max_len: 255
        pattern: "^[0-9A-Za-z!-~]+$"
      }
    }
    values: {
      string: {max_len: 1024}
    }
  }];
}
