# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_sns_topic_subscription:
    mappings:
      # The spec drops the provider's "_in_" filler; same integer, same
      # http/https-only semantics.
      - spec: spec.confirmation_timeout_minutes
        arg: confirmation_timeout_in_minutes
      # AWS models the subscription DLQ as a JSON redrive policy document
      # holding just the target ARN; the spec types it as a message so the
      # target can be chart-wired to an AwsSqsQueue.
      - spec: spec.dead_letter_config.dead_letter_target_arn
        arg: redrive_policy
