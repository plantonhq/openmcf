apiVersion: aws.planton.dev/v1alpha1
kind: AwsDocumentDb
metadata:
  name: my-docdb-serverless
spec:
  region: us-west-2
  subnetIds:
    - value: subnet-replace-with-private-az1
    - value: subnet-replace-with-private-az2
  securityGroupIds:
    - value: sg-replace-with-database-sg
  masterUsername: docadmin # AWS has no default master username -- pick one
  manageMasterUserPassword: true # recommended_default -- AWS generates, stores, and rotates the password in Secrets Manager
  storageEncrypted: true # recommended_default -- create-time-only, cannot be enabled later
  backupRetentionPeriod: 7
  skipFinalSnapshot: false
  finalSnapshotIdentifier: my-docdb-serverless-final
  # DocumentDB Serverless: these DCU bounds + db.serverless instances.
  # Capacity tracks demand between the bounds; minCapacity 0.5 is the
  # idle cost floor (DocumentDB Serverless does not pause to zero).
  # Removing this block from a live cluster replaces it -- AWS cannot
  # switch a cluster off serverless.
  serverlessV2Scaling:
    minCapacity: 0.5
    maxCapacity: 16
  instances:
    - name: writer
      instanceClass: db.serverless
