# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_iam_instance_profile:
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name -- the platform names resources through metadata, never a spec field
      - arg: name_prefix
        reason: covered alternative -- metadata.name provides deterministic naming; provider-generated name suffixes have no place in a declarative catalog
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

specExclusions:
  # IAM is a GLOBAL service: the instance profile resource carries no region
  # argument. The spec's region drives only the provider connection.
  - field: spec.region
    reason: provider-connection region only -- IAM is global and the instance profile resource has no region argument
