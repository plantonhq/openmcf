metadata:
  name: awsiamgroup
spec:
  # An IAM group under live E2E: one lane proves the group with its
  # declarative membership (the AwsIamUser fixture), an AWS-managed
  # policy attachment, and one inline policy. IAM is free (~$0) and
  # global -- group names are account-unique, so lanes run serially
  # (the fixed-name collision class). A green destroy proves the
  # membership and both policy surfaces unwound with the group (IAM
  # refuses to delete a non-empty group).
  #
  # Import honesty: the membership resource has NO importer at the pin
  # (declared in the provider catalog) -- the round-trip re-applies the
  # declarative users list instead.
  #
  # pending_proof: forged this session to the full offline bar -- Q43
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
