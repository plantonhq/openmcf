# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_iam_group:
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name -- the platform names resources through metadata, never a spec field
  aws_iam_group_membership:
    exclusions:
      # The fold's parent linkage: the module binds the membership to
      # the group it rides, never a user-facing field.
      - arg: group
        reason: module-wired parent linkage (the folded membership always targets its own group)
      # The membership resource's own name is a provider-side label
      # (never reaches AWS).
      - arg: name
        reason: provider-side state label the module derives from metadata.name -- never reaches AWS
  aws_iam_group_policy:
    mappings:
      # Inline policies are a name-keyed map: the map key names each
      # policy and the map value is its document.
      - arg: name
        spec: spec.inline_policies
        collapse: true
      - arg: policy
        spec: spec.inline_policies
        collapse: true
    exclusions:
      - arg: group
        reason: module-wired parent linkage (the folded inline policy always targets its own group)
      - arg: name_prefix
        reason: covered alternative -- inline_policies map keys provide deterministic naming; provider-generated name suffixes have no place in a declarative catalog
  aws_iam_group_policy_attachment:
    mappings:
      # Each attachment realizes one managed_policy_arns entry.
      - arg: policy_arn
        spec: spec.managed_policy_arns
    exclusions:
      - arg: group
        reason: module-wired parent linkage (the folded attachment always targets its own group)
specExclusions:
  # IAM is a GLOBAL service: none of the consumed resources carries a
  # region argument. The spec's region drives only the provider
  # connection.
  - field: spec.region
    reason: provider-connection region only -- IAM is global and none of the consumed resources has a region argument
