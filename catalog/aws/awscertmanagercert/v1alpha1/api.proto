syntax = "proto3";

package dev.planton.aws.awscertmanagercert.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscertmanagercert/v1alpha1/spec.proto";
import "catalog/aws/awscertmanagercert/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// AwsCertManagerCert represents a containerized application deployed on AWS ECS.
// This resource manages ECS services that can run on either Fargate or EC2.
message AwsCertManagerCert {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this ECS service resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsCertManagerCert"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the ECS service is deployed.
  AwsCertManagerCertSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsCertManagerCertStatus status = 5;
}

// AwsCertManagerCertStatus describes the status fields for an ECS service resource.
message AwsCertManagerCertStatus {
  // stack_outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsCertManagerCertStackOutputs outputs = 1;
}
