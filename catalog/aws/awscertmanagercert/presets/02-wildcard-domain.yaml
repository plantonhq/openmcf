apiVersion: aws.planton.dev/v1alpha1
kind: AwsCertManagerCert
metadata:
  name: my-wildcard-certificate
spec:
  region: <aws-region>
  # Domain names must be real DNS shapes (the field's own pattern rejects
  # angle brackets) -- replace with your domain.
  primaryDomainName: "*.replaceme.example.com"
  alternateDomainNames:
    - replaceme.example.com
  route53HostedZoneId:
    value: "<route53-hosted-zone-id>"
  validationMethod: DNS  # default from spec; automated validation via Route53
