apiVersion: aws.planton.dev/v1alpha1
kind: AwsCertManagerCert
metadata:
  name: my-external-dns-certificate
spec:
  region: <aws-region>
  # Domain names must be real DNS shapes (the field's own pattern rejects
  # angle brackets) -- replace with your domain.
  primaryDomainName: replaceme.example.com
  # No route53HostedZoneId: DNS is managed outside Route53 (Cloudflare,
  # your registrar, ...). The deployment finishes with the certificate in
  # PENDING_VALIDATION and exports the required CNAME records as the
  # domain_validation_records output -- create them in your DNS and ACM
  # issues (and later renews) automatically.
