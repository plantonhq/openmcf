apiVersion: aws.planton.dev/v1alpha1
kind: AwsCertManagerCert
metadata:
  name: my-internal-service-cert
spec:
  region: us-west-2
  # The private (ACM-PCA) mode: your AWS Private Certificate Authority
  # issues the certificate directly -- no public validation happens, and
  # clients trust your private root instead of a public CA. The shape for
  # internal TLS: service meshes, internal ALBs, east-west APIs. Reference
  # an AwsPrivateCa resource (shown) or pass a literal ARN via `value:`.
  primaryDomainName: payments.internal.example.com
  certificateAuthorityArn:
    valueFrom:
      kind: AwsPrivateCa
      name: internal-root-ca
      fieldPath: status.outputs.certificate_authority_arn
  # Start ACM's managed renewal 90 days before expiry (private-CA
  # certificates only; durations under 60 days have no effect). Consumers
  # keep the same certificate ARN across renewals.
  earlyRenewalDuration: P90D
