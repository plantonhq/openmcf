apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awscloudwatchloggroup
spec:
  # A CloudWatch log group under live E2E: deploy -> DescribeLogGroups verify
  # -> destroy -> verify-destroyed on both provisioners. The full-surface
  # scenario exercises retention, a metric filter (default_value arm), a
  # field index policy, a data protection policy, and a subscription filter
  # streaming into the composed Kinesis fixture through the CloudWatch-Logs
  # delivery role — proving both folded-satellite FK edges live. The group
  # itself creates in seconds; the composed chain adds the stream + role
  # fixtures. Deliberately not in the live scenario: KMS encryption (the key
  # association is a single in-place call, proven by the encrypted preset +
  # offline gate), INFREQUENT_ACCESS/DELIVERY classes (create-time variants
  # of the same call), and deletion protection (would fail the destroy leg
  # by design — its wiring is proven by the offline gate).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
