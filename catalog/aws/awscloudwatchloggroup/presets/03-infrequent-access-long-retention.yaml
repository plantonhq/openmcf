apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchLogGroup
metadata:
  name: my-archive-logs
spec:
  region: <aws-region>
  retentionInDays: 365
  logGroupClass: INFREQUENT_ACCESS  # ~50% cheaper storage; no metric/subscription filters
  kmsKeyId:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key-name>  # key policy must allow logs.<region>.amazonaws.com
      fieldPath: status.outputs.key_arn
