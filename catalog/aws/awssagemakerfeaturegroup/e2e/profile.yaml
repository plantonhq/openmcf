apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awssagemakerfeaturegroup
spec:
  # A feature group under live E2E: two lanes (create waits Created
  # ~1-5 min; delete ~minutes). The minimal lane is online-only; the
  # full-surface lane runs BOTH stores - online with the 30-day TTL
  # echo, offline against the shared bucket fixture with the
  # auto-created Glue table. Verification is DescribeFeatureGroup keyed
  # on feature_group_name (status Created) plus the TTL and offline
  # config echoes.
  #
  # Deliberately not exercised live: InMemory storage with vector
  # collections (an at-rest billing floor - unblock: owner-approved
  # spend window), the KMS arms (ForceNew, compose the AwsKmsKey
  # fixture on demand), Iceberg table format and provisioned throughput
  # (billing) - all offline-proven via e2e/manifest.yaml. The offline
  # store's S3 objects survive group deletion by AWS design (the lane
  # writes none; the sweep tolerates the fixture-bucket prefix).
  #
  # pending_proof: forged this session to the full offline bar -- Q36
  # proves it live.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
