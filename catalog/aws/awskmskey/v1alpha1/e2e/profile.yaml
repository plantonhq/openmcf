apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awskmskey
spec:
  # A customer-managed KMS key under E2E: the harness runs deploy ->
  # DescribeKey verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario is a true leaf (no registry prerequisites)
  # with one symmetric key and a single alias -- fast and cheap. Deliberately
  # not in the live scenario: multi-Region primaries, asymmetric/HMAC key
  # shapes, and custom key policies -- all proven by CEL spec tests and the
  # offline gate.
  #
  # green: both engines have passed the full live lane -- deploy ->
  # DescribeKey verify -> destroy -> verify-destroyed (Pulumi ~74s,
  # Terraform ~44s) -- on top of the standing offline gate (tofu init +
  # validate, spec/CEL tests, outputs conformance, Pulumi module compile).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
