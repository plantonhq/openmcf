apiVersion: aws.planton.dev/v1alpha1
kind: AwsConfigConformancePack
metadata:
  name: org-security-baseline
spec:
  region: <aws-region>
  organizationScope: true
  templateS3Uri: s3://<awsconfigconforms-templates-bucket>/security-baseline.yaml
  excludedAccounts:
    # Account ids must be 12 digits (the field's own pattern rejects
    # placeholders) -- replace with the accounts to exclude.
    - "123456789012"
