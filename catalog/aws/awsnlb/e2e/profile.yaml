apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsnlb
spec:
  # A Network Load Balancer under live E2E: the harness deploys the AwsVpc
  # prerequisite and the AwsSubnet prerequisite pair, then runs deploy ->
  # DescribeLoadBalancers verify -> destroy -> verify-destroyed on both
  # provisioners. NLB creation takes 2-3 minutes and deletion similar; the
  # timeout budgets for both plus the prerequisite chain.
  #
  # pending_proof: the spec surface deepened (capacity reservation, secondary
  # IPs per subnet, prefix-based IPv6 source NAT, per-node ipv6_address)
  # after the last live attempt. Offline plans and previews passed on both
  # engines, including the dualstack arm.
  #
  # Known live blocker carried from the prior deferral: the shared test
  # account rejects CreateLoadBalancer for the NETWORK type with
  # "OperationNotPermitted: This AWS account currently does not support
  # creating load balancers" (application-type creates succeed in the same
  # account), which only AWS Support can lift. Both engines reach the AWS API
  # cleanly through the full prerequisite chain; if the restriction still
  # stands when the proof lane runs, re-record the deferral with this reason.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
