apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsnlb
spec:
  # A Network Load Balancer under live E2E: the harness deploys the AwsVpc
  # prerequisite and the AwsSubnet prerequisite pair, then runs deploy ->
  # DescribeLoadBalancers verify -> destroy -> verify-destroyed on both
  # provisioners. NLB creation takes 2-3 minutes and deletion similar; the
  # timeout budgets for both plus the prerequisite chain.
  #
  # The account's former network-type CreateLoadBalancer restriction
  # ("OperationNotPermitted", lifted by AWS Support) is GONE — verified live
  # 2026-08-11 when both engines created, verified, and destroyed the NLB
  # cleanly. Offline-proven-only arms (never silent skips): the dualstack /
  # per-node ipv6_address arms (no IPv6 VPC fixture), the LCU capacity
  # reservation (bills while set), and secondary-IPs-per-subnet (replacement
  # semantics make it a create-time-only arm) — proven by offline plans and
  # previews on both engines.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
