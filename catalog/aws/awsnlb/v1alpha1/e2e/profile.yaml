apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsnlb
spec:
  # A Network Load Balancer under live E2E: the harness deploys the AwsVpc
  # prerequisite and the AwsSubnet prerequisite pair, then runs deploy ->
  # DescribeLoadBalancers verify -> destroy -> verify-destroyed on both
  # provisioners. NLB creation takes 2-3 minutes and deletion similar; the
  # timeout budgets for both plus the prerequisite chain.
  #
  # deferred: the shared test account rejects CreateLoadBalancer for the
  # NETWORK type with "OperationNotPermitted: This AWS account currently does
  # not support creating load balancers" (application-type creates succeed in
  # the same account), which only AWS Support can lift. Both engines reach
  # the AWS API cleanly through the full prerequisite chain; flip to green
  # once the account restriction is removed.
  tier: 1
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
