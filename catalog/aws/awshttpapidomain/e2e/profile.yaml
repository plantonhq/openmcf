apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awshttpapidomain
spec:
  # A custom domain under live E2E: the registry-declared AwsCertManagerCert
  # prerequisite deploys first (the imported self-signed certificate fixture
  # -- its CN is what the domain name must match), the scenario composes the
  # dependency-free HTTP API prerequisite fixture via the e2e-prerequisites
  # annotation, then the domain proves create (TLS binding + REGIONAL
  # endpoint), the root API mapping, the routing arm
  # (ROUTING_RULE_THEN_API_MAPPING plus one base-path rule invoking the same
  # fixture -- rules and modes are free), GetDomainName verification,
  # destroy, and verify-destroyed on both provisioners. example.com is
  # IANA-reserved, so the region-unique custom-domain namespace cannot
  # collide with a real tenant. Deliberately not in the lane: mutual TLS
  # (needs an S3-hosted truststore fixture), DNS records (the domain exists
  # independently of any record pointing at it), and the
  # ownership-verification certificate (AWS only accepts it alongside a
  # Private-CA or imported+mTLS certificate setup the fixture chain cannot
  # honestly exercise) -- all proven by spec tests and the offline gate.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 15
