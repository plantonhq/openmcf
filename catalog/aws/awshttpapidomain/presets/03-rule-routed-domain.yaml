apiVersion: aws.planton.dev/v1alpha1
kind: AwsHttpApiDomain
metadata:
  name: <domain-resource-name>
  org: <organization>
  env: <environment>
  id: <resource-id>
spec:
  region: <aws-region>
  # Replace with your owned domain (lowercase; must be covered by the
  # certificate).
  domainName: api.example.com
  # The certificate must be in the same region and cover the domain name
  # (exact or wildcard match).
  certificateArn:
    valueFrom:
      kind: AwsCertManagerCert
      name: <certificate-resource-name>
      fieldPath: status.outputs.cert_arn
  # Rules are evaluated first (ascending priority); requests matching no
  # rule fall back to the api_mappings below.
  routingMode: ROUTING_RULE_THEN_API_MAPPING
  routingRules:
    # Path-based service split: /orders/... reaches the orders API with the
    # base path stripped, so the API sees /list instead of /orders/list.
    - priority: 10
      conditions:
        - basePaths:
            - orders
      apiId:
        valueFrom:
          kind: AwsHttpApiGateway
          name: <orders-api-resource-name>
          fieldPath: status.outputs.api_id
      stage: $default
      stripBasePath: true
    # Header-based tenant pinning: beta tenants reach the canary API no
    # matter which path they call. Combine a basePaths condition and a
    # header condition on ONE rule to require both.
    - priority: 20
      conditions:
        - header:
            name: x-tenant-id
            valueGlob: beta-*
      apiId:
        valueFrom:
          kind: AwsHttpApiGateway
          name: <canary-api-resource-name>
          fieldPath: status.outputs.api_id
      stage: $default
  apiMappings:
    # The fallback for everything no rule matched: the main API at the
    # domain root.
    - apiId:
        valueFrom:
          kind: AwsHttpApiGateway
          name: <main-api-resource-name>
          fieldPath: status.outputs.api_id
      stage: $default
