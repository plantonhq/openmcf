apiVersion: aws.planton.dev/v1alpha1
kind: AwsVpc
metadata:
  name: my-governed-vpc
spec:
  region: <aws-region>
  # Primary range allocated from IPAM: the pool's allocation rules pick a
  # non-overlapping /16 -- address governance instead of hand-picked CIDRs.
  ipv4IpamPoolId:
    value: <ipam-pool-id>
  ipv4NetmaskLength: 16
  enableDnsHostnames: true
  enableDnsSupport: true
  # Grow in place as the network fills: another IPAM-sized block, and a
  # pinned block for a distinct space (e.g. the 100.64.0.0/10 shared range).
  secondaryIpv4Cidrs:
    - ipamPoolId:
        value: <ipam-pool-id>
      netmaskLength: 20
    - cidrBlock: 100.64.0.0/16
  # IPv6 from an IPAM pool, sized by prefix.
  secondaryIpv6Cidrs:
    - ipamPoolId:
        value: <ipv6-ipam-pool-id>
      netmaskLength: 56
  # Enforce encryption in transit VPC-wide, excluding the paths that
  # cannot encrypt. Start with mode: monitor and review findings before
  # switching to enforce.
  encryptionControl:
    mode: enforce
    excludeInternetGateway: true
    excludeNatGateway: true
