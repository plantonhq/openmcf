syntax = "proto3";

package dev.planton.aws.awsvpc.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsVpcSpec defines an AWS Virtual Private Cloud (VPC): an isolated virtual
// network in which other AWS resources are launched.
//
// A VPC is the networking foundation for nearly everything else on AWS, but it
// is itself a thin construct: an IP address space (one primary IPv4 CIDR, plus
// optional secondary IPv4/IPv6 CIDRs), a tenancy mode, a few DNS toggles, and
// an optional encryption-in-transit control. The things that make a network
// useful -- subnets, internet gateways, NAT gateways, route tables -- are
// separate, independently ownable components that reference this VPC. Keeping
// the VPC a clean building block is what lets a topology be composed from
// first-class nodes rather than hidden inside one opaque resource.
//
// The primary IPv4 CIDR can be specified explicitly (cidr_block) or allocated
// from an IPAM pool (ipv4_ipam_pool_id [+ ipv4_netmask_length]). IPv6 is opt-in
// and supports either an Amazon-provided /56 (assign_generated_ipv6_cidr_block)
// or an IPAM-allocated block (ipv6_ipam_pool_id). Additional address space is
// attached in place through secondary_ipv4_cidrs / secondary_ipv6_cidrs. The
// cross-field rules below mirror what AWS itself enforces.
message AwsVpcSpec {
  // The AWS region where the VPC will be created.
  // Example: "us-west-2", "eu-west-1", "ap-southeast-1".
  // For the list of regions, see:
  // https://aws.amazon.com/about-aws/global-infrastructure/regions_az/
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The primary IPv4 CIDR block for the VPC. This is the VPC's main address
  // range and is immutable: changing it replaces the VPC. The mask must be
  // between /16 and /28 (AWS limits), e.g. "10.0.0.0/16" yields 65,536
  // addresses. Leave empty only when allocating the primary CIDR from IPAM
  // (set ipv4_ipam_pool_id instead); exactly one of cidr_block or
  // ipv4_ipam_pool_id must be provided.
  string cidr_block = 2;

  // Additional IPv4 address ranges to associate with the VPC beyond the
  // primary one. Each entry is associated as its own resource and can be
  // added or removed without recreating the VPC -- the standard way to grow
  // a network whose original range ran out of subnet space, or to carve a
  // distinct range (such as the 100.64.0.0/10 shared space) for specific
  // workloads. Each entry names an explicit CIDR or an IPAM allocation.
  repeated AwsVpcSecondaryIpv4Cidr secondary_ipv4_cidrs = 3;

  // The IPAM (IP Address Manager) pool to allocate the primary IPv4 CIDR from,
  // instead of specifying cidr_block directly. Pair with ipv4_netmask_length to
  // let IPAM choose a block of the requested size, or with cidr_block to take a
  // specific block from the pool. Supply a literal ipam-pool-id; there is no
  // IPAM pool catalog kind yet. Immutable: changing it replaces the VPC.
  dev.planton.shared.foreignkey.v1.StringValueOrRef ipv4_ipam_pool_id = 4;

  // The netmask length of the primary IPv4 CIDR to allocate from
  // ipv4_ipam_pool_id (e.g. 16 for a /16). Must be between 16 and 28. Requires
  // ipv4_ipam_pool_id and is mutually exclusive with cidr_block. Immutable:
  // changing it replaces the VPC.
  int32 ipv4_netmask_length = 5;

  // The tenancy of instances launched into this VPC: "default" (instances may
  // run on shared hardware) or "dedicated" (every instance runs on
  // single-tenant hardware, at higher cost). Leave empty for the AWS default
  // ("default"). Note that AWS only supports changing "dedicated" -> "default"
  // in place; changing "default" -> "dedicated" replaces the VPC.
  string instance_tenancy = 6 [
    (buf.validate.field).cel = {
      id: "instance_tenancy_valid"
      message: "instance_tenancy must be one of: default, dedicated"
      expression: "this == '' || this in ['default', 'dedicated']"
    },
    (dev.planton.shared.options.recommended_default) = "default"
  ];

  // Whether the Amazon-provided DNS server (the .2 resolver) answers DNS
  // queries from within the VPC. AWS enables this by default, and disabling it
  // breaks name resolution for most workloads, so when this field is unset the
  // VPC keeps DNS resolution ON. Set it explicitly to false only to deliberately
  // turn the Amazon resolver off.
  optional bool enable_dns_support = 7 [(dev.planton.shared.options.recommended_default) = "true"];

  // Whether instances with public IP addresses receive public DNS hostnames.
  // AWS leaves this off by default; turn it on for VPCs whose instances should
  // be reachable by DNS name. See:
  // https://docs.aws.amazon.com/vpc/latest/userguide/vpc-dns.html#vpc-dns-hostnames
  bool enable_dns_hostnames = 8 [(dev.planton.shared.options.recommended_default) = "true"];

  // Whether to enable Network Address Usage (NAU) metrics for the VPC. NAU is a
  // CloudWatch metric that tracks how the VPC's IP address space is consumed,
  // useful for capacity planning in large networks. Off by default.
  bool enable_network_address_usage_metrics = 9;

  // Request an Amazon-provided IPv6 /56 CIDR block for the VPC. This is the
  // simplest way to make a VPC dual-stack. Mutually exclusive with the IPAM
  // IPv6 fields (ipv6_ipam_pool_id / ipv6_cidr_block / ipv6_netmask_length).
  bool assign_generated_ipv6_cidr_block = 10;

  // An explicit IPv6 CIDR block to allocate from ipv6_ipam_pool_id (e.g.
  // "2600:1f18:abcd:1200::/56"). The prefix length must be one of /44, /48,
  // /52, /56, or /60 (the AWS VPC IPv6 sizes). Requires ipv6_ipam_pool_id (a
  // bring-your-own IPv6 block without IPAM is not supported on the VPC
  // resource) and is mutually exclusive with ipv6_netmask_length.
  string ipv6_cidr_block = 11;

  // The network border group from which to advertise an Amazon-provided IPv6
  // CIDR (a Local Zone / Wavelength advertisement scope). Only valid together
  // with assign_generated_ipv6_cidr_block.
  string ipv6_cidr_block_network_border_group = 12;

  // The IPAM pool to allocate the IPv6 CIDR from. Pair with ipv6_netmask_length
  // (the size to allocate) or ipv6_cidr_block (a specific block). Supply a
  // literal ipam-pool-id; there is no IPAM pool catalog kind yet. Mutually
  // exclusive with assign_generated_ipv6_cidr_block.
  dev.planton.shared.foreignkey.v1.StringValueOrRef ipv6_ipam_pool_id = 13;

  // The netmask length of the IPv6 CIDR to allocate from ipv6_ipam_pool_id.
  // Must be one of 44, 48, 52, 56, or 60. Requires ipv6_ipam_pool_id and is
  // mutually exclusive with ipv6_cidr_block.
  int32 ipv6_netmask_length = 14;

  // Additional IPv6 address ranges to associate with the VPC beyond the one
  // configured above. Each entry is associated as its own resource and can be
  // added or removed without recreating the VPC. Each entry names exactly one
  // source: an Amazon-provided block, a BYOIP public pool, or an IPAM pool.
  repeated AwsVpcSecondaryIpv6Cidr secondary_ipv6_cidrs = 15;

  // VPC Encryption Control: monitor or enforce encryption in transit for
  // traffic entering, leaving, and moving within the VPC. Omit to leave the
  // feature off (the AWS default). Start in "monitor" mode to observe, then
  // move to "enforce" once the exclusions below cover every path that cannot
  // encrypt.
  AwsVpcEncryptionControl encryption_control = 16;

  // The VPC needs a primary IPv4 source: either an explicit CIDR or an IPAM pool.
  option (buf.validate.message).cel = {
    id: "ipv4_primary_source_required"
    message: "set exactly one primary IPv4 source: cidr_block or ipv4_ipam_pool_id"
    expression: "this.cidr_block != '' || has(this.ipv4_ipam_pool_id)"
  };

  // A literal primary CIDR and an IPAM netmask are two different allocation
  // modes and cannot be combined.
  option (buf.validate.message).cel = {
    id: "ipv4_cidr_block_vs_netmask_exclusive"
    message: "cidr_block and ipv4_netmask_length are mutually exclusive"
    expression: "this.cidr_block == '' || this.ipv4_netmask_length == 0"
  };

  // cidr_block, when set, must be a valid IPv4 CIDR with an AWS-legal VPC mask.
  option (buf.validate.message).cel = {
    id: "ipv4_cidr_block_format"
    message: "cidr_block must be an IPv4 CIDR with a /16-/28 mask, e.g. 10.0.0.0/16"
    expression: "this.cidr_block == '' || this.cidr_block.matches('^([0-9]{1,3}\\\\.){3}[0-9]{1,3}/(1[6-9]|2[0-8])$')"
  };

  // An IPv4 IPAM netmask, when set, must be /16-/28 and requires an IPAM pool.
  option (buf.validate.message).cel = {
    id: "ipv4_netmask_length_valid"
    message: "ipv4_netmask_length must be between 16 and 28 and requires ipv4_ipam_pool_id"
    expression: "this.ipv4_netmask_length == 0 || (this.ipv4_netmask_length >= 16 && this.ipv4_netmask_length <= 28 && has(this.ipv4_ipam_pool_id))"
  };

  // Amazon-provided IPv6 and IPAM-allocated IPv6 are mutually exclusive modes.
  option (buf.validate.message).cel = {
    id: "ipv6_amazon_vs_ipam_exclusive"
    message: "assign_generated_ipv6_cidr_block cannot be combined with the IPAM IPv6 fields (ipv6_ipam_pool_id/ipv6_cidr_block/ipv6_netmask_length)"
    expression: "!this.assign_generated_ipv6_cidr_block || (!has(this.ipv6_ipam_pool_id) && this.ipv6_cidr_block == '' && this.ipv6_netmask_length == 0)"
  };

  // An explicit IPv6 CIDR requires an IPAM pool to allocate it from.
  option (buf.validate.message).cel = {
    id: "ipv6_cidr_block_requires_ipam"
    message: "ipv6_cidr_block requires ipv6_ipam_pool_id"
    expression: "this.ipv6_cidr_block == '' || has(this.ipv6_ipam_pool_id)"
  };

  // ipv6_cidr_block, when set, must be a valid IPv6 CIDR with an AWS-legal
  // VPC prefix length (/44, /48, /52, /56, or /60).
  option (buf.validate.message).cel = {
    id: "ipv6_cidr_block_format"
    message: "ipv6_cidr_block must be an IPv6 CIDR with a /44, /48, /52, /56, or /60 prefix, e.g. 2600:1f18:abcd:1200::/56"
    expression: "this.ipv6_cidr_block == '' || this.ipv6_cidr_block.matches('^[0-9a-fA-F:]+/(44|48|52|56|60)$')"
  };

  // An IPv6 IPAM netmask, when set, must be a valid size and requires an IPAM pool.
  option (buf.validate.message).cel = {
    id: "ipv6_netmask_length_valid"
    message: "ipv6_netmask_length must be one of 44, 48, 52, 56, 60 and requires ipv6_ipam_pool_id"
    expression: "this.ipv6_netmask_length == 0 || (this.ipv6_netmask_length in [44, 48, 52, 56, 60] && has(this.ipv6_ipam_pool_id))"
  };

  // The IPAM IPv6 block can be sized by netmask or pinned by CIDR, never both.
  option (buf.validate.message).cel = {
    id: "ipv6_cidr_block_vs_netmask_exclusive"
    message: "ipv6_cidr_block and ipv6_netmask_length are mutually exclusive"
    expression: "this.ipv6_cidr_block == '' || this.ipv6_netmask_length == 0"
  };

  // The IPv6 border group is only meaningful for an Amazon-provided IPv6 CIDR.
  option (buf.validate.message).cel = {
    id: "ipv6_border_group_requires_amazon"
    message: "ipv6_cidr_block_network_border_group requires assign_generated_ipv6_cidr_block"
    expression: "this.ipv6_cidr_block_network_border_group == '' || this.assign_generated_ipv6_cidr_block"
  };
}

// AwsVpcSecondaryIpv4Cidr defines one additional IPv4 address range for the
// VPC: an explicit CIDR block, or an allocation from an IPAM pool (sized by
// netmask_length, or pinned to a specific block by also setting cidr_block).
// Mirrors the allocation modes of the VPC's primary IPv4 range.
message AwsVpcSecondaryIpv4Cidr {
  // An explicit IPv4 CIDR block to associate (e.g. "10.1.0.0/16" or
  // "100.64.0.0/16"). The mask must be between /16 and /28 and the range must
  // not overlap the VPC's other CIDRs. When ipam_pool_id is also set, this
  // pins a specific block from that pool. Immutable: changing it replaces the
  // association (the VPC itself is untouched).
  string cidr_block = 1;

  // The IPAM pool to allocate this secondary CIDR from, instead of (or in
  // addition to, when pinning a specific block) cidr_block. Supply a literal
  // ipam-pool-id; there is no IPAM pool catalog kind yet. Immutable: changing
  // it replaces the association.
  dev.planton.shared.foreignkey.v1.StringValueOrRef ipam_pool_id = 2;

  // The netmask length of the CIDR to allocate from ipam_pool_id (e.g. 16 for
  // a /16). Must be between 16 and 28. Requires ipam_pool_id and is mutually
  // exclusive with cidr_block. Immutable: changing it replaces the
  // association.
  int32 netmask_length = 3;

  // Every entry needs an address source: an explicit CIDR or an IPAM pool.
  option (buf.validate.message).cel = {
    id: "secondary_ipv4_source_required"
    message: "set cidr_block or ipam_pool_id (or both, to pin a specific block from the pool)"
    expression: "this.cidr_block != '' || has(this.ipam_pool_id)"
  };

  // cidr_block, when set, must be a valid IPv4 CIDR with an AWS-legal mask.
  option (buf.validate.message).cel = {
    id: "secondary_ipv4_cidr_format"
    message: "cidr_block must be an IPv4 CIDR with a /16-/28 mask, e.g. 10.1.0.0/16"
    expression: "this.cidr_block == '' || this.cidr_block.matches('^([0-9]{1,3}\\\\.){3}[0-9]{1,3}/(1[6-9]|2[0-8])$')"
  };

  // A netmask sizes an IPAM allocation; it cannot combine with a pinned CIDR.
  option (buf.validate.message).cel = {
    id: "secondary_ipv4_netmask_valid"
    message: "netmask_length must be between 16 and 28, requires ipam_pool_id, and is mutually exclusive with cidr_block"
    expression: "this.netmask_length == 0 || (this.netmask_length >= 16 && this.netmask_length <= 28 && has(this.ipam_pool_id) && this.cidr_block == '')"
  };
}

// AwsVpcSecondaryIpv6Cidr defines one additional IPv6 address range for the
// VPC. Exactly one source selects where the range comes from: an
// Amazon-provided block, a BYOIP public pool you brought to AWS, or an IPAM
// pool (sized by netmask_length, or pinned by cidr_block).
message AwsVpcSecondaryIpv6Cidr {
  // Request an Amazon-provided IPv6 /56 block. Mutually exclusive with the
  // pool sources and with cidr_block (Amazon chooses the range).
  bool assign_generated = 1;

  // The BYOIP public IPv6 pool (ipv6pool-ec2-...) to take the range from --
  // address space you brought to AWS outside of IPAM. Pair with cidr_block to
  // pin the specific block. Immutable: changing it replaces the association.
  string ipv6_pool = 2;

  // The IPAM pool to allocate the range from. Pair with netmask_length (the
  // size to allocate) or cidr_block (a specific block). Supply a literal
  // ipam-pool-id; there is no IPAM pool catalog kind yet. Immutable: changing
  // it replaces the association.
  dev.planton.shared.foreignkey.v1.StringValueOrRef ipam_pool_id = 3;

  // An explicit IPv6 CIDR block, used with ipv6_pool or ipam_pool_id to pin
  // the exact range (e.g. "2600:1f18:abcd:1200::/56"). The prefix length must
  // be one of /44, /48, /52, /56, or /60. Mutually exclusive with
  // netmask_length and with assign_generated. Immutable: changing it replaces
  // the association.
  string cidr_block = 4;

  // The netmask length to allocate from ipam_pool_id. Must be one of 44, 48,
  // 52, 56, or 60 (AWS only sizes IPAM allocations -- pool and Amazon blocks
  // pin their own size). Mutually exclusive with cidr_block. Immutable:
  // changing it replaces the association.
  int32 netmask_length = 5;

  // Every entry names exactly one address source.
  option (buf.validate.message).cel = {
    id: "secondary_ipv6_one_source"
    message: "set exactly one IPv6 source: assign_generated, ipv6_pool, or ipam_pool_id"
    expression: "(this.assign_generated ? 1 : 0) + (this.ipv6_pool != '' ? 1 : 0) + (has(this.ipam_pool_id) ? 1 : 0) == 1"
  };

  // Amazon chooses the range for generated blocks -- a pinned CIDR only makes
  // sense for pool sources (mirrors the provider's conflict graph).
  option (buf.validate.message).cel = {
    id: "secondary_ipv6_cidr_not_with_generated"
    message: "cidr_block cannot be combined with assign_generated"
    expression: "!this.assign_generated || this.cidr_block == ''"
  };

  // cidr_block, when set, must be a valid IPv6 CIDR with an AWS-legal prefix.
  option (buf.validate.message).cel = {
    id: "secondary_ipv6_cidr_format"
    message: "cidr_block must be an IPv6 CIDR with a /44, /48, /52, /56, or /60 prefix"
    expression: "this.cidr_block == '' || this.cidr_block.matches('^[0-9a-fA-F:]+/(44|48|52|56|60)$')"
  };

  // AWS only sizes allocations from IPAM pools (per AssociateVpcCidrBlock).
  option (buf.validate.message).cel = {
    id: "secondary_ipv6_netmask_valid"
    message: "netmask_length must be one of 44, 48, 52, 56, 60, requires ipam_pool_id, and is mutually exclusive with cidr_block"
    expression: "this.netmask_length == 0 || (this.netmask_length in [44, 48, 52, 56, 60] && has(this.ipam_pool_id) && this.cidr_block == '')"
  };
}

// AwsVpcEncryptionControl configures VPC Encryption Control: AWS's
// VPC-wide monitor/enforce switch for encryption in transit. In "monitor"
// mode AWS observes and reports unencrypted traffic paths; in "enforce"
// mode unencrypted traffic is blocked, with per-service exclusions for
// paths that cannot encrypt. The rollout pattern is monitor first, review
// the findings, then enforce with the minimum exclusions.
message AwsVpcEncryptionControl {
  // The control mode: "monitor" (observe and report unencrypted paths) or
  // "enforce" (block unencrypted traffic, honoring the exclusions below).
  string mode = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "monitor",
        "enforce"
      ]
    }
  ];

  // Exclude internet gateway traffic from enforcement.
  bool exclude_internet_gateway = 2;

  // Exclude egress-only internet gateway traffic from enforcement.
  bool exclude_egress_only_internet_gateway = 3;

  // Exclude NAT gateway traffic from enforcement.
  bool exclude_nat_gateway = 4;

  // Exclude virtual private gateway (Site-to-Site VPN) traffic from
  // enforcement.
  bool exclude_virtual_private_gateway = 5;

  // Exclude VPC peering traffic from enforcement.
  bool exclude_vpc_peering = 6;

  // Exclude VPC Lattice traffic from enforcement.
  bool exclude_vpc_lattice = 7;

  // Exclude Lambda function traffic from enforcement.
  bool exclude_lambda = 8;

  // Exclude Elastic File System (EFS) traffic from enforcement.
  bool exclude_elastic_file_system = 9;

  // AWS only applies exclusions in enforce mode -- an exclusion under
  // monitor is dead configuration.
  option (buf.validate.message).cel = {
    id: "exclusions_require_enforce"
    message: "exclusions only apply when mode is 'enforce'"
    expression: "this.mode == 'enforce' || !(this.exclude_internet_gateway || this.exclude_egress_only_internet_gateway || this.exclude_nat_gateway || this.exclude_virtual_private_gateway || this.exclude_vpc_peering || this.exclude_vpc_lattice || this.exclude_lambda || this.exclude_elastic_file_system)"
  };
}
