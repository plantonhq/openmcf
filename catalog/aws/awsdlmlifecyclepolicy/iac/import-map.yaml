# Where each placeholder in this component's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml).
apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: awsdlmlifecyclepolicy
spec:
  values:
    - name: policy_id
      derivations:
        - from_stack_output: policy_id
        - from_arn_part: resource_id
      where_to_find: >-
        DLM console -> Lifecycle policies (the policy-... ID column),
        or `aws dlm get-lifecycle-policies` (PolicyId).
