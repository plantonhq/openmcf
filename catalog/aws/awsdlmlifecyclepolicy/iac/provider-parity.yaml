# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_dlm_lifecycle_policy:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # ENABLED/DISABLED renders from the spec's disabled toggle.
      - arg: state
        spec: spec.disabled
      # ----- DEFAULT mode (spec.default_policy) --------------------------
      - arg: policy_details.resource_type
        spec: spec.default_policy.resource_type
      - arg: policy_details.create_interval
        spec: spec.default_policy.create_interval_days
      - arg: policy_details.retain_interval
        spec: spec.default_policy.retain_interval_days
      - arg: policy_details.copy_tags
        spec: spec.default_policy.copy_tags
      - arg: policy_details.extend_deletion
        spec: spec.default_policy.extend_deletion
      - arg: policy_details.exclusions.exclude_boot_volumes
        spec: spec.default_policy.exclusions.exclude_boot_volumes
      - arg: policy_details.exclusions.exclude_tags
        spec: spec.default_policy.exclusions.exclude_tags
      - arg: policy_details.exclusions.exclude_volume_types
        spec: spec.default_policy.exclusions.exclude_volume_types
      # ----- CUSTOM mode (spec.custom_policy) ----------------------------
      - arg: policy_details.policy_type
        spec: spec.custom_policy.policy_type
      - arg: policy_details.resource_types
        spec: spec.custom_policy.resource_types
      - arg: policy_details.resource_locations
        spec: spec.custom_policy.resource_locations
      - arg: policy_details.target_tags
        spec: spec.custom_policy.target_tags
      - arg: policy_details.parameters.exclude_boot_volume
        spec: spec.custom_policy.parameters.exclude_boot_volume
      - arg: policy_details.parameters.no_reboot
        spec: spec.custom_policy.parameters.no_reboot
      # Event-based policies.
      - arg: policy_details.event_source.parameters.description_regex
        spec: spec.custom_policy.event_source.description_regex
      - arg: policy_details.event_source.parameters.event_type
        spec: spec.custom_policy.event_source.event_type
      - arg: policy_details.event_source.parameters.snapshot_owner
        spec: spec.custom_policy.event_source.snapshot_owners
      - arg: policy_details.action.name
        spec: spec.custom_policy.action.name
      - arg: policy_details.action.cross_region_copy.target
        spec: spec.custom_policy.action.cross_region_copies.target
      - arg: policy_details.action.cross_region_copy.encryption_configuration.encrypted
        spec: spec.custom_policy.action.cross_region_copies.encrypted
      - arg: policy_details.action.cross_region_copy.encryption_configuration.cmk_arn
        spec: spec.custom_policy.action.cross_region_copies.cmk_arn
      - arg: policy_details.action.cross_region_copy.retain_rule.interval
        spec: spec.custom_policy.action.cross_region_copies.retain_rule.interval
      - arg: policy_details.action.cross_region_copy.retain_rule.interval_unit
        spec: spec.custom_policy.action.cross_region_copies.retain_rule.interval_unit
      # Schedules (the provider's singular block is the spec's plural
      # list; leaf names that differ carry the unit).
      - arg: policy_details.schedule.name
        spec: spec.custom_policy.schedules.name
      - arg: policy_details.schedule.copy_tags
        spec: spec.custom_policy.schedules.copy_tags
      - arg: policy_details.schedule.tags_to_add
        spec: spec.custom_policy.schedules.tags_to_add
      - arg: policy_details.schedule.variable_tags
        spec: spec.custom_policy.schedules.variable_tags
      - arg: policy_details.schedule.create_rule.interval
        spec: spec.custom_policy.schedules.create_rule.interval_hours
      - arg: policy_details.schedule.create_rule.times
        spec: spec.custom_policy.schedules.create_rule.times
      - arg: policy_details.schedule.create_rule.cron_expression
        spec: spec.custom_policy.schedules.create_rule.cron_expression
      - arg: policy_details.schedule.create_rule.location
        spec: spec.custom_policy.schedules.create_rule.location
      - arg: policy_details.schedule.create_rule.scripts.execution_handler
        spec: spec.custom_policy.schedules.create_rule.scripts.execution_handler
      - arg: policy_details.schedule.create_rule.scripts.stages
        spec: spec.custom_policy.schedules.create_rule.scripts.stages
      - arg: policy_details.schedule.create_rule.scripts.execution_handler_service
        spec: spec.custom_policy.schedules.create_rule.scripts.execution_handler_service
      - arg: policy_details.schedule.create_rule.scripts.execute_operation_on_script_failure
        spec: spec.custom_policy.schedules.create_rule.scripts.execute_operation_on_script_failure
      - arg: policy_details.schedule.create_rule.scripts.execution_timeout
        spec: spec.custom_policy.schedules.create_rule.scripts.execution_timeout_seconds
      - arg: policy_details.schedule.create_rule.scripts.maximum_retry_count
        spec: spec.custom_policy.schedules.create_rule.scripts.maximum_retry_count
      - arg: policy_details.schedule.retain_rule.count
        spec: spec.custom_policy.schedules.retain_rule.count
      - arg: policy_details.schedule.retain_rule.interval
        spec: spec.custom_policy.schedules.retain_rule.interval
      - arg: policy_details.schedule.retain_rule.interval_unit
        spec: spec.custom_policy.schedules.retain_rule.interval_unit
      # The provider's three-level archive nesting flattens to the
      # spec's one archive_rule message.
      - arg: policy_details.schedule.archive_rule.archive_retain_rule.retention_archive_tier.count
        spec: spec.custom_policy.schedules.archive_rule.count
      - arg: policy_details.schedule.archive_rule.archive_retain_rule.retention_archive_tier.interval
        spec: spec.custom_policy.schedules.archive_rule.interval
      - arg: policy_details.schedule.archive_rule.archive_retain_rule.retention_archive_tier.interval_unit
        spec: spec.custom_policy.schedules.archive_rule.interval_unit
      - arg: policy_details.schedule.cross_region_copy_rule.target_region
        spec: spec.custom_policy.schedules.cross_region_copy_rules.target_region
      - arg: policy_details.schedule.cross_region_copy_rule.encrypted
        spec: spec.custom_policy.schedules.cross_region_copy_rules.encrypted
      - arg: policy_details.schedule.cross_region_copy_rule.cmk_arn
        spec: spec.custom_policy.schedules.cross_region_copy_rules.cmk_arn
      - arg: policy_details.schedule.cross_region_copy_rule.copy_tags
        spec: spec.custom_policy.schedules.cross_region_copy_rules.copy_tags
      - arg: policy_details.schedule.cross_region_copy_rule.retain_rule.interval
        spec: spec.custom_policy.schedules.cross_region_copy_rules.retain_rule.interval
      - arg: policy_details.schedule.cross_region_copy_rule.retain_rule.interval_unit
        spec: spec.custom_policy.schedules.cross_region_copy_rules.retain_rule.interval_unit
      - arg: policy_details.schedule.cross_region_copy_rule.deprecate_rule.interval
        spec: spec.custom_policy.schedules.cross_region_copy_rules.deprecate_rule.interval
      - arg: policy_details.schedule.cross_region_copy_rule.deprecate_rule.interval_unit
        spec: spec.custom_policy.schedules.cross_region_copy_rules.deprecate_rule.interval_unit
      - arg: policy_details.schedule.deprecate_rule.count
        spec: spec.custom_policy.schedules.deprecate_rule.count
      - arg: policy_details.schedule.deprecate_rule.interval
        spec: spec.custom_policy.schedules.deprecate_rule.interval
      - arg: policy_details.schedule.deprecate_rule.interval_unit
        spec: spec.custom_policy.schedules.deprecate_rule.interval_unit
      - arg: policy_details.schedule.fast_restore_rule.availability_zones
        spec: spec.custom_policy.schedules.fast_restore_rule.availability_zones
      - arg: policy_details.schedule.fast_restore_rule.count
        spec: spec.custom_policy.schedules.fast_restore_rule.count
      - arg: policy_details.schedule.fast_restore_rule.interval
        spec: spec.custom_policy.schedules.fast_restore_rule.interval
      - arg: policy_details.schedule.fast_restore_rule.interval_unit
        spec: spec.custom_policy.schedules.fast_restore_rule.interval_unit
      - arg: policy_details.schedule.share_rule.target_accounts
        spec: spec.custom_policy.schedules.share_rule.target_accounts
      - arg: policy_details.schedule.share_rule.unshare_interval
        spec: spec.custom_policy.schedules.share_rule.unshare_interval
      - arg: policy_details.schedule.share_rule.unshare_interval_unit
        spec: spec.custom_policy.schedules.share_rule.unshare_interval_unit
    exclusions:
      - arg: default_policy
        reason: DERIVED by the modules from the default arm's resource_type (SIMPLIFIED-mode marker) -- a spec field could contradict the configured arm
      - arg: policy_details.policy_language
        reason: DERIVED by the provider from the configured mode (SIMPLIFIED for default_policy, STANDARD for schedules) -- a spec field could contradict the configured arm
      - arg: policy_details.event_source.type
        reason: module-pinned to MANAGED_CWE -- the provider's EventSourceValues enum holds exactly that one value
      - arg: policy_details.schedule.create_rule.interval_unit
        reason: module-pinned to HOURS -- the provider's only published create-interval unit
      - arg: policy_details.schedule.cross_region_copy_rule.target
        reason: the Outposts-ARN form of the destination (target_region is the modeled regional form) -- the catalog's recorded Outposts exclusion
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
