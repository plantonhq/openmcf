apiVersion: aws.planton.dev/v1alpha1
kind: AwsAutoScalingGroup
metadata:
  name: <fleet-name>
spec:
  region: <aws-region>
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: <subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  launchTemplate:
    launchTemplateId:
      valueFrom:
        kind: AwsLaunchTemplate
        name: <launch-template-resource-name>
        fieldPath: status.outputs.launch_template_id
  minSize: 2
  maxSize: 10
  capacityReservation:
    preference: capacity-reservations-first
    capacityReservationIds:
      - cr-<your-reservation-id>
  capacityDistributionStrategy: reservations-then-balanced
  instanceLifecyclePolicy:
    terminateHookAbandon: retain
  lifecycleHooks:
    - name: drain-work
      lifecycleTransition: autoscaling:EC2_INSTANCE_TERMINATING
      defaultResult: ABANDON
      heartbeatTimeoutSeconds: 600
    - name: warm-cache
      lifecycleTransition: autoscaling:EC2_INSTANCE_LAUNCHING
      defaultResult: CONTINUE
      heartbeatTimeoutSeconds: 300
      applyAtLaunch: true
  enabledMetrics:
    - GroupInServiceInstances
    - GroupPendingInstances
    - GroupTerminatingInstances
