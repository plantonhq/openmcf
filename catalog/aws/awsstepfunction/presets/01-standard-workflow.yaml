apiVersion: aws.planton.dev/v1alpha1
kind: AwsStepFunction
metadata:
  name: <workflow-name>
  org: <organization>
  env: <environment>
  id: <resource-id>
spec:
  region: <aws-region>
  type: STANDARD
  # Literal role ARNs must start with arn: (the kind's own rule rejects
  # placeholders) -- replace the account id and role name, or use the
  # valueFrom reference form the production-workflow preset demonstrates.
  roleArn:
    value: arn:aws:iam::123456789012:role/replace-me-stepfunctions-execution
  definition:
    StartAt: ProcessTask
    States:
      ProcessTask:
        Type: Task
        Resource: <lambda-function-arn>
        End: true
