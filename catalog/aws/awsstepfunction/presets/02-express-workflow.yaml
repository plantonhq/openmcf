apiVersion: aws.planton.dev/v1alpha1
kind: AwsStepFunction
metadata:
  name: <workflow-name>
  org: <organization>
  env: <environment>
  id: <resource-id>
spec:
  region: <aws-region>
  type: EXPRESS
  # Literal role ARNs must start with arn: (the kind's own rule rejects
  # placeholders) -- replace the account id and role name, or use the
  # valueFrom reference form the production-workflow preset demonstrates.
  roleArn:
    value: arn:aws:iam::123456789012:role/replace-me-stepfunctions-execution
  definition:
    StartAt: EnrichEvent
    States:
      EnrichEvent:
        Type: Task
        Resource: <enrichment-lambda-arn>
        Next: RouteEvent
      RouteEvent:
        Type: Choice
        Choices:
          - Variable: "$.eventType"
            StringEquals: high-priority
            Next: ProcessUrgent
        Default: ProcessNormal
      ProcessUrgent:
        Type: Task
        Resource: <urgent-lambda-arn>
        End: true
      ProcessNormal:
        Type: Task
        Resource: <normal-lambda-arn>
        End: true
  logging:
    level: ERROR
    logDestination:
      value: <cloudwatch-log-group-arn>
