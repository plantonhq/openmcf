apiVersion: aws.planton.dev/v1alpha1
kind: AwsStepFunction
metadata:
  name: test-workflow
  org: test-org
  env: dev
  id: test-workflow-dev
spec:
  region: us-west-2
  type: STANDARD
  publish: true
  aliases:
    - name: live
      description: Follows the version published by the current deployment
  roleArn:
    value: arn:aws:iam::123456789012:role/StepFunctionsExecRole
  definition:
    StartAt: Hello
    States:
      Hello:
        Type: Pass
        Result: Hello, World!
        End: true
