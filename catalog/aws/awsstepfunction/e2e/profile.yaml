  # proven by spec tests and the offline gate.
  tier: 1
  # pending_proof: the session-043 depth closure changed the live send surface (folded aliases, tri-state tracing, explicit-OFF logging, destination send-when-set) -- Q29 proves it
  status: pending_proof
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
