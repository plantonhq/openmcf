apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsstepfunction
spec:
  # A Step Functions state machine under live E2E: the registry-declared
  # AwsIamRole prerequisite deploys first (the states.amazonaws.com trust
  # document), then a published Pass-state STANDARD workflow proves create,
  # versioning (publish + version ARN outputs), verify (DescribeStateMachine),
  # destroy, and verify-destroyed on both provisioners. Creates in seconds.
