apiVersion: aws.planton.dev/v1alpha1
kind: AwsBatchJobDefinition
metadata:
  org: example-org
  env: prod
  name: genomics-eks-pipeline
  id: genomics-eks-pipeline-id
spec:
  region: <aws-region>
  eks:
    containers:
      - name: pipeline
        image: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/genomics:2.1
        command:
          - python
        args:
          - pipeline.py
          - Ref::sample_id
        env:
          MODE: batch
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFileSystem: true
        volumeMounts:
          - name: scratch
            mountPath: /tmp/scratch
          - name: pipeline-config
            mountPath: /etc/pipeline
            readOnly: true
    initContainers:
      - name: fetch-reference
        image: public.ecr.aws/amazonlinux/amazonlinux:2023
        command:
          - sh
          - -c
          - echo reference data ready
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
    # An explicit false gives the pod its OWN network namespace (AWS's
    # Batch-pod default is hostNetwork true) -- required for VPC-CNI pod
    # networking and per-pod security groups.
    hostNetwork: false
    dnsPolicy: ClusterFirst
    # IRSA / Pod Identity: the EKS-native way to grant the job's code AWS
    # permissions (the EKS counterpart of the container arm's jobRole).
    serviceAccountName: genomics-jobs
    podLabels:
      team: genomics
      workload: batch
    volumes:
      - name: scratch
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: pipeline-config
        secret:
          secretName: genomics-pipeline-config
  parameters:
    sample_id: demo-sample
  retryStrategy:
    attempts: 2
  timeout:
    attemptDurationSeconds: 7200
