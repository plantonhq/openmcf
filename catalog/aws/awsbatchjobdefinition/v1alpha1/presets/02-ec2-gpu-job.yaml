apiVersion: aws.planton.dev/v1alpha1
kind: AwsBatchJobDefinition
metadata:
  org: example-org
  env: prod
  name: gpu-training
  id: gpu-training-id
spec:
  region: <aws-region>
  platformCapabilities:
    - EC2
  container:
    image: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/trainer:latest
    command:
      - python
      - train.py
    vcpus: 8
    memoryMib: 61440
    gpus: 1
    jobRole:
      value: <job-role-arn>
    ulimits:
      - name: nofile
        softLimit: 8192
        hardLimit: 65535
    linuxParameters:
      initProcessEnabled: true
      sharedMemorySizeMib: 8192
  retryStrategy:
    attempts: 2
  timeout:
    attemptDurationSeconds: 86400
