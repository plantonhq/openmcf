apiVersion: aws.planton.dev/v1alpha1
kind: AwsBatchJobDefinition
metadata:
  name: test-batch-etl
  id: test-batch-etl
  org: test-org
  env: dev
  annotations:
    planton.dev/provisioner: pulumi
spec:
  region: us-west-2
  container:
    image: public.ecr.aws/amazonlinux/amazonlinux:2023
    command:
      - echo
      - hello
    vcpus: 1
    memoryMib: 2048
    environment:
      STAGE: dev
  retryStrategy:
    attempts: 3
    evaluateOnExit:
      - action: RETRY
        onStatusReason: Host EC2*
      - action: EXIT
        onExitCode: "1*"
  timeout:
    attemptDurationSeconds: 3600
