apiVersion: aws.planton.dev/v1alpha1
kind: AwsCognitoUserPool
metadata:
  name: test-auth-pool
  org: test-org
  env: dev
  id: awscog-test-001
spec:
  region: us-west-2
  usernameAttributes:
    - email
  passwordPolicy:
    minimumLength: 8
    requireLowercase: true
    requireUppercase: true
    requireNumbers: true
    requireSymbols: false
    passwordHistorySize: 3
  mfaConfiguration: OPTIONAL
  softwareTokenMfaEnabled: true
  autoVerifiedAttributes:
    - email
  attributesRequireVerificationBeforeUpdate:
    - email
  accountRecoveryMechanisms:
    - name: verified_email
      priority: 1
  deletionProtection: false
  userPoolTier: PLUS
  userPoolAddOns:
    advancedSecurityMode: ENFORCED
  riskConfiguration:
    accountTakeover:
      highAction:
        eventAction: BLOCK
        notify: true
      mediumAction:
        eventAction: MFA_IF_CONFIGURED
        notify: false
      notifyConfiguration:
        sourceArn:
          value: arn:aws:ses:us-west-2:123456789012:identity/security@example.com
        blockEmail:
          subject: Sign-in attempt blocked
          htmlBody: <p>We blocked a risky sign-in attempt on your account.</p>
          textBody: We blocked a risky sign-in attempt on your account.
    compromisedCredentials:
      eventAction: BLOCK
    riskException:
      blockedIpRanges:
        - 192.0.2.0/24
  userGroups:
    - name: admins
      description: Administrators
      precedence: 1
      roleArn:
        value: arn:aws:iam::123456789012:role/pool-admins
  domain:
    domain: test-auth-pool
