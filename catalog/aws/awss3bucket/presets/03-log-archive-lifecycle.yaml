apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  name: my-log-archive
spec:
  region: <aws-region>
  lifecycleRules:
    - id: tier-and-expire-logs
      filter:
        prefix: logs/
      transitions:
        - days: 30
          storageClass: STANDARD_IA
        - days: 90
          storageClass: GLACIER
      expiration:
        days: 365
      abortIncompleteMultipartUploadDays: 7
