apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awss3bucket
spec:
  # Flipped to pending_proof by the depth-closure wave that folded the five
  # governance companions (ABAC, analytics, inventory, metrics, S3 Metadata)
  # and added blocked encryption types, the account-regional namespace, and
  # day-zero transitions. The PRIOR green covered both provisioners across
  # two scenarios (minimal + full-surface); the full-surface scenario now
  # carries the new free arms (ABAC, analytics, self-delivered inventory,
  # request metrics, blocked SSE-C, day-zero tiering) and must be re-proven.
  # Deliberately not run live: replication and Object Lock (see the
  # full-surface scenario header) and the S3 Metadata configuration (the
  # provider's own create timeout is 30 minutes against this profile's
  # 15-minute budget -- proven offline via the canonical manifest and the
  # 04-governed-data-lake preset; the proof lane may choose to raise the
  # timeout and prove it live instead).
  tier: 1
  status: pending_proof
  timeout_minutes: 15
