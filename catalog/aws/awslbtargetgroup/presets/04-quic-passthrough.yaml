apiVersion: aws.planton.dev/v1alpha1
kind: AwsLbTargetGroup
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: <vpc-resource-name>
      fieldPath: status.outputs.vpc_id
  targetType: ip
  port: 443
  protocol: TCP_QUIC
  stickiness:
    type: source_ip_dest_ip
  deregistrationDelaySeconds: 60
  healthCheck:
    protocol: HTTP
    port: "8081"
    path: /readyz
    intervalSeconds: 15
    timeoutSeconds: 5
    healthyThreshold: 3
    unhealthyThreshold: 3
  targets:
    - targetId:
        value: <target-ip>
      quicServerId: <quic-server-id>
