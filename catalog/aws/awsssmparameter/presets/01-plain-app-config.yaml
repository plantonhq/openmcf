apiVersion: aws.planton.dev/v1alpha1
kind: AwsSsmParameter
metadata:
  name: app-log-level
spec:
  region: <aws-region>
  # Parameter names allow only letters, digits, and _.-/ -- replace the
  # example path segments with your own.
  parameterName: /myapp/config/log-level
  type: String
  value: info
  description: Application log level
  allowedPattern: "^(debug|info|warn|error)$"
