apiVersion: aws.planton.dev/v1alpha1
kind: AwsSsmParameter
metadata:
  name: db-password
spec:
  region: <aws-region>
  parameterName: /<app>/secrets/db-password
  type: SecureString
  secureValue: <managed-secret-reference>
  description: Database password, resolved just-in-time at deploy
  keyId:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key>
      fieldPath: status.outputs.key_arn
