apiVersion: aws.planton.dev/v1alpha1
kind: AwsSsmParameter
metadata:
  name: db-password
spec:
  region: <aws-region>
  # Parameter names allow only letters, digits, and _.-/ -- replace the
  # example path segments with your own.
  parameterName: /myapp/secrets/db-password
  type: SecureString
  # The secure value is sensitive: reference a managed secret
  # ($secret/<slug>) -- never a plaintext value.
  secureValue: $secret/db-password
  description: Database password, resolved just-in-time at deploy
  keyId:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key>
      fieldPath: status.outputs.key_arn
