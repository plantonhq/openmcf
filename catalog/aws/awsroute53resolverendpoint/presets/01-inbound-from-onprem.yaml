apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53ResolverEndpoint
metadata:
  name: onprem-inbound
spec:
  region: us-east-1
  direction: INBOUND
  ipAddresses:
    - subnetId:
        valueFrom:
          kind: AwsSubnet
          name: private-a
          fieldPath: status.outputs.subnet_id
    - subnetId:
        valueFrom:
          kind: AwsSubnet
          name: private-b
          fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: dns-from-onprem
        fieldPath: status.outputs.security_group_id
