# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_route53_resolver_endpoint:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The block folds in as the spec.ip_addresses list.
      - arg: ip_address
        spec: spec.ip_addresses
      - arg: resolver_endpoint_type
        spec: spec.endpoint_type
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name -- the resource's identity comes from the manifest, never a second free-form field
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_route53_resolver_rule:
    mappings:
      - arg: region
        spec: spec.region
      # Rules fold in as the spec.rules list.
      - arg: name
        spec: spec.rules.name
      - arg: domain_name
        spec: spec.rules.domain_name
      - arg: rule_type
        spec: spec.rules.rule_type
      - arg: target_ip
        spec: spec.rules.target_ips
    exclusions:
      - arg: resolver_endpoint_id
        reason: wired by the module to the folded endpoint's own AWS-generated ID (SYSTEM rules carry none) -- a rule always rides THIS endpoint, never a foreign one
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
  aws_route53_resolver_rule_association:
    mappings:
      - arg: region
        spec: spec.region
      # Associations fold in as each rule's vpc_ids list.
      - arg: vpc_id
        spec: spec.rules.vpc_ids
    exclusions:
      - arg: resolver_rule_id
        reason: wired by the module to the folded rule's own AWS-generated ID -- an association always joins THIS kind's rule to a VPC
      - arg: name
        reason: cosmetic label derived deterministically by both modules ("{rule}-{vpc}", capped at 64) so the engines never diverge on Pulumi's auto-naming
