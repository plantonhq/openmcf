syntax = "proto3";

package dev.planton.aws.awslaunchtemplate.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsLaunchTemplateSpec defines an EC2 launch template: the reusable
// blueprint that describes how to launch an instance -- AMI, instance type
// (or attribute-based requirements), storage, networking, IAM identity,
// metadata-service posture, and purchase options.
//
// A launch template is the composition anchor of EC2 fleet compute. It has
// its own lifecycle and is referenced from many places: auto-scaling groups
// (directly or through mixed-instances overrides), EKS managed node groups,
// AWS Batch compute environments, EC2 Fleet, and one-off RunInstances calls.
// That is why it is a first-class resource rather than a detail of the
// group that launches from it.
//
// Launch templates are versioned and versions are immutable in AWS: every
// change to this spec produces a NEW template version rather than mutating
// the old one, and both IaC modules promote that new version to the
// template's default -- so consumers that follow "$Default" (the common ASG
// and node-group setup) pick up the change on their next launch or instance
// refresh, while consumers pinned to a numeric version keep exactly what
// they tested. Only the template name is create-only; the name comes from
// metadata.name (AWS limit: 125 characters; both modules truncate longer
// names deterministically).
//
// Everything here is a launch-time DEFAULT, not a constraint: a consumer
// (an ASG override, a RunInstances call) may override any of it. Leaving a
// field unset omits it from the template so the consumer or the AWS
// account-level default decides -- which is exactly how an org-wide
// "golden" template is built: set the opinionated parts (IMDSv2, encrypted
// volumes, monitoring), leave the workload-specific parts open.
message AwsLaunchTemplateSpec {
  // The AWS region the launch template is created in. A template is a
  // regional object: an auto-scaling group or node group can only launch
  // from a template in its own region.
  // Example: "us-west-2", "eu-west-1".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable description recorded on each template VERSION (AWS calls
  // this the version description, up to 255 characters). Use it as a
  // change-log line: "amzn2023 + IMDSv2 + gp3", "rotate AMI 2026-07".
  string description = 2 [(buf.validate.field).string.max_len = 255];

  // The Amazon Machine Image the instance boots from (e.g.
  // "ami-0abcdef1234567890"). Optional at the template level: a template
  // without an AMI is a partial blueprint whose consumer must supply one --
  // but note that auto-scaling groups require the template they reference
  // to carry an AMI, so leave this unset only for consumers that inject
  // their own image (EKS managed node groups, EC2 Fleet overrides).
  string image_id = 3;

  // The EC2 instance type launched by default (e.g. "t3.small",
  // "m7g.large"). Mutually exclusive with instance_requirements -- name an
  // exact type here, or describe what you need there and let AWS pick
  // matching types. Leave both unset when the consumer supplies the type
  // (an ASG mixed-instances override, an EKS node group).
  string instance_type = 4;

  // Attribute-based instance selection: instead of naming a type, describe
  // the compute you need (vCPU and memory ranges, CPU generations,
  // accelerators, price protection) and AWS resolves the matching set of
  // instance types at launch. The foundation of Spot diversification -- a
  // fleet that can draw from dozens of pools rides out capacity events that
  // would starve a single-type group. Mutually exclusive with
  // instance_type.
  AwsLaunchTemplateInstanceRequirements instance_requirements = 5;

  // The name of an existing EC2 key pair injected for SSH access. Leave
  // unset for keyless fleets (SSM Session Manager via the instance
  // profile is the modern posture).
  string key_name = 6;

  // Instance user data: a cloud-init config or shell script executed on
  // first boot. Provide PLAIN TEXT here -- both IaC modules base64-encode
  // it for the EC2 API, so the manifest stays readable. AWS limit: 16 KiB
  // before encoding.
  string user_data = 7 [(buf.validate.field).string.max_bytes = 16384];

  // The IAM instance profile attached to launched instances -- the
  // instance's identity for SSM access, ECR pulls, S3 access, and every
  // other AWS API call the workload makes. Reference an
  // AwsIamInstanceProfile's instance_profile_arn output or pass a literal
  // profile ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef instance_profile = 8 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamInstanceProfile,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.instance_profile_arn"
  ];

  // Security groups attached to the instance's primary network interface.
  // Mutually exclusive with per-interface security groups inside
  // network_interfaces -- when the template declares explicit interfaces,
  // attach security groups on the interface instead.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_group_ids = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // Dedicated EBS throughput between the instance and its volumes. Only
  // meaningful for instance types where EBS optimization is optional (most
  // current-generation types have it always-on at no charge); enabling it
  // on an unsupported type fails the launch.
  bool ebs_optimized = 10;

  // Block device mappings: the volumes attached at launch, keyed by device
  // name. Override the AMI's root volume (grow it, switch to gp3, encrypt
  // with a CMK) or attach additional data volumes.
  repeated AwsLaunchTemplateBlockDeviceMapping block_device_mappings = 11;

  // Explicit network interfaces. Most templates leave this empty and let
  // the consumer place the instance (an ASG spreads across its subnets);
  // declare interfaces to control public-IP association, static private
  // IPs/prefixes, multiple NICs, or EFA for HPC/ML workloads. When any
  // interface is declared, put security groups on the interface, not on
  // security_group_ids.
  repeated AwsLaunchTemplateNetworkInterface network_interfaces = 12;

  // Instance Metadata Service posture. Set http_tokens = "required" to
  // enforce IMDSv2 -- the single most effective hardening against
  // credential-stealing SSRF attacks, and the recommended default for every
  // new template.
  AwsLaunchTemplateMetadataOptions metadata_options = 13;

  // Detailed CloudWatch monitoring: metrics at 1-minute granularity instead
  // of the free 5-minute default. Costs per instance-metric; auto-scaling
  // policies react meaningfully faster with it enabled.
  bool detailed_monitoring = 14;

  // Placement of launched instances: availability zone pinning, placement
  // group membership, and tenancy.
  AwsLaunchTemplatePlacement placement = 15;

  // CPU topology and features: trim vCPUs on license-bound workloads
  // (threads_per_core = 1), or enable AMD SEV-SNP memory encryption.
  AwsLaunchTemplateCpuOptions cpu_options = 16;

  // Credit option for burstable (T-family) instance types: "standard"
  // (throttle when credits run out) or "unlimited" (keep bursting, pay for
  // the excess). AWS default: "unlimited" for recent T families. Ignored
  // for non-burstable types.
  string cpu_credits = 17;

  // Request Spot capacity instead of On-Demand. Configuring this block
  // makes every launch from the template a Spot request -- appropriate for
  // interruption-tolerant workloads. For a mixed On-Demand/Spot fleet,
  // leave this unset and blend purchase options in the auto-scaling group's
  // mixed-instances policy instead.
  AwsLaunchTemplateSpotOptions spot_options = 18;

  // Launch instances as AWS Nitro Enclaves parents, enabling isolated
  // enclave VMs for secret-processing workloads. Not supported on every
  // instance type; incompatible with hibernation.
  bool enclave_enabled = 19;

  // Pre-provision instances for hibernation (encrypted root volume large
  // enough to hold RAM contents required). Incompatible with Nitro
  // Enclaves.
  bool hibernation_enabled = 20;

  // Simplified automatic recovery on instance impairment: "default"
  // (recover onto healthy hardware) or "disabled" (leave the instance
  // impaired -- for workloads with instance-store state that recovery would
  // silently discard).
  string auto_recovery = 21;

  // How the guest's private DNS hostname is formed and which DNS records
  // resolve to it.
  AwsLaunchTemplatePrivateDnsNameOptions private_dns_name_options = 22;

  // Protect launched instances from being stopped via the API. A guard for
  // pet-like fleet members; leave false for disposable fleet instances.
  bool disable_api_stop = 23;

  // Protect launched instances from being terminated via the API. NOTE: an
  // auto-scaling group cannot scale in instances with termination
  // protection -- use the ASG's protect_from_scale_in instead for fleet
  // instances.
  bool disable_api_termination = 24;

  // What an OS-initiated shutdown does to the instance: "stop" (AWS
  // default; the instance can be started again) or "terminate" (the
  // instance is gone -- the right choice for immutable fleet members that
  // should never be resurrected by hand).
  string instance_initiated_shutdown_behavior = 25;

  // Launch into EC2 Capacity Reservations -- guaranteed capacity a
  // reserved fleet has already paid for (On-Demand Capacity
  // Reservations, or Capacity Blocks for ML). Leave unset for the AWS
  // default (use a matching open reservation when one exists).
  AwsLaunchTemplateCapacityReservation capacity_reservation = 26;

  // The purchase market for launched instances: "spot" (pairs with
  // spot_options) or "capacity-block" (pre-purchased Capacity Blocks
  // for ML -- requires capacity_reservation targeting the block).
  // Unset means On-Demand, unless spot_options implies "spot".
  string market_type = 27;

  // Network bandwidth weighting on supported types: "default", "vpc-1"
  // (shift baseline bandwidth toward VPC networking), or "ebs-1"
  // (shift it toward EBS throughput). A no-cost performance bias for
  // network- or storage-heavy workloads.
  string bandwidth_weighting = 28;

  // AWS License Manager license-configuration ARNs launched instances
  // consume -- BYOL license tracking (e.g. per-core database
  // licenses). Literal ARNs: License Manager has no Planton kind.
  repeated string license_configuration_arns = 29;

  // Additional network interfaces attached at launch BEYOND the
  // primary set in network_interfaces -- a 2026 EC2 capability for
  // multi-homed instances (e.g. a dedicated storage-subnet interface).
  // Interfaces are created and deleted with the instance.
  repeated AwsLaunchTemplateSecondaryInterface secondary_interfaces = 30;

  // ---------------------------------------------------------------------------
  // Spec-level CEL validations
  // ---------------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "market_type_valid"
    message: "market_type must be 'spot' or 'capacity-block' when set"
    expression: "this.market_type == '' || this.market_type in ['spot', 'capacity-block']"
  };

  // spot_options IS the spot market configuration -- declaring it under
  // the capacity-block market is contradictory.
  option (buf.validate.message).cel = {
    id: "spot_options_require_spot_market"
    message: "spot_options only applies to the 'spot' market (leave market_type unset or 'spot')"
    expression: "!has(this.spot_options) || this.market_type == '' || this.market_type == 'spot'"
  };

  // A Capacity Block is a targeted reservation: AWS rejects the
  // capacity-block market without a reservation target to launch into.
  option (buf.validate.message).cel = {
    id: "capacity_block_requires_reservation_target"
    message: "market_type 'capacity-block' requires capacity_reservation with capacity_reservation_id or capacity_reservation_resource_group_arn"
    expression: "this.market_type != 'capacity-block' || (has(this.capacity_reservation) && (this.capacity_reservation.capacity_reservation_id != '' || this.capacity_reservation.capacity_reservation_resource_group_arn != ''))"
  };

  option (buf.validate.message).cel = {
    id: "bandwidth_weighting_valid"
    message: "bandwidth_weighting must be 'default', 'vpc-1', or 'ebs-1' when set"
    expression: "this.bandwidth_weighting == '' || this.bandwidth_weighting in ['default', 'vpc-1', 'ebs-1']"
  };

  option (buf.validate.message).cel = {
    id: "instance_type_xor_requirements"
    message: "instance_type and instance_requirements are mutually exclusive -- name an exact type, or describe requirements, not both"
    expression: "this.instance_type == '' || !has(this.instance_requirements)"
  };

  option (buf.validate.message).cel = {
    id: "image_id_format"
    message: "image_id must be an AMI ID beginning with 'ami-'"
    expression: "this.image_id == '' || this.image_id.startsWith('ami-')"
  };

  option (buf.validate.message).cel = {
    id: "cpu_credits_valid"
    message: "cpu_credits must be 'standard' or 'unlimited' when set"
    expression: "this.cpu_credits == '' || this.cpu_credits in ['standard', 'unlimited']"
  };

  option (buf.validate.message).cel = {
    id: "auto_recovery_valid"
    message: "auto_recovery must be 'default' or 'disabled' when set"
    expression: "this.auto_recovery == '' || this.auto_recovery in ['default', 'disabled']"
  };

  option (buf.validate.message).cel = {
    id: "shutdown_behavior_valid"
    message: "instance_initiated_shutdown_behavior must be 'stop' or 'terminate' when set"
    expression: "this.instance_initiated_shutdown_behavior == '' || this.instance_initiated_shutdown_behavior in ['stop', 'terminate']"
  };

  // AWS rejects the combination: an enclave parent cannot hibernate.
  option (buf.validate.message).cel = {
    id: "enclave_incompatible_with_hibernation"
    message: "enclave_enabled and hibernation_enabled cannot both be true"
    expression: "!(this.enclave_enabled && this.hibernation_enabled)"
  };

  // With explicit interfaces, AWS requires security groups per interface;
  // top-level groups would silently apply to none of them.
  option (buf.validate.message).cel = {
    id: "security_groups_conflict_with_interfaces"
    message: "when network_interfaces are declared, attach security groups on each interface instead of security_group_ids"
    expression: "size(this.network_interfaces) == 0 || size(this.security_group_ids) == 0"
  };
}

// AwsLaunchTemplateCapacityReservation targets launches at EC2 Capacity
// Reservations: pre-purchased, guaranteed capacity (On-Demand Capacity
// Reservations for steady reserved fleets, Capacity Blocks for
// GPU/ML bursts).
message AwsLaunchTemplateCapacityReservation {
  // How launches relate to reservations:
  // - "open": use a matching open reservation when one exists (the AWS
  //   default behavior), otherwise launch as regular On-Demand.
  // - "none": never consume a reservation, even a matching open one.
  // - "capacity-reservations-only": launch ONLY into reserved capacity
  //   -- fail rather than fall back to On-Demand.
  // Leave empty when targeting a specific reservation below.
  string preference = 1;

  // A specific Capacity Reservation to launch into ("cr-..."). The
  // required target for Capacity Blocks. Mutually exclusive with
  // capacity_reservation_resource_group_arn.
  string capacity_reservation_id = 2;

  // A resource-group ARN collecting Capacity Reservations -- target the
  // group instead of one reservation ID. Mutually exclusive with
  // capacity_reservation_id.
  string capacity_reservation_resource_group_arn = 3;

  option (buf.validate.message).cel = {
    id: "preference_valid"
    message: "preference must be 'open', 'none', or 'capacity-reservations-only' when set"
    expression: "this.preference == '' || this.preference in ['open', 'none', 'capacity-reservations-only']"
  };

  option (buf.validate.message).cel = {
    id: "id_xor_resource_group"
    message: "capacity_reservation_id and capacity_reservation_resource_group_arn are mutually exclusive"
    expression: "this.capacity_reservation_id == '' || this.capacity_reservation_resource_group_arn == ''"
  };
}

// AwsLaunchTemplateSecondaryInterface is one additional network interface
// created and attached at launch beyond the primary interface set --
// multi-homing for launched instances (e.g. a storage-subnet leg). The
// interface lives and dies with its instance.
message AwsLaunchTemplateSecondaryInterface {
  // The device index the interface attaches at.
  int32 device_index = 1;

  // The network card the interface binds to, on instance types with
  // multiple network cards.
  int32 network_card_index = 2;

  // Delete the interface when the instance terminates.
  bool delete_on_termination = 3;

  // The subnet the secondary interface lives in. Reference an
  // AwsSubnet's subnet_id output or pass a literal subnet ID -- e.g. a
  // dedicated storage or replication subnet.
  dev.planton.shared.foreignkey.v1.StringValueOrRef secondary_subnet_id = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Number of private IPv4 addresses AWS auto-assigns on the
  // interface. Mutually exclusive with private_ip_addresses.
  int32 private_ip_address_count = 5;

  // Specific private IPv4 addresses to assign. Mutually exclusive with
  // private_ip_address_count.
  repeated string private_ip_addresses = 6;

  option (buf.validate.message).cel = {
    id: "ip_count_xor_addresses"
    message: "private_ip_address_count and private_ip_addresses are mutually exclusive"
    expression: "this.private_ip_address_count == 0 || size(this.private_ip_addresses) == 0"
  };
}

// AwsLaunchTemplateInstanceRequirements describes compute by attributes so
// AWS resolves the matching instance types at launch, instead of naming one
// type. memory_mib and vcpu_count are the two required dimensions; every
// other field narrows the candidate set. Instance types are excluded unless
// a field says otherwise (e.g. bare_metal defaults to "excluded").
message AwsLaunchTemplateInstanceRequirements {
  // Required. Memory per instance, in MiB. min is required; leave max unset
  // (0) for no upper bound.
  AwsLaunchTemplateIntRange memory_mib = 1 [(buf.validate.field).required = true];

  // Required. vCPUs per instance. min is required; leave max unset (0) for
  // no upper bound.
  AwsLaunchTemplateIntRange vcpu_count = 2 [(buf.validate.field).required = true];

  // Allow-list of instance types or families, with wildcards ("m5.large",
  // "m5.*", "c*"). At most 400 entries. Mutually exclusive with
  // excluded_instance_types.
  repeated string allowed_instance_types = 3 [(buf.validate.field).repeated.max_items = 400];

  // Deny-list of instance types or families, with wildcards. At most 400
  // entries. Mutually exclusive with allowed_instance_types.
  repeated string excluded_instance_types = 4 [(buf.validate.field).repeated.max_items = 400];

  // Instance generations to include: "current" and/or "previous". AWS
  // default: any generation matching the other requirements.
  repeated string instance_generations = 5;

  // CPU manufacturers to include: "intel", "amd", "amazon-web-services"
  // (Graviton), "apple". AWS default: any. Selecting only
  // "amazon-web-services" is how an arm64 fleet is expressed -- pair it
  // with an arm64 AMI.
  repeated string cpu_manufacturers = 6;

  // Bare-metal eligibility: "included", "excluded" (AWS default), or
  // "required".
  string bare_metal = 7;

  // Burstable (T-family) eligibility: "included", "excluded" (AWS
  // default), or "required".
  string burstable_performance = 8;

  // Only instance types that support hibernation.
  bool require_hibernate_support = 9;

  // Spot price protection: exclude types whose Spot price exceeds the
  // identified lowest-priced type's Spot price by more than this
  // percentage. Mutually exclusive with
  // max_spot_price_as_percentage_of_optimal_on_demand_price.
  int32 spot_max_price_percentage_over_lowest_price = 10;

  // Spot price protection anchored to On-Demand: exclude types whose Spot
  // price exceeds this percentage of the optimal type's On-Demand price --
  // steadier than the lowest-Spot anchor because On-Demand prices do not
  // fluctuate. Mutually exclusive with
  // spot_max_price_percentage_over_lowest_price.
  int32 max_spot_price_as_percentage_of_optimal_on_demand_price = 11;

  // On-Demand price protection: exclude types whose On-Demand price exceeds
  // the identified lowest-priced type's by more than this percentage. AWS
  // default: 20.
  int32 on_demand_max_price_percentage_over_lowest_price = 12;

  // Instance-store (local disk) eligibility: "included" (AWS default),
  // "excluded", or "required".
  string local_storage = 13;

  // Local storage technologies when instance-store is in play: "hdd"
  // and/or "ssd".
  repeated string local_storage_types = 14;

  // Total local (instance-store) storage, in GB.
  AwsLaunchTemplateDoubleRange total_local_storage_gb = 15;

  // Memory-to-vCPU ratio, in GiB per vCPU -- a compact way to say "memory
  // optimized" (min 8) or "compute optimized" (max 2) without naming
  // families.
  AwsLaunchTemplateDoubleRange memory_gib_per_vcpu = 16;

  // Number of network interfaces the type must support.
  AwsLaunchTemplateIntRange network_interface_count = 17;

  // Network bandwidth, in Gbps.
  AwsLaunchTemplateDoubleRange network_bandwidth_gbps = 18;

  // Baseline (non-burst) EBS bandwidth, in Mbps.
  AwsLaunchTemplateIntRange baseline_ebs_bandwidth_mbps = 19;

  // Number of accelerators (GPUs, FPGAs, inference chips). Set min 1 to
  // require accelerated types; set max 0 explicitly via {min:0, max:0} is
  // not expressible -- to EXCLUDE accelerators, leave this unset and rely
  // on accelerator_types being empty.
  AwsLaunchTemplateIntRange accelerator_count = 20;

  // Accelerator manufacturers: "nvidia", "amd", "amazon-web-services",
  // "xilinx", "habana".
  repeated string accelerator_manufacturers = 21;

  // Specific accelerator models (e.g. "a100", "v100", "t4",
  // "inferentia", "radeon-pro-v520").
  repeated string accelerator_names = 22;

  // Accelerator categories: "gpu", "fpga", "inference".
  repeated string accelerator_types = 23;

  // Total accelerator memory, in MiB.
  AwsLaunchTemplateIntRange accelerator_total_memory_mib = 24;

  // ---------------------------------------------------------------------------
  // Instance requirements CEL validations
  // ---------------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "allowed_xor_excluded_types"
    message: "allowed_instance_types and excluded_instance_types are mutually exclusive"
    expression: "size(this.allowed_instance_types) == 0 || size(this.excluded_instance_types) == 0"
  };

  option (buf.validate.message).cel = {
    id: "spot_price_protection_exclusive"
    message: "spot_max_price_percentage_over_lowest_price and max_spot_price_as_percentage_of_optimal_on_demand_price are mutually exclusive"
    expression: "this.spot_max_price_percentage_over_lowest_price == 0 || this.max_spot_price_as_percentage_of_optimal_on_demand_price == 0"
  };

  option (buf.validate.message).cel = {
    id: "bare_metal_valid"
    message: "bare_metal must be 'included', 'excluded', or 'required' when set"
    expression: "this.bare_metal == '' || this.bare_metal in ['included', 'excluded', 'required']"
  };

  option (buf.validate.message).cel = {
    id: "burstable_performance_valid"
    message: "burstable_performance must be 'included', 'excluded', or 'required' when set"
    expression: "this.burstable_performance == '' || this.burstable_performance in ['included', 'excluded', 'required']"
  };

  option (buf.validate.message).cel = {
    id: "local_storage_valid"
    message: "local_storage must be 'included', 'excluded', or 'required' when set"
    expression: "this.local_storage == '' || this.local_storage in ['included', 'excluded', 'required']"
  };
}

// AwsLaunchTemplateIntRange is an integer min/max pair for attribute-based
// requirements. 0 means "unset" -- ranges here never legitimately start at
// zero, so 0 doubles as "no bound" without an optional wrapper.
message AwsLaunchTemplateIntRange {
  // Lower bound, inclusive.
  int32 min = 1;
  // Upper bound, inclusive. 0 means no upper bound.
  int32 max = 2;

  option (buf.validate.message).cel = {
    id: "int_range_ordered"
    message: "max must be greater than or equal to min when both are set"
    expression: "this.min == 0 || this.max == 0 || this.max >= this.min"
  };
}

// AwsLaunchTemplateDoubleRange is a fractional min/max pair for
// attribute-based requirements (ratios, Gbps). 0 means "unset".
message AwsLaunchTemplateDoubleRange {
  // Lower bound, inclusive.
  double min = 1;
  // Upper bound, inclusive. 0 means no upper bound.
  double max = 2;

  option (buf.validate.message).cel = {
    id: "double_range_ordered"
    message: "max must be greater than or equal to min when both are set"
    expression: "this.min == 0.0 || this.max == 0.0 || this.max >= this.min"
  };
}

// AwsLaunchTemplateBlockDeviceMapping attaches or reshapes one volume at
// launch. Use the AMI's root device name (e.g. "/dev/xvda" for Amazon
// Linux, "/dev/sda1" for Ubuntu) to override the root volume; any other
// device name attaches an additional volume.
message AwsLaunchTemplateBlockDeviceMapping {
  // The device name exposed to the instance (e.g. "/dev/xvda",
  // "/dev/sdf"). Required.
  string device_name = 1 [(buf.validate.field).required = true];

  // An instance-store virtual device name ("ephemeral0", "ephemeral1", ...)
  // for instance types with local disks. Mutually exclusive with ebs.
  string virtual_name = 2;

  // Suppress a device the AMI would otherwise attach -- the way to DROP an
  // AMI-baked data volume. Mutually exclusive with ebs.
  bool no_device = 3;

  // EBS volume configuration for this device.
  AwsLaunchTemplateEbs ebs = 4;

  option (buf.validate.message).cel = {
    id: "ebs_conflicts_with_virtual_name"
    message: "ebs and virtual_name are mutually exclusive on one mapping"
    expression: "!has(this.ebs) || this.virtual_name == ''"
  };

  option (buf.validate.message).cel = {
    id: "ebs_conflicts_with_no_device"
    message: "ebs and no_device are mutually exclusive on one mapping"
    expression: "!has(this.ebs) || !this.no_device"
  };
}

// AwsLaunchTemplateEbs shapes one EBS volume. Unset fields inherit from the
// AMI's block device mapping (size, type) or the account default
// (encryption), which is what makes a minimal root-volume override safe.
message AwsLaunchTemplateEbs {
  // Volume size in GiB. Must be at least the AMI snapshot's size when
  // overriding the root device.
  int32 volume_size_gb = 1;

  // Volume type: "gp3" (the current general-purpose default choice),
  // "gp2", "io1", "io2" (provisioned IOPS), "st1", "sc1" (throughput/cold
  // HDD), "standard" (legacy magnetic). Unset inherits from the AMI
  // mapping.
  string volume_type = 2;

  // Provisioned IOPS. Required for "io1"/"io2"; optional for "gp3"
  // (baseline 3000 without it); not valid for other types.
  int32 iops = 3;

  // Throughput in MiB/s, 125-1000. "gp3" only (baseline 125 without it).
  int32 throughput_mibps = 4;

  // Encrypt the volume at rest. Snapshots and volumes created from them
  // stay encrypted. When the account enforces EBS-encryption-by-default
  // this is already true regardless.
  bool encrypted = 5;

  // The KMS key for encryption. Reference an AwsKmsKey's key_arn output or
  // pass a literal key ARN. Unset with encrypted = true uses the AWS
  // managed aws/ebs key; a customer-managed key adds revocation and
  // cross-account control.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_id = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // Create the volume from this EBS snapshot (e.g. a pre-warmed data
  // volume).
  string snapshot_id = 7;

  // Delete the volume when the instance terminates. AWS default: true for
  // the root volume, false for additional volumes (inherited from the
  // AMI). Optional rather than plain bool so an explicit false ("keep the
  // data volume") is distinguishable from unset ("keep the AMI default").
  optional bool delete_on_termination = 8;

  // MiB/s at which the volume hydrates from its snapshot, 100-300.
  // Without it, snapshot blocks load lazily on first read (the classic
  // cold-start latency on restored volumes); a paid initialization rate
  // makes the volume fully warm on a schedule. Only meaningful with
  // snapshot_id.
  int32 volume_initialization_rate_mibps = 9;

  option (buf.validate.message).cel = {
    id: "volume_init_rate_range"
    message: "volume_initialization_rate_mibps must be between 100 and 300 when set"
    expression: "this.volume_initialization_rate_mibps == 0 || (this.volume_initialization_rate_mibps >= 100 && this.volume_initialization_rate_mibps <= 300)"
  };

  option (buf.validate.message).cel = {
    id: "volume_init_rate_requires_snapshot"
    message: "volume_initialization_rate_mibps only applies when creating the volume from snapshot_id"
    expression: "this.volume_initialization_rate_mibps == 0 || this.snapshot_id != ''"
  };

  option (buf.validate.message).cel = {
    id: "volume_type_valid"
    message: "volume_type must be one of: gp2, gp3, io1, io2, st1, sc1, standard"
    expression: "this.volume_type == '' || this.volume_type in ['gp2', 'gp3', 'io1', 'io2', 'st1', 'sc1', 'standard']"
  };

  option (buf.validate.message).cel = {
    id: "throughput_range"
    message: "throughput_mibps must be between 125 and 1000 when set"
    expression: "this.throughput_mibps == 0 || (this.throughput_mibps >= 125 && this.throughput_mibps <= 1000)"
  };

  option (buf.validate.message).cel = {
    id: "throughput_only_for_gp3"
    message: "throughput_mibps only applies to gp3 volumes"
    expression: "this.throughput_mibps == 0 || this.volume_type == 'gp3'"
  };

  option (buf.validate.message).cel = {
    id: "iops_only_for_provisioned_types"
    message: "iops only applies to gp3, io1, and io2 volumes"
    expression: "this.iops == 0 || this.volume_type in ['gp3', 'io1', 'io2']"
  };
}

// AwsLaunchTemplateNetworkInterface declares one network interface attached
// at launch. Device index 0 is the primary interface. Subnet placement set
// here PINS every launch to that subnet -- for auto-scaling groups, leave
// subnet_id unset and let the group's subnets decide placement.
message AwsLaunchTemplateNetworkInterface {
  // Position of the interface in the attachment order. The primary
  // interface is 0.
  int32 device_index = 1;

  // The physical network card the interface binds to, for instance types
  // with multiple cards (high-bandwidth/EFA types). Default 0.
  int32 network_card_index = 2;

  // Free-text description of the interface.
  string description = 3;

  // Interface type: "interface" (standard, the default), "efa" (Elastic
  // Fabric Adapter with OS-bypass for tightly coupled HPC/ML), or
  // "efa-only" (EFA without an IP -- secondary cards on multi-card
  // types).
  string interface_type = 4;

  // Attach an existing ENI by ID instead of creating one -- for a
  // pre-provisioned static identity (fixed IP/MAC). Mutually exclusive
  // with subnet placement and addressing fields.
  string network_interface_id = 5;

  // Associate a public IPv4 address. Optional tri-state: unset inherits
  // the subnet's map-public-IP setting; an explicit value overrides it
  // either way.
  optional bool associate_public_ip_address = 6;

  // Delete the interface when the instance terminates. AWS default: true
  // for interfaces the launch creates. Optional so an explicit false
  // ("keep the ENI for reuse") is distinguishable from unset.
  optional bool delete_on_termination = 7;

  // The subnet the interface lives in. Reference an AwsSubnet's subnet_id
  // output or pass a literal subnet ID. Setting it pins every launch to
  // this subnet; auto-scaling templates normally leave it unset.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_id = 8 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Security groups on this interface. Reference AwsSecurityGroup
  // security_group_id outputs or pass literal group IDs.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_group_ids = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // A specific primary private IPv4 address from the subnet's range.
  string private_ip_address = 10;

  // Number of additional private IPv4 addresses AWS auto-assigns.
  // Mutually exclusive with ipv4_addresses.
  int32 ipv4_address_count = 11;

  // Specific secondary private IPv4 addresses. Mutually exclusive with
  // ipv4_address_count.
  repeated string ipv4_addresses = 12;

  // Number of IPv6 addresses AWS auto-assigns from the subnet's IPv6
  // range. Mutually exclusive with ipv6_addresses.
  int32 ipv6_address_count = 13;

  // Specific IPv6 addresses. Mutually exclusive with ipv6_address_count.
  repeated string ipv6_addresses = 14;

  // Number of /28 IPv4 prefixes AWS auto-assigns (prefix delegation --
  // how Kubernetes CNIs scale pod IPs per node). Mutually exclusive with
  // ipv4_prefixes.
  int32 ipv4_prefix_count = 15;

  // Specific /28 IPv4 prefixes. Mutually exclusive with
  // ipv4_prefix_count.
  repeated string ipv4_prefixes = 16;

  // Number of /80 IPv6 prefixes AWS auto-assigns. Mutually exclusive with
  // ipv6_prefixes.
  int32 ipv6_prefix_count = 17;

  // Specific /80 IPv6 prefixes. Mutually exclusive with
  // ipv6_prefix_count.
  repeated string ipv6_prefixes = 18;

  // Associate a Carrier IP (AWS Wavelength zones) -- the Wavelength
  // analog of a public IP, reachable from the carrier's mobile
  // network. Only meaningful for interfaces in Wavelength-zone
  // subnets. Optional tri-state like associate_public_ip_address.
  optional bool associate_carrier_ip_address = 19;

  // Idle-timeout tuning for the interface's connection tracking --
  // reclaim conntrack slots faster on connection-churning workloads
  // (load-balancer backends, NAT-ish proxies).
  AwsLaunchTemplateConnectionTracking connection_tracking = 20;

  // ENA Express (SRD -- Scalable Reliable Datagram): reduce tail
  // latency between instances that both enable it, on supported
  // types. TCP benefits transparently; UDP needs the explicit flag.
  AwsLaunchTemplateEnaSrd ena_srd = 21;

  // Number of ENA queues for the interface, on instance types that
  // support ENA queue tuning. 0 keeps the AWS default per instance
  // size.
  int32 ena_queue_count = 22;

  // Make the auto-assigned IPv6 address the instance's PRIMARY,
  // stable identity: it survives network-interface replacement --
  // required for IPv6-only instances whose address must not change.
  optional bool primary_ipv6 = 23;

  // ---------------------------------------------------------------------------
  // Network interface CEL validations
  // ---------------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "interface_type_valid"
    message: "interface_type must be 'interface', 'efa', or 'efa-only' when set"
    expression: "this.interface_type == '' || this.interface_type in ['interface', 'efa', 'efa-only']"
  };

  option (buf.validate.message).cel = {
    id: "ipv4_count_xor_addresses"
    message: "ipv4_address_count and ipv4_addresses are mutually exclusive"
    expression: "this.ipv4_address_count == 0 || size(this.ipv4_addresses) == 0"
  };

  option (buf.validate.message).cel = {
    id: "ipv6_count_xor_addresses"
    message: "ipv6_address_count and ipv6_addresses are mutually exclusive"
    expression: "this.ipv6_address_count == 0 || size(this.ipv6_addresses) == 0"
  };

  option (buf.validate.message).cel = {
    id: "ipv4_prefix_count_xor_prefixes"
    message: "ipv4_prefix_count and ipv4_prefixes are mutually exclusive"
    expression: "this.ipv4_prefix_count == 0 || size(this.ipv4_prefixes) == 0"
  };

  option (buf.validate.message).cel = {
    id: "ipv6_prefix_count_xor_prefixes"
    message: "ipv6_prefix_count and ipv6_prefixes are mutually exclusive"
    expression: "this.ipv6_prefix_count == 0 || size(this.ipv6_prefixes) == 0"
  };
}

// AwsLaunchTemplateConnectionTracking tunes the interface's connection
// tracking idle timeouts. Lower timeouts reclaim tracking slots faster on
// connection-churning workloads; the defaults suit most fleets.
message AwsLaunchTemplateConnectionTracking {
  // Idle timeout for established TCP connections, 60-432000 seconds
  // (5 days, the AWS default).
  int32 tcp_established_timeout_seconds = 1;

  // Idle timeout for UDP "connections" that have seen traffic BOTH
  // ways (streams), 60-180 seconds.
  int32 udp_stream_timeout_seconds = 2;

  // Idle timeout for single-direction UDP flows, 30-60 seconds.
  int32 udp_timeout_seconds = 3;

  option (buf.validate.message).cel = {
    id: "tcp_established_range"
    message: "tcp_established_timeout_seconds must be between 60 and 432000 when set"
    expression: "this.tcp_established_timeout_seconds == 0 || (this.tcp_established_timeout_seconds >= 60 && this.tcp_established_timeout_seconds <= 432000)"
  };

  option (buf.validate.message).cel = {
    id: "udp_stream_range"
    message: "udp_stream_timeout_seconds must be between 60 and 180 when set"
    expression: "this.udp_stream_timeout_seconds == 0 || (this.udp_stream_timeout_seconds >= 60 && this.udp_stream_timeout_seconds <= 180)"
  };

  option (buf.validate.message).cel = {
    id: "udp_range"
    message: "udp_timeout_seconds must be between 30 and 60 when set"
    expression: "this.udp_timeout_seconds == 0 || (this.udp_timeout_seconds >= 30 && this.udp_timeout_seconds <= 60)"
  };
}

// AwsLaunchTemplateEnaSrd enables ENA Express (Scalable Reliable
// Datagram) on the interface -- lower tail latency between enabled
// instances on supported instance types.
message AwsLaunchTemplateEnaSrd {
  // Turn ENA Express on for the interface (TCP flows benefit
  // transparently).
  bool enabled = 1;

  // Also run eligible UDP traffic over SRD. Only meaningful when
  // enabled is true.
  bool udp_enabled = 2;

  option (buf.validate.message).cel = {
    id: "udp_requires_enabled"
    message: "udp_enabled requires enabled to be true"
    expression: "!this.udp_enabled || this.enabled"
  };
}

// AwsLaunchTemplateMetadataOptions controls the Instance Metadata Service
// (IMDS) -- the on-instance endpoint that serves credentials and instance
// identity. The hardened posture for new fleets: http_tokens = "required"
// (IMDSv2 only), http_put_response_hop_limit = 2 when containers need
// metadata access (1 confines it to the host).
message AwsLaunchTemplateMetadataOptions {
  // Whether the metadata service is reachable at all: "enabled" (AWS
  // default) or "disabled" (nothing on the instance can fetch credentials
  // -- rare, for fully static workloads).
  string http_endpoint = 1;

  // IMDS version enforcement: "required" (IMDSv2 session tokens only --
  // the recommended hardening) or "optional" (v1 and v2 both answer; the
  // AWS default for backward compatibility).
  string http_tokens = 2 [(dev.planton.shared.options.sensitive_exempt_reason) = "IMDS enforcement mode (required/optional), not a token value"];

  // TTL of the IMDSv2 token-fetch packet, 1-64. 1 (AWS default) confines
  // metadata to the instance itself; 2 lets containerized workloads (one
  // extra network hop) reach it.
  int32 http_put_response_hop_limit = 3;

  // Serve metadata over the interface's IPv6 endpoint as well: "enabled"
  // or "disabled" (AWS default).
  string http_protocol_ipv6 = 4;

  // Expose the instance's tags through the metadata service: "enabled" or
  // "disabled" (AWS default). Lets on-instance agents read tags without
  // ec2:DescribeTags permission.
  string instance_metadata_tags = 5;

  // ---------------------------------------------------------------------------
  // Metadata options CEL validations
  // ---------------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "http_endpoint_valid"
    message: "http_endpoint must be 'enabled' or 'disabled' when set"
    expression: "this.http_endpoint == '' || this.http_endpoint in ['enabled', 'disabled']"
  };

  option (buf.validate.message).cel = {
    id: "http_tokens_valid"
    message: "http_tokens must be 'required' or 'optional' when set"
    expression: "this.http_tokens == '' || this.http_tokens in ['required', 'optional']"
  };

  option (buf.validate.message).cel = {
    id: "hop_limit_range"
    message: "http_put_response_hop_limit must be between 1 and 64 when set"
    expression: "this.http_put_response_hop_limit == 0 || (this.http_put_response_hop_limit >= 1 && this.http_put_response_hop_limit <= 64)"
  };

  option (buf.validate.message).cel = {
    id: "http_protocol_ipv6_valid"
    message: "http_protocol_ipv6 must be 'enabled' or 'disabled' when set"
    expression: "this.http_protocol_ipv6 == '' || this.http_protocol_ipv6 in ['enabled', 'disabled']"
  };

  option (buf.validate.message).cel = {
    id: "instance_metadata_tags_valid"
    message: "instance_metadata_tags must be 'enabled' or 'disabled' when set"
    expression: "this.instance_metadata_tags == '' || this.instance_metadata_tags in ['enabled', 'disabled']"
  };
}

// AwsLaunchTemplatePlacement pins where launched instances land. Fleet
// templates usually leave all of this unset and let the auto-scaling group
// spread across its subnets.
message AwsLaunchTemplatePlacement {
  // Pin launches to one availability zone (e.g. "us-west-2a"). For ASG
  // templates, prefer the group's subnets over AZ pinning here.
  string availability_zone = 1;

  // The placement group to launch into: "cluster" groups pack instances
  // for lowest latency, "spread" and "partition" groups separate them for
  // fault isolation. Mutually exclusive with group_id.
  string group_name = 2;

  // Partition number within a partition placement group.
  int32 partition_number = 3;

  // Instance tenancy: "default" (shared hardware), "dedicated"
  // (single-tenant hardware), or "host" (a specific Dedicated Host --
  // licensing scenarios).
  string tenancy = 4;

  // The placement group by ID ("pg-...") instead of name. Mutually
  // exclusive with group_name.
  string group_id = 5;

  // The Dedicated Host to land on ("h-..."). Host tenancy pins BYOL
  // workloads (per-socket/per-core licenses) to specific hardware.
  // Mutually exclusive with host_resource_group_arn.
  string host_id = 6;

  // A License Manager host resource group ARN -- AWS picks (and
  // manages) a Dedicated Host from the group instead of naming one.
  // Mutually exclusive with host_id.
  string host_resource_group_arn = 7;

  // Dedicated Host affinity: "default" (instance may restart on any
  // host) or "host" (the instance always restarts on the same host --
  // needed when licenses are bound to specific hardware).
  string affinity = 8;

  // Named spread domain on AWS Outposts placement groups.
  string spread_domain = 9;

  option (buf.validate.message).cel = {
    id: "tenancy_valid"
    message: "tenancy must be 'default', 'dedicated', or 'host' when set"
    expression: "this.tenancy == '' || this.tenancy in ['default', 'dedicated', 'host']"
  };

  option (buf.validate.message).cel = {
    id: "group_name_xor_group_id"
    message: "group_name and group_id are mutually exclusive"
    expression: "this.group_name == '' || this.group_id == ''"
  };

  option (buf.validate.message).cel = {
    id: "host_id_xor_resource_group"
    message: "host_id and host_resource_group_arn are mutually exclusive"
    expression: "this.host_id == '' || this.host_resource_group_arn == ''"
  };

  option (buf.validate.message).cel = {
    id: "affinity_valid"
    message: "affinity must be 'default' or 'host' when set"
    expression: "this.affinity == '' || this.affinity in ['default', 'host']"
  };

  // Naming a specific host or host group only makes sense on host
  // tenancy -- AWS ignores or rejects it otherwise.
  option (buf.validate.message).cel = {
    id: "host_targeting_requires_host_tenancy"
    message: "host_id / host_resource_group_arn / affinity require tenancy 'host'"
    expression: "(this.host_id == '' && this.host_resource_group_arn == '' && this.affinity == '') || this.tenancy == 'host'"
  };
}

// AwsLaunchTemplateCpuOptions shapes the vCPU topology and CPU security
// features of launched instances.
message AwsLaunchTemplateCpuOptions {
  // Number of physical cores. Combined with threads_per_core = 1 this
  // trims the vCPU count -- the standard move for per-core licensed
  // software (databases) on large instance types.
  int32 core_count = 1;

  // Threads per core: 2 (hyper-threading, the default on x86) or 1
  // (disable SMT -- per-core licensing, or HPC codes that fight over
  // shared core resources).
  int32 threads_per_core = 2;

  // AMD SEV-SNP memory encryption on supported AMD types: "enabled" or
  // "disabled". Confidential-computing hardening.
  string amd_sev_snp = 3;

  // Hardware-assisted nested virtualization on supported types:
  // "enabled" (run hypervisors/VMs inside the instance) or "disabled".
  string nested_virtualization = 4;

  option (buf.validate.message).cel = {
    id: "threads_per_core_valid"
    message: "threads_per_core must be 1 or 2 when set"
    expression: "this.threads_per_core == 0 || this.threads_per_core in [1, 2]"
  };

  option (buf.validate.message).cel = {
    id: "nested_virtualization_valid"
    message: "nested_virtualization must be 'enabled' or 'disabled' when set"
    expression: "this.nested_virtualization == '' || this.nested_virtualization in ['enabled', 'disabled']"
  };

  option (buf.validate.message).cel = {
    id: "amd_sev_snp_valid"
    message: "amd_sev_snp must be 'enabled' or 'disabled' when set"
    expression: "this.amd_sev_snp == '' || this.amd_sev_snp in ['enabled', 'disabled']"
  };
}

// AwsLaunchTemplateSpotOptions turns every launch from this template into a
// Spot request. Leave the whole block unset for On-Demand (or blend the two
// in an ASG mixed-instances policy, which is usually the better home for
// the Spot decision).
message AwsLaunchTemplateSpotOptions {
  // Maximum price per instance-hour, as a decimal string (e.g. "0.05").
  // AWS default: the On-Demand price -- and leaving it unset is the AWS
  // recommendation, since Spot's discount comes from interruption risk,
  // not bidding.
  string max_price = 1;

  // Spot request type: "one-time" (the default for templates consumed by
  // auto-scaling -- the ASG replaces interrupted capacity itself) or
  // "persistent" (EC2 re-requests the instance after interruption;
  // standalone instances only).
  string spot_instance_type = 2;

  // What happens to the instance on interruption: "terminate" (default),
  // "stop", or "hibernate". "stop"/"hibernate" require a persistent
  // request.
  string instance_interruption_behavior = 3;

  // Expiry of a persistent request, RFC3339 (e.g. "2027-01-01T00:00:00Z").
  // Only valid when spot_instance_type is "persistent".
  string valid_until = 4;

  // ---------------------------------------------------------------------------
  // Spot options CEL validations
  // ---------------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "spot_instance_type_valid"
    message: "spot_instance_type must be 'one-time' or 'persistent' when set"
    expression: "this.spot_instance_type == '' || this.spot_instance_type in ['one-time', 'persistent']"
  };

  option (buf.validate.message).cel = {
    id: "interruption_behavior_valid"
    message: "instance_interruption_behavior must be 'terminate', 'stop', or 'hibernate' when set"
    expression: "this.instance_interruption_behavior == '' || this.instance_interruption_behavior in ['terminate', 'stop', 'hibernate']"
  };

  option (buf.validate.message).cel = {
    id: "stop_hibernate_require_persistent"
    message: "instance_interruption_behavior 'stop' or 'hibernate' requires spot_instance_type 'persistent'"
    expression: "!(this.instance_interruption_behavior in ['stop', 'hibernate']) || this.spot_instance_type == 'persistent'"
  };

  option (buf.validate.message).cel = {
    id: "valid_until_requires_persistent"
    message: "valid_until only applies when spot_instance_type is 'persistent'"
    expression: "this.valid_until == '' || this.spot_instance_type == 'persistent'"
  };
}

// AwsLaunchTemplatePrivateDnsNameOptions controls the guest's private DNS
// hostname shape and records.
message AwsLaunchTemplatePrivateDnsNameOptions {
  // Hostname scheme: "ip-name" (ip-10-0-1-5.ec2.internal, the classic
  // default) or "resource-name" (i-0123....ec2.internal -- stable across
  // IP changes, required for IPv6-only subnets).
  string hostname_type = 1;

  // Publish an A record (IPv4) for the hostname.
  bool enable_resource_name_dns_a_record = 2;

  // Publish an AAAA record (IPv6) for the hostname.
  bool enable_resource_name_dns_aaaa_record = 3;

  option (buf.validate.message).cel = {
    id: "hostname_type_valid"
    message: "hostname_type must be 'ip-name' or 'resource-name' when set"
    expression: "this.hostname_type == '' || this.hostname_type in ['ip-name', 'resource-name']"
  };
}
