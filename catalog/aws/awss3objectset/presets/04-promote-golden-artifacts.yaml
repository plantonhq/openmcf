apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3ObjectSet
metadata:
  name: my-promoted-artifacts
spec:
  region: <aws-region>
  bucket:
    value: "<destination-bucket-name>"
  objects:
    # Server-side copy: the artifact never travels through the deploy host,
    # so size is unconstrained. The ETag precondition fails the deploy if the
    # source changed since the release was cut.
    - key: releases/app/current/app.zip
      copyFrom:
        sourceBucket:
          value: "<golden-artifacts-bucket-name>"
        sourceKey: <source-artifact-key>
        copyIfMatch: <source-artifact-etag>
      tags:
        purpose: release-artifact
    # A copy that stamps its own headers/metadata onto the destination
    # instead of preserving the source's (replaceMetadata).
    - key: releases/app/current/manifest.json
      copyFrom:
        sourceBucket:
          value: "<golden-artifacts-bucket-name>"
        sourceKey: <source-manifest-key>
        replaceMetadata: true
      contentType: application/json
      cacheControl: no-cache
      metadata:
        promoted-by: planton
