apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3ObjectSet
metadata:
  name: my-compliance-artifacts
spec:
  region: <aws-region>
  bucket:
    value: "<object-lock-enabled-bucket-name>"
  objects:
    - key: audits/<report-name>.json
      content: |
        {
          "report": "<report-name>",
          "finding": "none"
        }
      contentType: application/json
      serverSideEncryption: aws:kms
      kmsKey:
        valueFrom:
          kind: AwsKmsKey
          name: <kms-key-resource-name>
          fieldPath: status.outputs.key_arn
      bucketKeyEnabled: true
      checksumAlgorithm: SHA256
      objectLockMode: COMPLIANCE
      # Replace with your retention deadline (RFC 3339).
      objectLockRetainUntilDate: "2033-01-01T00:00:00Z"
