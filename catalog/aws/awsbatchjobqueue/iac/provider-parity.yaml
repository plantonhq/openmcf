# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_batch_job_queue:
    mappings:
      # The spec names the field for what it references (an
      # AwsBatchSchedulingPolicy, chart-wired via StringValueOrRef); the
      # provider carries the ARN-suffixed API name. AWS quirk on the field
      # comment: once set, a queue's policy can be replaced but never
      # removed.
      - spec: spec.scheduling_policy
        arg: scheduling_policy_arn
      # The spec pluralizes the repeated entries.
      - spec: spec.job_state_time_limit_actions.action
        arg: job_state_time_limit_action.action
      - spec: spec.job_state_time_limit_actions.max_time_seconds
        arg: job_state_time_limit_action.max_time_seconds
      - spec: spec.job_state_time_limit_actions.reason
        arg: job_state_time_limit_action.reason
      - spec: spec.job_state_time_limit_actions.state
        arg: job_state_time_limit_action.state
    exclusions:
      # Identity is the kind's own contract.
      - arg: name
        reason: derived from metadata.name -- never free-form user surface
      # Tag machinery.
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
