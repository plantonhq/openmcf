apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsiamrole
spec:
  # An IAM role under live E2E: the harness runs deploy -> GetRole verify ->
  # destroy -> verify-destroyed on both provisioners against the AWS test
  # account via keyless SSO/OIDC credentials. The minimal scenario attaches an
  # AWS-managed policy by literal ARN and an inline policy, exercising the
  # attachment reconciliation on both engines; the oidc-trust scenario
  # deploys a path-form OIDC provider fixture and proves the typed
  # federated-trust composition (both statement forms + the default
  # audience). IAM is global and free.
  #
  # PENDING PROOF (2026-08-12, depth closure): the Pulumi module's sends
  # changed -- force_detach_policies is now state-pinned (always sent, the
  # Terraform parity), managed-policy attachments are keyed by policy ARN
  # instead of list index, and the tag map gained the Name key -- and the
  # oidc_trust arm has never run live. The prior green predates these
  # sends -- demoted per the badge-honesty rule.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 10
