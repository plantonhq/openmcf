# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The role resource's deprecated in-resource variants (inline_policy,
# managed_policy_arns) are outside accounting mechanically (schema-flagged
# deprecated); the modules deliberately use the standalone per-policy
# resources instead.

resources:
  aws_iam_role:
    mappings:
      # The spec's trust oneof: the free-form arm carries the document
      # directly; the typed oidc_trust arm composes the same
      # assume_role_policy JSON from the provider's outputs (see
      # specExclusions below).
      - spec: spec.trust_policy
        arg: assume_role_policy
    exclusions:
      - arg: name
        reason: wired by the module from metadata.name -- the platform names resources through metadata, never a spec field
      - arg: name_prefix
        reason: covered alternative -- metadata.name provides deterministic naming; provider-generated name suffixes have no place in a declarative catalog
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  aws_iam_role_policy:
    # One inline policy per spec.inline_policies entry (map key names the
    # policy, map value is the document).
    specRoot: spec.inline_policies
    mappings:
      - spec: spec.inline_policies
        arg: policy
    exclusions:
      - arg: name
        reason: wired by the module from the inline_policies map key -- the map shape names each policy
      - arg: name_prefix
        reason: covered alternative -- inline_policies map keys provide deterministic naming; provider-generated name suffixes have no place in a declarative catalog
      - arg: role
        reason: wired by the module to the role it creates -- never user surface

  aws_iam_role_policy_attachment:
    # One attachment per spec.managed_policy_arns entry -- attachments
    # reconcile individually without touching the role.
    specRoot: spec.managed_policy_arns
    mappings:
      - spec: spec.managed_policy_arns
        arg: policy_arn
    exclusions:
      - arg: role
        reason: wired by the module to the role it creates -- never user surface

specExclusions:
  # IAM is a GLOBAL service: none of the three IAM resources carries a region
  # argument. The spec's region drives only the provider connection.
  - field: spec.region
    reason: provider-connection region only -- IAM is global and none of the consumed resources has a region argument
  # The typed federated-trust arm: the modules compose these five leaves into
  # the same assume_role_policy document the free-form arm carries directly
  # (sts:AssumeRoleWithWebIdentity statements against the referenced OIDC
  # provider). One provider argument, two spec homes.
  - field: spec.oidc_trust.provider_arn
    reason: composes the assume_role_policy document (the Federated principal) -- the typed alternative to the free-form trust_policy arm
  - field: spec.oidc_trust.provider_url
    reason: composes the assume_role_policy document (the sub/aud condition-key prefix)
  - field: spec.oidc_trust.subjects
    reason: composes the assume_role_policy document (StringEquals sub conditions)
  - field: spec.oidc_trust.wildcard_subjects
    reason: composes the assume_role_policy document (StringLike sub conditions, a separate statement)
  - field: spec.oidc_trust.audiences
    reason: composes the assume_role_policy document (StringEquals aud conditions; defaults to sts.amazonaws.com)
