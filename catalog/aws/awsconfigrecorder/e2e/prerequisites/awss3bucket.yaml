# Consumer-scoped AwsS3Bucket install profile for the recorder's
# delivery channel: the history bucket with the AWS Config
# service-principal policy the channel validates at create
# (GetBucketAcl on the bucket, PutObject under AWSLogs/) -- without
# it, PutDeliveryChannel fails with "insufficient delivery policy".
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  name: planton-oss-e2e-awscfgr-history
  id: planton-oss-e2e-awscfgr-history
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awss3bucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: AWSConfigBucketPermissionsCheck
        Effect: Allow
        Principal:
          Service: config.amazonaws.com
        Action: s3:GetBucketAcl
        Resource: arn:aws:s3:::planton-oss-e2e-awscfgr-history
      - Sid: AWSConfigBucketDelivery
        Effect: Allow
        Principal:
          Service: config.amazonaws.com
        Action: s3:PutObject
        Resource: arn:aws:s3:::planton-oss-e2e-awscfgr-history/*
        Condition:
          StringEquals:
            s3:x-amz-acl: bucket-owner-full-control
