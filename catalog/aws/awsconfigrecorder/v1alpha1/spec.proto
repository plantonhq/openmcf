syntax = "proto3";

package dev.planton.aws.awsconfigrecorder.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsConfigRecorderSpec defines the desired AWS Config recording
// posture for one region: the configuration recorder, its S3/SNS
// delivery channel, and the retention window for recorded
// configuration items.
//
// This is a REGION SINGLETON: AWS allows exactly one configuration
// recorder and one delivery channel per region, and both are named
// "default" by AWS convention - the names are not an identity you
// choose, so metadata.name never reaches AWS. Deploy at most one
// instance per region; two instances targeting the same region fight
// over the same recorder.
//
// The recorder needs an IAM role that trusts "config.amazonaws.com"
// (the AWS-managed policy AWS_ConfigRole is the canonical grant), and
// the delivery bucket needs a bucket POLICY granting the Config
// service principal s3:PutObject and s3:GetBucketAcl - AWS rejects
// the channel without it ("insufficient delivery policy").
//
// Destroying this component is a REAL delete: the recorder is
// stopped, then recorder, channel, and retention configuration are
// removed (already-recorded configuration items stay queryable until
// their retention lapses). Teardown ordering matters - AWS refuses to
// delete a delivery channel while its recorder is running - and both
// engines' modules stop the recorder first.
message AwsConfigRecorderSpec {
  // The AWS region whose Config recording this instance manages. The
  // region IS the resource identity - one instance per region.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The IAM role AWS Config assumes to read resource configurations
  // and write to the delivery channel. Must trust
  // "config.amazonaws.com"; AWS_ConfigRole is the canonical managed
  // policy, plus write access to the delivery bucket.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Whether the recorder is RUNNING after apply. Unset = recording on
  // (the reason this component exists). Set false to keep the
  // recorder configured but stopped (e.g. pausing per-item recording
  // costs during a migration) - stopping does not lose already
  // recorded history.
  optional bool recording_enabled = 3;

  // What the recorder records. Unset = record every supported
  // resource type including global ones (the AWS default posture).
  AwsConfigRecorderRecordingGroup recording_group = 4;

  // How often the recorder records: continuous change-driven items or
  // daily snapshots (a cost lever), with per-type overrides.
  AwsConfigRecorderRecordingMode recording_mode = 5;

  // Where recorded configuration items are delivered. REQUIRED while
  // the recorder runs - AWS refuses to start a recorder without a
  // delivery channel.
  AwsConfigRecorderDeliveryChannel delivery_channel = 6;

  // How many days AWS Config keeps recorded configuration items
  // (30-2557). Unset = the AWS default (2557 days / 7 years) and the
  // retention configuration object is not managed.
  int32 retention_period_in_days = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 30
      lte: 2557
    }
  ];

  // A running recorder needs somewhere to deliver.
  option (buf.validate.message).cel = {
    id: "running_recorder_needs_channel"
    message: "delivery_channel is required unless recording_enabled is explicitly false - AWS refuses to start a recorder without one"
    expression: "(has(this.recording_enabled) && !this.recording_enabled) || has(this.delivery_channel)"
  };
}

// AwsConfigRecorderRecordingGroup scopes WHAT the recorder records.
// AWS accepts exactly one strategy; the three shapes below mirror the
// provider's own create-time rules.
message AwsConfigRecorderRecordingGroup {
  // Record ALL supported resource types (the default posture). Unset =
  // enabled. Must be explicitly false to use resource_types or
  // exclusion_by_resource_types.
  optional bool all_supported = 1;

  // Also record global resource types (IAM users, roles, policies).
  // Record them in exactly ONE region - global resources recorded in
  // every region multiply configuration items and cost.
  optional bool include_global_resource_types = 2;

  // Record ONLY these resource types (e.g. "AWS::EC2::Instance",
  // "AWS::S3::Bucket"). Requires all_supported = false and the
  // INCLUSION_BY_RESOURCE_TYPES strategy.
  repeated string resource_types = 3 [(buf.validate.field).repeated.unique = true];

  // Record everything EXCEPT these resource types. Requires
  // all_supported = false, the EXCLUSION_BY_RESOURCE_TYPES strategy,
  // and an empty resource_types.
  repeated string exclusion_by_resource_types = 4 [(buf.validate.field).repeated.unique = true];

  // The recording strategy AWS should apply. Unset = AWS derives it
  // (ALL_SUPPORTED_RESOURCE_TYPES when all_supported is on).
  string recording_strategy = 5 [(buf.validate.field).string = {
    in: [
      "",
      "ALL_SUPPORTED_RESOURCE_TYPES",
      "INCLUSION_BY_RESOURCE_TYPES",
      "EXCLUSION_BY_RESOURCE_TYPES"
    ]
  }];

  // The provider rejects these shapes at plan time; failing in the
  // manifest is earlier still. The three rules mirror the provider's
  // create-time CustomizeDiff exactly.
  option (buf.validate.message).cel = {
    id: "all_supported_strategy"
    message: "recording_strategy ALL_SUPPORTED_RESOURCE_TYPES requires all_supported (and vice versa when a strategy is set)"
    expression: "this.recording_strategy != 'ALL_SUPPORTED_RESOURCE_TYPES' || (!has(this.all_supported) || this.all_supported)"
  };
  option (buf.validate.message).cel = {
    id: "exclusion_shape"
    message: "exclusion_by_resource_types requires all_supported = false, an empty resource_types, and the EXCLUSION_BY_RESOURCE_TYPES strategy"
    expression: "size(this.exclusion_by_resource_types) == 0 || (has(this.all_supported) && !this.all_supported && size(this.resource_types) == 0 && (this.recording_strategy == '' || this.recording_strategy == 'EXCLUSION_BY_RESOURCE_TYPES'))"
  };
  option (buf.validate.message).cel = {
    id: "inclusion_shape"
    message: "resource_types requires all_supported = false, an empty exclusion list, and the INCLUSION_BY_RESOURCE_TYPES strategy"
    expression: "size(this.resource_types) == 0 || (has(this.all_supported) && !this.all_supported && size(this.exclusion_by_resource_types) == 0 && (this.recording_strategy == '' || this.recording_strategy == 'INCLUSION_BY_RESOURCE_TYPES'))"
  };
}

// AwsConfigRecorderRecordingMode sets HOW OFTEN configuration changes
// are recorded - continuous (every change becomes an item) or daily
// (one snapshot per day when changes occurred), with per-type
// overrides.
message AwsConfigRecorderRecordingMode {
  // The default frequency for every recorded type. Unset =
  // CONTINUOUS.
  string recording_frequency = 1 [(buf.validate.field).string = {
    in: [
      "",
      "CONTINUOUS",
      "DAILY"
    ]
  }];

  // One override for specific resource types (AWS accepts at most
  // one override block).
  AwsConfigRecorderRecordingModeOverride override = 2;
}

// AwsConfigRecorderRecordingModeOverride pins a different frequency
// for specific resource types.
message AwsConfigRecorderRecordingModeOverride {
  // Why this override exists (shown in the AWS console).
  string description = 1;

  // The frequency for the listed types.
  string recording_frequency = 2 [(buf.validate.field).string = {
    in: [
      "CONTINUOUS",
      "DAILY"
    ]
  }];

  // The resource types this override applies to.
  repeated string resource_types = 3 [(buf.validate.field).repeated.min_items = 1];
}

// AwsConfigRecorderDeliveryChannel is where recorded configuration
// items and snapshots are delivered. One per region, named "default"
// by AWS convention.
message AwsConfigRecorderDeliveryChannel {
  // The S3 bucket that receives configuration history and snapshot
  // files. Needs the Config service-principal bucket policy (see the
  // spec comment).
  dev.planton.shared.foreignkey.v1.StringValueOrRef s3_bucket_name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsS3Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // Key prefix for delivered files inside the bucket.
  string s3_key_prefix = 2;

  // KMS key that encrypts delivered files (the key policy must let
  // AWS Config use it). Unset = SSE-S3.
  dev.planton.shared.foreignkey.v1.StringValueOrRef s3_kms_key_arn = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // SNS topic notified when configuration history files are
  // delivered. Unset = no notifications.
  dev.planton.shared.foreignkey.v1.StringValueOrRef sns_topic_arn = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSnsTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_arn"
  ];

  // How often AWS Config delivers a full configuration SNAPSHOT (the
  // per-change history files deliver continuously regardless). Unset =
  // the AWS default.
  string snapshot_delivery_frequency = 5 [(buf.validate.field).string = {
    in: [
      "",
      "One_Hour",
      "Three_Hours",
      "Six_Hours",
      "Twelve_Hours",
      "TwentyFour_Hours"
    ]
  }];
}
