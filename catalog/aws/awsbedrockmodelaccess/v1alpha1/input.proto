syntax = "proto3";

package dev.planton.aws.awsbedrockmodelaccess.v1alpha1;

import "catalog/aws/awsbedrockmodelaccess/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockModelAccessStackInput is the input for the IaC modules that
// deploy the Bedrock model access.
message AwsBedrockModelAccessStackInput {
  // target is the AwsBedrockModelAccess resource to deploy.
  AwsBedrockModelAccess target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
