# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_bedrock_foundation_model_agreement:
    exclusions:
      - arg: offer_token
        reason: derived by the module at deploy time from the model's public offer (ListFoundationModelAgreementOffers) -- offer tokens are short-lived credentials a manifest cannot carry honestly

  aws_bedrock_use_case_for_model_access:
    mappings:
      # The provider takes the form as a JSON string; the spec models it as
      # a typed Struct the modules jsonencode.
      - arg: form_data
        spec: spec.use_case_form
