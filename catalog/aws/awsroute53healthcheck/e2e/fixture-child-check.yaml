# Child-check fixture for the calculated-aggregate scenario: a DISABLED TCP
# check against a documentation address, deployed as an EXTRA INSTANCE of
# this same kind via the scenario's path-form e2e-prerequisites annotation
# (the kind-name form is reserved for OTHER kinds' install profiles).
# Disabled means the checker fleet never probes the placeholder — AWS stores
# the configuration, which is all the parent CALCULATED check aggregates.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53HealthCheck
metadata:
  name: planton-oss-e2e-awsroute53healthcheck-child
  id: planton-oss-e2e-awsroute53healthcheck-child
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsroute53healthcheck
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  checkType: TCP
  ipAddress: 192.0.2.1
  port: 443
  disabled: true
