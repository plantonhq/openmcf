# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_bedrockagentcore_browser:
    specRoot: spec.browsers
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The provider's block-per-concern wrappers; the spec names the
      # concepts directly.
      - arg: browser_signing
        spec: spec.browsers.signing_enabled
      - arg: browser_signing.enabled
        spec: spec.browsers.signing_enabled
      - arg: network_configuration
        spec: spec.browsers.network
      - arg: network_configuration.network_mode
        spec: spec.browsers.network.mode
      - arg: network_configuration.vpc_config
        spec: spec.browsers.network.vpc_config
      # Repeated singular blocks pluralize in the spec; the certificate's
      # single-member location wrapper flattens to the secret ARN leaf.
      - arg: certificate
        spec: spec.browsers.certificates
      - arg: certificate.location
        spec: spec.browsers.certificates.secret_arn
      - arg: certificate.location.secrets_manager
        spec: spec.browsers.certificates.secret_arn
      - arg: certificate.location.secrets_manager.secret_arn
        spec: spec.browsers.certificates.secret_arn
      - arg: enterprise_policy
        spec: spec.browsers.enterprise_policies
      - arg: enterprise_policy.location
        spec: spec.browsers.enterprise_policies.s3
      - arg: enterprise_policy.location.s3
        spec: spec.browsers.enterprise_policies.s3
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface

  aws_bedrockagentcore_browser_profile:
    specRoot: spec.browser_profiles
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface

  aws_bedrockagentcore_code_interpreter:
    specRoot: spec.code_interpreters
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      - arg: network_configuration
        spec: spec.code_interpreters.network
      - arg: network_configuration.network_mode
        spec: spec.code_interpreters.network.mode
      - arg: network_configuration.vpc_config
        spec: spec.code_interpreters.network.vpc_config
      - arg: certificate
        spec: spec.code_interpreters.certificates
      - arg: certificate.location
        spec: spec.code_interpreters.certificates.secret_arn
      - arg: certificate.location.secrets_manager
        spec: spec.code_interpreters.certificates.secret_arn
      - arg: certificate.location.secrets_manager.secret_arn
        spec: spec.code_interpreters.certificates.secret_arn
    exclusions:
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
