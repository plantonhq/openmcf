syntax = "proto3";

package dev.planton.alicloud.alicloudcdndomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/alicloudcdndomain/v1alpha1/outputs.proto";
import "catalog/alicloud/alicloudcdndomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// alicloud-cdn-domain
message AliCloudCdnDomain {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudCdnDomain'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudCdnDomainSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudCdnDomainStatus status = 5;
}

// alicloud-cdn-domain status
message AliCloudCdnDomainStatus {
  // stack-outputs
  AliCloudCdnDomainStackOutputs outputs = 1;
}
