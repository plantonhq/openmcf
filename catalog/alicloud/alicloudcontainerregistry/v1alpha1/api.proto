syntax = "proto3";

package dev.planton.alicloud.alicloudcontainerregistry.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/alicloudcontainerregistry/v1alpha1/outputs.proto";
import "catalog/alicloud/alicloudcontainerregistry/v1alpha1/spec.proto";
import "shared/metadata.proto";

// alicloud-container-registry
message AliCloudContainerRegistry {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudContainerRegistry'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudContainerRegistrySpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudContainerRegistryStatus status = 5;
}

// alicloud-container-registry status
message AliCloudContainerRegistryStatus {
  // stack-outputs
  AliCloudContainerRegistryStackOutputs outputs = 1;
}
