syntax = "proto3";

package dev.planton.alicloud.alicloudsaeapplication.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/alicloudsaeapplication/v1alpha1/spec.proto";
import "catalog/alicloud/alicloudsaeapplication/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// alicloud-sae-application
message AliCloudSaeApplication {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudSaeApplication'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudSaeApplicationSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudSaeApplicationStatus status = 5;
}

// alicloud-sae-application status
message AliCloudSaeApplicationStatus {
  // stack-outputs
  AliCloudSaeApplicationStackOutputs outputs = 1;
}
