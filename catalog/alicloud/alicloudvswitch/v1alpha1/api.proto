syntax = "proto3";

package dev.planton.alicloud.alicloudvswitch.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/alicloudvswitch/v1alpha1/outputs.proto";
import "catalog/alicloud/alicloudvswitch/v1alpha1/spec.proto";
import "shared/metadata.proto";

// alicloud-vswitch
message AliCloudVswitch {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudVswitch'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudVswitchSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudVswitchStatus status = 5;
}

// alicloud-vswitch status
message AliCloudVswitchStatus {
  // stack-outputs
  AliCloudVswitchStackOutputs outputs = 1;
}
