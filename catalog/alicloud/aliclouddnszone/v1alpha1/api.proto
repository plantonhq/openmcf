syntax = "proto3";

package dev.planton.alicloud.aliclouddnszone.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/aliclouddnszone/v1alpha1/outputs.proto";
import "catalog/alicloud/aliclouddnszone/v1alpha1/spec.proto";
import "shared/metadata.proto";

// alicloud-dns-zone
message AliCloudDnsZone {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudDnsZone'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudDnsZoneSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudDnsZoneStatus status = 5;
}

// alicloud-dns-zone status
message AliCloudDnsZoneStatus {
  // stack-outputs
  AliCloudDnsZoneStackOutputs outputs = 1;
}
