syntax = "proto3";

package dev.planton.alicloud.alicloudramrole.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/alicloudramrole/v1alpha1/outputs.proto";
import "catalog/alicloud/alicloudramrole/v1alpha1/spec.proto";
import "shared/metadata.proto";

// alicloud-ram-role
message AliCloudRamRole {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudRamRole'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudRamRoleSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudRamRoleStatus status = 5;
}

// alicloud-ram-role status
message AliCloudRamRoleStatus {
  // stack-outputs
  AliCloudRamRoleStackOutputs outputs = 1;
}
