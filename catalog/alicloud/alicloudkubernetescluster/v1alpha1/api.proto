syntax = "proto3";

package dev.planton.alicloud.alicloudkubernetescluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/alicloud/alicloudkubernetescluster/v1alpha1/outputs.proto";
import "catalog/alicloud/alicloudkubernetescluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// alicloud-kubernetes-cluster
message AliCloudKubernetesCluster {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudKubernetesCluster'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudKubernetesClusterSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudKubernetesClusterStatus status = 5;
}

// alicloud-kubernetes-cluster status
message AliCloudKubernetesClusterStatus {
  // stack-outputs
  AliCloudKubernetesClusterStackOutputs outputs = 1;
}
