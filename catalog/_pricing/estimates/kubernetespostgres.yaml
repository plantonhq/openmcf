# Per-preset monthly cost estimates. This component is cluster-capacity
# based -- it creates no cloud SKU, so each preset states the capacity it
# reserves from the target cluster instead of a dollar figure: pricing that
# capacity honestly requires the cluster's own node and storage economics,
# which this catalog cannot know. Schema: finops/componentcostestimate/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimate
metadata:
  name: kubernetespostgres
spec:
  presets:
    - preset: 01-dev-single-instance
      capacity_footprint:
        cpu_requests: 100m
        memory_requests: 256Mi
        cpu_limits: 500m
        memory_limits: 512Mi
        persistent_storage: 5Gi
        basis: 1 instance x (100m CPU / 256Mi memory requests, 500m / 512Mi limits) + 1 x 5Gi data volume
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
    - preset: 02-production-ha
      capacity_footprint:
        cpu_requests: "3"
        memory_requests: 6Gi
        cpu_limits: "6"
        memory_limits: 12Gi
        persistent_storage: 360Gi
        basis: 3 instances x (1 CPU / 2Gi memory requests, 2 CPU / 4Gi limits) + 3 x (100Gi data + 20Gi WAL) volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - S3 object storage for the daily backups and WAL archive (30-day retention) grows with database churn
    - preset: 03-s3-compatible-backups
      capacity_footprint:
        cpu_requests: 1500m
        memory_requests: 3Gi
        cpu_limits: "6"
        memory_limits: 6Gi
        persistent_storage: 150Gi
        basis: 3 instances x (500m CPU / 1Gi memory requests, 2 CPU / 2Gi limits) + 3 x 50Gi data volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - object storage on the S3-compatible endpoint (MinIO) for daily backups and WAL archive (30-day retention)
