# The DigitalOcean price book: every DigitalOcean unit price the catalog's
# cost estimates cite, pinned with source URL and retrieval date. Entries
# are referenced by slug from the estimate models under ../models/ and
# selected by value-keyed attribute identity from the cost derivations
# under ../derivations/. DigitalOcean publishes no machine-readable price
# API, so every entry here is hand-pinned from DigitalOcean's own
# published pricing pages and carries NO fetcher selector -- the fetcher
# leaves selectorless entries untouched by design, and refreshing this
# book means re-reading the cited pages and updating retrieved_on.
# DigitalOcean prices identically in every region (its pricing pages
# carry no region dimension), so entries pin region "global".
# Schema: finops/pricebook/v1.
apiVersion: finops.planton.dev/v1
kind: PriceBook
metadata:
  name: digitalocean
spec:
  entries:
    - name: do-droplet-s-1vcpu-1gb-monthly
      service_name: Droplets
      pricing_unit: months
      region: global
      currency: USD
      list_unit_price: "6.00"
      price_source: https://www.digitalocean.com/pricing/droplets
      retrieved_on: "2026-08-22"
      attributes:
        size_slug: s-1vcpu-1gb
