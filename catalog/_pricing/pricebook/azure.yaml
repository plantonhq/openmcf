# The Azure price book: every Azure unit price the catalog's cost
# estimates cite, pinned with source URL and retrieval date. Entries are
# referenced by slug from the estimate models under ../models/ and
# selected by value-keyed attribute identity from the cost derivations
# under ../derivations/. Entries with an azure_selector are
# machine-refreshed from the Microsoft Retail Prices API by the price-book
# fetcher (make generate-price-book); their sources are version-pinned
# filter URLs that can be fetched again. Entries without a selector are
# refreshed by hand. Schema: finops/pricebook/v1.
