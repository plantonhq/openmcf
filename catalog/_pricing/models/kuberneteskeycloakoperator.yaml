# Estimate model: hand-computed capacity footprints for this
# cluster-capacity component's presets. A derivation cannot state this
# kind honestly: the spec DECLARES default operator resources (the
# default_container_resources annotation carries upstream's own values
# -- requests 300m CPU / 450Mi memory, limits 700m CPU / 450Mi), applied
# whenever a manifest omits resources, and the derivation grammar reads
# only explicit manifest values -- a derivation would show a zero
# footprint for the shipped preset while the operator pod actually
# reserves the declared defaults. The preset's totals are therefore
# computed by hand: the single operator pod's declared resources, or
# the spec defaults when omitted. The operator binds no persistent
# volumes; the Keycloak servers it reconciles reserve their own
# capacity on their KubernetesKeycloak resources. Cluster-capacity
# components carry no priced lines -- the dollar value of the
# reservation is the target cluster's node economics, which this
# catalog cannot know.
# Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: kuberneteskeycloakoperator
spec:
  presets:
    - preset: 01-operator
      capacity_footprint:
        cpu_requests: 300m
        memory_requests: 450Mi
        cpu_limits: 700m
        memory_limits: 450Mi
        basis: 1 operator pod x (300m CPU / 450Mi memory requests, 700m CPU / 450Mi limits) from the spec-declared defaults (upstream's own values, applied when the manifest omits resources) -- no persistent volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - "the Keycloak servers this operator reconciles reserve their own capacity -- each rides its KubernetesKeycloak resource"
