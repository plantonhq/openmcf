# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: awsalb
spec:
  presets:
    - preset: 01-internet-facing
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: Application Load Balancer hours
          price: alb-hours-us-east-1
          pricing_quantity: "730"
          quantity_basis: one load balancer, billed every hour of the month
        - sku_meter: public IPv4 address usage
          price: public-ipv4-in-use-us-east-1
          pricing_quantity: "1460"
          quantity_basis: internet-facing with two subnets -- one public IPv4 node per Availability Zone, 2 addresses x 730 hours
      exclusions:
        - LCU usage (new connections, active connections, processed bytes, rule evaluations) is traffic-dependent
        - data transfer out to the internet
    - preset: 02-internal-hardened
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: Application Load Balancer hours
          price: alb-hours-us-east-1
          pricing_quantity: "730"
          quantity_basis: one load balancer, billed every hour of the month
      exclusions:
        - LCU usage is traffic-dependent
        - access-log bytes bill to the destination S3 bucket, not the load balancer
      notes: Internal scheme holds no public IPv4 addresses, removing that charge entirely.
    - preset: 03-reserved-capacity
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: reserved Load Balancer Capacity Units
          price: alb-reserved-lcu-us-east-1
          pricing_quantity: "365000"
          quantity_basis: minimum_load_balancer_capacity_units reserves 500 LCUs every hour, 500 x 730 hours
        - sku_meter: Application Load Balancer hours
          price: alb-hours-us-east-1
          pricing_quantity: "730"
          quantity_basis: one load balancer, billed every hour of the month
        - sku_meter: public IPv4 address usage
          price: public-ipv4-in-use-us-east-1
          pricing_quantity: "1460"
          quantity_basis: internet-facing with two subnets -- one public IPv4 node per Availability Zone, 2 addresses x 730 hours
      exclusions:
        - LCU usage beyond the 500 reserved LCUs is traffic-dependent
        - data transfer out to the internet
      notes: The reservation is priced as a steady month-long hold; it exists for surge windows and should be removed after them, so real spend depends on how long the reservation stays set.
