# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: awsvpc
spec:
  presets:
    - preset: 01-production-dual-stack
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the VPC, its Amazon-provided IPv6 block, and its DNS attributes bill nothing at any scale
        - the network's real spend lives in separate components deployed into it -- NAT gateways, VPC endpoints, public IPv4 addresses, load balancers
      notes: A VPC is free AWS infrastructure -- the estimate is zero by the provider's pricing, not by omission.
    - preset: 02-development
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the VPC and its DNS attributes bill nothing at any scale
        - the network's real spend lives in separate components deployed into it -- NAT gateways, VPC endpoints, public IPv4 addresses, load balancers
      notes: A VPC is free AWS infrastructure -- the estimate is zero by the provider's pricing, not by omission.
    - preset: 03-ipam-grown-network
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - IPAM-sourced CIDRs (the primary /16, secondary /20, and IPv6 /56) bill per active IP under the account's IPAM Advanced tier -- the cost follows the account's IPAM footprint, not this manifest
        - VPC Encryption Control in enforce mode is free
        - the network's real spend lives in separate components deployed into it
      notes: The VPC itself remains free; this preset's only money lever is that its address space is IPAM-governed, and IPAM bills on the account operating it.
