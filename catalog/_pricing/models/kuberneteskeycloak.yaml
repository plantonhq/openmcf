# Estimate model: hand-computed capacity footprints for this
# cluster-capacity component's presets. A derivation cannot state this
# kind honestly: the spec's resources field carries spec-declared
# defaults (250m CPU / 768Mi requests, 1 CPU / 1Gi limits) that the
# module applies when a manifest omits resources, and the derivation
# grammar reads only explicit manifest values -- a derivation would show
# a zero footprint for the omitting preset while the pods actually
# reserve the defaults. Each preset's totals are therefore computed by
# hand: instances x (declared resources, or the spec-declared defaults
# when omitted). Keycloak binds no persistent volumes -- all state lives
# in the external database. Cluster-capacity components carry no priced
# lines -- the dollar value of the reservation is the target cluster's
# node economics, which this catalog cannot know.
# Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: kuberneteskeycloak
spec:
  presets:
    - preset: 01-standard
      capacity_footprint:
        cpu_requests: 500m
        memory_requests: 1536Mi
        cpu_limits: "2"
        memory_limits: 3Gi
        basis: 2 instances x (250m CPU / 768Mi memory requests, 1 CPU / 1536Mi limits) -- no persistent volumes; state lives in the referenced postgres database
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - "the postgres database holding every realm and user carries its own footprint on its KubernetesPostgres resource"
        - the Keycloak Operator reconciling this resource carries its own footprint on KubernetesKeycloakOperator
    - preset: 02-dev-sandbox
      capacity_footprint:
        cpu_requests: 250m
        memory_requests: 768Mi
        cpu_limits: 1000m
        memory_limits: 1Gi
        basis: 1 instance x (250m CPU / 768Mi memory requests, 1000m CPU / 1Gi limits) from the spec-declared defaults (the platform applies them when the manifest omits resources) -- no persistent volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - "the dev-mem sandbox database lives in the pod's own memory -- no storage is reserved and every realm and user is lost on restart"
        - the Keycloak Operator reconciling this resource carries its own footprint on KubernetesKeycloakOperator
