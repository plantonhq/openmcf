# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The 03-launch-template preset is deliberately unmodeled:
# its instance type and disk -- and therefore its rate -- are delegated to
# the referenced AwsLaunchTemplate and invisible in this manifest, so an
# estimate here would be a guess wearing a dollar sign and the preset
# renders no price. Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: awseksnodegroup
spec:
  presets:
    - preset: 01-on-demand-general
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: node instance hours
          price: ec2-m6i-large-us-east-1
          pricing_quantity: "1460"
          quantity_basis: the scaling floor (min_size 2) of m6i.large On-Demand nodes x 730 hours -- the committed always-on capacity
        - sku_meter: node root volumes
          price: ebs-gp3-storage-us-east-1
          pricing_quantity: "200"
          quantity_basis: 2 floor nodes x 100 GiB root volumes (disk_size_gb 100)
      exclusions:
        - autoscaled nodes above the floor are workload-dependent (max_size 5 raises the instance ceiling to about $350 per month)
        - data transfer between AZs and out of the region follows pod traffic
        - the cluster management fee bills on the AwsEksCluster component
      notes: Estimated at the autoscaling floor -- the committed always-on spend.
    - preset: 02-spot-cost-optimized
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - min_size 0 makes this pool scale-to-zero -- no capacity is committed, so the committed estimate is genuinely zero
        - running nodes bill the fluctuating Spot market rate, typically 60-90% below On-Demand and never above it; at the desired start of 3 nodes the On-Demand ceiling is about $210 per month for instances plus $24 for root volumes
        - Spot interruptions can reclaim nodes with two minutes' notice -- the discount's price
      notes: Spot has no committed list price -- the market sets the hourly rate under the published On-Demand ceiling, which is why this estimate carries no priced lines.
    - preset: 04-warm-pool
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: node instance hours
          price: ec2-m6i-xlarge-us-east-1
          pricing_quantity: "1460"
          quantity_basis: the scaling floor (min_size 2) of m6i.xlarge On-Demand nodes x 730 hours
        - sku_meter: node root volumes
          price: ebs-gp3-storage-us-east-1
          pricing_quantity: "400"
          quantity_basis: 2 floor nodes plus 2 STOPPED warm-pool instances (warm_pool_config min_size 2), each holding a 100 GiB root volume -- stopped instances bill only their EBS
      exclusions:
        - autoscaled nodes above the floor are workload-dependent (max_size 10; desired starts at 3, one node above this floor estimate)
        - a RUNNING pool_state would bill the pooled instances at full price for instant scale-out
        - data transfer and the cluster management fee bill elsewhere
      notes: Estimated at the autoscaling floor; the warm pool's stopped instances add storage cost only, buying pre-initialized scale-out.
