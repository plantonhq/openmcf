# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: awsneptunecluster
spec:
  presets:
    - preset: 01-production-graph
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: instance hours
          price: neptune-db-r6g-large-us-west-2
          pricing_quantity: "1460"
          quantity_basis: 2 instances (writer + reader-1, both db.r6g.large) x 730 hours
      exclusions:
        - cluster storage bills per consumed GB-month and grows with data
        - storage I/O requests on standard (non-I/O-Optimized) storage are workload-dependent
        - backup storage beyond the free allowance grows with churn across the 7-day retention window
        - CloudWatch ingestion for the exported audit logs depends on database activity
        - data transfer between AZs and out of the region
      notes: IAM database authentication and deletion protection add no charge of their own.
    - preset: 02-serverless
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: serverless capacity
          price: neptune-serverless-ncu-us-west-2
          pricing_quantity: "730"
          quantity_basis: 1 db.serverless instance at the 1-NCU scaling floor (min_capacity 1) x 730 hours -- the capacity that always bills; Neptune Serverless does not pause to zero
      exclusions:
        - NCU-hours above the 1-NCU floor are demand-driven, up to the 32-NCU ceiling per hour
        - cluster storage bills per consumed GB-month and grows with data
        - storage I/O requests on standard storage are workload-dependent
        - backup storage beyond the free allowance grows with churn across the 7-day retention window
        - data transfer between AZs and out of the region
      notes: Estimated at the scaling floor -- the committed always-on spend. Worst-case compute at the 32-NCU ceiling is 32x this estimate.
