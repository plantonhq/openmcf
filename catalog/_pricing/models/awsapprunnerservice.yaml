# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. This component is hand-modeled rather than derived: the
# committed floor is provisioned-instance MEMORY multiplied by the
# auto-scaling minimum, and when a manifest references an
# AwsAppRunnerAutoScalingConfiguration that minimum lives on the referenced
# component -- a fact carried in a foreign-key reference whose presence the
# derivation engine's conditions cannot read (references resolve at
# composition time, so a reference-only field evaluates as unset). Pricing
# such a manifest at a floor of 1 would be knowably wrong (the catalog
# preset wiring that reference does so precisely for a 2+ warm-instance
# posture), so per-preset hand verification is the only honest path: the
# 02 preset carries NO entry here -- its committed floor is priced at
# composition time, when a surface sees both components -- and the other
# three presets price their account-default floor of one instance under
# stated assumptions. Reference-presence conditions are the engine
# extension these presets become the acceptance fixture for.
# Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: awsapprunnerservice
spec:
  presets:
    - preset: 01-basic-public-image
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned instance memory
          price: apprunner-provisioned-memory-us-east-1
          pricing_quantity: "1460"
          quantity_basis: one provisioned instance (the account-default auto-scaling minimum of 1, stated because no auto scaling configuration is referenced) x 2 GB (memory 2048 MB) x 730 hours, at the us-east-1 rate since the preset pins region as a placeholder
      exclusions:
        - active instance vCPU and memory usage follows request traffic and concurrency -- from zero (the provisioned instance idle) up to the default auto-scaling maximum of 25 running around the clock
        - data transfer out to the internet
      notes: Provisioned (warm) instances bill memory only; vCPU starts billing the moment an instance actively serves requests -- which is why the committed line carries GB-hours and no vCPU-hours. Custom domains and the managed TLS certificates App Runner issues for them are free.
    - preset: 03-github-code-source
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned instance memory
          price: apprunner-provisioned-memory-us-east-1
          pricing_quantity: "1460"
          quantity_basis: one provisioned instance (the account-default auto-scaling minimum of 1, stated because no auto scaling configuration is referenced) x 2 GB (memory 2048 MB) x 730 hours, at the us-east-1 rate since the preset pins region as a placeholder
        - sku_meter: automatic deployment fee
          price: apprunner-automatic-deployment-us-east-1
          pricing_quantity: "1"
          quantity_basis: one fixed automatic-deployment fee per service per month while auto_deployments_enabled is true, independent of how many deployments run, at the us-east-1 rate since the preset pins region as a placeholder
      exclusions:
        - active instance vCPU and memory usage follows request traffic and concurrency -- from zero (the provisioned instance idle) up to the default auto-scaling maximum of 25 running around the clock
        - data transfer out to the internet
        - build minutes bill per minute for every build App Runner runs from the connected repository and follow deployment frequency
      notes: Provisioned (warm) instances bill memory only; vCPU starts billing the moment an instance actively serves requests. Custom domains and the managed TLS certificates App Runner issues for them are free.
    - preset: 04-private-vpc-ingress
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned instance memory
          price: apprunner-provisioned-memory-us-west-2
          pricing_quantity: "1460"
          quantity_basis: one provisioned instance (the account-default auto-scaling minimum of 1, stated because no auto scaling configuration is referenced) x 2 GB (memory 2048 MB) x 730 hours, at the us-west-2 rate the preset pins
      exclusions:
        - active instance vCPU and memory usage follows request traffic and concurrency -- from zero (the provisioned instance idle) up to the default auto-scaling maximum of 25 running around the clock
        - the interface VPC endpoint carrying the VPC Ingress Connection bills hourly and per GB on its own AwsVpcEndpoint component
        - data transfer within and out of the VPC
      notes: The private service (is_publicly_accessible false) is reachable only through the VPC Ingress Connection; App Runner itself adds no charge for the connection -- the endpoint carrying it bills as its own component. Provisioned (warm) instances bill memory only.
