# Estimate model: the authored capacity footprints of this cluster-capacity
# component's presets. A hand model instead of a capacity derivation because
# the 01-dev-mode preset omits explicit resources and relies on the spec's
# (dev.planton.kubernetes.default_container_resources) annotation -- defaults
# the modules apply at deploy time but the capacity estimator never consults
# (it reads only explicit manifest values), so a derivation would understate
# the true reservation. Each footprint is computed from the preset manifest
# by hand and defended in its basis sentence; presets omitting resources use
# the spec-declared defaults. Cluster-capacity components carry no priced
# lines -- the dollar value of the reservation is the target cluster's node
# and storage-class economics. Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: kubernetesopenbao
spec:
  presets:
    - preset: 01-dev-mode
      capacity_footprint:
        cpu_requests: 100m
        memory_requests: 256Mi
        cpu_limits: 1000m
        memory_limits: 512Mi
        basis: 1 dev-mode server x spec-declared default resources (100m CPU / 256Mi memory requests, 1000m CPU / 512Mi limits -- the platform applies them when the manifest omits resources); dev mode is in-memory, so no volumes are provisioned
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - dev mode persists NOTHING -- all data is lost on pod restart; never run it beyond a laboratory
    - preset: 02-production-ha
      capacity_footprint:
        cpu_requests: 750m
        memory_requests: 1536Mi
        cpu_limits: "3"
        memory_limits: 3Gi
        persistent_storage: 60Gi
        basis: 3 Raft replicas x (250m CPU / 512Mi memory requests, 1000m CPU / 1Gi limits) + 3 x 10Gi data volumes + 3 x 10Gi audit volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - the chart's default required anti-affinity places each replica on a distinct node -- the cluster needs at least 3 schedulable nodes
    - preset: 03-production-ha-gcp-auto-unseal
      capacity_footprint:
        cpu_requests: 750m
        memory_requests: 1536Mi
        cpu_limits: "3"
        memory_limits: 3Gi
        persistent_storage: 60Gi
        basis: 3 Raft replicas x (250m CPU / 512Mi memory requests, 1000m CPU / 1Gi limits) + 3 x 10Gi data volumes + 3 x 10Gi audit volumes -- identical capacity to 02; auto-unseal changes key custody, not the footprint
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - the GCP Cloud KMS unseal key bills on the GCP account, outside the cluster
        - the chart's default required anti-affinity places each replica on a distinct node -- the cluster needs at least 3 schedulable nodes
