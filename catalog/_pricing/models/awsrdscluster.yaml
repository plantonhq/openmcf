# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: awsrdscluster
spec:
  presets:
    - preset: 01-aurora-postgresql
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: instance hours
          price: rds-db-r6g-large-aurora-postgresql-us-west-2
          pricing_quantity: "1460"
          quantity_basis: 2 instances (writer + reader-1, both db.r6g.large) x 730 hours
      exclusions:
        - Aurora cluster storage bills per consumed GB-month and grows with data
        - storage I/O requests on standard (non-I/O-Optimized) Aurora storage are workload-dependent
        - backup storage beyond the free allowance grows with churn across the 7-day retention window
        - CloudWatch ingestion for the exported postgresql logs depends on database chatter
        - data transfer between AZs and out of the region
      notes: Performance Insights is enabled but free at the default 7-day retention; the managed master password and deletion protection add no charge of their own.
    - preset: 02-aurora-mysql
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: instance hours
          price: rds-db-r6g-large-aurora-mysql-us-west-2
          pricing_quantity: "1460"
          quantity_basis: 2 instances (writer + reader-1, both db.r6g.large) x 730 hours
      exclusions:
        - Aurora cluster storage bills per consumed GB-month and grows with data
        - storage I/O requests on standard (non-I/O-Optimized) Aurora storage are workload-dependent
        - backtrack change records across the 24-hour backtrack window bill per million records and follow write churn
        - backup storage beyond the free allowance grows with churn across the 7-day retention window
        - CloudWatch ingestion for the exported error and slowquery logs depends on database chatter
        - data transfer between AZs and out of the region
      notes: Performance Insights is enabled but free at the default 7-day retention.
    - preset: 03-aurora-serverless-v2
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - ACU-hours are demand-driven -- min_capacity 0 enables automatic pause, so an idle cluster's compute cost is zero and a busy one bills up to the 16-ACU ceiling per hour
        - Aurora cluster storage bills per consumed GB-month and grows with data (it bills even while compute is paused)
        - storage I/O requests on standard Aurora storage are workload-dependent
        - Data API requests (enable_http_endpoint) bill per million requests past the free allowance, which covers only the first year of usage
        - backup storage beyond the free allowance grows with churn across the 7-day retention window
        - data transfer between AZs and out of the region
      notes: min_capacity 0 means no committed compute spend -- the single db.serverless writer pauses after 5 idle minutes and resumes on the next connection. Every dollar of this preset follows usage.
    - preset: 04-mysql-s3-migration
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: instance hours
          price: rds-db-r6g-large-aurora-mysql-us-west-2
          pricing_quantity: "730"
          quantity_basis: 1 instance (writer, db.r6g.large) x 730 hours
      exclusions:
        - Aurora cluster storage bills per consumed GB-month -- immediately material here, since the S3 restore lands the migrated dataset on day one
        - storage I/O requests on standard Aurora storage are workload-dependent
        - backtrack change records across the 72-hour backtrack window bill per million records and follow cutover write churn
        - backup storage beyond the free allowance grows with churn across the 7-day retention window
        - data transfer between AZs and out of the region
      notes: The one-time S3 restore itself adds no RDS charge; S3 storage and request costs for the XtraBackup files belong to the source bucket.
