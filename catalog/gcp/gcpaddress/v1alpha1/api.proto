syntax = "proto3";

package dev.planton.gcp.gcpaddress.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpaddress/v1alpha1/spec.proto";
import "catalog/gcp/gcpaddress/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//gcp-address
message GcpAddress {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpAddress'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpAddressSpec spec = 4 [(buf.validate.field).required = true];
  GcpAddressStatus status = 5;
}

message GcpAddressStatus {
  GcpAddressStackOutputs outputs = 1;
}
