<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield frame: the key's IAM policy receiving the grant -->
  <path d="M 8 1.5 L 13.5 3.5 L 13.5 8 Q 13.5 12.5 8 14.5 Q 2.5 12.5 2.5 8 L 2.5 3.5 Z" fill="#4285F4" opacity="0.9"/>
  <path d="M 8 1.5 L 13.5 3.5 L 13.5 8 Q 13.5 12.5 8 14.5 Q 2.5 12.5 2.5 8 L 2.5 3.5 Z" stroke="#1967D2" stroke-width="0.5" fill="none"/>

  <!-- Key: the crypto key being granted -->
  <g stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" fill="none">
    <circle cx="6.4" cy="6.6" r="1.6"/>
    <line x1="7.6" y1="7.8" x2="10.4" y2="10.6"/>
    <line x1="9.4" y1="10.4" x2="10.3" y2="9.5"/>
  </g>

  <!-- Grant check: access allowed -->
  <path d="M 9.4 5 L 10.4 6 L 12.2 4.2" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
