<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The load balancer side: one entry point -->
  <circle cx="3" cy="8" r="1.8" fill="#4285F4"/>
  <!-- The bridge: fan-out from the LB to the endpoint group -->
  <path d="M 4.6 8 L 8 8 M 8 8 L 11 4.5 M 8 8 L 11 8 M 8 8 L 11 11.5"
        stroke="#4285F4" stroke-width="1.2" stroke-linecap="round"/>
  <!-- The grouped endpoints: what the NEG points at -->
  <rect x="11" y="3" width="3" height="3" rx="0.8" fill="#34A853"/>
  <rect x="11" y="6.5" width="3" height="3" rx="0.8" fill="#34A853" opacity="0.75"/>
  <rect x="11" y="10" width="3" height="3" rx="0.8" fill="#34A853" opacity="0.5"/>
  <!-- Group boundary -->
  <rect x="10.2" y="2.2" width="4.6" height="11.6" rx="1.4" stroke="#5F6368" stroke-width="0.8" stroke-dasharray="1.6 1.2"/>
</svg>
