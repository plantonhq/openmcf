apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerInstance
metadata:
  name: prod-spanner
spec:
  # project_id omitted: falls back to the provider's default project.
  config: regional-us-central1 # replace with your region's config
  displayName: Production Spanner
  numNodes: 1
  edition: ENTERPRISE
  defaultBackupScheduleType: AUTOMATIC
  labels:
    team: platform # replace with your owning team
