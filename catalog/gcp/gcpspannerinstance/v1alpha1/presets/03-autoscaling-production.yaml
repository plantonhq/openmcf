apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerInstance
metadata:
  name: autoscale-spanner
spec:
  # project_id omitted: falls back to the provider's default project.
  config: nam6 # multi-region North America; replace to match your topology
  displayName: Autoscaling Spanner
  edition: ENTERPRISE
  defaultBackupScheduleType: AUTOMATIC
  autoscalingConfig:
    autoscalingLimits:
      minNodes: 1
      maxNodes: 5
    autoscalingTargets:
      highPriorityCpuUtilizationPercent: 45 # multi-region guidance; use 65 for regional
      storageUtilizationPercent: 80
    # Scale a read-heavy replica region independently of the rest.
    asymmetricAutoscalingOptions:
      - replicaLocation: us-east1 # replace with the read-heavy replica region
        overrides:
          minNodes: 2
          maxNodes: 10
