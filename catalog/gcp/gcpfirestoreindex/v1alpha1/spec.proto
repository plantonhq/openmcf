syntax = "proto3";

package dev.planton.gcp.gcpfirestoreindex.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpFirestoreIndexVectorConfig declares a vector index on a field —
// the enabler for Firestore's nearest-neighbor (embedding similarity)
// queries.
message GcpFirestoreIndexVectorConfig {
  // Dimension of the vectors indexed on this field (the embedding
  // model's output size, e.g. 768).
  int32 dimension = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1
  ];
}

// GcpFirestoreIndexField declares one field's role in a composite
// index. Exactly one of order, array_config, vector_config, or
// search_config per field. Vector-configured fields must come last in
// the index.
message GcpFirestoreIndexField {
  // Dot-separated field path in the document (e.g. "user.age").
  string field_path = 1 [(buf.validate.field).required = true];

  // Sort order for a scalar field: ASCENDING or DESCENDING.
  string order = 2 [(buf.validate.field).cel = {
    id: "order_valid_value"
    expression: "this == '' || this in ['ASCENDING', 'DESCENDING']"
    message: "order must be ASCENDING or DESCENDING"
  }];

  // CONTAINS declares an array-membership index on the field (enables
  // array-contains queries).
  string array_config = 3 [(buf.validate.field).cel = {
    id: "array_config_valid_value"
    expression: "this == '' || this == 'CONTAINS'"
    message: "array_config must be CONTAINS"
  }];

  // Vector index configuration for nearest-neighbor queries.
  GcpFirestoreIndexVectorConfig vector_config = 4;

  // Text or geo search index configuration for the field — the
  // Firestore Enterprise search surface. Requires an ENTERPRISE-edition
  // database (GcpFirestoreDatabase database_edition: ENTERPRISE); text
  // search additionally pairs with api_scope MONGODB_COMPATIBLE_API,
  // while geo search works under the default scope. Search and
  // non-search fields cannot mix in one index (API-enforced): when any
  // field carries search_config, every field must.
  GcpFirestoreIndexSearchConfig search_config = 5;

  // Every field plays exactly one role.
  option (buf.validate.message).cel = {
    id: "exactly_one_field_role"
    expression: "(this.order != '' ? 1 : 0) + (this.array_config != '' ? 1 : 0) + (has(this.vector_config) ? 1 : 0) + (has(this.search_config) ? 1 : 0) == 1"
    message: "each field declares exactly one of order, array_config, vector_config, or search_config"
  };
}

// Search-index configuration for one field: a text spec, a geo spec, or
// both.
message GcpFirestoreIndexSearchConfig {
  option (buf.validate.message).cel = {
    id: "search_config_not_empty"
    expression: "has(this.text_spec) || has(this.geo_spec)"
    message: "search_config must declare text_spec and/or geo_spec"
  };

  // Text search index specification for the field.
  GcpFirestoreIndexTextSpec text_spec = 1;

  // Geo search index specification for the field.
  GcpFirestoreIndexGeoSpec geo_spec = 2;
}

// How a text field is indexed for search. Repeated specs let the same
// field be indexed multiple ways (e.g. different match types).
message GcpFirestoreIndexTextSpec {
  // Index specifications; at least one.
  repeated GcpFirestoreIndexTextIndexSpec index_specs = 1 [(buf.validate.field).repeated.min_items = 1];
}

// One way of indexing a text field's value. The provider passes both
// values through to the Firestore Admin API unvalidated, so this spec
// stays equally permissive — consult the API's current
// Index.IndexField.SearchConfig documentation for the accepted values.
message GcpFirestoreIndexTextIndexSpec {
  // How the text field value is indexed (e.g. "TOKENIZED").
  string index_type = 1;

  // How the text field value is matched (e.g. "MATCH_GLOBALLY").
  string match_type = 2;
}

// Geo search index specification.
message GcpFirestoreIndexGeoSpec {
  // If true, disables GeoJSON indexing for the field (GeoJSON points are
  // indexed by default). Firestore GeoPoints are indexed regardless.
  bool geo_json_indexing_disabled = 1;
}

// GcpFirestoreIndexSpec defines a composite index on a Firestore
// database — the prerequisite for any query that filters or orders on
// multiple fields (Firestore rejects such queries outright until a
// matching composite index exists). Declaring indexes as infrastructure
// makes a deployment's query capabilities reviewable and reproducible
// instead of click-created from error-message links.
//
// Indexes are many-per-database with independent lifecycles, and every
// property is immutable: changing anything replaces the index (Firestore
// rebuilds it in the background; the old index serves queries until the
// new one is ready when applied create-before-destroy).
message GcpFirestoreIndexSpec {
  // GCP project owning the database. Can be a literal project ID or a
  // reference to a GcpProject resource. If omitted, the provider's
  // default project is used.
  // Immutable: changing the project destroys and recreates the index.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The Firestore database the index belongs to — the database name (a
  // GcpFirestoreDatabase reference resolves to it). Empty falls back to
  // the project's "(default)" database. Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef database = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpFirestoreDatabase,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.database_name"
  ];

  // The collection (group) ID the index applies to. Immutable after
  // creation.
  string collection = 3 [(buf.validate.field).required = true];

  // Scope of the queries the index serves.
  // COLLECTION: queries against a single collection at this path
  //   (the default).
  // COLLECTION_GROUP: queries against every collection with this ID
  //   anywhere in the database.
  // COLLECTION_RECURSIVE: queries against the collection and everything
  //   beneath it (Datastore Mode only).
  optional string query_scope = 4 [
    (dev.planton.shared.options.default) = "COLLECTION",
    (buf.validate.field).cel = {
      id: "query_scope_valid_value"
      expression: "this == '' || this in ['COLLECTION', 'COLLECTION_GROUP', 'COLLECTION_RECURSIVE']"
      message: "query_scope must be COLLECTION, COLLECTION_GROUP, or COLLECTION_RECURSIVE"
    }
  ];

  // Which API surface the index serves.
  // ANY_API: Firestore Native queries (the default).
  // DATASTORE_MODE_API: Datastore Mode queries.
  // MONGODB_COMPATIBLE_API: Firestore Enterprise (MongoDB-compatible)
  //   queries — required for multikey and search-config indexes, and
  //   only valid on an ENTERPRISE-edition database. Requires
  //   query_scope COLLECTION_GROUP explicitly (the API rejects the
  //   COLLECTION default for this scope).
  optional string api_scope = 5 [
    (dev.planton.shared.options.default) = "ANY_API",
    (buf.validate.field).cel = {
      id: "api_scope_valid_value"
      expression: "this == '' || this in ['ANY_API', 'DATASTORE_MODE_API', 'MONGODB_COMPATIBLE_API']"
      message: "api_scope must be ANY_API, DATASTORE_MODE_API, or MONGODB_COMPATIBLE_API"
    }
  ];

  // Index density. Leave empty for GCP's default (SPARSE_ALL).
  // DENSE indexes also include documents missing the indexed fields —
  // required for some Datastore Mode query shapes.
  string density = 6 [(buf.validate.field).cel = {
    id: "density_valid_value"
    expression: "this == '' || this in ['SPARSE_ALL', 'SPARSE_ANY', 'DENSE']"
    message: "density must be SPARSE_ALL, SPARSE_ANY, or DENSE"
  }];

  // The indexed fields, in query order (equality filters first, then
  // inequality/sort fields; a vector field, if any, last). At least one
  // field. Firestore appends __name__ automatically.
  repeated GcpFirestoreIndexField fields = 7 [(buf.validate.field).repeated.min_items = 1];

  // Whether the index is multikey: at most one indexed path may reach or
  // traverse an array (MongoDB-style array indexing). Only valid with
  // api_scope MONGODB_COMPATIBLE_API. Immutable after creation.
  bool multikey = 8;

  // Whether the index enforces uniqueness: all values of the indexed
  // field(s) must be unique across documents. Immutable after creation.
  bool unique = 9;

  // If true, the deploy returns as soon as index creation is REQUESTED
  // instead of waiting for the (potentially long) background build to
  // finish. The index serves queries only once the build completes —
  // use when orchestrating many indexes and the caller polls readiness
  // itself.
  bool skip_wait = 10;

  // Deletion policy — what happens when this resource is destroyed:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the index is deleted
  //   "PREVENT" -- destroy FAILS; protects indexes whose rebuild would
  //                be expensive on a large collection
  //   "ABANDON" -- the index is removed from management but kept
  //                serving queries in GCP
  string deletion_policy = 11 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];

  // Multikey is a MongoDB-compatible concept and is rejected by the
  // other API scopes.
  option (buf.validate.message).cel = {
    id: "multikey_requires_mongodb_scope"
    expression: "!this.multikey || this.api_scope == 'MONGODB_COMPATIBLE_API'"
    message: "multikey indexes require api_scope MONGODB_COMPATIBLE_API"
  };

  // Two API contracts the provider schema does not carry (both rejected by
  // the Firestore Admin API at create with a 400, verified live):
  //   - "Indexes with the MONGODB_COMPATIBLE_API API scope must use the
  //     COLLECTION_GROUP query scope." — the scope must be set explicitly
  //     (the COLLECTION default does not satisfy it).
  //   - "Mixing search and non-search indexes is not supported." — an index
  //     is either a search index (every field carries search_config) or a
  //     regular one (no field does).
  option (buf.validate.message).cel = {
    id: "mongodb_scope_requires_collection_group"
    expression: "this.api_scope != 'MONGODB_COMPATIBLE_API' || this.query_scope == 'COLLECTION_GROUP'"
    message: "api_scope MONGODB_COMPATIBLE_API requires query_scope COLLECTION_GROUP (set it explicitly; the COLLECTION default is rejected by the API)"
  };

  option (buf.validate.message).cel = {
    id: "search_and_non_search_fields_dont_mix"
    expression: "this.fields.all(f, has(f.search_config)) || this.fields.all(f, !has(f.search_config))"
    message: "an index is either a search index (every field carries search_config) or a non-search index (no field does) — the API rejects mixed indexes"
  };
}
