# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_dns_managed_zone:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names. The zone's cloud-side name derives from
      # metadata.name in the module (no dedicated spec field), so only
      # project needs a mapping alongside the peering flattening.
      - spec: spec.project_id
        arg: project
      # The provider wraps the peering target in a single-field
      # target_network block; the spec flattens it to the reference
      # itself.
      - spec: spec.peering_config.target_network
        arg: peering_config.target_network.network_url
    exclusions:
      - arg: name
        reason: >-
          derived by the module from metadata.name (sanitized) -- the
          zone's cloud-side identity follows the Planton object name, the
          same contract both engines implement
      - arg: dnssec_config.kind
        reason: >-
          vestigial API identity marker -- the provider defaults it to
          "dns#managedZoneDnsSecConfig" and accepts nothing meaningful;
          "Identifies what kind of resource this is" is schema plumbing,
          not configuration
      - arg: dnssec_config.default_key_specs.kind
        reason: >-
          vestigial API identity marker -- the provider defaults it to
          "dns#dnsKeySpec" and accepts nothing meaningful; "Identifies
          what kind of resource this is" is schema plumbing, not
          configuration

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables dns.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      zone never disables the API project-wide); not spec surface.
