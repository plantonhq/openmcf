apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeInstance
metadata:
  name: test-vm
spec:
  projectId:
    value: planton-testing
  zone: us-central1-a
  machineType: e2-micro
  bootDisk:
    image: debian-cloud/debian-12
    sizeGb: 10
    type: pd-balanced
    # Explicit guest OS features are additive to what the image already
    # declares — modern Debian images carry both of these natively.
    guestOsFeatures:
      - UEFI_COMPATIBLE
      - GVNIC
  networkInterfaces:
    - network:
        value: default
      accessConfigs:
        - networkTier: PREMIUM
  scheduling:
    provisioningModel: SPOT
    onHostMaintenance: TERMINATE
    instanceTerminationAction: DELETE
  shieldedInstanceConfig:
    enableSecureBoot: true
  # DELETE is the provider default — armed explicitly to prove the
  # round-trip stays diff-free.
  deletionPolicy: DELETE
  labels:
    env: testing
  tags:
    - http-server
  metadata:
    enable-oslogin: "TRUE"
