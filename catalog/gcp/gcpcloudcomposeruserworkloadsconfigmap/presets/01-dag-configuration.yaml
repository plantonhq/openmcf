apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudComposerUserWorkloadsConfigMap
metadata:
  name: orders-dag-config
spec:
  # project_id omitted: falls back to the provider's default project.
  region: us-central1

  environment:
    valueFrom:
      kind: GcpCloudComposerEnvironment
      name: prod-airflow # replace with your environment resource name
      fieldPath: status.outputs.environment_name

  configMapName: orders-dag-config

  # Plain configuration a DAG reads at runtime. Quote numbers and
  # booleans so YAML keeps them as strings.
  data:
    api_endpoint: https://api.example.com/v2 # replace with your service endpoint
    batch_size: "500"
    retry_limit: "3"
    processing_timezone: America/New_York
