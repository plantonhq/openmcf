apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudComposerUserWorkloadsConfigMap
metadata:
  name: pipeline-feature-flags
spec:
  # project_id omitted: falls back to the provider's default project.
  region: us-central1

  environment:
    valueFrom:
      kind: GcpCloudComposerEnvironment
      name: prod-airflow # replace with your environment resource name
      fieldPath: status.outputs.environment_name

  configMapName: pipeline-feature-flags

  # Flags DAGs check at runtime. Quote booleans — unquoted true/false
  # (and on/off/yes/no) are YAML booleans, and ConfigMap values must be
  # strings.
  data:
    enable_incremental_load: "true"
    enable_data_quality_checks: "true"
    enable_legacy_export: "false"
    dry_run: "false"
