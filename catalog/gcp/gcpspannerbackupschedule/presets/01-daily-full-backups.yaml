apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerBackupSchedule
metadata:
  name: orders-daily-backups
spec:
  # project_id omitted: falls back to the provider's default project.
  instance:
    valueFrom:
      kind: GcpSpannerInstance
      name: prod-spanner # replace with your instance resource name
      fieldPath: status.outputs.instance_name
  database:
    valueFrom:
      kind: GcpSpannerDatabase
      name: orders-db # replace with your database resource name
      fieldPath: status.outputs.database_name
  cron: "0 2 * * *" # daily at 02:00 UTC
  retentionDuration: 2678400s # keep each backup 31 days
  backupType: FULL
