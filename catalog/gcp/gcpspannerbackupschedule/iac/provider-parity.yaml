# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_spanner_backup_schedule:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names.
      - spec: spec.schedule_name
        arg: name
      - spec: spec.project_id
        arg: project
      # The provider nests the crontab text three levels deep inside its
      # own block coincidentally named `spec`; the schedule's cadence IS
      # the cron string, so the spec carries it as one field.
      - spec: spec.cron
        arg: spec.cron_spec.text

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables spanner.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      schedule never disables the API project-wide); not spec surface.

specExclusions:
  - field: spec.backup_type
    reason: >-
      the provider expresses the backup kind as a pair of EMPTY marker
      blocks (full_backup_spec / incremental_backup_spec) carrying no
      arguments to map onto; the spec collapses the choice to one enum
      and the modules emit exactly one marker block from it
