<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The database being protected: a stacked cylinder -->
  <ellipse cx="6" cy="4" rx="4.4" ry="1.8" fill="#4285F4"/>
  <path d="M 1.6 4 V 10.5 C 1.6 11.5 3.6 12.3 6 12.3 C 6.5 12.3 7 12.27 7.4 12.2 V 4 Z" fill="#4285F4" opacity="0.85"/>
  <path d="M 10.4 4 V 6.2 C 10.15 6.15 9.9 6.13 9.6 6.13 C 8.85 6.13 8.1 6.3 7.4 6.6 V 4 Z" fill="#4285F4" opacity="0.85"/>
  <ellipse cx="6" cy="4" rx="4.4" ry="1.8" stroke="#1967D2" stroke-width="0.4" fill="none"/>

  <!-- The schedule: a clock face driving recurring backups -->
  <circle cx="10.8" cy="10.4" r="4.2" fill="#FFFFFF"/>
  <circle cx="10.8" cy="10.4" r="3.8" fill="#1967D2"/>
  <!-- Clock hands at 02:00 (the classic off-peak backup hour, UTC) -->
  <g stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round">
    <line x1="10.8" y1="10.4" x2="12.2" y2="9.2"/>
    <line x1="10.8" y1="10.4" x2="10.8" y2="8.3"/>
  </g>
  <!-- The recurrence: a circular arrow around the clock -->
  <path d="M 7.4 12.4 A 4.9 4.9 0 0 1 6.9 9.4" stroke="#1967D2" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M 6.4 10.1 L 6.9 9.3 L 7.7 9.8" stroke="#1967D2" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
