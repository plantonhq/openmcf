apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedSslCertificate
metadata:
  name: app-cert
spec:
  projectId:
    value: "<gcp-project-id>"
  # certificateName: omit to default to metadata.name (e.g. prod-app-cert)
  description: TLS for the production app load balancer
  domains:
    - app.example.com  # replace: your application hostname
