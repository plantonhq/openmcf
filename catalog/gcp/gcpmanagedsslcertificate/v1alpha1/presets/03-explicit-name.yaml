apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedSslCertificate
metadata:
  name: prod-lb-tls
spec:
  projectId:
    value: "<gcp-project-id>"
  # GCP certificate name decoupled from the Planton metadata.name
  certificateName: prod-lb-tls-2026
  description: Production load balancer TLS — rotate by creating a new cert with a new certificateName
  domains:
    - api.example.com
