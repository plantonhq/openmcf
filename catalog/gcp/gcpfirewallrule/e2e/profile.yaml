apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpfirewallrule
spec:
  # Composed scenarios: each deploys a GcpVpcNetwork fixture (declared via the
  # scenario's e2e-prerequisites annotation — the kind has no registry
  # prerequisites because a rule can also target a pre-existing network),
  # resolves the rule's network reference from its outputs, then runs
  # deploy -> compute firewalls.get verify (allow/deny payload must be
  # present) -> destroy -> verify 404, on both provisioners. `minimal` is the
  # flagship ALLOW-ingress shape; `deny-egress-logged` covers the DENY action,
  # EGRESS direction with destination ranges, and firewall logging. Firewall
  # rules are free objects with no deleted-name reservation, so cloud-side
  # names stay fixed.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
