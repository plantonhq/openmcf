<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Certificate background (family mark) -->
  <rect x="2" y="1" width="12" height="14" rx="1" fill="#4285F4" opacity="0.9"/>

  <!-- Certificate border/frame -->
  <rect x="2" y="1" width="12" height="14" rx="1" stroke="#1967D2" stroke-width="0.5" fill="none"/>

  <!-- DNS globe in center: the domain being authorized -->
  <g transform="translate(4.5, 3.5)">
    <circle cx="3.5" cy="3.5" r="3" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
    <ellipse cx="3.5" cy="3.5" rx="1.4" ry="3" stroke="#FFFFFF" stroke-width="0.6" fill="none"/>
    <line x1="0.6" y1="3.5" x2="6.4" y2="3.5" stroke="#FFFFFF" stroke-width="0.6"/>
  </g>

  <!-- Checkmark: domain control proven -->
  <g transform="translate(10, 11)">
    <circle cx="2" cy="2" r="2" fill="#34A853"/>
    <path d="M 0.8 2 L 1.6 2.8 L 3.2 1.2" stroke="#FFFFFF" stroke-width="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
