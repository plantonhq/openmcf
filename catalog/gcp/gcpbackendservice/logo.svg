<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The hub: the backend service at the center of the chain -->
  <circle cx="8" cy="8" r="2.6" fill="#4285F4"/>
  <!-- Inbound: the URL map's route into the hub -->
  <path d="M 1.5 8 L 5.4 8" stroke="#4285F4" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Outbound: traffic distributed to the backend pool -->
  <path d="M 10.6 8 L 13 4.5 M 10.6 8 L 13 8 M 10.6 8 L 13 11.5"
        stroke="#34A853" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="14" cy="4.5" r="1.2" fill="#34A853"/>
  <circle cx="14" cy="8" r="1.2" fill="#34A853" opacity="0.75"/>
  <circle cx="14" cy="11.5" r="1.2" fill="#34A853" opacity="0.5"/>
  <!-- The policy ring: CDN/Armor/IAP wrapping the hub -->
  <circle cx="8" cy="8" r="4.6" stroke="#5F6368" stroke-width="0.8" stroke-dasharray="1.8 1.4"/>
</svg>
