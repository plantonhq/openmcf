# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

specExclusions:
  # The provider expresses "back up every day" as an ARGUMENT-LESS block
  # (daily_recurrence has no attributes -- presence is the whole signal),
  # so there is no argument for this field to map to.
  - field: spec.daily
    reason: >-
      drives the presence of the provider's argument-less daily_recurrence
      block -- the daily/weekly choice is real provider surface, but the
      daily arm contributes zero arguments to the census

resources:
  google_firestore_backup_schedule:
    mappings:
      # Rename: the spec says what the field IS (a project), where the
      # provider inherits the terser API name.
      - spec: spec.project_id
        arg: project

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables firestore.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      schedule never disables the API project-wide); not spec surface.
