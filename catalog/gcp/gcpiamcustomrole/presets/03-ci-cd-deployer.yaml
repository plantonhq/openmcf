apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamCustomRole
metadata:
  name: my-deployer-role
spec:
  projectId:
    value: "<gcp-project-id>"
  roleId: cloudRunDeployer
  title: Cloud Run Deployer
  description: Deploys new Cloud Run revisions from CI/CD without broader project access
  permissions:
    - run.services.get
    - run.services.list
    - run.services.update
    - run.revisions.get
    - run.revisions.list
    - run.operations.get
    - artifactregistry.repositories.downloadArtifacts
  stage: GA
