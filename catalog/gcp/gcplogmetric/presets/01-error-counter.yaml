apiVersion: gcp.planton.dev/v1alpha1
kind: GcpLogMetric
metadata:
  name: error-counter
spec:
  filter: resource.type="cloud_run_revision" AND resource.labels.service_name="checkout" AND severity>=ERROR
  metricDescriptor:
    metricKind: DELTA
    valueType: INT64
    unit: "1"
    labels:
      - key: status
        description: HTTP status code
        valueType: STRING
  labelExtractors:
    status: EXTRACT(httpRequest.status)
  description: Checkout error entries by status — the input to error-rate alerts
