# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name (the filter, the whole
# metric_descriptor block incl. the label schema, value_extractor,
# label_extractors, every bucket_options layout, disabled, bucket_name,
# and deletion_policy all auto-match that way). Every exclusion carries
# its reason: omission is a decision, never an accident.

resources:
  google_logging_metric:
    mappings:
      # The provider's name argument is the metric's Monitoring address
      # (logging.googleapis.com/user/{name}); the spec names it for what
      # it is and defaults it from metadata.name.
      - spec: spec.metric_name
        arg: name

      - spec: spec.project_id
        arg: project

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables logging.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      metric never disables logging project-wide); not spec surface.
