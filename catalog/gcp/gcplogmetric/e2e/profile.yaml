apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcplogmetric
spec:
  # Three scenarios: minimal (DELTA/INT64 counter with a labeled
  # descriptor), distribution (value_extractor + exponential buckets),
  # and bucket-scoped (the GcpLogBucket chart edge via the scenario-level
  # prerequisites annotation — the bucket fixture deploys first and the
  # metric's bucket_name resolves from its output). Metrics are free and
  # create in seconds — deploy -> projects.metrics.get verify -> destroy
  # -> verify gone, on both provisioners. WATCH: metric names may
  # contain slashes; the verifier URL-encodes the name in the GET path.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 15
