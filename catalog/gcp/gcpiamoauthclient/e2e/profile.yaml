apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpiamoauthclient
spec:
  # Standalone scenarios: a public-client smoke arm and a confidential
  # arm with one managed credential. Clients are free and create in
  # seconds, but deleted client IDs stay reserved ~30 days (soft
  # delete), so scenarios use run-scoped IDs. The credential scenario
  # ships its credential DISABLED because GCP refuses to delete an
  # enabled credential — the destroy-safe fixture shape; the secret is
  # still generated server-side and the client_secret output still
  # proven (watch item: confirm a disabled credential returns its
  # secret).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 15
