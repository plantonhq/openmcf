apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamOauthClient
metadata:
  name: web-app-client
spec:
  clientType: CONFIDENTIAL_CLIENT
  allowedGrantTypes:
    - AUTHORIZATION_CODE_GRANT
    - REFRESH_TOKEN_GRANT
  allowedScopes:
    - https://www.googleapis.com/auth/cloud-platform
    - openid
  allowedRedirectUris:
    - value: https://app.example.com/callback
  credentials:
    # The managed client secret; GCP generates its value server-side —
    # read it from the client_secret output. Removing this entry later
    # requires disabled: true in a prior apply first (GCP refuses to
    # delete an enabled credential).
    - credentialId: primary
      displayName: Primary web app secret
      disabled: false
  description: Server-side web application OAuth registration
