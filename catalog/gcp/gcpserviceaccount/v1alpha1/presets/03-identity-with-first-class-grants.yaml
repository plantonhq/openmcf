apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: my-app-identity
spec:
  serviceAccountId: my-app-prod  # replace: 6-30 chars, lowercase letters/digits/hyphens
  projectId:
    value: "<gcp-project-id>"
  displayName: <Your App> Runtime Identity
  description: Pure identity; access is granted through first-class GcpProjectIamMember nodes
  # No inline role lists: every grant is its own GcpProjectIamMember resource
  # referencing this account's `member` output — visible graph edges, custom
  # roles, conditions, and independent grant lifecycle.
