# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpserviceaccount
spec:
  gcp:
    groups:
      - purpose: ManageServiceAccount
        permissions:
          - iam.serviceAccounts.create
          - iam.serviceAccounts.get
          - iam.serviceAccounts.update
          - iam.serviceAccounts.delete
          - iam.serviceAccounts.disable
          - iam.serviceAccounts.enable
        provenance: derived
        notes: Covers google_service_account (Pulumi serviceaccount.Account) -- create, read/refresh, in-place updates (display_name, description), and destroy. disable and enable are needed because GCP flips the disabled flag via dedicated Enable/Disable API calls rather than the regular update mask (both modules document this), so any spec that toggles disabled exercises them. The create_ignore_already_exists adoption path reads the existing account under the same get. All six live inside roles/iam.serviceAccountAdmin, whose contents were verified live -- note that role does NOT include key permissions (next group).
      - purpose: ManageUserManagedKey
        permissions:
          - iam.serviceAccountKeys.create
          - iam.serviceAccountKeys.get
          - iam.serviceAccountKeys.delete
        provenance: derived
        notes: Covers google_service_account_key (Pulumi serviceaccount.Key), created only when spec.user_managed_key is present -- keyless is the default and needs nothing here. Both flows use the same permissions (generate returns the private key once; upload sends public_key_data), and a keepers-triggered rotation is a delete plus create. These are the heart of roles/iam.serviceAccountKeyAdmin (verified live) -- a deliberately separate role from serviceAccountAdmin, so key-capable deployers are an explicit grant.
      - purpose: GrantIamRoles
        permissions:
          - resourcemanager.projects.getIamPolicy
          - resourcemanager.projects.setIamPolicy
        provenance: derived
        notes: Required only when project_iam_roles is set -- covers google_project_iam_member's read-modify-write of the project allow policy, one additive (role, member) grant per listed role, on the account's home project. The pair lives inside roles/resourcemanager.projectIamAdmin (verified live). ORG grants need one more pair this list cannot carry -- google_organization_iam_member (used when org_iam_roles is set) authorizes as resourcemanager.organizations.getIamPolicy and resourcemanager.organizations.setIamPolicy on the ORGANIZATION itself, permissions that appear only in org-scoped inventories (verified live against Google's Resource Manager permissions reference; they are the heart of roles/resourcemanager.organizationAdmin). Grant that pair to the deploying principal on the org whenever org_iam_roles is used.
