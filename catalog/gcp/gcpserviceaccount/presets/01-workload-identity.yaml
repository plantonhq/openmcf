apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: my-workload-sa
spec:
  serviceAccountId: my-app-workload  # replace: 6-30 chars, lowercase letters/digits/hyphens
  projectId:
    value: "<gcp-project-id>"
  displayName: <Your Workload> (Workload Identity)
  description: Runtime identity for <your workload>; pods authenticate via KSA-to-GSA binding
  # No userManagedKey block: keyless — Workload Identity eliminates the need for keys
  projectIamRoles:
    - roles/logging.logWriter
    - roles/monitoring.metricWriter
    - roles/secretmanager.secretAccessor
