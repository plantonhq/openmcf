apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGlobalForwardingRule
metadata:
  name: pscgapis
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Private Service Connect endpoint forwarding VPC traffic to all Google APIs
  forwardingRuleName: pscgapis
  target:
    value: all-apis
  ipAddress:
    value: "<internal-psc-ip>" # replace: a GcpGlobalAddress with purpose PRIVATE_SERVICE_CONNECT
  loadBalancingScheme: NONE
  network:
    value: "<vpc-network-self-link>" # replace: the consumer VPC
  serviceDirectoryRegistration:
    namespace: psc-endpoints
    serviceDirectoryRegion: us-central1
