  <!-- The proxy binding -->
  <rect x="8.2" y="5.8" width="4.2" height="4.4" rx="1" stroke="#4285F4" stroke-width="1.2"/>
  <path d="M 9.2 8 L 11.2 8 M 10.6 7.2 L 11.4 8 L 10.6 8.8" stroke="#4285F4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
