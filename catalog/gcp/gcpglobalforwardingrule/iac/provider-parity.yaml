# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_compute_global_forwarding_rule:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names.
      - spec: spec.forwarding_rule_name
        arg: name
      - spec: spec.project_id
        arg: project
      # A frontend registers with exactly one Service Directory service;
      # the spec models the block singular where the provider inherits the
      # API's plural list shape. Matching resumes name-for-name below.
      - spec: spec.service_directory_registration
        arg: service_directory_registrations
    exclusions:
      - arg: source_ip_ranges
        reason: >-
          dead lever on this resource -- the provider documents the field
          as "can only be used with a regional Forwarding Rule whose
          scheme is EXTERNAL", and this kind manages the GLOBAL rule; the
          source-filtered variant belongs to a regional forwarding-rule
          kind

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables compute.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      forwarding rule never disables the API project-wide); not spec
      surface.
