# Consumer-scoped GcpSubnetwork for the Cloud Function → connector chain.
# Satisfies the connector kind's registry prerequisite; the connector
# prerequisite profile uses network+ipCidrRange placement, so this subnet
# is not consumed — but the transitive resolver still installs it.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpsnw-cldfunc-prereq
  id: planton-oss-e2e-gcpsnw-cldfunc-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: planton-oss-e2e-cldfunc-subnet-${E2E_RUN_ID}
  region: us-central1
  ipCidrRange: 10.9.0.0/24
  description: Ephemeral subnetwork for the GcpCloudFunction connector E2E chain; safe to delete
