# Composed GcpCloudFunction scenario: the function attaches STRAIGHT to the
# VPC via Direct VPC egress — no Serverless VPC Access connector. Instances
# draw IPs from the GcpSubnetwork prerequisite (resolved live via the
# subnetwork reference), the connectorless dual of vpc-connector-egress.
# Source staging works exactly as in http-minimal.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudFunction
metadata:
  name: planton-oss-e2e-cldfunc-dvpc
  id: planton-oss-e2e-cldfunc-dvpc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudfunction
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  functionName: e2e-fn-dvpc-${E2E_RUN_ID}
  description: Ephemeral function created by the Planton E2E harness; safe to delete
  buildConfig:
    runtime: python312
    entryPoint: handler
    source:
      storageSource:
        bucket:
          value: planton-oss-e2e-cldfunc-src-${E2E_RUN_ID}
        object: functions/hello.zip
  serviceConfig:
    availableMemory: 256M
    timeoutSeconds: 60
    directVpcNetworkInterface:
      network:
        valueFrom:
          kind: GcpVpcNetwork
          name: planton-oss-e2e-gcpvpcnetwork-prereq
          fieldPath: status.outputs.network_name
      subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpsnw-cldfunc-prereq
          fieldPath: status.outputs.subnetwork_name
      tags:
        - e2e-fn-egress
    directVpcEgress: ALL_TRAFFIC
    ingressSettings: ALLOW_INTERNAL_ONLY
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 1
  trigger:
    triggerType: HTTP
  deletionPolicy: DELETE
