apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudFunction
metadata:
  name: order-processor
spec:
  region: us-central1
  buildConfig:
    runtime: python312
    entryPoint: process_message
    source:
      storageSource:
        bucket:
          value: my-source-bucket # or reference a GcpGcsBucket resource
        object: functions/order-processor-v1.0.0.zip
  serviceConfig:
    availableMemory: 512M
    timeoutSeconds: 120
    ingressSettings: ALLOW_INTERNAL_ONLY # event-driven functions need no public ingress
    scaling:
      maxInstanceCount: 50 # the backpressure ceiling for an event storm
  trigger:
    triggerType: EVENT_TRIGGER
    eventTrigger:
      eventType: google.cloud.pubsub.topic.v1.messagePublished
      pubsubTopic:
        value: projects/my-project/topics/orders # or reference a GcpPubSubTopic resource
      retryPolicy: RETRY_POLICY_RETRY # at-least-once: the handler must be idempotent
