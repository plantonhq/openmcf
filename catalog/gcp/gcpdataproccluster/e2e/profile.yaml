apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpdataproccluster
spec:
  # Composed scenarios: each installs the VPC -> subnetwork chain plus an
  # autoscaling policy from the prerequisite graph, then creates the
  # cluster. A cluster create runs ~2-4 minutes (real VMs boot); destroy
  # ~1-2 minutes. Batch runs for both scenarios on both engines need
  # >=60m. The Dataproc-on-GKE arm is excluded from live runs: its chain
  # needs a ~20-minute GKE cluster with role-mapped node pools per
  # scenario-run — the arm is proven by the offline gate (spec tests +
  # both engines' converters exercised by the spark-on-gke preset).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 60
