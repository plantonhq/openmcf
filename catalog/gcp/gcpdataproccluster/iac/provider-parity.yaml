# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_dataproc_cluster:
    mappings:
      # Renames: the spec says what the field IS, where the provider
      # inherits terser API names.
      - spec: spec.cluster_name
        arg: name
      - spec: spec.project_id
        arg: project

      # The spec drops the provider's redundant _cluster_ qualifier
      # (exact matching resumes below the subtree).
      - spec: spec.cluster_config.gce_config
        arg: cluster_config.gce_cluster_config

      # Single-field provider blocks flattened to spec leaves.
      - spec: spec.cluster_config.autoscaling_policy_uri
        arg: cluster_config.autoscaling_config.policy_uri
      - spec: spec.cluster_config.encryption_kms_key_name
        arg: cluster_config.encryption_config.kms_key_name

      # The provider's legacy "preemptible" name for what the API and the
      # spec call secondary workers.
      - spec: spec.cluster_config.secondary_worker_config
        arg: cluster_config.preemptible_worker_config

      # Repeated-message fields are plural per proto style; provider
      # blocks are singular.
      - spec: spec.cluster_config.initialization_actions
        arg: cluster_config.initialization_action

      # The spec's properties map feeds the provider's writable surface
      # (its `properties` attribute is the computed resolved set).
      - spec: spec.cluster_config.software_config.properties
        arg: cluster_config.software_config.override_properties

      # The provider nests an extra node_group wrapper inside each
      # auxiliary group entry; the spec flattens it.
      - spec: spec.cluster_config.auxiliary_node_groups.roles
        arg: cluster_config.auxiliary_node_groups.node_group.roles
      - spec: spec.cluster_config.auxiliary_node_groups.node_group_config
        arg: cluster_config.auxiliary_node_groups.node_group.node_group_config

      # The provider nests the GKE node shape inside a config wrapper; the
      # spec holds the shape fields directly on the pool entry.
      - spec: spec.virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.machine_type
        arg: virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.config.machine_type
      - spec: spec.virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.local_ssd_count
        arg: virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.config.local_ssd_count
      - spec: spec.virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.min_cpu_platform
        arg: virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.config.min_cpu_platform
      - spec: spec.virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.preemptible
        arg: virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.config.preemptible
      - spec: spec.virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.spot
        arg: virtual_cluster_config.kubernetes_cluster_config.gke_cluster_config.node_pool_target.node_pool_config.config.spot
    exclusions:
      # Not yet bridged by the pinned Pulumi SDK (pulumi-gcp v9.29.0,
      # google-beta 7.38): modeling these only in Terraform would break
      # cross-engine parity -- a spec field one engine silently drops.
      # Re-evaluate at the next SDK bump.
      - arg: cluster_config.gce_cluster_config.confidential_instance_config.confidential_instance_type
        reason: >-
          GA at the pin but not yet bridged by the pinned Pulumi SDK
          (which carries only the deprecated enable_confidential_compute
          boolean the spec models); modeling it would break cross-engine
          parity. Re-evaluate at the next pulumi-gcp bump.
      - arg: cluster_config.master_config.instance_flexibility_policy.instance_selection_list.disk_config
        reason: >-
          GA at the pin but not yet bridged by the pinned Pulumi SDK (its
          instance-selection entries carry only machine_types and rank);
          modeling the per-selection disk shape would break cross-engine
          parity. Re-evaluate at the next pulumi-gcp bump.
      - arg: cluster_config.worker_config.instance_flexibility_policy.instance_selection_list.disk_config
        reason: >-
          GA at the pin but not yet bridged by the pinned Pulumi SDK (its
          instance-selection entries carry only machine_types and rank);
          modeling the per-selection disk shape would break cross-engine
          parity. Re-evaluate at the next pulumi-gcp bump.
      - arg: cluster_config.preemptible_worker_config.instance_flexibility_policy.instance_selection_list.disk_config
        reason: >-
          GA at the pin but not yet bridged by the pinned Pulumi SDK (its
          instance-selection entries carry only machine_types and rank);
          modeling the per-selection disk shape would break cross-engine
          parity. Re-evaluate at the next pulumi-gcp bump.

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables dataproc.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      cluster never disables the API project-wide); not spec surface.

specExclusions:
  # The provider deprecated enable_confidential_compute in favor of
  # confidential_instance_type, but the successor is not yet bridged by
  # the pinned Pulumi SDK -- the spec keeps the boolean (the shape both
  # engines can express) until the bridge catches up, when the field
  # redesigns to the type enum.
  - field: spec.cluster_config.gce_config.confidential_instance_config.enable_confidential_compute
    reason: >-
      maps to the provider's deprecated enable_confidential_compute
      argument -- the only confidential-compute shape the pinned Pulumi
      SDK can express; redesigns to confidential_instance_type at the
      next pulumi-gcp bump

  # The shared flexibility message carries provisioning_model_mix, but the
  # provider defines that argument on secondary workers only -- masters
  # and primary workers are always on-demand. Site-level CEL rules reject
  # it there, making these leaves unreachable by valid manifests.
  - field: spec.cluster_config.master_config.instance_flexibility_policy.provisioning_model_mix
    reason: >-
      provider carries provisioning_model_mix on secondary workers only;
      the spec's master_flexibility_no_provisioning_mix CEL rejects it on
      masters
  - field: spec.cluster_config.worker_config.instance_flexibility_policy.provisioning_model_mix
    reason: >-
      provider carries provisioning_model_mix on secondary workers only;
      the spec's worker_flexibility_no_provisioning_mix CEL rejects it on
      primary workers
