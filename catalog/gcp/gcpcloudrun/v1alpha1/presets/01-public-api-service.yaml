apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: public-api
spec:
  region: us-central1
  containers:
    - image: us-docker.pkg.dev/my-project/my-repo/api:1.0.0 # replace with your image
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
        # Boost CPU during startup — cuts cold-start latency for JIT-heavy
        # runtimes (JVM, .NET) at no idle cost.
        startupCpuBoost: true
      startupProbe:
        periodSeconds: 5
        httpGet:
          path: /healthz
  scaling:
    minInstanceCount: 0 # scale to zero — the service costs nothing while idle
    maxInstanceCount: 20 # the cost/overload circuit breaker
  # Public HTTP API: unauthenticated callers reach the service through an
  # allUsers run.invoker grant.
  allowUnauthenticated: true
  ingress: INGRESS_TRAFFIC_ALL
  executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  deletionProtection: false # flip to true (or omit — true is the default) for anything real
