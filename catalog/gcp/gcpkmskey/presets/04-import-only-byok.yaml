apiVersion: gcp.planton.dev/v1alpha1
kind: GcpKmsKey
metadata:
  name: byok-import-key
spec:
  keyRingId:
    valueFrom:
      kind: GcpKmsKeyRing
      name: byok-keys
      fieldPath: status.outputs.key_ring_id
  keyName: byok-import-key # replace — permanent, never reusable within the ring
  # The BYOK container contract: GCP never generates material for this
  # key. Both flags are required together — an auto-generated initial
  # version would violate the import-only guarantee.
  importOnly: true
  skipInitialVersionCreation: true
  versionTemplate:
    algorithm: GOOGLE_SYMMETRIC_ENCRYPTION
