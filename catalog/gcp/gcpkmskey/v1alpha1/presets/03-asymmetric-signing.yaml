apiVersion: gcp.planton.dev/v1alpha1
kind: GcpKmsKey
metadata:
  name: artifact-signing-key
spec:
  keyRingId:
    valueFrom:
      kind: GcpKmsKeyRing
      name: signing-keys
      fieldPath: status.outputs.key_ring_id
  keyName: artifact-signing-key # replace — permanent, never reusable within the ring
  # Asymmetric keys never auto-rotate: signature verifiers pin specific
  # key versions, so rotation is a deliberate, coordinated act.
  purpose: ASYMMETRIC_SIGN
  versionTemplate:
    algorithm: EC_SIGN_P256_SHA256
