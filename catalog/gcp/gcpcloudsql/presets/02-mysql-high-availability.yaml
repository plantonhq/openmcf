apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSql
metadata:
  name: my-mysql-ha
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  instanceName: app-mysql-ha
  region: us-central1
  databaseEngine: MYSQL
  databaseVersion: MYSQL_8_0
  tier: db-custom-2-7680
  availabilityType: REGIONAL
  disk:
    sizeGb: 50
    autoResize: true
  network:
    # Public IP with NO authorized networks: reachable only through the
    # Cloud SQL Auth Proxy or connectors (IAM-authenticated) — a safe
    # pattern that needs no VPC plumbing.
    ipv4Enabled: true
    sslMode: ENCRYPTED_ONLY
  backup:
    enabled: true
    startTime: "02:00"
    # MySQL's point-in-time-recovery mechanism (and the HA prerequisite).
    binaryLogEnabled: true
    retainedBackups: 14
  maintenanceWindow:
    day: 6 # Saturday
    hour: 4
    updateTrack: stable
  insightsConfig:
    queryInsightsEnabled: true
  deletionProtection: true
  rootPassword: ChangeMe-MySQL-Password1! # replace, then rotate after first deploy
