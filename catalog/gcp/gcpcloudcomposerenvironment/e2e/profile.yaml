apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudcomposerenvironment
spec:
  # Composed scenario: installs the VPC -> subnetwork chain, then creates
  # a small Composer 3 environment. Composer assembles a GKE cluster,
  # Cloud SQL database, web server, and DAG bucket behind the resource —
  # creates run 25-45 minutes and destroys ~10-15 minutes, so a batch
  # run for both engines needs >=240m.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]  # live-proven 2026-08-12: full lifecycle + apply-idempotency on both engines
  timeout_minutes: 240
