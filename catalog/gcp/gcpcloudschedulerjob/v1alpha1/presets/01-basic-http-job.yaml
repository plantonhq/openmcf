apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSchedulerJob
metadata:
  name: uptime-ping
spec:
  # Omitted projectId: the job lands in the provider's default project.
  # Omitted jobName: the job takes its name from metadata.name.
  location: us-central1
  # Unix-cron, interpreted in Etc/UTC unless timeZone is set:
  # every 5 minutes.
  schedule: "*/5 * * * *"
  httpTarget:
    uri: https://status.example.com/healthz # replace with your endpoint
    httpMethod: GET
