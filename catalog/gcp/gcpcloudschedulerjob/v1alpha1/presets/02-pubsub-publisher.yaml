apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSchedulerJob
metadata:
  name: nightly-export-trigger
spec:
  location: us-central1
  # 02:00 UTC every night.
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  description: Publishes the nightly export trigger event
  pubsubTarget:
    # The designed composition: reference the topic resource so the job
    # publishes to it wherever it is deployed. topic_id resolves to the
    # fully qualified projects/{project}/topics/{name} path the API needs.
    topicName:
      valueFrom:
        kind: GcpPubSubTopic
        name: export-events
        fieldPath: status.outputs.topic_id
    # Base64 of {"action":"export"} — the message body consumers receive.
    data: eyJhY3Rpb24iOiJleHBvcnQifQ==
    attributes:
      source: cloud-scheduler
      type: nightly-export
  retryConfig:
    retryCount: 3
    maxDoublings: 3
