apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudComposerUserWorkloadsSecret
metadata:
  name: payments-api-credentials
spec:
  # project_id omitted: falls back to the provider's default project.
  region: us-central1

  environment:
    valueFrom:
      kind: GcpCloudComposerEnvironment
      name: prod-airflow # replace with your environment resource name
      fieldPath: status.outputs.environment_name

  secretName: payments-api-credentials

  # Values MUST be base64-encoded (echo -n 'value' | base64).
  data:
    # base64 of "sk-live-4f9a2b7c8d1e"
    api-key: c2stbGl2ZS00ZjlhMmI3YzhkMWU=
    # base64 of "whsec-91c3e5a7f2b4"
    webhook-secret: d2hzZWMtOTFjM2U1YTdmMmI0
