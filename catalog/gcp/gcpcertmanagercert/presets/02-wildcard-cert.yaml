apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCertManagerCert
metadata:
  name: my-wildcard-cert
spec:
  projectId:
    value: "<gcp-project-id>"
  managed:
    # One authorization for example.com covers BOTH entries below — the
    # apex and its wildcard. Realistic sample domains (pattern-validated
    # field); replace with your own.
    domains:
      - example.com
      - "*.example.com"
    dnsAuthorizations:
      - valueFrom:
          kind: GcpCertManagerDnsAuthorization
          name: <dns-authorization-resource-name>
          fieldPath: status.outputs.authorization_id
