# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name (region, description, labels,
# source_contents, service_account, call_log_level,
# execution_history_level, user_env_vars, deletion_protection, and
# deletion_policy all auto-match that way). Every exclusion carries its
# reason: omission is a decision, never an accident.

resources:
  google_workflows_workflow:
    mappings:
      # The workflow name defaults from metadata.name; the spec names it
      # for what it is.
      - spec: spec.workflow_name
        arg: name

      - spec: spec.project_id
        arg: project

      # The spec names the CMEK lever for what it references; the provider
      # suffixes _name.
      - spec: spec.crypto_key
        arg: crypto_key_name

      # The provider's `tags` argument is the resource-manager tag system
      # (tagKeys/{id} -> tagValues/{id}) -- the spec names it precisely to
      # keep it distinct from labels.
      - spec: spec.resource_manager_tags
        arg: tags
    exclusions:
      - arg: name_prefix
        reason: >-
          Versioned-name rotation is the catalog pattern; without hardcoded
          create-before-destroy semantics the argument is a dead lever
          (the established catalog judgment for name_prefix arguments).

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      workflows.googleapis.com with fixed arguments (disable_on_destroy
      false so destroying one workflow never disables Workflows
      project-wide); not spec surface.
