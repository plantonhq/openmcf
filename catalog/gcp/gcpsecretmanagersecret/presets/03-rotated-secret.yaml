apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSecretManagerSecret
metadata:
  name: rotated-api-key
spec:
  initialVersion:
    data:
      value: replace-with-real-secret
  rotation:
    rotationPeriod: 2592000s
    nextRotationTime: "2026-09-01T00:00:00Z"
  topics:
    - value: projects/my-project/topics/secret-rotation
  versionDestroyTtl: 604800s
  versionAliases:
    current: "1"
