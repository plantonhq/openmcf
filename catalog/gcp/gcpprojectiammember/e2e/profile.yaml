apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpprojectiammember
spec:
  # First composed GCP topology under live E2E: the harness deploys a
  # GcpServiceAccount and a GcpIamCustomRole prerequisite, resolves the grant's
  # member and role references from their outputs, then runs deploy ->
  # getIamPolicy verify -> destroy -> verify the (role, member) pair is gone.
  # The additive grant never touches other bindings in the test project.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
