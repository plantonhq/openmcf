apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiIndex
metadata:
  name: eval-ground-truth
spec:
  location: us-central1
  displayName: Eval Ground Truth
  # A brute-force index is the recall yardstick: exact search over a
  # sample corpus produces the ground-truth neighbors an approximate
  # (tree-AH) index is measured against.
  contentsDeltaUri: gs://ml-embeddings/eval-sample/
  config:
    dimensions: 768
    distanceMeasureType: DOT_PRODUCT_DISTANCE
    featureNormType: UNIT_L2_NORM
    # Exact search: perfect recall, linear query cost. No tuning knobs —
    # presence of the block selects the algorithm.
    bruteForceConfig: {}
  labels:
    team: ml-platform
    purpose: evaluation
