apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiIndex
metadata:
  name: catalog-embeddings
spec:
  location: us-central1
  displayName: Catalog Embeddings
  # BATCH_UPDATE (GCP's default, stated here for clarity): contents are
  # rebuilt in bulk from Cloud Storage — cheaper per GB than streaming,
  # suited to corpora refreshed on a schedule.
  indexUpdateMethod: BATCH_UPDATE
  # Cloud Storage DIRECTORY of embedding files (format:
  # https://cloud.google.com/vertex-ai/docs/vector-search/setup/format-structure).
  # Write-only upstream: GCP never reports it back, so out-of-band loads
  # show as a one-field diff on the next plan — expected, not drift.
  contentsDeltaUri: gs://ml-embeddings/catalog/
  config:
    dimensions: 768
    approximateNeighborsCount: 100
    # Pinned shard size: immutable, so size it for the corpus you expect,
    # not the one you have today (MEDIUM = 20 GB per shard).
    shardSize: SHARD_SIZE_MEDIUM
    treeAhConfig:
      leafNodeEmbeddingCount: 1000
      leafNodesToSearchPercent: 10
  labels:
    team: search
