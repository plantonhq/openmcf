apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpfilestoreinstance
spec:
  # BASIC_HDD creates in ~5-12 minutes — under the plan-only threshold, so
  # the kind is proven live end to end on the chained VPC (DIRECT_PEERING).
  # Instance names carry ${E2E_RUN_ID}: deletes finalize asynchronously,
  # so reruns must never collide with a draining predecessor. ENTERPRISE/
  # REGIONAL tiers, replication, and PSA/PSC connect modes are proven
  # offline (cost + slow provisioning).
  tier: 1
  # The prior green predates the current spec shape (LDAP directory
  # services, PSC endpoint project, per-export network, BackupDR restore,
  # desired_replica_state sent explicitly, deletion_policy modeled from
  # the spec instead of the Pulumi-side DELETE pin) — awaits live
  # re-proof.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 40
