apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFilestoreInstance
metadata:
  name: prod-nfs
spec:
  projectId:
    value: acme-prod-project # replace with your GCP project id
  location: us-central1 # replace — a REGION for ENTERPRISE/REGIONAL tiers
  tier: ENTERPRISE
  description: Production shared NFS with regional HA
  # The destroy guard: the instance cannot be deleted until this is
  # deliberately flipped false.
  deletionProtectionEnabled: true
  deletionProtectionReason: "production data -- disable protection before destroying"
  fileShare:
    name: data
    capacityGb: 1024 # tier minimum; grow in place as data grows
    nfsExportOptions:
      # Only RFC1918 clients may mount, and root on clients is squashed
      # to the anonymous user.
      - ipRanges:
          - 10.0.0.0/8
        accessMode: READ_WRITE
        squashMode: ROOT_SQUASH
  networkConfig:
    # Reference your VPC resource; its self link output wires in here.
    network:
      valueFrom:
        kind: GcpVpcNetwork
        name: prod-vpc
    # Required for Shared VPC consumers; rides the VPC's existing
    # service-networking connection.
    connectMode: PRIVATE_SERVICE_ACCESS
  labels:
    team: platform # replace with your cost-attribution labels
    criticality: high
