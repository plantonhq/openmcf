<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Contract document (the schema definition) -->
  <rect x="3" y="1" width="10" height="14" rx="1" fill="#4285F4" opacity="0.9"/>
  <rect x="3" y="1" width="10" height="14" rx="1" stroke="#1967D2" stroke-width="0.5" fill="none"/>

  <!-- Record fields: the contract's shape -->
  <line x1="5" y1="4" x2="11" y2="4" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="5" y1="6" x2="9.5" y2="6" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="5" y1="8" x2="10.5" y2="8" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Pub/Sub family mark: message nodes flowing through the contract -->
  <g>
    <circle cx="5.2" cy="11.5" r="1" fill="#FFFFFF"/>
    <circle cx="8" cy="12.5" r="1" fill="#FFFFFF" opacity="0.85"/>
    <line x1="5.9" y1="11.9" x2="7.3" y2="12.3" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>

  <!-- Validation checkmark: messages conform or are rejected -->
  <g transform="translate(9.5, 10.5)">
    <circle cx="2" cy="2" r="2" fill="#34A853"/>
    <path d="M 0.8 2 L 1.6 2.8 L 3.2 1.2" stroke="#FFFFFF" stroke-width="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
