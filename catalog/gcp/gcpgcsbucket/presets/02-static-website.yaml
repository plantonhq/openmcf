apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGcsBucket
metadata:
  name: static-site
spec:
  bucketName: acme-static-site-prod # replace — globally unique across ALL of GCP
  location: US # multi-region: serve globally from one namespace
  uniformBucketLevelAccessEnabled: true
  # Public serving requires the org policy to allow it; "inherited" leaves
  # the decision to the org while the explicit allUsers grant below makes
  # the bucket readable.
  publicAccessPrevention: inherited
  website:
    mainPageSuffix: index.html
    notFoundPage: 404.html
  corsRules:
    # Browsers fetch fonts/assets cross-origin from the app's domain.
    - origins:
        - https://app.example.com # replace with your application origin
      methods:
        - GET
        - HEAD
      responseHeaders:
        - Content-Type
      maxAgeSeconds: 3600
  iamMembers:
    # Public read of objects — the grant that makes the site serve.
    - role: roles/storage.objectViewer
      member:
        value: allUsers
  labels:
    team: web # replace with your cost-attribution labels
