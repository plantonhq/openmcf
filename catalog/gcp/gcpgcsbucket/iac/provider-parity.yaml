# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_storage_bucket:
    mappings:
      # Renames: the spec says what the field IS (a bucket name, a project),
      # where the provider inherits terser API names.
      - spec: spec.bucket_name
        arg: name
      - spec: spec.project_id
        arg: project
      - spec: spec.uniform_bucket_level_access_enabled
        arg: uniform_bucket_level_access
      # Single-flag blocks flattened to booleans: the provider nests one
      # enabled flag inside a block; the spec models the flag directly.
      - spec: spec.versioning_enabled
        arg: versioning.enabled
      - spec: spec.hierarchical_namespace_enabled
        arg: hierarchical_namespace.enabled
      # The one-field encryption block flattened to the key reference.
      - spec: spec.kms_key_name
        arg: encryption.default_kms_key_name
      # Repeated-message fields are plural per proto style; provider blocks
      # are singular. Exact matching resumes below each subtree mapping.
      - spec: spec.lifecycle_rules
        arg: lifecycle_rule
      - spec: spec.lifecycle_rules.condition.age_days
        arg: lifecycle_rule.condition.age
      - spec: spec.cors_rules
        arg: cors
      - spec: spec.cors_rules.origins
        arg: cors.origin
      - spec: spec.cors_rules.methods
        arg: cors.method
      - spec: spec.cors_rules.response_headers
        arg: cors.response_header
      - spec: spec.retention_policy.retention_period_seconds
        arg: retention_policy.retention_period
    exclusions:
      # The provider's zero-vs-unset disambiguation flags. The spec's
      # optional numeric conditions carry presence natively (proto3
      # optional), and the module derives each flag from it (sends true
      # exactly when the condition is an explicit 0).
      - arg: lifecycle_rule.condition.send_age_if_zero
        reason: derived by the module from the optional age_days field's presence
      - arg: lifecycle_rule.condition.send_num_newer_versions_if_zero
        reason: derived by the module from the optional num_newer_versions field's presence
      - arg: lifecycle_rule.condition.send_days_since_noncurrent_time_if_zero
        reason: derived by the module from the optional days_since_noncurrent_time field's presence
      - arg: lifecycle_rule.condition.send_days_since_custom_time_if_zero
        reason: derived by the module from the optional days_since_custom_time field's presence

  google_storage_bucket_iam_member:
    # Instantiated per spec.iam_members entry (additive grants; the
    # authoritative iam_binding/iam_policy forms are deliberately not
    # modeled -- they clobber grants made elsewhere).
    specRoot: spec.iam_members
    exclusions:
      - arg: bucket
        reason: wired by the module to the bucket it creates -- never user surface

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables storage.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      bucket never disables the API project-wide); not spec surface.
