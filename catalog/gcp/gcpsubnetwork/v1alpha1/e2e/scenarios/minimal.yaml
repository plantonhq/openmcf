# Composed GcpSubnetwork scenario. The network is a value_from reference to
# the GcpVpcNetwork prerequisite (declared via prerequisites in the kind registry);
# the E2E harness deploys the VPC first and resolves the reference before the
# subnet is applied. project_id is omitted and rides the harness-exported
# GOOGLE_PROJECT. Subnet names are project-scoped with no soft-delete
# reservation, so the name stays fixed. Secondary ranges + flow logs exercise
# the deepened spec surface live.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpsnw-smoke
  id: planton-oss-e2e-gcpsnw-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpc-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: planton-oss-e2e-subnet
  region: us-central1
  ipCidrRange: 10.210.0.0/24
  description: Ephemeral subnet created by the Planton E2E harness; safe to delete
  privateIpGoogleAccess: true
  secondaryIpRanges:
    - rangeName: pods
      ipCidrRange: 10.211.0.0/24
    - rangeName: services
      ipCidrRange: 10.212.0.0/24
  logConfig:
    aggregationInterval: INTERVAL_5_MIN
    flowSampling: 0.1
    metadata: EXCLUDE_ALL_METADATA
