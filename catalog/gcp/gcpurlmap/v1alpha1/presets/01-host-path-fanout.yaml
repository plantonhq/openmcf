apiVersion: gcp.planton.dev/v1alpha1
kind: GcpUrlMap
metadata:
  name: host-path-fanout
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Fan out www.example.com by path prefix to API and static backends
  defaultService:
    value: "<web-backend-self-link>" # replace: catch-all backend service
  hostRules:
    - hosts:
        - www.example.com
        - example.com
      pathMatcher: site
      description: Primary site hosts
  pathMatchers:
    - name: site
      defaultService:
        value: "<web-backend-self-link>" # replace: same catch-all
      pathRules:
        - paths:
            - /api/*
          service:
            value: "<api-backend-self-link>" # replace: API backend service
        - paths:
            - /static/*
          service:
            value: "<static-bucket-self-link>" # replace: static backend bucket
