apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubTopic
metadata:
  name: transaction-events
spec:
  topicName: transaction-events
  # Topic-level retention: any subscription can seek back through the
  # last 7 days, independent of its own retention settings — the replay
  # lever for reprocessing after a consumer bug.
  messageRetentionDuration: "604800s"
