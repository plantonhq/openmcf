apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamDenyPolicy
metadata:
  name: guard-secret-access
spec:
  displayName: Guard break-glass secret access
  rules:
    - description: Nobody reads secret versions except the break-glass account
      denyRule:
        deniedPrincipals:
          - principalSet://goog/public:all
        exceptionPrincipals:
          - principal://iam.googleapis.com/projects/-/serviceAccounts/break-glass@my-project.iam.gserviceaccount.com
        deniedPermissions:
          - secretmanager.googleapis.com/versions.access
  deletionPolicy: PREVENT
