apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpalloydbcluster
spec:
  # Composed scenarios: the registry installs the full private-services-access
  # chain before every cluster create. AlloyDB primary clusters are slow
  # (~10–20 min each); run the package with a generous go test -timeout.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
