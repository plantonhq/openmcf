apiVersion: gcp.planton.dev/v1alpha1
kind: GcpAlloydbCluster
metadata:
  name: my-enterprise-alloydb
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  clusterName: enterprise-alloydb # replace with your cluster name
  location: us-central1 # replace with your region
  network:
    value: projects/my-gcp-project-123/global/networks/prod-vpc # replace with your VPC path
  kmsKeyName:
    value: projects/my-gcp-project-123/locations/us-central1/keyRings/data-kr/cryptoKeys/alloydb-key # replace with your KMS key
  initialUser:
    user: postgres
    password: change-me-immediately # replace before applying
  automatedBackupPolicy:
    enabled: true
    timeBasedRetentionPeriod: "2592000s"
    encryptionKmsKeyName:
      value: projects/my-gcp-project-123/locations/us-central1/keyRings/data-kr/cryptoKeys/backup-key # replace with your backup KMS key
  continuousBackupConfig:
    enabled: true
    recoveryWindowDays: 21
    encryptionKmsKeyName:
      value: projects/my-gcp-project-123/locations/us-central1/keyRings/data-kr/cryptoKeys/pitr-key # replace with your PITR KMS key
  maintenanceWindow:
    day: SUNDAY
    startHour: 3
  primaryInstance:
    instanceId: enterprise-primary # replace with your instance ID
    cpuCount: 8
    availabilityType: REGIONAL
    sslMode: ENCRYPTED_ONLY
    requireConnectors: true
    queryInsightsConfig:
      queryPlansPerMinute: 5
      queryStringLength: 1024
      recordApplicationTags: true
      recordClientAddress: true
