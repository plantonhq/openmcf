apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunJob
metadata:
  name: nightly-etl
spec:
  region: us-central1
  template:
    containers:
      - image: us-docker.pkg.dev/my-project/my-repo/etl:1.0.0 # replace with your image
        args:
          - --mode=full
        resources:
          cpu: "2"
          memory: 2Gi
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: 3600
    maxRetries: 0
  taskCount: 1
  deletionProtection: false
