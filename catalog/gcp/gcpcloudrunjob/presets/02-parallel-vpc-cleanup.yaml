apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunJob
metadata:
  name: vpc-cleanup
spec:
  region: us-central1
  template:
    containers:
      - image: us-docker.pkg.dev/my-project/my-repo/cleanup:1.0.0
        env:
          - name: API_TOKEN
            valueFromSecret:
              secret: cleanup-api-token
              version: latest
        resources:
          cpu: "1"
          memory: 512Mi
    vpcAccess:
      networkInterfaces:
        - subnetwork:
            valueFrom:
              name: private-subnet
      egress: PRIVATE_RANGES_ONLY
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: 600
    maxRetries: 2
  taskCount: 10
  parallelism: 5
  deletionProtection: false
