apiVersion: gcp.planton.dev/v1alpha1
kind: GcpLoggingSink
metadata:
  name: audit-to-bigquery
spec:
  destination:
    bigqueryDataset:
      value: projects/my-project/datasets/audit_logs
    usePartitionedTables: true
  filter: logName:"cloudaudit.googleapis.com"
  description: Audit trail queryable in SQL for forensics
