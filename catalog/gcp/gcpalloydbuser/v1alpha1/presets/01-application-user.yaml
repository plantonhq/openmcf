apiVersion: gcp.planton.dev/v1alpha1
kind: GcpAlloydbUser
metadata:
  name: my-orders-app-user
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  cluster:
    valueFrom:
      kind: GcpAlloydbCluster
      name: my-orders-cluster
      fieldPath: status.outputs.cluster_id
  userId: orders-app
  password: ChangeMe-App-Password1! # replace with a generated secret
  databaseRoles:
    - alloydbiamuser
