apiVersion: gcp.planton.dev/v1alpha1
kind: GcpMemorystoreInstance
metadata:
  name: my-enterprise-memorystore
spec:
  instanceName: my-enterprise-memorystore
  location: us-central1

  # Large sharded cluster: 5 shards × (1 primary + 2 replicas).
  shardCount: 5
  mode: CLUSTER
  nodeType: HIGHMEM_XLARGE
  replicaCount: 2

  # Clients authenticate with GCP IAM credentials — no shared passwords.
  authorizationMode: IAM_AUTH
  transitEncryptionMode: SERVER_AUTHENTICATION

  # Customer-managed encryption at rest. Reference the GcpKmsKey so the
  # key resource ID resolves automatically.
  kmsKey:
    valueFrom:
      kind: GcpKmsKey
      name: memorystore-cmek
      fieldPath: status.outputs.key_id

  engineConfigs:
    maxmemory-policy: volatile-lru

  # AOF with per-second fsync: strongest practical durability for an
  # in-memory store (at most ~1s of writes lost on a crash).
  persistenceConfig:
    mode: AOF
    aofConfig:
      appendFsync: EVERY_SEC

  zoneDistributionConfig:
    mode: MULTI_ZONE

  maintenancePolicy:
    weeklyMaintenanceWindow:
      day: SUNDAY
      hour: 3

  # Daily backups at 02:00 UTC, retained 35 days — the backup collection
  # these land in surfaces on outputs for seeding new instances.
  automatedBackupConfig:
    startHour: 2
    retention: "3024000s"

  pscAutoConnections:
    - network:
        valueFrom:
          kind: GcpVpcNetwork
          name: prod-vpc
          fieldPath: status.outputs.network_id
      projectId:
        value: my-gcp-project-123 # replace with your project ID

  deletionProtectionEnabled: true
