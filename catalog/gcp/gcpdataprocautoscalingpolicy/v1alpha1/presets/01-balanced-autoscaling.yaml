apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDataprocAutoscalingPolicy
metadata:
  name: balanced-autoscaling
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  policyId: balanced-autoscaling
  location: us-central1

  # Primary workers: a stable base of 2-10 on-demand nodes.
  workerConfig:
    maxInstances: 10
    minInstances: 2
    weight: 1

  # Secondary (spot) workers: equal weight — new capacity splits evenly
  # between the two groups.
  secondaryWorkerConfig:
    maxInstances: 10
    minInstances: 0
    weight: 1

  basicAlgorithm:
    cooldownPeriod: "120s"
    yarnConfig:
      # 30 minutes for running tasks to finish before scale-down
      # removes a worker.
      gracefulDecommissionTimeout: "1800s"
      # Moderate factors: act on half the suggested change per
      # evaluation — responsive without thrashing.
      scaleUpFactor: 0.5
      scaleDownFactor: 0.5
