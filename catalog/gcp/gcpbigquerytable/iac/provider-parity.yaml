# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_bigquery_table:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names.
      - spec: spec.project_id
        arg: project

      # CMEK: the provider wraps the key in a one-field block; the spec
      # carries the key reference directly.
      - spec: spec.kms_key_name
        arg: encryption_configuration.kms_key_name

      # Bigtable external data: the spec pluralizes the repeated blocks
      # the provider names in the singular (both are unbounded lists);
      # children match by name below each mapping, with the inner list
      # mapped at its own (longer) prefix.
      - spec: spec.external_data_configuration.bigtable_options.column_families
        arg: external_data_configuration.bigtable_options.column_family
      - spec: spec.external_data_configuration.bigtable_options.column_families.columns
        arg: external_data_configuration.bigtable_options.column_family.column

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      bigquery.googleapis.com with fixed arguments (disable_on_destroy
      false so destroying one table never disables the API project-wide);
      not spec surface.
