apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigQueryTable
metadata:
  name: my-events-table
spec:
  # project_id omitted: falls back to the provider's default project.
  datasetId:
    valueFrom:
      kind: GcpBigQueryDataset
      name: my-analytics-dataset # replace with your dataset resource name
      fieldPath: status.outputs.dataset_id
  tableId: events_raw # replace; letters, numbers, underscores only
  description: Append-only event stream, day-partitioned and clustered
  schema: '[{"name":"event_time","type":"TIMESTAMP","mode":"REQUIRED"},{"name":"customer_id","type":"INT64"},{"name":"event_type","type":"STRING"},{"name":"payload","type":"JSON"}]'
  # Day partitions on event_time: queries filtering on the partition column
  # scan (and bill for) only the matching days.
  timePartitioning:
    type: DAY
    field: event_time
    expirationMs: 31536000000 # drop partitions after 365 days
  # Cluster within each partition by the hottest filter columns.
  clustering:
    - customer_id
    - event_type
  # Cost guard: every query must carry a partition filter.
  requirePartitionFilter: true
  labels:
    team: analytics # replace with your owning team
