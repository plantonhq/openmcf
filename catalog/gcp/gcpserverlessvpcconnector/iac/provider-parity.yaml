# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_vpc_access_connector:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names.
      - spec: spec.connector_name
        arg: name
      - spec: spec.project_id
        arg: project
    exclusions:
      # The legacy throughput-based scaling contract. The provider documents
      # both args as ConflictsWith the modeled instance-count fields and
      # says their use "is discouraged in favor of" instances; they are also
      # ForceNew where the instance counts update in place. Modeling both
      # axes would ship a contradiction-inviting lever on the same fleet.
      - arg: min_throughput
        reason: >-
          legacy scaling axis -- provider-documented ConflictsWith
          min_instances ("Only one of 'min_throughput' and 'min_instances'
          can be specified. The use of min_throughput is discouraged in
          favor of min_instances") and ForceNew; the spec models the
          recommended instance-based contract, which the API derives
          throughput from
      - arg: max_throughput
        reason: >-
          legacy scaling axis -- provider-documented ConflictsWith
          max_instances ("Only one of 'max_throughput' and 'max_instances'
          can be specified. The use of max_throughput is discouraged in
          favor of max_instances") and ForceNew; the spec models the
          recommended instance-based contract, which the API derives
          throughput from

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables vpcaccess.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      connector never disables the API project-wide); not spec surface.
