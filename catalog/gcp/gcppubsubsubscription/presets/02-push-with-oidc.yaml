apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubSubscription
metadata:
  name: webhook-delivery
spec:
  subscriptionName: webhook-delivery
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: user-events
      fieldPath: status.outputs.topic_id
  ackDeadlineSeconds: 30
  pushConfig:
    # Reference the consumer Cloud Run service directly — its URL contains a
    # generated suffix that only exists after the service deploys, so the
    # reference is the only reliable wiring (and it orders this subscription
    # after the service). A literal HTTPS URL also works for external endpoints.
    pushEndpoint:
      valueFrom:
        kind: GcpCloudRun
        name: my-app
        fieldPath: status.outputs.url
    oidcToken:
      # Reference the invoker identity; the FK resolves to its email.
      # The deployer must hold iam.serviceAccounts.actAs on this account,
      # and the account needs roles/run.invoker on the consumer service.
      serviceAccountEmail:
        valueFrom:
          kind: GcpServiceAccount
          name: push-invoker
          fieldPath: status.outputs.email
      # audience is omitted deliberately: it defaults to the push endpoint
      # URL, which is exactly the audience Cloud Run expects.
