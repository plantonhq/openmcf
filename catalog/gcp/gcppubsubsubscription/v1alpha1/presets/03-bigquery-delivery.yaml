apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubSubscription
metadata:
  name: analytics-bq-sink
spec:
  subscriptionName: analytics-bq-sink
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: click-events
      fieldPath: status.outputs.topic_id
  bigqueryConfig:
    # Reference the table resource; the FK resolves to the dotted
    # {project}.{dataset}.{table} form the Pub/Sub API expects.
    table:
      valueFrom:
        kind: GcpBigQueryTable
        name: click-events-raw
        fieldPath: status.outputs.qualified_name
    # Map message fields to table columns using the topic's schema.
    useTopicSchema: true
    # Fields absent from the table schema are dropped instead of
    # blocking the write.
    dropUnknownFields: true
    # Write subscription_name/message_id/publish_time/attributes columns.
    writeMetadata: true
