# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpcloudarmorpolicy
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A security policy is a configuration object -- prioritized rules evaluated at Google's edge; it stores no customer data and exposes no at-rest encryption surface.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No at-rest data surface to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: Transport encryption is the attached load balancer's control -- the policy evaluates requests the load balancer has already terminated and neither carries nor configures TLS itself.
    - control_id: no-public-access
      status: not_applicable
      notes: The policy is a configuration object with no endpoint of its own -- it exists precisely to guard the public endpoints of the load balancers that attach it.
    - control_id: restricted-ingress
      status: configurable
      field_path: rules
      evidence:
        type: spec_default
        reference: Rules with versioned_expr SRC_IPS_V1 restrict inbound traffic to declared CIDR allowlists for every backend attaching the policy; an empty rule set (the API's automatic allow-all default) restricts nothing.
      notes: The 01-basic-ip-allowlist preset allows only corporate ranges and default-denies everything else with deny(403) at priority 2147483647.
    - control_id: edge-protection
      status: configurable
      field_path: rules
      evidence:
        type: spec_default
        reference: The policy IS the request filter -- rules with evaluatePreconfiguredWaf expressions apply Google's preconfigured OWASP rule sets (SQLi, XSS, RCE, LFI), IP and CEL matches gate sources, and rate_limit_options throttle or ban abusers. An empty rule set means the API's default allow-all rule and no filtering.
      notes: "The 03-waf-owasp-protection preset blocks sqli-v33-stable and xss-v33-stable; adaptive_protection_config adds Layer 7 DDoS detection on top. The protection reaches traffic only for backends that attach the policy -- attachment lives on the backend service, outside this spec."
    - control_id: rbac
      status: not_applicable
      notes: Management access is project IAM posture (compute security-admin roles), not a component choice; the policy exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The policy runs no workloads and holds no credentials; reCAPTCHA site keys it references are public client identifiers, not secret material.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The policy has no authentication plane -- there is no legacy path to disable.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Administrative changes to the policy and its rules land in Cloud Audit Logs unconditionally; per-request Cloud Armor verdicts ride the attached load balancer's request logs.
      notes: advanced_options_config.log_level=VERBOSE (the 03-waf-owasp-protection preset) adds matched-rule and request detail to those verdict logs, and rule-level preview=true logs matches without enforcing.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Armor exports per-policy request and enforcement metrics to Cloud Monitoring without configuration.
      notes: adaptive_protection_config.enable_layer_7_ddos_defense (the 03 preset) adds traffic-anomaly detection and attack alerts on top of the base metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: The policy is declarative configuration recreated from source control; there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Enforcement happens at Google's global edge fleet -- the policy has no zonal footprint, and single-zone operation is unrepresentable.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- destroy removes the policy and every rule, leaving the traffic it filtered unprotected once detached. PREVENT makes the destroy fail; ABANDON leaves the policy enforcing in GCP unmanaged. The API itself additionally refuses deletion while any backend service still attaches the policy.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Google operates and patches the edge enforcement fleet and publishes the versioned preconfigured WAF rule sets; no customer-visible patch surface exists on the policy.
      notes: Rules pin a rule-set version (e.g. sqli-v33-stable) -- adopting a newer set is a deliberate rule edit, not an automatic upgrade.
