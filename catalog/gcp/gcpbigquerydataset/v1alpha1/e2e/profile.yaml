apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpbigquerydataset
spec:
  # Two scenarios: a minimal US dataset with default access, and an explicit
  # authoritative ACL with projectOwners/projectReaders entries. BigQuery
  # datasets delete immediately when empty (no soft-delete reservation).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
