apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigQueryDataset
metadata:
  name: my-analytics-dataset
spec:
  # project_id omitted: falls back to the provider's default project.
  # Add a projectId value or valueFrom ref to target another project.
  datasetId: analytics_prod # replace; letters, numbers, underscores only
  location: US # multi-regional; use a region (e.g. us-central1) for residency
  labels:
    team: analytics # replace with your owning team
