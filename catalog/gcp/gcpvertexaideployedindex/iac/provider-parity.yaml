# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_vertex_ai_index_endpoint_deployed_index:
    mappings:
      # The Vertex AI API host is regional; the spec calls the field what
      # it is across the family (location), the provider says region.
      - spec: spec.location
        arg: region
      # The spec flattens the provider's single-child machine_spec
      # wrapper: the machine type IS the machine spec.
      - spec: spec.dedicated_resources.machine_type
        arg: dedicated_resources.machine_spec.machine_type
      # The spec flattens the provider's single-child
      # deployedIndexAuthConfig.authProvider nesting to one honest
      # auth_config block. Matching resumes exactly below the subtree
      # (allowed_issuers, audiences).
      - spec: spec.auth_config
        arg: deployed_index_auth_config.auth_provider
