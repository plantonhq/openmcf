apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpvertexaideployedindex
spec:
  # Composed scenario: the chain creates a streaming index (~10-60m) and
  # a public endpoint (~2m) before the deploy itself (up to 45m, undeploy
  # up to 20m). A batch run for both engines needs >=360m. Automatic
  # sizing at min 1 replica keeps the serving cost floor minimal for the
  # deploy window.
  tier: 1
  # The prior green predates the current spec shape (deletion_policy
  # modeled from the spec instead of the Pulumi-side DELETE pin) —
  # awaits live re-proof.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 240
