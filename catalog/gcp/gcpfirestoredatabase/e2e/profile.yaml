apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpfirestoredatabase
spec:
  # Leaf scenario: a named Native-mode database with delete protection
  # disabled (E2E must destroy). Database names are project-scoped and
  # deleted names are reserved for a retention window, so the cloud-side
  # name carries ${E2E_RUN_ID}. Creates in ~1-2 minutes.
  tier: 1
  # pending_proof: the spec grew the ENTERPRISE data-access modes (a new
  # enterprise scenario arms them), resource-manager tags, and a modeled
  # deletion_policy — the prior green proof describes code that no longer
  # exists.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
