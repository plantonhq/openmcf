apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFirestoreDatabase
metadata:
  name: default-firestore
spec:
  # The special "(default)" database — what Firestore client libraries
  # connect to when no database ID is given. One per project.
  databaseName: (default)
  locationId: nam5 # US multi-region; use eur3 for Europe
  type: FIRESTORE_NATIVE
  # GCP's default is unprotected — the preset takes the production-safe
  # position the moment the primary database exists.
  deleteProtectionState: DELETE_PROTECTION_ENABLED
