syntax = "proto3";

package dev.planton.gcp.gcpbigtabletable.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbigtabletable/v1alpha1/spec.proto";
import "catalog/gcp/gcpbigtabletable/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//gcp-bigtable-table
message GcpBigtableTable {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpBigtableTable'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpBigtableTableSpec spec = 4 [(buf.validate.field).required = true];
  GcpBigtableTableStatus status = 5;
}

message GcpBigtableTableStatus {
  GcpBigtableTableStackOutputs outputs = 1;
}
