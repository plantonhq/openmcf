apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigtableTable
metadata:
  name: sensor-readings
spec:
  # Reference the GcpBigtableInstance so the instance name resolves
  # automatically.
  instance:
    valueFrom:
      kind: GcpBigtableInstance
      name: prod-bigtable
      fieldPath: status.outputs.instance_name

  # The classic time-series shape: one wide family for measurements with
  # age-based retention (Bigtable never garbage-collects without a
  # policy), one small family for slowly-changing metadata capped by
  # version count.
  columnFamilies:
    - family: measurements
      gcPolicy:
        maxAge: 2160h # 90 days of readings
    - family: meta
      gcPolicy:
        maxVersions: 1

  # Pre-split by key prefix so initial write load spreads across tablets
  # instead of hammering one server. Set at creation — changing splits
  # later REPLACES the table.
  splitKeys:
    - device2000
    - device4000
    - device6000
    - device8000
