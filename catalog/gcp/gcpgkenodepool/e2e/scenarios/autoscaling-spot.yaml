# Autoscaling Spot GcpGkeNodePool scenario: exercises the autoscaling sizing
# arm (scale-to-zero minimum, ANY location policy), Spot capacity, taints,
# Kubernetes node labels, explicit management/upgrade settings, kubelet
# hardening AND tuning (soft-eviction trio, crash-loop backoff, image GC
# ages), drain pacing on deletion, an explicit deletion policy, and cgroup
# v2 — the depth surface of the expanded spec, live on the prerequisite
# cluster.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeNodePool
metadata:
  name: planton-oss-e2e-gkenp-spot
  id: planton-oss-e2e-gkenp-spot
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpgkenodepool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  clusterName:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.name
  location:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.location
  nodePoolName: planton-oss-e2e-spot-pool
  # Start with one node (the API's default initial size of 3 would exceed
  # maxNodes); the autoscaler owns the size from then on.
  initialNodeCount: 1
  autoscaling:
    minNodes: 0
    maxNodes: 2
    locationPolicy: ANY
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    maxSurge: 1
    maxUnavailable: 0
  # Explicit destroy stance and drain pacing: the destroy-verified phase
  # proves the pool deletes cleanly with PDB respect armed.
  deletionPolicy: DELETE
  nodeDrainConfig:
    graceTerminationDuration: "60s"
    pdbTimeoutDuration: "600s"
    respectPdbDuringNodePoolDeletion: true
  nodeConfig:
    machineType: e2-standard-2
    diskSizeGb: 50
    diskType: pd-balanced
    spot: true
    labels:
      workload-class: batch
    taints:
      - key: workload-class
        value: batch
        effect: NO_SCHEDULE
    shieldedInstanceConfig:
      enableSecureBoot: true
    kubeletConfig:
      insecureKubeletReadonlyPortEnabled: "FALSE"
      podPidsLimit: 4096
      # The expanded tuning families, one representative each: eviction
      # (threshold + grace + reclaim as a coherent trio), restart backoff,
      # and age-based image GC.
      evictionSoft:
        memoryAvailable: 200Mi
      evictionSoftGracePeriod:
        memoryAvailable: "90s"
      evictionMinimumReclaim:
        memoryAvailable: 100Mi
      crashLoopBackOff:
        maxContainerRestartPeriod: "300s"
      imageMinimumGcAge: "120s"
    linuxNodeConfig:
      cgroupMode: CGROUP_MODE_V2
