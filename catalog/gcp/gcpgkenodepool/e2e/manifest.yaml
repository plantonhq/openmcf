# Development manifest for GcpGkeNodePool — exercises a broad slice of the
# spec (autoscaling, spot, taints, labels, upgrade settings, kubelet tuning)
# against an existing cluster.
#
# Usage: planton tofu plan --manifest catalog/gcp/gcpgkenodepool/e2e/manifest.yaml
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeNodePool
metadata:
  name: hack-node-pool
  id: gkenp-hack-001
  org: planton-dev
  env: dev
spec:
  # project_id omitted: the pool lands in the provider's default project.
  clusterName:
    value: hack-gke-cluster
  location:
    value: us-central1
  nodePoolName: hack-batch-pool
  nodeLocations:
    - us-central1-a
    - us-central1-b
  autoscaling:
    minNodes: 0
    maxNodes: 5
    locationPolicy: ANY
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    maxSurge: 2
    maxUnavailable: 1
    strategy: SURGE
  nodeConfig:
    machineType: n2-standard-4
    diskSizeGb: 100
    diskType: pd-balanced
    imageType: COS_CONTAINERD
    spot: true
    labels:
      workload-class: batch
    taints:
      - key: workload-class
        value: batch
        effect: NO_SCHEDULE
    tags:
      - batch-nodes
    gcfsEnabled: true
    gvnicEnabled: true
    shieldedInstanceConfig:
      enableSecureBoot: true
    kubeletConfig:
      podPidsLimit: 4096
      insecureKubeletReadonlyPortEnabled: "FALSE"
