apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpsProxy
metadata:
  name: certificate-map-saas
spec:
  projectId:
    value: "<gcp-project-id>"
  description: SNI-scale frontend serving many customer domains from a certificate map
  urlMap:
    value: "<app-url-map-self-link>" # replace: the URL map routing to real backends
  certificateMap: "//certificatemanager.googleapis.com/projects/<gcp-project-id>/locations/global/certificateMaps/<map-name>" # replace: project and map name
  quicOverride: ENABLE
