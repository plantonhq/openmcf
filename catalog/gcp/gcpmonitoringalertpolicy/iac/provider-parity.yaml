# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name (the whole condition tree -- all six
# condition arms, aggregations, triggers, SQL schedules and tests --
# auto-matches that way). Every exclusion carries its reason: omission is a
# decision, never an accident.

resources:
  google_monitoring_alert_policy:
    mappings:
      - spec: spec.project_id
        arg: project

      # user_labels is the freeform metadata map -> the spec's labels (the
      # catalog-wide labels idiom, merged with platform attribution labels
      # by the modules).
      - spec: spec.labels
        arg: user_labels

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      monitoring.googleapis.com with fixed arguments (disable_on_destroy
      false so destroying one policy never disables monitoring
      project-wide); not spec surface.
