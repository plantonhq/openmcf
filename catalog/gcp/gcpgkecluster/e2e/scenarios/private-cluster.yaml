# Private GcpGkeCluster scenario: a REGIONAL Standard cluster with private
# nodes, a peering-based /28 control plane, NAMED secondary ranges from the
# consumer-scoped subnetwork, Dataplane V2, and a maintenance window — the
# production shape, exercising the ip_allocation named-range branch and the
# private_cluster_config block live. No node pools attach (control plane
# only), so no NAT is needed for the cluster itself to converge.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeCluster
metadata:
  name: planton-oss-e2e-gke-private
  id: planton-oss-e2e-gke-private
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpgkecluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral private regional GKE cluster created by the Planton E2E harness; safe to delete
  location: us-central1
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetwork:
    valueFrom:
      kind: GcpSubnetwork
      name: planton-oss-e2e-gcpsnw-gke-prereq
      fieldPath: status.outputs.subnetwork_self_link
  ipAllocation:
    clusterSecondaryRangeName:
      value: pods
    servicesSecondaryRangeName:
      value: services
  datapathProvider: ADVANCED_DATAPATH
  privateCluster:
    enablePrivateNodes: true
    masterIpv4CidrBlock: "172.16.0.16/28"
  maintenancePolicy:
    dailyWindow:
      startTime: "03:00"
  deletionProtection: false
