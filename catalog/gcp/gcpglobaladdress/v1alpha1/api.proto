syntax = "proto3";

package dev.planton.gcp.gcpglobaladdress.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpglobaladdress/v1alpha1/spec.proto";
import "catalog/gcp/gcpglobaladdress/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//gcp-global-address
message GcpGlobalAddress {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpGlobalAddress'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpGlobalAddressSpec spec = 4 [(buf.validate.field).required = true];
  GcpGlobalAddressStatus status = 5;
}

message GcpGlobalAddressStatus {
  GcpGlobalAddressStackOutputs outputs = 1;
}
