apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiNotebook
metadata:
  name: regulated-research
spec:
  location: us-central1-a
  # n2d (AMD) machine type: required for Confidential Computing (SEV).
  machineType: n2d-standard-4
  labels:
    team: research
    data-classification: restricted
  # No public IP: reachable only through the Vertex AI proxy or from
  # inside the VPC.
  disablePublicIp: true
  networkInterface:
    # The designed composition: reference the network nodes so the
    # notebook lands in them wherever they are deployed.
    network:
      valueFrom:
        kind: GcpVpcNetwork
        name: research-vpc
        fieldPath: status.outputs.network_self_link
    subnet:
      valueFrom:
        kind: GcpSubnetwork
        name: research-subnet
        fieldPath: status.outputs.subnetwork_self_link
  # Dedicated VM identity — never the default compute service account.
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: research-notebook
      fieldPath: status.outputs.email
  # CMEK on both disks, keyed to a referenced GcpKmsKey.
  bootDisk:
    diskType: PD_SSD
    diskSizeGb: 200
    kmsKey:
      valueFrom:
        kind: GcpKmsKey
        name: research-data-key
        fieldPath: status.outputs.key_id
  dataDisk:
    diskType: PD_BALANCED
    diskSizeGb: 500
    kmsKey:
      valueFrom:
        kind: GcpKmsKey
        name: research-data-key
        fieldPath: status.outputs.key_id
  shieldedInstanceConfig:
    enableSecureBoot: true
    enableVtpm: true
    enableIntegrityMonitoring: true
  # Guest memory encrypted in use (AMD SEV) — data protected even from
  # the host hypervisor.
  confidentialInstanceConfig:
    confidentialInstanceType: SEV
  # JupyterLab acts as the signed-in user's identity, so notebook code
  # sees the user's own IAM permissions (auditable per user).
  enableManagedEuc: true
  tags:
    - notebook
    - no-public-ip
