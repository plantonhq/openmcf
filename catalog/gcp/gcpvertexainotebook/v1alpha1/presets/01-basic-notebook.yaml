apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiNotebook
metadata:
  name: data-exploration
spec:
  # Omitted projectId: the notebook lands in the provider's default project.
  # Set projectId (literal or a GcpProject reference) to target another.
  #
  # location is a ZONE (not a region) — notebooks run on zonal VMs.
  location: us-central1-a
  machineType: e2-standard-4
  labels:
    team: data-science
  bootDisk:
    diskType: PD_SSD
    diskSizeGb: 200
  # vmImage is omitted: the Workbench service provisions its default
  # (latest) image — JupyterLab with the common Python data stack
  # pre-installed. To pin an image explicitly, set vmImage with
  # project cloud-notebooks-managed and family workbench-instances.
