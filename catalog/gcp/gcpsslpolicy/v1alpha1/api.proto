syntax = "proto3";

package dev.planton.gcp.gcpsslpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpsslpolicy/v1alpha1/spec.proto";
import "catalog/gcp/gcpsslpolicy/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//gcp-ssl-policy
message GcpSslPolicy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpSslPolicy'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpSslPolicySpec spec = 4 [(buf.validate.field).required = true];
  GcpSslPolicyStatus status = 5;
}

message GcpSslPolicyStatus {
  GcpSslPolicyStackOutputs outputs = 1;
}
