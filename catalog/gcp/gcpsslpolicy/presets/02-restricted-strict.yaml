apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSslPolicy
metadata:
  name: restricted-strict
spec:
  projectId:
    value: "<gcp-project-id>"
  description: RESTRICTED ciphers with a TLS 1.2 floor for high-security frontends
  # RESTRICTED narrows to cipher suites with modern security guarantees
  # (forward secrecy, AEAD) at the cost of dropping some older clients.
  profile: RESTRICTED
  minTlsVersion: TLS_1_2
