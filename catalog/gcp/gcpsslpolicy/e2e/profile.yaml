apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpsslpolicy
spec:
  # Leaf scenarios: SSL policies are free, create in seconds, and have no
  # dependencies. Two scenarios cover the kind's two module branches — a
  # global policy (empty region) and a regional one — the same dual-scope
  # pattern the health check uses. deploy -> compute sslPolicies get verify
  # -> destroy -> verify gone, on both provisioners.
  tier: 1
  # The 6.x-era proof predates this spec surface (post-quantum key
  # exchange, the FIPS_202205/TLS_1_3 pairings, deletion_policy) — the
  # kind awaits live re-proof at the current shape.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 10
