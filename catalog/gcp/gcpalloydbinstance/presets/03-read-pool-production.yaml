apiVersion: gcp.planton.dev/v1alpha1
kind: GcpAlloydbInstance
metadata:
  name: my-orders-read-pool-prod
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  cluster:
    valueFrom:
      kind: GcpAlloydbCluster
      name: my-orders-cluster
      fieldPath: status.outputs.cluster_id
  instanceId: orders-read-pool-prod
  cpuCount: 8
  # Three nodes spread across zones — regional read HA by derivation;
  # availabilityType stays empty on read pools.
  readPoolConfig:
    nodeCount: 3
  requireConnectors: true
  sslMode: ENCRYPTED_ONLY
  queryInsightsConfig:
    queryPlansPerMinute: 10
    recordApplicationTags: true
    recordClientAddress: true
