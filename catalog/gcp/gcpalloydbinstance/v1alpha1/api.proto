syntax = "proto3";

package dev.planton.gcp.gcpalloydbinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpalloydbinstance/v1alpha1/spec.proto";
import "catalog/gcp/gcpalloydbinstance/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//gcp-alloydb-instance
message GcpAlloydbInstance {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpAlloydbInstance'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpAlloydbInstanceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpAlloydbInstanceStatus status = 5;
}

//gcp-alloydb-instance status
message GcpAlloydbInstanceStatus {
  //stack-outputs
  GcpAlloydbInstanceStackOutputs outputs = 1;
}
