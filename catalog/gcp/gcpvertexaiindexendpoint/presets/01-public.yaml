apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiIndexEndpoint
metadata:
  name: vector-serving
spec:
  # Omitted projectId: the endpoint lands in the provider's default project.
  # Set projectId (literal or a GcpProject reference) to target another.
  location: us-central1
  displayName: Vector Serving
  # Public querying: once a GcpVertexAiDeployedIndex places an index onto
  # this endpoint, queries go to the public_endpoint_domain_name output.
  publicEndpointEnabled: true
  labels:
    team: ml-platform
