apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiIndexEndpoint
metadata:
  name: psc-search
spec:
  location: us-central1
  displayName: PSC Search
  # Private Service Connect: consumers reach deployed indexes through a
  # service attachment (surfaced on the GcpVertexAiDeployedIndex outputs)
  # — no VPC peering required. Only allowlisted projects may create
  # forwarding rules targeting the attachment.
  privateServiceConnectConfig:
    enablePrivateServiceConnect: true
    projectAllowlist:
      - consumer-project-a
      - consumer-project-b
  labels:
    team: ml-platform
