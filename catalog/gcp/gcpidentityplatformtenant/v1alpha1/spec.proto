syntax = "proto3";

package dev.planton.gcp.gcpidentityplatformtenant.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpIdentityPlatformTenantSpec defines one Identity Platform TENANT — an
// isolated user pool with its own sign-in configuration and identity
// providers, inside a project whose GcpIdentityPlatformConfig has
// multi_tenant.allow_tenants enabled. Tenants are how one project serves
// multiple customer organizations (B2B SaaS) with separated users,
// providers, and policies.
//
// The tenant ID is generated by GCP at create time (never chosen here) —
// read it from this resource's tenant_id output. Unlike the project
// config, tenants are fully deletable.
//
// The three identity-provider lists compose the tenant-scoped IdP config
// resources, mirroring the project-level shapes with the API's own
// tenant-level differences (SAML sp_config and OIDC display_name are
// required here; OIDC response_type does not exist at tenant level).
message GcpIdentityPlatformTenantSpec {
  // The GCP project containing the tenant. Can be a literal project ID
  // or a reference to a GcpProject resource. If omitted, the provider's
  // default project is used. The project's GcpIdentityPlatformConfig
  // must set multi_tenant.allow_tenants = true.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Human-readable tenant name (e.g. the customer organization) — shown
  // in consoles and usable in sign-in UIs. The tenant's resource ID is
  // server-generated and separate from this.
  string display_name = 2 [(buf.validate.field).required = true];

  // Whether users can sign up with email/password in this tenant.
  bool allow_password_signup = 3;

  // Whether users can sign in via emailed magic link (passwordless).
  bool enable_email_link_signin = 4;

  // When true, ALL authentication in this tenant is disabled — the
  // maintenance/kill switch. Existing sessions stop refreshing.
  bool disable_auth = 5;

  // Restrictions on what client applications can do against this tenant
  // through the Identity Toolkit API directly.
  GcpIdentityPlatformTenantClientPermissions client_permissions = 6;

  // Default supported identity providers (Google, Facebook, Apple, ...)
  // enabled for THIS tenant, each with the OAuth client obtained from
  // that provider's own developer console.
  repeated GcpIdentityPlatformTenantDefaultSupportedIdp default_supported_idps = 7;

  // Custom OIDC identity providers for this tenant.
  repeated GcpIdentityPlatformTenantOauthIdp oauth_idp_configs = 8;

  // Inbound SAML identity providers (enterprise SSO) for this tenant.
  repeated GcpIdentityPlatformTenantInboundSaml inbound_saml_configs = 9;

  // Deletion policy — one switch governs the tenant AND its composed
  // IdP configs:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the tenant is deleted with ALL its users and
  //                providers; user accounts unrecoverable
  //   "PREVENT" -- destroy FAILS; protects a live customer user pool
  //   "ABANDON" -- everything is removed from management but keeps
  //                working in GCP
  string deletion_policy = 10 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];
}

// Client-application permission restrictions for the tenant.
message GcpIdentityPlatformTenantClientPermissions {
  // When true, end users CANNOT sign up themselves through the API —
  // accounts are created only by your backend (admin SDK).
  bool disabled_user_signup = 1;

  // When true, end users CANNOT delete their own accounts through the
  // API — deletion happens only through your backend.
  bool disabled_user_deletion = 2;
}

// One default supported identity provider enabled for the tenant.
message GcpIdentityPlatformTenantDefaultSupportedIdp {
  // Which provider this is — the provider's canonical IdP ID:
  // apple.com, facebook.com, gc.apple.com, github.com, google.com,
  // linkedin.com, microsoft.com, playgames.google.com, twitter.com,
  // yahoo.com. Immutable: changing it replaces the IdP config.
  string idp_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_idp_id"
      message: "idp_id must be one of: apple.com, facebook.com, gc.apple.com, github.com, google.com, linkedin.com, microsoft.com, playgames.google.com, twitter.com, yahoo.com"
      expression: "this in ['apple.com', 'facebook.com', 'gc.apple.com', 'github.com', 'google.com', 'linkedin.com', 'microsoft.com', 'playgames.google.com', 'twitter.com', 'yahoo.com']"
    }
  ];

  // The OAuth client ID issued by the identity provider's own developer
  // console. Consent-screen clients have no programmatic creation path —
  // obtaining these is a documented console step.
  string client_id = 2 [(buf.validate.field).required = true];

  // The OAuth client secret paired with client_id. A secret value: the
  // platform stores it as a managed-secret reference and resolves it
  // just-in-time at deploy. No Planton resource produces it (it comes
  // from the external provider's console), so it is a plain secret
  // string.
  string client_secret = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];

  // Whether users can sign in with this provider (default true). Both
  // IaC engines send the value explicitly so behavior is identical
  // regardless of engine.
  optional bool enabled = 4 [(dev.planton.shared.options.default) = "true"];
}

// One custom OIDC identity provider for the tenant.
message GcpIdentityPlatformTenantOauthIdp {
  // Resource name for this OIDC config — must start with "oidc."
  // (e.g. "oidc.corp-sso"). The API's naming rule, validated up front.
  // Immutable.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_oidc_name"
      message: "oauth_idp_configs.name must start with 'oidc.' — e.g. oidc.corp-sso"
      expression: "this.startsWith('oidc.')"
    }
  ];

  // Human-readable name shown in consoles and sign-in UIs. Required at
  // tenant level (the API's own difference from the project level).
  string display_name = 2 [(buf.validate.field).required = true];

  // The OIDC issuer URL (e.g. "https://accounts.example.com") — where
  // Identity Platform fetches the provider's discovery document.
  string issuer = 3 [(buf.validate.field).required = true];

  // The OAuth client ID registered with the OIDC provider.
  string client_id = 4 [(buf.validate.field).required = true];

  // The OAuth client secret — needed when the provider exchange uses a
  // code flow. A secret value handled as a managed-secret reference end
  // to end. (Tenant-level OIDC has no response_type selection — the
  // API's own difference from the project level.)
  string client_secret = 5 [(dev.planton.shared.options.sensitive) = true];

  // Whether users can sign in with this provider (default true). Sent
  // explicitly by both engines.
  optional bool enabled = 6 [(dev.planton.shared.options.default) = "true"];
}

// One inbound SAML identity provider (enterprise SSO) for the tenant.
message GcpIdentityPlatformTenantInboundSaml {
  // Resource name for this SAML config — must start with "saml.",
  // contain only alphanumerics/hyphens/underscores/periods, and the part
  // after "saml." must start with a lowercase letter, end alphanumeric,
  // and be at least 2 characters (the API's naming rule, validated up
  // front). E.g. "saml.okta-prod". Immutable.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_saml_name"
      message: "inbound_saml_configs.name must start with 'saml.' followed by a lowercase letter, contain only alphanumerics/hyphens/underscores/periods, end alphanumeric, and have at least 2 characters after the prefix — e.g. saml.okta-prod"
      expression: "this.matches('^saml[.][a-z][a-zA-Z0-9_.-]*[a-zA-Z0-9]$')"
    }
  ];

  // Human-readable name shown in consoles and sign-in UIs.
  string display_name = 2 [(buf.validate.field).required = true];

  // Whether users can sign in with this provider (default true). Sent
  // explicitly by both engines.
  optional bool enabled = 3 [(dev.planton.shared.options.default) = "true"];

  // The external identity provider's side of the SAML exchange.
  GcpIdentityPlatformTenantSamlIdpConfig idp_config = 4 [(buf.validate.field).required = true];

  // This tenant's side of the SAML exchange. Required at tenant level
  // (the API's own difference from the project level, where it is
  // optional).
  GcpIdentityPlatformTenantSamlSpConfig sp_config = 5 [(buf.validate.field).required = true];
}

// The SAML identity provider's settings.
message GcpIdentityPlatformTenantSamlIdpConfig {
  // The IdP's entity ID from its metadata XML.
  string idp_entity_id = 1 [(buf.validate.field).required = true];

  // The IdP's SSO URL — where users are sent to authenticate.
  string sso_url = 2 [(buf.validate.field).required = true];

  // Whether to sign outbound authentication requests.
  bool sign_request = 3;

  // The IdP's X.509 signing certificates (PEM) used to verify SAML
  // responses. Public certificates, not secrets.
  repeated GcpIdentityPlatformTenantSamlCertificate idp_certificates = 4;
}

// One X.509 certificate.
message GcpIdentityPlatformTenantSamlCertificate {
  // The certificate in PEM format.
  string x509_certificate = 1;
}

// The service-provider (this tenant's) SAML settings. Both fields are
// required at tenant level (the API's own rule).
message GcpIdentityPlatformTenantSamlSpConfig {
  // Where the IdP posts SAML responses — must be an https:// URL (the
  // API's rule, validated up front).
  string callback_uri = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_callback_uri"
      message: "sp_config.callback_uri must start with https://"
      expression: "this.startsWith('https://')"
    }
  ];

  // This tenant's SP entity ID, as registered with the IdP.
  string sp_entity_id = 2 [(buf.validate.field).required = true];
}
