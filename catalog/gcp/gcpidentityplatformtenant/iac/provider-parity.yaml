# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# One kind, four resources: the tenant plus one composed tenant-scoped
# resource per identity provider the spec lists. The tenant's resource ID
# is generated by GCP and flows to the IdP configs through the created
# resource -- never spec surface. The spec's ONE deletion_policy matches
# the tenant by name and maps onto each composed IdP config.
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_identity_platform_tenant:
    mappings:
      - spec: spec.project_id
        arg: project

      # The provider nests permissions inside a client wrapper; the spec
      # flattens the one configurable subtree (mirroring the config kind).
      - spec: spec.client_permissions.disabled_user_signup
        arg: client.permissions.disabled_user_signup
      - spec: spec.client_permissions.disabled_user_deletion
        arg: client.permissions.disabled_user_deletion

  # Instantiated per spec.default_supported_idps entry, tenant-scoped.
  google_identity_platform_tenant_default_supported_idp_config:
    specRoot: spec.default_supported_idps
    mappings:
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: tenant
        reason: wired by the module to the server-generated ID of the tenant it creates -- never user surface
      - arg: project
        reason: wired by the module to the tenant's project -- never user surface

  # Instantiated per spec.oauth_idp_configs entry (tenant-level OIDC has no
  # response_type and requires display_name -- the spec mirrors the API's
  # own differences from the project level).
  google_identity_platform_tenant_oauth_idp_config:
    specRoot: spec.oauth_idp_configs
    mappings:
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: tenant
        reason: wired by the module to the server-generated ID of the tenant it creates -- never user surface
      - arg: project
        reason: wired by the module to the tenant's project -- never user surface

  # Instantiated per spec.inbound_saml_configs entry (tenant-level SAML
  # requires sp_config -- the spec mirrors the API's own difference).
  google_identity_platform_tenant_inbound_saml_config:
    specRoot: spec.inbound_saml_configs
    mappings:
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: tenant
        reason: wired by the module to the server-generated ID of the tenant it creates -- never user surface
      - arg: project
        reason: wired by the module to the tenant's project -- never user surface

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      identitytoolkit.googleapis.com with fixed arguments
      (disable_on_destroy false so destroying one tenant never disables
      authentication project-wide); not spec surface.
