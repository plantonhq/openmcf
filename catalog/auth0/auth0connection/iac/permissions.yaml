# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Schema: iac/componentpermissions/v1.
#
# Auth0 authenticates with a tenant-scoped Management API token, not
# IAM-statement policies, so none of the schema's provider sections
# (aws/gcp/azure/kubernetes) applies -- their absence is the schema's own
# claim that the modules touch no such API. The credential model: a
# machine-to-machine (M2M) application in the target tenant, authorized for
# the Auth0 Management API audience (https://{tenant-domain}/api/v2/) and
# granted the scopes below; the auth0/auth0 Terraform provider (per
# iac/tf/provider.tf) and the Pulumi module exchange its client id/secret
# for a token via the client-credentials flow.
#
# The modules manage two surfaces: auth0_connection (the identity-provider
# connection with its full options tree -- password policy, MFA, dictionary
# and history settings, upstream IdP credentials) and auth0_connection_clients
# (the connection's enabled-clients list, written only when the spec names
# clients). Should the schema grow an auth0 section, this inventory converts
# mechanically:
#
#   Connection lifecycle (purpose: create/read/update/delete the connection
#   and its options tree):
#     create:connections        -- POST /api/v2/connections (proven: the
#                                  endpoint doc's insufficient-scope contract
#                                  names it verbatim; auth0.com/docs/api/
#                                  management/v2/connections/post-connections,
#                                  retrieved 2026-08-22).
#     read:connections          -- GET /api/v2/connections/{id} on refresh.
#                                  Derived: follows Auth0's documented
#                                  create:/read:/update:/delete: scope naming
#                                  per endpoint family; the get-by-id page was
#                                  not fetched this session.
#     read:connections_options  -- reading the connection's options tree back
#                                  on refresh (proven: the post-connections
#                                  page states the scope must be present for
#                                  options to be returned; same citation and
#                                  date as create:connections).
#     update:connections        -- PATCH /api/v2/connections/{id} on config
#                                  change, and the enabled-clients write the
#                                  auth0_connection_clients resource performs
#                                  against the connection. Derived, same
#                                  naming basis as read:connections.
#     delete:connections        -- DELETE /api/v2/connections/{id} on destroy.
#                                  Derived, same basis.
#
#   Enabled-clients read-back (purpose: the auth0_connection_clients resource
#   resolves the client ids it enables):
#     read:clients              -- listing/validating the clients named in
#                                  enabled_clients. Derived from the resource's
#                                  documented behavior; scope name follows the
#                                  clients endpoint family (see the
#                                  auth0client manifest, where read:clients is
#                                  proven against the get-clients-by-id page).
#
# Honest boundary: upstream IdP credentials (social/OIDC/AzureAD
# client_id/client_secret in the options tree) are VALUES the connection
# carries, not extra Management API scopes -- provisioning needs no
# permission at the external provider; the operator supplies those
# credentials in the spec.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0connection
spec: {}
