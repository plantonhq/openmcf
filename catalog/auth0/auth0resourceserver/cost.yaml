# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: auth0resourceserver
spec:
  billing_model: free
  free_tier: "Auth0 publishes no per-object price for resource servers (APIs) -- no meter charges for defining one, and Auth0's pricing feature matrix (auth0.com/pricing, retrieved 2026-08-22) publishes no per-plan gate on creating them either. Defining the API and its scopes is free on every plan."
  notes: "The real spend lives in the tenant subscription that hosts this object: Auth0 bills by plan tier plus monthly active users (Free up to 25,000 MAUs; Essentials from $35/month B2C or $150/month B2B; Professional from $240/month B2C or $800/month B2B; Enterprise custom; yearly billing is 11x monthly -- auth0.com/pricing, retrieved 2026-08-22). The adjacent metered quantity is the TOKENS issued against this API: the matrix allots 1,000 machine-to-machine tokens on Free and Essentials and 5,000 on Professional and Enterprise, with a paid M2M token add-on beyond that (Professional B2C from $30/month at 7,500 tokens). One plan-gated field: enforce_policies leans on Role Management, which the matrix lists as not available on Free and included from Essentials up. The API workload this object REPRESENTS runs and bills wherever the customer deploys it, as its own catalog kind."
