# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Schema: iac/componentpermissions/v1.
#
# Auth0 authenticates with a tenant-scoped Management API token, not
# IAM-statement policies, so none of the schema's provider sections
# (aws/gcp/azure/kubernetes) applies -- their absence is the schema's own
# claim that the modules touch no such API. The credential is a
# machine-to-machine (M2M) application authorized for the tenant's
# Management API (client-credentials grant): the auth0/auth0 Terraform
# provider (~> 1.0 per iac/tf/provider.tf) and the pulumi-auth0 SDK take a
# domain plus client_id/client_secret (or a pre-issued api_token) and
# exchange them for a Management API access token carrying the scopes
# granted to that M2M application.
#
# Least privilege therefore means granting the M2M application ONLY the
# scopes below -- scope names verbatim from Auth0's published Management
# API endpoint docs (auth0.com/docs/api/management/v2/resource-servers/
# post-resource-servers, whose scope inventory lists
# create:resource_servers, read:resource_servers, update:resource_servers,
# delete:resource_servers; the POST endpoint itself rejects tokens without
# create:resource_servers -- retrieved 2026-08-22). Should the schema grow
# an auth0 section, this inventory converts mechanically:
#
#   Resource server lifecycle (provenance: derived):
#     create:resource_servers  -- create the API definition (POST /api/v2/resource-servers)
#     read:resource_servers    -- read it back on refresh (GET /api/v2/resource-servers/{id})
#     update:resource_servers  -- update token settings and RBAC flags in place
#                                 (PATCH /api/v2/resource-servers/{id}); ALSO exercised by
#                                 the scopes resource below, since scopes live ON the
#                                 resource server object
#     delete:resource_servers  -- destroy it (DELETE /api/v2/resource-servers/{id})
#
# The modules (iac/tf/main.tf and iac/pulumi/module/resourceserver.go)
# manage two resources: auth0_resource_server and, when spec.scopes is
# non-empty, auth0_resource_server_scopes. The scopes resource writes the
# scopes list of the same resource server object, so it rides the same
# four resource_servers scopes -- no additional scope family is involved
# (derived from static analysis of the modules; the live capture lane
# upgrades derived entries to proven).
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0resourceserver
spec: {}
