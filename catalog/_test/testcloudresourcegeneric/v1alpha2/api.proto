syntax = "proto3";

package dev.planton._test.testcloudresourcegeneric.v1alpha2;

import "buf/validate/validate.proto";
import "catalog/_test/testcloudresourcegeneric/v1alpha2/spec.proto";
import "catalog/_test/testcloudresourcegeneric/v1alpha2/stack_outputs.proto";
import "shared/metadata.proto";

// TestCloudResourceGeneric at v1alpha2 -- see spec.proto for the deliberate
// breaking-change set relative to v1alpha1.
message TestCloudResourceGeneric {
  string api_version = 1 [(buf.validate.field).string.const = '_test.planton.dev/v1alpha2'];
  string kind = 2 [(buf.validate.field).string.const = 'TestCloudResourceGeneric'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  TestCloudResourceGenericSpec spec = 4;
  TestCloudResourceGenericStatus status = 5;
}

message TestCloudResourceGenericStatus {
  TestCloudResourceGenericStackOutputs outputs = 1;
}
