syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafkaconnector.v1alpha1;

/**
 * **KubernetesKafkaConnectorStackOutputs** — the handles a declared
 * connector exports.
 */
message KubernetesKafkaConnectorStackOutputs {
  // Namespace the KafkaConnector resource lives in (the Connect
  // cluster's namespace).
  string namespace = 1;

  // The connector's name inside the Connect cluster (metadata.name)
  // — what the Connect REST API and consumer-group names
  // (connect-<name>) key off.
  string connector_name = 2;
}
