# The backup proof: a single-member development cluster (the unsafe
# replset-size opt-in exercised deliberately) with PBM backups into the
# in-cluster MinIO fixture — the full backup chain proven live with no
# cloud account. The verifier (switched on by this scenario's name) drives
# a real PBM backup to completion against the declared storage. PITR
# oplog archiving rides along.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMongodb
metadata:
  name: e2e-mdb-backup
  annotations:
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesmongodb/e2e/fixture-minio.yaml"
spec:
  namespace:
    value: e2e-mdb-backup
  create_namespace: true
  replica_sets:
    - name: rs0
      size: 1
      storage:
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  unsafe:
    replset_size: true
  backup:
    storages:
      - name: minio
        main: true
        s3:
          bucket: mongo-backups
          region: minio
          endpoint_url: http://minio.e2e-mongodb-minio.svc.cluster.local:9000
          insecure_skip_tls_verify: true
          access_keys:
            access_key_id: minioadmin
            secret_access_key: minioadmin
    pitr:
      enabled: true
      oplog_span_min: 10
    tasks:
      - name: nightly
        schedule: "0 3 * * *"
        storage_name: minio
        keep: 3
