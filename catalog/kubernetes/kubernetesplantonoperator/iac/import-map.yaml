apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: kubernetesplantonoperator
spec:
  # The module declares one Helm release (the operator, fixed name), the
  # module-owned plantonplatforms.planton.ai CRD (kubectl_manifest,
  # for_each keyed by the CRD's own metadata.name), and the optional
  # anchor namespace.
  values:
    # ── the operator release (helm_release "planton_operator") ──────────
    - name: release_name
      tofu_resource_name: planton_operator
      derivations:
        - from_stack_output: release_name
      where_to_find: >-
        Always "planton-operator" — the module fixes the release name (the
        operator itself enforces one installation per cluster at startup).
        Confirm with `helm list -n <namespace>` (NAME column).
    - name: release_namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally
        "planton-operator".
    # ── the module-owned CRD (for_each resource "crds") ──────────────────
    # Cluster-scoped, so the composed ID has no namespace segment. Not
    # imported when skip_crds is true (the bring-your-own-CRD arm).
    - name: api_version
      tofu_resource_name: crds
      derivations:
        - literal: apiextensions.k8s.io/v1
      where_to_find: Always "apiextensions.k8s.io/v1" — the CRD API group/version.
    - name: kind
      tofu_resource_name: crds
      derivations:
        - literal: CustomResourceDefinition
      where_to_find: Always "CustomResourceDefinition".
    - name: name
      tofu_resource_name: crds
      derivations:
        - literal: plantonplatforms.planton.ai
      where_to_find: >-
        Always "plantonplatforms.planton.ai" — the one CRD the module owns
        (`kubectl get crd | grep planton`).
    - name: namespace
      tofu_resource_name: crds
      where_to_find: >-
        Not applicable — a CustomResourceDefinition is cluster-scoped, so
        the composed import ID has no namespace segment (the optional
        [//{namespace}] group drops).
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
