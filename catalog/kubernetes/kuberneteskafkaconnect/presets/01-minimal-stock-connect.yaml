apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaConnect
metadata:
  name: dev-connect
spec:
  # The Connect cluster's namespace — KubernetesKafkaConnector
  # declarations for this cluster MUST live here too (the placement
  # contract the operator enforces).
  namespace:
    value: dev-kafka
  # The Kafka cluster the workers read from and write to. In an infra
  # chart this becomes a KubernetesKafka reference; the literal is the
  # cluster's in-cluster bootstrap endpoint.
  bootstrap_servers:
    value: dev-kafka-kafka-bootstrap.dev-kafka.svc.cluster.local:9092
  replicas: 1
  # Stock image: no image/plugins/build — the workers carry ONLY the
  # MirrorMaker 2 connector classes (MirrorSource/MirrorCheckpoint/
  # MirrorHeartbeat; Kafka's FileStream examples are NOT on the
  # distribution's classpath). Every real integration class arrives
  # through image, plugins, or build.
  config:
    # "-1" = broker default. Connect's own internal-topic replication
    # factor of 3 cannot be satisfied on a single-broker dev cluster
    # and the workers would wedge creating their topics. Values are
    # configuration STRINGS — the operator serializes them.
    config.storage.replication.factor: "-1"
    offset.storage.replication.factor: "-1"
    status.storage.replication.factor: "-1"
