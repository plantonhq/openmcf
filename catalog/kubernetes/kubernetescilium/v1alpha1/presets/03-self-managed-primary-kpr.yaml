apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCilium
metadata:
  name: cilium
spec:
  namespace:
    value: kube-system # upstream convention — the agent is cluster infrastructure
  createNamespace: false # kube-system always exists
  ipam:
    # Cilium's operator carves per-node pod CIDRs from the pool below
    # (chart-default mode, made explicit here with a deliberate pool).
    mode: cluster-pool
    clusterPoolIpv4PodCidrs:
      - 10.42.0.0/16 # must not overlap the node network or Service CIDR
    clusterPoolIpv4MaskSize: 24 # 254 pod IPs per node (chart default)
  routing:
    mode: tunnel # encapsulation works on any fabric — no routable-pod-CIDR requirement
    tunnelProtocol: vxlan # chart default
  # Replace kube-proxy with eBPF service load-balancing. The cluster must
  # be created WITHOUT kube-proxy (kubeadm: --skip-phases=addon/kube-proxy).
  kubeProxyReplacement: true
  # Required with kubeProxyReplacement (CEL-enforced): the agent must reach
  # the API server before any service load-balancing exists.
  k8sServiceHost: <api-server-endpoint>
  k8sServicePort: 6443 # the common API server port
