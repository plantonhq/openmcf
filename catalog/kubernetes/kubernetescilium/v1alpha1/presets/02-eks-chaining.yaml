apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCilium
metadata:
  name: cilium
spec:
  namespace:
    value: kube-system # upstream convention — the agent is cluster infrastructure
  createNamespace: false # kube-system always exists
  cni:
    # Chain onto the AWS VPC CNI: the incumbent keeps IPAM and interface
    # wiring; Cilium attaches eBPF for policy enforcement, load-balancing,
    # and observability. No rip-and-replace.
    chainingMode: aws-cni
    # Mandatory with chaining (CEL-enforced): exclusive mode would rename
    # the very CNI configuration the chain depends on.
    exclusive: false
