apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesJob
metadata:
  name: my-parallel-batch
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-worker-image>"
        tag: "<your-image-tag>"
      command:
        - /bin/sh
        - -c
        - "<your-worker-command>"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  completionMode: Indexed
  completions: 10
  parallelism: 3
  restartPolicy: Never
  # Per-index retry budget: one flaky partition exhausts only its own
  # retries instead of the whole Job's.
  backoffLimitPerIndex: 2
  # Give up once two partitions have failed for good.
  maxFailedIndexes: 2
  ttlSecondsAfterFinished: 86400
