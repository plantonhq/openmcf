apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUi
metadata:
  name: org-console
spec:
  namespace:
    value: kafka-console
  create_namespace: true
  clusters:
    # Staging: full console powers — create topics, produce test
    # messages, edit configs.
    - name: staging
      bootstrap_servers:
        value: staging-kafka-bootstrap.kafka-staging.svc.cluster.local:9092
      properties:
        request.timeout.ms: "30000"
    # Production: observe-only, TLS + SCRAM. read_only hides every
    # mutating action for THIS cluster while staging keeps them.
    - name: production
      bootstrap_servers:
        value: events-kafka-bootstrap.kafka.svc.cluster.local:9093
      read_only: true
      tls:
        ca_secret_name:
          value: events-cluster-ca-cert
      sasl:
        mechanism: SCRAM-SHA-512
        username: kafka-ui
        password_secret:
          secret_name:
            value: prod-kafka-ui-user
  # A shared console gets a login gate.
  auth:
    type: login_form
    user:
      username: admin
      password: <set-a-strong-password>
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
