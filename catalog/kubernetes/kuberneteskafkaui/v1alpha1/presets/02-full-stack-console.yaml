apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUi
metadata:
  name: platform-console
spec:
  namespace:
    value: kafka-console
  create_namespace: true
  clusters:
    - name: events
      # In an infra chart these three addresses are sibling
      # references: KubernetesKafka's bootstrap endpoint,
      # KubernetesKarapace's endpoint, KubernetesKafkaConnect's REST
      # endpoint.
      bootstrap_servers:
        value: events-kafka-bootstrap.kafka.svc.cluster.local:9093
      # TLS trust: the Strimzi cluster-CA Secret mounts as-is — the
      # module renders a PEM truststore (no JKS conversion).
      tls:
        ca_secret_name:
          value: events-cluster-ca-cert
      # SASL credentials from a KubernetesKafkaUser's Secret (key
      # "password") — wired into the console through a Secret-backed
      # env var; never plaintext in rendered chart values.
      sasl:
        mechanism: SCRAM-SHA-512
        username: kafka-ui
        password_secret:
          secret_name:
            value: kafka-ui
      # Schema browsing and schema-aware message rendering.
      schema_registry:
        url:
          value: http://schema-registry.kafka.svc.cluster.local:8081
      # Connect pipe monitoring (one entry per Connect cluster).
      kafka_connect:
        - name: cdc
          address:
            value: http://cdc-connect-connect-api.kafka.svc.cluster.local:8083
  # Console login: ONE login_form account (the app authenticates
  # against Spring's single default security user — it has no
  # multi-user store; OAuth2/LDAP/multi-user ride helm_values). The
  # password is materialized into the <name>-secrets Secret.
  auth:
    type: login_form
    user:
      username: admin
      password: <set-a-strong-password>
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
