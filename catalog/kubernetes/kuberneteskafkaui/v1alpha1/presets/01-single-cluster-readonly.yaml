apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUi
metadata:
  name: kafka-console
spec:
  namespace:
    value: kafka-console
  create_namespace: true
  clusters:
    - name: production
      # The observed cluster's bootstrap (a KubernetesKafka reference
      # in an infra chart; the literal is its in-cluster endpoint).
      bootstrap_servers:
        value: events-kafka-bootstrap.kafka.svc.cluster.local:9092
      # Observe-only: every mutating action (topic create/delete,
      # message produce, config edits) disappears from the UI and API
      # for this cluster. An app-side switch, not a Kafka ACL.
      read_only: true
  # No auth block: the console is OPEN to anyone who can reach the
  # Service — acceptable only because nothing exposes it (ClusterIP,
  # no ingress composed). Reach it via the exported port-forward
  # command; add login_form before any shared exposure.
