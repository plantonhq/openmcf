# The full policy surface: provisioner parameters, retain reclaim,
# WaitForFirstConsumer binding, expansion, mount options, and a topology
# restriction. Parameters are provisioner-specific and unvalidated at class
# creation (they are consumed at provision time), so the class object is
# creatable on any cluster.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStorageClass
metadata:
  name: e2e-sc-full
spec:
  name: e2e-sc-full
  labels:
    tier: fast
  provisioner: ebs.csi.aws.com
  parameters:
    type: gp3
    iops: "6000"
    encrypted: "true"
  reclaim_policy: retain
  volume_binding_mode: wait_for_first_consumer
  allow_volume_expansion: true
  mount_options:
    - noatime
  allowed_topologies:
    - match_label_expressions:
        - key: topology.kubernetes.io/zone
          values:
            - us-east-1a
            - us-east-1b
