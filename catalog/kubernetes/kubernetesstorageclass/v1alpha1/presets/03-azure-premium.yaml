apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStorageClass
metadata:
  name: azure-premium
spec:
  name: azure-premium
  provisioner: disk.csi.azure.com
  parameters:
    skuName: Premium_LRS
  volume_binding_mode: wait_for_first_consumer
  allow_volume_expansion: true
  is_default_class: false
