# The replication proof: one primary plus two replicas with per-pod
# persistence, write-safety (the primary refuses writes without one synced
# replica), the read Service, TLS-off metrics sidecar, and a PDB. The
# behavioral verifier (switched on by this scenario's name) writes through
# the primary and reads the key back through the READ Service — proving
# replication actually propagates data to replicas.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesValkey
metadata:
  name: e2e-vlk-repl
spec:
  namespace:
    value: e2e-vlk-repl
  create_namespace: true
  replication:
    replicas: 2
    persistence:
      size: 1Gi
    min_replicas_to_write: 1
    min_replicas_max_lag: 10
  config:
    append_only: true
    max_memory: 128mb
  metrics:
    enabled: true
  pod_disruption_budget:
    enabled: true
    max_unavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
