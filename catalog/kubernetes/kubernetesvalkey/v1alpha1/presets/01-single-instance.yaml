apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesValkey
metadata:
  name: my-valkey
spec:
  namespace:
    value: "<your-namespace>"
  create_namespace: false
  # No replication block = standalone: one instance. Add replication
  # later to grow into primary/replica read scaling.
  persistence:
    size: 1Gi # a pod restart replays the AOF from this volume
  config:
    # Append-only persistence: every write is logged and replayed on
    # restart — without it (and the volume above), restarts start empty.
    append_only: true
    # The cache posture: bounded memory with automatic LRU eviction
    # instead of write failures or OOM kills. Size the pod's memory
    # limit ABOVE this — Valkey needs headroom for persistence forks.
    max_memory: 256mb
    max_memory_policy: allkeys-lru
  # The chart ships with auth OFF — declaring the "default" ACL user is
  # what actually requires credentials. The password lands in the
  # "<name>-auth" Secret, never in rendered chart values.
  auth:
    users:
      - name: default
        password: "<your-password>"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
