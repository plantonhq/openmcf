apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesService
metadata:
  name: db-peers
spec:
  name: db-peers
  namespace:
    value: "<your-namespace>"
  headless: true
  publish_not_ready_addresses: true
  selector:
    app: "<your-statefulset-name>"
  ports:
    - name: peer
      port: 5432
      target_port: "5432"
