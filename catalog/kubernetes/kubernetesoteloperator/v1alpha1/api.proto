syntax = "proto3";

package dev.planton.kubernetes.kubernetesoteloperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesoteloperator/v1alpha1/spec.proto";
import "catalog/kubernetes/kubernetesoteloperator/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//otel-operator-kubernetes
message KubernetesOtelOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesOtelOperator'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesOtelOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesOtelOperatorStatus status = 5;
}

//otel-operator-kubernetes status.
message KubernetesOtelOperatorStatus {
  //stack-outputs
  KubernetesOtelOperatorStackOutputs outputs = 1;
}
