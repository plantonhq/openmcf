# The second act of upgrade.yaml: the same resource, chart 0.120.3, and
# the CRDs released at destroy so the lane cleans up after itself. Not a
# scenario of its own (the second-act annotation keeps discovery from
# running it as a lane) -- the harness deploys it only through the upgrade
# annotation on upgrade.yaml.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelOperator
metadata:
  name: e2e-otelop-upg
  annotations:
    planton.dev/e2e-second-act: upgrade.yaml
spec:
  namespace:
    value: e2e-otelop-upg
  createNamespace: true
  chartVersion: 0.120.3
  crds:
    keepOnUninstall: false
