# The refused second act of downgrade-refused.yaml: the same resource
# asking for chart 0.119.0 while the cluster carries 0.120.3 CRDs. Not a
# scenario of its own (the second-act annotation keeps discovery from
# running it as a lane) -- the harness deploys it only through the
# annotations on downgrade-refused.yaml.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelOperator
metadata:
  name: e2e-otelop-down
  annotations:
    planton.dev/e2e-second-act: downgrade-refused.yaml
spec:
  namespace:
    value: e2e-otelop-down
  createNamespace: true
  chartVersion: 0.119.0
  crds:
    keepOnUninstall: false
