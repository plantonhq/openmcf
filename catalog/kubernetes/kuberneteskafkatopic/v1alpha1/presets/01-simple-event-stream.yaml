apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaTopic
metadata:
  name: order-events
spec:
  namespace:
    value: kafka # MUST be the Kafka cluster's own namespace
  kafkaCluster:
    value: my-kafka # the KubernetesKafka resource's metadata.name
  # Plan partitions up front: they can be increased later but never
  # decreased, and increasing them remaps keys on keyed topics.
  partitions: 6
  replicas: 3 # must not exceed the cluster's broker count
  config:
    retention.ms: "604800000" # 7 days
    cleanup.policy: delete
    min.insync.replicas: "2" # with replicas 3: survives one broker loss
