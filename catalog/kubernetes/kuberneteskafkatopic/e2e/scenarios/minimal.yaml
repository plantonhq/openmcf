# A declared topic against the lane's Kafka fixture. The namespace is the
# FIXTURE'S namespace, deliberately — the topic operator watches only the
# cluster's own namespace (the placement contract). The cluster binding
# resolves through the foreign key against the fixture's outputs, so the
# FK wiring is proven live. The verifier asserts the KafkaTopic reaches
# Ready AND kafka-topics --describe reports the declared partition count.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaTopic
metadata:
  name: e2e-topic-minimal
spec:
  namespace:
    value: e2e-kaf-fix
  kafka_cluster:
    valueFrom:
      name: e2e-kaf-fix
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
