apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIngress
metadata:
  name: app-fanout
spec:
  name: app-fanout
  namespace:
    value: app
  ingress_class_name: nginx
  rules:
    - host: app.example.com
      paths:
        - path: /
          path_type: prefix
          backend:
            service_name:
              value: frontend-svc
            port_number: 3000
        - path: /api
          path_type: prefix
          backend:
            service_name:
              value: api-svc
            port_name: http
