syntax = "proto3";

package dev.planton.kubernetes.kubernetestekton.v1alpha1;

import "catalog/kubernetes/kubernetestekton/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesTektonStackInput provides the input for the Tekton IaC stack.
message KubernetesTektonStackInput {
  // target cloud-resource
  KubernetesTekton target = 1;
  // provider-config for Kubernetes provider
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
