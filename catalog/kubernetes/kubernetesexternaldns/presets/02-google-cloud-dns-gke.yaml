apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalDns
metadata:
  name: my-external-dns-cloud-dns
spec:
  namespace:
    value: external-dns
  createNamespace: true
  googleCloudDns:
    project:
      value: '<gcp-project-id>'
    zoneIdFilters:
      - value: '<cloud-dns-zone-name>'
  workloadIdentity:
    gke:
      serviceAccountEmail:
        value: '<external-dns-gsa-email>'
  sources:
    - service
    - ingress
  policy: sync # dedicated zone: full reconciliation, including deletes of owned records
  txtOwnerId: '<cluster-name>' # must be distinct per instance sharing a zone
  domainFilters:
    - '<example.com>'
