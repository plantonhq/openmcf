# Extra-instance fixture for the behavioral-deny scenario: the HTTP backend
# the policy isolates (pod label app=e2e-netpol-backend is both the
# auto-created Service's selector and the policy's pod_selector). The
# workload kind auto-creates its own ClusterIP Service named
# e2e-netpol-backend exposing port 80 — the client curls that Service. This
# fixture also creates the scenario namespace (it deploys first).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: e2e-netpol-backend
spec:
  namespace:
    value: e2e-netpol-behavioral
  create_namespace: true
  version: main
  container:
    app:
      image:
        repo: nginxinc/nginx-unprivileged
        tag: "1.27"
      ports:
        - name: http
          container_port: 8080
          service_port: 80
          network_protocol: TCP
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
