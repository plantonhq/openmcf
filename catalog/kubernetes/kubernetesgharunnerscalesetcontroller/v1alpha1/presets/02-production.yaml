apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGhaRunnerScaleSetController
metadata:
  name: arc
spec:
  namespace:
    value: arc-system
  create_namespace: true
  # Two replicas = automatic leader election (a hot standby, not shared
  # workload).
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  flags:
    log_level: info
    log_format: json
    # `eventual` waits for running jobs before applying controller
    # upgrades — no runner overprovisioning during rollouts.
    update_strategy: eventual
    # Raise reconcile throughput for busy fleets (costs API-server and
    # GitHub-API load).
    runner_max_concurrent_reconciles: 4
    health_probe_bind_address: ":8081"
    # The runner control plane should survive node-pressure evictions.
    priority_class_name: system-cluster-critical
  metrics:
    controller_manager_addr: ":8080"
    listener_addr: ":8080"
    listener_endpoint: /metrics
