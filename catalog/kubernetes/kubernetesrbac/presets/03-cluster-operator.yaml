apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRbac
metadata:
  name: cluster-monitor
spec:
  clusterScope: {}
  createRole:
    rules:
      - verbs: ["get", "list", "watch"]
        apiGroups: [""]
        resources: ["nodes", "namespaces"]
      - verbs: ["get"]
        nonResourceUrls: ["/metrics"]
  subjects:
    - serviceAccount:
        name:
          value: "<your-service-account>"
        namespace:
          value: "<your-service-account-namespace>"
