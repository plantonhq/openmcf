apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMysql
metadata:
  name: prod-mysql
spec:
  namespace:
    value: prod-mysql
  create_namespace: true
  # Galera quorum: three database nodes — synchronous replication with
  # automated recovery when every node is down.
  instances: 3
  storage:
    size: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  proxy:
    haproxy:
      replicas: 3
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
      expose_replicas:
        enabled: true
        only_readers: true
  backup:
    storages:
      - name: aws-primary
        s3:
          bucket: <mysql-backups-bucket>
          region: <aws-region>
          prefix: prod-mysql
          access_keys:
            access_key_id: <backup-iam-access-key>
            secret_access_key: <backup-iam-secret-key>
      - name: pitr
        s3:
          bucket: <mysql-pitr-bucket>
          region: <aws-region>
          access_keys:
            access_key_id: <pitr-iam-access-key>
            secret_access_key: <pitr-iam-secret-key>
    schedules:
      - name: daily
        schedule: "0 2 * * *"
        storage_name: aws-primary
        keep: 14
    pitr:
      enabled: true
      storage_name: pitr
  scheduling:
    anti_affinity_topology_key: topology.kubernetes.io/zone
  pod_disruption_budget:
    max_unavailable: 1
  tls:
    issuer:
      value: letsencrypt-prod
