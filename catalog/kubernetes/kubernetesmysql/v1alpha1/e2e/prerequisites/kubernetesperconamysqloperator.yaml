# Consumer-scoped operator fixture for the KubernetesMysql lanes: the
# operator in CLUSTER-WIDE watch mode, because every database scenario
# creates its cluster in its own namespace — the operator's default
# own-namespace watch would never see them.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPerconaMysqlOperator
metadata:
  name: e2e-pxc-op-for-mysql
spec:
  namespace:
    value: pxc-operator-system
  create_namespace: true
  watch:
    cluster_wide: true
