# Dependency-install profile for cert-manager.
#
# The E2E harness deploys this manifest (via the registry prerequisite graph —
# KubernetesClusterIssuer/KubernetesIssuer/KubernetesCertificate declare
# `prerequisites: [KubernetesCertManager]`) before applying any issuer or
# certificate scenario. Minimal install: chart defaults, CRDs included, the
# namespace created and owned by the fixture.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCertManager
metadata:
  name: e2e-certmanager-prereq
spec:
  namespace:
    value: cert-manager
  createNamespace: true
