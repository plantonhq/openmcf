# Self-signed cluster-wide issuer — the internal-PKI bootstrap root. The
# verifier requires the Ready condition, which a self-signed backend reaches
# with no external dependency: a fair, deterministic kind-cluster assertion.
# (cert-manager itself installs first through the registry prerequisite.)
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterIssuer
metadata:
  name: e2e-ci-selfsigned
spec:
  certManagerNamespace:
    value: cert-manager
  config:
    selfSigned: {}
