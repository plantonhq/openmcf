apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  certManagerNamespace:
    value: cert-manager
  config:
    acme:
      email: "<your-email@example.com>"
      solvers:
        - dns01:
            gcpCloudDns:
              projectId: "<gcp-project-id>"
