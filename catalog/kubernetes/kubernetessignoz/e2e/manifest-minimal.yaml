# Minimal offline-proof manifest: the required ClickHouse connection
# (shaped like a same-namespace KubernetesClickHouse composition, literal
# values) and nothing else — a single collector, SQLite server state, the
# chart defaults. Proves the minimal render path (the shape most likely
# to expose a nil-deref on an absent optional block). Placeholder values;
# never applied.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSignoz
metadata:
  name: signoz-hack-min
spec:
  namespace:
    value: signoz-hack-min
  createNamespace: true
  clickhouse:
    host:
      value: clickhouse-analytics
    clusterName:
      value: analytics
    username: signoz
    passwordSecret:
      secretName:
        value: analytics-clickhouse-auth
      secretKey: signoz
