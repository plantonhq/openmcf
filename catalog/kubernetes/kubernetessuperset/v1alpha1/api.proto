syntax = "proto3";

package dev.planton.kubernetes.kubernetessuperset.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetessuperset/v1alpha1/spec.proto";
import "catalog/kubernetes/kubernetessuperset/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//superset-kubernetes
message KubernetesSuperset {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesSuperset'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesSupersetSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesSupersetStatus status = 5;
}

//superset-kubernetes status.
message KubernetesSupersetStatus {
  //stack-outputs
  KubernetesSupersetStackOutputs outputs = 1;
}
