# The real-node-group behavioral proof on the aws-eks profile: the aws arm
# with tag-based ASG auto-discovery and IRSA. The batch cluster carries a
# dedicated min-0/max-2 node group ("ca-scale") whose ASG has the discovery
# tags and whose taint fences ordinary workloads off it; the behavioral
# verifier (switched on by this scenario's name) creates a tolerating
# Deployment that only that group can host, asserts the autoscaler scales
# the ASG up and the pods schedule onto a real node, deletes the workload,
# and asserts scale-down back to zero. The scale-down knobs are tuned tight
# through the typed scaling block so the reclaim half of the proof fits a
# lane instead of upstream's 10-minute default.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterAutoscaler
metadata:
  name: e2e-cas-aws
  annotations:
    planton.dev/e2e-cluster-profile: "aws-eks"
spec:
  namespace:
    value: cluster-autoscaler
  create_namespace: true
  aws:
    region: ${E2E_ENV:PLANTON_E2E_AWS_REGION}
    auto_discovery:
      cluster_name: ${E2E_ENV:PLANTON_E2E_EKS_CLUSTER_NAME}
    irsa_role_arn: ${E2E_ENV:PLANTON_E2E_CA_IRSA_ROLE_ARN}
  scaling:
    expander: least-waste
    scale_down:
      unneeded_time: 1m
      delay_after_add: 1m
  deployment:
    replicas: 1
