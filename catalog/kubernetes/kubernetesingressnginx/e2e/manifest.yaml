# Full-surface test manifest: exercises every typed arm of the spec so the
# offline plan proofs cover what the live lanes may not. Not a realistic
# production shape — see presets for those.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIngressNginx
metadata:
  name: hack-ingress-nginx
spec:
  namespace:
    value: hack-ingress-nginx
  createNamespace: true
  chartVersion: "4.15.1"
  ingressClass:
    name: hack-nginx
    isDefaultClass: false
    watchIngressWithoutClass: false
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCpuUtilizationPercent: 60
    targetMemoryUtilizationPercent: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: load_balancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    externalTrafficPolicy: local
    loadBalancerSourceRanges:
      - 10.0.0.0/8
      - 203.0.113.0/24
    loadBalancerClass: service.k8s.aws/nlb
    httpNodePort: 30080
    httpsNodePort: 30443
    internal:
      enabled: true
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
  nginxConfig:
    proxy-body-size: 16m
    use-forwarded-headers: "true"
    worker-shutdown-timeout: 240s
  allowSnippetAnnotations: true
  defaultTlsCertificate:
    secretName:
      value: hack-wildcard-tls
    namespace: hack-ingress-nginx
  defaultBackend:
    enabled: true
    replicas: 1
    image: registry.k8s.io/defaultbackend-amd64:1.5
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
  admissionWebhooks:
    enabled: true
    failurePolicy: ignore
    timeoutSeconds: 20
  metrics:
    enabled: true
    serviceMonitor: true
    serviceMonitorInterval: 45s
    serviceMonitorLabels:
      release: kube-prometheus-stack
  tcpServices:
    "5432": default/postgres:5432
  udpServices:
    "53": kube-system/kube-dns:53
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Equal
      value: ingress
      effect: NoSchedule
  priorityClassName: system-cluster-critical
  imageRegistry: registry.k8s.io
  helmValues: |
    controller:
      enableTopologyAwareRouting: true
