# Tuned install exercising the typed breadth live: custom IngressClass,
# chart-managed autoscaling (the HPA object deploys; metric-driven scaling
# itself is the metrics-server kind's behavioral lane), NGINX ConfigMap
# tuning, admission-webhook tuning, the default backend, metrics endpoint,
# TCP service exposure, and an escape-hatch value. (ServiceMonitor stays
# off: no Prometheus operator CRDs on the kind lane — proven offline.)
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIngressNginx
metadata:
  name: e2e-ingx-tuned
spec:
  namespace:
    value: e2e-ingx-tuned-ns
  createNamespace: true
  chartVersion: "4.15.1"
  ingressClass:
    name: e2e-tuned-nginx
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCpuUtilizationPercent: 75
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
  service:
    type: node_port
    externalTrafficPolicy: local
  nginxConfig:
    proxy-body-size: 8m
    use-forwarded-headers: "true"
  admissionWebhooks:
    enabled: true
    timeoutSeconds: 20
  defaultBackend:
    enabled: true
  metrics:
    enabled: true
  tcpServices:
    "5432": e2e-ingx-tuned-ns/example-db:5432
  helmValues: |
    controller:
      labels:
        e2e.planton.dev/scenario: tuned-full
