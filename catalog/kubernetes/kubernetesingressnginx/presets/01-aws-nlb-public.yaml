apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIngressNginx
metadata:
  name: ingress-nginx
spec:
  namespace:
    value: ingress-nginx
  createNamespace: true
  ingressClass:
    name: nginx
    isDefaultClass: true # Ingresses without a class land here; at most one default class per cluster
  replicas: 2 # zero-drop rollouts + node-failure tolerance; the chart auto-creates a PDB at >1
  service:
    type: load_balancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    externalTrafficPolicy: local # preserve client source IPs; no extra node hop
