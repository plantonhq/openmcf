# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetespriorityclass
spec:
  kubernetes:
    rules:
      - api_groups:
          - scheduling.k8s.io
        resources:
          - priorityclasses
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_priority_class_v1.priority_class -- the module's only resource, one cluster-scoped scheduling.k8s.io/v1 PriorityClass. delete is exercised on every value change too, since value is immutable and forces delete-then-create replacement.
