# Consumer-scoped operator fixture for the KubernetesPostgres lanes: the
# plugin-enabled posture. Postgres backup blocks render Barman Cloud
# ObjectStore resources, so every lane runs against an operator that can
# actually serve them; the plugin's TLS needs cert-manager, chained here as
# the fixture's own prerequisite (install manifests declare their composed
# fixtures — the framework orders the chain automatically).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCloudNativePgOperator
metadata:
  name: e2e-cnpg-for-postgres
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesCertManager"
spec:
  namespace:
    value: cnpg-system
  create_namespace: true
  barman_cloud_plugin:
    enabled: true
