# Consumer-scoped PostgreSQL fixture for the KubernetesMlflow lanes —
# the composed backend store the full-surface and behavioral scenarios
# wire against:
# - SHARED NAMESPACE (e2e-mlflow): the scenarios co-locate with this
#   fixture because the module reads the database credential Secret to
#   compose the backend-store URI, and a Secret can only be consumed
#   from the workload's own namespace.
# - ONE BOOTSTRAP DATABASE: initdb creates `mlflow` owned by the
#   `mlflow` role — the server creates and migrates its tables (and,
#   with auth on, its user/permission tables) inside it.
# - The operator maintains the `e2e-mlfw-pg-app` credential Secret
#   (keys username/password) across failovers — the composition target
#   of every scenario's password reference.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: e2e-mlfw-pg
spec:
  namespace:
    value: e2e-mlflow
  create_namespace: true
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: mlflow
      owner: mlflow
