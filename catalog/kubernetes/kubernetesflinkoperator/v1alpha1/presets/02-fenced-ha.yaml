apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesFlinkOperator
metadata:
  name: flink-operator
spec:
  namespace:
    value: flink-system
  createNamespace: true
  watchNamespaces:
    - stream-team-a
    - stream-team-b
  replicas: 2
  operatorConfig:
    kubernetes.operator.reconcile.interval: 15 s
