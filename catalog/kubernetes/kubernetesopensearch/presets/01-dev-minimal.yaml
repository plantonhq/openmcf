apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearch
metadata:
  name: dev-opensearch
spec:
  namespace:
    value: dev-opensearch
  create_namespace: true
  version: 2.19.4
  node_pools:
    # TWO nodes carrying every role — the smallest shape that survives
    # the operator's bootstrap handoff (a single manager-eligible
    # replica strands the quorum; verified live, and the spec rejects
    # it). Production splits
    # cluster_manager from data (see the production preset). Roles are
    # the UNDERSCORE forms; a dashed "cluster-manager" fails only at
    # node startup, never at apply.
    - name: all
      replicas: 2
      roles:
        - cluster_manager
        - data
        - ingest
      # Heap at roughly half the container memory — the OpenSearch
      # sizing rule; the rest is OS page cache the engine relies on.
      jvm: -Xmx1G -Xms1G
      disk_size: 10Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
  # Generated TLS on both layers: the operator issues a CA and real
  # certificates for node-to-node and client traffic. KNOW THIS: the
  # operator does NOT generate a random admin password — the
  # <name>-admin-password Secret holds the image's well-known DEMO
  # admin credentials. Acceptable only inside a private dev cluster;
  # anything real brings a custom security.config or rotates the
  # password through the security API immediately after install.
  security:
    transport_tls:
      generate: true
    http_tls:
      generate: true
