# The composed surface: role-split pools (dedicated cluster managers +
# data nodes), Dashboards enabled (the verifier asserts its deployment
# and the console Service), bootstrap tuning, cluster-level extra
# configuration and service annotations — every live-safe field class
# exercised (keystore/snapshot-repository/additional-volume arms ride
# the offline plan proofs; they need external fixtures).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearch
metadata:
  name: e2e-os-full
spec:
  namespace:
    value: e2e-os-full
  create_namespace: true
  version: 2.19.2
  http_port: 9200
  set_vm_max_map_count: true
  additional_config:
    cluster.routing.allocation.disk.threshold_enabled: "false"
  service_annotations:
    e2e.planton.dev/lane: full-surface
  bootstrap:
    jvm: -Xmx256M -Xms256M
  node_pools:
    # Two dedicated managers — the MANAGER FLOOR (a single
    # manager-eligible replica is stranded by the operator's bootstrap
    # handoff; verified live).
    - name: managers
      replicas: 2
      roles:
        - cluster_manager
      jvm: -Xmx384M -Xms384M
      disk_size: 2Gi
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: 500m
          memory: 1Gi
    - name: data
      replicas: 1
      roles:
        - data
        - ingest
      jvm: -Xmx512M -Xms512M
      disk_size: 3Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1536Mi
      additional_config:
        node.attr.temp: hot
  security:
    transport_tls:
      generate: true
      per_node: true
    http_tls:
      generate: true
  dashboards:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi
    service:
      type: ClusterIP
