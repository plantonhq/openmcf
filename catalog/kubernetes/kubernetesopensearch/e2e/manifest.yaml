# Full-surface manifest for offline module proofs (tofu validate/plan and
# pulumi preview). Exercises every typed block coherently: a three-pool
# topology (dedicated cluster managers, PVC-backed data nodes with a hard
# PDB, emptyDir coordinators with a percentage PDB), cluster- and pool-level
# additional config, bootstrap tuning, generated transport/HTTP TLS plus a
# custom security config, Dashboards with TLS and a LoadBalancer service,
# Prometheus monitoring, keystore loads, an S3 snapshot repository (with the
# matching repository-s3 plugin), an additional certificate volume, a custom
# image and pull secrets. Both engines must render an identical
# OpenSearchCluster CR from it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearch
metadata:
  name: os-hack
spec:
  namespace:
    value: os-hack-ns
  createNamespace: true
  version: 2.19.4
  httpPort: 9201
  nodePools:
    - name: managers
      replicas: 3
      roles:
        - cluster_manager
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 2Gi
      jvm: -Xmx1G -Xms1G
      diskSize: 10Gi
      persistence:
        pvc:
          storageClass:
            value: fast-ssd
      pdb:
        enable: true
        minAvailable: "2"
    - name: data
      replicas: 3
      roles:
        - data
        - ingest
      resources:
        limits:
          cpu: 2000m
          memory: 8Gi
        requests:
          cpu: 1000m
          memory: 8Gi
      jvm: -Xmx4G -Xms4G
      diskSize: 100Gi
      persistence:
        pvc:
          storageClass:
            value: fast-ssd
      additionalConfig:
        indices.memory.index_buffer_size: "20%"
      nodeSelector:
        workload: search
      tolerations:
        - key: dedicated
          operator: Equal
          value: search
          effect: NoSchedule
      pdb:
        enable: true
        maxUnavailable: 25%
    - name: coordinators
      replicas: 2
      roles:
        - remote_cluster_client
      persistence:
        emptyDir:
          sizeLimit: 5Gi
  additionalConfig:
    action.auto_create_index: "false"
    cluster.routing.allocation.disk.watermark.low: 85%
  serviceAnnotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  setVmMaxMapCount: true
  drainDataNodes: true
  pluginsList:
    - repository-s3
  bootstrap:
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
    jvm: -Xmx512M -Xms512M
    additionalConfig:
      cluster.initial_cluster_manager_nodes: os-hack-bootstrap-0
  security:
    transportTls:
      generate: true
      perNode: true
    httpTls:
      generate: false
      secret:
        value: os-hack-http-cert
    config:
      securityConfigSecret:
        value: os-hack-securityconfig
      adminSecret:
        value: os-hack-admin-cert
      adminCredentialsSecret:
        value: os-hack-admin-creds
  dashboards:
    enabled: true
    replicas: 2
    version: 2.19.4
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    tls:
      enable: true
      generate: true
    basePath: /dashboards
    additionalConfig:
      opensearch_security.multitenancy.enabled: "true"
    opensearchCredentialsSecret:
      value: os-hack-dashboards-creds
    service:
      type: LoadBalancer
      loadBalancerSourceRanges:
        - 10.0.0.0/8
    pluginsList:
      - https://example.com/dashboards-plugin.zip
  monitoring:
    enabled: true
    scrapeInterval: 30s
    monitoringUserSecret:
      value: os-hack-monitoring-creds
    pluginUrl: https://example.com/prometheus-exporter-2.19.4.0.zip
  keystore:
    - secret:
        value: os-hack-s3-keys
      keyMappings:
        accessKey: s3.client.default.access_key
        secretKey: s3.client.default.secret_key
  snapshotRepositories:
    - name: nightly-backups
      type: s3
      settings:
        bucket: os-hack-snapshots
        region: us-east-1
        base_path: os-hack
  additionalVolumes:
    - name: extra-ca
      path: /usr/share/opensearch/config/extra-ca
      subPath: ca.crt
      secretName: os-hack-extra-ca
      restartPods: true
    - name: custom-log4j
      path: /usr/share/opensearch/config/log4j2.properties.d
      configMapName: os-hack-log4j
  image:
    repo: registry.example.com/opensearch/opensearch
    tag: 2.19.4-custom
  imagePullSecrets:
    - registry-pull-secret
