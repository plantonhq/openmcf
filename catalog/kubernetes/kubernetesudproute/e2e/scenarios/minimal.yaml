apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesUdpRoute
metadata:
  name: e2e-udp-route
spec:
  namespace:
    value: default
  parent_refs:
    - name:
        value: e2e-gateway
      section_name: udp
  rules:
    - backend_refs:
        - name:
            value: dns-backend
          port: 53
