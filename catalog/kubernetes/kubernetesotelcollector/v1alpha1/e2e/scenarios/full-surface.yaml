# Full-surface: the DAEMONSET node-log pattern — the filelog receiver
# reading kube-system's pod log files from the node through hostPath
# mounts, running as root (container runtimes write pod log files
# readable only by root — the spec's pod_security_context field exists
# for exactly this), plus the standard OTLP receiver (the outputs
# contract) and typed resources. The verifier asserts real node-log
# ingestion (log.file.path records) AND the OTLP pipeline proof.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelCollector
metadata:
  name: e2e-otelcol-ds
spec:
  namespace:
    value: e2e-otelcol-ds
  createNamespace: true
  mode: daemonset
  configYaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/kube-system_*/*/*.log
        start_at: beginning
        operators:
          - type: container
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
  volumes:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
      hostPath:
        path: /var/log/pods
        type: Directory
    - name: filelog-checkpoints
      mountPath: /var/lib/otelcol
      hostPath:
        path: /var/lib/otelcol-e2e-checkpoints
        type: DirectoryOrCreate
  podSecurityContext:
    runAsUser: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
