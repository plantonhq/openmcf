# Minimal collector: deployment mode (the CRD default — deliberately
# not declared), the standard OTLP receiver, the debug exporter at
# detailed verbosity (the verifier's assertion surface). The operator
# injects its default collector image and derives the Service ports
# from the declared receivers.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelCollector
metadata:
  name: e2e-otelcol-min
spec:
  namespace:
    value: e2e-otelcol-min
  createNamespace: true
  configYaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
