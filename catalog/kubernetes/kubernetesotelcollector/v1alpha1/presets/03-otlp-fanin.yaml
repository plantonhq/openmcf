apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelCollector
metadata:
  name: otlp-fanin
spec:
  namespace:
    value: observability
  mode: deployment
  configYaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      otlphttp:
        # Replace the host with your logs backend — a KubernetesLoki
        # gateway ingests OTLP at its /otlp route.
        endpoint: http://loki-gateway.observability.svc.cluster.local:80/otlp
      otlp:
        # Replace the host with your traces backend — compose from a
        # Tempo install's OTLP gRPC endpoint.
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
  autoscaler:
    minReplicas: 2
    maxReplicas: 5
    targetCpuUtilization: 75
