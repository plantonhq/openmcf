apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTempo
metadata:
  name: tempo-jaeger
spec:
  namespace:
    value: tracing
  create_namespace: true
  replicas: 1
  disk_size: 20Gi
  retention: 168h
  # Accept spans over the four legacy Jaeger protocols in addition to
  # OTLP — for fleets still emitting Jaeger while they migrate to OTLP.
  jaeger_receivers_enabled: true
  # The Jaeger-UI-compatible query frontend (port 16686) for tooling that
  # speaks the Jaeger API; Grafana remains the primary query surface via
  # the tempo datasource.
  tempo_query_enabled: true
