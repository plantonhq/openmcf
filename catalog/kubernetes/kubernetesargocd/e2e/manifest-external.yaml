# The external-Redis arm with the local admin user disabled (pure-SSO
# posture would follow via sso; kept minimal here to prove the arm and the
# admin-off rendering).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesArgocd
metadata:
  name: argocd-ext
spec:
  namespace:
    value: argocd-ext
  createNamespace: true
  adminEnabled: false
  redis:
    external:
      host:
        value: redis.cache.svc.cluster.local
      port: 6380
      credentialsSecretName: argocd-redis-creds
