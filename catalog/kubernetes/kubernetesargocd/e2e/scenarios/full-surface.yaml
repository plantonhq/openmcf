# Every fixture-free knob exercised on the kind cluster: the public
# domain, the plain-HTTP server posture behind composed exposure (the
# verifier follows the scheme — configs.params rendering under proof),
# per-component resources, explicit toggleable components including the
# commit server, direct-OIDC SSO as a PKCE public client (no Secret
# fixture; the issuer is exercised at login time only — rollout is
# unaffected), Argo CD RBAC, exec, a faster reconciliation loop, public
# repository registrations, and explicit CRD keep semantics.
#
# Kind-honest exclusions: redis-ha needs three schedulable workers (the
# single-node lane pins the bundled arm); service_monitors_enabled needs
# the Prometheus Operator CRDs (a stack fixture) — both plan-proven.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesArgocd
metadata:
  name: e2e-argocd-full
spec:
  namespace:
    value: e2e-argocd-full
  create_namespace: true
  domain: argocd.e2e.example.com
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  server:
    insecure: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
  repo_server:
    replicas: 1
  notifications:
    enabled: true
  dex:
    enabled: false
  commit_server:
    enabled: true
  sso:
    oidc:
      name: E2E-OIDC
      issuer: https://login.e2e.example.com/oidc
      client_id: argocd-e2e
  rbac:
    policy_default: role:readonly
    policy_csv: |
      g, e2e-org:platform, role:admin
  exec_enabled: true
  reconciliation_timeout: 90s
  repositories:
    - name: example-apps
      url: https://github.com/argoproj/argocd-example-apps
    - name: argo-charts
      url: https://argoproj.github.io/argo-helm
      type: helm
  # Shared-cluster lane hygiene: kept TEMPLATED CRDs would fail the next
  # lane's install on Helm ownership validation — this lane removes its
  # CRDs on destroy (the keep posture is proven on the behavioral lane).
  crds:
    install: true
    keep: false
