apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesResourceQuota
metadata:
  name: team-namespace-governed
spec:
  name: team-namespace-governed
  namespace:
    value: "<your-namespace>"
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
  limit_defaults:
    - type: container
      default_request:
        cpu: 100m
        memory: 128Mi
      default_limit:
        cpu: 500m
        memory: 512Mi
