apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIstio
metadata:
  name: my-istio
spec:
  # Control-plane namespace ("istio-system" by convention).
  namespace:
    value: istio-system
  createNamespace: true
  # Classic sidecar data plane (the default): namespaces opt in to injection
  # with the istio-injection=enabled label.
  dataplaneMode: sidecar
  # istiod autoscales via the chart's HPA by default (min 1 / max 5 at 80% CPU).
