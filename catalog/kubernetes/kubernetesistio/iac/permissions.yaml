# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesistio
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.istio -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.istio_crds -- one instance per CRD document in the pinned istio/base crd-all.gen.yaml bundle (fetched via the http data source, which needs no cluster permission), each applied cluster-scoped via server-side apply with force_conflicts. The base release itself templates NO CRDs (base.excludedCRDs covers the whole bundle).
      - api_groups:
          - admissionregistration.k8s.io
        resources:
          - validatingwebhookconfigurations
          - mutatingwebhookconfigurations
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers the charts' webhook plumbing -- the default-revision validating webhook rendered by helm_release.base, and the config-validation and sidecar-injector webhooks rendered by helm_release.istiod. All are cluster-scoped admission objects.
      - api_groups:
          - ""
        resources:
          - services
          - configmaps
          - serviceaccounts
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the release-owned core objects in the install namespace -- the istiod Service, the mesh and injection-template ConfigMaps, and the per-component ServiceAccounts the istiod, cni, and ztunnel charts render (helm_release.istiod, helm_release.cni, helm_release.ztunnel).
      - api_groups:
          - apps
        resources:
          - deployments
          - daemonsets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: "Covers the charts' workloads: the istiod Deployment (helm_release.istiod, always); the istio-cni node-agent DaemonSet (helm_release.cni -- rendered when dataplane_mode is ambient or spec.cni.enabled is true); and the ztunnel DaemonSet (helm_release.ztunnel -- ambient mode only)."
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers the charts' cluster-scoped RBAC for the istiod and cni ServiceAccounts. istiod's ClusterRole is BROAD by the product's nature -- cluster-wide reads of services, endpoints, pods, nodes, and the Istio and Gateway API CRDs, plus certificate signing and gateway-deployment provisioning; Kubernetes escalation prevention means the runner must already hold every permission those ClusterRoles grant, or carry the escalate verb.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the charts' namespaced RBAC in the install namespace (istiod's leader-election and webhook-management Roles and their bindings). The same escalation-prevention caveat as the cluster-scoped rule applies.
      - api_groups:
          - autoscaling
        resources:
          - horizontalpodautoscalers
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the istiod HPA -- the chart enables it by default (istiod.autoscale, min 1 / max 5); a fixed istiod.replicas renders the release with autoscaleEnabled false and no HPA.
      - api_groups:
          - policy
        resources:
          - poddisruptionbudgets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the istiod PodDisruptionBudget -- istiod.pod_disruption_budget defaults to true, so the chart renders it unless explicitly disabled. The helm_values overlays (spec.helm_values.*, merged last) can extend each chart's object surface beyond these rules generally; grants for such extensions ride the operator's review of the overlay, not this manifest.
