apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGhaRunnerScaleSet
metadata:
  name: org-docker-runners
spec:
  namespace:
    value: ci-runners
  create_namespace: true
  # An ORGANIZATION registration: every repository the runner group
  # admits can use this fleet.
  github_config_url: https://github.com/my-org
  auth:
    # A GitHub App (Secret keys github_app_id /
    # github_app_installation_id / github_app_private_key) — the
    # production credential: fine-grained permissions, expiring tokens.
    existing_secret_name: github-app-credential
  # The runner group controls WHICH repositories may use the fleet
  # (create it in the GitHub organization settings first).
  runner_group: platform
  # dind: a privileged Docker-in-Docker sidecar per runner — docker
  # build/run steps work. The cluster must allow privileged pods in
  # this namespace.
  container_mode:
    mode: dind
  min_runners: 2
  max_runners: 30
  runner:
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
