apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGhaRunnerScaleSet
metadata:
  name: secure-runners
spec:
  namespace:
    value: ci-runners
  create_namespace: true
  github_config_url: https://github.com/my-org/my-repo
  auth:
    existing_secret_name: github-credential
  # kubernetes mode: container jobs run as SEPARATE unprivileged pods
  # through the runner container hook — no privileged daemon anywhere.
  # Each runner claims an ephemeral work volume; the StorageClass must
  # provision dynamically.
  container_mode:
    mode: kubernetes
    kubernetes_work_volume:
      storage_class:
        value: standard
      size: 2Gi
  min_runners: 0
  max_runners: 10
