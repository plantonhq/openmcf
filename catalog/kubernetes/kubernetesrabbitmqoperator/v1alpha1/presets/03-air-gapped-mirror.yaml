apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRabbitMqOperator
metadata:
  name: rabbitmq-operator
spec:
  # The operator image itself, re-pointed at a private mirror. Keep the
  # tag at the pinned release (the released manifest pins
  # ghcr.io/rabbitmq/cluster-operator:2.22.3).
  operator_image:
    repo: registry.example.internal/rabbitmq/cluster-operator
    tag: 2.22.3
    pull_secret_name: mirror-pull
  # Fleet-wide default images for every RabbitmqCluster the operator
  # creates. The -management variant is REQUIRED — the operator's
  # generated configuration expects the management plugin.
  default_rabbitmq_image: registry.example.internal/rabbitmq:4.2.6-management
  # Only consulted by Vault-backed clusters (the credential-updater
  # sidecar).
  default_user_updater_image: registry.example.internal/default-user-credential-updater:1.0.14
  # Pull-secret names in the rabbitmq-system namespace.
  image_pull_secrets:
    - mirror-pull
