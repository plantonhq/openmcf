# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kuberneteskafkamirrormaker2
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.namespace -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_config_map_v1.mirrormaker2_metrics -- the canonical Strimzi JMX exporter rules ConfigMap, rendered in the engine's namespace only when spec.metrics.enabled is true.
      - api_groups:
          - kafka.strimzi.io
        resources:
          - kafkamirrormaker2s
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubectl_manifest.mirrormaker2 -- the kafka.strimzi.io/v1 KafkaMirrorMaker2 custom resource applied via server-side apply, created unconditionally in the engine's namespace.
