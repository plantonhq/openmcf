apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaMirrorMaker2
metadata:
  name: msk-migration
spec:
  namespace:
    value: kafka
  replicas: 3
  target:
    # Where mirrored data lands — the Strimzi-managed cluster (a
    # KubernetesKafka reference in an infra chart; the literal is its
    # in-cluster bootstrap endpoint).
    bootstrap_servers:
      value: events-kafka-bootstrap.kafka.svc.cluster.local:9092
    config:
      # Production target: the engine's internal topics at RF 3.
      config.storage.replication.factor: "3"
      offset.storage.replication.factor: "3"
      status.storage.replication.factor: "3"
  mirrors:
    - source:
        # The alias names the source in the replication flow; with
        # IdentityReplicationPolicy (below) it no longer prefixes
        # topic names.
        alias: prod-msk
        # MSK's SCRAM listener (port 9096) — an external literal.
        bootstrap_servers:
          value: b-1.prod-msk.abc123.kafka.us-west-2.amazonaws.com:9096
        # MSK SCRAM rides TLS: trust the CA bundle from a Secret (a
        # glob over its files — AWS trust bundles carry several).
        tls:
          trusted_certificates:
            - secret_name:
                value: prod-msk-ca
              pattern: "*.crt"
        # MSK SCRAM credentials from a Secret — never the manifest.
        authentication:
          type: scram-sha-512
          username: mm2-reader
          password_secret:
            secret_name:
              value: prod-msk-credentials
            password: password
      topics_pattern: ".*"
      groups_pattern: ".*"
      source_connector:
        # Match the source's partition volume.
        tasks_max: 8
        config:
          # THE MIGRATION RECIPE: original topic names on the target —
          # on BOTH connectors, always (a policy mismatch translates
          # offsets onto topic names that do not exist).
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
        auto_restart:
          enabled: true
          max_restarts: 10
      checkpoint_connector:
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          # Write translated consumer offsets straight into the
          # target's group state (for groups idle there) — consumers
          # cut over and resume in place.
          sync.group.offsets.enabled: "true"
        auto_restart:
          enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  jvm:
    xms: 1g
    xmx: 1g
  metrics:
    enabled: true
