# The accounts arm: multi-tenant isolation with per-account JetStream,
# MQTT + leafnodes listeners, client TLS from an existing Secret and
# JetStream disabled memory-tier checks — the offline proof for the
# accounts + listener + TLS rendering.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNats
metadata:
  name: nats-accounts
spec:
  namespace:
    value: nats-accounts
  createNamespace: true
  cluster:
    enabled: true
  auth:
    accounts:
      - name: team-a
        jetStreamEnabled: true
        users:
          - username: svc-a
            permissions:
              publishAllow:
                - "a.>"
              subscribeAllow:
                - "a.>"
                - "_INBOX.>"
      - name: team-b
        users:
          - username: svc-b
  tls:
    secretName:
      value: nats-server-tls
    verifyClients: true
  mqtt:
    enabled: true
  leafnodes:
    enabled: true
    port: 7422
  natsBoxEnabled: false
