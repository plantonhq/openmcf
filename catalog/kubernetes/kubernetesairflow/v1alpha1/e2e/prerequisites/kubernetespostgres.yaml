# Consumer-scoped PostgreSQL fixture for the KubernetesAirflow lanes —
# the composed metadata database every scenario wires against:
# - SHARED NAMESPACE (e2e-airflow): the scenarios co-locate with this
#   fixture because the module reads the database credential Secret to
#   compose Airflow's connection Secret, and a Secret can only be
#   consumed from the workload's own namespace.
# - ONE BOOTSTRAP DATABASE: initdb creates `airflow` owned by the
#   `airflow` role — the migration Job creates the tables inside it
#   with a least-privilege application user (no CREATEDB grant).
# - The operator maintains the `e2e-aflw-pg-app` credential Secret
#   (keys username/password) across failovers — the composition target
#   of every scenario's password reference.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: e2e-aflw-pg
spec:
  namespace:
    value: e2e-airflow
  create_namespace: true
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: airflow
      owner: airflow
