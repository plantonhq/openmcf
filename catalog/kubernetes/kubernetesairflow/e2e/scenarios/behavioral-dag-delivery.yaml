# THE DELIVERY + DURABILITY PROOF: DAGs ride a shared persistent
# volume; the verifier writes its own marker DAG into the volume
# (through the dag-processor pod — the parser's own mount), waits for
# the DAG PROCESSOR to parse it into the API, triggers it to a
# SUCCESSFUL run, then DELETES the scheduler pod (UID-verified
# replacement — status flapping Ready on a dying pod is not recovery)
# and triggers a SECOND run: scheduling state lives in the composed
# PostgreSQL, never in the pod. KubernetesExecutor keeps the lane to
# one moving part (no broker).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAirflow
metadata:
  name: e2e-aflw-dag
spec:
  namespace:
    value: e2e-airflow
  database:
    postgres:
      host:
        valueFrom:
          name: e2e-aflw-pg
      password_secret:
        secret_name:
          valueFrom:
            name: e2e-aflw-pg
  dags:
    persistence:
      size: 1Gi
  components:
    triggerer:
      persistence_size: 1Gi
