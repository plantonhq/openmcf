apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesBackendTlsPolicy
metadata:
  name: my-backend-tls
spec:
  namespace:
    # The policy can only target Services in ITS OWN namespace — create it
    # where the backend Service lives.
    value: <backend-namespace>
  targetRefs:
    - group: "" # Services live in the core API group — empty but present
      kind: Service
      # Literal Service name — the backend is not Planton-managed. Switch
      # to `valueFrom:` (kind KubernetesService, fieldPath
      # status.outputs.service_name) for a Planton-managed backend.
      name:
        value: <backend-service-name>
  validation:
    # Trust the implementation's system certificate store — no CA bundle
    # to create or rotate. "System" is the one upstream-defined value.
    well_known_ca_certificates: System
    # Sent as SNI and, with no subjectAltNames, the identity the backend
    # certificate must prove.
    hostname: api.example.com
