apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesHarbor
metadata:
  name: harbor
spec:
  namespace:
    value: harbor
  createNamespace: true
  # The public address TLS terminates at (the composed exposure or the
  # cloud load balancer) — OCI clients authenticate against exactly
  # this address.
  externalUrl: https://harbor.example.com
  expose:
    serviceType: LoadBalancer
    tls:
      enabled: true
      # The cert-manager seam: a KubernetesCertificate for
      # harbor.example.com exports this Secret.
      certSecretName:
        valueFrom:
          kind: KubernetesCertificate
          name: harbor-cert
          fieldPath: status.outputs.secret_name
    serviceAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  database:
    external:
      # Composes a KubernetesPostgres: the host tracks the current
      # primary, and the operator-maintained app Secret's key is
      # exactly the chart's contract key (`password`).
      host:
        valueFrom:
          kind: KubernetesPostgres
          name: harbor-pg
          fieldPath: status.outputs.rw_service
      username: harbor
      passwordSecretName:
        valueFrom:
          kind: KubernetesPostgres
          name: harbor-pg
          fieldPath: status.outputs.password_secret.name
      coreDatabase: registry
  cache:
    external:
      addr:
        valueFrom:
          kind: KubernetesValkey
          name: harbor-valkey
          fieldPath: status.outputs.kube_endpoint
      # Valkey's generated auth Secret keys passwords BY USERNAME —
      # bridge with a Secret carrying the chart's REDIS_PASSWORD
      # contract key, or declare the same password on both sides.
      existingSecretName: harbor-redis-auth
  storage:
    s3:
      bucket: harbor-artifacts
      region: us-east-1
      # In-cluster S3 via a composed KubernetesSeaweedFs; for AWS S3
      # drop the endpoint and let IRSA provide ambient credentials
      # (omit credentials entirely).
      endpoint:
        valueFrom:
          kind: KubernetesSeaweedFs
          name: harbor-objects
          fieldPath: status.outputs.s3_endpoint
      credentials:
        existingSecretName: harbor-s3-auth
      # REQUIRED for in-cluster stores clients cannot reach — a
      # redirect would hand clients an unreachable URL.
      disableRedirect: true
      secure: false
  core:
    replicas: 2
  portal:
    replicas: 2
  registry:
    replicas: 2
  jobservice:
    replicas: 2
  nginx:
    replicas: 2
  metrics:
    enabled: true
    serviceMonitorEnabled: true
