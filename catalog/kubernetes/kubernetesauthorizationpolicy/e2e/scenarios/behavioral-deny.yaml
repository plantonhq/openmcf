# The behavioral proof: with a real mesh installed (KubernetesIstio) and two
# meshed workloads (an injected client and backend), a DENY policy on the
# backend must turn the client's previously-working request into an
# RBAC-denied 403 — real enforcement in the data plane, not just object
# existence. The verifier switches to behavioral assertions precisely
# because this scenario names KubernetesIstio in its prerequisites.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAuthorizationPolicy
metadata:
  name: e2e-authz-deny
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesIstio, catalog/kubernetes/kubernetesauthorizationpolicy/e2e/fixture-mesh-namespace.yaml, catalog/kubernetes/kubernetesauthorizationpolicy/e2e/fixture-backend-deployment.yaml, catalog/kubernetes/kubernetesauthorizationpolicy/e2e/fixture-client-deployment.yaml"
spec:
  namespace:
    value: e2e-authz-mesh
  selector:
    match_labels:
      app: e2e-authz-backend
  action: DENY
  rules:
    - to:
        - operation:
            methods:
              - GET
