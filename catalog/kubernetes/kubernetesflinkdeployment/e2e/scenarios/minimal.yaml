# Minimal SESSION cluster: no job — an empty Flink runtime accepting
# external submissions. Native mode, defaults end to end. The verifier
# proves the JobManager serves its OWN REST contract: /config answers
# with the declared Flink version — the session cluster's definition of
# ready (native mode holds zero TaskManagers until a job asks).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesFlinkDeployment
metadata:
  name: e2e-flnkd-min
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesFlinkOperator"
spec:
  # JOINS the fixture-owned namespace (the operator fixture owns
  # e2e-flink).
  namespace:
    value: e2e-flink
  flinkVersion: v2_1
