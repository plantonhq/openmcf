# The floor form: at least 1 pod of the selected app must survive any
# voluntary disruption. Selects via the documented workload label contract
# (`app` = the workload's metadata.name).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPodDisruptionBudget
metadata:
  name: e2e-pdb-min
spec:
  namespace:
    value: default
  name: e2e-pdb-min
  selector:
    match_labels:
      app: e2e-fixture-app
  min_available: "1"
