# Fixture for the data-source scenarios on the aws-eks profile: the source
# PVC (on the batch's snapshot-capable e2e-gp3 class) and a writer Job that
# triggers the WaitForFirstConsumer bind and stamps marker data onto the
# volume. The VolumeSnapshot itself is VERIFIER-OWNED: it must be cut only
# after the writer completes (a fixture-applied snapshot could freeze the
# volume before the marker lands), and the snapshot API is exactly the
# behavioral surface under proof.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesManifest
metadata:
  name: e2e-pvc-ds-source
spec:
  namespace:
    value: e2e-pvc-ds
  create_namespace: true
  manifest_yaml: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: e2e-pvc-ds-source
      namespace: e2e-pvc-ds
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: e2e-gp3
      resources:
        requests:
          storage: 1Gi
    ---
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: e2e-pvc-ds-writer
      namespace: e2e-pvc-ds
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: writer
              image: busybox:1.36
              command:
                - sh
                - -c
                - "echo pvc-data-source-proof > /data/marker && sync"
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 25m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: e2e-pvc-ds-source
