apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: kubernetesopensearchoperator
spec:
  tier: 3
  status: deferred
  deferred_reason: >-
    Both engines read the CRD set from ../crds, a sibling directory no
    published form of the module carries (module.zip, source.zip, and the
    Pulumi binary workspace hold only the engine directory), so no fresh
    install from a release has ever converged, and a lane that passes from
    the source tree proves nothing about what ships. Lifts when the module
    derives its CRDs from the pinned version and leaves the known_violations
    table of hack/guards/ensure_modules_are_self_contained.sh.
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
