# The second act of upgrade.yaml: the same resource, chart 2.8.0, and the
# CRDs released at destroy so the lane cleans up after itself. Not a
# scenario of its own (the second-act annotation keeps discovery from
# running it as a lane) -- the harness deploys it only through the upgrade
# annotation on upgrade.yaml.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearchOperator
metadata:
  name: e2e-osop-upg
  annotations:
    planton.dev/e2e-second-act: upgrade.yaml
spec:
  namespace:
    value: e2e-osop-upg
  create_namespace: true
  chart_version: 2.8.0
  crds:
    keep_on_uninstall: false
