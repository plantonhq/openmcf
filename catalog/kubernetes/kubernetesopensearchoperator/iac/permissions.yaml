# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesopensearchoperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.opensearch_operator -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered objects applied by helm_release.opensearch_operator -- the operator ServiceAccount and the controller-manager metrics Service (the chart's longest child name, the reason for the 27-character resource-name budget).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The controller-manager Deployment (the manager container plus the kube-rbac-proxy sidecar while kube_rbac_proxy_enabled, the default) applied by helm_release.opensearch_operator.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart's default RBAC posture (cluster-wide watch) grants the operator rights to reconcile OpenSearchCluster resources and their children (StatefulSets, Services, Secrets, ConfigMaps, PVCs) in every namespace, plus the kube-rbac-proxy's token-review rights -- an operator chart's RBAC is among the widest in the catalog. Rendered by helm_release.opensearch_operator.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Namespaced RBAC the chart renders -- the operator's leader-election Role in its own namespace, and the namespace-scoped binding posture when spec.use_role_bindings is true (paired with watch_namespace by the spec's CEL rule).
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.helm_crds (Terraform, the generated helm_crds.tf) and the Pulumi twin (keptcrds) -- the MODULE-OWNED OpenSearch CRDs (opensearch.opster.io), derived from the pinned chart at apply time and applied via server-side apply OUTSIDE the Helm release, re-applied in place on chart bumps. The list verb also serves the never-downgrade read (CRDs selected by the planton.ai/crd-source label). Delete is exercised only when spec.crds.keep_on_uninstall is false; the default keep posture makes destroy a no-op so an operator uninstall never cascade-deletes OpenSearchCluster resources; the chart's own CRD templating is disarmed by the unconditionally re-pinned installCRDs false. Skipped entirely when spec.crds.install is false.
