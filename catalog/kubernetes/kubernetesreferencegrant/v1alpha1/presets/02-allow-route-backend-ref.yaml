apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesReferenceGrant
metadata:
  name: allow-route-backend-ref
spec:
  # The grant lives in the namespace being referenced INTO (where the backend
  # Services live). `value:` sets the namespace name literally; use `valueFrom:`
  # to reference a Planton-managed KubernetesNamespace instead.
  namespace:
    value: backend-ns
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: app-ns  # the routes' namespace (literal name)
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: app-ns
  to:
    - group: ""
      kind: Service
