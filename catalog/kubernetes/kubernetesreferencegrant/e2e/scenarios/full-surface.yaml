# Full ReferenceGrantSpec: multiple trusted sources, multiple targets, and a
# name-narrowed target entry.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesReferenceGrant
metadata:
  name: e2e-refgrant-full
spec:
  namespace:
    value: default
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: frontend
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Service
    - group: ""
      kind: Secret
      name: shared-tls-cert
