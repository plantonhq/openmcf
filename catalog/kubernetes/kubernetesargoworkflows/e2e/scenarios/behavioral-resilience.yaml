# THE RESILIENCE PROOF: after the standard engine proof (a Workflow run
# to Succeeded), the verifier DELETES the controller pod, waits for a
# REPLACEMENT pod (a new UID — status flapping back Ready on the dying
# pod is not recovery), and submits a SECOND workflow that must also run
# to Succeeded — the engine rebuilds its reconciliation loop from
# cluster state alone.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesArgoWorkflows
metadata:
  name: e2e-argowf-resil
spec:
  namespace:
    value: e2e-argowf-resil
  create_namespace: true
