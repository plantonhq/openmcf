# The composition proof: the route's parent resolves through the Gateway
# foreign key against a live Gateway fixture (its TLS passthrough listener).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTlsRoute
metadata:
  name: e2e-tls-composed
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesGateway"
spec:
  namespace:
    value: default
  parent_refs:
    - name:
        valueFrom:
          name: e2e-gw-fixture
      section_name: tls-passthrough
  hostnames:
    - db.fixture.example.com
    - "*.tenants.fixture.example.com"
  rules:
    - name: passthrough
      backend_refs:
        - name:
            value: secure-backend
          port: 8443
