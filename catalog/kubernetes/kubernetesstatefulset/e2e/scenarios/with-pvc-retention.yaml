# PVC retention policy Delete/Delete: the PVCs stamped from the template are
# removed when the StatefulSet is deleted or scaled down, so the kind cluster
# cleans up its provisioned volumes when the scenario tears down.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStatefulSet
metadata:
  name: e2e-sts-retention
spec:
  namespace:
    value: e2e-sts-ret-ns
  create_namespace: true
  container:
    app:
      image:
        repo: nginx
        tag: "1.27-alpine"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: http
          container_port: 80
          network_protocol: TCP
          app_protocol: http
          service_port: 80
      volume_mounts:
        - name: scratch
          mount_path: /scratch
          pvc:
            claim_name: scratch
  volume_claim_templates:
    - name: scratch
      size: "100Mi"
      access_modes:
        - ReadWriteOnce
  pvc_retention_policy:
    when_deleted: Delete
    when_scaled: Delete
