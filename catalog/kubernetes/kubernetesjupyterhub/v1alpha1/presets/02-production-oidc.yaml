apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesJupyterHub
metadata:
  name: hub
spec:
  namespace:
    value: jupyterhub
  # Co-located with the composed database below: the hub mounts the
  # database credential Secret, and Secrets can only be consumed from
  # the workload's OWN namespace. Deploy the KubernetesPostgres named
  # `hub-db` into this same namespace, declaring `jupyterhub` as its
  # bootstrap database (owner `jupyterhub`).
  create_namespace: true
  hub:
    database:
      postgres:
        # The references resolve to the KubernetesPostgres resource's
        # read-write Service (always the current primary) and its
        # operator-maintained application-credential Secret (key
        # `password`) — the reference defaults, no field paths needed.
        host:
          valueFrom:
            name: hub-db
        password_secret:
          secret_name:
            valueFrom:
              name: hub-db
    # Cap the fleet: at most 200 notebook servers running at once.
    active_server_limit: 200
  authentication:
    # OIDC sign-in — a KubernetesKeycloak realm's endpoints slot
    # straight in (Okta/Auth0/Dex work the same way). Create the
    # `kc-oauth` Secret with the client secret under `client-secret`
    # before deploying.
    oidc:
      client_id: jupyterhub
      client_secret_secret:
        secret_name: kc-oauth
        secret_key: client-secret
      oauth_callback_url: https://hub.example.com/hub/oauth_callback
      authorize_url: https://keycloak.example.com/realms/eng/protocol/openid-connect/auth
      token_url: https://keycloak.example.com/realms/eng/protocol/openid-connect/token
      userdata_url: https://keycloak.example.com/realms/eng/protocol/openid-connect/userinfo
      username_claim: email
      login_service: Keycloak
    admin_users:
      - platform@example.com
  single_user:
    image:
      repository: quay.io/jupyter/scipy-notebook
      tag: "2026-07-28"
    memory_guarantee: 2G
    memory_limit: 4G
    cpu_limit: "2"
    storage:
      dynamic:
        capacity: 20Gi
    # The spawn menu: users pick their machine size at login.
    profiles:
      - display_name: Standard (2G)
        description: Everyday analysis
        default: true
        memory_limit: 2G
      - display_name: Large (8G)
        description: Big-memory ETL and training prep
        memory_guarantee: 4G
        memory_limit: 8G
        cpu_limit: "4"
  scheduling:
    # Two warm placeholder pods: a new user evicts one instantly
    # instead of waiting for the autoscaler to boot a node.
    user_placeholder_replicas: 2
  culling:
    timeout_seconds: 3600
