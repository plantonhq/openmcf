syntax = "proto3";

package dev.planton.kubernetes.kuberneteskarapace.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskarapace/v1alpha1/spec.proto";
import "catalog/kubernetes/kuberneteskarapace/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//kubernetes-karapace
message KubernetesKarapace {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKarapace'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKarapaceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKarapaceStatus status = 5;
}

//kubernetes-karapace status
message KubernetesKarapaceStatus {
  //stack-outputs
  KubernetesKarapaceStackOutputs outputs = 1;
}
