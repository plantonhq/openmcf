apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesVelero
metadata:
  name: velero
spec:
  namespace:
    value: velero # upstream convention
  createNamespace: true
  chartVersion: "12.1.0" # spec default — pin deliberately
  crds:
    upgradeOnInstall: true # chart default
    cleanupOnUninstall: false # chart default — backup records survive uninstall
  backupStorage:
    s3:
      bucket: velero-backups
      # S3-compatible stores use the store's expected region value — MinIO
      # accepts any, "minio" by convention.
      region: minio
      # The S3-COMPATIBLE arm: endpoint URL of the store (in-cluster MinIO
      # here; any S3-compatible endpoint works — Ceph RGW, Spaces, B2, ...).
      s3Url: http://minio.minio.svc:9000
      # Path-style addressing (bucket in the path, not the subdomain) —
      # required by MinIO and most S3-compatible stores.
      forcePathStyle: true
      # An S3-compatible endpoint authenticates with access keys — IRSA
      # only mints AWS credentials. Placeholder values: replace both with
      # your MinIO credentials (access key = username, secret key =
      # password); the secret key is stored as a managed secret.
      accessKeys:
        accessKeyId: velero
        secretAccessKey: <minio-secret-key>
    prefix: '<cluster-name>' # one bucket, one prefix per cluster
  volumeSnapshots:
    # MinIO provides no volume-snapshot provider — volume data rides
    # file-system backup below instead.
    enabled: false
  fsBackup:
    deployNodeAgent: true # kopia node-agent — the volume-data path that works on any volume type
    defaultVolumesToFsBackup: true # every pod volume rides fs-backup, no per-pod annotations
  schedules:
    - name: nightly
      schedule: 0 2 * * *
      ttl: 720h # Velero default — 30 days
