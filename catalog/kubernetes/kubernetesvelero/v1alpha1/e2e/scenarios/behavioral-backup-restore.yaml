# The behavioral proof: Velero must actually BACK UP and RESTORE. The
# scenario installs Velero against the MinIO fixture; the behavioral
# verifier (switched on by this scenario's node-agent posture + fixture)
# then creates a subject namespace with a marker ConfigMap, drives a Backup
# CR to Completed, DELETES the namespace, drives a Restore CR to Completed,
# and asserts the marker came back — the customer-grade DR loop, end to end
# on the kind cluster. Backup/Restore CRs are VERIFIER-OWNED: their CRDs
# are installed by the component under test, so fixtures cannot carry them.
# The spec alongside exercises the meaningful install surface: the
# node-agent DaemonSet (fs-backup machinery installs and rolls out), a
# paused Schedule (the scheduled-backup surface renders end-to-end without
# firing mid-lane), server tuning, and Velero's own metrics.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesVelero
metadata:
  name: e2e-velero-behavioral
  annotations:
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesvelero/v1alpha1/e2e/fixture-minio.yaml"
spec:
  namespace:
    value: velero
  create_namespace: true
  backup_storage:
    s3:
      bucket: velero-backups
      region: minio
      s3_url: http://minio.e2e-velero-minio.svc.cluster.local:9000
      force_path_style: true
      access_keys:
        access_key_id: minioadmin
        secret_access_key: minioadmin
    prefix: e2e-behavioral
  volume_snapshots:
    enabled: false
  fs_backup:
    deploy_node_agent: true
  schedules:
    - name: nightly
      schedule: "0 2 * * *"
      paused: true
      ttl: 168h
      included_namespaces:
        - e2e-velero-subject
  server:
    default_backup_ttl: 72h
    log_level: info
  prometheus:
    enabled: true
