apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRayCluster
metadata:
  name: ml-ray
spec:
  namespace:
    value: ml-platform
  createNamespace: true
  rayVersion: 2.52.0
  head:
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "4"
        memory: 16Gi
    scheduleTasksOnHead: false
  workerGroups:
    - name: cpu
      replicas: 2
      minReplicas: 0
      maxReplicas: 10
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 16Gi
    - name: gpu
      replicas: 0
      minReplicas: 0
      maxReplicas: 4
      resources:
        requests:
          cpu: "4"
          memory: 24Gi
        limits:
          cpu: "8"
          memory: 32Gi
      extraResourceLimits:
        nvidia.com/gpu: "1"
      scheduling:
        nodeSelector:
          accelerator: nvidia
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
  autoscaling:
    enabled: true
    idleTimeoutSeconds: 300
  gcsFaultTolerance:
    enabled: true
    redisAddress:
      valueFrom:
        name: ray-state
    redisPasswordSecret:
      name:
        valueFrom:
          name: ray-state
      key: default
