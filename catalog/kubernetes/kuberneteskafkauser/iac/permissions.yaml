# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kuberneteskafkauser
spec:
  kubernetes:
    rules:
      - api_groups:
          - kafka.strimzi.io
        resources:
          - kafkausers
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubectl_manifest.user -- the module's only resource, applying one KafkaUser (kafka.strimzi.io/v1) in the Kafka cluster's namespace via server-side apply. The credential Secret is generated by Strimzi's user operator, not by the module, so no Secret permission is needed.
