apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUser
metadata:
  name: order-service-producer
spec:
  namespace:
    value: kafka # MUST be the Kafka cluster's own namespace
  kafkaCluster:
    value: my-kafka # the KubernetesKafka resource's metadata.name
  authentication:
    # The user operator generates the password into a Secret named
    # after the user: keys `password` + a ready `sasl.jaas.config`.
    # Must match a scram-sha-512 listener on the cluster.
    type: scram-sha-512
  authorization:
    # Requires the cluster to run simple authorization — the user
    # operator REJECTS ACL-bearing users on clusters without it.
    # Write on the topic is sufficient for idempotent producers on
    # modern Kafka (the legacy IdempotentWrite grant applies to the
    # cluster resource, not topics).
    acls:
      - resource:
          type: topic
          name: orders- # every topic starting with "orders-"
          patternType: prefix
        operations:
          - Write
          - Describe
          - Create # allows the producer to create missing topics
