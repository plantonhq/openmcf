# The kind-honest full surface against the composed database: scaled
# matching/frontend, the internal-frontend service, web UI sizing,
# dynamic-config limits, two declared Temporal namespaces with custom
# retention, tuned connection pools and an escape-hatch entry. The same
# engine proof runs against this shape — a workflow completing through
# scaled services proves membership/routing across replicas.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTemporal
metadata:
  name: e2e-tprl-full
spec:
  namespace:
    value: e2e-temporal
  database:
    postgres:
      host:
        valueFrom:
          name: e2e-tprl-pg
      username: temporal
      passwordSecret:
        secretName:
          valueFrom:
            name: e2e-tprl-pg
      maxConns: 10
      maxIdleConns: 5
  numHistoryShards: 128
  services:
    frontend:
      replicas: 2
    matching:
      replicas: 2
    history:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
  internalFrontendEnabled: true
  webUi:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
  temporalNamespaces:
    - name: default
    - name: e2e-payments
      retention: 7d
  dynamicConfig:
    blobSizeLimitError: 10485760
    blobSizeLimitWarn: 5242880
  logLevel: info
  helmValues: |
    server:
      podLabels:
        e2e-lane: full-surface
