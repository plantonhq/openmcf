# Composed configuration: the ConfigMap is a first-class KubernetesConfigMap
# fixture (declared via the e2e-prerequisites annotation) and the workload
# mounts it by name — the composition pattern that replaced the old inline
# config_maps passthrough.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: e2e-dep-cm
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesConfigMap"
spec:
  namespace:
    value: default
  version: main
  container:
    app:
      image:
        repo: nginx
        tag: "1.27-alpine"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: http
          container_port: 80
          network_protocol: TCP
          app_protocol: http
          service_port: 80
      volume_mounts:
        - name: app-config
          mount_path: /etc/app-config
          config_map:
            name: e2e-cfg-minimal
