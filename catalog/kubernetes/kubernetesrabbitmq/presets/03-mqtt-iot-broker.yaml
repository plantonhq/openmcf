apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRabbitMq
metadata:
  name: iot-broker
spec:
  namespace:
    value: iot
  create_namespace: true
  # 3 nodes (the odd quorum count) — a device fleet reconnects in
  # thundering herds, so broker availability matters from day one.
  replicas: 3
  # Device messages are typically small; 20Gi per node covers queues
  # and the metadata store with room to grow (PVCs cannot shrink).
  disk_size: 20Gi
  configuration:
    # MQTT rides plugins on the shared broker core: rabbitmq_mqtt for
    # the device-facing listener, rabbitmq_web_mqtt for MQTT over
    # WebSockets (browser dashboards, WebSocket-only networks). The
    # always-on essentials (rabbitmq_management, rabbitmq_prometheus,
    # rabbitmq_peer_discovery_k8s) stay; changing this list rolls the
    # cluster.
    additional_plugins:
      - rabbitmq_mqtt
      - rabbitmq_web_mqtt
  # Devices live OUTSIDE the cluster, so the client Service is the
  # exposure surface — no ingress resources exist here by design.
  # The annotation shown is the AWS NLB recipe; replace it with your
  # cloud's LB vocabulary (internal LBs, external-dns hostname, ...).
  service:
    type: load_balancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  # Memory requests = limits ON PURPOSE: RabbitMQ derives its memory
  # high watermark from the container memory LIMIT. 2Gi per node
  # matches the operator's own default memory sizing.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
