# The second act of crds-upgrade.yaml: the same resource at Flagger 1.45.0,
# the CRDs released at destroy so the lane cleans up after itself. Not a
# scenario of its own (the second-act annotation keeps discovery from
# running it as a lane) -- the harness deploys it only through the upgrade
# annotation on crds-upgrade.yaml.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesHelmRelease
metadata:
  name: e2e-helm-crds-upg
  annotations:
    planton.dev/e2e-second-act: crds-upgrade.yaml
    planton.dev/e2e-expect-crds: canaries.flagger.app,metrictemplates.flagger.app,alertproviders.flagger.app
spec:
  namespace:
    value: e2e-helm-crds-upg-ns
  create_namespace: true
  repo: https://flagger.app
  chart: flagger
  version: 1.45.0
  values_yaml: |
    meshProvider: kubernetes
  crds:
    keep_on_uninstall: false
