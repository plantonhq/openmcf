apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: e2e-secret-sa-token
spec:
  name: e2e-secret-sa-token
  namespace:
    value: default
  # The "default" ServiceAccount exists in every namespace, so the token
  # controller can populate this long-lived token immediately.
  serviceAccountToken:
    serviceAccountName:
      value: default
