apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: my-registry-credentials
spec:
  name: my-registry-credentials
  namespace:
    value: "<your-namespace>"
  dockerConfigJson:
    registryServer: "<your-registry-server>"
    username: "<your-registry-username>"
    # The password is a reference to an organization secret, never a literal:
    # the runner resolves it inside your infrastructure at deploy time.
    password: $secret/replace-with-your-registry-token-secret
