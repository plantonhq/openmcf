syntax = "proto3";

package dev.planton.kubernetes.kubernetesqdrant.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesqdrant/v1alpha1/spec.proto";
import "catalog/kubernetes/kubernetesqdrant/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//qdrant-kubernetes
message KubernetesQdrant {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesQdrant'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesQdrantSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesQdrantStatus status = 5;
}

//qdrant-kubernetes status.
message KubernetesQdrantStatus {
  //stack-outputs
  KubernetesQdrantStackOutputs outputs = 1;
}
