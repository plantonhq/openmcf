syntax = "proto3";

package dev.planton.kubernetes.kubernetesenvoyfilter.v1alpha1;

import "catalog/kubernetes/kubernetesenvoyfilter/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesEnvoyFilterStackInput provides the inputs for creating the EnvoyFilter on a
// Kubernetes cluster.
message KubernetesEnvoyFilterStackInput {
  // target cloud-resource
  KubernetesEnvoyFilter target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
