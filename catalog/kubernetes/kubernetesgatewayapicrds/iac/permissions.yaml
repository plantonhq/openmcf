# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesgatewayapicrds
spec:
  kubernetes:
    rules:
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers the kubectl_manifest.gateway_api_crds resources -- one per CRD document in the pinned upstream release manifest (fetched over HTTPS by the http data source, which needs no cluster permission), applied cluster-scoped via server-side apply with force_conflicts.
