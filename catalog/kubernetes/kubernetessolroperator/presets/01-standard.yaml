apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSolrOperator
metadata:
  name: solr-operator
spec:
  namespace:
    value: solr-operator
  create_namespace: true
  # Everything else rides the defaults, and the defaults are the point:
  #
  # - chart_version 0.9.1 — chart and operator versions move together;
  #   the operator is pre-1.0, and the module-owned CRDs are derived
  #   from the pin, so a version bump moves the schema with it.
  # - The bundled zookeeper-operator INSTALLS (chart default) — this is
  #   what makes a KubernetesSolr resource's provided ZooKeeper
  #   ensemble work out of the box. Disable it only when one already
  #   runs in the cluster (see the existing-zookeeper-operator preset).
  # - Cluster-wide watch: this one install reconciles KubernetesSolr
  #   resources in EVERY namespace.
  # - CRD lifecycle is module-owned (crds.keep_on_uninstall defaults
  #   true), so uninstalling the operator never cascade-deletes
  #   SolrCloud resources and their data.
