apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSolrOperator
metadata:
  name: solr-operator
spec:
  namespace:
    value: solr-operator
  create_namespace: true
  # The second-install posture: a zookeeper-operator ALREADY runs in
  # this cluster (installed by another team or another release), and
  # its cluster-scoped RBAC uses fixed names — a second install
  # CONFLICTS instead of coexisting.
  zookeeper_operator:
    # Do not install the bundled dependency...
    install: false
    # ...but tell the Solr operator one is present, so KubernetesSolr
    # resources can still declare provided ZooKeeper ensembles and have
    # the existing operator provision them.
    use_existing: true
