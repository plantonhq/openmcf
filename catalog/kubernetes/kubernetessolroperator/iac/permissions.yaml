# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetessolroperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.solr_operator -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
          - configmaps
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered objects applied by helm_release.solr_operator -- the Solr operator's ServiceAccount and metrics Service (while metrics_enabled, the default), plus the bundled zookeeper-operator subchart's ServiceAccount and ConfigMap when zookeeper_operator.install is true (the default).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The Solr operator Deployment (replicas from spec.replicas) and the bundled zookeeper-operator Deployment (when zookeeper_operator.install is true, the default), both applied by helm_release.solr_operator.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart's default RBAC posture (watch all namespaces) grants the Solr operator rights to reconcile SolrCloud resources and their children (StatefulSets, Services, ConfigMaps, PVCs, Ingresses) cluster-wide, and the bundled zookeeper-operator brings its own FIXED-NAME cluster-scoped RBAC -- the reason a second zookeeper-operator install in one cluster conflicts (spec.zookeeper_operator.install false is the coexistence path). An operator chart's RBAC is among the widest in the catalog.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Namespaced RBAC the charts render for their ServiceAccounts (leader election and namespace-local rights) in the installation namespace.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - create
          - update
          - patch
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.solr_operator_crds -- the four MODULE-OWNED CRDs (SolrCloud, SolrBackup, SolrPrometheusExporter on solr.apache.org, plus ZookeeperCluster for the bundled dependency; the chart ships none), server-side-applied from the staged files on every apply (SSA is load-bearing -- the SolrCloud schema exceeds the client-side annotation size limit). No delete -- apply_only makes the provider's Delete a no-op, so destroy leaves the CRDs and every SolrCloud resource on the cluster.
