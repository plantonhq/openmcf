# Extra-instance fixture for the behavioral-routing scenario: the HTTP
# backend the routed request must reach. The workload kind auto-creates its
# own ClusterIP Service named e2e-echo (metadata.name) exposing port 80 — the
# route's backend FK resolves to that Service, so no separate Service fixture
# is needed (a same-named one would collide on server-side apply).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: e2e-echo
spec:
  namespace:
    value: default
  version: main
  container:
    app:
      image:
        repo: nginxinc/nginx-unprivileged
        tag: "1.27"
      ports:
        - name: http
          container_port: 8080
          service_port: 80
          network_protocol: TCP
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
