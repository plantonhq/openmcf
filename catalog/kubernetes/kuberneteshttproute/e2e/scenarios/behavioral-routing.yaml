# The behavioral proof for Gateway API routing: with a REAL implementation
# installed (KubernetesIstio — istiod implements the `istio` GatewayClass),
# the route must be Accepted by its parent, the Gateway must reach
# Programmed, and a live request through the auto-provisioned gateway must
# return the backend's response — real traffic, not just object existence.
# The verifier switches to behavioral assertions precisely because this
# scenario names KubernetesIstio in its prerequisites.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesHttpRoute
metadata:
  name: e2e-route-behavioral
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesIstio, catalog/kubernetes/kuberneteshttproute/e2e/fixture-istio-gateway.yaml, catalog/kubernetes/kuberneteshttproute/e2e/fixture-echo-deployment.yaml"
spec:
  namespace:
    value: default
  parent_refs:
    - name:
        valueFrom:
          name: e2e-istio-gw
      section_name: http
  hostnames:
    - behavioral.e2e.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backend_refs:
        # Route to the echo workload's OWN exported Service handle — the same
        # valueFrom wiring an infra chart uses to send traffic at a
        # Deployment's service output.
        - name:
            valueFrom:
              kind: KubernetesDeployment
              name: e2e-echo
              fieldPath: status.outputs.service
          port: 80
