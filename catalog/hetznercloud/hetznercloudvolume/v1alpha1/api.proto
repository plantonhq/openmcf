syntax = "proto3";

package dev.planton.hetznercloud.hetznercloudvolume.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/hetznercloud/hetznercloudvolume/v1alpha1/spec.proto";
import "catalog/hetznercloud/hetznercloudvolume/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// hetznercloud-volume
message HetznerCloudVolume {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = "hetzner-cloud.planton.dev/v1alpha1"];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = "HetznerCloudVolume"];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  HetznerCloudVolumeSpec spec = 4 [(buf.validate.field).required = true];

  //status
  HetznerCloudVolumeStatus status = 5;
}

// hetznercloud-volume status
message HetznerCloudVolumeStatus {
  //stack-outputs
  //  hetznercloud-volume stack-outputs
  HetznerCloudVolumeStackOutputs outputs = 1;
}
