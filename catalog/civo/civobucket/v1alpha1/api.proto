syntax = "proto3";

package dev.planton.civo.civobucket.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/civo/civobucket/v1alpha1/spec.proto";
import "catalog/civo/civobucket/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

// civo-bucket
message CivoBucket {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'civo.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CivoBucket'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CivoBucketSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CivoBucketStatus status = 5;
}

// civo-bucket status
message CivoBucketStatus {
  //stack-outputs
  //  civo-bucket stack-outputs
  CivoBucketStackOutputs outputs = 1;
}
