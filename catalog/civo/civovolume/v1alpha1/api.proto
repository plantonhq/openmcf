syntax = "proto3";

package dev.planton.civo.civovolume.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/civo/civovolume/v1alpha1/outputs.proto";
import "catalog/civo/civovolume/v1alpha1/spec.proto";
import "shared/metadata.proto";

// civo-volume
message CivoVolume {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'civo.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CivoVolume'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CivoVolumeSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CivoVolumeStatus status = 5;
}

// civo-volume status
message CivoVolumeStatus {
  //stack-outputs
  //  civo-volume stack-outputs
  CivoVolumeStackOutputs outputs = 1;
}
