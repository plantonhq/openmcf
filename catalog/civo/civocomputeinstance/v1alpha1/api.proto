syntax = "proto3";

package dev.planton.civo.civocomputeinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/civo/civocomputeinstance/v1alpha1/outputs.proto";
import "catalog/civo/civocomputeinstance/v1alpha1/spec.proto";
import "shared/metadata.proto";

// civo-compute-instance
message CivoComputeInstance {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'civo.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CivoComputeInstance'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CivoComputeInstanceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CivoComputeInstanceStatus status = 5;
}

// civo-compute-instance status
message CivoComputeInstanceStatus {
  //stack-outputs
  //  civo-compute-instance stack-outputs
  CivoComputeInstanceStackOutputs outputs = 1;
}
