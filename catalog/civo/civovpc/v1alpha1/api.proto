syntax = "proto3";

package dev.planton.civo.civovpc.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/civo/civovpc/v1alpha1/outputs.proto";
import "catalog/civo/civovpc/v1alpha1/spec.proto";
import "shared/metadata.proto";

// civo-vpc
message CivoVpc {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'civo.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CivoVpc'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CivoVpcSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CivoVpcStatus status = 5;
}

// civo-vpc status
message CivoVpcStatus {
  //stack-outputs
  //  civo-vpc stack-outputs
  CivoVpcStackOutputs outputs = 1;
}
