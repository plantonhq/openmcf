syntax = "proto3";

package dev.planton.oci.ocidynamicgroup.v1alpha1;

import "catalog/oci/ocidynamicgroup/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciDynamicGroupStackInput is the input to the IaC modules (Pulumi / Terraform)
// that deploy an OciDynamicGroup resource.
message OciDynamicGroupStackInput {
  // target cloud-resource
  OciDynamicGroup target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
