syntax = "proto3";

package dev.planton.oci.ocipostgresqldbsystem.v1alpha1;

import "catalog/oci/ocipostgresqldbsystem/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciPostgresqlDbSystemStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciPostgresqlDbSystem resource.
message OciPostgresqlDbSystemStackInput {
  // target cloud-resource
  OciPostgresqlDbSystem target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
