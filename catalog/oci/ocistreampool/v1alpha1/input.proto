syntax = "proto3";

package dev.planton.oci.ocistreampool.v1alpha1;

import "catalog/oci/ocistreampool/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciStreamPoolStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciStreamPool resource.
message OciStreamPoolStackInput {
  // target cloud-resource
  OciStreamPool target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
