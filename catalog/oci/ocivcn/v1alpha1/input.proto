syntax = "proto3";

package dev.planton.oci.ocivcn.v1alpha1;

import "catalog/oci/ocivcn/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciVcnStackInput is the input to the IaC modules (Pulumi / Terraform)
// that deploy an OciVcn resource.
message OciVcnStackInput {
  // target cloud-resource
  OciVcn target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
