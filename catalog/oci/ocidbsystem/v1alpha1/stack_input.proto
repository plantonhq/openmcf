syntax = "proto3";

package dev.planton.oci.ocidbsystem.v1alpha1;

import "catalog/oci/ocidbsystem/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciDbSystemStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciDbSystem resource.
message OciDbSystemStackInput {
  // target cloud-resource
  OciDbSystem target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
