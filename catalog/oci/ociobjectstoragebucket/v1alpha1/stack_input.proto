syntax = "proto3";

package dev.planton.oci.ociobjectstoragebucket.v1alpha1;

import "catalog/oci/ociobjectstoragebucket/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciObjectStorageBucketStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciObjectStorageBucket resource.
message OciObjectStorageBucketStackInput {
  // target cloud-resource
  OciObjectStorageBucket target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
