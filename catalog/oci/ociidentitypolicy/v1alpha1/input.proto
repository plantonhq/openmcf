syntax = "proto3";

package dev.planton.oci.ociidentitypolicy.v1alpha1;

import "catalog/oci/ociidentitypolicy/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciIdentityPolicyStackInput is the input to the IaC modules (Pulumi / Terraform)
// that deploy an OciIdentityPolicy resource.
message OciIdentityPolicyStackInput {
  // target cloud-resource
  OciIdentityPolicy target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
