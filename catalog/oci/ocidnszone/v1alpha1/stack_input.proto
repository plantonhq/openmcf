syntax = "proto3";

package dev.planton.oci.ocidnszone.v1alpha1;

import "catalog/oci/ocidnszone/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciDnsZoneStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciDnsZone resource.
message OciDnsZoneStackInput {
  // target cloud-resource
  OciDnsZone target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
