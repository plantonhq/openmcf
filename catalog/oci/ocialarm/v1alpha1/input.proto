syntax = "proto3";

package dev.planton.oci.ocialarm.v1alpha1;

import "catalog/oci/ocialarm/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciAlarmStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciAlarm resource.
message OciAlarmStackInput {
  // target cloud-resource
  OciAlarm target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
