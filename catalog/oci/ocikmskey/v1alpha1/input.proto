syntax = "proto3";

package dev.planton.oci.ocikmskey.v1alpha1;

import "catalog/oci/ocikmskey/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciKmsKeyStackInput is the input to the IaC modules
