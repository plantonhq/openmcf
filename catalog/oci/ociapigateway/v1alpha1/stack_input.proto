syntax = "proto3";

package dev.planton.oci.ociapigateway.v1alpha1;

import "catalog/oci/ociapigateway/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciApiGatewayStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciApiGateway resource.
message OciApiGatewayStackInput {
  // target cloud-resource
  OciApiGateway target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
