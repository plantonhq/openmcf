syntax = "proto3";

package dev.planton.oci.ocidynamicroutinggateway.v1alpha1;

import "catalog/oci/ocidynamicroutinggateway/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciDynamicRoutingGatewayStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciDynamicRoutingGateway resource.
message OciDynamicRoutingGatewayStackInput {
  // target cloud-resource
  OciDynamicRoutingGateway target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
