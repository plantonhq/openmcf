syntax = "proto3";

package dev.planton.oci.ociautonomousdatabase.v1alpha1;

import "catalog/oci/ociautonomousdatabase/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciAutonomousDatabaseStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciAutonomousDatabase resource.
message OciAutonomousDatabaseStackInput {
  // target cloud-resource
  OciAutonomousDatabase target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
