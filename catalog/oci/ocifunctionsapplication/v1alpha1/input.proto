syntax = "proto3";

package dev.planton.oci.ocifunctionsapplication.v1alpha1;

import "catalog/oci/ocifunctionsapplication/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciFunctionsApplicationStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciFunctionsApplication resource.
message OciFunctionsApplicationStackInput {
  // target cloud-resource
  OciFunctionsApplication target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
