syntax = "proto3";

package dev.planton.oci.ocinosqltable.v1alpha1;

import "catalog/oci/ocinosqltable/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciNosqlTableStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciNosqlTable resource.
message OciNosqlTableStackInput {
  // target cloud-resource
  OciNosqlTable target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
