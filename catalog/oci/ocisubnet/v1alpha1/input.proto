syntax = "proto3";

package dev.planton.oci.ocisubnet.v1alpha1;

import "catalog/oci/ocisubnet/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciSubnetStackInput is the input to the IaC modules (Pulumi / Terraform)
// that deploy an OciSubnet resource.
message OciSubnetStackInput {
  // target cloud-resource
  OciSubnet target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
