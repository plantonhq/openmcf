syntax = "proto3";

package dev.planton.oci.ocinetworkfirewall.v1alpha1;

import "catalog/oci/ocinetworkfirewall/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciNetworkFirewallStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciNetworkFirewall resource.
message OciNetworkFirewallStackInput {
  // target cloud-resource
  OciNetworkFirewall target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
