syntax = "proto3";

package dev.planton.oci.ocicontainerinstance.v1alpha1;

import "catalog/oci/ocicontainerinstance/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciContainerInstanceStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciContainerInstance resource.
message OciContainerInstanceStackInput {
  // target cloud-resource
  OciContainerInstance target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
