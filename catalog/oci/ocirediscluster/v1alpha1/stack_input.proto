syntax = "proto3";

package dev.planton.oci.ocirediscluster.v1alpha1;

import "catalog/oci/ocirediscluster/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciRedisClusterStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciRedisCluster resource.
message OciRedisClusterStackInput {
  // target cloud-resource
  OciRedisCluster target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
