syntax = "proto3";

package dev.planton.oci.ocifilesystem.v1alpha1;

import "catalog/oci/ocifilesystem/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciFileSystemStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciFileSystem resource.
message OciFileSystemStackInput {
  // target cloud-resource
  OciFileSystem target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
