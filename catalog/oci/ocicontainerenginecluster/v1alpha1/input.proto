syntax = "proto3";

package dev.planton.oci.ocicontainerenginecluster.v1alpha1;

import "catalog/oci/ocicontainerenginecluster/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciContainerEngineClusterStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciContainerEngineCluster resource.
message OciContainerEngineClusterStackInput {
  // target cloud-resource
  OciContainerEngineCluster target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
