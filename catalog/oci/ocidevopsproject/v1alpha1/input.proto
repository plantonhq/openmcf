syntax = "proto3";

package dev.planton.oci.ocidevopsproject.v1alpha1;

import "catalog/oci/ocidevopsproject/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciDevopsProjectStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciDevopsProject resource.
message OciDevopsProjectStackInput {
  // target cloud-resource
  OciDevopsProject target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
