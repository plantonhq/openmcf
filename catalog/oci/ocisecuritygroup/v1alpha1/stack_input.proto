syntax = "proto3";

package dev.planton.oci.ocisecuritygroup.v1alpha1;

import "catalog/oci/ocisecuritygroup/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciSecurityGroupStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciSecurityGroup resource.
message OciSecurityGroupStackInput {
  // target cloud-resource
  OciSecurityGroup target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
