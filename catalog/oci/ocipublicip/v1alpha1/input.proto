syntax = "proto3";

package dev.planton.oci.ocipublicip.v1alpha1;

import "catalog/oci/ocipublicip/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciPublicIpStackInput is the input to the IaC modules (Pulumi / Terraform)
// that deploy an OciPublicIp resource.
message OciPublicIpStackInput {
  // target cloud-resource
  OciPublicIp target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
