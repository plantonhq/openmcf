syntax = "proto3";

package dev.planton.oci.ocimysqldbsystem.v1alpha1;

import "catalog/oci/ocimysqldbsystem/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciMysqlDbSystemStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciMysqlDbSystem resource.
message OciMysqlDbSystemStackInput {
  // target cloud-resource
  OciMysqlDbSystem target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
