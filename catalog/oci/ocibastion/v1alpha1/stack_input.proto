syntax = "proto3";

package dev.planton.oci.ocibastion.v1alpha1;

import "catalog/oci/ocibastion/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciBastionStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciBastion resource.
message OciBastionStackInput {
  // target cloud-resource
  OciBastion target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
