syntax = "proto3";

package dev.planton.oci.ociblockvolume.v1alpha1;

import "catalog/oci/ociblockvolume/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciBlockVolumeStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciBlockVolume resource.
message OciBlockVolumeStackInput {
  // target cloud-resource
  OciBlockVolume target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
