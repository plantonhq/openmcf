syntax = "proto3";

package dev.planton.oci.ociloggroup.v1alpha1;

import "catalog/oci/ociloggroup/v1alpha1/api.proto";
import "catalog/oci/provider.proto";

// OciLogGroupStackInput is the input to the IaC modules
// (Pulumi / Terraform) that deploy an OciLogGroup resource.
message OciLogGroupStackInput {
  // target cloud-resource
  OciLogGroup target = 1;
  // provider-config
  dev.planton.oci.OciProviderConfig provider_config = 2;
}
