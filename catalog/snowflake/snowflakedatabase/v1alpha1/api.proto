syntax = "proto3";

package dev.planton.snowflake.snowflakedatabase.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/snowflake/snowflakedatabase/v1alpha1/spec.proto";
import "catalog/snowflake/snowflakedatabase/v1alpha1/stack_outputs.proto";
import "shared/metadata.proto";

//snowflake-database
message SnowflakeDatabase {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'snowflake.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'SnowflakeDatabase'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  SnowflakeDatabaseSpec spec = 4 [(buf.validate.field).required = true];

  //status
  SnowflakeDatabaseStatus status = 5;
}

//snowflake-database status
message SnowflakeDatabaseStatus {
  //stack-outputs
  SnowflakeDatabaseStackOutputs outputs = 1;
}
