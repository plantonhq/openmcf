# One Kafka, two purchase models, one toggle. Both arms speak SASL/IAM on
# port 9098 behind the same security-group contract, so flipping the arm
# changes the bill and the bootstrap string — never the client code or the
# network posture.
#
#   serverless (default): per-GB throughput billing, zero broker management,
#     nothing to pay while idle. The right home for spiky, growing, or
#     unknown workloads.
#   provisioned: broker-hours you size yourself. Wins when throughput is
#     steady and high around the clock — see the README's crossover math.
{% if values.provisioned_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsMskCluster
metadata:
  name: "{{ values.cluster_name }}"
spec:
  region: "{{ values.aws_region }}"
  kafkaVersion: "{{ values.kafka_version }}"

  # MSK spreads brokers round-robin across the subnets, and requires the
  # count to be a multiple of the subnet count — the parameter descriptions
  # pair these two knobs. Brokers add in-place but never remove.
  numberOfBrokerNodes: {{ values.broker_count }}
  instanceType: "{{ values.broker_instance_type }}"
  ebsVolumeSizeGib: {{ values.broker_storage_gib }}
  subnetIds:
{% for subnet_id in values.broker_subnet_ids %}
    - value: "{{ subnet_id }}"
{% endfor %}
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: "{{ values.cluster_name }}-cluster-sg"
        fieldPath: status.outputs.security_group_id

  # SASL/IAM only — the same (and only) mechanism the serverless arm speaks,
  # so clients are portable between arms. No credentials to mint or rotate:
  # access is an IAM policy on the client's role (README carries the policy),
  # and every connection is TLS on port 9098. Unauthenticated access stays
  # off, which is the spec's default posture.
  authentication:
    saslIamEnabled: true
{% else %}
---
apiVersion: aws.planton.dev/v1
kind: AwsMskServerlessCluster
metadata:
  name: "{{ values.cluster_name }}"
spec:
  region: "{{ values.aws_region }}"
  # The serverless spec is deliberately tiny: placement and network are the
  # only decisions AWS leaves you. SASL/IAM over TLS is mandatory and
  # implicit, partitions scale automatically, and everything here is
  # create-time-immutable (a change replaces the cluster — cheap, since
  # there are no brokers to rebuild, but topics do not survive it).
  subnetIds:
{% for subnet_id in values.broker_subnet_ids %}
    - value: "{{ subnet_id }}"
{% endfor %}
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: "{{ values.cluster_name }}-cluster-sg"
        fieldPath: status.outputs.security_group_id
{% endif %}
