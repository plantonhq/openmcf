# The two-tier network contract: applications attach the CLIENT group, and
# the CLUSTER group admits Kafka traffic only from members of the client
# group. "Who may talk to Kafka" becomes a security-group membership question
# — auditable at a glance, granted by attaching one SG to a workload, and
# never a CIDR list that silently widens as the VPC grows.
---
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.cluster_name }}-client-sg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    value: "{{ values.vpc_id }}"
  description: "Attach to producers/consumers of {{ values.cluster_name }} - membership grants broker access"
  # No ingress: this group exists to be REFERENCED by the cluster group, not
  # to admit traffic itself. Members keep whatever ingress their own groups
  # define.
  egress:
    # Members need outbound to the brokers; scoping egress to the IAM port
    # keeps this group from doubling as a general-purpose allow-all.
    - description: "Kafka IAM bootstrap and broker traffic"
      protocol: tcp
      fromPort: 9098
      toPort: 9098
      ipv4Cidrs:
        - 0.0.0.0/0
---
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.cluster_name }}-cluster-sg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    value: "{{ values.vpc_id }}"
  description: "Broker ingress for {{ values.cluster_name }} - Kafka from the client group only"
  ingress:
    # Both arms of this chart authenticate with SASL/IAM, which MSK serves
    # on port 9098 — serverless exclusively, provisioned because the chart
    # enables exactly that mechanism. One port, one rule, no drift between
    # the arms. Source is the client GROUP, not a CIDR: nothing else in the
    # VPC can reach a broker, no matter where it runs.
    - description: "Kafka SASL/IAM from client-group members"
      protocol: tcp
      fromPort: 9098
      toPort: 9098
      sourceSecurityGroupIds:
        - valueFrom:
            kind: AwsSecurityGroup
            name: "{{ values.cluster_name }}-client-sg"
            fieldPath: status.outputs.security_group_id
  egress:
    # Brokers replicate to each other and call AWS services (IAM auth,
    # metrics). Inter-broker traffic arrives via this same group, so plain
    # outbound is the honest shape here.
    - description: "Broker replication and AWS service calls"
      protocol: "-1"
      fromPort: 0
      toPort: 0
      ipv4Cidrs:
        - 0.0.0.0/0
