# The workbench's dedicated network. A Studio domain requires a VPC and
# subnets unconditionally (they anchor the ENIs Studio apps use for VPC
# traffic), and an ML workbench is an isolated environment rather than a
# tenant of an application network — so the chart owns a small one outright.
# Deliberately minimal: two private subnets, NO internet gateway, NO NAT.
# In the default PublicInternetOnly mode Studio's internet egress rides the
# SageMaker service network, and in VPC-only mode the endpoints in
# endpoints.yaml carry every required AWS call — either way, this VPC has no
# internet path of its own to secure or pay for.
---
apiVersion: aws.planton.dev/v1
kind: AwsVpc
metadata:
  name: "{{ values.workbench_name }}-vpc"
spec:
  region: "{{ values.aws_region }}"
  cidrBlock: "{{ values.vpc_cidr }}"
  # Both DNS switches on: interface endpoints' private DNS (the mechanism
  # that lets unmodified SDKs resolve sagemaker.<region>.amazonaws.com to
  # in-VPC addresses) requires BOTH dns support and dns hostnames on the
  # VPC — without them the VPC-only arm cannot function.
  enableDnsSupport: true
  enableDnsHostnames: true
{% for az in values.availability_zones %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.workbench_name }}-{{ az }}"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.workbench_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ az }}"
  # CIDR lists are index-matched to availability_zones (entry N serves AZ N).
  cidrBlock: "{{ values.subnet_cidrs[loop.index0] }}"
  # No inline routes: these subnets ride the VPC main route table, which is
  # exactly where the S3 gateway endpoint attaches in the VPC-only arm.
{% endfor %}
{% if values.vpc_only_enabled | bool %}
---
# The inter-app security group, attached to every Studio app ENI via the
# domain's default user settings. SageMaker's VPC-only contract: apps talk
# to each other across the ephemeral port range (kernel/app traffic) and
# mount the domain's home EFS over NFS — both scoped to members of this
# same group, so nothing outside the workbench can reach an app.
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.workbench_name }}-studio-sg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.workbench_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  description: "Inter-app and EFS traffic between {{ values.workbench_name }} Studio apps"
  ingress:
    - description: "Studio inter-app traffic (kernels, apps)"
      protocol: tcp
      fromPort: 8192
      toPort: 65535
      selfReference: true
    - description: "Home-directory EFS mounts"
      protocol: tcp
      fromPort: 2049
      toPort: 2049
      selfReference: true
  egress:
    # Everything a locked-down app legitimately reaches lives inside this
    # VPC: sibling apps, the EFS mount targets, and the AWS service
    # endpoints. Scoping egress to the VPC CIDR makes "no internet" a
    # network fact, not a hope.
    - description: "In-VPC only: apps, EFS, and the service endpoints"
      protocol: "-1"
      fromPort: 0
      toPort: 0
      ipv4Cidrs:
        - "{{ values.vpc_cidr }}"
---
# The endpoints' own group: the AWS service endpoints accept HTTPS from
# Studio apps and nothing else. Security groups are stateful, so responses
# flow without any egress rule — deny-all egress is the honest shape for a
# resource that only ever answers.
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.workbench_name }}-endpoints-sg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.workbench_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  description: "HTTPS to the {{ values.workbench_name }} AWS service endpoints, from Studio apps only"
  ingress:
    - description: "HTTPS from Studio apps"
      protocol: tcp
      fromPort: 443
      toPort: 443
      sourceSecurityGroupIds:
        - valueFrom:
            kind: AwsSecurityGroup
            name: "{{ values.workbench_name }}-studio-sg"
            fieldPath: status.outputs.security_group_id
{% endif %}
