# The execution role every notebook, training job, and endpoint in the
# domain runs as (the domain default; per-user profiles can override it
# later). AmazonSageMakerFullAccess is AWS's supported starter for a
# workbench — broad within SageMaker but already fenced on S3: it only
# grants buckets with "sagemaker" in the name, which is why the inline
# policy below explicitly admits the chart's artifacts bucket. Teams that
# outgrow the starter replace the managed policy with scoped grants — the
# README carries the path.
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.workbench_name }}-execution"
spec:
  region: "{{ values.aws_region }}"
  description: "Default execution role for the {{ values.workbench_name }} SageMaker domain"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: sagemaker.amazonaws.com
        Action: sts:AssumeRole
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
  inlinePolicies:
    # A policy is plain JSON and cannot carry references; the bucket ARNs
    # are composed from the chart-controlled bucket name at render time.
    artifacts-bucket-access:
      Version: "2012-10-17"
      Statement:
        - Sid: ListArtifactsBucket
          Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetBucketLocation
          Resource: "arn:aws:s3:::{{ values.artifacts_bucket_name }}"
        - Sid: ReadWriteArtifacts
          Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::{{ values.artifacts_bucket_name }}/*"
