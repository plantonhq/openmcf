params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for the hub. A transit gateway is regional — it connects
      VPCs in this region; cross-region topologies peer hubs together (a
      day-2 step the README covers).
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: hub_name
    description: >
      Name for the transit gateway and the prefix for its attachments and
      route tables. Lowercase letters, digits, and hyphens.
    value: my-network-hub

  - name: amazon_side_asn
    type: number
    description: >
      Private BGP ASN for the AWS side of the hub, used when VPN or Direct
      Connect attachments negotiate routes later. Must differ from your
      on-premises ASN. Immutable after creation — pick deliberately from
      the private range (64512-65534) even if hybrid connectivity is not
      yet on the roadmap.
    value: 64512

  # ── Spoke: production ────────────────────────────────────────────────────
  - name: prod_vpc_id
    description: >
      The production VPC to attach — an EXISTING VPC (this chart never
      creates spoke networks; a hub connects the real ones). When the spoke
      is a network-foundation deployment, reference its VPC by name instead
      — see the README's composition section.
    value: vpc-0aaaaaaaaaaaaaaa0

  - name: prod_vpc_cidr
    description: >
      The production VPC's CIDR block. Used twice: as the blackhole
      guardrail in the non-prod routing domain while the hub is segmented,
      and in the README's return-route recipe. Must match the VPC's actual
      primary CIDR.
    value: 10.0.0.0/16

  - name: prod_subnet_ids
    description: >
      Subnets (one per AZ) where the production attachment places its
      ENIs. AWS best practice is a dedicated small subnet (a /28 works) per
      AZ for attachment ENIs, so route-table changes on workload subnets
      never disturb the attachment; reusing existing private subnets also
      works. The attachment reaches the WHOLE VPC regardless — these
      subnets only anchor the ENIs.
    type: list
    value:
      - subnet-0aaaaaaaaaaaaaaa1
      - subnet-0aaaaaaaaaaaaaaa2

  # ── Spoke: non-production ────────────────────────────────────────────────
  - name: nonprod_vpc_id
    description: >
      The non-production VPC to attach — an existing VPC, same rules as the
      production spoke.
    value: vpc-0bbbbbbbbbbbbbbb0

  - name: nonprod_vpc_cidr
    description: >
      The non-production VPC's CIDR block — the blackhole guardrail in the
      production routing domain while the hub is segmented.
    value: 10.1.0.0/16

  - name: nonprod_subnet_ids
    description: >
      Subnets (one per AZ) for the non-production attachment's ENIs — same
      guidance as prod_subnet_ids.
    type: list
    value:
      - subnet-0bbbbbbbbbbbbbbb1
      - subnet-0bbbbbbbbbbbbbbb2

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: spokes_interconnected_enabled
    type: bool
    description: >
      Let the two spokes reach each other through the hub. OFF (the
      default) is the segmented posture: each spoke lives in its own
      routing domain with a blackhole guardrail for the peer's CIDR, so
      production and non-production cannot exchange a packet even if
      someone later adds a broad static route — the deliberate shape for
      environment isolation. ON propagates each spoke into the other's
      domain for plain any-to-any connectivity — the shape for teams
      replacing a VPC-peering mesh rather than enforcing boundaries. Both
      postures keep every spoke reaching anything attached to BOTH domains
      later (inspection VPCs, shared services, VPN) — see the README.
    value: false
