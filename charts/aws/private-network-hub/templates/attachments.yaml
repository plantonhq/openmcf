# One attachment per spoke VPC. Each attachment pins BOTH default-table
# memberships off (matching the hub's dials) so its routing domain is decided
# exactly once, explicitly, in routing.yaml — AWS allows one route-table
# association per attachment, and pinning these tri-states prevents the
# default table from silently claiming that one slot.
---
apiVersion: aws.planton.dev/v1
kind: AwsTransitGatewayVpcAttachment
metadata:
  name: "{{ values.hub_name }}-prod-attachment"
spec:
  region: "{{ values.aws_region }}"
  transitGatewayId:
    valueFrom:
      kind: AwsTransitGateway
      name: "{{ values.hub_name }}"
      fieldPath: status.outputs.transit_gateway_id
  # The spoke VPC is an existing network this chart references, never
  # creates — a hub connects real workload VPCs.
  vpcId:
    value: "{{ values.prod_vpc_id }}"
  # ENI anchor subnets (one per AZ). The attachment reaches the whole VPC
  # regardless of which subnets anchor it.
  subnetIds:
{% for subnet_id in values.prod_subnet_ids %}
    - value: "{{ subnet_id }}"
{% endfor %}
  # Per-attachment DNS stays on so cross-VPC private-hostname resolution
  # works wherever routing allows packets at all.
  dnsSupport: true
  defaultRouteTableAssociation: false
  defaultRouteTablePropagation: false
---
apiVersion: aws.planton.dev/v1
kind: AwsTransitGatewayVpcAttachment
metadata:
  name: "{{ values.hub_name }}-nonprod-attachment"
spec:
  region: "{{ values.aws_region }}"
  transitGatewayId:
    valueFrom:
      kind: AwsTransitGateway
      name: "{{ values.hub_name }}"
      fieldPath: status.outputs.transit_gateway_id
  vpcId:
    value: "{{ values.nonprod_vpc_id }}"
  subnetIds:
{% for subnet_id in values.nonprod_subnet_ids %}
    - value: "{{ subnet_id }}"
{% endfor %}
  dnsSupport: true
  defaultRouteTableAssociation: false
  defaultRouteTablePropagation: false
