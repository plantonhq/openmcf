---
apiVersion: aws.planton.dev/v1
kind: AwsS3Bucket
metadata:
  name: "{{ values.s3_bucket_name }}"
  group: storage
spec:
  region: "{{ values.aws_region }}"
  versioningStatus: Enabled
  lifecycleRules:
    - id: transition-to-ia
      status: Enabled
      filter:
        prefix: "raw/"
      transitions:
        - days: 90
          storageClass: STANDARD_IA
      abortIncompleteMultipartUploadDays: 7
