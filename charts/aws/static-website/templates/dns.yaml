{% if values.dnsEnabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsRoute53Zone
metadata:
  name: "{{ values.domain_name }}"
  group: network
spec:
  region: "{{ values.aws_region }}"
---
apiVersion: aws.planton.dev/v1
kind: AwsCertManagerCert
metadata:
  name: "{{ values.s3_bucket_name }}-cert"
  group: security
  relationships:
    - kind: AwsRoute53Zone
      name: "{{ values.domain_name }}"
      type: uses
spec:
  # CloudFront only accepts viewer certificates issued in us-east-1,
  # regardless of where the bucket lives.
  region: us-east-1
  primaryDomainName: "{{ values.website_domain_name }}"
  route53HostedZoneId:
    valueFrom:
      kind: AwsRoute53Zone
      name: "{{ values.domain_name }}"
      fieldPath: status.outputs.zone_id
  validationMethod: DNS
{% endif %}
