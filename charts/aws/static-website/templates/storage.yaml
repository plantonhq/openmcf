---
apiVersion: aws.planton.dev/v1
kind: AwsS3Bucket
metadata:
  name: "{{ values.s3_bucket_name }}"
  group: storage
spec:
  region: "{{ values.aws_region }}"
  forceDestroy: true
  # Public-read website bucket: relax the public-access guards and grant
  # anonymous GetObject so CloudFront can fetch content from the REST endpoint.
  publicAccessBlock:
    blockPublicAcls: false
    blockPublicPolicy: false
    ignorePublicAcls: false
    restrictPublicBuckets: false
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: PublicReadGetObject
        Effect: Allow
        Principal: "*"
        Action: s3:GetObject
        Resource: "arn:aws:s3:::{{ values.s3_bucket_name }}/*"
  corsRules:
    - allowedMethods:
        - GET
        - HEAD
      allowedOrigins:
        - "*"
      allowedHeaders:
        - "*"
      maxAgeSeconds: 3600
