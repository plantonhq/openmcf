# Human access, the access-entry way: one auditable resource grants one
# IAM principal cluster-admin. This is what prevents the classic EKS
# lockout — in API authentication mode, without an entry, only the
# cluster-creating identity can talk to the API server at all.
{% if values.admin_access_entry_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsEksAccessEntry
metadata:
  name: "{{ values.cluster_name }}-admin"
spec:
  region: "{{ values.aws_region }}"
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: "{{ values.cluster_name }}"
      fieldPath: status.outputs.name
  principalArn:
    value: "{{ values.admin_principal_arn }}"
  policyAssociations:
    # ClusterAdmin ≈ the root grant — right for the platform team's role.
    # Narrower teams get their own entries with AmazonEKSEditPolicy or
    # AmazonEKSViewPolicy, optionally namespace-scoped; see the README.
    - policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      accessScope:
        type: cluster
{% endif %}
