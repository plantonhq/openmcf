# The IRSA foundation: registers the cluster's OIDC issuer as an IAM
# identity provider, so Kubernetes ServiceAccounts can assume IAM roles of
# their own. This resource is the one-per-cluster half; each workload then
# brings its own role trusting this provider (the README shows the loop).
{% if values.oidc_provider_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsIamOidcProvider
metadata:
  name: "{{ values.cluster_name }}-oidc"
spec:
  region: "{{ values.aws_region }}"
  # The issuer URL is the cluster's own output — the reference IS the
  # trust relationship.
  url:
    valueFrom:
      kind: AwsEksCluster
      name: "{{ values.cluster_name }}"
      fieldPath: status.outputs.oidc_issuer_url
  clientIdList:
    # sts.amazonaws.com is the audience the EKS pod identity webhook
    # stamps into every projected ServiceAccount token — the only client
    # id IRSA needs.
    - sts.amazonaws.com
  # No thumbprints on purpose: AWS trusts its own root CAs for EKS
  # issuers, and a pinned thumbprint would break silently at the next
  # certificate rotation.
{% endif %}
