# The core add-ons as first-class, individually-versioned resources —
# pinned, upgraded, and configured through the graph instead of riding
# silently inside the cluster. Rendered only in the node-group shape:
# Auto Mode manages networking and DNS itself, and installing these
# beside it would create two owners for the same components.
{% if not (values.auto_mode_enabled | bool) %}
---
# Pod networking: every pod gets a real VPC IP through ENIs. The cluster
# cannot schedule workloads without it.
apiVersion: aws.planton.dev/v1
kind: AwsEksAddon
metadata:
  name: "{{ values.cluster_name }}-vpc-cni"
spec:
  region: "{{ values.aws_region }}"
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: "{{ values.cluster_name }}"
      fieldPath: status.outputs.name
  addonName: vpc-cni
  # Empty version = AWS's default for the cluster's Kubernetes version;
  # pin per add-on when you need reproducible add-on rollouts.
  # OVERWRITE on create adopts the self-managed copy EKS bootstraps into
  # new clusters — with NONE, the very first reconcile would conflict.
  resolveConflictsOnCreate: OVERWRITE
---
# Cluster DNS. Service discovery inside the cluster is coredns answering
# *.cluster.local.
apiVersion: aws.planton.dev/v1
kind: AwsEksAddon
metadata:
  name: "{{ values.cluster_name }}-coredns"
spec:
  region: "{{ values.aws_region }}"
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: "{{ values.cluster_name }}"
      fieldPath: status.outputs.name
  addonName: coredns
  resolveConflictsOnCreate: OVERWRITE
---
# Service routing: kube-proxy programs each node so ClusterIP services
# actually reach pods.
apiVersion: aws.planton.dev/v1
kind: AwsEksAddon
metadata:
  name: "{{ values.cluster_name }}-kube-proxy"
spec:
  region: "{{ values.aws_region }}"
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: "{{ values.cluster_name }}"
      fieldPath: status.outputs.name
  addonName: kube-proxy
  resolveConflictsOnCreate: OVERWRITE
---
# The Pod Identity agent — the newer, simpler sibling of IRSA for
# per-ServiceAccount IAM. Shipping both paths from day one means every
# workload can pick its wiring (pod identity associations on an add-on or
# app, or IRSA through the OIDC provider) without a platform change.
apiVersion: aws.planton.dev/v1
kind: AwsEksAddon
metadata:
  name: "{{ values.cluster_name }}-pod-identity-agent"
spec:
  region: "{{ values.aws_region }}"
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: "{{ values.cluster_name }}"
      fieldPath: status.outputs.name
  addonName: eks-pod-identity-agent
  resolveConflictsOnCreate: OVERWRITE
{% endif %}
