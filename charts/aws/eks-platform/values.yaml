params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for the cluster and every companion resource. EKS is
      regional; multi-region Kubernetes is multiple clusters composed
      above this chart.
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: cluster_name
    description: >
      Name prefix for everything this chart creates (cluster, node group,
      roles, add-ons, OIDC provider). Also the cluster's own name — what
      kubectl contexts and dashboards will show. Lowercase letters, digits,
      and hyphens.
    value: platform

  - name: kubernetes_version
    description: >
      Kubernetes minor version (e.g. "1.31"). Empty delegates to AWS's
      current default. Pinning is the production posture: control-plane
      upgrades become deliberate acts (bump this value, redeploy) instead
      of surprises, and node AMIs track the pinned version.
    value: "1.31"

  # ── Network (bring your own — the network-foundation chart provides it) ──
  - name: subnet_ids
    description: >
      Subnets for the cluster and its nodes — private subnets with NAT
      egress in at least two availability zones (the network-foundation
      chart's private tier in the common case). The control plane places
      ENIs here and nodes live here; keep them private, the API endpoint
      exposure is decided separately below.
    type: list
    value:
      - subnet-0cccccccccccccccc
      - subnet-0ddddddddddddddddd

  - name: endpoint_public_access
    type: bool
    description: >
      Serve the Kubernetes API endpoint publicly (TLS + IAM-authenticated).
      The pragmatic default for teams operating from laptops and CI without
      a VPN. Turn off for a fully private control plane — kubectl then
      requires network access into the VPC (VPN, bastion, or CI runners
      inside it), and private access below must stay on.
    value: true

  - name: endpoint_private_access
    type: bool
    description: >
      Serve the API endpoint inside the VPC. Keep on: nodes, add-ons, and
      in-VPC tooling reach the control plane without leaving the network
      even while the public endpoint exists — and it is the only path when
      public access is off.
    value: true

  # ── Compute (the one toggle that changes the platform's shape) ──────────
  - name: auto_mode_enabled
    type: bool
    description: >
      EKS Auto Mode: AWS manages compute, storage, and load-balancing
      end-to-end — nodes launch and retire per pod demand, no node group,
      no capacity planning, and the core networking/DNS components are
      managed for you (this chart then creates no add-ons). It bills a
      management premium on top of EC2, which is the trade. Off runs the
      classic shape: the managed node group + core add-ons below, where you
      own instance selection and node scaling.
    value: false

  # ── Node group (used while auto_mode_enabled is false) ──────────────────
  - name: node_instance_types
    description: >
      EC2 instance types for the node group, in preference order. One
      general-purpose type is the sane start; list several compatible
      sizes when you enable spot capacity later so the group can shop
      across pools.
    type: list
    value:
      - m6i.large

  - name: node_min_size
    type: number
    description: >
      Node-count floor. Two nodes across two AZs is the availability
      minimum for running replicated workloads through a zone event.
    value: 2

  - name: node_max_size
    type: number
    description: >
      Node-count ceiling — where cluster autoscaling stops no matter the
      pod pressure. Set it from the bill you are willing to accept.
    value: 6

  - name: node_desired_size
    type: number
    description: >
      Initial node count, between the min and max. Once a cluster
      autoscaler (or Karpenter) manages the group, this only seeds the
      first deploy.
    value: 2

  - name: node_disk_size_gb
    type: number
    description: >
      Root volume per node in GiB. 100 comfortably holds the OS, container
      images, and ephemeral pod storage for typical service fleets;
      image-heavy ML or CI workloads want more.
    value: 100

  # ── Access & IRSA ───────────────────────────────────────────────────────
  - name: admin_access_entry_enabled
    type: bool
    description: >
      Grant one IAM principal cluster-admin through an EKS access entry —
      the modern, auditable replacement for the aws-auth ConfigMap. Without
      any entry, only the cluster's creator identity can administer it,
      which is exactly the lockout this toggle prevents. Set
      admin_principal_arn to your team's role.
    value: true

  - name: admin_principal_arn
    description: >
      ARN of the IAM role or user to grant cluster-admin (e.g. your SSO
      admin role). Only used when admin_access_entry_enabled is true.
    value: arn:aws:iam::123456789012:role/platform-admin

  - name: oidc_provider_enabled
    type: bool
    description: >
      Register the cluster's OIDC issuer as an IAM identity provider,
      enabling IRSA — per-ServiceAccount IAM roles, the standard way
      workloads (external-dns, cert-manager, your apps) get AWS
      permissions without node-wide grants. Costs nothing to keep on; the
      README shows the per-workload trust-policy loop it unlocks.
    value: true
