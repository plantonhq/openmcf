# The DynamoDB lock table. Terraform/OpenTofu acquire a lock item here before
# touching state, so two concurrent applies against the same state file cannot
# interleave writes. The S3 backend's locking contract is fixed: the table's
# partition key MUST be a string attribute named exactly "LockID" — the values
# below are the contract, not a choice.
#
# Terraform and OpenTofu >= 1.10 can alternatively lock natively in S3
# (use_lockfile = true), which makes this table optional for those versions —
# the toggle exists for teams standardized on that path. It stays ON by
# default because DynamoDB locking works with every Terraform/OpenTofu version
# and is the shape Planton's state-backend configuration integrates with.
{% if values.lock_table_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsDynamodb
metadata:
  name: "{{ values.lock_table_name }}"
spec:
  region: "{{ values.aws_region }}"

  # Lock traffic is a handful of reads/writes per plan or apply — effectively
  # zero. On-demand billing rounds that to pennies a month; provisioned
  # capacity would bill for idle throughput around the clock.
  billingMode: PAY_PER_REQUEST

  # The S3 backend's locking contract: a string (S) hash key named LockID.
  attributeDefinitions:
    - name: LockID
      type: S
  keySchema:
    - attributeName: LockID
      keyType: HASH

  # A deleted lock table does not lose state, but it silently disables
  # locking for every workspace pointed at it — the failure mode is corrupted
  # state under concurrency, discovered much later. Deletion protection makes
  # removal a deliberate two-step act.
  deletionProtectionEnabled: true

  # Continuous backups on a near-free table: full point-in-time restore for
  # the price of rounding error, and one less exception in a compliance audit.
  pointInTimeRecovery:
    enabled: true
{% endif %}
