params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for the state bucket and the lock table. State access is
      latency-sensitive on every plan/apply, so pick the region closest to
      where your runs execute (CI runners, Planton runners, or your laptop).
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: bucket_name
    description: >
      Globally unique name for the S3 bucket that stores Terraform/OpenTofu
      state files. Recommended convention: <org>-terraform-state. S3 bucket
      names are global across all AWS accounts — a generic name like
      "terraform-state" will already be taken.
    value: my-org-terraform-state

  - name: lock_table_name
    description: >
      Name of the DynamoDB table used for state locking (only created when
      lock_table_enabled is true). DynamoDB table names are unique per
      account+region, so a short name is fine.
    value: terraform-state-lock

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: lock_table_enabled
    type: bool
    description: >
      Create the DynamoDB lock table. Keep this on for the widest
      compatibility: it is the locking shape every Terraform/OpenTofu version
      understands and the shape Planton's state-backend configuration
      integrates with. Teams running exclusively Terraform/OpenTofu >= 1.10
      outside Planton can turn it off and use the S3 backend's native
      lockfile instead (use_lockfile = true) — see the README for the
      trade-off.
    value: true
