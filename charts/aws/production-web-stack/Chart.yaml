apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: AWS Production Web Stack
spec:
  selector:
    kind: platform
  description: Startup-in-a-box — the complete production stack for a web application in one deploy - its own VPC network, a load-balanced autoscaled Fargate service with an ECR registry, Aurora PostgreSQL Serverless v2 with a managed master password, Redis caching, HTTPS with your own domain, WAF, and CloudWatch alarms wired to email.
