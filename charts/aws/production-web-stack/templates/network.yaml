# The stack's own network: a VPC with a public tier (load balancer, NAT)
# and a private tier (tasks, database, cache) striped across the AZs.
# Tiers are expressed purely through subnet-owned routes — public subnets
# route 0.0.0.0/0 to the internet gateway, private subnets through the NAT
# gateway — so "which tier is this subnet" is readable from the subnet
# itself.
#
# One deliberate simplification versus a standalone network: a single
# shared NAT gateway. It is the cost-sane default (~$32/month each); teams
# that need per-AZ NAT survivability should build on the network-foundation
# chart and compose this stack's application pieces onto it.
---
apiVersion: aws.planton.dev/v1
kind: AwsVpc
metadata:
  name: "{{ values.stack_name }}-vpc"
spec:
  region: "{{ values.aws_region }}"
  cidrBlock: "{{ values.vpc_cidr }}"
  # Both DNS switches hardcoded on: private hosted zones, VPC endpoints,
  # and RDS/ElastiCache endpoint resolution all assume them. There is no
  # production shape that wants these off.
  enableDnsSupport: true
  enableDnsHostnames: true
---
apiVersion: aws.planton.dev/v1
kind: AwsInternetGateway
metadata:
  name: "{{ values.stack_name }}-igw"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.stack_name }}-vpc"
      fieldPath: status.outputs.vpc_id
{% for az in values.availability_zones %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.stack_name }}-public-{{ az }}"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.stack_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ az }}"
  # CIDR lists are index-matched to availability_zones (entry N serves AZ N).
  cidrBlock: "{{ values.public_subnet_cidrs[loop.index0] }}"
  # Public tier: instances launched here get public IPs, and the default
  # route leads to the internet gateway.
  mapPublicIpOnLaunch: true
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: internet_gateway
      targetId:
        valueFrom:
          kind: AwsInternetGateway
          name: "{{ values.stack_name }}-igw"
          fieldPath: status.outputs.internet_gateway_id
{% endfor %}
{% for az in values.availability_zones %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.stack_name }}-private-{{ az }}"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.stack_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ az }}"
  cidrBlock: "{{ values.private_subnet_cidrs[loop.index0] }}"
  # Private tier: no public IPs, and outbound-only internet through the
  # shared NAT gateway — tasks pull images and call APIs, nothing calls in.
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: nat_gateway
      targetId:
        valueFrom:
          kind: AwsNatGateway
          name: "{{ values.stack_name }}-nat"
          fieldPath: status.outputs.nat_gateway_id
{% endfor %}
---
# The NAT gateway's stable egress address — a separate referenced resource
# so the IP survives gateway replacement (partners allowlist this address).
apiVersion: aws.planton.dev/v1
kind: AwsElasticIp
metadata:
  name: "{{ values.stack_name }}-nat-eip"
spec:
  region: "{{ values.aws_region }}"
---
apiVersion: aws.planton.dev/v1
kind: AwsNatGateway
metadata:
  name: "{{ values.stack_name }}-nat"
spec:
  region: "{{ values.aws_region }}"
  connectivityType: public
  # Lives in the first public subnet; serves every private subnet through
  # their routes above.
  subnetId:
    valueFrom:
      kind: AwsSubnet
      name: "{{ values.stack_name }}-public-{{ values.availability_zones[0] }}"
      fieldPath: status.outputs.subnet_id
  allocationId:
    valueFrom:
      kind: AwsElasticIp
      name: "{{ values.stack_name }}-nat-eip"
      fieldPath: status.outputs.allocation_id
