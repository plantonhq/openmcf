# Aurora PostgreSQL Serverless v2 — capacity floats between the ACU
# bounds, billed per ACU-hour, with a writer and a reader spread across
# the AZs. The master password never exists in configuration or state:
# AWS generates it, stores it in Secrets Manager, and owns rotation; the
# cluster exports the secret's ARN and the task role ships with read
# access to it (iam.yaml).
---
apiVersion: aws.planton.dev/v1
kind: AwsRdsCluster
metadata:
  name: "{{ values.stack_name }}-db"
spec:
  region: "{{ values.aws_region }}"
  engine: aurora-postgresql
  databaseName: "{{ values.db_name }}"
  masterUsername: "{{ values.db_master_username }}"
  manageMasterUserPassword: true
  # The private tier: the DB subnet group is built from these subnets, and
  # the dedicated security group admits only the service tasks.
  subnetIds:
{% for az in values.availability_zones %}
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.stack_name }}-private-{{ az }}"
        fieldPath: status.outputs.subnet_id
{% endfor %}
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: "{{ values.stack_name }}-db-sg"
        fieldPath: status.outputs.security_group_id
  # Create-time-only — cannot be added later, so it is hardcoded on.
  storageEncrypted: true
  # A week of point-in-time recovery, and the final-snapshot pair: a
  # teardown always keeps one last copy.
  backupRetentionPeriod: 7
  copyTagsToSnapshot: true
  skipFinalSnapshot: false
  finalSnapshotIdentifier: "{{ values.stack_name }}-db-final"
  deletionProtection: {{ values.deletion_protection }}
  # Performance Insights (free 7-day tier) + engine logs: "what is the
  # database doing right now" should never be unanswerable in production.
  performanceInsightsEnabled: true
  enabledCloudwatchLogsExports:
    - postgresql
  serverlessV2Scaling:
    minCapacity: {{ values.db_min_capacity }}
    maxCapacity: {{ values.db_max_capacity }}
  instances:
    - name: writer
      instanceClass: db.serverless
    # The reader serves the cluster's reader endpoint (point read-heavy
    # queries at it) and is the failover target — promotion tier 1 means
    # an AZ event promotes it in seconds.
    - name: reader
      instanceClass: db.serverless
      promotionTier: 1
