# The cache tier: two-node HA Redis with automatic failover across AZs,
# encrypted in transit and at rest, reachable only from the service tasks.
{% if values.redis_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsRedisElasticache
metadata:
  name: "{{ values.stack_name }}-redis"
spec:
  region: "{{ values.aws_region }}"
  engine: redis
  description: "HA Redis cache for the {{ values.stack_name }} stack"
  nodeType: "{{ values.redis_node_type }}"
  # Two nodes = one primary + one replica in a different AZ; failover
  # promotes the replica in under a minute with no data-path change (the
  # app keeps using the primary endpoint).
  numCacheClusters: 2
  automaticFailoverEnabled: true
  multiAzEnabled: true
  # Both encryptions are create-time decisions, so they are hardcoded on.
  # In-transit encryption means clients must connect with TLS
  # (rediss://) — most SDKs need only the scheme change.
  atRestEncryptionEnabled: true
  transitEncryptionEnabled: true
  subnetIds:
{% for az in values.availability_zones %}
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.stack_name }}-private-{{ az }}"
        fieldPath: status.outputs.subnet_id
{% endfor %}
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: "{{ values.stack_name }}-redis-sg"
        fieldPath: status.outputs.security_group_id
  # Network isolation (private tier + task-SG-only ingress + TLS) is the
  # access model here; add RBAC (AwsElasticacheUser/UserGroup referenced
  # via userGroupIds) when the cache carries data that warrants
  # per-identity auth.
  snapshotRetentionLimit: 7
{% endif %}
