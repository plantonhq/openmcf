# The web application firewall — REGIONAL scope because it fronts a load
# balancer, same region by construction. Attached on the ALB's webAclArn
# (load-balancer.yaml).
{% if values.waf_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsWafWebAcl
metadata:
  name: "{{ values.stack_name }}-waf"
spec:
  region: "{{ values.aws_region }}"
  scope: REGIONAL
  # Allow by default; the managed packs veto known-bad traffic. Block-by-
  # default belongs to allowlist APIs, not public web applications.
  defaultAction:
    type: allow
  rules:
    # The OWASP-top-10-style baseline. overrideAction none = enforce the
    # pack's block verdicts; flip to count for a dry run when first
    # enabling WAF on live traffic.
    - name: aws-common-rules
      priority: 1
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesCommonRuleSet
          vendorName: AWS
    # Signatures for actively-exploited CVE payloads — the pack AWS
    # updates fastest when an exploit wave starts.
    - name: aws-known-bad-inputs
      priority: 2
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesKnownBadInputsRuleSet
          vendorName: AWS
{% endif %}
