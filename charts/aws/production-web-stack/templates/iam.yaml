# The service's two IAM roles — execution (what the ECS agent uses before
# your code runs: pull the image, create log streams) and task (what your
# code gets when it calls AWS). Separate on purpose: merging them is the
# classic over-grant.
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.stack_name }}-execution-role"
spec:
  region: "{{ values.aws_region }}"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ecs-tasks.amazonaws.com
        Action: sts:AssumeRole
  managedPolicyArns:
    # ECR pull + CloudWatch Logs write — also what satisfies the task
    # definition's awslogs↔execution-role contract.
    - value: arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.stack_name }}-task-role"
spec:
  region: "{{ values.aws_region }}"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ecs-tasks.amazonaws.com
        Action: sts:AssumeRole
  inlinePolicies:
    # The one grant a fresh stack genuinely needs: reading the database
    # credentials AWS manages in Secrets Manager. Scoped by name pattern
    # because the secret's full ARN (with its random suffix) only exists
    # after the cluster is created; tighten to the exact ARN from the
    # cluster's master_user_secret_arn output as a day-2 pass. Every
    # other permission the app acquires belongs here too, by ARN.
    read-db-credentials:
      Version: "2012-10-17"
      Statement:
        - Sid: ReadManagedDbSecret
          Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
          Resource: "arn:aws:secretsmanager:{{ values.aws_region }}:*:secret:rds!*"
