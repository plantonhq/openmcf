# The application plane: the ECR registry, a Fargate-only cluster, the
# task definition, and the service that keeps it running behind the load
# balancer with request-count autoscaling.
---
apiVersion: aws.planton.dev/v1
kind: AwsEcrRepo
metadata:
  name: "{{ values.stack_name }}-repo"
spec:
  region: "{{ values.aws_region }}"
  repositoryName: "{{ values.stack_name }}"
  # Immutable tags with a "latest" exclusion: production references can
  # never be silently repointed; "latest" stays a moving pointer for local
  # development only.
  imageTagMutability: IMMUTABLE_WITH_EXCLUSION
  imageTagMutabilityExclusionFilters:
    - latest
  scanOnPush: true
  lifecycleRules:
    - rulePriority: 1
      description: expire untagged images after 7 days
      tagStatus: untagged
      countType: sinceImagePushed
      countNumber: 7
---
apiVersion: aws.planton.dev/v1
kind: AwsEcsCluster
metadata:
  name: "{{ values.stack_name }}-cluster"
spec:
  region: "{{ values.aws_region }}"
  capacityProviders:
    - FARGATE
  # Per-service/task metrics and dashboards — a production stack runs with
  # its eyes open; the alarms in observability.yaml read the same metric
  # streams.
  containerInsights: enabled
---
apiVersion: aws.planton.dev/v1
kind: AwsEcsTaskDefinition
metadata:
  name: "{{ values.stack_name }}-task"
spec:
  region: "{{ values.aws_region }}"
  cpu: {{ values.task_cpu }}
  memory: {{ values.task_memory }}
  executionRole:
    valueFrom:
      kind: AwsIamRole
      name: "{{ values.stack_name }}-execution-role"
      fieldPath: status.outputs.role_arn
  taskRole:
    valueFrom:
      kind: AwsIamRole
      name: "{{ values.stack_name }}-task-role"
      fieldPath: status.outputs.role_arn
  containers:
    - name: app
      image: "{{ values.container_image }}"
      portMappings:
        - containerPort: {{ values.container_port }}
          name: http
          appProtocol: http
      # The load balancer's target-group probe is the health gate (works
      # with any image); container-level checks and your app's environment
      # variables/secrets are added here as the app grows — endpoints from
      # the database and cache outputs, credentials by Secrets Manager ARN
      # under secrets, never plaintext.
  # Task logs flow to CloudWatch under /ecs/<family> automatically.
---
apiVersion: aws.planton.dev/v1
kind: AwsEcsService
metadata:
  name: "{{ values.stack_name }}-web"
spec:
  region: "{{ values.aws_region }}"
  clusterArn:
    valueFrom:
      kind: AwsEcsCluster
      name: "{{ values.stack_name }}-cluster"
      fieldPath: status.outputs.cluster_arn
  # The reference carries the revision: pushing a new image and updating
  # the task definition rolls this service through the graph.
  taskDefinition:
    valueFrom:
      kind: AwsEcsTaskDefinition
      name: "{{ values.stack_name }}-task"
      fieldPath: status.outputs.task_definition_arn
  launchType: FARGATE
  desiredCount: {{ values.min_tasks }}
  network:
    subnets:
{% for az in values.availability_zones %}
      - valueFrom:
          kind: AwsSubnet
          name: "{{ values.stack_name }}-private-{{ az }}"
          fieldPath: status.outputs.subnet_id
{% endfor %}
    securityGroups:
      - valueFrom:
          kind: AwsSecurityGroup
          name: "{{ values.stack_name }}-task-sg"
          fieldPath: status.outputs.security_group_id
    # Private tier — tasks have no public IPs; the NAT gateway carries
    # their egress.
    assignPublicIp: false
  loadBalancers:
    - targetGroupArn:
        valueFrom:
          kind: AwsLbTargetGroup
          name: "{{ values.stack_name }}-tg"
          fieldPath: status.outputs.target_group_arn
      containerName: app
      containerPort: {{ values.container_port }}
  # 90s of warm-up before load-balancer probes can kill a starting task.
  healthCheckGracePeriodSeconds: 90
  # A rollout whose new tasks keep failing stops and ROLLS BACK by itself.
  deploymentCircuitBreaker:
    enable: true
    rollback: true
  autoscaling:
    minTasks: {{ values.min_tasks }}
    maxTasks: {{ values.max_tasks }}
    # Scale on what a web service experiences — traffic — scoped to
    # exactly this ALB + target-group pair by their arn_suffix outputs.
    requestsPerTarget:
      targetRequestsPerTarget: {{ values.requests_per_target }}
      loadBalancerArnSuffix:
        valueFrom:
          kind: AwsAlb
          name: "{{ values.stack_name }}-alb"
          fieldPath: status.outputs.arn_suffix
      targetGroupArnSuffix:
        valueFrom:
          kind: AwsLbTargetGroup
          name: "{{ values.stack_name }}-tg"
          fieldPath: status.outputs.arn_suffix
