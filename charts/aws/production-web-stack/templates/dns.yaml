# The custom-domain plane: the hosted zone (optional — established domains
# already have one), the TLS certificate with hands-free DNS validation,
# and dual-stack alias records pointing the domain at the load balancer.
{% if values.custom_domain_enabled | bool %}
{% if values.dns_zone_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsRoute53Zone
metadata:
  # The zone's domain IS the resource name (create-time immutable).
  name: "{{ values.dns_zone_name }}"
spec:
  region: "{{ values.aws_region }}"
  isPrivate: false
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsCertManagerCert
metadata:
  name: "{{ values.stack_name }}-cert"
spec:
  # An ALB certificate lives in the ALB's own region (unlike CloudFront's
  # us-east-1 contract).
  region: "{{ values.aws_region }}"
  primaryDomainName: "{{ values.domain_name }}"
  validationMethod: DNS
  # Pointing the certificate at the hosted zone makes issuance hands-free:
  # the validation CNAMEs are created in the zone and the certificate
  # waits until ISSUED before the HTTPS listener consumes it.
{% if values.dns_zone_enabled | bool %}
  route53HostedZoneId:
    valueFrom:
      kind: AwsRoute53Zone
      name: "{{ values.dns_zone_name }}"
      fieldPath: status.outputs.zone_id
{% else %}
  route53HostedZoneId:
    value: "{{ values.existing_zone_id }}"
{% endif %}
---
# Alias records, not CNAMEs: they work on zone apexes, resolve for free,
# and track the load balancer's own address set.
apiVersion: aws.planton.dev/v1
kind: AwsRoute53DnsRecord
metadata:
  name: "{{ values.stack_name }}-alias-a"
spec:
  region: "{{ values.aws_region }}"
{% if values.dns_zone_enabled | bool %}
  zoneId:
    valueFrom:
      kind: AwsRoute53Zone
      name: "{{ values.dns_zone_name }}"
      fieldPath: status.outputs.zone_id
{% else %}
  zoneId:
    value: "{{ values.existing_zone_id }}"
{% endif %}
  name: "{{ values.domain_name }}"
  type: A
  aliasTarget:
    dnsName:
      valueFrom:
        kind: AwsAlb
        name: "{{ values.stack_name }}-alb"
        fieldPath: status.outputs.load_balancer_dns_name
    zoneId:
      valueFrom:
        kind: AwsAlb
        name: "{{ values.stack_name }}-alb"
        fieldPath: status.outputs.load_balancer_hosted_zone_id
    # Route 53 stops answering with this target if the ALB reports
    # unhealthy — the hook multi-region failover builds on later.
    evaluateTargetHealth: true
---
# The IPv6 twin, so IPv6-only clients reach the stack.
apiVersion: aws.planton.dev/v1
kind: AwsRoute53DnsRecord
metadata:
  name: "{{ values.stack_name }}-alias-aaaa"
spec:
  region: "{{ values.aws_region }}"
{% if values.dns_zone_enabled | bool %}
  zoneId:
    valueFrom:
      kind: AwsRoute53Zone
      name: "{{ values.dns_zone_name }}"
      fieldPath: status.outputs.zone_id
{% else %}
  zoneId:
    value: "{{ values.existing_zone_id }}"
{% endif %}
  name: "{{ values.domain_name }}"
  type: AAAA
  aliasTarget:
    dnsName:
      valueFrom:
        kind: AwsAlb
        name: "{{ values.stack_name }}-alb"
        fieldPath: status.outputs.load_balancer_dns_name
    zoneId:
      valueFrom:
        kind: AwsAlb
        name: "{{ values.stack_name }}-alb"
        fieldPath: status.outputs.load_balancer_hosted_zone_id
    evaluateTargetHealth: true
{% endif %}
