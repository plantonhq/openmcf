params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region the entire stack deploys into. Everything here is
      regional and lives together — network, service, database, cache,
      certificate, WAF.
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: stack_name
    description: >
      Name prefix for every resource in the stack (network, service,
      database, cache, alarms). Lets you run several stacks (prod,
      staging) in one environment. Lowercase letters, digits, and hyphens.
    value: prod

  # ── Network ─────────────────────────────────────────────────────────────
  - name: vpc_cidr
    description: >
      The VPC's IPv4 CIDR block. /16 leaves room to grow for years. Pick a
      range that never overlaps networks you may peer or VPN with — the
      block is immutable after creation.
    value: 10.0.0.0/16

  - name: availability_zones
    description: >
      Availability zones to stripe the network across — one public and one
      private subnet per AZ; the two CIDR lists below are index-matched to
      this list (entry N serves AZ N). Two AZs is the high-availability
      minimum.
    type: list
    value:
      - us-east-1a
      - us-east-1b

  - name: public_subnet_cidrs
    description: >
      IPv4 CIDR per public subnet, index-matched to availability_zones.
      The public tier carries the load balancer and the NAT gateway; /20
      leaves headroom for both to scale addresses per AZ.
    type: list
    value:
      - 10.0.0.0/20
      - 10.0.16.0/20

  - name: private_subnet_cidrs
    description: >
      IPv4 CIDR per private subnet, index-matched to availability_zones.
      The private tier hosts everything with data: tasks, the database,
      the cache — nothing here is reachable from the internet.
    type: list
    value:
      - 10.0.128.0/20
      - 10.0.144.0/20

  # ── Application ─────────────────────────────────────────────────────────
  - name: container_image
    description: >
      The application image. The default public httpd sample makes the
      whole stack deploy green out of the box; push your image to the
      stack's ECR repository and point this at it (the README walks
      through the first deploy).
    value: public.ecr.aws/docker/library/httpd:2.4

  - name: container_port
    type: number
    description: >
      The port the application listens on inside the container. The target
      group, security groups, and port mapping all derive from this one
      value. The default matches the httpd sample; most app images use
      8080.
    value: 80

  - name: health_check_path
    description: >
      HTTP path the load balancer probes for task health. Point it at a
      cheap endpoint that reflects real readiness — ideally one that
      exercises the database connection, so a task that lost its
      dependencies leaves rotation.
    value: /

  - name: task_cpu
    type: number
    description: >
      CPU units per task (1024 = 1 vCPU). Must pair with task_memory on
      Fargate's sizing grid (512/1024, 1024/2048, 2048/4096 are common
      steps). With the task count, this is the compute cost dial.
    value: 512

  - name: task_memory
    type: number
    description: >
      Memory in MiB per task, paired with task_cpu on the Fargate grid
      (512 CPU allows 1024-4096 MiB).
    value: 1024

  - name: min_tasks
    type: number
    description: >
      Autoscaling floor and initial count. Two, spread across the AZs, is
      the availability minimum for production traffic.
    value: 2

  - name: max_tasks
    type: number
    description: >
      Autoscaling ceiling — where growth stops no matter the load. Set it
      from the bill you accept and what the database absorbs.
    value: 10

  - name: requests_per_target
    type: number
    description: >
      Target requests per minute per task. The autoscaler holds each
      task's ALB request rate near this value between the bounds — set it
      from a load test at comfortable latency.
    value: 1000

  # ── Database (Aurora PostgreSQL Serverless v2) ──────────────────────────
  - name: db_name
    description: >
      Name of the initial PostgreSQL database created in the cluster.
    value: appdb

  - name: db_master_username
    description: >
      Master username. The password never exists in configuration: AWS
      generates and stores it in Secrets Manager (the cluster exports the
      secret's ARN), and owns rotation.
    value: dbadmin

  - name: db_min_capacity
    type: number
    description: >
      Serverless v2 floor in ACUs (0.5 steps). 0.5 keeps the database warm
      and instantly responsive — the production floor. 0 enables
      auto-pause (scale-to-zero) for staging stacks that tolerate ~15s
      resume latency on first query.
    value: 0.5

  - name: db_max_capacity
    type: number
    description: >
      Serverless v2 ceiling in ACUs (each ACU ≈ 2 GiB RAM with matching
      compute). Capacity floats with load between the bounds and bills per
      ACU-hour — this is the database cost ceiling.
    value: 16

  - name: deletion_protection
    type: bool
    description: >
      Refuse to delete the database cluster while enabled. Production
      posture is on: a teardown must be a deliberate two-step act. Even
      when disabled, deletion still takes a final snapshot.
    value: true

  # ── Cache ───────────────────────────────────────────────────────────────
  - name: redis_enabled
    type: bool
    description: >
      A two-node HA Redis (automatic failover across AZs, encrypted in
      transit and at rest) on the private tier. Sessions, hot reads, and
      rate counters usually justify it; turn off for stacks that don't
      cache yet — it composes back in later without touching anything
      else.
    value: true

  - name: redis_node_type
    description: >
      Instance class per cache node (two nodes run for HA). cache.t4g.small
      (~2 GiB) is a cost-conscious production start; move to r7g classes
      when the working set outgrows it.
    value: cache.t4g.small

  # ── Domain & TLS ────────────────────────────────────────────────────────
  - name: custom_domain_enabled
    type: bool
    description: >
      Serve on your own domain over HTTPS: an ACM certificate (DNS
      validation, hands-free issuance), a 443 listener with an HTTP→HTTPS
      redirect, and dual-stack alias records. Off serves plain HTTP on the
      load balancer's generated DNS name — a bootstrap posture, not a
      production one.
    value: false

  - name: domain_name
    description: >
      The fully qualified domain the application serves on (e.g.
      app.example.com). The certificate is requested for exactly this
      name. Only used when custom_domain_enabled is true.
    value: app.example.com

  - name: dns_zone_enabled
    type: bool
    description: >
      Create the Route 53 hosted zone for dns_zone_name as part of this
      stack (delegate your registrar's NS records to it after deploy).
      Turn off when the zone already exists — the common case for an
      established domain — and set existing_zone_id. Only meaningful while
      custom_domain_enabled is true.
    value: true

  - name: dns_zone_name
    description: >
      The hosted-zone domain that owns domain_name (e.g. example.com for
      app.example.com). Only used when the chart creates the zone.
    value: example.com

  - name: existing_zone_id
    description: >
      The id of an existing Route 53 hosted zone (Z...) that owns
      domain_name. Only used when dns_zone_enabled is false.
    value: Z0123456789EXAMPLE

  # ── Protection & observability ──────────────────────────────────────────
  - name: waf_enabled
    type: bool
    description: >
      AWS WAF with the Core and Known-Bad-Inputs managed rule packs in
      front of the load balancer — exploit probes filtered before they
      reach the service. ~$10+/month plus per-request fees; the default is
      on because this stack's name is production.
    value: true

  - name: alarms_enabled
    type: bool
    description: >
      The pager wire: CloudWatch alarms on service CPU/memory and database
      CPU/capacity, all notifying an SNS topic with an email subscription.
      AWS emails a confirmation link on first deploy — click it or no
      alert ever arrives.
    value: true

  - name: alert_email
    description: >
      Where alarm notifications go. Only used when alarms_enabled is true.
      Prefer a team list or paging bridge over an individual inbox.
    value: ops@example.com
