# The durable delivery plane: a work queue that buffers matched events
# for consumers, and the dead-letter queue behind it. SQS between
# EventBridge and your consumer is what makes the backbone lose nothing:
# the bus itself retries deliveries only briefly, while a queue holds
# events for days across consumer deploys, crashes, and backpressure.
---
# The dead-letter queue: where messages land after repeated consumer
# failures (via the work queue's redrive) and where EventBridge parks
# events it could not deliver at all (via the rule target's dead-letter
# config). Nothing consumes it automatically — the alarm in
# observability.yaml is its voice.
apiVersion: aws.planton.dev/v1
kind: AwsSqsQueue
metadata:
  name: "{{ values.backbone_name }}-dlq"
spec:
  region: "{{ values.aws_region }}"
  # 14 days — the SQS maximum. Dead letters are evidence for a human;
  # give the investigation the longest window AWS sells.
  messageRetentionSeconds: 1209600
  # Only this chart's own queues may use this DLQ as their redrive
  # target. The source ARNs are composed from the chart's own rendered
  # names rather than referenced: a reference here would create a
  # dependency cycle (the work queue already references this DLQ), and
  # queue ARNs are render-stable — region, account, name.
  redriveAllowPolicy:
    redrivePermission: byQueue
    sourceQueueArns:
      - value: arn:aws:sqs:{{ values.aws_region }}:{{ values.aws_account_id }}:{{ values.backbone_name }}-work-queue
{% if values.sns_fanout_enabled | bool %}
      - value: arn:aws:sqs:{{ values.aws_region }}:{{ values.aws_account_id }}:{{ values.backbone_name }}-fanout-queue
{% endif %}
  # EventBridge also needs SendMessage here for the rule target's
  # dead-letter path — undeliverable-event parking uses the same
  # permission model as normal delivery. A queue policy is plain JSON
  # (it cannot carry references), so the rule ARN is composed at render
  # time from names this chart controls; the aws:SourceArn condition
  # scopes the grant to exactly this chart's rule.
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: AllowRuleDeadLetterDelivery
        Effect: Allow
        Principal:
          Service: events.amazonaws.com
        Action: sqs:SendMessage
        Resource: arn:aws:sqs:{{ values.aws_region }}:{{ values.aws_account_id }}:{{ values.backbone_name }}-dlq
        Condition:
          ArnEquals:
            aws:SourceArn: arn:aws:events:{{ values.aws_region }}:{{ values.aws_account_id }}:rule/{{ values.backbone_name }}-bus/{{ values.backbone_name }}-route
---
# The work queue: the backbone's main consumption point. One consumer
# group owns it — competing consumers on one queue split the messages,
# they do not each get a copy (fan-out is the SNS plane's job).
apiVersion: aws.planton.dev/v1
kind: AwsSqsQueue
metadata:
  name: "{{ values.backbone_name }}-work-queue"
spec:
  region: "{{ values.aws_region }}"
  # How long a received message stays invisible while a consumer works
  # on it. 300s comfortably covers the Lambda consumer this chart can
  # deploy (Lambda's guidance: visibility of at least 6x the function
  # timeout) — raise it in step if you raise the consumer's timeout.
  visibilityTimeoutSeconds: 300
  # A week of buffer: a consumer outage that starts Friday evening
  # still loses nothing by Monday.
  messageRetentionSeconds: 604800
  # After 5 failed receives a message moves to the DLQ instead of
  # poisoning the queue forever. 5 rides out transient failures
  # (deploys, brief downstream outages) while still surfacing a
  # genuinely bad event within minutes.
  deadLetterConfig:
    targetArn:
      valueFrom:
        kind: AwsSqsQueue
        name: "{{ values.backbone_name }}-dlq"
        fieldPath: status.outputs.queue_arn
    maxReceiveCount: 5
  # Without this grant, EventBridge deliveries are SILENTLY dropped —
  # the rule reports success and the queue stays empty (delivery uses
  # the queue's resource policy, not any IAM role). Same render-time
  # composition and rule scoping as the DLQ policy above.
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: AllowRuleDelivery
        Effect: Allow
        Principal:
          Service: events.amazonaws.com
        Action: sqs:SendMessage
        Resource: arn:aws:sqs:{{ values.aws_region }}:{{ values.aws_account_id }}:{{ values.backbone_name }}-work-queue
        Condition:
          ArnEquals:
            aws:SourceArn: arn:aws:events:{{ values.aws_region }}:{{ values.aws_account_id }}:rule/{{ values.backbone_name }}-bus/{{ values.backbone_name }}-route
