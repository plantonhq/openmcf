# The optional Lambda consumer (rendered only when
# lambda_consumer_enabled): an event source mapping polls the work queue
# and invokes your handler with batches. Unlike EventBridge/SNS delivery
# (resource policies), SQS POLLING authorizes through the function's
# execution role — the role below carries exactly the receive/delete
# grants the mapping needs, scoped to this chart's own queue.
{% if values.lambda_consumer_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.backbone_name }}-consumer-role"
spec:
  region: "{{ values.aws_region }}"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: lambda.amazonaws.com
        Action: sts:AssumeRole
  managedPolicyArns:
    # CloudWatch Logs write — without it the consumer runs but its logs
    # vanish.
    - value: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  inlinePolicies:
    # The three actions Lambda's SQS poller requires, on this queue
    # only. The ARN is composed from the chart's own rendered names (an
    # IAM policy document is plain JSON and cannot carry references).
    queue-consume:
      Version: "2012-10-17"
      Statement:
        - Sid: ConsumeWorkQueue
          Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: arn:aws:sqs:{{ values.aws_region }}:{{ values.aws_account_id }}:{{ values.backbone_name }}-work-queue
---
apiVersion: aws.planton.dev/v1
kind: AwsLambda
metadata:
  name: "{{ values.backbone_name }}-consumer"
spec:
  region: "{{ values.aws_region }}"
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: "{{ values.backbone_name }}-consumer-role"
      fieldPath: status.outputs.role_arn
  s3:
    bucket:
      value: "{{ values.consumer_code_bucket }}"
    key: "{{ values.consumer_code_key }}"
  runtime: "{{ values.consumer_runtime }}"
  handler: "{{ values.consumer_handler }}"
  # Must stay well under the work queue's 300s visibility timeout — a
  # handler still running when visibility expires means another
  # invocation receives the same messages concurrently.
  timeoutSeconds: {{ values.consumer_timeout_seconds }}
---
apiVersion: aws.planton.dev/v1
kind: AwsLambdaEventSourceMapping
metadata:
  name: "{{ values.backbone_name }}-consumer-esm"
spec:
  region: "{{ values.aws_region }}"
  functionArn:
    valueFrom:
      kind: AwsLambda
      name: "{{ values.backbone_name }}-consumer"
      fieldPath: status.outputs.function_arn
  eventSourceArn:
    valueFrom:
      kind: AwsSqsQueue
      name: "{{ values.backbone_name }}-work-queue"
      fieldPath: status.outputs.queue_arn
  # Up to 10 messages per invocation (the SQS ceiling without a
  # batching window) — amortizes cold starts without holding events
  # back to fill a batch.
  batchSize: 10
  # Partial-batch failure reporting: the handler returns the message
  # ids that failed ("batchItemFailures") and ONLY those return to the
  # queue — without this, one bad event in a batch of 10 forces all 10
  # through the retry-and-redrive cycle. A handler that returns nothing
  # still means "whole batch succeeded", so simple handlers work
  # unchanged.
  functionResponseTypes:
    - ReportBatchItemFailures
{% endif %}
