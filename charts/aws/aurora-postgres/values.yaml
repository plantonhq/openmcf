params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for the cluster and its security group. Choose the region
      where the applications that talk to this database run — cross-region
      database traffic pays in both latency and transfer cost.
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: cluster_name
    description: >
      Name for the cluster and the prefix for its companion resources (the
      security group, the final snapshot). Lowercase letters, digits, and
      hyphens.
    value: my-app-db

  # ── Network attachment ──────────────────────────────────────────────────
  - name: vpc_id
    description: >
      The VPC the database security group is created in. When composing with
      the network-foundation chart in the same environment, you can instead
      reference the VPC by name — see the README's composition section.
    value: vpc-0123456789abcdef0

  - name: db_subnet_ids
    description: >
      At least two subnet ids in DIFFERENT availability zones — Aurora
      requires a multi-AZ footprint even for a single-instance cluster. Use
      PRIVATE subnets: a database has no business being addressable from the
      internet. The chart builds the DB subnet group from these. When
      composing with network-foundation, swap the literals for references to
      its private subnets (README shows how).
    type: list
    value:
      - subnet-0123456789abcdef0
      - subnet-0123456789abcdef1

  - name: app_cidr
    description: >
      The CIDR range the applications connect from — typically the VPC CIDR,
      or a narrower application-subnet range for tighter scoping. This is the
      ONLY ingress the database security group allows, on the PostgreSQL port
      alone. For SG-to-SG scoping (tighter still), see the README's day-2
      section.
    value: 10.0.0.0/16

  # ── Database ────────────────────────────────────────────────────────────
  - name: database_name
    description: >
      Name of the initial database created in the cluster. Additional
      databases are a CREATE DATABASE away once connected.
    value: appdb

  - name: master_username
    description: >
      The master (superuser) login name. Its password is NEVER part of this
      chart's inputs — manageMasterUserPassword has AWS generate it, store it
      in Secrets Manager, and rotate it there; applications read the secret
      at startup.
    value: dbadmin

  - name: engine_version
    description: >
      Aurora PostgreSQL engine version. Pinning keeps rebuilt environments
      deterministic; minor versions patch in-place during maintenance
      windows. Set to an empty string to let AWS pick its current default at
      create time.
    value: "16.4"

  # ── Capacity (the cost dials) ───────────────────────────────────────────
  - name: min_capacity
    type: number
    description: >
      Serverless v2 floor in ACUs (each ACU is roughly 2 GiB of memory with
      matching compute). 0.5 is the smallest always-warm footprint — first
      queries are never cold. Set to 0 to allow scale-to-zero auto-pause:
      the cluster costs nothing while idle but the first connection after a
      pause waits ~15 seconds to resume — the right trade for dev/staging,
      rarely for production. Only used while serverless_enabled is true.
    value: 0.5

  - name: max_capacity
    type: number
    description: >
      Serverless v2 ceiling in ACUs (up to 256). This is the real spend
      guard: a runaway query storm scales to this ceiling and no further. 16
      ACUs (~32 GiB) gives production headroom; lower it for lighter
      workloads. Only used while serverless_enabled is true.
    value: 16

  - name: provisioned_instance_class
    type: string
    description: >
      Instance class for every cluster instance when serverless_enabled is
      false (e.g. db.r6g.large, db.r7g.xlarge). Provisioned instances win on
      steady, predictable load; Serverless v2 wins everywhere else.
    value: db.r6g.large

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: serverless_enabled
    type: bool
    description: >
      Run the cluster's instances as Aurora Serverless v2 (capacity scales
      between min_capacity and max_capacity automatically, billed per
      ACU-hour). Turn off for provisioned instances of
      provisioned_instance_class — steady high-utilization workloads where a
      reserved-instance price beats per-ACU billing.
    value: true

  - name: reader_enabled
    type: bool
    description: >
      Add a reader instance in a second availability zone. Two wins at once:
      read traffic scales out through the cluster's reader endpoint, and
      failover becomes near-instant promotion instead of a fresh-instance
      replacement. Doubles the instance cost — turn it on when the database
      carries production traffic.
    value: false

  - name: deletion_protection
    type: bool
    description: >
      Refuse to delete the cluster while enabled — the guard between a wrong
      terminal command and your production data. Keep it on for anything
      real; a deliberate teardown disables it first (see the README's
      teardown section).
    value: true
