params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region the SES resources are created in. SES is regional —
      sending happens through this region's endpoint, and the MAIL FROM
      MX record this chart can publish points at this region's SES
      feedback endpoint. Verify the same domain in each region you send
      from.
    value: us-east-1

  - name: aws_account_id
    description: >
      The 12-digit AWS account id the sender deploys into. Used in the
      feedback topic's resource policy (plain JSON that cannot carry
      references) so that ONLY this account's SES — and specifically
      this chart's configuration set — can publish events to it.
    value: "123456789012"

  # ── Identity ────────────────────────────────────────────────────────────
  - name: sender_name
    description: >
      Name prefix for every resource this chart creates (identity,
      configuration set, topics, alarms). Several senders — per product
      or per environment — can share an account without collisions.
      Lowercase letters, digits, and hyphens.
    value: mailer

  - name: email_domain
    description: >
      The domain to verify and send from (e.g. example.com — mail goes
      out as anything@example.com). A DOMAIN identity is the production
      shape: DKIM-signed, covering every address at the domain.
      Create-time immutable — a different domain is a different
      identity.
    value: example.com

  # ── Envelope alignment (DMARC) ──────────────────────────────────────────
  - name: mail_from_enabled
    type: bool
    description: >
      Use a custom MAIL FROM subdomain (below) as the envelope sender
      instead of SES's own amazonses.com bounce domain. This is what
      makes SPF align for DMARC — without it, strict DMARC policies
      judge your mail on Amazon's domain, not yours. Needs the MX and
      SPF records this chart publishes when dns_records_enabled is on.
    value: true

  - name: mail_from_subdomain
    description: >
      The subdomain label for the MAIL FROM domain — "mail" makes
      mail.example.com. Must not be a subdomain you receive mail on
      (SES owns its bounce traffic). Only used when mail_from_enabled
      is true.
    value: mail

  # ── DNS records (bring your own Route 53 zone) ─────────────────────────
  - name: dns_records_enabled
    type: bool
    description: >
      Publish the sender's DNS records into an existing Route 53 hosted
      zone: the DMARC policy record, and — with mail_from_enabled — the
      MAIL FROM MX and SPF records. Turn off when DNS lives outside
      Route 53; the README lists every record to create manually. The
      DKIM CNAMEs are published as a post-deploy step either way (their
      values only exist after the identity is created — see the
      README).
    value: false

  - name: zone_id
    description: >
      The id of the existing Route 53 hosted zone (Z...) that owns
      email_domain. Only used when dns_records_enabled is true.
    value: Z0123456789EXAMPLE

  - name: dmarc_policy
    description: >
      The DMARC policy receivers apply to mail that fails
      authentication: "none" (monitor only — the safe starting point),
      "quarantine" (spam-folder it), or "reject" (refuse it). Start at
      none, watch the aggregate reports for a few weeks, then ratchet
      up — jumping straight to reject with a misconfigured source loses
      real mail. Only used when dns_records_enabled is true.
    value: none

  - name: dmarc_report_email
    description: >
      Where receivers send DMARC aggregate reports (the rua address) —
      your visibility into who is sending as your domain and what is
      failing alignment. Only used when dns_records_enabled is true.
    value: dmarc-reports@example.com

  # ── Delivery posture ────────────────────────────────────────────────────
  - name: tls_required
    type: bool
    description: >
      Deliver only over TLS-protected connections, failing sends to
      receivers that cannot negotiate TLS. The right posture for
      transactional mail (password resets, invoices, personal data);
      turn off only if you must reach legacy mail servers, accepting
      that those messages travel in plaintext.
    value: true

  - name: feedback_notifications_enabled
    type: bool
    description: >
      Publish every bounce and complaint event to an SNS topic your
      application subscribes to. This is the feedback loop that keeps a
      sender healthy: prune hard-bounced addresses and honor complaints
      immediately, before they accumulate into the reputation
      thresholds SES suspends accounts over.
    value: true

  # ── Alerting ────────────────────────────────────────────────────────────
  - name: alarms_enabled
    type: bool
    description: >
      The pager wire: CloudWatch alarms on the sender's bounce and
      complaint RATES (SES's reputation metrics for this configuration
      set), firing at the thresholds where AWS starts paying attention
      — well before an account-level pause. Notifies an SNS topic with
      an email subscription; AWS emails a confirmation link on first
      deploy — click it or no alert ever arrives.
    value: true

  - name: alert_email
    description: >
      Where alarm notifications go. Only used when alarms_enabled is
      true. Prefer a team list or paging bridge over an individual
      inbox.
    value: ops@example.com
