# The sender's DNS plane (rendered only when dns_records_enabled), in an
# existing Route 53 zone. Everything here is render-stable — the DMARC
# policy, the MAIL FROM MX/SPF values — and publishes with the chart.
# The one record set that CANNOT live here is the DKIM CNAME trio: its
# names and values come from the identity's dkim_tokens output, which
# only exists after the identity is created. Publishing tokens that do
# not exist yet is impossible, so the DKIM records are the explicit
# post-deploy step in the README, never a placeholder.
{% if values.dns_records_enabled | bool %}
---
# The domain's DMARC policy: what receivers do with mail that fails
# DKIM/SPF alignment, and where they send the aggregate reports that
# show you every source sending as your domain.
apiVersion: aws.planton.dev/v1
kind: AwsRoute53DnsRecord
metadata:
  name: "{{ values.sender_name }}-dmarc"
spec:
  region: "{{ values.aws_region }}"
  zoneId:
    value: "{{ values.zone_id }}"
  name: "_dmarc.{{ values.email_domain }}"
  type: TXT
  ttl: 3600
  values:
    - "v=DMARC1; p={{ values.dmarc_policy }}; rua=mailto:{{ values.dmarc_report_email }}"
{% if values.mail_from_enabled | bool %}
---
# The MAIL FROM domain's MX record: receivers' bounce traffic for the
# envelope sender routes back into SES's regional feedback endpoint.
# This record existing (and matching the region) is what flips the MAIL
# FROM domain to verified.
apiVersion: aws.planton.dev/v1
kind: AwsRoute53DnsRecord
metadata:
  name: "{{ values.sender_name }}-mail-from-mx"
spec:
  region: "{{ values.aws_region }}"
  zoneId:
    value: "{{ values.zone_id }}"
  name: "{{ values.mail_from_subdomain }}.{{ values.email_domain }}"
  type: MX
  ttl: 3600
  values:
    # "<priority> <host>" — the MX record format; 10 is conventional
    # when there is a single exchanger.
    - "10 feedback-smtp.{{ values.aws_region }}.amazonses.com"
---
# The MAIL FROM domain's SPF record: declares SES's IP space as
# authorized to send for the envelope domain. With the custom MAIL FROM,
# this is the SPF that DMARC alignment is judged against.
apiVersion: aws.planton.dev/v1
kind: AwsRoute53DnsRecord
metadata:
  name: "{{ values.sender_name }}-mail-from-spf"
spec:
  region: "{{ values.aws_region }}"
  zoneId:
    value: "{{ values.zone_id }}"
  name: "{{ values.mail_from_subdomain }}.{{ values.email_domain }}"
  type: TXT
  ttl: 3600
  values:
    - "v=spf1 include:amazonses.com ~all"
{% endif %}
{% endif %}
