# The identity plane (rendered only when auth_enabled): a Cognito user
# pool and the app client your frontend authenticates through. The
# gateway's JWT authorizer (api.yaml) validates tokens minted here, so
# the whole authentication path is three references with no shared
# secrets anywhere.
{% if values.auth_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsCognitoUserPool
metadata:
  name: "{{ values.api_name }}-users"
spec:
  region: "{{ values.aws_region }}"
  # Users sign in with their email address — the shape every consumer
  # product uses. Create-time immutable, so it is the one identity
  # decision to make deliberately here.
  usernameAttributes:
    - email
  # Cognito emails a verification code at sign-up automatically; only
  # verified addresses can be used for account recovery below.
  autoVerifiedAttributes:
    - email
  # 12 characters with mixed classes — the floor for anything
  # internet-facing. Loosening this later is an in-place update;
  # existing passwords are never re-checked.
  passwordPolicy:
    minimumLength: 12
    requireLowercase: true
    requireUppercase: true
    requireNumbers: true
    requireSymbols: true
  # Self-service password reset through the verified email — without an
  # explicit mechanism, every forgotten password becomes an admin
  # ticket.
  accountRecoveryMechanisms:
    - name: verified_email
      priority: 1
---
apiVersion: aws.planton.dev/v1
kind: AwsCognitoUserPoolClient
metadata:
  name: "{{ values.api_name }}-client"
spec:
  region: "{{ values.aws_region }}"
  userPoolId:
    valueFrom:
      kind: AwsCognitoUserPool
      name: "{{ values.api_name }}-users"
      fieldPath: status.outputs.user_pool_id
  # SRP sign-in plus token refresh — the browser/mobile flow where the
  # password never crosses the wire. No client secret is generated: a
  # public client (SPA, mobile app) cannot keep one, and the JWT
  # authorizer validates tokens by signature, not by secret.
  explicitAuthFlows:
    - ALLOW_USER_SRP_AUTH
    - ALLOW_REFRESH_TOKEN_AUTH
  # Answer wrong-password and no-such-user identically, so the login
  # form cannot be used to enumerate which emails have accounts.
  preventUserExistenceErrors: ENABLED
{% endif %}
