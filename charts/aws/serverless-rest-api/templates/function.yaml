# The application: one Lambda function serving every route through the
# gateway's catch-all. One function (a "Lambdalith") beats per-route
# functions for a REST API of ordinary size — one artifact to deploy, one
# set of alarms, one cold-start profile, and your web framework's router
# does what it is good at. Split hot routes into their own functions only
# when their scaling or memory profiles genuinely diverge.
---
apiVersion: aws.planton.dev/v1
kind: AwsLambda
metadata:
  name: "{{ values.api_name }}-fn"
spec:
  region: "{{ values.aws_region }}"
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: "{{ values.api_name }}-fn-role"
      fieldPath: status.outputs.role_arn
{% if values.container_image_enabled | bool %}
  # Container packaging: the image carries the runtime, so Lambda
  # forbids setting runtime/handler beside it — this arm renders
  # neither.
  imageUri: "{{ values.container_image_uri }}"
{% else %}
  # Zip packaging: artifact from S3 plus the runtime/handler pair that
  # tells Lambda how to start it.
  s3:
    bucket:
      value: "{{ values.lambda_code_bucket }}"
    key: "{{ values.lambda_code_key }}"
  runtime: "{{ values.lambda_runtime }}"
  handler: "{{ values.lambda_handler }}"
{% endif %}
  memorySizeMb: {{ values.lambda_memory_mb }}
  timeoutSeconds: {{ values.lambda_timeout_seconds }}
  # The table name is injected rather than hardcoded in the handler —
  # the same artifact then runs unchanged in every environment. It is
  # composed from the same rendered value the table resource uses, so
  # the two cannot drift. (Environment variables are plain strings;
  # nothing secret belongs here.)
  environment:
    TABLE_NAME: "{{ values.api_name }}-table"
  # The resource-side half of the API Gateway wiring: without this
  # grant, the gateway's calls are rejected with AccessDenied no matter
  # what the route configuration says. The grant is scoped to API
  # Gateway invocations originating in THIS account — the confused-
  # deputy guard. The exact API's execution ARN only exists after
  # deployment; the README shows how to tighten this grant to it as a
  # day-2 step.
  invokePermissions:
    - statementId: allow-api-gateway
      principal: apigateway.amazonaws.com
      action: lambda:InvokeFunction
      sourceAccount: "{{ values.aws_account_id }}"
