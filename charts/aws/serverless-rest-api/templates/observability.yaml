# The pager wire: an SNS topic, an email subscription, and alarms on the
# two function signals that always mean "a human should look" — errors
# and throttles. Every dimension here is the chart's own rendered
# function name, stable from the first deploy. Gateway-level alarms (5xx
# rate, integration latency) deliberately do NOT live here: their
# CloudWatch dimension is the ApiId, which only exists after deployment —
# the README shows how to add them from the outputs as a day-2 step
# instead of shipping alarms that silently watch nothing.
#
# A deliberate omission: no dead-letter queue. Lambda's DLQ only receives
# ASYNCHRONOUS invocations that exhaust their retries, and API Gateway
# invokes this function synchronously — a DLQ here would sit forever
# empty while looking like a safety net. Failed requests surface as 5xx
# to the caller and as the Errors alarm below.
{% if values.alarms_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSnsTopic
metadata:
  name: "{{ values.api_name }}-alerts"
spec:
  region: "{{ values.aws_region }}"
  displayName: "{{ values.api_name }} alerts"
---
apiVersion: aws.planton.dev/v1
kind: AwsSnsSubscription
metadata:
  name: "{{ values.api_name }}-alerts-email"
spec:
  region: "{{ values.aws_region }}"
  topicArn:
    valueFrom:
      kind: AwsSnsTopic
      name: "{{ values.api_name }}-alerts"
      fieldPath: status.outputs.topic_arn
  protocol: email
  # Email subscriptions require a one-time confirmation click — AWS
  # sends it on creation, and no alert is delivered until it is
  # confirmed.
  endpoint:
    value: "{{ values.alert_email }}"
---
# Unhandled exceptions in the handler. Zero tolerance: a REST API's
# errors are user-facing 5xx responses, so a single bad five-minute
# window pages rather than waiting for a trend.
apiVersion: aws.planton.dev/v1
kind: AwsCloudwatchAlarm
metadata:
  name: "{{ values.api_name }}-fn-errors"
spec:
  region: "{{ values.aws_region }}"
  namespace: AWS/Lambda
  metricName: Errors
  dimensions:
    FunctionName: "{{ values.api_name }}-fn"
  statistic: Sum
  period: 300
  comparisonOperator: GreaterThanThreshold
  threshold: 0
  evaluationPeriods: 1
  # Quiet periods report no metric at all; missing data is health, not
  # an outage.
  treatMissingData: notBreaching
  alarmDescription: "{{ values.api_name }}: function errors - callers are receiving 5xx, check the function logs"
  alarmActions:
    - valueFrom:
        kind: AwsSnsTopic
        name: "{{ values.api_name }}-alerts"
        fieldPath: status.outputs.topic_arn
---
# Throttles: the account's regional concurrency pool is exhausted, so
# requests are rejected BEFORE the function runs — invisible in the
# function's own logs, very visible to callers as 429s. The fix is a
# concurrency reservation or a limit increase, both human decisions.
apiVersion: aws.planton.dev/v1
kind: AwsCloudwatchAlarm
metadata:
  name: "{{ values.api_name }}-fn-throttles"
spec:
  region: "{{ values.aws_region }}"
  namespace: AWS/Lambda
  metricName: Throttles
  dimensions:
    FunctionName: "{{ values.api_name }}-fn"
  statistic: Sum
  period: 300
  comparisonOperator: GreaterThanThreshold
  threshold: 0
  evaluationPeriods: 1
  treatMissingData: notBreaching
  alarmDescription: "{{ values.api_name }}: invocations throttled - concurrency limit reached, callers receiving 429"
  alarmActions:
    - valueFrom:
        kind: AwsSnsTopic
        name: "{{ values.api_name }}-alerts"
        fieldPath: status.outputs.topic_arn
{% endif %}
