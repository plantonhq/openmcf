params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for the App Runner service and its companion resources.
      App Runner terminates TLS and serves a regional endpoint; pick the
      region closest to your users (or to the rest of your stack).
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: service_name
    description: >
      Name prefix for every resource this chart creates (service, scaling
      configuration, roles, connector). Lets several App Runner services
      coexist in one environment. Lowercase letters, digits, and hyphens.
    value: api

  # ── Workload ────────────────────────────────────────────────────────────
  - name: image_identifier
    description: >
      The container image to run. The default is AWS's public
      hello-app-runner sample so the chart deploys green out of the box.
      For your own application, push to a private ECR repository, flip
      private_ecr_enabled, and set this to the full image URL with a tag
      (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/api:v1.0.0).
    value: public.ecr.aws/aws-containers/hello-app-runner:latest

  - name: container_port
    description: >
      The port the application listens on inside the container. App Runner
      terminates HTTPS on 443 at its edge and forwards requests here — the
      app itself never handles TLS.
    value: "8080"

  - name: health_check_path
    description: >
      HTTP path App Runner probes to decide instance health. Point it at a
      cheap endpoint that reflects real readiness — unhealthy instances are
      replaced automatically and never receive traffic.
    value: /

  # ── Sizing (the cost dials) ─────────────────────────────────────────────
  - name: cpu
    description: >
      vCPU units per instance (1024 = 1 vCPU). Valid values are the App
      Runner grid: 256, 512, 1024, 2048, 4096 — each pairs with a memory
      range. App Runner bills per active vCPU-second, so instance size and
      the scaling bounds below are the cost dials.
    value: "1024"

  - name: memory
    description: >
      Memory in MiB per instance. Must pair with cpu on App Runner's grid
      (1024 CPU allows 2048-4096 MiB; 2048 CPU allows 4096-6144). Memory is
      billed even while an idle instance is paused, which is why right-sizing
      matters more here than on always-billed platforms.
    value: "2048"

  - name: max_concurrency
    type: number
    description: >
      Concurrent requests one instance handles before App Runner scales out.
      This is the scaling trigger: lower it for latency-sensitive or
      CPU-heavy request profiles (fewer requests share an instance), raise
      it for I/O-bound APIs that multiplex well. 1-200.
    value: 100

  - name: min_instances
    type: number
    description: >
      Warm floor. Instances below this never scale away — they keep memory
      provisioned (billed at the cheaper provisioned rate) and answer
      instantly with no cold start. 1 is the sensible production floor;
      raise it for spiky traffic that cannot tolerate scale-up latency.
    value: 1

  - name: max_instances
    type: number
    description: >
      Scale-out ceiling. Growth stops here no matter the load — set it from
      the worst bill you are willing to accept, and from what downstream
      dependencies (databases, rate-limited APIs) can absorb.
    value: 25

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: private_ecr_enabled
    type: bool
    description: >
      The image lives in a private ECR repository. Creates the ECR access
      role App Runner's build service assumes to pull it, and unlocks
      auto_deployments_enabled (AWS can only watch private repositories).
      Leave off while running the public sample image.
    value: false

  - name: auto_deployments_enabled
    type: bool
    description: >
      Push-to-deploy: App Runner watches the private ECR repository and
      rolls the service automatically whenever the referenced tag is
      updated. Only takes effect when private_ecr_enabled is true — AWS
      cannot watch public images, so with the sample image this is
      inert. Turn off to make every deploy an explicit, reviewable act.
    value: true

  - name: observability_enabled
    type: bool
    description: >
      AWS X-Ray request tracing via an observability configuration.
      Per-request traces show where latency lives across App Runner and
      every AWS service the app calls. X-Ray's free tier covers 100k
      traces/month; beyond that it bills per trace — the config itself is
      free.
    value: true

  - name: vpc_connector_enabled
    type: bool
    description: >
      Route the application's OUTBOUND traffic through your VPC via a VPC
      connector, so the service can reach private resources (databases,
      caches) that never face the internet. Inbound traffic still arrives
      through App Runner's public endpoint. Requires vpc_id and
      connector_subnet_ids.
    value: false

  - name: vpc_id
    description: >
      The VPC the connector attaches to (the network-foundation chart's
      output in the common case). Only used when vpc_connector_enabled is
      true.
    value: vpc-0123456789abcdef0

  - name: connector_subnet_ids
    description: >
      Private subnets (two-plus AZs) the connector places its network
      interfaces in. Egress from the app follows these subnets' route
      tables — through NAT for the internet, directly to anything in the
      VPC. Only used when vpc_connector_enabled is true.
    type: list
    value:
      - subnet-0cccccccccccccccc
      - subnet-0ddddddddddddddddd

  - name: custom_domain_enabled
    type: bool
    description: >
      Serve on your own subdomain: associates domain_name with the service.
      After the first deploy, the service's outputs carry the DNS target and
      the certificate-validation records — create those in your DNS zone as
      a one-time step (the README walks through it with copy-paste
      manifests). The records cannot be pre-created here because their
      values only exist once AWS issues them.
    value: false

  - name: domain_name
    description: >
      The fully qualified subdomain the service serves on (e.g.
      api.example.com). Only used when custom_domain_enabled is true. Zone
      apexes (example.com) need an ALIAS instead of a CNAME — the README
      covers that path.
    value: api.example.com
