# App Runner's two-role split mirrors ECS's: the ACCESS role is what App
# Runner's build service uses to PULL the image (deploy time), the INSTANCE
# role is what YOUR CODE gets when it calls AWS APIs (runtime). Different
# actors, different moments, different blast radii — they never merge.
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.service_name }}-instance-role"
spec:
  region: "{{ values.aws_region }}"
  # tasks.apprunner.amazonaws.com is the RUNTIME principal — the identity
  # your running application code assumes.
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: tasks.apprunner.amazonaws.com
        Action: sts:AssumeRole
  # Ships with NO permissions on purpose. Grant exactly what the app calls
  # (S3 buckets, SQS queues, Secrets Manager secrets for
  # environment_secrets — by ARN) here, and nowhere else.
{% if values.private_ecr_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.service_name }}-ecr-access-role"
spec:
  region: "{{ values.aws_region }}"
  # build.apprunner.amazonaws.com is the DEPLOY-TIME principal — App
  # Runner's own build/deploy machinery, which needs registry read access
  # and nothing else.
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: build.apprunner.amazonaws.com
        Action: sts:AssumeRole
  managedPolicyArns:
    # AWS's purpose-built policy: pull from any private ECR repository in
    # the account. Scope it down to specific repository ARNs with an inline
    # policy instead if your posture requires per-service registries.
    - value: arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
{% endif %}
