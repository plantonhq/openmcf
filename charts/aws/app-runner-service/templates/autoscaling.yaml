# The auto scaling configuration is a first-class, versioned AWS resource —
# shared by reference, not embedded — so several services can pin the same
# scaling policy and a tuning change rolls all of them deliberately through
# the graph. Every value here is create-time immutable: changing one
# registers a new revision whose ARN rolls the referencing service.
---
apiVersion: aws.planton.dev/v1
kind: AwsAppRunnerAutoScalingConfiguration
metadata:
  name: "{{ values.service_name }}-scaling"
spec:
  region: "{{ values.aws_region }}"
  # The scaling trigger: one instance handles this many concurrent requests
  # before App Runner adds another. Concurrency-based scaling reacts to
  # real traffic pressure immediately — there is no metric lag like
  # CPU-based policies have.
  maxConcurrency: {{ values.max_concurrency }}
  # The warm floor: paused instances below minSize keep provisioned memory
  # (billed at the cheaper provisioned rate) and resume instantly — this is
  # what makes min 1 feel always-on without always-on compute cost.
  minSize: {{ values.min_instances }}
  maxSize: {{ values.max_instances }}
