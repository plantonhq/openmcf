params:
  # ── Identity ────────────────────────────────────────────────────────────
  - name: site_name
    description: >
      Name prefix for the CDN-side resources this chart creates (the
      distribution, certificate, WAF, and DNS records). Keep it short and
      recognizable — it is how you find the site's pieces in the console.
    value: my-site

  - name: bucket_name
    description: >
      Globally unique name for the S3 bucket that holds the site's built
      files. S3 names are global across all AWS accounts, so prefix with your
      org (e.g. <org>-www). The bucket stays fully private — only CloudFront
      can read it, via Origin Access Control.
    value: my-org-site

  - name: aws_account_id
    description: >
      The 12-digit AWS account id the site deploys into. Used in the bucket
      policy's condition so ONLY CloudFront distributions from this account
      can read the bucket — without it the policy would trust any AWS
      account's distribution pointed at your bucket name. After the first
      deploy you can tighten the condition further to the exact distribution
      ARN (see the README's day-2 section).
    value: "123456789012"

  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      Region for the content bucket. CloudFront serves globally from edge
      locations regardless of where the bucket lives, so pick the region
      closest to wherever your CI uploads from. (The certificate and WAF are
      pinned to us-east-1 by AWS's own CloudFront contract — that is not
      configurable.)
    value: us-east-1

  # ── Domain ──────────────────────────────────────────────────────────────
  - name: domain_name
    description: >
      The fully qualified domain the site serves on (e.g. www.example.com or
      the apex example.com). Only used when custom_domain_enabled is true.
      The TLS certificate is requested for exactly this name.
    value: www.example.com

  - name: dns_zone_name
    description: >
      The Route 53 hosted-zone domain that owns domain_name (e.g. example.com
      for www.example.com). Only used when dns_zone_enabled is true — the
      chart then creates this public zone and you delegate your registrar's
      NS records to it after deploy.
    value: example.com

  - name: existing_zone_id
    description: >
      The id of an existing Route 53 hosted zone (Z...) that already owns
      domain_name. Only used when dns_zone_enabled is false — certificate
      validation records and the site's alias records are created in this
      zone instead of a chart-managed one.
    value: Z0123456789EXAMPLE

  # ── Delivery ────────────────────────────────────────────────────────────
  - name: price_class
    description: >
      Which CloudFront edge locations serve the site. PriceClass_100 (North
      America + Europe) is the cost-conscious default; PriceClass_200 adds
      Asia/Africa/Oceania; PriceClass_All serves from every edge worldwide.
      Visitors outside the selected class still get the site — just from a
      farther edge with slightly higher latency.
    value: PriceClass_100

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: custom_domain_enabled
    type: bool
    description: >
      Serve on your own domain with an ACM TLS certificate and Route 53 alias
      records. Turn off to skip all DNS/certificate resources and serve on
      the distribution's *.cloudfront.net address — useful for previews or
      when DNS lives entirely outside AWS.
    value: true

  - name: dns_zone_enabled
    type: bool
    description: >
      Create the Route 53 hosted zone as part of this chart. Turn off when
      the zone already exists (the common case for an established domain) and
      point existing_zone_id at it — the chart then only adds records. Only
      meaningful while custom_domain_enabled is true.
    value: true

  - name: waf_enabled
    type: bool
    description: >
      Put an AWS WAF web ACL with the Core and Known-Bad-Inputs managed rule
      packs in front of the distribution. This is the "secure" in secure
      static website — it filters exploit probes before they touch the CDN.
      WAF bills ~$5/month per ACL plus ~$1 per rule pack and per-request
      fees; turn it off for low-stakes sites where that overhead isn't
      justified.
    value: true

  - name: spa_mode
    type: bool
    description: >
      Single-page-application routing: map the 403 that S3 returns for
      unknown paths to a 200 serving /index.html, so client-side routers own
      every URL. Turn off for classic multi-page sites where a missing page
      should surface as an error instead of silently rendering the app
      shell.
    value: true
