# The edge firewall: an AWS WAF web ACL running two AWS-managed rule packs.
# Managed packs are maintained by AWS's threat team — signatures update
# without any action from you, which is the right trade for a static site
# (hand-rolled rules earn their keep on APIs, not on file serving).
{% if values.waf_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsWafWebAcl
metadata:
  name: "{{ values.site_name }}-waf"
spec:
  # CLOUDFRONT-scope ACLs must live in us-east-1 — enforced by AWS (and by
  # this kind's own validation), same contract as the certificate.
  region: us-east-1
  scope: CLOUDFRONT
  # Allow by default and let the rule packs block what they recognize — the
  # right polarity for a public website (deny-by-default is for private
  # APIs with known callers).
  defaultAction:
    type: allow
  rules:
    # Core rule set: the OWASP-top-10 style pack (request smuggling, LFI,
    # XSS probes, malformed requests). Group rules use overrideAction — set
    # to none so the pack's own per-rule block actions apply. Flip to count
    # to observe a pack's behavior in metrics before enforcing it.
    - name: aws-common-rules
      priority: 1
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesCommonRuleSet
          vendorName: AWS
    # Known bad inputs: signatures for specific exploit payloads (Log4Shell
    # class) — cheap, high-signal, no false-positive surface on static
    # content.
    - name: aws-known-bad-inputs
      priority: 2
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesKnownBadInputsRuleSet
          vendorName: AWS
{% endif %}
