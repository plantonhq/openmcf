params:
  # ── Cluster identity & binding ───────────────────────────────────────────
  - name: cluster_connection_name
    description: >
      Name under which the EKS cluster PUBLISHES its Kubernetes provider
      connection, and by which every in-chart Kubernetes resource CONSUMES
      it — the one-run contract that lets this chart create a cluster and
      deploy onto it in the same apply. One value drives both sides, so the
      producer and its consumers can never drift. Must be unique among the
      organization's connections; a per-environment name like
      "eks-prod" keeps multiple deployments of this chart apart.
    value: eks-full-stack

  - name: aws_account_id
    description: >
      The 12-digit AWS account ID this cluster deploys into. Nothing in the
      deployed graph produces it, so it is an honest literal — MUST be
      changed. It anchors the IAM policy ARNs the chart composes (the
      Karpenter controller's scoped permissions, the interruption-queue
      policy) so they grant access in your account and nowhere else.
    value: "123456789012"

  - name: region
    description: >
      AWS region everything in this chart lives in — network, cluster,
      IAM regional endpoints, S3 backups. Availability-zone and subnet
      parameters below must belong to this region.
    value: us-west-2

  # ── Network (the chart provisions its own VPC) ───────────────────────────
  - name: vpc_cidr
    description: >
      IPv4 CIDR of the VPC the chart creates (/16 recommended). Must not
      overlap any network you will peer or VPN to — overlap breaks routing
      in ways that only surface later. Immutable: changing it replaces the
      VPC and everything in it.
    value: 10.0.0.0/16

  - name: availability_zones
    type: list
    description: >
      Availability zones the network spans (must belong to region). Entry N
      pairs with entry N of public_subnet_cidrs and private_subnet_cidrs —
      the three lists are index-matched and nothing else enforces the
      pairing. Two zones is the production floor: the EKS control plane
      requires subnets in at least two zones.
    value:
      - us-west-2a
      - us-west-2b

  - name: public_subnet_cidrs
    type: list
    description: >
      IPv4 CIDRs of the PUBLIC subnets (one per availability zone, index-
      matched with availability_zones; each inside vpc_cidr). Public subnets
      host only the internet-facing edge: the NAT gateway and any cloud
      load balancers the cluster provisions. /20 per zone is generous for
      that role.
    value:
      - 10.0.0.0/20
      - 10.0.16.0/20

  - name: private_subnet_cidrs
    type: list
    description: >
      IPv4 CIDRs of the PRIVATE subnets (one per availability zone, index-
      matched with availability_zones; each inside vpc_cidr). ALL cluster
      nodes — the system node group and every Karpenter-provisioned node —
      live here, and with the VPC CNI every POD consumes a real subnet IP,
      so size these big: /18 per zone gives ~16k addresses each.
    value:
      - 10.0.128.0/18
      - 10.0.192.0/18

  # ── EKS control plane ────────────────────────────────────────────────────
  - name: kubernetes_version
    description: >
      Kubernetes minor version of the control plane (e.g. "1.33"). Empty
      lets AWS pick its current default — the never-goes-stale choice for a
      new cluster. EKS upgrades one minor at a time and never downgrades;
      node groups follow the control plane, so upgrade this first.
    value: ""

  - name: public_access_cidrs
    type: list
    description: >
      IPv4 CIDRs allowed to reach the cluster's PUBLIC API endpoint. Empty
      means AWS's default of open-to-the-internet (authentication still
      required — IAM and RBAC hold the door). Restricting this to your
      office/VPN egress ranges is the single cheapest hardening step for a
      cluster with a public endpoint; the chart keeps private (in-VPC)
      endpoint access on either way, so nodes never depend on this.
    value: []

  - name: cluster_log_types
    type: list
    description: >
      Control-plane log types streamed to CloudWatch Logs. "audit" (who did
      what) and "authenticator" (who got in) are the two with real security
      value; adding all five ("api", "controllerManager", "scheduler") on a
      busy cluster carries real CloudWatch ingestion cost. Empty disables
      control-plane logging entirely.
    value:
      - audit
      - authenticator

  # ── System node group (the fixed floor Karpenter builds on) ─────────────
  - name: system_node_instance_types
    type: list
    description: >
      EC2 instance types for the SYSTEM node group — the small, fixed,
      On-Demand pool that hosts cluster-critical pods (CoreDNS, the
      Karpenter controller, the addon controllers) so the autoscaler never
      depends on capacity it manages itself. Several types improve
      launchability; the first is preferred.
    value:
      - m6i.large

  - name: system_nodes_min
    description: >
      Floor of the system node group. Two is the production minimum: the
      Karpenter controller runs two replicas that must not share a node's
      fate, and CoreDNS wants zone spread.
    value: "2"

  - name: system_nodes_max
    description: >
      Ceiling of the system node group. The system pool holds only
      cluster-critical pods, so it rarely needs to grow — application
      capacity is Karpenter's job, not this group's.
    value: "4"

  - name: system_nodes_desired
    description: >
      Node count the group starts at (AWS holds it until something changes
      it). Keep it at the minimum — the system pool is deliberately boring.
    value: "2"

  - name: system_node_disk_size_gb
    description: >
      Root EBS volume per system node, in GiB. 100 is a comfortable
      production default for image-heavy clusters; the AWS default (20)
      fills up fast once a few DaemonSets pull images.
    value: "100"

  # ── Karpenter (the self-provisioning fleet) ─────────────────────────────
  - name: karpenter_ami_alias
    description: >
      AMI selection for Karpenter-provisioned nodes, as an EKS-optimized
      alias: family@version (e.g. "al2023@v20240807" for a hard pin,
      "al2023@latest" to track the newest release). "latest" keeps nodes on
      patched images automatically — Karpenter drifts nodes onto new AMIs
      gradually; pin a version when byte-identical fleets matter more than
      automatic patching, and bump it deliberately.
    value: al2023@latest

  - name: karpenter_capacity_types
    type: list
    description: >
      EC2 purchase models the default NodePool may launch ("on-demand",
      "spot"). Including spot is the cost story — steep discounts with
      interruption handling already wired (the interruption queue below
      drains nodes ahead of a reclaim). Remove spot for workloads that
      cannot tolerate any interruption.
    value:
      - on-demand
      - spot

  - name: karpenter_cpu_limit
    description: >
      Ceiling on the TOTAL vCPUs the default NodePool may provision —
      the blast-radius guard that caps what a runaway workload (or a
      mistake) can spend. Provisioning stops at the limit; raise it as the
      platform grows.
    value: "100"

  - name: karpenter_consolidate_after
    description: >
      How long a node must be empty or underutilized before Karpenter
      consolidates it away (s/m/h units, or "Never" to disable
      consolidation). A short window saves the most money; a longer one
      dampens node churn for spiky workloads.
    value: 1m

  - name: karpenter_interruption_handling_enabled
    type: bool
    description: >
      Provision the interruption plumbing (an SQS queue and the EventBridge
      rules that feed it Spot interruptions, rebalance recommendations,
      scheduled maintenance, and instance state changes) so Karpenter
      drains nodes BEFORE EC2 takes them away. Costs pennies; without it,
      provisioning still works but Spot reclaims become abrupt pod kills —
      keep it on whenever spot is in karpenter_capacity_types.
    value: true

  # ── Exposure (pick one entry-point model) ────────────────────────────────
  - name: use_gateway_api
    type: bool
    description: >
      Exposure arm switch. False (default) installs ingress-nginx as the
      cluster's default IngressClass — the battle-tested entry point every
      tutorial assumes. True replaces it entirely with the Gateway API
      standard resources (CRDs, a GatewayClass, and a shared Gateway) for
      platforms that have adopted the modern routing model — bring your own
      implementation (see gateway_controller_name). One entry point, one
      mental model, never both.
    value: false

  - name: ingress_replicas
    description: >
      Replicas of the ingress-nginx controller (only used when
      use_gateway_api is false). Two is the production floor: the
      controller is the single entry point for all HTTP traffic, and with
      one replica every node drain is a traffic outage.
    value: "2"

  - name: gateway_controller_name
    description: >
      Controller identity the GatewayClass binds to (only used when
      use_gateway_api is true) — must match the controllerName the Gateway
      API implementation running in this cluster announces (e.g.
      "gateway.nginx.org/nginx-gateway-controller" for NGINX Gateway
      Fabric, "istio.io/gateway-controller" for Istio). This chart
      deliberately does not install an implementation: which one is a
      platform choice with its own lifecycle. IMMUTABLE once deployed —
      changing it requires recreating the GatewayClass.
    value: gateway.nginx.org/nginx-gateway-controller

  # ── DNS (Route 53) ───────────────────────────────────────────────────────
  - name: dns_zone_names
    type: list
    description: >
      Planton resource names of the AwsRoute53Zone resources this platform
      manages. The zone IDs flow in by reference at deploy time, so the
      format can never be wrong. The zones must exist in the target
      environment when this chart deploys — they usually predate the
      cluster (the offline validator reports them as unresolved by
      design). Replace the placeholder with your zone resource names.
    value:
      - my-dns-zone

  - name: dns_domains
    type: list
    description: >
      Domain suffixes external-dns is allowed to manage (e.g. "example.com"
      covers every name under it). The first guardrail against the
      controller touching unrelated zones the credentials can see — keep it
      as narrow as the platform's real domains.
    value:
      - example.com

  - name: dns_txt_owner_id
    description: >
      Ownership ID this cluster's external-dns writes into its TXT registry
      records. Every cluster sharing a DNS zone MUST use a distinct value —
      it is what stops one cluster's controller from fighting over (or,
      under a sync policy, deleting) another cluster's records.
    value: eks-full-stack

  # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
  - name: acme_email
    description: >
      Email registered with the Let's Encrypt ACME account. Expiry notices
      and account notifications go here — use a team alias, not a personal
      address. MUST be changed; Let's Encrypt rejects example.com addresses.
    value: platform-team@example.com

  - name: acme_http01_enabled
    type: bool
    description: >
      Adds an opt-in HTTP-01 solver beside the default DNS-01 solver:
      Certificates labeled "acme-solver: http01" solve over HTTP through
      this chart's entry point. For domains whose DNS lives outside the
      Route 53 zones this chart manages. DNS-01 remains the default — it
      issues wildcards and works for services that are not publicly
      reachable.
    value: false

  # ── Secrets (External Secrets Operator + AWS Secrets Manager) ────────────
  - name: external_secrets_enabled
    type: bool
    description: >
      Install the External Secrets Operator with a cluster-wide store
      reading AWS Secrets Manager — keyless, through the operator's own
      IRSA role. Workloads then declare ExternalSecrets naming keys in
      Secrets Manager and receive native Kubernetes Secrets; no secret
      value ever lands in a manifest.
    value: true

  # ── Backups (Velero → S3) ────────────────────────────────────────────────
  - name: velero_enabled
    type: bool
    description: >
      The self-backing-up half of the story: an S3 bucket, an IRSA role,
      the CSI snapshot machinery (EKS snapshot-controller add-on plus the
      VolumeSnapshotClass Velero requires), and Velero on a schedule.
      Restore is one command away when a namespace is deleted or a cluster
      migrates. Off only for clusters whose disaster-recovery story lives
      elsewhere.
    value: true

  - name: velero_schedule
    description: >
      Cron schedule (UTC) of the recurring cluster backup (only used when
      velero_enabled is true). The default backs up daily at 01:00 UTC —
      align it with your low-traffic window.
    value: "0 1 * * *"

  - name: velero_backup_ttl
    description: >
      How long scheduled backups are retained before Velero's garbage
      collector removes them (Go duration; 720h = 30 days). Storage is the
      only cost of a longer window — S3 is cheap, re-creating lost state is
      not.
    value: 720h

  # ── The operator layer (what makes this the FULL-STACK platform) ─────────
  # CloudNativePG installs unconditionally — Postgres is the standard.
  # Each further operator is a toggle: install it when the first application
  # needs its engine, not before. All operators watch EVERY namespace, so
  # applications declare their data services in their own namespaces (or
  # through the app-data-services chart) against this cluster's connection.
  - name: mysql_operator_enabled
    type: bool
    description: >
      Install the Percona XtraDB Cluster operator (cluster-wide watch) so
      applications can declare KubernetesMysql databases — Galera-replicated
      MySQL with proxies and scheduled backups — in their own namespaces.
    value: false

  - name: mongodb_operator_enabled
    type: bool
    description: >
      Install the Percona Server for MongoDB operator (cluster-wide watch)
      so applications can declare KubernetesMongodb replica sets — with
      failover elections and PBM backups — in their own namespaces.
    value: false

  - name: kafka_operator_enabled
    type: bool
    description: >
      Install the Strimzi operator (any-namespace watch) so applications can
      declare KubernetesKafka clusters, topics, and users in their own
      namespaces. Note Strimzi's own contract: a namespace must exist before
      a Kafka cluster is declared in it.
    value: false

  - name: rabbitmq_operator_enabled
    type: bool
    description: >
      Install the RabbitMQ cluster operator (watches all namespaces, its
      upstream default) so applications can declare KubernetesRabbitMq
      brokers in their own namespaces. Requires cert-manager — already part
      of this chart's baseline.
    value: false

  - name: keda_enabled
    type: bool
    description: >
      Install KEDA for event-driven autoscaling — workloads scale on queue
      depth, Kafka consumer lag, cloud metrics, or cron, including to and
      from zero. A cluster singleton (Kubernetes allows one external-metrics
      provider). Install it when the first workload actually scales on
      events.
    value: false
