# The EKS control plane and the IAM role it assumes. The cluster resource is
# ALSO where the one-run contract starts: the planton.dev/connection-name
# annotation makes the platform publish a Kubernetes provider connection from
# this cluster's outputs under a chart-controlled name — every Kubernetes
# resource in this chart consumes that same name via planton.dev/connection
# (one values param drives both sides, so they can never drift) and carries a
# runs_on relationship edge back to this resource so ordering is structural.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-cluster-role"
spec:
  region: "{{ values.region }}"
  description: EKS control-plane role for the {{ values.env }}-eks cluster
  # The service trust EKS requires; the control plane manages ENIs, security
  # groups, and logs through this role.
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: eks.amazonaws.com
        Action: sts:AssumeRole
  managedPolicyArns:
    # The one managed policy the EKS control plane needs (a literal ARN is
    # how AWS-managed policies attach).
    - value: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
---
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksCluster
metadata:
  # This name is load-bearing well beyond the cluster itself: it is the
  # Karpenter discovery-tag value on the private subnets, the value of the
  # aws:eks:cluster-name tag EKS stamps on the cluster security group (which
  # the fleet's security-group selector matches), the interruption queue's
  # name, and the cluster identity in every scoped IAM condition the chart
  # composes. Rendered from env so one chart deploys many environments.
  name: "{{ values.env }}-eks"
  annotations:
    # PUBLISH: the platform creates a Kubernetes provider connection named by
    # this value from the cluster's outputs (endpoint, CA, exec credentials).
    planton.dev/connection-name: "{{ values.cluster_connection_name }}"
spec:
  region: "{{ values.region }}"
  # The control plane's ENIs span the PRIVATE subnets: in-VPC clients (nodes,
  # CI runners) reach the API server privately, and no control-plane ENI
  # needs a public subnet even with the public endpoint on.
  subnetIds:
{% for az in values.availability_zones %}
    - valueFrom:
        name: "{{ values.env }}-eks-private-{{ az }}"
{% endfor %}
  clusterRoleArn:
    valueFrom:
      name: "{{ values.env }}-eks-cluster-role"
{% if values.kubernetes_version != "" %}
  version: "{{ values.kubernetes_version }}"
{% endif %}
  # Private endpoint access ON unconditionally (the AWS default of off is
  # almost never right — without it, in-VPC traffic to the API server hairpins
  # over the public endpoint). The public endpoint stays available for
  # operators, scoped by public_access_cidrs when set.
  endpointPrivateAccess: true
  endpointPublicAccess: true
{% if values.public_access_cidrs %}
  publicAccessCidrs:
{% for cidr in values.public_access_cidrs %}
    - "{{ cidr }}"
{% endfor %}
{% endif %}
{% if values.cluster_log_types %}
  enabledClusterLogTypes:
{% for log_type in values.cluster_log_types %}
    - "{{ log_type }}"
{% endfor %}
{% endif %}
  # STANDARD upgrade support: upgrade on Kubernetes' cadence with no
  # surcharge. The AWS default (EXTENDED) silently bills a significant hourly
  # premium once the version leaves standard support — a baseline that keeps
  # itself current should not carry that risk.
  upgradeSupportType: STANDARD
