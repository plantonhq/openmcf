# The SYSTEM node group and the shared node IAM role. The system group is
# the small, fixed, On-Demand floor that hosts cluster-critical pods —
# CoreDNS, the Karpenter controller, the addon controllers — so the
# autoscaler never depends on capacity it manages itself (the bootstrap
# problem: Karpenter cannot provision the node it needs to run on).
# Application capacity is Karpenter's job (autoscaling/), not this group's.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  # ONE node role serves both the system group and the Karpenter fleet: same
  # cluster, same permissions, one auditable identity. Karpenter's
  # EC2NodeClass references it BY NAME (autoscaling/node-fleet.yaml) — the
  # controller manages instance profiles for it.
  name: "{{ values.env }}-eks-node-role"
spec:
  region: "{{ values.region }}"
  description: Worker-node role for the {{ values.env }}-eks cluster (system group + Karpenter fleet)
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ec2.amazonaws.com
        Action: sts:AssumeRole
  managedPolicyArns:
    # The EKS worker set, plus SSM so nodes are reachable through Session
    # Manager instead of SSH key pairs (this chart deliberately opens no
    # remote_access). PullOnly is the modern, narrower replacement for the
    # ReadOnly registry policy — upstream Karpenter's own node role uses it.
    - value: arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
    - value: arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
    - value: arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
    - value: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
---
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksNodeGroup
metadata:
  name: "{{ values.env }}-eks-system"
spec:
  region: "{{ values.region }}"
  clusterName:
    valueFrom:
      # Resolves the cluster's name output; also the ordering edge that
      # deploys the control plane before its first nodes.
      name: "{{ values.env }}-eks"
  nodeRoleArn:
    valueFrom:
      name: "{{ values.env }}-eks-node-role"
  # System nodes live in the private subnets with everything else.
  subnetIds:
{% for az in values.availability_zones %}
    - valueFrom:
        name: "{{ values.env }}-eks-private-{{ az }}"
{% endfor %}
  instanceTypes:
{% for instance_type in values.system_node_instance_types %}
    - "{{ instance_type }}"
{% endfor %}
  # On-Demand deliberately (the enum default, spelled out): the system pool
  # is the one place a Spot reclaim would hurt the cluster itself.
  capacityType: on_demand
  diskSizeGb: {{ values.system_node_disk_size_gb }}
  scaling:
    minSize: {{ values.system_nodes_min }}
    maxSize: {{ values.system_nodes_max }}
    desiredSize: {{ values.system_nodes_desired }}
  # EKS managed node auto-repair: unhealthy system nodes are replaced or
  # rebooted automatically — the self-healing floor under the pool that
  # hosts the self-healer.
  nodeRepairConfig:
    enabled: true
