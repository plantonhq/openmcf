# The cluster's IAM OIDC provider — the trust anchor for EVERY keyless
# identity in this chart. EKS mints ServiceAccount tokens from an issuer AWS
# generates at cluster create; registering that issuer here is what lets STS
# exchange those tokens for IAM role credentials (IRSA). Each controller
# that talks to AWS — Karpenter, cert-manager, external-dns, the EBS CSI
# driver, external-secrets, Velero — gets its own narrowly-scoped role whose
# trust names this provider and exactly one ServiceAccount. No static keys
# exist anywhere in this chart.
apiVersion: aws.planton.dev/v1
kind: AwsIamOidcProvider
metadata:
  name: "{{ values.env }}-eks-oidc"
spec:
  region: "{{ values.region }}"
  url:
    valueFrom:
      # The issuer URL exists only after the cluster is created — the
      # reference wires it and orders the provider after the cluster.
      name: "{{ values.env }}-eks"
  clientIdList:
    # The audience EKS ServiceAccount tokens carry.
    - sts.amazonaws.com
  # No thumbprints: EKS's issuer is backed by a publicly trusted CA, so AWS
  # derives them itself (and supplying them creates an un-clearable field).
