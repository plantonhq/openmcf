{% if values.velero_enabled | bool %}
# The self-backing-up arm: an S3 bucket, an IRSA role, the CSI snapshot
# machinery, and Velero on a schedule. Everything the backup story needs
# rides this one toggle — flipping it off removes the role and bucket with
# the workload, never stranding half an arm.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  # S3 bucket names are GLOBAL across all of AWS — the account id suffix is
  # what makes an env-derived name collision-safe. The name is render-known,
  # which is what lets Velero's bucket field and the role's policy below
  # both carry it exactly.
  name: "{{ values.env }}-eks-velero-{{ values.aws_account_id }}"
spec:
  region: "{{ values.region }}"
  # Versioning protects the backup history itself: an accidental (or
  # malicious) overwrite of a backup object is recoverable. Everything else
  # rides the kind's secure defaults — all four public-access guards on,
  # SSE-S3 encryption, ACLs disabled.
  versioningStatus: Enabled
---
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-velero-irsa"
spec:
  region: "{{ values.region }}"
  description: Velero backup role for the {{ values.env }}-eks cluster
  oidcTrust:
    providerArn:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
    providerUrl:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
        fieldPath: status.outputs.provider_url
    subjects:
      # Chart truth: the velero release name is fixed to "velero", so the
      # server ServiceAccount is "velero-server" in the "velero" namespace.
      - system:serviceaccount:velero:velero-server
  inlinePolicies:
    # The AWS plugin's documented permission set: EBS snapshot lifecycle for
    # volume snapshots, plus this chart's bucket — and ONLY this bucket (the
    # deterministic name makes the exact ARN render-known).
    velero-backups:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - ec2:DescribeVolumes
            - ec2:DescribeSnapshots
            - ec2:CreateTags
            - ec2:CreateVolume
            - ec2:CreateSnapshot
            - ec2:DeleteSnapshot
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObject
            - s3:AbortMultipartUpload
            - s3:ListMultipartUploadParts
          Resource: "arn:aws:s3:::{{ values.env }}-eks-velero-{{ values.aws_account_id }}/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: "arn:aws:s3:::{{ values.env }}-eks-velero-{{ values.aws_account_id }}"
---
# The CSI snapshot control plane — an EKS managed add-on. Velero's CSI path
# snapshots PVCs through the Kubernetes snapshot API; without this
# controller the VolumeSnapshot objects it creates would sit Pending
# forever.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksAddon
metadata:
  name: "{{ values.env }}-eks-snapshot-controller"
spec:
  region: "{{ values.region }}"
  clusterName:
    valueFrom:
      name: "{{ values.env }}-eks"
  addonName: snapshot-controller
---
# The VolumeSnapshotClass Velero requires: CSI snapshots silently DON'T
# HAPPEN without a class for the volume's driver carrying the
# velero.io/csi-volumesnapshot-class label — the backup still reports
# Completed while the volumes were never snapshotted. Shipping the class
# with the arm closes that trap at the source.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesManifest
metadata:
  name: "{{ values.env }}-velero-snapshot-class"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
    # The VolumeSnapshotClass CRD is installed by the snapshot-controller
    # add-on — nothing in this spec consumes an add-on output, so the edge
    # is declared explicitly.
    - kind: AwsEksAddon
      name: "{{ values.env }}-eks-snapshot-controller"
      type: depends_on
spec:
  # The document is cluster-scoped; the anchor namespace is required by the
  # kind's contract but unused here — kube-system always exists.
  namespace:
    value: kube-system
  createNamespace: false
  manifestYaml: |
    apiVersion: snapshot.storage.k8s.io/v1
    kind: VolumeSnapshotClass
    metadata:
      name: velero-ebs-csi
      labels:
        # THE label Velero's CSI path selects its class by.
        velero.io/csi-volumesnapshot-class: "true"
    driver: ebs.csi.aws.com
    # Delete the EBS snapshot when the VolumeSnapshot object is removed —
    # Velero's own backup expiry then reclaims storage instead of leaking
    # orphaned snapshots.
    deletionPolicy: Delete
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesVelero
metadata:
  name: "{{ values.env }}-velero"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # "velero" is the upstream convention; the fixed release name pins the
  # ServiceAccount the role above trusts.
  namespace:
    value: velero
  createNamespace: true
  backupStorage:
    s3:
      # Render-known both sides: the same expression names the bucket
      # resource above.
      bucket: "{{ values.env }}-eks-velero-{{ values.aws_account_id }}"
      region: "{{ values.region }}"
      # Keyless: the role-arn annotation on the server ServiceAccount — no
      # Secret exists at all. The reference is also the ordering edge.
      irsaRoleArn:
        valueFrom:
          name: "{{ values.env }}-eks-velero-irsa"
    # One bucket, one prefix per cluster — the multi-cluster pattern: a
    # standby cluster restores from this same bucket under its own prefix.
    prefix: "{{ values.env }}-eks"
  volumeSnapshots:
    enabled: true
    # CSI snapshots: PVCs snapshot through the CSI snapshot API — the modern
    # path on EKS with the EBS CSI driver (cluster/addons.yaml) and the
    # snapshot machinery above.
    enableCsi: true
  schedules:
    # The recurring full-cluster backup. Restore is `velero restore create
    # --from-backup <name>` — the README's after-deployment section walks
    # the full loop.
    - name: daily
      schedule: "{{ values.velero_schedule }}"
      ttl: "{{ values.velero_backup_ttl }}"
{% endif %}
