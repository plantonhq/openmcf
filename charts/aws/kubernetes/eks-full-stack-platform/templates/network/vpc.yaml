# The VPC and its internet door. The chart owns its network deliberately:
# "a production EKS cluster in one apply" only holds if nothing has to exist
# first. The VPC is a thin construct by design — subnets and gateways are
# separate first-class resources (next file) referencing it, which is what
# lets the same building blocks compose other topologies.
apiVersion: aws.planton.dev/v1
kind: AwsVpc
metadata:
  name: "{{ values.env }}-eks-vpc"
spec:
  region: "{{ values.region }}"
  cidrBlock: "{{ values.vpc_cidr }}"
  # Both DNS switches on: EKS REQUIRES them — nodes join the cluster by
  # resolving the API endpoint through the VPC resolver, and private-endpoint
  # access rides private DNS hostnames. (enable_dns_support already defaults
  # on; hostnames does not — spelled out together so the requirement reads in
  # one place.)
  enableDnsSupport: true
  enableDnsHostnames: true
---
# One internet gateway — the public subnets' default route target. Egress for
# the PRIVATE subnets rides the NAT gateway (next file), never this directly.
apiVersion: aws.planton.dev/v1
kind: AwsInternetGateway
metadata:
  name: "{{ values.env }}-eks-igw"
spec:
  region: "{{ values.region }}"
  vpcId:
    valueFrom:
      # The in-chart VPC above — resolves its vpc_id output and orders the
      # VPC before the gateway in the deploy graph.
      name: "{{ values.env }}-eks-vpc"
