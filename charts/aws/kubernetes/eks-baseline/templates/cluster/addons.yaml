# The EBS CSI driver — installed as an EKS MANAGED add-on with its own IRSA
# role. Persistent volumes are table stakes for a production cluster, and on
# EKS they do not work out of the box: the in-tree EBS provisioner is gone,
# so a cluster without this add-on fails its first PersistentVolumeClaim.
# (The core networking add-ons — vpc-cni, coredns, kube-proxy — ride the
# cluster's bootstrap defaults; EKS installs and updates them itself.)
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-ebs-csi-irsa"
spec:
  region: "{{ values.region }}"
  description: IRSA role for the EBS CSI driver on the {{ values.env }}-eks cluster
  # Typed federated trust: the Federated principal is the in-chart OIDC
  # provider (identity/oidc-provider.yaml), which exists only after the
  # cluster does — the reference is the only honest wiring, and it is also
  # the ordering edge.
  oidcTrust:
    providerArn:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
    providerUrl:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
        fieldPath: status.outputs.provider_url
    subjects:
      # The service account the EBS CSI add-on documents for its controller.
      - system:serviceaccount:kube-system:ebs-csi-controller-sa
  managedPolicyArns:
    # The AWS-managed policy purpose-built for the driver (volume create/
    # attach/snapshot, scoped by the driver's own tag conditions).
    - value: arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
---
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksAddon
metadata:
  name: "{{ values.env }}-eks-ebs-csi"
spec:
  region: "{{ values.region }}"
  clusterName:
    valueFrom:
      name: "{{ values.env }}-eks"
  addonName: aws-ebs-csi-driver
  # No version pin: AWS installs the default version for the cluster's
  # Kubernetes version — the never-goes-stale choice; pin here for
  # byte-identical clusters.
  serviceAccountRoleArn:
    valueFrom:
      name: "{{ values.env }}-eks-ebs-csi-irsa"
