# cert-manager and its IRSA role. Everything TLS in this baseline hangs off
# this controller: the Let's Encrypt ClusterIssuers (next file) are
# cert-manager custom resources, and application Certificates in any
# namespace are reconciled by it. Its DNS-01 solvers write Route 53 records
# through the role below — keylessly.
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-cert-manager-irsa"
spec:
  region: "{{ values.region }}"
  description: cert-manager DNS-01 role for the {{ values.env }}-eks cluster
  oidcTrust:
    providerArn:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
    providerUrl:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
        fieldPath: status.outputs.provider_url
    subjects:
      # Chart truth: the cert-manager release name is fixed to
      # "cert-manager" (one per cluster), so its controller ServiceAccount
      # is "cert-manager" in the "cert-manager" namespace.
      - system:serviceaccount:cert-manager:cert-manager
  inlinePolicies:
    # cert-manager's documented Route 53 DNS-01 permission set. The
    # hostedzone wildcard is deliberate at deploy time — zone IDs are not
    # render-known — and the README's day-2 section shows how to pin the
    # Resource entries to your exact zone ARNs once deployed.
    route53-dns01:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action: route53:GetChange
          Resource: "arn:aws:route53:::change/*"
        - Effect: Allow
          Action:
            - route53:ChangeResourceRecordSets
            - route53:ListResourceRecordSets
          Resource: "arn:aws:route53:::hostedzone/*"
        - Effect: Allow
          Action: route53:ListHostedZonesByName
          Resource: "*"
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCertManager
metadata:
  name: "{{ values.env }}-cert-manager"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # "cert-manager" is the upstream-conventional home and is deliberately NOT
  # parameterized: the namespace is effectively permanent (the kept CRDs pin
  # release ownership to it — reinstalling elsewhere fails Helm's ownership
  # check), and every runbook on the internet assumes this name.
  namespace:
    value: cert-manager
  createNamespace: true
  # Keyless DNS-01: the controller's ServiceAccount is bound to the role
  # above, and the issuers' solvers deliberately carry NO static credentials
  # — they inherit this ambient identity. One binding here secures every
  # certificate the platform ever issues.
  workloadIdentity:
    eks:
      roleArn:
        valueFrom:
          name: "{{ values.env }}-eks-cert-manager-irsa"
