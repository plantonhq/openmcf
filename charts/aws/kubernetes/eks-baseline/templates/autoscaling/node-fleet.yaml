# The fleet's machine template and provisioning policy — what Karpenter
# launches (EC2NodeClass) and when (NodePool). These are Kubernetes custom
# resources reconciled by the controller in the previous file.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenterEc2NodeClass
metadata:
  name: "{{ values.env }}-default"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
    # The NodeClass's selectors resolve against live AWS state, and its CRD
    # is installed by the Karpenter release — deploy after the controller.
    # Nothing in this spec consumes a Karpenter output, so the edge is
    # declared explicitly.
    - kind: KubernetesKarpenter
      name: "{{ values.env }}-karpenter"
      type: depends_on
spec:
  amiSelectorTerms:
    # One alias term (must be the only term): the EKS-optimized family and
    # its version policy, from values — see the parameter's pin-vs-latest
    # teaching.
    - alias: "{{ values.karpenter_ami_alias }}"
  subnetSelectorTerms:
    # Discovery by tag: the private subnets carry karpenter.sh/discovery =
    # the cluster name as a label (network/subnets.yaml), which the AwsSubnet
    # modules stamp as an AWS tag — render-known on both sides, the upstream
    # convention.
    - tags:
        karpenter.sh/discovery: "{{ values.env }}-eks"
  securityGroupSelectorTerms:
    # The CLUSTER security group — EKS creates it with the cluster and stamps
    # it with aws:eks:cluster-name = <cluster name> (re-adding the tag if
    # removed), so this selector is stable and render-known even though the
    # group itself only exists after the cluster does. Fleet nodes on the
    # cluster SG get unrestricted node↔control-plane traffic, exactly like
    # the managed node group.
    - tags:
        aws:eks:cluster-name: "{{ values.env }}-eks"
  # The shared node role BY NAME (cluster/node-group.yaml names it from env,
  # so both sides are render-known). Karpenter creates and manages the
  # instance profiles for it — that is what the controller policy's
  # instance-profile statements authorize.
  role: "{{ values.env }}-eks-node-role"
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenterNodePool
metadata:
  name: "{{ values.env }}-default"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  template:
    nodeClassRef:
      name:
        valueFrom:
          # The machine template above — resolves its live name and orders
          # the NodeClass before the pool.
          name: "{{ values.env }}-default"
    requirements:
      # The general-purpose envelope, mirroring upstream's default-pool
      # guidance: current-generation compute/memory/general families. Pods
      # with narrower needs (GPU, arm64) get their own pool as a day-2
      # addition — see the README.
      - key: karpenter.sh/capacity-type
        operator: In
        values:
{% for capacity_type in values.karpenter_capacity_types %}
          - "{{ capacity_type }}"
{% endfor %}
      - key: kubernetes.io/arch
        operator: In
        values:
          - amd64
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values:
          - c
          - m
          - r
      - key: karpenter.k8s.aws/instance-generation
        operator: Gt
        values:
          - "2"
  disruption:
    # The self-consolidating half of the demo: underutilized or empty nodes
    # are replaced or removed whenever cheaper capacity fits the pods.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "{{ values.karpenter_consolidate_after }}"
  limits:
    # The pool-wide spend guard (see the parameter's description).
    cpu: "{{ values.karpenter_cpu_limit }}"
