# metrics-server — the resource-metrics API behind `kubectl top` and every
# CPU/memory HorizontalPodAutoscaler. A cluster singleton (it registers the
# one v1beta1.metrics.k8s.io APIService), and NOT built into EKS — unlike
# GKE, a fresh EKS cluster cannot serve `kubectl top` until this installs.
# Unconditional on this baseline: pod-level autoscaling without it is
# guesswork, and Karpenter only solves the NODE half.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMetricsServer
metadata:
  name: "{{ values.env }}-metrics-server"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # metrics-server JOINS kube-system (the upstream-conventional home for
  # cluster-level system components) — it never creates it: kube-system
  # always exists, and claiming ownership of it would be false.
  namespace:
    value: kube-system
  createNamespace: false
  # No kubeletInsecureTls: EKS kubelet certificates verify cleanly against
  # the cluster CA — the insecure escape hatch is for kind/k3s-class
  # clusters and would only weaken this one.
