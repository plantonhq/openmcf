# Karpenter — the self-provisioning half of the story: pods go pending,
# real EC2 nodes appear; nodes go idle, they are consolidated away. Three
# pieces live in this file: the controller's IRSA role (with upstream's own
# scoped permission set, composed for THIS cluster), the interruption
# plumbing (SQS + EventBridge, toggled), and the controller itself. The
# machine templates it provisions from are the next file.
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-karpenter-irsa"
spec:
  region: "{{ values.region }}"
  description: Karpenter controller role for the {{ values.env }}-eks cluster
  oidcTrust:
    providerArn:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
    providerUrl:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
        fieldPath: status.outputs.provider_url
    subjects:
      # The chart-fixed ServiceAccount the karpenter chart creates.
      - system:serviceaccount:kube-system:karpenter
  inlinePolicies:
    # Upstream's own controller permission set (the getting-started
    # CloudFormation at the pinned release), composed render-time for this
    # cluster: every mutating action is fenced by the cluster-ownership tags
    # Karpenter stamps on what it creates, so the controller can only touch
    # ITS OWN fleet. Partition fixed to "aws" — GovCloud/China deployments
    # adjust the ARNs here and in the queue policy below.
    karpenter-controller:
      Version: "2012-10-17"
      Statement:
        # Launching capacity: read-only over the launch inputs (images,
        # snapshots, security groups, subnets)...
        - Sid: AllowScopedEC2InstanceAccessActions
          Effect: Allow
          Resource:
            - "arn:aws:ec2:{{ values.region }}::image/*"
            - "arn:aws:ec2:{{ values.region }}::snapshot/*"
            - "arn:aws:ec2:{{ values.region }}:*:security-group/*"
            - "arn:aws:ec2:{{ values.region }}:*:subnet/*"
            - "arn:aws:ec2:{{ values.region }}:*:capacity-reservation/*"
            - "arn:aws:ec2:{{ values.region }}:*:placement-group/*"
          Action:
            - ec2:RunInstances
            - ec2:CreateFleet
        # ...launch templates only when they carry this cluster's ownership
        # tag...
        - Sid: AllowScopedEC2LaunchTemplateAccessActions
          Effect: Allow
          Resource: "arn:aws:ec2:{{ values.region }}:*:launch-template/*"
          Action:
            - ec2:RunInstances
            - ec2:CreateFleet
          Condition:
            StringEquals:
              aws:ResourceTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
            StringLike:
              aws:ResourceTag/karpenter.sh/nodepool: "*"
        # ...and creation of instances/volumes/ENIs only when the request
        # tags them as owned by this cluster.
        - Sid: AllowScopedEC2InstanceActionsWithTags
          Effect: Allow
          Resource:
            - "arn:aws:ec2:{{ values.region }}:*:fleet/*"
            - "arn:aws:ec2:{{ values.region }}:*:instance/*"
            - "arn:aws:ec2:{{ values.region }}:*:volume/*"
            - "arn:aws:ec2:{{ values.region }}:*:network-interface/*"
            - "arn:aws:ec2:{{ values.region }}:*:launch-template/*"
            - "arn:aws:ec2:{{ values.region }}:*:spot-instances-request/*"
          Action:
            - ec2:RunInstances
            - ec2:CreateFleet
            - ec2:CreateLaunchTemplate
          Condition:
            StringEquals:
              aws:RequestTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
              aws:RequestTag/eks:eks-cluster-name: "{{ values.env }}-eks"
            StringLike:
              aws:RequestTag/karpenter.sh/nodepool: "*"
        - Sid: AllowScopedResourceCreationTagging
          Effect: Allow
          Resource:
            - "arn:aws:ec2:{{ values.region }}:*:fleet/*"
            - "arn:aws:ec2:{{ values.region }}:*:instance/*"
            - "arn:aws:ec2:{{ values.region }}:*:volume/*"
            - "arn:aws:ec2:{{ values.region }}:*:network-interface/*"
            - "arn:aws:ec2:{{ values.region }}:*:launch-template/*"
            - "arn:aws:ec2:{{ values.region }}:*:spot-instances-request/*"
          Action: ec2:CreateTags
          Condition:
            StringEquals:
              aws:RequestTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
              aws:RequestTag/eks:eks-cluster-name: "{{ values.env }}-eks"
              ec2:CreateAction:
                - RunInstances
                - CreateFleet
                - CreateLaunchTemplate
            StringLike:
              aws:RequestTag/karpenter.sh/nodepool: "*"
        - Sid: AllowScopedResourceTagging
          Effect: Allow
          Resource: "arn:aws:ec2:{{ values.region }}:*:instance/*"
          Action: ec2:CreateTags
          Condition:
            StringEquals:
              aws:ResourceTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
            StringLike:
              aws:ResourceTag/karpenter.sh/nodepool: "*"
            StringEqualsIfExists:
              aws:RequestTag/eks:eks-cluster-name: "{{ values.env }}-eks"
            ForAllValues:StringEquals:
              aws:TagKeys:
                - eks:eks-cluster-name
                - karpenter.sh/nodeclaim
                - Name
        # Termination is fenced the same way launching is: only nodes this
        # cluster owns.
        - Sid: AllowScopedDeletion
          Effect: Allow
          Resource:
            - "arn:aws:ec2:{{ values.region }}:*:instance/*"
            - "arn:aws:ec2:{{ values.region }}:*:launch-template/*"
          Action:
            - ec2:TerminateInstances
            - ec2:DeleteLaunchTemplate
          Condition:
            StringEquals:
              aws:ResourceTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
            StringLike:
              aws:ResourceTag/karpenter.sh/nodepool: "*"
        # The controller hands the NODE role (cluster/node-group.yaml) to the
        # instances it launches — passable to EC2 only.
        - Sid: AllowPassingInstanceRole
          Effect: Allow
          Resource: "arn:aws:iam::{{ values.aws_account_id }}:role/{{ values.env }}-eks-node-role"
          Action: iam:PassRole
          Condition:
            StringEquals:
              iam:PassedToService:
                - ec2.amazonaws.com
        # Karpenter manages instance profiles for that role (the EC2NodeClass
        # `role` arm) — creation/tagging/use all fenced by ownership tags.
        - Sid: AllowScopedInstanceProfileCreationActions
          Effect: Allow
          Resource: "arn:aws:iam::{{ values.aws_account_id }}:instance-profile/*"
          Action:
            - iam:CreateInstanceProfile
          Condition:
            StringEquals:
              aws:RequestTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
              aws:RequestTag/eks:eks-cluster-name: "{{ values.env }}-eks"
              aws:RequestTag/topology.kubernetes.io/region: "{{ values.region }}"
            StringLike:
              aws:RequestTag/karpenter.k8s.aws/ec2nodeclass: "*"
        - Sid: AllowScopedInstanceProfileTagActions
          Effect: Allow
          Resource: "arn:aws:iam::{{ values.aws_account_id }}:instance-profile/*"
          Action:
            - iam:TagInstanceProfile
          Condition:
            StringEquals:
              aws:ResourceTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
              aws:ResourceTag/topology.kubernetes.io/region: "{{ values.region }}"
              aws:RequestTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
              aws:RequestTag/eks:eks-cluster-name: "{{ values.env }}-eks"
              aws:RequestTag/topology.kubernetes.io/region: "{{ values.region }}"
            StringLike:
              aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass: "*"
              aws:RequestTag/karpenter.k8s.aws/ec2nodeclass: "*"
        - Sid: AllowScopedInstanceProfileActions
          Effect: Allow
          Resource: "arn:aws:iam::{{ values.aws_account_id }}:instance-profile/*"
          Action:
            - iam:AddRoleToInstanceProfile
            - iam:RemoveRoleFromInstanceProfile
            - iam:DeleteInstanceProfile
          Condition:
            StringEquals:
              aws:ResourceTag/kubernetes.io/cluster/{{ values.env }}-eks: owned
              aws:ResourceTag/topology.kubernetes.io/region: "{{ values.region }}"
            StringLike:
              aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass: "*"
        # Control-plane discovery: this one cluster only.
        - Sid: AllowAPIServerEndpointDiscovery
          Effect: Allow
          Resource: "arn:aws:eks:{{ values.region }}:{{ values.aws_account_id }}:cluster/{{ values.env }}-eks"
          Action: eks:DescribeCluster
{% if values.karpenter_interruption_handling_enabled | bool %}
        # Consuming interruption events from the queue below.
        - Sid: AllowInterruptionQueueActions
          Effect: Allow
          Resource: "arn:aws:sqs:{{ values.region }}:{{ values.aws_account_id }}:{{ values.env }}-eks"
          Action:
            - sqs:DeleteMessage
            - sqs:GetQueueUrl
            - sqs:ReceiveMessage
{% endif %}
        # Read-only discovery (instance types, offerings, prices, AMI SSM
        # parameters) — region-fenced where the API supports it. The
        # zonal-shift read grant is deliberately absent: this chart does not
        # enable zonal shift on the cluster.
        - Sid: AllowRegionalReadActions
          Effect: Allow
          Resource: "*"
          Action:
            - ec2:DescribeCapacityReservations
            - ec2:DescribeImages
            - ec2:DescribeInstances
            - ec2:DescribeInstanceStatus
            - ec2:DescribeInstanceTypeOfferings
            - ec2:DescribeInstanceTypes
            - ec2:DescribeLaunchTemplates
            - ec2:DescribePlacementGroups
            - ec2:DescribeSecurityGroups
            - ec2:DescribeSpotPriceHistory
            - ec2:DescribeSubnets
          Condition:
            StringEquals:
              aws:RequestedRegion: "{{ values.region }}"
        - Sid: AllowSSMReadActions
          Effect: Allow
          Resource: "arn:aws:ssm:{{ values.region }}::parameter/aws/service/*"
          Action: ssm:GetParameter
        - Sid: AllowPricingReadActions
          Effect: Allow
          Resource: "*"
          Action: pricing:GetProducts
        - Sid: AllowUnscopedInstanceProfileListAction
          Effect: Allow
          Resource: "*"
          Action: iam:ListInstanceProfiles
        - Sid: AllowInstanceProfileReadActions
          Effect: Allow
          Resource: "arn:aws:iam::{{ values.aws_account_id }}:instance-profile/*"
          Action: iam:GetInstanceProfile
{% if values.karpenter_interruption_handling_enabled | bool %}
---
# The interruption queue — named EXACTLY the cluster name (upstream's own
# convention, and what the controller's interruptionQueue setting expects).
# EC2 lifecycle warnings land here minutes before capacity disappears, and
# Karpenter drains the affected node instead of losing it mid-flight.
apiVersion: aws.planton.dev/v1
kind: AwsSqsQueue
metadata:
  name: "{{ values.env }}-eks"
spec:
  region: "{{ values.region }}"
  # Interruption events are only actionable for minutes — upstream retains
  # them for 300 seconds so a controller restart never replays stale drains.
  messageRetentionSeconds: 300
  sqsManagedSseEnabled: true
  # The queue's own resource policy: EventBridge (and SQS itself, for
  # dead-letter internals) may deliver; everything else must use TLS. The
  # queue ARN is deterministic (region + account + name — all render-known),
  # which is what lets a policy document that cannot carry references still
  # name it exactly.
  policy:
    Id: EC2InterruptionPolicy
    Statement:
      - Effect: Allow
        Principal:
          Service:
            - events.amazonaws.com
            - sqs.amazonaws.com
        Action: sqs:SendMessage
        Resource: "arn:aws:sqs:{{ values.region }}:{{ values.aws_account_id }}:{{ values.env }}-eks"
      - Sid: DenyHTTP
        Effect: Deny
        Action: sqs:*
        Resource: "arn:aws:sqs:{{ values.region }}:{{ values.aws_account_id }}:{{ values.env }}-eks"
        Condition:
          Bool:
            aws:SecureTransport: false
        Principal: "*"
---
# The five EventBridge rules mirror upstream's interruption sources
# one-for-one. Every rule's target authorizes through the queue policy above
# (SQS targets need no invocation role), and the queue reference doubles as
# the ordering edge. The polymorphic target field takes the explicit
# kind + fieldPath triple by design.
#
# Rule 1/5 — AWS Health events (scheduled maintenance that will touch
# instances).
apiVersion: aws.planton.dev/v1
kind: AwsEventBridgeRule
metadata:
  name: "{{ values.env }}-eks-karpenter-scheduled-change"
spec:
  region: "{{ values.region }}"
  eventPattern:
    source:
      - aws.health
    detail-type:
      - AWS Health Event
  targets:
    - name: karpenter-interruption-queue
      arn:
        valueFrom:
          kind: AwsSqsQueue
          name: "{{ values.env }}-eks"
          fieldPath: status.outputs.queue_arn
---
# Rule 2/5 — the two-minute Spot reclaim warning: the reason interruption
# handling exists.
apiVersion: aws.planton.dev/v1
kind: AwsEventBridgeRule
metadata:
  name: "{{ values.env }}-eks-karpenter-spot-interruption"
spec:
  region: "{{ values.region }}"
  eventPattern:
    source:
      - aws.ec2
    detail-type:
      - EC2 Spot Instance Interruption Warning
  targets:
    - name: karpenter-interruption-queue
      arn:
        valueFrom:
          kind: AwsSqsQueue
          name: "{{ values.env }}-eks"
          fieldPath: status.outputs.queue_arn
---
# Rule 3/5 — rebalance recommendations (elevated-risk Spot capacity;
# Karpenter can move work before the hard reclaim ever arrives).
apiVersion: aws.planton.dev/v1
kind: AwsEventBridgeRule
metadata:
  name: "{{ values.env }}-eks-karpenter-rebalance"
spec:
  region: "{{ values.region }}"
  eventPattern:
    source:
      - aws.ec2
    detail-type:
      - EC2 Instance Rebalance Recommendation
  targets:
    - name: karpenter-interruption-queue
      arn:
        valueFrom:
          kind: AwsSqsQueue
          name: "{{ values.env }}-eks"
          fieldPath: status.outputs.queue_arn
---
# Rule 4/5 — instance state changes (out-of-band terminations/stops that
# would otherwise leave ghost nodes).
apiVersion: aws.planton.dev/v1
kind: AwsEventBridgeRule
metadata:
  name: "{{ values.env }}-eks-karpenter-instance-state-change"
spec:
  region: "{{ values.region }}"
  eventPattern:
    source:
      - aws.ec2
    detail-type:
      - EC2 Instance State-change Notification
  targets:
    - name: karpenter-interruption-queue
      arn:
        valueFrom:
          kind: AwsSqsQueue
          name: "{{ values.env }}-eks"
          fieldPath: status.outputs.queue_arn
---
# Rule 5/5 — capacity-reservation interruption warnings (reserved capacity
# being reclaimed).
apiVersion: aws.planton.dev/v1
kind: AwsEventBridgeRule
metadata:
  name: "{{ values.env }}-eks-karpenter-capacity-reservation"
spec:
  region: "{{ values.region }}"
  eventPattern:
    source:
      - aws.ec2
    detail-type:
      - EC2 Capacity Reservation Instance Interruption Warning
  targets:
    - name: karpenter-interruption-queue
      arn:
        valueFrom:
          kind: AwsSqsQueue
          name: "{{ values.env }}-eks"
          fieldPath: status.outputs.queue_arn
{% endif %}
---
# The Karpenter controller itself — a Kubernetes workload, so from here on
# the one-run contract applies: consume the cluster's connection and declare
# the runs_on edge.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenter
metadata:
  name: "{{ values.env }}-karpenter"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # kube-system is upstream's recommended home since v1 — the controller
  # rides the system-critical eviction umbrella, on the system node group
  # (the chart pins controller pods away from nodes Karpenter manages).
  namespace:
    value: kube-system
  createNamespace: false
  cluster:
    # Render-known on both sides: the chart names the cluster, so the
    # literal here can never drift from cluster/eks-cluster.yaml.
    name: "{{ values.env }}-eks"
    # EKS discovery: the controller reads endpoint + CA from DescribeCluster
    # (the eks:DescribeCluster grant above) — no endpoint wiring needed.
    eksControlPlane: true
  aws:
    irsaRoleArn:
      valueFrom:
        # The controller role above — the reference is also the ordering
        # edge, so the role exists before the controller starts.
        name: "{{ values.env }}-eks-karpenter-irsa"
{% if values.karpenter_interruption_handling_enabled | bool %}
    # The queue by NAME (the controller resolves it through GetQueueUrl).
    interruptionQueue: "{{ values.env }}-eks"
{% endif %}
