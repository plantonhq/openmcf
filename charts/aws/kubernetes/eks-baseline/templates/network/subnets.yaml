# The subnet fabric: one public + one private subnet per availability zone
# (the three lists in values are index-matched), a single NAT gateway, and
# subnet-owned route tables.
#
# Public subnets host only the internet-facing edge (the NAT gateway, cloud
# load balancers); every NODE — system group and Karpenter fleet alike —
# lives in the private subnets. ONE NAT gateway serves all private subnets
# deliberately: it is the cost-conscious production default (~$32/month + 
# processing vs. one per zone). The trade is honest: a zone impairment that
# takes the NAT's zone down interrupts EGRESS from the other zones until it
# recovers — in-VPC and inbound-LB traffic is unaffected. Platforms that need
# zone-independent egress add per-zone NAT gateways as a day-2 change.
{% for az in values.availability_zones %}
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSubnet
metadata:
  name: "{{ values.env }}-eks-public-{{ az }}"
  labels:
    # Labels on AWS kinds land as resource tags. kubernetes.io/role/elb is
    # how EKS-provisioned INTERNET-FACING load balancers discover which
    # subnets to attach — without it, Service type LoadBalancer placement
    # falls back to guessing.
    kubernetes.io/role/elb: "1"
spec:
  region: "{{ values.region }}"
  vpcId:
    valueFrom:
      name: "{{ values.env }}-eks-vpc"
  availabilityZone: "{{ az }}"
  cidrBlock: "{{ values.public_subnet_cidrs[loop.index0] }}"
  # Instances launched here get public IPs by default — correct for the
  # public edge (a NAT gateway needs one), and no cluster node ever
  # launches here.
  mapPublicIpOnLaunch: true
  routes:
    # Public = the route table's default route reaches the internet gateway.
    - destinationCidrBlock: 0.0.0.0/0
      targetType: internet_gateway
      targetId:
        valueFrom:
          # The target's kind is given by targetType, so the reference names
          # the kind explicitly (this field is deliberately polymorphic and
          # carries no default kind).
          kind: AwsInternetGateway
          name: "{{ values.env }}-eks-igw"
          fieldPath: status.outputs.internet_gateway_id
---
{% endfor %}
# The NAT gateway's public IP — a first-class Elastic IP so the platform's
# egress address is stable (allow-list it at third parties once).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticIp
metadata:
  name: "{{ values.env }}-eks-nat-eip"
spec:
  region: "{{ values.region }}"
---
# The single NAT gateway, in the FIRST public subnet (the "first one"
# placement — see the cost note at the top of this file).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsNatGateway
metadata:
  name: "{{ values.env }}-eks-nat"
spec:
  region: "{{ values.region }}"
  connectivityType: public
  subnetId:
    valueFrom:
      name: "{{ values.env }}-eks-public-{{ values.availability_zones[0] }}"
  allocationId:
    valueFrom:
      name: "{{ values.env }}-eks-nat-eip"
---
{% for az in values.availability_zones %}
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSubnet
metadata:
  name: "{{ values.env }}-eks-private-{{ az }}"
  labels:
    # karpenter.sh/discovery is THE tag Karpenter's EC2NodeClass subnet
    # selector matches (autoscaling/node-fleet.yaml) — the upstream
    # convention for "these subnets belong to this cluster's fleet". The
    # value must equal the cluster name the chart renders in
    # cluster/eks-cluster.yaml.
    karpenter.sh/discovery: "{{ values.env }}-eks"
    # kubernetes.io/role/internal-elb marks these subnets for INTERNAL load
    # balancers (the private twin of the elb role tag above).
    kubernetes.io/role/internal-elb: "1"
spec:
  region: "{{ values.region }}"
  vpcId:
    valueFrom:
      name: "{{ values.env }}-eks-vpc"
  availabilityZone: "{{ az }}"
  cidrBlock: "{{ values.private_subnet_cidrs[loop.index0] }}"
  routes:
    # Private = the default route reaches the NAT gateway: outbound-only
    # internet (image pulls, package registries, the AWS APIs) with nothing
    # routable inbound.
    - destinationCidrBlock: 0.0.0.0/0
      targetType: nat_gateway
      targetId:
        valueFrom:
          kind: AwsNatGateway
          name: "{{ values.env }}-eks-nat"
          fieldPath: status.outputs.nat_gateway_id
---
{% endfor %}
