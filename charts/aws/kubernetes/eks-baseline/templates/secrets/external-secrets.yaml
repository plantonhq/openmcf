{% if values.external_secrets_enabled | bool %}
# External Secrets Operator, its IRSA role, and a cluster-wide store reading
# AWS Secrets Manager — the pattern that keeps secret VALUES out of manifests
# entirely: workloads declare ExternalSecrets naming keys in Secrets Manager,
# ESO syncs them into native Kubernetes Secrets, keylessly. The operator is a
# one-per-cluster singleton (its release name and cluster-global webhook are
# fixed upstream), which is why this whole file rides one toggle.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-external-secrets-irsa"
spec:
  region: "{{ values.region }}"
  description: external-secrets Secrets Manager role for the {{ values.env }}-eks cluster
  oidcTrust:
    providerArn:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
    providerUrl:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
        fieldPath: status.outputs.provider_url
    subjects:
      # Chart truth: the operator's release name is fixed to
      # "external-secrets" (one per cluster) and the module pins the
      # controller ServiceAccount to the chart name.
      - system:serviceaccount:external-secrets:external-secrets
  inlinePolicies:
    # Read-only over Secrets Manager. The wildcard is the honest deploy-time
    # scope (the platform's secret names are not render-known); the README's
    # day-2 section shows narrowing Resource to a name prefix like
    # "arn:aws:secretsmanager:<region>:<account>:secret:prod/*" once your
    # naming convention exists.
    secrets-manager-read:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
            - secretsmanager:ListSecrets
          Resource: "*"
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalSecretsOperator
metadata:
  name: "{{ values.env }}-external-secrets"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # Conventional home; permanent while the kept CRDs pin release ownership
  # to it (reinstalling elsewhere fails Helm's ownership check).
  namespace:
    value: external-secrets
  createNamespace: true
  # Keyless reads: the operator's ServiceAccount carries the role above, and
  # the store below deliberately declares NO credentials — its empty auth
  # block falls through to this ambient identity. One binding here covers
  # every ExternalSecret the platform ever syncs.
  workloadIdentity:
    eks:
      roleArn:
        valueFrom:
          name: "{{ values.env }}-eks-external-secrets-irsa"
---
# The cluster-wide store: readable by ExternalSecrets in every namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterSecretStore
metadata:
  name: "{{ values.env }}-secret-store"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # Reference into the in-chart operator: resolves the namespace credential
  # Secrets would live in, and orders the operator (whose CRDs define
  # ClusterSecretStore) before this resource structurally.
  secretsNamespace:
    valueFrom:
      name: "{{ values.env }}-external-secrets"
  config:
    aws:
      # Service defaults to SecretsManager. No role, no ServiceAccount, no
      # static keys: the empty auth block IS the design — reads run with the
      # operator's ambient identity bound above.
      region: "{{ values.region }}"
{% endif %}
