# The compute plane: a Fargate-only cluster, the task definition (the
# container blueprint), and the long-running service that keeps tasks
# behind the load balancer. Deploy order falls out of the references —
# cluster and task definition first, then the service that joins them.
---
apiVersion: aws.planton.dev/v1
kind: AwsEcsCluster
metadata:
  name: "{{ values.service_name }}-cluster"
spec:
  region: "{{ values.aws_region }}"
  # Fargate only — no instances to patch, size, or drain. FARGATE_SPOT is
  # deliberately absent from a web-service cluster: spot interruption
  # notices give 2 minutes, fine for queue workers, unfriendly to live HTTP
  # traffic. Add it (with a capacity-provider strategy on the service) for
  # tolerant workloads.
  capacityProviders:
    - FARGATE
{% if values.container_insights_enabled | bool %}
  containerInsights: enabled
{% else %}
  containerInsights: disabled
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsEcsTaskDefinition
metadata:
  name: "{{ values.service_name }}-task"
spec:
  region: "{{ values.aws_region }}"
  # Task-level sizing is what Fargate bills; the single container gets the
  # whole allowance. The two values must pair on Fargate's sizing grid (see
  # the parameter descriptions).
  cpu: {{ values.task_cpu }}
  memory: {{ values.task_memory }}
  # Split roles: the execution role serves the ECS agent (image pull, log
  # streams), the task role serves the application code. See iam.yaml for
  # why they never merge.
  executionRole:
    valueFrom:
      kind: AwsIamRole
      name: "{{ values.service_name }}-execution-role"
      fieldPath: status.outputs.role_arn
  taskRole:
    valueFrom:
      kind: AwsIamRole
      name: "{{ values.service_name }}-task-role"
      fieldPath: status.outputs.role_arn
  containers:
    - name: app
      image: "{{ values.container_image }}"
      portMappings:
        # Naming the port and declaring HTTP unlocks protocol-aware routing
        # features (Service Connect, per-request metrics) without any
        # further change.
        - containerPort: {{ values.container_port }}
          name: http
          appProtocol: http
      # No container-level health check on purpose: the load balancer's
      # target-group probe (load-balancer.yaml) is the health gate for a
      # web service, and it works with ANY image. A container check would
      # require curl/wget inside the image — add one when your image
      # carries a client and you want the scheduler to also restart tasks
      # that fail internally. Environment variables and secrets are
      # likewise app-specific: add them to this container block as your
      # app needs them (secrets by Secrets Manager ARN, never as plain
      # environment values).
  # Task logs flow to CloudWatch under /ecs/<family> automatically — the
  # spec's default logging contract; nothing to declare here.
---
apiVersion: aws.planton.dev/v1
kind: AwsEcsService
metadata:
  name: "{{ values.service_name }}"
spec:
  region: "{{ values.aws_region }}"
  clusterArn:
    valueFrom:
      kind: AwsEcsCluster
      name: "{{ values.service_name }}-cluster"
      fieldPath: status.outputs.cluster_arn
  # The task-definition reference carries the revision: pushing a new image
  # and re-deploying the task definition rolls this service automatically —
  # "new build in, service rolls" is the graph, not a script.
  taskDefinition:
    valueFrom:
      kind: AwsEcsTaskDefinition
      name: "{{ values.service_name }}-task"
      fieldPath: status.outputs.task_definition_arn
  launchType: FARGATE
  # Seeds the initial task count; from then on the autoscaler below owns it
  # between min_tasks and max_tasks.
  desiredCount: {{ values.min_tasks }}
  network:
    subnets:
{% for subnet_id in values.service_subnet_ids %}
      - value: "{{ subnet_id }}"
{% endfor %}
    securityGroups:
      - valueFrom:
          kind: AwsSecurityGroup
          name: "{{ values.service_name }}-task-sg"
          fieldPath: status.outputs.security_group_id
    assignPublicIp: {{ values.assign_public_ip }}
  loadBalancers:
    - targetGroupArn:
        valueFrom:
          kind: AwsLbTargetGroup
          name: "{{ values.service_name }}-tg"
          fieldPath: status.outputs.target_group_arn
      containerName: app
      containerPort: {{ values.container_port }}
  # New tasks get 90 seconds to warm up (JIT, connection pools, caches)
  # before a failing load-balancer probe can kill them — without this, slow
  # starters flap forever on the 15s probe cadence.
  healthCheckGracePeriodSeconds: 90
  # The deploy safety net: if a rollout's new tasks keep failing, stop
  # launching more AND roll back to the last working revision instead of
  # burning the service down one replacement at a time.
  deploymentCircuitBreaker:
    enable: true
    rollback: true
  autoscaling:
    minTasks: {{ values.min_tasks }}
    maxTasks: {{ values.max_tasks }}
    # Request-count tracking scales on what a web service actually
    # experiences — traffic — rather than the CPU shadow of it. The metric
    # is scoped to exactly this load balancer + target group pair by their
    # arn_suffix outputs.
    requestsPerTarget:
      targetRequestsPerTarget: {{ values.requests_per_target }}
      loadBalancerArnSuffix:
        valueFrom:
          kind: AwsAlb
          name: "{{ values.service_name }}-alb"
          fieldPath: status.outputs.arn_suffix
      targetGroupArnSuffix:
        valueFrom:
          kind: AwsLbTargetGroup
          name: "{{ values.service_name }}-tg"
          fieldPath: status.outputs.arn_suffix
