# The traffic front door: an internet-facing ALB in the public subnets, an
# IP-mode target group the ECS service registers task IPs into, and the
# listener set that changes shape with the HTTPS toggle.
---
apiVersion: aws.planton.dev/v1
kind: AwsAlb
metadata:
  name: "{{ values.service_name }}-alb"
spec:
  region: "{{ values.aws_region }}"
  # Public subnets in two-plus AZs — an AWS requirement for ALBs, and what
  # keeps the front door up through a zone event.
  subnets:
{% for subnet_id in values.alb_subnet_ids %}
    - value: "{{ subnet_id }}"
{% endfor %}
  securityGroups:
    - valueFrom:
        kind: AwsSecurityGroup
        name: "{{ values.service_name }}-alb-sg"
        fieldPath: status.outputs.security_group_id
{% if values.waf_enabled | bool %}
  # Attaching the web ACL here (rather than on a separate association
  # resource) keeps the ALB's whole security posture readable in one spec.
  webAclArn:
    valueFrom:
      kind: AwsWafWebAcl
      name: "{{ values.service_name }}-waf"
      fieldPath: status.outputs.web_acl_arn
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsLbTargetGroup
metadata:
  name: "{{ values.service_name }}-tg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    value: "{{ values.vpc_id }}"
  # ip mode is what Fargate requires: awsvpc tasks are registered by task
  # IP, not by instance id — there are no instances.
  targetType: ip
  port: {{ values.container_port }}
  protocol: HTTP
  # 60s instead of the 300s default: web requests are short, and the
  # deregistration delay is dead time every deployment and scale-in waits
  # through before a task can actually stop.
  deregistrationDelaySeconds: 60
  healthCheck:
    protocol: HTTP
    path: "{{ values.health_check_path }}"
    # 15s interval with 3 consecutive results flips a task's state in under
    # a minute in either direction — fast enough to pull a dying task out
    # of rotation before users notice, slow enough not to flap on a slow GC
    # pause.
    intervalSeconds: 15
    timeoutSeconds: 5
    healthyThreshold: 3
    unhealthyThreshold: 3
    matcher: "200-399"
{% if values.https_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsLbListener
metadata:
  name: "{{ values.service_name }}-https"
spec:
  region: "{{ values.aws_region }}"
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      fieldPath: status.outputs.load_balancer_arn
  port: 443
  protocol: HTTPS
  certificateArn:
    value: "{{ values.certificate_arn }}"
  # TLS 1.2 floor with 1.3 preferred — AWS's current recommended policy;
  # older policies exist only for legacy client fleets.
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  defaultActions:
    - type: forward
      forward:
        targetGroups:
          - arn:
              valueFrom:
                kind: AwsLbTargetGroup
                name: "{{ values.service_name }}-tg"
                fieldPath: status.outputs.target_group_arn
---
# With HTTPS on, port 80's only job is the permanent redirect: browsers and
# old links that arrive on http:// get a 301 to the same host/path on 443,
# and no request body ever crosses in the clear.
apiVersion: aws.planton.dev/v1
kind: AwsLbListener
metadata:
  name: "{{ values.service_name }}-http"
spec:
  region: "{{ values.aws_region }}"
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      fieldPath: status.outputs.load_balancer_arn
  port: 80
  protocol: HTTP
  defaultActions:
    - type: redirect
      redirect:
        protocol: HTTPS
        port: "443"
        statusCode: HTTP_301
{% else %}
---
# Without a certificate the service serves plain HTTP on 80. This is a
# bootstrap posture, not a production one — flip https_enabled the moment a
# certificate exists.
apiVersion: aws.planton.dev/v1
kind: AwsLbListener
metadata:
  name: "{{ values.service_name }}-http"
spec:
  region: "{{ values.aws_region }}"
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      fieldPath: status.outputs.load_balancer_arn
  port: 80
  protocol: HTTP
  defaultActions:
    - type: forward
      forward:
        targetGroups:
          - arn:
              valueFrom:
                kind: AwsLbTargetGroup
                name: "{{ values.service_name }}-tg"
                fieldPath: status.outputs.target_group_arn
{% endif %}
