# The service's own private image repository. Created here (rather than
# assumed) so the first deploy of a brand-new service is one chart install:
# push to this repository, point container_image at it, and re-deploy.
{% if values.ecr_repo_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsEcrRepo
metadata:
  name: "{{ values.service_name }}-repo"
spec:
  region: "{{ values.aws_region }}"
  repositoryName: "{{ values.service_name }}"
  # Immutable tags are the deploy-safety default: a tag can never be
  # silently repointed at different bytes, so "what is v1.2.3" has exactly
  # one answer forever. The one exclusion is "latest", the conventional
  # moving pointer for local development — everything else is frozen at
  # first push.
  imageTagMutability: IMMUTABLE_WITH_EXCLUSION
  imageTagMutabilityExclusionFilters:
    - latest
  # Every pushed image is scanned for known CVEs on arrival — free, and the
  # earliest possible place to catch a vulnerable base layer.
  scanOnPush: true
  lifecycleRules:
    # Untagged images are the residue of overwritten "latest" pushes and
    # failed builds; a week is plenty of forensic window before they stop
    # being anything but storage cost.
    - rulePriority: 1
      description: expire untagged images after 7 days
      tagStatus: untagged
      countType: sinceImagePushed
      countNumber: 7
{% endif %}
