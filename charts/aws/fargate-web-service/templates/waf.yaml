# The optional web application firewall. REGIONAL scope because it fronts a
# load balancer (CLOUDFRONT scope is for CDN distributions only); it must
# live in the same region as the ALB, which the shared aws_region already
# guarantees. The association is declared on the load balancer's webAclArn —
# see load-balancer.yaml.
{% if values.waf_enabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsWafWebAcl
metadata:
  name: "{{ values.service_name }}-waf"
spec:
  region: "{{ values.aws_region }}"
  scope: REGIONAL
  # Allow by default and let the managed rule packs veto: the packs BLOCK
  # matching exploit traffic while everything unmatched flows through. A
  # block-by-default posture belongs to allowlist APIs, not public websites.
  defaultAction:
    type: allow
  rules:
    # AWS's Core rule set: the OWASP-top-10 style baseline (request
    # smuggling, XSS probes, oversized bodies, known bad user agents).
    # overrideAction none = enforce the pack's own block verdicts; flip to
    # count for a dry-run when first enabling WAF on live traffic.
    - name: aws-common-rules
      priority: 1
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesCommonRuleSet
          vendorName: AWS
    # Known-bad-inputs: signatures for actively exploited CVE payloads
    # (Log4Shell-class). Cheap, low-false-positive, and the pack AWS updates
    # fastest when a new exploit wave starts.
    - name: aws-known-bad-inputs
      priority: 2
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesKnownBadInputsRuleSet
          vendorName: AWS
{% endif %}
