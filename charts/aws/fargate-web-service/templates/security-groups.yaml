# The two-tier network contract: the world may reach the load balancer on
# its listener ports, and ONLY the load balancer may reach the tasks. Each
# tier gets its own dedicated security group so "who can reach what" is
# auditable at a glance and changeable without touching the other tier.
---
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.service_name }}-alb-sg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    value: "{{ values.vpc_id }}"
  description: "Internet ingress to the {{ values.service_name }} load balancer"
  ingress:
    # Port 80 stays open in both modes: with HTTPS on it serves the
    # 301-redirect to 443 (browsers still try http:// first), and with
    # HTTPS off it is the service port itself.
    - description: "HTTP from anywhere"
      protocol: tcp
      fromPort: 80
      toPort: 80
      ipv4Cidrs:
        - 0.0.0.0/0
{% if values.https_enabled | bool %}
    - description: "HTTPS from anywhere"
      protocol: tcp
      fromPort: 443
      toPort: 443
      ipv4Cidrs:
        - 0.0.0.0/0
{% endif %}
  egress:
    # The ALB originates traffic only toward the tasks; scoping egress to
    # the task port inside the VPC keeps a compromised or misconfigured
    # listener from being a pivot to anywhere else.
    - description: "Forward to the service tasks"
      protocol: tcp
      fromPort: {{ values.container_port }}
      toPort: {{ values.container_port }}
      ipv4Cidrs:
        - 0.0.0.0/0
---
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.service_name }}-task-sg"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    value: "{{ values.vpc_id }}"
  description: "Task ingress for {{ values.service_name }} - app port from the load balancer only"
  ingress:
    # Source is the ALB's security group, not a CIDR: nothing else in the
    # VPC (or the internet) can open a connection to a task, no matter what
    # subnet the task landed in.
    - description: "App port from the load balancer"
      protocol: tcp
      fromPort: {{ values.container_port }}
      toPort: {{ values.container_port }}
      sourceSecurityGroupIds:
        - valueFrom:
            kind: AwsSecurityGroup
            name: "{{ values.service_name }}-alb-sg"
            fieldPath: status.outputs.security_group_id
  egress:
    # Tasks DO need outbound: pulling the image from ECR at startup, writing
    # logs, and whatever APIs the app calls. Unlike a database, a web
    # service cannot run deny-all egress — tighten to specific destinations
    # (VPC endpoints, dependency CIDRs) as a day-2 hardening step if your
    # posture demands it.
    - description: "Outbound for image pulls, logs, and app dependencies"
      protocol: "-1"
      fromPort: 0
      toPort: 0
      ipv4Cidrs:
        - 0.0.0.0/0
