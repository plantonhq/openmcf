params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for every resource in this chart. The load balancer, the
      ECS service, and the certificate (when HTTPS is enabled) are all
      regional and must live together — an ACM certificate from another
      region cannot be attached to this region's load balancer.
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: service_name
    description: >
      Name prefix for every resource this chart creates (cluster, task
      definition, service, load balancer, roles, repository). Lets you run
      several independent web services in the same environment without name
      collisions. Lowercase letters, digits, and hyphens.
    value: web

  # ── Network (bring your own — the network-foundation chart provides it) ──
  - name: vpc_id
    description: >
      The VPC that hosts the service. Both subnet lists below must belong to
      this VPC — the target group registers task IPs inside it. Deploy the
      network-foundation chart first and paste its VPC id here (or swap this
      chart's literal references for valueFrom refs, shown in the README).
    value: vpc-0123456789abcdef0

  - name: alb_subnet_ids
    description: >
      Subnets for the load balancer — public subnets in at least two
      different availability zones (an AWS requirement for ALBs). These are
      the network-foundation chart's public subnets in the common case.
    type: list
    value:
      - subnet-0aaaaaaaaaaaaaaaa
      - subnet-0bbbbbbbbbbbbbbbb

  - name: service_subnet_ids
    description: >
      Subnets the Fargate tasks run in — private subnets with NAT egress in
      the production shape, so tasks are unreachable from the internet and
      only the load balancer fronts them. If you run tasks in public subnets
      without NAT, also set assign_public_ip to true so they can pull
      images.
    type: list
    value:
      - subnet-0cccccccccccccccc
      - subnet-0ddddddddddddddddd

  - name: assign_public_ip
    type: bool
    description: >
      Give each task a public IP. Leave off for the production shape
      (private subnets behind NAT). Turn on ONLY when service_subnet_ids are
      public subnets in a network without NAT — without a public IP or a NAT
      path, tasks cannot reach ECR to pull their image and never start.
    value: false

  # ── Workload ────────────────────────────────────────────────────────────
  - name: container_image
    description: >
      The container image the service runs. The default is a public Apache
      httpd image so the chart deploys green out of the box; replace it with
      your application image — typically this chart's own ECR repository URL
      plus a tag once you have pushed to it (see the README's first-deploy
      walkthrough). Pushing a new tag and updating this value rolls the
      service with zero downtime.
    value: public.ecr.aws/docker/library/httpd:2.4

  - name: container_port
    type: number
    description: >
      The port the application listens on inside the container. The target
      group, the task security group, and the container port mapping all
      derive from this one value, so changing it re-wires the whole traffic
      path consistently. The default matches the httpd default image; most
      application images use 8080.
    value: 80

  - name: health_check_path
    description: >
      HTTP path the load balancer probes to decide whether a task is
      healthy. Point it at a cheap endpoint that exercises the app's real
      readiness (a /healthz that checks its dependencies), not a static
      file — the load balancer only routes to tasks that answer it with
      2xx.
    value: /

  # ── Sizing (the cost dials) ─────────────────────────────────────────────
  - name: task_cpu
    type: number
    description: >
      CPU units per task (1024 = 1 vCPU). Must be a valid Fargate pairing
      with task_memory — 256/512, 512/1024, 1024/2048, 2048/4096 are the
      common steps. Fargate bills per vCPU-second, so this and the task
      count are the chart's main cost dials.
    value: 512

  - name: task_memory
    type: number
    description: >
      Memory in MiB per task. Must pair with task_cpu on Fargate's sizing
      grid (each CPU step allows a memory range — 512 CPU allows 1024-4096
      MiB). Tasks that exceed this are OOM-killed and restarted by the
      scheduler.
    value: 1024

  - name: min_tasks
    type: number
    description: >
      The autoscaling floor and the initial task count. Two is the
      high-availability minimum — the scheduler spreads tasks across the
      service subnets' availability zones, so a single-task floor means an
      AZ event takes the service to zero.
    value: 2

  - name: max_tasks
    type: number
    description: >
      The autoscaling ceiling. Scaling stops here no matter the load — set
      it from the worst load you are willing to pay for, not the worst load
      you expect. Must be at least min_tasks.
    value: 10

  - name: requests_per_target
    type: number
    description: >
      Target requests per minute per task for the autoscaler. It adds tasks
      when the per-task ALB request rate rises above this and removes them
      when it falls, between the min/max bounds. Set it from a load test:
      the request rate one task sustains at comfortable latency.
    value: 1000

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: ecr_repo_enabled
    type: bool
    description: >
      Create a private ECR repository (named after service_name) for the
      application's images: immutable tags with a "latest" exclusion,
      scan-on-push, and a lifecycle policy that prunes untagged layers.
      Turn off when images live in an existing registry.
    value: true

  - name: container_insights_enabled
    type: bool
    description: >
      CloudWatch Container Insights on the cluster: per-service and per-task
      CPU/memory/network metrics and dashboards. It bills per metric and per
      GB of performance-log ingestion — worth it for production; turn off
      for cost-minimal dev environments.
    value: true

  - name: https_enabled
    type: bool
    description: >
      Serve HTTPS on 443 with an ACM certificate and redirect all HTTP
      traffic to it. Requires certificate_arn. Off by default only because a
      certificate cannot be conjured without a domain — turn it on the
      moment you have one; plain-HTTP production traffic should not outlive
      the first demo.
    value: false

  - name: certificate_arn
    description: >
      ARN of an ISSUED ACM certificate for the service's domain, in this
      chart's region. Only used when https_enabled is true. Request one in
      the ACM console or with the AwsCertManagerCert resource (DNS
      validation against your Route 53 zone makes issuance hands-free).
    value: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000

  - name: waf_enabled
    type: bool
    description: >
      Put an AWS WAF web ACL with the Core and Known-Bad-Inputs managed rule
      packs in front of the load balancer, filtering exploit probes before
      they reach the service. WAF bills ~$5/month per ACL plus ~$1 per rule
      pack and per-request fees — recommended for anything internet-facing
      that matters.
    value: false

  - name: dns_enabled
    type: bool
    description: >
      Create Route 53 alias records (A and AAAA) pointing domain_name at the
      load balancer in an existing hosted zone. Turn off when DNS lives
      outside Route 53 — the load balancer's DNS name is in the ALB's
      outputs either way.
    value: false

  - name: zone_id
    description: >
      The id of the existing Route 53 hosted zone (Z...) that owns
      domain_name. Only used when dns_enabled is true.
    value: Z0123456789EXAMPLE

  - name: domain_name
    description: >
      The fully qualified domain the service serves on (e.g.
      app.example.com). Only used when dns_enabled is true; when HTTPS is on,
      certificate_arn must cover exactly this name.
    value: app.example.com
