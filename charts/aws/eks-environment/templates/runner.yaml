# A private API endpoint is reachable only from inside the VPC, so the
# platform's hosted runners cannot deploy the in-cluster add-ons. This
# standing runner is the environment's in-network worker: an outbound-only
# process that polls the control plane for deploy operations and executes
# them from within the VPC -- no inbound exposure, and it outlives cluster
# rebuilds so day-2 operations (updates, destroys) keep working.
#
# The runner needs outbound internet to pull its image and reach the control
# plane: keep nat_mode at single or per_az when the endpoint is private.
{% if values.disable_public_endpoint | bool and values.enable_planton_runner | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsPlantonRunner
metadata:
  name: "{{ values.cluster_name }}-runner"
spec:
  region: "{{ values.aws_region }}"
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.env }}-private-1"
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.env }}-private-2"
        fieldPath: status.outputs.subnet_id
  # The platform creates this runner's registration and writes its
  # credentials document at exactly this managed-secret reference before the
  # runner deploys, so the manifest needs no hand-provisioned secret.
  credentials: "$secret/{{ values.cluster_name }}-runner-credentials"
  # temporal: a pull-based worker that needs no inbound path at all -- the
  # right mode for private-endpoint deployments.
  executionMode: temporal
---
# The cluster's API endpoint only admits traffic its security groups allow;
# the runner's own group is outbound-only by design. This group carries the
# one inbound rule the composition needs -- API server port 443 from the
# runner -- and is attached to the cluster's control-plane interfaces.
# The reference chain (runner -> this group -> cluster) also orders the
# graph: the runner comes up before the cluster and is torn down after it.
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.cluster_name }}-runner-access"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.env }}-vpc"
      fieldPath: status.outputs.vpc_id
  description: Admits the in-VPC Planton runner to the Kubernetes API endpoint
  ingress:
    - protocol: tcp
      fromPort: 443
      toPort: 443
      sourceSecurityGroupIds:
        - valueFrom:
            kind: AwsPlantonRunner
            name: "{{ values.cluster_name }}-runner"
            fieldPath: status.outputs.security_group_id
      description: Planton runner to Kubernetes API server
{% endif %}
