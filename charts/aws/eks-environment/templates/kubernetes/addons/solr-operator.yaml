{% if values.solrOperatorEnabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSolrOperator
metadata:
  name: {{ values.cluster_name }}-solr-operator
  relationships:
    - kind: AwsEksNodeGroup
      name: "{{ values.node_group_name }}"
      type: runs_on
spec:
  namespace:
    value: solr-operator
  createNamespace: true
  container:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 100Mi
{% endif %}

