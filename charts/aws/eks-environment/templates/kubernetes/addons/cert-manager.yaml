{% if values.certManagerEnabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCertManager
metadata:
  name: {{ values.cluster_name }}-cert-manager
  # The platform publishes the cluster's Kubernetes connection at the
  # env-qualified slug <env>-<cluster name>; naming it here binds this addon
  # to that connection instead of the environment's default.
  annotations:
    planton.dev/connection: "{{ values.env }}-{{ values.cluster_name }}"
  relationships:
    - kind: AwsEksNodeGroup
      name: "{{ values.node_group_name }}"
      type: runs_on
spec:
  namespace:
    value: cert-manager
  createNamespace: true
{% endif %}

