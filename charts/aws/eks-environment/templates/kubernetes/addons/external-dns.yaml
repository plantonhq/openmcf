{% if values.dnsEnabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalDns
metadata:
  name: {{ values.cluster_name }}-external-dns
  # The platform publishes the cluster's Kubernetes connection at the
  # env-qualified slug <env>-<cluster name>; naming it here binds this addon
  # to that connection instead of the environment's default.
  annotations:
    planton.dev/connection: "{{ values.env }}-{{ values.cluster_name }}"
  relationships:
    - kind: AwsEksNodeGroup
      name: "{{ values.node_group_name }}"
      type: runs_on
spec:
  namespace:
    value: external-dns
  createNamespace: true
  # Publish records into the chart's own hosted zone. The reference also
  # orders this addon after the zone exists.
  eks:
    route53ZoneId:
      valueFrom:
        kind: AwsRoute53Zone
        name: "{{ values.domain_name }}"
        fieldPath: status.outputs.zone_id
{% endif %}
