apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: EKS Environment
spec:
  selector:
    kind: platform
  description: Complete EKS environment in one run — custom VPC, cluster with public or private API endpoint (private includes an in-VPC Planton runner), autoscaled managed node-group, optional KMS secrets encryption, and the networking add-ons every cluster needs — ingress-nginx, cert-manager, and optional Route 53 DNS with external-dns.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/provider/aws/awsekscluster/v1/assets/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/aws/eks-environment
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/aws/eks-environment/README.md
