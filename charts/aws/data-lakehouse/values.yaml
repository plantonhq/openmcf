params:
  # ── Placement ───────────────────────────────────────────────────────────
  - name: aws_region
    description: >
      AWS region for every resource in the lakehouse. Athena queries the
      lake in-region, so keep the workgroup and the buckets together —
      cross-region scans pay data-transfer on every query.
    value: us-east-1

  # ── Identity ────────────────────────────────────────────────────────────
  - name: lake_bucket_name
    description: >
      Globally unique name for the S3 bucket that stores the lake data. S3
      bucket names are global across all AWS accounts, so carry an org
      prefix (e.g. <org>-data-lake) — a generic name like "data-lake" will
      already be taken. This name is also the prefix for the chart's
      companion resources (the results bucket, the workgroup, the ingestion
      stream).
    value: my-org-data-lake

  - name: database_name
    description: >
      Name of the Glue catalog database that tables are registered under —
      the name analysts type in FROM clauses ("SELECT ... FROM
      <database>.<table>"). Glue database names allow only lowercase
      letters, digits, and underscores (NO hyphens), which is why this is a
      separate param instead of being derived from the hyphenated bucket
      name.
    value: lakehouse

  # ── Lifecycle tiering (the storage cost dials) ─────────────────────────
  - name: infrequent_access_after_days
    type: number
    description: >
      Days after an object lands before it transitions to STANDARD_IA
      (~45% cheaper storage, same millisecond access, small per-GB
      retrieval fee). 30 is the minimum AWS allows for IA and the right
      default for analytical data whose query frequency decays with age.
    value: 30

  - name: glacier_after_days
    type: number
    description: >
      Days after an object lands before it transitions to GLACIER_IR
      (Glacier Instant Retrieval — ~68% cheaper than STANDARD, still
      millisecond access, so Athena can STILL query it; higher per-GB
      retrieval fee). Must be greater than infrequent_access_after_days.
      Deep-freeze classes (GLACIER, DEEP_ARCHIVE) are deliberately not on
      this path because Athena cannot read them — restore-first archives
      are a day-2 rule you add knowingly (see the README).
    value: 180

  # ── Query cost guard ─────────────────────────────────────────────────────
  - name: query_scan_limit_gib
    type: number
    description: >
      Per-query scan ceiling in GiB — Athena cancels any query that scans
      more. Athena bills per TB scanned, so this is the guard between a
      SELECT * on an unpartitioned table and a surprise bill. 1024 GiB
      (1 TB ≈ $5) is a generous production ceiling; lower it for teams
      still learning to write partition-pruned queries. Set 0 to remove
      the limit entirely.
    value: 1024

  # ── Feature toggles ─────────────────────────────────────────────────────
  - name: managed_results_enabled
    type: bool
    description: >
      Store query results in AWS-managed storage (free, encrypted,
      auto-deleted after 24 hours) instead of a dedicated results bucket.
      Turn on when results are transient by nature — dashboards and ad-hoc
      exploration that re-run rather than re-read. Keep off when results
      feed downstream jobs or need retention you control: the chart then
      provisions a results bucket with a 30-day expiry. The two storage
      modes are mutually exclusive by Athena's own contract, so this one
      toggle owns both sides.
    value: false

  - name: ingestion_enabled
    type: bool
    description: >
      Provision a Kinesis Data Firehose delivery stream (Direct PUT) that
      lands JSON events into the lake, GZIP-compressed and date-partitioned
      (year=/month=/day= prefixes Athena prunes natively), plus the
      least-privilege IAM role Firehose delivers with. Producers send
      records with PutRecord/PutRecordBatch — no stream shards to size, no
      consumers to manage. Turn off when data arrives by other means
      (batch jobs, DMS, direct S3 writes).
    value: true

  - name: force_destroy
    type: bool
    description: >
      Allow chart teardown to delete the buckets even when they still
      contain objects (S3 refuses to delete non-empty buckets otherwise).
      Keep OFF for anything real — a data lake is usually the system of
      record, and this flag is the difference between "teardown failed,
      data intact" and "data gone". Turn on only for disposable
      environments.
    value: false
