# The VPC and its internet gateway — the two singletons everything else in
# this network attaches to. The VPC owns the address space; the internet
# gateway is the VPC's door to the internet (public subnets route through it,
# and the NAT gateways egress through it on behalf of private subnets).
---
apiVersion: aws.planton.dev/v1
kind: AwsVpc
metadata:
  name: "{{ values.network_name }}-vpc"
spec:
  region: "{{ values.aws_region }}"

  # The primary CIDR is immutable after creation — see the vpc_cidr parameter
  # description for the overlap warning. Secondary CIDRs can be added later
  # without replacing the VPC if the space ever runs out.
  cidrBlock: "{{ values.vpc_cidr }}"

  # Both DNS switches on: enableDnsSupport turns on the VPC resolver
  # (169.254.169.253), and enableDnsHostnames gives instances DNS names.
  # Interface VPC endpoints (private DNS), EKS, and most managed services
  # assume both — leaving either off is a debugging session waiting to
  # happen, for zero savings.
  enableDnsSupport: true
  enableDnsHostnames: true

---
# One internet gateway per VPC is an AWS invariant. It has no configuration
# and no cost — the public/private distinction is made entirely by which
# subnets route to it (see subnets.yaml).
apiVersion: aws.planton.dev/v1
kind: AwsInternetGateway
metadata:
  name: "{{ values.network_name }}-igw"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.network_name }}-vpc"
      fieldPath: status.outputs.vpc_id
