# One public and one private subnet per availability zone. "Public" and
# "private" are not subnet properties in AWS — the distinction is made purely
# by routing, and that is exactly how these manifests express it: each subnet
# declares inline routes, which makes it own a dedicated route table (exported
# as status.outputs.route_table_id and reused by the S3 gateway endpoint in
# endpoints.yaml).
#
#   public  subnet: 0.0.0.0/0 -> the internet gateway  (reachable from outside)
#   private subnet: 0.0.0.0/0 -> a NAT gateway         (outbound-only), or no
#                   internet route at all when nat_gateway_enabled is off
{% for az in values.availability_zones %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.network_name }}-public-{{ az }}"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.network_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ az }}"
  # CIDR lists are index-matched to availability_zones (entry N serves AZ N).
  cidrBlock: "{{ values.public_subnet_cidrs[loop.index0] }}"

  # Auto-assign public IPv4 to instances launched here. This is what makes
  # the subnet useful as a public tier (bastions, NAT gateways, load-balancer
  # nodes) — without it every launch needs an explicit address request.
  mapPublicIpOnLaunch: true

  # The route that makes this subnet public. The route's target kind is given
  # by targetType; targetId is deliberately polymorphic, so the internet
  # gateway is referenced explicitly by its output.
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: internet_gateway
      targetId:
        valueFrom:
          kind: AwsInternetGateway
          name: "{{ values.network_name }}-igw"
          fieldPath: status.outputs.internet_gateway_id
{% endfor %}
{% for az in values.availability_zones %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.network_name }}-private-{{ az }}"
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.network_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ az }}"
  cidrBlock: "{{ values.private_subnet_cidrs[loop.index0] }}"
{% if values.nat_gateway_enabled | bool %}
  # Outbound-only internet access through NAT. With nat_gateway_per_az on,
  # each private subnet uses its own AZ's gateway (no cross-AZ hop, survives
  # an AZ outage); with the single shared gateway, all AZs route to it and
  # accept the cross-AZ data charge as the price of one hourly fee.
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: nat_gateway
      targetId:
        valueFrom:
          kind: AwsNatGateway
{% if values.nat_gateway_per_az | bool %}
          name: "{{ values.network_name }}-nat-{{ az }}"
{% else %}
          name: "{{ values.network_name }}-nat"
{% endif %}
          fieldPath: status.outputs.nat_gateway_id
{% endif %}
{% endfor %}
