# AWS network foundation for the microservices backend.
#
# One public and one private subnet per Availability Zone. Public subnets route
# 0.0.0.0/0 to the Internet Gateway and host the ALB plus the NAT gateway(s);
# private subnets host the database, cache, and Fargate tasks and reach the
# internet outbound-only through a NAT gateway. A subnet is "public" or
# "private" solely by where its default route points (IGW vs NAT).
#
# `nat_mode` controls private-subnet egress: single (one shared NAT), per_az
# (one NAT per AZ), or none (no outbound internet from private subnets).
---
apiVersion: aws.planton.dev/v1
kind: AwsVpc
metadata:
  name: "{{ values.service_name }}-vpc"
  group: network
spec:
  region: "{{ values.aws_region }}"
  cidrBlock: "{{ values.vpc_cidr }}"
  enableDnsSupport: true
  enableDnsHostnames: true
---
apiVersion: aws.planton.dev/v1
kind: AwsInternetGateway
metadata:
  name: "{{ values.service_name }}-igw"
  group: network
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.service_name }}-public-1"
  group: network
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ values.availability_zone_1 }}"
  cidrBlock: "{{ values.public_subnet_1_cidr }}"
  mapPublicIpOnLaunch: true
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: internet_gateway
      targetId:
        valueFrom:
          kind: AwsInternetGateway
          name: "{{ values.service_name }}-igw"
          fieldPath: status.outputs.internet_gateway_id
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.service_name }}-public-2"
  group: network
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ values.availability_zone_2 }}"
  cidrBlock: "{{ values.public_subnet_2_cidr }}"
  mapPublicIpOnLaunch: true
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: internet_gateway
      targetId:
        valueFrom:
          kind: AwsInternetGateway
          name: "{{ values.service_name }}-igw"
          fieldPath: status.outputs.internet_gateway_id
{% if values.nat_mode != "none" %}
---
apiVersion: aws.planton.dev/v1
kind: AwsElasticIp
metadata:
  name: "{{ values.service_name }}-nat-eip-1"
  group: network
spec:
  region: "{{ values.aws_region }}"
---
apiVersion: aws.planton.dev/v1
kind: AwsNatGateway
metadata:
  name: "{{ values.service_name }}-nat-1"
  group: network
spec:
  region: "{{ values.aws_region }}"
  connectivityType: public
  subnetId:
    valueFrom:
      kind: AwsSubnet
      name: "{{ values.service_name }}-public-1"
      fieldPath: status.outputs.subnet_id
  allocationId:
    valueFrom:
      kind: AwsElasticIp
      name: "{{ values.service_name }}-nat-eip-1"
      fieldPath: status.outputs.allocation_id
{% if values.nat_mode == "per_az" %}
---
apiVersion: aws.planton.dev/v1
kind: AwsElasticIp
metadata:
  name: "{{ values.service_name }}-nat-eip-2"
  group: network
spec:
  region: "{{ values.aws_region }}"
---
apiVersion: aws.planton.dev/v1
kind: AwsNatGateway
metadata:
  name: "{{ values.service_name }}-nat-2"
  group: network
spec:
  region: "{{ values.aws_region }}"
  connectivityType: public
  subnetId:
    valueFrom:
      kind: AwsSubnet
      name: "{{ values.service_name }}-public-2"
      fieldPath: status.outputs.subnet_id
  allocationId:
    valueFrom:
      kind: AwsElasticIp
      name: "{{ values.service_name }}-nat-eip-2"
      fieldPath: status.outputs.allocation_id
{% endif %}
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.service_name }}-private-1"
  group: network
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ values.availability_zone_1 }}"
  cidrBlock: "{{ values.private_subnet_1_cidr }}"
{% if values.nat_mode != "none" %}
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: nat_gateway
      targetId:
        valueFrom:
          kind: AwsNatGateway
          name: "{{ values.service_name }}-nat-1"
          fieldPath: status.outputs.nat_gateway_id
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSubnet
metadata:
  name: "{{ values.service_name }}-private-2"
  group: network
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  availabilityZone: "{{ values.availability_zone_2 }}"
  cidrBlock: "{{ values.private_subnet_2_cidr }}"
{% if values.nat_mode != "none" %}
  routes:
    - destinationCidrBlock: 0.0.0.0/0
      targetType: nat_gateway
      targetId:
        valueFrom:
          kind: AwsNatGateway
{% if values.nat_mode == "per_az" %}
          name: "{{ values.service_name }}-nat-2"
{% else %}
          name: "{{ values.service_name }}-nat-1"
{% endif %}
          fieldPath: status.outputs.nat_gateway_id
{% endif %}
{% if values.s3EndpointEnabled | bool %}
# S3 gateway endpoint: free, route-based private S3 access. Traffic to
# S3 from the private subnets bypasses the NAT gateway (no per-GB data
# processing) and never crosses the internet -- and with nat_mode
# "none" this is the ONLY S3 path the private subnets have. Private
# subnets own their route tables only when NAT gives them a default
# route; without NAT they ride the VPC main table, so the endpoint
# attaches there instead.
---
apiVersion: aws.planton.dev/v1
kind: AwsVpcEndpoint
metadata:
  name: "{{ values.service_name }}-s3-gateway"
  group: network
  relationships:
    - kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  endpointType: Gateway
  serviceName: "com.amazonaws.{{ values.aws_region }}.s3"
  routeTableIds:
{% if values.nat_mode != "none" %}
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.service_name }}-private-1"
        fieldPath: status.outputs.route_table_id
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.service_name }}-private-2"
        fieldPath: status.outputs.route_table_id
{% else %}
    - valueFrom:
        kind: AwsVpc
        name: "{{ values.service_name }}-vpc"
        fieldPath: status.outputs.main_route_table_id
{% endif %}
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsSecurityGroup
metadata:
  name: "{{ values.service_name }}-sg"
  group: network
  relationships:
    - kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  description: Allow HTTP/HTTPS ingress and all egress
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      fieldPath: status.outputs.vpc_id
  ingress:
    - description: HTTP from anywhere
      fromPort: 80
      toPort: 80
      protocol: TCP
      ipv4Cidrs:
        - 0.0.0.0/0
    - description: HTTPS from anywhere
      fromPort: 443
      toPort: 443
      protocol: TCP
      ipv4Cidrs:
        - 0.0.0.0/0
  egress:
    - description: Allow all outbound
      protocol: "-1"
      ipv4Cidrs:
        - 0.0.0.0/0
{% if values.dnsEnabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsRoute53Zone
metadata:
  name: "{{ values.domain_name }}"
  slug: "{{ values.domain_name | replace('.', '-') }}"
  group: network
spec:
  region: "{{ values.aws_region }}"
{% if values.httpsEnabled | bool %}
---
apiVersion: aws.planton.dev/v1
kind: AwsCertManagerCert
metadata:
  name: "{{ values.service_name }}-alb-cert"
  group: security
  relationships:
    - kind: AwsRoute53Zone
      name: "{{ values.domain_name }}"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  primaryDomainName: "{{ values.load_balancer_domain_name }}"
  alternateDomainNames:
    - "*.{{ values.load_balancer_domain_name }}"
  route53HostedZoneId:
    valueFrom:
      kind: AwsRoute53Zone
      name: "{{ values.domain_name }}"
      fieldPath: status.outputs.zone_id
  validationMethod: DNS
{% endif %}
{% endif %}
---
apiVersion: aws.planton.dev/v1
kind: AwsAlb
metadata:
  name: "{{ values.service_name }}-alb"
  group: network
  relationships:
    - kind: AwsVpc
      name: "{{ values.service_name }}-vpc"
      type: uses
    - kind: AwsSecurityGroup
      name: "{{ values.service_name }}-sg"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.service_name }}-public-1"
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: "{{ values.service_name }}-public-2"
        fieldPath: status.outputs.subnet_id
  securityGroups:
    - valueFrom:
        kind: AwsSecurityGroup
        name: "{{ values.service_name }}-sg"
        fieldPath: status.outputs.security_group_id
  idleTimeoutSeconds: {{ values.alb_idle_timeout_seconds }}
{% if values.dnsEnabled | bool %}
  dns:
    enabled: true
    hostnames:
      - "{{ values.load_balancer_domain_name }}"
      - "*.{{ values.load_balancer_domain_name }}"
    route53ZoneId:
      valueFrom:
        kind: AwsRoute53Zone
        name: "{{ values.domain_name }}"
        fieldPath: status.outputs.zone_id
{% endif %}
{% if values.httpsEnabled | bool and values.dnsEnabled | bool %}
# HTTPS entry point: terminates TLS with the service certificate. The default
# action is an explicit 404 -- real routes are listener rules that services
# attach for their own hostnames, so an unmatched request means "no such
# service", not "OK".
---
apiVersion: aws.planton.dev/v1
kind: AwsLbListener
metadata:
  name: "{{ values.service_name }}-alb-https"
  group: network
  relationships:
    - kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      fieldPath: status.outputs.load_balancer_arn
  port: 443
  protocol: HTTPS
  certificateArn:
    valueFrom:
      kind: AwsCertManagerCert
      name: "{{ values.service_name }}-alb-cert"
      fieldPath: status.outputs.cert_arn
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  defaultActions:
    - type: fixed-response
      fixedResponse:
        contentType: text/plain
        statusCode: "404"
        messageBody: not found
# Port 80 exists only to bounce clients to HTTPS -- a permanent redirect,
# never plaintext service traffic.
---
apiVersion: aws.planton.dev/v1
kind: AwsLbListener
metadata:
  name: "{{ values.service_name }}-alb-http"
  group: network
  relationships:
    - kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      fieldPath: status.outputs.load_balancer_arn
  port: 80
  protocol: HTTP
  defaultActions:
    - type: redirect
      redirect:
        statusCode: HTTP_301
        protocol: HTTPS
        port: "443"
{% else %}
# HTTP-only entry point (no certificate without DNS). The default action is
# an explicit 404 -- real routes are listener rules that services attach for
# their own hostnames.
---
apiVersion: aws.planton.dev/v1
kind: AwsLbListener
metadata:
  name: "{{ values.service_name }}-alb-http"
  group: network
  relationships:
    - kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      type: uses
spec:
  region: "{{ values.aws_region }}"
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: "{{ values.service_name }}-alb"
      fieldPath: status.outputs.load_balancer_arn
  port: 80
  protocol: HTTP
  defaultActions:
    - type: fixed-response
      fixedResponse:
        contentType: text/plain
        statusCode: "404"
        messageBody: not found
{% endif %}
