# The two service roles, one per actor, each scoped to the chart's own
# resources by name pattern. Account ids are not known at render time, so
# resource ARNs wildcard the account segment — every other segment (region,
# resource type, this chart's names) stays pinned. Tightening to the exact
# account id is a one-line day-2 edit taught in the README.
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.pipeline_name }}-codebuild-role"
spec:
  region: "{{ values.aws_region }}"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: codebuild.amazonaws.com
        Action: sts:AssumeRole
  inlinePolicies:
    build-permissions:
      Version: "2012-10-17"
      Statement:
        # Build logs land in the project's own CloudWatch group and
        # nowhere else.
        - Sid: WriteBuildLogs
          Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:{{ values.aws_region }}:*:log-group:/aws/codebuild/{{ values.pipeline_name }}-build*"
        # Read the source artifact in, write the build artifact out —
        # this bucket only.
        - Sid: ExchangePipelineArtifacts
          Effect: Allow
          Action:
            - s3:GetObject
            - s3:GetObjectVersion
            - s3:PutObject
          Resource: "arn:aws:s3:::{{ values.artifacts_bucket_name }}/*"
        # GetAuthorizationToken is account-wide by AWS's own design (it
        # cannot be resource-scoped); the push/pull grants are pinned to
        # this pipeline's repository.
        - Sid: EcrLogin
          Effect: Allow
          Action: ecr:GetAuthorizationToken
          Resource: "*"
        - Sid: EcrPushPull
          Effect: Allow
          Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            - ecr:PutImage
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
          Resource: "arn:aws:ecr:{{ values.aws_region }}:*:repository/{{ values.pipeline_name }}"
---
apiVersion: aws.planton.dev/v1
kind: AwsIamRole
metadata:
  name: "{{ values.pipeline_name }}-codepipeline-role"
spec:
  region: "{{ values.aws_region }}"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: codepipeline.amazonaws.com
        Action: sts:AssumeRole
  inlinePolicies:
    pipeline-permissions:
      Version: "2012-10-17"
      Statement:
        # Stage-to-stage artifact ferrying in the chart's own bucket.
        - Sid: ManagePipelineArtifacts
          Effect: Allow
          Action:
            - s3:GetObject
            - s3:GetObjectVersion
            - s3:PutObject
            - s3:GetBucketVersioning
          Resource:
            - "arn:aws:s3:::{{ values.artifacts_bucket_name }}"
            - "arn:aws:s3:::{{ values.artifacts_bucket_name }}/*"
        # Fetch source through the connection the user authorized — this
        # exact connection, nothing broader.
        - Sid: UseSourceConnection
          Effect: Allow
          Action: codestar-connections:UseConnection
          Resource: "{{ values.connection_arn }}"
        # Start and observe this chart's build project only.
        - Sid: RunBuild
          Effect: Allow
          Action:
            - codebuild:StartBuild
            - codebuild:BatchGetBuilds
          Resource: "arn:aws:codebuild:{{ values.aws_region }}:*:project/{{ values.pipeline_name }}-build"
{% if values.ecs_deploy_enabled | bool %}
        # The ECS rolling-deploy action: register the new task definition
        # revision and roll the service to it. Describes are read-only;
        # the mutating grants are what the deploy IS. iam:PassRole is how
        # the new revision keeps its task/execution roles — scoped to
        # ecs-tasks so this role can never pass roles to anything else.
        - Sid: DeployToEcs
          Effect: Allow
          Action:
            - ecs:DescribeServices
            - ecs:DescribeTaskDefinition
            - ecs:RegisterTaskDefinition
            - ecs:UpdateService
            - ecs:ListTasks
            - ecs:DescribeTasks
          Resource: "*"
        - Sid: PassTaskRoles
          Effect: Allow
          Action: iam:PassRole
          Resource: "*"
          Condition:
            StringEqualsIfExists:
              iam:PassedToService: ecs-tasks.amazonaws.com
{% endif %}
