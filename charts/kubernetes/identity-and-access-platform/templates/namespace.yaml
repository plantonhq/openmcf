# The platform's shared home. One resource OWNS the namespace and every
# tenant JOINS it (createNamespace stays false on the database, Keycloak,
# OpenFGA, and OpenBao) — two resources claiming the same namespace would
# collide with AlreadyExists at deploy time, and modeling the namespace as
# its own first-class resource gives every tenant a structural
# created-before-used edge: they reference this resource's name.
#
# Co-location of the whole triad in ONE namespace is load-bearing three
# times over, not a tidiness choice: Keycloak and OpenFGA both read their
# database password through secretKeyRefs, which can only reach Secrets in
# the workload's own namespace (the operator maintains that credential
# Secret beside the database), and the Keycloak operator's default
# namespaced watch means the Keycloak declaration must live beside the
# operator — one namespace satisfies all three constraints at once.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-identity-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
