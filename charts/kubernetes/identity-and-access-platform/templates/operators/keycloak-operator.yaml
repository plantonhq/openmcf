{% if values.install_keycloak_operator | bool %}
# The Keycloak operator — the engine that reconciles this chart's Keycloak
# declaration into a StatefulSet with clustering, Services, and the
# generated first-admin credential. Unlike the CNPG operator it JOINS the
# platform's own namespace, deliberately: the operator's default watch is
# NAMESPACED (it reconciles only Keycloak declarations beside it), which is
# what lets several isolated identity stacks coexist on one cluster — each
# namespace carries its own operator+Keycloak pair, and none of them needs
# cluster-wide RBAC. Every resource the bundle installs is fixed-name
# upstream, so exactly ONE operator fits per namespace.
#
# Set the toggle false only when a CLUSTER-WIDE Keycloak operator is
# already resident (rare — upstream's cluster-wide variant); the namespaced
# default of a resident operator in another namespace can NOT see this
# chart's declaration.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKeycloakOperator
metadata:
  name: "{{ values.env }}-keycloak-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-identity-ns"
  createNamespace: false
{% endif %}
