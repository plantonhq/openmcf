# OpenFGA — the fine-grained authorization engine (Zanzibar-style
# relationship tuples): "can user X do Y on Z" answered at request time,
# for every application that outgrows role checks. Stateless servers over
# the shared PostgreSQL; schema migrations run as an init container in
# every pod, so the deploy carries no hook Jobs.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenFga
metadata:
  name: "{{ values.env }}-openfga"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the database password below rides a
  # secretKeyRef, which can only reach Secrets in this namespace (see
  # namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-identity-ns"
  createNamespace: false
  datastore:
    postgres:
      # Host and password by reference (the -rw Service; the
      # operator-maintained `<db>-app` Secret's `password` key — the
      # selector's own default, so only the name is declared). The
      # username is a plain-string field by the spec's contract, honest
      # here because database.yaml declares the same `identity` owner
      # role — both sides render from one literal this chart controls.
      host:
        valueFrom:
          name: "{{ values.env }}-identity-db"
      # Bootstrapped by the database's post_init_sql — see database.yaml.
      database: openfga
      username: identity
      passwordSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-identity-db"
  authn:
    # Authentication ON by default — an unauthenticated OpenFGA lets
    # anything that reaches its Service read and write every
    # authorization decision in the platform. The key is a MUST-CHANGE
    # parameter; the module materializes it into the `<name>-authn-keys`
    # Secret, so only the Secret NAME ever renders into chart values.
    preshared:
      keys:
        - "{{ values.openfga_preshared_api_key }}"
