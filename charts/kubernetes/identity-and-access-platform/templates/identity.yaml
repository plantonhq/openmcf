# Keycloak — the identity provider: OIDC single sign-on, user federation,
# and the admin console, reconciled by the operator declared beside it.
# The operator generates the first-admin credential into the
# `<name>-initial-admin` Secret (username "temp-admin") — a BOOTSTRAP
# credential that seeds the first login and nothing after; durable admin
# users are created inside Keycloak.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKeycloak
metadata:
  name: "{{ values.env }}-keycloak"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_keycloak_operator | bool %}
  relationships:
    # The Keycloak declaration is a custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly; it goes with
    # the toggle for the same reason as the database's CNPG edge.
    - kind: KubernetesKeycloakOperator
      name: "{{ values.env }}-keycloak-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database AND the
  # operator live in. Co-location is load-bearing twice: the database
  # credentials below ride secretKeyRefs (namespace-local by Kubernetes
  # design), and the operator's namespaced watch only reconciles
  # declarations beside it (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-identity-ns"
  createNamespace: false
  instances: {{ values.keycloak_instances }}
  db:
    vendor: postgres
    # The three-seam wiring into the database, entirely by reference:
    # host resolves the -rw Service (always the current primary), and
    # both credential selectors resolve the operator-maintained
    # `<db>-app` Secret — its `username` key carries the bootstrap owner
    # role, its `password` key the credential, both maintained across
    # failovers and never rendered into the manifest. Each reference
    # rides its field's annotated composition key, so kind and fieldPath
    # are deliberately omitted.
    host:
      valueFrom:
        name: "{{ values.env }}-identity-db"
    # Bootstrapped at the database's initdb — see database.yaml.
    database: keycloak
    usernameSecret:
      name:
        valueFrom:
          name: "{{ values.env }}-identity-db"
      key: username
    passwordSecret:
      name:
        valueFrom:
          name: "{{ values.env }}-identity-db"
      key: password
  http:
    # Plain HTTP on the pod, TLS at the front door: this platform's
    # exposure composes from first-class kinds (ingress / Gateway API)
    # that terminate TLS before traffic reaches Keycloak — the posture
    # proxy_headers below pairs with. In-cluster TLS end-to-end is a
    # day-2 values change (http.tlsSecretName referencing a
    # KubernetesCertificate) once cert-manager is present.
    httpEnabled: true
  hostname:
    # The public base URL — a FULL URL with scheme, deliberately: the
    # server refuses to start with a bare hostname whenever
    # hostname-admin or backchannel-dynamic enter the picture (verified
    # live), so the full-URL form is the shape that never bites later.
    # Strict hostname resolution (the server default) stays on — tokens
    # and redirects are issued for exactly this URL.
    hostname: "{{ values.keycloak_hostname }}"
  # The reverse proxy in front (the composed ingress/Gateway) sets
  # X-Forwarded-* headers; without this, redirect URIs and issuer URLs
  # are built from pod-local addresses and SSO breaks behind any proxy.
  proxyHeaders: xforwarded
