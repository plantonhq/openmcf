params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this chart deploys onto. When set, every resource in the chart
      carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty to
      deploy onto the environment's default Kubernetes connection — the right
      choice when the environment maps one-to-one to a cluster.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the whole stack lives in — the database AND the
      Temporal server together, deliberately: Temporal reads the database
      password through a secretKeyRef, and a secretKeyRef can only read
      Secrets in the workload's own namespace, so co-location is the design,
      not a convenience. Change it to run a second independent Temporal
      stack on the same cluster.
    value: temporal

  - name: install_cnpg_operator
    type: bool
    description: >
      Installs the CloudNativePG operator (the engine that reconciles the
      database) into cnpg-system. The operator is a one-per-cluster
      singleton — its Helm release name, cluster-scoped CRDs, and webhook
      identity are fixed upstream, so a second installation fights the
      first. Keep true on a cluster that does not run CloudNativePG yet;
      set false on operator-ready clusters (any cluster provisioned by a
      full-stack platform chart already runs it), and the resident operator
      reconciles this chart's database instead.
    value: true

  # ── Database sizing ──────────────────────────────────────────────────────
  - name: postgres_instances
    description: >
      Number of PostgreSQL instances: one primary plus the rest as streaming
      replicas with automated failover. 2 (default) is the floor for a
      database that survives node loss — Temporal keeps every workflow's
      state here, so the database's availability IS the platform's
      availability. 3 is the production convention (failover capacity even
      during maintenance); 1 is a single point of failure for evaluation
      only.
    value: "2"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes quantity,
      e.g. "10Gi"). Temporal's footprint grows with open workflows and
      retained closed histories — retention (below) is what bounds it.
      Grows are applied in place when the storage class supports expansion;
      shrinks are rejected.
    value: 10Gi

  # ── Temporal server ──────────────────────────────────────────────────────
  - name: history_shards
    description: >
      Number of history shards — Temporal's parallelism ceiling. IMMUTABLE:
      the value is baked into the database schema at first install and
      CANNOT ever be changed without a full cluster migration, so pick for
      the load you will grow into, not the one you start with. 512 (the
      upstream default) is safe for most production workloads; more shards
      raise throughput ceilings at the cost of per-shard overhead.
    value: "512"

  - name: temporal_namespaces
    type: list
    description: >
      Temporal namespaces to create declaratively after install — the
      logical isolation unit workflows execute inside (not Kubernetes
      namespaces). Declare at least one or every client would first need a
      manual create; each entry becomes an idempotent namespace-create Job.
    value:
      - default

  - name: namespace_retention
    description: >
      Workflow-execution retention applied to every namespace declared
      above — how long CLOSED workflow histories stay queryable before
      deletion (duration with a d/h/m suffix). 3d is Temporal's default;
      raise it when auditability outweighs database growth, or configure
      archival as the long-term answer (see the README's day-2 notes).
    value: 3d

  - name: web_ui_enabled
    type: bool
    description: >
      Deploys the Temporal Web UI — workflow inspection, history browsing,
      and namespace administration over HTTP. The UI is read-mostly and
      stateless; workflows are driven through the frontend gRPC API either
      way. Turn off only for headless installations driven purely by SDKs
      and the CLI.
    value: true

  - name: service_monitor_enabled
    type: bool
    description: >
      Emits Prometheus metrics via ServiceMonitor resources, one per
      Temporal server service. Requires the Prometheus Operator CRDs on the
      cluster (an observability stack chart provides them) — the deploy
      FAILS without them, which is why this defaults off. Without it, pods
      still carry prometheus.io scrape annotations for annotation-based
      collection.
    value: false
