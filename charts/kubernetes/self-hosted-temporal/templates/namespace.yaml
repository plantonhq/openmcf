# The stack's shared home. One resource OWNS the namespace and both tenants
# JOIN it (createNamespace stays false on the database and the server) — two
# resources claiming the same namespace would collide with AlreadyExists at
# deploy time, and modeling the namespace as its own first-class resource
# gives both tenants a structural created-before-used edge: they reference
# this resource's name.
#
# Co-location of the database and the server in ONE namespace is the
# load-bearing design decision of this chart, not a tidiness choice:
# Temporal reads the database password through a secretKeyRef, and a
# secretKeyRef can only read Secrets in the workload's own namespace. The
# operator maintains that credential Secret beside the database; Temporal
# must live where the Secret lives.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-temporal-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
