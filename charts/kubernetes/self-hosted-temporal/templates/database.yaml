# The PostgreSQL cluster backing Temporal — reconciled by CloudNativePG into
# a primary plus streaming replicas with automated failover. Applications
# (here: Temporal) connect through the operator-maintained -rw Service,
# which re-points to the new primary after a failover; the application
# credential lives in the operator-maintained `<name>-app` Secret. Both
# handles flow into the Temporal resource BY REFERENCE, so the wiring can
# never drift.
#
# TWO DATABASES, ONE BOOTSTRAP — the exact composition Temporal documents:
# initdb creates `temporal` owned by the `temporal` role, and one line of
# post_init_sql (run once as superuser, right after initdb) creates
# `temporal_visibility` under the same owner. Ownership of both databases
# gives Temporal's schema Jobs everything they need with NO create-database
# grant — the least-privilege shape (the Temporal resource keeps
# createDatabases off accordingly).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-temporal-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_cnpg_operator | bool %}
  relationships:
    # The database is a CloudNativePG custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator is
    # already running, and ordering against it is not this chart's to
    # declare.
    - kind: KubernetesCloudNativePgOperator
      name: "{{ values.env }}-cnpg-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-temporal-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # The default store. The owner role is named explicitly (rather than
      # inheriting the database name) because temporal.yaml declares the
      # same value as its database username — both sides render from the
      # same well-known literal, which is what keeps a plain-string
      # username field honest.
      database: temporal
      owner: temporal
      postInitSql:
        # The visibility store — Temporal's search index. CREATE DATABASE
        # cannot run inside the application database's own session, which
        # is why this rides post_init_sql (superuser, against `postgres`)
        # and not post_init_application_sql.
        - CREATE DATABASE temporal_visibility OWNER temporal;
