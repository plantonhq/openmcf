# Temporal — the durable workflow engine: the four server services
# (frontend, history, matching, worker), the Web UI, an admin-tools pod,
# and the schema Jobs that prepare both databases before the server starts.
# Nothing is bundled: every byte of workflow state lives in the PostgreSQL
# cluster declared beside it (database.yaml).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTemporal
metadata:
  name: "{{ values.env }}-temporal"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database lives in.
  # Co-location is load-bearing: the database password below is read
  # through a secretKeyRef, which can only reach Secrets in this
  # namespace (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-temporal-ns"
  createNamespace: false
  database:
    postgres:
      # The three-seam wiring into the database, entirely by reference:
      # host resolves the -rw Service (always the current primary), and
      # the password Secret name resolves the operator-maintained
      # `<db>-app` credential Secret — maintained across failovers, never
      # rendered into values. Each reference rides its field's annotated
      # composition key, so kind and fieldPath are deliberately omitted.
      host:
        valueFrom:
          name: "{{ values.env }}-temporal-db"
      # The bootstrap owner role declared in database.yaml — a plain-string
      # field by the spec's contract, honest here because BOTH sides render
      # from the same literal this chart controls. Owning both databases
      # gives the schema Jobs full DDL rights with no CREATEDB grant.
      username: temporal
      passwordSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-temporal-db"
    # createDatabases stays off (the spec default): both stores already
    # exist from the database's bootstrap, and the temporal role never
    # needs create-database privileges. The database_name /
    # visibility_database_name defaults ("temporal" / "temporal_visibility")
    # match the bootstrap exactly — restating them here would only create a
    # second place for the contract to drift.
  # IMMUTABLE once deployed — baked into the schema at first install (see
  # the parameter's description; changing it later means a full cluster
  # migration).
  numHistoryShards: {{ values.history_shards }}
{% if values.web_ui_enabled | bool %}
  webUi:
    enabled: true
{% else %}
  # Headless installation: SDK- and CLI-driven only. Rendered explicitly
  # (rather than omitting the block) because the field's own default is
  # true.
  webUi:
    enabled: false
{% endif %}
  # One namespace-create Job per entry, idempotent — workflows execute
  # inside a TEMPORAL namespace (a logical isolation unit in the server,
  # unrelated to Kubernetes namespaces).
  temporalNamespaces:
{% for ns in values.temporal_namespaces %}
    - name: "{{ ns }}"
      retention: "{{ values.namespace_retention }}"
{% endfor %}
{% if values.service_monitor_enabled | bool %}
  # One ServiceMonitor per server service. Only rendered on demand: the
  # Prometheus Operator CRDs must exist on the cluster or the deploy fails
  # — the parameter description carries the warning.
  serviceMonitorEnabled: true
{% endif %}
