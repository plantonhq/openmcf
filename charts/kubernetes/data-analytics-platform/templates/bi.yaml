# Superset — the BI layer: the web app, a Celery worker for async
# queries and scheduled reports, and the init Job that migrates the
# metadata schema and bootstraps the admin user. Secured by default: the
# admin password, the SECRET_KEY (which encrypts stored datasource
# credentials), and the websocket JWT are all generated by the component
# into Secrets — the upstream admin/admin default never ships, and no
# credential appears in rendered values.
#
# After deployment, add Trino as a Superset database connection to chart
# the warehouse — the README's after-deployment section carries the exact
# connection string.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSuperset
metadata:
  name: "{{ values.env }}-superset"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database and cache
  # live in. Co-location is load-bearing: both passwords below are read
  # from Secrets at deploy time, and Secrets are only readable from the
  # workload's own namespace (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
  metadataDatabase:
    # The same three-seam reference wiring as Airflow's (see
    # orchestration.yaml): host → the -rw Service, password Secret → the
    # operator-maintained `<db>-app` credential, both by annotated
    # composition key. The database_name default ("superset") matches the
    # bootstrap in database.yaml exactly — restating it would only create
    # a second place for the contract to drift.
    host:
      valueFrom:
        name: "{{ values.env }}-analytics-db"
    username: analytics
    passwordSecret:
      secretName:
        valueFrom:
          name: "{{ values.env }}-analytics-db"
  cache:
    # The cache is REQUIRED here by design, not preference: Superset's
    # async worker (scheduled reports, long queries) refuses to run
    # without one, and this chart ships the worker on. Host and password
    # Secret resolve the cache's outputs by reference.
    host:
      valueFrom:
        name: "{{ values.env }}-analytics-cache"
    # The cache's auth Secret keys entries BY ACL USERNAME (one key per
    # user — see cache.yaml), so both the username AND the Secret key are
    # "default" here. The secretKey is set explicitly because this
    # field's own default ("password") describes generic existing
    # Secrets, not the Valkey auth-Secret shape — leaving it unset would
    # deploy cleanly and then fail authentication at runtime.
    username: default
    passwordSecret:
      secretName:
        valueFrom:
          name: "{{ values.env }}-analytics-cache"
      secretKey: default
