# The PostgreSQL cluster backing the whole platform — reconciled by
# CloudNativePG into a primary plus streaming replicas with automated
# failover. Applications connect through the operator-maintained -rw
# Service, which re-points to the new primary after a failover; the
# application credential lives in the operator-maintained `<name>-app`
# Secret. Both handles flow into Airflow, Trino and Superset BY REFERENCE,
# so the wiring can never drift.
#
# THREE DATABASES, ONE OWNER, ONE BOOTSTRAP: initdb creates `warehouse`
# (the analytics store Trino queries and pipelines land tables into) owned
# by the `analytics` role, and two lines of post_init_sql (run once as
# superuser, right after initdb) create `airflow` and `superset` — each
# consumer's metadata database, under the SAME owner. One owner role is
# deliberate: the operator maintains exactly one application credential
# Secret (`<name>-app`, the initdb owner's), and every consumer reads its
# password from that one Secret by reference — three role passwords would
# leave two of them without a maintained Secret to reference. Ownership of
# all three databases gives each consumer's migration jobs full DDL rights
# with NO create-database grant — the least-privilege shape.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-analytics-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_cnpg_operator | bool %}
  relationships:
    # The database is a CloudNativePG custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator is
    # already running, and ordering against it is not this chart's to
    # declare.
    - kind: KubernetesCloudNativePgOperator
      name: "{{ values.env }}-cnpg-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # The warehouse — where pipelines land tables and Trino's catalog
      # points. The owner role is named explicitly (rather than inheriting
      # the database name) because orchestration.yaml, query.yaml and
      # bi.yaml all declare the same value as their database username —
      # every side renders from the same well-known literal, which is what
      # keeps a plain-string username field honest.
      database: warehouse
      owner: analytics
      postInitSql:
        # The consumers' metadata databases. CREATE DATABASE cannot run
        # inside the application database's own session, which is why
        # these ride post_init_sql (superuser, against `postgres`) and not
        # post_init_application_sql. The names match the consumers' own
        # database_name defaults ("airflow", "superset") — the templates
        # deliberately do not restate them.
        - CREATE DATABASE airflow OWNER analytics;
        - CREATE DATABASE superset OWNER analytics;
