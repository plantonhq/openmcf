# The platform's shared home. One resource OWNS the namespace and every
# tenant JOINS it (createNamespace stays false everywhere else) — two
# resources claiming the same namespace would collide with AlreadyExists at
# deploy time, and modeling the namespace as its own first-class resource
# gives every tenant a structural created-before-used edge: they reference
# this resource's name.
#
# Co-location of the database, the lake, the cache, and every analytics
# workload in ONE namespace is the load-bearing design decision of this
# chart, not a tidiness choice: Airflow, Trino and Superset all read their
# database and cache passwords through Secret references, and a Secret can
# only be read from the workload's own namespace. The CloudNativePG
# operator maintains the database credential Secret beside the database;
# the consumers must live where the Secrets live.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-analytics-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
