{% if values.install_spark_operator | bool %}
# The Apache Spark Kubernetes operator — the controller that turns
# SparkApplication declarations (your batch and streaming jobs) into
# running Spark drivers and executors. Jobs are the platform's VERBS: this
# chart deploys the engine; you (or Airflow, via its Kubernetes operators)
# submit SparkApplication resources against it after deployment — the
# README's after-deployment section runs the first one.
#
# The operator JOINS the platform's namespace (it is part of this stack's
# compute story) but watches the WHOLE cluster: the workload namespace
# list is deliberately left empty. Listing namespaces would make the
# operator's chart CREATE and keep them — colliding with the first-class
# namespace this chart already owns — and the empty list is upstream's
# normal one-operator-per-cluster posture. Its workload service account
# ("spark", the operator chart's convention) lands in this namespace,
# which is exactly where your SparkApplications reference it.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSparkOperator
metadata:
  name: "{{ values.env }}-spark-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
{% endif %}
