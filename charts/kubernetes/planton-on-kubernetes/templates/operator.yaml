# The Planton operator — the manager that reconciles the platform
# declaration. A one-per-cluster singleton (self-enforced at the
# operator's own startup): install_operator exists precisely so a SECOND
# platform can join a cluster whose operator already runs — flip it false
# and the resident operator reconciles this chart's platform instead.
# The chart pins nothing here beyond the conventional namespace: the
# module's own defaults carry the chart version this catalog release was
# validated against, and the module owns the PlantonPlatform CRD with
# keep-on-uninstall semantics.
{% if values.install_operator | bool %}
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPlantonOperator
metadata:
  name: "{{ values.env }}-planton-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    value: planton-operator
  create_namespace: true
{% endif %}
