# The platform declaration — the chart's centerpiece. Renders only what
# the params decided (version always; ingress and storage when chosen), so
# the operator's own defaulting stays authoritative for everything else:
# the same zero-config posture as a hand-written version-only manifest.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPlantonPlatform
metadata:
  name: "{{ values.env }}-planton"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_operator | bool %}
  relationships:
    # No spec field consumes an operator output (the coupling is the
    # cluster-global CRD contract), so the ordering edge is declared
    # explicitly. Rendered only when this chart installs the operator —
    # on operator-ready clusters (install_operator false) the resident
    # operator reconciles this platform and no edge exists to draw.
    - kind: KubernetesPlantonOperator
      name: "{{ values.env }}-planton-operator"
      type: depends_on
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-planton-ns"
  version: "{{ values.version }}"
{% if values.ingress_enabled | bool %}
  ingress:
    enabled: true
{% if values.hostname != "" %}
    # The identity server bakes this URL into its realm at first boot —
    # set it before the first sign-in.
    hostname: "{{ values.hostname }}"
{% endif %}
{% if values.cert_cluster_issuer != "" %}
    tls:
      issuer:
        name: "{{ values.cert_cluster_issuer }}"
        kind: ClusterIssuer
{% endif %}
{% endif %}
{% if values.storage_class != "" or values.storage_size != "" %}
  storage:
{% if values.storage_class != "" %}
    storage_class_name: "{{ values.storage_class }}"
{% endif %}
{% if values.storage_size != "" %}
    size: "{{ values.storage_size }}"
{% endif %}
{% endif %}
