# The platform's home. One resource OWNS the namespace and the platform
# JOINS it (create_namespace stays false on the platform declaration) —
# modeling the namespace as its own first-class resource gives the
# platform a structural created-before-used edge: it references this
# resource's name. The operator's namespace is NOT this chart's to own
# the same way — the operator template creates its conventional
# planton-operator namespace itself (create_namespace: true), because a
# cluster-singleton manager outlives any one platform's chart.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-planton-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
