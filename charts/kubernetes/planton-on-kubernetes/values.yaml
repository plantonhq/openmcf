params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this chart deploys onto. When set, every resource in the
      chart carries it as an explicit connection annotation, overriding
      the environment- and organization-level default connections. Leave
      empty to deploy onto the environment's default Kubernetes
      connection — the right choice when the environment maps one-to-one
      to a cluster.
    value: ""

  # ── The one required choice ──────────────────────────────────────────────
  - name: version
    description: >
      The Planton platform version to deploy — pins the control plane,
      console, and runner images as one coherent line. The chart's
      default is the line this chart release was validated against.
      Upgrading a running platform is a deliberate act: change this value
      and redeploy.
    value: v0.0.40-selfhosted-preview

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the platform lives in — every platform
      workload, Service, Secret, and volume, named from the platform
      resource. Change it (together with the platform's local port, when
      port-forwarding) to run a SECOND independent Planton on the same
      cluster: one operator serves them all.
    value: planton

  - name: install_operator
    type: bool
    description: >
      Installs the Planton operator (the manager that reconciles the
      platform declaration) into planton-operator. A one-per-cluster
      singleton — set false when the cluster already runs it (a second
      platform joining a cluster, a GitOps-managed operator) and the
      resident operator reconciles this chart's platform instead.
    value: true

  # ── Exposure (optional — the port-forward gateway is the default door) ───
  - name: ingress_enabled
    type: bool
    description: >
      Exposes the platform through the cluster's ingress controller.
      False (the default) keeps the zero-config door: the built-in
      gateway over a single kubectl port-forward, with the exact command
      published as a deploy output.
    value: false

  - name: hostname
    description: >
      The platform's hostname (e.g. "planton.example.com") — one hostname
      serves console AND API. The identity server bakes this URL into its
      realm at first boot, so set it BEFORE the first sign-in. Leave
      empty with ingress enabled to let the operator derive a working
      URL from the ingress controller's published address (magic DNS).
    value: ""

  - name: cert_cluster_issuer
    description: >
      Name of a cert-manager ClusterIssuer that issues the platform's
      HTTPS certificate. Requires a hostname. Leave empty for plain HTTP
      (or when TLS terminates in front of the cluster — configure that
      through the platform resource's ingress annotations instead).
    value: ""

  # ── Storage (optional — the cluster's default StorageClass otherwise) ────
  - name: storage_class
    description: >
      StorageClass for every persistent volume the platform creates
      (databases, cache, workflow engine, secrets manager, runner state).
      Leave empty for the cluster's default class — the operator verifies
      the default can actually provision before deploying, and its status
      explains any storage problem in plain language.
    value: ""

  - name: storage_size
    description: >
      Volume size applied platform-wide (a Kubernetes quantity like
      "20Gi"). Leave empty for each component's built-in default. Built
      for storage backends that enforce minimum volume sizes — one value
      lifts every volume above the floor.
    value: ""
