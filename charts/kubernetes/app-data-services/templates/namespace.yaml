# The application's namespace — owned by this chart's data layer, joined by
# the database and cache (createNamespace stays false on both), and the
# home your application deploys into. One owner per namespace is the
# collision rule (two claimants race to AlreadyExists at deploy time), and
# the first-class resource gives both tenants a structural
# created-before-used edge: they reference this resource's name.
#
# The data layer lives in the APP'S namespace — not a shared "data"
# namespace — because credentials arrive as Kubernetes Secrets and a
# workload can only read Secrets in its own namespace: co-location is what
# lets the app consume the operator-managed database credential and the
# cache's auth Secret directly.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-{{ values.namespace }}-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
