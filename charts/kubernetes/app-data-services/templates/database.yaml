# The application's PostgreSQL database — reconciled by the cluster's
# RESIDENT CloudNativePG operator into a real cluster with streaming
# replication and automated failover (when instances > 1). This chart
# deliberately installs NO operator: the operator is one-per-cluster
# infrastructure (any cluster provisioned by a full-stack platform chart
# already runs it), while databases are per-app — that split is the whole
# operator-aware model this chart rides. The README states the
# prerequisite plainly.
#
# Your app connects through the operator-maintained -rw Service (always
# the current primary) with the credential from the `<name>-app` Secret —
# both exported as outputs; the Secret also carries ready-made `uri` and
# `jdbc-uri` connection strings.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-{{ values.namespace }}-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the app namespace this chart owns — the reference is the
  # created-before-used ordering edge.
  namespace:
    valueFrom:
      name: "{{ values.env }}-{{ values.namespace }}-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # One database, owned by a role of the same name (the operator's
      # convention) — the app authenticates as this user with the
      # operator-generated password from the credential Secret.
      database: "{{ values.database_name }}"
