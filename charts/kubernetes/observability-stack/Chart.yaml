apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: Kubernetes Observability Stack
spec:
  selector:
    kind: platform
  description: A complete, self-hosted observability platform on your own cluster — Prometheus metrics with curated alerts, Loki logs, Tempo traces with service graphs, Grafana wired to all three, and OpenTelemetry collection from every node and application, deployed in one run.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/kubernetes/kuberneteskubeprometheusstack/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/kubernetes/observability-stack
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/kubernetes/observability-stack/README.md
