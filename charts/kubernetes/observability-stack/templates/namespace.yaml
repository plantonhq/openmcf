# The stack's shared home. One resource OWNS the namespace and everything
# else JOINS it (createNamespace stays false on every component) — two
# resources claiming the same namespace would collide with AlreadyExists at
# deploy time. Modeling the namespace as its own first-class resource also
# gives every component a structural created-before-used edge: they all
# reference this resource's name.
#
# "observability" is deliberately a fixed name, not a parameter: the
# collectors compose Loki's and Tempo's in-cluster DNS endpoints from it at
# render time, and one stack per cluster needs exactly one good answer.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-observability-ns"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: observability
