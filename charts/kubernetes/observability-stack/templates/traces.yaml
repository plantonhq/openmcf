# Tempo — the trace store, single-binary on a persistent volume. Traces
# arrive from the OTLP gateway (collection.yaml); Grafana queries them by
# TraceQL over Tempo's HTTP endpoint.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTempo
metadata:
  name: "{{ values.env }}-tempo"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # Tempo's ServiceMonitor is a Prometheus-operator custom resource — the
    # stack's CRDs must exist first. Declared even though the metrics
    # generator (when enabled) also references the stack: the ServiceMonitor
    # need holds in EVERY variant, including metrics-generator-off.
    - kind: KubernetesKubePrometheusStack
      name: "{{ values.env }}-metrics"
      type: depends_on
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  # Hours or minutes only — Tempo's retention has no day unit.
  retention: "{{ values.tempo_retention }}"
{% if values.tempo_metrics_generator_enabled | bool %}
  # Turns traces into service graphs and RED metrics, pushed into this
  # stack's Prometheus. The push contract has two halves: this block, and
  # enableRemoteWriteReceiver on the stack (metrics.yaml) — one toggle
  # drives both. The URL resolves the stack's prometheus_endpoint output at
  # deploy time (the modules append the standard /api/v1/write path).
  metricsGenerator:
    enabled: true
    remoteWriteUrl:
      valueFrom:
        name: "{{ values.env }}-metrics"
{% endif %}
  serviceMonitorEnabled: true
