# Grafana — the stack's face, wired to all three signal backends at deploy
# time. The Prometheus datasource rides its field's annotated composition
# key; the Loki and Tempo datasources name their kinds and output paths
# explicitly — deliberate, designed usage: the field's default points at a
# metrics stack, and these two entries redirect it to the log and trace
# stores' endpoint outputs.
#
# Dashboards arrive by composition, not configuration: the sidecar (on by
# default in the component) loads any ConfigMap labeled grafana_dashboard: "1"
# from anywhere in the cluster — teams ship dashboards next to their own
# workloads without ever touching this resource.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGrafana
metadata:
  name: "{{ values.env }}-grafana"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  # Persistent: user-created dashboards and Grafana's own state survive pod
  # restarts. The admin credential is module-generated into a Kubernetes
  # Secret (the component's admin_secret_name output says where).
  storage:
    size: 10Gi
  datasources:
    - name: Prometheus
      # type defaults to "prometheus"; the URL resolves the stack's
      # prometheus_endpoint output — the annotated composition key.
      isDefault: true
      url:
        valueFrom:
          name: "{{ values.env }}-metrics"
    - name: Loki
      type: loki
      url:
        valueFrom:
          # Explicit kind + fieldPath: redirecting this entry to the log
          # store's gateway endpoint (the URL Grafana loki datasources read
          # from, per that output's own contract).
          kind: KubernetesLoki
          name: "{{ values.env }}-loki"
          fieldPath: status.outputs.gateway_endpoint
    - name: Tempo
      type: tempo
      url:
        valueFrom:
          # Tempo's HTTP (TraceQL) endpoint output.
          kind: KubernetesTempo
          name: "{{ values.env }}-tempo"
          fieldPath: status.outputs.http_endpoint
{% if values.grafana_root_url != "" %}
  server:
    # Required for correct redirects/cookies once Grafana is exposed —
    # set together with the ingress/gateway that exposes it.
    rootUrl: "{{ values.grafana_root_url }}"
{% endif %}
  # Let this Prometheus watch Grafana itself.
  serviceMonitorEnabled: true
