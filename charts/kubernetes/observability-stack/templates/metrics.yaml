# kube-prometheus-stack — the metrics backbone: the Prometheus Operator, a
# Prometheus sized and retained by the params, kube-state-metrics and the
# node exporter, and the chart's curated Kubernetes alert rules. Every other
# component in this stack ships a ServiceMonitor that THIS Prometheus
# discovers automatically (its discovery posture watches all monitors — the
# catalog-wide composition contract), so the stack monitors itself with no
# extra wiring.
#
# The stack's bundled Grafana is deliberately disabled: dashboards.yaml
# composes the first-class KubernetesGrafana instead, wired to Prometheus,
# Loki, AND Tempo — the bundled one would only know about metrics.
#
# NAMING: the resource name feeds every child object name and the modules
# enforce a 26-character budget on it ("<env>-metrics" fits for any env up to
# 18 characters — keep environment slugs short).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKubePrometheusStack
metadata:
  name: "{{ values.env }}-metrics"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      # Joins the namespace owned by namespace.yaml; the reference also
      # orders namespace-before-stack structurally.
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  prometheus:
    retention: "{{ values.metrics_retention }}"
    diskSize: "{{ values.metrics_disk_size }}"
{% if values.cluster_name != "" %}
    # Stamped onto every collected series — what keeps this cluster's
    # metrics distinguishable when they later meet other clusters' data.
    externalLabels:
      cluster: "{{ values.cluster_name }}"
{% endif %}
{% if values.tempo_metrics_generator_enabled | bool %}
    # The receiving half of Tempo's metrics generator (traces.yaml): the
    # generator remote-writes service-graph and span metrics here. One
    # toggle drives both sides so they can never drift apart.
    enableRemoteWriteReceiver: true
{% endif %}
  alertmanager:
    enabled: {{ values.alertmanager_enabled }}
{% if values.managed_control_plane | bool %}
  # Managed-cloud posture (EKS/GKE/AKS): the controller-manager, scheduler,
  # etcd, and (on most managed platforms) kube-proxy are inside the
  # provider's control plane and can never be scraped. Leaving these on
  # ships permanently-down targets and alerts that can never recover — so
  # the scrapers AND their matching rule groups go together.
  controlPlaneScrapers:
    kubeControllerManager: false
    kubeEtcd: false
    kubeScheduler: false
    kubeProxy: false
  defaultRules:
    disabledGroups:
      - etcd
      - kubeControllerManager
      - kubeSchedulerAlerting
      - kubeSchedulerRecording
      - kubeProxy
{% endif %}
  grafana:
    # The bundled Grafana is off — dashboards.yaml composes the first-class
    # KubernetesGrafana wired to all three signal backends.
    enabled: false
