params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this stack deploys onto. When set, every resource in the chart
      carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty to
      deploy onto the environment's default Kubernetes connection. Deploy one
      stack per cluster — Prometheus's control-plane scrape targets and the
      cluster-logs collector are per-cluster by nature.
    value: ""

  - name: cluster_name
    description: >
      Label stamped onto every metric this Prometheus collects (the "cluster"
      external label). Worth setting from day one even on a single cluster:
      when a second cluster's metrics later land in shared dashboards or a
      central store, unlabeled series from different clusters are
      indistinguishable — and the label cannot be added to data
      retroactively. Empty = no cluster label.
    value: ""

  # ── Metrics (kube-prometheus-stack) ──────────────────────────────────────
  - name: metrics_retention
    description: >
      How long Prometheus keeps metrics on disk (e.g. "15d", "30d", "12w").
      Size it together with metrics_disk_size — retention hitting the disk
      ceiling evicts data earlier than this setting promises.
    value: 15d

  - name: metrics_disk_size
    description: >
      Prometheus's persistent volume size (e.g. "50Gi"). The main cost lever
      of the stack: sizing follows series count x scrape interval x
      retention. 50Gi comfortably carries a mid-size cluster at 15d
      retention; grow it before growing retention.
    value: 50Gi

  - name: alertmanager_enabled
    type: bool
    description: >
      Deploys Alertmanager for alert routing and delivery (the chart's
      curated Kubernetes alert rules fire into it). Turn off only when
      alerts are delivered by an external system that scrapes or federates
      this Prometheus.
    value: true

  - name: managed_control_plane
    type: bool
    description: >
      Managed-cloud posture (EKS/GKE/AKS — the default): the
      controller-manager, scheduler, etcd, and kube-proxy live inside the
      provider's control plane and can never be scraped, so their scrape
      targets AND their alert rule groups are disabled — otherwise the stack
      ships permanently-down targets with alerts that can never recover or
      fire truthfully. Set false on self-managed clusters (kubeadm, k3s,
      on-prem) where those components are reachable and SHOULD be watched.
    value: true

  # ── Dashboards (Grafana) ─────────────────────────────────────────────────
  - name: grafana_root_url
    description: >
      The public URL Grafana believes it is served at (e.g.
      "https://grafana.example.com") — required for correct redirect and
      cookie behavior the moment it is exposed through an ingress or
      gateway. Empty until then; set it together with the exposure.
    value: ""

  # ── Logs (Loki) ──────────────────────────────────────────────────────────
  - name: loki_retention
    description: >
      How long Loki keeps logs before asynchronous deletion (hours or days,
      e.g. "744h", "30d"). Empty would keep logs forever — this chart
      defaults to 30 days as an explicit, production-sane choice.
    value: 30d

  - name: loki_chunks_cache_memory_mb
    description: >
      Memory (MB) for Loki's chunks cache — the biggest memory consumer
      after Loki itself. The upstream chart default is 8192, which requests
      ~9.8Gi of container memory (1.2x factor) and simply never schedules on
      nodes with less than ~10Gi allocatable: the pod stays Pending and the
      atomic install rolls the whole release back. This chart defaults to
      1024 (a ~1.2Gi request) — plenty for small-to-mid query loads; raise
      it as query volume grows and nodes allow.
    value: "1024"

  - name: loki_results_cache_memory_mb
    description: >
      Memory (MB) for Loki's query-results cache (chart default 1024, again
      sized for production log volume). 256 serves small-to-mid clusters;
      raise together with chunks cache as dashboards and query load grow.
    value: "256"

  # ── Traces (Tempo) ───────────────────────────────────────────────────────
  - name: tempo_retention
    description: >
      How long Tempo keeps traces (hours or minutes only — Tempo's retention
      has no day unit; "168h" is 7 days). Traces are the highest-volume,
      shortest-value signal: a week is a generous production default.
    value: 168h

  - name: tempo_metrics_generator_enabled
    type: bool
    description: >
      Tempo derives service graphs and span metrics (RED: rate, errors,
      duration) from the traces it ingests and pushes them into this stack's
      Prometheus — the feature that turns raw traces into the service-map
      and latency dashboards. Enabling it also switches Prometheus's
      remote-write receiver on (the two are one contract; this chart flips
      both sides together).
    value: true

  # ── Collection (OpenTelemetry) ───────────────────────────────────────────
  - name: cluster_logs_enabled
    type: bool
    description: >
      Runs a log-collection agent on every node (an OpenTelemetry Collector
      DaemonSet reading container log files, enriching them with pod/
      namespace metadata, shipping to Loki) — the "own your logs" half of
      the stack's promise. Turn off only if another agent (fluent-bit,
      promtail, a vendor agent) already ships this cluster's logs.
    value: true

  - name: otlp_gateway_replicas
    description: >
      Replicas of the OTLP gateway collector — the stable in-cluster
      endpoint applications send OpenTelemetry logs and traces to. Two is
      the floor for a telemetry path that survives node drains; scale with
      application volume.
    value: "2"
