{% if values.archive_enabled | bool %}
# The workflow-archive database — reconciled by CloudNativePG into a
# primary plus streaming replicas with automated failover. Without an
# archive, workflow history lives only in etcd as Workflow CRs until
# retention prunes it; with one, every completed run outlives its CR and
# the UI serves history from here. The controller connects through the
# operator-maintained -rw Service (always the current primary) and reads
# credentials from the operator-maintained `<name>-app` Secret — both
# flow into the Argo Workflows resource BY REFERENCE, so the wiring can
# never drift.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-gitops-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_cnpg_operator | bool %}
  relationships:
    # The database is a CloudNativePG custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator is
    # already running, and ordering against it is not this chart's to
    # declare.
    - kind: KubernetesCloudNativePgOperator
      name: "{{ values.env }}-cnpg-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-gitops-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # One store, one owner: the archive database, owned by the role the
      # controller connects as. Ownership covers the controller's own
      # table creation (it creates its tables, never the database) with
      # no server-wide privileges.
      database: workflows
      owner: workflows
{% endif %}
