# The platform's shared home. One resource OWNS the namespace and every
# tenant JOINS it (createNamespace stays false on Argo CD, Argo Workflows,
# the database, and the artifact store) — two resources claiming the same
# namespace would collide with AlreadyExists at deploy time, and modeling
# the namespace as its own first-class resource gives every tenant a
# structural created-before-used edge: they reference this resource's name.
#
# Co-location is load-bearing twice: Argo Workflows reads its archive
# database credentials AND its artifact-store keys through Secrets in its
# OWN namespace (the controller resolves both at runtime), and Argo CD is
# a one-per-namespace product (its generated admin Secret has an
# application-fixed name) — one namespace holds exactly one delivery
# platform, and a second platform takes a second namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-gitops-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
