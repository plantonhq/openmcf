params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this chart deploys onto. When set, every resource in the chart
      carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty to
      deploy onto the environment's default Kubernetes connection — the right
      choice when the environment maps one-to-one to a cluster.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the whole platform lives in — Argo CD, Argo
      Workflows, the artifact store, and the archive database together,
      deliberately: the workflow controller reads its artifact keys and
      archive credentials from Secrets in its own namespace, and Argo CD is
      a one-per-namespace product (its generated admin Secret has an
      application-fixed name). Change it to run a second independent
      delivery platform on the same cluster.
    value: gitops

  # ── Durability arms ──────────────────────────────────────────────────────
  - name: artifact_store_enabled
    type: bool
    description: >
      Deploys the in-cluster S3 artifact store (SeaweedFS) and wires Argo
      Workflows to it — steps can pass files, and step logs outlive their
      pods. Off means workflows still run but input/output artifacts and
      archived logs have nowhere to live; point the deployed resource at
      external S3 instead if your artifacts belong in a cloud bucket.
    value: true

  - name: archive_enabled
    type: bool
    description: >
      Deploys the PostgreSQL workflow archive and wires the controller to
      it — completed runs outlive their Workflow objects, and the cluster
      keeps only a small working set of them (the UI serves history from
      the database). Off removes the database AND the retention pruning
      with it: without an archive, the Workflow objects ARE the history.
    value: true

  - name: install_cnpg_operator
    type: bool
    description: >
      Installs the CloudNativePG operator (the engine that reconciles the
      archive database) into cnpg-system. A one-per-cluster singleton —
      set false on operator-ready clusters (any cluster provisioned by a
      full-stack platform chart already runs it) and the resident operator
      reconciles this chart's database instead. Only consulted while
      archive_enabled is true — the operator serves nothing else here.
    value: true

  # ── Sizing ───────────────────────────────────────────────────────────────
  - name: postgres_instances
    description: >
      Number of PostgreSQL instances for the archive: one primary plus the
      rest as streaming replicas with automated failover. 2 (default)
      survives node loss; 1 is acceptable here more than in most charts —
      the archive is history, not the platform's live state — but a lost
      single instance loses that history.
    value: "2"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes
      quantity). Archive growth tracks completed-workflow volume; grows
      are applied in place when the storage class supports expansion,
      shrinks are rejected.
    value: 10Gi

  - name: artifacts_disk_size
    description: >
      Persistent volume size for the artifact store's object data (a
      Kubernetes quantity). Size for your artifact retention appetite —
      build outputs and archived logs accumulate until you prune buckets.
    value: 20Gi

  # ── Argo CD identity ─────────────────────────────────────────────────────
  - name: argocd_domain
    description: >
      Public hostname Argo CD is reached at (name only, no scheme — e.g.
      "argocd.example.com"), embedded in SSO redirect URLs, CLI login
      hints, and notification links. Set it together with the exposure you
      compose in front; empty keeps relative links, which is fine for
      port-forward access.
    value: ""

  - name: sso_enabled
    type: bool
    description: >
      Turns on OIDC single sign-on for Argo CD against the issuer below.
      Off (default) means the generated local admin credential is the
      login — turn SSO on before the platform has real users, and only
      disable the admin user (a values change on the deployed resource)
      AFTER SSO is verified working, or the UI locks everyone out.
    value: false

  - name: sso_oidc_issuer
    description: >
      The OIDC issuer URL Argo CD delegates login to. Pointing at the
      Kubernetes Identity and Access Platform chart's Keycloak, this is
      "<keycloak_hostname>/realms/<realm>". MUST BE CHANGED when
      sso_enabled is true — the default is a placeholder. Ignored while
      SSO is off.
    value: https://auth.example.com/realms/platform

  - name: sso_oidc_client_id
    description: >
      The OAuth client ID registered for Argo CD at your identity
      provider. Ignored while SSO is off.
    value: argocd

  - name: sso_oidc_client_secret_secret_name
    description: >
      Name of a PRE-CREATED Secret in this chart's namespace holding the
      OAuth client secret under the key `clientSecret` — external
      credentials never ride chart parameters. KNOW THIS: the Secret must
      also carry the label `app.kubernetes.io/part-of: argocd` or Argo CD
      refuses to read it. Leave empty for a public client (PKCE) — no
      client secret at all. Ignored while SSO is off.
    value: ""
