params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this chart deploys onto. When set, every resource in the chart
      carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty to
      deploy onto the environment's default Kubernetes connection — the right
      choice when the environment maps one-to-one to a cluster. This chart
      installs cluster-wide singletons (cert-manager, external-secrets,
      metrics-server, KEDA), so deploy it at most once per cluster.
    value: ""

  # ── DNS ──────────────────────────────────────────────────────────────────
  - name: dns_provider
    type: string_enum
    enumValues:
      - route53
      - cloud_dns
      - azure_dns
      - cloudflare
    description: >
      Where DNS records live. Drives BOTH halves of the DNS story identically:
      external-dns publishes records for Services/Ingresses/routes into this
      provider, and the Let's Encrypt issuers solve DNS-01 challenges through
      it. The cluster's own cloud is irrelevant — an EKS cluster publishing to
      Cloudflare or a GKE cluster publishing to Route 53 are just values
      choices here. Provider credentials are keyless by default: set
      workload_identity_provider and the per-controller identity params below
      (route53/cloud_dns/azure_dns), or cloudflare_api_token for Cloudflare,
      which has no workload-identity federation.
    value: route53

  - name: dns_zone_names
    type: list
    description: >
      Planton resource names of the DNS zones this platform manages —
      AwsRoute53Zone, GcpDnsZone, AzureDnsZone, or CloudflareDnsZone resources
      matching dns_provider. The zone IDs flow in by reference at deploy time,
      so the format can never be wrong. The zones must exist in the target
      environment when this chart deploys (the offline validator reports them
      as unresolved-by-design). Replace the placeholder with your zone
      resource names.
    value:
      - my-dns-zone

  - name: dns_domains
    type: list
    description: >
      Domain suffixes external-dns is allowed to manage (e.g. "example.com"
      covers every name under it). The first guardrail against the controller
      touching unrelated zones the credentials can see — keep it as narrow as
      the platform's real domains.
    value:
      - example.com

  - name: dns_txt_owner_id
    description: >
      Ownership ID this cluster's external-dns writes into its TXT registry
      records. Every cluster sharing a DNS zone MUST use a distinct value —
      it is what stops one cluster's controller from fighting over (or, under
      a sync policy, deleting) another cluster's records.
    value: platform

  # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
  - name: acme_email
    description: >
      Email registered with the Let's Encrypt ACME account. Expiry notices
      and account notifications go here — use a team alias, not a personal
      address. MUST be changed; Let's Encrypt rejects example.com addresses.
    value: platform-team@example.com

  - name: acme_http01_enabled
    type: bool
    description: >
      Adds an HTTP-01 solver alongside the default DNS-01 solver on both
      issuers. Certificates opt into it with the label
      "acme-solver: http01"; everything else keeps solving via DNS-01, which
      also covers wildcards. Useful when a certificate's domain is NOT in a
      zone this chart's DNS provider manages but its hostname is publicly
      reachable through the platform's ingress or gateway on port 80.
    value: false

  # ── Traffic exposure ─────────────────────────────────────────────────────
  - name: use_gateway_api
    type: bool
    description: >
      Selects the traffic-exposure arm. false (default): ingress-nginx is
      installed as the cluster's default IngressClass — the battle-tested
      path every team knows. true: the Gateway API arm instead — CRDs, a
      GatewayClass, and a Gateway are provisioned, and external-dns watches
      HTTPRoutes; bring your own Gateway API implementation (see
      gateway_controller_name). The arms are exclusive: one entry point,
      one mental model.
    value: false

  - name: ingress_replicas
    description: >
      ingress-nginx controller replicas (ignored when use_gateway_api is
      true). Two is the production floor — the controller is the single entry
      point for all HTTP traffic, and a one-replica controller makes every
      node drain a traffic outage.
    value: "2"

  - name: gateway_controller_name
    description: >
      Controller identity the GatewayClass binds to (only used when
      use_gateway_api is true) — must match the controllerName the Gateway
      API implementation running in this cluster announces (e.g.
      "gateway.nginx.org/nginx-gateway-controller" for NGINX Gateway Fabric,
      "istio.io/gateway-controller" for Istio). This chart deliberately does
      not install an implementation: which one is a platform choice with its
      own lifecycle. IMMUTABLE once deployed — changing it requires
      recreating the GatewayClass.
    value: gateway.nginx.org/nginx-gateway-controller

  # ── Keyless cloud identity (workload identity) ───────────────────────────
  - name: workload_identity_provider
    type: string_enum
    enumValues:
      - none
      - eks
      - gke
      - aks
    description: >
      How the controllers (cert-manager, external-dns, external-secrets)
      authenticate to cloud APIs without static keys: eks = IRSA, gke = GKE
      Workload Identity, aks = Azure AD Workload Identity. Set it to the
      platform hosting THIS cluster and fill the per-controller identity
      params below. none (default): controllers use the node's ambient
      identity if any — fine for evaluation; production clusters on
      EKS/GKE/AKS should always bind explicit identities.
    value: none

  - name: cert_manager_identity_name
    description: >
      Planton resource name of the cloud identity cert-manager's controller
      assumes for DNS-01 challenges — an AwsIamRole (eks), GcpServiceAccount
      (gke), or AzureUserAssignedIdentity (aks) with write access to the
      challenge TXT records in the DNS zones. The identity's handle flows in
      by reference at deploy time. Leave empty to skip identity binding for
      cert-manager (node-ambient identity).
    value: ""

  - name: external_dns_identity_name
    description: >
      Planton resource name of the cloud identity external-dns assumes for
      record management — an AwsIamRole (eks), GcpServiceAccount (gke), or
      AzureUserAssignedIdentity (aks) with record write access to the managed
      zones. Leave empty to skip identity binding for external-dns.
    value: ""

  - name: external_secrets_identity_name
    description: >
      Planton resource name of the cloud identity the External Secrets
      Operator assumes for secret reads — an AwsIamRole (eks),
      GcpServiceAccount (gke), or AzureUserAssignedIdentity (aks) with read
      access to the secret store selected below. Leave empty to skip identity
      binding for external-secrets.
    value: ""

  # ── Cloud coordinates (used by the DNS and secret-store arms) ────────────
  - name: aws_region
    description: >
      AWS region for the route53 DNS arm's API client and the
      aws_secrets_manager store's secret reads. Route 53 itself is global,
      but AWS SDKs require a region; Secrets Manager secrets are regional.
    value: us-east-1

  - name: gcp_project_id
    description: >
      GCP project ID owning the Cloud DNS zones (cloud_dns arm) and/or the
      Secret Manager secrets (gcp_secret_manager store). A literal project ID
      — nothing this chart deploys produces it. MUST be changed when either
      GCP arm is selected.
    value: my-gcp-project

  - name: azure_subscription_id
    description: >
      Azure subscription owning the DNS zones (azure_dns arm). A literal
      subscription GUID — MUST be changed when the azure_dns arm is selected.
    value: 00000000-0000-0000-0000-000000000000

  - name: azure_resource_group
    description: >
      Azure resource group containing the DNS zones (azure_dns arm).
    value: dns-zones

  - name: azure_tenant_id
    description: >
      Entra (Azure AD) tenant GUID, used by the azure_key_vault secret store
      and the azure_dns issuer arm for workload-identity authentication.
      Leave empty on non-Azure arms.
    value: ""

  - name: cloudflare_api_token
    description: >
      Cloudflare API token scoped to Zone:Read + DNS:Edit on the managed
      zones — required only when dns_provider is cloudflare (Cloudflare has
      no workload-identity federation). The modules materialize it as a
      Kubernetes Secret; it never appears in rendered pod specs. Prefer a
      dedicated token per cluster so revocation is surgical.
    value: ""

  # ── Secrets sync ─────────────────────────────────────────────────────────
  - name: external_secrets_enabled
    type: bool
    description: >
      Installs the External Secrets Operator plus a cluster-wide secret store
      so workloads consume cloud-held secrets as native Kubernetes Secrets —
      the pattern that keeps secret VALUES out of manifests entirely. Turn
      off only if another secrets-delivery mechanism already owns this
      cluster (ESO is a one-per-cluster singleton).
    value: true

  - name: secret_store_backend
    type: string_enum
    enumValues:
      - aws_secrets_manager
      - gcp_secret_manager
      - azure_key_vault
      - vault
    description: >
      The external secret backend the cluster-wide store reads from —
      independent of the cluster's own cloud (a GKE cluster reading AWS
      Secrets Manager is a values choice). aws_secrets_manager uses
      aws_region; gcp_secret_manager uses gcp_project_id; azure_key_vault
      uses azure_key_vault_url + azure_tenant_id; vault uses vault_server +
      vault_auth_role. All four authenticate keylessly through
      external_secrets_identity_name (or, for vault, the Kubernetes auth
      method) — no static keys in the chart.
    value: aws_secrets_manager

  - name: azure_key_vault_url
    description: >
      Azure Key Vault URL (e.g. "https://my-vault.vault.azure.net") — MUST be
      changed when secret_store_backend is azure_key_vault; unused otherwise.
    value: https://my-vault.vault.azure.net

  - name: vault_server
    description: >
      Vault or OpenBao server URL (e.g. "https://vault.example.com:8200") —
      MUST be changed when secret_store_backend is vault; unused otherwise.
    value: https://vault.example.com:8200

  - name: vault_auth_role
    description: >
      Vault Kubernetes-auth role the store authenticates as (bound
      server-side to the operator's ServiceAccount) — used only when
      secret_store_backend is vault.
    value: external-secrets

  # ── Cluster capabilities ─────────────────────────────────────────────────
  - name: metrics_server_enabled
    type: bool
    description: >
      Installs metrics-server, the resource-metrics API that `kubectl top`
      and every HorizontalPodAutoscaler depend on. Turn OFF on GKE — it ships
      metrics-server built in, and the metrics API is a cluster singleton, so
      a second installation conflicts. EKS and AKS need it installed.
    value: true

  - name: metrics_server_kubelet_insecure_tls
    type: bool
    description: >
      Skip kubelet TLS verification when metrics-server scrapes nodes.
      Required on clusters whose kubelets serve self-signed certificates
      without the cluster CA (kind, k3s, kubeadm without cert rotation).
      Keep false on EKS/AKS — their kubelet certificates verify cleanly, and
      disabling verification needlessly weakens the scrape path.
    value: false

  - name: keda_enabled
    type: bool
    description: >
      Installs KEDA, the event-driven autoscaler that scales workloads on
      external signals (queue depth, Kafka lag, cloud metrics) including
      to/from zero — the layer beyond CPU-based HPA. A one-per-cluster
      singleton (Kubernetes allows a single external-metrics provider). Off
      by default: install it when the first workload actually scales on
      events, not before.
    value: false
