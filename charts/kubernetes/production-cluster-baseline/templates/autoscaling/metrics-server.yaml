{% if values.metrics_server_enabled | bool %}
# metrics-server — the resource-metrics API behind `kubectl top` and every
# CPU/memory HorizontalPodAutoscaler. A cluster singleton: it registers the
# one v1beta1.metrics.k8s.io APIService, so it installs at most once per
# cluster — and NOT AT ALL on GKE, which ships it built in (that is what the
# metrics_server_enabled toggle is for).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesMetricsServer
metadata:
  name: "{{ values.env }}-metrics-server"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # metrics-server JOINS kube-system (the upstream-conventional home for
  # cluster-level system components) — it never creates it: kube-system
  # always exists, and claiming ownership of it would be false.
  namespace:
    value: kube-system
  createNamespace: false
{% if values.metrics_server_kubelet_insecure_tls | bool %}
  # Only for clusters whose kubelets serve self-signed certificates without
  # the cluster CA (kind, k3s, kubeadm without cert rotation). EKS/AKS
  # kubelet certificates verify cleanly — keep this off there.
  kubeletInsecureTls: true
{% endif %}
{% endif %}
