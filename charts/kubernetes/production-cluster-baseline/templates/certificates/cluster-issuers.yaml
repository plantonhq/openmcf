# Let's Encrypt ClusterIssuers — the platform's public certificate authority
# front-ends. Two issuers, deliberately:
#
#   letsencrypt-prod    — real, browser-trusted certificates. Rate-limited by
#                         Let's Encrypt (per-domain weekly caps), so nothing
#                         experimental should point here.
#   letsencrypt-staging — the staging endpoint: identical mechanics, untrusted
#                         chain, effectively unlimited. Point new Certificates
#                         here FIRST; switch the issuer name to prod only once
#                         issuance succeeds. This is what protects the
#                         production rate limit from a misconfigured rollout.
#
# Both issuers solve challenges with DNS-01 through the SAME provider that
# external-dns publishes records to (one dns_provider value drives both halves
# of the DNS story), and both carry NO static credentials on the cloud arms —
# the solver inherits cert-manager's ambient identity (the workloadIdentity
# binding on the controller, or the node identity). Cloudflare is the one
# token-based exception. DNS-01 is the default because it issues wildcards and
# works for services that are not publicly reachable.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterIssuer
metadata:
  name: "{{ values.env }}-letsencrypt-prod"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.acme_http01_enabled | bool and values.use_gateway_api | bool %}
  relationships:
    # The HTTP-01 gateway solver below names the Gateway as a plain string
    # (Gateway API's parentRef shape carries no reference), so nothing in the
    # spec creates a dependency edge — this declares it explicitly.
    - kind: KubernetesGateway
      name: "{{ values.env }}-gateway"
      type: depends_on
{% endif %}
spec:
  # Reference into the in-chart cert-manager: resolves its cluster-resource
  # namespace (where credential Secrets and ACME account keys live) and gives
  # the dependency graph the cert-manager-before-issuer edge structurally.
  certManagerNamespace:
    valueFrom:
      name: "{{ values.env }}-cert-manager"
  config:
    acme:
      email: "{{ values.acme_email }}"
      # Let's Encrypt production directory is the field's default — spelled
      # out so prod vs staging reads side by side in this file.
      server: https://acme-v02.api.letsencrypt.org/directory
      solvers:
        # The catch-all DNS-01 solver (no selector): every Certificate that
        # does not opt into another solver lands here.
        - dns01:
{% if values.dns_provider == "route53" %}
            route53:
              # Region only — no static keys, no per-issuer ServiceAccount:
              # empty auth means the solver runs with cert-manager's ambient
              # AWS identity (IRSA when workload identity is bound above).
              region: "{{ values.aws_region }}"
{% elif values.dns_provider == "cloud_dns" %}
            gcpCloudDns:
              # No service-account key: ambient GCP identity (GKE Workload
              # Identity when bound on the controller).
              projectId: "{{ values.gcp_project_id }}"
{% elif values.dns_provider == "azure_dns" %}
            azureDns:
              # No service-principal triplet: ambient Azure identity (AKS
              # Workload Identity when bound on the controller).
              subscriptionId: "{{ values.azure_subscription_id }}"
              resourceGroupName: "{{ values.azure_resource_group }}"
{% elif values.dns_provider == "cloudflare" %}
            cloudflare:
              apiToken:
                # Materialized as a Kubernetes Secret by the modules — the
                # token never lands in the rendered CR. Cloudflare has no
                # workload-identity federation, so a token is the only path.
                token: "{{ values.cloudflare_api_token }}"
{% endif %}
{% if values.acme_http01_enabled | bool %}
        # Opt-in HTTP-01 solver: certificates labeled "acme-solver: http01"
        # solve over HTTP through the platform's entry point instead of DNS.
        # For domains whose zones this chart's DNS provider does not manage.
        # The label selector keeps exactly one catch-all solver (the DNS-01
        # above) — two selectorless solvers would be ambiguous.
        - selector:
            matchLabels:
              acme-solver: http01
          http01:
{% if values.use_gateway_api | bool %}
            gatewayHttpRoute:
              parentRefs:
                # The in-chart Gateway (exposure/gateway-api.yaml). Plain
                # strings by Gateway API's own shape — the depends_on edge on
                # this resource's metadata makes the ordering structural.
                - name: "{{ values.env }}-gateway"
                  namespace: gateway
{% else %}
            ingress:
              # Ephemeral challenge Ingresses ride the ingress-nginx class
              # installed by this chart (exposure/ingress-nginx.yaml).
              ingressClassName: nginx
{% endif %}
{% endif %}
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterIssuer
metadata:
  name: "{{ values.env }}-letsencrypt-staging"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.acme_http01_enabled | bool and values.use_gateway_api | bool %}
  relationships:
    - kind: KubernetesGateway
      name: "{{ values.env }}-gateway"
      type: depends_on
{% endif %}
spec:
  certManagerNamespace:
    valueFrom:
      name: "{{ values.env }}-cert-manager"
  config:
    acme:
      email: "{{ values.acme_email }}"
      # The staging endpoint — untrusted chain, generous rate limits. Identical
      # solver configuration to prod ON PURPOSE: a certificate proven against
      # staging switches to prod by changing only the issuer name it selects.
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      solvers:
        - dns01:
{% if values.dns_provider == "route53" %}
            route53:
              region: "{{ values.aws_region }}"
{% elif values.dns_provider == "cloud_dns" %}
            gcpCloudDns:
              projectId: "{{ values.gcp_project_id }}"
{% elif values.dns_provider == "azure_dns" %}
            azureDns:
              subscriptionId: "{{ values.azure_subscription_id }}"
              resourceGroupName: "{{ values.azure_resource_group }}"
{% elif values.dns_provider == "cloudflare" %}
            cloudflare:
              apiToken:
                token: "{{ values.cloudflare_api_token }}"
{% endif %}
{% if values.acme_http01_enabled | bool %}
        - selector:
            matchLabels:
              acme-solver: http01
          http01:
{% if values.use_gateway_api | bool %}
            gatewayHttpRoute:
              parentRefs:
                - name: "{{ values.env }}-gateway"
                  namespace: gateway
{% else %}
            ingress:
              ingressClassName: nginx
{% endif %}
{% endif %}
