# cert-manager — the cluster's certificate machinery. Everything TLS in this
# baseline hangs off this controller: the Let's Encrypt ClusterIssuers (next
# file) are cert-manager custom resources, and application Certificates in any
# namespace are reconciled by it. It installs first by dependency order — the
# issuers reference its cluster-resource namespace, so the platform's graph
# deploys it before them.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCertManager
metadata:
  name: "{{ values.env }}-cert-manager"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # "cert-manager" is the upstream-conventional home and is deliberately NOT
  # parameterized: the namespace is effectively permanent (the kept CRDs pin
  # release ownership to it — reinstalling elsewhere fails Helm's ownership
  # check), and every runbook/document on the internet assumes this name.
  namespace:
    value: cert-manager
  createNamespace: true
{% if values.workload_identity_provider != "none" and values.cert_manager_identity_name != "" %}
  # Keyless DNS-01: the controller's ServiceAccount is bound to a cloud
  # identity, and the issuers' DNS-01 solvers deliberately carry NO static
  # credentials — they inherit this ambient identity. One binding here
  # secures every certificate the platform ever issues.
  workloadIdentity:
{% if values.workload_identity_provider == "eks" %}
    eks:
      # Resolves the AwsIamRole's ARN at deploy time via the annotated
      # composition key — the format can never drift.
      roleArn:
        valueFrom:
          name: "{{ values.cert_manager_identity_name }}"
{% elif values.workload_identity_provider == "gke" %}
    gke:
      serviceAccountEmail:
        valueFrom:
          name: "{{ values.cert_manager_identity_name }}"
{% elif values.workload_identity_provider == "aks" %}
    aks:
      clientId:
        valueFrom:
          name: "{{ values.cert_manager_identity_name }}"
{% if values.azure_tenant_id != "" %}
      tenantId: "{{ values.azure_tenant_id }}"
{% endif %}
{% endif %}
{% endif %}
