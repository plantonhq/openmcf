{% if not (values.use_gateway_api | bool) %}
# ingress-nginx — the cluster's traffic entry point (the default exposure
# arm). One controller, one cloud LoadBalancer, and the cluster's DEFAULT
# IngressClass: an Ingress with no class annotation lands here, which is
# exactly what a baseline should promise. The sibling gateway-api.yaml arm
# replaces this entirely when use_gateway_api is true — one entry point, one
# mental model, never both.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngressNginx
metadata:
  name: "{{ values.env }}-ingress-nginx"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    value: ingress-nginx
  createNamespace: true
  ingressClass:
    # "nginx" is what every tutorial, chart, and team assumes; the HTTP-01
    # solver in certificates/cluster-issuers.yaml points at this class too.
    name: nginx
    # THE default class: Ingresses without an explicit class are served. At
    # most one default class may exist per cluster — this baseline claims it.
    isDefaultClass: true
  # Two replicas is the production floor: the controller is the single entry
  # point for all HTTP traffic, and with one replica every node drain is a
  # traffic outage. The Service defaults to type LoadBalancer, so the cloud
  # provisions the external entry point automatically on EKS/GKE/AKS.
  replicas: {{ values.ingress_replicas }}
{% endif %}
