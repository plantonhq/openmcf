{% if values.external_secrets_enabled | bool %}
# External Secrets Operator + a cluster-wide secret store — the pattern that
# keeps secret VALUES out of manifests entirely: workloads declare
# ExternalSecrets naming keys in the backend, ESO syncs them into native
# Kubernetes Secrets. The operator is a one-per-cluster singleton (its release
# name and cluster-global webhook are fixed upstream), which is why this whole
# file rides one toggle.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalSecretsOperator
metadata:
  name: "{{ values.env }}-external-secrets"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # Conventional home; permanent while the kept CRDs pin release ownership to
  # it (reinstalling elsewhere fails Helm's ownership check).
  namespace:
    value: external-secrets
  createNamespace: true
{% if values.workload_identity_provider != "none" and values.external_secrets_identity_name != "" %}
  # Keyless reads: the operator's ServiceAccount carries the cloud identity,
  # and the store below deliberately declares NO credentials — its empty auth
  # block falls through to this ambient identity. One binding here covers
  # every ExternalSecret the platform ever syncs.
  workloadIdentity:
{% if values.workload_identity_provider == "eks" %}
    eks:
      roleArn:
        valueFrom:
          name: "{{ values.external_secrets_identity_name }}"
{% elif values.workload_identity_provider == "gke" %}
    gke:
      serviceAccountEmail:
        valueFrom:
          name: "{{ values.external_secrets_identity_name }}"
{% elif values.workload_identity_provider == "aks" %}
    aks:
      clientId:
        valueFrom:
          name: "{{ values.external_secrets_identity_name }}"
{% if values.azure_tenant_id != "" %}
      tenantId: "{{ values.azure_tenant_id }}"
{% endif %}
{% endif %}
{% endif %}
---
# The cluster-wide store: which backend secrets come from, readable by
# ExternalSecrets in every namespace. Backend selection is independent of the
# cluster's own cloud — a GKE cluster reading AWS Secrets Manager is a values
# choice, not an architecture change.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterSecretStore
metadata:
  name: "{{ values.env }}-secret-store"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # Reference into the in-chart operator: resolves the namespace credential
  # Secrets would live in, and orders the operator (whose CRDs define
  # ClusterSecretStore) before this resource structurally.
  secretsNamespace:
    valueFrom:
      name: "{{ values.env }}-external-secrets"
  config:
{% if values.secret_store_backend == "aws_secrets_manager" %}
    aws:
      # Service defaults to SecretsManager. No role, no ServiceAccount, no
      # static keys: the empty auth block IS the design — reads run with the
      # operator's ambient identity bound above.
      region: "{{ values.aws_region }}"
{% elif values.secret_store_backend == "gcp_secret_manager" %}
    gcpSecretManager:
      projectId:
        # Literal project ID — nothing this chart deploys produces it (a
        # GcpProject reference is the alternative for Planton-managed
        # projects). Auth left empty: ambient identity, as above.
        value: "{{ values.gcp_project_id }}"
{% elif values.secret_store_backend == "azure_key_vault" %}
    azureKeyVault:
      vaultUrl:
        # Literal URL of an EXISTING vault — this chart deploys onto a
        # cluster you already have and does not create the vault (an
        # AzureKeyVault reference is the alternative in one-run
        # compositions that deploy the vault alongside the store).
        value: "{{ values.azure_key_vault_url }}"
{% if values.azure_tenant_id != "" %}
      tenantId: "{{ values.azure_tenant_id }}"
{% endif %}
      # auth_type defaults to WorkloadIdentity — the keyless AKS posture,
      # riding the operator's identity binding above.
{% elif values.secret_store_backend == "vault" %}
    vault:
      server: "{{ values.vault_server }}"
      # Kubernetes auth: the operator's own ServiceAccount token is exchanged
      # for a Vault token — keyless from the cluster's perspective. The role
      # is bound to that ServiceAccount on the Vault side (see the README's
      # after-deployment section for the vault CLI commands).
      kubernetes:
        role: "{{ values.vault_auth_role }}"
{% endif %}
{% endif %}
