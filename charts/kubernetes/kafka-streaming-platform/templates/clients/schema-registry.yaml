{% if values.schema_registry_enabled | bool %}
# The registry's own identity on the cluster: a dedicated SCRAM principal
# per client component (never a shared "app" credential) keeps access
# auditable and revocable per component. The operator generates the
# password into a Secret the registry consumes by reference below.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUser
metadata:
  name: "{{ values.env }}-schema-registry-user"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  kafkaCluster:
    valueFrom:
      name: "{{ values.env }}-kafka"
  authentication:
    type: scram-sha-512
---
# Karapace — the open-source, Confluent-API-compatible schema registry.
# Schemas live in a compacted Kafka topic ("_schemas", the convention every
# existing Schema Registry client expects), so the registry itself is
# stateless. It connects to the cluster exactly as any well-behaved client
# does: SASL_SSL — TLS trust from the cluster's CA Secret, SCRAM
# credentials from its dedicated user's operator-generated Secret — every
# handle resolved by reference.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKarapace
metadata:
  name: "{{ values.env }}-schema-registry"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  createNamespace: false
  kafka:
    # The cluster's first internal listener — the annotated composition key
    # every client in this chart rides.
    bootstrapServers:
      valueFrom:
        name: "{{ values.env }}-kafka"
    # The listener is TLS + SCRAM, so the client protocol is SASL_SSL —
    # the spec's own pairing rules hold this consistent (SASL_SSL requires
    # both blocks below).
    securityProtocol: SASL_SSL
    tls:
      # Resolves the cluster's CA certificate Secret ("ca.crt" inside it —
      # the field's default).
      caSecretName:
        valueFrom:
          name: "{{ values.env }}-kafka"
    sasl:
      # SCRAM-SHA-512 pairs with the cluster listener's scram-sha-512
      # authentication (mechanism spellings differ by convention on the
      # two sides — SASL uppercase, Strimzi lowercase).
      mechanism: SCRAM-SHA-512
      # The principal IS the KafkaUser resource's name (its username
      # output) — both sides render from the same expression this chart
      # controls, which is what keeps a plain-string username field honest.
      username: "{{ values.env }}-schema-registry-user"
      passwordSecret:
        # Resolves the user's operator-generated credential Secret; the
        # password key inside it defaults to "password".
        secretName:
          valueFrom:
            name: "{{ values.env }}-schema-registry-user"
  registry:
    # The schemas topic is created by the registry on first start AT this
    # replication factor — it defaults to 1 upstream, which is a data-loss
    # risk on a real cluster; this chart pins it to the platform's own
    # durability posture. Changing it later means reassigning the topic
    # with Kafka tooling, not editing the field.
    replicationFactor: {{ values.replication_factor }}
{% endif %}
