{% if values.kafka_ui_enabled | bool %}
# The console's own identity on the cluster — dedicated, auditable,
# revocable without touching any application's credential.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUser
metadata:
  name: "{{ values.env }}-kafka-ui-user"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  kafkaCluster:
    valueFrom:
      name: "{{ values.env }}-kafka"
  authentication:
    type: scram-sha-512
---
# The Kafbat UI management console — topic browsing, message inspection,
# consumer-group lag, schema and Connect views. It connects to the cluster
# as a normal SASL_SSL client (CA trust + its dedicated SCRAM identity, all
# by reference) and stays ClusterIP-internal; login is enabled anyway,
# because anyone who reaches the console operates the cluster with the
# credential it holds.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUi
metadata:
  name: "{{ values.env }}-kafka-ui"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  createNamespace: false
  clusters:
    - name: "{{ values.env }}"
      bootstrapServers:
        valueFrom:
          name: "{{ values.env }}-kafka"
      tls:
        caSecretName:
          valueFrom:
            name: "{{ values.env }}-kafka"
      sasl:
        mechanism: SCRAM-SHA-512
        # The principal is the KafkaUser resource's name — both sides
        # render from the same chart-controlled expression.
        username: "{{ values.env }}-kafka-ui-user"
        passwordSecret:
          secretName:
            valueFrom:
              name: "{{ values.env }}-kafka-ui-user"
{% if values.schema_registry_enabled | bool %}
      # Schema-aware message rendering: the registry's endpoint output,
      # by reference. This block exists only while the registry does —
      # flipping the registry off removes the consumer with the resource.
      schemaRegistry:
        url:
          valueFrom:
            name: "{{ values.env }}-schema-registry"
{% endif %}
{% if values.connect_enabled | bool %}
      # Connector management: the Connect cluster's REST endpoint output,
      # by reference — same toggle-paired lifecycle as the registry block.
      kafkaConnect:
        - name: "{{ values.env }}-connect"
          address:
            valueFrom:
              name: "{{ values.env }}-kafka-connect"
{% endif %}
  # The console's single form-login account (the app authenticates exactly
  # one user; OAuth2/LDAP compose through the deployed resource's escape
  # hatch). The password is a MUST-CHANGE parameter — the platform
  # materializes it into a Secret-backed environment variable, never into
  # rendered chart values.
  auth:
    type: login_form
    user:
      username: "{{ values.kafka_ui_username }}"
      password: "{{ values.kafka_ui_password }}"
{% endif %}
