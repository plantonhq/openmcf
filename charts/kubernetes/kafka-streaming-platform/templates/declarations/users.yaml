# The platform's client identities — one first-class resource per entry in
# user_names, reconciled by the cluster's user operator. Each becomes a
# SCRAM-SHA-512 principal (matching the cluster listener's authentication
# type — a user of one type cannot authenticate on a listener of another),
# and the operator GENERATES its password into a Secret named after the
# user: applications read `password` (or the ready-made `sasl.jaas.config`)
# from that Secret, and no credential ever appears in configuration.
#
# The same placement contract as topics applies: a KafkaUser outside the
# cluster's namespace is silently never reconciled — namespace and cluster
# binding ride references to the chart's own resources.
#
# No ACLs are declared because the cluster runs without an authorizer
# (authenticated users have full access): declaring ACLs on such a cluster
# makes the user operator REJECT the user outright. The README's day-2
# notes cover turning simple authorization on and scoping users down.
{% for user in values.user_names %}
{% if loop.index0 > 0 %}
---
{% endif %}
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUser
metadata:
  # The resource name IS the Kafka principal and the credential Secret's
  # name — env-prefixed so a second environment on the same cluster can
  # never collide.
  name: "{{ values.env }}-user-{{ user | lower | replace('.', '-') | replace('_', '-') }}"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  kafkaCluster:
    valueFrom:
      name: "{{ values.env }}-kafka"
  authentication:
    type: scram-sha-512
{% endfor %}
