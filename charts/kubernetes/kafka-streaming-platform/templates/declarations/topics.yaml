# The platform's topic inventory — one first-class resource per entry in
# topic_names, reconciled by the cluster's topic operator. Declared topics
# are the governance surface: partitions grow declaratively, configuration
# changes apply declaratively, and DELETING a declaration deletes the topic
# AND ITS DATA (the operator propagates deletion to Kafka).
#
# PLACEMENT IS THE CONTRACT, NOT A CHOICE: a KafkaTopic is only reconciled
# in the SAME namespace as its Kafka cluster — anywhere else it is accepted
# by the API server and silently ignored. Both the namespace and the
# cluster binding therefore ride references to the chart's own resources.
{% for topic in values.topic_names %}
{% if loop.index0 > 0 %}
---
{% endif %}
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaTopic
metadata:
  # The resource name is DNS-sanitized (Kafka topic names allow '.', '_'
  # and uppercase; Kubernetes resource names do not) — the real topic name
  # is carried verbatim by spec.topicName below.
  name: "{{ values.env }}-topic-{{ topic | lower | replace('.', '-') | replace('_', '-') }}"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  # Resolves the cluster's name output — rendered as the strimzi.io/cluster
  # label that binds this topic to the cluster, and the ordering edge that
  # deploys the cluster first.
  kafkaCluster:
    valueFrom:
      name: "{{ values.env }}-kafka"
  topicName: "{{ topic }}"
  partitions: {{ values.topic_partitions }}
  # Replication is deliberately not set per topic: every declared topic
  # inherits the cluster's default.replication.factor (the
  # replication_factor param) — one durability posture, one knob.
{% endfor %}
