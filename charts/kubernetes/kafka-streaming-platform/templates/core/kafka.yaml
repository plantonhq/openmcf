# The Kafka cluster — KRaft mode (no ZooKeeper), reconciled by Strimzi from
# the node pools and listener declared here. Every client in this chart
# (schema registry, console, Connect, MirrorMaker 2) and every application
# consumes this resource's outputs by reference: the bootstrap endpoint,
# the cluster name (the strimzi.io/cluster binding label), and the cluster
# CA certificate Secret.
#
# SECURE BY DEFAULT: the single internal listener runs TLS with
# SCRAM-SHA-512 authentication — no anonymous plaintext path exists.
# Clients trust the cluster CA (an output) and authenticate as declared
# KafkaUser identities whose passwords the operator generates into
# Secrets. External exposure is deliberately absent: add a loadbalancer or
# nodeport listener on the deployed resource when clients outside the
# cluster need in (see the README's day-2 notes).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafka
metadata:
  name: "{{ values.env }}-kafka"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_strimzi_operator | bool %}
  relationships:
    # The cluster is a Strimzi custom resource — the operator (and its
    # CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator
    # already runs, and ordering against it is not this chart's to declare.
    - kind: KubernetesStrimziKafkaOperator
      name: "{{ values.env }}-strimzi-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the chart-owned namespace — the namespace the topic and user
  # operators will watch (they reconcile declarations ONLY here).
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  createNamespace: false
{% if values.dedicated_controllers | bool %}
  nodePools:
    # Dedicated metadata quorum: three controllers isolated from broker
    # load — quorum latency stops competing with data traffic. Three is
    # the quorum shape (majority of 2 survives one loss); the small fixed
    # disk holds only the KRaft metadata log, never topic data.
    - name: controller
      roles:
        - controller
      replicas: 3
      storage:
        size: 10Gi
    - name: broker
      roles:
        - broker
      replicas: {{ values.broker_replicas }}
      storage:
        size: "{{ values.broker_disk_size }}"
{% else %}
  nodePools:
    # The compact HA shape: every node carries both the KRaft controller
    # and broker roles. Keep the count odd — the same nodes form the
    # metadata quorum (the broker_replicas description teaches this).
    - name: kafka
      roles:
        - controller
        - broker
      replicas: {{ values.broker_replicas }}
      storage:
        size: "{{ values.broker_disk_size }}"
{% endif %}
  listeners:
    # The one way in: TLS-encrypted, SCRAM-authenticated, in-cluster only.
    # An internal listener is also what makes the cluster's
    # internal_bootstrap_endpoint output resolve — every client seam in
    # this chart rides it.
    - name: secure
      port: 9092
      type: internal
      tls: true
      authentication:
        type: scram-sha-512
  # The durability contract, driven by two params and applied to the
  # cluster default AND Kafka's internal topics (offsets, transaction
  # state) — the internal topics are where an under-replicated setting
  # hurts most and is hardest to fix later. Values are Kafka configuration
  # strings, hence quoted.
  config:
    default.replication.factor: "{{ values.replication_factor }}"
    min.insync.replicas: "{{ values.min_insync_replicas }}"
    offsets.topic.replication.factor: "{{ values.replication_factor }}"
    transaction.state.log.replication.factor: "{{ values.replication_factor }}"
    transaction.state.log.min.isr: "{{ values.min_insync_replicas }}"
  # The entity operator (topic + user reconcilers) is deliberately not
  # declared: both default ON, and this chart's topic and user
  # declarations require them.
