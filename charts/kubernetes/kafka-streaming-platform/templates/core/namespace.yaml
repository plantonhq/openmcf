# The platform's single home. One resource OWNS the namespace and every
# other resource JOINS it (createNamespace stays false everywhere else) —
# two resources claiming the same namespace would collide with
# AlreadyExists at deploy time, and the first-class namespace gives every
# tenant a structural created-before-used edge: they all reference this
# resource's name.
#
# ONE namespace for the whole platform is Strimzi's own grain, not a
# simplification: KafkaTopic and KafkaUser declarations are only reconciled
# in the SAME namespace as their Kafka cluster (elsewhere they are accepted
# by the API server and then silently ignored — the operator's verified
# placement contract), and the operator's default watch scope is exactly
# its own namespace. Everything that must agree on a namespace therefore
# derives it from this one resource.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-kafka-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
