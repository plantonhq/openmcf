{% if values.install_strimzi_operator | bool %}
# The Strimzi operator — the engine that reconciles the Kafka cluster, its
# node pools, and every topic and user declaration in this chart. It lives
# BESIDE the Kafka cluster and watches only this namespace (the chart's
# upstream default): the platform is self-contained, and the
# watch-a-foreign-namespace failure mode (RoleBindings into namespaces that
# must pre-exist) never arises.
#
# The install_strimzi_operator toggle exists because Strimzi's fixed-name
# ClusterRoles make a second installation on one cluster fight the first:
# operator-ready clusters (any cluster provisioned by a full-stack platform
# chart runs a resident cluster-wide Strimzi) set it false, and the
# resident operator reconciles this namespace instead.
#
# The operator's CRDs install once and are never cascade-deleted with the
# release — uninstalling the operator strands no Kafka cluster.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStrimziKafkaOperator
metadata:
  name: "{{ values.env }}-strimzi-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace (core/namespace.yaml) — the reference
  # is the created-before-used ordering edge.
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  createNamespace: false
{% endif %}
