{% if values.mirror_enabled | bool %}
# The mirror engine's identity on THIS platform (the target side) — it
# writes mirrored records, offset checkpoints, and its internal state
# topics here, with the same dedicated-principal posture as every client
# component.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaUser
metadata:
  name: "{{ values.env }}-kafka-mirror-user"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  kafkaCluster:
    valueFrom:
      name: "{{ values.env }}-kafka"
  authentication:
    type: scram-sha-512
---
# MirrorMaker 2 — the migration arm: streams an existing cluster's topics
# INTO this platform and checkpoints consumer-group offsets across, so
# consumers cut over without reprocessing or loss. The TARGET side (this
# platform) is wired entirely by reference; the SOURCE side is the outside
# world — its address is an honest literal parameter, and its credentials
# ride a pre-created Secret you own (external credentials are never chart
# parameters).
#
# The engine runs on Connect's protocol, so its group identity and
# internal topics default from this resource's name — unique beside the
# optional Kafka Connect cluster by construction.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaMirrorMaker2
metadata:
  name: "{{ values.env }}-kafka-mirror"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  createNamespace: false
  target:
    bootstrapServers:
      valueFrom:
        name: "{{ values.env }}-kafka"
    tls:
      trustedCertificates:
        - secretName:
            valueFrom:
              name: "{{ values.env }}-kafka"
          certificate: ca.crt
    authentication:
      type: scram-sha-512
      username: "{{ values.env }}-kafka-mirror-user"
      passwordSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-kafka-mirror-user"
  mirrors:
    - source:
        # Prefixes mirrored topic names under the default replication
        # policy — irrelevant in the default posture below, which keeps
        # original names.
        alias: source
        bootstrapServers:
          value: "{{ values.mirror_source_bootstrap_servers }}"
{% if values.mirror_source_ca_secret_name != "" %}
        # Private-CA sources (a Strimzi cluster's own CA, a corporate CA):
        # trust rides a Secret you created in this namespace. Public-CA
        # endpoints (Confluent Cloud) verify without it — TLS is then
        # negotiated by the client from the mechanism/port, and plaintext
        # sources leave both blocks empty.
        tls:
          trustedCertificates:
            - secretName:
                value: "{{ values.mirror_source_ca_secret_name }}"
              certificate: ca.crt
{% endif %}
{% if values.mirror_source_username != "" %}
        authentication:
          type: "{{ values.mirror_source_auth_mechanism }}"
          username: "{{ values.mirror_source_username }}"
          passwordSecret:
            # A literal Secret NAME (pre-created in this namespace, key
            # "password") — the source is outside the deployed graph, so
            # nothing exists to reference.
            secretName:
              value: "{{ values.mirror_source_password_secret_name }}"
{% endif %}
      topicsPattern: "{{ values.mirror_topics_pattern }}"
{% if values.mirror_keep_topic_names | bool %}
      # The migration posture: mirrored topics keep their ORIGINAL names,
      # so producers and consumers cut over without renaming. The policy
      # must be set on BOTH connectors — the checkpoint connector
      # translates offsets against the same topic-name mapping the source
      # connector writes; letting them disagree corrupts the cutover.
      sourceConnector:
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
      checkpointConnector:
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
{% endif %}
{% endif %}
