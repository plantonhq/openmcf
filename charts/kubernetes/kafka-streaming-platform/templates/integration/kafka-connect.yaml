{% if values.connect_enabled | bool %}
# Connect's own identity on the cluster — the integration engine reads and
# writes application topics plus its three internal state topics, so it
# gets a dedicated, revocable principal like every other client component.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUser
metadata:
  name: "{{ values.env }}-kafka-connect-user"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  kafkaCluster:
    valueFrom:
      name: "{{ values.env }}-kafka"
  authentication:
    type: scram-sha-512
---
# Kafka Connect — the integration engine that streams data between Kafka
# and external systems through connectors. Managed DECLARATIVELY: the
# module pins Strimzi's use-connector-resources annotation on, so
# connectors are declared as KubernetesKafkaConnector resources naming this
# cluster — never created through the REST API (the API's writes would
# fight the operator's reconciliation).
#
# THE STOCK IMAGE CARRIES ONLY THE MIRRORMAKER 2 CONNECTORS — every real
# integration (JDBC, S3, Debezium, ...) adds its plugin on the deployed
# resource via the plugins/build arms; the README's day-2 notes walk
# through it. The group identity and internal topics default from this
# resource's name, which keeps them unique beside the MirrorMaker 2
# instance sharing the cluster.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaConnect
metadata:
  name: "{{ values.env }}-kafka-connect"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-kafka-ns"
  createNamespace: false
  bootstrapServers:
    valueFrom:
      name: "{{ values.env }}-kafka"
  # The shared Strimzi client-connection shape: TLS trust from the
  # cluster's CA Secret, SCRAM credentials from the dedicated user — the
  # same block Connect, MirrorMaker 2's target, and its sources all read.
  tls:
    trustedCertificates:
      - secretName:
          valueFrom:
            name: "{{ values.env }}-kafka"
        # Strimzi cluster CA Secrets carry the certificate under "ca.crt".
        certificate: ca.crt
  authentication:
    type: scram-sha-512
    username: "{{ values.env }}-kafka-connect-user"
    passwordSecret:
      secretName:
        valueFrom:
          name: "{{ values.env }}-kafka-connect-user"
{% endif %}
