# The PostgreSQL cluster backing Harbor's metadata — projects, users,
# tags, scan results — reconciled by CloudNativePG into a primary plus
# streaming replicas with automated failover. Harbor connects through the
# operator-maintained -rw Service (always the current primary) and reads
# the credential from the operator-maintained `<name>-app` Secret; both
# handles flow into the registry BY REFERENCE, so the wiring can never
# drift. Blobs never land here — they live in the object store
# (object-store.yaml); this database stays small and hot.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-supply-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_cnpg_operator | bool %}
  relationships:
    # The database is a CloudNativePG custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator is
    # already running, and ordering against it is not this chart's to
    # declare.
    - kind: KubernetesCloudNativePgOperator
      name: "{{ values.env }}-cnpg-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-supply-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # Harbor's core database, named exactly what registry.yaml declares
      # as coreDatabase. The owner role is named explicitly (rather than
      # inheriting the database name) because registry.yaml declares the
      # same value as its database username — both sides render from the
      # same well-known literal, which is what keeps a plain-string
      # username field honest. Ownership covers everything Harbor's
      # schema migrations need with NO create-database grant.
      database: registry
      owner: harbor
