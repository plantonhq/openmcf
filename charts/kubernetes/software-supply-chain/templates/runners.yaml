{% if values.gha_runners_enabled | bool %}
# GitHub Actions runners — an autoscaling, scale-to-zero self-hosted
# runner fleet for the repositories that build what this registry
# stores. OFF by default, deliberately: the fleet needs a GitHub URL and
# a credential that nothing in this chart's graph produces — turn it on
# once both exist. ONE toggle gates the controller and the scale set
# together; their chart versions are supported by GitHub only in
# lockstep, which both components already pin identically (neither is
# restated here, so they cannot drift apart in this chart).
#
# The controller is a ONE-PER-CLUSTER default (it watches all
# namespaces, serving every scale set) and lives in its own namespace —
# it is cluster infrastructure, not a supply-chain tenant. Its CRDs are
# installed once and KEPT on uninstall by upstream design.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGhaRunnerScaleSetController
metadata:
  name: "{{ values.env }}-gha-controller"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    value: arc-system
  createNamespace: true
---
# The runner fleet itself — registers against the repository,
# organization, or enterprise below; workflows target it BY NAME with
# `runs-on: <this resource's name>`. Ephemeral runners: each job gets a
# fresh pod, and the fleet scales to zero between jobs.
#
# AUTHENTICATION IS SECRET-NATIVE: the GitHub credential rides a
# PRE-CREATED Secret in the chart's namespace (external credentials are
# never chart parameters) — key `github_token` for a classic/fine-grained
# PAT, or keys `github_app_id` / `github_app_installation_id` /
# `github_app_private_key` for a GitHub App (the recommended posture for
# organizations). The credential never touches a manifest or a rendered
# value.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGhaRunnerScaleSet
metadata:
  name: "{{ values.env }}-gha-runners"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # The scale set is reconciled by the controller (no spec field
    # consumes a controller output on a cluster-wide controller — the
    # chart discovers it at install time), so the ordering edge is
    # declared explicitly. Both resources live inside one toggle, so the
    # edge can never dangle.
    - kind: KubernetesGhaRunnerScaleSetController
      name: "{{ values.env }}-gha-controller"
      type: depends_on
spec:
  # JOINS the chart-owned namespace: runner pods and the listener run
  # beside the registry they push to, and the auth Secret must live in
  # the same namespace as the fleet.
  namespace:
    valueFrom:
      name: "{{ values.env }}-supply-ns"
  createNamespace: false
  # The repository, organization, or enterprise URL the fleet registers
  # against. The default is a placeholder that validates but registers
  # nothing real — set it with the toggle. Workflows then declare
  # `runs-on: <env>-gha-runners` (the fleet's name; runner names are
  # capped at 45 characters by GitHub — environment names comfortably
  # fit).
  githubConfigUrl: "{{ values.gha_github_config_url }}"
  auth:
    existingSecretName: "{{ values.gha_github_auth_secret_name }}"
{% endif %}
