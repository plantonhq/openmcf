# The supply chain's shared home. One resource OWNS the namespace and the
# tenants JOIN it (createNamespace stays false on the database, the cache,
# the object store, the identity Secret, Harbor, and the runner fleet) —
# two resources claiming the same namespace would collide with
# AlreadyExists at deploy time, and modeling the namespace as its own
# first-class resource gives every tenant a structural created-before-used
# edge: they reference this resource's name.
#
# Co-location of Harbor with its data services is load-bearing, not a
# tidiness choice: Harbor reads its database password Secret and its
# declared cache/storage credential Secrets from its OWN namespace (a
# Kubernetes constraint — secretKeyRef and the chart's install-time Secret
# reads are namespace-local). Tekton is the deliberate exception: its
# operator installs into the upstream-fixed `tekton-operator` namespace
# and its components into the operator-owned `tekton-pipelines` — neither
# is this chart's to own (see pipelines.yaml).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-supply-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
