params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this chart deploys onto. When set, every resource in the chart
      carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty to
      deploy onto the environment's default Kubernetes connection — the right
      choice when the environment maps one-to-one to a cluster.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the registry and its data services live in —
      Harbor, PostgreSQL, the Valkey cache, the object store, and (when
      enabled) the runner fleet together, deliberately: Harbor reads its
      database, cache, and storage credentials from Secrets in its own
      namespace. Tekton is the exception by upstream design (its operator
      owns fixed namespaces). Change it to run a second independent supply
      chain on the same cluster (Tekton, one-per-cluster, stays with the
      first).
    value: supply-chain

  - name: install_cnpg_operator
    type: bool
    description: >
      Installs the CloudNativePG operator (the engine that reconciles the
      registry database) into cnpg-system. A one-per-cluster singleton —
      set false on operator-ready clusters (any cluster provisioned by a
      full-stack platform chart already runs it) and the resident operator
      reconciles this chart's database instead.
    value: true

  # ── Registry identity ────────────────────────────────────────────────────
  - name: harbor_external_url
    description: >
      The URL clients reach the registry at — protocol://host, no trailing
      slash (e.g. "https://registry.example.com"). LOAD-BEARING for pushes
      and pulls, not cosmetic: Harbor embeds it in the token-service
      address returned to every OCI client, so docker login/push/pull FAIL
      AUTH when the dialed address differs. MUST BE CHANGED to the address
      your composed exposure actually serves; an https URL with TLS
      terminating in front of Harbor is the intended shape.
    value: https://registry.example.com

  # ── Data services ────────────────────────────────────────────────────────
  - name: postgres_instances
    description: >
      Number of PostgreSQL instances: one primary plus the rest as
      streaming replicas with automated failover. 2 (default) is the floor
      for a registry whose metadata loss means every project, tag, and
      scan result — 3 is the production convention; 1 is for evaluation
      only. Blobs are safe either way (they live in the object store).
    value: "2"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes
      quantity). Registry metadata stays small — blobs never land here.
      Grows are applied in place when the storage class supports
      expansion; shrinks are rejected.
    value: 10Gi

  - name: valkey_password
    description: >
      Password for the cache's "default" ACL user — authentication is ON
      by default because an open cache is readable and writable by
      anything that reaches its Service. MUST BE CHANGED — the default is
      a placeholder, not a credential. Declared on both sides by design:
      the cache enforces it, and Harbor's module materializes the same
      value into its own credential Secret (the Harbor chart's fixed
      REDIS_PASSWORD key contract cannot consume Valkey's
      keyed-by-username Secret by reference).
    value: change-me

  - name: valkey_max_memory
    description: >
      Memory ceiling for Harbor's sessions, job queues, and manifest
      cache, as a Valkey size ("256mb", "1gb"). At the ceiling the cache
      EVICTS least-recently-used keys — the correct cache behavior
      (without a ceiling, the pod's memory limit becomes the bound and
      hitting it is an OOM kill, not an eviction).
    value: 256mb

  - name: valkey_disk_size
    description: >
      Persistent volume size for the cache (a Kubernetes quantity). The
      volume lets the cache restart WARM from its last snapshot instead
      of empty. Size it near valkey_max_memory.
    value: 2Gi

  - name: objects_disk_size
    description: >
      Persistent volume size for the object store's blob data (a
      Kubernetes quantity) — every image layer and chart the registry
      serves lives here. Size for your image retention appetite; garbage
      collection inside Harbor is what reclaims space from deleted tags.
    value: 30Gi

  - name: s3_access_key
    description: >
      The S3 access key ID the registry presents to the object store —
      declared on both sides by design (the store's identity document and
      Harbor's storage credentials render from this one value, so the
      pairing can never drift). MUST BE CHANGED, and use LETTERS ONLY
      (compensate with length, 20+ characters): credential values that
      pass through config parsers crash servers intermittently on
      structural characters like digits-first, #, $, or braces.
    value: registryaccesskeychangeme

  - name: s3_secret_key
    description: >
      The S3 secret access key paired with s3_access_key — same
      both-sides contract, same rules: MUST BE CHANGED, LETTERS ONLY,
      length is the entropy (40+ characters).
    value: registrysecretaccesskeychangemepleasenow

  # ── Pipelines ────────────────────────────────────────────────────────────
  - name: tekton_enabled
    type: bool
    description: >
      Deploys Tekton — the operator plus the TektonConfig declaration
      (Pipelines, Triggers, Dashboard) — as one arm: neither half is
      useful alone, and both are ONE-PER-CLUSTER by upstream design (the
      operator's namespace is fixed; the admission webhook allows exactly
      one TektonConfig). Set false on any cluster that already runs
      Tekton, whoever installed it.
    value: true

  # ── GitHub Actions runners ───────────────────────────────────────────────
  - name: gha_runners_enabled
    type: bool
    description: >
      Deploys the GitHub Actions runner fleet — the controller (one per
      cluster, in arc-system) and an ephemeral, scale-to-zero runner
      scale set registered against the URL below. OFF by default: the
      fleet needs a GitHub URL and a pre-created credential Secret that
      nothing in this chart produces. Turn it on once both exist.
    value: false

  - name: gha_github_config_url
    description: >
      The GitHub repository, organization, or enterprise URL the runners
      register against (e.g. "https://github.com/your-org"). MUST BE
      CHANGED when the runner toggle is on — the default is a placeholder
      that validates but registers nothing real. Ignored while the
      toggle is off.
    value: https://github.com/your-org

  - name: gha_github_auth_secret_name
    description: >
      Name of a PRE-CREATED Secret in this chart's namespace holding the
      GitHub credential — key `github_token` for a PAT, or keys
      `github_app_id` / `github_app_installation_id` /
      `github_app_private_key` for a GitHub App (the recommended
      posture). External credentials never ride chart parameters; create
      the Secret before flipping the runner toggle on. Ignored while the
      toggle is off.
    value: gha-github-auth
