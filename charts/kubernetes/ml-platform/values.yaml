params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this platform deploys onto. When set, every resource in the
      chart carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty
      to deploy onto the environment's default Kubernetes connection — the
      right choice when the environment maps one-to-one to a cluster.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the whole platform lives in — the database, the
      artifact store, the Ray cluster, MLflow and JupyterHub together,
      deliberately: MLflow and JupyterHub read the database password, and
      MLflow the artifact-store credentials, through Secret references,
      and a Secret can only be read from the workload's own namespace, so
      co-location is the design, not a convenience. JupyterHub's internal
      names are fixed by its chart, making it one-per-namespace anyway.
      Change this to run a second independent ML platform on the same
      cluster.
    value: ml-platform

  - name: install_cnpg_operator
    type: bool
    description: >
      Installs the CloudNativePG operator (the engine that reconciles the
      database) into cnpg-system. The operator is a one-per-cluster
      singleton — its Helm release name, cluster-scoped CRDs, and webhook
      identity are fixed upstream, so a second installation fights the
      first. Keep true on a cluster that does not run CloudNativePG yet;
      set false on operator-ready clusters (any cluster provisioned by a
      full-stack platform chart already runs it), and the resident operator
      reconciles this chart's database instead.
    value: true

  - name: install_kuberay_operator
    type: bool
    description: >
      Installs the KubeRay operator — the controller that turns this
      chart's Ray cluster declaration into running head and worker pods.
      One operator per cluster is the normal posture (it watches every
      namespace). Set false on clusters that already run KubeRay; the
      resident operator reconciles this chart's Ray cluster instead,
      provided its watch scope covers this namespace.
    value: true

  # ── Database sizing ──────────────────────────────────────────────────────
  - name: postgres_instances
    description: >
      Number of PostgreSQL instances: one primary plus the rest as
      streaming replicas with automated failover. 2 (default) is the floor
      for a database that survives node loss — every experiment, run,
      metric, registered model, and notebook-user record lives here. 3 is
      the production convention; 1 is a single point of failure for
      evaluation only.
    value: "2"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes
      quantity, e.g. "10Gi"). Tracking metadata is compact — models and
      datasets live in the artifact store, not here. Grows are applied in
      place when the storage class supports expansion; shrinks are
      rejected.
    value: 10Gi

  # ── Artifact store ───────────────────────────────────────────────────────
  - name: artifacts_disk_size
    description: >
      Persistent volume size for the artifact store's volume-server tier
      (a Kubernetes quantity) — the disk actually holding models,
      datasets, and run artifacts. Models are big; size for the artifacts
      you plan to keep. Grows are applied in place when the storage class
      supports expansion.
    value: 30Gi

  # ── Ray compute ──────────────────────────────────────────────────────────
  - name: ray_version
    description: >
      Ray version running in the cluster (e.g. "2.52.0"). It drives the
      node image (rayproject/ray at exactly this version) and MUST match
      the Ray your notebooks and jobs install — Ray's client protocol
      requires closely matching versions, so teams pin this to the version
      their code uses. 2.52.0 is the floor for token-authenticated APIs,
      which this chart relies on.
    value: "2.52.0"

  - name: ray_worker_replicas
    description: >
      Ray worker pods in the default CPU group — the cluster's task and
      actor capacity (the head deliberately schedules no work; see the
      template). Scale with your training and tuning load.
    value: "1"

  - name: ray_worker_cpu
    description: >
      CPUs per Ray worker (a Kubernetes CPU quantity, e.g. "2"). Ray
      schedules tasks against DECLARED capacity, so this is the
      parallelism each worker actually offers — requests and limits are
      set identically to keep the declaration honest.
    value: "2"

  - name: ray_worker_memory
    description: >
      Memory per Ray worker (a Kubernetes quantity, e.g. "4Gi"). Object
      store and task heap share it; undersized workers show up as
      object-spilling and OOM-killed tasks long before the node is
      actually full.
    value: 4Gi

  # ── Notebooks ────────────────────────────────────────────────────────────
  - name: notebook_memory_limit
    description: >
      Per-user notebook memory LIMIT — the OOM ceiling at which a runaway
      notebook dies instead of taking its node down (the upstream default
      is unlimited, which is not a production posture). Users needing more
      belong in Ray jobs, not bigger notebooks — the cluster next door is
      the scale-out path.
    value: 2G
