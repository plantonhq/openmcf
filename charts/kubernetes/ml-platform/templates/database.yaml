# The PostgreSQL cluster backing the platform's metadata — reconciled by
# CloudNativePG into a primary plus streaming replicas with automated
# failover. Applications connect through the operator-maintained -rw
# Service, which re-points to the new primary after a failover; the
# application credential lives in the operator-maintained `<name>-app`
# Secret. Both handles flow into MLflow and JupyterHub BY REFERENCE, so
# the wiring can never drift.
#
# TWO DATABASES, ONE OWNER, ONE BOOTSTRAP: initdb creates `mlflow` (every
# experiment, run, metric, registered model — and, with MLflow's default
# auth on, its users and permissions) owned by the `ml` role, and one
# line of post_init_sql (run once as superuser, right after initdb)
# creates `jupyterhub` (the hub's users, running-server records and
# tokens) under the SAME owner. One owner role is deliberate: the
# operator maintains exactly one application credential Secret
# (`<name>-app`, the initdb owner's), and both consumers read their
# password from that one Secret by reference. Ownership of both databases
# gives each consumer's schema migrations full DDL rights with NO
# create-database grant — the least-privilege shape.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-ml-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_cnpg_operator | bool %}
  relationships:
    # The database is a CloudNativePG custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator is
    # already running, and ordering against it is not this chart's to
    # declare.
    - kind: KubernetesCloudNativePgOperator
      name: "{{ values.env }}-cnpg-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-ml-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # The tracking store. The owner role is named explicitly (rather
      # than inheriting the database name) because tracking.yaml and
      # notebooks.yaml both declare the same value as their database
      # username — every side renders from the same well-known literal,
      # which is what keeps a plain-string username field honest.
      database: mlflow
      owner: ml
      postInitSql:
        # The hub's database. CREATE DATABASE cannot run inside the
        # application database's own session, which is why this rides
        # post_init_sql (superuser, against `postgres`) and not
        # post_init_application_sql. The name matches the hub's
        # database_name default ("jupyterhub") — notebooks.yaml
        # deliberately does not restate it.
        - CREATE DATABASE jupyterhub OWNER ml;
