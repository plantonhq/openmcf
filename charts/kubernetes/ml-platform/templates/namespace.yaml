# The platform's shared home. One resource OWNS the namespace and every
# tenant JOINS it (createNamespace stays false everywhere else) — two
# resources claiming the same namespace would collide with AlreadyExists at
# deploy time, and modeling the namespace as its own first-class resource
# gives every tenant a structural created-before-used edge: they reference
# this resource's name.
#
# Co-location in ONE namespace is the load-bearing design decision of this
# chart, not a tidiness choice: MLflow and JupyterHub read the database
# password, and MLflow the artifact-store credentials, through Secret
# references, and a Secret can only be read from the workload's own
# namespace. JupyterHub also renders chart-fixed internal names (hub,
# proxy, proxy-public), making it one-per-namespace by construction.
#
# KNOW THIS before deleting the platform: notebook users' home volumes
# (PVCs named claim-<username>) live in this namespace and are KEPT when
# the platform is destroyed — deleting the NAMESPACE deletes them too.
# User homes are data; back them up first.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-ml-ns"
{% if values.connection != "" %}
  annotations:
    # Explicit cluster selection: this connection overrides the environment's
    # default Kubernetes connection for this resource.
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.namespace }}"
