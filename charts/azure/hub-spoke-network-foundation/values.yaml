params:
  # ─── Placement ───────────────────────────────────────────────────────────────
  - name: region
    description: Azure region for every resource in the foundation (hub and spokes share one region; global peering is a post-deploy extension)
    value: eastus

  # ─── Hub network ─────────────────────────────────────────────────────────────
  - name: hub_vnet_cidr
    description: Address space of the hub virtual network; sized small on purpose -- the hub carries shared infrastructure (firewall, management), never workloads
    value: 10.0.0.0/22

  - name: firewall_subnet_cidr
    description: CIDR of the firewall's dedicated subnet, inside hub_vnet_cidr. ARM requires at least /26 for the subnet named AzureFirewallSubnet
    value: 10.0.0.0/26

  - name: management_subnet_cidr
    description: CIDR of the hub's management subnet, inside hub_vnet_cidr -- the landing spot for shared operations tooling (bastion hosts, jump boxes) added after deployment
    value: 10.0.1.0/24

  # ─── Spoke networks ──────────────────────────────────────────────────────────
  - name: spoke_1_name
    description: Short name of the first spoke, used in resource names (e.g. "app" yields "<env>-spoke-app-vnet")
    value: app

  - name: spoke_1_vnet_cidr
    description: Address space of the first spoke virtual network; must not overlap the hub or other spokes
    value: 10.1.0.0/16

  - name: spoke_1_workload_subnet_cidr
    description: CIDR of the first spoke's workload subnet, inside spoke_1_vnet_cidr; additional subnets are added per workload after deployment
    value: 10.1.0.0/24

  - name: spoke_2_enabled
    description: Deploy the second spoke. Disable to start with a single spoke and add more later by composing the same first-class resources
    value: true
    type: bool

  - name: spoke_2_name
    description: Short name of the second spoke, used in resource names
    value: data

  - name: spoke_2_vnet_cidr
    description: Address space of the second spoke virtual network; must not overlap the hub or other spokes
    value: 10.2.0.0/16

  - name: spoke_2_workload_subnet_cidr
    description: CIDR of the second spoke's workload subnet, inside spoke_2_vnet_cidr
    value: 10.2.0.0/24

  # ─── Firewall posture ────────────────────────────────────────────────────────
  - name: firewall_tier
    description: "Azure Firewall capability tier: STANDARD (full rule engine + threat intelligence, the production default) or PREMIUM (adds IDPS intrusion detection; TLS inspection becomes available once a CA certificate and identity are added to the policy). The firewall and its policy always share this tier"
    value: STANDARD

  - name: threat_intelligence_mode
    description: "How the firewall acts on traffic matching Microsoft's threat-intelligence feed: ALERT logs known-malicious flows, DENY logs and blocks them. Start on ALERT, review the logs, then raise to DENY"
    value: ALERT

  - name: dns_proxy_enabled
    description: Run the firewall as a DNS proxy. Required before any FQDN-based NETWORK rule resolves deterministically; application rules (this chart's baseline) work without it. After enabling, point spoke DNS at the firewall's private IP (spoke_dns_servers) so clients and firewall resolve identically
    value: false
    type: bool

  - name: spoke_dns_servers
    description: Comma-separated DNS server IPs for the spoke networks. Leave empty for Azure's default resolver (required for private DNS zone resolution). Set to the firewall's private IP -- shown in its outputs after deployment -- when dns_proxy_enabled is on
    value: ""

  - name: allowed_egress_fqdns
    description: Comma-separated FQDNs (wildcards allowed) that workloads may reach over HTTP/HTTPS through the firewall -- the platform's curated egress allowlist. Package mirrors are the usual starting set; extend per workload by deploying additional rule collection groups
    value: "*.ubuntu.com,*.debian.org,packages.microsoft.com"

  # ─── Resilience ──────────────────────────────────────────────────────────────
  - name: zone_redundant
    description: Span the firewall and its public IP across availability zones 1-3. Zone redundancy is free on Azure Firewall and is the production posture; disable only in regions without availability zones
    value: true
    type: bool

  # ─── Name resolution ─────────────────────────────────────────────────────────
  - name: private_dns_zone_name
    description: Name of the private DNS zone linked to the hub and every spoke, giving the estate internal name resolution with VM auto-registration (e.g. corp.internal). Private Link zones (privatelink.*) are added per service after deployment
    value: corp.internal

  # ─── Observability ───────────────────────────────────────────────────────────
  - name: log_retention_days
    description: Days of firewall logs and policy analytics retained in the Log Analytics workspace (30-730). Raise for compliance regimes that audit egress decisions
    value: 30
    type: number
