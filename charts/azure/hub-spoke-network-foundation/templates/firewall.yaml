# The firewall instance: WHERE the policy is enforced. It deploys into the
# hub's AzureFirewallSubnet and takes everything about WHAT it enforces
# (rules, threat intelligence, IDPS, DNS) from the attached policy -- which
# is also why no DNS settings appear here (ARM rejects firewall-level DNS
# on a policy-attached firewall).
#
# Azure Firewall provisions and deletes slowly (10-20+ minutes each way);
# the fields fixed at creation -- name, subnet, zones -- are all derived
# from parameters that should not churn.
apiVersion: azure.planton.dev/v1
kind: AzureFirewall
metadata:
  name: "{{ values.env }}-hub-firewall"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-network-foundation"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-hub-firewall"
  skuName: AZFW_VNET
  # Must match the policy's tier; both render from the same parameter.
  skuTier: "{{ values.firewall_tier }}"
  ipConfigurations:
    - name: primary
      subnetId:
        valueFrom:
          kind: AzureSubnet
          name: "{{ values.env }}-hub-firewall-subnet"
          fieldPath: status.outputs.subnet_id
      publicIpAddressId:
        valueFrom:
          kind: AzurePublicIp
          name: "{{ values.env }}-firewall-pip"
          fieldPath: status.outputs.public_ip_id
  firewallPolicyId:
    valueFrom:
      kind: AzureFirewallPolicy
      name: "{{ values.env }}-firewall-policy"
      fieldPath: status.outputs.firewall_policy_id
  {% if values.zone_redundant | bool %}
  # Zone redundancy is free on Azure Firewall (only the normal deployment
  # cost) -- the production posture wherever the region has zones.
  zones: ["1", "2", "3"]
  {% endif %}
---
# The firewall's telemetry: every rule hit, DNS proxy query, and threat-
# intelligence match into the foundation's workspace. Without this, the
# firewall decides silently -- with it, "why is my egress failing" is one
# KQL query. The category group tracks new firewall log categories as
# Azure adds them.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-hub-firewall-diagnostics"
spec:
  settingName: firewall-logs
  targetResourceId:
    valueFrom:
      kind: AzureFirewall
      name: "{{ values.env }}-hub-firewall"
      fieldPath: status.outputs.firewall_id
  enabledLogs:
    - categoryGroup: allLogs
  enabledMetrics:
    - category: AllMetrics
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-network-logs"
      fieldPath: status.outputs.workspace_id
  # Resource-specific tables (typed columns, faster queries) -- the modern
  # layout the firewall's structured log categories are designed for.
  logAnalyticsDestinationType: DEDICATED
