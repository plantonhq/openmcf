# The hub: the small, shared network that carries the estate's control
# points. Workloads never deploy here -- the hub stays stable while spokes
# come and go, which is the entire operational appeal of hub-and-spoke.
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetwork
metadata:
  name: "{{ values.env }}-hub-vnet"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-network-foundation"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-hub-vnet"
  addressSpaces:
    - "{{ values.hub_vnet_cidr }}"
---
# The firewall's dedicated subnet. ARM requires the name to be EXACTLY
# "AzureFirewallSubnet" with at least a /26 prefix, and the subnet may
# carry nothing but the firewall -- no NSG, no route table, no other
# workloads (Azure rejects all three).
apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-hub-firewall-subnet"
spec:
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-hub-vnet"
      fieldPath: status.outputs.virtual_network_id
  name: AzureFirewallSubnet
  addressPrefixes:
    - "{{ values.firewall_subnet_cidr }}"
---
# The hub's management subnet: the landing spot for shared operations
# tooling (a bastion host, a jump box, monitoring collectors) added after
# deployment. Implicit outbound access is disabled -- Azure is retiring it,
# and anything deployed here should egress deliberately (through the
# firewall via a route table, or a NAT gateway) rather than implicitly.
apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-hub-management-subnet"
spec:
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-hub-vnet"
      fieldPath: status.outputs.virtual_network_id
  name: management
  addressPrefixes:
    - "{{ values.management_subnet_cidr }}"
  defaultOutboundAccessEnabled: false
---
# The firewall's public face: a Standard-SKU static address. All spoke
# egress SNATs through it, so this is the ONE address external parties
# ever see from this estate -- the address to hand to partners for
# allowlisting.
apiVersion: azure.planton.dev/v1
kind: AzurePublicIp
metadata:
  name: "{{ values.env }}-firewall-pip"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-network-foundation"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-firewall-pip"
  {% if values.zone_redundant | bool %}
  # Anchored to all three zones so the address survives a zone outage
  # together with the zone-redundant firewall behind it.
  zones: ["1", "2", "3"]
  {% endif %}
