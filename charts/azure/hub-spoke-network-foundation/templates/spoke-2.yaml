{% if values.spoke_2_enabled | bool %}
# Spoke 2: structurally identical to spoke 1 -- an isolated workload
# network forced through the hub firewall. The two spokes are deliberately
# twins: a spoke is a stamped pattern, and adding a third is this same set
# of first-class resources with a new name and CIDR. Spoke-to-spoke
# traffic transits the firewall and is DENIED until a rule collection
# group allows it.
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetwork
metadata:
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-vnet"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-network-foundation"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-vnet"
  addressSpaces:
    - "{{ values.spoke_2_vnet_cidr }}"
  {% if values.spoke_dns_servers %}
  # Custom resolvers -- set to the firewall's private IP when its DNS
  # proxy is on, so workloads and firewall resolve names identically.
  dnsServers:
    {% for server in values.spoke_dns_servers.split(',') %}
    - "{{ server.strip() }}"
    {% endfor %}
  {% endif %}
---
# East-west anchor, shipped ruleless (Azure's implicit defaults govern
# until workload rules land) -- see spoke 1 for the rationale.
apiVersion: azure.planton.dev/v1
kind: AzureNetworkSecurityGroup
metadata:
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-nsg"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-network-foundation"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-nsg"
---
# Forced egress through the firewall, BGP propagation off -- see spoke 1
# for why both matter.
apiVersion: azure.planton.dev/v1
kind: AzureRouteTable
metadata:
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-egress"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-network-foundation"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-egress"
  routes:
    - name: default-via-firewall
      addressPrefix: "0.0.0.0/0"
      nextHopType: VIRTUAL_APPLIANCE
      nextHopInIpAddress:
        valueFrom:
          kind: AzureFirewall
          name: "{{ values.env }}-hub-firewall"
          fieldPath: status.outputs.private_ip_address
  bgpRoutePropagationEnabled: false
---
apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-workload-subnet"
spec:
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-vnet"
      fieldPath: status.outputs.virtual_network_id
  name: workload
  addressPrefixes:
    - "{{ values.spoke_2_workload_subnet_cidr }}"
  defaultOutboundAccessEnabled: false
  routeTableId:
    valueFrom:
      kind: AzureRouteTable
      name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-egress"
      fieldPath: status.outputs.route_table_id
  networkSecurityGroupId:
    valueFrom:
      kind: AzureNetworkSecurityGroup
      name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-nsg"
      fieldPath: status.outputs.network_security_group_id
---
# Peering pair -- forwarded traffic allowed both directions so
# firewall-relayed flows are admitted (see spoke 1).
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetworkPeering
metadata:
  name: "{{ values.env }}-peer-hub-to-{{ values.spoke_2_name }}"
spec:
  name: "hub-to-{{ values.spoke_2_name }}"
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-hub-vnet"
      fieldPath: status.outputs.virtual_network_id
  remoteVirtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-vnet"
      fieldPath: status.outputs.virtual_network_id
  allowForwardedTraffic: true
---
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetworkPeering
metadata:
  name: "{{ values.env }}-peer-{{ values.spoke_2_name }}-to-hub"
spec:
  name: "{{ values.spoke_2_name }}-to-hub"
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-spoke-{{ values.spoke_2_name }}-vnet"
      fieldPath: status.outputs.virtual_network_id
  remoteVirtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-hub-vnet"
      fieldPath: status.outputs.virtual_network_id
  allowForwardedTraffic: true
{% endif %}
