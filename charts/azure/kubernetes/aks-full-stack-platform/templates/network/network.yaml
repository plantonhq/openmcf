# The resource group and the cluster network. The chart owns its network
# deliberately: "a production AKS cluster in one apply" only holds if
# nothing has to exist first — and a bring-your-own subnet is what makes the
# egress model, private-node posture, and address plan reviewable
# infrastructure instead of AKS-managed defaults scattered across a hidden
# managed VNet.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureResourceGroup
metadata:
  # Azure's grain: every resource lives in exactly one resource group, and
  # the group is the natural blast-radius and cost boundary for the whole
  # platform. One group holds everything this chart deploys — EXCEPT the
  # cluster's own infrastructure (VM scale sets, managed load balancer),
  # which AKS places in a node resource group it manages itself.
  name: "{{ values.env }}-aks-rg"
spec:
  name: "{{ values.env }}-aks-rg"
  region: "{{ values.region }}"
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualNetwork
metadata:
  name: "{{ values.env }}-aks-vnet"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      # The in-chart resource group above — the reference resolves its name
      # AND orders the group before the network in the deploy graph.
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-vnet"
  # One address space for the whole platform. Azure CNI OVERLAY mode (set
  # on the cluster) means only NODES draw real VNet addresses — pods live
  # in the cluster's private pod CIDR — so the space never races pod scale.
  addressSpaces:
    - "{{ values.vnet_cidr }}"
---
# ONE subnet carries the node fleet. Azure subnets span all availability
# zones (zones are a VM placement property, not a subnet property), so a
# single subnet serves the three-zone pools without per-zone slicing. The
# NAT gateway attachment below is load-bearing: it is what the cluster's
# USER_ASSIGNED_NAT_GATEWAY egress model discovers at deploy time.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-aks-nodes-subnet"
spec:
  virtualNetworkId:
    valueFrom:
      # The in-chart VNet above — also the ordering edge.
      name: "{{ values.env }}-aks-vnet"
  name: "{{ values.env }}-aks-nodes-subnet"
  addressPrefixes:
    - "{{ values.nodes_subnet_cidr }}"
  # The subnet's attached NAT gateway (network/nat.yaml): every outbound
  # flow from nodes in this subnet SNATs through it. The reference orders
  # the gateway before the subnet — and the cluster then selects this
  # arrangement with outbound_type USER_ASSIGNED_NAT_GATEWAY instead of
  # creating its own egress path.
  natGatewayId:
    valueFrom:
      name: "{{ values.env }}-aks-nat"
