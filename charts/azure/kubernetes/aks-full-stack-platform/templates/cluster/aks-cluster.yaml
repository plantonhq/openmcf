# The cluster's control-plane identity and the AKS control plane. The
# cluster resource is ALSO where the one-run contract starts: the
# planton.dev/connection-name annotation makes the platform publish a
# Kubernetes provider connection from this cluster's outputs under a
# chart-controlled name — every Kubernetes resource in this chart consumes
# that same name via planton.dev/connection (one values param drives both
# sides, so they can never drift) and carries a runs_on relationship edge
# back to this resource so ordering is structural.
apiVersion: azure.planton.dev/v1
kind: AzureUserAssignedIdentity
metadata:
  # The AKS CONTROL PLANE runs as this identity (managing the node resource
  # group, attaching disks, creating load balancers). USER-assigned instead
  # of system-assigned for one load-bearing reason: this chart places nodes
  # in its OWN subnet, and Azure requires the cluster identity to hold
  # Network Contributor on that subnet BEFORE the cluster is created — a
  # grant that can only pre-exist on an identity with its own lifecycle.
  name: "{{ values.env }}-aks-cluster-identity"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-cluster-identity"
---
# The pre-existing grant Azure's bring-your-own-subnet contract demands:
# without Network Contributor on the node subnet, cluster creation fails
# joining nodes to it. Subnet-scoped — the narrowest scope that satisfies
# the contract (never the whole resource group).
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-subnet-grant"
spec:
  scope:
    valueFrom:
      # The node subnet (network/network.yaml). The scope is genuinely
      # polymorphic, so the explicit kind + fieldPath triple is the
      # designed usage for non-default targets.
      kind: AzureSubnet
      name: "{{ values.env }}-aks-nodes-subnet"
      fieldPath: status.outputs.subnet_id
  roleDefinitionName: Network Contributor
  principalId:
    valueFrom:
      # The cluster identity above — the reference is also the ordering
      # edge (identity before grant).
      name: "{{ values.env }}-aks-cluster-identity"
  # The identity is created in this same run: Entra replicates new
  # principals asynchronously, and a grant racing that replication fails
  # with PrincipalNotFound — this flag is Azure's own answer for exactly
  # this composition.
  skipServicePrincipalAadCheck: true
  description: AKS control plane joins nodes to the platform subnet ({{ values.env }}-aks)
---
apiVersion: azure.planton.dev/v1
kind: AzureAksCluster
metadata:
  # This name is load-bearing beyond the cluster itself: node pools attach
  # by it, every federated credential trusts its OIDC issuer, and it
  # prefixes every identity this chart composes. Rendered from env so one
  # chart deploys many environments.
  name: "{{ values.env }}-aks"
  annotations:
    # PUBLISH: the platform creates a Kubernetes provider connection named
    # by this value from the cluster's outputs (endpoint, CA, credentials).
    planton.dev/connection-name: "{{ values.cluster_connection_name }}"
  relationships:
    # The subnet grant must be EFFECTIVE before cluster creation validates
    # it — nothing in this spec consumes the grant's output, so the edge is
    # declared explicitly.
    - kind: AzureRoleAssignment
      name: "{{ values.env }}-aks-subnet-grant"
      type: depends_on
spec:
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  region: "{{ values.region }}"
  name: "{{ values.env }}-aks"
{% if values.kubernetes_version != "" %}
  kubernetesVersion: "{{ values.kubernetes_version }}"
{% endif %}
  # STANDARD tier: the financially-backed 99.95% API-server SLA (with the
  # zone spread below) and 5000-node scale — the production baseline. The
  # Free tier's missing SLA is the wrong trade for a platform cluster.
  skuTier: STANDARD
  # The default (system) pool — the one pool whose lifecycle Azure couples
  # to the cluster's. It hosts cluster-critical pods; application capacity
  # lives in the standalone pools (cluster/node-pools.yaml).
  defaultNodePool:
    name: system
    vmSize: "{{ values.system_node_vm_size }}"
    autoScalingEnabled: true
    minCount: {{ values.system_nodes_min }}
    maxCount: {{ values.system_nodes_max }}
{% if values.availability_zones %}
    zones:
{% for zone in values.availability_zones %}
      - "{{ zone }}"
{% endfor %}
{% endif %}
    # Taint the system pool CriticalAddonsOnly so application pods land on
    # the apps pool — controllers keep guaranteed capacity, and a workload
    # surge can never starve CoreDNS.
    onlyCriticalAddonsEnabled: true
    vnetSubnetId:
      valueFrom:
        # The chart's own subnet — the reference is also the ordering edge
        # (and what makes the NAT egress model below discoverable).
        name: "{{ values.env }}-aks-nodes-subnet"
    upgradeSettings:
      # AKS's recommended surge: node upgrades add 10% temporary capacity
      # instead of eating into the system pods' headroom.
      maxSurge: "10%"
  identity:
    type: USER_ASSIGNED
    identityIds:
      - valueFrom:
          # The control-plane identity above — also the ordering edge.
          name: "{{ values.env }}-aks-cluster-identity"
  # The OIDC issuer is the trust anchor of every keyless binding in this
  # chart: each controller's federated credential names this cluster's
  # issuer URL by reference. The webhook half (workloadIdentityEnabled)
  # injects the federated tokens into annotated pods.
  oidcIssuerEnabled: true
  workloadIdentityEnabled: true
{% if values.api_authorized_cidrs %}
  apiServerAccessProfile:
    authorizedIpRanges:
{% for cidr in values.api_authorized_cidrs %}
      - "{{ cidr }}"
{% endfor %}
{% endif %}
  networkProfile:
    # Azure CNI in OVERLAY mode: pods draw from the private pod CIDR, not
    # the VNet — VNet IP exhaustion is designed out. Spelled out (it is the
    # modern default) because the whole address plan above assumes it.
    networkPlugin: AZURE_CNI
    networkPluginMode: OVERLAY
    # The Cilium eBPF dataplane with Cilium NetworkPolicy enforcement —
    # Azure's modern dataplane (higher throughput, richer observability),
    # and the reason NetworkPolicy objects on this cluster actually
    # enforce: without a policy engine they are silently inert.
    networkDataPlane: DATA_PLANE_CILIUM
    networkPolicy: NETWORK_POLICY_CILIUM
    podCidr: "{{ values.pod_cidr }}"
    serviceCidr: "{{ values.service_cidr }}"
    # Egress rides the subnet's attached NAT gateway (network/nat.yaml) —
    # one static egress IP, no SNAT-port exhaustion — instead of Azure's
    # default load-balancer SNAT.
    outboundType: USER_ASSIGNED_NAT_GATEWAY
