params:
  # ── Cluster identity & binding ───────────────────────────────────────────
  - name: cluster_connection_name
    description: >
      Name under which the AKS cluster PUBLISHES its Kubernetes provider
      connection, and by which every in-chart Kubernetes resource CONSUMES
      it — the one-run contract that lets this chart create a cluster and
      deploy onto it in the same apply. One value drives both sides, so the
      producer and its consumers can never drift. Must be unique among the
      organization's connections; a per-environment name like "aks-prod"
      keeps multiple deployments of this chart apart.
    value: aks-full-stack

  - name: subscription_id
    description: >
      The Azure subscription ID everything in this chart lives in. Nothing
      in the deployed graph produces it, so it is an honest literal — MUST
      be changed. It scopes Velero's custom role definition and rides the
      cert-manager/external-dns/Velero configuration blocks that Azure's
      controllers read it from.
    value: 00000000-0000-0000-0000-000000000000

  - name: azure_tenant_id
    description: >
      The Microsoft Entra (Azure AD) tenant ID of the subscription. An
      honest literal like the subscription ID — MUST be changed. The
      External Secrets store's workload-identity authentication names it
      explicitly (unused when external_secrets_enabled is off).
    value: 00000000-0000-0000-0000-000000000000

  - name: region
    description: >
      Azure region everything in this chart lives in (e.g. "eastus2",
      "westeurope"). The resource group, network, NAT gateway, cluster,
      node pools, and backup storage account all follow it. Pick a region
      with availability zones to get the zone spread the defaults assume.
    value: eastus2

  # ── Network (the chart provisions its own VNet) ──────────────────────────
  - name: vnet_cidr
    description: >
      IPv4 address space of the cluster virtual network. Azure CNI OVERLAY
      mode means only NODES draw real VNet addresses (pods live in the
      private pod_cidr below), so /16 is generous without hoarding RFC1918
      space. Must not overlap networks you will peer or VPN to.
    value: 10.30.0.0/16

  - name: nodes_subnet_cidr
    description: >
      IPv4 CIDR of the node subnet, carved from vnet_cidr. Every node takes
      one address; /20 (~4k addresses) comfortably serves hundreds of nodes
      with room for rotations (upgrades briefly run old and new nodes side
      by side).
    value: 10.30.0.0/20

  - name: pod_cidr
    description: >
      Private IPv4 range pods draw addresses from (Azure CNI overlay — pods
      do NOT consume VNet addresses, which is what eliminates VNet IP
      exhaustion). Must not overlap vnet_cidr or the service_cidr below.
      Size it big: /14 serves hundreds of nodes at 250 pods each.
    value: 10.244.0.0/14

  - name: service_cidr
    description: >
      IPv4 range for Kubernetes Service (ClusterIP) addresses. Never routed
      outside the cluster but must not overlap vnet_cidr, pod_cidr, or
      peered networks. Services are far fewer than pods — /16 is generous.
    value: 10.0.0.0/16

  # ── AKS control plane ────────────────────────────────────────────────────
  - name: kubernetes_version
    description: >
      Kubernetes version for the control plane — a minor alias like "1.33"
      (latest GA patch of that minor) or an exact "1.33.2". Empty deploys
      the AKS-recommended GA version, which is the safe default for a fresh
      platform; PIN a version once the cluster carries production workloads
      so upgrades happen when you choose, not when you redeploy.
    value: ""

  - name: api_authorized_cidrs
    type: list
    description: >
      IPv4 CIDRs allowed to reach the cluster's PUBLIC API endpoint. Empty
      leaves the endpoint open to any IP that presents valid Entra
      credentials (RBAC still holds the door). Restricting this to your
      office/VPN egress ranges is the single cheapest hardening step —
      nodes and the platform's addon controllers never depend on it.
    value: []

  - name: availability_zones
    type: list
    description: >
      Availability zones the system and application node pools spread
      across. Three zones is the production posture (and what the STANDARD
      tier's 99.95% SLA assumes). Set to an empty list for regions without
      zones — the pools then place regionally.
    value:
      - "1"
      - "2"
      - "3"

  # ── System node pool (the always-on floor) ───────────────────────────────
  - name: system_node_vm_size
    description: >
      Azure VM size for the SYSTEM node pool — the small, always-on pool
      that hosts cluster-critical pods (CoreDNS, metrics-server, and the
      addon controllers this chart installs) so application autoscaling
      never depends on capacity it manages itself. Standard_D4s_v5 (4 vCPU,
      16 GB) fits the baseline's controllers with room.
    value: Standard_D4s_v5

  - name: system_nodes_min
    description: >
      Autoscaling floor of the system pool, TOTAL nodes across all zones.
      Three (one per zone) is the production minimum: controllers keep zone
      spread and no single node drain takes the platform's control loops
      down.
    value: "3"

  - name: system_nodes_max
    description: >
      Autoscaling ceiling of the system pool. It holds only cluster-critical
      pods (tainted CriticalAddonsOnly), so it rarely needs to grow —
      application capacity is the apps pool's job, not this pool's.
    value: "5"

  # ── Application node pool (the self-scaling capacity) ────────────────────
  - name: apps_node_vm_size
    description: >
      Azure VM size for the APPLICATION node pool — the pool the cluster
      autoscaler grows and shrinks between the bounds below as workloads
      come and go. Pick the shape your workloads actually request;
      Standard_D4s_v5 is the general-purpose starting point.
    value: Standard_D4s_v5

  - name: apps_nodes_min
    description: >
      Autoscaling floor of the application pool, TOTAL nodes. Zero is legal
      (the pool parks when nothing runs) but leaves the first deployment
      waiting on a node boot; one warm node is the pragmatic floor.
    value: "1"

  - name: apps_nodes_max
    description: >
      Autoscaling ceiling of the application pool — the blast-radius guard
      that caps what a runaway workload (or a mistake) can spend. Scaling
      stops at the limit; raise it as the platform grows.
    value: "10"

  # ── Spot capacity (opt-in, scale-to-zero) ────────────────────────────────
  - name: spot_pool_enabled
    type: bool
    description: >
      Add a scale-to-zero Spot node pool: deeply discounted (up to 90%)
      capacity for fault-tolerant workloads. Azure taints Spot nodes
      automatically (kubernetes.azure.com/scalesetpriority=spot:NoSchedule),
      so nothing lands there without opting in. Costs nothing while idle —
      the pool starts at zero nodes; Azure evicts Spot VMs when it needs
      the capacity back, so keep stateful and singleton workloads on the
      application pool.
    value: false

  - name: spot_node_vm_size
    description: >
      Azure VM size for the Spot pool (only used when spot_pool_enabled is
      true). Pick the shape your batch/fault-tolerant workloads request;
      Spot discounts apply to nearly every family.
    value: Standard_D4s_v5

  - name: spot_nodes_max
    description: >
      Autoscaling ceiling of the Spot pool, TOTAL nodes (the floor is zero
      — scale-to-zero is the point). Only used when spot_pool_enabled is
      true.
    value: "9"

  # ── Exposure (pick one entry-point model) ────────────────────────────────
  - name: use_gateway_api
    type: bool
    description: >
      Exposure arm switch. False (default) installs ingress-nginx as the
      cluster's default IngressClass — the battle-tested entry point every
      tutorial assumes. True instead installs the Gateway API resources
      (CRDs, a GatewayClass, and a shared platform Gateway) for an
      implementation YOU run — name it in gateway_controller_name. One
      entry point, one mental model, never both.
    value: false

  - name: ingress_replicas
    description: >
      Replicas of the ingress-nginx controller (only used when
      use_gateway_api is false). Two is the production floor: the
      controller is the single entry point for all HTTP traffic, and with
      one replica every node drain is a traffic outage.
    value: "2"

  - name: gateway_controller_name
    description: >
      The controllerName your Gateway API implementation announces (only
      used when use_gateway_api is true), e.g.
      "gateway.nginx.org/nginx-gateway-controller" for NGINX Gateway
      Fabric. The GatewayClass binds to it, and it is IMMUTABLE once
      created — pick the implementation before flipping the arm on.
    value: gateway.nginx.org/nginx-gateway-controller

  # ── DNS (Azure DNS) ──────────────────────────────────────────────────────
  - name: dns_zone_names
    type: list
    description: >
      Planton resource names of the AzureDnsZone resources this platform
      manages. The zone IDs flow in by reference at deploy time (grants and
      filters both), so the format can never be wrong. The zones must exist
      in the target environment when this chart deploys — they usually
      predate the cluster (the offline validator reports them as unresolved
      by design). Replace the placeholder with your zone resource names.
    value:
      - my-dns-zone

  - name: dns_zone_resource_group
    description: >
      Name of the Azure resource group holding the DNS zones above. The
      zones predate this chart, so their resource group is an honest
      literal — MUST match where the zones really live; cert-manager and
      external-dns read it from their provider configuration.
    value: dns-zones-rg

  - name: dns_domains
    type: list
    description: >
      Domain suffixes external-dns is allowed to manage (e.g. "example.com"
      covers every name under it). The first guardrail against the
      controller touching unrelated zones the identity can see — keep it as
      narrow as the platform's real domains.
    value:
      - example.com

  - name: dns_txt_owner_id
    description: >
      Ownership ID this cluster's external-dns writes into its TXT registry
      records. Every cluster sharing a DNS zone MUST use a distinct value —
      it is what stops one cluster's controller from fighting over (or,
      under a sync policy, deleting) another cluster's records.
    value: aks-full-stack

  # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
  - name: acme_email
    description: >
      Email registered with the Let's Encrypt ACME account. Expiry notices
      and account notifications go here — use a team alias, not a personal
      address. MUST be changed; Let's Encrypt rejects example.com addresses.
    value: platform-team@example.com

  - name: acme_http01_enabled
    type: bool
    description: >
      Adds an opt-in HTTP-01 solver beside the default DNS-01 solver:
      Certificates labeled "acme-solver: http01" solve over HTTP through
      this chart's entry point. For domains whose DNS lives outside the
      Azure DNS zones this chart manages. DNS-01 remains the default — it
      issues wildcards and works for services that are not publicly
      reachable.
    value: false

  # ── Secrets (External Secrets Operator + Azure Key Vault) ────────────────
  - name: external_secrets_enabled
    type: bool
    description: >
      Install the External Secrets Operator with a cluster-wide store
      reading an Azure Key Vault — keyless, through the operator's own
      workload-identity federation. Workloads then declare ExternalSecrets
      naming secrets in the vault and receive native Kubernetes Secrets; no
      secret value ever lands in a manifest.
    value: true

  - name: key_vault_name
    description: >
      Planton resource name of the AzureKeyVault the cluster-wide secret
      store reads (only used when external_secrets_enabled is true). The
      vault's URL and the operator's read grant both flow in by reference.
      Like the DNS zones, the vault predates the cluster — it holds the
      platform's secrets, which outlive any one cluster (the offline
      validator reports the reference as unresolved by design). The vault
      must use Azure RBAC authorization (not access policies) — the grant
      this chart composes is an RBAC role assignment.
    value: my-key-vault

  # ── Backups (Velero → Azure Blob Storage) ────────────────────────────────
  - name: velero_enabled
    type: bool
    description: >
      The self-backing-up half of the story: a zone-redundant storage
      account and container, a dedicated backup identity carrying Velero's
      documented permission set, the VolumeSnapshotClass its CSI snapshots
      require, and Velero on a schedule. Restore is one command away when a
      namespace is deleted or a cluster migrates. Off only for clusters
      whose disaster-recovery story lives elsewhere.
    value: true

  - name: velero_storage_suffix
    description: >
      Uniqueness suffix of the backup storage account's name. Storage
      account names are GLOBAL across all of Azure and allow only lowercase
      letters and digits, so the chart composes
      "<env without hyphens>aksvlr<suffix>" — change the suffix if the
      composed name collides (the README's naming section lists the exact
      length budget).
    value: "001"

  - name: velero_schedule
    description: >
      Cron schedule (UTC) of the recurring cluster backup (only used when
      velero_enabled is true). The default backs up daily at 01:00 UTC —
      align it with your low-traffic window.
    value: "0 1 * * *"

  - name: velero_backup_ttl
    description: >
      How long scheduled backups are retained before Velero's garbage
      collector removes them (Go duration; 720h = 30 days). Storage is the
      only cost of a longer window — blob storage is cheap, re-creating
      lost state is not.
    value: 720h

  # ── The operator layer (what makes this the FULL-STACK platform) ─────────
  # CloudNativePG installs unconditionally — Postgres is the standard.
  # Each further operator is a toggle: install it when the first application
  # needs its engine, not before. All operators watch EVERY namespace, so
  # applications declare their data services in their own namespaces (or
  # through the app-data-services chart) against this cluster's connection.
  - name: mysql_operator_enabled
    type: bool
    description: >
      Install the Percona XtraDB Cluster operator (cluster-wide watch) so
      applications can declare KubernetesMysql databases — Galera-replicated
      MySQL with proxies and scheduled backups — in their own namespaces.
    value: false

  - name: mongodb_operator_enabled
    type: bool
    description: >
      Install the Percona Server for MongoDB operator (cluster-wide watch)
      so applications can declare KubernetesMongodb replica sets — with
      failover elections and PBM backups — in their own namespaces.
    value: false

  - name: kafka_operator_enabled
    type: bool
    description: >
      Install the Strimzi operator (any-namespace watch) so applications can
      declare KubernetesKafka clusters, topics, and users in their own
      namespaces. Note Strimzi's own contract: a namespace must exist before
      a Kafka cluster is declared in it.
    value: false

  - name: rabbitmq_operator_enabled
    type: bool
    description: >
      Install the RabbitMQ cluster operator (watches all namespaces, its
      upstream default) so applications can declare KubernetesRabbitMq
      brokers in their own namespaces. Requires cert-manager — already part
      of this chart's baseline.
    value: false

  - name: keda_enabled
    type: bool
    description: >
      Install KEDA for event-driven autoscaling — workloads scale on queue
      depth, Kafka consumer lag, cloud metrics, or cron, including to and
      from zero. A cluster singleton (Kubernetes allows one external-metrics
      provider) — never enable this AND the cluster kind's managed-KEDA
      add-on together. Install it when the first workload actually scales
      on events.
    value: false
