apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: Azure AKS Full-Stack Platform
spec:
  selector:
    kind: platform
  description: The AKS cluster your full-stack apps land on — the complete self-scaling, self-backing-up baseline plus the cluster-resident data operators (PostgreSQL always; MySQL, MongoDB, Kafka, RabbitMQ, and KEDA on toggles).
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/azure/azureakscluster/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/azure/kubernetes/aks-full-stack-platform
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/azure/kubernetes/aks-full-stack-platform/README.md
