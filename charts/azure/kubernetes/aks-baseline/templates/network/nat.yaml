# The NAT gateway — the private nodes' only road to the internet. This
# chart's nodes carry no public IPs, so anything outside Azure — image
# pulls from Docker Hub or GHCR, the Let's Encrypt ACME endpoints, external
# APIs — egresses through this gateway. ONE gateway with ONE static IP is
# the right COST posture: Azure's NAT Gateway is a zone-resilient managed
# service billed per gateway-hour plus data, and it ends the SNAT-port
# exhaustion class that load-balancer egress (Azure's default outbound
# model) hits under connection-heavy workloads. The static IP is also the
# platform's stable egress address — what third parties allowlist.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePublicIp
metadata:
  name: "{{ values.env }}-aks-nat-ip"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      # The in-chart resource group (network/network.yaml) — also the
      # ordering edge.
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-nat-ip"
  # Standard SKU is REQUIRED for NAT gateway association (and is always
  # statically allocated — the egress address never changes across
  # gateway restarts).
  sku: STANDARD
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureNatGateway
metadata:
  name: "{{ values.env }}-aks-nat"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-nat"
  publicIpIds:
    # The static egress IP above — the reference is also the ordering edge.
    # More IPs mean more SNAT ports (~64k per IP); one serves hundreds of
    # nodes of ordinary traffic, and adding a second later is an in-place
    # update.
    - valueFrom:
        name: "{{ values.env }}-aks-nat-ip"
