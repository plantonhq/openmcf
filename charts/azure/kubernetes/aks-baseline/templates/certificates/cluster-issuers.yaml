# Let's Encrypt ClusterIssuers — the platform's public certificate authority
# front-ends. Two issuers, deliberately:
#
#   letsencrypt-prod    — real, browser-trusted certificates. Rate-limited by
#                         Let's Encrypt (per-domain weekly caps), so nothing
#                         experimental should point here.
#   letsencrypt-staging — the staging endpoint: identical mechanics, untrusted
#                         chain, effectively unlimited. Point new Certificates
#                         here FIRST; switch the issuer name to prod only once
#                         issuance succeeds. This is what protects the
#                         production rate limit from a misconfigured rollout.
#
# Both issuers solve challenges with DNS-01 through Azure DNS — the same
# zones external-dns publishes records to — and carry NO static credentials:
# the solver inherits cert-manager's ambient identity (the federated
# credential in the previous file). DNS-01 is the default because it issues
# wildcards and works for services that are not publicly reachable.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterIssuer
metadata:
  name: "{{ values.env }}-letsencrypt-prod"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
{% if values.acme_http01_enabled | bool and values.use_gateway_api | bool %}
    # The HTTP-01 gateway solver below names the Gateway as a plain string
    # (Gateway API's parentRef shape carries no reference), so nothing in
    # the spec creates a dependency edge — this declares it explicitly.
    - kind: KubernetesGateway
      name: "{{ values.env }}-gateway"
      type: depends_on
{% endif %}
spec:
  # Reference into the in-chart cert-manager: resolves its cluster-resource
  # namespace (where ACME account keys live) and gives the dependency graph
  # the cert-manager-before-issuer edge structurally.
  certManagerNamespace:
    valueFrom:
      name: "{{ values.env }}-cert-manager"
  config:
    acme:
      email: "{{ values.acme_email }}"
      # Let's Encrypt production directory is the field's default — spelled
      # out so prod vs staging reads side by side in this file.
      server: https://acme-v02.api.letsencrypt.org/directory
      solvers:
        # The catch-all DNS-01 solver (no selector): every Certificate that
        # does not opt into another solver lands here. Subscription and
        # resource group locate the zones; NO service principal and NO
        # managed-identity client ID means the solver runs with
        # cert-manager's ambient Azure identity — the federated credential.
        # The zone name is deliberately absent too: cert-manager discovers
        # the zone from the record name, so one solver serves every zone
        # the identity's grants cover.
        - dns01:
            azureDns:
              subscriptionId: "{{ values.subscription_id }}"
              resourceGroupName: "{{ values.dns_zone_resource_group }}"
{% if values.acme_http01_enabled | bool %}
        # Opt-in HTTP-01 solver: certificates labeled "acme-solver: http01"
        # solve over HTTP through the platform's entry point instead of
        # DNS. For domains whose zones this chart's Azure DNS identity does
        # not manage. The label selector keeps exactly one catch-all solver
        # (the DNS-01 above) — two selectorless solvers would be ambiguous.
        - selector:
            matchLabels:
              acme-solver: http01
          http01:
{% if values.use_gateway_api | bool %}
            gatewayHttpRoute:
              parentRefs:
                # The in-chart Gateway (exposure/gateway-api.yaml). Plain
                # strings by Gateway API's own shape — the depends_on edge
                # on this resource's metadata makes the ordering structural.
                - name: "{{ values.env }}-gateway"
                  namespace: gateway
{% else %}
            ingress:
              # Ephemeral challenge Ingresses ride the ingress-nginx class
              # installed by this chart (exposure/ingress-nginx.yaml).
              ingressClassName: nginx
{% endif %}
{% endif %}
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterIssuer
metadata:
  name: "{{ values.env }}-letsencrypt-staging"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
{% if values.acme_http01_enabled | bool and values.use_gateway_api | bool %}
    - kind: KubernetesGateway
      name: "{{ values.env }}-gateway"
      type: depends_on
{% endif %}
spec:
  certManagerNamespace:
    valueFrom:
      name: "{{ values.env }}-cert-manager"
  config:
    acme:
      email: "{{ values.acme_email }}"
      # The staging endpoint — untrusted chain, generous rate limits.
      # Identical solver configuration to prod ON PURPOSE: a certificate
      # proven against staging switches to prod by changing only the issuer
      # name it selects.
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      solvers:
        - dns01:
            azureDns:
              subscriptionId: "{{ values.subscription_id }}"
              resourceGroupName: "{{ values.dns_zone_resource_group }}"
{% if values.acme_http01_enabled | bool %}
        - selector:
            matchLabels:
              acme-solver: http01
          http01:
{% if values.use_gateway_api | bool %}
            gatewayHttpRoute:
              parentRefs:
                - name: "{{ values.env }}-gateway"
                  namespace: gateway
{% else %}
            ingress:
              ingressClassName: nginx
{% endif %}
{% endif %}
