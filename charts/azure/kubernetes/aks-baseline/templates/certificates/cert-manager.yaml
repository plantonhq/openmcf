# cert-manager and its keyless Azure identity. Everything TLS in this
# baseline hangs off this controller: the Let's Encrypt ClusterIssuers
# (next file) are cert-manager custom resources, and application
# Certificates in any namespace are reconciled by it. Its DNS-01 solvers
# write Azure DNS records through the identity below — keylessly.
#
# The AKS identity pattern, used by every controller in this chart, is
# three parts: (1) a user-assigned managed identity carrying the
# Azure-side role assignments, (2) a federated identity credential — the
# trust rule that lets the controller's KUBERNETES service account exchange
# its token for the identity's credentials, anchored on the cluster's OIDC
# issuer — and (3) the azure.workload.identity annotations/labels on the
# controller's pods (the component's workloadIdentity block below). No
# secret is created, exported, or stored anywhere.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureUserAssignedIdentity
metadata:
  name: "{{ values.env }}-aks-cert-manager"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-cert-manager"
---
# The trust rule: exactly one external workload — cert-manager's controller
# ServiceAccount, vouched for by THIS cluster's OIDC issuer — may act as
# the identity above. The issuer arrives BY REFERENCE from the cluster's
# outputs (it embeds a server-generated URL no render-time value can
# carry), which also orders cluster-before-credential structurally.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFederatedIdentityCredential
metadata:
  name: "{{ values.env }}-aks-cert-manager-fic"
spec:
  name: "{{ values.env }}-aks-cert-manager-fic"
  userAssignedIdentity:
    valueFrom:
      # The identity above — also the ordering edge.
      name: "{{ values.env }}-aks-cert-manager"
  issuer:
    valueFrom:
      # The cluster's oidc_issuer_url output (the field's annotated
      # composition key).
      name: "{{ values.env }}-aks"
  # Chart truth: the cert-manager release name is fixed to "cert-manager"
  # (one per cluster), so its controller ServiceAccount is "cert-manager"
  # in the "cert-manager" namespace. One credential trusts exactly one
  # subject — no wildcards exist in Azure's trust model.
  subject: system:serviceaccount:cert-manager:cert-manager
---
{% for zone in values.dns_zone_names %}
# DNS Zone Contributor, scoped to each zone the platform manages — Azure
# DNS has zone-scoped RBAC (unlike clouds whose DNS grants stop at the
# project), so the solver identity gets record-write rights on exactly
# these zones and nothing else. The zones live outside this chart (they
# usually predate the cluster); the offline validator reports the
# references as unresolved by design.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-cert-manager-dns-{{ zone }}"
spec:
  scope:
    valueFrom:
      kind: AzureDnsZone
      name: "{{ zone }}"
      fieldPath: status.outputs.zone_id
  roleDefinitionName: DNS Zone Contributor
  principalId:
    valueFrom:
      name: "{{ values.env }}-aks-cert-manager"
  # The identity is created in this same run — skip the Entra replication
  # race (PrincipalNotFound) the way Azure itself prescribes.
  skipServicePrincipalAadCheck: true
  description: cert-manager writes DNS-01 challenge records in {{ zone }} ({{ values.env }}-aks)
---
{% endfor %}
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCertManager
metadata:
  name: "{{ values.env }}-cert-manager"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
    # The federated trust must be EFFECTIVE before the controller solves
    # its first challenge — no spec field consumes a credential output, so
    # the edge is declared explicitly.
    - kind: AzureFederatedIdentityCredential
      name: "{{ values.env }}-aks-cert-manager-fic"
      type: depends_on
spec:
  # "cert-manager" is the upstream-conventional home and is deliberately
  # NOT parameterized: the namespace is effectively permanent (the kept
  # CRDs pin release ownership to it — reinstalling elsewhere fails Helm's
  # ownership check), and every runbook on the internet assumes this name.
  namespace:
    value: cert-manager
  createNamespace: true
  # Keyless DNS-01: the controller's ServiceAccount is annotated with the
  # identity's client ID (and its pods labeled for the workload-identity
  # webhook the cluster runs), and the issuers' solvers deliberately carry
  # NO static credentials — they inherit this ambient identity. One
  # federation here secures every certificate the platform ever issues.
  workloadIdentity:
    aks:
      clientId:
        valueFrom:
          name: "{{ values.env }}-aks-cert-manager"
