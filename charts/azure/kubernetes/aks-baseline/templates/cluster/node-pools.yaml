# The APPLICATION node pool — the capacity workloads actually run on,
# scaled by the AKS-native cluster autoscaler between the bounds you set.
# AKS's grain: the cluster autoscaler is built into the managed control
# plane and engages per-pool via autoScalingEnabled — nothing to install,
# nothing to operate (where EKS platforms install Karpenter, AKS ships the
# equivalent loop). The system pool (on the cluster resource) is tainted
# CriticalAddonsOnly, so THIS pool is where every application pod lands.
apiVersion: azure.planton.dev/v1
kind: AzureAksNodePool
metadata:
  name: "{{ values.env }}-aks-apps"
spec:
  kubernetesClusterId:
    valueFrom:
      # Resolves the cluster's ARM ID; also the ordering edge that deploys
      # the control plane before its workload pools.
      name: "{{ values.env }}-aks"
  name: apps
  vmSize: "{{ values.apps_node_vm_size }}"
  # USER mode: application workloads, allowed to scale to zero (though the
  # floor below keeps warm capacity), never hosts system pods.
  mode: USER
  autoScalingEnabled: true
  minCount: {{ values.apps_nodes_min }}
  maxCount: {{ values.apps_nodes_max }}
{% if values.availability_zones %}
  zones:
{% for zone in values.availability_zones %}
    - "{{ zone }}"
{% endfor %}
{% endif %}
  upgradeSettings:
    # Surge upgrades: replacement nodes come up before old ones drain —
    # capacity never dips during node-image or Kubernetes upgrades.
    maxSurge: "33%"
{% if values.spot_pool_enabled | bool %}
---
# The opt-in Spot pool — deeply discounted capacity that scales from ZERO
# (costs nothing while idle) for fault-tolerant workloads. Azure taints
# Spot nodes automatically (kubernetes.azure.com/scalesetpriority=spot:
# NoSchedule) and labels them with the same key, so nothing lands here
# without an explicit toleration + nodeSelector — eviction can reclaim a
# Spot VM at any time.
apiVersion: azure.planton.dev/v1
kind: AzureAksNodePool
metadata:
  name: "{{ values.env }}-aks-spot"
spec:
  kubernetesClusterId:
    valueFrom:
      name: "{{ values.env }}-aks"
  name: spot
  vmSize: "{{ values.spot_node_vm_size }}"
  mode: USER
  # SPOT priority with its defaults spelled where they matter: eviction
  # DELETES the VM (billing stops entirely), and no max price means "pay up
  # to the on-demand rate, never be evicted on price" — capacity eviction
  # is the only reclaim path, which is the setting nearly everyone wants.
  priority: SPOT
  evictionPolicy: EVICTION_DELETE
  autoScalingEnabled: true
  # Scale-to-zero is the point: the pool exists as latent cheap capacity.
  minCount: 0
  maxCount: {{ values.spot_nodes_max }}
{% if values.availability_zones %}
  zones:
{% for zone in values.availability_zones %}
    - "{{ zone }}"
{% endfor %}
{% endif %}
{% endif %}
