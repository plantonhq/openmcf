{% if values.velero_enabled | bool %}
# The self-backing-up arm: a zone-redundant storage account and container,
# a dedicated backup identity carrying Velero's documented permission set,
# the VolumeSnapshotClass its CSI snapshots require, and Velero on a
# schedule. Everything the backup story needs rides this one toggle —
# flipping it off removes the identity and storage with the workload,
# never stranding half an arm.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  # Storage account names are GLOBAL across all of Azure and allow ONLY
  # lowercase letters and digits (3-24 chars) — the env prefix is squeezed
  # through a hyphen-stripping filter and the suffix param is the
  # collision escape. The name is render-known, which is what lets
  # Velero's storageAccount field below carry it exactly.
  name: "{{ values.env | replace('-', '') }}aksvlr{{ values.velero_storage_suffix }}"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  accountName: "{{ values.env | replace('-', '') }}aksvlr{{ values.velero_storage_suffix }}"
  # Zone-redundant: the backup of a three-zone cluster should not live in
  # one datacenter — ZRS is the single-region production recommendation.
  replicationType: ZRS
  # No container or blob in this account may ever be made public — the
  # hardened posture for storage holding full-cluster state.
  allowNestedItemsToBePublic: false
  blobProperties:
    # Versioning protects the backup history itself: an accidental (or
    # malicious) overwrite of a backup object is recoverable.
    versioningEnabled: true
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageContainer
metadata:
  name: "{{ values.env }}-aks-velero-container"
spec:
  storageAccountId:
    valueFrom:
      # The account above — also the ordering edge.
      name: "{{ values.env | replace('-', '') }}aksvlr{{ values.velero_storage_suffix }}"
  containerName: velero-backups
  # PRIVATE is the kind's default — no anonymous access exists for this
  # container regardless of account-level settings.
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureUserAssignedIdentity
metadata:
  name: "{{ values.env }}-aks-velero"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-velero"
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFederatedIdentityCredential
metadata:
  name: "{{ values.env }}-aks-velero-fic"
spec:
  name: "{{ values.env }}-aks-velero-fic"
  userAssignedIdentity:
    valueFrom:
      name: "{{ values.env }}-aks-velero"
  issuer:
    valueFrom:
      # The cluster's OIDC issuer — the trust anchor, by reference.
      name: "{{ values.env }}-aks"
  # Chart truth: the velero release name is fixed to "velero", so the
  # server ServiceAccount is "velero-server" in the "velero" namespace.
  subject: system:serviceaccount:velero:velero-server
---
# Velero's permissions as the EXACT custom role its Azure plugin documents
# — disk get-access/snapshot lifecycle for volume snapshots, storage
# account/container management reads, and the blob data operations backups
# ride. A first-class role node: permission changes happen here and the
# grants below pick them up by reference.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleDefinition
metadata:
  name: "{{ values.env }}-aks-velero"
spec:
  name: "{{ values.env }}-aks-velero"
  # Custom roles are defined AT a scope and assignable within it — the
  # subscription is the honest home (the role must be assignable at both
  # the cluster's node resource group and the storage account). An honest
  # literal: nothing in the graph outputs the subscription's ARM path.
  scope:
    value: /subscriptions/{{ values.subscription_id }}
  assignableScopes:
    - value: /subscriptions/{{ values.subscription_id }}
  description: Velero backup permissions (snapshots + blob data) for the {{ values.env }}-aks cluster
  permissions:
    - actions:
        - Microsoft.Compute/disks/read
        - Microsoft.Compute/disks/write
        - Microsoft.Compute/disks/endGetAccess/action
        - Microsoft.Compute/disks/beginGetAccess/action
        - Microsoft.Compute/snapshots/read
        - Microsoft.Compute/snapshots/write
        - Microsoft.Compute/snapshots/delete
        - Microsoft.Storage/storageAccounts/listkeys/action
        - Microsoft.Storage/storageAccounts/regeneratekey/action
        - Microsoft.Storage/storageAccounts/read
        - Microsoft.Storage/storageAccounts/blobServices/containers/delete
        - Microsoft.Storage/storageAccounts/blobServices/containers/read
        - Microsoft.Storage/storageAccounts/blobServices/containers/write
        - Microsoft.Storage/storageAccounts/blobServices/generateUserDelegationKey/action
      dataActions:
        - Microsoft.Storage/storageAccounts/blobServices/containers/blobs/delete
        - Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read
        - Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write
        - Microsoft.Storage/storageAccounts/blobServices/containers/blobs/move/action
        - Microsoft.Storage/storageAccounts/blobServices/containers/blobs/add/action
---
# The role granted at the NODE resource group — where AKS keeps the
# cluster's disks, and where Velero creates their snapshots. The scope
# arrives by reference from the cluster's outputs (the node group's name
# is Azure-derived — no render-time value can carry it), which also orders
# cluster-before-grant.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-velero-snapshots"
spec:
  scope:
    valueFrom:
      kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      fieldPath: status.outputs.node_resource_group_id
  roleDefinitionId:
    valueFrom:
      # The custom role above — the reference is also the ordering edge
      # (role before grant), and a permission edit to the role reaches
      # this grant with no further wiring.
      name: "{{ values.env }}-aks-velero"
  principalId:
    valueFrom:
      name: "{{ values.env }}-aks-velero"
  skipServicePrincipalAadCheck: true
  description: Velero snapshots the cluster's disks in the node resource group ({{ values.env }}-aks)
---
# The same role granted at the STORAGE ACCOUNT — the narrowest scope that
# covers the account read, container management, user-delegation-key
# minting, and the blob data operations the backup store rides. Account-
# scoped, never subscription-scoped: this identity can touch no other
# storage.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-velero-storage"
spec:
  scope:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env | replace('-', '') }}aksvlr{{ values.velero_storage_suffix }}"
      fieldPath: status.outputs.storage_account_id
  roleDefinitionId:
    valueFrom:
      name: "{{ values.env }}-aks-velero"
  principalId:
    valueFrom:
      name: "{{ values.env }}-aks-velero"
  skipServicePrincipalAadCheck: true
  description: Velero reads and writes backup objects in the platform backup account ({{ values.env }}-aks)
---
# The VolumeSnapshotClass Velero requires: CSI snapshots silently DON'T
# HAPPEN without a class for the volume's driver carrying the
# velero.io/csi-volumesnapshot-class label — the backup still reports
# Completed while the volumes were never snapshotted. AKS ships the CSI
# snapshot CONTROLLER with the cluster (storage profile default) but
# creates NO class; shipping it with the arm closes that trap at the
# source.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesManifest
metadata:
  name: "{{ values.env }}-velero-snapshot-class"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
spec:
  # The document is cluster-scoped; the anchor namespace is required by the
  # kind's contract but unused here — kube-system always exists.
  namespace:
    value: kube-system
  createNamespace: false
  manifestYaml: |
    apiVersion: snapshot.storage.k8s.io/v1
    kind: VolumeSnapshotClass
    metadata:
      name: velero-azuredisk-csi
      labels:
        # THE label Velero's CSI path selects its class by.
        velero.io/csi-volumesnapshot-class: "true"
    driver: disk.csi.azure.com
    # Delete the managed-disk snapshot when the VolumeSnapshot object is
    # removed — Velero's own backup expiry then reclaims storage instead of
    # leaking orphaned snapshots.
    deletionPolicy: Delete
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesVelero
metadata:
  name: "{{ values.env }}-velero"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
    # Three halves of the backup identity that no spec field consumes: the
    # federated trust rule and the two role grants. All must be effective
    # before the first backup runs — declared explicitly because nothing
    # flows from them into this spec.
    - kind: AzureFederatedIdentityCredential
      name: "{{ values.env }}-aks-velero-fic"
      type: depends_on
    - kind: AzureRoleAssignment
      name: "{{ values.env }}-aks-velero-snapshots"
      type: depends_on
    - kind: AzureRoleAssignment
      name: "{{ values.env }}-aks-velero-storage"
      type: depends_on
spec:
  # "velero" is the upstream convention; the fixed release name pins the
  # ServiceAccount the federated credential above trusts.
  namespace:
    value: velero
  createNamespace: true
  backupStorage:
    azureBlob:
      # Render-known both sides: the same expressions name the storage
      # resources above.
      storageAccount: "{{ values.env | replace('-', '') }}aksvlr{{ values.velero_storage_suffix }}"
      container: velero-backups
      resourceGroup: "{{ values.env }}-aks-rg"
      subscriptionId: "{{ values.subscription_id }}"
      # Keyless: the identity's client ID annotates the server
      # ServiceAccount and labels its pods for the workload-identity
      # webhook — no Secret holds a credential. The reference is also the
      # ordering edge.
      workloadIdentityClientId:
        valueFrom:
          name: "{{ values.env }}-aks-velero"
    # One container, one prefix per cluster — the multi-cluster pattern: a
    # standby cluster restores from this same container under its own
    # prefix.
    prefix: "{{ values.env }}-aks"
  volumeSnapshots:
    enabled: true
    # CSI snapshots: PVCs snapshot through the CSI snapshot API — the
    # modern path on AKS, whose Azure Disk CSI driver and snapshot
    # controller ship with the cluster; the class above completes the
    # machinery.
    enableCsi: true
  schedules:
    # The recurring full-cluster backup. Restore is `velero restore create
    # --from-backup <name>` — the README's after-deployment section walks
    # the full loop.
    - name: daily
      schedule: "{{ values.velero_schedule }}"
      ttl: "{{ values.velero_backup_ttl }}"
{% endif %}
