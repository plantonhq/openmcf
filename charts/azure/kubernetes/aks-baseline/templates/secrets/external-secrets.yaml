{% if values.external_secrets_enabled | bool %}
# External Secrets Operator, its keyless Azure identity, and a cluster-wide
# store reading an Azure Key Vault — the pattern that keeps secret VALUES
# out of manifests entirely: workloads declare ExternalSecrets naming
# secrets in the vault, ESO syncs them into native Kubernetes Secrets,
# keylessly. The operator is a one-per-cluster singleton (its release name
# and cluster-global webhook are fixed upstream), which is why this whole
# file rides one toggle.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureUserAssignedIdentity
metadata:
  name: "{{ values.env }}-aks-external-secrets"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-external-secrets"
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFederatedIdentityCredential
metadata:
  name: "{{ values.env }}-aks-external-secrets-fic"
spec:
  name: "{{ values.env }}-aks-external-secrets-fic"
  userAssignedIdentity:
    valueFrom:
      name: "{{ values.env }}-aks-external-secrets"
  issuer:
    valueFrom:
      # The cluster's OIDC issuer — the trust anchor, by reference.
      name: "{{ values.env }}-aks"
  # Chart truth: the operator's release name is fixed to "external-secrets"
  # (one per cluster) and the module pins the controller ServiceAccount to
  # the chart name.
  subject: system:serviceaccount:external-secrets:external-secrets
---
# Read-only over the vault's secret VALUES — Key Vault Secrets User grants
# payload reads and nothing else (no writes, no key or certificate
# operations, no management plane). Vault-scoped: the narrowest grant that
# makes the store work. The vault lives outside this chart (it holds the
# platform's secrets, which outlive any one cluster) — a cross-chart
# reference by design; it must use Azure RBAC authorization for this grant
# to take effect (access-policy vaults ignore RBAC data-plane roles).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-external-secrets-kv"
spec:
  scope:
    valueFrom:
      kind: AzureKeyVault
      name: "{{ values.key_vault_name }}"
      fieldPath: status.outputs.key_vault_id
  roleDefinitionName: Key Vault Secrets User
  principalId:
    valueFrom:
      name: "{{ values.env }}-aks-external-secrets"
  skipServicePrincipalAadCheck: true
  description: External Secrets Operator reads secret values from {{ values.key_vault_name }} ({{ values.env }}-aks)
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalSecretsOperator
metadata:
  name: "{{ values.env }}-external-secrets"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
    - kind: AzureFederatedIdentityCredential
      name: "{{ values.env }}-aks-external-secrets-fic"
      type: depends_on
spec:
  # Conventional home; permanent while the kept CRDs pin release ownership
  # to it (reinstalling elsewhere fails Helm's ownership check).
  namespace:
    value: external-secrets
  createNamespace: true
  # Keyless reads: the operator's ServiceAccount is annotated with the
  # identity's client ID (and its pods labeled for the workload-identity
  # webhook), and the store below authenticates as WorkloadIdentity with NO
  # ServiceAccount reference — reads fall through to this ambient identity.
  # One federation here covers every ExternalSecret the platform ever
  # syncs.
  workloadIdentity:
    aks:
      clientId:
        valueFrom:
          name: "{{ values.env }}-aks-external-secrets"
---
# The cluster-wide store: readable by ExternalSecrets in every namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterSecretStore
metadata:
  name: "{{ values.env }}-secret-store"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
spec:
  # Reference into the in-chart operator: resolves the namespace credential
  # Secrets would live in, and orders the operator (whose CRDs define
  # ClusterSecretStore) before this resource structurally.
  secretsNamespace:
    valueFrom:
      name: "{{ values.env }}-external-secrets"
  config:
    azureKeyVault:
      # The vault's data-plane URL by REFERENCE — resolved from the
      # AzureKeyVault's vault_uri output at deploy time, so the URL can
      # never be stale or mis-typed (cross-chart: the vault predates the
      # cluster; the offline validator reports it as unresolved by design).
      vaultUrl:
        valueFrom:
          name: "{{ values.key_vault_name }}"
      tenantId: "{{ values.azure_tenant_id }}"
      # WorkloadIdentity is the store's default auth — spelled out because
      # the empty-credential design depends on it: no ServiceAccount
      # reference and no service principal means reads run with the
      # operator's ambient identity federated above.
      authType: WorkloadIdentity
{% endif %}
