params:
  # ─── Placement ───────────────────────────────────────────────────────────────
  - name: region
    description: Azure region for the workspace, Application Insights, and the query alert rules (log-query rules must live in their workspace's region; the activity-log alerts and action groups are global by nature)
    value: eastus

  - name: subscription_id
    description: The Azure subscription (GUID) whose activity log the service-health and admin-operation alerts watch. MUST be set to your subscription -- service-health events only exist at subscription scope, so the placeholder default deploys nothing useful
    value: 00000000-0000-0000-0000-000000000000

  # ─── Notification channels ───────────────────────────────────────────────────
  - name: ops_email
    description: Email address the operations action group notifies -- routine alerts (admin-operation failures, error spikes) land here. Change it before deploying; Azure sends a confirmation mail on first deploy
    value: ops@example.com

  - name: ops_webhook_url
    description: Optional HTTPS endpoint the operations group POSTs the common-alert-schema payload to (a chat-ops bridge, an incident tool). Empty adds no webhook receiver
    value: ""

  - name: critical_email
    description: Email address the critical action group notifies -- reserved for paging conditions (service-health incidents, availability failures). Point it at an on-call inbox or paging-service intake address, never a shared team inbox
    value: oncall@example.com

  # ─── Telemetry retention ─────────────────────────────────────────────────────
  - name: log_retention_days
    description: Days of logs retained in the workspace (30-730). The first 31 days are free on pay-as-you-go; raise for compliance regimes that audit operational history
    value: 30
    type: number

  - name: daily_quota_gb
    description: Daily ingestion cap in GB (-1 is uncapped). A cap is a cost guard that is ALSO a data-loss dial -- when it trips, ingestion stops until the next UTC day, so size it above normal volume or leave it uncapped in production
    value: -1
    type: number

  # ─── Application error alerting ──────────────────────────────────────────────
  - name: error_spike_threshold
    description: Failed-request count over 5 minutes that fires the error-spike alert. Tune to the estate's traffic -- 10 catches real trouble on a modest service without paging on every blip
    value: 10
    type: number

  # ─── Outside-in availability (optional) ──────────────────────────────────────
  - name: web_test_enabled
    description: Deploy the outside-in availability probe and its paging alert. Off by default because it needs a real public URL to watch -- enable it together with web_test_url
    value: false
    type: bool

  - name: web_test_url
    description: The public HTTPS endpoint the availability test requests from every probe location -- the address whose downtime should page
    value: https://www.example.com

  - name: web_test_locations
    description: Comma-separated Azure web-test location IDs the probe runs FROM (not standard region names). Five spread across continents distinguishes a real outage from one region's network trouble
    value: "us-va-ash-azr,us-il-ch1-azr,emea-nl-ams-azr,apac-sg-sin-azr,emea-au-syd-edge"

  - name: web_test_failed_location_threshold
    description: How many probe locations must fail simultaneously before the availability alert pages. Locations minus two tolerates single-location blips while still catching partial outages
    value: 3
    type: number
