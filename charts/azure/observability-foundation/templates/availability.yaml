{% if values.web_test_enabled | bool %}
# The outside-in probe: five Azure regions request the endpoint every
# five minutes, following redirects and (for https) checking the TLS
# handshake. Everything else in this chart watches telemetry the estate
# emits; this is the only signal measured from where users actually
# stand -- and the two views disagree exactly when it matters (DNS,
# certificates, edge networking).
apiVersion: azure.planton.dev/v1
kind: AzureApplicationInsightsStandardWebTest
metadata:
  name: "{{ values.env }}-availability-test"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-observability"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-availability-test"
  region: "{{ values.region }}"
  applicationInsightsId:
    valueFrom:
      kind: AzureApplicationInsights
      name: "{{ values.env }}-app-insights"
      fieldPath: status.outputs.application_insights_id
  # A failed run is retried before counting -- transient network blips
  # at a probe location are not outages.
  retryEnabled: true
  request:
    url: "{{ values.web_test_url }}"
  geoLocations:
    {% for location in values.web_test_locations.split(',') %}
    - "{{ location.strip() }}"
    {% endfor %}
  description: Outside-in availability of the platform's public endpoint, probed from multiple continents
---
# The paging alert on the probe: fires when the threshold's worth of
# locations fail simultaneously. Web-test criteria are their own metric-
# alert family -- the scope is the web test itself, and the component
# binding tells Azure where the availability metric lives.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorMetricAlert
metadata:
  name: "{{ values.env }}-availability-alert"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-observability"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-availability-alert"
  scopes:
    - valueFrom:
        kind: AzureApplicationInsightsStandardWebTest
        name: "{{ values.env }}-availability-test"
        fieldPath: status.outputs.web_test_id
  # Severity 0 (critical): the site being down for real users is the
  # definition of a page.
  severity: 0
  webTestAvailabilityCriteria:
    webTestId:
      valueFrom:
        kind: AzureApplicationInsightsStandardWebTest
        name: "{{ values.env }}-availability-test"
        fieldPath: status.outputs.web_test_id
    componentId:
      valueFrom:
        kind: AzureApplicationInsights
        name: "{{ values.env }}-app-insights"
        fieldPath: status.outputs.application_insights_id
    failedLocationCount: {{ values.web_test_failed_location_threshold }}
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-critical-alerts"
          fieldPath: status.outputs.action_group_id
  description: The public endpoint is failing its availability probe from multiple locations -- likely down for real users
{% endif %}
