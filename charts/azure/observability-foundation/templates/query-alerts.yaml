# The error-spike alert: failed requests across every application
# reporting into the workspace, evaluated every 5 minutes. Query alerts
# are the alerting half of the logging pipeline -- diagnostic settings
# and Application Insights route telemetry in, and KQL watches what
# arrives. Query validation is skipped at create time because the
# AppRequests table materializes only once the first application
# reports; the rule is correct from the moment data flows.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorScheduledQueryAlert
metadata:
  name: "{{ values.env }}-error-spike"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-observability"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-error-spike"
  scope:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-logs"
      fieldPath: status.outputs.workspace_id
  # Severity 2 (warning): an error spike deserves working-hours
  # attention; whether it pages is the action group's call, not the
  # rule's.
  severity: 2
  criteria:
    - query: |-
        AppRequests
        | where Success == false
      # Row count over the window: more than the threshold's worth of
      # failed requests in 5 minutes fires the alert.
      timeAggregationMethod: COUNT
      operator: GREATER_THAN
      threshold: {{ values.error_spike_threshold }}
  # Auto-mitigation closes the alert when failures stop -- the fired/
  # resolved lifecycle software on the receiving end expects.
  autoMitigationEnabled: true
  skipQueryValidation: true
  action:
    actionGroupIds:
      - valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-ops-alerts"
          fieldPath: status.outputs.action_group_id
  description: Failed requests across all applications reporting into the workspace exceeded the spike threshold -- check the newest deploy first
---
# The exception-surge alert: unhandled exceptions are the sharper
# signal -- requests can fail politely, but exceptions mean code broke.
# A 15-minute window smooths single-request stack traces into a trend
# worth a look.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorScheduledQueryAlert
metadata:
  name: "{{ values.env }}-exception-surge"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-observability"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-exception-surge"
  scope:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-logs"
      fieldPath: status.outputs.workspace_id
  severity: 2
  evaluationFrequency: PT15M
  windowDuration: PT15M
  criteria:
    - query: |-
        AppExceptions
      timeAggregationMethod: COUNT
      operator: GREATER_THAN
      threshold: {{ values.error_spike_threshold }}
  autoMitigationEnabled: true
  skipQueryValidation: true
  action:
    actionGroupIds:
      - valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-ops-alerts"
          fieldPath: status.outputs.action_group_id
  description: Unhandled exceptions across all applications exceeded the surge threshold over 15 minutes
