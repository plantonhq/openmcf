# The foundation's home: one resource group for the monitoring estate.
# Monitoring is deliberately its own lifecycle unit -- the workspace and
# alert rules outlive any single workload, and every other composition
# routes telemetry here rather than deploying its own copy.
apiVersion: azure.planton.dev/v1
kind: AzureResourceGroup
metadata:
  name: "{{ values.env }}-observability"
spec:
  name: "{{ values.env }}-observability"
  region: "{{ values.region }}"
---
# The workspace: the subscription's telemetry destination. Diagnostic
# settings on any resource route here, Container Insights and
# Application Insights store here, and the query alerts below watch what
# arrives -- one place where symptoms from every layer can be joined
# with one KQL query.
apiVersion: azure.planton.dev/v1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: "{{ values.env }}-logs"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-observability"
      fieldPath: status.outputs.resource_group_name
  workspaceName: "{{ values.env }}-logs"
  # Pay-as-you-go ingestion (the workspace's default SKU): monitoring
  # volume grows with the estate and is unpredictable at day 0; move to
  # a commitment tier once sustained ingestion passes 100 GB/day.
  retentionInDays: {{ values.log_retention_days }}
  dailyQuotaGb: {{ values.daily_quota_gb }}
---
# The APM face of the workspace: applications instrumented with the
# Application Insights SDK or OpenTelemetry report requests, traces, and
# exceptions here (workspace-based -- the only mode Azure still supports
# for new resources), and the error-spike alerts below query the tables
# it feeds.
apiVersion: azure.planton.dev/v1
kind: AzureApplicationInsights
metadata:
  name: "{{ values.env }}-app-insights"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-observability"
      fieldPath: status.outputs.resource_group_name
  applicationInsightsName: "{{ values.env }}-app-insights"
  workspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-logs"
      fieldPath: status.outputs.workspace_id
