{% if values.capture_enabled | bool %}
# The capture archive: a Data Lake Gen2 account (hierarchical
# namespace), so Synapse/Databricks/Spark read the Avro archives
# directly as a filesystem -- this storage account IS the lakehouse
# landing zone for the event estate.
apiVersion: azure.planton.dev/v1
kind: AzureStorageAccount
metadata:
  name: "{{ values.env }}-event-archive"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-streaming"
      fieldPath: status.outputs.resource_group_name
  accountName: "{{ values.archive_storage_account_name }}"
  isHnsEnabled: true
---
# The container capture writes into.
apiVersion: azure.planton.dev/v1
kind: AzureStorageContainer
metadata:
  name: "{{ values.env }}-event-archive-container"
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env }}-event-archive"
      fieldPath: status.outputs.storage_account_id
  containerName: event-archive
---
# The keyless-capture grant: the namespace's system identity may write
# blobs in the archive account. This role assignment is the entire
# credential story for capture -- no SAS, no account key, revocable in
# one place.
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-capture-writer"
spec:
  scope:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env }}-event-archive"
      fieldPath: status.outputs.storage_account_id
  roleDefinitionName: Storage Blob Data Contributor
  principalId:
    valueFrom:
      kind: AzureEventHubNamespace
      name: "{{ values.env }}-streams"
      fieldPath: status.outputs.identity_principal_id
  principalType: SERVICE_PRINCIPAL
  # The identity is created moments before this grant; skipping the
  # directory existence check avoids losing the race against Entra's
  # asynchronous replication (PrincipalNotFound).
  skipServicePrincipalAadCheck: true
  description: The Event Hubs namespace's system identity writes capture archives -- keyless, no storage key involved
{% endif %}
