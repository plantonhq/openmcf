{% if not (values.keyless_only_enabled | bool) %}
# Least-privilege SAS credentials, one per role -- for the producers and
# consumers that cannot run as a managed identity (edge devices,
# third-party agents, other clouds). Workloads on Azure compute should
# prefer Entra data-plane roles instead; flip keyless_only_enabled once
# everything can, and these credentials disappear while SAS auth shuts
# off namespace-wide.
#
# Send-only, scoped to the ingest hub: a leaked producer credential
# cannot read a single event, and cannot touch the processed hub.
apiVersion: azure.planton.dev/v1
kind: AzureEventHubAuthorizationRule
metadata:
  name: "{{ values.env }}-ingest-send"
spec:
  ruleName: ingest-send
  eventHubId:
    valueFrom:
      kind: AzureEventHub
      name: "{{ values.env }}-ingest-hub"
      fieldPath: status.outputs.event_hub_id
  send: true
---
# Listen-only, scoped to the processed hub: downstream consumers read
# enriched events and nothing else.
apiVersion: azure.planton.dev/v1
kind: AzureEventHubAuthorizationRule
metadata:
  name: "{{ values.env }}-processed-listen"
spec:
  ruleName: processed-listen
  eventHubId:
    valueFrom:
      kind: AzureEventHub
      name: "{{ values.env }}-processed-hub"
      fieldPath: status.outputs.event_hub_id
  listen: true
{% endif %}
