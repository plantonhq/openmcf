# The server. Every hardening surface the component models is ON at
# defaults: zone-redundant HA, VNet injection with no public endpoint,
# Entra administration, customer-managed encryption, auto-grow. This is
# the checklist auditors ask for, delivered as the starting point.
apiVersion: azure.planton.dev/v1
kind: AzurePostgresqlFlexibleServer
metadata:
  name: "{{ values.env }}-postgres"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-ha-postgres"
      fieldPath: status.outputs.resource_group_name
  serverName: "{{ values.env }}-postgres"
  version: "{{ values.postgres_version }}"
  skuName: "{{ values.sku_name }}"
  storageMb: {{ values.storage_mb }}
  # Grow storage before it fills instead of taking the outage: Azure
  # steps up the ladder automatically. Storage never shrinks -- the
  # parameter above is the starting rung, not a cap.
  autoGrowEnabled: true
  administratorLogin: "{{ values.postgres_admin_login }}"
  administratorPassword:
    value: "{{ values.postgres_admin_password }}"
  # VNet injection contract (CEL-enforced as a trio): delegated subnet +
  # private DNS zone + public access explicitly OFF.
  delegatedSubnetId:
    valueFrom:
      kind: AzureSubnet
      name: "{{ values.env }}-postgres-subnet"
      fieldPath: status.outputs.subnet_id
  privateDnsZoneId:
    valueFrom:
      kind: AzurePrivateDnsZone
      name: "{{ values.env }}-postgres-dns"
      fieldPath: status.outputs.zone_id
  publicNetworkAccessEnabled: false
  {% if values.ha_enabled | bool %}
  # A synchronous standby in another zone with automatic failover --
  # the difference between a zone outage being an incident and being a
  # log line. Azure picks the standby zone.
  highAvailability:
    mode: ZONE_REDUNDANT
  {% endif %}
  # The point-in-time-restore window. Backups themselves are automatic
  # and continuous; this is how far back "restore to 14:32 last Tuesday"
  # can reach.
  backupRetentionDays: {{ values.backup_retention_days }}
  geoRedundantBackupEnabled: {{ values.geo_redundant_backup_enabled }}
  # Entra administration alongside password auth: the admin identity
  # connects with directory tokens (MFA, PIM, auditing all apply).
  # Turning password auth OFF once every client is token-based is the
  # documented hardening path.
  authentication:
    activeDirectoryAuthEnabled: true
  aadAdministrators:
    - objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-postgres-admin-identity"
          fieldPath: status.outputs.principal_id
      principalName: "{{ values.env }}-postgres-admin-identity"
      principalType: SERVICE_PRINCIPAL
  {% if values.cmk_enabled | bool %}
  # Customer-managed encryption: the server's identity unwraps the
  # vault key (versionless reference -- rotation propagates without
  # touching this resource). Revoking the identity's grant makes the
  # data unreadable to Azure itself: the kill switch compliance regimes
  # ask about.
  identity:
    type: USER_ASSIGNED
    identityIds:
      - valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-postgres-admin-identity"
          fieldPath: status.outputs.identity_id
  customerManagedKey:
    keyVaultKeyId:
      valueFrom:
        kind: AzureKeyVaultKey
        name: "{{ values.env }}-postgres-cmk"
        fieldPath: status.outputs.versionless_id
    primaryUserAssignedIdentityId:
      valueFrom:
        kind: AzureUserAssignedIdentity
        name: "{{ values.env }}-postgres-admin-identity"
        fieldPath: status.outputs.identity_id
  {% endif %}
  # Curated observability parameters -- the two every production
  # incident review wishes had been on from day one. Everything else
  # stays at engine defaults; tuning belongs to the workload's owner.
  serverParameters:
    # Log any statement over one second: catches the slow-query drift
    # without the noise (or overhead) of logging everything.
    log_min_duration_statement: "1000"
    # Log lock waits past deadlock_timeout -- the first clue in every
    # "the app just froze" investigation.
    log_lock_waits: "on"
{% if values.replica_enabled | bool %}
---
# The read replica: asynchronous physical replication in the same
# delegated subnet. Read scale-out for reporting workloads and a warm
# recovery target -- but NOT high availability (replication is async;
# the HA standby above is the synchronous one). SKU and storage are
# omitted to inherit from the primary; promotion to a standalone server
# is a day-2 operation on this resource.
apiVersion: azure.planton.dev/v1
kind: AzurePostgresqlFlexibleServer
metadata:
  name: "{{ values.env }}-postgres-replica"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-ha-postgres"
      fieldPath: status.outputs.resource_group_name
  serverName: "{{ values.env }}-postgres-replica"
  createMode: REPLICA
  sourceServerId:
    valueFrom:
      kind: AzurePostgresqlFlexibleServer
      name: "{{ values.env }}-postgres"
      fieldPath: status.outputs.server_id
  # The replica is injected into the same private network as the
  # primary (the VNet-injection trio applies to replicas too).
  delegatedSubnetId:
    valueFrom:
      kind: AzureSubnet
      name: "{{ values.env }}-postgres-subnet"
      fieldPath: status.outputs.subnet_id
  privateDnsZoneId:
    valueFrom:
      kind: AzurePrivateDnsZone
      name: "{{ values.env }}-postgres-dns"
      fieldPath: status.outputs.zone_id
  publicNetworkAccessEnabled: false
{% endif %}
