{% if values.cmk_enabled | bool %}
# The key vault holding the database encryption key. RBAC authorization
# (the spec's default): data-plane access is ordinary Azure role
# assignments, never the legacy per-vault access-policy list.
apiVersion: azure.planton.dev/v1
kind: AzureKeyVault
metadata:
  name: "{{ values.env }}-postgres-vault"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-ha-postgres"
      fieldPath: status.outputs.resource_group_name
  vaultName: "{{ values.key_vault_name }}"
  # Azure refuses CMK enrollment against a vault that can be purged --
  # a purged key would brick the database. IRREVERSIBLE once on: after
  # teardown the vault name stays reserved until the soft-delete window
  # passes (the price of a key that cannot be destroyed under the
  # database).
  purgeProtectionEnabled: true
---
# The database encryption key. Referenced by VERSIONLESS id below, so
# rotating the key (manually or by policy) re-encrypts forward without
# touching the server resource. Wrap/unwrap are the only operations
# envelope encryption needs -- the key never signs or encrypts data
# directly.
apiVersion: azure.planton.dev/v1
kind: AzureKeyVaultKey
metadata:
  name: "{{ values.env }}-postgres-cmk"
spec:
  keyVaultId:
    valueFrom:
      kind: AzureKeyVault
      name: "{{ values.env }}-postgres-vault"
      fieldPath: status.outputs.key_vault_id
  name: "{{ values.env }}-postgres-cmk"
  keyType: RSA
  # 3072-bit for a long-lived infrastructure key -- 2048 is the floor,
  # not the recommendation, for keys that protect data at rest for
  # years.
  keySize: 3072
  keyOpts:
    - WRAP_KEY
    - UNWRAP_KEY
---
# The unwrap grant: the server's identity may use (never read, never
# manage) the key. "Crypto Service Encryption User" is the exact
# built-in role Azure services need for CMK -- anything broader is
# excess privilege on the key that protects everything.
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-postgres-cmk-grant"
spec:
  scope:
    valueFrom:
      kind: AzureKeyVault
      name: "{{ values.env }}-postgres-vault"
      fieldPath: status.outputs.key_vault_id
  roleDefinitionName: Key Vault Crypto Service Encryption User
  principalId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: "{{ values.env }}-postgres-admin-identity"
      fieldPath: status.outputs.principal_id
  principalType: SERVICE_PRINCIPAL
  # The identity is created moments before this grant; skipping the
  # directory existence check avoids losing the race against Entra's
  # asynchronous replication (PrincipalNotFound).
  skipServicePrincipalAadCheck: true
  description: The PostgreSQL server's identity wraps and unwraps the customer-managed encryption key -- use-only, never manage
{% endif %}
