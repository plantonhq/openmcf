# The platform's private registry. The admin account stays off: pulls
# are authorized by the AcrPull grant below against the cluster's
# kubelet identity, so no registry password exists anywhere in the
# platform.
apiVersion: azure.planton.dev/v1
kind: AzureContainerRegistry
metadata:
  name: "{{ values.env }}-registry"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-aks-platform"
      fieldPath: status.outputs.resource_group_name
  registryName: "{{ values.registry_name }}"
  sku: {{ values.registry_sku }}
---
# The keyless image-pull grant: the cluster's kubelet identity (the
# identity NODES pull images with) gets AcrPull on the registry -- and
# nothing more. Pushes are a CI concern, granted to a CI identity by a
# separate assignment, so a compromised node can never write images.
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-acr-pull"
spec:
  scope:
    valueFrom:
      kind: AzureContainerRegistry
      name: "{{ values.env }}-registry"
      fieldPath: status.outputs.container_registry_id
  roleDefinitionName: AcrPull
  principalId:
    valueFrom:
      kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      fieldPath: status.outputs.kubelet_identity_object_id
  principalType: SERVICE_PRINCIPAL
  # The kubelet identity is created moments before this grant; skipping
  # the directory existence check avoids losing the race against Entra's
  # asynchronous replication (PrincipalNotFound).
  skipServicePrincipalAadCheck: true
  description: Cluster nodes pull workload images from the platform registry -- keyless, via the kubelet managed identity
