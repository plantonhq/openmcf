# The cluster: private API server, Entra-integrated access, workload
# identity on, and egress through the platform's NAT gateway. The
# cluster carries only its mandatory system pool -- the workload pool is
# a first-class AzureAksNodePool below, so it scales, upgrades, and
# rotates without touching the control plane.
apiVersion: azure.planton.dev/v1
kind: AzureAksCluster
metadata:
  name: "{{ values.env }}-aks"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-aks-platform"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-aks"
  {% if values.kubernetes_version %}
  kubernetesVersion: "{{ values.kubernetes_version }}"
  {% endif %}
  skuTier: {{ values.cluster_sku_tier }}
  {% if values.private_api_enabled | bool %}
  # Private API server: the endpoint gets only a private IP in the VNet.
  # Both DNS-prefix fields stay unset on purpose -- AKS manages the
  # private zone ("System" mode) and derives the record from the cluster
  # name; a custom prefix is only valid with a bring-your-own zone.
  privateClusterEnabled: true
  {% else %}
  {% if values.api_authorized_ip_ranges %}
  # Public API server, gated to known source ranges -- the honest middle
  # ground when private connectivity to the API is not yet available.
  apiServerAccessProfile:
    authorizedIpRanges:
      {% for cidr in values.api_authorized_ip_ranges.split(',') %}
      - "{{ cidr.strip() }}"
      {% endfor %}
  {% endif %}
  {% endif %}
  # Workload identity is the point of this platform: pods exchange their
  # service-account tokens for Azure credentials through the federated
  # credential below -- no secret in the cluster, nothing to rotate. The
  # OIDC issuer it rides on is enabled by default.
  workloadIdentityEnabled: true
  {% if values.local_account_disabled | bool %}
  # All access flows through Entra -- the certificate-based local admin
  # is gone. Only safe because the Entra integration below is always on.
  localAccountDisabled: true
  {% endif %}
  # Entra-integrated authentication with Azure RBAC authorization:
  # who-can-do-what in Kubernetes is managed like every other Azure
  # grant (composable with AzureRoleAssignment), not via hand-kept
  # in-cluster RoleBindings.
  azureActiveDirectoryRoleBasedAccessControl:
    azureRbacEnabled: true
    {% if values.entra_admin_group_object_ids %}
    adminGroupObjectIds:
      {% for group_id in values.entra_admin_group_object_ids.split(',') %}
      - "{{ group_id.strip() }}"
      {% endfor %}
    {% endif %}
  defaultNodePool:
    name: system
    vmSize: "{{ values.system_pool_vm_size }}"
    autoScalingEnabled: true
    minCount: {{ values.system_pool_min_nodes }}
    maxCount: {{ values.system_pool_max_nodes }}
    {% if values.zones_enabled | bool %}
    zones: ["1", "2", "3"]
    {% endif %}
    vnetSubnetId:
      valueFrom:
        kind: AzureSubnet
        name: "{{ values.env }}-aks-nodes"
        fieldPath: status.outputs.subnet_id
    # The system pool is tainted CriticalAddonsOnly so application pods
    # cannot starve CoreDNS -- workloads land on the dedicated pool below.
    onlyCriticalAddonsEnabled: true
    # A standing rotation stand-in lets AKS roll the system pool through
    # otherwise replace-forcing changes (VM size, disk type) without
    # tearing down the pool that hosts the cluster's critical pods.
    temporaryNameForRotation: systemtmp
  networkProfile:
    # The CNI is left to the modules' modern default (Azure CNI in
    # overlay mode); egress rides the NAT gateway attached to the node
    # subnet -- the pairing USER_ASSIGNED_NAT_GATEWAY declares.
    outboundType: USER_ASSIGNED_NAT_GATEWAY
    # NetworkPolicy objects are enforced, not silently inert -- without
    # an engine, every policy a team writes does nothing.
    networkPolicy: NETWORK_POLICY_AZURE
  # Container Insights streams container logs and Kubernetes events into
  # the platform workspace, authenticating with the cluster's managed
  # identity -- no workspace key involved.
  omsAgent:
    logAnalyticsWorkspaceId:
      valueFrom:
        kind: AzureLogAnalyticsWorkspace
        name: "{{ values.env }}-aks-logs"
        fieldPath: status.outputs.workspace_id
    msiAuthForMonitoringEnabled: true
---
# The workload pool: where applications actually run, scaled by the
# cluster autoscaler and separable from the control plane's lifecycle.
apiVersion: azure.planton.dev/v1
kind: AzureAksNodePool
metadata:
  name: "{{ values.env }}-aks-workload"
spec:
  kubernetesClusterId:
    valueFrom:
      kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      fieldPath: status.outputs.cluster_id
  name: workload
  vmSize: "{{ values.workload_pool_vm_size }}"
  autoScalingEnabled: true
  minCount: {{ values.workload_pool_min_nodes }}
  maxCount: {{ values.workload_pool_max_nodes }}
  {% if values.workload_pool_spot_enabled | bool %}
  # Spot capacity: 30-90% cheaper, evictable at any time. Azure taints
  # spot nodes with scalesetpriority=spot automatically, so only
  # workloads that tolerate the taint (and eviction) schedule here.
  priority: SPOT
  {% endif %}
  {% if values.zones_enabled | bool %}
  zones: ["1", "2", "3"]
  {% endif %}
  # The subnet is inherited from the cluster's system pool -- one node
  # network for the platform; pools with special exposure needs would
  # reference their own AzureSubnet here.
---
# Control-plane logs into Log Analytics. These categories are the
# operationally valuable set at an honest ingestion cost: the API-server
# and admin-audit trails answer "what changed", the schedulers and
# autoscaler explain placement and scaling, and guard records Entra
# authentication decisions. The full kube-audit category (every read
# included) multiplies volume for little incident value -- enable it
# deliberately if compliance demands request-level reads.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-aks-control-plane-logs"
spec:
  settingName: "{{ values.env }}-aks-control-plane-logs"
  targetResourceId:
    valueFrom:
      kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      fieldPath: status.outputs.cluster_id
  enabledLogs:
    - category: kube-apiserver
    - category: kube-audit-admin
    - category: kube-controller-manager
    - category: kube-scheduler
    - category: cluster-autoscaler
    - category: guard
  enabledMetrics:
    - category: AllMetrics
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-aks-logs"
      fieldPath: status.outputs.workspace_id
