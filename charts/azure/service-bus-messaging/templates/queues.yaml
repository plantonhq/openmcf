# One command queue per consuming service -- point-to-point work
# dispatch with competing consumers. Every queue carries the same
# dead-letter posture, and every queue gets its OWN pair of scoped
# credentials (below), so a leaked producer key can never consume and a
# consumer's key can never reach a sibling service's queue.
{% for queue in values.command_queue_names %}
apiVersion: azure.planton.dev/v1
kind: AzureServiceBusQueue
metadata:
  name: "{{ values.env }}-{{ queue }}-queue"
spec:
  namespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: "{{ values.env }}-bus"
      fieldPath: status.outputs.namespace_id
  queueName: "{{ queue }}"
  # Dead-letter posture: a message that exhausts delivery attempts or
  # expires parks in the DLQ for inspection instead of vanishing. Ten
  # attempts absorbs transient consumer crashes; poison messages park.
  maxDeliveryCount: 10
  deadLetteringOnMessageExpiration: true
  # Fourteen days to notice and drain a backlog before messages expire
  # into the DLQ -- generous on purpose; storage is the cheap part.
  defaultMessageTtl: P14D
  # One minute to process before the message returns for redelivery.
  # Size to the consumer's slowest handler, not its average.
  lockDuration: PT1M
  {% if values.duplicate_detection_enabled | bool %}
  # Drop messages whose MessageId repeats inside the window -- exactly-
  # once enqueueing for producers that retry. Fixed at creation.
  requiresDuplicateDetection: true
  duplicateDetectionHistoryTimeWindow: PT10M
  {% endif %}
---
# Send-only credential for the queue's producer. The name says what it
# can do; the rights say nothing more: no listen, no manage.
apiVersion: azure.planton.dev/v1
kind: AzureServiceBusAuthorizationRule
metadata:
  name: "{{ values.env }}-{{ queue }}-send"
spec:
  ruleName: "{{ queue }}-send"
  queueId:
    valueFrom:
      kind: AzureServiceBusQueue
      name: "{{ values.env }}-{{ queue }}-queue"
      fieldPath: status.outputs.queue_id
  send: true
---
# Listen-only credential for the queue's consumer.
apiVersion: azure.planton.dev/v1
kind: AzureServiceBusAuthorizationRule
metadata:
  name: "{{ values.env }}-{{ queue }}-listen"
spec:
  ruleName: "{{ queue }}-listen"
  queueId:
    valueFrom:
      kind: AzureServiceBusQueue
      name: "{{ values.env }}-{{ queue }}-queue"
      fieldPath: status.outputs.queue_id
  listen: true
{% if not loop.last %}
---
{% endif %}
{% endfor %}
