# Where the dead-letter alert lands. Action groups are global (no
# region), so notification delivery survives a regional outage.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorActionGroup
metadata:
  name: "{{ values.env }}-messaging-ops"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-messaging"
      fieldPath: status.outputs.resource_group_name
  # The short name is the sender identity on SMS and mobile push --
  # 12-character limit, keep it recognizable.
  shortName: MsgOps
  emailReceivers:
    - name: ops-email
      emailAddress: "{{ values.ops_email }}"
      useCommonAlertSchema: true
---
# The one alert every messaging estate needs on day one: anything
# dead-lettering, anywhere in the namespace. A rising DLQ means a
# consumer is failing or a filter is rejecting -- either way a human
# should look before the TTL window burns down. Namespace-wide scope
# catches queues and subscriptions alike, including entities added
# after this chart deploys.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorMetricAlert
metadata:
  name: "{{ values.env }}-messaging-dlq-alert"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-messaging"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-messaging-dlq-alert"
  scopes:
    - valueFrom:
        kind: AzureServiceBusNamespace
        name: "{{ values.env }}-bus"
        fieldPath: status.outputs.namespace_id
  # Severity 2 (warning): messages are parked, not lost -- urgent but
  # not a page. Route to a paging group instead if the DLQ draining is
  # an on-call duty.
  severity: 2
  staticCriteria:
    - metricNamespace: Microsoft.ServiceBus/namespaces
      metricName: DeadletteredMessages
      aggregation: AVERAGE
      operator: GREATER_THAN
      # Zero tolerance: a healthy estate has empty DLQs, so the first
      # parked message is the signal worth sending.
      threshold: 0
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-messaging-ops"
          fieldPath: status.outputs.action_group_id
  description: Messages are dead-lettering in the Service Bus namespace -- a consumer is failing or a filter is rejecting traffic
