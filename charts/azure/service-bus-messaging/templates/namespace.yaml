# The messaging namespace -- the billing and isolation boundary every
# queue, topic, and credential in this chart lives inside.
#
# STANDARD is the honest default for an integration backbone: topics
# (BASIC has none), per-operation pricing, and every messaging feature
# the topology below uses. The premium toggle moves to dedicated
# messaging units when the estate needs predictable latency, 100-MB
# messages, or the compliance surface (CMK, VNet network rules) Premium
# unlocks -- an in-place SKU change, not a rebuild.
apiVersion: azure.planton.dev/v1
kind: AzureServiceBusNamespace
metadata:
  name: "{{ values.env }}-bus"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-messaging"
      fieldPath: status.outputs.resource_group_name
  namespaceName: "{{ values.servicebus_namespace_name }}"
  {% if values.premium_enabled | bool %}
  sku: PREMIUM
  # Premium requires an explicit messaging-unit count (1, 2, 4, 8, 16).
  # One unit carries most integration workloads; scale is an in-place
  # update.
  capacity: 1
  # Premium also fixes the partition layout at creation. One partition
  # is the ordering-friendly default; 2 or 4 trade ordering-by-default
  # for parallel brokers.
  premiumMessagingPartitions: 1
  {% else %}
  sku: STANDARD
  {% endif %}
