params:
  # ─── Placement ───────────────────────────────────────────────────────────────
  - name: region
    description: Azure region for the namespace and its monitoring resources
    value: centralus

  # ─── Global names (must change) ──────────────────────────────────────────────
  - name: servicebus_namespace_name
    description: Globally unique Service Bus namespace name (6-50 characters, letters/digits/hyphens, starts with a letter; the "-sb" and "-mgmt" suffixes are reserved by Azure). MUST be changed before deploying
    value: my-integration-bus

  # ─── Messaging tier ──────────────────────────────────────────────────────────
  - name: premium_enabled
    description: Run the namespace on PREMIUM (one dedicated messaging unit) instead of STANDARD. Premium buys predictable latency, 100-MB messages, and unlocks CMK + VNet network rules -- at a flat hourly rate instead of per-operation pricing
    value: false
    type: bool

  # ─── Topology ────────────────────────────────────────────────────────────────
  - name: command_queue_names
    description: One command queue per consuming service (point-to-point work dispatch). Every queue gets the same dead-letter posture plus its own send-only and listen-only credentials
    value:
      - orders
      - billing
    type: list

  - name: events_topic_name
    description: The event topic services publish domain events to; subscriptions below fan it out
    value: events

  - name: filtered_subscription_name
    description: Name of the SQL-filtered subscription -- the consumer that receives only the events matching filter_expression
    value: order-events

  - name: filter_expression
    description: "SQL filter for the filtered subscription, evaluated against each message's user properties (e.g. eventType = 'order.created' or amount > 1000 AND region = 'EU'). Non-matching messages never reach the consumer"
    value: "eventType = 'order.created'"

  - name: duplicate_detection_enabled
    description: Enable duplicate detection on the command queues -- Service Bus drops messages whose MessageId repeats within a 10-minute window. Fixed at queue creation; incompatible with express queues
    value: false
    type: bool

  # ─── Notifications ───────────────────────────────────────────────────────────
  - name: ops_email
    description: Email address the dead-letter alert notifies. A growing DLQ means a consumer is failing -- someone should know within minutes
    value: ops@example.com

  # ─── Telemetry ───────────────────────────────────────────────────────────────
  - name: log_retention_days
    description: Log Analytics workspace retention in days
    value: 30
    type: int
