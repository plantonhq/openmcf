# Where the capacity alert lands. Action groups are global (no
# region), so notification delivery survives a regional outage.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorActionGroup
metadata:
  name: "{{ values.env }}-web-tier-ops"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-tier"
      fieldPath: status.outputs.resource_group_name
  # The short name is the sender identity on SMS and mobile push --
  # 12-character limit, keep it recognizable.
  shortName: WebTierOps
  emailReceivers:
    - name: ops-email
      emailAddress: "{{ values.ops_email }}"
      useCommonAlertSchema: true
---
# Host-level platform metrics from the fleet into the workspace --
# CPU, disk, and network as Azure sees them from outside the guest.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-web-vmss-diag"
spec:
  settingName: web-vmss-metrics
  targetResourceId:
    valueFrom:
      kind: AzureVirtualMachineScaleSet
      name: "{{ values.env }}-web-vmss"
      fieldPath: status.outputs.scale_set_id
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-web-tier-logs"
      fieldPath: status.outputs.workspace_id
  enabledMetrics:
    - category: AllMetrics
---
# Data-path metrics from the load balancer -- probe health, SNAT port
# usage, byte counts. SNAT exhaustion in particular lives HERE, not on
# the instances.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-web-lb-diag"
spec:
  settingName: web-lb-metrics
  targetResourceId:
    valueFrom:
      kind: AzureLoadBalancer
      name: "{{ values.env }}-web-lb"
      fieldPath: status.outputs.load_balancer_id
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-web-tier-logs"
      fieldPath: status.outputs.workspace_id
  enabledMetrics:
    - category: AllMetrics
---
# Sustained CPU saturation across the fleet: requests are queueing.
# 80% average over fifteen minutes means the tier is undersized --
# raise instances (capacity now) or the SKU (headroom per instance).
apiVersion: azure.planton.dev/v1
kind: AzureMonitorMetricAlert
metadata:
  name: "{{ values.env }}-web-cpu-alert"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-tier"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-web-cpu-alert"
  scopes:
    - valueFrom:
        kind: AzureVirtualMachineScaleSet
        name: "{{ values.env }}-web-vmss"
        fieldPath: status.outputs.scale_set_id
  severity: 2
  # Fifteen minutes of sustained saturation, not a spike -- deploys and
  # cache warmups legitimately peg CPU for a few minutes.
  windowSize: PT15M
  staticCriteria:
    - metricNamespace: Microsoft.Compute/virtualMachineScaleSets
      metricName: Percentage CPU
      aggregation: AVERAGE
      operator: GREATER_THAN
      threshold: 80
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-web-tier-ops"
          fieldPath: status.outputs.action_group_id
  description: The web tier's average CPU has been above 80% for 15 minutes -- add instances or step up the SKU before latency becomes the pager
