# The tier's public address: Standard SKU (the only SKU a Standard LB
# frontend accepts) spread across zones 1-3, so the ADDRESS survives a
# zone outage just like the fleet behind it.
apiVersion: azure.planton.dev/v1
kind: AzurePublicIp
metadata:
  name: "{{ values.env }}-web-pip"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-tier"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-web-pip"
  zones: ["1", "2", "3"]
---
# The Standard Load Balancer carrying the tier's whole traffic story:
# inbound 80/443 into the web pool, health gated by the HTTP probe, and
# an EXPLICIT outbound rule so instance egress (package installs, API
# calls) uses this frontend deterministically -- never Azure's
# deprecated implicit outbound. Pool membership is deliberately absent
# here: members join from their own side (the scale set's NIC
# references the pool through the name-keyed backend_pool_ids output).
apiVersion: azure.planton.dev/v1
kind: AzureLoadBalancer
metadata:
  name: "{{ values.env }}-web-lb"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-tier"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-web-lb"
  frontendIpConfigurations:
    - name: public
      publicIpAddressId:
        valueFrom:
          kind: AzurePublicIp
          name: "{{ values.env }}-web-pip"
          fieldPath: status.outputs.public_ip_id
  backendPools:
    - name: web
  healthProbes:
    # HTTP 200 from nginx's root page -- the default bootstrap serves
    # it from first boot. Point the path at a real health endpoint once
    # the application defines one; an instance failing two consecutive
    # probes stops receiving traffic.
    - name: http-health
      protocol: PROBE_HTTP
      port: 80
      requestPath: /
      probeThreshold: 2
  rules:
    # disable_outbound_snat on both rules: outbound is owned by the
    # explicit outbound rule below, and Azure rejects a pool where
    # rule-driven SNAT and an outbound rule overlap.
    - name: https
      protocol: TCP
      frontendPort: 443
      backendPort: 443
      backendPoolNames: [web]
      probeName: http-health
      tcpResetEnabled: true
      disableOutboundSnat: true
    - name: http
      protocol: TCP
      frontendPort: 80
      backendPort: 80
      backendPoolNames: [web]
      probeName: http-health
      tcpResetEnabled: true
      disableOutboundSnat: true
  outboundRules:
    - name: egress
      frontendIpConfigurationNames: [public]
      backendPoolName: web
      protocol: ALL
      # 1024 SNAT ports per instance x 3 instances fits one frontend
      # address (~64k ports) with headroom to scale the fleet.
      allocatedOutboundPorts: 1024
