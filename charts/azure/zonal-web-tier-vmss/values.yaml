params:
  # ─── Placement ───────────────────────────────────────────────────────────────
  - name: region
    description: Azure region for the web tier. Must have availability zones -- the scale set and the load balancer frontend spread across zones 1-3
    value: centralus

  # ─── Fleet sizing ────────────────────────────────────────────────────────────
  - name: instances
    description: The fleet size. Three instances across three zones is the honest zonal floor -- a zone outage removes one instance, not the tier
    value: 3
    type: int

  - name: vm_sku
    description: "The instance size. Standard_D2s_v3 (2 vCPU / 8 GiB) is the general-purpose production floor; B-series burstables cost less for dev but carry zonal-capacity caveats in some regions and no sustained-CPU guarantee"
    value: Standard_D2s_v3

  # ─── Access (must change) ────────────────────────────────────────────────────
  - name: admin_username
    description: The Linux admin account cloud-init and SSH use. Password authentication is disabled -- the key below is the only door
    value: webadmin

  - name: ssh_public_key
    description: "The admin account's SSH public key. MUST be changed before deploying: the default is a discarded throwaway whose private half no longer exists -- it boots fine but grants access to NO ONE"
    value: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvUEIH5UU/EzaIyRcGhmQNt63nyi+zWgfzYFElbfxVd

  # ─── Bootstrap ───────────────────────────────────────────────────────────────
  - name: cloud_init_base64
    description: "Base64-encoded cloud-init (#cloud-config) delivered once at each instance's first boot. The default installs and starts nginx so the tier serves the load balancer's health probe out of the box -- replace it with your own bootstrap (base64 -w0 your-cloud-init.yaml)"
    value: I2Nsb3VkLWNvbmZpZwpwYWNrYWdlX3VwZGF0ZTogdHJ1ZQpwYWNrYWdlczoKICAtIG5naW54CnJ1bmNtZDoKICAtIHN5c3RlbWN0bCBlbmFibGUgLS1ub3cgbmdpbngK

  # ─── Network ─────────────────────────────────────────────────────────────────
  - name: vnet_cidr
    description: Address space of the web-tier virtual network
    value: 10.50.0.0/16

  - name: web_subnet_cidr
    description: CIDR of the web subnet, inside vnet_cidr
    value: 10.50.1.0/24

  # ─── Notifications ───────────────────────────────────────────────────────────
  - name: ops_email
    description: Email address for the CPU-saturation alert
    value: ops@example.com

  # ─── Telemetry ───────────────────────────────────────────────────────────────
  - name: log_retention_days
    description: Log Analytics workspace retention in days
    value: 30
    type: int
