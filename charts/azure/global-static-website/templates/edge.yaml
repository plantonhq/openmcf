# The global edge: Front Door profile, endpoint, origin, and a cached route.
# The origin hostname references the storage account's primary_web_host
# output so the backend tracks deploy-time allocation.
apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorProfile
metadata:
  name: "{{ values.env }}-static-fd"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-static-site"
      fieldPath: status.outputs.resource_group_name
  profileName: "{{ values.env }}-static-fd"
  sku: STANDARD
---
apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorEndpoint
metadata:
  name: "{{ values.env }}-static-fd-endpoint"
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: "{{ values.env }}-static-fd"
      fieldPath: status.outputs.profile_id
  endpointName: "{{ values.env }}-static"
  enabled: true
---
apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorOriginGroup
metadata:
  name: "{{ values.env }}-static-origin-group"
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: "{{ values.env }}-static-fd"
      fieldPath: status.outputs.profile_id
  originGroupName: static-storage
  loadBalancing:
    sampleSize: 4
    successfulSamplesRequired: 3
    additionalLatencyInMilliseconds: 50
  healthProbe:
    protocol: HTTPS
    intervalInSeconds: 100
    requestType: HEAD
    path: /{{ values.index_document }}
---
apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorOrigin
metadata:
  name: "{{ values.env }}-static-origin"
spec:
  originGroupId:
    valueFrom:
      kind: AzureFrontDoorOriginGroup
      name: "{{ values.env }}-static-origin-group"
      fieldPath: status.outputs.origin_group_id
  originName: storage-web
  hostName:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env }}-static-storage"
      fieldPath: status.outputs.primary_web_host
  certificateNameCheckEnabled: true
  httpsPort: 443
  priority: 1
  weight: 500
  enabled: true
---
# Edge caching and compression: static assets version by path, so query
# strings are ignored and text types are compressed at the edge.
apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorRoute
metadata:
  name: "{{ values.env }}-static-route"
spec:
  endpointId:
    valueFrom:
      kind: AzureFrontDoorEndpoint
      name: "{{ values.env }}-static-fd-endpoint"
      fieldPath: status.outputs.endpoint_id
  routeName: static-cached
  originGroupId:
    valueFrom:
      kind: AzureFrontDoorOriginGroup
      name: "{{ values.env }}-static-origin-group"
      fieldPath: status.outputs.origin_group_id
  originIds:
    - valueFrom:
        kind: AzureFrontDoorOrigin
        name: "{{ values.env }}-static-origin"
        fieldPath: status.outputs.origin_id
  patternsToMatch:
    - "/*"
  supportedProtocols:
    - HTTP
    - HTTPS
  forwardingProtocol: HTTPS_ONLY
  httpsRedirectEnabled: true
  linkToDefaultDomain: true
  enabled: true
  cache:
    queryStringCachingBehavior: IGNORE_QUERY_STRING
    compressionEnabled: true
    contentTypesToCompress:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
