# The static origin: a StorageV2 account with the static-website feature
# enabled. Upload site assets to the auto-created $web container after
# deploy (or wire a CI pipeline to it).
apiVersion: azure.planton.dev/v1
kind: AzureStorageAccount
metadata:
  name: "{{ values.env }}-static-storage"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-static-site"
      fieldPath: status.outputs.resource_group_name
  accountName: "{{ values.storage_account_name }}"
  replicationType: LRS
  staticWebsite:
    indexDocument: "{{ values.index_document }}"
    error404Document: "{{ values.error_document }}"
