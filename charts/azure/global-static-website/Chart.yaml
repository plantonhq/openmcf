apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: Global Static Website
spec:
  selector:
    kind: platform
  description: A globally-cached static website from storage to TLS -- a StorageV2 account with static-website hosting, Azure Front Door with edge caching and compression, and a custom domain that self-completes Front Door validation through DNS records. Optional WAF for sites that need edge protection.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/azure/azurestorageaccount/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/azure/global-static-website
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/azure/global-static-website/README.md
