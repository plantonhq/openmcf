params:
  # ─── Placement ───────────────────────────────────────────────────────────────
  - name: region
    description: Azure region for the lake
    value: centralus

  # ─── Global names (must change) ──────────────────────────────────────────────
  - name: storage_account_name
    description: Globally unique storage account name (3-24 lowercase letters and digits, no hyphens) -- it becomes the lake's DNS prefix, {name}.dfs.core.windows.net. MUST be changed before deploying
    value: mylakehousestore

  - name: key_vault_name
    description: Globally unique Key Vault name (3-24 alphanumerics and hyphens, no consecutive hyphens) holding the zone encryption key. MUST be changed before deploying (only used when cmk_enabled)
    value: mylakehousekv

  # ─── Data protection ─────────────────────────────────────────────────────────
  - name: soft_delete_days
    description: "The blob and container soft-delete recycle-bin window in days (1-365). This IS the lake's accidental-deletion story: blob versioning and point-in-time restore do not exist on hierarchical-namespace accounts"
    value: 14
    type: number

  # ─── Lifecycle economics ─────────────────────────────────────────────────────
  - name: raw_cool_after_days
    description: Days after last modification before raw-zone data tiers to COOL storage. Raw landings are written once and read during processing -- after that they are history that should not bill at hot rates
    value: 30
    type: number

  - name: raw_archive_after_days
    description: Days after last modification before raw-zone data tiers to ARCHIVE (offline; rehydration takes hours and costs per GB). The compliance tail of the raw zone at roughly a tenth of cool pricing
    value: 90
    type: number

  - name: sandbox_ttl_days
    description: Days after last modification before sandbox-zone data is DELETED. The sandbox is scratch space for exploration -- an expiry keeps experiments from silently becoming permanent infrastructure
    value: 30
    type: number

  # ─── Encryption ──────────────────────────────────────────────────────────────
  - name: cmk_enabled
    description: Encrypt the zone scopes under a customer-managed key (RBAC Key Vault + RSA key + the account-identity grant, all provisioned by the chart). The vault carries purge protection, which is IRREVERSIBLE on that vault -- after teardown the vault name stays reserved until the soft-delete window passes. Off falls back to Microsoft-managed keys per scope
    value: true
    type: bool

  # ─── Telemetry ───────────────────────────────────────────────────────────────
  - name: log_retention_days
    description: Log Analytics retention in days for the data-access audit trail (who read, wrote, and deleted what)
    value: 30
    type: number
