# The medallion zones, each a first-class filesystem: its own POSIX
# posture, its own encryption scope, its own RBAC grant boundary. The
# zone names are the chart's design decision (they are the lake's
# public layout, referenced by every pipeline path) -- rename by
# editing the chart, not by parameter.
#
# ACL model, once: Azure evaluates RBAC first (the grants in
# access.yaml), then falls through to these POSIX ACLs -- so the ACLs
# are the fine-grained layer for principals WITHOUT a zone-wide role.
# ACCESS entries gate the root now; DEFAULT entries are the template
# every new directory and file inherits, which is how a zone's posture
# propagates without per-object management. Named entries carry the
# workload identities BY REFERENCE (their principal id -- an ACL naming
# a client id silently never matches); MASK bounds what named entries
# can hold; OTHER closes the zone to everyone else.
apiVersion: azure.planton.dev/v1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: "{{ values.env }}-zone-raw"
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env }}-lakehouse-store"
      fieldPath: status.outputs.storage_account_id
  filesystemName: raw
  defaultEncryptionScope:
    valueFrom:
      kind: AzureStorageEncryptionScope
      name: "{{ values.env }}-scope-raw"
      fieldPath: status.outputs.encryption_scope_name
  # Raw landings: engineering writes, nobody else enters. Analysts are
  # deliberately absent -- raw data is pre-scrubbing (PII risk) and
  # pre-validation (quality risk).
  aces:
    - type: USER
      permissions: rwx
    - type: GROUP
      permissions: r-x
    - type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-engineering"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - type: MASK
      permissions: rwx
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-engineering"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - scope: DEFAULT
      type: OTHER
      permissions: "---"
---
# Curated: the zone consumers query. Engineering writes the validated,
# modeled data; analysts read it -- and ONLY it.
apiVersion: azure.planton.dev/v1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: "{{ values.env }}-zone-curated"
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env }}-lakehouse-store"
      fieldPath: status.outputs.storage_account_id
  filesystemName: curated
  defaultEncryptionScope:
    valueFrom:
      kind: AzureStorageEncryptionScope
      name: "{{ values.env }}-scope-curated"
      fieldPath: status.outputs.encryption_scope_name
  aces:
    - type: USER
      permissions: rwx
    - type: GROUP
      permissions: r-x
    - type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-engineering"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    # Analysts read and traverse -- never write. Curated data changes
    # through pipelines, not notebooks.
    - type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-analysts"
          fieldPath: status.outputs.principal_id
      permissions: r-x
    - type: MASK
      permissions: rwx
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-engineering"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - scope: DEFAULT
      type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-analysts"
          fieldPath: status.outputs.principal_id
      permissions: r-x
    - scope: DEFAULT
      type: OTHER
      permissions: "---"
---
# Sandbox: shared scratch space -- both identities write, the lifecycle
# rule expires anything untouched for sandbox_ttl_days. Promotion out
# of the sandbox is a pipeline into curated, never a rename.
apiVersion: azure.planton.dev/v1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: "{{ values.env }}-zone-sandbox"
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: "{{ values.env }}-lakehouse-store"
      fieldPath: status.outputs.storage_account_id
  filesystemName: sandbox
  defaultEncryptionScope:
    valueFrom:
      kind: AzureStorageEncryptionScope
      name: "{{ values.env }}-scope-sandbox"
      fieldPath: status.outputs.encryption_scope_name
  aces:
    - type: USER
      permissions: rwx
    - type: GROUP
      permissions: r-x
    - type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-engineering"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-analysts"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - type: MASK
      permissions: rwx
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-engineering"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - scope: DEFAULT
      type: USER
      objectId:
        valueFrom:
          kind: AzureUserAssignedIdentity
          name: "{{ values.env }}-lake-analysts"
          fieldPath: status.outputs.principal_id
      permissions: rwx
    - scope: DEFAULT
      type: OTHER
      permissions: "---"
