params:
  # ─── Placement ───────────────────────────────────────────────────────────────
  - name: region
    description: Azure region for the estate. Zone-redundant placement requires a region with availability zones
    value: centralus

  # ─── Global names (must change) ──────────────────────────────────────────────
  - name: cosmos_account_name
    description: Globally unique Cosmos DB account name (3-50 lowercase letters, digits, and hyphens) -- it becomes the account's DNS name, {name}.documents.azure.com. MUST be changed before deploying
    value: my-api-cosmos

  # ─── Data model ──────────────────────────────────────────────────────────────
  - name: database_name
    description: The SQL (NoSQL API) database holding the API's containers
    value: appdb

  - name: container_name
    description: The primary container -- the unit of throughput and partitioning. Add more containers by extending the chart; each gets its own partition key and RU budget
    value: items

  - name: partition_key_path
    description: "The container's partition key path (starts with /). Choose the property your queries filter on most and whose values spread evenly -- a tenant, user, or device id. It is FIXED for the life of the container: changing it means a new container and a data migration"
    value: /tenantId

  - name: autoscale_max_throughput
    description: The container's autoscale ceiling in RU/s (multiples of 1000). Cosmos scales between 10% and this ceiling on demand -- the ceiling is the cost guardrail, and the throttle alert fires when demand presses against it
    value: 1000
    type: int

  # ─── Consistency and availability ────────────────────────────────────────────
  - name: consistency_level
    description: "The account's default consistency: SESSION (the default, and what most APIs want -- read-your-own-writes within a session at single-region latency), STRONG (linearizable, single-region or paired multi-region cost), BOUNDED_STALENESS, CONSISTENT_PREFIX, or EVENTUAL"
    value: SESSION

  - name: zone_redundant_enabled
    description: Spread the primary region's replicas across availability zones. Raises the write-availability SLA and survives a zone outage; adds a 25% RU cost premium, which is why it is a choice and not the default
    value: false
    type: bool

  - name: secondary_region_enabled
    description: Add a read region with automatic failover -- the API keeps serving (reads immediately, writes after failover) through a regional outage. Doubles RU and storage cost
    value: false
    type: bool

  - name: secondary_region
    description: The read/failover region (only used when secondary_region_enabled). Pick your primary's Azure paired region for the best failover story
    value: eastus2

  # ─── Network ─────────────────────────────────────────────────────────────────
  - name: vnet_cidr
    description: Address space of the data-plane virtual network. Application workloads peer in or share the VNet with their own subnets
    value: 10.40.0.0/16

  - name: pe_subnet_cidr
    description: CIDR of the private-endpoint subnet, inside vnet_cidr
    value: 10.40.1.0/24

  # ─── Notifications ───────────────────────────────────────────────────────────
  - name: ops_email
    description: Email address for the request-throttling alert
    value: ops@example.com

  # ─── Telemetry ───────────────────────────────────────────────────────────────
  - name: log_retention_days
    description: Log Analytics workspace retention in days
    value: 30
    type: int
