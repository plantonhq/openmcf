# One resource group holds the whole estate so a single delete reclaims
# everything the chart created.
apiVersion: azure.planton.dev/v1
kind: AzureResourceGroup
metadata:
  name: "{{ values.env }}-cosmos-api"
spec:
  name: "{{ values.env }}-cosmos-api"
  region: "{{ values.region }}"
---
# Destination for the account's data-plane and control-plane logs --
# per-request traces (including the 429s behind a throttle alert), auth
# failures, and every management-plane change.
apiVersion: azure.planton.dev/v1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: "{{ values.env }}-cosmos-logs"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-cosmos-api"
      fieldPath: status.outputs.resource_group_name
  workspaceName: "{{ values.env }}-cosmos-logs"
  retentionInDays: {{ values.log_retention_days }}
---
# The API workload's identity -- the ONLY way into the data plane, since
# the account disables key-based access entirely. The application binds
# this identity (pod identity, App Service identity assignment, VM
# identity) and authenticates with Entra tokens; there is no connection
# string to leak, rotate, or vault.
apiVersion: azure.planton.dev/v1
kind: AzureUserAssignedIdentity
metadata:
  name: "{{ values.env }}-cosmos-app-identity"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-cosmos-api"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-cosmos-app-identity"
