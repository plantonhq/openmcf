# Where the throttle alert lands. Action groups are global (no region),
# so notification delivery survives a regional outage.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorActionGroup
metadata:
  name: "{{ values.env }}-cosmos-ops"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-cosmos-api"
      fieldPath: status.outputs.resource_group_name
  # The short name is the sender identity on SMS and mobile push --
  # 12-character limit, keep it recognizable.
  shortName: CosmosOps
  emailReceivers:
    - name: ops-email
      emailAddress: "{{ values.ops_email }}"
      useCommonAlertSchema: true
---
# Route the account's telemetry into the workspace. DEDICATED sends the
# data-plane request log to its resource-specific table
# (CDBDataPlaneRequests), where every throttled request carries its RU
# charge and status code -- the "why" behind the alert below.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-cosmos-diag"
spec:
  settingName: cosmos-logs
  targetResourceId:
    valueFrom:
      kind: AzureCosmosdbAccount
      name: "{{ values.env }}-cosmos"
      fieldPath: status.outputs.cosmosdb_account_id
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-cosmos-logs"
      fieldPath: status.outputs.workspace_id
  logAnalyticsDestinationType: DEDICATED
  enabledLogs:
    - categoryGroup: allLogs
  enabledMetrics:
    - category: Requests
---
# Request throttling: Cosmos answering 429 means demand pressed past
# the autoscale ceiling -- clients are retrying, latency is climbing,
# and the fix (raise autoscale_max_throughput, or revisit the partition
# key if one partition is hot) is an operator decision. Severity 2:
# degraded, not down (SDKs retry 429s transparently up to a point).
apiVersion: azure.planton.dev/v1
kind: AzureMonitorMetricAlert
metadata:
  name: "{{ values.env }}-cosmos-throttle-alert"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-cosmos-api"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-cosmos-throttle-alert"
  scopes:
    - valueFrom:
        kind: AzureCosmosdbAccount
        name: "{{ values.env }}-cosmos"
        fieldPath: status.outputs.cosmosdb_account_id
  severity: 2
  # Fifteen minutes of sustained throttling, not a blip -- autoscale
  # absorbs momentary spikes, and SDK retries hide singles.
  windowSize: PT15M
  staticCriteria:
    - metricNamespace: Microsoft.DocumentDB/databaseAccounts
      metricName: TotalRequests
      aggregation: COUNT
      operator: GREATER_THAN
      # More than ~100 throttled requests in the window is a pattern,
      # not noise.
      threshold: 100
      dimensions:
        - name: StatusCode
          operator: INCLUDE
          values:
            - "429"
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-cosmos-ops"
          fieldPath: status.outputs.action_group_id
  description: Cosmos DB is throttling requests (HTTP 429) -- demand exceeded the autoscale ceiling; raise the container's max throughput or investigate a hot partition
