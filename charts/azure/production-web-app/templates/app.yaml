# RBAC-mode vault for application secrets. Secret VALUES are not managed
# here -- provision the vault in code, load secrets through a workflow.
apiVersion: azure.planton.dev/v1
kind: AzureKeyVault
metadata:
  name: "{{ values.env }}-app-vault"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.resource_group_name
  vaultName: "{{ values.key_vault_name }}"
---
# The web app's read grant on the vault (system-assigned identity).
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-app-vault-read"
spec:
  scope:
    valueFrom:
      kind: AzureKeyVault
      name: "{{ values.env }}-app-vault"
      fieldPath: status.outputs.key_vault_id
  roleDefinitionName: Key Vault Secrets User
  principalId:
    valueFrom:
      kind: AzureLinuxWebApp
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.identity_principal_id
  principalType: SERVICE_PRINCIPAL
  skipServicePrincipalAadCheck: true
  description: The web app reads application secrets from the vault through its system-assigned identity
---
apiVersion: azure.planton.dev/v1
kind: AzureServicePlan
metadata:
  name: "{{ values.env }}-web-plan"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.resource_group_name
  servicePlanName: "{{ values.env }}-web-plan"
  osType: LINUX
  skuName: PREMIUM_P1V3
---
# The application runtime: VNet-integrated, HTTPS-only, instrumented, and
# locked to Front Door at the origin so the WAF cannot be bypassed through
# the default hostname.
apiVersion: azure.planton.dev/v1
kind: AzureLinuxWebApp
metadata:
  name: "{{ values.env }}-web-app"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.resource_group_name
  webAppName: "{{ values.web_app_name }}"
  servicePlanId:
    valueFrom:
      kind: AzureServicePlan
      name: "{{ values.env }}-web-plan"
      fieldPath: status.outputs.service_plan_id
  httpsOnly: true
  virtualNetworkSubnetId:
    valueFrom:
      kind: AzureSubnet
      name: "{{ values.env }}-app-subnet"
      fieldPath: status.outputs.subnet_id
  identity:
    type: SYSTEM_ASSIGNED
  applicationInsightsConnectionString:
    valueFrom:
      kind: AzureApplicationInsights
      name: "{{ values.env }}-web-insights"
      fieldPath: status.outputs.connection_string
  siteConfig:
    # A runtime must be chosen; Python is the chart's neutral default --
    # swap the stack block for your application's language.
    applicationStack:
      pythonVersion: "3.12"
    alwaysOn: true
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    vnetRouteAllEnabled: true
    # Origin lockdown: only Front Door (filtered to THIS profile's GUID)
    # and Application Insights availability probes may reach the app.
    ipRestrictions:
      - name: front-door-only
        priority: 100
        action: ALLOW
        serviceTag: AzureFrontDoor.Backend
        headers:
          xAzureFdid:
            - valueFrom:
                kind: AzureFrontDoorProfile
                name: "{{ values.env }}-web-fd"
                fieldPath: status.outputs.resource_guid
      - name: availability-probe
        priority: 200
        action: ALLOW
        serviceTag: ApplicationInsightsAvailability
    ipRestrictionDefaultAction: DENY
