# Route the web app's platform logs into the workspace.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-web-app-diag"
spec:
  settingName: web-app-logs
  targetResourceId:
    valueFrom:
      kind: AzureLinuxWebApp
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.web_app_id
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-web-logs"
      fieldPath: status.outputs.workspace_id
  enabledLogs:
    - categoryGroup: allLogs
  enabledMetrics:
    - category: AllMetrics
---
# Route PostgreSQL audit logs into the same workspace.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-postgres-diag"
spec:
  settingName: postgres-logs
  targetResourceId:
    valueFrom:
      kind: AzurePostgresqlFlexibleServer
      name: "{{ values.env }}-postgres"
      fieldPath: status.outputs.server_id
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-web-logs"
      fieldPath: status.outputs.workspace_id
  enabledLogs:
    - categoryGroup: allLogs
  enabledMetrics:
    - category: AllMetrics
---
# Outside-in availability probe against the app's default hostname.
# The origin lockdown allows ApplicationInsightsAvailability through.
apiVersion: azure.planton.dev/v1
kind: AzureApplicationInsightsStandardWebTest
metadata:
  name: "{{ values.env }}-web-availability"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-web-availability"
  region: "{{ values.region }}"
  applicationInsightsId:
    valueFrom:
      kind: AzureApplicationInsights
      name: "{{ values.env }}-web-insights"
      fieldPath: status.outputs.application_insights_id
  retryEnabled: true
  request:
    url: "https://{{ values.web_app_name }}.azurewebsites.net"
  geoLocations:
    - us-va-ash-azr
    - us-il-ch1-azr
    - emea-nl-ams-azr
  description: Outside-in availability of the web application's default hostname
---
apiVersion: azure.planton.dev/v1
kind: AzureMonitorMetricAlert
metadata:
  name: "{{ values.env }}-web-availability-alert"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-web-app"
      fieldPath: status.outputs.resource_group_name
  alertName: "{{ values.env }}-web-availability-alert"
  scopes:
    - valueFrom:
        kind: AzureApplicationInsightsStandardWebTest
        name: "{{ values.env }}-web-availability"
        fieldPath: status.outputs.web_test_id
  severity: 0
  webTestAvailabilityCriteria:
    webTestId:
      valueFrom:
        kind: AzureApplicationInsightsStandardWebTest
        name: "{{ values.env }}-web-availability"
        fieldPath: status.outputs.web_test_id
    componentId:
      valueFrom:
        kind: AzureApplicationInsights
        name: "{{ values.env }}-web-insights"
        fieldPath: status.outputs.application_insights_id
    failedLocationCount: 2
  actions:
    - actionGroupId:
        valueFrom:
          kind: AzureMonitorActionGroup
          name: "{{ values.env }}-critical-alerts"
          fieldPath: status.outputs.action_group_id
  description: The web application is failing its availability probe from multiple locations
