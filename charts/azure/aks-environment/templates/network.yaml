---
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetwork
metadata:
  name: "{{ values.env }}-vnet"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-vnet"
  addressSpaces:
    - "{{ values.vnet_cidr }}"
---
apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-nodes-subnet"
spec:
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-vnet"
      fieldPath: status.outputs.virtual_network_id
  name: "{{ values.env }}-nodes-subnet"
  addressPrefixes:
    - "{{ values.nodes_subnet_cidr }}"
{% if values.is_nat_gateway_enabled | bool %}
  natGatewayId:
    valueFrom:
      kind: AzureNatGateway
      name: "{{ values.env }}-natgw"
      fieldPath: status.outputs.nat_gateway_id
{% endif %}
{% if values.is_nat_gateway_enabled | bool %}
---
apiVersion: azure.planton.dev/v1
kind: AzurePublicIp
metadata:
  name: "{{ values.env }}-natgw-ip"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-natgw-ip"
---
apiVersion: azure.planton.dev/v1
kind: AzureNatGateway
metadata:
  name: "{{ values.env }}-natgw"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-natgw"
  publicIpIds:
    - valueFrom:
        kind: AzurePublicIp
        name: "{{ values.env }}-natgw-ip"
        fieldPath: status.outputs.public_ip_id
{% endif %}
