---
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetwork
metadata:
  name: "{{ values.env }}-vnet"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-vnet"
  addressSpaces:
    - "{{ values.vnet_cidr }}"
---
apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-nodes-subnet"
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  vnetId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-vnet"
      fieldPath: status.outputs.virtual_network_id
  name: "{{ values.env }}-nodes-subnet"
  addressPrefix: "{{ values.nodes_subnet_cidr }}"
{% if values.is_nat_gateway_enabled | bool %}
---
apiVersion: azure.planton.dev/v1
kind: AzureNatGateway
metadata:
  name: "{{ values.env }}-natgw"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  subnetId:
    valueFrom:
      kind: AzureSubnet
      name: "{{ values.env }}-nodes-subnet"
      fieldPath: status.outputs.subnet_id
{% endif %}
