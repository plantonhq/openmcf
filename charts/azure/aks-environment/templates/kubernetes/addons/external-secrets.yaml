{% if values.externalSecretsEnabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalSecrets
metadata:
  name: {{ values.cluster_name }}-external-secrets
  relationships:
    - kind: AzureAksNodePool
      name: "{{ values.node_pool_name }}"
      type: runs_on
spec:
  namespace:
    value: external-secrets
  createNamespace: true
  container:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 100Mi
{% endif %}

