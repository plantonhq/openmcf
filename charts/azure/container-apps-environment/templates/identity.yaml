# The one workload identity the API, the worker, and the Dapr sidecars
# all run as. A single shared identity (rather than one per app) is the
# honest starting shape for a microservice estate that talks to one
# broker -- split identities per app the day their permissions diverge.
apiVersion: azure.planton.dev/v1
kind: AzureUserAssignedIdentity
metadata:
  name: "{{ values.env }}-capps-identity"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-container-apps"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-capps-identity"
---
# Data-plane send right on the namespace: the API's Dapr sidecar
# publishes with an Entra token -- no connection string exists anywhere
# in this deployment. Sender + Receiver (below) instead of Data Owner is
# deliberate: the chart's IaC owns the messaging topology
# (disableEntityManagement on the Dapr component), so nothing needs
# entity-management rights.
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-capps-bus-send"
spec:
  scope:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: "{{ values.env }}-capps-bus"
      fieldPath: status.outputs.namespace_id
  roleDefinitionName: Azure Service Bus Data Sender
  principalId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: "{{ values.env }}-capps-identity"
      fieldPath: status.outputs.principal_id
  principalType: SERVICE_PRINCIPAL
  # The identity is created moments before this grant; skipping the
  # directory existence check avoids losing the race against Entra's
  # asynchronous replication (PrincipalNotFound).
  skipServicePrincipalAadCheck: true
  description: The workload identity publishes pub/sub messages to Service Bus through Dapr -- keyless, no connection string in the deployment
---
# Data-plane receive right: the worker's Dapr sidecar consumes the
# subscription queue, and KEDA reads queue depth with the same identity
# to drive scale-from-zero.
apiVersion: azure.planton.dev/v1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-capps-bus-receive"
spec:
  scope:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: "{{ values.env }}-capps-bus"
      fieldPath: status.outputs.namespace_id
  roleDefinitionName: Azure Service Bus Data Receiver
  principalId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: "{{ values.env }}-capps-identity"
      fieldPath: status.outputs.principal_id
  principalType: SERVICE_PRINCIPAL
  skipServicePrincipalAadCheck: true
  description: The workload identity consumes pub/sub messages and lets KEDA read queue depth for scale-from-zero -- keyless
