---
apiVersion: azure.planton.dev/v1
kind: AzureResourceGroup
metadata:
  name: "{{ values.env }}-rg"
spec:
  name: "{{ values.env }}-{{ values.resource_group_name }}"
  region: "{{ values.region }}"
---
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetwork
metadata:
  name: "{{ values.env }}-vnet"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-rg"
      fieldPath: status.outputs.resource_group_name
  name: "{{ values.env }}-vnet"
  addressSpaces:
    - "{{ values.vnet_cidr }}"
---
apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: "{{ values.env }}-cae-subnet"
spec:
  virtualNetworkId:
    valueFrom:
      kind: AzureVirtualNetwork
      name: "{{ values.env }}-vnet"
      fieldPath: status.outputs.virtual_network_id
  name: "{{ values.env }}-cae-subnet"
  addressPrefixes:
    - "{{ values.container_apps_subnet_cidr }}"
