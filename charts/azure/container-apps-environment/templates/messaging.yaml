# The pub/sub broker. STANDARD is the floor for topics and per-message
# features the Dapr component relies on (BASIC is queues-only with no
# TTL/dedup surface); PREMIUM adds dedicated capacity, CMK, and VNet
# rules when the estate needs them -- an in-place upgrade, not a
# rebuild. Local (SAS) auth stays enabled because the Azure portal's
# own tooling still needs it; the deployment itself never uses a key.
apiVersion: azure.planton.dev/v1
kind: AzureServiceBusNamespace
metadata:
  name: "{{ values.env }}-capps-bus"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: "{{ values.env }}-container-apps"
      fieldPath: status.outputs.resource_group_name
  namespaceName: "{{ values.servicebus_namespace_name }}"
  sku: STANDARD
---
# The topic's backing queue. Dapr's queue-based Service Bus pub/sub maps
# each topic to a Service Bus QUEUE named after the topic -- and because
# the component disables entity management, the queue is a first-class
# IaC resource with real posture instead of something a sidecar creates
# with defaults behind the infrastructure's back.
apiVersion: azure.planton.dev/v1
kind: AzureServiceBusQueue
metadata:
  name: "{{ values.env }}-{{ values.orders_topic_name }}-queue"
spec:
  namespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: "{{ values.env }}-capps-bus"
      fieldPath: status.outputs.namespace_id
  queueName: "{{ values.orders_topic_name }}"
  # Dead-letter posture: a message that expires or exhausts delivery
  # attempts lands in the DLQ for inspection instead of vanishing.
  # 10 attempts absorbs transient worker crashes; poison messages park.
  maxDeliveryCount: 10
  deadLetteringOnMessageExpiration: true
  # Fourteen days to notice and drain a backlog before messages expire
  # into the DLQ -- generous on purpose; storage is the cheap part.
  defaultMessageTtl: P14D
  # One minute to process a message before it returns to the queue for
  # redelivery. Size to the worker's slowest handler, not its average.
  lockDuration: PT1M
---
# Broker telemetry (throttling, dead-letter counts, connection churn)
# into the estate's workspace. The environment's own logs flow through
# its logs_destination binding; the namespace needs this explicit route.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: "{{ values.env }}-capps-bus-diag"
spec:
  settingName: servicebus-logs
  targetResourceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: "{{ values.env }}-capps-bus"
      fieldPath: status.outputs.namespace_id
  logAnalyticsWorkspaceId:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: "{{ values.env }}-capps-logs"
      fieldPath: status.outputs.workspace_id
  enabledLogs:
    - categoryGroup: allLogs
  enabledMetrics:
    - category: AllMetrics
