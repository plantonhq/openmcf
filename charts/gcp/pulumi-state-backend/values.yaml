params:
  # ─── GCP placement ──────────────────────────────────────────────────────
  - name: gcp_project_id
    description: >
      GCP project that owns the state bucket (and the KMS key ring and
      service account, when those toggles are enabled). State typically
      lives in a small, tightly-controlled "seed" or "ops" project rather
      than in the projects whose infrastructure it describes.
    value: my-gcp-project

  - name: bucket_name
    description: >
      Name of the GCS state bucket. GCS bucket names are GLOBALLY unique
      across all of GCP, so pick an org-scoped convention such as
      <org>-pulumi-state. Immutable — renaming means a new bucket and a
      state migration. The bucket name is also your login URL:
      `pulumi login gs://<bucket_name>`.
    value: my-org-pulumi-state

  - name: location
    description: >
      Bucket location — a multi-region ("US", "EU", "ASIA") for the highest
      availability, or a region ("us-central1") to pin state residency and
      cut latency for a single-region team. Immutable after creation. When
      the CMEK toggle is on, the key ring is placed in this same location
      (lowercased), which CMEK requires.
    value: US

  # ─── Checkpoint-history retention ───────────────────────────────────────
  - name: noncurrent_versions_to_keep
    description: >
      How many previous versions of each state object to retain for
      recovery. Pulumi already keeps its own checkpoint history under
      .pulumi/history/; bucket-level versioning is the second net that also
      protects the history files themselves. This cap keeps the combined
      growth bounded. 30 comfortably covers weeks of updates on an active
      stack.
    value: "30"

  # ─── Customer-managed encryption (CMEK) ─────────────────────────────────
  - name: kmsEnabled
    description: >
      Encrypt state objects with a customer-managed Cloud KMS key instead of
      Google-managed encryption. Adds a key ring, a key with 90-day
      rotation, and the IAM grant the Cloud Storage service agent needs to
      use the key. This protects state AT REST in the bucket; it is
      complementary to Pulumi's own secrets passphrase, which encrypts
      secret VALUES inside the state document. Requires gcp_project_number.
    type: bool
    value: false

  - name: gcp_project_number
    description: >
      The NUMERIC project number of gcp_project_id (find it with
      `gcloud projects describe <project-id> --format='value(projectNumber)'`).
      Only needed when kmsEnabled is true: it identifies the Cloud Storage
      service agent (service-<number>@gs-project-accounts.iam.gserviceaccount.com)
      that must be granted use of the encryption key.

  # ─── Dedicated state-access identity ────────────────────────────────────
  - name: serviceAccountEnabled
    description: >
      Create a dedicated service account whose only power is reading and
      writing objects in this bucket. Pointing CI/CD and the Planton runner
      at a single-purpose identity keeps state access auditable and
      revocable without touching broader credentials.
    type: bool
    value: true

  - name: service_account_id
    description: >
      Account ID for the state-access service account (becomes
      <id>@<project>.iam.gserviceaccount.com). 6-30 lowercase letters,
      digits, and hyphens.
    value: pulumi-state

  - name: serviceAccountKeyEnabled
    description: >
      Also export a JSON key for the state-access service account. The key
      is what you paste into a Planton StateBackend registration (inline
      auth) or a CI secret — but it is a long-lived credential, so leave
      this off and prefer keyless auth (Workload Identity Federation, or the
      runner's own ambient credentials) wherever the caller supports it.
    type: bool
    value: false
