# The passwordless application identity (appIdentityEnabled=true): the
# service account IS the database user, authenticated through IAM. No
# password exists in this chart, in the manifest, or in any state file —
# the application connects through the Cloud SQL connector (or Auth
# Proxy) as the account it already runs as.
{% if values.appIdentityEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.instance_name }}-app"
spec:
  serviceAccountId: "{{ values.instance_name }}-app"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.instance_name }} application identity"
  description: >-
    Identity the {{ values.instance_name }} application connects to the
    database as. IAM-authenticated database user; no password, no
    user-managed key.

---
# The runtime identity as a database user. For service accounts the user
# name is the account's email — assembled from parameters because the
# account is defined in this chart from the same parameters. Postgres
# stores IAM service-account users truncated before the
# ".gserviceaccount.com" suffix; clients authenticate with the stored form.
apiVersion: gcp.planton.dev/v1
kind: GcpCloudSqlUser
metadata:
  name: "{{ values.instance_name }}-app-user"
  # Cloud SQL validates that the IAM principal exists when the user is
  # created, but nothing flows from the account into this manifest (the
  # email is assembled, not referenced) — the explicit edge supplies the
  # ordering a valueFrom would otherwise carry.
  relationships:
    - kind: GcpServiceAccount
      name: "{{ values.instance_name }}-app"
      type: depends_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  instance:
    valueFrom:
      name: "{{ values.instance_name }}"
  userName: "{{ values.instance_name }}-app@{{ values.gcp_project_id }}.iam.gserviceaccount.com"
  type: CLOUD_IAM_SERVICE_ACCOUNT

---
# The two project roles IAM database authentication requires:
# cloudsql.client to open connections and cloudsql.instanceUser to log in
# as an IAM user. Additive grants — one resource per role, so revoking one
# never disturbs the other. The member references the account's member
# output, which also orders the grants after the account exists.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.instance_name }}-sql-client"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/cloudsql.client
  member:
    valueFrom:
      name: "{{ values.instance_name }}-app"

---
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.instance_name }}-sql-instance-user"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/cloudsql.instanceUser
  member:
    valueFrom:
      name: "{{ values.instance_name }}-app"
{% endif %}
