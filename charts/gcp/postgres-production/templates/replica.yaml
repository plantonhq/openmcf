# The read replica (readReplicaEnabled=true): an asynchronous, read-only
# copy the application addresses separately — read-heavy traffic moves
# off the primary, and in another region it doubles as a promotable DR
# seed. The master reference is what makes it a replica, and it also
# orders the replica after the primary.
{% if values.readReplicaEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpCloudSql
metadata:
  name: "{{ values.instance_name }}-replica"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  instanceName: "{{ values.instance_name }}-replica"
  region: "{{ values.replica_region }}"
  # Engine, version, and tier must match the primary — GCP requires a
  # replica to run the primary's engine/version, and an undersized
  # replica lags under the primary's write load.
  databaseEngine: POSTGRESQL
  databaseVersion: "{{ values.db_version }}"
  tier: "{{ values.db_tier }}"
  edition: ENTERPRISE
  # The master reference is what makes this instance a replica.
  masterInstanceName:
    valueFrom:
      name: "{{ values.instance_name }}"
  disk:
    type: PD_SSD
    sizeGb: {{ values.disk_size_gb }}
    autoResize: true
  network:
    # Same private-only posture as the primary, same shared network.
    privateNetwork:
      valueFrom:
        name: "{{ values.network_resource_name }}"
    sslMode: ENCRYPTED_ONLY
  # IAM users replicate from the primary, but each instance checks the
  # flag locally — it must be on here too for IAM logins to the replica.
  databaseFlags:
    cloudsql.iam_authentication: "on"
  insightsConfig:
    queryInsightsEnabled: true
    recordApplicationTags: true
  # No backup block and no delete guards on purpose: replicas cannot take
  # backups (the primary owns recovery), and a replica is derived state —
  # rebuildable from the primary, so it must never hold teardown hostage.
{% endif %}
