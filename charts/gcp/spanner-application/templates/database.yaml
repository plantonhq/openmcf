# The application database. Schema (DDL) is deliberately not templated
# here: after creation Spanner DDL is append-only, and schema belongs to
# the application's migration tooling — the chart owns the container and
# its recovery posture, not the tables.
---
apiVersion: gcp.planton.dev/v1
kind: GcpSpannerDatabase
metadata:
  name: "{{ values.instance_name }}-{{ values.database_name }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  # The instance reference — resolves to its instance_name output and
  # orders the database after the instance exists.
  instance:
    valueFrom:
      name: "{{ values.instance_name }}"
  databaseName: "{{ values.database_name }}"
  # Immutable: the dialect is decided before the first table exists.
  databaseDialect: {{ values.database_dialect }}
  # The point-in-time-recovery window: stale reads and backups can reach
  # back this far. Mutable — widen it before you need it, not after.
  versionRetentionPeriod: "{{ values.version_retention_period }}"
  # GCP-side drop protection: the API refuses to drop the database (and
  # refuses to delete the parent instance) while this is set. Pairs with
  # the IaC-side guard below — two independent locks on production data.
  enableDropProtection: true
  # IaC-side guard (also the field's default, made explicit because for
  # THIS database it is a deliberate decision): a destroy plan fails
  # until it is consciously set false.
  deletionProtection: true
