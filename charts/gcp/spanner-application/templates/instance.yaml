# The Spanner instance — the compute-and-replication envelope every
# database in it inherits. Capacity is the only day-2 lever here: the
# topology (config) and the name are immutable, so they are the decisions
# to get right before the first deploy.
---
apiVersion: gcp.planton.dev/v1
kind: GcpSpannerInstance
metadata:
  name: "{{ values.instance_name }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  instanceName: "{{ values.instance_name }}"
  # The replication topology. Immutable — changing it means a new
  # instance and a data migration, so this is the one field to be sure
  # about. Regional = 99.99% availability; multi-region = 99.999% and
  # survives a region loss at a higher price.
  config: "{{ values.spanner_config }}"
  displayName: "{{ values.instance_name }}"
  edition: {{ values.edition }}
{% if values.autoscalingEnabled | bool %}
  # Managed autoscaling: Spanner adjusts capacity between the node bounds
  # based on CPU and storage utilization. The CPU target of 65% is
  # Google's guidance for REGIONAL configs — use 45% for multi-region
  # configs, which need more headroom to absorb a region failover.
  autoscalingConfig:
    autoscalingLimits:
      minNodes: {{ values.autoscaling_min_nodes }}
      maxNodes: {{ values.autoscaling_max_nodes }}
    autoscalingTargets:
      highPriorityCpuUtilizationPercent: 65
      storageUtilizationPercent: 80
{% else %}
  # Fixed capacity in processing units (1000 = 1 node). Mutable in
  # place — scaling up under load is a spec edit, not a migration.
  processingUnits: {{ values.processing_units }}
{% endif %}
  # NONE on purpose: this chart carries its own explicit backup schedule
  # (backup.yaml) with real retention. AUTOMATIC would ALSO attach GCP's
  # default 24h-retention schedule to every new database — two overlapping
  # backup policies, one of them invisible in your manifests.
  defaultBackupScheduleType: NONE
  # force_destroy stays at its default (false) on purpose: destroying the
  # instance while any database still has backups should fail — backups
  # are deliberately deleted, never swept away with their container.
