params:
  # ─── GCP placement ──────────────────────────────────────────────────────
  - name: gcp_project_id
    description: >
      GCP project that owns the Spanner instance, its database, and the
      backup schedule.
    value: my-gcp-project

  # ─── The instance ────────────────────────────────────────────────────────
  - name: instance_name
    description: >
      Name of the Spanner instance (6-30 lowercase letters, digits, and
      hyphens), and the prefix the database and backup-schedule resource
      names build on. Immutable — renaming recreates the instance.
    value: app-spanner

  - name: spanner_config
    description: >
      The instance's replication topology — a regional config
      ("regional-us-central1") or a multi-region config ("nam6", "eur3").
      Immutable and the single biggest cost and availability decision:
      regional gives 99.99% availability at the lowest price; multi-region
      gives 99.999% and survives a region loss. If you pick a multi-region
      config, also lower the autoscaling CPU target (see the instance
      template's comments).
    value: regional-us-central1

  - name: edition
    description: >
      Spanner edition, which gates features and price. ENTERPRISE is the
      production default (it is also what INCREMENTAL backups and richer
      observability require); STANDARD suits cost-sensitive regional
      workloads; ENTERPRISE_PLUS adds the highest tier of features.
      Editions upgrade in place.
    type: string_enum
    enumValues:
      - STANDARD
      - ENTERPRISE
      - ENTERPRISE_PLUS
    value: ENTERPRISE

  - name: processing_units
    description: >
      Fixed compute capacity in processing units (1000 = 1 node). Values
      below 1000 must be multiples of 100; 100 is the smallest billable
      Spanner footprint and a real production entry point for small
      workloads. Mutable — scale in place as load grows. Ignored when
      autoscalingEnabled is true.
    value: "100"

  - name: autoscalingEnabled
    description: >
      Replace the fixed processing_units with Spanner's managed
      autoscaler: capacity follows CPU and storage utilization within the
      node bounds below. Off by default because the autoscaler's minimum
      footprint (whole nodes) costs more than a small fixed-capacity
      instance — turn it on when load is spiky or growing enough that
      hand-tuning capacity becomes a chore.
    type: bool
    value: false

  - name: autoscaling_min_nodes
    description: >
      Lower bound for the managed autoscaler, in nodes. Capacity never
      drops below this even when the instance is idle — it is the
      guaranteed floor your latency SLOs stand on.
    value: "1"

  - name: autoscaling_max_nodes
    description: >
      Upper bound for the managed autoscaler, in nodes. Also your cost
      ceiling: the autoscaler will not scale past it no matter the load,
      so size it to the spend you are prepared to absorb.
    value: "3"

  # ─── The database ────────────────────────────────────────────────────────
  - name: database_name
    description: >
      Name of the application database (2-30 characters: lowercase
      letters, digits, underscores, and hyphens; must start with a
      letter). Immutable.
    value: app

  - name: database_dialect
    description: >
      SQL dialect the database speaks — GOOGLE_STANDARD_SQL (the native
      dialect, richest tooling) or POSTGRESQL (the PostgreSQL interface,
      for teams porting Postgres applications and drivers). Immutable:
      decide before the first table exists.
    type: string_enum
    enumValues:
      - GOOGLE_STANDARD_SQL
      - POSTGRESQL
    value: GOOGLE_STANDARD_SQL

  - name: version_retention_period
    description: >
      Point-in-time-recovery window — how far back stale reads and backups
      can reach (1h to 7d, e.g. "24h", "3d"). Three days covers the
      common "we noticed the bad deploy on Monday" case; longer windows
      cost storage for every version they retain. Mutable.
    value: 3d

  # ─── The backup schedule ─────────────────────────────────────────────────
  - name: backup_cron
    description: >
      UTC crontab expression for the backup schedule. Spanner accepts
      every-12-hours, daily, weekly, or monthly cadences; the default
      takes a daily backup at 02:00 UTC.
    value: 0 2 * * *

  - name: backup_retention
    description: >
      How long each backup is kept, as seconds with an "s" suffix. The
      default "2678400s" is 31 days; the maximum is 366 days
      ("31622400s"). Retention is mutable and applies to new backups.
    value: 2678400s
