# The runtime identity. Every workload gets its own service account so its
# permissions can be granted precisely — the alternative (the project's
# default compute account) starts life over-privileged and is shared by
# everything, which makes least-privilege impossible later. The account
# holds nothing by itself; the database arm grants it exactly the two
# Cloud SQL roles it needs, and anything else the app touches gets its own
# additive grant beside it.
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.service_name }}-runtime"
spec:
  serviceAccountId: "{{ values.service_name }}-runtime"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.service_name }} runtime"
  description: >-
    Runtime identity for the {{ values.service_name }} Cloud Run service.
    Holds only the roles the application needs; no user-managed key.
