# The image repository (registryEnabled=true): where this service's images
# live. Kept beside the service so the whole application — code artifact
# through serving infrastructure — deploys as one unit. Push access is a
# CI/CD concern and deliberately NOT granted here: a deployer chart (or
# your pipeline's own identity) brings its own repository-scoped writer
# grant, while Cloud Run pulls through its service agent, which reads
# repositories in the same project without any grant from us.
{% if values.registryEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpArtifactRegistryRepo
metadata:
  name: "{{ values.registry_repository_id }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  location: "{{ values.region }}"
  repositoryId: "{{ values.registry_repository_id }}"
  format: DOCKER
  description: >-
    Container images for the {{ values.service_name }} Cloud Run service.
{% endif %}
