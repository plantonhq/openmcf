# The front door (frontDoorEnabled=true): a global external HTTPS load
# balancer serving the service on your own domain. Composition, VIP first:
#
#   client → global address → forwarding rule :443 → HTTPS proxy
#          → (managed certificate, TLS) → URL map → backend service
#          → serverless NEG → the Cloud Run service
#
# plus the redirect twin on the same address: forwarding rule :80 → HTTP
# proxy → redirect URL map → 301 to https. With this arm on, service.yaml
# flips the service's ingress to INTERNAL_LOAD_BALANCER so the run.app URL
# stops bypassing the edge.
{% if values.frontDoorEnabled | bool %}
---
# The serverless NEG — the adapter that lets a Cloud Run service stand in
# a load balancer's backend. Regional, matching the service.
apiVersion: gcp.planton.dev/v1
kind: GcpRegionNetworkEndpointGroup
metadata:
  name: "{{ values.service_name }}-neg"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  region: "{{ values.region }}"
  cloudRun:
    service:
      valueFrom:
        name: "{{ values.service_name }}"

{% if values.cloudArmorEnabled | bool %}
---
# The Cloud Armor policy (cloudArmorEnabled=true). Deliberately wide open:
# a single default-allow rule means attaching it changes nothing for
# traffic — but WAF rules, IP allowlists, and rate limits are now an edit
# to THIS resource instead of a load-balancer rework. Tighten it as your
# threat model firms up.
apiVersion: gcp.planton.dev/v1
kind: GcpCloudArmorPolicy
metadata:
  name: "{{ values.service_name }}-armor"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  policyName: "{{ values.service_name }}-armor"
  description: Edge security policy for the {{ values.service_name }} front door
  rules:
    # Every policy must carry a rule at the lowest priority (2147483647) as
    # its default. Allow-all is the honest starting posture; add deny and
    # rate-limit rules ABOVE it (lower priority number = evaluated first).
    - action: allow
      priority: 2147483647
      description: Default allow — tighten with higher-priority rules
      match:
        versionedExpr: SRC_IPS_V1
        srcIpRanges:
          - "*"
{% endif %}

---
# The backend service — HOW traffic reaches the NEG. Serverless backends
# carry no health check and no capacity dials by GCP's contract: the
# platform manages its own health and scaling, and the API rejects
# balancing modes for serverless NEGs.
apiVersion: gcp.planton.dev/v1
kind: GcpBackendService
metadata:
  name: "{{ values.service_name }}-backend"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Routes front-door traffic to the {{ values.service_name }} serverless NEG
  protocol: HTTPS
  loadBalancingScheme: EXTERNAL_MANAGED
  backends:
    - group:
        valueFrom:
          name: "{{ values.service_name }}-neg"
{% if values.cloudArmorEnabled | bool %}
  securityPolicy:
    valueFrom:
      name: "{{ values.service_name }}-armor"
{% endif %}
  logConfig:
    # A 10% sample is enough to debug edge behavior without paying for a
    # log line per request at scale.
    enable: true
    sampleRate: 0.1

---
# The serving URL map: everything to the backend service. Host/path fanout
# across multiple services starts here — add hostRules/pathMatchers as the
# architecture grows past one service.
apiVersion: gcp.planton.dev/v1
kind: GcpUrlMap
metadata:
  name: "{{ values.service_name }}-url-map"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Routes all {{ values.domain }} traffic to the {{ values.service_name }} backend
  # default_service accepts a backend service OR a backend bucket, so the
  # field declares no default kind — the kind (and therefore the field
  # path) is explicit.
  defaultService:
    valueFrom:
      kind: GcpBackendService
      name: "{{ values.service_name }}-backend"
      fieldPath: status.outputs.self_link

---
# The redirect URL map — a URL map may carry exactly one default target, so
# the HTTP-to-HTTPS bounce is its own tiny map on the port-80 path rather
# than a branch of the serving map.
apiVersion: gcp.planton.dev/v1
kind: GcpUrlMap
metadata:
  name: "{{ values.service_name }}-redirect-map"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Permanent redirect of plain-HTTP {{ values.domain }} traffic to HTTPS
  defaultUrlRedirect:
    httpsRedirect: true
    redirectResponseCode: MOVED_PERMANENTLY_DEFAULT
    stripQuery: false

---
# The Google-managed certificate. It stays PROVISIONING until the domain's
# A record points at the reserved IP below — deploy first, then cut DNS;
# the certificate activates on its own once validation sees the record.
apiVersion: gcp.planton.dev/v1
kind: GcpManagedSslCertificate
metadata:
  name: "{{ values.service_name }}-cert"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Managed TLS for {{ values.domain }}
  domains:
    - "{{ values.domain }}"

---
# TLS termination: the 443 frontend. The certificate attaches by reference
# — rotation and renewal stay Google's problem.
apiVersion: gcp.planton.dev/v1
kind: GcpTargetHttpsProxy
metadata:
  name: "{{ values.service_name }}-https-proxy"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Port-443 frontend for {{ values.domain }}
  urlMap:
    valueFrom:
      name: "{{ values.service_name }}-url-map"
  sslCertificates:
    - valueFrom:
        name: "{{ values.service_name }}-cert"

---
# The port-80 twin serving the redirect map.
apiVersion: gcp.planton.dev/v1
kind: GcpTargetHttpProxy
metadata:
  name: "{{ values.service_name }}-http-proxy"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Port-80 frontend bouncing {{ values.domain }} to HTTPS
  urlMap:
    valueFrom:
      name: "{{ values.service_name }}-redirect-map"

---
# The one stable address both rules share — the thing DNS points at. It
# outlives every proxy/certificate/backend swap behind it.
apiVersion: gcp.planton.dev/v1
kind: GcpGlobalAddress
metadata:
  name: "{{ values.service_name }}-ip"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  addressName: "{{ values.service_name }}-ip"
  addressType: EXTERNAL
  ipVersion: IPV4
  description: Front-door VIP for {{ values.domain }}

---
# The 443 VIP: address + proxy joined into a reachable endpoint.
apiVersion: gcp.planton.dev/v1
kind: GcpGlobalForwardingRule
metadata:
  name: "{{ values.service_name }}-https-rule"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Port-443 VIP for {{ values.domain }}
  target:
    valueFrom:
      name: "{{ values.service_name }}-https-proxy"
  ipAddress:
    valueFrom:
      name: "{{ values.service_name }}-ip"
  portRange: "443"
  loadBalancingScheme: EXTERNAL_MANAGED

---
# The port-80 VIP on the SAME address, serving only the redirect. The
# target is a GcpTargetHttpProxy — not this field's default kind — so both
# the kind and the field path are explicit.
apiVersion: gcp.planton.dev/v1
kind: GcpGlobalForwardingRule
metadata:
  name: "{{ values.service_name }}-http-rule"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Port-80 VIP redirecting {{ values.domain }} to HTTPS
  target:
    valueFrom:
      kind: GcpTargetHttpProxy
      name: "{{ values.service_name }}-http-proxy"
      fieldPath: status.outputs.self_link
  ipAddress:
    valueFrom:
      name: "{{ values.service_name }}-ip"
  portRange: "80"
  loadBalancingScheme: EXTERNAL_MANAGED
{% endif %}
