# The cache arm (memorystoreEnabled=true): Memorystore for Valkey, reached
# from the shared network over Private Service Connect. Two resources:
#
#   1. The service connection policy — the per-network authorization that
#      lets Google's service connectivity automation place PSC endpoints
#      for the gcp-memorystore service class in the subnet below. Without
#      it, instance creation is refused. GCP allows one policy per
#      (network, service class, region); the serviceConnectionPolicyEnabled
#      sub-toggle exists so a second deployment of this chart on the same
#      network reuses the existing policy instead of colliding with it.
#   2. The instance itself — single-shard standalone by default, so any
#      Redis-compatible client works without a cluster-aware driver.
#
# The service discovers the cache endpoint from the instance's discovery
# address after deploy (see the README's after-deployment section) — the
# endpoint is assigned by GCP at create time and is not known before it.
{% if values.memorystoreEnabled | bool %}
{% if values.serviceConnectionPolicyEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceConnectionPolicy
metadata:
  name: "{{ values.service_name }}-cache-scp"
spec:
  location: "{{ values.region }}"
  # The consumer network — the same shared VPC the other private arms use.
  network:
    valueFrom:
      name: "{{ values.network_resource_name }}"
  # gcp-memorystore is the published service class for Memorystore for
  # Valkey; the policy is class-scoped, so it also covers future instances
  # of the same class on this network and region.
  serviceClass: gcp-memorystore
  pscConfig:
    # Endpoint IPs come from this subnet. Regular-purpose subnets work —
    # no special PSC purpose is needed.
    subnetworks:
      - valueFrom:
          name: "{{ values.subnet_resource_name }}"
{% endif %}

---
apiVersion: gcp.planton.dev/v1
kind: GcpMemorystoreInstance
metadata:
  name: "{{ values.service_name }}-cache"
{% if values.serviceConnectionPolicyEnabled | bool %}
  # No spec field references the policy (the API discovers it by network +
  # class + region), so the ordering edge is declared explicitly: creating
  # the instance before the policy exists is refused by GCP.
  relationships:
    - kind: GcpServiceConnectionPolicy
      name: "{{ values.service_name }}-cache-scp"
      type: depends_on
{% endif %}
spec:
  instanceName: "{{ values.service_name }}-cache"
  location: "{{ values.region }}"
  shardCount: 1
  # Standalone mode — a single primary endpoint, compatible with any
  # Valkey/Redis client. Move to CLUSTER (and raise shardCount) when the
  # working set outgrows one node.
  mode: CLUSTER_DISABLED
  nodeType: "{{ values.cache_node_type }}"
  pscAutoConnections:
    - network:
        valueFrom:
          name: "{{ values.network_resource_name }}"
      projectId:
        value: "{{ values.gcp_project_id }}"
  # A cache is rebuildable by definition — deletion protection would only
  # make environment teardown fail without protecting anything durable.
  deletionProtectionEnabled: false
{% endif %}
