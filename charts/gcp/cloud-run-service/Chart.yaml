apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: GCP Cloud Run Service
spec:
  selector:
    kind: platform
  description: A production Cloud Run service with everything it grows into — an Artifact Registry repository for its images, a dedicated runtime identity, and optional arms for a private Cloud SQL Postgres it reaches over the database socket with passwordless IAM authentication, a Memorystore for Valkey cache, a Serverless VPC Access connector for private egress, and a global HTTPS front door (load balancer, Google-managed certificate, HTTP-to-HTTPS redirect, optional Cloud Armor) for your custom domain. Defaults deploy a public hello service in one shot; every arm is a toggle you turn on when the architecture calls for it.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/gcp/gcpcloudrun/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/gcp/cloud-run-service
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/gcp/cloud-run-service/README.md
