{% if values.kafkaOperatorEnabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStrimziKafkaOperator
metadata:
  name: {{ values.cluster_name }}-kafka-operator
  relationships:
    - kind: GcpGkeNodePool
      name: "{{ values.node_pool_name }}"
      type: runs_on
spec:
  namespace:
    value: strimzi
  createNamespace: true
  container:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 100Mi
{% endif %}

