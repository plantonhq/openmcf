{% if values.istioEnabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIstio
metadata:
  name: {{ values.cluster_name }}-istio-ingress
  relationships:
    - kind: GcpGkeNodePool
      name: "{{ values.node_pool_name }}"
      type: runs_on
spec:
  namespace:
    value: istio-system
  createNamespace: true
  container:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 100Mi
{% endif %}

