# Cloud NAT egress (natEnabled=true) — how private nodes reach anything
# Google does not host.
#
# The cluster's nodes have no public IPs, and Private Google Access on the
# subnet only covers Google endpoints (Artifact Registry, GCS, the control
# plane). Image pulls from Docker Hub or GHCR, package mirrors, webhooks,
# and third-party APIs all need this gateway. The kind provisions the Cloud
# Router and the NAT together as one node — in this environment the router
# exists solely to host the NAT.
#
# Composing onto a landing zone whose NAT already covers the region? Turn
# natEnabled off: all-subnets coverage picks up the GKE subnet
# automatically, and a second gateway only doubles the hourly cost.
{% if values.natEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpRouterNat
metadata:
  name: "{{ values.cluster_name }}-nat"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  routerName: "{{ values.cluster_name }}-router"
  natName: "{{ values.cluster_name }}-nat"
  # NAT is regional — a second region needs its own gateway beside its own
  # subnet.
  region: "{{ values.region }}"
  vpcSelfLink:
    valueFrom:
      name: "{{ values.network_name }}"
  # Cover every subnet in the region, including ones added later — new
  # subnets get egress without touching the NAT. Explicit (it is the API
  # default) because auto-coverage is a deliberate posture here.
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
  # Port exhaustion and dropped connections are the signals worth paying
  # for; logging every successful translation is noise at Logging prices.
  logFilter: ERRORS_ONLY
{% endif %}
