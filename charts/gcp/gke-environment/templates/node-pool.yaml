# The general-purpose node pool (Standard mode). Kept OUTSIDE the cluster
# resource on purpose: pools have their own lifecycle — you add a Spot
# pool, resize a machine type, or replace a pool wholesale without touching
# the cluster. This one is the workhorse; specialized pools (Spot, GPU,
# high-memory) are added as further GcpGkeNodePool resources beside it.
#
# Autopilot mode renders no pool: GKE provisions nodes itself.
{% if not (values.autopilotEnabled | bool) %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpGkeNodePool
metadata:
  name: "{{ values.cluster_name }}-pool"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  # Both resolve from the CLUSTER's outputs — the name GCP actually
  # assigned and the location as created — so the pool always addresses
  # its parent exactly, and deploys strictly after it.
  clusterName:
    valueFrom:
      name: "{{ values.cluster_name }}"
  location:
    valueFrom:
      name: "{{ values.cluster_name }}"
  nodePoolName: "{{ values.cluster_name }}-pool"
  # Per-zone bounds: a regional cluster in three zones ranges from
  # 3 x min to 3 x max nodes. BALANCED keeps zones evenly filled, which is
  # what keeps a zone outage survivable.
  autoscaling:
    minNodes: {{ values.node_min_nodes }}
    maxNodes: {{ values.node_max_nodes }}
    locationPolicy: BALANCED
  # Surge upgrades: one extra node at a time, zero unavailable — capacity
  # never dips during node upgrades, at the cost of one node-hour per step.
  upgradeSettings:
    maxSurge: 1
    maxUnavailable: 0
  nodeConfig:
    machineType: "{{ values.node_machine_type }}"
    diskSizeGb: 100
    # SSD-class latency at a lower price than pd-ssd — the right default
    # for image pulls and ephemeral workload IO.
    diskType: pd-balanced
    # The dedicated minimal identity from node-identity.yaml — never the
    # default compute account.
    serviceAccount:
      valueFrom:
        name: "{{ values.cluster_name }}-nodes"
    shieldedInstanceConfig:
      # Cryptographically verified boot chain. On unless you load unsigned
      # kernel modules (almost nobody does).
      enableSecureBoot: true
{% endif %}
