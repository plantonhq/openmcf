# The node identity (Standard mode): a dedicated service account for node
# VMs plus exactly the roles nodes need — retiring the default-compute-SA
# anti-pattern where every node in the project shares one over-privileged
# identity that usually carries Editor.
#
# The separation that matters here: these grants are what the NODE needs
# (shipping logs and metrics). What WORKLOADS need is never granted to the
# node account — pods get their own identities through Workload Identity,
# each with its own service account and its own grants (the README shows
# the full recipe).
#
# Autopilot mode renders none of this: GKE owns node identity there.
{% if not (values.autopilotEnabled | bool) %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.cluster_name }}-nodes"
spec:
  serviceAccountId: "{{ values.cluster_name }}-nodes"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.cluster_name }} GKE nodes"
  description: >-
    Node identity for the {{ values.cluster_name }} GKE cluster. Holds only
    node-level roles; workload permissions flow through Workload Identity.

# One additive grant per role, so adding or removing a role never disturbs
# the others. The member resolves from the account's `member` output —
# which also orders every grant after the account exists.
{% for role in values.node_sa_roles %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.cluster_name }}-nodes-{{ role | replace('roles/', '') | replace('.', '-') | replace('/', '-') | lower }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: "{{ role }}"
  member:
    valueFrom:
      name: "{{ values.cluster_name }}-nodes"
{% endfor %}
{% endif %}
