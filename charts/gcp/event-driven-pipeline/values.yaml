params:
  # ─── GCP placement ──────────────────────────────────────────────────────
  - name: gcp_project_id
    description: >
      GCP project that owns the stream — topics, subscriptions, the
      dead-letter queue, and the optional BigQuery sink and Cloud Run
      consumer all land here.
    value: my-gcp-project

  - name: gcp_project_number
    description: >
      The NUMERIC project number of gcp_project_id (find it with
      `gcloud projects describe <project-id> --format='value(projectNumber)'`).
      Pub/Sub performs dead-letter forwarding and BigQuery writes as its
      project-scoped service agent, whose email is built from the project
      NUMBER — the grants that authorize it are assembled from this value.
    value: "123456789012"

  - name: region
    description: >
      Region for the optional Cloud Run consumer. Pub/Sub itself is a
      global service — messages publish and pull from anywhere — so this
      only places the compute that receives push deliveries.
    value: us-central1

  # ─── The stream ──────────────────────────────────────────────────────────
  - name: pipeline_name
    description: >
      Name of the message stream, and the prefix every resource name builds
      on (topic <name>-events, worker subscription, dead-letter queue,
      sink dataset). 1-40 lowercase letters, digits, and hyphens — the
      BigQuery dataset derives from it with hyphens mapped to underscores.
    value: orders

  # ─── Publish-time contract ───────────────────────────────────────────────
  - name: schemaEnabled
    description: >
      Enforce a message schema at publish time: non-conforming messages are
      rejected at the publisher with INVALID_ARGUMENT and never reach a
      subscriber. On by default because contract-first eventing is what
      keeps a growing set of producers and consumers honest — the example
      AVRO definition in the schema resource is the starting point to
      replace with your own record. Note the schema attachment is
      immutable on the topic: decide at creation, not later.
    type: bool
    value: true

  # ─── Dead-letter queue ───────────────────────────────────────────────────
  - name: deadLetterEnabled
    description: >
      Divert messages that repeatedly fail delivery to a dead-letter topic
      instead of retrying them forever (a single poison message can
      otherwise block ordered delivery and burn consumer cycles
      indefinitely). The chart also creates a parking subscription on the
      dead-letter topic — without one, dead-lettered messages are simply
      discarded — and the project-level grants Pub/Sub's service agent
      needs to forward them.
    type: bool
    value: true

  - name: max_delivery_attempts
    description: >
      Failed deliveries (NACKs or ack-deadline expiries) before a message
      dead-letters. Range 5-100. Lower diverts poison messages faster;
      higher tolerates longer transient consumer outages before parking
      messages.
    value: "10"

  # ─── BigQuery analytics sink ─────────────────────────────────────────────
  - name: bigQuerySinkEnabled
    description: >
      Stream every message into a BigQuery table with zero pipeline code: a
      second subscription writes each message as a row (payload plus
      message metadata), giving analysts the full event history in SQL
      minutes after deployment. Adds a dataset, the sink table, the sink
      subscription, and the BigQuery write grant for Pub/Sub's service
      agent.
    type: bool
    value: false

  - name: bigquery_location
    description: >
      Location of the sink dataset — a multi-region ("US", "EU") or a
      region ("us-central1"). Immutable, and every table lives where its
      dataset does; choose where your analytics stack already runs.
    value: US

  # ─── Cloud Run push consumer ─────────────────────────────────────────────
  - name: pushConsumerEnabled
    description: >
      Deploy a Cloud Run consumer that receives messages as HTTP push
      requests — no polling loop to write, scale-to-zero between messages,
      and Pub/Sub's retry/backoff becomes your consumer's retry policy.
      Requests are authenticated: Pub/Sub signs an OIDC token as a
      dedicated push identity that holds run.invoker, and the service
      accepts only authenticated internal traffic.
    type: bool
    value: false

  - name: consumer_image
    description: >
      Container image for the push consumer. The default is Google's
      public hello image so the arm deploys before your consumer exists —
      it accepts the push POSTs and returns 200 (acking every message), so
      replace it with your real handler before relying on the stream.
    value: us-docker.pkg.dev/cloudrun/container/hello
