# The pull-consumption path: the identity your worker runs as, its
# permission to pull, and the subscription it drains. Pull is the default
# consumption model — the worker controls its own pace, and a burst of
# messages becomes backlog instead of load.
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.pipeline_name }}-worker"
spec:
  serviceAccountId: "{{ values.pipeline_name }}-worker"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.pipeline_name }} stream worker"
  description: >-
    Identity the {{ values.pipeline_name }} pull consumer runs as. Holds
    subscriber only; no user-managed key.

---
# Additive subscriber grant for the worker identity. Project-scoped —
# inside a single-purpose project this bounds cleanly; the member
# references the account's output, which also orders the grant after it.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.pipeline_name }}-worker-subscriber"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/pubsub.subscriber
  member:
    valueFrom:
      name: "{{ values.pipeline_name }}-worker"

---
# The worker's subscription. Exponential backoff between retries keeps a
# failing consumer from being hot-looped; the dead-letter policy (when the
# arm is on) is where messages go when retrying stops making sense.
apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSubscription
metadata:
  name: "{{ values.pipeline_name }}-worker"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  subscriptionName: "{{ values.pipeline_name }}-worker"
  topic:
    valueFrom:
      name: "{{ values.pipeline_name }}-events"
  ackDeadlineSeconds: 60
  retryPolicy:
    minimumBackoff: "10s"
    maximumBackoff: "600s"
  # Consumers going quiet must never silently delete the stream's
  # subscription (the default is 31 days of inactivity).
  expirationPolicy:
    ttl: ""
{% if values.deadLetterEnabled | bool %}
  deadLetterPolicy:
    deadLetterTopic:
      valueFrom:
        name: "{{ values.pipeline_name }}-dlq"
    maxDeliveryAttempts: {{ values.max_delivery_attempts }}
{% endif %}
