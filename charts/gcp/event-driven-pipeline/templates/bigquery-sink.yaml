# The analytics sink (bigQuerySinkEnabled=true): every message lands as a
# BigQuery row with zero pipeline code — Pub/Sub streams directly into the
# table. The table's shape is the standard Pub/Sub sink contract: the
# message payload in `data`, plus the metadata columns write_metadata
# populates. Deliberately NOT coupled to the topic schema: the sink keeps
# working when you evolve the schema, and the JSON payload stays queryable
# with BigQuery's JSON functions.
{% if values.bigQuerySinkEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpBigQueryDataset
metadata:
  name: "{{ values.pipeline_name }}-analytics"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  # BigQuery identifiers take underscores, not hyphens — derived from the
  # stream name mechanically.
  datasetId: "{{ values.pipeline_name | replace('-', '_') }}_analytics"
  location: "{{ values.bigquery_location }}"

---
apiVersion: gcp.planton.dev/v1
kind: GcpBigQueryTable
metadata:
  name: "{{ values.pipeline_name }}-events-raw"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  datasetId:
    valueFrom:
      name: "{{ values.pipeline_name }}-analytics"
  tableId: events_raw
  description: Raw {{ values.pipeline_name }} stream — one row per message, payload in `data`
  # The Pub/Sub sink contract: `data` carries the payload; the rest are
  # the metadata columns write_metadata fills. Day partitions on publish
  # time keep full-history queries billable by the day they touch.
  schema: '[{"name":"subscription_name","type":"STRING"},{"name":"message_id","type":"STRING"},{"name":"publish_time","type":"TIMESTAMP","mode":"REQUIRED"},{"name":"data","type":"STRING"},{"name":"attributes","type":"STRING"},{"name":"ordering_key","type":"STRING"}]'
  timePartitioning:
    type: DAY
    field: publish_time
  # The stream is the source of truth; the sink is derived and rebuildable,
  # so it does not hold environment teardown hostage.
  deletionProtection: false

---
# BigQuery writes are performed by the same Pub/Sub service agent the
# dead-letter path uses; dataEditor is the write permission. Project-scoped
# for the same reason as the dead-letter grants.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.pipeline_name }}-sink-agent-dataeditor"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/bigquery.dataEditor
  member:
    value: "serviceAccount:service-{{ values.gcp_project_number }}@gcp-sa-pubsub.iam.gserviceaccount.com"

---
# The sink subscription — a second, independent consumer of the same
# topic: analytics never competes with the worker for messages. The table
# reference (the table's qualified_name output) also orders the sink after
# the table exists; the grant above has no output the subscription
# consumes, so Pub/Sub validates the permission at create time instead.
apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSubscription
metadata:
  name: "{{ values.pipeline_name }}-bigquery-sink"
  # The write permission must be effective before Pub/Sub accepts the
  # subscription — the explicit edge orders it after the grant.
  relationships:
    - kind: GcpProjectIamMember
      name: "{{ values.pipeline_name }}-sink-agent-dataeditor"
      type: depends_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  subscriptionName: "{{ values.pipeline_name }}-bigquery-sink"
  topic:
    valueFrom:
      name: "{{ values.pipeline_name }}-events"
  bigqueryConfig:
    table:
      valueFrom:
        name: "{{ values.pipeline_name }}-events-raw"
    # Payload to `data`, metadata to the standard columns — schema-agnostic
    # by design (see the table comment).
    writeMetadata: true
  expirationPolicy:
    ttl: ""
{% endif %}
