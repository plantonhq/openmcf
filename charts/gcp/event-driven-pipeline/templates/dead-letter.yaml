# The dead-letter path (deadLetterEnabled=true). Three concerns:
#
#   1. The dead-letter topic — where poison messages divert after
#      max_delivery_attempts failures.
#   2. A parking subscription ON that topic. Easy to forget and fatal to
#      omit: a topic with no subscription discards its messages, so a DLQ
#      without one silently loses exactly the messages you diverted to
#      keep. The parking subscription retains them for inspection and
#      replay.
#   3. The forwarding permissions. Dead-lettering is performed by PUB/SUB
#      ITSELF as the project's Pub/Sub service agent
#      (service-<number>@gcp-sa-pubsub.iam.gserviceaccount.com) — it needs
#      publisher (to write to the DLQ) and subscriber (to ack from the
#      source). The member is assembled from the project number because
#      the agent is Google-created and no resource outputs it. Grants are
#      project-scoped: no kind models topic- or subscription-scoped IAM,
#      and inside a single-purpose project the scope bounds cleanly.
{% if values.deadLetterEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpPubSubTopic
metadata:
  name: "{{ values.pipeline_name }}-dlq"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  # No schema on the DLQ — it must accept whatever failed, including
  # messages that predate a schema revision.
  topicName: "{{ values.pipeline_name }}-dlq"

---
apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSubscription
metadata:
  name: "{{ values.pipeline_name }}-dlq-parking"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  subscriptionName: "{{ values.pipeline_name }}-dlq-parking"
  topic:
    valueFrom:
      name: "{{ values.pipeline_name }}-dlq"
  # Park for the maximum window — dead letters are kept precisely so a
  # human (or a replay job) gets to them on their own schedule.
  messageRetentionDuration: "604800s"
  ackDeadlineSeconds: 60
  expirationPolicy:
    ttl: ""

---
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.pipeline_name }}-dlq-agent-publisher"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/pubsub.publisher
  member:
    value: "serviceAccount:service-{{ values.gcp_project_number }}@gcp-sa-pubsub.iam.gserviceaccount.com"

---
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.pipeline_name }}-dlq-agent-subscriber"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/pubsub.subscriber
  member:
    value: "serviceAccount:service-{{ values.gcp_project_number }}@gcp-sa-pubsub.iam.gserviceaccount.com"
{% endif %}
