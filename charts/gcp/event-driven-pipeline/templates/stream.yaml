# The stream's contract and channel: the schema that gates what may be
# published, and the topic every producer targets.
{% if values.schemaEnabled | bool %}
---
# The message contract. Publish-time validation only works if the contract
# is a first-class resource producers and consumers can both reference —
# this example AVRO record is the starting point; replace its fields with
# your event's real shape. Schema evolution happens as in-place revisions
# on this resource (Pub/Sub keeps up to 20).
apiVersion: gcp.planton.dev/v1
kind: GcpPubSubSchema
metadata:
  name: "{{ values.pipeline_name }}-schema"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  schemaName: "{{ values.pipeline_name }}-schema"
  # AVRO is the best default: human-readable, self-describing, and the
  # format Pub/Sub's BigQuery and Cloud Storage integrations understand
  # natively.
  type: AVRO
  definition: |
    {
      "type": "record",
      "name": "Event",
      "namespace": "com.example.{{ values.pipeline_name | replace('-', '_') }}",
      "fields": [
        {"name": "event_id", "type": "string"},
        {"name": "event_type", "type": "string"},
        {"name": "subject_id", "type": "string"},
        {"name": "occurred_at", "type": {"type": "long", "logicalType": "timestamp-millis"}},
        {"name": "payload", "type": "string"}
      ]
    }
{% endif %}

---
# The channel. One topic per event stream; consumers fan out as
# subscriptions beside it rather than as extra topics.
apiVersion: gcp.planton.dev/v1
kind: GcpPubSubTopic
metadata:
  name: "{{ values.pipeline_name }}-events"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  topicName: "{{ values.pipeline_name }}-events"
{% if values.schemaEnabled | bool %}
  # Publish-time enforcement: messages that do not conform are rejected at
  # the publisher with INVALID_ARGUMENT — they never reach a subscriber.
  # The attachment is immutable; JSON encoding keeps payloads greppable in
  # logs and the BigQuery sink.
  schemaSettings:
    schema:
      valueFrom:
        name: "{{ values.pipeline_name }}-schema"
    encoding: JSON
{% endif %}
