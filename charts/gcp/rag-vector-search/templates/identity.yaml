# The query identity — the account the RAG application queries the index
# as (and, with JWT auth on, the only issuer whose tokens the private
# endpoint accepts). A dedicated account keeps the retrieval layer's
# access auditable and revocable on its own.
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.corpus_name }}-query"
spec:
  serviceAccountId: "{{ values.corpus_name }}-query"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.corpus_name }} query identity"
  description: >-
    Identity the {{ values.corpus_name }} RAG application queries Vector
    Search as. Holds aiplatform.user only; no user-managed key.

---
# aiplatform.user covers querying deployed indexes and streaming upserts
# — the two calls a RAG application makes. Additive and project-scoped;
# the member reference orders the grant after the account exists.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.corpus_name }}-query-aiplatform"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/aiplatform.user
  member:
    valueFrom:
      name: "{{ values.corpus_name }}-query"
