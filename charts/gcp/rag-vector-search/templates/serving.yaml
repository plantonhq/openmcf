# The serving side: the endpoint (the network surface queries arrive on)
# and the deployed index (the placement that gives the stored vectors
# serving compute). Vertex holds connectivity immutable on the endpoint —
# public vs private is a create-time decision, which is exactly why it is
# this chart's one structural toggle.
---
apiVersion: gcp.planton.dev/v1
kind: GcpVertexAiIndexEndpoint
metadata:
  name: "{{ values.corpus_name }}-endpoint"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  location: "{{ values.region }}"
  displayName: "{{ values.corpus_name }}"
{% if values.privateEndpointEnabled | bool %}
  # VPC-peered serving: queries ride the network's private services
  # peering (gRPC on private IPs) and the endpoint is unreachable from
  # outside. The referenced network must already carry private services
  # access — a landing-zone concern this chart deliberately never
  # creates (GCP allows exactly one peering per network). The modules
  # normalize the network self-link to the relative form Vertex expects.
  network:
    valueFrom:
      name: "{{ values.network_resource_name }}"
{% else %}
  # Public serving: a Google-managed HTTPS domain, IAM-authenticated.
  # The right default because it needs no network prerequisites — and
  # because the choice is immutable, moving to private later means
  # recreating the endpoint and redeploying the index.
  publicEndpointEnabled: true
{% endif %}

---
# The deployed index — the placement of the index onto the endpoint,
# with its own serving compute. This is where replica sizing lives;
# only the replica bounds update in place, everything else replaces the
# deployment.
apiVersion: gcp.planton.dev/v1
kind: GcpVertexAiDeployedIndex
metadata:
  name: "{{ values.corpus_name }}-serving"
spec:
  location: "{{ values.region }}"
  # Vertex forbids hyphens in deployed-index IDs — derived from the
  # corpus name mechanically. GCP holds a deployment's ID project-wide
  # until it fully undeploys, so the ID is stable by design here.
  deployedIndexId: "{{ values.corpus_name | replace('-', '_') }}"
  # Both references resolve to full resource-path outputs and order the
  # deployment after the index and the endpoint.
  index:
    valueFrom:
      name: "{{ values.corpus_name }}-index"
  indexEndpoint:
    valueFrom:
      name: "{{ values.corpus_name }}-endpoint"
  displayName: "{{ values.corpus_name }}"
  # Automatic sizing: Vertex picks the machine shape and scales replicas
  # between the bounds on query load. min is the latency floor and the
  # always-on cost; max is the cost ceiling.
  automaticResources:
    minReplicaCount: {{ values.min_replicas }}
    maxReplicaCount: {{ values.max_replicas }}
{% if values.privateEndpointEnabled | bool and values.reserved_range_name %}
  # Pin serving IPs into a specific reserved peering range (referenced by
  # its GcpGlobalAddress name — the same name the foundation registered
  # on the service-networking connection). Only ranges registered on the
  # peering are usable, which is why this references the foundation's
  # range instead of creating a new one. Omitted when empty: Vertex then
  # allocates from any peered range.
  reservedIpRanges:
    - valueFrom:
        name: "{{ values.reserved_range_name }}"
{% endif %}
{% if values.privateEndpointEnabled | bool and values.jwtAuthEnabled | bool %}
  # JWT auth on top of network reachability: only callers presenting a
  # token issued by the query identity (identity.yaml), with the audience
  # below, can query. The issuer reference resolves to the account's
  # email output.
  authConfig:
    allowedIssuers:
      - valueFrom:
          name: "{{ values.corpus_name }}-query"
    audiences:
      - "{{ values.corpus_name }}"
{% endif %}
