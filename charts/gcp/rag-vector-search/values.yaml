params:
  # ─── GCP placement ──────────────────────────────────────────────────────
  - name: gcp_project_id
    description: >
      GCP project that owns the index, the serving endpoint, the
      embeddings bucket, and the query identity.
    value: my-gcp-project

  - name: region
    description: >
      Vertex AI region for the index and its serving endpoint (they must
      match). Choose where the application that queries them runs —
      nearest-neighbor lookups are latency-sensitive.
    value: us-central1

  # ─── The corpus ──────────────────────────────────────────────────────────
  - name: corpus_name
    description: >
      Name of the vector corpus, and the prefix every resource name
      builds on. Lowercase letters, digits, and hyphens — the deployed
      index ID derives from it with hyphens mapped to underscores
      (Vertex forbids hyphens there).
    value: rag-corpus

  - name: embeddings_bucket_name
    description: >
      Globally unique name for the embeddings bucket (GCS bucket names
      are a global namespace). It holds batch-format embedding files —
      the initial backfill for a new index and the corpus of record your
      pipeline can rebuild from.
    value: my-rag-embeddings

  - name: dimensions
    description: >
      The embedding vector size — set it to your embedding model's
      output exactly (1536 fits common text encoders; 768 for many
      sentence-transformer and Gecko-class models). Immutable: changing
      models with a different size means a new index and a re-embed.
    value: "1536"

  - name: approximate_neighbors_count
    description: >
      Candidates fetched by approximate (tree-AH) search before exact
      reordering. Higher improves recall at some latency cost; 150 is a
      solid RAG default for top-10 retrievals.
    value: "150"

  # ─── Serving capacity ────────────────────────────────────────────────────
  - name: min_replicas
    description: >
      Minimum serving replicas — the guaranteed floor query latency
      stands on, and the always-on cost of the deployment. Production
      workloads that cannot tolerate a cold replica set this to 2.
    value: "1"

  - name: max_replicas
    description: >
      Maximum serving replicas the autoscaler may add under query load —
      the cost ceiling.
    value: "2"

  # ─── Private serving ─────────────────────────────────────────────────────
  - name: privateEndpointEnabled
    description: >
      Serve queries over your VPC's private services peering instead of
      the public endpoint: the index becomes reachable only inside the
      network (gRPC on private IPs), the posture for regulated data and
      internal-only RAG. Requires the network below to already carry
      private services access — the reserved range + peering a
      landing-zone chart such as project-foundation deploys. The
      connectivity choice is immutable on the endpoint: flipping this
      later recreates the endpoint and its deployment.
    type: bool
    value: false

  - name: network_resource_name
    description: >
      Planton resource name of the EXISTING GcpVpcNetwork to peer the
      private endpoint into (private arm only) — typically the network a
      landing-zone chart deployed, which must already carry private
      services access. This chart deliberately does not create the
      peering: GCP allows exactly one per network.
    value: app-network

  - name: reserved_range_name
    description: >
      Optional (private arm only): Planton resource name of an EXISTING
      GcpGlobalAddress — one of the reserved VPC-peering ranges already
      registered on the network's service-networking connection — to pin
      the deployed index's serving IPs into. Leave empty to let Vertex
      allocate from any peered range (the safe default). A range that is
      NOT registered on the peering cannot be used, which is why this
      chart references the foundation's range instead of creating one.
    value: ""

  - name: jwtAuthEnabled
    description: >
      Require signed JWTs on private queries (private arm only): only
      callers presenting a token issued by this chart's query service
      account, with the expected audience, can query the index —
      authentication on top of network reachability. Immutable on the
      deployment.
    type: bool
    value: false
