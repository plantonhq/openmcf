# The dedicated state-access identity (serviceAccountEnabled=true).
#
# A single-purpose service account whose only power is object access on the
# state bucket (granted bucket-side in state-bucket.yaml). CI/CD systems and
# the Planton runner authenticate as THIS identity for state operations, so
# state access stays independently auditable and revocable — pulling one
# identity never disturbs anything else.
{% if values.serviceAccountEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.service_account_id }}"
spec:
  serviceAccountId: "{{ values.service_account_id }}"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "Terraform state access ({{ values.bucket_name }})"
  description: >-
    Reads and writes Terraform/OpenTofu state objects in the
    {{ values.bucket_name }} GCS bucket. Deliberately holds no project-level
    roles — its only access is the bucket-scoped object grant.
{% if values.serviceAccountKeyEnabled | bool %}
  # Exports a JSON key in this resource's stack outputs (key_base64) for
  # callers that cannot authenticate keylessly — e.g. a Planton StateBackend
  # registered with inline auth. The key is a long-lived credential: prefer
  # keyless (Workload Identity Federation, or runner-ambient credentials)
  # wherever the caller supports it, and rotate this key if it ever leaks.
  createKey: true
{% endif %}
{% endif %}
