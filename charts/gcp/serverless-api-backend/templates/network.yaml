---
apiVersion: gcp.planton.dev/v1
kind: GcpVpcNetwork
metadata:
  name: "{{ values.vpc_name }}"
  group: network
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  networkName: "{{ values.vpc_name }}"
  autoCreateSubnetworks: false
  routingMode: REGIONAL
  description: Serverless API backend VPC with composed private services access
---
apiVersion: gcp.planton.dev/v1
kind: GcpGlobalAddress
metadata:
  name: "{{ values.vpc_name }}-psa-range"
  group: network
  relationships:
    - kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      type: runs_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  addressName: "{{ values.vpc_name }}-psa-range"
  addressType: INTERNAL
  purpose: VPC_PEERING
  prefixLength: 16
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      fieldPath: status.outputs.network_self_link
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceNetworkingConnection
metadata:
  name: "{{ values.vpc_name }}-psa"
  group: network
  relationships:
    - kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      type: runs_on
    - kind: GcpGlobalAddress
      name: "{{ values.vpc_name }}-psa-range"
      type: runs_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      fieldPath: status.outputs.network_self_link
  reservedPeeringRanges:
    - valueFrom:
        kind: GcpGlobalAddress
        name: "{{ values.vpc_name }}-psa-range"
        fieldPath: status.outputs.name
---
apiVersion: gcp.planton.dev/v1
kind: GcpSubnetwork
metadata:
  name: "{{ values.vpc_name }}-subnet"
  group: network
  relationships:
    - kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      type: runs_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      fieldPath: status.outputs.network_self_link
  subnetworkName: "{{ values.vpc_name }}-subnet"
  region: "{{ values.region }}"
  ipCidrRange: "{{ values.subnet_cidr }}"
  privateIpGoogleAccess: true
---
apiVersion: gcp.planton.dev/v1
kind: GcpRouterNat
metadata:
  name: "{{ values.vpc_name }}-router-nat"
  group: network
  relationships:
    - kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      type: runs_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  routerName: "{{ values.vpc_name }}-router"
  natName: "{{ values.vpc_name }}-nat"
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: "{{ values.vpc_name }}"
      fieldPath: status.outputs.network_self_link
  region: "{{ values.region }}"
