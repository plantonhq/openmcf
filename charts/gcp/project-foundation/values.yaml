params:
  # ─── Project placement ───────────────────────────────────────────────────
  - name: gcp_project_id
    description: >
      The GCP project the foundation lands in. With createProject false (the
      default) this must be an EXISTING project ID; with createProject true
      the chart creates the project under this ID. Project IDs are globally
      unique across all of GCP, immutable, and reserved for up to 30 days
      after deletion — choose an org-scoped convention such as
      <org>-<team>-<env>.
    value: my-gcp-project

  - name: createProject
    description: >
      Also create the GCP project itself — the full "project vending machine"
      mode for organizations that stamp out a project per team or per
      environment. Requires parent_id (the numeric organization or folder ID)
      and billing_account_id, and the deploying identity needs
      roles/resourcemanager.projectCreator on the parent plus
      roles/billing.user on the billing account. Leave false to build the
      foundation inside a project that already exists.
    type: bool
    value: false

  - name: parent_type
    description: >
      Where in the resource hierarchy the new project is created (only used
      with createProject) — directly under the organization, or inside a
      folder. Folders are how larger organizations delegate: a team's folder
      carries its own IAM and org policies, and projects created inside it
      inherit them.
    type: string_enum
    enumValues:
      - organization
      - folder
    value: organization

  - name: parent_id
    description: >
      Numeric ID of the organization or folder the new project is created
      under (only used with createProject; must match parent_type). Find it
      with `gcloud organizations list` or `gcloud resource-manager folders
      list --organization=<org-id>`. Leave empty to create a standalone
      project with no parent — only possible for accounts outside an
      organization.
    value: "123456789012"

  - name: billing_account_id
    description: >
      Billing account linked to the new project, in the form
      XXXXXX-XXXXXX-XXXXXX (only used with createProject). Without billing,
      the project cannot enable billable services — which includes everything
      this chart deploys — so leave it empty only for deliberately unbilled
      shell projects. Find yours with `gcloud billing accounts list`.
    value: 012345-6789AB-CDEF01

  # ─── Network layout ──────────────────────────────────────────────────────
  - name: region
    description: >
      Region for the regional pieces of the foundation: the workload subnet
      and the Cloud NAT gateway. Choose where your workloads will actually
      run — subnets are regional in GCP, and this chart deliberately starts
      with one well-sized subnet in one region (add more GcpSubnetwork
      resources as you expand rather than pre-creating empty regions).
    value: us-central1

  - name: network_name
    description: >
      Name of the VPC network, and the prefix every derived resource name
      builds on (subnet, router, NAT, firewall rules, PSA range). 1-63
      lowercase letters, digits, and hyphens. Immutable.
    value: app-network

  - name: subnet_ip_cidr_range
    description: >
      Primary IPv4 range of the workload subnet (e.g. 10.10.0.0/20). GCP can
      EXPAND a subnet range in place later but never shrink it, so start with
      room to grow — a /20 (~4k addresses) is a comfortable team-sized
      default. Must not overlap other ranges in the VPC or any network you
      plan to peer with.
    value: 10.10.0.0/20

  - name: flowLogsEnabled
    description: >
      Record VPC Flow Logs on the workload subnet — sampled connection
      records delivered to Cloud Logging, the raw material for network
      forensics, anomaly detection, and traffic-cost analysis. On by default
      because an empty foundation logs almost nothing (cost follows traffic);
      as workloads grow, tune sampling down in the subnet resource rather
      than flying blind. Turn off only for throwaway environments.
    type: bool
    value: true

  # ─── Baseline firewall posture ───────────────────────────────────────────
  - name: iapSshEnabled
    description: >
      Allow SSH (tcp/22) into instances — but ONLY from Google's
      Identity-Aware Proxy range (35.235.240.0/20), never from the open
      internet. This is the audited access path: engineers run
      `gcloud compute ssh --tunnel-through-iap`, IAP checks their IAM
      identity, and instances need no public IPs at all. Turn off only if
      instances should be unreachable even through IAP.
    type: bool
    value: true

  # ─── Private services access (PSA) ───────────────────────────────────────
  - name: privateServicesAccessEnabled
    description: >
      Reserve an internal range and peer the VPC with Google's service
      producer network — the prerequisite for Cloud SQL, AlloyDB,
      Memorystore, and Filestore to hand out PRIVATE IPs inside this VPC.
      Reserving the range costs nothing, and retrofitting PSA later means
      re-planning address space around ranges already in use — so the
      foundation includes it by default. Turn off only if this VPC will
      never host private managed services.
    type: bool
    value: true

  - name: psa_prefix_length
    description: >
      Size of the reserved PSA range as a prefix length (16 reserves a /16,
      ~65k addresses). Google's producers carve a subnet out of this range
      for EVERY managed-service instance, and fragmented leftover space is
      unusable to them — so reserve generously up front. A /16 is the
      recommended default; go smaller only in address-constrained VPCs.
    value: "16"

  # ─── Private DNS ─────────────────────────────────────────────────────────
  - name: privateDnsEnabled
    description: >
      Create a private Cloud DNS zone visible only inside this VPC — the
      clean home for internal service names (db.internal.example.com) that
      should never leak to public DNS. Off by default because the right
      domain is an organizational decision; turn on and set
      private_dns_domain when you have one.
    type: bool
    value: false

  - name: private_dns_domain
    description: >
      Authoritative domain for the private zone (only used with
      privateDnsEnabled). Must be fully qualified WITH a trailing dot, e.g.
      "internal.example.com.". Use a subdomain of a domain you own — inventing
      a TLD you do not own invites collisions with the public namespace.
    value: internal.example.com.
