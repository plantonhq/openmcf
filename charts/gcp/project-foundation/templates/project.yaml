# The project itself (createProject=true) — the vending-machine arm.
#
# A GCP project is the Layer-0 container: the IAM boundary, the billing
# boundary, and the quota boundary all at once. Organizations that stamp out
# a project per team or per environment get isolation for free — a mistake,
# a leaked credential, or a runaway bill in one project cannot touch
# another. When this arm is on, every other resource in the chart references
# THIS project instead of a pre-existing one, so the whole foundation lands
# inside the project it just created.
{% if values.createProject | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpProject
metadata:
  name: "{{ values.gcp_project_id }}"
spec:
  projectId: "{{ values.gcp_project_id }}"
{% if values.parent_id %}
  # Attach the project to the resource hierarchy so it inherits the parent's
  # IAM and org policies. Omitting parent_id creates a standalone project —
  # only possible for accounts outside an organization.
  parentType: {{ values.parent_type }}
  parentId: "{{ values.parent_id }}"
{% endif %}
{% if values.billing_account_id %}
  # Without billing the project cannot enable billable services — which
  # includes Compute, so everything else in this chart needs it.
  billingAccountId: "{{ values.billing_account_id }}"
{% endif %}
  # Never auto-create GCP's "default" network: deleting it is a standard
  # hardening step, and this chart builds the real network as an explicit,
  # composable resource two documents down. Made explicit because for a
  # foundation it is a deliberate posture, not an inherited default.
  autoCreateNetwork: false
  # deletion_policy stays at its default (DELETE): destroying the foundation
  # shuts the project down with GCP's 30-day restore window as the safety
  # net. For a long-lived shared foundation, switch to PREVENT so a destroy
  # fails instead — the project then outlives the chart deliberately.
{% endif %}
