# Private DNS (privateDnsEnabled=true).
#
# A Cloud DNS zone visible ONLY to this VPC — the clean home for internal
# service names (db.internal.example.com) that must never leak into public
# DNS. Records are deliberately not created here: they belong to the
# workloads that own them, as GcpDnsRecord resources referencing this zone
# by name, so the foundation owns the namespace and each service owns its
# entry.
{% if values.privateDnsEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpDnsZone
metadata:
  name: "{{ values.network_name }}-private-dns"
spec:
{% if values.createProject | bool %}
  projectId:
    valueFrom:
      name: "{{ values.gcp_project_id }}"
{% else %}
  projectId:
    value: "{{ values.gcp_project_id }}"
{% endif %}
  dnsName: "{{ values.private_dns_domain }}"
  visibility: private
  # Bound to this chart's VPC only. Other networks that need these names
  # later attach via additional entries here, or via a DNS peering zone in
  # THEIR network targeting this VPC.
  privateVisibilityConfig:
    networks:
      - networkUrl:
          valueFrom:
            name: "{{ values.network_name }}"
  description: Private zone for internal service names in {{ values.network_name }}
{% endif %}
