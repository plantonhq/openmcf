# The network layer: a custom-mode VPC and one right-sized regional subnet.
#
# Custom mode (never auto mode) is the only honest starting point for a
# foundation: YOU own the address plan, so subnets appear where workloads
# need them with ranges that never collide with peers, on-prem routes, or
# the PSA reservation below. The chart starts with exactly one workload
# subnet in one region — grow by adding GcpSubnetwork resources, not by
# pre-creating empty regions.
---
apiVersion: gcp.planton.dev/v1
kind: GcpVpcNetwork
metadata:
  name: "{{ values.network_name }}"
spec:
  # Every resource in this chart pins its project explicitly: with
  # createProject on it references the project created in project.yaml
  # (ordering the deploy after the project exists); otherwise it lands in
  # the existing project named by gcp_project_id.
{% if values.createProject | bool %}
  projectId:
    valueFrom:
      name: "{{ values.gcp_project_id }}"
{% else %}
  projectId:
    value: "{{ values.gcp_project_id }}"
{% endif %}
  networkName: "{{ values.network_name }}"
  # false = custom subnet mode. Auto mode would scatter a /20 into every
  # region GCP operates in — address space you did not plan, in regions you
  # do not use, that you cannot reclaim without deleting subnets.
  autoCreateSubnetworks: false
  # routing_mode stays REGIONAL (the default): Cloud Routers advertise
  # routes only within their region, which is the right scope for a
  # single-region foundation. Switch to GLOBAL when workloads in one region
  # must reach VPN/Interconnect attachments in another.

---
# The workload subnet — the address space instances actually live in.
apiVersion: gcp.planton.dev/v1
kind: GcpSubnetwork
metadata:
  name: "{{ values.network_name }}-{{ values.region }}"
spec:
{% if values.createProject | bool %}
  projectId:
    valueFrom:
      name: "{{ values.gcp_project_id }}"
{% else %}
  projectId:
    value: "{{ values.gcp_project_id }}"
{% endif %}
  vpcSelfLink:
    valueFrom:
      name: "{{ values.network_name }}"
  # Named <network>-<region> because subnets are regional: when you expand
  # to a second region, the convention already has a slot for it.
  subnetworkName: "{{ values.network_name }}-{{ values.region }}"
  region: "{{ values.region }}"
  # Expandable in place, never shrinkable — the parameter description says
  # why this defaults to a /20.
  ipCidrRange: "{{ values.subnet_ip_cidr_range }}"
  # Instances in this foundation have no external IPs (egress goes through
  # Cloud NAT), so without this they could not reach Artifact Registry, GCS,
  # or any Google API. Effectively mandatory for private-only subnets.
  privateIpGoogleAccess: true
{% if values.flowLogsEnabled | bool %}
  # Presence of log_config is what enables VPC Flow Logs; every field
  # inside carries GCP's defaults (5-second aggregation, 50% sampling, all
  # metadata). An empty block is therefore "on, with sane defaults" — tune
  # sampling here when traffic volume makes full-fidelity logging expensive.
  logConfig: {}
{% endif %}
