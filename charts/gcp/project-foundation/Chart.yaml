apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: GCP Project Foundation
spec:
  selector:
    kind: platform
  description: The landing zone every GCP workload should start on — a custom-mode VPC with a right-sized regional subnet, Cloud NAT egress for instances that never get public IPs, a baseline firewall posture (internal traffic + IAP-tunneled SSH), and the private-services-access peering that Cloud SQL, AlloyDB, and Memorystore private IP require. Optionally creates the project itself and a private DNS zone, so one deploy vends a complete, workload-ready foundation.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/gcp/gcpproject/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/gcp/project-foundation
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/gcp/project-foundation/README.md
