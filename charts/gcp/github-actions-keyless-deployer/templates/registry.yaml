# The image registry (registryEnabled=true): an Artifact Registry Docker
# repository with push access for the same identity the deploy grants use —
# the GitHub principal directly, or the deployer service account when the
# impersonation arm is on.
#
# Push access rides the repository itself as an additive iam_members grant —
# scoped to THIS repository, not the project, so CI can publish images
# without holding writer on any other repository that later shares the
# project.
{% if values.registryEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpArtifactRegistryRepo
metadata:
  name: "{{ values.registry_repository_id }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  location: "{{ values.registry_location }}"
  repositoryId: "{{ values.registry_repository_id }}"
  format: DOCKER
  description: >-
    Container images pushed by GitHub Actions workflows in
    {{ values.github_org }}.
  iamMembers:
    # roles/artifactregistry.writer = push and pull on this repository
    # only. Runtime identities that PULL these images (a Cloud Run service
    # agent, GKE nodes) get their own reader grants where those workloads
    # are defined — the deployer chart grants only what the deployer needs.
    - role: roles/artifactregistry.writer
      member:
{% if values.impersonationEnabled | bool %}
        valueFrom:
          name: "{{ values.deployer_service_account_id }}"
{% else %}
        value: "principalSet://iam.googleapis.com/projects/{{ values.gcp_project_number }}/locations/global/workloadIdentityPools/{{ values.pool_id }}/{% if values.github_repo %}attribute.repository/{{ values.github_org }}/{{ values.github_repo }}{% else %}attribute.repository_owner/{{ values.github_org }}{% endif %}"
{% endif %}
{% endif %}
