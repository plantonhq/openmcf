# The deployer identity (impersonationEnabled=true): a dedicated service
# account plus the single grant that lets the GitHub principal impersonate
# it.
#
# With this arm on, the deploy roles in deploy-grants.yaml bind to THIS
# account instead of the federated principal, and the workflow adds
# `service_account:` to its auth step. The workflow's effective permissions
# are whatever the account holds — useful when a real service-account
# identity is required (signed URLs / signBlob, domain-wide delegation,
# tools that only accept a service-account email, or an org policy that
# forbids granting roles to federated principals). When none of those
# apply, prefer the default direct-federation posture: one less credential
# hop and no impersonation surface to audit.
{% if values.impersonationEnabled | bool %}
---
# The account exists to BE impersonated — it deliberately holds nothing by
# itself here; its power arrives via the deploy grants that bind to it.
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.deployer_service_account_id }}"
spec:
  serviceAccountId: "{{ values.deployer_service_account_id }}"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "GitHub Actions deployer ({{ values.github_org }})"
  description: >-
    Deployer identity impersonated by {{ values.github_org }} GitHub Actions
    workflows via Workload Identity Federation. Holds the deploy roles;
    the federated principal may only impersonate it. No user-managed key.

---
# The impersonation hop, granted ON the account (never project-wide: a
# project-level workloadIdentityUser grant would let GitHub impersonate
# EVERY service account in the project). The member is the same federated
# principal the direct posture would grant roles to — assembled from
# parameters because IAM principals for federated identities are built
# from the project number and pool ID rather than output by any resource.
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccountIamMember
metadata:
  name: "{{ values.deployer_service_account_id }}-impersonation"
spec:
  serviceAccountId:
    valueFrom:
      name: "{{ values.deployer_service_account_id }}"
  role:
    value: roles/iam.workloadIdentityUser
  member:
    value: "principalSet://iam.googleapis.com/projects/{{ values.gcp_project_number }}/locations/global/workloadIdentityPools/{{ values.pool_id }}/{% if values.github_repo %}attribute.repository/{{ values.github_org }}/{{ values.github_repo }}{% else %}attribute.repository_owner/{{ values.github_org }}{% endif %}"
{% endif %}
