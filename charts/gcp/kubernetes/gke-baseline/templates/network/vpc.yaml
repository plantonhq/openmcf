# The VPC and the cluster subnetwork. The chart owns its network
# deliberately: "a production GKE cluster in one apply" only holds if
# nothing has to exist first — and the GKE cluster spec REQUIRES an explicit
# network and subnetwork (clusters on the legacy auto-created "default"
# network do not compose into reviewable infrastructure).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcNetwork
metadata:
  name: "{{ values.env }}-gke-vpc"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  networkName: "{{ values.env }}-gke-vpc"
  # Custom subnet mode (the field default, spelled out because it is
  # load-bearing): the chart plans its own address space below instead of
  # letting GCP scatter auto-subnets across every region.
  autoCreateSubnetworks: false
---
# ONE regional subnetwork carries the whole cluster. GCP subnets are
# regional (all three zones of the regional cluster share it), and GKE's
# VPC-native networking draws THREE ranges from it: nodes from the primary
# range, pods and services from the two NAMED secondary ranges below. Naming
# the ranges here — instead of letting GKE create unnamed ones — is what
# keeps the address plan reviewable and referencable.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: "{{ values.env }}-gke-subnet"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  vpcSelfLink:
    valueFrom:
      # The in-chart VPC above — resolves its self link and orders the VPC
      # before the subnetwork in the deploy graph.
      name: "{{ values.env }}-gke-vpc"
  subnetworkName: "{{ values.env }}-gke-subnet"
  region: "{{ values.region }}"
  ipCidrRange: "{{ values.subnet_cidr }}"
  # The pod and service ranges the cluster selects BY NAME
  # (cluster/gke-cluster.yaml). The names are render-known on both sides
  # from this same template's values — which is exactly how a
  # repeated-output composition key is wired when the chart defines both
  # ends. Both ranges are immutable once the cluster uses them; the pod
  # range especially must be sized for the platform's whole life.
  secondaryIpRanges:
    - rangeName: "{{ values.env }}-gke-pods"
      ipCidrRange: "{{ values.pods_cidr }}"
    - rangeName: "{{ values.env }}-gke-services"
      ipCidrRange: "{{ values.services_cidr }}"
  # Private nodes still reach Google APIs (Artifact Registry image pulls,
  # Cloud Logging/Monitoring, Secret Manager) over internal addresses —
  # effectively mandatory for a private-node cluster, and free.
  privateIpGoogleAccess: true
