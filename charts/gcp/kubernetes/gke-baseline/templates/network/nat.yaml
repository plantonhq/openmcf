# Cloud NAT — the private nodes' only road to the internet. This chart's
# nodes carry no public IPs (cluster/gke-cluster.yaml), so anything outside
# Google's network — image pulls from Docker Hub or GHCR, the Let's Encrypt
# ACME endpoints, external APIs — egresses through this NAT. Google-managed
# traffic (Artifact Registry, Cloud APIs) bypasses it entirely via the
# subnet's private Google access, which is why one auto-allocated NAT is
# the right COST posture: it serves only the residual internet traffic.
# The kind creates the Cloud Router and the NAT config as one resource;
# GCP's NAT is a managed, horizontally-scaled service — there is no
# per-zone NAT appliance to duplicate (unlike cloud NAT gateways that
# charge per instance).
apiVersion: gcp.planton.dev/v1
kind: GcpRouterNat
metadata:
  name: "{{ values.env }}-gke-nat"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  routerName: "{{ values.env }}-gke-router"
  natName: "{{ values.env }}-gke-nat"
  region: "{{ values.region }}"
  vpcSelfLink:
    valueFrom:
      # The in-chart VPC — also the ordering edge.
      name: "{{ values.env }}-gke-vpc"
  # AUTO_ONLY IP allocation (no nat_ips): GCP manages the external IP pool.
  # If third parties must allowlist your egress IPs, reserve GcpAddress
  # resources and reference them in nat_ips — the README's day-2 section
  # covers the swap (it is an in-place update, zero downtime).
  #
  # Default scope (all subnetworks, all ranges): pods and nodes alike get
  # egress — pod IPs come from the subnet's secondary range, which a
  # primary-only scope would silently strand.
