{% if values.use_gateway_api | bool %}
# Gateway API — the modern exposure arm, on GKE's NATIVE support. Where a
# generic cluster needs the CRDs, a controller implementation, and a
# GatewayClass installed, GKE provides ALL THREE as part of the cluster:
# cluster/gke-cluster.yaml enables the Gateway API channel, and Google
# installs the CRDs, runs the gateway controller
# (networking.gke.io/gateway), and publishes the gke-l7-* GatewayClasses.
# This arm therefore creates exactly two resources — the Gateway's home
# namespace and the shared Gateway itself. The load balancer behind it is a
# Google-managed Application Load Balancer, provisioned when the Gateway
# reconciles.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-gateway-namespace"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  name: gateway
---
# The shared platform Gateway — the single entry point application
# HTTPRoutes attach to from any namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGateway
metadata:
  name: "{{ values.env }}-gateway"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  namespace:
    valueFrom:
      # The in-chart namespace above — the reference resolves its name AND
      # orders the namespace before the Gateway in the deploy graph.
      name: "{{ values.env }}-gateway-namespace"
  # The GKE-PROVIDED class, as a literal: the class is created by Google
  # when the cluster's Gateway API channel is on — it exists outside this
  # chart's resource graph, so naming it directly is the designed usage
  # (the cluster's runs_on edge above already orders this Gateway after
  # the cluster that provides the class).
  gatewayClassName:
    value: "{{ values.gateway_class }}"
  listeners:
    # One HTTP listener, open to routes from every namespace — the baseline
    # posture that lets application teams attach HTTPRoutes without touching
    # this Gateway. HTTPS listeners are deliberately NOT pre-created: each
    # TLS listener needs a certificate for ITS hostnames, which is
    # per-application decision-making — the README's after-deployment
    # section walks through adding the first one with a Certificate from the
    # in-chart issuers.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
{% endif %}
