{% if values.velero_enabled | bool %}
# The self-backing-up arm: a GCS bucket, a dedicated backup identity with
# Velero's documented permission set, the VolumeSnapshotClass its CSI
# snapshots require, and Velero on a schedule. Everything the backup story
# needs rides this one toggle — flipping it off removes the identity and
# bucket with the workload, never stranding half an arm.
apiVersion: gcp.planton.dev/v1
kind: GcpGcsBucket
metadata:
  # GCS bucket names are GLOBAL across all of GCP — the project-id suffix is
  # what makes an env-derived name collision-safe (project IDs are
  # themselves globally unique). The name is render-known, which is what
  # lets Velero's bucket field below carry it exactly.
  name: "{{ values.env }}-gke-velero-{{ values.gcp_project_id }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  bucketName: "{{ values.env }}-gke-velero-{{ values.gcp_project_id }}"
  location: "{{ values.region }}"
  # Versioning protects the backup history itself: an accidental (or
  # malicious) overwrite of a backup object is recoverable.
  versioningEnabled: true
  # IAM-only access (no legacy object ACLs) and no public access, ever —
  # the hardened posture for a bucket holding full-cluster state.
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  iamMembers:
    # The backup identity's BUCKET-scoped data grant — objectAdmin on THIS
    # bucket and nothing else (GCS is the one Velero surface with
    # resource-scoped IAM, so the chart uses it). The member reference
    # resolves the GSA below and orders identity-before-grant structurally.
    - role: roles/storage.objectAdmin
      member:
        valueFrom:
          name: "{{ values.env }}-gke-velero"
---
# Velero's snapshot permissions as the EXACT custom role its GCP plugin
# documents — disk/snapshot lifecycle for volume snapshots, plus signBlob
# (what lets `velero backup download`/`describe` mint signed GCS URLs).
# A first-class role node: permission changes happen here and the grant
# below picks them up.
apiVersion: gcp.planton.dev/v1
kind: GcpIamCustomRole
metadata:
  name: "{{ values.env }}-gke-velero-role"
spec:
  # Custom role IDs allow no hyphens (unlike almost every other GCP name),
  # so the env prefix is squeezed through a hyphen-stripping filter. The
  # prefix keeps roles from parallel deployments of this chart apart.
  roleId: "{{ values.env | replace('-', '') }}VeleroServer"
  projectId:
    value: "{{ values.gcp_project_id }}"
  title: Velero Server ({{ values.env }}-gke)
  description: Snapshot lifecycle + signed-URL permissions for Velero backups of the {{ values.env }}-gke cluster
  permissions:
    - compute.disks.get
    - compute.disks.create
    - compute.disks.createSnapshot
    - compute.projects.get
    - compute.snapshots.get
    - compute.snapshots.create
    - compute.snapshots.useReadOnly
    - compute.snapshots.delete
    - compute.snapshots.setLabels
    - compute.zones.get
    - storage.objects.create
    - storage.objects.delete
    - storage.objects.get
    - storage.objects.list
    - iam.serviceAccounts.signBlob
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.env }}-gke-velero"
spec:
  serviceAccountId: "{{ values.env }}-gke-velero"
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Velero backup identity for the {{ values.env }}-gke cluster
---
# The custom role granted to the backup identity at project scope (the
# plugin's documented grant — snapshot permissions have no narrower
# surface). BOTH sides arrive by reference, so the grant deploys after the
# role and the identity exist, and a permission edit to the role above
# reaches this grant with no further wiring.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.env }}-gke-velero-grant"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    valueFrom:
      name: "{{ values.env }}-gke-velero-role"
  member:
    valueFrom:
      name: "{{ values.env }}-gke-velero"
---
apiVersion: gcp.planton.dev/v1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: "{{ values.env }}-gke-velero-wi"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  serviceAccountEmail:
    valueFrom:
      name: "{{ values.env }}-gke-velero"
  # Chart truth: the velero release name is fixed to "velero", so the
  # server ServiceAccount is "velero-server" in the "velero" namespace.
  ksaNamespace: velero
  ksaName: velero-server
---
# The VolumeSnapshotClass Velero requires: CSI snapshots silently DON'T
# HAPPEN without a class for the volume's driver carrying the
# velero.io/csi-volumesnapshot-class label — the backup still reports
# Completed while the volumes were never snapshotted. GKE ships the
# snapshot CONTROLLER and its CRDs with the cluster but creates NO class;
# shipping it with the arm closes that trap at the source.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesManifest
metadata:
  name: "{{ values.env }}-velero-snapshot-class"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  # The document is cluster-scoped; the anchor namespace is required by the
  # kind's contract but unused here — kube-system always exists.
  namespace:
    value: kube-system
  createNamespace: false
  manifestYaml: |
    apiVersion: snapshot.storage.k8s.io/v1
    kind: VolumeSnapshotClass
    metadata:
      name: velero-pd-csi
      labels:
        # THE label Velero's CSI path selects its class by.
        velero.io/csi-volumesnapshot-class: "true"
    driver: pd.csi.storage.gke.io
    # Delete the PD snapshot when the VolumeSnapshot object is removed —
    # Velero's own backup expiry then reclaims storage instead of leaking
    # orphaned snapshots.
    deletionPolicy: Delete
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesVelero
metadata:
  name: "{{ values.env }}-velero"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
    # Two halves of the backup identity that no spec field consumes: the
    # Workload Identity handshake and the project-level snapshot grant.
    # Both must be effective before the first backup runs — declared
    # explicitly because nothing flows from them into this spec.
    - kind: GcpGkeWorkloadIdentityBinding
      name: "{{ values.env }}-gke-velero-wi"
      type: depends_on
    - kind: GcpProjectIamMember
      name: "{{ values.env }}-gke-velero-grant"
      type: depends_on
spec:
  # "velero" is the upstream convention; the fixed release name pins the
  # ServiceAccount the Workload Identity binding above trusts.
  namespace:
    value: velero
  createNamespace: true
  backupStorage:
    gcs:
      # Render-known both sides: the same expression names the bucket
      # resource above.
      bucket: "{{ values.env }}-gke-velero-{{ values.gcp_project_id }}"
      # Keyless: the GSA annotation on the server ServiceAccount plus the
      # storage location's serviceAccount config — no Secret exists at
      # all. The reference is also the ordering edge.
      workloadIdentityServiceAccountEmail:
        valueFrom:
          name: "{{ values.env }}-gke-velero"
    # One bucket, one prefix per cluster — the multi-cluster pattern: a
    # standby cluster restores from this same bucket under its own prefix.
    prefix: "{{ values.env }}-gke"
  volumeSnapshots:
    enabled: true
    # CSI snapshots: PVCs snapshot through the CSI snapshot API — the
    # modern path on GKE, whose Persistent Disk CSI driver and snapshot
    # controller ship with the cluster; the class above completes the
    # machinery.
    enableCsi: true
  schedules:
    # The recurring full-cluster backup. Restore is `velero restore create
    # --from-backup <name>` — the README's after-deployment section walks
    # the full loop.
    - name: daily
      schedule: "{{ values.velero_schedule }}"
      ttl: "{{ values.velero_backup_ttl }}"
{% endif %}
