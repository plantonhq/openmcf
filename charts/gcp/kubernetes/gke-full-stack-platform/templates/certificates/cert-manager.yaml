# cert-manager and its keyless GCP identity. Everything TLS in this baseline
# hangs off this controller: the Let's Encrypt ClusterIssuers (next file) are
# cert-manager custom resources, and application Certificates in any
# namespace are reconciled by it. Its DNS-01 solvers write Cloud DNS records
# through the identity below — keylessly.
#
# The GKE identity pattern, used by every controller in this chart, is three
# parts: (1) a Google service account carrying the GCP-side roles, (2) a
# Workload Identity binding granting the controller's KUBERNETES service
# account the right to mint tokens as it, and (3) the iam.gke.io annotation
# on that Kubernetes service account (the component's workloadIdentity block
# below). No key is created, exported, or stored anywhere.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: "{{ values.env }}-gke-cert-manager"
spec:
  # GSA ids are capped at 30 characters — "-cert-manager" (13) leaves the
  # env prefix 17; the README's naming section lists every budget.
  serviceAccountId: "{{ values.env }}-cert-manager"
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: cert-manager DNS-01 identity for the {{ values.env }}-gke cluster
  projectIamRoles:
    # Cloud DNS has no zone-scoped IAM surface, so dns.admin at project
    # scope is the honest deploy-time grant — riding the identity node
    # itself, every consumer that references this GSA is ordered after the
    # grant exists.
    - roles/dns.admin
---
# The GCP half of the Workload Identity handshake: grants cert-manager's
# Kubernetes ServiceAccount roles/iam.workloadIdentityUser on the GSA above.
# The principal is composed from parts — pool project + namespace + name —
# so a typo'd principal string is impossible by construction, and NOTHING
# here needs a cluster output: every GCP project carries its implicit
# workload-identity pool (<project>.svc.id.goog) from the start.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: "{{ values.env }}-gke-cert-manager-wi"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  serviceAccountEmail:
    valueFrom:
      # The GSA above — also the ordering edge.
      name: "{{ values.env }}-gke-cert-manager"
  # Chart truth: the cert-manager release name is fixed to "cert-manager"
  # (one per cluster), so its controller ServiceAccount is "cert-manager"
  # in the "cert-manager" namespace.
  ksaNamespace: cert-manager
  ksaName: cert-manager
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCertManager
metadata:
  name: "{{ values.env }}-cert-manager"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
    # The Workload Identity handshake must be EFFECTIVE before the
    # controller solves its first challenge — no spec field consumes a
    # binding output, so the edge is declared explicitly.
    - kind: GcpGkeWorkloadIdentityBinding
      name: "{{ values.env }}-gke-cert-manager-wi"
      type: depends_on
spec:
  # "cert-manager" is the upstream-conventional home and is deliberately NOT
  # parameterized: the namespace is effectively permanent (the kept CRDs pin
  # release ownership to it — reinstalling elsewhere fails Helm's ownership
  # check), and every runbook on the internet assumes this name.
  namespace:
    value: cert-manager
  createNamespace: true
  # Keyless DNS-01: the controller's ServiceAccount is annotated with the
  # GSA above, and the issuers' solvers deliberately carry NO static
  # credentials — they inherit this ambient identity. One binding here
  # secures every certificate the platform ever issues.
  workloadIdentity:
    gke:
      serviceAccountEmail:
        valueFrom:
          name: "{{ values.env }}-gke-cert-manager"
