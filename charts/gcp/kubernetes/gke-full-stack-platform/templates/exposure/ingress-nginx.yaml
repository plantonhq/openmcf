{% if not (values.use_gateway_api | bool) %}
# ingress-nginx — the cluster's traffic entry point (the default exposure
# arm). One controller, one cloud LoadBalancer (a GCP passthrough Network
# Load Balancer provisioned by GKE's service controller), and the cluster's
# DEFAULT IngressClass: an Ingress with no class annotation lands here,
# which is exactly what a baseline should promise. GKE's own ingress
# controller (the "gce" class, part of the HTTP load-balancing addon)
# remains available but is NOT the default — one entry point, one mental
# model. The sibling gateway.yaml arm replaces this entirely when
# use_gateway_api is true.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngressNginx
metadata:
  name: "{{ values.env }}-ingress-nginx"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  namespace:
    value: ingress-nginx
  createNamespace: true
  ingressClass:
    # "nginx" is what every tutorial, chart, and team assumes; the HTTP-01
    # solver in certificates/cluster-issuers.yaml points at this class too.
    name: nginx
    # THE default class: Ingresses without an explicit class are served. At
    # most one default class may exist per cluster — this baseline claims it.
    isDefaultClass: true
  # Two replicas is the production floor: the controller is the single entry
  # point for all HTTP traffic, and with one replica every node drain is a
  # traffic outage. The Service defaults to type LoadBalancer, so GCP
  # provisions the external entry point automatically.
  replicas: {{ values.ingress_replicas }}
{% endif %}
