# The SYSTEM node pool — the small, always-on floor that hosts
# cluster-critical pods (the addon controllers this chart installs:
# cert-manager, external-dns, the ingress controller, ESO, Velero) so
# autoscaling never depends on capacity it manages itself. Application
# capacity is node auto-provisioning's job (cluster/gke-cluster.yaml), not
# this pool's. GKE repairs and upgrades these nodes automatically — the
# management block's defaults, inherited deliberately.
apiVersion: gcp.planton.dev/v1
kind: GcpGkeNodePool
metadata:
  name: "{{ values.env }}-gke-system"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  clusterName:
    valueFrom:
      # Resolves the cluster's name output; also the ordering edge that
      # deploys the control plane before its first nodes.
      name: "{{ values.env }}-gke"
  location:
    valueFrom:
      # The pool must live where the cluster lives — resolving it from the
      # cluster's own location output makes drift impossible.
      name: "{{ values.env }}-gke"
  # Autoscaled between per-zone bounds (a regional cluster runs one managed
  # instance group per zone): min 1/zone keeps controllers zone-spread; the
  # low ceiling is deliberate — a growing system pool usually means an
  # application pod landed here instead of on NAP capacity.
  autoscaling:
    minNodes: {{ values.system_nodes_min_per_zone }}
    maxNodes: {{ values.system_nodes_max_per_zone }}
  nodeConfig:
    machineType: "{{ values.system_node_machine_type }}"
    diskSizeGb: {{ values.system_node_disk_size_gb }}
    # The dedicated least-privilege node identity (cluster/gke-cluster.yaml)
    # — never the Compute Engine default service account. The reference is
    # also the ordering edge.
    serviceAccount:
      valueFrom:
        name: "{{ values.env }}-gke-nodes"
    # cloud-platform + IAM-governed access: the Workload Identity posture.
    oauthScopes:
      - https://www.googleapis.com/auth/cloud-platform
    # The GKE metadata server — REQUIRED for Workload Identity (it is what
    # intercepts pods' credential requests) and the guard that keeps pods
    # from reading the node VM's own credentials. Spelled out because every
    # keyless binding in this chart depends on it.
    workloadMetadataMode: GKE_METADATA
{% if values.spot_pool_enabled | bool %}
---
# The opt-in Spot pool — deeply discounted capacity that scales from ZERO
# (costs nothing while idle) for fault-tolerant workloads. Spot VMs can be
# reclaimed with 30 seconds' notice, so the pool is TAINTED: nothing lands
# here without an explicit toleration, and GKE's own graceful-shutdown
# handling drains reclaimed nodes.
apiVersion: gcp.planton.dev/v1
kind: GcpGkeNodePool
metadata:
  name: "{{ values.env }}-gke-spot"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  clusterName:
    valueFrom:
      name: "{{ values.env }}-gke"
  location:
    valueFrom:
      name: "{{ values.env }}-gke"
  autoscaling:
    # Scale-to-zero is the point: the pool exists as latent cheap capacity.
    minNodes: 0
    maxNodes: {{ values.spot_nodes_max_per_zone }}
    # ANY prioritizes zones with available Spot capacity over zone balance —
    # the documented policy for Spot pools (fewer preemptions beat symmetry).
    locationPolicy: ANY
  nodeConfig:
    machineType: "{{ values.spot_machine_type }}"
    diskSizeGb: {{ values.system_node_disk_size_gb }}
    serviceAccount:
      valueFrom:
        name: "{{ values.env }}-gke-nodes"
    oauthScopes:
      - https://www.googleapis.com/auth/cloud-platform
    workloadMetadataMode: GKE_METADATA
    # The current Spot model (no 24h lifetime cap — preemptible is the
    # legacy one). GKE labels these nodes cloud.google.com/gke-spot=true;
    # workloads opt in with that nodeSelector plus the toleration below.
    spot: true
    taints:
      - key: cloud.google.com/gke-spot
        value: "true"
        effect: NO_SCHEDULE
{% endif %}
