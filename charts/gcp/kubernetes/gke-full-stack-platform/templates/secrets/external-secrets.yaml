{% if values.external_secrets_enabled | bool %}
# External Secrets Operator, its keyless GCP identity, and a cluster-wide
# store reading GCP Secret Manager — the pattern that keeps secret VALUES
# out of manifests entirely: workloads declare ExternalSecrets naming
# secrets in Secret Manager, ESO syncs them into native Kubernetes Secrets,
# keylessly. The operator is a one-per-cluster singleton (its release name
# and cluster-global webhook are fixed upstream), which is why this whole
# file rides one toggle.
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.env }}-gke-external-secrets"
spec:
  serviceAccountId: "{{ values.env }}-external-secrets"
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: External Secrets Operator identity for the {{ values.env }}-gke cluster
  projectIamRoles:
    # Read-only over Secret Manager — accessor grants payload reads and
    # nothing else (no list-all-metadata, no writes). Project scope is the
    # honest deploy-time shape; the README's day-2 section shows narrowing
    # to per-secret grants once your naming convention exists.
    - roles/secretmanager.secretAccessor
---
apiVersion: gcp.planton.dev/v1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: "{{ values.env }}-gke-external-secrets-wi"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  serviceAccountEmail:
    valueFrom:
      name: "{{ values.env }}-gke-external-secrets"
  # Chart truth: the operator's release name is fixed to "external-secrets"
  # (one per cluster) and the module pins the controller ServiceAccount to
  # the chart name.
  ksaNamespace: external-secrets
  ksaName: external-secrets
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalSecretsOperator
metadata:
  name: "{{ values.env }}-external-secrets"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
    - kind: GcpGkeWorkloadIdentityBinding
      name: "{{ values.env }}-gke-external-secrets-wi"
      type: depends_on
spec:
  # Conventional home; permanent while the kept CRDs pin release ownership
  # to it (reinstalling elsewhere fails Helm's ownership check).
  namespace:
    value: external-secrets
  createNamespace: true
  # Keyless reads: the operator's ServiceAccount is annotated with the GSA
  # above, and the store below deliberately declares NO credentials — its
  # empty auth falls through to this ambient identity. One binding here
  # covers every ExternalSecret the platform ever syncs.
  workloadIdentity:
    gke:
      serviceAccountEmail:
        valueFrom:
          name: "{{ values.env }}-gke-external-secrets"
---
# The cluster-wide store: readable by ExternalSecrets in every namespace.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesClusterSecretStore
metadata:
  name: "{{ values.env }}-secret-store"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  # Reference into the in-chart operator: resolves the namespace credential
  # Secrets would live in, and orders the operator (whose CRDs define
  # ClusterSecretStore) before this resource structurally.
  secretsNamespace:
    valueFrom:
      name: "{{ values.env }}-external-secrets"
  config:
    gcpSecretManager:
      # No ServiceAccount reference, no key: the empty auth IS the design —
      # reads run with the operator's ambient identity bound above.
      projectId:
        value: "{{ values.gcp_project_id }}"
{% endif %}
