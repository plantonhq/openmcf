# The batch workload: a Cloud Run Job. Nothing runs (and nothing bills)
# between executions — the scheduler fires, tasks run the container to
# completion, and the environment goes back to zero.
apiVersion: gcp.planton.dev/v1
kind: GcpCloudRunJob
metadata:
  name: "{{ values.workload_name }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  region: "{{ values.region }}"
  # Set explicitly (rather than riding the metadata.name fallback) because
  # the trigger's invocation URI embeds this exact cloud-side name.
  jobName: "{{ values.workload_name }}"
  template:
    containers:
      - image: "{{ values.image }}"
        resources:
          cpu: "{{ values.cpu }}"
          memory: "{{ values.memory }}"
    serviceAccount:
      valueFrom:
        name: "{{ values.workload_name }}-runtime"
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: {{ values.task_timeout_seconds }}
    maxRetries: {{ values.task_max_retries }}
  # One task per execution — the sequential-batch default. Raise taskCount
  # (and add parallelism) when the work shards cleanly by task index.
  taskCount: 1
