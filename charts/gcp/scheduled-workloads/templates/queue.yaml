# The async half (queueEnabled=true): a Cloud Tasks queue for work your
# services enqueue at request time and drain out-of-band — the complement
# to the cron layer. The queue ships with GCP's managed dispatch/retry
# defaults; add rateLimits and retryConfig on the resource when a
# downstream target needs protection. Task creation and task targets are
# an application concern — your code enqueues tasks with per-task HTTP
# targets and its own identity.
{% if values.queueEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpCloudTasksQueue
metadata:
  name: "{{ values.workload_name }}-queue"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  # Chosen explicitly and permanent by design: the API reserves a deleted
  # queue's ID for up to 7 days, so this name outlives redeploys.
  queueName: "{{ values.queue_name }}"
  location: "{{ values.region }}"
{% endif %}
