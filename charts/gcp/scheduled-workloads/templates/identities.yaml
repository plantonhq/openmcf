# Two identities, deliberately separate: the account the batch code RUNS
# AS, and the account the trigger CALLS AS. Splitting them keeps each side
# least-privilege — the runtime identity gets whatever the batch work
# touches (nothing, until you grant it), while the trigger identity holds
# exactly one permission: invoking the job.
---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.workload_name }}-runtime"
spec:
  serviceAccountId: "{{ values.workload_name }}-runtime"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.workload_name }} job runtime"
  description: >-
    Identity the {{ values.workload_name }} Cloud Run Job executes as.
    Grant it what the batch work touches; no user-managed key.

---
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.workload_name }}-trigger"
spec:
  serviceAccountId: "{{ values.workload_name }}-trigger"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.workload_name }} schedule trigger"
  description: >-
    Identity Cloud Scheduler authenticates as when executing the
    {{ values.workload_name }} job. Holds run.invoker only; no
    user-managed key.

---
# The trigger's one permission. roles/run.invoker carries run.jobs.run —
# executing a job is "invoking" in Cloud Run's permission model.
# Project-scoped (no kind models per-job Cloud Run IAM); the member
# reference orders the grant after the account.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.workload_name }}-trigger-invoker"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/run.invoker
  member:
    valueFrom:
      name: "{{ values.workload_name }}-trigger"
