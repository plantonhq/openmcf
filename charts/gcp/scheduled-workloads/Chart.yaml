apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: GCP Scheduled Workloads
spec:
  selector:
    kind: platform
  description: Cron on Cloud Run, wired end to end — a containerized Cloud Run Job for the batch work, a Cloud Scheduler trigger that executes it on your schedule through an OAuth-authenticated call to the Cloud Run Admin API, and the dedicated identities and invoker grant that make the handshake work. No VM to keep alive between runs, no key to store, and retry posture on both the trigger and the job. An optional Cloud Tasks queue adds rate-controlled asynchronous dispatch beside the cron layer.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/gcp/gcpcloudrun/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/gcp/scheduled-workloads
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/gcp/scheduled-workloads/README.md
