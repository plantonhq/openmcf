# The batch compute tier (dataprocEnabled=true): an autoscaling Dataproc
# cluster wired to chart-owned staging/temp buckets and a least-privilege
# identity, private-IP-only inside the landing zone's subnet.
#
# The staging and temp buckets are deliberately chart-owned: left
# unspecified, Dataproc auto-creates PERSISTENT buckets that outlive
# every cluster in the region and accumulate per-creator ACL state —
# owning them here makes their lifecycle, posture, and cleanup visible
# in the graph instead of implicit in a regional singleton.
{% if values.dataprocEnabled | bool %}
---
apiVersion: gcp.planton.dev/v1
kind: GcpGcsBucket
metadata:
  name: "{{ values.lake_bucket_name }}-dataproc-staging"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  bucketName: "{{ values.lake_bucket_name }}-dataproc-staging"
  location: "{{ values.region }}"
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  lifecycleRules:
    # Job dependencies and staged artifacts are re-uploaded by every job
    # run — anything older than 30 days is abandoned, not archival.
    - action:
        type: Delete
      condition:
        ageDays: 30
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        ageDays: 7
  # Disposable by design: staging holds nothing that is not re-created
  # by the next job run, so teardown must never wedge on leftover files.
  # (Contrast with the lake bucket, which keeps the default false.)
  forceDestroy: true

---
apiVersion: gcp.planton.dev/v1
kind: GcpGcsBucket
metadata:
  name: "{{ values.lake_bucket_name }}-dataproc-temp"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  bucketName: "{{ values.lake_bucket_name }}-dataproc-temp"
  location: "{{ values.region }}"
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  lifecycleRules:
    # Shuffle/spill data is ephemeral by definition — a week is generous.
    - action:
        type: Delete
      condition:
        ageDays: 7
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        ageDays: 7
  forceDestroy: true

---
# The cluster's identity. A dedicated account with exactly the Dataproc
# worker role beats the default Compute Engine service account, whose
# broad project-editor legacy grants every VM in the project would share.
apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: "{{ values.lakehouse_name }}-dataproc"
spec:
  serviceAccountId: "{{ values.lakehouse_name }}-dataproc"
  projectId:
    value: "{{ values.gcp_project_id }}"
  displayName: "{{ values.lakehouse_name }} Dataproc cluster identity"
  description: >-
    Identity the {{ values.lakehouse_name }} Dataproc nodes run as.
    Holds dataproc.worker only; grant it BigQuery/GCS roles as your
    jobs' data access requires.

---
# roles/dataproc.worker is the documented minimum for cluster VMs
# (control-plane reporting, staging-bucket access, logging). Additive and
# project-scoped; the member reference orders the grant after the account.
apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: "{{ values.lakehouse_name }}-dataproc-worker"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  role:
    value: roles/dataproc.worker
  member:
    valueFrom:
      name: "{{ values.lakehouse_name }}-dataproc"

---
# The autoscaling policy — a first-class, shareable resource: tune it
# here and every attached cluster follows. Primary workers (on-demand,
# HDFS-bearing) form the stable base; secondary workers (spot, no HDFS)
# take ~75% of new burst capacity at weight 3 and scale back to zero
# when the queue drains.
apiVersion: gcp.planton.dev/v1
kind: GcpDataprocAutoscalingPolicy
metadata:
  name: "{{ values.lakehouse_name }}-autoscale"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  policyId: "{{ values.lakehouse_name }}-autoscale"
  location: "{{ values.region }}"
  workerConfig:
    # The API's floor for autoscaled primaries is 2.
    minInstances: 2
    maxInstances: {{ values.dataproc_max_workers }}
    weight: 1
  secondaryWorkerConfig:
    minInstances: 0
    maxInstances: {{ values.dataproc_max_workers }}
    weight: 3
  basicAlgorithm:
    cooldownPeriod: "120s"
    yarnConfig:
      # Scale-down waits an hour for running tasks before force-removing
      # a node — aggressive cost recovery without killing jobs mid-task.
      gracefulDecommissionTimeout: "3600s"
      # Add half the suggested capacity per evaluation (smooth ramp-up),
      # release all idle capacity per evaluation (fast cost recovery).
      scaleUpFactor: 0.5
      scaleDownFactor: 1.0

---
apiVersion: gcp.planton.dev/v1
kind: GcpDataprocCluster
metadata:
  name: "{{ values.lakehouse_name }}-dataproc"
  # Dataproc validates the node identity's permissions at create time,
  # but no output flows from the grant into this manifest — the explicit
  # edge orders the cluster after the worker role is effective.
  relationships:
    - kind: GcpProjectIamMember
      name: "{{ values.lakehouse_name }}-dataproc-worker"
      type: depends_on
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  region: "{{ values.region }}"
  clusterName: "{{ values.lakehouse_name }}-dataproc"
  # Manual downscales get the same graceful-decommission window the
  # autoscaler uses.
  gracefulDecommissionTimeout: "3600s"
  clusterConfig:
    # Chart-owned buckets (see the header comment) — the references
    # resolve to bucket_id outputs and order the cluster after both.
    stagingBucket:
      valueFrom:
        name: "{{ values.lake_bucket_name }}-dataproc-staging"
    tempBucket:
      valueFrom:
        name: "{{ values.lake_bucket_name }}-dataproc-temp"
    gceConfig:
      # The landing zone's subnet, by Planton resource name (an
      # environment-level resource this chart consumes, never creates).
      subnetwork:
        valueFrom:
          name: "{{ values.subnetwork_resource_name }}"
      serviceAccount:
        valueFrom:
          name: "{{ values.lakehouse_name }}-dataproc"
      # cloud-platform scope + IAM roles is the modern access model —
      # narrower legacy scopes only mask what IAM already controls.
      serviceAccountScopes:
        - https://www.googleapis.com/auth/cloud-platform
      # No public IPs on any node: egress rides the landing zone's NAT,
      # and Google APIs ride the subnet's Private Google Access (on by
      # default in project-foundation's subnet).
      internalIpOnly: true
    masterConfig:
      numInstances: 1
      machineType: "{{ values.dataproc_worker_machine_type }}"
      diskConfig:
        bootDiskSizeGb: 100
        bootDiskType: pd-balanced
    workerConfig:
      # The autoscaler owns the worker count from here; 2 is the floor
      # it scales from.
      numInstances: 2
      machineType: "{{ values.dataproc_worker_machine_type }}"
      diskConfig:
        bootDiskSizeGb: 100
        bootDiskType: pd-balanced
    softwareConfig:
      # Pin the image line: jobs behave identically across cluster
      # rebuilds instead of drifting with "latest stable".
      imageVersion: 2.2-debian12
    # The policy reference resolves to the policy's full resource name
    # and orders the cluster after it.
    autoscalingPolicyUri:
      valueFrom:
        name: "{{ values.lakehouse_name }}-autoscale"
    endpointConfig:
      # Component Gateway: the Spark/YARN web UIs behind Google login
      # instead of SSH tunnels.
      enableHttpPortAccess: true
{% endif %}
