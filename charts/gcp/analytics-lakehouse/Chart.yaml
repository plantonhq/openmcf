  description: The analytics foundation in one deploy — a BigQuery warehouse dataset, a lifecycle-managed data lake bucket beside it, and zero-code streaming ingestion where every event published to Pub/Sub lands as a day-partitioned BigQuery row within seconds. An optional Dataproc arm adds an autoscaling Spark cluster with its own staging buckets and least-privilege identity, private-IP-only inside your existing network. Analysts get SQL over the full event history minutes after deploy; the batch tier arrives later with one toggle.
