apiVersion: infra-hub.planton.ai/v1
kind: InfraChart
metadata:
  name: GCP Static Website with CDN
spec:
  selector:
    kind: platform
  description: A global static website done right — a Cloud Storage origin serving index and 404 pages, Cloud CDN caching at Google's edge with compression and negative caching, a Google-managed TLS certificate, HTTP-to-HTTPS redirect on one stable global IP, and the DNS A records that make it live. Optional Cloud Armor at the edge. Upload your build output and the site is on the air.
  iconUrl: https://assets.planton.ai/apis/infrahub/cloudresource/v1/assets/provider/gcp/gcpgcsbucket/v1/logo.svg
  isReady: true
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/gcp/static-website-cdn
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/gcp/static-website-cdn/README.md
