# The optional last mile: an A record publishing the domain at the load
# balancer's static IP, in a Cloud DNS zone that already exists in the
# target environment (dnsZoneName names the GcpDnsZone resource —
# typically deployed by your DNS chart). Managed-certificate issuance
# starts once this record (or its equivalent at an external DNS host)
# resolves.
{% if values.dnsEnabled | bool %}
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDnsRecord
metadata:
  name: {{ values.env }}-{{ values.appName }}-dns
spec:
  managedZone:
    valueFrom:
      kind: GcpDnsZone
      name: {{ values.dnsZoneName }}
      fieldPath: status.outputs.zone_name
  type: A
  # Record names are FQDNs with the trailing dot.
  name:
    value: {{ values.domain }}.
  values:
    # The LB's static IP — the reference names its kind explicitly (the
    # values list has no default kind).
    - valueFrom:
        kind: GcpGlobalAddress
        name: {{ values.env }}-{{ values.appName }}-ip
        fieldPath: status.outputs.address
  ttlSeconds: 300
  deletionPolicy: DELETE
{% endif %}
