# The routing spine: URL map → HTTPS proxy → global forwarding rule. One
# domain, one backend — the URL map is a plain default-service table, and
# every request arriving on 443 at the static IP lands on the Cloud Run
# backend. Path-based routing, weighted splits, and CDN policies all grow
# on the URL map later without touching anything else in this chart.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpUrlMap
metadata:
  name: {{ values.env }}-{{ values.appName }}-urlmap
spec:
  urlMapName: {{ values.env }}-{{ values.appName }}-urlmap
  description: Routing table for the {{ values.appName }} HTTPS load balancer
  # defaultService accepts a backend service OR a backend bucket, so the
  # reference names its kind explicitly (no default kind on this field).
  defaultService:
    valueFrom:
      kind: GcpBackendService
      name: {{ values.env }}-{{ values.appName }}-backend
      fieldPath: status.outputs.self_link
  deletionPolicy: DELETE
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpsProxy
metadata:
  name: {{ values.env }}-{{ values.appName }}-proxy
spec:
  proxyName: {{ values.env }}-{{ values.appName }}-proxy
  description: TLS termination for the {{ values.appName }} load balancer
  urlMap:
    valueFrom:
      kind: GcpUrlMap
      name: {{ values.env }}-{{ values.appName }}-urlmap
      fieldPath: status.outputs.self_link
  sslCertificates:
    - valueFrom:
        kind: GcpManagedSslCertificate
        name: {{ values.env }}-{{ values.appName }}-cert
        fieldPath: status.outputs.self_link
  deletionPolicy: DELETE
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGlobalForwardingRule
metadata:
  name: {{ values.env }}-{{ values.appName }}-fr
spec:
  forwardingRuleName: {{ values.env }}-{{ values.appName }}-fr
  description: Public 443 entry point for the {{ values.appName }} load balancer
  target:
    valueFrom:
      kind: GcpTargetHttpsProxy
      name: {{ values.env }}-{{ values.appName }}-proxy
      fieldPath: status.outputs.self_link
  ipAddress:
    valueFrom:
      kind: GcpGlobalAddress
      name: {{ values.env }}-{{ values.appName }}-ip
      fieldPath: status.outputs.address
  portRange: "443"
  # Must match the backend service's scheme — EXTERNAL_MANAGED end to end.
  loadBalancingScheme: EXTERNAL_MANAGED
  deletionPolicy: DELETE
