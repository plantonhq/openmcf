# The serving side: a serverless network endpoint group bridging Cloud Run
# into the load balancer, the backend service that fronts it, and the
# optional Cloud Armor policy attached to that backend.
#
# Serverless-NEG rules the shapes below honor (GCP rejects violations at
# deploy): the NEG carries no network/subnetwork; the backend entry
# carries no balancingMode or capacity dials; the backend service carries
# no health check (Cloud Run manages its own health).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpRegionNetworkEndpointGroup
metadata:
  name: {{ values.env }}-{{ values.appName }}-neg
spec:
  networkEndpointGroupName: {{ values.env }}-{{ values.appName }}-neg
  description: Serverless NEG bridging the {{ values.appName }} Cloud Run service into the load balancer
  # NEGs are regional even under a global LB — the region must match the
  # Cloud Run service's.
  region: {{ values.region }}
  cloudRun:
{% if values.deployService | bool %}
    # The chart-deployed service, by reference — the NEG follows whatever
    # name the deployment actually produced.
    service:
      valueFrom:
        kind: GcpCloudRun
        name: {{ values.env }}-{{ values.appName }}
        fieldPath: status.outputs.service_name
{% else %}
    # Bring-your-own: the existing service, by name. It must live in this
    # same region and project.
    service:
      value: {{ values.existingServiceName }}
{% endif %}
  deletionPolicy: DELETE
{% if values.cloudArmorEnabled | bool %}
---
# Cloud Armor: shipped OPEN (no rules — GCP's implicit default allow) with
# Layer-7 DDoS defense enabled, so flipping the toggle never breaks
# serving. Harden it by adding allow/deny rules here as your exposure
# model firms up; any explicit rule set must include a priority-2147483647
# default rule.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudArmorPolicy
metadata:
  name: {{ values.env }}-{{ values.appName }}-armor
spec:
  policyName: {{ values.env }}-{{ values.appName }}-armor
  description: Cloud Armor policy protecting the {{ values.appName }} backend
  type: CLOUD_ARMOR
  adaptiveProtectionConfig:
    enableLayer7DdosDefense: true
  deletionPolicy: DELETE
{% endif %}
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBackendService
metadata:
  name: {{ values.env }}-{{ values.appName }}-backend
spec:
  backendServiceName: {{ values.env }}-{{ values.appName }}-backend
  description: Backend service fronting the {{ values.appName }} serverless NEG
  # EXTERNAL_MANAGED is the modern (Envoy-based) global LB family — it is
  # what advanced traffic management requires, and the forwarding rule
  # declares the same scheme (the two must match).
  protocol: HTTP
  loadBalancingScheme: EXTERNAL_MANAGED
  backends:
    - group:
        valueFrom:
          kind: GcpRegionNetworkEndpointGroup
          name: {{ values.env }}-{{ values.appName }}-neg
          fieldPath: status.outputs.self_link
{% if values.cloudArmorEnabled | bool %}
  securityPolicy:
    valueFrom:
      kind: GcpCloudArmorPolicy
      name: {{ values.env }}-{{ values.appName }}-armor
      fieldPath: status.outputs.policy_self_link
{% endif %}
  deletionPolicy: DELETE
