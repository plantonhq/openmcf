# The load balancer's public face: one static global IPv4 address (the
# stable value DNS points at — it survives every re-deploy behind it) and
# the Google-managed certificate for the domain.
#
# Managed-certificate lifecycle worth knowing before the first deploy: the
# certificate provisions only AFTER the domain's DNS resolves to the
# address below. Until then it sits in PROVISIONING and the LB cannot
# serve HTTPS for the domain — expect up to ~15 minutes after DNS
# propagates. Nothing here blocks on it; deploy, point DNS, wait.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGlobalAddress
metadata:
  name: {{ values.env }}-{{ values.appName }}-ip
spec:
  addressName: {{ values.env }}-{{ values.appName }}-ip
  addressType: EXTERNAL
  ipVersion: IPV4
  description: Static IPv4 for the {{ values.appName }} HTTPS load balancer
  deletionPolicy: DELETE
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedSslCertificate
metadata:
  name: {{ values.env }}-{{ values.appName }}-cert
spec:
  certificateName: {{ values.env }}-{{ values.appName }}-cert
  # Exactly the serving domain — managed certificates take no wildcards.
  # Serving a second domain later means adding it here (certificate
  # replacement, zero LB downtime: the old cert serves until the new one
  # is ACTIVE).
  domains:
    - {{ values.domain }}
  description: Managed certificate for {{ values.domain }}
  deletionPolicy: DELETE
