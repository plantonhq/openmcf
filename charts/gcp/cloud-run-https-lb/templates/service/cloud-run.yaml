# The Cloud Run service the load balancer fronts — rendered only when the
# chart owns the service (deployService=true). Bring-your-own deployments
# (deployService=false) skip this document entirely and the serverless NEG
# names the existing service literally instead.
#
# The load-bearing posture: ingress INTERNAL_LOAD_BALANCER. The service
# accepts traffic ONLY through Cloud Load Balancing (plus internal
# sources), so the default run.app URL cannot bypass the domain, the
# managed certificate, or Cloud Armor. allowUnauthenticated grants public
# access THROUGH the LB — the LB forwards anonymous internet traffic, so
# the service's own IAM check must admit it; reachability is what the
# ingress setting restricts.
{% if values.deployService | bool %}
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: {{ values.env }}-{{ values.appName }}
spec:
  region: {{ values.region }}
  containers:
    - image: {{ values.containerImage }}
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 10
  ingress: INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
  allowUnauthenticated: true
  deletionProtection: false
  deletionPolicy: DELETE
{% endif %}
