# Fixture-integrity baseline: pre-existing reference-resolution defects found
# when the offline gate (TestCatalogFixtureIntegrity) was introduced. Each
# entry records one committed scenario whose value_from reference graph cannot
# resolve against the prerequisite chain the E2E runner would deploy for it.
#
# THE RULE: this file only ever BURNS DOWN. A new finding is a defect to fix
# in the manifests (or the kind's registry prerequisites) -- never a new entry
# here. When an owner fixes an entry's defect, the gate fails on the entry as
# stale until it is deleted.
#
# Key shape: <scenario>|<manifest carrying the reference>|<field>|<kind>/<name>
# (empty field/ref segments mean the prerequisite chain itself failed to
# resolve -- typically a prerequisite kind with no install manifest).

