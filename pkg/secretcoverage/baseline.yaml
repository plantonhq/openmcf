# Secret-coverage baseline -- the accepted backlog of cloud-resource fields that
# LOOK sensitive by name (the secret heuristic) but are not yet annotated with the
# Planton `sensitive` option. This is the annotation-sweep TODO list.
#
# It is NOT a permanent exemption. A field that is intentionally not a secret (a
# public key, an access-key id, a resource name) must use the proto
# `sensitive_exempt_reason` option instead, which documents WHY in the proto itself.
#
# The `violations` list is the accepted backlog of annotation violations -- today
# that means sensitive fields still carrying a value-content validation rule (a
# pattern/CEL written for the raw value, which a stored managed-secret reference can
# never satisfy, making the field impossible to fill through annotation-driven
# surfaces). The fix is always the same: delete the rule, teach the shape in the
# field's comment, and remove the entry here. Each entry names its owning program.
#
# The CI guardrail (go test ./pkg/secretcoverage/...) fails when:
#   - a gap appears that is NOT listed here (a new unannotated secret field shipped),
#   - a violation appears that is NOT listed here (a new contradictory annotation),
#   - a listed entry is no longer a gap/violation (fixed -- remove it here).
# Both lists only burn down; never add an entry for new work.
#
# Regenerate with:  planton secret-coverage --write-baseline
#
# ─────────────────────────────────────────────────────────────────────────────
# Remaining backlog after the secure-by-default annotation sweep.
#
# CLOSED in the 2026-06-17 planton-half session (now annotated `sensitive`):
#   (R)  the 7 secrets nested in repeated rows -- the web wizard's repeated-row
#        cards were converged onto the shared sensitivity-aware picker (and the
#        4 with no console UI were annotated to secure the CLI/manifest path), so
#        none dead-ends; and
#   (FK) AzureVirtualMachine.admin_password -- the wizard now renders the DD-006
#        dual-mode "managed secret | reference AzureKeyVault" picker.
#
# The fields below ARE real secrets, deliberately deferred (not yet annotated) for
# one of two reasons, each to be closed in a follow-up:
#   (C)  Service env-var secret maps. Governed by the env-resolution path and the
#        still-open reference-only (allow_literals) decision; annotating here would
#        pre-empt that decision (PO-13).
#   (D)  Secret-holder kinds (e.g. KubernetesSecret) whose purpose is to
#        materialize a secret. Reference-only is the right end state but a
#        fundamental UX shift; needs its own design slice.
# ─────────────────────────────────────────────────────────────────────────────
gaps:
  # (C) service env-var secret maps
  # (D) secret-holder kinds
  - KubernetesSecret:spec.basic_auth.password
  - KubernetesSecret:spec.docker_config_json.password
  - KubernetesSecret:spec.ssh_auth.ssh_private_key
violations:
  # Sensitive fields still carrying a value-content rule, found when the check was
  # introduced (the Azure catalog's two instances were fixed in the same change).
  # Owners: gcp entries -> the GCP catalog maintainers; cloudflare -> the Cloudflare
  # catalog maintainers. Fix = drop the rule, teach the shape in the field comment.
  - CloudflareZeroTrustTunnel:spec.tunnel_secret
  - GcpBackendBucket:spec.signed_url_keys.key_value
  - GcpBackendService:spec.signed_url_keys.key_value
  - GcpCertManagerCert:spec.self_managed.pem_private_key
  - GcpSslCertificate:spec.private_key
