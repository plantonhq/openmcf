# Breadth dispositions ledger for the cloudflare (GA) provider -- the
# recorded judgment for GA resources the computed classes do not cover. Two
# classes never appear here because they are computed: modeled (the module
# census proves consumption) and iam-covered (the *_iam_member/binding/policy
# pattern); schema-flagged deprecations are computed too, and the checker
# fails a ledger entry that shadows any computed class. All seven of this
# provider's deprecated resources carry the schema flag, so this ledger has
# no excluded-deprecated entries.
#
# Entries record judgment, one disposition per resource, reason mandatory:
#   composed            -- covered by fields of an existing kind (name it)
#   model-planned       -- covered by a planned kind not built yet: a kind
#                          of its own, or a planned kind (or planned
#                          composition) it folds into; flips to modeled or
#                          composed when the kind ships
#   deferred            -- deliberately not offered, with the reason
#   excluded-deprecated -- deprecated/superseded in docs but not flagged in
#                          the schema
#
# A GA resource with no computed class and no entry here is a finding; the
# not-yet-judged remainder is carried loudly in baseline.yaml and burns down
# as judgments are recorded.
provider: cloudflare
