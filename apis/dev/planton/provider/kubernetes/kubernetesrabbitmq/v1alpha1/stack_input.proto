syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesrabbitmq.v1alpha1;

import "dev/planton/provider/kubernetes/kubernetesrabbitmq/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// kubernetes-rabbit-mq stack-input
message KubernetesRabbitMqStackInput {
  // target cloud-resource
  KubernetesRabbitMq target = 1;
  // provider-credential
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
  // kubernetes namespace
  string kubernetes_namespace = 3;
}
