# The kind-cluster-honest full surface: a 3-node cluster on EPHEMERAL
# storage (the CR's storage-0 + emptyDir arm — the persistent arms run in
# the minimal and durability lanes), extra plugins, rabbitmq.conf and env
# additions, kind-sized resources (the operator defaults of 1 CPU / 2Gi
# per node would not fit three nodes on the shared cluster), a NodePort
# client Service with annotations, upgrade-ready feature flags, and fast
# teardown knobs. TLS and the Vault/external-secret backends are
# plan-proven offline (they need certificate/Vault fixtures).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRabbitMq
metadata:
  name: e2e-rmq-tuned
spec:
  namespace:
    value: e2e-rmq-tuned
  create_namespace: true
  replicas: 3
  ephemeral: true
  resources:
    requests:
      cpu: 250m
      memory: 700Mi
    limits:
      cpu: 500m
      memory: 1Gi
  configuration:
    additional_plugins:
      - rabbitmq_shovel
      - rabbitmq_mqtt
    additional_config: |
      vm_memory_high_watermark.relative = 0.8
    env_config: |
      RABBITMQ_LOGS=-
  service:
    type: node_port
    annotations:
      e2e.planton.dev/purpose: tuned-full
  auto_enable_all_feature_flags: true
  termination_grace_period_seconds: 60
  delay_start_seconds: 5
