syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesrabbitmq.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesrabbitmq/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesrabbitmq/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//kubernetes-rabbit-mq
message KubernetesRabbitMq {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesRabbitMq'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesRabbitMqSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesRabbitMqStatus status = 5;
}

//kubernetes-rabbit-mq status
message KubernetesRabbitMqStatus {
  // stack-outputs
  KubernetesRabbitMqStackOutputs outputs = 1;
}
