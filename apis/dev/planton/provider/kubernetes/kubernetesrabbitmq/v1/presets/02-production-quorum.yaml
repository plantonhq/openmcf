apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRabbitMq
metadata:
  name: prod-rabbitmq
spec:
  namespace:
    value: messaging
  create_namespace: true
  # 3 nodes: the quorum posture. Quorum queues and the Raft-based
  # metadata store survive one node loss; an even count would not
  # (a 2-node cluster loses availability when EITHER node fails).
  # Keep the count ODD (3, 5, 7) — and know the one-way door: the
  # operator does NOT support scaling down (removed brokers strand
  # their queue replicas); sizing down means migrating to a new
  # cluster.
  replicas: 3
  # PER-NODE data volume: queues, quorum-queue Raft logs and the
  # metadata store. PVCs cannot shrink — plan for growth. The
  # cluster's default StorageClass applies (no storage_class set;
  # the field accepts a KubernetesStorageClass reference).
  disk_size: 50Gi
  # Memory requests = limits ON PURPOSE: RabbitMQ derives its memory
  # high watermark from the container memory LIMIT — a gap between
  # the two triggers flow control at the wrong threshold. (The
  # operator's own defaults follow the same rule: 1 CPU / 2Gi
  # requests, 2 CPU / 2Gi limits.)
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # REQUIRED pod anti-affinity over hostnames: every broker on a
  # different Kubernetes node, so one node loss takes one broker —
  # not the quorum. A cluster with more replicas than schedulable
  # nodes sits Pending when this is on.
  spread_across_nodes: true
  # Enable all stable feature flags automatically after upgrades —
  # keeps the cluster upgrade-ready without manual flag management.
  auto_enable_all_feature_flags: true
  # NOT lowered here: termination_grace_period_seconds keeps the
  # operator's 604800 (7-day) default — deliberately generous so
  # draining nodes never lose messages.
