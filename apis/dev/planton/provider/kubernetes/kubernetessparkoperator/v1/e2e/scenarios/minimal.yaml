# Minimal operator install: chart defaults end to end — cluster-wide
# watch, the workload ClusterRole, the "spark" workload service account
# in the release namespace. The verifier runs THE JOB PROOF here too (a
# verifier-owned SparkApplication in the release namespace, where the
# cluster-wide posture plants the workload identity) — a job running to
# completion is the kind's definition of working, not an extra.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSparkOperator
metadata:
  name: e2e-sprkop-min
spec:
  namespace:
    value: e2e-sprkop-min
  createNamespace: true
