# Full surface: the FENCED workload posture (the chart CREATES the
# listed workload namespace, plants the service account and a
# namespace-scoped Role there, and the operator watches ONLY it — the
# multi-tenant shape), leader-elected standby replicas (exercising the
# module-owned leaderElection property), operator properties, and the
# hot-reload dynamic config. The verifier runs THE JOB PROOF inside the
# FENCED namespace — proving the watch fence and the per-namespace
# workload RBAC with the same job — and additionally asserts a
# SparkApplication OUTSIDE the fence is ignored (never reconciled).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSparkOperator
metadata:
  name: e2e-sprkop-full
spec:
  namespace:
    value: e2e-sprkop-full
  createNamespace: true
  chartVersion: 1.8.0
  replicas: 2
  workload:
    namespaces:
      - e2e-sprkop-jobs
    serviceAccount: spark
  operatorProperties:
    spark.kubernetes.operator.reconciler.intervalSeconds: "15"
  dynamicConfig:
    enabled: true
    properties:
      spark.kubernetes.operator.reconciler.intervalSeconds: "30"
