syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetessparkoperator.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetessparkoperator/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetessparkoperator/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//spark-operator-kubernetes
message KubernetesSparkOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesSparkOperator'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesSparkOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesSparkOperatorStatus status = 5;
}

//spark-operator-kubernetes status.
message KubernetesSparkOperatorStatus {
  //stack-outputs
  KubernetesSparkOperatorStackOutputs outputs = 1;
}
