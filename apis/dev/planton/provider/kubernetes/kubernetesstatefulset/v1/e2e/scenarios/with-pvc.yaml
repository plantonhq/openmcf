# One volume claim template mounted by the app container via a PVC source
# whose claim name matches the template name. storage_class stays unset so
# the kind cluster's default provisioner ("standard") serves the claim.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStatefulSet
metadata:
  name: e2e-sts-pvc
spec:
  namespace:
    value: e2e-sts-pvc-ns
  create_namespace: true
  container:
    app:
      image:
        repo: nginx
        tag: "1.27-alpine"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: http
          container_port: 80
          network_protocol: TCP
          app_protocol: http
          service_port: 80
      volume_mounts:
        - name: data
          mount_path: /data
          pvc:
            claim_name: data
  volume_claim_templates:
    - name: data
      size: "100Mi"
      access_modes:
        - ReadWriteOnce
