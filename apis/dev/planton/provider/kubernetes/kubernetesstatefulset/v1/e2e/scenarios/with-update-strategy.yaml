# Canary-by-ordinal update strategy: with partition 1 and 2 replicas, only
# pod -1 receives a new template during a rolling update; pod -0 keeps the
# old one until the partition is lowered to 0.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStatefulSet
metadata:
  name: e2e-sts-strategy
spec:
  namespace:
    value: e2e-sts-str-ns
  create_namespace: true
  container:
    app:
      image:
        repo: nginx
        tag: "1.27-alpine"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: http
          container_port: 80
          network_protocol: TCP
          app_protocol: http
          service_port: 80
  availability:
    replicas: 2
  update_strategy:
    type: RollingUpdate
    partition: 1
