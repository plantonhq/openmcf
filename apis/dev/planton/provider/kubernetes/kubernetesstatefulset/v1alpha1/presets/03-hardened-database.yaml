apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStatefulSet
metadata:
  name: my-hardened-database
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-database-image>"
        tag: "<your-image-tag>"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      ports:
        - name: db
          containerPort: 5432
          servicePort: 5432
      readinessProbe:
        tcpSocket:
          portNumber: 5432
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          portNumber: 5432
        initialDelaySeconds: 15
        periodSeconds: 10
      volumeMounts:
        - name: data
          mountPath: /var/lib/data
          pvc:
            claimName: data
        - name: tmp
          mountPath: /tmp
          emptyDir:
            sizeLimit: 128Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  pod:
    serviceAccount:
      valueFrom:
        kind: KubernetesServiceAccount
        name: "<your-service-account-resource>"
        fieldPath: "status.outputs.service_account_name"
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
  volumeClaimTemplates:
    - name: data
      size: 10Gi
      accessModes:
        - ReadWriteOnce
