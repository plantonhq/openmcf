# The kind-honest full surface against a composed PostgreSQL: the
# external database arm FK-composing the CloudNativePG fixture (host +
# password Secret under the chart's contract key `password`), internal
# Redis + filesystem storage (Valkey/SeaweedFS composition is
# plan-proven offline via the production preset and hack manifest — no
# honest stand-ins on this lane beyond the postgres fixture), two
# replicas of every stateless component, Trivy air-gap knobs, metrics
# on (no ServiceMonitor — the kind cluster runs no Prometheus Operator
# CRDs), and an escape-hatch entry. The same product proof runs against
# this shape — a registry that answers through scaled core/registry
# proves the composition path.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHarbor
metadata:
  name: e2e-harbor-full
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesPostgres"
spec:
  # JOINS the fixture-owned namespace (the CNPG fixture deploys first
  # with create_namespace and owns e2e-harbor); the scenario must NOT
  # also claim createNamespace — two owners of one namespace fail the
  # second create. Same convention as every fixture-sharing scenario.
  namespace:
    value: e2e-harbor
  externalUrl: http://127.0.0.1:18080
  database:
    external:
      host:
        valueFrom:
          name: e2e-harbor-pg
      username: harbor
      passwordSecretName:
        valueFrom:
          name: e2e-harbor-pg
      coreDatabase: registry
  cache:
    internal: {}
  storage:
    filesystem:
      diskSize: 5Gi
  trivy:
    skipUpdate: true
    offlineScan: true
    severity: HIGH,CRITICAL
  # Registry stays at 1 on filesystem (CEL: multi-replica registry
  # requires ReadWriteMany or an object-storage backend — kind's
  # default StorageClass is RWO). Core/portal/jobservice/nginx scale.
  core:
    replicas: 2
  portal:
    replicas: 2
  jobservice:
    replicas: 2
  nginx:
    replicas: 2
  metrics:
    enabled: true
  logLevel: info
  helmValues: |
    core:
      podAnnotations:
        e2e-lane: full-surface
