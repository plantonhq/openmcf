apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHarbor
metadata:
  name: harbor
spec:
  namespace:
    value: harbor
  createNamespace: true
  # THE ADDRESS OCI CLIENTS USE — Harbor binds token-service auth to it.
  # This preset assumes port-forward access (the exported
  # port_forward_command); put a real hostname here the moment an
  # exposure kind fronts the install.
  externalUrl: http://localhost:8080
  database:
    internal: {}
  cache:
    internal: {}
  storage:
    filesystem:
      diskSize: 20Gi
