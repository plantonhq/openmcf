apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRabbitMqOperator
metadata:
  name: rabbitmq-operator
spec:
  # Empty = the operator watches ALL namespaces (the upstream default).
  # Entries fence the watch (rendered as the OPERATOR_SCOPE_NAMESPACE
  # env, comma-separated) — every namespace that will hold
  # KubernetesRabbitMq resources must be covered; clusters elsewhere
  # are silently ignored.
  watch_namespaces:
    - messaging
    - integrations
