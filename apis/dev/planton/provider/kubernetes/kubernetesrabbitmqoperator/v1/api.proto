syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesrabbitmqoperator.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesrabbitmqoperator/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesrabbitmqoperator/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//kubernetes-rabbit-mq-operator
message KubernetesRabbitMqOperator {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesRabbitMqOperator'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesRabbitMqOperatorSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesRabbitMqOperatorStatus status = 5;
}

//kubernetes-rabbit-mq-operator status
message KubernetesRabbitMqOperatorStatus {
  // stack-outputs
  KubernetesRabbitMqOperatorStackOutputs outputs = 1;
}
