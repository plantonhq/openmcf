# Every patched Deployment surface at once: a fenced watch scope, both
# fleet-wide default-image overrides (pointed at the SAME upstream images
# — the patch mechanics are what this lane proves, not a mirror), a
# resources override, and tolerations that match nothing (verifying the
# pod still schedules with them present).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRabbitMqOperator
metadata:
  name: e2e-rmqop-tuned
spec:
  watch_namespaces:
    - e2e-rmqop-watched
  default_rabbitmq_image: rabbitmq:4.2.6-management
  default_user_updater_image: ghcr.io/rabbitmq/default-user-credential-updater:1.0.14
  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits:
      cpu: 500m
      memory: 1Gi
  tolerations:
    - key: e2e-only
      operator: Exists
      effect: NoSchedule
