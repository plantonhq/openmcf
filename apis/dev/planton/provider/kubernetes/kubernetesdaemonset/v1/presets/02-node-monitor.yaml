apiVersion: kubernetes.planton.dev/v1
kind: KubernetesDaemonSet
metadata:
  name: my-node-monitor
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-node-monitor-image>"
        tag: "<your-image-tag>"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      ports:
        - name: metrics
          containerPort: 9100
          hostPort: 9100
      volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          mountPath: /host/sys
          readOnly: true
          hostPath:
            path: /sys
            type: Directory
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["SYS_PTRACE", "SYS_RESOURCE"]
  pod:
    hostNetwork: true
    hostPid: true
    dnsPolicy: ClusterFirstWithHostNet
    scheduling:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
