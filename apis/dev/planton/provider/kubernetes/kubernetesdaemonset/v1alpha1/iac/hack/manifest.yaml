# Local development / offline-proof manifest exercising the full spec surface,
# including arms the live E2E scenarios exclude — the offline tofu plan and
# pulumi preview proofs run against this file.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDaemonSet
metadata:
  name: hack-daemonset
  id: hack-daemonset-id
  org: hack-org
  env: hack-env
spec:
  namespace:
    value: hack-daemonset-ns
  create_namespace: true
  container:
    app:
      image:
        repo: busybox
        tag: "1.36"
      image_pull_policy: IfNotPresent
      working_dir: /
      command: ["/bin/sh", "-c"]
      args: ["while true; do ls /host/var/log >/dev/null 2>&1; sleep 30; done"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: metrics
          container_port: 9100
          network_protocol: TCP
          host_port: 9100
      env:
        variables:
          - name: LOG_LEVEL
            value: info
          - name: NODE_NAME
            field_ref:
              field_path: spec.nodeName
          - name: CPU_LIMIT
            resource_field_ref:
              resource: limits.cpu
        secrets:
          - name: AGENT_TOKEN
            value: hack-token
        env_from:
          - config_map_ref:
              name: hack-env-config
              optional: true
      liveness_probe:
        exec:
          command: ["/bin/sh", "-c", "true"]
        initial_delay_seconds: 5
        period_seconds: 10
      readiness_probe:
        exec:
          command: ["/bin/sh", "-c", "true"]
        period_seconds: 5
      startup_probe:
        exec:
          command: ["/bin/sh", "-c", "true"]
        failure_threshold: 30
        period_seconds: 2
      volume_mounts:
        - name: varlog
          mount_path: /host/var/log
          read_only: true
          host_path:
            path: /var/log
            type: Directory
        - name: runtime-sock
          mount_path: /run/containerd/containerd.sock
          read_only: true
          host_path:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: scratch
          mount_path: /scratch
          empty_dir:
            medium: Memory
            size_limit: 32Mi
      lifecycle:
        post_start:
          exec:
            command: ["/bin/sh", "-c", "true"]
        pre_stop:
          exec:
            command: ["/bin/sleep", "5"]
      security_context:
        run_as_non_root: false
        read_only_root_filesystem: true
        allow_privilege_escalation: false
        capabilities:
          drop: ["ALL"]
          add: ["SYS_PTRACE"]
        seccomp_profile:
          type: RuntimeDefault
    sidecars:
      - name: buffer-shipper
        image:
          repo: busybox
          tag: "1.36"
        command: ["/bin/sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: "5m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
        volume_mounts:
          - name: scratch
            mount_path: /scratch
  pod:
    service_account:
      value: hack-service-account
    automount_service_account_token: false
    image_pull_secrets:
      - value: hack-registry-secret
    init_containers:
      - name: init-hostcheck
        image:
          repo: busybox
          tag: "1.36"
        command: ["/bin/sh", "-c", "echo init done"]
    labels:
      team: hack
    annotations:
      example.org/owner: hack
    scheduling:
      node_selector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: hack
          effect: NoExecute
          toleration_seconds: 300
      node_affinity:
        required:
          - match_expressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["arm64", "amd64"]
    security_context:
      run_as_user: 0
      fs_group: 0
      sysctls:
        - name: net.core.somaxconn
          value: "1024"
    termination_grace_period_seconds: 60
    dns_policy: ClusterFirstWithHostNet
    dns_config:
      options:
        - name: ndots
          value: "2"
    host_aliases:
      - ip: 203.0.113.10
        hostnames: ["legacy.internal.example"]
    host_network: true
    host_pid: true
    priority_class_name: ""
    runtime_class_name: ""
  update_strategy:
    type: RollingUpdate
    max_unavailable: "1"
  min_ready_seconds: 5
  revision_history_limit: 5
