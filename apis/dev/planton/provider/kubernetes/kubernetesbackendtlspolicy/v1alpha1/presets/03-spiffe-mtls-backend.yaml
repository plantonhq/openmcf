apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesBackendTlsPolicy
metadata:
  name: my-backend-tls
spec:
  namespace:
    # The policy can only target Services in ITS OWN namespace — create it
    # where the backend Service lives.
    value: <backend-namespace>
  targetRefs:
    - group: "" # Services live in the core API group — empty but present
      kind: Service
      # Foreign key to the Planton-managed backend Service. Use `value:`
      # for a literal name when the Service is not Planton-managed.
      name:
        valueFrom:
          kind: KubernetesService
          name: <backend-service-resource>
          fieldPath: status.outputs.service_name
      # Narrow the policy to ONE named Service port — only connections to
      # this port get the TLS treatment. The port name must exist on the
      # Service or the policy fails to attach (ResolvedRefs condition).
      sectionName: https
  validation:
    caCertificateRefs:
      # The mesh/workload CA bundle (e.g. the SPIRE trust bundle) in a
      # ConfigMap under a key named `ca.crt`.
      - group: "" # ConfigMaps live in the core API group — empty but present
        kind: ConfigMap
        name:
          valueFrom:
            kind: KubernetesConfigMap
            name: <trust-bundle-configmap-resource>
            fieldPath: status.outputs.configmap_name
    # With subjectAltNames set, the hostname ONLY selects the certificate
    # (SNI) — it no longer authenticates the backend.
    hostname: backend.internal.example.com
    subjectAltNames:
      # The backend certificate must prove this SPIFFE ID — the mTLS-mesh
      # identity pattern where certificate identity differs from the SNI.
      - type: URI
        uri: spiffe://cluster.example.com/ns/payments/sa/backend
