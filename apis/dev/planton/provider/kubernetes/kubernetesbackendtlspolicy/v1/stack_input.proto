syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesbackendtlspolicy.v1;

import "dev/planton/provider/kubernetes/kubernetesbackendtlspolicy/v1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// Input for the KubernetesBackendTlsPolicy IaC stack. The platform resolves
// all StringValueOrRef references (namespace, target Service names, CA
// ConfigMap names) to literal strings before passing this to the IaC engine.
message KubernetesBackendTlsPolicyStackInput {
  // Target cloud-resource.
  KubernetesBackendTlsPolicy target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
