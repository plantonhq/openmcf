syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesloki.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesloki/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesloki/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//loki-kubernetes
message KubernetesLoki {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesLoki'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesLokiSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesLokiStatus status = 5;
}

//loki-kubernetes status.
message KubernetesLokiStatus {
  //stack-outputs
  KubernetesLokiStackOutputs outputs = 1;
}
