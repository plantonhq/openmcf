# THE durability proof: push a log line, DELETE the Loki pod, wait for a
# REPLACEMENT pod (a new UID — status flapping Ready on the dying pod is
# not recovery), and query the line back through LogQL — logs surviving
# pod loss through the PersistentVolume is the proof. A single monolithic
# replica on filesystem storage (a persistent volume) is the honest shape
# for this on a single-node kind cluster.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLoki
metadata:
  name: e2e-loki-dur
spec:
  namespace:
    value: e2e-loki-dur
  create_namespace: true
  monolithic:
    replicas: 1
    disk_size: 2Gi
  # Kind-honest cache sizing: the chart's default 8192MB chunks cache
  # requests 9830Mi (1.2×) — unschedulable on a small node, and the
  # atomic install rolls back the whole release (verified live).
  caching:
    chunks_cache_memory_mb: 128
    results_cache_memory_mb: 128
