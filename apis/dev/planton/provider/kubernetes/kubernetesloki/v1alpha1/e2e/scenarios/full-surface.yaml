# Kind-honest full surface: a single monolithic replica on filesystem
# (object-storage backends compose with an in-cluster KubernetesSeaweedFs —
# plan-proven only here, a deferred-ledger row), with the config surface
# that needs no external dependency exercised — retention, ingestion
# limits, tuned caches, and the gateway's multi-tenant basic-auth path
# (bcrypt password hashes are one-way, so no Secret fixture is needed). The
# canary stays on (the chart default) and the push→LogQL round-trip runs
# AS the declared tenant: with tenants present the gateway auth-guards
# every push/query route and derives X-Scope-OrgID from the authenticated
# user, so the verifier signs in as the first tenant with the plaintext
# twin of the hash below — the paired-credential contract both sides keep.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLoki
metadata:
  name: e2e-loki-full
spec:
  namespace:
    value: e2e-loki-full
  create_namespace: true
  monolithic:
    replicas: 1
    disk_size: 2Gi
  retention_period: 48h
  limits:
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 12
    max_global_streams_per_user: 10000
    max_query_lookback: 168h
  caching:
    chunks_cache_memory_mb: 128
    results_cache_memory_mb: 128
  multi_tenancy:
    enabled: true
    tenants:
      # bcrypt htpasswd hash of "e2e-password" — the plaintext twin the
      # verifier signs in with (the paired-credential contract). Generated
      # AND verified with:
      #   htpasswd -nbBC 10 team-a e2e-password
      #   htpasswd -vbB <file> team-a e2e-password
      # Always run the -v verification after regenerating: a hash that was
      # never verified against its claimed plaintext is how this pairing
      # silently breaks (caught live — the previous hash did not match).
      - name: team-a
        password_hash: "$2y$10$V4/HMXjwxjNpt2Hv5UL09uDawiR455lVelnXDiM1n/ijQMFB5owiS"
