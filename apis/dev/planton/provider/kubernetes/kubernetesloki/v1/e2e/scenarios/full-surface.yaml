# Kind-honest full surface: a single monolithic replica on filesystem
# (object-storage backends compose with an in-cluster KubernetesSeaweedFs —
# plan-proven only here, a deferred-ledger row), with the config surface
# that needs no external dependency exercised — retention, ingestion
# limits, tuned caches, and the gateway's multi-tenant basic-auth path
# (bcrypt password hashes are one-way, so no Secret fixture is needed). The
# canary stays on (the chart default) and the push→LogQL round-trip runs
# through the tenant header.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesLoki
metadata:
  name: e2e-loki-full
spec:
  namespace:
    value: e2e-loki-full
  create_namespace: true
  monolithic:
    replicas: 1
    disk_size: 2Gi
  retention_period: 48h
  limits:
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 12
    max_global_streams_per_user: 10000
    max_query_lookback: 168h
  caching:
    chunks_cache_memory_mb: 128
    results_cache_memory_mb: 128
  multi_tenancy:
    enabled: true
    tenants:
      # bcrypt htpasswd hash of "e2e-password" (a one-way hash, safe in a
      # manifest — generated with `htpasswd -nbBC10 team-a e2e-password`).
      - name: team-a
        password_hash: "$2y$10$7O40CaY1yz7fu9O24k2/u.ct/wELYHRBsn25v/7AyuQ8E8hrLqpva"
