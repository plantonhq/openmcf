# THE durability proof: push a log line, DELETE the Loki pod, wait for a
# REPLACEMENT pod (a new UID — status flapping Ready on the dying pod is
# not recovery), and query the line back through LogQL — logs surviving
# pod loss through the PersistentVolume is the proof. A single monolithic
# replica on filesystem storage (a persistent volume) is the honest shape
# for this on a single-node kind cluster.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesLoki
metadata:
  name: e2e-loki-dur
spec:
  namespace:
    value: e2e-loki-dur
  create_namespace: true
  monolithic:
    replicas: 1
    disk_size: 2Gi
