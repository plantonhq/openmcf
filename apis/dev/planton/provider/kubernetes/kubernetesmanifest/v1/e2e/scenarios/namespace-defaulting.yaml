# Proves the anchor-namespace contract live: a namespaced document WITHOUT
# an explicit metadata.namespace must land in spec.namespace on BOTH engines
# (Pulumi provider-level default / Terraform per-document override), while a
# cluster-scoped document passes through untouched.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesManifest
metadata:
  name: e2e-manifest-anchored
spec:
  namespace:
    value: e2e-manifest-anchored-ns
  create_namespace: true
  manifest_yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: e2e-anchored-config
    data:
      anchored: "true"
    ---
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    metadata:
      name: e2e-manifest-anchored-priority
    value: 1000
    description: cluster-scoped document applied by the anchored-manifest scenario
