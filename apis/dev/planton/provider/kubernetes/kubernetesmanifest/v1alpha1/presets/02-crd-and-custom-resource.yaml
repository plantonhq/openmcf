apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesManifest
metadata:
  name: crd-and-custom-resource
spec:
  namespace:
    value: crontab-demo
  create_namespace: true
  manifest_yaml: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: crontabs.stable.example.com
    spec:
      group: stable.example.com
      scope: Namespaced
      names:
        plural: crontabs
        singular: crontab
        kind: CronTab
        shortNames:
          - ct
      versions:
        - name: v1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    cronSpec:
                      type: string
                    image:
                      type: string
    ---
    apiVersion: stable.example.com/v1
    kind: CronTab
    metadata:
      name: sample-crontab
    spec:
      cronSpec: "*/5 * * * *"
      image: my-cron-image:1.0
