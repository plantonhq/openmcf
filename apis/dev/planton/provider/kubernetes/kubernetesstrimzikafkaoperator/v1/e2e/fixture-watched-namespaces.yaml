# The tuned-full scenario's watched namespaces. The chart templates
# RoleBindings into every watched namespace, so they must exist BEFORE
# the install (verified live: a fence naming a missing namespace fails
# the release with "namespaces ... not found").
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: e2e-stz-watched-a
spec:
  name: e2e-stz-watched-a
---
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNamespace
metadata:
  name: e2e-stz-watched-b
spec:
  name: e2e-stz-watched-b
