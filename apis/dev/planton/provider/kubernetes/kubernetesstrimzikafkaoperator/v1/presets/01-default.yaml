apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStrimziKafkaOperator
metadata:
  name: strimzi-operator # also the Helm release name
spec:
  namespace:
    # Own-namespace watch (the chart default): KubernetesKafka clusters
    # are declared in THIS namespace. Set watch.any_namespace or
    # watch.namespaces to widen instead.
    value: kafka
  create_namespace: true # the module creates (and owns) the namespace
  chart_version: "1.1.0" # spec default — chart and operator move together; pin deliberately
