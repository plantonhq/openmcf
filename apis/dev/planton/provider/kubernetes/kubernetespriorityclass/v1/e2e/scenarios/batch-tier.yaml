# The non-preempting batch tier: negative value (always yields to services)
# and preemption disabled (jumps the queue but never evicts running pods).
# Deliberately NOT a global default — the test cluster's scheduling must not
# change for other scenarios.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPriorityClass
metadata:
  name: e2e-pc-batch
spec:
  name: e2e-pc-batch
  value: -100
  description: Batch workloads; always preemptable, never preempts.
  preemption_policy: never
