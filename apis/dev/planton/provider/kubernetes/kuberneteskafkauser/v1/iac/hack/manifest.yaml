# Full-surface development manifest: SCRAM authentication, a
# producer+consumer ACL set spanning literal and prefix patterns plus a
# consumer group, and every quota field.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaUser
metadata:
  name: analytics-pipeline
spec:
  namespace:
    value: kafka-hack
  kafkaCluster:
    value: kafka-hack
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: orders.v1_events
        operations:
          - Read
          - Describe
        host: "*"
      - resource:
          type: topic
          name: analytics.
          patternType: prefix
        operations:
          - Write
          - Create
          - Describe
          - IdempotentWrite
      - resource:
          type: group
          name: analytics-pipeline
        operations:
          - Read
      - resource:
          type: cluster
        operations:
          - DescribeConfigs
  quotas:
    producerByteRate: 1048576
    consumerByteRate: 2097152
    requestPercentage: 55
    controllerMutationRate: 10
