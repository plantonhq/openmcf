# Consumer-scoped Kafka fixture for the KubernetesKafkaUser lanes: a
# single dual-role node with the entity operators ON (the user operator
# is what reconciles the scenarios' users), a SCRAM-SHA-512 listener on
# 9094 for the wire-level authentication proof, and simple authorization
# so the declared ACLs actually gate access.
#
# super_users carries User:ANONYMOUS deliberately: the verifier's
# admin-side operations (topic describe over the plain listener) stay
# usable while the SCRAM proof authenticates as the declared user —
# production presets NEVER do this. User scenarios MUST deploy into THIS
# fixture's namespace — the user operator watches only there (the
# placement contract on the KubernetesKafkaUser spec).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafka
metadata:
  name: e2e-kafauth-fix
spec:
  namespace:
    value: e2e-kafauth-fix
  create_namespace: true
  node_pools:
    - name: dual
      roles:
        - controller
        - broker
      replicas: 1
      storage:
        size: 2Gi
        delete_claim: true
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1536Mi
  listeners:
    - name: plain
      port: 9092
      tls: false
    - name: scram
      port: 9094
      tls: false
      authentication:
        type: scram-sha-512
  config:
    default.replication.factor: "1"
    min.insync.replicas: "1"
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"
    auto.create.topics.enable: "true"
  authorization:
    type: simple
    super_users:
      - User:ANONYMOUS
  jvm:
    xms: 512m
    xmx: 512m
