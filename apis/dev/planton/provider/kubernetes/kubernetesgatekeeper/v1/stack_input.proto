syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesgatekeeper.v1;

import "dev/planton/provider/kubernetes/kubernetesgatekeeper/v1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// KubernetesGatekeeperStackInput defines the inputs required for the IaC modules.
message KubernetesGatekeeperStackInput {
