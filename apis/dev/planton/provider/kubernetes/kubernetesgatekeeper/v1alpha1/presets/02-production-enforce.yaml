apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGatekeeper
metadata:
  name: gatekeeper
spec:
  namespace:
    value: gatekeeper-system
  createNamespace: true
  replicas: 3
  validatingWebhook:
    failurePolicy: Fail
    timeoutSeconds: 5
  audit:
    intervalSeconds: 120
    matchKindOnly: true
    constraintViolationsLimit: 50
  exemptNamespacePrefixes:
    - kube-
  engine:
    logDenies: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
