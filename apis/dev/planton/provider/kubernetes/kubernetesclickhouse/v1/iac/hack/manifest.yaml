apiVersion: kubernetes.planton.dev/v1
kind: KubernetesClickHouse
metadata:
  name: clickhouse-dev
spec:
  namespace:
    value: clickhouse-dev
  createNamespace: true
  version: "25.3"
  shards: 1
  replicas: 2
  diskSize: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  users:
    - name: app
      password:
        value: Ch4ngeMe-app
