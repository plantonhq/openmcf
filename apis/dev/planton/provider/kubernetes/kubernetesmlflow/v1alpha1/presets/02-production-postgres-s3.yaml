apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMlflow
metadata:
  name: mlflow
spec:
  namespace:
    value: mlflow
  # Co-located with the composed database and object store below: the
  # module reads their credential Secrets, and Secrets can only be
  # consumed from the workload's OWN namespace. Deploy the
  # KubernetesPostgres named `mlflow-db` (bootstrap database `mlflow`,
  # owner `mlflow`) and the KubernetesSeaweedFs named `artifacts`
  # (declaring the `mlflow-artifacts` bucket under `s3.buckets`) into
  # this same namespace.
  create_namespace: true
  server:
    # Stateless once both stores are external — scale for API load.
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
  backend_store:
    postgres:
      # The references resolve to the KubernetesPostgres resource's
      # read-write Service (always the current primary) and its
      # operator-maintained application-credential Secret (key
      # `password`) — the reference defaults, no field paths needed.
      host:
        valueFrom:
          name: mlflow-db
      password_secret:
        secret_name:
          valueFrom:
            name: mlflow-db
  artifact_store:
    s3_compatible:
      # The references resolve to the KubernetesSeaweedFs resource's
      # S3 endpoint and its chart-owned credentials Secret — the
      # reference defaults again.
      endpoint:
        valueFrom:
          name: artifacts
      bucket: mlflow-artifacts
      credentials_secret:
        secret_name:
          valueFrom:
            name: artifacts
  auth:
    # Private-by-default: every experiment is invisible to other users
    # until its creator shares it.
    default_permission: NO_PERMISSIONS
  gc:
    # Hard-delete soft-deleted runs after their 30-day undo window —
    # keeps the tracking database and the artifact bucket from growing
    # without bound.
    enabled: true
