# The widest honest surface on the shared cluster: the backend store on
# the composed PostgreSQL fixture and the artifacts in the composed
# SeaweedFS bucket (one valueFrom per field — the apply-time URI
# composition and the env-wired store credentials both live), tuned
# auth (custom admin username, private-by-default permissions), the gc
# CronJob, metrics exposed (the ServiceMonitor arm stays plan-proven —
# no Prometheus operator CRDs on this lane), server workers/sizing and
# the env/args escape hatches. The verifier runs the same auth-gate +
# tracking proof — on THIS lane state lands in PostgreSQL and the
# artifact bytes in SeaweedFS.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMlflow
metadata:
  name: e2e-mlfw-full
spec:
  namespace:
    value: e2e-mlflow
  server:
    workers: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  backend_store:
    postgres:
      host:
        valueFrom:
          name: e2e-mlfw-pg
      password_secret:
        secret_name:
          valueFrom:
            name: e2e-mlfw-pg
  artifact_store:
    s3_compatible:
      endpoint:
        valueFrom:
          name: e2e-mlfw-s3
      bucket: mlflow-artifacts
      prefix: e2e-full
      credentials_secret:
        secret_name:
          valueFrom:
            name: e2e-mlfw-s3
  auth:
    admin_username: mlops
    default_permission: NO_PERMISSIONS
  gc:
    enabled: true
    schedule: "0 4 * * *"
    older_than: 24h
  metrics:
    enabled: true
  extra_env:
    MLFLOW_HTTP_REQUEST_TIMEOUT: "120"
