# THE STATE PROOF lane: PostgreSQL backend + SeaweedFS artifacts (the
# production shape), with the verifier's behavioral arm switched on by
# this scenario's name — after the tracking proof, the server pod is
# deleted (UID-verified replacement) and a fresh session must find the
# same experiment, the same run's metric, and re-download the same
# artifact bytes: tracking state lives in the composed database and the
# artifacts in the composed object store, never in the pod.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMlflow
metadata:
  name: e2e-mlfw-state
spec:
  namespace:
    value: e2e-mlflow
  backend_store:
    postgres:
      host:
        valueFrom:
          name: e2e-mlfw-pg
      password_secret:
        secret_name:
          valueFrom:
            name: e2e-mlfw-pg
  artifact_store:
    s3_compatible:
      endpoint:
        valueFrom:
          name: e2e-mlfw-s3
      bucket: mlflow-artifacts
      prefix: e2e-state
      credentials_secret:
        secret_name:
          valueFrom:
            name: e2e-mlfw-s3
