# Consumer-scoped SeaweedFS fixture for the KubernetesMlflow lanes —
# the composed S3-compatible artifact store:
# - JOINS the fixture-owned namespace (the PostgreSQL fixture deploys
#   first with create_namespace and owns e2e-mlflow — exactly one
#   fixture owns a shared namespace; a second creator would fail
#   AlreadyExists at deploy).
# - SHARED NAMESPACE (e2e-mlflow): co-located because the module wires
#   the store's credential Secret into the server pod as env vars, and
#   a secretKeyRef can only reach Secrets in the pod's own namespace.
# - ONE BUCKET: `mlflow-artifacts` is declared at install (an artifact
#   destination must exist before the first upload).
# - The chart-owned `e2e-mlfw-s3-s3-secret` credentials Secret (keys
#   admin_access_key_id/admin_secret_access_key) is the composition
#   target of the scenarios' credential references.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSeaweedFs
metadata:
  name: e2e-mlfw-s3
spec:
  namespace:
    value: e2e-mlflow
  s3:
    buckets:
      - name: mlflow-artifacts
