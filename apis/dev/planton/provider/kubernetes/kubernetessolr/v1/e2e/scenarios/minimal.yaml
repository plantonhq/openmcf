# The dev shape: one Solr node on a single-member provided ZooKeeper,
# ephemeral storage. The smallest declarable SolrCloud that actually
# serves.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSolr
metadata:
  name: e2e-solr-min
spec:
  namespace:
    value: e2e-solr-min
  create_namespace: true
  replicas: 1
  version: 9.10.0
  java_mem: -Xms300m -Xmx300m
  zookeeper:
    provided:
      replicas: 1
  storage:
    ephemeral: {}
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi
