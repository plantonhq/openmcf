apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSolr
metadata:
  name: backup-solr
spec:
  namespace:
    value: solr
  create_namespace: true
  replicas: 3
  version: 9.10.0
  java_mem: -Xms2g -Xmx2g
  zookeeper:
    provided:
      replicas: 3
  storage:
    persistent:
      size: 100Gi
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 4Gi
  security:
    authentication_type: basic
  # The backup surface: repositories registered on the cluster that
  # SolrBackup operations write to. Registered at cluster creation —
  # adding one later is a rolling restart.
  backup_repositories:
    - name: s3-backups
      s3:
        region: us-west-2
        bucket: my-solr-backups
        # Chroot within the bucket — lets one bucket serve several
        # clusters without collisions.
        base_location: /backups/prod
        # Static credentials read from existing Secrets at pod start —
        # the keys themselves never appear in this manifest.
        #
        # THE KEYLESS PATH: on EKS with IRSA (an identity-bound
        # ServiceAccount granting bucket access to the Solr pods),
        # DELETE this credentials block — the S3 client falls back to
        # the ambient AWS identity and no static credential exists.
        credentials:
          access_key_id_secret:
            name: solr-s3-credentials
            key: access-key-id
          secret_access_key_secret:
            name: solr-s3-credentials
            key: secret-access-key
  # No backup module here on purpose: modules required by a declared
  # backup repository load AUTOMATICALLY. solr_modules is for the
  # others (analytics, ltr, ...).
  solr_modules: []
