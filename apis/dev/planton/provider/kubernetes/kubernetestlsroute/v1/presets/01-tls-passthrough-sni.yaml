apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTlsRoute
metadata:
  name: my-tls-route
spec:
  namespace:
    value: app-ns
  parentRefs:
    # Foreign key: `value:` for a literal Gateway name, `valueFrom:` (kind
    # KubernetesGateway, fieldPath status.outputs.gateway_name) to reference a
    # Planton-managed Gateway and deploy in dependency order.
    - name:
        value: <gateway-name>
      sectionName: tls
  hostnames:
    - secure.example.com
  rules:
    - backendRefs:
        # Also a foreign key: `value:` for a literal Service name, `valueFrom:`
        # for a Planton-managed KubernetesService.
        - name:
            value: <service-name>
          port: 8443
