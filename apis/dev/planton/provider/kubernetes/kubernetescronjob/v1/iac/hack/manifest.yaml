# Local development / offline-proof manifest exercising the full spec surface,
# including arms the live E2E scenarios exclude — the offline tofu plan and
# pulumi preview proofs run against this file.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCronJob
metadata:
  name: hack-cronjob
  id: hack-cronjob-id
  org: hack-org
  env: hack-env
spec:
  namespace:
    value: hack-cronjob-ns
  create_namespace: true
  schedule: "*/15 * * * *"
  time_zone: America/New_York
  starting_deadline_seconds: 300
  concurrency_policy: Replace
  suspend: false
  successful_jobs_history_limit: 5
  failed_jobs_history_limit: 2
  job_template:
    container:
      app:
        image:
          repo: busybox
          tag: "1.36"
        image_pull_policy: IfNotPresent
        working_dir: /work
        command: ["/bin/sh", "-c"]
        args: ["echo run index $JOB_COMPLETION_INDEX && cat /work/marker.txt && echo done"]
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        env:
          variables:
            - name: SYNC_TARGET
              value: hack-target
            - name: POD_NAME
              field_ref:
                field_path: metadata.name
            - name: MEM_LIMIT
              resource_field_ref:
                resource: limits.memory
          secrets:
            - name: API_TOKEN
              value: hack-token
            - name: DB_PASSWORD
              secret_ref:
                name: hack-existing-secret
                key: password
          env_from:
            - config_map_ref:
                name: hack-env-config
                optional: true
        volume_mounts:
          - name: work
            mount_path: /work
            empty_dir:
              size_limit: 32Mi
          - name: host-data
            mount_path: /host-data
            read_only: true
            host_path:
              path: /var/tmp
              type: Directory
        lifecycle:
          post_start:
            exec:
              command: ["/bin/sh", "-c", "true"]
        security_context:
          run_as_non_root: true
          read_only_root_filesystem: false
          allow_privilege_escalation: false
          capabilities:
            drop: ["ALL"]
          seccomp_profile:
            type: RuntimeDefault
      sidecars:
        # Sidecars in a run's pod must exit for the Job to complete; this one does.
        - name: log-flusher
          image:
            repo: busybox
            tag: "1.36"
          command: ["/bin/sh", "-c", "echo logs flushed"]
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          volume_mounts:
            - name: work
              mount_path: /work
    pod:
      service_account:
        value: hack-service-account
      automount_service_account_token: false
      image_pull_secrets:
        - value: hack-registry-secret
      init_containers:
        - name: init-marker
          image:
            repo: busybox
            tag: "1.36"
          command: ["/bin/sh", "-c", "echo prepared > /work/marker.txt"]
          volume_mounts:
            - name: work
              mount_path: /work
      labels:
        team: hack
      annotations:
        example.org/owner: hack
      scheduling:
        node_selector:
          kubernetes.io/os: linux
        tolerations:
          - key: dedicated
            operator: Equal
            value: batch
            effect: NoSchedule
        node_affinity:
          preferred:
            - weight: 50
              term:
                match_expressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64", "amd64"]
        pod_anti_affinity:
          preferred:
            - weight: 100
              term:
                match_labels:
                  app: hack-cronjob
                topology_key: kubernetes.io/hostname
        topology_spread_constraints:
          - max_skew: 1
            topology_key: topology.kubernetes.io/zone
            when_unsatisfiable: ScheduleAnyway
      security_context:
        run_as_user: 1000
        run_as_group: 1000
        run_as_non_root: true
        fs_group: 1000
        fs_group_change_policy: OnRootMismatch
      termination_grace_period_seconds: 30
      dns_policy: ClusterFirst
      dns_config:
        options:
          - name: ndots
            value: "2"
      host_aliases:
        - ip: 203.0.113.10
          hostnames: ["legacy.internal.example"]
      priority_class_name: ""
      runtime_class_name: ""
    parallelism: 2
    completions: 4
    completion_mode: Indexed
    backoff_limit: 6
    backoff_limit_per_index: 2
    max_failed_indexes: 1
    active_deadline_seconds: 600
    ttl_seconds_after_finished: 3600
    restart_policy: Never
    pod_failure_policy:
      rules:
        - action: FailJob
          on_exit_codes:
            container_name: ""
            operator: In
            values: [42]
        - action: FailIndex
          on_exit_codes:
            container_name: log-flusher
            operator: NotIn
            values: [1, 2]
        - action: Ignore
          on_pod_conditions:
            - type: DisruptionTarget
              status: "True"
        - action: Count
          on_pod_conditions:
            - type: ConfigIssue
              status: Unknown
    # success_policy is deliberately absent here: the offline plan proof runs
    # through BOTH engines from this one manifest, and the Terraform provider
    # cannot express success_policy (see the PARITY-EXCEPTION in the modules).
