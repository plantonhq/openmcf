# Suspended CronJob: the object deploys, exports its outputs, and never
# fires — fast and fully deterministic on any cluster.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCronJob
metadata:
  name: e2e-cronjob-suspended
spec:
  namespace:
    value: e2e-cronjob-suspended-ns
  create_namespace: true
  schedule: "0 0 1 1 *"
  suspend: true
  job_template:
    container:
      app:
        image:
          repo: busybox
          tag: "1.36"
        command:
          - /bin/sh
          - -c
          - echo "never-runs"
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
    restart_policy: Never
    backoff_limit: 1
