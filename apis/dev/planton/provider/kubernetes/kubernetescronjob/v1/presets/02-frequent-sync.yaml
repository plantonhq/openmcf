apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCronJob
metadata:
  name: my-frequent-sync
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  schedule: "*/15 * * * *"
  # A run that cannot start within 5 minutes of its slot is skipped — the
  # next slot is at most 10 minutes away and will carry fresher data anyway.
  # The explicit deadline also keeps the controller's missed-run counter
  # bounded (it stops scheduling entirely after 100 consecutive misses).
  startingDeadlineSeconds: 300
  # Replace: a sync only cares about the latest state, so when a run
  # overruns into the next slot, the stale run is cancelled and the fresh
  # one starts — unlike Forbid (which would skip the fresh run) or Allow
  # (which would race two syncs against the same target).
  concurrencyPolicy: Replace
  jobTemplate:
    container:
      app:
        image:
          repo: "<your-container-registry>/<your-sync-image>"
          tag: "<your-image-tag>"
        command:
          - /bin/sh
          - -c
          - "<your-sync-command>"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    restartPolicy: Never
    backoffLimit: 1
