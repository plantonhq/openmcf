apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCronJob
metadata:
  name: my-nightly-backup
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  schedule: "0 3 * * *"
  timeZone: "<your-iana-time-zone>"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    container:
      app:
        image:
          repo: "<your-container-registry>/<your-backup-image>"
          tag: "<your-image-tag>"
        command:
          - /bin/sh
          - -c
          - "<your-backup-command>"
        env:
          variables:
            - name: BACKUP_TARGET
              value: "<your-backup-destination>"
          secrets:
            - name: DATABASE_PASSWORD
              secretRef:
                name: "<your-existing-secret-name>"
                key: "<your-secret-key>"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    restartPolicy: Never
    backoffLimit: 2
    # A hung backup is killed after two hours so it cannot silently block
    # every subsequent run under the Forbid policy.
    activeDeadlineSeconds: 7200
