apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterAutoscaler
metadata:
  name: cluster-autoscaler
spec:
  namespace:
    value: kube-system # upstream convention
  createNamespace: false
  chartVersion: "9.59.0" # spec default — pin deliberately
  azure:
    subscriptionId: '<azure-subscription-id>'
    # For AKS this is the NODE resource group — the MC_* group holding
    # the VMSS instances, not the group the cluster resource lives in.
    resourceGroup: '<node-resource-group>'
    # Tag-based VMSS auto-discovery for this cluster (scale sets tagged
    # per upstream's Azure auto-discovery setup).
    clusterName: '<cluster-name>'
    identity:
      # Federated workload identity (recommended): the autoscaler's
      # service account exchanges its token for the federated Entra
      # application — configured Azure-side, no stored secret.
      useWorkloadIdentity: true
  scaling:
    expander: least-waste # the common production choice (upstream default is random)
