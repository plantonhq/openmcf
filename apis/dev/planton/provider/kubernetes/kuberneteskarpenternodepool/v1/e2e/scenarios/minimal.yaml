# Minimal NodePool on the aws-eks real-cluster profile: a general-purpose
# on-demand pool referencing the sibling EC2NodeClass through the foreign
# key. Object-grade: the API server (with Karpenter's CRDs and webhooks-free
# CEL) accepts the pool and the controller registers it; actual node
# provisioning is the behavioral scenario's assertion.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenterNodePool
metadata:
  name: e2e-karpenter-nodepool-minimal
  annotations:
    planton.dev/e2e-cluster-profile: "aws-eks"
    planton.dev/e2e-prerequisites: "KubernetesKarpenterEc2NodeClass"
spec:
  template:
    node_class_ref:
      name:
        valueFrom:
          kind: KubernetesKarpenterEc2NodeClass
          name: e2e-karpenter-nodeclass-minimal
          fieldPath: status.outputs.node_class_name
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
          - on-demand
      - key: kubernetes.io/arch
        operator: In
        values:
          - amd64
  disruption:
    consolidation_policy: WhenEmptyOrUnderutilized
    consolidate_after: 1m
  limits:
    cpu: "100"
