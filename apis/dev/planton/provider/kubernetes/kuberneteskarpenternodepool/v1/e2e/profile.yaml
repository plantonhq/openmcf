apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: kuberneteskarpenternodepool
spec:
  tier: 1
  status: deferred
  validated_provisioners: []
  timeout_minutes: 20
  deferred_reason: >-
    The NodePool CRD is installed by KubernetesKarpenter (the registry
    prerequisite), whose controller cannot start off AWS — so the kind
    cluster can never serve the karpenter.sh API group. Offline plan proofs
    cover both engines' full rendering; object-grade and provisioning lanes
    ride the batched EKS real-cluster set.
