apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenterNodePool
metadata:
  name: spot-diversified
spec:
  template:
    nodeClassRef:
      group: karpenter.k8s.aws # spec default
      kind: EC2NodeClass # spec default
      name:
        value: '<ec2-node-class-name>' # metadata.name of your KubernetesKarpenterEc2NodeClass
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
          - spot
      - key: kubernetes.io/arch
        operator: In
        values:
          - amd64
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values: # wide family list so spot capacity can come from many pools
          - c5
          - c6i
          - c7i
          - m5
          - m6i
          - m7i
          - r5
          - r6i
        # ALPHA: the launched fleet must span at least 4 distinct families —
        # the instance-type-diversity knob that softens single-pool
        # spot reclaims.
        minValues: 4
    expireAfter: 720h # CRD default
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized # CRD default
    consolidateAfter: 1m
    budgets:
      # At most 15% of the pool's nodes may be disrupting at once.
      - nodes: 15%
      # Freeze voluntary disruption during business hours (schedule and
      # duration must be set together — the schedule starts the window,
      # the duration ends it). Spot reclaims are involuntary and unaffected.
      - nodes: "0"
        schedule: 0 9 * * 1-5
        duration: 8h
  limits:
    cpu: "500" # spot pool cost ceiling
