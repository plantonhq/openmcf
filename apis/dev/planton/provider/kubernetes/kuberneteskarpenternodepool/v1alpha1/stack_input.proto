syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskarpenternodepool.v1alpha1;

import "dev/planton/provider/kubernetes/kuberneteskarpenternodepool/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// Input for the KubernetesKarpenterNodePool IaC stack. The platform
// resolves all StringValueOrRef references (the NodeClass name) to literal
// strings before passing this to the IaC engine.
message KubernetesKarpenterNodePoolStackInput {
  // Target cloud-resource.
  KubernetesKarpenterNodePool target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
