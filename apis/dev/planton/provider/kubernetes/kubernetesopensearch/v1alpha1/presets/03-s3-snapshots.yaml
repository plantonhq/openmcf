apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearch
metadata:
  name: snap-opensearch
spec:
  namespace:
    value: opensearch
  create_namespace: true
  version: 2.19.4
  node_pools:
    - name: nodes
      replicas: 3
      roles:
        - cluster_manager
        - data
        - ingest
      jvm: -Xmx2G -Xms2G
      disk_size: 100Gi
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      pdb:
        enable: true
        max_unavailable: "1"
  security:
    transport_tls:
      generate: true
    http_tls:
      generate: true
  # The repository-s3 plugin does the actual S3 I/O. plugins_list
  # installs it into every node at STARTUP — the install downloads
  # from the internet at pod start, so for air-gapped clusters bake
  # the plugin into a custom image instead.
  plugins_list:
    - repository-s3
  # Credentials live in the OpenSearch KEYSTORE, loaded from an
  # existing Secret — never in the repository settings, never in this
  # manifest. key_mappings renames the Secret's keys into the keystore
  # keys the s3 client reads.
  #
  # THE KEYLESS PATH: on EKS with IRSA (or any node/workload identity
  # that grants bucket access), DELETE this keystore block entirely —
  # the s3 client falls back to the ambient AWS identity and no static
  # credential exists anywhere.
  keystore:
    - secret:
        value: opensearch-s3-credentials
      key_mappings:
        access-key: s3.client.default.access_key
        secret-key: s3.client.default.secret_key
  # Registers the repository on the cluster; snapshot/restore API
  # calls (and snapshot policies) reference it by name. Settings pass
  # through to the OpenSearch snapshot API as-is.
  snapshot_repositories:
    - name: s3-snapshots
      type: s3
      settings:
        bucket: my-opensearch-snapshots
        region: us-west-2
        base_path: snapshots/prod
