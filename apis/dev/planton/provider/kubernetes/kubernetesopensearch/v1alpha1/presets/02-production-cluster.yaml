apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearch
metadata:
  name: prod-opensearch
spec:
  namespace:
    value: opensearch
  create_namespace: true
  version: 2.19.4
  # Drain data off a node before rolling operations stop it — worth the
  # slower roll on large data nodes, where recovering from replicas is
  # slower than draining. (Operator default: false.)
  drain_data_nodes: true
  node_pools:
    # Dedicated cluster managers — the production norm: the quorum that
    # coordinates the cluster never competes with query/indexing load.
    # Three tolerate one loss; keep manager counts odd.
    - name: managers
      replicas: 3
      roles:
        - cluster_manager
      jvm: -Xmx1G -Xms1G
      disk_size: 20Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
      persistence:
        pvc:
          # Literal class name shown; the field also accepts a
          # valueFrom reference to a KubernetesStorageClass resource.
          storage_class:
            value: <fast-ssd-storage-class>
      # At most one manager down at a time — protects the quorum
      # during node drains and cluster upgrades.
      pdb:
        enable: true
        max_unavailable: "1"
    # Data nodes carry the indices and the query load; they scale
    # independently of the managers.
    - name: data
      replicas: 3
      roles:
        - data
        - ingest
      # Heap at half the container memory; the other half is OS page
      # cache OpenSearch leans on for search performance.
      jvm: -Xmx4G -Xms4G
      disk_size: 500Gi
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 8Gi
      persistence:
        pvc:
          storage_class:
            value: <fast-ssd-storage-class>
      pdb:
        enable: true
        max_unavailable: "1"
  # Generated TLS on both layers. THE PRODUCTION CAVEAT: the operator
  # bootstraps the security plugin with the image's well-known DEMO
  # admin credentials (the <name>-admin-password Secret) — it does not
  # generate a random password at this release. Before this cluster
  # holds anything real, either bring your own security.config (the
  # security.config block: internal_users.yml + admin cert + admin
  # credentials Secrets) or rotate the admin password through the
  # security API immediately after install.
  security:
    transport_tls:
      generate: true
    http_tls:
      generate: true
  # Dashboards: the web console, reconciled as part of this same
  # resource. Two replicas ride the same PDB-free deployment — the
  # console is stateless, so replicas are purely for availability.
  # The Service stays ClusterIP; expose it by composing a
  # KubernetesIngress over the exported dashboards service handle.
  dashboards:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    tls:
      enable: true
