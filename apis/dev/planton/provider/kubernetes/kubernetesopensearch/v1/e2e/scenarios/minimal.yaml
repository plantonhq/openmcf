# The dev shape: one all-roles pool at the MANAGER FLOOR of 2 replicas
# (a single manager-eligible node is stranded by the operator's
# bootstrap handoff — the spec rejects it; verified live), PVC-backed,
# the operator's generated-TLS security posture declared explicitly.
# The verifier speaks https with the bootstrapped admin credentials and
# proves a live index/search round-trip.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesOpenSearch
metadata:
  name: e2e-os-min
spec:
  namespace:
    value: e2e-os-min
  create_namespace: true
  version: 2.19.2
  node_pools:
    - name: all
      replicas: 2
      roles:
        - cluster_manager
        - data
        - ingest
      jvm: -Xmx512M -Xms512M
      disk_size: 3Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1536Mi
  security:
    transport_tls:
      generate: true
    http_tls:
      generate: true
