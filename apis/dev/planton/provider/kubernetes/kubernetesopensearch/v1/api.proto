syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesopensearch.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesopensearch/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesopensearch/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//elasticsearch-kubernetes
message KubernetesOpenSearch {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesOpenSearch'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesOpenSearchSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesOpenSearchStatus status = 5;
}

//elasticsearch-kubernetes status.
message KubernetesOpenSearchStatus {
  //stack-outputs
  KubernetesOpenSearchStackOutputs outputs = 1;
}
