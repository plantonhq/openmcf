# Consumer-scoped operator fixture for the KubernetesMongodb lanes: the
# operator in CLUSTER-WIDE watch mode, because every database scenario
# creates its cluster in its own namespace — the operator's default
# own-namespace watch would never see them.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPerconaMongoOperator
metadata:
  name: e2e-psmdb-op-for-mongodb
spec:
  namespace:
    value: psmdb-operator-system
  create_namespace: true
  watch:
    cluster_wide: true
