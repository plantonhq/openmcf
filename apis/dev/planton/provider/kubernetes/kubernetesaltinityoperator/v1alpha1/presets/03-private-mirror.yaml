apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAltinityOperator
metadata:
  name: clickhouse-operator
spec:
  namespace:
    value: clickhouse-operator
  create_namespace: true
  watch_namespaces:
    - ".*"
  operator_credentials:
    username: clickhouse_operator
    password:
      value: change-me-operator-password
  # Every image the install pulls, re-pointed at a private mirror.
  image:
    repo: mirror.example.com/altinity/clickhouse-operator
    tag: 0.27.2
  crd_hook:
    enabled: true
    # The hook's upstream default is bitnami/kubectl:latest — pullable
    # today but frozen since Bitnami retired its public catalog, so
    # air-gapped and long-lived installs should pin their own kubectl
    # image here.
    image:
      repo: mirror.example.com/kubectl
      tag: "1.31"
  image_pull_secrets:
    - mirror-pull-secret
  # The metrics-exporter sidecar image follows the chart defaults; on
  # a fully air-gapped cluster re-point it too via helm_values
  # (metrics.image.repository/tag).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
