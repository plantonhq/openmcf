syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesflinkoperator.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesflinkoperator/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesflinkoperator/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//flink-operator-kubernetes
message KubernetesFlinkOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesFlinkOperator'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesFlinkOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesFlinkOperatorStatus status = 5;
}

//flink-operator-kubernetes status.
message KubernetesFlinkOperatorStatus {
  //stack-outputs
  KubernetesFlinkOperatorStackOutputs outputs = 1;
}
