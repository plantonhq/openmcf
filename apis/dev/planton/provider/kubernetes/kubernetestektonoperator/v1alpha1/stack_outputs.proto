syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetestektonoperator.v1alpha1;

/**
 * Outputs exported after installing the Tekton Operator.
 */
message KubernetesTektonOperatorStackOutputs {
  /**
   * Namespace the operator runs in — always `tekton-operator` (fixed
   * by the release manifest).
   */
  string namespace = 1;
}
