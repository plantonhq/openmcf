apiVersion: kubernetes.planton.dev/v1
kind: KubernetesClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  secretsNamespace:
    value: external-secrets # the operator's install namespace, by convention
  config:
    azureKeyVault:
      # Replace with your Key Vault URL — or reference an AzureKeyVault
      # deployed in the same run (valueFrom: { name: <resource-name> } —
      # the reference is also the deploy-ordering edge).
      vaultUrl:
        value: https://my-key-vault.vault.azure.net
      tenantId: <entra-tenant-id>
      authType: WorkloadIdentity # default; the keyless AKS posture
      serviceAccountName:
        value: <eso-reader-service-account>
      serviceAccountNamespace: external-secrets # required on a ClusterSecretStore
