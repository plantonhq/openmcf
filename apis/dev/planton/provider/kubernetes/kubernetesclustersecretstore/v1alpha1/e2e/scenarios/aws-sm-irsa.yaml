# The real backend-read proof on the aws-eks profile: AWS Secrets Manager
# through keyless IRSA. The store's auth references the IRSA ServiceAccount
# fixture; ESO grants Ready only after validating the backend connection —
# already a real AWS call. The behavioral verifier (switched on by this
# scenario's name) then proves the full sync loop: it applies a
# verifier-owned ExternalSecret against this store, and asserts the
# materialized Kubernetes Secret carries the batch source secret's actual
# value read out of Secrets Manager.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterSecretStore
metadata:
  name: e2e-css-aws-sm
  annotations:
    planton.dev/e2e-cluster-profile: "aws-eks"
    # Manifest-path fixtures deploy in listed order: the namespace must
    # exist before the ServiceAccount lands in it (path entries carry only
    # their KIND's prerequisite edges, not their file's own annotations).
    planton.dev/e2e-prerequisites: "apis/dev/planton/provider/kubernetes/kubernetesclustersecretstore/v1alpha1/e2e/fixture-eso-namespace.yaml, apis/dev/planton/provider/kubernetes/kubernetesclustersecretstore/v1alpha1/e2e/fixture-irsa-sa.yaml"
spec:
  secretsNamespace:
    value: e2e-eso
  config:
    aws:
      service: SecretsManager
      region: ${E2E_ENV:PLANTON_E2E_AWS_REGION}
      serviceAccountName:
        value: e2e-eso-irsa
      serviceAccountNamespace: e2e-eso
    refreshInterval: 1m
