apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClusterSecretStore
metadata:
  name: vault
spec:
  secretsNamespace:
    value: external-secrets # the operator's install namespace, by convention
  config:
    vault:
      server: https://vault.example.internal:8200 # replace with your Vault/OpenBao URL
      path: secret # KV engine mount path
      version: v2 # default; versioned KV, the modern engine
      kubernetes:
        mountPath: kubernetes # upstream default auth mount
        role: <vault-role-name>
        serviceAccountName:
          value: <eso-reader-service-account>
