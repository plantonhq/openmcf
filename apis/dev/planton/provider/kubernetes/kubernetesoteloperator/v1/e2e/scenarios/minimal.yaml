# Minimal operator install: chart defaults end to end — the
# cert-manager posture with the chart's own self-signed Issuer (the
# cert-manager fixture rides the registry prerequisite), module-owned
# CRDs, one replica. The verifier proves the admission gate and the
# conversion round-trip on this lane too — they are the kind's
# definition of working, not extras.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesOtelOperator
metadata:
  name: e2e-otelop-min
spec:
  namespace:
    value: e2e-otelop-min
  createNamespace: true
