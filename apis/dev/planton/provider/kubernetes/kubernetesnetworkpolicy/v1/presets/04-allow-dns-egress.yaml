apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  name: allow-dns-egress
  namespace:
    value: "<your-namespace>"
  pod_selector: {}
  policy_types:
    - egress
  egress_rules:
    - to:
        - namespace_selector:
            match_labels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: "53"
        - protocol: TCP
          port: "53"
