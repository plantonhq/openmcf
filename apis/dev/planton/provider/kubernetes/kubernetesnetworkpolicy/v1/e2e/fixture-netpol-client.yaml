# Extra-instance fixture for the behavioral-deny scenario: the curl client
# whose requests the policy must block. It lives in the SAME namespace as
# the backend — the deny proof cannot hide behind namespace isolation; only
# the NetworkPolicy stands between these two pods.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesDeployment
metadata:
  name: e2e-netpol-client
spec:
  namespace:
    value: e2e-netpol-behavioral
  version: main
  container:
    app:
      image:
        repo: curlimages/curl
        tag: "8.11.1"
      command:
        - sleep
        - infinity
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
