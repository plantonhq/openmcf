apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaTopic
metadata:
  name: customer-profiles
spec:
  namespace:
    value: kafka # MUST be the Kafka cluster's own namespace
  kafkaCluster:
    value: my-kafka # the KubernetesKafka resource's metadata.name
  partitions: 6
  replicas: 3 # must not exceed the cluster's broker count
  config:
    # Compaction keeps the LATEST value per key instead of deleting by
    # age — records MUST be keyed for compaction to mean anything.
    cleanup.policy: compact
    # Compact once 40% of the log is dirty (uncompacted) instead of the
    # laxer default — keeps the latest-value guarantee fresher.
    min.cleanable.dirty.ratio: "0.4"
    # Smaller segments (256 MiB): the active segment is never compacted,
    # so rolling sooner makes records eligible for compaction sooner.
    segment.bytes: "268435456"
    min.insync.replicas: "2" # with replicas 3: survives one broker loss
