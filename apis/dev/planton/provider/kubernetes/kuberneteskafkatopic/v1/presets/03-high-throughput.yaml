apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaTopic
metadata:
  name: telemetry-ingest
spec:
  namespace:
    value: kafka # MUST be the Kafka cluster's own namespace
  kafkaCluster:
    value: my-kafka # the KubernetesKafka resource's metadata.name
  # Wide fan-out: up to 24 consumers in one group read in parallel.
  # Plan this up front — partitions can grow but never shrink.
  partitions: 24
  replicas: 3 # must not exceed the cluster's broker count
  config:
    retention.ms: "172800000" # 2 days — high volume, short shelf life
    cleanup.policy: delete
    # 1 GiB segments: larger active segments roll less often, so
    # high-volume partitions spend less time managing segment churn.
    segment.bytes: "1073741824"
    min.insync.replicas: "2" # with replicas 3: survives one broker loss
