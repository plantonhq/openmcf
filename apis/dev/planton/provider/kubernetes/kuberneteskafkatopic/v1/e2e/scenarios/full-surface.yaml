# The full topic surface: a topic-name override carrying characters a
# Kubernetes resource name cannot (dots, underscores), compaction
# configuration, and explicit sizing. Replicas stays 1 — the fixture is a
# single-node cluster and the topic operator REJECTS a replication factor
# above the broker count (the spec comment teaches this).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaTopic
metadata:
  name: e2e-topic-full
spec:
  namespace:
    value: e2e-kaf-fix
  kafka_cluster:
    valueFrom:
      name: e2e-kaf-fix
  topic_name: e2e.topics_full.v1
  partitions: 6
  replicas: 1
  config:
    cleanup.policy: compact
    min.cleanable.dirty.ratio: "0.4"
    segment.bytes: "268435456"
    max.message.bytes: "2097152"
