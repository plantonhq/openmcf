apiVersion: kubernetes.planton.dev/v1
kind: KubernetesService
metadata:
  name: e2e-svc-affinity
spec:
  namespace:
    value: default
  name: e2e-svc-affinity
  session_affinity: client_ip
  session_affinity_timeout_seconds: 3600
  selector:
    app: test-app
  ports:
    - name: http
      port: 80
      target_port: "8080"
