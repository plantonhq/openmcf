# Dependency-install profile for the External Secrets Operator.
#
# The E2E harness deploys this manifest (via the registry prerequisite graph —
# KubernetesClusterSecretStore/KubernetesSecretStore/KubernetesExternalSecret
# declare `prerequisites: [KubernetesExternalSecretsOperator]`) before
# applying any store or external-secret scenario. Minimal install: chart
# defaults, CRDs included, the namespace created and owned by the fixture.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalSecretsOperator
metadata:
  name: e2e-eso-prereq
spec:
  namespace:
    value: external-secrets
  createNamespace: true
