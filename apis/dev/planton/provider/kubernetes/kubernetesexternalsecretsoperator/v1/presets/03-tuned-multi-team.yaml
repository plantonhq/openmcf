apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalSecretsOperator
metadata:
  name: my-external-secrets-operator
spec:
  namespace:
    value: external-secrets
  createNamespace: true
  concurrent: 5 # chart default is 1; raise for hundreds of ExternalSecrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  webhook:
    replicas: 2 # admission path redundancy — every ESO apply goes through it
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  certController:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
