syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskyverno.v1;

/**
 * Outputs exported after installing the Kyverno policy engine.
 */
message KubernetesKyvernoStackOutputs {
  /**
   * Namespace the engine runs in.
   */
  string namespace = 1;

  /**
   * Helm release name (equals metadata.name).
   */
  string release_name = 2;

  /**
   * Name of the admission controller's webhook Service — the backend
   * the runtime-registered webhook configurations point at
   * (`<release>-svc`).
   */
  string admission_service_name = 3;

  /**
   * Name of the engine's runtime ConfigMap (resource filters, webhook
   * selectors) — the object to inspect when a resource is
   * unexpectedly skipped or policed.
   */
  string config_map_name = 4;
}
