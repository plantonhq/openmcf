apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: kuberneteskyverno
spec:
  # Kyverno installs as one Helm release NAMED AFTER metadata.name
  # (fullnameOverride pins every chart-derived child name — controllers,
  # the webhook Service, the runtime ConfigMap — the same way), plus the
  # optional anchor namespace. The module materializes no Secrets: the
  # engine's webhook certificates are RUNTIME-generated by Kyverno itself
  # (or cert-manager-issued in that arm) and travel with the release
  # import.
  values:
    - name: release_name
      derivations:
        - from_stack_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "kyverno".
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
