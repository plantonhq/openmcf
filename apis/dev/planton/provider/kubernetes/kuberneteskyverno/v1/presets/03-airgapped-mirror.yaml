apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKyverno
metadata:
  name: kyverno
spec:
  namespace:
    value: kyverno
  createNamespace: true
  imageRegistry: mirror.example.com
  imagePullSecrets:
    - mirror-pull
  config:
    defaultRegistry: mirror.example.com
  admissionController:
    replicas: 3
