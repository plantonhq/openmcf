apiVersion: kubernetes.planton.dev/v1
kind: KubernetesDeployment
metadata:
  name: my-web-service
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-image>"
        tag: "<your-image-tag>"
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
          appProtocol: http
      readinessProbe:
        httpGet:
          path: /healthz
          portNumber: 8080
        periodSeconds: 5
