apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: my-web-service
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-image>"
        tag: "<your-image-tag>"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
          appProtocol: http
      readinessProbe:
        httpGet:
          path: /healthz
          portNumber: 8080
        periodSeconds: 5
      lifecycle:
        preStop:
          sleep:
            seconds: 10
  availability:
    replicas: 2
    horizontalPodAutoscaling:
      enabled: true
      maxReplicas: 10
      targetCpuUtilizationPercent: 70
    strategy:
      type: RollingUpdate
      maxUnavailable: "0"
      maxSurge: "1"
    podDisruptionBudget:
      enabled: true
      minAvailable: "1"
