# Exercises the full pod-core surface in one scenario: an init container, a
# named sidecar sharing an EmptyDir with the app, restricted-profile security
# hardening at both pod and container level, topology spreading, and a
# pre-stop drain hook. The app image is nginx-unprivileged — purpose-built for
# restricted contexts (listens on 8080, runs as UID 101), so the hardening
# needs no capability grants or config rewrites.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: e2e-dep-hardened
spec:
  namespace:
    value: e2e-dep-hardened-ns
  create_namespace: true
  version: main
  container:
    app:
      image:
        repo: nginxinc/nginx-unprivileged
        tag: "1.27-alpine"
      image_pull_policy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: http
          container_port: 8080
          network_protocol: TCP
          app_protocol: http
          service_port: 80
      readiness_probe:
        http_get:
          path: /
          port_number: 8080
        period_seconds: 3
      volume_mounts:
        - name: shared-scratch
          mount_path: /scratch
          empty_dir:
            size_limit: 16Mi
      lifecycle:
        pre_stop:
          exec:
            command: ["/bin/sleep", "2"]
      security_context:
        run_as_non_root: true
        allow_privilege_escalation: false
        capabilities:
          drop: ["ALL"]
    sidecars:
      - name: scratch-reader
        image:
          repo: busybox
          tag: "1.36"
        command: ["/bin/sh", "-c"]
        args: ["while true; do ls /scratch >/dev/null 2>&1; sleep 30; done"]
        resources:
          requests:
            cpu: "5m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
        volume_mounts:
          - name: shared-scratch
            mount_path: /scratch
  pod:
    init_containers:
      - name: init-banner
        image:
          repo: busybox
          tag: "1.36"
        command: ["/bin/sh", "-c"]
        args: ["echo initialized > /work/initialized.txt"]
        volume_mounts:
          - name: shared-scratch
            mount_path: /work
    labels:
      team: e2e
    annotations:
      example.org/scenario: hardened
    security_context:
      # A concrete UID/GID is pinned pod-wide: runAsNonRoot alone would reject
      # the busybox init/sidecar containers, whose image metadata says root —
      # the kubelet refuses to start them without an explicit non-root UID.
      run_as_non_root: true
      run_as_user: 101
      run_as_group: 101
      fs_group: 101
      seccomp_profile:
        type: RuntimeDefault
    termination_grace_period_seconds: 30
    scheduling:
      topology_spread_constraints:
        - max_skew: 1
          topology_key: kubernetes.io/hostname
          when_unsatisfiable: ScheduleAnyway
  availability:
    replicas: 2
