syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesresourcequota.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesresourcequota/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesresourcequota/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

/**
 * **KubernetesResourceQuota** defines Kubernetes namespace resource
 * governance following the Kubernetes Resource Model (KRM): a ResourceQuota
 * capping the namespace's aggregate consumption, plus an optional companion
 * LimitRange applying per-object defaults and bounds — one kind for the one
 * question "how much may this namespace consume, and what does a workload
 * get when it doesn't say?"
 */
message KubernetesResourceQuota {
  // API version for this resource.
  // Always set to "kubernetes.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "kubernetes.planton.dev/v1alpha1"];

  // Resource kind identifier.
  // Always set to "KubernetesResourceQuota".
  string kind = 2 [(buf.validate.field).string.const = "KubernetesResourceQuota"];

  // Metadata for the ResourceQuota resource.
  // Includes standard fields like name, organization, environment, etc.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Specification of the desired state for the namespace governance pair.
  // Defines the aggregate caps, scopes, and per-object limit defaults.
  KubernetesResourceQuotaSpec spec = 4 [(buf.validate.field).required = true];

  // Status of the ResourceQuota resource.
  // Contains outputs populated after deployment.
  KubernetesResourceQuotaStatus status = 5;
}

/**
 * **KubernetesResourceQuotaStatus** captures the runtime status of a
 * ResourceQuota deployment, including the outputs generated after the
 * objects are created.
 */
message KubernetesResourceQuotaStatus {
  // Outputs from the ResourceQuota deployment.
  // Contains the quota and companion LimitRange names.
  KubernetesResourceQuotaStackOutputs outputs = 1;
}
