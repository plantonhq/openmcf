# The smallest useful quota: object-count caps only — safe to apply to a
# shared namespace because it constrains nothing that pods must declare.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesResourceQuota
metadata:
  name: e2e-rq-minimal
spec:
  namespace:
    value: default
  name: e2e-rq-minimal
  hard:
    pods: "500"
    services.loadbalancers: "10"
