# Scope filtering: the quota tracks only BestEffort pods (no requests or
# limits at all) — the classic guard against unbounded naive pods. A
# best_effort quota may cap only pod counts (API rule, mirrored in the spec's
# validations).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesResourceQuota
metadata:
  name: e2e-rq-scoped
spec:
  namespace:
    value: default
  name: e2e-rq-scoped
  hard:
    pods: "50"
  scopes:
    - best_effort
