apiVersion: kubernetes.planton.dev/v1
kind: KubernetesOpenBao
metadata:
  name: openbao
spec:
  namespace:
    value: openbao
  createNamespace: true
  server:
    ha:
      replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    dataStorage:
      size: 10Gi
    auditStorage:
      size: 10Gi
  uiEnabled: true
  metrics:
    enabled: true
