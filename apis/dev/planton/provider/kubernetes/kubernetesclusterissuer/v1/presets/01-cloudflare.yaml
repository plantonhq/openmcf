apiVersion: kubernetes.planton.dev/v1
kind: KubernetesClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  certManagerNamespace:
    value: cert-manager
  config:
    acme:
      email: "<your-email@example.com>"
      solvers:
        - dns01:
            cloudflare:
              apiToken:
                token: "<cloudflare-api-token>"
