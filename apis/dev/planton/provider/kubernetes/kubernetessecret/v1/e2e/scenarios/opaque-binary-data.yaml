apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSecret
metadata:
  name: e2e-secret-binary
spec:
  name: e2e-secret-binary
  namespace:
    value: default
  opaque:
    data:
      api-key: plain-text-entry
    binaryData:
      # "planton-binary-secret" base64-encoded — a stand-in for any non-UTF-8
      # payload (keystores, binary certificates).
      keystore.bin: cGxhbnRvbi1iaW5hcnktc2VjcmV0
