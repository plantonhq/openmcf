apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTekton
metadata:
  name: tekton
spec:
  # Profile `lite`: the pipelines engine alone — no Triggers, no
  # Dashboard, no Chains. The shape for platforms that drive Tekton
  # entirely through their own APIs (creating PipelineRuns/TaskRuns
  # programmatically) and need nothing user-facing on the cluster.
  profile: lite
  pipeline:
    # Every run's lifecycle event streams to the platform's receiver —
    # ONE cluster-global sink by Tekton's design.
    cloudEventsSinkUrl: http://ci-events.platform.svc.cluster.local/events
    defaultTimeoutMinutes: 120
    resolvers:
      # A platform submitting fully-inlined runs needs no remote
      # resolution; the hub and git resolvers also reach the internet.
      enableHubResolver: false
      enableGitResolver: false
      enableBundlesResolver: false
    performance:
      # Tekton HA: replicas shard reconcile work via buckets — replicas
      # without matching buckets add nothing.
      replicas: 2
      buckets: 2
  pruner:
    schedule: "0 */6 * * *"
    resources:
      - pipelinerun
      - taskrun
    keepSince: 2880
