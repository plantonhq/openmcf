syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesstorageclass.v1alpha1;

import "dev/planton/provider/kubernetes/kubernetesstorageclass/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

/**
 * **KubernetesStorageClassStackInput** defines the input structure for
 * deploying a Kubernetes StorageClass. It carries the target StorageClass
 * specification and the Kubernetes cluster configuration the IaC modules
 * (Pulumi and Terraform) need to reach the cluster.
 */
message KubernetesStorageClassStackInput {
  /**
   * The target StorageClass resource to be created.
   * Contains the complete specification including metadata, provisioner, and
   * volume lifecycle policies.
   */
  KubernetesStorageClass target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes
   * cluster where the StorageClass will be created.
   */
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
