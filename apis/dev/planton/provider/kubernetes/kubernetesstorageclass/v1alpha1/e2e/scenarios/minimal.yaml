# The smallest useful class: name + provisioner. Uses kind's local-path
# provisioner so the class is real on the test cluster (not an inert object
# naming a driver that isn't installed).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStorageClass
metadata:
  name: e2e-sc-minimal
spec:
  name: e2e-sc-minimal
  provisioner: rancher.io/local-path
  volume_binding_mode: wait_for_first_consumer
