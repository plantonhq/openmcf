syntax = "proto3";

package dev.planton.provider.kubernetes;

import "buf/validate/validate.proto";

// KubernetesProvider enum represents the various Kubernetes providers.
// This enumeration allows specifying the type of Kubernetes cluster being used, such as GKE, EKS, or AKS, with additional context on each.
enum KubernetesProvider {
  kubernetes_provider_unspecified = 0; // Unspecified Kubernetes provider.
  gcp_gke = 1; // Google Kubernetes Engine (GKE) - A managed Kubernetes service by Google Cloud that provides automated cluster management and scaling.
  aws_eks = 2; // Amazon Elastic Kubernetes Service (EKS) - A managed Kubernetes service by AWS that simplifies the deployment and management of Kubernetes clusters.
  azure_aks = 3; // Azure Kubernetes Service (AKS) - A managed Kubernetes service by Microsoft Azure that provides Kubernetes cluster orchestration and management.
  digital_ocean_doks = 4; // DigitalOcean Kubernetes Service (DOKS) - A managed Kubernetes service by DigitalOcean that simplifies the deployment and management of Kubernetes clusters.
}

// KubernetesProviderConfig message represents the specification required to create or connect a Kubernetes Cluster.
// This message consolidates all necessary input parameters to establish a connection with a Kubernetes cluster, ensuring accurate configuration and validation of credentials.
// Fields include environment information, Kubernetes provider details, and credentials for GKE clusters.
message KubernetesProviderConfig {
  // The Kubernetes provider, specifying the type of cluster (e.g., gcp_gke, aws_eks, azure_aks).
  // For more detailed information, refer to the official documentation of each provider.
  KubernetesProvider provider = 1 [(buf.validate.field).required = true];

  // Credential specification for GCP GKE provider.
  // This field contains detailed information for connecting to a Google Kubernetes Engine (GKE) cluster.
  KubernetesProviderConfigGcpGke gcp_gke = 2;

  // Credential specification for AWS EKS provider.
  // This field contains detailed information for connecting to a Elastic Kubernetes Engine(EKS) cluster.
  KubernetesProviderConfigAwsEks aws_eks = 3;

  // Credential specification for Azure AKS provider.
  // This field contains detailed information for connecting to a Azure Kubernetes Service(AKS) cluster.
  KubernetesProviderConfigAzureAks azure_aks = 4;

  KubernetesProviderConfigDigitalOceanDoks digital_ocean_doks = 5;
}

// KubernetesProviderConfigGcpGke contains the connection parameters for a Google Kubernetes Engine (GKE) cluster.
message KubernetesProviderConfigGcpGke {
  // The cluster API server endpoint URL.
  string cluster_endpoint = 1 [(buf.validate.field).required = true];

  // Base64-encoded cluster Certificate Authority (CA) certificate.
  // This is the standard kubeconfig CA data format.
  string cluster_ca_data = 2 [(buf.validate.field).required = true];

  // JSON content of a Google Service Account key file used to authenticate to the GKE cluster.
  //
  // This is the raw JSON downloaded from the GCP Console or generated via
  // `gcloud iam service-accounts keys create`.
  string service_account_key = 3 [(buf.validate.field).required = true];
}

// KubernetesProviderConfigAwsEks contains the connection parameters for an Amazon Elastic
// Kubernetes Service (EKS) cluster.
//
// EKS has no long-lived bearer credential: API-server tokens are presigned STS
// GetCallerIdentity URLs that expire within ~15 minutes and are validated per request.
// This config therefore carries the cluster identity as plain values plus the AWS
// credentials used to mint those tokens on demand. The caller (a deploy engine or an
// in-process Kubernetes client) exchanges the AWS credentials for a fresh EKS token
// whenever one is needed; the token itself is never stored here.
message KubernetesProviderConfigAwsEks {
  // The EKS cluster name. Bound into every minted token via the x-k8s-aws-id signed
  // header, which is how the cluster's API server ties the token to itself.
  string cluster_name = 1 [(buf.validate.field).required = true];

  // The cluster API server endpoint URL.
  string cluster_endpoint = 2 [(buf.validate.field).required = true];

  // Base64-encoded cluster Certificate Authority (CA) certificate.
  // This is the standard kubeconfig CA data format.
  string cluster_ca_data = 3 [(buf.validate.field).required = true];

  // The AWS region hosting the cluster. Token minting signs against this region's
  // STS endpoint, so it is required even though the endpoint URL implies it.
  string region = 4 [(buf.validate.field).required = true];

  // The AWS Access Key ID used to mint EKS tokens. Optional: when the static key
  // fields are empty, tokens are minted from the ambient AWS credential chain of the
  // process (shared config profile, environment, or instance role). When present, it
  // must start with 'AKIA' (long-term) or 'ASIA' (temporary) followed by 16
  // alphanumeric characters; the format rules are skipped when the field is empty.
  string access_key_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 20,
    (buf.validate.field).cel = {
      id: "kubernetes.aws_eks.access_key_id.prefix"
      message: "Must start with 'AKIA' (long-term) or 'ASIA' (temporary)"
      expression: "this.matches('^A(K|S)IA.*')"
    },
    (buf.validate.field).cel = {
      id: "kubernetes.aws_eks.access_key_id.format"
      message: "Must start with 'AKIA' or 'ASIA' followed by 16 alphanumeric characters"
      expression: "this.matches('^.{4}[a-zA-Z0-9]{16}$')"
    }
  ];

  // The AWS Secret Access Key paired with access_key_id. Optional (see access_key_id);
  // when present it must be exactly 40 characters of numbers, letters, slashes (/),
  // and plus signs (+). The format rule is skipped when the field is empty.
  string secret_access_key = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 40,
    (buf.validate.field).cel = {
      id: "kubernetes.aws_eks.secret_access_key"
      message: "Must contain exactly 40 characters consisting of numbers, letters, slashes (/), and plus signs (+)"
      expression: "this.matches('^[0-9a-zA-Z/+]{40}$')"
    }
  ];

  // The AWS Session Token, required when access_key_id carries temporary security
  // credentials (an 'ASIA' key from an STS exchange). Empty for long-term keys.
  string session_token = 7;
}

// KubernetesProviderConfigAzureEks message represents the specification required to connect to a Azure Kubernetes Service (AKS) cluster.
// This message consolidates the necessary input parameters for establishing a secure connection with a AKS cluster.
message KubernetesProviderConfigAzureAks {}

// KubernetesProviderConfigDigitalOceanDoks message represents the specification required to connect to a DigitalOcean Kubernetes Service (DOKS) cluster.
message KubernetesProviderConfigDigitalOceanDoks {
  string kube_config = 1 [(buf.validate.field).required = true];
}
