apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: e2e-ns-extra-quotas
spec:
  name: e2e-ns-extra-quotas
  resourceProfile:
    custom:
      cpu:
        requests: "2"
        limits: "4"
      memory:
        requests: 4Gi
        limits: 8Gi
      # Quota entries beyond the typed fields: storage and per-resource object
      # counts, exercising the open ResourceQuota map.
      additionalHardLimits:
        requests.storage: 50Gi
        count/jobs.batch: "10"
