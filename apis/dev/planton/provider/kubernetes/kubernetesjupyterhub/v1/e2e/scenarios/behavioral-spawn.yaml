# THE STATE PROOF lane: the defaults (sqlite-PVC hub state,
# shared-password sign-in), with the verifier's behavioral arm switched
# on by this scenario's name — after the first sign-in + spawn proof,
# the hub pod is deleted (UID-verified replacement) and a FRESH sign-in
# must find the same user account and spawn again: hub state (users,
# server records) lives in the hub database on its PVC, never in the
# pod. Ephemeral pre-pull is disabled on this lane so the replacement
# window measures the hub, not the puller.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesJupyterHub
metadata:
  name: e2e-jhub-state
spec:
  namespace:
    value: e2e-jupyterhub
  pre_puller:
    # The image is already node-local from the earlier lanes; keep the
    # replacement window honest.
    hook_enabled: false
    continuous_enabled: false
