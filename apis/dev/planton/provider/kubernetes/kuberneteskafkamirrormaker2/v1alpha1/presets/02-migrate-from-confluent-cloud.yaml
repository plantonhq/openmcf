apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaMirrorMaker2
metadata:
  name: confluent-migration
spec:
  namespace:
    value: kafka
  replicas: 3
  target:
    bootstrap_servers:
      value: events-kafka-bootstrap.kafka.svc.cluster.local:9092
    config:
      config.storage.replication.factor: "3"
      offset.storage.replication.factor: "3"
      status.storage.replication.factor: "3"
  mirrors:
    - source:
        alias: confluent
        # The Confluent Cloud bootstrap for the source cluster.
        bootstrap_servers:
          value: pkc-xxxxx.us-west2.gcp.confluent.cloud:9092
        # Confluent Cloud's client contract: SASL PLAIN — the API key
        # as username, the API secret from a Kubernetes Secret (never
        # a literal in the manifest).
        authentication:
          type: plain
          username: ABCDEFGH123456
          password_secret:
            secret_name:
              value: confluent-api-secret
            password: password
        config:
          # Confluent-recommended fetch sizing for high-throughput
          # consumption (a configuration STRING, like every entry).
          fetch.max.bytes: "52428800"
      topics_pattern: ".*"
      groups_pattern: ".*"
      source_connector:
        tasks_max: 4
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
        auto_restart:
          enabled: true
      checkpoint_connector:
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          sync.group.offsets.enabled: "true"
        auto_restart:
          enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  jvm:
    xms: 1g
    xmx: 1g
  metrics:
    enabled: true
