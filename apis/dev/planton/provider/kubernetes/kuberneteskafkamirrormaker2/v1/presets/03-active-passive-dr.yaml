apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaMirrorMaker2
metadata:
  name: dr-mirror
spec:
  namespace:
    value: kafka-dr
  replicas: 2
  target:
    # The PASSIVE (standby) cluster — this resource runs alongside it.
    alias: dr
    bootstrap_servers:
      value: dr-kafka-kafka-bootstrap.kafka-dr.svc.cluster.local:9093
    tls:
      trusted_certificates:
        - secret_name:
            value: dr-kafka-cluster-ca-cert
          certificate: ca.crt
    authentication:
      type: scram-sha-512
      username: mm2-dr-writer
      password_secret:
        secret_name:
          value: mm2-dr-writer
        password: password
    config:
      config.storage.replication.factor: "3"
      offset.storage.replication.factor: "3"
      status.storage.replication.factor: "3"
  mirrors:
    - source:
        # The ACTIVE (primary) cluster.
        alias: primary
        bootstrap_servers:
          value: events-kafka-bootstrap.kafka.svc.cluster.local:9093
        tls:
          trusted_certificates:
            - secret_name:
                value: events-cluster-ca-cert
              certificate: ca.crt
        authentication:
          type: scram-sha-512
          username: mm2-dr-reader
          password_secret:
            secret_name:
              value: mm2-dr-reader
            password: password
      topics_pattern: ".*"
      groups_pattern: ".*"
      # DEFAULT replication policy, deliberately: mirrored topics
      # arrive as primary.<topic> on the DR cluster. Provenance stays
      # visible, a fail-back mirror cannot loop records, and DR-side
      # tooling can tell mirrored data from anything written locally.
      source_connector:
        tasks_max: 4
        config:
          refresh.topics.interval.seconds: "300"
        auto_restart:
          enabled: true
      # Checkpoints are the DR payoff: translated consumer offsets
      # land on the DR cluster continuously, so failed-over consumers
      # resume near where the primary's consumers left off.
      checkpoint_connector:
        config:
          refresh.groups.interval.seconds: "300"
          sync.group.offsets.enabled: "true"
        auto_restart:
          enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  jvm:
    xms: 1g
    xmx: 1g
  metrics:
    enabled: true
