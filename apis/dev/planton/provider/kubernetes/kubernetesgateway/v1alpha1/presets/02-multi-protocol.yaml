apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGateway
metadata:
  name: my-multi-protocol-gateway
spec:
  namespace:
    value: istio-ingress
  gatewayClassName:
    value: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      hostname: app.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          # Foreign key: `value:` names an existing Secret literally; switch to
          # `valueFrom:` (kind KubernetesCertificate, fieldPath
          # status.outputs.secret_name) to reference a Planton-managed
          # certificate's Secret and deploy in dependency order.
          - name:
              value: <tls-secret-name>
    - name: postgres
      port: 5432
      protocol: TCP
