# Mesh fixture for the aws-lb-address scenario: the same istiod control
# plane the routing proofs use, but WITHOUT the ClusterIP pinning — the
# gateway_defaults stay on the chart's LoadBalancer default, so istiod's
# auto-provisioned gateway services ask the host cloud for a real load
# balancer. Only meaningful where a cloud LB controller exists, which is
# why the scenario rides the aws-eks profile.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIstio
metadata:
  name: e2e-istio-prereq
spec:
  namespace:
    value: istio-system
  create_namespace: true
  dataplane_mode: sidecar
