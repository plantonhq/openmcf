# The composition proof: a real KubernetesGatewayClass fixture deploys first
# (the e2e-prerequisites annotation) and gateway_class_name resolves through a
# foreign-key reference to its exported gateway_class_name output -- the same
# wiring an infra chart uses to bind a Gateway to its class.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGateway
metadata:
  name: e2e-gw-composed
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesGatewayClass"
spec:
  namespace:
    value: default
  gateway_class_name:
    valueFrom:
      name: e2e-gwc-fixture
  listeners:
    - name: http
      port: 80
      protocol: HTTP
