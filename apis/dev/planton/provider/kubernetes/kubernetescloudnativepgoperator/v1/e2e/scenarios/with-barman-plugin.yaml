# The backup-capable install: the operator PLUS the Barman Cloud plugin —
# the posture every KubernetesPostgres backup block depends on. The plugin's
# internal TLS is issued by cert-manager, so the scenario chains the
# KubernetesCertManager fixture (a scenario-level prerequisite: ordinary
# operator installs don't need it, only the plugin arm does). The typed
# tuning fields ride along so the full rendered-values surface deploys.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCloudNativePgOperator
metadata:
  name: e2e-cnpg-with-plugin
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesCertManager"
spec:
  namespace:
    value: cnpg-system
  create_namespace: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  operator_config:
    INHERITED_ANNOTATIONS: e2e.planton.dev/tenant
  max_concurrent_reconciles: 5
  barman_cloud_plugin:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
