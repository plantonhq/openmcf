syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetescloudnativepgoperator.v1alpha1;

import "dev/planton/provider/kubernetes/kubernetescloudnativepgoperator/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// KubernetesCloudNativePgOperatorStackInput is the input for both IaC
// modules (Pulumi and Terraform) of the kubernetes-cloud-native-pg-operator
// deployment component.
message KubernetesCloudNativePgOperatorStackInput {
  // the kubernetes-cloud-native-pg-operator resource to deploy
  KubernetesCloudNativePgOperator target = 1;

  // kubernetes provider configuration
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
