apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTcpRoute
metadata:
  name: test-tcp-route
spec:
  namespace:
    value: test-namespace
  parentRefs:
    - name:
        value: test-gateway
      sectionName: tcp
      port: 5432
  rules:
    - name: postgres
      backendRefs:
        - name:
            value: tcp-backend
          port: 5432
          weight: 90
        - name:
            value: tcp-backend-replica
          port: 5432
          weight: 10
