# Full-surface manifest for offline module proofs (tofu validate/plan and
# pulumi preview). Exercises names, subject, key parameters, keystores,
# output formats, and the secret template; both engines must render an
# identical CR from it. (The is_ca + name_constraints arm is exercised by
# the CA-chain E2E scenario.)
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesCertificate
metadata:
  name: test-certificate
spec:
  namespace:
    value: team-a
  secretName: test-certificate-tls
  issuerRef:
    clusterIssuer:
      name:
        value: letsencrypt-staging
  dnsNames:
    - api.example.com
    - "*.apps.example.com"
  ipAddresses:
    - 10.0.0.10
  uris:
    - spiffe://cluster.local/ns/team-a/sa/api
  emailAddresses:
    - platform@example.com
  commonName: api.example.com
  subject:
    organizations:
      - Example Corp
    organizationalUnits:
      - Platform
    countries:
      - US
    provinces:
      - CA
    localities:
      - San Francisco
    streetAddresses:
      - 1 Example Way
    postalCodes:
      - "94105"
    serialNumber: "0042"
  otherNames:
    - oid: 1.3.6.1.4.1.311.20.2.3
      utf8Value: upn@example.com
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: rsa
    size: 4096
    encoding: pkcs8
    rotationPolicy: always
  usages:
    - digital signature
    - key encipherment
    - server auth
  encodeUsagesInRequest: true
  isCa: false
  signatureAlgorithm: SHA384WithRSA
  keystores:
    jks:
      create: true
      alias: certificate
      password: test-jks-password
    pkcs12:
      create: true
      password: test-p12-password
      profile: modern2023
  additionalOutputFormats:
    - type: der
    - type: combined_pem
  secretTemplate:
    labels:
      team: team-a
    annotations:
      example.com/rotation-owner: platform
  revisionHistoryLimit: 3
