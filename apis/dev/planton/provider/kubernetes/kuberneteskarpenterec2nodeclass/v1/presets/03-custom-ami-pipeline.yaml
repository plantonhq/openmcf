apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenterEc2NodeClass
metadata:
  name: custom-ami-pipeline
spec:
  amiSelectorTerms:
    # The custom-AMI-pipeline arm: the pipeline publishes each approved
    # image id to this SSM parameter; nodes drift to the new AMI when the
    # parameter changes — the pipeline, not "latest", controls rollout.
    - ssmParameter: '<ssm-parameter-name>' # e.g. /platform/eks/node-ami/current
  # REQUIRED when selecting AMIs by ssm-parameter (the bootstrap family
  # cannot be inferred). Match the family your pipeline builds from.
  amiFamily: AL2023
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: '<eks-cluster-name>'
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: '<eks-cluster-name>'
  role: '<karpenter-node-role-name>'
  kubelet:
    maxPods: 110 # override the ENI-based default
    # Keep node-critical daemons and Kubernetes components from being
    # starved by workload pods.
    kubeReserved:
      cpu: 200m
      memory: 512Mi
    systemReserved:
      cpu: 100m
      memory: 256Mi
    # Reclaim disk from unused images before it threatens the node: GC
    # always runs above 85% disk usage, never below 80%.
    imageGCHighThresholdPercent: 85
    imageGCLowThresholdPercent: 80
  # Applied to EC2 resources Karpenter creates (instances, launch
  # templates, volumes) — the ownership/cost-attribution trail.
  tags:
    team: '<owning-team>'
    cost-center: '<cost-center>'
