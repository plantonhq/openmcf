apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenterEc2NodeClass
metadata:
  name: bottlerocket-encrypted
spec:
  amiSelectorTerms:
    # Bottlerocket — the container-optimized, minimal-surface OS. NOTE:
    # "latest" drifts nodes when a new AMI ships; pin a release version
    # in production.
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: '<eks-cluster-name>'
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: '<eks-cluster-name>'
  role: '<karpenter-node-role-name>'
  blockDeviceMappings:
    # Bottlerocket's OS volume — small and read-mostly.
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 4Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: '<ebs-kms-key-id-alias-or-arn>' # customer-managed key
        deleteOnTermination: true
    # Bottlerocket's data volume — container images and pod storage; size
    # this one for your image and ephemeral-storage footprint.
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: '<ebs-kms-key-id-alias-or-arn>'
        deleteOnTermination: true
  metadataOptions:
    # CRD defaults made explicit — the EKS security best practice: IMDSv2
    # only, hop limit 1 (pods cannot reach the node's credentials), IPv6
    # metadata endpoint off.
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
