syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskarpenterec2nodeclass.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/options/options.proto";

// KubernetesKarpenterEc2NodeClassSpec declares a Karpenter EC2NodeClass —
// the AWS-level machine template NodePools launch instances from: which
// AMIs to boot, which subnets and security groups to attach, which IAM
// identity nodes assume, disk layout, kubelet configuration, and instance
// metadata posture. One NodeClass is typically shared by several NodePools
// (the pools differ in constraints and taints; the class is the common
// "how a node is built").
//
// Requires a Karpenter installation (KubernetesKarpenter) on an EKS or
// EKS-compatible cluster. The rendered EC2NodeClass is CLUSTER-SCOPED (no
// namespace) and named after metadata.name. 100% fidelity with the
// upstream karpenter.k8s.aws/v1 EC2NodeClass CRD at the pinned release
// (aws/karpenter-provider-aws pkg/apis/crds/
// karpenter.k8s.aws_ec2nodeclasses.yaml); the CRD's own CEL rules are
// mirrored below so mistakes surface at validate time, not at apply.
//
// Several field names here carry an explicit json_name: the CRD's keys use
// acronym casing (IP, ID, DNS, CFS, GC) that protojson would otherwise
// derive differently, and the API server rejects miscased keys as
// undeclared fields.
message KubernetesKarpenterEc2NodeClassSpec {
  // AMI selector terms — how the machine image is chosen. Terms are ORed;
  // fields within a term are ANDed. The simplest arm is a single term with
  // an alias ("al2023@v20240807" or "bottlerocket@latest"); tag/name/id/
  // ssm-parameter selection serves custom-AMI pipelines. Pin versions in
  // production — "latest" drifts nodes when a new AMI ships.
  repeated KubernetesKarpenterEc2NodeClassAmiSelectorTerm ami_selector_terms = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 30
    },
    (buf.validate.field).cel = {
      id: "spec.ami_terms.at_least_one_selector"
      message: "each AMI selector term needs at least one of alias, id, name, ssm_parameter or tags"
      expression: "this.all(x, (has(x.alias) && x.alias != '') || (has(x.id) && x.id != '') || (has(x.name) && x.name != '') || (has(x.ssm_parameter) && x.ssm_parameter != '') || size(x.tags) > 0)"
    },
    (buf.validate.field).cel = {
      id: "spec.ami_terms.id_exclusive"
      message: "an AMI selector term with 'id' cannot combine it with alias, tags, name or owner"
      expression: "!this.exists(x, has(x.id) && x.id != '' && ((has(x.alias) && x.alias != '') || size(x.tags) > 0 || (has(x.name) && x.name != '') || (has(x.owner) && x.owner != '')))"
    },
    (buf.validate.field).cel = {
      id: "spec.ami_terms.alias_exclusive"
      message: "an AMI selector term with 'alias' cannot combine it with id, tags, name or owner"
      expression: "!this.exists(x, has(x.alias) && x.alias != '' && ((has(x.id) && x.id != '') || size(x.tags) > 0 || (has(x.name) && x.name != '') || (has(x.owner) && x.owner != '')))"
    },
    (buf.validate.field).cel = {
      id: "spec.ami_terms.alias_single_term"
      message: "when an alias term is used it must be the ONLY AMI selector term"
      expression: "!(this.exists(x, has(x.alias) && x.alias != '') && this.size() != 1)"
    }
  ];

  // UserData format / bootstrap family of the chosen AMIs: AL2, AL2023,
  // Bottlerocket, Windows2019, Windows2022, Windows2025 or Custom.
  // Optional when an alias term is used (inferred from the alias — and
  // then only its own family or Custom may be set); REQUIRED when
  // selecting AMIs by id/name/tags/ssm-parameter.
  optional string ami_family = 2 [
    json_name = "amiFamily",
    (buf.validate.field).cel = {
      id: "spec.ami_family_enum"
      message: "ami_family must be one of 'AL2', 'AL2023', 'Bottlerocket', 'Custom', 'Windows2019', 'Windows2022' or 'Windows2025'"
      expression: "this == '' || this in ['AL2', 'AL2023', 'Bottlerocket', 'Custom', 'Windows2019', 'Windows2022', 'Windows2025']"
    }
  ];

  // Subnet selector terms — where nodes launch. Terms are ORed; selection
  // is by tags (the standard karpenter.sh/discovery pattern) or explicit
  // subnet id. Karpenter spreads across the selected subnets' zones.
  repeated KubernetesKarpenterEc2NodeClassSubnetSelectorTerm subnet_selector_terms = 3 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 30
    },
    (buf.validate.field).cel = {
      id: "spec.subnet_terms.at_least_one_selector"
      message: "each subnet selector term needs 'id' or 'tags'"
      expression: "this.all(x, (has(x.id) && x.id != '') || size(x.tags) > 0)"
    },
    (buf.validate.field).cel = {
      id: "spec.subnet_terms.id_exclusive"
      message: "a subnet selector term with 'id' cannot also carry tags"
      expression: "!this.all(x, has(x.id) && x.id != '' && size(x.tags) > 0)"
    }
  ];

  // Security-group selector terms — what nodes' ENIs attach. Terms are
  // ORed; selection by tags, group name, or group id.
  repeated KubernetesKarpenterEc2NodeClassSecurityGroupSelectorTerm security_group_selector_terms = 4 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 30
    },
    (buf.validate.field).cel = {
      id: "spec.sg_terms.at_least_one_selector"
      message: "each security-group selector term needs one of id, name or tags"
      expression: "this.all(x, (has(x.id) && x.id != '') || (has(x.name) && x.name != '') || size(x.tags) > 0)"
    },
    (buf.validate.field).cel = {
      id: "spec.sg_terms.id_exclusive"
      message: "a security-group selector term with 'id' cannot combine it with tags or name"
      expression: "!this.all(x, has(x.id) && x.id != '' && (size(x.tags) > 0 || (has(x.name) && x.name != '')))"
    },
    (buf.validate.field).cel = {
      id: "spec.sg_terms.name_exclusive"
      message: "a security-group selector term with 'name' cannot combine it with tags or id"
      expression: "!this.all(x, has(x.name) && x.name != '' && (size(x.tags) > 0 || (has(x.id) && x.id != '')))"
    }
  ];

  // IAM role name nodes assume (Karpenter manages the instance profile for
  // it — needs iam:PassRole on the controller). Exactly one of role /
  // instance_profile must be set; role is the recommended arm.
  optional string role = 5 [(buf.validate.field).string.min_len = 1];

  // Pre-existing IAM instance-profile name nodes use, for accounts where
  // Karpenter must not manage profiles. Exactly one of role /
  // instance_profile must be set.
  optional string instance_profile = 6 [(buf.validate.field).string.min_len = 1];

  // Block device mappings for provisioned nodes. Empty = the AMI family's
  // defaults. At most one mapping may be the root volume.
  repeated KubernetesKarpenterEc2NodeClassBlockDeviceMapping block_device_mappings = 7 [
    (buf.validate.field).repeated.max_items = 50,
    (buf.validate.field).cel = {
      id: "spec.bdm.single_root_volume"
      message: "at most one block device mapping may set root_volume"
      expression: "this.filter(x, has(x.root_volume) ? x.root_volume == true : false).size() <= 1"
    }
  ];

  // Capacity-reservation selector terms (requires the reservedCapacity
  // feature gate, on by default): which On-Demand Capacity Reservations /
  // capacity blocks this class may launch into.
  repeated KubernetesKarpenterEc2NodeClassCapacityReservationSelectorTerm capacity_reservation_selector_terms = 8 [
    (buf.validate.field).repeated.max_items = 30,
    (buf.validate.field).cel = {
      id: "spec.cr_terms.at_least_one_selector"
      message: "each capacity-reservation selector term needs one of id, tags or instance_match_criteria"
      expression: "this.all(x, (has(x.id) && x.id != '') || size(x.tags) > 0 || (has(x.instance_match_criteria) && x.instance_match_criteria != ''))"
    },
    (buf.validate.field).cel = {
      id: "spec.cr_terms.id_exclusive"
      message: "a capacity-reservation selector term with 'id' cannot combine it with tags, owner_id or instance_match_criteria"
      expression: "this.size() == 0 || !this.all(x, has(x.id) && x.id != '' && (size(x.tags) > 0 || (has(x.owner_id) && x.owner_id != '') || (has(x.instance_match_criteria) && x.instance_match_criteria != '')))"
    }
  ];

  // Assign public IPv4 addresses to instances. Unset = AWS defaults by
  // subnet setting (public subnets assign, private do not) — set only to
  // override.
  optional bool associate_public_ip_address = 9 [json_name = "associatePublicIPAddress"];

  // ENI idle connection-tracking timeouts in the launch template.
  KubernetesKarpenterEc2NodeClassConnectionTracking connection_tracking = 10;

  // Reserved field in the EC2 CreateFleet API (rarely used; AWS-assigned
  // contexts).
  string context = 11;

  // CPU options for instances (nested virtualization).
  KubernetesKarpenterEc2NodeClassCpuOptions cpu_options = 12;

  // Enable detailed (1-minute) CloudWatch monitoring on instances.
  bool detailed_monitoring = 13;

  // How instance-store (ephemeral NVMe) disks are handled: "RAID0" stripes
  // them into one volume for pod ephemeral storage. Unset = untouched.
  optional string instance_store_policy = 14 [(buf.validate.field).cel = {
    id: "spec.instance_store_policy_enum"
    message: "instance_store_policy only supports 'RAID0'"
    expression: "this == '' || this == 'RAID0'"
  }];

  // Number of IPv4 prefixes to assign to each node's ENI (prefix
  // delegation — raises pod density beyond per-ENI IP limits).
  optional int32 ip_prefix_count = 15 [(buf.validate.field).int32.gte = 0];

  // Kubelet configuration for provisioned nodes (a supported subset of
  // upstream kubelet config, merged into bootstrap user data).
  KubernetesKarpenterEc2NodeClassKubelet kubelet = 16;

  // Instance Metadata Service exposure. CRD defaults enforce the EKS
  // security best practice: IMDSv2 required, hop limit 1 (pods cannot
  // reach the node's credentials), IPv6 endpoint disabled.
  KubernetesKarpenterEc2NodeClassMetadataOptions metadata_options = 17;

  // Explicit network-interface layout (multi-card / EFA topologies). Must
  // include a primary 'interface' at device index 0 on card 0; at most one
  // efa-only interface per card. Empty = one default interface.
  repeated KubernetesKarpenterEc2NodeClassNetworkInterface network_interfaces = 18 [
    (buf.validate.field).repeated.max_items = 150,
    (buf.validate.field).cel = {
      id: "spec.network_interfaces.primary_required"
      message: "network_interfaces must include a primary interface with interface_type 'interface' at device_index 0 on network_card_index 0"
      expression: "this.size() == 0 || this.exists(x, x.device_index == 0 && x.network_card_index == 0 && x.interface_type == 'interface')"
    },
    (buf.validate.field).cel = {
      id: "spec.network_interfaces.unique_and_efa"
      message: "network_interfaces must not repeat a (network_card_index, device_index) pair, and each network card may carry at most one efa-only interface"
      expression: "this.all(x, this.filter(y, x.network_card_index == y.network_card_index && x.device_index == y.device_index).size() == 1 && (x.interface_type != 'efa-only' || this.filter(y, x.network_card_index == y.network_card_index && y.interface_type == 'efa-only').size() == 1))"
    }
  ];

  // Placement group for provisioned instances (cluster/spread/partition
  // strategies), by name or id — exactly one when set.
  KubernetesKarpenterEc2NodeClassPlacementGroupSelector placement_group_selector = 19;

  // Tags applied to EC2 resources Karpenter creates (instances, launch
  // templates, volumes). The kubernetes.io/cluster/*, karpenter.sh/
  // nodepool, karpenter.sh/nodeclaim, karpenter.k8s.aws/ec2nodeclass and
  // eks:eks-cluster-name keys are controller-owned and rejected —
  // mirrored from the CRD.
  map<string, string> tags = 20 [(buf.validate.field).cel = {
    id: "spec.tags.restricted_keys"
    message: "tags may not use controller-owned keys: eks:eks-cluster-name, kubernetes.io/cluster/*, karpenter.sh/nodepool, karpenter.sh/nodeclaim, karpenter.k8s.aws/ec2nodeclass"
    expression: "this.all(k, k != '' && k != 'eks:eks-cluster-name' && !k.startsWith('kubernetes.io/cluster') && k != 'karpenter.sh/nodepool' && k != 'karpenter.sh/nodeclaim' && k != 'karpenter.k8s.aws/ec2nodeclass')"
  }];

  // Extra user data merged into the generated bootstrap configuration —
  // format follows the AMI family (MIME multi-part for AL2/AL2023, TOML
  // for Bottlerocket, PowerShell for Windows). Karpenter merges its own
  // required bootstrap fields into this.
  string user_data = 21;

  // Mirrors the CRD's identity and alias/family pairing rules.
  option (buf.validate.message).cel = {
    id: "spec.role_xor_instance_profile"
    message: "exactly one of role or instance_profile must be set — role lets Karpenter manage the instance profile (recommended); instance_profile brings your own"
    expression: "(has(this.role) && this.role != '') != (has(this.instance_profile) && this.instance_profile != '')"
  };
  option (buf.validate.message).cel = {
    id: "spec.ami_family_required_without_alias"
    message: "ami_family is required when no AMI selector term uses an alias (the family cannot be inferred)"
    expression: "this.ami_selector_terms.exists(x, has(x.alias) && x.alias != '') || (has(this.ami_family) && this.ami_family != '')"
  };
  option (buf.validate.message).cel = {
    id: "spec.ami_family_matches_alias"
    message: "when an alias term is used, ami_family may only be set to the alias's own family or 'Custom'"
    expression: "!has(this.ami_family) || this.ami_family == '' || this.ami_selector_terms.all(x, !has(x.alias) || x.alias == '' || this.ami_family == 'Custom' || this.ami_family.lowerAscii() == x.alias.split('@')[0])"
  };
}

// KubernetesKarpenterEc2NodeClassAmiSelectorTerm selects machine images.
// Fields within a term are ANDed.
message KubernetesKarpenterEc2NodeClassAmiSelectorTerm {
  // EKS-optimized AMI alias, "family@version" — families al2, al2023,
  // bottlerocket, windows2019, windows2022, windows2025. Version is an AMI
  // release ("al2023@v20240807") or "latest" (drifts nodes on new
  // releases; the only option for Windows families). Mutually exclusive
  // with every other selector field, and an alias term must be the list's
  // only term.
  optional string alias = 1 [
    (buf.validate.field).string.max_len = 30,
    (buf.validate.field).cel = {
      id: "spec.ami_term.alias_format"
      message: "alias must match 'family@version' with family one of al2, al2023, bottlerocket, windows2019, windows2022, windows2025 (Windows families only support 'latest')"
      expression: "this == '' || (this.matches('^[a-zA-Z0-9]+@.+$') && this.split('@')[0] in ['al2', 'al2023', 'bottlerocket', 'windows2019', 'windows2022', 'windows2025'] && (!(this.split('@')[0] in ['windows2019', 'windows2022', 'windows2025']) || this.split('@')[1] == 'latest'))"
    }
  ];

  // Explicit AMI id (ami-...). Mutually exclusive with the other fields.
  optional string id = 2 [(buf.validate.field).string.pattern = "^ami-[0-9a-z]+$"];

  // AMI name in EC2 (the name FIELD, not the Name tag). ANDs with owner.
  optional string name = 3;

  // AMI owner filter: account IDs, "self", "amazon", "aws-marketplace".
  optional string owner = 4;

  // Name (or ARN) of an SSM parameter holding the image id — the
  // custom-AMI-pipeline arm.
  optional string ssm_parameter = 5;

  // Tag selectors ('*' value matches any). Empty keys/values are invalid.
  map<string, string> tags = 6 [
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).cel = {
      id: "spec.ami_term.tags_non_empty"
      message: "AMI selector tags may not have empty keys or values"
      expression: "this.all(k, k != '' && this[k] != '')"
    }
  ];
}

// KubernetesKarpenterEc2NodeClassSubnetSelectorTerm selects launch subnets.
message KubernetesKarpenterEc2NodeClassSubnetSelectorTerm {
  // Explicit subnet id (subnet-...). Mutually exclusive with tags.
  optional string id = 1 [(buf.validate.field).string.pattern = "^subnet-[0-9a-z]+$"];

  // Tag selectors ('*' value matches any) — `karpenter.sh/discovery:
  // <cluster>` is the convention EKS setups tag their private subnets
  // with.
  map<string, string> tags = 2 [
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).cel = {
      id: "spec.subnet_term.tags_non_empty"
      message: "subnet selector tags may not have empty keys or values"
      expression: "this.all(k, k != '' && this[k] != '')"
    }
  ];
}

// KubernetesKarpenterEc2NodeClassSecurityGroupSelectorTerm selects node
// security groups.
message KubernetesKarpenterEc2NodeClassSecurityGroupSelectorTerm {
  // Explicit security-group id (sg-...). Mutually exclusive with the
  // other fields.
  optional string id = 1 [(buf.validate.field).string.pattern = "^sg-[0-9a-z]+$"];

  // Security-group name (the name FIELD, not the Name tag). Mutually
  // exclusive with the other fields.
  optional string name = 2;

  // Tag selectors ('*' value matches any).
  map<string, string> tags = 3 [
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).cel = {
      id: "spec.sg_term.tags_non_empty"
      message: "security-group selector tags may not have empty keys or values"
      expression: "this.all(k, k != '' && this[k] != '')"
    }
  ];
}

// KubernetesKarpenterEc2NodeClassCapacityReservationSelectorTerm selects
// On-Demand Capacity Reservations.
message KubernetesKarpenterEc2NodeClassCapacityReservationSelectorTerm {
  // Explicit capacity-reservation id (cr-...). Mutually exclusive with
  // the other fields.
  optional string id = 1 [(buf.validate.field).string.pattern = "^cr-[0-9a-z]+$"];

  // Match by how the reservation accepts instances: "open" or "targeted".
  optional string instance_match_criteria = 2 [(buf.validate.field).cel = {
    id: "spec.cr_term.match_criteria_enum"
    message: "instance_match_criteria must be 'open' or 'targeted'"
    expression: "this == '' || this in ['open', 'targeted']"
  }];

  // Owning AWS account id (12 digits) — for reservations shared across
  // accounts.
  optional string owner_id = 3 [
    json_name = "ownerID",
    (buf.validate.field).string.pattern = "^[0-9]{12}$"
  ];

  // Tag selectors ('*' value matches any).
  map<string, string> tags = 4 [
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).cel = {
      id: "spec.cr_term.tags_non_empty"
      message: "capacity-reservation selector tags may not have empty keys or values"
      expression: "this.all(k, k != '' && this[k] != '')"
    }
  ];
}

// KubernetesKarpenterEc2NodeClassBlockDeviceMapping maps one block device.
message KubernetesKarpenterEc2NodeClassBlockDeviceMapping {
  // Device name (e.g. "/dev/xvda").
  string device_name = 1;

  // EBS volume parameters for the device.
  KubernetesKarpenterEc2NodeClassEbs ebs = 2;

  // Marks this device as the kubelet root volume (at most one mapping).
  optional bool root_volume = 3;
}

// KubernetesKarpenterEc2NodeClassEbs configures an EBS volume.
message KubernetesKarpenterEc2NodeClassEbs {
  // Delete the volume when the instance terminates.
  optional bool delete_on_termination = 1;

  // Encrypt the volume (cannot be set when snapshot_id supplies the
  // encryption state).
  optional bool encrypted = 2;

  // Provisioned IOPS (gp3: 3000-16000; io1/io2: 100-64000; unsupported
  // for gp2/st1/sc1/standard).
  optional int64 iops = 3;

  // Customer-managed KMS key (id, alias, or ARN) for encryption.
  optional string kms_key_id = 4 [json_name = "kmsKeyID"];

  // Snapshot to create the volume from. Either snapshot_id or volume_size
  // must be set — mirrored from the CRD.
  optional string snapshot_id = 5 [json_name = "snapshotID"];

  // gp3 throughput in MiB/s (125-1000).
  optional int64 throughput = 6 [(buf.validate.field).int64 = {
    gte: 125
    lte: 1000
  }];

  // EBS Provisioned Rate for Volume Initialization in MiB/s (100-300);
  // only valid with snapshot_id.
  optional int32 volume_initialization_rate = 7 [(buf.validate.field).int32 = {
    gte: 100
    lte: 300
  }];

  // Volume size as a quantity in Gi/G/Ti/T (e.g. "100Gi"). Either
  // snapshot_id or volume_size must be set.
  optional string volume_size = 8 [(buf.validate.field).string.pattern = "^((?:[1-9][0-9]{0,3}|[1-4][0-9]{4}|[5][0-8][0-9]{3}|59000)Gi|(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|[6][0-3][0-9]{3}|64000)G|([1-9]||[1-5][0-7]|58)Ti|([1-9]||[1-5][0-9]|6[0-3]|64)T)$"];

  // Volume type: standard, io1, io2, gp2, sc1, st1, gp3.
  optional string volume_type = 9 [(buf.validate.field).cel = {
    id: "spec.ebs.volume_type_enum"
    message: "volume_type must be one of 'standard', 'io1', 'io2', 'gp2', 'sc1', 'st1' or 'gp3'"
    expression: "this == '' || this in ['standard', 'io1', 'io2', 'gp2', 'sc1', 'st1', 'gp3']"
  }];

  option (buf.validate.message).cel = {
    id: "spec.ebs.snapshot_or_size"
    message: "an EBS mapping needs snapshot_id or volume_size (or both) — without either there is nothing to create"
    expression: "(has(this.snapshot_id) && this.snapshot_id != '') || (has(this.volume_size) && this.volume_size != '')"
  };
  option (buf.validate.message).cel = {
    id: "spec.ebs.init_rate_needs_snapshot"
    message: "volume_initialization_rate only applies when snapshot_id is set — it is the snapshot-download rate"
    expression: "!has(this.volume_initialization_rate) || (has(this.snapshot_id) && this.snapshot_id != '')"
  };
}

// KubernetesKarpenterEc2NodeClassConnectionTracking tunes ENI idle
// connection-tracking timeouts (EFA-only interfaces excluded). At least one
// timeout must be set when the block is present — mirrored from the CRD.
message KubernetesKarpenterEc2NodeClassConnectionTracking {
  // Idle timeout for established TCP connections, seconds (60-432000).
  optional int32 tcp_established_timeout = 1 [(buf.validate.field).int32 = {
    gte: 60
    lte: 432000
  }];

  // Idle timeout for UDP stream flows, seconds (60-180).
  optional int32 udp_stream_timeout = 2 [(buf.validate.field).int32 = {
    gte: 60
    lte: 180
  }];

  // Idle timeout for single-transaction UDP flows, seconds (30-60).
  optional int32 udp_timeout = 3 [(buf.validate.field).int32 = {
    gte: 30
    lte: 60
  }];

  option (buf.validate.message).cel = {
    id: "spec.connection_tracking.at_least_one"
    message: "connection_tracking needs at least one of tcp_established_timeout, udp_stream_timeout or udp_timeout"
    expression: "has(this.tcp_established_timeout) || has(this.udp_stream_timeout) || has(this.udp_timeout)"
  };
}

// KubernetesKarpenterEc2NodeClassCpuOptions configures instance CPU options.
message KubernetesKarpenterEc2NodeClassCpuOptions {
  // Nested virtualization: "enabled" filters to instance types supporting
  // it; "disabled" turns it off.
  optional string nested_virtualization = 1 [(buf.validate.field).cel = {
    id: "spec.cpu_options.nested_virtualization_enum"
    message: "nested_virtualization must be 'enabled' or 'disabled'"
    expression: "this == '' || this in ['enabled', 'disabled']"
  }];
}

// KubernetesKarpenterEc2NodeClassKubelet configures kubelet on provisioned
// nodes (the upstream-supported subset).
message KubernetesKarpenterEc2NodeClassKubelet {
  // Cluster DNS server IPs.
  repeated string cluster_dns = 1 [json_name = "clusterDNS"];

  // Enforce CPU CFS quota for containers with CPU limits.
  optional bool cpu_cfs_quota = 2 [json_name = "cpuCFSQuota"];

  // Hard eviction thresholds by signal (memory.available,
  // nodefs.available, nodefs.inodesFree, imagefs.available,
  // imagefs.inodesFree, pid.available) — quantity or percentage values.
  map<string, string> eviction_hard = 3 [(buf.validate.field).cel = {
    id: "spec.kubelet.eviction_hard_keys"
    message: "eviction_hard keys must be one of memory.available, nodefs.available, nodefs.inodesFree, imagefs.available, imagefs.inodesFree, pid.available"
    expression: "this.all(k, k in ['memory.available', 'nodefs.available', 'nodefs.inodesFree', 'imagefs.available', 'imagefs.inodesFree', 'pid.available'])"
  }];

  // Maximum grace period (seconds) for pods terminated on soft eviction.
  optional int32 eviction_max_pod_grace_period = 4;

  // Soft eviction thresholds by signal (same keys as eviction_hard). Every
  // signal here must have a matching eviction_soft_grace_period.
  map<string, string> eviction_soft = 5 [(buf.validate.field).cel = {
    id: "spec.kubelet.eviction_soft_keys"
    message: "eviction_soft keys must be one of memory.available, nodefs.available, nodefs.inodesFree, imagefs.available, imagefs.inodesFree, pid.available"
    expression: "this.all(k, k in ['memory.available', 'nodefs.available', 'nodefs.inodesFree', 'imagefs.available', 'imagefs.inodesFree', 'pid.available'])"
  }];

  // Grace periods per soft-eviction signal (same keys as eviction_soft).
  map<string, string> eviction_soft_grace_period = 6 [(buf.validate.field).cel = {
    id: "spec.kubelet.eviction_soft_grace_keys"
    message: "eviction_soft_grace_period keys must be one of memory.available, nodefs.available, nodefs.inodesFree, imagefs.available, imagefs.inodesFree, pid.available"
    expression: "this.all(k, k in ['memory.available', 'nodefs.available', 'nodefs.inodesFree', 'imagefs.available', 'imagefs.inodesFree', 'pid.available'])"
  }];

  // Disk usage percentage that always triggers image garbage collection
  // (0-100; must exceed image_gc_low_threshold_percent).
  optional int32 image_gc_high_threshold_percent = 7 [
    json_name = "imageGCHighThresholdPercent",
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // Disk usage percentage below which image GC never runs (0-100).
  optional int32 image_gc_low_threshold_percent = 8 [
    json_name = "imageGCLowThresholdPercent",
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // Resources reserved for Kubernetes system components (keys cpu, memory,
  // ephemeral-storage, pid; non-negative quantities).
  map<string, string> kube_reserved = 9 [(buf.validate.field).cel = {
    id: "spec.kubelet.kube_reserved_keys"
    message: "kube_reserved keys must be one of cpu, memory, ephemeral-storage, pid, with non-negative quantity values"
    expression: "this.all(k, k in ['cpu', 'memory', 'ephemeral-storage', 'pid'] && !this[k].startsWith('-'))"
  }];

  // Maximum pods per node (overrides the ENI-based default).
  optional int32 max_pods = 10 [(buf.validate.field).int32.gte = 0];

  // Pods per CPU core cap (max_pods still wins when lower).
  optional int32 pods_per_core = 11 [(buf.validate.field).int32.gte = 0];

  // Resources reserved for OS daemons and kernel (same keys as
  // kube_reserved).
  map<string, string> system_reserved = 12 [(buf.validate.field).cel = {
    id: "spec.kubelet.system_reserved_keys"
    message: "system_reserved keys must be one of cpu, memory, ephemeral-storage, pid, with non-negative quantity values"
    expression: "this.all(k, k in ['cpu', 'memory', 'ephemeral-storage', 'pid'] && !this[k].startsWith('-'))"
  }];

  option (buf.validate.message).cel = {
    id: "spec.kubelet.image_gc_ordering"
    message: "image_gc_high_threshold_percent must be greater than image_gc_low_threshold_percent"
    expression: "!(has(this.image_gc_high_threshold_percent) && has(this.image_gc_low_threshold_percent)) || this.image_gc_high_threshold_percent > this.image_gc_low_threshold_percent"
  };
  option (buf.validate.message).cel = {
    id: "spec.kubelet.eviction_soft_pairing"
    message: "every eviction_soft signal needs a matching eviction_soft_grace_period entry (and vice versa)"
    expression: "this.eviction_soft.all(e, e in this.eviction_soft_grace_period) && this.eviction_soft_grace_period.all(e, e in this.eviction_soft)"
  };
}

// KubernetesKarpenterEc2NodeClassMetadataOptions configures IMDS exposure.
message KubernetesKarpenterEc2NodeClassMetadataOptions {
  // Enable/disable the HTTP metadata endpoint. CRD default: "enabled"
  // ("disabled" removes instance metadata entirely — most node bootstraps
  // need it).
  optional string http_endpoint = 1 [
    (dev.planton.shared.options.default) = "enabled",
    (buf.validate.field).cel = {
      id: "spec.imds.http_endpoint_enum"
      message: "http_endpoint must be 'enabled' or 'disabled'"
      expression: "this == '' || this in ['enabled', 'disabled']"
    }
  ];

  // Enable the IPv6 metadata endpoint. CRD default: "disabled".
  optional string http_protocol_ipv6 = 2 [
    json_name = "httpProtocolIPv6",
    (dev.planton.shared.options.default) = "disabled",
    (buf.validate.field).cel = {
      id: "spec.imds.http_protocol_ipv6_enum"
      message: "http_protocol_ipv6 must be 'enabled' or 'disabled'"
      expression: "this == '' || this in ['enabled', 'disabled']"
    }
  ];

  // IMDS PUT response hop limit (1-64). CRD default: 1 — pods cannot reach
  // the node's instance credentials (the EKS security best practice).
  optional int64 http_put_response_hop_limit = 3 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int64 = {
      gte: 1
      lte: 64
    }
  ];

  // IMDSv2 token requirement: "required" (CRD default — v2 only) or
  // "optional" (v1 fallback allowed; weaker).
  optional string http_tokens = 4 [
    (dev.planton.shared.options.default) = "required",
    (dev.planton.shared.options.sensitive_exempt_reason) = "IMDS token-requirement MODE (the enum 'required'/'optional'), not a token value",
    (buf.validate.field).cel = {
      id: "spec.imds.http_tokens_enum"
      message: "http_tokens must be 'required' or 'optional'"
      expression: "this == '' || this in ['required', 'optional']"
    }
  ];
}

// KubernetesKarpenterEc2NodeClassNetworkInterface configures one network
// interface attachment.
message KubernetesKarpenterEc2NodeClassNetworkInterface {
  // Device index for the attachment (0 = primary).
  int32 device_index = 1 [(buf.validate.field).int32.gte = 0];

  // Interface type: "interface" (standard ENI) or "efa-only" (Elastic
  // Fabric Adapter without IP networking).
  string interface_type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "spec.nic.interface_type_enum"
      message: "interface_type must be 'interface' or 'efa-only'"
      expression: "this in ['interface', 'efa-only']"
    }
  ];

  // Index of the network card to attach to (multi-card instance types).
  int32 network_card_index = 3 [(buf.validate.field).int32.gte = 0];
}

// KubernetesKarpenterEc2NodeClassPlacementGroupSelector selects a placement
// group by name XOR id.
message KubernetesKarpenterEc2NodeClassPlacementGroupSelector {
  // Placement-group name.
  optional string name = 1 [(buf.validate.field).string.min_len = 1];

  // Placement-group id (pg-...).
  optional string id = 2 [(buf.validate.field).string.pattern = "^pg-[0-9a-z]+$"];

  option (buf.validate.message).cel = {
    id: "spec.placement_group.name_xor_id"
    message: "exactly one of name or id must identify the placement group"
    expression: "(has(this.name) && this.name != '') != (has(this.id) && this.id != '')"
  };
}
