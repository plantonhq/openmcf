apiVersion: kubernetes.planton.dev/v1
kind: KubernetesArgocd
metadata:
  name: team-argocd
spec:
  namespace:
    value: gitops
  create_namespace: true
  # The public name exposure serves this Argo CD at — SSO redirect URLs
  # and CLI login hints embed it. Compose the actual exposure from
  # KubernetesIngress / a Gateway kind over the exported server_service
  # handle.
  domain: argocd.example.com
  server:
    # TLS terminates at the composed edge; the server speaks plain HTTP
    # behind it (leaving the self-signed listener on would
    # double-encrypt and break gRPC CLI traffic).
    insecure: true
  # Direct OIDC against the identity provider. The client secret NEVER
  # rides this manifest: the referenced Secret must exist in the gitops
  # namespace and carry the label `app.kubernetes.io/part-of: argocd`
  # (compose it from KubernetesSecret or KubernetesExternalSecret).
  sso:
    oidc:
      name: Okta
      issuer: https://example.okta.com
      client_id: argocd
      client_secret_secret:
        name: argocd-oidc
        key: clientSecret
  # Argo CD's own RBAC: everyone authenticated reads; the platform
  # group administers. The `groups` scope comes from the OIDC token.
  rbac:
    policy_default: role:readonly
    policy_csv: |
      g, example-org:platform, role:admin
  # SSO is live and policy-bound — the local admin (and its generated
  # password Secret) retires.
  admin_enabled: false
  # Chat/webhook notifications stay on; configure notifiers, templates
  # and triggers via helm_values (their tokens ride Secrets through
  # Argo CD's own $<secret>:<key> indirection).
  notifications:
    enabled: true
