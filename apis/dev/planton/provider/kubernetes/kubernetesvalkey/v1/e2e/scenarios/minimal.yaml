# The baseline: a standalone in-memory cache with a memory ceiling and an
# eviction policy — the pure-cache posture (no volume, no auth: development
# or NetworkPolicy-fenced usage). Deliberately the smallest honest shape.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesValkey
metadata:
  name: e2e-vlk-minimal
spec:
  namespace:
    value: e2e-vlk-minimal
  create_namespace: true
  config:
    max_memory: 64mb
    max_memory_policy: allkeys-lru
    snapshots_disabled: true
