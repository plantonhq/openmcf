apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: kubernetesvalkey
spec:
  # Valkey installs as one Helm release NAMED AFTER metadata.name, plus
  # an optional auth Secret (`<name>-auth`, count-indexed — keyed "0")
  # and the optional anchor namespace. Multiple Valkey instances coexist
  # in one cluster, so nothing here is a fixed chart name.
  values:
    - name: release_name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name (and the chart's fullnameOverride pins every
        derived Service/StatefulSet the same way).
    - name: release_namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
    - name: secret_name
      tofu_resource_name: auth
      derivations:
        - from_metadata_name_suffix: "-auth"
      where_to_find: >-
        Present only when ACL auth is enabled; always
        "<resource-name>-auth" — `kubectl get secrets -n <namespace>`.
        Scoped because the TF resource is count-indexed (address key "0").
    - name: secret_namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the installation.
