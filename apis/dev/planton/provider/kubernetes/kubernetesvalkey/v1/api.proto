syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesvalkey.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesvalkey/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesvalkey/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

/**
 * KubernetesValkey deploys Valkey — the Redis-compatible in-memory data
 * store — from the official Valkey Helm chart: standalone or
 * primary/replica, with declared ACL auth, typed durability
 * configuration, TLS, and metrics.
 */
message KubernetesValkey {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesValkey'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesValkeySpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesValkeyStatus status = 5;
}

//KubernetesValkey status.
message KubernetesValkeyStatus {
  //stack-outputs
  KubernetesValkeyStackOutputs outputs = 1;
}
