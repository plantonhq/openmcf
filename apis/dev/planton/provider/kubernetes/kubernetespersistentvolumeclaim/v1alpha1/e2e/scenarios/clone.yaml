# The clone provisioning proof on the aws-eks profile: this claim clones
# the fixture's source PVC through the typed data_source arm (CSI
# volume cloning — same driver, same namespace). The behavioral verifier
# waits for the fixture's writer Job, schedules a reader pod against THIS
# claim (triggering the clone provisioning), and asserts the marker data
# came across.
#
# Pulumi-only by documented design: the Terraform provider cannot express
# PVC data sources (PARITY-EXCEPTION with a plan-time precondition), so the
# terraform lane skips rather than failing on its own designed rejection.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPersistentVolumeClaim
metadata:
  name: e2e-pvc-clone
  annotations:
    planton.dev/e2e-cluster-profile: "aws-eks"
    planton.dev/e2e-engines: "pulumi"
    planton.dev/e2e-prerequisites: "apis/dev/planton/provider/kubernetes/kubernetespersistentvolumeclaim/v1alpha1/e2e/fixture-data-source.yaml"
spec:
  namespace:
    value: e2e-pvc-ds
  name: e2e-pvc-clone
  access_modes:
    - ReadWriteOnce
  storage_request: 1Gi
  storage_class_name:
    value: e2e-gp3
  data_source:
    kind: persistent_volume_claim
    name: e2e-pvc-ds-source
