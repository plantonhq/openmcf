syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetespersistentvolumeclaim.v1alpha1;

import "dev/planton/provider/kubernetes/kubernetespersistentvolumeclaim/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

/**
 * **KubernetesPersistentVolumeClaimStackInput** defines the input structure
 * for deploying a Kubernetes PersistentVolumeClaim. It carries the target
 * claim specification and the Kubernetes cluster configuration the IaC
 * modules (Pulumi and Terraform) need to reach the cluster.
 */
message KubernetesPersistentVolumeClaimStackInput {
  /**
   * The target PersistentVolumeClaim resource to be created.
   * Contains the complete specification including metadata, storage request,
   * and provisioning class.
   */
  KubernetesPersistentVolumeClaim target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes
   * cluster where the PersistentVolumeClaim will be created.
   */
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
