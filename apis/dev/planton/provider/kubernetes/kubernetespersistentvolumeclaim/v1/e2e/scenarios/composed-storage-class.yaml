# The composition proof: a real KubernetesStorageClass fixture deploys first
# (the e2e-prerequisites annotation) and the claim's class resolves through a
# foreign-key reference to its exported storage_class_name output — the same
# wiring an infra chart uses to pin claims to a platform-defined class.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPersistentVolumeClaim
metadata:
  name: e2e-pvc-composed
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesStorageClass"
spec:
  namespace:
    value: default
  name: e2e-pvc-composed
  access_modes:
    - ReadWriteOnce
  storage_request: 1Gi
  storage_class_name:
    valueFrom:
      name: e2e-sc-fixture
