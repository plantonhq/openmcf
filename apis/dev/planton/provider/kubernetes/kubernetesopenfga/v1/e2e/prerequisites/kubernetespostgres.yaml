# Consumer-scoped PostgreSQL fixture for the KubernetesOpenFga lanes —
# the composed datastore the postgres scenarios wire against:
# - SHARED NAMESPACE (e2e-openfga): the scenarios co-locate with this
#   fixture because the datastore password rides a secretKeyRef, and a
#   secretKeyRef can only read Secrets in the workload's own namespace.
# - `initdb` creates the `openfga` database owned by the `openfga`
#   role — ownership covers everything `openfga migrate` needs.
# - The operator maintains the `e2e-fga-pg-app` credential Secret (keys
#   username/password) across failovers — the scenarios' password
#   secretKeyRef target.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: e2e-fga-pg
spec:
  namespace:
    value: e2e-openfga
  create_namespace: true
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
