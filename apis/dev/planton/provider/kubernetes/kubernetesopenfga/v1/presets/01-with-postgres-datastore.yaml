apiVersion: kubernetes.planton.dev/v1
kind: KubernetesOpenFga
metadata:
  name: openfga
spec:
  namespace:
    value: openfga
  createNamespace: true
  replicas: 3
  datastore:
    postgres:
      host:
        valueFrom:
          name: my-postgres
      database: openfga
      username: openfga
      passwordSecret:
        secretName:
          valueFrom:
            name: my-postgres
  authn:
    preshared:
      existingKeysSecretName: openfga-api-keys
  metrics:
    enabled: true
