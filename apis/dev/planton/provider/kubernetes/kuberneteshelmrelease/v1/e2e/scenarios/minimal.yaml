# The smallest real Helm install: podinfo from its upstream HTTPS repository,
# pinned version, chart defaults. podinfo deploys one pod and one service —
# exactly what the Helm verifier asserts.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHelmRelease
metadata:
  name: e2e-helm-minimal
spec:
  namespace:
    value: e2e-helm-minimal-ns
  create_namespace: true
  repo: https://stefanprodan.github.io/podinfo
  chart: podinfo
  version: 6.9.2
