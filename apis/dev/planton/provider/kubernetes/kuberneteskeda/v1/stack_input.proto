syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskeda.v1;

import "dev/planton/provider/kubernetes/kuberneteskeda/v1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// Input for the KubernetesKeda IaC stack. The platform resolves all
// StringValueOrRef references (namespace, cert-manager issuer name) to
// literal strings before passing this to the IaC engine.
message KubernetesKedaStackInput {
  // Target cloud-resource.
  KubernetesKeda target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
