# Minimal KEDA: the engine installed cluster-wide with chart defaults —
# operator, external-metrics API server, admission webhooks, CRDs kept on
# uninstall. The verifier asserts all the way to the aggregation layer: the
# v1beta1.external.metrics.k8s.io APIService must report Available.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKeda
metadata:
  name: e2e-keda-minimal
spec:
  namespace:
    value: keda
  create_namespace: true
