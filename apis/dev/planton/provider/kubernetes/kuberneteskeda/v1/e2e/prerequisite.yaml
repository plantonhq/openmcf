# Dependency-install profile for KEDA. Deployed when a future scenario names
# KubernetesKeda in its e2e-prerequisites (workloads whose scaling
# declarations need the engine present). Minimal cluster-wide posture; the
# release name is fixed ("keda" — the external-metrics APIService is a
# cluster singleton), so consumers share this one installation.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKeda
metadata:
  name: e2e-keda-prereq
spec:
  namespace:
    value: keda
  create_namespace: true
