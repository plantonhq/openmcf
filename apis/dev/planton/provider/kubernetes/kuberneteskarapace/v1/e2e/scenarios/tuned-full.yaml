# The live-safe full surface: two replicas (leader election + follower
# forwarding actually exercised), the REST-proxy role deployed beside
# the registry, tuned registry behavior, sizing. The SASL/TLS Kafka
# connection arms and server TLS are offline-proven (the fixture serves
# one plaintext listener) — see the deferred-E2E ledger.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarapace
metadata:
  name: e2e-karapace-tuned
spec:
  namespace:
    value: e2e-krp-full
  create_namespace: true
  replicas: 2
  kafka:
    bootstrap_servers:
      valueFrom:
        name: e2e-kaf-fix
  registry:
    topic_name: e2e-schemas-full
    replication_factor: 1
    compatibility: FULL
    group_id: e2e-karapace-tuned-group
    master_election_strategy: highest
  rest_proxy:
    enabled: true
    replicas: 1
    port: 8082
  log_level: INFO
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
