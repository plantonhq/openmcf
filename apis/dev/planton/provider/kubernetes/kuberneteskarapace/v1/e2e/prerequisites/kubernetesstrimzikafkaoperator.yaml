# Consumer-scoped operator fixture for the KubernetesKarapace lanes:
# any-namespace watch, so the Kafka fixture (and the topics living beside
# it) reconcile wherever the lane puts them.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesStrimziKafkaOperator
metadata:
  name: e2e-stz-op-for-topics
spec:
  namespace:
    value: strimzi-system
  create_namespace: true
  watch:
    any_namespace: true
