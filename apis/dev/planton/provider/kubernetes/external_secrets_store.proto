syntax = "proto3";

package dev.planton.provider.kubernetes;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";
import "dev/planton/shared/options/options.proto";

// Shared configuration for External Secrets Operator (ESO) secret stores.
//
// Upstream gives SecretStore (namespaced) and ClusterSecretStore
// (cluster-scoped) an IDENTICAL spec — one provider connection plus common
// tuning. KubernetesSecretStore and KubernetesClusterSecretStore therefore
// share this one message: the two kinds differ only in scope (and the
// cluster kind's namespace conditions), and their IaC modules render the
// same config through one shared builder — drift between the twins is
// structurally impossible.
//
// AUTHENTICATION MODEL (per backend, uniform):
//   1. Keyless via a referenced ServiceAccount (the production posture):
//      the store names a ServiceAccount whose cloud identity binding (IRSA /
//      GKE Workload Identity / AKS Workload Identity — see
//      KubernetesServiceAccount) authorizes the read. ESO exchanges that
//      ServiceAccount's token with the cloud, so different stores can carry
//      DIFFERENT identities — the multi-team posture.
//   2. Keyless via the operator's ambient identity: leave the auth block
//      empty entirely; the controller's own ServiceAccount identity (see
//      KubernetesExternalSecretsOperator.workload_identity) or node identity
//      is used.
//   3. Declared static credentials (the fallback for hosts with no cloud
//      identity federation): sensitive values declared in the spec are
//      materialized by the IaC modules as a deterministically-named
//      Kubernetes Secret ("<metadata.name>-credentials" in the store's
//      secrets namespace), and the store's CR references that Secret. The
//      credential never appears inside the CR itself.
message ExternalSecretsStoreConfig {
  // The external secret backend this store connects to. Exactly one must be
  // set. Backends beyond these arms (IBM, Oracle, Akeyless, Doppler, ...)
  // are deliberately unmodeled until demand shows; a store for them can be
  // applied via KubernetesManifest.
  oneof backend {
    // AWS Secrets Manager / SSM Parameter Store.
    ExternalSecretsStoreAws aws = 1;

    // GCP Secret Manager.
    ExternalSecretsStoreGcp gcp_secret_manager = 2;

    // Azure Key Vault.
    ExternalSecretsStoreAzure azure_key_vault = 3;

    // HashiCorp Vault or OpenBao KV engine (OpenBao speaks the Vault API —
    // point `server` at the OpenBao endpoint).
    ExternalSecretsStoreVault vault = 4;

    // Another Kubernetes cluster's Secrets as the backend — the
    // cluster-to-cluster sync arm.
    ExternalSecretsStoreKubernetes kubernetes = 5;

    // ESO's built-in fake backend: serves the literal key/value entries
    // declared below. For pipelines, tests, and evaluating the sync
    // machinery without any external account; never for real secrets.
    ExternalSecretsStoreFake fake = 6;
  }

  // Only the operator installation whose controller_class matches reconciles
  // this store — the sharding knob. Empty = the default operator.
  string controller_class = 7;

  // How often ESO re-validates the store connection (Go duration, e.g.
  // "5m"). Empty = upstream default.
  string refresh_interval = 8 [(buf.validate.field).string = {pattern: "^$|^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"}];

  // Retry posture for failed backend reads.
  ExternalSecretsStoreRetry retry = 9;

  option (buf.validate.message).cel = {
    id: "esostore.backend_required"
    message: "Select the secret backend this store connects to — set exactly one of aws, gcp_secret_manager, azure_key_vault, vault, kubernetes, or fake"
    expression: "has(this.aws) || has(this.gcp_secret_manager) || has(this.azure_key_vault) || has(this.vault) || has(this.kubernetes) || has(this.fake)"
  };
}

// Retry posture for failed backend reads.
message ExternalSecretsStoreRetry {
  // Maximum retry attempts for a failed backend call.
  optional int32 max_retries = 1 [(buf.validate.field).int32.gte = 0];

  // Interval between retries (Go duration, e.g. "10s").
  string retry_interval = 2 [(buf.validate.field).string = {pattern: "^$|^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"}];
}

// AWS Secrets Manager / SSM Parameter Store backend.
message ExternalSecretsStoreAws {
  // Which AWS secrets service this store reads.
  // "SecretsManager": AWS Secrets Manager (the default posture).
  // "ParameterStore": SSM Parameter Store (cheaper, no automatic rotation).
  // "CertificateManager": ACM certificate export (niche; reads certificates).
  optional string service = 1 [
    (dev.planton.shared.options.default) = "SecretsManager",
    (buf.validate.field).string = {
      in: [
        "SecretsManager",
        "ParameterStore",
        "CertificateManager"
      ]
    }
  ];

  // AWS region the secrets live in (e.g. "us-east-1").
  string region = 2 [(buf.validate.field).required = true];

  // IAM role to assume for the reads (full ARN) — the cross-account pattern,
  // and how a single identity fans out to per-store roles. Accepts a literal
  // ARN or a reference to an AwsIamRole resource's output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Prefix prepended to every key this store fetches (e.g. "prod/") —
  // scopes the store to a subtree of the secrets namespace.
  string prefix = 4;

  // Keyless auth: ServiceAccount whose IRSA binding authorizes the reads.
  // Accepts a literal name or a reference to a KubernetesServiceAccount
  // resource's output. Leave everything empty for the operator's ambient
  // identity.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_name = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];

  // Namespace of service_account_name. Required on a ClusterSecretStore
  // (cluster scope has no home namespace to default to); on a SecretStore
  // it defaults to the store's own namespace.
  string service_account_namespace = 6;

  // Static AWS access key ID. Prefer keyless — set static keys only when no
  // cloud identity federation exists. Both halves must be set together; the
  // modules materialize them as a Kubernetes Secret the store references.
  string access_key_id = 7;

  // Static AWS secret access key (the secret half of the key pair).
  string secret_access_key = 8 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "esostore.aws.static_keys_paired"
    message: "access_key_id and secret_access_key form one credential — set both or neither"
    expression: "(this.access_key_id == '') == (this.secret_access_key == '')"
  };

  option (buf.validate.message).cel = {
    id: "esostore.aws.one_auth_mode"
    message: "Choose ONE authentication mode: a ServiceAccount reference (keyless) or static access keys — not both"
    expression: "!(has(this.service_account_name) && this.access_key_id != '')"
  };
}

// GCP Secret Manager backend.
message ExternalSecretsStoreGcp {
  // GCP project the secrets live in. Accepts a literal project ID or a
  // reference to a GcpProject resource's output.
  //
  // containment_exempt: names the project the store READS secrets from —
  // the store itself lives in the cluster, not the project.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  // Regional Secret Manager endpoint (e.g. "us-central1") for regional
  // secrets. Empty = the global endpoint.
  string location = 2;

  // Keyless auth: ServiceAccount whose GKE Workload Identity binding
  // authorizes the reads. Accepts a literal name or a reference to a
  // KubernetesServiceAccount resource's output. Leave everything empty for
  // the operator's ambient identity.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_name = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];

  // Namespace of service_account_name. Required on a ClusterSecretStore;
  // defaults to the store's own namespace on a SecretStore.
  string service_account_namespace = 4;

  // Static GCP service-account key (JSON). Prefer keyless — the modules
  // materialize it as a Kubernetes Secret the store references.
  string service_account_key_json = 5 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "esostore.gcp.one_auth_mode"
    message: "Choose ONE authentication mode: a ServiceAccount reference (keyless) or a service-account key — not both"
    expression: "!(has(this.service_account_name) && this.service_account_key_json != '')"
  };
}

// Azure Key Vault backend.
message ExternalSecretsStoreAzure {
  // Key Vault data-plane URL, e.g. "https://my-vault.vault.azure.net".
  // Reference an AzureKeyVault's vault_uri output -- in a composed
  // environment the reference is also the deploy-ordering edge, so the
  // vault exists before the store starts validating against it -- or pass
  // the literal URL of an existing vault. The store READS from the vault
  // (access, not containment), which is why the reference does not nest
  // the store inside it.
  dev.planton.shared.foreignkey.v1.StringValueOrRef vault_url = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureKeyVault,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.vault_uri"
  ];

  // Entra (Azure AD) tenant the identity lives in. Required for
  // service-principal and workload-identity auth.
  string tenant_id = 2;

  // How ESO authenticates to the vault.
  // "WorkloadIdentity": federate via the referenced ServiceAccount (or the
  //   operator's ambient identity) — the keyless AKS posture.
  // "ManagedIdentity": the cluster's (or identity_id's) managed identity —
  //   AKS without Workload Identity.
  // "ServicePrincipal": client_id + client_secret below — the fallback for
  //   clusters outside Azure.
  optional string auth_type = 3 [
    (dev.planton.shared.options.default) = "WorkloadIdentity",
    (buf.validate.field).string = {
      in: [
        "ServicePrincipal",
        "ManagedIdentity",
        "WorkloadIdentity"
      ]
    }
  ];

  // Client ID of a specific user-assigned managed identity (auth_type
  // ManagedIdentity) or of the Entra app to federate with (auth_type
  // WorkloadIdentity, when not carried by the ServiceAccount's annotation).
  string identity_id = 4;

  // Keyless auth: ServiceAccount whose AKS Workload Identity binding
  // authorizes the reads (auth_type WorkloadIdentity). Accepts a literal
  // name or a reference to a KubernetesServiceAccount resource's output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_name = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];

  // Namespace of service_account_name. Required on a ClusterSecretStore;
  // defaults to the store's own namespace on a SecretStore.
  string service_account_namespace = 6;

  // Service-principal application (client) ID (auth_type ServicePrincipal).
  // Both halves must be set together; the modules materialize the secret as
  // a Kubernetes Secret the store references.
  string client_id = 7;

  // Service-principal client secret (the secret half).
  string client_secret = 8 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "esostore.azure.sp_paired"
    message: "client_id and client_secret form one service-principal credential — set both or neither"
    expression: "(this.client_id == '') == (this.client_secret == '')"
  };

  option (buf.validate.message).cel = {
    id: "esostore.azure.sp_fields"
    message: "ServicePrincipal auth needs tenant_id, client_id, and client_secret"
    expression: "!(has(this.auth_type) && this.auth_type == 'ServicePrincipal') || (this.tenant_id != '' && this.client_id != '')"
  };
}

// HashiCorp Vault / OpenBao KV backend.
message ExternalSecretsStoreVault {
  // Vault/OpenBao server URL, e.g. "https://vault.example.com:8200".
  string server = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];

  // Mount path of the KV secrets engine (e.g. "secret"). Empty = upstream
  // default ("secret").
  string path = 2;

  // KV engine version. "v2" (versioned secrets, the modern default) or "v1".
  optional string version = 3 [
    (dev.planton.shared.options.default) = "v2",
    (buf.validate.field).string = {
      in: [
        "v1",
        "v2"
      ]
    }
  ];

  // Vault Enterprise / OpenBao namespace. Empty = the root namespace.
  string namespace = 4;

  // PEM CA bundle to trust the server's TLS certificate (private CAs).
  string ca_bundle = 5;

  // Exactly one authentication method must be set.
  oneof auth {
    // Static Vault token. The modules materialize it as a Kubernetes Secret
    // the store references. Tokens expire — prefer kubernetes auth for
    // anything long-lived.
    ExternalSecretsStoreVaultTokenAuth token = 6;

    // AppRole: machine identity via role_id + secret_id.
    ExternalSecretsStoreVaultAppRoleAuth app_role = 7;

    // Kubernetes auth: the cluster's ServiceAccount token is exchanged for
    // a Vault token — keyless from the cluster's perspective, the
    // production posture for in-cluster Vault/OpenBao.
    ExternalSecretsStoreVaultKubernetesAuth kubernetes = 8;
  }

  option (buf.validate.message).cel = {
    id: "esostore.vault.auth_required"
    message: "Select how ESO authenticates to Vault/OpenBao — set exactly one of token, app_role, or kubernetes"
    expression: "has(this.token) || has(this.app_role) || has(this.kubernetes)"
  };
}

// Static Vault token authentication.
message ExternalSecretsStoreVaultTokenAuth {
  // The Vault token.
  string token = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

// Vault AppRole authentication.
message ExternalSecretsStoreVaultAppRoleAuth {
  // Mount path of the AppRole auth method. Empty = upstream default
  // ("approle").
  string path = 1;

  // The AppRole role ID (public half).
  string role_id = 2 [(buf.validate.field).required = true];

  // The AppRole secret ID (secret half). The modules materialize it as a
  // Kubernetes Secret the store references.
  string secret_id = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

// Vault Kubernetes authentication.
message ExternalSecretsStoreVaultKubernetesAuth {
  // Mount path of the Kubernetes auth method. Empty = upstream default
  // ("kubernetes").
  string mount_path = 1;

  // Vault role to authenticate as (bound to ServiceAccounts server-side).
  string role = 2 [(buf.validate.field).required = true];

  // ServiceAccount whose token is presented to Vault. Accepts a literal
  // name or a reference to a KubernetesServiceAccount resource's output.
  // Empty = the operator's own ServiceAccount.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_name = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];
}

// Remote-Kubernetes-cluster backend: reads Secrets from ANOTHER cluster.
message ExternalSecretsStoreKubernetes {
  // Remote API server URL. Empty = upstream default ("kubernetes.default",
  // i.e. the local cluster — useful for cross-namespace sync through a
  // ClusterSecretStore).
  string server_url = 1;

  // PEM CA bundle to trust the remote API server's certificate.
  string ca_bundle = 2;

  // Remote namespace to read Secrets from. Empty = upstream default
  // ("default").
  string remote_namespace = 3;

  // Bearer token authenticating to the remote cluster (a remote
  // ServiceAccount's token). The modules materialize it as a Kubernetes
  // Secret the store references. Empty = authenticate with the local
  // ServiceAccount named below.
  string token = 4 [(dev.planton.shared.options.sensitive) = true];

  // Local ServiceAccount whose token authenticates to the remote cluster
  // (the remote cluster must trust this cluster's OIDC issuer). Accepts a
  // literal name or a reference to a KubernetesServiceAccount resource's
  // output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_name = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];

  option (buf.validate.message).cel = {
    id: "esostore.kubernetes.one_auth_mode"
    message: "Choose ONE authentication mode: a bearer token or a ServiceAccount reference — not both"
    expression: "!(this.token != '' && has(this.service_account_name))"
  };
}

// Fake backend: serves the declared entries. Test/sandbox only.
message ExternalSecretsStoreFake {
  // The key/value entries this store serves.
  repeated ExternalSecretsStoreFakeEntry data = 1 [(buf.validate.field).repeated.min_items = 1];
}

// One fake-store entry.
message ExternalSecretsStoreFakeEntry {
  // Remote key an ExternalSecret's remoteRef.key addresses.
  string key = 1 [(buf.validate.field).required = true];

  // Value served for the key.
  string value = 2 [(buf.validate.field).required = true];

  // Optional version gate: when set, only a remoteRef with the SAME version
  // string finds this entry (empty matches empty).
  string version = 3;
}
