# Full-surface shape: a 3-server JetStream cluster with flat authenticated
# users (module-generated passwords), websocket, metrics, LoadBalancer
# exposure and an escape-hatch entry — the offline plan/preview proof for
# the widest typed rendering.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNats
metadata:
  name: nats-full
spec:
  namespace:
    value: nats-full
  createNamespace: true
  cluster:
    enabled: true
    replicas: 3
  jetStream:
    diskSize: 20Gi
    maxFileStore: 18Gi
    memoryStoreMaxSize: 1Gi
  auth:
    users:
      - username: orders-service
        permissions:
          publishAllow:
            - "orders.>"
          subscribeAllow:
            - "orders.>"
            - "_INBOX.>"
      - username: auditor
        permissions:
          subscribeAllow:
            - ">"
          publishDeny:
            - ">"
    noAuthUser: auditor
  websocket:
    enabled: true
    port: 8080
  metrics:
    exporterEnabled: true
    podMonitorEnabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: load_balancer
    annotations:
      external-dns.alpha.kubernetes.io/hostname: nats.example.com
  scheduling:
    nodeSelector:
      workload-tier: messaging
  helmValues: |
    podTemplate:
      patch:
        - op: add
          path: /metadata/annotations
          value:
            team: platform
