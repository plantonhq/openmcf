apiVersion: kubernetes.planton.dev/v1
kind: KubernetesNats
metadata:
  name: nats
spec:
  namespace:
    value: nats
  create_namespace: true
  # Production posture: a 3-server cluster (tolerates one server down;
  # the floor for replicated R3 streams), sized JetStream file stores,
  # authenticated clients with least-privilege subjects, and the
  # Prometheus exporter scraped by an operator PodMonitor.
  cluster:
    enabled: true
    replicas: 3
  jet_stream:
    enabled: true
    disk_size: 20Gi
  auth:
    users:
      # Passwords are module-generated and land ONLY in the
      # `nats-auth` Secret (one key per username) — point workloads'
      # secretKeyRefs at it; nothing credential-shaped lives in this
      # manifest.
      - username: orders-service
        permissions:
          publish_allow:
            - orders.>
          subscribe_allow:
            - orders.>
            - _INBOX.>
      - username: platform-admin
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  metrics:
    exporter_enabled: true
    # Requires the Prometheus Operator CRDs on the cluster — a
    # KubernetesKubePrometheusStack composes naturally.
    pod_monitor_enabled: true
