apiVersion: kubernetes.planton.dev/v1
kind: KubernetesReferenceGrant
metadata:
  name: allow-gateway-secret-ref
spec:
  # The grant lives in the namespace being referenced INTO (where the Secret
  # lives). `value:` sets the namespace name literally; use `valueFrom:` to
  # reference a Planton-managed KubernetesNamespace instead.
  namespace:
    value: cert-manager
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-ingress  # the Gateway's namespace (literal name)
  to:
    - group: ""
      kind: Secret
