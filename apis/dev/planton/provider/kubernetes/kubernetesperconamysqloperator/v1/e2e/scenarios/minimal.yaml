# The baseline install: the operator alone, chart defaults — watching its
# own namespace, the upstream default posture. Proves the leanest path a
# single-namespace MySQL deployment uses.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPerconaMysqlOperator
metadata:
  name: e2e-pxc-op-minimal
spec:
  namespace:
    value: e2e-pxc-op-minimal
  create_namespace: true
