# The keyless AWS arm's install machinery: provider=aws with region env and
# zone-type filtering, NO static credentials. The AWS SDK resolves
# credentials lazily and the controller wraps Route 53 failures as soft
# errors (log-and-retry, never a crash) — so on a cluster with no AWS
# identity the Deployment is Available and the sync loop retries, which is
# exactly the state this scenario asserts. Real record writes ride the
# real-cluster lanes with IRSA.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalDns
metadata:
  name: e2e-edns-aws-keyless
spec:
  namespace:
    value: external-dns
  createNamespace: true
  awsRoute53:
    region: us-east-1
    zoneType: public
  policy: upsert-only
  txtOwnerId: e2e-aws
