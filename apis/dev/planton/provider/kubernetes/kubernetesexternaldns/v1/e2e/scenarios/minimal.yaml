# Chart-default install on the in-memory sandbox provider: namespace +
# release, nothing tuned. The controller runs the REAL reconciliation loop
# against its in-process zone store, so the install machinery (chart values,
# RBAC, sources) is fully exercised without any cloud account. Verifies the
# controller Deployment becomes Available.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesExternalDns
metadata:
  name: e2e-edns-minimal
spec:
  namespace:
    value: external-dns
  createNamespace: true
  inMemory:
    zones:
      - example.org
