# The observe proof: the console must report the declared cluster ONLINE
# through its own /api/clusters API — a console that renders but cannot
# reach its cluster is the failure mode install checks cannot see. The
# Kafka fixture chains via the scenario-level annotation (the console
# deploys fine without a cluster on ordinary lanes — no registry
# prerequisite; the framework doctrine). read_only exercises the
# observe-only posture.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaUi
metadata:
  name: e2e-kafkaui-observe
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesKafka"
spec:
  namespace:
    value: e2e-kui-observe
  create_namespace: true
  clusters:
    - name: fixture
      bootstrap_servers:
        valueFrom:
          name: e2e-kaf-fix
      read_only: true
