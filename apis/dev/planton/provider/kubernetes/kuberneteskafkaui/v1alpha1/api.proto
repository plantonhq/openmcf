syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskafkaui.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kuberneteskafkaui/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kuberneteskafkaui/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//kubernetes-kafka-ui
message KubernetesKafkaUi {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKafkaUi'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKafkaUiSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKafkaUiStatus status = 5;
}

//kubernetes-kafka-ui status
message KubernetesKafkaUiStatus {
  //stack-outputs
  KubernetesKafkaUiStackOutputs outputs = 1;
}
