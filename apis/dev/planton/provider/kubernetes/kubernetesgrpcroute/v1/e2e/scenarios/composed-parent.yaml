# The composition proof: the route's parent resolves through the Gateway
# foreign key against a live Gateway fixture.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGrpcRoute
metadata:
  name: e2e-grpc-composed
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesGateway"
spec:
  namespace:
    value: default
  parent_refs:
    - name:
        valueFrom:
          name: e2e-gw-fixture
      section_name: http
  hostnames:
    - grpc.composed.e2e.example.com
  rules:
    - matches:
        - method:
            service: helloworld.Greeter
            method: SayHello
      backend_refs:
        - name:
            value: greeter
          port: 9000
          weight: 100
