# Consumer-scoped SeaweedFS fixture for the KubernetesFlinkDeployment
# behavioral-recovery lane — the in-cluster S3 store checkpoints, HA
# metadata, and savepoints land in:
# - JOINS the fixture-owned namespace (the operator fixture deploys
#   first with create_namespace and owns e2e-flink).
# - The scenario reads the store's own GENERATED admin credential
#   Secret (`<name>-s3-secret`) through secretKeyRefs at POD RUNTIME —
#   unlike values-declared compositions, nothing needs to know the
#   keys declaratively, so no existing-config-secret arm is needed.
# - One install-hook bucket (flink-state): Flink does not create
#   buckets.
# - 1/1/1 tiers on small PVCs (kind-honest sizing; the chart's REQUIRED
#   pod anti-affinity makes multi-replica tiers unschedulable on one
#   node), embedded gateway on the filer.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSeaweedFs
metadata:
  name: e2e-flnk-swfs
spec:
  namespace:
    value: e2e-flink
  master:
    data_volume:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  volume:
    data_volume:
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  filer:
    data_volume:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  s3:
    enabled: true
    enable_auth: true
    buckets:
      - name: flink-state
