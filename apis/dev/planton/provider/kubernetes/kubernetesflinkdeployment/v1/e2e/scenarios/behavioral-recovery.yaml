# THE RECOVERY PROOF: the StateMachine example on the LAST-STATE
# upgrade path with checkpoints, savepoints, and Kubernetes HA metadata
# all landing in the composed SeaweedFS (credentials read from the
# store's own generated Secret at pod runtime; the S3 filesystem plugin
# activated from the image's bundled set — the jar name below must
# match the image's Flink patch version, verified live by this lane).
# The verifier observes completed checkpoints through the REST API,
# DELETES the JobManager pod (UID-verified replacement), and asserts
# the job returns to RUNNING with checkpoint continuity — recovery
# through HA metadata + checkpoint restore, state outside the pods.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesFlinkDeployment
metadata:
  name: e2e-flnkd-rec
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesFlinkOperator,KubernetesSeaweedFs"
spec:
  namespace:
    value: e2e-flink
  flinkVersion: v2_1
  job:
    jarUri: local:///opt/flink/examples/streaming/StateMachineExample.jar
    parallelism: 2
    upgradeMode: last-state
  flinkConfiguration:
    execution.checkpointing.interval: 10s
  state:
    checkpointsDir: s3://flink-state/checkpoints/e2e-flnkd-rec
    savepointsDir: s3://flink-state/savepoints/e2e-flnkd-rec
    highAvailability:
      enabled: true
      storageDir: s3://flink-state/ha/e2e-flnkd-rec
    s3:
      endpoint:
        value: http://e2e-flnk-swfs-s3.e2e-flink.svc.cluster.local:8333
      accessKeySecret:
        name:
          value: e2e-flnk-swfs-s3-secret
        key: admin_access_key_id
      secretKeySecret:
        name:
          value: e2e-flnk-swfs-s3-secret
        key: admin_secret_access_key
      builtinPluginJar: flink-s3-fs-hadoop-2.1.0.jar
  taskManager:
    resources:
      requests:
        cpu: 500m
        memory: 1536Mi
      limits:
        cpu: "1"
        memory: 2Gi
  jobManager:
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        cpu: "1"
        memory: 2Gi
