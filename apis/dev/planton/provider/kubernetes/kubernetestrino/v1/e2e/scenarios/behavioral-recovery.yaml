# THE RECOVERY PROOF: Trino is stateless by design — the verifier
# answers the query proof, deletes the coordinator pod (UID-verified
# replacement), and answers the SAME query from a fresh session.
# Recovery is a property of the design, not an accident of timing.
# Sized like the minimal shape; the sample catalogs carry the query.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTrino
metadata:
  name: e2e-trino-beh
spec:
  namespace:
    value: e2e-trino
  coordinator:
    jvm:
      max_heap_percent: 60
    max_query_memory_per_node: 512MB
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 1536Mi
  workers:
    replicas: 1
    jvm:
      max_heap_percent: 60
    max_query_memory_per_node: 512MB
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 1536Mi
