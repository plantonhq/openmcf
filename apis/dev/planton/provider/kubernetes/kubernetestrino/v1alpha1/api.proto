syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetestrino.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetestrino/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetestrino/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//trino-kubernetes
message KubernetesTrino {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesTrino'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesTrinoSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesTrinoStatus status = 5;
}

//trino-kubernetes status.
message KubernetesTrinoStatus {
  //stack-outputs
  KubernetesTrinoStackOutputs outputs = 1;
}
