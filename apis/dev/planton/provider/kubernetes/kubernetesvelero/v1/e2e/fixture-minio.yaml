# In-cluster S3-compatible object store for the Velero lanes: a single-node
# MinIO plus a one-shot bucket-provisioning Job, carried as one
# KubernetesManifest fixture. Velero's default BackupStorageLocation points
# at this Service, so the FULL backup/restore loop is provable on the kind
# cluster with no cloud account. The Job retries (backoffLimit) until MinIO
# answers, so fixture ordering needs no special handling. Credentials are
# MinIO's well-known test defaults — nothing here is a real secret.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesManifest
metadata:
  name: e2e-velero-minio
spec:
  namespace:
    value: e2e-velero-minio
  create_namespace: true
  manifest_yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: minio
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: e2e-velero-minio
      template:
        metadata:
          labels:
            app: e2e-velero-minio
        spec:
          containers:
            - name: minio
              image: minio/minio:RELEASE.2025-09-07T16-13-09Z
              args: ["server", "/data"]
              env:
                - name: MINIO_ROOT_USER
                  value: minioadmin
                - name: MINIO_ROOT_PASSWORD
                  value: minioadmin
              ports:
                - containerPort: 9000
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: minio
    spec:
      selector:
        app: e2e-velero-minio
      ports:
        - port: 9000
          targetPort: 9000
    ---
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: minio-make-bucket
    spec:
      backoffLimit: 20
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mc
              image: minio/mc:RELEASE.2025-08-13T08-35-41Z
              command:
                - /bin/sh
                - -c
                - >
                  mc alias set local http://minio.e2e-velero-minio.svc.cluster.local:9000
                  minioadmin minioadmin &&
                  mc mb -p local/velero-backups
