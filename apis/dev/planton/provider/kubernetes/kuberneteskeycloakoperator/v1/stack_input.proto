syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskeycloakoperator.v1;

import "dev/planton/provider/kubernetes/kuberneteskeycloakoperator/v1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// KubernetesKeycloakOperatorStackInput defines the inputs required for the Keycloak Operator IaC modules.
message KubernetesKeycloakOperatorStackInput {
  // target cloud-resource
  KubernetesKeycloakOperator target = 1;
  // provider-config for Kubernetes
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
