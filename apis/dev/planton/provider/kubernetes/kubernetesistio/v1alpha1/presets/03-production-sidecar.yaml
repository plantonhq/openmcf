apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesIstio
metadata:
  name: prod-mesh
spec:
  namespace:
    value: istio-system
  createNamespace: true
  dataplaneMode: sidecar
  istiod:
    autoscale:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCpuUtilizationPercent: 75
    podDisruptionBudget: true
    # istiod should never be evicted before the workloads that depend on it.
    priorityClassName: system-cluster-critical
  meshConfig:
    # Set a stable, organization-unique trust domain BEFORE production —
    # changing it later re-identifies every workload in the mesh.
    trustDomain: prod.mesh.example.internal
    # Egress lockdown: sidecars only reach destinations in the service
    # registry; every external service must be declared with a
    # KubernetesServiceEntry.
    outboundTrafficPolicyMode: REGISTRY_ONLY
    accessLogFile: /dev/stdout
  # The node-level CNI agent replaces the injected privileged init-container —
  # tighter pod security; required on platforms that forbid NET_ADMIN init
  # containers.
  cni:
    enabled: true
