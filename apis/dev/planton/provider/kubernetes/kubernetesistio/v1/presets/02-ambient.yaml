apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIstio
metadata:
  name: ambient-mesh
spec:
  namespace:
    value: istio-system
  createNamespace: true
  # Ambient data plane: no sidecars — the istio-cni node agent and the
  # ztunnel per-node proxy install alongside istiod. Namespaces enroll with
  # the istio.io/dataplane-mode=ambient label; waypoints add L7 where needed.
  dataplaneMode: ambient
  ztunnel:
    # ztunnel memory scales with cluster size and connection volume; the
    # chart default request (200m/512Mi) covers large clusters already.
    logLevel: info
  # On clusters without a cloud load balancer (bare metal, kind, k3s), let
  # auto-provisioned Gateway API gateways expose via NodePort.
  gatewayDefaults:
    serviceType: NodePort
