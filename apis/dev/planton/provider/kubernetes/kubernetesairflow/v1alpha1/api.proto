syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesairflow.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesairflow/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesairflow/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//airflow-kubernetes
message KubernetesAirflow {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAirflow'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesAirflowSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesAirflowStatus status = 5;
}

//airflow-kubernetes status.
message KubernetesAirflowStatus {
  //stack-outputs
  KubernetesAirflowStackOutputs outputs = 1;
}
