apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAirflow
metadata:
  name: airflow
spec:
  namespace:
    value: airflow
  create_namespace: true
  # The Celery path: a standing worker fleet consumes tasks from a
  # message broker — low task latency for busy schedules; KEDA scales
  # the fleet on REAL queue depth (and back to zero overnight).
  executor: CeleryExecutor
  database:
    postgres:
      host:
        valueFrom:
          name: airflow-db
      password_secret:
        secret_name:
          valueFrom:
            name: airflow-db
  broker:
    # The chart's bundled single-instance Redis (upstream pins the last
    # BSD-licensed 7.2 line). For a shared production broker, switch
    # this arm to `valkey` and compose a KubernetesValkey — the
    # licensing-clean path.
    bundled_redis:
      persistence_size: 1Gi
  dags:
    git_sync:
      # Push-to-deploy pipelines: every component syncs this
      # repository; a merged PR is a deployed DAG within period_seconds.
      repo: https://github.com/your-org/pipelines.git
      ref: main
      sub_path: dags
      # Private repos: point credentials_secret at a Secret carrying
      # GITSYNC_USERNAME/GITSYNC_PASSWORD (a token works as the
      # password), or use an SSH URL with ssh_key_secret.
  components:
    api_server:
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
    scheduler:
      replicas: 2
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
    triggerer:
      persistence_size: 5Gi
    workers:
      persistence_size: 10Gi
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
      keda:
        enabled: true
        min_replicas: 0
        max_replicas: 10
  # Airflow opens MANY short-lived database connections (every task
  # heartbeat is one) — pool them before they exhaust the database's
  # max_connections.
  pgbouncer:
    enabled: true
    metadata_pool_size: 20
  logging:
    # Task logs on a shared volume so the UI reads them after pods
    # rotate. Needs a ReadWriteMany storage class with multi-replica
    # components; alternatively point the log read path at your
    # OpenSearch (`logging.opensearch`).
    persistence:
      enabled: true
      size: 50Gi
