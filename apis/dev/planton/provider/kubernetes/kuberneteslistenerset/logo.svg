<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="681"
   height="661"
   viewBox="0 0 681 661"
   version="1.1"
   xml:space="preserve"
   style="clip-rule:evenodd;fill-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Gateway API family base mark (shared Kubernetes-blue septagon).
       ListenerSet is distinguished from the other Gateway API kinds by the
       Gateway's doorway glyph with an ADDED smaller doorway beside it and a
       plus badge: per-team listeners merged into an existing Gateway (the
       delegation model for shared gateways). Distinct from the plain Gateway
       portal, the GatewayClass routing wheel, and the ReferenceGrant shield.
       Per the _shared/gateway-api README icon note. -->
  <g
     inkscape:label="base"
     style="clip-rule:evenodd;fill-rule:evenodd;stroke:#ffffff;stroke-width:20;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;stroke-dasharray:none;stroke-opacity:1"
     transform="translate(-34.717245,-44.527423)"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
    <path
       d="m 386.932,178.598 c -6.507,0.328 -12.882,1.941 -18.751,4.745 l -255.875,122.26 c -13.407,6.402 -23.162,18.533 -26.475,32.921 L 22.705,613.15 c -2.943,12.778 -0.545,26.21 6.643,37.208 0.864,1.332 1.792,2.62 2.782,3.862 l 177.106,220.205 c 9.281,11.534 23.377,18.263 38.256,18.26 L 531.51,892.62 c 14.873,0.01 28.968,-6.705 38.255,-18.228 L 746.806,654.154 c 9.285,-11.54 12.771,-26.675 9.458,-41.069 L 693.039,338.458 C 689.727,324.071 679.972,311.94 666.565,305.537 L 410.657,183.343 c -7.382,-3.527 -15.541,-5.159 -23.725,-4.745 z"
       style="clip-rule:evenodd;display:inline;fill:#326ce5;fill-rule:nonzero;stroke:#ffffff;stroke-width:22.2842;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;stroke-dasharray:none;stroke-opacity:1"
       transform="matrix(0.89749856,0,0,0.89749856,25.440716,-105.70745)" />
  </g>
  <!-- The parent Gateway's archway, with a smaller added archway merged
       beside it and a plus badge: additional listeners attached by a team. -->
  <g inkscape:label="listener-set" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
    <!-- Parent Gateway archway (shifted left). -->
    <path
       d="M240 462 L 240 334 A 62 62 0 0 1 364 334 L 364 462 L 336 462 L 336 342 A 34 34 0 0 0 268 342 L 268 462 Z"
       style="fill:#ffffff;fill-rule:evenodd;stroke:#ffffff;stroke-width:10;stroke-linejoin:round" />
    <!-- Added (merged) smaller archway: the team's listeners. -->
    <path
       d="M356 462 L 356 380 A 42 42 0 0 1 440 380 L 440 462 L 416 462 L 416 386 A 20 20 0 0 0 380 386 L 380 462 Z"
       style="fill:#ffffff;fill-rule:evenodd;stroke:#ffffff;stroke-width:8;stroke-linejoin:round" />
    <!-- Plus badge: the merge/addition. -->
    <path
       d="M428 306 L444 306 L444 330 L468 330 L468 346 L444 346 L444 370 L428 370 L428 346 L404 346 L404 330 L428 330 Z"
       style="fill:#ffffff;fill-rule:nonzero;stroke:#ffffff;stroke-width:4;stroke-linejoin:round" />
  </g>
</svg>
