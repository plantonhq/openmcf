syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteslistenerset.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kuberneteslistenerset/v1/spec.proto";
import "dev/planton/provider/kubernetes/kuberneteslistenerset/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// KubernetesListenerSet is a Kubernetes Gateway API ListenerSet: a namespaced
// set of additional listeners merged into an existing Gateway that has opted
// in to ListenerSet attachment.
message KubernetesListenerSet {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesListenerSet'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesListenerSetSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesListenerSetStatus status = 5;
}

// KubernetesListenerSetStatus holds the deployment status and outputs.
message KubernetesListenerSetStatus {
  // stack-outputs
  KubernetesListenerSetStackOutputs outputs = 1;
}
