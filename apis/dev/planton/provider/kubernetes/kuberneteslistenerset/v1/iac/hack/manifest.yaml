apiVersion: kubernetes.planton.dev/v1
kind: KubernetesListenerSet
metadata:
  name: test-listener-set
spec:
  namespace:
    value: test-namespace
  parentRef:
    name:
      value: test-gateway
    namespace: gateway-namespace
  listeners:
    - name: tenant-https
      hostname: tenant.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name:
              value: tenant-tls-cert
        options:
          example.com/minimum-tls-version: "1.3"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              team: tenant
            matchExpressions:
              - key: environment
                operator: In
                values:
                  - staging
                  - production
        kinds:
          - kind: HTTPRoute
    - name: tenant-tls-passthrough
      hostname: db.tenant.example.com
      port: 8443
      protocol: TLS
      tls:
        mode: Passthrough
