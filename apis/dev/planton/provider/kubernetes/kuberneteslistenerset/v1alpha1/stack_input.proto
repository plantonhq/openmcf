syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteslistenerset.v1alpha1;

import "dev/planton/provider/kubernetes/kuberneteslistenerset/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// Input for the KubernetesListenerSet IaC stack. The platform resolves all
// StringValueOrRef references (namespace, the parent Gateway name, TLS Secret
// names) to literal strings before passing this to the IaC engine.
message KubernetesListenerSetStackInput {
  // Target cloud-resource.
  KubernetesListenerSet target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
