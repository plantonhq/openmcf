syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskuberayoperator.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kuberneteskuberayoperator/v1/spec.proto";
import "dev/planton/provider/kubernetes/kuberneteskuberayoperator/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//kuberay-operator-kubernetes
message KubernetesKubeRayOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKubeRayOperator'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKubeRayOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKubeRayOperatorStatus status = 5;
}

//kuberay-operator-kubernetes status.
message KubernetesKubeRayOperatorStatus {
  //stack-outputs
  KubernetesKubeRayOperatorStackOutputs outputs = 1;
}
