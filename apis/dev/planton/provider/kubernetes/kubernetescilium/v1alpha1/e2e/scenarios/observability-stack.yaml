# Cilium with the Hubble observability stack and its own telemetry: relay +
# UI + metric families, agent/operator Prometheus endpoints, bandwidth
# manager, explicit cluster identity and policy-enforcement posture. What
# this scenario deliberately does NOT exercise live on kind, with reasons:
# kube-proxy replacement and Gateway API (the profile cluster keeps
# kube-proxy — posture proven by offline plan proofs on the hack manifest),
# encryption (WireGuard depends on the Docker VM kernel's module set — a
# host property, not a component property), cloud integrations and CNI
# chaining (need the actual cloud CNI to chain onto — batched real-cluster
# rows).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCilium
metadata:
  name: e2e-cilium-observability
  annotations:
    planton.dev/e2e-cluster-profile: "cilium-cni"
spec:
  namespace:
    value: kube-system
  cluster_name: e2e-cilium
  ipam:
    mode: kubernetes
  policy_enforcement_mode: default
  hubble:
    enabled: true
    relay: true
    ui: true
    metrics:
      - drop
      - tcp
      - flow
  bandwidth_manager:
    enabled: true
  operator:
    replicas: 1
  prometheus:
    enabled: true
