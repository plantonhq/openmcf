syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteshorizontalpodautoscaler.v1alpha1;

import "dev/planton/provider/kubernetes/kuberneteshorizontalpodautoscaler/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

/**
 * **KubernetesHorizontalPodAutoscalerStackInput** defines the input structure
 * for deploying a Kubernetes HorizontalPodAutoscaler. It carries the target
 * autoscaler specification and the Kubernetes cluster configuration the IaC
 * modules (Pulumi and Terraform) need to reach the cluster.
 */
message KubernetesHorizontalPodAutoscalerStackInput {
  /**
   * The target HorizontalPodAutoscaler resource to be created.
   * Contains the complete specification including metadata, scale target,
   * metrics, and behavior.
   */
  KubernetesHorizontalPodAutoscaler target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes
   * cluster where the HorizontalPodAutoscaler will be created.
   */
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
