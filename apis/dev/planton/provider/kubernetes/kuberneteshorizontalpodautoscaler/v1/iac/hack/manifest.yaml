# Full-surface test manifest for the offline plan proofs. Exercises all five
# metric source families and both behavior directions with policies.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHorizontalPodAutoscaler
metadata:
  name: test-hpa
spec:
  namespace:
    value: default
  name: test-hpa
  labels:
    team: platform-engineering
  scale_target:
    api_version: apps/v1
    kind: Deployment
    name:
      value: test-app
  min_replicas: 2
  max_replicas: 20
  metrics:
    - type: resource
      resource:
        name: cpu
        target:
          type: utilization
          average_utilization: 60
    - type: container_resource
      container_resource:
        name: memory
        container: app
        target:
          type: average_value
          average_value: 512Mi
    - type: pods
      pods:
        metric:
          name: requests_per_second
        target:
          type: average_value
          average_value: "100"
    - type: object
      object:
        described_object:
          api_version: networking.k8s.io/v1
          kind: Ingress
          name: main-ingress
        metric:
          name: requests_per_second
        target:
          type: raw_value
          value: 10k
    - type: external
      external:
        metric:
          name: queue_messages_ready
          match_labels:
            queue: orders
        target:
          type: average_value
          average_value: "30"
  behavior:
    scale_up:
      stabilization_window_seconds: 0
      select_policy: max_change
      policies:
        - type: pods
          value: 4
          period_seconds: 15
        - type: percent
          value: 100
          period_seconds: 15
    scale_down:
      stabilization_window_seconds: 600
      select_policy: min_change
      policies:
        - type: percent
          value: 10
          period_seconds: 60
