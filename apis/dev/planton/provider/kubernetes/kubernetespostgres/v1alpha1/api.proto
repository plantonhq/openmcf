syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetespostgres.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetespostgres/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetespostgres/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// KubernetesPostgres declares a production-grade PostgreSQL cluster
// reconciled by CloudNativePG: streaming replication with automated
// failover, storage, bootstrap (fresh / restore / migrate), declarative
// roles, plugin-based object-store backups, TLS, and monitoring.
// Requires KubernetesCloudNativePgOperator on the cluster.
message KubernetesPostgres {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesPostgres'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesPostgresSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesPostgresStatus status = 5;
}

//postgres-kubernetes status
message KubernetesPostgresStatus {
  //stack-outputs
  KubernetesPostgresStackOutputs outputs = 1;
}
