# The data-durability proof: two instances with SYNCHRONOUS replication
# (writes block until the standby acknowledges — quorum 1 of 1), so the
# verifier's marker row is GUARANTEED on the replica before the primary is
# killed. The behavioral verifier (switched on by this scenario's name)
# writes the marker through the primary, deletes the primary pod, waits for
# the operator to promote the replica, and reads the marker back through
# the new primary — the failover story, proven live. Anti-affinity stays at
# the operator's preferred default so both instances schedule on the
# single-node kind cluster.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: e2e-pg-failover
spec:
  namespace:
    value: e2e-pg-failover
  create_namespace: true
  instances: 2
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    synchronous:
      method: any
      number: 1
      data_durability: required
