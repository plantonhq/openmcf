apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: dev-db
spec:
  namespace:
    value: dev-db
  create_namespace: true # the module creates (and owns) the namespace
  # One instance = one primary, no replicas: a single point of failure,
  # fine for development. Bump to 2 for automated failover, 3 for the
  # production convention.
  instances: 1
  storage:
    size: 5Gi # sizes can only grow — the operator rejects shrinks
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    initdb:
      database: app # the application database; owner defaults to the same name
      # No owner_password — the operator generates one into the
      # `dev-db-app` Secret (the outputs point at it).
  # No backup block — a deliberate development choice, not a default to
  # forget in production.
  # Node drains should never block on a dev database.
  enable_pdb: false
