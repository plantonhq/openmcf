apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRbac
metadata:
  name: e2e-rbac-builtin-view
spec:
  namespaceScope:
    namespace:
      value: default
  # Bind the Kubernetes built-in "view" ClusterRole inside one namespace —
  # the canonical read-only grant.
  existingRole:
    name: view
    isClusterRole: true
  subjects:
    - group: e2e-viewers
    - user: e2e-auditor@example.com
