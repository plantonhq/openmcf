apiVersion: kubernetes.planton.dev/v1
kind: KubernetesRbac
metadata:
  name: e2e-rbac-cluster-grant
spec:
  clusterScope: {}
  createRole:
    rules:
      - verbs: ["get", "list", "watch"]
        apiGroups: [""]
        resources: ["nodes", "namespaces"]
      - verbs: ["get"]
        nonResourceUrls: ["/metrics", "/healthz"]
  subjects:
    - serviceAccount:
        name:
          value: e2e-rbac-cluster-sa
        namespace:
          value: default
