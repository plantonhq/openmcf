# Dependency-install profile for the Gateway API CRDs.
#
# The E2E harness deploys this manifest (via the registry prerequisite graph --
# every Gateway API kind declares `prerequisites: [KubernetesGatewayApiCrds]`)
# before applying any GatewayClass/Gateway/ListenerSet/route/ReferenceGrant
# scenario.
#
# Why standard + v1.6.1:
#   - the standard channel serves EVERY kind the catalog projects from the
#     v1.6 release onward (TCPRoute and UDPRoute graduated to GA v1;
#     ListenerSet is standard since v1.5), so the standard install satisfies
#     all consuming kinds -- exactly what a customer's cluster runs.
#   - v1.6.1 matches the crd2pulumi-generated typed SDK the route IaC modules
#     use, so CR fields are validated against -- not silently pruned by -- the
#     cluster schema.
#   - standard-install.yaml ships only CRDs + a ValidatingAdmissionPolicy
#     (no webhook Deployment), so there is no pod to wait on and applies
#     exercise real server-side CEL validation.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGatewayApiCrds
metadata:
  name: e2e-gwapi-prereq
spec:
  version: "v1.6.1"
  install_channel:
    channel: standard
