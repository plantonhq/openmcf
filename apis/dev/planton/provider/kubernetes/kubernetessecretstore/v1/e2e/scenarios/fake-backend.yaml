# A namespaced store over ESO's built-in fake backend — the full in-cluster
# machinery live: the operator fixture (registry prerequisite) admits and
# reconciles the store, and the verifier requires the Ready condition, which
# ESO only grants after validating the backend connection. The cloud
# backends (AWS/GCP/Azure/Vault) differ only in the provider block this
# scenario swaps out — their live reads ride the real-cluster lanes.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSecretStore
metadata:
  name: e2e-sst-fake
spec:
  namespace:
    value: default
  config:
    fake:
      data:
        - key: api-key
          value: e2e-api-key-value
    refreshInterval: 1m
    retry:
      maxRetries: 3
      retryInterval: 10s
