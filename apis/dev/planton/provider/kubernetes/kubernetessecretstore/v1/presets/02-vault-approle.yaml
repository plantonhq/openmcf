apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSecretStore
metadata:
  name: team-vault
spec:
  namespace:
    value: <team-namespace>
  config:
    vault:
      server: https://vault.example.internal:8200 # replace with your Vault/OpenBao URL
      path: secret # KV engine mount path
      version: v2 # default; versioned KV, the modern engine
      appRole:
        path: approle # upstream default auth mount
        roleId: <vault-approle-role-id>
        secretId: <vault-approle-secret-id>
