syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesexternalsecret.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesexternalsecret/v1alpha1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesexternalsecret/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//kubernetes-external-secret
message KubernetesExternalSecret {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesExternalSecret'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesExternalSecretSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesExternalSecretStatus status = 5;
}

//kubernetes-external-secret status.
message KubernetesExternalSecretStatus {
  //stack-outputs
  KubernetesExternalSecretStackOutputs outputs = 1;
}
