# Chart-default install with a node_port service: the kind lane has no
# cloud LB controller, and the module's readiness wait would (deliberately,
# loudly) time out on a LoadBalancer that can never get an address —
# node_port is the correct posture on such clusters. The verifier asserts
# the controller Deployment is Available and the "nginx" IngressClass
# exists.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngressNginx
metadata:
  name: e2e-ingx-minimal
spec:
  namespace:
    value: e2e-ingx-minimal-ns
  createNamespace: true
  service:
    type: node_port
