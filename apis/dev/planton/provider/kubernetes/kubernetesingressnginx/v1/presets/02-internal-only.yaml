apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngressNginx
metadata:
  name: ingress-nginx-internal
spec:
  namespace:
    value: ingress-nginx-internal # own namespace — fully independent of the public instance
  createNamespace: true
  ingressClass:
    name: nginx-internal # distinct class per instance; controller identifier derives to k8s.io/nginx-internal
  replicas: 2
  service:
    type: load_balancer
    annotations:
      # AWS internal NLB. GCP: networking.gke.io/load-balancer-type: Internal
      # Azure: service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    externalTrafficPolicy: local
