apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngressNginx
metadata:
  name: ingress-nginx
spec:
  namespace:
    value: ingress-nginx
  createNamespace: true
  ingressClass:
    name: nginx
    isDefaultClass: true
  replicas: 2
  service:
    type: load_balancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    externalTrafficPolicy: local
  defaultTlsCertificate:
    secretName:
      valueFrom:
        kind: KubernetesCertificate
        name: "<wildcard-certificate-name>"
        fieldPath: status.outputs.secret_name
    namespace: "<certificate-secret-namespace>" # empty = the controller's installation namespace
