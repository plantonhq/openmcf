apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesHttpRoute
metadata:
  name: e2e-route
spec:
  namespace:
    value: default
  parent_refs:
    - name:
        value: e2e-gateway
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backend_refs:
        - name:
            value: web
          port: 80
