# Extra-instance fixture for the behavioral-routing scenario: a Gateway on
# istiod's own `istio` GatewayClass (created by the control plane itself, so
# the class name is a literal, not a fixture FK). istiod provisions and
# programs the gateway deployment `<name>-istio` automatically; its service
# type comes from the mesh fixture's gateway_defaults (ClusterIP — the
# request proof runs over a port-forward, no cloud LB needed on kind).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesGateway
metadata:
  name: e2e-istio-gw
spec:
  namespace:
    value: default
  gateway_class_name:
    value: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowed_routes:
        namespaces:
          from: All
