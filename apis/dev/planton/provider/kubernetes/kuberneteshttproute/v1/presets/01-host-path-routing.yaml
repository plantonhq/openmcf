apiVersion: kubernetes.planton.dev/v1
kind: KubernetesHttpRoute
metadata:
  name: my-web-route
spec:
  namespace:
    value: app-ns
  parentRefs:
    # The Gateway name is a foreign key. Use `value:` for a literal name (an
    # existing or externally managed Gateway); use `valueFrom:` to reference a
    # Planton-managed KubernetesGateway so the route deploys after it:
    #   name:
    #     valueFrom:
    #       kind: KubernetesGateway
    #       name: <gateway-resource-name>
    #       fieldPath: status.outputs.gateway_name
    - name:
        value: <gateway-name>
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Also a foreign key: `value:` for a literal Service name, `valueFrom:`
        # (kind KubernetesService, fieldPath status.outputs.service_name) for a
        # Planton-managed backend.
        - name:
            value: <service-name>
          port: 8080
