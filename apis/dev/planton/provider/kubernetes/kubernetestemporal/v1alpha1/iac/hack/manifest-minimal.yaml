# Minimal shape: every optional block omitted — the offline proof that
# absent optionals render correctly (the nil-deref / HCL-unification
# class).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTemporal
metadata:
  name: temporal-min
spec:
  namespace:
    value: temporal-min
  createNamespace: true
  database:
    postgres:
      host:
        value: temporal-pg-rw
      username: temporal
      passwordSecret:
        secretName:
          value: temporal-pg-app
