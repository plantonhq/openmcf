# The Cassandra arm: an EXTERNAL Cassandra default store with the
# REQUIRED SQL visibility pairing (Temporal removed Cassandra visibility
# in v1.21) — the offline proof for the cassandra + dedicated-visibility
# rendering. GCS archival exercises the second provider arm.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTemporal
metadata:
  name: temporal-cass
spec:
  namespace:
    value: temporal-cass
  createNamespace: true
  database:
    cassandra:
      hosts:
        - cassandra-0.example.internal
        - cassandra-1.example.internal
        - cassandra-2.example.internal
      username: temporal
      passwordSecret:
        secretName:
          value: cassandra-credentials
      replicationFactor: 3
      datacenter: dc1
      tls:
        enabled: true
    visibility:
      postgres:
        host:
          value: temporal-vis-pg-rw
        username: temporal
        passwordSecret:
          secretName:
            value: temporal-vis-pg-app
      databaseName: temporal_vis
  archival:
    gcs: {}
    historyUri: gs://temporal-archival/history
    visibilityUri: gs://temporal-archival/visibility
