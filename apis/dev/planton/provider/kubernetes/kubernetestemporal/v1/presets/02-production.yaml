apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTemporal
metadata:
  name: temporal
spec:
  namespace:
    value: temporal
  create_namespace: true
  # Production posture against a composed KubernetesPostgres named
  # `temporal-db` in this same namespace (its own preset carries the
  # production database sizing — instances: 2+ for failover): sized
  # server services with history as the heavy-lifter, ServiceMonitor
  # metrics for the Prometheus Operator, and explicit retention on
  # every declared Temporal namespace.
  database:
    postgres:
      host:
        valueFrom:
          name: temporal-db
      username: temporal
      password_secret:
        secret_name:
          valueFrom:
            name: temporal-db
      # Four services x replicas each hold their own pools — size the
      # database's max_connections for the product, not this number.
      max_conns: 20
  # IMMUTABLE after first install — baked into the schema. 512 (the
  # default, stated here so nobody "tunes" it later) carries most
  # production workloads; pick higher ONLY now, for the cluster you
  # will grow into.
  num_history_shards: 512
  services:
    frontend:
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    history:
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    matching:
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    worker:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
  web_ui:
    replicas: 2
  temporal_namespaces:
    - name: default
      retention: 7d
  # Requires the Prometheus Operator CRDs on the cluster — a
  # KubernetesKubePrometheusStack composes naturally.
  service_monitor_enabled: true
