# Consumer-scoped test-credential fixture for the KubernetesLocust
# full-surface lane — proves the secret-native env path live: the
# locustfile reads API_TOKEN from its environment (delivered through
# `env_from_secret_keys` as a secretKeyRef) and FAILS its tasks if the
# variable is missing, so a zero-failure swarm proves the delivery.
# Lands in the fixture-owned e2e-locust namespace (the deployment
# fixture creates it first — annotation order on the scenario).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSecret
metadata:
  name: e2e-locust-cred
spec:
  name: e2e-locust-cred
  namespace:
    value: e2e-locust
  opaque:
    data:
      API_TOKEN: e2e-loadtest-token
