# The behavioral lane: THE RECONNECT PROOF on top of the standard
# gates — after a full swarm proof, the verifier deletes the master
# pod (UID-verified replacement), the workers re-register with the
# replacement (Locust's worker loop reconnects through the stable
# Service), and a SECOND swarm from a fresh session drives requests
# again — coordination recovers by design, not by accident. Two
# workers make the re-registration observable.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesLocust
metadata:
  name: e2e-locust-beh
  annotations:
    planton.dev/e2e-prerequisites: KubernetesDeployment
spec:
  namespace:
    value: e2e-locust
  load_test:
    inline:
      locustfile_content: |
        from locust import HttpUser, task, between


        class PodinfoUser(HttpUser):
            wait_time = between(0.1, 0.3)

            @task
            def get_index(self):
                self.client.get("/")
    target_host:
      value: http://e2e-locust-target.e2e-locust.svc.cluster.local:9898
  workers:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
