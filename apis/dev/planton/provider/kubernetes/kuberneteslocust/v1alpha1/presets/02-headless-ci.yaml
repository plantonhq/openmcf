apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLocust
metadata:
  name: perf-gate
spec:
  namespace:
    value: perf-gate
  create_namespace: true
  load_test:
    headless: true
    inline:
      locustfile_content: |
        from locust import HttpUser, task, between


        class ApiUser(HttpUser):
            wait_time = between(0.5, 1.5)

            @task
            def checkout(self):
                self.client.post("/api/checkout", json={"sku": "demo"})
    target_host:
      value: http://my-api.my-namespace.svc.cluster.local:8080
    # Headless run shape rides Locust's own environment variables —
    # the test starts as soon as the pods are up.
    environment:
      LOCUST_USERS: "200"
      LOCUST_SPAWN_RATE: "20"
      LOCUST_RUN_TIME: 10m
  workers:
    replicas: 4
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
