apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafka
metadata:
  name: app-kafka
spec:
  namespace:
    value: app-kafka
  create_namespace: true
  node_pools:
    - name: controller
      roles:
        - controller
      replicas: 3
      storage:
        size: 20Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
    - name: broker
      roles:
        - broker
      replicas: 3
      storage:
        size: 200Gi
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
  listeners:
    # One listener, SCRAM-SHA-512 over TLS: every client authenticates
    # with a username/password generated by a KubernetesKafkaUser
    # resource — no anonymous path exists on this cluster.
    - name: scram
      port: 9092
      tls: true
      authentication:
        type: scram-sha-512
  config:
    default.replication.factor: "3"
    min.insync.replicas: "2"
    offsets.topic.replication.factor: "3"
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    auto.create.topics.enable: "false"
  # ACLs come from KubernetesKafkaUser authorization blocks. The super
  # user is a SCRAM principal (User:<username> form — TLS users use
  # User:CN=<name>); declare a KubernetesKafkaUser named kafka-admin
  # to materialize its credentials.
  authorization:
    type: simple
    super_users:
      - User:kafka-admin
  jvm:
    xms: 2g
    xmx: 2g
