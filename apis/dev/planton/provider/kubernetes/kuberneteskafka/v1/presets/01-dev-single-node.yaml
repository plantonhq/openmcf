apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafka
metadata:
  name: dev-kafka
spec:
  namespace:
    value: dev-kafka
  create_namespace: true
  node_pools:
    # One dual-role node: KRaft controller + broker in a single pod —
    # the dev shape. Production separates the pools.
    - name: dual
      roles:
        - controller
        - broker
      replicas: 1
      storage:
        size: 10Gi
  listeners:
    # Plaintext, unauthenticated, in-cluster only — acceptable only
    # because nothing outside the cluster can reach it.
    - name: plain
      port: 9092
      tls: false
  # Single-node replication: every internal topic and default at RF 1
  # (the cluster cannot place a second replica anywhere). Values are
  # Kafka configuration STRINGS — the operator serializes them.
  config:
    default.replication.factor: "1"
    min.insync.replicas: "1"
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"
