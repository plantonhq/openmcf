apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafka
metadata:
  name: ext-kafka
spec:
  namespace:
    value: kafka
  create_namespace: true
  node_pools:
    - name: controller
      roles:
        - controller
      replicas: 3
      storage:
        size: 20Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
    - name: broker
      roles:
        - broker
      replicas: 3
      storage:
        size: 500Gi
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 8Gi
  listeners:
    # In-cluster path stays internal and authenticated.
    - name: scram
      port: 9092
      tls: true
      authentication:
        type: scram-sha-512
    # The external path: one NLB per broker plus one for bootstrap.
    # Kafka clients bootstrap once, then connect to EVERY broker
    # directly — which is why each broker needs its own DNS name and
    # advertised host, not just the bootstrap.
    - name: external
      port: 9095
      type: loadbalancer
      tls: true
      authentication:
        type: tls
      configuration:
        # Preserve client IPs; no extra node hop.
        external_traffic_policy: Local
        bootstrap:
          annotations:
            # AWS Load Balancer Controller: provision an NLB (Kafka is
            # raw TCP — an L7 balancer cannot carry it).
            service.beta.kubernetes.io/aws-load-balancer-type: external
            # external-dns points the bootstrap name at the NLB.
            external-dns.alpha.kubernetes.io/hostname: kafka.example.com
        brokers:
          - broker: 0
            advertised_host: broker-0.kafka.example.com
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: external
              external-dns.alpha.kubernetes.io/hostname: broker-0.kafka.example.com
          - broker: 1
            advertised_host: broker-1.kafka.example.com
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: external
              external-dns.alpha.kubernetes.io/hostname: broker-1.kafka.example.com
          - broker: 2
            advertised_host: broker-2.kafka.example.com
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: external
              external-dns.alpha.kubernetes.io/hostname: broker-2.kafka.example.com
  config:
    default.replication.factor: "3"
    min.insync.replicas: "2"
    offsets.topic.replication.factor: "3"
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    auto.create.topics.enable: "false"
  authorization:
    type: simple
    super_users:
      - User:CN=platform-admin
  rack:
    topology_key: topology.kubernetes.io/zone
  jvm:
    xms: 4g
    xmx: 4g
