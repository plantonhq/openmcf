apiVersion: kubernetes.planton.dev/v1
kind: KubernetesTempo
metadata:
  name: prod-tempo
spec:
  namespace:
    value: tracing
  create_namespace: true
  replicas: 2
  # Trace blocks in an S3-compatible object store (an in-cluster
  # KubernetesSeaweedFs here; AWS S3 by dropping the endpoint and setting a
  # region, or leave credentials empty for keyless IRSA).
  storage:
    s3:
      bucket: tempo-traces
      endpoint: seaweedfs-s3.storage.svc.cluster.local:8333
      force_path_style: true
      insecure: true
      credentials:
        access_key_id_secret:
          name: tempo-object-store
          key: access-key-id
        secret_access_key_secret:
          name: tempo-object-store
          key: secret-access-key
  retention: 336h
  # Derive service-graph and span metrics from the trace stream and
  # remote-write them to the cluster's Prometheus — this lights up
  # Grafana's service map. The URL references a KubernetesKubePrometheusStack
  # (its Prometheus must set enable_remote_write_receiver: true).
  metrics_generator:
    enabled: true
    remote_write_url:
      valueFrom:
        kind: KubernetesKubePrometheusStack
        name: monitoring
        fieldPath: status.outputs.prometheus_endpoint
