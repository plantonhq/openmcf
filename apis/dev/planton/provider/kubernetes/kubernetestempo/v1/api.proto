syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetestempo.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetestempo/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetestempo/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//tempo-kubernetes
message KubernetesTempo {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesTempo'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesTempoSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesTempoStatus status = 5;
}

//tempo-kubernetes status.
message KubernetesTempoStatus {
  //stack-outputs
  KubernetesTempoStackOutputs outputs = 1;
}
