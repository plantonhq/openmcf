syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskarpenter.v1;

import "dev/planton/provider/kubernetes/kuberneteskarpenter/v1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// Input for the KubernetesKarpenter IaC stack. The platform resolves all
// StringValueOrRef references (namespace) to literal strings before passing
// this to the IaC engine.
message KubernetesKarpenterStackInput {
  // Target cloud-resource.
  KubernetesKarpenter target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
