# Minimal Karpenter on the aws-eks real-cluster profile: CRDs + controller
# with EKS discovery, IRSA, and the interruption queue. The controller
# requires AWS at startup (region, credentials, EC2 instance-type data), so
# no local cluster can run this — the profile routes it to the batched EKS
# lane, whose bootstrap exports the cluster/role/queue identifiers the
# environment tokens below reference.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenter
metadata:
  name: e2e-karpenter-minimal
  annotations:
    planton.dev/e2e-cluster-profile: "aws-eks"
spec:
  # A dedicated namespace (not upstream's kube-system default): the E2E
  # cleanup contract asserts namespace absence after destroy, which
  # kube-system can never satisfy — and the batch's IRSA trust policy binds
  # to karpenter/karpenter accordingly.
  namespace:
    value: karpenter
  create_namespace: true
  cluster:
    name: ${E2E_ENV:PLANTON_E2E_EKS_CLUSTER_NAME}
    eks_control_plane: true
  aws:
    irsa_role_arn:
      value: ${E2E_ENV:PLANTON_E2E_KARPENTER_IRSA_ROLE_ARN}
    interruption_queue: ${E2E_ENV:PLANTON_E2E_KARPENTER_INTERRUPTION_QUEUE}
  controller:
    replicas: 1
