apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKarpenter
metadata:
  name: karpenter
spec:
  namespace:
    value: kube-system # upstream's recommended home since v1
  createNamespace: false
  chartVersion: "1.14.0" # spec default — pin deliberately
  crds:
    install: true # spec default
    keepOnUninstall: true # spec default
  cluster:
    name: '<eks-cluster-name>'
    eksControlPlane: true
  aws:
    irsaRoleArn: arn:aws:iam::123456789012:role/karpenter-controller # replace account id and role name
    interruptionQueue: karpenter-interruptions
  controller:
    # Chart default made explicit: an active leader plus a warm standby,
    # spread across zones by the chart's topology constraints.
    replicas: 2
    resources:
      requests:
        cpu: "1" # the commonly documented starting point for large clusters
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
  batching:
    # Longer batch window than the 10s chart default: more pending pods
    # are considered per provisioning decision — fewer, larger nodes.
    maxDuration: 30s
    idleDuration: 2s # close a quiet batch early (chart default 1s)
  featureGates:
    # ALPHA: consolidation may replace spot nodes with cheaper spot nodes.
    # Off by default upstream because it can increase churn — enable
    # deliberately on spot-heavy fleets.
    spotToSpotConsolidation: true
  prometheus:
    # Scrape discovery for provisioning latencies, disruption decisions and
    # pricing lookups. Requires the Prometheus operator CRDs on the
    # cluster — the release FAILS to install without them.
    serviceMonitor: true
