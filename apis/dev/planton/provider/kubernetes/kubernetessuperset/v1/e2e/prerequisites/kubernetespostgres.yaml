# Consumer-scoped PostgreSQL fixture for the KubernetesSuperset lanes —
# the composed metadata database (dashboards, charts, users, encrypted
# datasource credentials) every scenario wires against:
# - SHARED NAMESPACE (e2e-superset): the scenarios co-locate with this
#   fixture because the database password reaches the pods as a
#   secretKeyRef env var and Secrets cannot be consumed across
#   namespaces.
# - ONE BOOTSTRAP DATABASE: initdb creates `superset` owned by the
#   `superset` role — the init Job migrates the schema inside it.
# - The operator maintains the `e2e-sprst-pg-app` credential Secret
#   (keys username/password) across failovers — the composition target
#   of every scenario's password reference.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: e2e-sprst-pg
spec:
  namespace:
    value: e2e-superset
  create_namespace: true
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: superset
      owner: superset
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
