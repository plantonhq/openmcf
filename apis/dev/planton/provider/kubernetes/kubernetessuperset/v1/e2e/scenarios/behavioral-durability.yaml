# THE STATE PROOF: BI state lives in the composed PostgreSQL, never in
# the pod — the verifier creates a dashboard, deletes the web pod
# (UID-verified replacement), signs in from a fresh session and finds
# the SAME dashboard. Web-only shape (the durability under test is the
# metadata database's, not the cache's), sized like minimal.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSuperset
metadata:
  name: e2e-sprst-beh
spec:
  namespace:
    value: e2e-superset
  metadata_database:
    host:
      value: e2e-sprst-pg-rw
    password_secret:
      secret_name:
        value: e2e-sprst-pg-app
      secret_key: password
  web:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2560Mi
