apiVersion: kubernetes.planton.dev/v1
kind: KubernetesOtelCollector
metadata:
  name: traces-gateway
spec:
  namespace:
    value: observability
  mode: deployment
  configYaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      otlp:
        # Replace the host with your KubernetesTempo service — compose
        # the endpoint from that kind's otlp_grpc_endpoint output.
        endpoint: tempo.observability.svc.cluster.local:4317
        # In-cluster plaintext.
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 512Mi
