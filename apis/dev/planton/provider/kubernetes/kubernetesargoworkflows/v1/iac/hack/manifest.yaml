apiVersion: kubernetes.planton.dev/v1
kind: KubernetesArgoWorkflows
metadata:
  name: test-workflows
spec:
  namespace:
    value: pipelines
  createNamespace: true
  chartVersion: 1.0.23
  controller:
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    workflowNamespaces:
      - team-a
      - team-b
    instanceId: platform
    parallelism: 50
    namespaceParallelism: 10
  server:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    authModes:
      - client
    baseHref: https://workflows.example.com/
  workflowServiceAccount: pipeline-runner
  artifactRepository:
    archiveLogs: true
    s3:
      bucket: workflow-artifacts
      endpoint:
        value: objects-s3.storage.svc.cluster.local:8333
      insecure: true
      credentialsSecretName: objects-s3-auth
  archive:
    engine: postgres
    host:
      value: workflows-db-rw.data.svc.cluster.local
    database: argo_archive
    credentialsSecret:
      name: workflows-db-app
      usernameKey: username
      passwordKey: password
    sslMode: require
  retentionPolicy:
    completed: 10
    failed: 3
    errored: 3
  crds:
    install: true
    keep: true
    fullSchema: true
    baseUrl: https://mirror.internal/argo-crds
  serviceMonitorEnabled: true
  image:
    registry: my.registry.com
    tag: v4.0.8
    pullSecretName: mirror-pull
  scheduling:
    nodeSelector:
      role: pipelines
    tolerations:
      - key: pipelines
        operator: Equal
        value: "true"
        effect: NoSchedule
    priorityClassName: batch-normal
  helmValues: |
    controller:
      workflowDefaults:
        spec:
          ttlStrategy:
            secondsAfterCompletion: 86400
