syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesargoworkflows.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesargoworkflows/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesargoworkflows/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//argo-workflows-kubernetes
message KubernetesArgoWorkflows {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesArgoWorkflows'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesArgoWorkflowsSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesArgoWorkflowsStatus status = 5;
}

//argo-workflows-kubernetes status.
message KubernetesArgoWorkflowsStatus {
  //stack-outputs
  KubernetesArgoWorkflowsStackOutputs outputs = 1;
}
