# Consumer-scoped Valkey fixture for the KubernetesRayCluster
# behavioral-state lane — the external Redis-protocol store GCS fault
# tolerance writes the cluster's control state into:
# - JOINS the fixture-owned namespace (the operator fixture deploys
#   first with create_namespace and owns e2e-ray; the GCS credential
#   secretKeyRef cannot cross namespaces).
# - AUTH-LESS by design for this lane: Ray's GCS reaches the store
#   without a password, keeping the proof about STATE SURVIVAL, not
#   credential plumbing (the password-secret arm is plan-proven by the
#   hack manifest and stays on the deferred ledger until a dedicated
#   lane needs it).
# - Pure-state posture: small memory ceiling, snapshots off — Ray
#   re-registers ephemeral state continuously; Valkey is the live
#   store, not an archive.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesValkey
metadata:
  name: e2e-ray-valkey
spec:
  namespace:
    value: e2e-ray
  config:
    max_memory: 256mb
    snapshots_disabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
