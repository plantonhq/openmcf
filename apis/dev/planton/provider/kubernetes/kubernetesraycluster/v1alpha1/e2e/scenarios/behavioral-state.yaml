# THE STATE PROOF: GCS fault tolerance composed onto the Valkey
# fixture (auth-less for this lane — the proof is about state
# survival). The verifier submits a job to SUCCEEDED, DELETES the head
# pod, waits for the UID-verified replacement to serve, and asserts the
# recovered head STILL LISTS the completed job — the cluster's control
# state lived in Valkey, not in head-pod memory. Without GCS fault
# tolerance the replacement head would come back empty; this lane is
# the difference the field exists to make. Tasks run on the head
# (single-node sizing) so the proof needs no worker capacity.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRayCluster
metadata:
  name: e2e-ray-state
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesKubeRayOperator,KubernetesValkey"
spec:
  # JOINS the fixture-owned namespace — the GCS endpoint references the
  # Valkey fixture's Service in the SAME namespace.
  namespace:
    value: e2e-ray
  rayVersion: 2.52.0
  head:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 3Gi
    scheduleTasksOnHead: true
  gcsFaultTolerance:
    enabled: true
    redisAddress:
      value: e2e-ray-valkey.e2e-ray.svc.cluster.local:6379
    externalStorageNamespace: e2e-ray-state
  auth:
    mode: token
