apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKubePrometheusStack
metadata:
  name: prod-metrics
spec:
  namespace:
    value: monitoring
  create_namespace: true
  prometheus:
    replicas: 2
    disk_size: 100Gi
    retention: 30d
    retention_size: 80GiB
    scrape_interval: 30s
    evaluation_interval: 30s
    external_labels:
      cluster: <cluster-name>
      env: production
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  alertmanager:
    replicas: 2
    disk_size: 10Gi
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    storage:
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  operator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # Same managed-cloud scraper posture — most production clusters are
  # managed. Drop these blocks on a self-hosted control plane where
  # the scrapers actually reach their targets.
  control_plane_scrapers:
    kube_controller_manager: false
    kube_etcd: false
    kube_scheduler: false
    kube_proxy: false
  default_rules:
    disabled_groups:
      - etcd
      - kubeControllerManager
      - kubeSchedulerAlerting
      - kubeSchedulerRecording
      - kubeProxy
