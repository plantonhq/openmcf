# Pod failure policy that ignores infrastructure disruption — safe on kind,
# where no rule ever fires: the job's actual work echoes and exits 0, so the
# Job completes in seconds and the policy arm is exercised purely at the
# API/provider level.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesJob
metadata:
  name: e2e-job-failure-policy
spec:
  namespace:
    value: e2e-job-failure-policy-ns
  create_namespace: true
  container:
    app:
      image:
        repo: busybox
        tag: "1.36"
      command:
        - /bin/sh
        - -c
        - echo done
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"
  restart_policy: Never
  backoff_limit: 2
  pod_failure_policy:
    rules:
      - action: Ignore
        on_pod_conditions:
          - type: DisruptionTarget
