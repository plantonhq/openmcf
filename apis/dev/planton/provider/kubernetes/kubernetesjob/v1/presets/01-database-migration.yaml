apiVersion: kubernetes.planton.dev/v1
kind: KubernetesJob
metadata:
  name: my-database-migration
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-migration-image>"
        tag: "<your-image-tag>"
      command:
        - /bin/sh
        - -c
        - "<your-migration-command>"
      env:
        variables:
          - name: DATABASE_URL
            value: "<your-database-connection-string>"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  completions: 1
  parallelism: 1
  restartPolicy: Never
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
