apiVersion: kubernetes.planton.dev/v1
kind: KubernetesJob
metadata:
  name: my-resilient-batch
spec:
  namespace:
    value: "<your-namespace>"
  createNamespace: false
  container:
    app:
      image:
        repo: "<your-container-registry>/<your-batch-image>"
        tag: "<your-image-tag>"
      command:
        - /bin/sh
        - -c
        - "<your-batch-command>"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  completions: 1
  parallelism: 1
  restartPolicy: Never
  backoffLimit: 4
  podFailurePolicy:
    rules:
      # Exit code 42 is this workload's "unrecoverable input/config error"
      # signal: retrying cannot help, so fail the whole Job immediately
      # instead of burning four retries on a guaranteed failure.
      - action: FailJob
        onExitCodes:
          operator: In
          values: [42]
      # Pods killed by node drains, preemption, or taint eviction failed
      # because of infrastructure, not the workload — replace them without
      # counting against the retry budget.
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
