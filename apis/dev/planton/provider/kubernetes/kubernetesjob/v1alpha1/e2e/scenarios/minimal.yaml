apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesJob
metadata:
  name: e2e-job-minimal
spec:
  namespace:
    value: e2e-job-minimal-ns
  create_namespace: true
  container:
    app:
      image:
        repo: busybox
        tag: "1.36"
      command:
        - /bin/sh
        - -c
        - echo "e2e-job-test"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"
  restart_policy: Never
  backoff_limit: 3
