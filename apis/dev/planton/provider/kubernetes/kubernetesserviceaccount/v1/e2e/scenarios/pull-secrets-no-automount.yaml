apiVersion: kubernetes.planton.dev/v1
kind: KubernetesServiceAccount
metadata:
  name: e2e-sa-hardened
spec:
  name: e2e-sa-hardened
  namespace:
    value: default
  # References by literal name: the secret does not need to exist for the
  # ServiceAccount to be created — Kubernetes resolves pull secrets at pod
  # image-pull time.
  imagePullSecrets:
    - value: e2e-registry-cred
  automountServiceAccountToken: false
  labels:
    security-posture: hardened
