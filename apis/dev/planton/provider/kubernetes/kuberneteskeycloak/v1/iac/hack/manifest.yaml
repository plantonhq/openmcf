apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKeycloak
metadata:
  name: test-keycloak
  labels:
    environment: test
spec:
  namespace:
    value: "keycloak-test"
  create_namespace: true
  container:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  ingress:
    enabled: false
    hostname: ""

