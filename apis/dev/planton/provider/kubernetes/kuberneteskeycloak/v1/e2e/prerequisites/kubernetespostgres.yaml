# Consumer-scoped PostgreSQL fixture for the KubernetesKeycloak lanes —
# the composed database every scenario wires against:
# - SHARED NAMESPACE (e2e-keycloak): Keycloak reads the database
#   password through a secretKeyRef, which can only read Secrets in the
#   workload's own namespace — and the namespaced-watch operator
#   fixture already anchors everything there (that fixture owns the
#   namespace; this one joins it).
# - `initdb` creates the `keycloak` database owned by the `keycloak`
#   role — ownership covers everything Keycloak's schema migration
#   needs.
# - The operator maintains the `e2e-kc-pg-app` credential Secret (keys
#   username/password) across failovers — the scenarios'
#   username/password Secret-selector target.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPostgres
metadata:
  name: e2e-kc-pg
spec:
  namespace:
    value: e2e-keycloak
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
