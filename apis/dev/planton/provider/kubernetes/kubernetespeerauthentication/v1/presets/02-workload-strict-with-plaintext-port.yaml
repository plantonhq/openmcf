apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPeerAuthentication
metadata:
  name: <workload>-mtls
spec:
  namespace:
    value: <namespace>
  selector:
    match_labels:
      app: <workload>
  mtls:
    mode: STRICT
  port_level_mtls:
    # Port that must stay plaintext (e.g. a metrics or health port).
    "8080":
      mode: DISABLE
