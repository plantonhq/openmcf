# Full-surface offline-proof manifest: exercises an HA topology (3 masters,
# 3 volume servers with replication 001), per-tier PVCs with explicit
# StorageClasses, a leveldb volume index, filer extra env + volume-data
# encryption, an authenticated DEDICATED S3 gateway with typed buckets (TTL,
# versioning, object lock, anonymous read) and a virtual-host domain, the
# authenticated admin console with persistence, an image override, and an
# escape-hatch SFTP arm — so the offline tofu plan and pulumi preview proofs
# cover the full typed surface. Placeholder values; never applied to a real
# cluster.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSeaweedFs
metadata:
  name: seaweedfs-hack
spec:
  namespace:
    value: seaweedfs-hack
  createNamespace: true
  chartVersion: 4.40.0
  master:
    replicas: 3
    dataVolume:
      size: 5Gi
      storageClass:
        value: fast-ssd
    volumeSizeLimitMb: 1000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  volume:
    replicas: 3
    dataVolume:
      size: 100Gi
      storageClass:
        value: fast-ssd
    maxVolumes: 0
    indexMode: leveldb
    minFreeSpacePercent: 5
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  filer:
    replicas: 1
    dataVolume:
      size: 10Gi
      storageClass:
        value: fast-ssd
    encryptVolumeData: true
    extraEnvironmentVars:
      WEED_FILER_OPTIONS_RECURSIVE_DELETE: "true"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  s3:
    enabled: true
    enableAuth: true
    buckets:
      - name: artifacts
        ttl: 30d
        versioning: true
      - name: public-assets
        anonymousRead: true
      - name: compliance-archive
        objectLock: true
    domainName: s3.example.internal
    dedicated:
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
  replication: "001"
  admin:
    enabled: true
    dataVolume:
      size: 10Gi
  serviceMonitorEnabled: false
  image:
    registry: mirror.example.com
    repository: chrislusf/seaweedfs
    tag: "4.40"
  helmValues: |
    sftp:
      enabled: false
