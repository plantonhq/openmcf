# THE durability proof: put an object through the S3 gateway, DELETE the
# volume-server pod, read the object back byte-identical once the pod
# returns — object bytes surviving pod loss through the PVC. Embedded
# gateway (the default install shape), one declared bucket.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSeaweedFs
metadata:
  name: e2e-swfs-dur
spec:
  namespace:
    value: e2e-swfs-dur
  create_namespace: true
  volume:
    data_volume:
      size: 5Gi
  s3:
    buckets:
      - name: e2e-durability
