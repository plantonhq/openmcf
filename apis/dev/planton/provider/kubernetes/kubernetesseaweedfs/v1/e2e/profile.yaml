apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: kubernetesseaweedfs
spec:
  tier: 2
  # Terraform lanes are live-proven (all 3 scenarios incl. the volume-loss
  # durability proof and blind import round-trips with the secret-material
  # random_password ID). The Pulumi lanes CANNOT run at the repo's pinned
  # pulumi-kubernetes SDK: the chart's templates use fromToml (Helm >= 3.16)
