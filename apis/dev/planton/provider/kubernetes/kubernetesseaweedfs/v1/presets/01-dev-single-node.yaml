apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSeaweedFs
metadata:
  name: dev-seaweedfs
spec:
  namespace:
    value: dev-seaweedfs
  create_namespace: true
  # Defaults do the heavy lifting: 1 master / 1 volume server /
  # 1 filer, the S3 gateway embedded on the filer with auth ON — the
  # chart materializes admin + read-only credential pairs in the
  # dev-seaweedfs-s3-secret Secret (stable across upgrades). Small
  # sizes declared explicitly; every data volume is a
  # PersistentVolumeClaim on the cluster's default StorageClass.
  master:
    data_volume:
      size: 2Gi
  volume:
    data_volume:
      size: 10Gi
  filer:
    data_volume:
      size: 5Gi
  # One bucket, created by the chart's install hook. Removing this
  # entry later does NOT delete the bucket or its data — bucket
  # deletion is a data operation, never an IaC one.
  s3:
    buckets:
      - name: dev-data
