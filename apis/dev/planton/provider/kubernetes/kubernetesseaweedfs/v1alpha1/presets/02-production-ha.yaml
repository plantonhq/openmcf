apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSeaweedFs
metadata:
  name: prod-seaweedfs
spec:
  namespace:
    value: object-store
  create_namespace: true
  # Masters form a Raft quorum: 3 tolerates one failure; an even
  # count wastes a node without adding failure tolerance. Master
  # state is small — 10Gi is generous.
  master:
    replicas: 3
    data_volume:
      size: 10Gi
      # Literal class name shown; the field also accepts a valueFrom
      # reference to a KubernetesStorageClass resource.
      storage_class:
        value: <fast-ssd-storage-class>
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  # The volume tier holds the object bytes and is the only tier that
  # grows with stored data — size it for what you expect, PER pod.
  # 3 servers is the minimum sensible count under replication "001".
  volume:
    replicas: 3
    data_volume:
      size: 200Gi
      storage_class:
        value: <fast-ssd-storage-class>
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  # ONE filer: the embedded leveldb metadata store is per-pod, so
  # filer replicas only scale meaningfully after a shared external
  # store (Postgres/MySQL via WEED_* env + helm_values) is wired.
  filer:
    data_volume:
      size: 20Gi
      storage_class:
        value: <fast-ssd-storage-class>
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  # The SeaweedFS XYZ placement code: "001" = one extra copy on
  # another server in the same rack — every object survives losing
  # one volume server. The copies must fit the declared topology
  # (here: 3 volume servers) or writes fail.
  replication: "001"
  # Dedicated S3 gateway: its own Deployment, scaled independently of
  # filer metadata. Both shapes expose the same <name>-s3 Service on
  # 8333, so the exported s3_endpoint is stable across this choice.
  s3:
    dedicated:
      replicas: 2
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  # The management console (cluster state, volumes, buckets,
  # maintenance). Never installed open: with no existing_auth_secret,
  # the module generates the prod-seaweedfs-admin-auth Secret (keys
  # user/password). The data volume persists console configuration
  # and maintenance state across restarts.
  admin:
    enabled: true
    data_volume:
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
