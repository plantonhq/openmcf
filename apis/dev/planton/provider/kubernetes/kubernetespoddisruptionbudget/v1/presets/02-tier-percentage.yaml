apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPodDisruptionBudget
metadata:
  name: tier-percentage
spec:
  name: tier-percentage
  namespace:
    value: "<your-namespace>"
  selector:
    match_expressions:
      - key: tier
        operator: In
        values:
          - web
          - api
  max_unavailable: "25%"
