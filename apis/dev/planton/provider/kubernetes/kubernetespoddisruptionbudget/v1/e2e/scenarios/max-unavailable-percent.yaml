# The percentage ceiling form with set-based selection — the shape for
# budgets spanning several workloads (tier-level protection).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesPodDisruptionBudget
metadata:
  name: e2e-pdb-percent
spec:
  namespace:
    value: default
  name: e2e-pdb-percent
  selector:
    match_expressions:
      - key: tier
        operator: In
        values:
          - web
          - api
  max_unavailable: 25%
