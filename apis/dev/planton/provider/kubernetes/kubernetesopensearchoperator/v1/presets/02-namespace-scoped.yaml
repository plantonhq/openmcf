apiVersion: kubernetes.planton.dev/v1
kind: KubernetesOpenSearchOperator
metadata:
  name: opensearch-operator-search
spec:
  namespace:
    value: search
  create_namespace: true
  # Fence the operator to ONE namespace: KubernetesOpenSearch resources
  # anywhere else are ignored by this install. This is what makes a
  # second operator on the same cluster safe — each install owns its
  # own namespace.
  watch_namespace: search
  # Namespace-scoped RoleBindings instead of ClusterRoleBindings — the
  # shared-cluster posture: the install needs NO cluster-wide RBAC, so
  # a tenant admin can run it without cluster-admin sign-off. Only
  # valid together with watch_namespace (the spec enforces the pairing:
  # a cluster-wide operator cannot run on namespace-scoped permissions).
  use_role_bindings: true
