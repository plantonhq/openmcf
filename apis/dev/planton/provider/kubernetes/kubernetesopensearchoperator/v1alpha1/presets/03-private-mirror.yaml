apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenSearchOperator
metadata:
  name: opensearch-operator
spec:
  namespace:
    value: opensearch-operator
  create_namespace: true
  # The air-gap / private-registry posture: pull the manager image from
  # your own mirror instead of Docker Hub. Mirror the UPSTREAM image
  # (opensearchproject/opensearch-operator) at the tag matching the
  # pinned chart — leave `tag` empty to take the chart's appVersion.
  image:
    repository: my-mirror.example.com/opensearchproject/opensearch-operator
    tag: 2.8.0
  # Names of existing kubernetes.io/dockerconfigjson Secrets in the
  # install namespace — the registry credential itself never appears
  # in this manifest.
  image_pull_secrets:
    - mirror-pull-secret
  # Enterprises that mandate a mirror usually also mandate quotas:
  # explicit resources replace the chart defaults (requests 100m/350Mi,
  # limits 200m/500Mi) so the pod fits a governed namespace.
  resources:
    requests:
      cpu: 100m
      memory: 350Mi
    limits:
      cpu: 500m
      memory: 512Mi
