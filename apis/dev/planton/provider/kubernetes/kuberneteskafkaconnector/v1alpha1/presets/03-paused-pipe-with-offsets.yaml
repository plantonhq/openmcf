apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaConnector
metadata:
  name: audit-mirror
spec:
  namespace:
    value: kafka
  connect_cluster:
    value: dev-connect
  # A stock-image pipe (the Strimzi image carries only the MirrorMaker
  # 2 connector classes — real sink deployments bring their S3 /
  # search / warehouse class through the Connect cluster's image,
  # plugins, or build arms; the lifecycle and offset mechanics taught
  # here are identical for any class).
  connector_class: org.apache.kafka.connect.mirror.MirrorSourceConnector
  tasks_max: 1
  config:
    source.cluster.alias: audit
    target.cluster.alias: dev
    source.cluster.bootstrap.servers: dev-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
    target.cluster.bootstrap.servers: dev-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
    topics: audit-events
    replication.factor: "1"
    offset-syncs.topic.replication.factor: "1"
  # PAUSED: tasks stay allocated but no data moves — cheap to resume
  # by flipping state back to running. Offset OVERRIDES need the
  # deeper "stopped" state (tasks deallocated).
  state: paused
  # Offset declarations are TARGETS; the verbs are annotations:
  #   strimzi.io/connector-offsets: list  -> writes current offsets
  #     INTO the list ConfigMap (created if absent)
  #   strimzi.io/connector-offsets: alter -> applies offsets FROM the
  #     alter ConfigMap (connector must be stopped)
  list_offsets:
    to_config_map:
      value: audit-mirror-offsets
  alter_offsets:
    from_config_map:
      value: audit-mirror-offsets-override
  auto_restart:
    enabled: true
