apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKafkaConnector
metadata:
  name: first-pipe
spec:
  # THE PLACEMENT CONTRACT: the Connect cluster's OWN namespace — a
  # connector declared elsewhere is accepted by the API server and
  # silently never reconciled.
  namespace:
    value: dev-kafka
  # Binds to the Connect cluster by name (rendered as the
  # strimzi.io/cluster label). In an infra chart this becomes a
  # KubernetesKafkaConnect reference.
  connect_cluster:
    value: dev-connect
  # MirrorSourceConnector is one of the ONLY three connector classes
  # the stock image carries (verified live against the workers' own
  # plugin listing — Kafka's FileStream examples are NOT on the
  # classpath). Mirroring a topic from the cluster back to itself
  # under an alias is the zero-machinery first pipe: real records
  # cross a real connector with nothing to install.
  connector_class: org.apache.kafka.connect.mirror.MirrorSourceConnector
  tasks_max: 1
  config:
    source.cluster.alias: src
    target.cluster.alias: dev
    # Both point at the SAME cluster — the self-mirror shape. Records
    # produced to "orders" appear on "src.orders".
    source.cluster.bootstrap.servers: dev-kafka-kafka-bootstrap.dev-kafka.svc.cluster.local:9092
    target.cluster.bootstrap.servers: dev-kafka-kafka-bootstrap.dev-kafka.svc.cluster.local:9092
    topics: orders
    # Single-broker dev clusters cannot satisfy the connector's
    # default replication factor of 3 for its internal topics.
    replication.factor: "1"
    offset-syncs.topic.replication.factor: "1"
    key.converter: org.apache.kafka.connect.converters.ByteArrayConverter
    value.converter: org.apache.kafka.connect.converters.ByteArrayConverter
  # Production posture even for a demo pipe: transient failures
  # restart with back-off instead of parking the connector FAILED.
  auto_restart:
    enabled: true
