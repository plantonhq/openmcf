# A declared connector against the lane's Connect fixture. The class is
# MirrorSourceConnector — one of the ONLY three connectors the stock
# Strimzi image carries (verified live: the workers report exactly the
# MirrorMaker 2 connector set; Kafka's FileStream examples are NOT on
# the distribution's classpath). It mirrors a topic pattern from the
# fixture cluster to itself under the "src." alias, so it reaches
# RUNNING with zero plugin machinery and no external system. The
# namespace is the FIXTURE'S namespace (the placement contract).
# Replication factors are 1 DELIBERATELY: the defaults of 3 cannot be
# satisfied on the single-broker fixture.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesKafkaConnector
metadata:
  name: e2e-connector-minimal
spec:
  namespace:
    value: e2e-kaf-fix
  connect_cluster:
    valueFrom:
      name: e2e-con-fix
  connector_class: org.apache.kafka.connect.mirror.MirrorSourceConnector
  tasks_max: 1
  config:
    source.cluster.alias: src
    target.cluster.alias: fix
    source.cluster.bootstrap.servers: e2e-kaf-fix-kafka-bootstrap.e2e-kaf-fix.svc.cluster.local:9092
    target.cluster.bootstrap.servers: e2e-kaf-fix-kafka-bootstrap.e2e-kaf-fix.svc.cluster.local:9092
    topics: e2e-min-topic
    replication.factor: "1"
    offset-syncs.topic.replication.factor: "1"
