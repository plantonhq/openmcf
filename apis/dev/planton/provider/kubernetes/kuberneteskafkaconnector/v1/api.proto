syntax = "proto3";

package dev.planton.provider.kubernetes.kuberneteskafkaconnector.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kuberneteskafkaconnector/v1/spec.proto";
import "dev/planton/provider/kubernetes/kuberneteskafkaconnector/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//kubernetes-kafka-connector
message KubernetesKafkaConnector {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKafkaConnector'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKafkaConnectorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKafkaConnectorStatus status = 5;
}

//kubernetes-kafka-connector status
message KubernetesKafkaConnectorStatus {
  //stack-outputs
  KubernetesKafkaConnectorStackOutputs outputs = 1;
}
