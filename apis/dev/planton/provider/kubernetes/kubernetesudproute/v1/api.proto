syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesudproute.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesudproute/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesudproute/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// KubernetesUdpRoute is a Kubernetes Gateway API UDPRoute: a namespaced set of
// rules that attach to a Gateway and forward UDP datagrams to backend
// Services.
message KubernetesUdpRoute {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesUdpRoute'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesUdpRouteSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesUdpRouteStatus status = 5;
}

// KubernetesUdpRouteStatus holds the deployment status and outputs.
message KubernetesUdpRouteStatus {
  // stack-outputs
  KubernetesUdpRouteStackOutputs outputs = 1;
}
