# The composition proof: the route's parent resolves through the Gateway
# foreign key against a live Gateway fixture (its "udp" listener).
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesUdpRoute
metadata:
  name: e2e-udp-composed
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesGateway"
spec:
  namespace:
    value: default
  parent_refs:
    - name:
        valueFrom:
          name: e2e-gw-fixture
      section_name: udp
  rules:
    - name: dns-forward
      backend_refs:
        - name:
            value: dns-backend
          port: 53
          weight: 90
        - name:
            value: dns-backend-canary
          port: 53
          weight: 10
