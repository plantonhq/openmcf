apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesUdpRoute
metadata:
  name: my-dns-route
spec:
  namespace:
    value: dns-ns
  parentRefs:
    # Foreign key: `value:` for a literal Gateway name, `valueFrom:` (kind
    # KubernetesGateway, fieldPath status.outputs.gateway_name) to reference a
    # Planton-managed Gateway and deploy in dependency order.
    - name:
        value: <gateway-name>
      sectionName: dns
  rules:
    - name: dns-forward
      backendRefs:
        # Backend Service names are foreign keys too: `value:` for a literal
        # name, `valueFrom:` for a Planton-managed KubernetesService.
        - name:
            value: <primary-dns-service>
          port: 53
          weight: 90
        - name:
            value: <secondary-dns-service>
          port: 53
          weight: 10
