syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesudproute.v1alpha1;

import "dev/planton/provider/kubernetes/kubernetesudproute/v1alpha1/api.proto";
import "dev/planton/provider/kubernetes/provider.proto";

// Input for the KubernetesUdpRoute IaC stack. The platform resolves all
// StringValueOrRef references (namespace, parent and backend names) to literal
// strings before passing this to the IaC engine.
message KubernetesUdpRouteStackInput {
  // Target cloud-resource.
  KubernetesUdpRoute target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.provider.kubernetes.KubernetesProviderConfig provider_config = 2;
}
