# Extra-instance fixture for the behavioral-deny scenario: the meshed client
# whose requests the policy must reject. Its sidecar is what enforces the
# mesh's L7 authorization on the outbound-to-backend hop's server side.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: e2e-authz-client
spec:
  namespace:
    value: e2e-authz-mesh
  version: main
  container:
    app:
      image:
        repo: curlimages/curl
        tag: "8.11.1"
      command:
        - sleep
        - infinity
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
