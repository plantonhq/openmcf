# The component defaults on their own: the bundled ClickHouse appliance
# (1x1, ZooKeeper, module-generated credential), one collector, the SQLite
# server state volume. The verifier proves the product live on every lane —
# first-admin registration through SigNoz's own API, a session, an OTLP
# span push, and the trace retrieved by ID through the authenticated query
# API.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSignoz
metadata:
  name: e2e-signoz-min
spec:
  namespace:
    value: e2e-signoz-min
  create_namespace: true
