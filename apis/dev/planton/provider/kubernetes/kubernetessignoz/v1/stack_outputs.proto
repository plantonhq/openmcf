syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetessignoz.v1;

import "dev/planton/provider/kubernetes/kubernetes.proto";

//signoz-kubernetes stack outputs
message KubernetesSignozStackOutputs {
  //namespace SigNoz runs in.
  string namespace = 1;

  //name of the SigNoz server Service (UI + API), e.g. signoz-main.
  string service = 2;

  //in-cluster endpoint of the SigNoz UI/API,
  //e.g. http://signoz-main.observability.svc.cluster.local:8080
  string kube_endpoint = 3;

  //command to port-forward the UI to a developer laptop,
  //e.g. kubectl port-forward svc/signoz-main -n observability 8080:8080
  //(then open http://localhost:8080).
  string port_forward_command = 4;

  //name of the ingestion collector Service,
  //e.g. signoz-main-otel-collector.
  string otel_collector_service = 5;

  //in-cluster OTLP gRPC ingestion endpoint — point OTLP/gRPC
  //exporters here, e.g.
  //signoz-main-otel-collector.observability.svc.cluster.local:4317
  string otlp_grpc_endpoint = 6;

  //in-cluster OTLP HTTP ingestion endpoint — point OTLP/HTTP
  //exporters here, e.g.
  //http://signoz-main-otel-collector.observability.svc.cluster.local:4318
  string otlp_http_endpoint = 7;

  //ClickHouse native-protocol endpoint SigNoz stores telemetry in.
  //Bundled arm: the bundled installation's client Service; external
  //arm: mirrors the declared host and port.
  string clickhouse_endpoint = 8;

  //ClickHouse username SigNoz connects as ("admin" on the bundled
  //arm; the declared username on the external arm).
  string clickhouse_username = 9;

  //Secret key holding that user's password. Bundled arm: the
  //module-owned <name>-clickhouse-auth Secret (key "password",
  //generated per install — the chart's public default never ships);
  //external arm: the declared Secret reference.
  dev.planton.provider.kubernetes.KubernetesSecretKey clickhouse_password_secret = 10;
}
