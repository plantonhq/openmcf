apiVersion: kubernetes.planton.dev/v1
kind: KubernetesSignoz
metadata:
  name: observability
spec:
  namespace:
    value: observability
  create_namespace: true
  # Bring-your-own ClickHouse: nothing database-related installs here —
  # every connection detail composes from a KubernetesClickHouse resource
  # named "telemetry" (deploy it with its KubernetesAltinityOperator
  # first). Declare the "signoz" user on that resource with
  # access_management and cluster-wide DDL grants — SigNoz creates and
  # migrates its own databases (its spec documents the grant set
  # operator-style users need).
  external_clickhouse:
    host:
      valueFrom:
        kind: KubernetesClickHouse
        name: telemetry
        fieldPath: status.outputs.service_name
    cluster_name:
      valueFrom:
        kind: KubernetesClickHouse
        name: telemetry
        fieldPath: status.outputs.cluster_name
    username: signoz
    password_secret:
      secret_name:
        valueFrom:
          kind: KubernetesClickHouse
          name: telemetry
          fieldPath: status.outputs.auth_secret_name
      secret_key: signoz
  server:
    external_url: https://signoz.example.com
  otel_collector:
    autoscaling:
      enabled: true
      min_replicas: 2
      max_replicas: 8
  cluster_name: production-primary
