apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSignoz
metadata:
  name: observability
spec:
  namespace:
    value: telemetry
  # The composed dev stack: deploy a KubernetesClickHouse named
  # "telemetry" into this same namespace first (with its
  # KubernetesAltinityOperator), declaring a no-grants "signoz" user
  # and an explicit managed keeper (SigNoz migrates ON CLUSTER, and a
  # bare 1x1 defaults to no coordination). Same namespace is the
  # contract: SigNoz reads the password through a secretKeyRef, which
  # cannot cross namespaces. create_namespace stays false — the
  # ClickHouse resource owns the namespace.
  clickhouse:
    host:
      valueFrom:
        kind: KubernetesClickHouse
        name: telemetry
        fieldPath: status.outputs.service_name
    cluster_name:
      valueFrom:
        kind: KubernetesClickHouse
        name: telemetry
        fieldPath: status.outputs.cluster_name
    username: signoz
    password_secret:
      secret_name:
        valueFrom:
          kind: KubernetesClickHouse
          name: telemetry
          fieldPath: status.outputs.auth_secret_name
      secret_key: signoz
