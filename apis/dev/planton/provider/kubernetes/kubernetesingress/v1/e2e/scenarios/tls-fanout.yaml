# TLS block + multi-path fanout: one host terminating TLS from a named
# Secret, fanning out to different backends per path, including a named
# service port and an exact-match path.
apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngress
metadata:
  name: e2e-ing-tls
spec:
  namespace:
    value: default
  name: e2e-ing-tls
  ingress_class_name: nginx
  tls:
    - hosts:
        - shop.e2e.example.com
      secret_name:
        value: shop-e2e-tls
  rules:
    - host: shop.e2e.example.com
      paths:
        - path: /
          path_type: prefix
          backend:
            service_name:
              value: storefront-svc
            port_number: 8080
        - path: /api
          path_type: prefix
          backend:
            service_name:
              value: api-svc
            port_name: http
        - path: /healthz
          path_type: exact
          backend:
            service_name:
              value: health-svc
            port_number: 9000
