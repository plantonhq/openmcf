apiVersion: kubernetes.planton.dev/v1
kind: KubernetesIngress
metadata:
  name: web-ingress
spec:
  name: web-ingress
  namespace:
    value: web
  ingress_class_name: nginx
  rules:
    - host: app.example.com
      paths:
        - path: /
          path_type: prefix
          backend:
            service_name:
              value: web-svc
            port_number: 8080
