syntax = "proto3";

package dev.planton.provider.kubernetes.kubernetesingress.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/kubernetes/kubernetesingress/v1/spec.proto";
import "dev/planton/provider/kubernetes/kubernetesingress/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

/**
 * **KubernetesIngress** defines a Kubernetes Ingress resource following the
 * Kubernetes Resource Model (KRM). An Ingress declares HTTP(S) exposure — host
 * and path routing to Service backends with optional TLS termination — as a
 * first-class node in the resource graph, composing with workload kinds (whose
 * `service` output it routes to) and certificate machinery (whose Secret its
 * `tls` block names).
 */
message KubernetesIngress {
  // API version for this resource.
  // Always set to "kubernetes.planton.dev/v1".
  string api_version = 1 [(buf.validate.field).string.const = "kubernetes.planton.dev/v1"];

  // Resource kind identifier.
  // Always set to "KubernetesIngress".
  string kind = 2 [(buf.validate.field).string.const = "KubernetesIngress"];

  // Metadata for the Ingress resource.
  // Includes standard fields like name, organization, environment, etc.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Specification of the desired state for the Ingress.
  // Defines the target namespace, ingress class, host rules, and TLS.
  KubernetesIngressSpec spec = 4 [(buf.validate.field).required = true];

  // Status of the Ingress resource.
  // Contains outputs populated after deployment.
  KubernetesIngressStatus status = 5;
}

/**
 * **KubernetesIngressStatus** captures the runtime status of an Ingress
 * deployment, including the outputs generated after the Ingress is created.
 */
message KubernetesIngressStatus {
  // Outputs from the Ingress deployment.
  // Contains the load-balancer address handles for DNS composition.
  KubernetesIngressStackOutputs outputs = 1;
}
