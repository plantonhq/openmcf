apiVersion: gcp.planton.dev/v1
kind: GcpKmsKeyIamMember
metadata:
  name: my-temporary-key-access
spec:
  cryptoKeyId:
    valueFrom:
      kind: GcpKmsKey
      name: <kms-key-resource-name>
      fieldPath: status.outputs.key_id
  role:
    value: roles/cloudkms.cryptoKeyEncrypterDecrypter
  member:
    value: "user:<user-email>"  # conditions commonly gate human access
  condition:
    title: expires-end-of-migration
    # CEL expression; the grant applies only while it evaluates true
    expression: request.time < timestamp("<expiry-timestamp>")  # e.g. "2027-01-01T00:00:00Z"
    description: Temporary key access for the data migration, auto-expires
