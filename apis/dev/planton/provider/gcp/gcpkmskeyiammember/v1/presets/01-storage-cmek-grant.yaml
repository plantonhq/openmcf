apiVersion: gcp.planton.dev/v1
kind: GcpKmsKeyIamMember
metadata:
  name: my-gcs-cmek-grant
spec:
  cryptoKeyId:
    # Reference the GcpKmsKey; its `key_id` output is the fully-qualified
    # projects/.../cryptoKeys/... path this field expects — and the reference
    # gives CMEK consumers a real ordering edge on the grant.
    valueFrom:
      kind: GcpKmsKey
      name: <kms-key-resource-name>
      fieldPath: status.outputs.key_id
  role:
    value: roles/cloudkms.cryptoKeyEncrypterDecrypter
  member:
    # Cloud Storage's service agent for the bucket's project. The agent is
    # created by GCP; the email embeds the project NUMBER (not ID).
    value: "serviceAccount:service-<gcp-project-number>@gs-project-accounts.iam.gserviceaccount.com"
