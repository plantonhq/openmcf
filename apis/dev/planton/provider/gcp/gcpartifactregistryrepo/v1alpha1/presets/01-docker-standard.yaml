apiVersion: gcp.planton.dev/v1alpha1
kind: GcpArtifactRegistryRepo
metadata:
  name: app-images
spec:
  location: us-central1 # replace — co-locate with your build/runtime infrastructure
  format: DOCKER
  description: container images for the application services
  dockerConfig:
    # Pushed tags permanently identify one digest — deployments stay
    # reproducible. New tags (v1.2.4, ...) can still be created.
    immutableTags: true
  cleanupPolicies:
    # Superseded digests (untagged) older than 30 days are deleted...
    - id: delete-old-untagged
      action: DELETE
      condition:
        olderThan: "2592000s"
        tagState: UNTAGGED
    # ...but the 10 most recent versions of every package are always kept.
    - id: keep-last-10
      action: KEEP
      mostRecentVersions:
        keepCount: 10
  iamMembers:
    # The runtime service account pulls images (reference your
    # GcpServiceAccount resource; its member output is exactly this value).
    - role: roles/artifactregistry.reader
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: app-runtime
          fieldPath: status.outputs.member
  labels:
    team: platform # replace with your cost-attribution labels
