syntax = "proto3";

package dev.planton.provider.gcp.gcpdnszone.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";
import "dev/planton/shared/options/options.proto";

// GcpDnsZoneCloudLoggingConfig enables Cloud DNS query logging for the zone.
message GcpDnsZoneCloudLoggingConfig {
  // When true, log every query received by this managed zone. Off by default.
  bool enable_logging = 1;
}

// GcpDnsZoneDnssecKeySpec defines an initial DNSSEC key pair for the zone.
// Provide matching keySigning and zoneSigning specs together, or omit both
// and let Cloud DNS generate defaults when DNSSEC is enabled.
message GcpDnsZoneDnssecKeySpec {
  // DNSSEC algorithm. Common values: ecdsap256sha256, rsasha256.
  string algorithm = 1 [(buf.validate.field).cel = {
    id: "algorithm_valid"
    message: "algorithm must be ecdsap256sha256, ecdsap384sha384, rsasha1, rsasha256, or rsasha512"
    expression: "this == '' || this in ['ecdsap256sha256', 'ecdsap384sha384', 'rsasha1', 'rsasha256', 'rsasha512']"
  }];

  // Key length in bits (e.g. 256 for ECDSA, 2048 for RSA).
  int32 key_length = 2;

  // keySigning (KSK) or zoneSigning (ZSK).
  string key_type = 3 [(buf.validate.field).cel = {
    id: "key_type_valid"
    message: "key_type must be keySigning or zoneSigning"
    expression: "this == '' || this in ['keySigning', 'zoneSigning']"
  }];
}

// GcpDnsZoneDnssecConfig controls DNSSEC signing for a public managed zone.
message GcpDnsZoneDnssecConfig {
  // DNSSEC mode: off, on, or transfer (import existing signed zone).
  optional string state = 1 [
    (dev.planton.shared.options.default) = "off",
    (buf.validate.field).cel = {
      id: "state_valid"
      message: "state must be off, on, or transfer"
      expression: "this in ['off', 'on', 'transfer']"
    }
  ];

  // Optional custom initial key specs. Updatable only while state is off.
  repeated GcpDnsZoneDnssecKeySpec default_key_specs = 2;

  // Authenticated denial-of-existence mechanism: nsec or nsec3.
  string non_existence = 3 [(buf.validate.field).cel = {
    id: "non_existence_valid"
    message: "non_existence must be nsec or nsec3"
    expression: "this == '' || this in ['nsec', 'nsec3']"
  }];
}

// GcpDnsZonePrivateVisibilityNetwork binds the zone to a VPC network.
message GcpDnsZonePrivateVisibilityNetwork {
  // VPC network self-link or resource name. Reference a GcpVpcNetwork or
  // supply the full URL (projects/{project}/global/networks/{network}).
  dev.planton.shared.foreignkey.v1.StringValueOrRef network_url = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];
}

// GcpDnsZonePrivateVisibilityGkeCluster exposes the zone to a GKE cluster.
message GcpDnsZonePrivateVisibilityGkeCluster {
  // GKE cluster resource path (projects/{p}/locations/{loc}/clusters/{name}).
  // Reference a GcpGkeCluster or supply the path directly.
  dev.planton.shared.foreignkey.v1.StringValueOrRef gke_cluster_name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGkeCluster,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];
}

// GcpDnsZonePrivateVisibilityConfig defines which VPC networks and GKE
// clusters can see a private managed zone. At least one network or cluster
// is required when this block is present.
message GcpDnsZonePrivateVisibilityConfig {
  option (buf.validate.message).cel = {
    id: "private_visibility_needs_target"
    message: "private_visibility_config requires at least one network or gke_cluster"
    expression: "size(this.networks) > 0 || size(this.gke_clusters) > 0"
  };

  repeated GcpDnsZonePrivateVisibilityNetwork networks = 1;
  repeated GcpDnsZonePrivateVisibilityGkeCluster gke_clusters = 2;
}

// GcpDnsZoneForwardingTargetNameServer is an upstream resolver for a
// forwarding (private) zone. IPv6 targets are not modeled: the released
// google provider exposes only ipv4_address and domain_name here.
message GcpDnsZoneForwardingTargetNameServer {
  option (buf.validate.message).cel = {
    id: "target_has_address"
    message: "each target_name_server requires ipv4_address or domain_name"
    expression: "this.ipv4_address != '' || this.domain_name != ''"
  };

  // IPv4 address of the upstream resolver.
  string ipv4_address = 1;

  // Fully qualified domain name of the forwarding target.
  string domain_name = 2;

  // Query path: default (RFC1918 via VPC, else internet) or private (always VPC).
  string forwarding_path = 3 [(buf.validate.field).cel = {
    id: "forwarding_path_valid"
    message: "forwarding_path must be default or private"
    expression: "this == '' || this in ['default', 'private']"
  }];
}

// GcpDnsZoneForwardingConfig turns the zone into an outbound forwarding zone
// (private visibility only). Queries for names in the zone are forwarded to
// the listed target name servers.
message GcpDnsZoneForwardingConfig {
  repeated GcpDnsZoneForwardingTargetNameServer target_name_servers = 1 [(buf.validate.field).repeated.min_items = 1];
}

// GcpDnsZonePeeringConfig turns the zone into a DNS peering zone (private
// visibility only). Queries are forwarded to the target VPC network's Cloud DNS.
message GcpDnsZonePeeringConfig {
  // VPC network to peer with. Reference a GcpVpcNetwork or supply the self-link.
  dev.planton.shared.foreignkey.v1.StringValueOrRef target_network = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];
}

// GcpDnsZoneSpec defines a Google Cloud DNS managed zone
// (`google_dns_managed_zone`). DNS records belong in the separate GcpDnsRecord
// kind — this resource owns the zone shell only.
message GcpDnsZoneSpec {
  option (buf.validate.message).cel = {
    id: "forwarding_requires_private"
    message: "forwarding_config requires visibility private"
    expression: "!has(this.forwarding_config) || size(this.forwarding_config.target_name_servers) == 0 || this.visibility == 'private'"
  };

  option (buf.validate.message).cel = {
    id: "peering_requires_private"
    message: "peering_config requires visibility private"
    expression: "!has(this.peering_config) || this.visibility == 'private'"
  };

  option (buf.validate.message).cel = {
    id: "private_visibility_requires_private"
    message: "private_visibility_config requires visibility private"
    expression: "!has(this.private_visibility_config) || this.visibility == 'private'"
  };

  option (buf.validate.message).cel = {
    id: "forwarding_peering_mutually_exclusive"
    message: "forwarding_config and peering_config are mutually exclusive"
    expression: "!has(this.forwarding_config) || !has(this.peering_config) || size(this.forwarding_config.target_name_servers) == 0"
  };

  // The GCP project that owns the managed zone. Accepts a literal project ID
  // or a reference to a GcpProject resource. If omitted, the provider's
  // default project is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Authoritative DNS domain for the zone (e.g. "example.com."). Must end with
  // a trailing dot. When omitted, modules derive dns_name from metadata.name
  // plus "." — preserving the legacy default for public zones.
  string dns_name = 2 [(buf.validate.field).cel = {
    id: "dns_name.valid_fqdn"
    message: "dns_name must be a fully qualified domain name ending with a trailing dot (e.g., example.com.)"
    expression: "this == '' || (this.endsWith('.') && this.matches('^(?:[_a-z0-9](?:[_a-z0-9-]{0,61}[a-z0-9])?[.])+$'))"
  }];

  // Human-readable description shown in the GCP console.
  string description = 3;

  // Zone visibility: public (internet-facing) or private (VPC/GKE only).
  optional string visibility = 4 [
    (dev.planton.shared.options.default) = "public",
    (buf.validate.field).cel = {
      id: "visibility_valid"
      message: "visibility must be public or private"
      expression: "this in ['public', 'private']"
    }
  ];

  // VPC/GKE visibility targets for standard private zones. Not used with
  // forwarding or peering zone types.
  GcpDnsZonePrivateVisibilityConfig private_visibility_config = 5;

  // DNSSEC signing configuration (public zones).
  GcpDnsZoneDnssecConfig dnssec_config = 6;

  // Outbound forwarding targets (private forwarding zones).
  GcpDnsZoneForwardingConfig forwarding_config = 7;

  // DNS peering target network (private peering zones).
  GcpDnsZonePeeringConfig peering_config = 8;

  // Cloud DNS query logging.
  GcpDnsZoneCloudLoggingConfig cloud_logging_config = 9;

  // When true, delete all record sets in the zone on destroy. Default false.
  optional bool force_destroy = 10 [(dev.planton.shared.options.default) = "false"];

  // Additional GCP labels merged with platform labels.
  map<string, string> labels = 11;
}
