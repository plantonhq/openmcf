apiVersion: gcp.planton.dev/v1
kind: GcpComputeDisk
metadata:
  name: analytics-data
spec:
  zone: us-central1-a # replace — hyperdisk requires a supported machine family
  # Hyperdisk decouples performance from capacity: IOPS and throughput
  # are purchased independently of size and retune IN PLACE (at most
  # every 4 hours) — no disk replacement, no data migration.
  type: hyperdisk-balanced
  sizeGb: 1000
  provisionedIops: 6000
  provisionedThroughput: 290 # MB/s
  labels:
    team: analytics # replace with your cost-attribution labels
