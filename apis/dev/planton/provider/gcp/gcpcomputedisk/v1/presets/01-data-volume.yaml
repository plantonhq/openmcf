apiVersion: gcp.planton.dev/v1
kind: GcpComputeDisk
metadata:
  name: app-data
spec:
  zone: us-central1-a # replace — must match the instance's zone
  # pd-balanced: SSD-backed, GCP's default and the sensible general
  # choice; performance scales with size.
  type: pd-balanced
  # Empty disk (no image/snapshot/source), so size is required. Grows in
  # place later; never shrinks.
  sizeGb: 100
  labels:
    team: platform # replace with your cost-attribution labels
