<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Persistent disk: a durable platter cylinder -->
  <ellipse cx="8" cy="4" rx="6" ry="2.2" fill="#4285F4"/>
  <path d="M 2 4 L 2 11 A 6 2.2 0 0 0 14 11 L 14 4 A 6 2.2 0 0 1 2 4 Z" fill="#669DF6"/>
  <ellipse cx="8" cy="4" rx="6" ry="2.2" stroke="#1967D2" stroke-width="0.5" fill="#4285F4"/>

  <!-- Platter sheen lines: the block-device stack -->
  <path d="M 2 7 A 6 2.2 0 0 0 14 7" stroke="#1967D2" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M 2 9.5 A 6 2.2 0 0 0 14 9.5" stroke="#1967D2" stroke-width="0.5" fill="none" opacity="0.6"/>

  <!-- Zonal anchor: the disk lives in exactly one zone -->
  <circle cx="12.2" cy="12.2" r="2.6" fill="#34A853"/>
  <path d="M 12.2 10.9 A 1.05 1.05 0 0 1 13.25 11.95 C 13.25 12.75 12.2 13.7 12.2 13.7 C 12.2 13.7 11.15 12.75 11.15 11.95 A 1.05 1.05 0 0 1 12.2 10.9 Z" fill="#FFFFFF"/>
