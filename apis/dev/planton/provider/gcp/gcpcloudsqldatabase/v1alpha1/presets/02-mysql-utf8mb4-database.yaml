apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSqlDatabase
metadata:
  name: my-app-database
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  instance:
    valueFrom:
      kind: GcpCloudSql
      name: my-mysql-ha # replace with your instance's resource name
      fieldPath: status.outputs.instance_name
  databaseName: app
  # utf8mb4 is MySQL's real UTF-8 (full 4-byte, emoji-safe); the legacy
  # "utf8" charset is a 3-byte subset that corrupts astral-plane characters.
  charset: utf8mb4
  collation: utf8mb4_0900_ai_ci
