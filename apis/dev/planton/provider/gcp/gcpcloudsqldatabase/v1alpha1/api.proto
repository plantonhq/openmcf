syntax = "proto3";

package dev.planton.provider.gcp.gcpcloudsqldatabase.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpcloudsqldatabase/v1alpha1/spec.proto";
import "dev/planton/provider/gcp/gcpcloudsqldatabase/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-cloud-sql-database
message GcpCloudSqlDatabase {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudSqlDatabase'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudSqlDatabaseSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudSqlDatabaseStatus status = 5;
}

//gcp-cloud-sql-database status
message GcpCloudSqlDatabaseStatus {
  //stack-outputs
  GcpCloudSqlDatabaseStackOutputs outputs = 1;
}
