apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubSchema
metadata:
  name: telemetry-schema
spec:
  # Omitted projectId: the schema lands in the provider's default project.
  schemaName: device-telemetry
  # PROTOCOL_BUFFER suits publishers that already serialize protobuf and
  # care about compact binary encoding on the wire (pair with a topic
  # schemaSettings encoding of BINARY).
  type: PROTOCOL_BUFFER
  definition: |
    syntax = "proto3";

    message DeviceTelemetry {
      string device_id = 1;
      int64 reported_at_ms = 2;
      double temperature_celsius = 3;
      double battery_percent = 4;
    }
