syntax = "proto3";

package dev.planton.provider.gcp.gcppubsubschema.v1alpha1;

// Outputs produced after provisioning a GCP Pub/Sub schema.
message GcpPubSubSchemaStackOutputs {
  // Fully qualified schema resource path: projects/{project}/schemas/{name}.
  // This is the exact string a topic's schema_settings.schema consumes —
  // reference it from GcpPubSubTopic to attach message validation.
  string schema_id = 1;

  // The short name of the schema (same as the spec's schema_name input).
  // Useful for display, logging, and human-readable references.
  string schema_name = 2;
}
