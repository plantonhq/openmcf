syntax = "proto3";

package dev.planton.provider.gcp.gcppubsubschema.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcppubsubschema/v1/spec.proto";
import "dev/planton/provider/gcp/gcppubsubschema/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-pub-sub-schema
message GcpPubSubSchema {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpPubSubSchema'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpPubSubSchemaSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpPubSubSchemaStatus status = 5;
}

//gcp-pub-sub-schema status
message GcpPubSubSchemaStatus {
  //stack-outputs
  GcpPubSubSchemaStackOutputs outputs = 1;
}
