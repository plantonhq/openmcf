apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubTopic
metadata:
  name: gcs-data-ingest
spec:
  topicName: gcs-data-ingest
  ingestionDataSourceSettings:
    cloudStorage:
      # Reference a GcpGcsBucket resource (shown) or set a literal bucket
      # name (without the gs:// prefix).
      bucket:
        valueFrom:
          kind: GcpGcsBucket
          name: data-landing-bucket
          fieldPath: status.outputs.bucket_id
      matchGlob: "**/*.json"
      # Each newline-delimited line becomes one Pub/Sub message.
      textFormat:
        delimiter: "\n"
    platformLogsSettings:
      severity: INFO
