# Development manifest for GcpCloudRunJob — exercises batch semantics
# (multi-task parallelism, secret env, Cloud SQL volume, direct VPC egress)
# for offline plan verification.
#
# Usage: planton tofu plan --manifest apis/dev/planton/provider/gcp/gcpcloudrunjob/v1alpha1/iac/hack/manifest.yaml
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunJob
metadata:
  name: hack-cloud-run-job
  id: cldrunjob-hack-001
  org: planton-dev
  env: dev
spec:
  region: us-central1
  jobName: hack-etl
  labels:
    team: platform
  template:
    containers:
      - name: worker
        image: us-docker.pkg.dev/cloudrun/container/job:latest
        env:
          - name: BATCH_MODE
            value: full
          - name: DB_PASSWORD
            valueFromSecret:
              secret: hack-db-password
              version: latest
        resources:
          cpu: "2"
          memory: 2Gi
        volumeMounts:
          - name: cloudsql
            mountPath: /cloudsql
    volumes:
      - name: cloudsql
        cloudSqlInstance:
          instances:
            - value: my-project:us-central1:hack-db
    timeoutSeconds: 1800
    maxRetries: 2
    vpcAccess:
      networkInterfaces:
        - network:
            value: hack-vpc
          subnetwork:
            value: hack-subnet
      egress: PRIVATE_RANGES_ONLY
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  taskCount: 5
  parallelism: 2
  deletionProtection: false
