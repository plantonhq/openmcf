# Minimal GcpCloudRunJob scenario: a single-task batch hello job.
# project_id is deliberately omitted (ambient project). Job names are
# project-scoped with no soft-delete reservation. deletion_protection
# must be false so DESTROY can run.
apiVersion: gcp.planton.dev/v1
kind: GcpCloudRunJob
metadata:
  name: planton-oss-e2e-cldrunjob-minimal
  id: planton-oss-e2e-cldrunjob-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudrunjob
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  jobName: planton-oss-e2e-cldrunjob-${E2E_RUN_ID}
  template:
    containers:
      - image: us-docker.pkg.dev/cloudrun/container/job:latest
        resources:
          cpu: "1"
          memory: 512Mi
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: 300
    maxRetries: 1
  taskCount: 1
  deletionProtection: false
