syntax = "proto3";

package dev.planton.provider.gcp.gcpcloudrunjob.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpcloudrunjob/v1/spec.proto";
import "dev/planton/provider/gcp/gcpcloudrunjob/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-cloud-run-job
message GcpCloudRunJob {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudRunJob'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudRunJobSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudRunJobStatus status = 5;
}

//gcp-cloud-run-job status
message GcpCloudRunJobStatus {
  //stack-outputs
  GcpCloudRunJobStackOutputs outputs = 1;
}
