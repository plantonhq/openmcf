apiVersion: gcp.planton.dev/v1
kind: GcpCloudRunJob
metadata:
  name: gpu-inference-batch
spec:
  region: us-central1
  template:
    containers:
      - image: us-docker.pkg.dev/my-project/my-repo/inference-gpu:1.0.0
        resources:
          cpu: "4"
          memory: 16Gi
    nodeSelector:
      accelerator: nvidia-l4
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: 7200
    maxRetries: 1
  taskCount: 8
  parallelism: 4
  gpuZonalRedundancyDisabled: true
  deletionProtection: false
