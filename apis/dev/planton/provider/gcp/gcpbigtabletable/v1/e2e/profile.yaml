apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpbigtabletable
spec:
  # Composed scenario: the table rides the GcpBigtableInstance
  # prerequisite chain. deploy -> table + column-family posture verify ->
  # destroy -> verify gone, on both provisioners. The table itself
  # creates in seconds; the chain cost is the instance prerequisite.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
