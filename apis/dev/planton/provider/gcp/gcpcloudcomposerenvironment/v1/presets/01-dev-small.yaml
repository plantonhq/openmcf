apiVersion: gcp.planton.dev/v1
kind: GcpCloudComposerEnvironment
metadata:
  name: dev-airflow
spec:
  # project_id omitted: falls back to the provider's default project.
  region: us-central1

  environmentSize: ENVIRONMENT_SIZE_SMALL

  softwareConfig:
    imageVersion: composer-2.9.7-airflow-2.9.3 # replace with a current image version

  # Small allocations sized for DAG development, not production load.
  workloadsConfig:
    scheduler:
      cpu: 0.5
      memoryGb: 2.0
      storageGb: 1.0
      count: 1
    webServer:
      cpu: 0.5
      memoryGb: 2.0
      storageGb: 1.0
    worker:
      cpu: 0.5
      memoryGb: 2.0
      storageGb: 1.0
      minCount: 1
      maxCount: 3

  labels:
    environment: dev
