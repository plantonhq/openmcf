apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudComposerEnvironment
metadata:
  name: prod-airflow
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  region: us-central1

  environmentSize: ENVIRONMENT_SIZE_MEDIUM
  resilienceMode: HIGH_RESILIENCE

  nodeConfig:
    network:
      valueFrom:
        kind: GcpVpcNetwork
        name: prod-vpc # replace with your VPC resource name
        fieldPath: status.outputs.network_self_link
    subnetwork:
      valueFrom:
        kind: GcpSubnetwork
        name: prod-subnet # replace with your subnetwork resource name
        fieldPath: status.outputs.subnetwork_self_link
    serviceAccount:
      value: composer-sa@my-gcp-project-123.iam.gserviceaccount.com # replace with your service account
    # VPC-native ranges: name existing secondary ranges on the subnetwork
    # (per range: a name XOR a CIDR, never both).
    ipAllocationPolicy:
      clusterSecondaryRangeName: composer-pods
      servicesSecondaryRangeName: composer-services

  softwareConfig:
    imageVersion: composer-2.9.7-airflow-2.9.3 # replace with a current image version

  privateEnvironmentConfig:
    enablePrivateEndpoint: true
    connectionType: VPC_PEERING
    masterIpv4CidrBlock: "172.16.0.0/28"
    cloudSqlIpv4CidrBlock: "10.0.32.0/20"
    cloudComposerNetworkIpv4CidrBlock: "10.0.48.0/20"

  # Only these networks reach the GKE control plane running Airflow.
  masterAuthorizedNetworksConfig:
    enabled: true
    cidrBlocks:
      - cidrBlock: "10.0.0.0/8"
        displayName: corp-network

  workloadsConfig:
    scheduler:
      cpu: 2.0
      memoryGb: 7.5
      storageGb: 5.0
      count: 2
    webServer:
      cpu: 2.0
      memoryGb: 7.5
      storageGb: 5.0
    triggerer:
      cpu: 0.5
      memoryGb: 1.0
      count: 2
    worker:
      cpu: 2.0
      memoryGb: 7.5
      storageGb: 5.0
      minCount: 2
      maxCount: 6

  maintenanceWindow:
    startTime: "2026-01-01T00:00:00Z"
    endTime: "2026-01-01T12:00:00Z"
    recurrence: "FREQ=WEEKLY;BYDAY=SA,SU"

  labels:
    environment: production
    team: data-platform
