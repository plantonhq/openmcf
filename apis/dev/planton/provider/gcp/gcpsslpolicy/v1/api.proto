syntax = "proto3";

package dev.planton.provider.gcp.gcpsslpolicy.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpsslpolicy/v1/spec.proto";
import "dev/planton/provider/gcp/gcpsslpolicy/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-ssl-policy
message GcpSslPolicy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpSslPolicy'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpSslPolicySpec spec = 4 [(buf.validate.field).required = true];
  GcpSslPolicyStatus status = 5;
}

message GcpSslPolicyStatus {
  GcpSslPolicyStackOutputs outputs = 1;
}
