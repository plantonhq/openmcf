syntax = "proto3";

package dev.planton.provider.gcp.gcptargethttpsproxy.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcptargethttpsproxy/v1/spec.proto";
import "dev/planton/provider/gcp/gcptargethttpsproxy/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-target-https-proxy
message GcpTargetHttpsProxy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpTargetHttpsProxy'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpTargetHttpsProxySpec spec = 4 [(buf.validate.field).required = true];
  GcpTargetHttpsProxyStatus status = 5;
}

message GcpTargetHttpsProxyStatus {
  GcpTargetHttpsProxyStackOutputs outputs = 1;
}
