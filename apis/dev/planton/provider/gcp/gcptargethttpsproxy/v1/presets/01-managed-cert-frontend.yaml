apiVersion: gcp.planton.dev/v1
kind: GcpTargetHttpsProxy
metadata:
  name: managed-cert-frontend
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Port-443 frontend terminating TLS with a Google-managed certificate
  urlMap:
    value: "<app-url-map-self-link>" # replace: the URL map routing to real backends
  sslCertificates:
    - value: "<managed-cert-self-link>" # replace: a GcpManagedSslCertificate self_link
  sslPolicy:
    value: "<modern-ssl-policy-self-link>" # replace: an SSL policy enforcing TLS >= 1.2
