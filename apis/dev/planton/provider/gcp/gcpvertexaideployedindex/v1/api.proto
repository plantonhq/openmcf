syntax = "proto3";

package dev.planton.provider.gcp.gcpvertexaideployedindex.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpvertexaideployedindex/v1/spec.proto";
import "dev/planton/provider/gcp/gcpvertexaideployedindex/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-vertex-ai-deployed-index
message GcpVertexAiDeployedIndex {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpVertexAiDeployedIndex'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpVertexAiDeployedIndexSpec spec = 4 [(buf.validate.field).required = true];
  GcpVertexAiDeployedIndexStatus status = 5;
}

message GcpVertexAiDeployedIndexStatus {
  GcpVertexAiDeployedIndexStackOutputs outputs = 1;
}
