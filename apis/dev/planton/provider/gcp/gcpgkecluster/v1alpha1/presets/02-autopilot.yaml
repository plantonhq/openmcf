apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeCluster
metadata:
  name: autopilot-primary
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  location: us-central1 # Autopilot clusters are always regional
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: my-app-vpc # replace with your GcpVpcNetwork resource name
      fieldPath: status.outputs.network_self_link
  subnetwork:
    valueFrom:
      kind: GcpSubnetwork
      name: my-gke-subnet # replace with your GcpSubnetwork resource name
      fieldPath: status.outputs.subnetwork_self_link
  # GKE provisions and manages nodes, bills per pod, and enforces a hardened
  # posture. No GcpGkeNodePool resources attach to an Autopilot cluster, and
  # node-management fields (NAP, shielded-nodes flag, Calico policy) are
  # rejected pre-deploy.
  enableAutopilot: true
  privateCluster:
    # Autopilot with private nodes: pods and nodes get internal IPs only.
    enablePrivateNodes: true
    masterIpv4CidrBlock: "172.16.0.32/28" # replace: must not overlap any VPC range
  masterAuthorizedNetworks:
    cidrBlocks:
      - cidrBlock: 203.0.113.0/24 # replace with your office/VPN egress range
        displayName: corp-vpn
  releaseChannel: REGULAR
  maintenancePolicy:
    recurringWindow:
      # Weekend-only maintenance keeps upgrade churn out of business hours.
      startTime: "2026-01-03T02:00:00Z"
      endTime: "2026-01-03T10:00:00Z"
      recurrence: FREQ=WEEKLY;BYDAY=SA,SU
  enableCostManagement: true
