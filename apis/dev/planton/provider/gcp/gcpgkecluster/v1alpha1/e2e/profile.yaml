apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpgkecluster
spec:
  # GKE control planes are the slowest resources in the harness: creates run
  # 10-25 minutes and destroys 5-10, per scenario per engine. Batch runs with
  # a go test -timeout of at least 120m.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 120
