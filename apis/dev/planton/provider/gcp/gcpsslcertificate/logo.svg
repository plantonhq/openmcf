<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Certificate background (TLS family mark) -->
  <rect x="2" y="1" width="12" height="14" rx="1" fill="#4285F4" opacity="0.9"/>

  <!-- Certificate border/frame -->
  <rect x="2" y="1" width="12" height="14" rx="1" stroke="#1967D2" stroke-width="0.5" fill="none"/>

  <!-- Key symbol in center: bring-your-own key material -->
  <g transform="translate(4, 4)">
    <circle cx="2.2" cy="2.2" r="1.7" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    <line x1="3.4" y1="3.4" x2="6.6" y2="6.6" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <line x1="5.4" y1="5.4" x2="6.4" y2="4.4" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="6.4" y1="6.4" x2="7.2" y2="5.6" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- Upload arrow: you import the material -->
  <g transform="translate(10, 11)">
    <circle cx="2" cy="2" r="2" fill="#F9AB00"/>
    <path d="M 2 3 L 2 1 M 1.2 1.8 L 2 1 L 2.8 1.8" stroke="#FFFFFF" stroke-width="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
