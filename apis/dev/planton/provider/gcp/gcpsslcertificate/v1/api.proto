syntax = "proto3";

package dev.planton.provider.gcp.gcpsslcertificate.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpsslcertificate/v1/spec.proto";
import "dev/planton/provider/gcp/gcpsslcertificate/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-ssl-certificate
message GcpSslCertificate {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpSslCertificate'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpSslCertificateSpec spec = 4 [(buf.validate.field).required = true];
  GcpSslCertificateStatus status = 5;
}

message GcpSslCertificateStatus {
  GcpSslCertificateStackOutputs outputs = 1;
}
