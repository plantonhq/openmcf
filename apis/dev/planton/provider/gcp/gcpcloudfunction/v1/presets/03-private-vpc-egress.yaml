apiVersion: gcp.planton.dev/v1
kind: GcpCloudFunction
metadata:
  name: db-api
spec:
  region: us-central1
  buildConfig:
    runtime: go123
    entryPoint: Handler
    source:
      storageSource:
        bucket:
          value: my-source-bucket # or reference a GcpGcsBucket resource
        object: functions/db-api-v1.0.0.zip
  serviceConfig:
    serviceAccountEmail:
      valueFrom:
        name: db-api-runtime # a GcpServiceAccount with least-privilege grants
    vpcConnector:
      valueFrom:
        name: svc-egress # a GcpServerlessVpcConnector in the same region
    vpcConnectorEgressSettings: PRIVATE_RANGES_ONLY
    secretEnvironmentVariables:
      - key: DATABASE_PASSWORD
        secret: db-password # Secret Manager secret name; material never enters the spec
        version: latest
    scaling:
      minInstanceCount: 1 # keep one instance warm for the DB connection pool
      maxInstanceCount: 20
  trigger:
    triggerType: HTTP
