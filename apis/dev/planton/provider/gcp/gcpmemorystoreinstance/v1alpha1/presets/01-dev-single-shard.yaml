apiVersion: gcp.planton.dev/v1alpha1
kind: GcpMemorystoreInstance
metadata:
  name: my-dev-memorystore
spec:
  instanceName: my-dev-memorystore
  location: us-central1
  shardCount: 1

  # Standalone mode — a single primary endpoint, compatible with any
  # Valkey/Redis client (no cluster-aware driver needed).
  mode: CLUSTER_DISABLED

  # Smallest, shared-core node — right for dev/test caching.
  nodeType: SHARED_CORE_NANO

  # PSC endpoint in the consumer VPC. Deploy a GcpServiceConnectionPolicy
  # for the gcp-memorystore class on this network in this region first.
  pscAutoConnections:
    - network:
        valueFrom:
          kind: GcpVpcNetwork
          name: dev-vpc
          fieldPath: status.outputs.network_id
      projectId:
        value: my-gcp-project-123 # replace with your project ID

  # Dev instances tear down freely.
  deletionProtectionEnabled: false
