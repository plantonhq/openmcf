apiVersion: gcp.planton.dev/v1alpha1
kind: GcpRegionNetworkEndpointGroup
metadata:
  name: internet-origin-neg
spec:
  projectId:
    value: "my-gcp-project-123" # replace: your GCP project id
  region: us-central1 # replace: your region
  networkEndpointType: INTERNET_FQDN_PORT
  network:
    value: "projects/my-gcp-project-123/global/networks/default" # replace: your VPC self-link
  # The external origin (FQDN:port endpoints are attached to the NEG separately
  # in GCP; this NEG declares the internet-origin type and its network).
