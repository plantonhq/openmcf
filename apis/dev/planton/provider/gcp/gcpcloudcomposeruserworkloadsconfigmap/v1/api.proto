import "dev/planton/shared/metadata.proto";

//gcp-cloud-composer-user-workloads-config-map
message GcpCloudComposerUserWorkloadsConfigMap {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudComposerUserWorkloadsConfigMap'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudComposerUserWorkloadsConfigMapSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudComposerUserWorkloadsConfigMapStatus status = 5;
}

//gcp-cloud-composer-user-workloads-config-map status
message GcpCloudComposerUserWorkloadsConfigMapStatus {
  //stack-outputs
  GcpCloudComposerUserWorkloadsConfigMapStackOutputs outputs = 1;
}
