# Development manifest for GcpCloudRun — exercises a broad slice of the spec
# (sidecar with startup ordering, secret env, Cloud SQL volume, probes,
# scaling, traffic split, direct VPC egress) for offline plan verification.
#
# Usage: planton tofu plan --manifest apis/dev/planton/provider/gcp/gcpcloudrun/v1/iac/hack/manifest.yaml
apiVersion: gcp.planton.dev/v1
kind: GcpCloudRun
metadata:
  name: hack-cloud-run
  id: cldrun-hack-001
  org: planton-dev
  env: dev
spec:
  # project_id omitted: the service lands in the provider's default project.
  region: us-central1
  serviceName: hack-api
  description: Development service exercising the full template surface
  labels:
    team: platform
  containers:
    - name: app
      image: us-docker.pkg.dev/cloudrun/container/hello:latest
      env:
        - name: LOG_LEVEL
          value: debug
        - name: DB_PASSWORD
          valueFromSecret:
            secret: hack-db-password
            version: latest
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
        startupCpuBoost: true
      volumeMounts:
        - name: cloudsql
          mountPath: /cloudsql
      startupProbe:
        periodSeconds: 5
        httpGet:
          path: /
      livenessProbe:
        httpGet:
          path: /
      dependsOn:
        - collector
    - name: collector
      image: us-docker.pkg.dev/cloudrun/container/hello:latest
  volumes:
    - name: cloudsql
      cloudSqlInstance:
        instances:
          - value: my-project:us-central1:hack-db
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 10
  maxInstanceRequestConcurrency: 80
  timeoutSeconds: 300
  executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  sessionAffinity: true
  vpcAccess:
    networkInterfaces:
      - network:
          value: hack-vpc
        subnetwork:
          value: hack-subnet
        tags:
          - cloud-run-egress
    egress: PRIVATE_RANGES_ONLY
  ingress: INGRESS_TRAFFIC_ALL
  allowUnauthenticated: true
  traffic:
    - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
      percent: 100
  deletionProtection: false
