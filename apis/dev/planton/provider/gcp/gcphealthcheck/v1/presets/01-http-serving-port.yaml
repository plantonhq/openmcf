apiVersion: gcp.planton.dev/v1
kind: GcpHealthCheck
metadata:
  name: my-web-probe
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Probes the web tier's health endpoint on its serving port
  # USE_SERVING_PORT probes whatever port the backend actually serves on —
  # the right default for serverless NEGs and most instance-group backends.
  http:
    portSpecification: USE_SERVING_PORT
    requestPath: /healthz  # replace: a cheap, dependency-free endpoint
  # Default cadence: every 5s, 5s timeout, 2 up / 2 down (~10s detection).
  enableLogging: false  # flip on while tuning thresholds
