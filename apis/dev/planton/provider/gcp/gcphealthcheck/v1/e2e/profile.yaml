apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcphealthcheck
spec:
  # Two leaf scenarios exercising BOTH provider resources behind the one
  # kind: minimal (global health check) and regional (region health check).
  # Health checks are free, instant to create/destroy, and have no
  # dependencies — deploy -> compute healthChecks/regionHealthChecks get
  # verify -> destroy -> verify 404, on both provisioners.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
