syntax = "proto3";

package dev.planton.provider.gcp.gcpvertexaiindex.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpvertexaiindex/v1alpha1/spec.proto";
import "dev/planton/provider/gcp/gcpvertexaiindex/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-vertex-ai-index
message GcpVertexAiIndex {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpVertexAiIndex'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpVertexAiIndexSpec spec = 4 [(buf.validate.field).required = true];
  GcpVertexAiIndexStatus status = 5;
}

message GcpVertexAiIndexStatus {
  GcpVertexAiIndexStackOutputs outputs = 1;
}
