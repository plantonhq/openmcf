apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiIndex
metadata:
  name: rag-chunks
spec:
  # Omitted projectId: the index lands in the provider's default project.
  # Set projectId (literal or a GcpProject reference) to target another.
  location: us-central1
  displayName: RAG Document Chunks
  # STREAM_UPDATE: vectors upsert via the API within seconds — the regime
  # for RAG and any corpus that changes continuously. Immutable; migrating
  # regimes means recreating the index.
  indexUpdateMethod: STREAM_UPDATE
  config:
    # The embedding model's output size (1536 fits common text encoders).
    dimensions: 1536
    # Candidates fetched by approximate search before exact reordering —
    # required whenever tree-AH is used.
    approximateNeighborsCount: 150
    # Unit-normalized vectors + dot-product ranking behaves like cosine
    # similarity, the standard pairing for text embeddings.
    distanceMeasureType: DOT_PRODUCT_DISTANCE
    featureNormType: UNIT_L2_NORM
    # Empty tree-AH block: GCP's default tuning (1000 embeddings per
    # leaf, 10% of leaves searched per query).
    treeAhConfig: {}
  labels:
    team: ml-platform
