apiVersion: gcp.planton.dev/v1
kind: GcpWorkloadIdentityPool
metadata:
  name: staged-federation-pool
spec:
  projectId:
    value: "<gcp-project-id>"
  workloadIdentityPoolId: partner-federation # replace: 4-32 chars; lowercase letters, digits, hyphens
  displayName: Partner Federation (staged)
  description: Federation boundary provisioned ahead of go-live; enable by setting disabled to false
  # The pool exists (its name is stable and grantable) but rejects every token
  # exchange until explicitly enabled — infrastructure lands first, trust is
  # switched on as a one-line change at go-live.
  disabled: true
