apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpfirestoreindex
spec:
  # Composed scenario: deploys the GcpFirestoreDatabase prerequisite, then
  # creates a simple composite index. Index build is asynchronous but the
  # resource creates quickly; the chain cost is the database (~1-2 minutes).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
