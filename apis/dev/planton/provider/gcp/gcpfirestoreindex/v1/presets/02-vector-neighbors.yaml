apiVersion: gcp.planton.dev/v1
kind: GcpFirestoreIndex
metadata:
  name: products-vector-search
spec:
  # project_id omitted: falls back to the provider's default project.
  database:
    valueFrom:
      kind: GcpFirestoreDatabase
      name: prod-firestore # replace with your database resource name
      fieldPath: status.outputs.database_name
  collection: products
  fields:
    - fieldPath: category
      order: ASCENDING
    - fieldPath: embedding
      vectorConfig:
        dimension: 768
