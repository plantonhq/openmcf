syntax = "proto3";

package dev.planton.provider.gcp.gcpfirestoreindex.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpfirestoreindex/v1/spec.proto";
import "dev/planton/provider/gcp/gcpfirestoreindex/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-firestore-index
message GcpFirestoreIndex {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirestoreIndex'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpFirestoreIndexSpec spec = 4 [(buf.validate.field).required = true];
  GcpFirestoreIndexStatus status = 5;
}

message GcpFirestoreIndexStatus {
  GcpFirestoreIndexStackOutputs outputs = 1;
}
