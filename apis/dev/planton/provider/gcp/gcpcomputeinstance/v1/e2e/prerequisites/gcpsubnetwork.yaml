# Consumer-scoped GcpSubnetwork install profile for the compute-instance
# chain: a regular /24 in the instance's region — VMs need no special
# subnet purpose.
apiVersion: gcp.planton.dev/v1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpsnw-vm-prereq
  id: planton-oss-e2e-gcpsnw-vm-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: e2e-vm-subnet-${E2E_RUN_ID}
  region: us-central1
  ipCidrRange: 10.11.0.0/24
  description: Ephemeral /24 for the GcpComputeInstance E2E chain; safe to delete
