apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcomputeinstance
spec:
  # VM creates are fast (~1 min). The minimal scenario proves the
  # subnetwork chain with an ephemeral external IP; the features scenario
  # proves the composed graph live — Spot scheduling, shielded VM, a
  # dedicated GcpServiceAccount identity, and a pre-created GcpComputeDisk
  # attached by self-link reference.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
