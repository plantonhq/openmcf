syntax = "proto3";

package dev.planton.provider.gcp.gcpspannerbackupschedule.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpspannerbackupschedule/v1/spec.proto";
import "dev/planton/provider/gcp/gcpspannerbackupschedule/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-spanner-backup-schedule
message GcpSpannerBackupSchedule {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpSpannerBackupSchedule'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpSpannerBackupScheduleSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpSpannerBackupScheduleStatus status = 5;
}

//gcp-spanner-backup-schedule status
message GcpSpannerBackupScheduleStatus {
  //stack-outputs
  GcpSpannerBackupScheduleStackOutputs outputs = 1;
}
