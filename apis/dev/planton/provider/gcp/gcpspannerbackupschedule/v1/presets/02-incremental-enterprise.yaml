apiVersion: gcp.planton.dev/v1
kind: GcpSpannerBackupSchedule
metadata:
  name: orders-incremental-backups
spec:
  # project_id omitted: falls back to the provider's default project.
  instance:
    valueFrom:
      kind: GcpSpannerInstance
      name: prod-spanner # replace with your instance resource name
      fieldPath: status.outputs.instance_name
  database:
    valueFrom:
      kind: GcpSpannerDatabase
      name: orders-db # replace with your database resource name
      fieldPath: status.outputs.database_name
  cron: "0 2/12 * * *" # every 12 hours at 02:00 and 14:00 UTC
  retentionDuration: 1209600s # keep each backup 14 days
  # Incremental chains store only changes since the previous backup —
  # requires the instance to be ENTERPRISE or ENTERPRISE_PLUS edition.
  backupType: INCREMENTAL
