syntax = "proto3";

package dev.planton.provider.gcp.gcpalloydbuser.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpalloydbuser/v1/spec.proto";
import "dev/planton/provider/gcp/gcpalloydbuser/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-alloydb-user
message GcpAlloydbUser {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpAlloydbUser'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpAlloydbUserSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpAlloydbUserStatus status = 5;
}

//gcp-alloydb-user status
message GcpAlloydbUserStatus {
  //stack-outputs
  GcpAlloydbUserStackOutputs outputs = 1;
}
