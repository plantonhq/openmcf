apiVersion: gcp.planton.dev/v1
kind: GcpServiceConnectionPolicy
metadata:
  name: memorystore-valkey-policy
spec:
  # Region the policy applies to. Service connectivity automation is
  # regional — a Memorystore instance in another region needs its own
  # policy there.
  location: us-central1

  # The consumer VPC network. Reference the GcpVpcNetwork resource so the
  # resource path resolves automatically.
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: prod-vpc
      fieldPath: status.outputs.network_id

  # gcp-memorystore is the published service class for Memorystore for
  # Valkey. With this policy in place, creating a GcpMemorystoreInstance
  # on this network just works — the automation places PSC endpoints in
  # the subnet below and the instance's endpoint IPs surface on it.
  serviceClass: gcp-memorystore

  pscConfig:
    # The subnet endpoint IPs come from. Regular-purpose subnets work —
    # no special PSC purpose is needed.
    subnetworks:
      - valueFrom:
          kind: GcpSubnetwork
          name: prod-subnet
          fieldPath: status.outputs.subnetwork_self_link
