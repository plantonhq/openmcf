syntax = "proto3";

package dev.planton.provider.gcp.gcpserviceconnectionpolicy.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpserviceconnectionpolicy/v1/spec.proto";
import "dev/planton/provider/gcp/gcpserviceconnectionpolicy/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-service-connection-policy
message GcpServiceConnectionPolicy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpServiceConnectionPolicy'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpServiceConnectionPolicySpec spec = 4 [(buf.validate.field).required = true];
  GcpServiceConnectionPolicyStatus status = 5;
}

message GcpServiceConnectionPolicyStatus {
  GcpServiceConnectionPolicyStackOutputs outputs = 1;
}
