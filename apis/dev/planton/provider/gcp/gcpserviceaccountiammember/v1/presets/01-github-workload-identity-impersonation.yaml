apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccountIamMember
metadata:
  name: my-github-deployer-impersonation
spec:
  serviceAccountId:
    # Reference the GcpServiceAccount being impersonated; its `name` output is
    # the fully-qualified projects/.../serviceAccounts/... string this field expects.
    valueFrom:
      kind: GcpServiceAccount
      name: <service-account-resource-name>
      fieldPath: status.outputs.name
  role:
    value: roles/iam.workloadIdentityUser
  member:
    # The federated principal set for one GitHub repository. Assemble from the
    # project NUMBER (not ID) and the workload identity pool ID; scoping to
    # attribute.repository limits impersonation to workflows of that repo.
    value: "principalSet://iam.googleapis.com/projects/<gcp-project-number>/locations/global/workloadIdentityPools/<pool-id>/attribute.repository/<github-org>/<github-repo>"
