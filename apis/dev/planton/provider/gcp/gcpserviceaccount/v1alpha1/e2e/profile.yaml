apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpserviceaccount
spec:
  # Leaf identity scenario: deploy -> iam serviceAccounts.get verify ->
  # destroy -> verify-destroyed on both provisioners against the GCP test
  # project via ambient ADC. The manifest omits project_id and rides the
  # harness-exported GOOGLE_PROJECT, so no project id is hardcoded in the repo.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
