apiVersion: gcp.planton.dev/v1
kind: GcpServiceAccount
metadata:
  name: my-ci-cd-sa
spec:
  serviceAccountId: my-ci-deployer  # replace: 6-30 chars, lowercase letters/digits/hyphens
  projectId:
    value: "<gcp-project-id>"
  displayName: CI/CD Pipeline
  description: Deploys releases from the pipeline; prefer Workload Identity Federation over the exported key where the CI system supports OIDC
  createKey: true  # JSON key exported for CI/CD systems that cannot federate; rotate regularly
  projectIamRoles:
    - roles/artifactregistry.writer
    - roles/container.developer
    - roles/run.developer
    - roles/iam.serviceAccountUser
