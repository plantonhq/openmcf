syntax = "proto3";

package dev.planton.provider.gcp.gcpglobalforwardingrule.v1alpha1;

// Outputs produced after provisioning a GCP global forwarding rule.
message GcpGlobalForwardingRuleStackOutputs {
  // The IP address this frontend accepts traffic on — the load balancer's
  // VIP, and the value DNS records point at. The API always reports the
  // literal IP number here, even when the spec referenced an address
  // resource.
  string ip_address = 1;

  // Self-link URI of the forwarding rule.
  // Format: https://www.googleapis.com/compute/v1/projects/{project}/global/forwardingRules/{name}
  string self_link = 2;

  // Name of the forwarding rule as it exists in GCP.
  string forwarding_rule_name = 3;

  // Server-assigned numeric ID of the forwarding rule.
  string forwarding_rule_id = 4;

  // The Private Service Connect connection id, populated only for PSC
  // frontends (load_balancing_scheme NONE).
  string psc_connection_id = 5;

  // The Private Service Connect connection status (PENDING, ACCEPTED,
  // REJECTED, or CLOSED), populated only for PSC frontends. ACCEPTED means
  // the producer side admitted this consumer connection.
  string psc_connection_status = 6;
}
