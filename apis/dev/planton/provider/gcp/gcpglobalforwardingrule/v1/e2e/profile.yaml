apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpglobalforwardingrule
spec:
  # The deepest composed scenario in the GCP harness: the registry chain
  # installs health check -> backend service -> URL map -> managed
  # certificate -> target HTTPS proxy, plus a reserved global address; the
  # rule then binds the VIP on port 443. Verify asserts the VIP and target
  # wiring via compute globalForwardingRules.get; destroy tears the whole
  # chain down in reverse, on both provisioners.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
