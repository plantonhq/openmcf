apiVersion: gcp.planton.dev/v1
kind: GcpGlobalForwardingRule
metadata:
  name: http-redirect-frontend
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Port-80 VIP bouncing clients to HTTPS, sharing the same static IP
  target:
    value: "<target-http-proxy-self-link>" # replace: the GcpTargetHttpProxy serving the redirect URL map
  ipAddress:
    value: "<reserved-static-ip>" # replace: the SAME GcpGlobalAddress as the 443 rule
  portRange: "80"
  loadBalancingScheme: EXTERNAL_MANAGED
  labels:
    env: production
