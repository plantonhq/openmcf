syntax = "proto3";

package dev.planton.provider.gcp.gcpbackendbucket.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpbackendbucket/v1/spec.proto";
import "dev/planton/provider/gcp/gcpbackendbucket/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-backend-bucket
message GcpBackendBucket {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpBackendBucket'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpBackendBucketSpec spec = 4 [(buf.validate.field).required = true];
  GcpBackendBucketStatus status = 5;
}

message GcpBackendBucketStatus {
  GcpBackendBucketStackOutputs outputs = 1;
}
