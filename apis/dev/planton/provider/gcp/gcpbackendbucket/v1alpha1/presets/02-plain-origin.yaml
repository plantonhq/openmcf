apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBackendBucket
metadata:
  name: my-download-origin
spec:
  projectId:
    value: "<gcp-project-id>"
  bucketName:
    value: "<gcs-bucket-name>"  # or reference a GcpGcsBucket resource
  description: Serves downloads directly from the bucket, no edge caching
  # CDN off: every request is proxied to the bucket — right for content
  # that changes in place or must never be stale.
  enableCdn: false
  compressionMode: AUTOMATIC
