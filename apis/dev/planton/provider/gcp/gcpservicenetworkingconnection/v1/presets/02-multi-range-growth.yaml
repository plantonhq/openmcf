apiVersion: gcp.planton.dev/v1
kind: GcpServiceNetworkingConnection
metadata:
  name: my-vpc-psa-multi
spec:
  network:
    valueFrom:
      kind: GcpVpc
      name: prod-vpc
      fieldPath: status.outputs.network_self_link

  # Multiple reserved ranges: the original allocation plus an expansion
  # range added when the producer ran out of space. Appending here is an
  # in-place update — GCP keeps every service subnet it already carved from
  # the earlier ranges.
  reservedPeeringRanges:
    - valueFrom:
        kind: GcpGlobalAddress
        name: prod-vpc-psa-range
        fieldPath: status.outputs.name
    - valueFrom:
        kind: GcpGlobalAddress
        name: prod-vpc-psa-range-expansion
        fieldPath: status.outputs.name
