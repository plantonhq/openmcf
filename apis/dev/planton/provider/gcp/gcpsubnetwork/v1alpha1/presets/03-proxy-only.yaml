apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: my-proxy-only-subnet
spec:
  projectId:
    value: "<gcp-project-id>"
  vpcSelfLink:
    value: "<vpc-network-self-link>"
  subnetworkName: proxy-only-us-central1
  region: us-central1  # one proxy-only subnet per region that hosts regional ALBs
  # Address space reserved for the region's Envoy proxy fleet — GCP requires
  # this subnet to exist before any regional Application Load Balancer can
  # be created in the VPC. /23 is Google's recommended minimum.
  ipCidrRange: 10.129.0.0/23
  purpose: REGIONAL_MANAGED_PROXY
  # ACTIVE: proxies allocate from this subnet now. Create a BACKUP twin to
  # stage a drain-and-swap onto fresh address space later.
  role: ACTIVE
  description: Proxy-only subnet for regional Envoy-based load balancers
