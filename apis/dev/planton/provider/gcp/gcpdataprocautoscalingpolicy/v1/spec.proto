syntax = "proto3";

package dev.planton.provider.gcp.gcpdataprocautoscalingpolicy.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";

// GcpDataprocAutoscalingPolicyWorkerConfig bounds the primary worker
// group under autoscaling.
//
// Primary workers are on-demand VMs that carry HDFS DataNodes, so the
// autoscaler treats them as the stable base of the cluster: weight
// steers what fraction of new capacity lands here versus the secondary
// (spot) group.
message GcpDataprocAutoscalingPolicyWorkerConfig {
  // Maximum number of primary workers the autoscaler may create.
  int32 max_instances = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1
  ];

  // Minimum number of primary workers. The Dataproc API requires at
  // least 2 primary workers on an autoscaled cluster; 0 leaves the
  // API's default (2).
  int32 min_instances = 2 [(buf.validate.field).cel = {
    id: "min_instances_zero_or_gte_two"
    expression: "this == 0 || this >= 2"
    message: "min_instances must be at least 2 (or 0 to accept the API default of 2)"
  }];

  // Relative weight of this group when the autoscaler distributes new
  // capacity between primary and secondary workers. Default: 1.
  // Example: primary weight 1 + secondary weight 3 sends ~75% of new
  // nodes to the secondary (spot) group.
  int32 weight = 3 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "max_gte_min_instances"
    expression: "this.min_instances == 0 || this.max_instances >= this.min_instances"
    message: "max_instances must be greater than or equal to min_instances"
  };
}

// GcpDataprocAutoscalingPolicySecondaryWorkerConfig bounds the
// secondary (preemptible/spot) worker group under autoscaling.
//
// Secondary workers carry no HDFS data, so the autoscaler can add and
// remove them aggressively — the cost-optimized burst arm of an
// autoscaled cluster. All bounds default to 0 (no secondary scaling).
message GcpDataprocAutoscalingPolicySecondaryWorkerConfig {
  // Maximum number of secondary workers the autoscaler may create.
  // Default: 0 (secondary group not scaled).
  int32 max_instances = 1 [(buf.validate.field).int32.gte = 0];

  // Minimum number of secondary workers. Default: 0 — the group can
  // scale to zero when idle.
  int32 min_instances = 2 [(buf.validate.field).int32.gte = 0];

  // Relative weight of this group when the autoscaler distributes new
  // capacity between primary and secondary workers. Default: 1.
  int32 weight = 3 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "max_gte_min_instances"
    expression: "this.min_instances == 0 || this.max_instances >= this.min_instances"
    message: "max_instances must be greater than or equal to min_instances when min_instances is set"
  };
}

// GcpDataprocAutoscalingPolicyYarnConfig tunes how the autoscaler reacts
// to YARN memory pressure — the algorithm's control knobs.
//
// The scale factors express what fraction of pending/available YARN
// memory the autoscaler acts on per evaluation: 1.0 is maximally
// aggressive (add/remove everything the metric suggests), small values
// smooth scaling at the cost of reaction speed.
message GcpDataprocAutoscalingPolicyYarnConfig {
  // How long the autoscaler waits for a graceful YARN decommission
  // before forcefully removing a worker during scale-down. Running
  // tasks get this window to finish. Bounds: 0s to 1 day.
  // Format: duration in seconds with "s" suffix (e.g., "3600s").
  string graceful_decommission_timeout = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]+s$"
  ];

  // Fraction of pending YARN memory the autoscaler adds capacity for
  // per evaluation (0.0-1.0). 1.0 scales up as fast as possible; 0.05
  // adds ~5% of the suggested capacity per cooldown period.
  // Declared optional (explicit presence) so 0.0 — a legitimate API
  // value — is expressible while the field itself stays required.
  optional double scale_up_factor = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).double = {
      gte: 0.0
      lte: 1.0
    }
  ];

  // Fraction of available (idle) YARN memory the autoscaler removes
  // capacity for per evaluation (0.0-1.0). 1.0 scales down as fast as
  // possible; 0.0 disables scale-down entirely (ever-growing cluster —
  // pair with idle_delete_ttl on the cluster for cost control).
  // Declared optional (explicit presence) so 0.0 — a legitimate API
  // value — is expressible while the field itself stays required.
  optional double scale_down_factor = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).double = {
      gte: 0.0
      lte: 1.0
    }
  ];

  // Minimum fractional change to the cluster size the autoscaler acts
  // on when scaling up (0.0-1.0). Example: 0.05 means a recommendation
  // must grow the cluster by at least 5% to trigger; 0.0 (default)
  // means any recommendation of at least one worker triggers.
  double scale_up_min_worker_fraction = 4 [(buf.validate.field).double = {
    gte: 0.0
    lte: 1.0
  }];

  // Minimum fractional change to the cluster size the autoscaler acts
  // on when scaling down (0.0-1.0). Default: 0.0.
  double scale_down_min_worker_fraction = 5 [(buf.validate.field).double = {
    gte: 0.0
    lte: 1.0
  }];
}

// GcpDataprocAutoscalingPolicyBasicAlgorithm wraps the YARN-based
// autoscaling algorithm and its evaluation cadence.
message GcpDataprocAutoscalingPolicyBasicAlgorithm {
  // How long the autoscaler waits between evaluations, letting the
  // cluster settle after a scaling event. Bounds: 2 minutes to 1 day.
  // Format: duration in seconds with "s" suffix. Default: "120s".
  string cooldown_period = 1 [(buf.validate.field).cel = {
    id: "cooldown_period_format"
    expression: "this == '' || this.matches('^[0-9]+s$')"
    message: "cooldown_period must be a duration in seconds (e.g., '120s')"
  }];

  // YARN memory-based scaling behavior.
  GcpDataprocAutoscalingPolicyYarnConfig yarn_config = 2 [(buf.validate.field).required = true];
}

// GcpDataprocAutoscalingPolicySpec defines a reusable Dataproc
// autoscaling policy.
//
// An autoscaling policy is a first-class, shareable resource: one
// policy can govern many clusters (each cluster attaches it by
// reference), so a platform team tunes scaling behavior in one place.
// Policy contents are mutable — updating the policy re-tunes every
// attached cluster — but a policy cannot be deleted while any cluster
// references it.
//
// The autoscaler evaluates YARN memory metrics every cooldown period
// and resizes the cluster's primary and secondary worker groups within
// the configured bounds.
message GcpDataprocAutoscalingPolicySpec {
  // GCP project where the policy will be created.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The policy ID (the GCP resource name). 3-50 characters: letters,
  // numbers, underscores, and hyphens; must start and end with a letter
  // or number. Immutable after creation.
  string policy_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9]([a-zA-Z0-9_-]{1,48}[a-zA-Z0-9])?$",
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 50
  ];

  // GCP region the policy lives in (e.g., "us-central1"). A cluster can
  // only attach policies in its own region. Immutable after creation.
  string location = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // Autoscaling bounds and weight for the primary worker group.
  GcpDataprocAutoscalingPolicyWorkerConfig worker_config = 4 [(buf.validate.field).required = true];

  // Autoscaling bounds and weight for the secondary (preemptible/spot)
  // worker group. Omit to keep the secondary group unscaled.
  GcpDataprocAutoscalingPolicySecondaryWorkerConfig secondary_worker_config = 5;

  // The autoscaling algorithm: evaluation cadence + YARN scaling
  // behavior.
  GcpDataprocAutoscalingPolicyBasicAlgorithm basic_algorithm = 6 [(buf.validate.field).required = true];
}
