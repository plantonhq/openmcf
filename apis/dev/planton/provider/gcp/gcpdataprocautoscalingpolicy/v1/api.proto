syntax = "proto3";

package dev.planton.provider.gcp.gcpdataprocautoscalingpolicy.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpdataprocautoscalingpolicy/v1/spec.proto";
import "dev/planton/provider/gcp/gcpdataprocautoscalingpolicy/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-dataproc-autoscaling-policy
message GcpDataprocAutoscalingPolicy {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpDataprocAutoscalingPolicy'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpDataprocAutoscalingPolicySpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpDataprocAutoscalingPolicyStatus status = 5;
}

//gcp-dataproc-autoscaling-policy status
message GcpDataprocAutoscalingPolicyStatus {
  //stack-outputs
  GcpDataprocAutoscalingPolicyStackOutputs outputs = 1;
}
