<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Autoscaling policy: worker bars scaling within bounds under a governing dial -->
  <rect x="4" y="4" width="40" height="40" rx="8" fill="#E8F0FE"/>
  <!-- bounds envelope -->
  <path d="M10 14h28" stroke="#669DF6" stroke-width="1.5" stroke-dasharray="3 2" stroke-linecap="round"/>
  <path d="M10 36h28" stroke="#669DF6" stroke-width="1.5" stroke-dasharray="3 2" stroke-linecap="round"/>
  <!-- worker bars stepping up -->
  <rect x="12" y="28" width="5" height="8" rx="1" fill="#4285F4"/>
  <rect x="19" y="24" width="5" height="12" rx="1" fill="#4285F4"/>
  <rect x="26" y="20" width="5" height="16" rx="1" fill="#4285F4"/>
  <rect x="33" y="17" width="5" height="19" rx="1" fill="#1A73E8"/>
  <!-- scaling arrow -->
  <path d="M13 25 L34 12" stroke="#1A73E8" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 11.5 L34.5 11.5 L34.5 16" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
