apiVersion: gcp.planton.dev/v1alpha1
kind: GcpUrlMap
metadata:
  name: apex-redirect
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Redirect apex domain traffic to www with HTTPS upgrade
  defaultUrlRedirect:
    hostRedirect: www.example.com
    httpsRedirect: true
    redirectResponseCode: MOVED_PERMANENTLY_DEFAULT
    stripQuery: false
