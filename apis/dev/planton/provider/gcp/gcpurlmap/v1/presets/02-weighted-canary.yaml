apiVersion: gcp.planton.dev/v1
kind: GcpUrlMap
metadata:
  name: weighted-canary
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Split traffic 90/10 between stable and canary backends
  defaultRouteAction:
    weightedBackendServices:
      - backendService:
          value: "<stable-backend-self-link>" # replace: current production backend
        weight: 900
      - backendService:
          value: "<canary-backend-self-link>" # replace: new version under test
        weight: 100
  hostRules:
    - hosts:
        - www.example.com
      pathMatcher: canary
  pathMatchers:
    - name: canary
      defaultRouteAction:
        weightedBackendServices:
          - backendService:
              value: "<stable-backend-self-link>"
            weight: 900
          - backendService:
              value: "<canary-backend-self-link>"
            weight: 100
