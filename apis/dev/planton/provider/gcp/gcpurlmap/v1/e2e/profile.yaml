apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpurlmap
spec:
  # Composed scenario: the harness deploys GcpBackendService (and its
  # GcpHealthCheck prerequisite) via the kind registry, resolves the URL
  # map's default_service reference from the backend service outputs, then
  # runs deploy -> compute urlMaps.get verify -> destroy -> verify 404, on
  # both provisioners.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
