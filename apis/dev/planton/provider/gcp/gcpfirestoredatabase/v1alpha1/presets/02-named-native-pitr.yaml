apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFirestoreDatabase
metadata:
  name: orders-firestore
spec:
  # A named production database with point-in-time recovery and GCP's
  # own delete guard.
  databaseName: orders
  locationId: us-east1
  type: FIRESTORE_NATIVE

  # PITR extends version retention from 1 hour to 7 days — reads and
  # restores can target any 1-minute snapshot in the window.
  pointInTimeRecoveryEnablement: POINT_IN_TIME_RECOVERY_ENABLED

  # Deletion by ANY client fails while enabled.
  deleteProtectionState: DELETE_PROTECTION_ENABLED

  # Keep the database independent of any App Engine app lifecycle.
  appEngineIntegrationMode: DISABLED
