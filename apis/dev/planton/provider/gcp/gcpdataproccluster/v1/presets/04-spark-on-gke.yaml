apiVersion: gcp.planton.dev/v1
kind: GcpDataprocCluster
metadata:
  name: spark-on-gke
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  region: us-central1
  clusterName: spark-on-gke

  # NOTE: the Dataproc API does not support user labels on virtual
  # (GKE-based) clusters — leave spec.labels empty for this arm.

  virtualClusterConfig:
    stagingBucket:
      valueFrom:
        kind: GcpGcsBucket
        name: dataproc-staging
        fieldPath: status.outputs.bucket_id

    kubernetesClusterConfig:
      # Namespace Dataproc deploys Spark pods into; omit to let Dataproc
      # derive one from the cluster name.
      kubernetesNamespace:
        value: dataproc-spark

      gkeClusterConfig:
        # The GKE cluster that hosts the Spark workloads.
        gkeClusterTarget:
          valueFrom:
            kind: GcpGkeCluster
            name: platform-gke
            fieldPath: status.outputs.cluster_id

        # Schedule all Dataproc roles onto one named node pool.
        nodePoolTarget:
          - nodePool:
              valueFrom:
                kind: GcpGkeNodePool
                name: dataproc-pool
                fieldPath: status.outputs.node_pool_id
            roles:
              - DEFAULT

      # SPARK is the required component; pin a version compatible with
      # the target GKE version.
      kubernetesSoftwareConfig:
        componentVersion:
          SPARK: "3.5-dataproc-17"
        properties:
          "spark:spark.eventLog.enabled": "true"
