apiVersion: gcp.planton.dev/v1
kind: GcpDataprocCluster
metadata:
  name: batch-spark
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  region: us-central1
  clusterName: batch-spark

  # Give running tasks 10 minutes to finish when the autoscaler removes
  # a worker.
  gracefulDecommissionTimeout: "600s"

  labels:
    environment: production
    workload: batch-etl

  clusterConfig:
    masterConfig:
      numInstances: 1
      machineType: n2-standard-4
      diskConfig:
        bootDiskSizeGb: 100

    # Small stable base of on-demand workers.
    workerConfig:
      numInstances: 2
      machineType: n2-standard-4
      diskConfig:
        bootDiskSizeGb: 200

    # The burst arm: Spot secondaries with machine-type flexibility so
    # the cluster stays schedulable when one type's spot pool dries up.
    secondaryWorkerConfig:
      numInstances: 10
      preemptibility: SPOT
      diskConfig:
        bootDiskSizeGb: 100
      instanceFlexibilityPolicy:
        instanceSelectionList:
          - machineTypes:
              - n2-standard-4
              - n2d-standard-4
            rank: 0
          - machineTypes:
              - e2-standard-4
            rank: 1
        # Keep 2 secondaries on-demand as a preemption-proof base; the
        # rest ride spot pricing.
        provisioningModelMix:
          standardCapacityBase: 2
          standardCapacityPercentAboveBase: 0

    softwareConfig:
      imageVersion: "2.2-debian12"
      properties:
        "spark:spark.dynamicAllocation.enabled": "true"
        "spark:spark.shuffle.service.enabled": "true"

    # Hand scaling decisions to a shared autoscaling policy — the policy
    # resizes the worker groups within its bounds; attaching, swapping,
    # or detaching it updates in place.
    autoscalingPolicyUri:
      valueFrom:
        kind: GcpDataprocAutoscalingPolicy
        name: batch-autoscaling
        fieldPath: status.outputs.name

    # Auto-delete ~15 minutes after the last job finishes.
    lifecycleConfig:
      idleDeleteTtl: "900s"
