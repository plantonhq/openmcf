apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFilestoreInstance
metadata:
  name: perf-nfs
spec:
  projectId:
    value: acme-ml-project # replace with your GCP project id
  location: us-west1-a # replace — a zone (ZONAL is a single-zone tier)
  tier: ZONAL
  description: High-throughput NFS with IOPS that scales with capacity
  kmsKeyName:
    # CMEK-at-rest for compliance; reference your GcpKmsKey resource.
    valueFrom:
      kind: GcpKmsKey
      name: storage-cmek
  fileShare:
    name: fast_vol
    capacityGb: 2048 # 2 TiB; grow it and provisioned IOPS grows with it
  networkConfig:
    network:
      value: ml-vpc # replace with your VPC network name
  performanceConfig:
    # IOPS rides capacity: 2 TiB x 4000 = 8000 IOPS today, and growing
    # the share raises IOPS automatically — no second knob to remember.
    iopsPerTb:
      maxIopsPerTb: 4000
  labels:
    team: ml-platform # replace with your cost-attribution labels
    workload: training
