apiVersion: gcp.planton.dev/v1
kind: GcpVertexAiIndexEndpoint
metadata:
  name: private-search
spec:
  location: us-central1
  displayName: Private Search
  # VPC-peered querying: the endpoint is reachable only inside this
  # network. The network must already have Private Services Access
  # configured (a GcpServiceNetworkingConnection). The reference resolves
  # to the network self-link; the modules normalize it to the relative
  # form the Vertex AI API expects.
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: ml-vpc
      fieldPath: status.outputs.network_self_link
  labels:
    team: ml-platform
