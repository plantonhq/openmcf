syntax = "proto3";

package dev.planton.provider.gcp.gcpvertexaiindexendpoint.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpvertexaiindexendpoint/v1alpha1/spec.proto";
import "dev/planton/provider/gcp/gcpvertexaiindexendpoint/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-vertex-ai-index-endpoint
message GcpVertexAiIndexEndpoint {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpVertexAiIndexEndpoint'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpVertexAiIndexEndpointSpec spec = 4 [(buf.validate.field).required = true];
  GcpVertexAiIndexEndpointStatus status = 5;
}

message GcpVertexAiIndexEndpointStatus {
  GcpVertexAiIndexEndpointStackOutputs outputs = 1;
}
