apiVersion: gcp.planton.dev/v1
kind: GcpRouterNat
metadata:
  name: my-private-nat
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  routerName: ncc-router
  natName: spoke-nat
  region: us-central1
  vpcSelfLink:
    valueFrom:
      kind: GcpVpc
      name: my-spoke-vpc # replace with your GcpVpc resource name
      fieldPath: status.outputs.network_self_link
  # PRIVATE: NAT between VPC networks attached as Network Connectivity
  # Center spokes — overlapping subnets on two spokes can still talk because
  # traffic is translated to this dedicated range. No external IPs involved.
  type: PRIVATE
  sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
  subnetworks:
    - subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: my-workload-subnet # replace with your GcpSubnetwork resource name
          fieldPath: status.outputs.subnetwork_self_link
  # The rule routes hub-bound traffic through a subnetwork purposed for
  # PRIVATE_NAT (its primary range provides the translated addresses).
  rules:
    - ruleNumber: 100
      match: nexthop.hub == "//networkconnectivity.googleapis.com/projects/my-gcp-project-123/locations/global/hubs/my-hub" # replace project + hub
      description: translate spoke traffic toward the NCC hub
      action:
        sourceNatActiveRanges:
          - valueFrom:
              kind: GcpSubnetwork
              name: my-private-nat-range # replace with your PRIVATE_NAT-purpose GcpSubnetwork
              fieldPath: status.outputs.subnetwork_self_link
  logFilter: ERRORS_ONLY
