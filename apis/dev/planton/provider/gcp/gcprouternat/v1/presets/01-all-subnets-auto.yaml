apiVersion: gcp.planton.dev/v1
kind: GcpRouterNat
metadata:
  name: my-router-nat
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  routerName: egress-router
  natName: egress-nat
  region: us-central1
  vpcSelfLink:
    valueFrom:
      kind: GcpVpc
      name: my-app-vpc # replace with your GcpVpc resource name
      fieldPath: status.outputs.network_self_link
  # No natIps: GCP auto-allocates and scales the external IP pool.
  # No subnetworks: every subnetwork in the region gets NAT, all ranges.
  logFilter: ERRORS_ONLY # detects port exhaustion and connection failures
