apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcprouternat
spec:
  # Composed scenarios: the registry installs the VPC -> subnetwork ->
  # address chain before every NAT create. Routers and NATs themselves
  # deploy in seconds; the chain dominates the runtime.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
