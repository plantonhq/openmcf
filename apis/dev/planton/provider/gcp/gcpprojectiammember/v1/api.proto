syntax = "proto3";

package dev.planton.provider.gcp.gcpprojectiammember.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpprojectiammember/v1/spec.proto";
import "dev/planton/provider/gcp/gcpprojectiammember/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-project-iam-member
message GcpProjectIamMember {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpProjectIamMember'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpProjectIamMemberSpec spec = 4 [(buf.validate.field).required = true];
  GcpProjectIamMemberStatus status = 5;
}

message GcpProjectIamMemberStatus {
  GcpProjectIamMemberStackOutputs outputs = 1;
}
