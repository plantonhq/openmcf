apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: my-custom-role-grant
spec:
  projectId:
    value: "<gcp-project-id>"
  role:
    # Reference the custom role node; its `name` output is the fully-qualified
    # projects/<project>/roles/<roleId> string a grant expects.
    valueFrom:
      kind: GcpIamCustomRole
      name: <custom-role-resource-name>
      fieldPath: status.outputs.name
  member:
    valueFrom:
      kind: GcpServiceAccount
      name: <service-account-resource-name>
      fieldPath: status.outputs.member
