apiVersion: gcp.planton.dev/v1
kind: GcpProjectIamMember
metadata:
  name: my-app-logs-writer-grant
spec:
  projectId:
    value: "<gcp-project-id>"
  role:
    value: roles/logging.logWriter  # any predefined role
  member:
    # Reference a GcpServiceAccount so the graph shows who holds the grant;
    # its `member` output is the ready-made serviceAccount:<email> string.
    valueFrom:
      kind: GcpServiceAccount
      name: <service-account-resource-name>
      fieldPath: status.outputs.member
