apiVersion: gcp.planton.dev/v1
kind: GcpBigQueryTable
metadata:
  name: my-lake-events
spec:
  # project_id omitted: falls back to the provider's default project.
  datasetId:
    valueFrom:
      kind: GcpBigQueryDataset
      name: my-lake-dataset # replace
      fieldPath: status.outputs.dataset_id
  tableId: lake_events # replace
  description: External table over parquet files in the data lake
  # The data stays in GCS; BigQuery reads it at query time. Add a
  # connectionId to upgrade this to a BigLake table with fine-grained
  # security and metadata caching.
  externalDataConfiguration:
    autodetect: true
    sourceFormat: PARQUET
    sourceUris:
      - gs://my-data-lake/events/*.parquet # replace with your bucket path
    hivePartitioningOptions:
      mode: AUTO
      sourceUriPrefix: gs://my-data-lake/events # replace
    parquetOptions:
      enableListInference: true
  # External tables hold no data of their own — the guard adds no safety.
  deletionProtection: false
