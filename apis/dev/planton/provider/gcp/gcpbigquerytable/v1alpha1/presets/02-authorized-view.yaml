apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigQueryTable
metadata:
  name: my-revenue-view
spec:
  # project_id omitted: falls back to the provider's default project.
  datasetId:
    valueFrom:
      kind: GcpBigQueryDataset
      name: my-reporting-dataset # replace; typically a separate, reader-facing dataset
      fieldPath: status.outputs.dataset_id
  tableId: revenue_summary # replace
  description: Filtered revenue slice exposed to analysts
  # A logical view is defined entirely by its query — no schema, no
  # partitioning. Grant it access to the source dataset by listing it as an
  # authorized view in that dataset's access entries; its own readers then
  # never need a role on the raw data.
  view:
    query: |- # replace with your query
      SELECT customer_id, DATE(event_time) AS dt, SUM(amount) AS revenue
      FROM `my-gcp-project.analytics_prod.events_raw`
      GROUP BY customer_id, dt
  # Views cannot be deleted-protected data holders; keep the guard off so
  # routing/definition changes stay frictionless.
  deletionProtection: false
