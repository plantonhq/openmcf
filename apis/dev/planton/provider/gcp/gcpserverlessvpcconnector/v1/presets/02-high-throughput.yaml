apiVersion: gcp.planton.dev/v1
kind: GcpServerlessVpcConnector
metadata:
  name: svc-egress-prod
spec:
  region: us-central1
  network:
    value: prod-vpc # or reference a GcpVpcNetwork resource
  ipCidrRange: 10.8.0.16/28 # any unused /28 in the network
  machineType: e2-standard-4
  minInstances: 3
  maxInstances: 10
