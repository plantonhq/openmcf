# Consumer-scoped GcpSubnetwork install profile for the connector's
# subnet-placement chain. A Serverless VPC Access subnet must be EXACTLY /28
# and dedicated to the connector — no other workloads — which is why the
# generic subnetwork prerequisite (a /20) cannot be reused here.
apiVersion: gcp.planton.dev/v1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpsnw-vpcconn-prereq
  id: planton-oss-e2e-gcpsnw-vpcconn-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: planton-oss-e2e-vpcconn-subnet-${E2E_RUN_ID}
  region: us-central1
  ipCidrRange: 10.8.1.0/28
  description: Ephemeral /28 for the GcpServerlessVpcConnector subnet-placement E2E chain; safe to delete
