apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBackendService
metadata:
  name: my-iap-protected-tool
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Internal admin tool exposed publicly but gated by Identity-Aware Proxy
  protocol: HTTP
  loadBalancingScheme: EXTERNAL
  portName: http
  healthCheck:
    valueFrom:
      kind: GcpHealthCheck
      name: tool-hc  # replace with your GcpHealthCheck resource name
      fieldPath: status.outputs.self_link
  backends:
    - group:
        value: https://www.googleapis.com/compute/v1/projects/my-project/zones/us-central1-a/instanceGroups/tool-ig  # replace with your instance group
      balancingMode: UTILIZATION
      maxUtilization: 0.7
  # Every request must carry a valid Google identity; unauthenticated
  # requests get a login redirect. The Google-managed OAuth client is used
  # when no custom client is configured — the right default.
  iap:
    enabled: true
  # Sticky sessions keep a user's workflow on one instance.
  sessionAffinity: GENERATED_COOKIE
  affinityCookieTtlSec: 3600
  # Full request logging — access to internal tools is worth auditing.
  logConfig:
    enable: true
    sampleRate: 1.0
