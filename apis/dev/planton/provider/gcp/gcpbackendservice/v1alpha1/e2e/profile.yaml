apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpbackendservice
spec:
  # Composed scenario: the harness deploys a GcpHealthCheck prerequisite,
  # resolves the backend service's health-check reference from its outputs,
  # then runs deploy -> compute backendServices.get verify (incl. the
  # health-check wiring) -> destroy -> verify 404, on both provisioners.
  #
  # Coverage note: the live scenario runs WITHOUT a backends[] entry (valid —
  # probe first, attach capacity later) because no instance-group/NEG kind
  # exists yet to compose against; the backends path is proven offline via
  # the hack manifest through both engines and gains live coverage when the
  # serverless NEG kind lands. IAP is offline-only: exercising it live needs
  # an OAuth client, an org-level artifact the test project does not own.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
