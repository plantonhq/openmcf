syntax = "proto3";

package dev.planton.provider.gcp.gcpbackendservice.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpbackendservice/v1alpha1/spec.proto";
import "dev/planton/provider/gcp/gcpbackendservice/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-backend-service
message GcpBackendService {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpBackendService'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpBackendServiceSpec spec = 4 [(buf.validate.field).required = true];
  GcpBackendServiceStatus status = 5;
}

message GcpBackendServiceStatus {
  GcpBackendServiceStackOutputs outputs = 1;
}
