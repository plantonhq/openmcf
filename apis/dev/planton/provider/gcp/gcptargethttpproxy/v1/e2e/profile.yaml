apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcptargethttpproxy
spec:
  # Composed scenario: the harness installs the GcpUrlMap prerequisite (and
  # its backend-service + health-check chain) via the kind registry, resolves
  # the proxy's url_map reference from the URL map outputs, then runs
  # deploy -> compute targetHttpProxies.get verify (incl. url-map wiring) ->
  # destroy -> verify 404, on both provisioners.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
