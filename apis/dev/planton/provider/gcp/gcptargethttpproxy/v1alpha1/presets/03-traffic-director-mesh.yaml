apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpProxy
metadata:
  name: traffic-director-mesh
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Traffic Director mesh frontend bound to the mesh's private VIPs
  urlMap:
    value: "<mesh-url-map-self-link>" # replace: the Traffic Director routing table
  proxyBind: true
