apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCertManagerCert
metadata:
  name: my-uploaded-cert
spec:
  projectId:
    value: "<gcp-project-id>"
  selfManaged:
    # The chain: leaf certificate first, then intermediates. Certificate
    # material is public; only the private key is secret.
    pemCertificate: |
      -----BEGIN CERTIFICATE-----
      <leaf-certificate-pem>
      -----END CERTIFICATE-----
    # Secret material — masked in outputs, never logged. Rotate by
    # updating both fields in place.
    pemPrivateKey: |
      -----BEGIN PRIVATE KEY-----
      <private-key-pem>
      -----END PRIVATE KEY-----
