apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudtasksqueue
spec:
  # Fast control-plane object. Queue names carry ${E2E_RUN_ID} because a
  # deleted queue's ID is reserved by the Cloud Tasks API for up to 7 days
  # (the soft-delete-reserved identifier class). The http-target-oidc
  # scenario composes the GcpServiceAccount prerequisite live (OIDC token
  # FK resolution proof).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
