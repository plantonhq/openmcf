apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudTasksQueue
metadata:
  name: background-jobs
spec:
  # Omitted projectId: the queue lands in the provider's default project.
  # Set projectId (literal or a GcpProject reference) to target another.
  #
  # Queue names are permanent choices: a deleted queue's ID is reserved by
  # the API for up to 7 days.
  queueName: background-jobs
  location: us-central1
  # No rateLimits/retryConfig: GCP applies sensible managed defaults
  # (add them when a downstream service needs protection — see the
  # rate-limited-processing preset).
