apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCertManagerDnsAuthorization
metadata:
  name: my-shared-authorization
spec:
  projectId:
    value: "<gcp-project-id>"
  # Realistic sample domain (pattern-validated field) — replace with your
  # own bare domain.
  domain: example.com
  # PER_PROJECT_RECORD: the validation record is scoped to
  # (domain, project), so multiple Certificate Manager resources across
  # projects can share the same record in the zone.
  type: PER_PROJECT_RECORD
