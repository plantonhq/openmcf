syntax = "proto3";

package dev.planton.provider.gcp.gcpcertmanagerdnsauthorization.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpcertmanagerdnsauthorization/v1/spec.proto";
import "dev/planton/provider/gcp/gcpcertmanagerdnsauthorization/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-cert-manager-dns-authorization
message GcpCertManagerDnsAuthorization {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpCertManagerDnsAuthorization'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpCertManagerDnsAuthorizationSpec spec = 4 [(buf.validate.field).required = true];
  GcpCertManagerDnsAuthorizationStatus status = 5;
}

message GcpCertManagerDnsAuthorizationStatus {
  GcpCertManagerDnsAuthorizationStackOutputs outputs = 1;
}
