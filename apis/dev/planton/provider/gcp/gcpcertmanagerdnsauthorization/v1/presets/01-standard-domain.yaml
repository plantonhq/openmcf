apiVersion: gcp.planton.dev/v1
kind: GcpCertManagerDnsAuthorization
metadata:
  name: my-dns-authorization
spec:
  projectId:
    value: "<gcp-project-id>"
  # Realistic sample domain (pattern-validated field) — replace with your
  # own bare domain. The authorization also covers *.example.com.
  domain: example.com
