apiVersion: gcp.planton.dev/v1
kind: GcpProject
metadata:
  name: my-production-project
spec:
  # Realistic sample values for pattern-validated fields (projectId,
  # parentId, billingAccountId) — replace with your own.
  projectId: acme-prod-workloads
  parentType: folder
  parentId: "123456789012"
  billingAccountId: 0123AB-4567CD-89EFGH
  labels:
    environment: production
    managed-by: planton
  # PREVENT: destroy fails while set — protection for foundation projects.
  deletionPolicy: PREVENT
  enabledApis:
    - compute.googleapis.com
    - container.googleapis.com
    - dns.googleapis.com
    - iam.googleapis.com
    - logging.googleapis.com
    - monitoring.googleapis.com
    - cloudresourcemanager.googleapis.com
    - servicenetworking.googleapis.com
