syntax = "proto3";

package dev.planton.provider.gcp.gcpcloudsqluser.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";
import "dev/planton/shared/options/options.proto";

// GcpCloudSqlUserSpec defines a database user (`google_sql_user`) on a Cloud
// SQL instance.
//
// Users are first-class nodes: create one per application/service with its
// own credential instead of sharing the instance's admin user. Two auth
// families exist:
//   - BUILT_IN — classic username + password, enforced by the instance's
//     password validation policy.
//   - IAM types (CLOUD_IAM_USER / CLOUD_IAM_SERVICE_ACCOUNT /
//     CLOUD_IAM_GROUP) — passwordless database authentication through IAM.
//     On PostgreSQL, the instance must first set the database flag
//     "cloudsql.iam_authentication" = "on".
message GcpCloudSqlUserSpec {
  option (buf.validate.message).cel = {
    id: "iam_user_must_not_set_password"
    message: "IAM-authenticated users (CLOUD_IAM_USER, CLOUD_IAM_SERVICE_ACCOUNT, CLOUD_IAM_GROUP) must not set a password — authentication goes through IAM"
    expression: "!(this.type in ['CLOUD_IAM_USER', 'CLOUD_IAM_SERVICE_ACCOUNT', 'CLOUD_IAM_GROUP']) || this.password == ''"
  };

  option (buf.validate.message).cel = {
    id: "password_policy_requires_built_in"
    message: "password_policy applies to BUILT_IN users only"
    expression: "!has(this.password_policy) || this.type == '' || this.type == 'BUILT_IN'"
  };

  // The GCP project that owns the Cloud SQL instance.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The Cloud SQL instance this user lives on. Accepts the instance name or
  // a reference to a GcpCloudSql resource. Immutable — a user cannot move
  // between instances.
  dev.planton.shared.foreignkey.v1.StringValueOrRef instance = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpCloudSql,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.instance_name"
  ];

  // The user name. Immutable. For BUILT_IN users this is the login name;
  // for IAM types it is the IAM principal — the full email for
  // CLOUD_IAM_USER/CLOUD_IAM_SERVICE_ACCOUNT (on MySQL, GCP stores it
  // truncated before the "@"), or the group email for CLOUD_IAM_GROUP.
  // Example: "orders-app", "ci-runner@my-project.iam.gserviceaccount.com"
  string user_name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];

  // Login password for a BUILT_IN user. Mutable — updating it rotates the
  // credential in place. Subject to the instance's password validation
  // policy. Never set for IAM-authenticated types.
  string password = 4 [
    (dev.planton.shared.options.sensitive) = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {min_len: 1}
  ];

  // Authentication type. BUILT_IN (default) uses username + password; the
  // CLOUD_IAM_* types authenticate through IAM without a stored password.
  // Immutable.
  optional string type = 5 [
    (dev.planton.shared.options.default) = "BUILT_IN",
    (buf.validate.field).cel = {
      id: "type_valid"
      message: "type must be BUILT_IN, CLOUD_IAM_USER, CLOUD_IAM_SERVICE_ACCOUNT, or CLOUD_IAM_GROUP"
      expression: "this in ['BUILT_IN', 'CLOUD_IAM_USER', 'CLOUD_IAM_SERVICE_ACCOUNT', 'CLOUD_IAM_GROUP']"
    }
  ];

  // MySQL only: the host the user may connect from (classic MySQL
  // user@host semantics, e.g. "%" for any host or "10.0.0.0/8"). Leave
  // empty for PostgreSQL and SQL Server. Immutable.
  string host = 6;

  // Per-user password policy (BUILT_IN users only), layered on top of the
  // instance-level password validation policy.
  GcpCloudSqlUserPasswordPolicy password_policy = 7;
}

// GcpCloudSqlUserPasswordPolicy is a per-user login hardening policy.
message GcpCloudSqlUserPasswordPolicy {
  // Number of failed login attempts after which the user is locked
  // (requires enable_failed_attempts_check).
  optional int32 allowed_failed_attempts = 1 [(buf.validate.field).int32.gte = 1];

  // Password lifetime as a seconds duration string, e.g. "2592000s" (30
  // days). After expiry the user must change the password to log in.
  string password_expiration_duration = 2 [
    (dev.planton.shared.options.sensitive_exempt_reason) = "an expiry duration, not credential material",
    (buf.validate.field).cel = {
      id: "expiration_duration_format"
      message: "password_expiration_duration must be a seconds duration string such as 2592000s"
      expression: "this == '' || this.matches('^[0-9]+s$')"
    }
  ];

  // Whether failed login attempts are counted toward
  // allowed_failed_attempts.
  bool enable_failed_attempts_check = 3;

  // MySQL only: require the current password when changing the password.
  bool enable_password_verification = 4;
}
