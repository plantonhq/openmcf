syntax = "proto3";

package dev.planton.provider.gcp.gcpcloudsqluser.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpcloudsqluser/v1alpha1/spec.proto";
import "dev/planton/provider/gcp/gcpcloudsqluser/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-cloud-sql-user
message GcpCloudSqlUser {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudSqlUser'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudSqlUserSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudSqlUserStatus status = 5;
}

//gcp-cloud-sql-user status
message GcpCloudSqlUserStatus {
  //stack-outputs
  GcpCloudSqlUserStackOutputs outputs = 1;
}
