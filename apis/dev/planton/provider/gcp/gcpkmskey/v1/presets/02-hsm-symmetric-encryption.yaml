apiVersion: gcp.planton.dev/v1
kind: GcpKmsKey
metadata:
  name: hsm-cmek-key
spec:
  keyRingId:
    valueFrom:
      kind: GcpKmsKeyRing
      name: compliance-keys
      fieldPath: status.outputs.key_ring_id
  keyName: hsm-cmek-key # replace — permanent, never reusable within the ring
  rotationPeriod: "7776000s" # 90 days
  versionTemplate:
    algorithm: GOOGLE_SYMMETRIC_ENCRYPTION
    # HSM protection is immutable: compliance posture is fixed at
    # creation, never silently downgraded later.
    protectionLevel: HSM
