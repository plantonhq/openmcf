syntax = "proto3";

package dev.planton.provider.gcp.gcpaddress.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";
import "dev/planton/shared/options/options.proto";

// GcpAddressSpec defines a regional Compute Engine address reservation
// (`google_compute_address`) — a static IP at regional scope, distinct from
// GcpGlobalAddress which reserves global-scope addresses.
//
// Two primary use cases:
//
// 1. External static IP — reserve a public IPv4 or IPv6 address in a region
//    for Cloud NAT, regional load balancers, or VM instances.
//
// 2. Internal regional IP — reserve a private address or CIDR range within a
//    VPC network or subnetwork for GCE endpoints, internal load balancer
//    VIPs, VPC peering ranges, IPsec interconnect, or DNS resolver endpoints.
//
// All fields except labels are ForceNew in the underlying GCP API — any change
// to the configuration destroys and recreates the address.
message GcpAddressSpec {
  option (buf.validate.message).cel = {
    id: "internal_cannot_have_network_tier"
    message: "network_tier cannot be set when address_type is INTERNAL"
    expression: "this.address_type != 'INTERNAL' || this.network_tier == ''"
  };

  option (buf.validate.message).cel = {
    id: "purpose_requires_internal"
    message: "purpose can only be set when address_type is INTERNAL"
    expression: "this.purpose == '' || this.address_type == 'INTERNAL'"
  };

  option (buf.validate.message).cel = {
    id: "peering_purpose_requires_network"
    message: "network is required when purpose is VPC_PEERING or IPSEC_INTERCONNECT"
    expression: "!(this.purpose in ['VPC_PEERING', 'IPSEC_INTERCONNECT']) || (has(this.network) && (has(this.network.value) || has(this.network.value_from)))"
  };

  option (buf.validate.message).cel = {
    id: "endpoint_purpose_requires_subnetwork"
    message: "subnetwork is required when purpose is GCE_ENDPOINT or DNS_RESOLVER"
    expression: "!(this.purpose in ['GCE_ENDPOINT', 'DNS_RESOLVER']) || (has(this.subnetwork) && (has(this.subnetwork.value) || has(this.subnetwork.value_from)))"
  };

  option (buf.validate.message).cel = {
    id: "shared_lb_vip_requires_internal"
    message: "SHARED_LOADBALANCER_VIP purpose requires address_type INTERNAL"
    expression: "this.purpose != 'SHARED_LOADBALANCER_VIP' || this.address_type == 'INTERNAL'"
  };

  // The GCP project in which to create this regional address reservation.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  // Example: "my-prod-project-123"
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Name of the regional address resource in GCP.
  // Must be 1-63 characters, lowercase letters, numbers, or hyphens.
  // Must start with a lowercase letter and end with a letter or number.
  // Example: "nat-external-ip", "ilb-vip"
  string address_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$"
  ];

  // The GCP region in which to reserve this address (e.g. "us-central1").
  // Immutable: a regional address cannot move between regions.
  string region = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_region"
      message: "region must be a valid GCP region name such as us-central1"
      expression: "this.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
    }
  ];

  // The static IP address to reserve. If omitted, GCP assigns an address
  // automatically. For INTERNAL VPC_PEERING addresses this is the start of
  // the reserved CIDR range.
  string address = 4;

  // The type of address to reserve.
  // EXTERNAL reserves a public IP address (default). INTERNAL reserves a
  // private IP within a VPC network or subnetwork.
  optional string address_type = 5 [
    (dev.planton.shared.options.default) = "EXTERNAL",
    (buf.validate.field).cel = {
      id: "address_type_valid"
      message: "address_type must be EXTERNAL or INTERNAL"
      expression: "this in ['EXTERNAL', 'INTERNAL']"
    }
  ];

  // Human-readable description of this address reservation.
  // Example: "Static IP for Cloud NAT in us-central1"
  string description = 6;

  // The IP version for this address. Defaults to IPV4.
  optional string ip_version = 7 [
    (dev.planton.shared.options.default) = "IPV4",
    (buf.validate.field).cel = {
      id: "ip_version_valid"
      message: "ip_version must be IPV4 or IPV6"
      expression: "this in ['IPV4', 'IPV6']"
    }
  ];

  // The VPC network for internal address reservations with VPC_PEERING or
  // IPSEC_INTERCONNECT purpose. Accepts a network name or full self-link URL.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 8 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];

  // The subnetwork for internal address reservations with GCE_ENDPOINT or
  // DNS_RESOLVER purpose. Accepts a subnetwork name or full self-link URL.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnetwork = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpSubnetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnetwork_self_link"
  ];

  // The network tier for EXTERNAL addresses only. PREMIUM (default) or
  // STANDARD. Must not be set for INTERNAL addresses — internal traffic
  // always uses Premium tier.
  string network_tier = 10 [(buf.validate.field).cel = {
    id: "network_tier_valid"
    message: "network_tier must be empty, PREMIUM, or STANDARD"
    expression: "this == '' || this in ['PREMIUM', 'STANDARD']"
  }];

  // The prefix length of the IP range to reserve (8-29).
  // Used for INTERNAL VPC_PEERING or IPSEC_INTERCONNECT ranges.
  optional int32 prefix_length = 11 [(buf.validate.field).int32 = {
    gte: 8
    lte: 29
  }];

  // The purpose of this INTERNAL address reservation.
  // GCE_ENDPOINT — VM instances, alias IP ranges, or similar endpoints.
  // SHARED_LOADBALANCER_VIP — internal load balancer VIP shared across
  // backends.
  // VPC_PEERING — reserves a CIDR range for VPC network peering.
  // IPSEC_INTERCONNECT — reserves a range for HA VPN over Cloud Interconnect.
  // DNS_RESOLVER — DNS resolver endpoint address.
  // Leave empty for standard EXTERNAL address reservations.
  // PRIVATE_SERVICE_CONNECT is global-only — use GcpGlobalAddress instead.
  string purpose = 12 [(buf.validate.field).cel = {
    id: "purpose_valid"
    message: "purpose must be empty, GCE_ENDPOINT, SHARED_LOADBALANCER_VIP, VPC_PEERING, IPSEC_INTERCONNECT, or DNS_RESOLVER"
    expression: "this in ['', 'GCE_ENDPOINT', 'SHARED_LOADBALANCER_VIP', 'VPC_PEERING', 'IPSEC_INTERCONNECT', 'DNS_RESOLVER']"
  }];

  // The endpoint type for external IPv6 addresses: VM or NETLB.
  // Determines whether the reserved IPv6 address can be used by a VM
  // instance or a network load balancer after reservation.
  string ipv6_endpoint_type = 13 [(buf.validate.field).cel = {
    id: "ipv6_endpoint_type_valid"
    message: "ipv6_endpoint_type must be empty, VM, or NETLB"
    expression: "this == '' || this in ['VM', 'NETLB']"
  }];
}
