<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Location pin: a pinned, durable IP address -->
  <path d="M 8 1 C 5.2 1 3 3.2 3 6 C 3 9.8 8 15 8 15 C 8 15 13 9.8 13 6 C 13 3.2 10.8 1 8 1 Z" fill="#4285F4"/>
  <path d="M 8 1 C 5.2 1 3 3.2 3 6 C 3 9.8 8 15 8 15 C 8 15 13 9.8 13 6 C 13 3.2 10.8 1 8 1 Z" stroke="#1967D2" stroke-width="0.5" fill="#4285F4"/>

  <!-- The reserved value: a stable dot inside the pin -->
  <circle cx="8" cy="6" r="2.4" fill="#FFFFFF"/>
  <circle cx="8" cy="6" r="1.2" fill="#34A853"/>

  <!-- Regional scope arc: the reservation serves one region -->
  <path d="M 4.5 13.6 A 5.5 1.6 0 0 0 11.5 13.6" stroke="#FBBC04" stroke-width="0.9" fill="none" stroke-linecap="round"/>
</svg>
