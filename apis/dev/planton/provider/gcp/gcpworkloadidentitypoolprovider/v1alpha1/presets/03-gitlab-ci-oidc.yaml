apiVersion: gcp.planton.dev/v1alpha1
kind: GcpWorkloadIdentityPoolProvider
metadata:
  name: gitlab-ci-oidc
spec:
  workloadIdentityPoolId:
    valueFrom:
      kind: GcpWorkloadIdentityPool
      name: ci-federation-pool # replace with your pool resource's name
      fieldPath: status.outputs.workload_identity_pool_id
  workloadIdentityPoolProviderId: gitlab-oidc # replace: 4-32 chars; lowercase letters, digits, hyphens
  displayName: GitLab CI OIDC
  description: Trusts GitLab-minted ID tokens for the group's pipelines
  attributeMapping:
    google.subject: assertion.sub
    attribute.project_path: assertion.project_path
    attribute.ref: assertion.ref
  # gitlab.com signs tokens for every project on the instance — scope trust
  # to your group. Self-managed GitLab: also change issuerUri below.
  attributeCondition: assertion.namespace_path == "<gitlab-group>"
  oidc:
    issuerUri: https://gitlab.com
