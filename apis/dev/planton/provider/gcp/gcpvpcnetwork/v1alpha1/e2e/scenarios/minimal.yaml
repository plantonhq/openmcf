# GcpVpcNetwork leaf scenario — the network kind never had a scenario (only a
# prerequisite profile). Exercises provider-floor depth fields on a
# custom-mode regional VPC.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcNetwork
metadata:
  name: planton-oss-e2e-gcpvpcnetwork-smoke
  id: planton-oss-e2e-gcpvpcnetwork-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpvpcnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  networkName: planton-oss-e2e-vpc-${E2E_RUN_ID}
  autoCreateSubnetworks: false
  description: Ephemeral VPC for the networking-depth E2E smoke; safe to delete
  mtu: 1460
