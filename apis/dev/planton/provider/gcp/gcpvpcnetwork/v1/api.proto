syntax = "proto3";

package dev.planton.provider.gcp.gcpvpcnetwork.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/gcp/gcpvpcnetwork/v1/spec.proto";
import "dev/planton/provider/gcp/gcpvpcnetwork/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//gcp-vpc-network
message GcpVpcNetwork {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpVpcNetwork'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpVpcNetworkSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpVpcNetworkStatus status = 5;
}

//gcp-vpc-network status
message GcpVpcNetworkStatus {
  //stack-outputs
  //  stack outputs
  GcpVpcNetworkStackOutputs outputs = 1;
}
