# GcpAlloydbInstance scenario: a single-node read pool on the prerequisite
# cluster. instanceId carries ${E2E_RUN_ID} because deleted names are reserved.
apiVersion: gcp.planton.dev/v1
kind: GcpAlloydbInstance
metadata:
  name: planton-oss-e2e-gcpadbins-minimal
  id: planton-oss-e2e-gcpadbins-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpalloydbinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  cluster:
    valueFrom:
      kind: GcpAlloydbCluster
      name: planton-oss-e2e-gcpadb-prereq
      fieldPath: status.outputs.cluster_id
  instanceId: rp-${E2E_RUN_ID}
  cpuCount: 2
  readPoolConfig:
    nodeCount: 1
  availabilityType: ZONAL
