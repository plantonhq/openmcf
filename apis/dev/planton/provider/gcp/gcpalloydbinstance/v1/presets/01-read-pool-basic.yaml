apiVersion: gcp.planton.dev/v1
kind: GcpAlloydbInstance
metadata:
  name: my-orders-read-pool
spec:
  projectId:
    value: my-gcp-project-123 # replace with your project ID
  cluster:
    valueFrom:
      kind: GcpAlloydbCluster
      name: my-orders-cluster # replace with your cluster's resource name
      fieldPath: status.outputs.cluster_id
  instanceId: orders-read-pool
  cpuCount: 2
  readPoolConfig:
    nodeCount: 1
  availabilityType: ZONAL
