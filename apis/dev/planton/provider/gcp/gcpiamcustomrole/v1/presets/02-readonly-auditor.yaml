apiVersion: gcp.planton.dev/v1
kind: GcpIamCustomRole
metadata:
  name: my-auditor-role
spec:
  projectId:
    value: "<gcp-project-id>"
  roleId: projectAuditor
  title: Project Auditor
  description: Read-only visibility into resource configuration and IAM policy for audits and dashboards
  permissions:
    - resourcemanager.projects.get
    - resourcemanager.projects.getIamPolicy
    - iam.roles.get
    - iam.roles.list
    - iam.serviceAccounts.get
    - iam.serviceAccounts.list
    - storage.buckets.get
    - storage.buckets.getIamPolicy
    - storage.buckets.list
  stage: GA
