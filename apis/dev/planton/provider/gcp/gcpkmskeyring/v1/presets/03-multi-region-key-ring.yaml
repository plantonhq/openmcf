apiVersion: gcp.planton.dev/v1
kind: GcpKmsKeyRing
metadata:
  name: us-compliance-keys
spec:
  keyRingName: us-compliance-keys # replace with your ring name
  # Multi-region ("us", "europe", "asia") pairs with multi-region data
  # services — e.g. multi-region BigQuery datasets and Spanner instances
  # require their CMEK keys in the matching multi-region.
  location: us
