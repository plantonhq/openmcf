apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsmemorydbacl
spec:
  # A MemoryDB ACL under live E2E: the composed lane deploys a user fixture
  # (via the e2e-prerequisites annotation) and proves the membership-by-
  # reference seam live. ACL create/update settle in minutes (the provider
  # waits up to 5). Verification is DescribeACLs keyed on the ACL name,
  # state-aware (deleting counts as absent).
  tier: 1
  status: deferred
  deferred_reason: >-
    Deferred by owner decision. Artifacts complete and re-runnable; dual-engine
    create/delete cycles were exercised against the live account but a clean
    observed completion is still pending.
  timeout_minutes: 20
