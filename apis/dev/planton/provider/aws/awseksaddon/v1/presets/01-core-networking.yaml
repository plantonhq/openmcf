apiVersion: aws.planton.dev/v1
kind: AwsEksAddon
metadata:
  name: <addon-resource-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  # One of the core networking add-ons every cluster runs:
  # vpc-cni, coredns, or kube-proxy.
  addonName: vpc-cni
  # Clusters bootstrap self-managed copies of the core add-ons by
  # default; OVERWRITE adopts them into managed lifecycle instead of
  # failing with a conflict.
  resolveConflictsOnCreate: OVERWRITE
  # Restore managed values if someone kubectl-edits the add-on later.
  resolveConflictsOnUpdate: OVERWRITE
