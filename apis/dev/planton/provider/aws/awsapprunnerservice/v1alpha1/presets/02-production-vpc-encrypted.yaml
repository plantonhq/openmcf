apiVersion: aws.planton.dev/v1alpha1
kind: AwsAppRunnerService
metadata:
  org: example-org
  env: prod
  name: my-production-api
  id: my-production-api-id
spec:
  region: <aws-region>
  # Private ECR image -- requires an access role for pulling
  imageSource:
    imageIdentifier: "<account-id>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag>"
    imageRepositoryType: "ECR"
    accessRoleArn:
      valueFrom:
        kind: AwsIamRole
        name: <ecr-access-role>
        fieldPath: status.outputs.role_arn

  port: "<application-port>"
  # 2 vCPU / 4 GB -- sized for production API workloads
  cpu: "2048"
  memory: "4096"

  # Instance role for runtime AWS API access (S3, DynamoDB, Secrets Manager, etc.)
  instanceRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <instance-role>
      fieldPath: status.outputs.role_arn

  # Secrets injected from Secrets Manager or SSM Parameter Store; the
  # instance role must be allowed to read them
  environmentSecrets:
    DB_PASSWORD: "<secrets-manager-arn-or-ssm-parameter-arn>"

  # VPC egress through a shared first-class connector -- reach databases,
  # caches, and internal APIs; one connector serves many services
  vpcConnectorArn:
    valueFrom:
      kind: AwsAppRunnerVpcConnector
      name: <vpc-connector>
      fieldPath: status.outputs.vpc_connector_arn

  # Shared scaling posture -- 2+ warm instances eliminate cold starts
  autoScalingConfigurationArn:
    valueFrom:
      kind: AwsAppRunnerAutoScalingConfiguration
      name: <auto-scaling-configuration>
      fieldPath: status.outputs.configuration_arn

  # X-Ray request tracing -- the reference itself enables it
  observabilityConfigurationArn:
    valueFrom:
      kind: AwsAppRunnerObservabilityConfiguration
      name: <observability-configuration>
      fieldPath: status.outputs.configuration_arn

  # Customer-managed KMS encryption (ForceNew -- changing this replaces the service)
  kmsKeyArn:
    valueFrom:
      kind: AwsKmsKey
      name: <kms-key>
      fieldPath: status.outputs.key_arn

  # WAF inspection in front of every request
  webAclArn:
    valueFrom:
      kind: AwsWafWebAcl
      name: <web-acl>
      fieldPath: status.outputs.web_acl_arn

  # HTTP health check for application-level readiness validation
  healthCheck:
    protocol: "HTTP"
    path: "<health-check-path>"
    interval: 5
    timeout: 3

  # New image pushed to the tracked tag deploys automatically (private ECR only)
  autoDeploymentsEnabled: true
