apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awskinesisstream
spec:
  # A Kinesis stream under live E2E: the harness runs deploy ->
  # DescribeStreamSummary verify -> destroy -> verify-destroyed on both
  # provisioners. The stream is a true leaf (no prerequisites) and the
  # full-surface scenario runs ON_DEMAND with zero records, so a lane
  # completes in minutes at negligible cost while exercising this
  # session's new depth live: extended retention, AWS-managed-key KMS
  # encryption, the 10 MiB large-record surface, shard-level enhanced
  # monitoring, warm throughput, and the folded resource policy (its own
  # provider resource) carrying a literal ${...} condition value that
  # proves the tfvars template-introducer escaping. Deliberately not in
  # the live scenario: PROVISIONED mode with an explicit shard_count (it
  # conflicts with the warm-throughput arm under test) and a
  # customer-managed KMS key -- both proven by CEL spec tests and the
  # offline gate.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
