apiVersion: aws.planton.dev/v1
kind: AwsWafRegexPatternSet
metadata:
  org: example-org
  env: prod
  name: scanner-probes
  id: scanner-probes-id
spec:
  region: <aws-region>
  scope: REGIONAL
  regularExpressions:
    - ^/wp-admin/.*
    - ^/\.env$
    - ^/phpmyadmin/.*
  description: Common scanner probe paths, SecOps maintained
