apiVersion: aws.planton.dev/v1
kind: AwsWafRegexPatternSet
metadata:
  org: example-org
  env: prod
  name: internal-admin-paths
  id: internal-admin-paths-id
spec:
  region: <aws-region>
  scope: REGIONAL
  regularExpressions:
    - ^/internal/admin/.*
    - ^/debug/status
  description: Internal admin and debug endpoints
