apiVersion: aws.planton.dev/v1
kind: AwsElasticFileSystem
metadata:
  org: example-org
  env: dev
  name: test-efs
  id: test-efs-id
spec:
  region: us-east-1
  encrypted: true
  throughputMode: elastic
  mountTargets:
    - subnetId:
        value: subnet-abc123
    - subnetId:
        value: subnet-def456
  securityGroupIds:
    - value: sg-abc123
  backupEnabled: true
  transitionToIa: AFTER_30_DAYS
  transitionToArchive: AFTER_90_DAYS
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: DenyUnencryptedTransport
        Effect: Deny
        Principal:
          AWS: "*"
        Action: "*"
        Resource: "*"
        Condition:
          Bool:
            aws:SecureTransport: "false"
