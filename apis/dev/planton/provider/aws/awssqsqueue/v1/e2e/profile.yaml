apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awssqsqueue
spec:
  # An SQS queue under E2E: the harness runs deploy -> GetQueueAttributes
  # verify -> destroy -> verify-destroyed on both provisioners. The scenario
  # is a FIFO queue with content-based deduplication, per-message-group
  # deduplication scope, high-throughput FIFO settings, and SSE-SQS
  # encryption -- the fullest honest FIFO surface. Deliberately not in the
  # live scenario: a dead-letter queue (the harness forbids same-kind
  # e2e-prerequisites, and a FIFO DLQ must itself be FIFO), customer-managed
  # KMS keys, redrive-allow byQueue lists, and resource policies -- all
  # proven by CEL spec tests and the offline gate; SQS-as-DLQ wiring is
  # exercised live by the AwsEventBridgeBus lane.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
