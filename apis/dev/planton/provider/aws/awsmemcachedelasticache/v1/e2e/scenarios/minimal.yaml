# Minimal single-node Memcached cluster: cheapest footprint for live E2E.
# Subnet pair prerequisite satisfies the subnet group requirement. Engine
# version is unpinned so the scenario rides AWS's current default.
# Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1
kind: AwsMemcachedElasticache
metadata:
  name: planton-oss-e2e-mc-smoke
  id: planton-oss-e2e-mc-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsmemcachedelasticache
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  nodeType: cache.t4g.micro
  numCacheNodes: 1
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
