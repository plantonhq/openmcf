apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerDomain
metadata:
  name: basic-jupyter-domain
spec:
  region: us-west-2
  authMode: IAM
  # Development domains should not leave their EFS home file system behind on
  # teardown (AWS's default is Retain, which keeps billing).
  homeEfsRetentionPolicy: Delete
  vpcId:
    value: "<vpc-id>"
  subnetIds:
    - value: "<private-subnet-id-az1>"
    - value: "<private-subnet-id-az2>"
  defaultUserSettings:
    executionRoleArn:
      value: "<sagemaker-execution-role-arn>"
