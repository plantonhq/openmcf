apiVersion: aws.planton.dev/v1
kind: AwsLambda
metadata:
  name: my-zip-lambda
spec:
  region: <aws-region>
  role_arn:
    valueFrom:
      kind: AwsIamRole
      name: <execution-role-name>
      fieldPath: status.outputs.role_arn
  runtime: nodejs22.x
  handler: index.handler
  memory_size_mb: 256
  timeout_seconds: 30
  s3:
    bucket:
      value: <deployment-bucket>
    key: <deployment-package-key>
