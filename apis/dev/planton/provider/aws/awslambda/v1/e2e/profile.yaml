apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awslambda
spec:
  # A Lambda function under E2E: the harness deploys the AwsIamRole registry
  # prerequisite, composes the versioned S3 bucket and zip-staging object-set
  # fixtures via the scenario's e2e-prerequisites annotation, then runs
  # deploy -> GetFunction verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario is a minimal zip-backed Node.js function --
  # no VPC attachment, aliases, or function URL -- so the lane stays fast.
  # Deliberately not in the live scenario: container images, provisioned
  # concurrency, weighted alias routing, and resource policies -- all proven
  # by CEL spec tests and the offline gate.
  #
  # deferred: both engines are validated offline only -- tofu init +
  # validate, spec/CEL tests, outputs conformance, and Pulumi module
  # compile -- with no live provision lane yet (plan/preview lanes also
  # not run: no usable AWS credentials were reachable). The prerequisite
  # chain, scenario, and verifier are live-ready; flip to green after the
  # first full deploy -> verify -> destroy run on both provisioners.
  tier: 1
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
  deferred_reason: >-
    Live lane deferred until AWS credentials are restored. Offline gate green
    (tofu init + validate, spec/CEL tests, outputs conformance, Pulumi module
    compile); prerequisite chain, scenario, and verifier live-ready.
