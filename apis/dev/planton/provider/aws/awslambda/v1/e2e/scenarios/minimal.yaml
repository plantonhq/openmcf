# Minimal AwsLambda scenario: a zip-backed Node.js function whose code is
# staged by the S3 object-set fixture into the versioned bucket fixture,
# composed onto the shared Lambda execution-role fixture. Full metadata is
# supplied for tagging/orphan cleanup.
#
# The e2e-prerequisites annotation composes the object-set fixture, which
# pulls in its bucket through its own registry prerequisite (AwsS3Bucket);
# the execution role is a registry prerequisite (AwsIamRole).
apiVersion: aws.planton.dev/v1
kind: AwsLambda
metadata:
  name: planton-oss-e2e-lambda-smoke
  id: planton-oss-e2e-lambda-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awslambda
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsS3ObjectSet"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E minimal zip-backed Lambda function
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-lambda-execution-role
      fieldPath: status.outputs.role_arn
  s3:
    bucket:
      valueFrom:
        kind: AwsS3Bucket
        name: planton-oss-e2e-awss3bucket-prereq
        fieldPath: status.outputs.bucket_id
    key: e2e/lambda.zip
  runtime: nodejs22.x
  handler: index.handler
  memorySizeMb: 128
  timeoutSeconds: 3
