apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awskinesisstreamconsumer
spec:
  # An enhanced fan-out consumer under live E2E: the harness installs the
  # AwsKinesisStream registry prerequisite (the shared ON_DEMAND stream
  # fixture), then runs deploy -> DescribeStreamConsumer verify -> destroy
  # -> verify-destroyed on both provisioners. The scenario registers one
  # consumer against the fixture stream and applies the folded resource
  # policy live (a same-account SubscribeToShard/DescribeStreamConsumer
  # grant whose condition value carries a literal ${...} sequence). The
  # consumer registers in seconds and holds no data, so the lane cost is
  # the stream fixture alone.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
