apiVersion: aws.planton.dev/v1
kind: AwsRoute53Zone
metadata:
  # metadata.name IS the zone's domain name (create-time immutable).
  name: <internal-domain-name>
spec:
  region: <aws-region>
  isPrivate: true  # resolves only inside the associated VPCs (split-horizon DNS)
  vpcAssociations:
    - vpcId:
        value: <vpc-id>
      # vpcRegion defaults to the zone's region; set it only for VPCs in
      # other regions.
