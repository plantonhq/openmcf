apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchAlarm
metadata:
  name: promql-cpu-saturation
spec:
  region: <aws-region>
  evaluationCriteria:
    promqlCriteria:
      # The query addresses an Amazon Managed Service for Prometheus workspace
      # and expresses the alarm condition itself — no comparison operator,
      # threshold, or evaluation periods apply in this mode.
      query: 'avg(rate(node_cpu_seconds_total{mode!="idle"}[5m])) > 0.8'
      pendingPeriod: 300  # fire only after 5 continuous minutes of breach (Prometheus "for:")
      recoveryPeriod: 120  # require 2 clean minutes before returning to OK (dampens flapping)
  evaluationInterval: 60  # run the query every minute
  alarmDescription: "Prometheus-reported CPU saturation above 80% for 5 minutes"
  alarmActions:
    - value: arn:aws:sns:us-east-1:123456789012:ops-alerts
