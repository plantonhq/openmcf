apiVersion: aws.planton.dev/v1
kind: AwsVpcEndpoint
metadata:
  name: <endpoint-resource-name>
spec:
  region: <aws-region>
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: <vpc-resource-name>
      fieldPath: status.outputs.vpc_id
  endpointType: Interface
  # The AWS service to reach privately. Common choices: sts, ecr.api,
  # ecr.dkr, logs, secretsmanager, ssm, kms, monitoring.
  serviceName: com.amazonaws.us-west-2.sts
  # One ENI per subnet -- spread across AZs for availability (each AZ
  # is billed separately).
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  # A dedicated endpoint security group allowing 443 from the VPC CIDR
  # -- without this AWS attaches the VPC's default group, which is
  # usually wrong for production.
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: <endpoint-sg-resource-name>
        fieldPath: status.outputs.security_group_id
  # Resolve the service's public DNS name to the endpoint inside the
  # VPC -- clients keep their default SDK endpoints, zero code changes.
  # Requires DNS support + hostnames enabled on the VPC.
  privateDnsEnabled: true
