apiVersion: aws.planton.dev/v1
kind: AwsLbTargetGroup
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: <vpc-resource-name>
      fieldPath: status.outputs.vpc_id
  targetType: ip
  port: 5432
  protocol: TCP
  preserveClientIp: true
  connectionTermination: true
  deregistrationDelaySeconds: 120
  healthCheck:
    protocol: HTTP
    port: "8081"
    path: /readyz
    intervalSeconds: 15
    timeoutSeconds: 5
    healthyThreshold: 3
    unhealthyThreshold: 3
