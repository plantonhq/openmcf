apiVersion: aws.planton.dev/v1alpha1
kind: AwsLbTargetGroup
metadata:
  name: <function-name>
spec:
  region: <aws-region>
  targetType: lambda
  lambdaMultiValueHeadersEnabled: true
  targets:
    - targetId:
        valueFrom:
          kind: AwsLambda
          name: <lambda-resource-name>
          fieldPath: status.outputs.function_arn
