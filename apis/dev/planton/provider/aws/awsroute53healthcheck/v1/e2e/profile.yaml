apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsroute53healthcheck
spec:
  # A Route 53 health check under live E2E: the harness runs deploy ->
  # GetHealthCheck verify -> destroy -> verify-destroyed on both
  # provisioners. The check is a true leaf (no prerequisites), creates in
  # seconds, and the scenario ships DISABLED so the global checker fleet
  # never probes the placeholder endpoint — the resource surface (type,
  # probe tuning, checker regions, state shaping) is fully exercised with
  # zero external traffic. Deliberately not in the live scenario:
  # CALCULATED aggregation (child checks compose by ID — the ref wiring is
  # a plain string pass-through), CLOUDWATCH_METRIC (needs an alarm
  # fixture), and RECOVERY_CONTROL (needs the Application Recovery
  # Controller control plane, a separate service surface). All proven by
  # CEL spec tests and the offline gate.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
