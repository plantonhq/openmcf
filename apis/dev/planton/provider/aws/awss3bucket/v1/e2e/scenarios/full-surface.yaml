# Full-surface AwsS3Bucket scenario: versioning, KMS encryption with a bucket
# key (the AWS-managed aws/s3 key, so no KMS prerequisite is needed), a
# TLS-only bucket policy (private-safe -- no public grant, so the default
# all-on public-access block accepts it), a lifecycle rule whose filter
# carries TWO predicates (prefix + size bound) to exercise the `and`
# document shaping, noncurrent-version pruning, website hosting with a
# routing rule (populates the website_endpoint/website_domain outputs),
# EventBridge notifications (the one notification arm needing no delivery
# permission on a target -- SQS/SNS/Lambda arms require the target's policy
# to grant S3 first, so they are proven by spec tests and documented), and
# an Intelligent-Tiering archive configuration.
#
# Deliberately not composed here: replication (needs a second versioned
# bucket + an IAM role with replicate permissions -- a cross-region cost
# with no additional module surface beyond what the offline gate proves)
# and Object Lock (irreversible bucket mode; retention windows outlive the
# lane). forceDestroy lets teardown remove versioned objects cleanly.
apiVersion: aws.planton.dev/v1
kind: AwsS3Bucket
metadata:
  name: planton-oss-e2e-awss3bucket-full
  id: planton-oss-e2e-awss3bucket-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awss3bucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  forceDestroy: true
  versioningStatus: Enabled
  encryption:
    sseAlgorithm: aws:kms
    bucketKeyEnabled: true
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: DenyInsecureTransport
        Effect: Deny
        Principal: "*"
        Action: "s3:*"
        Resource:
          - arn:aws:s3:::planton-oss-e2e-awss3bucket-full
          - arn:aws:s3:::planton-oss-e2e-awss3bucket-full/*
        Condition:
          Bool:
            aws:SecureTransport: "false"
  transitionDefaultMinimumObjectSize: all_storage_classes_128K
  lifecycleRules:
    - id: tier-large-logs
      filter:
        prefix: logs/
        objectSizeGreaterThan: 131072
      transitions:
        - days: 30
          storageClass: STANDARD_IA
        - days: 90
          storageClass: GLACIER
      abortIncompleteMultipartUploadDays: 7
    - id: prune-noncurrent
      noncurrentVersionExpiration:
        noncurrentDays: 30
        newerNoncurrentVersions: 2
  website:
    indexDocumentSuffix: index.html
    errorDocumentKey: error.html
    routingRules:
      - condition:
          keyPrefixEquals: docs/
        redirect:
          replaceKeyPrefixWith: documents/
  notification:
    eventbridge: true
  intelligentTieringConfigurations:
    - name: archive-cold-objects
      filterPrefix: archive/
      tiers:
        - accessTier: ARCHIVE_ACCESS
          days: 90
