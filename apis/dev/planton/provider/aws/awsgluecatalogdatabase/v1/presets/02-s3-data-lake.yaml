apiVersion: aws.planton.dev/v1
kind: AwsGlueCatalogDatabase
metadata:
  name: data_warehouse
spec:
  region: us-west-2
  description: "Production data warehouse — curated datasets from ETL pipelines"
  locationUri: "s3://prod-data-lake/databases/data_warehouse/"
  parameters:
    classification: parquet
  createTableDefaultPermissions:
    - permissions:
        - ALL
      principal: IAM_ALLOWED_PRINCIPALS
