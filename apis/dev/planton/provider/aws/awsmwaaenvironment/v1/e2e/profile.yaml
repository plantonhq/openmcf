apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsmwaaenvironment
spec:
  # An MWAA environment under E2E: the harness deploys the AwsVpc ->
  # AwsSubnet pair -> AwsSecurityGroup registry chain (the environment
  # attaches the MWAA-shaped fixture group, which carries the
  # self-referencing rule the components communicate through), plus the
  # versioned S3 bucket and MWAA execution role composed via the
  # scenario's e2e-prerequisites annotation. Verification is MWAA
  # GetEnvironment keyed on the environment name.
  #
  # deferred: both engines are validated offline only -- tofu
  # init/validate/plan and pulumi preview against the hack manifest --
  # with no live provision lane. MWAA is one of the slowest AWS
  # resources (provider ceilings: create 120 min, delete 90 min;
  # realistic ~20-40 min create + ~15-30 min destroy per engine), and a
  # long-tail kind by first-months adoption likelihood. The scenario,
  # prerequisite chain, and verifier are live-ready; flip to green after
  # the first full deploy -> verify -> destroy run on both provisioners.
  tier: 2
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 150
