apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksNodeGroup
metadata:
  name: <node-group-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  nodeRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <node-role-resource-name>
      fieldPath: status.outputs.role_arn
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  # The launch template owns the launch mechanics: instance type, IMDSv2
  # enforcement, encrypted/provisioned-IOPS volumes, extra tags. AWS
  # forbids the inline knobs (instanceTypes/diskSizeGb/remoteAccess) when
  # a template is used -- configure those in the template.
  launchTemplate:
    launchTemplateId:
      valueFrom:
        kind: AwsLaunchTemplate
        name: <launch-template-resource-name>
        fieldPath: status.outputs.launch_template_id
    # Follow the template's default version: promoting a new template
    # version rolls this pool. Pin a numeric version for drift-free plans.
    version: $Default
  amiType: AL2023_x86_64_STANDARD
  scaling:
    minSize: 2
    maxSize: 6
    desiredSize: 2
  updateConfig:
    maxUnavailablePercentage: 25
    updateStrategy: MINIMAL
