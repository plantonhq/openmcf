apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsfsxopenzfsfilesystem
spec:
  # An FSx for OpenZFS file system under live E2E: one full-surface
  # SINGLE_AZ_2 lane at the 64 GiB / 160 MB/s floor — root volume with ZSTD
  # compression, NFS exports, user/group quotas, user-provisioned disk
  # IOPS, backups with an explicit final-backup decision, and the
  # cascading-delete opt-in. Excluded arms recorded here: MULTI_AZ_1 (two
  # AZs + floating endpoints, the most expensive shape), the HA variants,
  # INTELLIGENT_TIERING (MULTI_AZ_1-only), and backup_id restore (needs a
  # pre-existing backup). Verification is DescribeFileSystems keyed on
  # file_system_id, lifecycle-state-aware (DELETING counts as absent).
  # Expected timings from AWS's documented provisioning: ~10-15 minutes
  # per create, ~5-10 per delete.
  tier: 1
  status: deferred
  deferred_reason: >-
    Deferred by owner decision: FSx file systems are long-provisioning and
    expensive, so the family stops at the offline gate (green tofu plan +
    pulumi preview per engine). Artifacts are complete and the lanes stay
    re-runnable.
  timeout_minutes: 60
