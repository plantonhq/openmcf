apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awseventbridgebus
spec:
  # A custom EventBridge bus under E2E: the scenario composes an SQS queue
  # fixture as the bus-level dead-letter target via the e2e-prerequisites
  # annotation, then runs deploy -> DescribeEventBus verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario enables error-level
  # logging and a bus-level DLQ -- the production posture without
  # customer-managed KMS encryption. Deliberately not in the live scenario:
  # partner event sources, KMS encryption, and resource policies -- all
  # proven by CEL spec tests and the offline gate.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
