syntax = "proto3";

package dev.planton.provider.aws.awsnlb.v1alpha1;

import "dev/planton/provider/aws/awsnlb/v1alpha1/api.proto";
import "dev/planton/provider/aws/provider.proto";

// AwsNlbStackInput provides the inputs to the IaC modules
// (Pulumi or Terraform) that provision the Network Load Balancer.
message AwsNlbStackInput {
  // target cloud-resource
  AwsNlb target = 1;
  // provider-config
  dev.planton.provider.aws.AwsProviderConfig provider_config = 2;
}
