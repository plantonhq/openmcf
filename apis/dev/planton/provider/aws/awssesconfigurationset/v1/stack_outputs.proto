syntax = "proto3";

package dev.planton.provider.aws.awssesconfigurationset.v1;

// AwsSesConfigurationSetStackOutputs captures the observable identifiers
// of the SES configuration set.
message AwsSesConfigurationSetStackOutputs {
  // The Amazon Resource Name (ARN) of the configuration set -- the target
  // for IAM policies that scope who may send under this set.
  string configuration_set_arn = 1;

  // The configuration set's name (derived from metadata.name) -- what
  // email identities reference through their configuration_set field and
  // what SendEmail calls name explicitly.
  string configuration_set_name = 2;
}
