syntax = "proto3";

package dev.planton.provider.aws.awssesconfigurationset.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awssesconfigurationset/v1/spec.proto";
import "dev/planton/provider/aws/awssesconfigurationset/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AwsSesConfigurationSet is the API envelope for an Amazon SES (SESv2)
// configuration set -- the reusable group of sending rules and event
// destinations that email identities and send calls opt into.
message AwsSesConfigurationSet {
  // api-version must be set to "aws.planton.dev/v1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1"];

  // resource-kind for this resource, must be "AwsSesConfigurationSet".
  string kind = 2 [(buf.validate.field).string.const = "AwsSesConfigurationSet"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the configuration set.
  AwsSesConfigurationSetSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsSesConfigurationSetStatus status = 5;
}

// AwsSesConfigurationSetStatus describes the status of an SES
// configuration set.
message AwsSesConfigurationSetStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsSesConfigurationSetStackOutputs outputs = 1;
}
