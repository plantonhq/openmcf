apiVersion: aws.planton.dev/v1
kind: AwsSesConfigurationSet
metadata:
  name: monitored-transactional-set
spec:
  region: <aws-region>
  reputationMetricsEnabled: true
  deliveryOptions:
    tlsPolicy: REQUIRE
  suppressedReasons:
    - BOUNCE
    - COMPLAINT
  eventDestinations:
    - name: bounce-metrics
      matchingEventTypes:
        - SEND
        - BOUNCE
        - COMPLAINT
        - DELIVERY
      cloudWatch:
        dimensions:
          - name: campaign
            valueSource: MESSAGE_TAG
            defaultValue: none
