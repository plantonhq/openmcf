apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchLogGroup
metadata:
  name: my-app-logs
spec:
  region: <aws-region>
  retentionInDays: 30
  metricFilters:
    - name: error-count
      pattern: "ERROR"  # plain-term match; use { $.level = "error" } for JSON logs
      transformation:
        metricName: ErrorCount
        metricNamespace: <app-namespace>  # e.g. MyApp/Errors — keeps log-derived metrics out of AWS/* namespaces
        metricValue: "1"  # count one per matching event
        defaultValue: 0  # report zero in quiet periods so alarms can use standard missing-data handling
