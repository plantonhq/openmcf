# The first mapping-eval suite: the network staples plus the service
# staples, composed entirely from fixtures the E2E lanes already prove.
#
# Members are EXPLICIT and ordered (deploy order is list order); every
# member -- including what the E2E harness would treat as a prerequisite --
# is a first-class evaluation subject, because in a real account a VPC is
# exactly as discoverable as the subnet inside it. References must point
# backward: the routed subnet references the VPC and internet-gateway
# members by the names their install profiles declare.
#
# What this suite exercises, deliberately:
#   - multi-resource grouping (the routed subnet owns a route table and the
#     association joining them);
#   - value_from wiring, including the polymorphic no-default-kind route
#     target (routes[].targetId -> the internet gateway);
#   - name-derived identity (the S3 bucket's metadata.name IS the bucket
#     name -- the zero-typing import recipe);
#   - spec reconstruction across scalar, enum, bool, and document-valued
#     (IAM policy) fields.
apiVersion: qa.planton.dev/v1
kind: MappingEvalSuite
metadata:
  name: network-staples
spec:
  members:
    - component: awsvpc
      manifest_path: apis/dev/planton/provider/aws/awsvpc/v1alpha1/e2e/prerequisite.yaml
    - component: awsinternetgateway
      manifest_path: apis/dev/planton/provider/aws/awsinternetgateway/v1alpha1/e2e/prerequisite.yaml
    - component: awssubnet
      manifest_path: apis/dev/planton/provider/aws/awssubnet/v1alpha1/e2e/scenarios/routed.yaml
    - component: awss3bucket
      manifest_path: apis/dev/planton/provider/aws/awss3bucket/v1alpha1/e2e/scenarios/minimal.yaml
    - component: awssqsqueue
      manifest_path: apis/dev/planton/provider/aws/awssqsqueue/v1alpha1/e2e/scenarios/fifo-full-surface.yaml
    - component: awssnstopic
      manifest_path: apis/dev/planton/provider/aws/awssnstopic/v1alpha1/e2e/scenarios/standard-topic.yaml
  scan_scope:
    region: us-west-2
