syntax = "proto3";

package dev.planton.provider.aws.awssesemailidentity.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awssesemailidentity/v1alpha1/spec.proto";
import "dev/planton/provider/aws/awssesemailidentity/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AwsSesEmailIdentity is the API envelope for an Amazon SES (SESv2) email
// identity -- the verified domain or email address an application sends
// mail from.
message AwsSesEmailIdentity {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsSesEmailIdentity".
  string kind = 2 [(buf.validate.field).string.const = "AwsSesEmailIdentity"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the email identity.
  AwsSesEmailIdentitySpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsSesEmailIdentityStatus status = 5;
}

// AwsSesEmailIdentityStatus describes the status of an SES email identity.
message AwsSesEmailIdentityStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsSesEmailIdentityStackOutputs outputs = 1;
}
