apiVersion: aws.planton.dev/v1
kind: AwsFsxDataRepositoryAssociation
metadata:
  org: example-org
  env: prod
  name: results-export-link
  id: awsfxdra-results-export-link-prod
spec:
  region: <aws-region>
  file_system_id:
    valueFrom:
      kind: AwsFsxLustreFileSystem
      name: ml-training-fsx
      fieldPath: status.outputs.file_system_id
  file_system_path: /output
  data_repository_path: s3://<results-bucket>/output/
  # Write-side link: results land in S3 as jobs write them.
  auto_export_events:
    - NEW
    - CHANGED
