apiVersion: aws.planton.dev/v1
kind: AwsCognitoUserPool
metadata:
  name: ${name}
  org: ${org}
  env: ${env}
  id: ${id}
  labels:
    planton.dev/provisioner: pulumi
    planton.dev/stack: ${env}.AwsCognitoUserPool.${name}
spec:
  region: <aws-region>
  usernameAttributes:
    - email
  passwordPolicy:
    minimumLength: 10
    requireLowercase: true
    requireUppercase: true
    requireNumbers: true
  autoVerifiedAttributes:
    - email
  accountRecoveryMechanisms:
    - name: verified_email
      priority: 1
  domain:
    domain: ${name}-auth
