apiVersion: aws.planton.dev/v1
kind: AwsAlb
metadata:
  name: <alb-name>
spec:
  region: <aws-region>
  internal: true
  subnets:
    - value: <private-subnet-id-az1>
    - value: <private-subnet-id-az2>
  securityGroups:
    - value: <alb-security-group-id>
  deleteProtectionEnabled: true
  dropInvalidHeaderFields: true
  desyncMitigationMode: strictest
  accessLogs:
    bucket:
      value: <access-logs-bucket-name>
    prefix: <log-prefix>
