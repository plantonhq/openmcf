apiVersion: aws.planton.dev/v1
kind: AwsFsxLustreFileSystem
metadata:
  org: example-org
  env: prod
  name: elastic-datalake-fsx
  id: awsfxl-elastic-datalake-fsx-prod
spec:
  region: <aws-region>
  # INTELLIGENT_TIERING: elastic, pay-for-what-you-store capacity — no
  # provisioned storage_capacity_gib. Throughput is provisioned absolutely
  # and reads are served from a provisioned SSD cache.
  deployment_type: PERSISTENT_2
  storage_type: INTELLIGENT_TIERING
  # 4000 MB/s baseline (must be a multiple of 4000).
  throughput_capacity: 4000
  # Let AWS size the read cache from the provisioned throughput.
  data_read_cache_configuration:
    sizing_mode: PROPORTIONAL_TO_THROUGHPUT_CAPACITY
  # Metadata configuration is part of the INTELLIGENT_TIERING contract.
  metadata_configuration:
    mode: AUTOMATIC
  data_compression_type: LZ4
  subnet_id:
    value: "<subnet-id>"
  security_group_ids:
    - value: "<security-group-id>"
  automatic_backup_retention_days: 7
  weekly_maintenance_start_time: "7:03:00"
