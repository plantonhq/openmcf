# Minimal AwsFsxLustreFileSystem scenario: the cheapest creatable shape.
# SCRATCH_2 (the spec default, exercised by omission) at the 1200 GiB SSD
# floor on the shared subnet + security-group fixtures. Defaults exercised
# by omission: deployment_type, storage_type, data_compression_type,
# skip_final_backup, and every backup/maintenance dial. Full metadata is
# supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1
kind: AwsFsxLustreFileSystem
metadata:
  name: planton-oss-e2e-awsfxl-scratch
  id: planton-oss-e2e-awsfxl-scratch
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsfsxlustrefilesystem
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  storageCapacityGib: 1200
  subnetId:
    valueFrom:
      kind: AwsSubnet
      name: planton-oss-e2e-awssubnet-prereq-a
      fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
