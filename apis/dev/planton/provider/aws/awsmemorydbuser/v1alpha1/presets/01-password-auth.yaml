apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbUser
metadata:
  # metadata.name IS the AWS user name -- the AUTH identity ACLs reference.
  name: <user-name>
spec:
  region: <aws-region>
  accessString: "on ~<key-prefix>:* +@read +@write"
  authenticationMode:
    type: password
    # One password for a simple setup; add a second for zero-downtime rotation.
    passwords:
      - <strong-password-16-to-128-chars>
