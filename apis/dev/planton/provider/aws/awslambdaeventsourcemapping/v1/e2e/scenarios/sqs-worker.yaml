# Minimal AwsLambdaEventSourceMapping scenario: one standard SQS queue wired
# to the shared zip-backed Lambda smoke function. Full metadata is supplied
# for tagging/orphan cleanup.
#
# The e2e-prerequisites annotation composes the SQS queue fixture and the
# zip-staging chain the function needs; AwsLambda is a registry prerequisite
# and deploys the function scenario as the install profile fallback.
apiVersion: aws.planton.dev/v1
kind: AwsLambdaEventSourceMapping
metadata:
  name: planton-oss-e2e-lambda-esm-sqs
  id: planton-oss-e2e-lambda-esm-sqs
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awslambdaeventsourcemapping
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsS3Bucket,AwsS3ObjectSet,AwsSqsQueue"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  functionArn:
    valueFrom:
      kind: AwsLambda
      name: planton-oss-e2e-lambda-smoke
      fieldPath: status.outputs.function_arn
  eventSourceArn:
    valueFrom:
      kind: AwsSqsQueue
      name: planton-oss-e2e-awssqsqueue-prereq
      fieldPath: status.outputs.queue_arn
