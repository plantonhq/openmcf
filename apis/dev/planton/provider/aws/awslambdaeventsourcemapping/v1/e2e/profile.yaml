apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awslambdaeventsourcemapping
spec:
  # An event source mapping under E2E: the harness deploys the AwsLambda
  # registry prerequisite (the zip-backed function chain), composes the SQS
  # queue fixture via the scenario's e2e-prerequisites annotation, then runs
  # deploy -> GetEventSourceMapping verify -> destroy -> verify-destroyed on
  # both provisioners. The scenario wires one standard queue into the shared
  # smoke function -- the smallest honest SQS worker surface. Deliberately not
  # in the live scenario: Kinesis, DynamoDB streams, MSK, and self-managed
  # Kafka sources -- all proven by CEL spec tests, presets, and the offline
  # gate.
  #
  # deferred: both engines are validated offline only -- tofu init +
  # validate, spec/CEL tests, outputs conformance, and Pulumi module
  # compile -- with no live provision lane yet (plan/preview lanes also
  # not run: no usable AWS credentials were reachable). The prerequisite
  # chain, scenario, and verifier are live-ready; flip to green after the
  # first full deploy -> verify -> destroy run on both provisioners.
  tier: 1
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
  deferred_reason: >-
    Live lane deferred until AWS credentials are restored. Offline gate green
    (tofu init + validate, spec/CEL tests, outputs conformance, Pulumi module
    compile); prerequisite chain, scenario, and verifier live-ready.
