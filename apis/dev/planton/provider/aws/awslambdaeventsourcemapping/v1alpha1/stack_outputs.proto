syntax = "proto3";

package dev.planton.provider.aws.awslambdaeventsourcemapping.v1alpha1;

// AwsLambdaEventSourceMappingStackOutputs captures the observable
// identifiers of a deployed event source mapping.
message AwsLambdaEventSourceMappingStackOutputs {
  // The server-assigned mapping UUID -- the identity AWS APIs
  // (GetEventSourceMapping, UpdateEventSourceMapping) key on.
  string uuid = 1;

  // The mapping ARN.
  string mapping_arn = 2;

  // The ARN of the function the mapping invokes, as resolved by AWS.
  string function_arn = 3;

  // The mapping state as last observed at deploy time (e.g. "Enabled",
  // "Disabled") -- transitional states settle asynchronously.
  string state = 4;
}
