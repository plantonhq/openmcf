apiVersion: aws.planton.dev/v1alpha1
kind: AwsEfsAccessPoint
metadata:
  org: example-org
  env: dev
  name: test-efs-ap
  id: test-efs-ap-id
spec:
  region: us-east-1
  fileSystemId:
    value: fs-0123456789abcdef0
  posixUser:
    uid: 1000
    gid: 1000
  rootDirectory:
    path: /app/data
    creationInfo:
      ownerUid: 1000
      ownerGid: 1000
      permissions: "0755"
