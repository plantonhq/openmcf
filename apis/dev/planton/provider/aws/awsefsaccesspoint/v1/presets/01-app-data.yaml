apiVersion: aws.planton.dev/v1
kind: AwsEfsAccessPoint
metadata:
  org: example-org
  env: prod
  name: app-data
  id: app-data-id
spec:
  region: us-east-1
  fileSystemId:
    valueFrom:
      kind: AwsElasticFileSystem
      name: <file-system-name>
      fieldPath: status.outputs.file_system_id
  posixUser:
    uid: 1000
    gid: 1000
  rootDirectory:
    path: /app-data
    creationInfo:
      ownerUid: 1000
      ownerGid: 1000
      permissions: "0755"
