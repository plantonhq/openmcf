syntax = "proto3";

package dev.planton.provider.aws.awsbatchschedulingpolicy.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awsbatchschedulingpolicy/v1/spec.proto";
import "dev/planton/provider/aws/awsbatchschedulingpolicy/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AwsBatchSchedulingPolicy is the API envelope for an AWS Batch fair-share
// scheduling policy -- the reusable fairness rules job queues attach to
// divide capacity across share identifiers.
message AwsBatchSchedulingPolicy {
  // api-version must be set to "aws.planton.dev/v1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1"];

  // resource-kind for this resource, must be "AwsBatchSchedulingPolicy".
  string kind = 2 [(buf.validate.field).string.const = "AwsBatchSchedulingPolicy"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the scheduling policy.
  AwsBatchSchedulingPolicySpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsBatchSchedulingPolicyStatus status = 5;
}

// AwsBatchSchedulingPolicyStatus describes the status of an AWS Batch
// scheduling policy.
message AwsBatchSchedulingPolicyStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsBatchSchedulingPolicyStackOutputs outputs = 1;
}
