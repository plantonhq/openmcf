# Minimal AwsMskServerlessCluster scenario: the complete honest surface --
# network interfaces in both subnet fixtures and the broker
# security-group fixture attached (its ingress already opens the Kafka
# listener ports including SASL/IAM 9098). SASL/IAM authentication is not
# in the manifest because it is not a spec field: AWS requires it and both
# modules enable it unconditionally. Full metadata is supplied for
# tagging/orphan cleanup.
#
# The e2e-prerequisites annotation composes the security-group fixture;
# subnets are a registry prerequisite (security groups are optional on the
# kind -- AWS attaches the VPC default group when omitted).
apiVersion: aws.planton.dev/v1
kind: AwsMskServerlessCluster
metadata:
  name: planton-oss-e2e-msksl
  id: planton-oss-e2e-msksl
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsmskserverlesscluster
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSecurityGroup"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
