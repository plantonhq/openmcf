# Fixture AwsFsxOntapFileSystem consumed by the SVM (and transitively the
# volume) scenarios. Deliberately the cheapest creatable ONTAP shape —
# SINGLE_AZ_1 with the whole-file-system 128 MB/s throughput arm at the
# 1024 GiB floor — which also live-proves the first-generation
# throughput_capacity arm that the component's own scenarios do not carry.
# Fixed name so name-aware resolution and orphan sweeps stay stable.
apiVersion: aws.planton.dev/v1
kind: AwsFsxOntapFileSystem
metadata:
  name: planton-oss-e2e-awsfxo-prereq
  id: planton-oss-e2e-awsfxo-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsfsxontapfilesystem
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  deploymentType: SINGLE_AZ_1
  storageCapacityGib: 1024
  throughputCapacity: 128
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
