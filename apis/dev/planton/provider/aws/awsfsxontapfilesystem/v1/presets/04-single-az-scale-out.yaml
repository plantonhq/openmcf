apiVersion: aws.planton.dev/v1
kind: AwsFsxOntapFileSystem
metadata:
  org: example-org
  env: prod
  name: scaleout-ontap-fs
  id: awsfxo-scaleout-ontap-fs-prod
spec:
  region: <aws-region>
  deployment_type: SINGLE_AZ_2
  storage_capacity_gib: 16384
  storage_type: SSD
  throughput_capacity_per_ha_pair: 1536
  ha_pairs: 4
  subnet_ids:
    - value: "<subnet-id>"
  security_group_ids:
    - value: "<security-group-id>"
  kms_key_id:
    value: arn:aws:kms:us-east-1:123456789012:key/your-kms-key-id
  fsx_admin_password: <REPLACE_WITH_8_TO_50_CHAR_PASSWORD>
  disk_iops_configuration:
    mode: USER_PROVISIONED
    iops: 160000
  automatic_backup_retention_days: 7
  daily_automatic_backup_start_time: "05:00"
  weekly_maintenance_start_time: "7:02:00"
