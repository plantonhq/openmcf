apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awsrdsinstance
spec:
  # An RDS DB instance under live E2E: the harness deploys the AwsVpc + two-AZ
  # AwsSubnet prerequisites (the DB subnet group must span two AZs even for a
  # single-AZ instance), runs deploy -> DescribeDBInstances verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario is a single-AZ postgres
  # db.t4g.micro on 20 GiB gp3 with the AWS-managed master password -- the
  # smallest instance class RDS offers, so the run costs cents. RDS instance
  # provisioning dominates the runtime at five to ten minutes each way per
  # engine.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
