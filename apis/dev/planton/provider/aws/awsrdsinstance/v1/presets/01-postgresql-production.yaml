apiVersion: aws.planton.dev/v1
kind: AwsRdsInstance
metadata:
  name: my-postgresql-instance
spec:
  region: us-west-2
  subnetIds:
    - value: subnet-replace-with-private-az1
    - value: subnet-replace-with-private-az2
  securityGroupIds:
    - value: sg-replace-with-database-sg
  engine: postgres
  # Empty engineVersion would keep the AWS default; pinning is the
  # production posture so upgrades are deliberate.
  engineVersion: "16.4"
  instanceClass: db.m6g.large
  allocatedStorageGb: 50
  # Storage autoscaling: RDS grows the volume automatically as it
  # fills -- cheap insurance against disk-full outages.
  maxAllocatedStorageGb: 200
  storageType: gp3
  storageEncrypted: true # recommended_default -- create-time-only, cannot be enabled later
  username: dbadmin # AWS has no default master username -- pick one (avoid reserved names like rdsadmin)
  manageMasterUserPassword: true # recommended_default -- AWS generates, stores, and rotates the password in Secrets Manager
  multiAz: true # synchronous standby in a second AZ with automatic failover
  publiclyAccessible: false
  backupRetentionPeriod: 7
  deletionProtection: true
  skipFinalSnapshot: false
  finalSnapshotIdentifier: my-postgresql-instance-final
  copyTagsToSnapshot: true
  performanceInsightsEnabled: true # free at the default 7-day retention
  enabledCloudwatchLogsExports:
    - postgresql
    - upgrade
