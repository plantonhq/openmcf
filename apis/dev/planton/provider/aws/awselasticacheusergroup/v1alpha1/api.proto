syntax = "proto3";

package dev.planton.provider.aws.awselasticacheusergroup.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awselasticacheusergroup/v1alpha1/spec.proto";
import "dev/planton/provider/aws/awselasticacheusergroup/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AwsElasticacheUserGroup represents the RBAC attachment unit for
// Redis/Valkey ElastiCache: a set of users that attaches, as one object,
// to replication groups and serverless caches.
message AwsElasticacheUserGroup {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this ElastiCache user group resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsElasticacheUserGroup"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming. The name doubles
  // as the AWS user group id and is create-time immutable.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the group is provisioned.
  AwsElasticacheUserGroupSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsElasticacheUserGroupStatus status = 5;
}

// AwsElasticacheUserGroupStatus describes the status fields for an ElastiCache user group resource.
message AwsElasticacheUserGroupStatus {
  // stack_outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsElasticacheUserGroupStackOutputs outputs = 1;
}
