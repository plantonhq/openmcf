apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticacheUserGroup
metadata:
  name: <user-group-id>
spec:
  region: <aws-region>
  engine: redis
  userIds:
    # Mandatory locked-down default user — userName must be "default" in AWS.
    - valueFrom:
        kind: AwsElasticacheUser
        name: <default-user-resource-name>
        fieldPath: status.outputs.user_id
    # Per-application user(s) — add one entry per service identity.
    - valueFrom:
        kind: AwsElasticacheUser
        name: <app-user-resource-name>
        fieldPath: status.outputs.user_id
