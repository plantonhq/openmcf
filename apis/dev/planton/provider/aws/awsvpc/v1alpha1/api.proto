syntax = "proto3";

package dev.planton.provider.aws.awsvpc.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awsvpc/v1alpha1/spec.proto";
import "dev/planton/provider/aws/awsvpc/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//aws-vpc
message AwsVpc {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsVpc'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsVpcSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsVpcStatus status = 5;
}

//aws-vpc status
message AwsVpcStatus {
  //stack-outputs
  AwsVpcStackOutputs outputs = 1;
}
