apiVersion: aws.planton.dev/v1
kind: AwsLaunchTemplate
metadata:
  name: <fleet-name>
spec:
  region: <aws-region>
  imageId: ami-<your-ami-id>
  instanceType: m6i.large
  instanceProfile:
    valueFrom:
      kind: AwsIamInstanceProfile
      name: <instance-profile-resource-name>
      fieldPath: status.outputs.instance_profile_arn
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: <security-group-resource-name>
        fieldPath: status.outputs.security_group_id
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
    instanceMetadataTags: enabled
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSizeGb: 50
        volumeType: gp3
        encrypted: true
        kmsKeyId:
          valueFrom:
            kind: AwsKmsKey
            name: <kms-key-resource-name>
            fieldPath: status.outputs.key_arn
  disableApiStop: true
  disableApiTermination: true
  autoRecovery: default
