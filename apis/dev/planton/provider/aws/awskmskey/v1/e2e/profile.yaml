apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awskmskey
spec:
  # A customer-managed KMS key under E2E: the harness runs deploy ->
  # DescribeKey verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario is a true leaf (no registry prerequisites)
  # with one symmetric key and a single alias -- fast and cheap. Deliberately
  # not in the live scenario: multi-Region primaries, asymmetric/HMAC key
  # shapes, and custom key policies -- all proven by CEL spec tests and the
  # offline gate.
  #
  # deferred: both engines are validated offline only -- tofu init +
  # validate, spec/CEL tests, outputs conformance, and Pulumi module
  # compile -- with no live provision lane yet (plan/preview lanes also
  # not run: no usable AWS credentials were reachable). The scenario and
  # verifier are live-ready; flip to green after the first full deploy ->
  # verify -> destroy run on both provisioners.
  tier: 1
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
  deferred_reason: >-
    Live lane deferred until AWS credentials are restored. Offline gate green
    (tofu init + validate, spec/CEL tests, outputs conformance, Pulumi module
    compile); scenario and verifier live-ready.
