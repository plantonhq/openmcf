apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsCluster
metadata:
  name: my-ec2-backed-cluster
spec:
  region: <aws-region>
  containerInsights: enhanced
  capacityProviders:
    - FARGATE  # keep the serverless lane beside the EC2 capacity
  ec2CapacityProviders:
    - name: general-purpose
      autoScalingGroupArn:
        value: "<auto-scaling-group-arn>"  # or reference an AwsAutoScalingGroup's autoscaling_group_arn output
      managedScaling:
        status: ENABLED
        targetCapacity: 80  # keep 20% headroom so new tasks place without waiting for an instance launch
      managedDraining: ENABLED  # drain tasks gracefully off terminating instances
  defaultCapacityProviderStrategy:
    - capacityProvider: general-purpose
      weight: 1
