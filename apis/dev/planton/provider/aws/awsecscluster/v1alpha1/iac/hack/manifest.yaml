apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsCluster
metadata:
  name: ecs-cluster-demo
spec:
  region: us-west-2
  containerInsights: enhanced
  capacityProviders:
    - FARGATE
    - FARGATE_SPOT
  defaultCapacityProviderStrategy:
    - capacityProvider: FARGATE
      base: 1
      weight: 1
    - capacityProvider: FARGATE_SPOT
      weight: 4
  executeCommandConfiguration:
    logging: DEFAULT
