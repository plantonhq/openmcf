apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awstransitgatewayroutetable
spec:
  # A Transit Gateway route table under live E2E: the composed lane proves
  # the isolated-routing-domain story -- custom table + explicit
  # association + propagation + attachment-forwarded static route +
  # blackhole route -- against the attachment fixture declared via the
  # scenario's e2e-prerequisites annotation (the registry stays honest
  # with the gateway alone: an empty table deploys). Teardown ordering is
  # safe by construction: the associations/routes live in this lane's
  # stack, which the harness destroys before the attachment and gateway
  # fixtures. Verification is DescribeTransitGatewayRouteTables keyed on
  # the table ID, state-aware (deleting/deleted count as absent).
  #
  # Deliberately not in the live lane: a prefix_list_references entry --
  # it needs a managed prefix list, which no catalog kind provisions yet;
  # the fold is proven by spec tests and the offline contract gate.
  #
  # Live dual-engine run 2026-07-08 (incl. the TGW -> attachment -> VPC ->
  # subnet fixture chain; the composed lane proved association +
  # propagation + static route + blackhole live): Pulumi ~10m11s /
  # Terraform 10m58s (deploy 1m12s, destroy 1m14s); zero-orphan sweep
  # clean.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 40
