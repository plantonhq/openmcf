syntax = "proto3";

package dev.planton.provider.aws.awstransitgatewayroutetable.v1;

// AwsTransitGatewayRouteTableStackOutputs captures observable identifiers
// from a provisioned Transit Gateway route table.
message AwsTransitGatewayRouteTableStackOutputs {
  // The Transit Gateway route table ID (e.g., "tgw-rtb-0123456789abcdef0").
  // Referenced by tooling that manages routes or inspects the routing
  // domain, and by the gateway-level default-table designation surface.
  string route_table_id = 1;

  // The Amazon Resource Name (ARN) of the route table. Used for IAM
  // policies and resource-level permissions.
  string route_table_arn = 2;
}
