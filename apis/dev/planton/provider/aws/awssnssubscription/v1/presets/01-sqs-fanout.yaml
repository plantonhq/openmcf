# Fan out a topic's order events into an SQS queue, delivering only the
# message types this consumer cares about, without the SNS JSON envelope.
apiVersion: aws.planton.dev/v1
kind: AwsSnsSubscription
metadata:
  name: fulfillment-events
spec:
  region: <aws-region>
  topicArn:
    valueFrom:
      kind: AwsSnsTopic
      name: order-events
      fieldPath: status.outputs.topic_arn
  protocol: sqs
  endpoint:
    valueFrom:
      kind: AwsSqsQueue
      name: fulfillment-queue
      fieldPath: status.outputs.queue_arn
  # Deliver the message body as-is; consumers do not need to unwrap the
  # SNS JSON envelope.
  rawMessageDelivery: true
  # Deliver only the event types this consumer processes; everything else is
  # filtered out before it reaches the queue.
  filterPolicy:
    event_type:
      - order_placed
      - order_shipped
  filterPolicyScope: MessageAttributes
