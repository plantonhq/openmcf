# Push topic messages to an HTTPS webhook that confirms itself, with failed
# deliveries captured in an SQS dead-letter queue.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSnsSubscription
metadata:
  name: billing-webhook
spec:
  region: <aws-region>
  topicArn:
    valueFrom:
      kind: AwsSnsTopic
      name: order-events
      fieldPath: status.outputs.topic_arn
  protocol: https
  endpoint:
    value: "https://hooks.example.com/sns/order-events"
  # The endpoint responds to the SubscriptionConfirmation callback on its own,
  # so deployment waits for the handshake to complete.
  endpointAutoConfirms: true
  confirmationTimeoutMinutes: 5
  # Messages SNS ultimately cannot deliver land here for investigation
  # instead of vanishing after retry exhaustion.
  deadLetterConfig:
    deadLetterTargetArn:
      valueFrom:
        kind: AwsSqsQueue
        name: webhook-dlq
        fieldPath: status.outputs.queue_arn
