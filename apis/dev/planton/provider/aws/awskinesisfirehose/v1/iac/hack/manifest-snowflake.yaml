apiVersion: aws.planton.dev/v1
kind: AwsKinesisFirehose
metadata:
  name: test-firehose-snowflake
  org: test-org
  env: dev
  id: test-firehose-snowflake-dev
  annotations:
    planton.dev/provisioner: pulumi
    pulumi.planton.dev/organization: test-org
    pulumi.planton.dev/project: test-project
    pulumi.planton.dev/stack.name: dev.AwsKinesisFirehose.test-firehose-snowflake
spec:
  region: us-west-2
  # Snowflake destination: Snowpipe Streaming with Secrets Manager
  # credentials, a dedicated ingestion role, VARIANT loading, and
  # PrivateLink -- the full arm for the offline plan/preview proof.
  snowflake:
    accountUrl: https://testaccount.snowflakecomputing.com
    database: ANALYTICS
    schema: PUBLIC
    table: EVENTS
    roleArn:
      value: arn:aws:iam::123456789012:role/firehose-snowflake-role
    secretsManager:
      secretArn:
        value: arn:aws:secretsmanager:us-west-2:123456789012:secret:snowflake-keypair-AbCdEf
    snowflakeRole: FIREHOSE_INGEST
    dataLoadingOption: VARIANT_CONTENT_AND_METADATA_MAPPING
    contentColumnName: RECORD_CONTENT
    metadataColumnName: RECORD_METADATA
    privateLinkVpceId: com.amazonaws.vpce.us-west-2.vpce-svc-0123456789abcdef0
    buffering:
      intervalInSeconds: 10
      sizeInMbs: 4
    retryDurationInSeconds: 120
    s3BackupMode: AllData
    s3Config:
      bucketArn:
        value: arn:aws:s3:::my-firehose-backup-bucket
      roleArn:
        value: arn:aws:iam::123456789012:role/firehose-s3-backup-role
      prefix: snowflake-backup/
