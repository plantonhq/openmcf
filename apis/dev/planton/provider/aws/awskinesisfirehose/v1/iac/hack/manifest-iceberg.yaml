apiVersion: aws.planton.dev/v1
kind: AwsKinesisFirehose
metadata:
  name: test-firehose-iceberg
  org: test-org
  env: dev
  id: test-firehose-iceberg-dev
  labels:
    planton.dev/provisioner: pulumi
    pulumi.planton.dev/organization: test-org
    pulumi.planton.dev/project: test-project
    pulumi.planton.dev/stack.name: dev.AwsKinesisFirehose.test-firehose-iceberg
spec:
  region: us-west-2
  # Iceberg destination: multi-table routing with unique-key upserts and a
  # metadata-extraction processor -- the full arm for the offline
  # plan/preview proof (the catalog ARN embeds an account ID, so this arm
  # never runs live from a committed manifest).
  iceberg:
    catalogArn:
      value: arn:aws:glue:us-west-2:123456789012:catalog
    roleArn:
      value: arn:aws:iam::123456789012:role/firehose-iceberg-role
    destinationTables:
      - databaseName: lakehouse
        tableName: orders
        uniqueKeys:
          - order_id
        s3ErrorOutputPrefix: errors/orders/
      - databaseName: lakehouse
        tableName: customers
        uniqueKeys:
          - customer_id
    buffering:
      intervalInSeconds: 120
      sizeInMbs: 64
    retryDurationInSeconds: 300
    s3BackupMode: FailedDataOnly
    s3Config:
      bucketArn:
        value: arn:aws:s3:::my-firehose-backup-bucket
      roleArn:
        value: arn:aws:iam::123456789012:role/firehose-s3-backup-role
      prefix: iceberg-failed/
    processing:
      enabled: true
      processors:
        - metadataExtraction:
            query: '{destination_table: .table}'
            jsonParsingEngine: JQ-1.6
