apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awseksaccessentry
spec:
  # An EKS access entry under live E2E: deploy -> DescribeAccessEntry
  # verify -> destroy -> verify-destroyed on both provisioners. The entry
  # itself is instant, but every run rides the full
  # VPC -> subnets -> roles -> cluster prerequisite chain (~15 minutes to
  # stand up, ~10 to tear down), so the timeout is sized for the chain.
  # The prerequisite cluster runs authenticationMode API, which entries
  # require.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
