apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsService
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  clusterArn:
    valueFrom:
      kind: AwsEcsCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.cluster_arn
  taskDefinition:
    valueFrom:
      kind: AwsEcsTaskDefinition
      name: <task-definition-resource-name>
      fieldPath: status.outputs.task_definition_arn
  desiredCount: 2
  network:
    subnets:
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-a-resource-name>
          fieldPath: status.outputs.subnet_id
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-b-resource-name>
          fieldPath: status.outputs.subnet_id
    securityGroups:
      - valueFrom:
          kind: AwsSecurityGroup
          name: <security-group-resource-name>
          fieldPath: status.outputs.security_group_id
  loadBalancers:
    - targetGroupArn:
        valueFrom:
          kind: AwsLbTargetGroup
          name: <target-group-resource-name>
          fieldPath: status.outputs.target_group_arn
      containerName: app
      containerPort: 8080
  healthCheckGracePeriodSeconds: 90
  deploymentCircuitBreaker:
    enable: true
    rollback: true
  autoscaling:
    minTasks: 2
    maxTasks: 10
    cpu:
      targetPercent: 70
