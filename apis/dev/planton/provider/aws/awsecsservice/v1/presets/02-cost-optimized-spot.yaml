apiVersion: aws.planton.dev/v1
kind: AwsEcsService
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  clusterArn:
    valueFrom:
      kind: AwsEcsCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.cluster_arn
  taskDefinition:
    valueFrom:
      kind: AwsEcsTaskDefinition
      name: <task-definition-resource-name>
      fieldPath: status.outputs.task_definition_arn
  desiredCount: 4
  capacityProviderStrategy:
    - capacityProvider: FARGATE
      base: 1
      weight: 1
    - capacityProvider: FARGATE_SPOT
      weight: 4
  network:
    subnets:
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-a-resource-name>
          fieldPath: status.outputs.subnet_id
      - valueFrom:
          kind: AwsSubnet
          name: <private-subnet-b-resource-name>
          fieldPath: status.outputs.subnet_id
  availabilityZoneRebalancing: ENABLED
  deploymentCircuitBreaker:
    enable: true
    rollback: true
