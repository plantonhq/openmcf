apiVersion: aws.planton.dev/v1
kind: AwsTransitGatewayVpcAttachment
metadata:
  org: example-org
  env: prod
  name: segmented-spoke
  id: segmented-spoke-id
spec:
  region: <aws-region>
  transitGatewayId:
    valueFrom:
      kind: AwsTransitGateway
      name: segmented-hub
      fieldPath: status.outputs.transit_gateway_id
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: prod-vpc
      fieldPath: status.outputs.vpc_id
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: prod-tgw-subnet-az1
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: prod-tgw-subnet-az2
        fieldPath: status.outputs.subnet_id
  defaultRouteTableAssociation: false
  defaultRouteTablePropagation: false
