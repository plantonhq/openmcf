apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awstransitgatewayvpcattachment
spec:
  # A Transit Gateway VPC attachment under live E2E: the harness deploys
  # the registry chain (AwsTransitGateway; AwsSubnet -> AwsVpc) and the
  # scenario attaches two AZs with appliance mode and pinned-off
  # default-table membership. Verification is
  # DescribeTransitGatewayVpcAttachments keyed on the attachment ID,
  # state-aware (deleting/deleted count as absent). Expected lane time:
  # ~8-12 min per engine including the fixture chain (attachment create
  # ~2-5 min, delete ~2-5 min).
  #
  # deferred: both engines validated offline only this session -- spec/CEL
  # tests, generator-owned contract + drift guard, outputs conformance,
  # tofu init + validate, Pulumi module + entrypoint compile -- because no
  # usable AWS credentials were reachable on the ambient chain
  # (InvalidClientTokenId; the e2e SSO session had expired). The scenario,
  # prerequisite fixture, and verifier are live-ready; flip to green after
  # the first full deploy -> verify -> destroy run on both provisioners.
  tier: 1
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
  deferred_reason: >-
    No usable AWS credentials on the ambient chain at session time
    (InvalidClientTokenId / expired SSO token). Offline gate fully green;
    artifacts live-ready -- run with AWS_PROFILE=planton-aws-e2e after
    aws sso login.
