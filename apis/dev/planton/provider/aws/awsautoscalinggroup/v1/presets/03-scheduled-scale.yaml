apiVersion: aws.planton.dev/v1
kind: AwsAutoScalingGroup
metadata:
  name: <fleet-name>
spec:
  region: <aws-region>
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  launchTemplate:
    launchTemplateId:
      valueFrom:
        kind: AwsLaunchTemplate
        name: <launch-template-resource-name>
        fieldPath: status.outputs.launch_template_id
  minSize: 0
  maxSize: 20
  scheduledActions:
    - name: business-hours-up
      recurrence: "0 8 * * MON-FRI"
      timeZone: <iana-time-zone>
      minSize: 4
    - name: overnight-down
      recurrence: "0 20 * * *"
      timeZone: <iana-time-zone>
      minSize: 0
      desiredCapacity: 0
  warmPool:
    poolState: Stopped
    minSize: 2
    reuseOnScaleIn: true
