    id: "metric_pair_valid"
    message: "predefined_metric_pair_type must be one of: ASGCPUUtilization, ASGNetworkIn, ASGNetworkOut, ALBRequestCount"
    expression: "this.predefined_metric_pair_type in ['ASGCPUUtilization', 'ASGNetworkIn', 'ASGNetworkOut', 'ALBRequestCount']"
  };

  option (buf.validate.message).cel = {
    id: "mode_valid"
    message: "mode must be 'ForecastOnly' or 'ForecastAndScale' when set"
    expression: "this.mode == '' || this.mode in ['ForecastOnly', 'ForecastAndScale']"
  };

  option (buf.validate.message).cel = {
    id: "breach_behavior_valid"
    message: "max_capacity_breach_behavior must be 'HonorMaxCapacity' or 'IncreaseMaxCapacity' when set"
    expression: "this.max_capacity_breach_behavior == '' || this.max_capacity_breach_behavior in ['HonorMaxCapacity', 'IncreaseMaxCapacity']"
  };

  option (buf.validate.message).cel = {
    id: "buffer_only_for_increase"
    message: "max_capacity_buffer only applies when max_capacity_breach_behavior is 'IncreaseMaxCapacity'"
    expression: "this.max_capacity_buffer == 0 || this.max_capacity_breach_behavior == 'IncreaseMaxCapacity'"
  };

  option (buf.validate.message).cel = {
    id: "buffer_range"
    message: "max_capacity_buffer must be between 0 and 100"
    expression: "this.max_capacity_buffer >= 0 && this.max_capacity_buffer <= 100"
  };
}

// AwsAutoScalingGroupScheduledAction changes capacity on a schedule --
// recurring (cron) or one-shot (start_time only).
message AwsAutoScalingGroupScheduledAction {
