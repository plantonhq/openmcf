  };

  option (buf.validate.message).cel = {
    id: "statistic_valid"
    message: "statistic must be one of: Average, Minimum, Maximum, SampleCount, Sum"
    expression: "this.statistic == '' || this.statistic in ['Average', 'Minimum', 'Maximum', 'SampleCount', 'Sum']"
  };

  option (buf.validate.message).cel = {
    id: "period_valid"
    message: "period_seconds must be 10, 30, or 60 when set"
    expression: "this.period_seconds == 0 || this.period_seconds in [10, 30, 60]"
  };
}

// AwsAutoScalingGroupMetricDimension is one name/value dimension of a
// CloudWatch metric.
message AwsAutoScalingGroupMetricDimension {
  // Dimension name (e.g. "QueueName"). Required.
  string name = 1 [(buf.validate.field).required = true];

  // Dimension value (e.g. "orders"). Required.
  string value = 2 [(buf.validate.field).required = true];
}

// AwsAutoScalingGroupMetricDataQuery is one entry of a metric-math
// expression set: either a raw metric (metric_stat) or an expression over
// other entries' ids.
message AwsAutoScalingGroupMetricDataQuery {
