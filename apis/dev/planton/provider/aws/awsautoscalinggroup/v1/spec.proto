  // adjustment changes.
  int32 min_adjustment_magnitude = 4;

  option (buf.validate.message).cel = {
    id: "adjustment_type_valid"
    message: "adjustment_type must be 'ChangeInCapacity', 'ExactCapacity', or 'PercentChangeInCapacity'"
    expression: "this.adjustment_type in ['ChangeInCapacity', 'ExactCapacity', 'PercentChangeInCapacity']"
  };

