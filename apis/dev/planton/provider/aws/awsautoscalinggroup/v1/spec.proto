  string metric_interval_lower_bound = 2;

  // Upper bound of the breach range, relative to the alarm threshold,
  // as a decimal string. Empty = positive infinity.
  string metric_interval_upper_bound = 3;
}

// AwsAutoScalingGroupSimpleScalingConfig is the legacy react-and-cooldown
// model: one adjustment per alarm breach, then wait out the cooldown.
