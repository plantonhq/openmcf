  // Mutually exclusive with metric_stat.
  string expression = 2;

  // A raw metric to fetch. Mutually exclusive with expression.
  AwsAutoScalingGroupMetricStat metric_stat = 3;

  // Human-readable label for the query.
  string label = 4;

