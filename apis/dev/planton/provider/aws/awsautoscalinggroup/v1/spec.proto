}

// AwsAutoScalingGroupMetricStat fetches one raw metric for a metric-math
// query.
message AwsAutoScalingGroupMetricStat {
  // The metric name. Required.
  string metric_name = 1 [(buf.validate.field).required = true];

  // The metric namespace. Required.
  string namespace = 2 [(buf.validate.field).required = true];

  // The statistic to fetch (e.g. "Average", "Sum"). Required.
  string stat = 3 [(buf.validate.field).required = true];

  // The metric unit.
  string unit = 4;

  // Dimensions identifying the metric stream.
  repeated AwsAutoScalingGroupMetricDimension dimensions = 5;

  // Granularity in seconds: 10, 30, or 60.
  int32 period_seconds = 6;

  option (buf.validate.message).cel = {
    id: "period_valid"
    message: "period_seconds must be 10, 30, or 60 when set"
    expression: "this.period_seconds == 0 || this.period_seconds in [10, 30, 60]"
  };
}

// AwsAutoScalingGroupStepScalingConfig reacts to a CloudWatch alarm with
// stepped adjustments sized by how far the metric breached. The alarm
// itself is a separate AwsCloudwatchAlarm whose alarm action targets this
// policy's ARN.
message AwsAutoScalingGroupStepScalingConfig {
  // How the adjustment numbers are interpreted: "ChangeInCapacity" (add/
  // remove N instances), "ExactCapacity" (set capacity to N), or
  // "PercentChangeInCapacity" (grow/shrink by N%). Required.
  string adjustment_type = 1 [(buf.validate.field).required = true];

  // How the metric is aggregated across the breach evaluation:
  // "Average" (AWS default), "Minimum", or "Maximum".
  string metric_aggregation_type = 2;

  // With "PercentChangeInCapacity", the minimum number of instances any
  // single step changes -- keeps percentage scaling meaningful on small
  // fleets.
  int32 min_adjustment_magnitude = 3;

  // The steps, keyed by breach distance. At least one. Bounds are
  // decimal strings relative to the alarm threshold; an empty bound is
  // open-ended (negative infinity for the first lower bound, positive
  // infinity for the last upper bound).
  repeated AwsAutoScalingGroupStepAdjustment step_adjustments = 4 [(buf.validate.field).repeated.min_items = 1];

  option (buf.validate.message).cel = {
    id: "adjustment_type_valid"
    message: "adjustment_type must be 'ChangeInCapacity', 'ExactCapacity', or 'PercentChangeInCapacity'"
    expression: "this.adjustment_type in ['ChangeInCapacity', 'ExactCapacity', 'PercentChangeInCapacity']"
  };

  option (buf.validate.message).cel = {
    id: "aggregation_type_valid"
    message: "metric_aggregation_type must be 'Minimum', 'Maximum', or 'Average' when set"
    expression: "this.metric_aggregation_type == '' || this.metric_aggregation_type in ['Minimum', 'Maximum', 'Average']"
  };

  // 0 only means something under ExactCapacity ("set capacity to 0"); as
  // a delta it is a no-op step that AWS accepts and never acts on.
  option (buf.validate.message).cel = {
    id: "step_adjustments_nonzero_for_deltas"
    message: "a step's scaling_adjustment of 0 is only meaningful with adjustment_type 'ExactCapacity'"
    expression: "this.adjustment_type == 'ExactCapacity' || this.step_adjustments.all(s, s.scaling_adjustment != 0)"
  };
}

// AwsAutoScalingGroupStepAdjustment is one step of a step-scaling policy.
message AwsAutoScalingGroupStepAdjustment {
  // The capacity change this step applies (interpreted per the policy's
  // adjustment_type; negative shrinks; 0 is only meaningful with
  // "ExactCapacity").
  int32 scaling_adjustment = 1;

  // Lower bound of the breach range this step covers, relative to the
  // alarm threshold, as a decimal string (e.g. "0", "10.5"). Empty =
