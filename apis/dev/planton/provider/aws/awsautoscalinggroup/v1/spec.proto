    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSnsTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_arn"
  ];

  // The IAM role Auto Scaling assumes to publish to the notification
  // target. Required by AWS when notification_target_arn is set.
  // Reference an AwsIamRole's role_arn output or pass a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Free-form JSON delivered with every notification -- routing context
  // for the consumer.
  string notification_metadata = 7;

  option (buf.validate.message).cel = {
    id: "lifecycle_transition_valid"
    message: "lifecycle_transition must be 'autoscaling:EC2_INSTANCE_LAUNCHING' or 'autoscaling:EC2_INSTANCE_TERMINATING'"
    expression: "this.lifecycle_transition in ['autoscaling:EC2_INSTANCE_LAUNCHING', 'autoscaling:EC2_INSTANCE_TERMINATING']"
  };

  option (buf.validate.message).cel = {
    id: "default_result_valid"
    message: "default_result must be 'ABANDON' or 'CONTINUE' when set"
    expression: "this.default_result == '' || this.default_result in ['ABANDON', 'CONTINUE']"
  };

  option (buf.validate.message).cel = {
    id: "heartbeat_timeout_range"
    message: "heartbeat_timeout_seconds must be between 30 and 7200 when set"
    expression: "this.heartbeat_timeout_seconds == 0 || (this.heartbeat_timeout_seconds >= 30 && this.heartbeat_timeout_seconds <= 7200)"
  };
}

// AwsAutoScalingGroupNotifications wires fleet lifecycle events to an SNS
// topic.
message AwsAutoScalingGroupNotifications {
  // The SNS topic events are published to. Reference an AwsSnsTopic's
  // topic_arn output or pass a literal ARN. Required.
  dev.planton.shared.foreignkey.v1.StringValueOrRef topic = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSnsTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_arn"
  ];

  // The event types to publish. At least one of:
  // "autoscaling:EC2_INSTANCE_LAUNCH",
  // "autoscaling:EC2_INSTANCE_LAUNCH_ERROR",
  // "autoscaling:EC2_INSTANCE_TERMINATE",
  // "autoscaling:EC2_INSTANCE_TERMINATE_ERROR".
  repeated string event_types = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated.min_items = 1
  ];

  option (buf.validate.message).cel = {
    id: "event_types_valid"
    message: "each event type must be one of: autoscaling:EC2_INSTANCE_LAUNCH, autoscaling:EC2_INSTANCE_LAUNCH_ERROR, autoscaling:EC2_INSTANCE_TERMINATE, autoscaling:EC2_INSTANCE_TERMINATE_ERROR"
    expression: "this.event_types.all(t, t in ['autoscaling:EC2_INSTANCE_LAUNCH', 'autoscaling:EC2_INSTANCE_LAUNCH_ERROR', 'autoscaling:EC2_INSTANCE_TERMINATE', 'autoscaling:EC2_INSTANCE_TERMINATE_ERROR'])"
  };
}
