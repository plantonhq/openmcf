  option (buf.validate.message).cel = {
    id: "recurrence_or_start_time"
    message: "a scheduled action needs a recurrence (recurring) or a start_time (one-shot)"
    expression: "this.recurrence != '' || this.start_time != ''"
  };
}

// AwsAutoScalingGroupLifecycleHook pauses instances at a lifecycle
