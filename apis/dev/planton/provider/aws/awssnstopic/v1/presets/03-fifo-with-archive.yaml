# A FIFO topic with a 30-day message archive: strict ordering plus the
# ability to backfill consumers added later (each AwsSnsSubscription opts
# into replay via its own replayPolicy).
apiVersion: aws.planton.dev/v1
kind: AwsSnsTopic
metadata:
  name: order-events
spec:
  region: <aws-region>
  fifoTopic: true
  contentBasedDeduplication: true
  # Retain published messages for 30 days so new subscriptions can replay
  # history before receiving live traffic.
  archivePolicy:
    MessageRetentionPeriod: 30
  signatureVersion: 2
