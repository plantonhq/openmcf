apiVersion: aws.planton.dev/v1
kind: AwsPlantonRunner
metadata:
  name: <runner-name>
spec:
  region: <aws-region>
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  credentials: $secret/<runner-credentials-secret-slug>
  # 1 vCPU with 4 GiB: IaC operations are memory-hungry (provider
  # plugins, plans held in memory) -- size memory before cpu.
  cpu: 1024
  memory: 4096
  # Pin the runner build for change control; bump deliberately.
  runnerVersion: v0.4.0
  # The runner's own AWS identity at runtime, composed first-class --
  # grant it exactly what keyless operations need.
  taskRole:
    valueFrom:
      kind: AwsIamRole
      name: <runtime-role-resource-name>
      fieldPath: status.outputs.role_arn
  # Retain the operation audit trail longer than the 30-day default.
  logRetentionDays: 90
