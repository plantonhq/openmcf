syntax = "proto3";

package dev.planton.provider.aws.awsplantonrunner.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awsplantonrunner/v1alpha1/spec.proto";
import "dev/planton/provider/aws/awsplantonrunner/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AwsPlantonRunner is a standing Planton runner appliance hosted in your
// AWS network: an always-on worker that executes deploy operations and
// cloud operations from inside the VPC, making private endpoints (most
// notably private Kubernetes cluster APIs) deployable and operable with an
// outbound-only network posture.
message AwsPlantonRunner {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, always "AwsPlantonRunner".
  string kind = 2 [(buf.validate.field).string.const = 'AwsPlantonRunner'];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration defining where the runner lives,
  // how big it is, which build it runs, and who it is.
  AwsPlantonRunnerSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsPlantonRunnerStatus status = 5;
}

// AwsPlantonRunnerStatus describes the status fields for a runner
// appliance resource.
message AwsPlantonRunnerStatus {
  // stack_outputs captures the outputs returned by Pulumi/Terraform after
  // provisioning.
  AwsPlantonRunnerStackOutputs outputs = 1;
}
