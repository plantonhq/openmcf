# Composed AwsGlobalAccelerator scenario: the accelerator fronts an Elastic IP
# endpoint resolved from the fixture the e2e-prerequisites annotation deploys,
# proving the polymorphic endpoint_id reference (an EIP allocation ID) end to
# end. The non-default surface is exercised deliberately: an explicit
# SOURCE_IP client affinity, the fast 10-second health-check interval (AWS
# accepts exactly 10 or 30 -- the API rejects anything else at create time),
# a dedicated health-check port, an explicit endpoint weight, an explicit
# traffic dial, and a port override. The EIP
# endpoint type does not support client IP preservation, so that field is
# deliberately omitted (the AWS per-type default applies). Arms excluded from
# the live lane, proven by spec tests + the offline plan gate instead:
# flow logs (needs an S3 bucket granting the Global Accelerator service
# write access -- a policy-bearing fixture), BYOIP addresses (need a BYOIP
# pool registered with AWS), DUAL_STACK (additive dial, no lifecycle
# difference), and attachment_arn (requires a second AWS account). Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1
kind: AwsGlobalAccelerator
metadata:
  name: planton-oss-e2e-awsga-comp
  id: planton-oss-e2e-awsga-comp
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsglobalaccelerator
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsElasticIp"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  listeners:
    - name: web
      protocol: TCP
      clientAffinity: SOURCE_IP
      portRanges:
        - fromPort: 443
          toPort: 443
      endpointGroups:
        - name: primary
          healthCheckPort: 443
          healthCheckIntervalSeconds: 10
          thresholdCount: 2
          trafficDialPercentage: 100.0
          endpoints:
            - endpointId:
                valueFrom:
                  kind: AwsElasticIp
                  name: planton-oss-e2e-awselasticip-prereq
                  fieldPath: status.outputs.allocation_id
              weight: 100
          portOverrides:
            - listenerPort: 443
              endpointPort: 8443
