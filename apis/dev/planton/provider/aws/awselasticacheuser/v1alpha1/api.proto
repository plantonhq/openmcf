syntax = "proto3";

package dev.planton.provider.aws.awselasticacheuser.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awselasticacheuser/v1alpha1/spec.proto";
import "dev/planton/provider/aws/awselasticacheuser/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AwsElasticacheUser represents one identity in the ElastiCache RBAC system
// for Redis/Valkey: a named user with an ACL access string and an
// authentication mode, grouped into user groups that attach to caches.
message AwsElasticacheUser {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this ElastiCache user resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsElasticacheUser"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming. The name doubles
  // as the AWS user id and is create-time immutable.
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the user is provisioned.
  AwsElasticacheUserSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsElasticacheUserStatus status = 5;
}

// AwsElasticacheUserStatus describes the status fields for an ElastiCache user resource.
message AwsElasticacheUserStatus {
  // stack_outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsElasticacheUserStackOutputs outputs = 1;
}
