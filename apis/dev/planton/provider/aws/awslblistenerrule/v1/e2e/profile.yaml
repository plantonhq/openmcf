apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: awslblistenerrule
spec:
  # A listener rule under live E2E rides the full family chain: the harness
  # deploys AwsVpc -> two AwsSubnets -> AwsAlb -> AwsLbTargetGroup ->
  # AwsLbListener, then runs deploy -> DescribeRules verify -> destroy ->
  # verify-destroyed on both provisioners. The rule itself creates in
  # seconds; the chain dominates the runtime.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
