syntax = "proto3";

package dev.planton.provider.aws.awslblistenerrule.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awslblistenerrule/v1/spec.proto";
import "dev/planton/provider/aws/awslblistenerrule/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

//aws-lb-listener-rule
message AwsLbListenerRule {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsLbListenerRule'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsLbListenerRuleSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsLbListenerRuleStatus status = 5;
}

//aws-lb-listener-rule status
message AwsLbListenerRuleStatus {
  //stack-outputs
  AwsLbListenerRuleStackOutputs outputs = 1;
}
