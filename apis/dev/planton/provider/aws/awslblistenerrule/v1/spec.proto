  map<string, string> authentication_request_extra_params = 7;

  // What happens to an unauthenticated request: "authenticate" (AWS default
  // -- redirect to login), "deny" (401), or "allow" (pass through).
  string on_unauthenticated_request = 8;

  // Space-separated OAuth scopes to request. AWS default: "openid".
  string scope = 9;

  // The session cookie name. AWS default: "AWSELBAuthSessionCookie".
  string session_cookie_name = 10;

  // Seconds the authentication session stays valid. AWS default: 604800
  // (7 days).
  int32 session_timeout_seconds = 11;

  option (buf.validate.message).cel = {
    id: "oidc_on_unauthenticated_request_valid"
    message: "on_unauthenticated_request must be 'deny', 'allow', or 'authenticate' when set"
    expression: "this.on_unauthenticated_request == '' || this.on_unauthenticated_request in ['deny', 'allow', 'authenticate']"
  };
}

// AwsLbListenerRuleActionJwtValidation validates a JWT bearer token on each
// matching request against a JWKS endpoint -- stateless API authentication
// with no login redirect or session cookie. Requests with a missing or
// invalid token are rejected at the load balancer.
message AwsLbListenerRuleActionJwtValidation {
  // The expected token issuer (the "iss" claim), 1-256 characters.
  string issuer = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
