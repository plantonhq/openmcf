apiVersion: aws.planton.dev/v1
kind: AwsEc2Instance
metadata:
  name: my-spot-worker
spec:
  region: <aws-region>
  ami: ami-0123456789abcdef0  # replace with a current AMI for your region (e.g. AL2023 arm64)
  instanceType: m7g.large
  subnetId:
    value: "<private-subnet-id>"
  securityGroupIds:
    - value: "<security-group-id>"
  instanceProfile:
    value: "<instance-profile-name>"
  spotOptions:
    spotInstanceType: persistent  # EC2 re-requests capacity after an interruption
    instanceInterruptionBehavior: stop  # survive reclaims: stop, then resume when capacity returns
  metadataOptions:
    httpTokens: required
  rootBlockDevice:
    volumeSizeGb: 50
    volumeType: gp3
    encrypted: true
  userData: |
    #!/bin/bash
    # bootstrap the worker agent here
