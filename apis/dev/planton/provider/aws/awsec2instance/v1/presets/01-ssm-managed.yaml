apiVersion: aws.planton.dev/v1
kind: AwsEc2Instance
metadata:
  name: my-ssm-instance
spec:
  region: <aws-region>
  ami: ami-0123456789abcdef0  # replace with a current AMI for your region (e.g. AL2023 arm64)
  instanceType: t4g.small
  subnetId:
    value: "<private-subnet-id>"
  securityGroupIds:
    - value: "<security-group-id>"
  instanceProfile:
    value: "<instance-profile-name>"  # profile NAME whose role carries AmazonSSMManagedInstanceCore
  metadataOptions:
    httpTokens: required  # IMDSv2 only -- blocks credential-stealing SSRF
    httpPutResponseHopLimit: 2  # containers on the instance can still reach metadata
  rootBlockDevice:
    volumeSizeGb: 30
    volumeType: gp3
    encrypted: true
  disableApiTermination: true  # guard the pet against fat-fingered deletion
