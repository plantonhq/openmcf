apiVersion: aws.planton.dev/v1alpha1
kind: AwsEc2Instance
metadata:
  name: my-templated-instance
spec:
  region: <aws-region>
  launchTemplate:
    id:
      value: "<launch-template-id>"  # or reference an AwsLaunchTemplate's launch_template_id output
    version: "$Default"  # track the template's promoted default version
  # Inline fields override the template for THIS instance only:
  instanceType: t4g.medium  # size this pet up from the template's default
  subnetId:
    value: "<private-subnet-id>"  # templates leave placement open; the instance pins it
  disableApiTermination: true
