apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksFargateProfile
metadata:
  name: <profile-resource-name>
spec:
  region: <aws-region>
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: <cluster-resource-name>
      fieldPath: status.outputs.name
  # The role Fargate runs matched pods as: trusts
  # eks-fargate-pods.amazonaws.com and carries
  # AmazonEKSFargatePodExecutionRolePolicy on the role itself.
  podExecutionRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: <pod-execution-role-resource-name>
      fieldPath: status.outputs.role_arn
  # PRIVATE subnets only -- AWS rejects subnets with an internet-gateway
  # route. Give pods egress through a NAT gateway.
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-a-resource-name>
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: <private-subnet-b-resource-name>
        fieldPath: status.outputs.subnet_id
  # Every pod in this namespace runs on Fargate.
  selectors:
    - namespace: <namespace>
