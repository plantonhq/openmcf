syntax = "proto3";

package dev.planton.provider.aws.awsredshiftserverlessworkgroup.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/aws/awsredshiftserverlessworkgroup/v1/spec.proto";
import "dev/planton/provider/aws/awsredshiftserverlessworkgroup/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// aws-redshift-serverless-workgroup
message AwsRedshiftServerlessWorkgroup {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsRedshiftServerlessWorkgroup'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsRedshiftServerlessWorkgroupSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsRedshiftServerlessWorkgroupStatus status = 5;
}

// aws-redshift-serverless-workgroup status
message AwsRedshiftServerlessWorkgroupStatus {
  //stack-outputs
  AwsRedshiftServerlessWorkgroupStackOutputs outputs = 1;
}
