syntax = "proto3";

package dev.planton.provider.cloudflare.cloudflarelist.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/cloudflare/cloudflarelist/v1alpha1/spec.proto";
import "dev/planton/provider/cloudflare/cloudflarelist/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// cloudflare-list
message CloudflareList {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareList'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareListSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareListStatus status = 5;
}

// cloudflare-list status
message CloudflareListStatus {
  //stack-outputs
  //  cloudflare-list stack-outputs
  CloudflareListStackOutputs outputs = 1;
}
