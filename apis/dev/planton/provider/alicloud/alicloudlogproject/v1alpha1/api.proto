syntax = "proto3";

package dev.planton.provider.alicloud.alicloudlogproject.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/alicloud/alicloudlogproject/v1alpha1/spec.proto";
import "dev/planton/provider/alicloud/alicloudlogproject/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// alicloud-log-project
message AliCloudLogProject {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'alicloud.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AliCloudLogProject'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AliCloudLogProjectSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AliCloudLogProjectStatus status = 5;
}

// alicloud-log-project status
message AliCloudLogProjectStatus {
  // stack-outputs
  AliCloudLogProjectStackOutputs outputs = 1;
}
