apiVersion: azure.planton.dev/v1
kind: AzureLoadBalancer
metadata:
  name: my-public-lb
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: <your-lb-name>
  # STANDARD SKU and REGIONAL tier apply by default -- the production shape.
  frontendIpConfigurations:
    - name: public
      # A Standard SKU public IP (zone posture comes from the IP resource).
      publicIpAddressId:
        value: "<public-ip-resource-id>"
  backendPools:
    # Membership joins from the member side: a NIC ip_configuration or a
    # VM scale set references status.outputs.backendPoolIds.web.
    - name: web
  healthProbes:
    - name: http-health
      protocol: PROBE_HTTP
      port: 80
      requestPath: /healthz
      intervalInSeconds: 15 # default from spec
      numberOfProbes: 2 # default from spec
  rules:
    - name: http
      protocol: TCP
      frontendPort: 80
      backendPort: 80
      backendPoolNames: [web]
      probeName: http-health
      # Fail fast on idle drops -- production TCP rules generally want this.
      tcpResetEnabled: true
    - name: https
      protocol: TCP
      frontendPort: 443
      backendPort: 443
      backendPoolNames: [web]
      probeName: http-health
      tcpResetEnabled: true
