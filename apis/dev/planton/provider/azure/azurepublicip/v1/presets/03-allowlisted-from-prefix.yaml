apiVersion: azure.planton.dev/v1
kind: AzurePublicIp
metadata:
  name: my-prefix-allocated-ip
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: partner-endpoint-pip
  zones:
    - "1"
    - "2"
    - "3"
  publicIpPrefixId:
    valueFrom:
      name: <your-public-ip-prefix-resource-name>
