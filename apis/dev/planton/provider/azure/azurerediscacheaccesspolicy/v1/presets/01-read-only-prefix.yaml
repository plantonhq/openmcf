apiVersion: azure.planton.dev/v1
kind: AzureRedisCacheAccessPolicy
metadata:
  name: my-read-only-policy
spec:
  redisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  policyName: <policyName>
  # Read commands and connection management, scoped to ONE key prefix --
  # finer than the built-in "Data Reader" (which reads every key).
  permissions: "+@read +@connection ~<keyPrefix>:*"
