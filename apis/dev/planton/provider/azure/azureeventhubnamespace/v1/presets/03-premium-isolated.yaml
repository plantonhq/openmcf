apiVersion: azure.planton.dev/v1
kind: AzureEventHubNamespace
metadata:
  name: my-premium-hubs
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-streaming-rg
      fieldPath: status.outputs.resource_group_name
  namespaceName: myorg-premium-hubs
  # PREMIUM: reserved processing units with predictable latency, dynamic
  # partition scale-up, and extended retention. Moving into or out of
  # PREMIUM later replaces the namespace -- choose it deliberately.
  sku: PREMIUM
  # Processing units of reserved compute (1, 2, 4, 8, or 16). One PU
  # fits most workloads to start; scaling updates in place.
  capacity: 1
  # The namespace's identity -- capture and CMK authenticate with it.
  identity:
    type: SYSTEM_ASSIGNED
  tags:
    workload-tier: latency-sensitive
