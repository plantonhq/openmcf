apiVersion: azure.planton.dev/v1
kind: AzureServiceBusTopic
metadata:
  name: my-event-topic
spec:
  namespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: my-app-bus
      fieldPath: status.outputs.namespace_id
  topicName: order-events
  # Bounded retention: undelivered events older than two weeks are
  # removed (subscriptions may set shorter TTLs of their own).
  defaultMessageTtl: P14D
