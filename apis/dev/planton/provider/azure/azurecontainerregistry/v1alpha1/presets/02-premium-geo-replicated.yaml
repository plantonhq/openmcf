apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerRegistry
metadata:
  name: my-container-registry
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  registryName: yourregistry123  # REPLACE: globally unique, 5-50 lowercase alphanumerics
  sku: PREMIUM
  adminUserEnabled: false
  zoneRedundancyEnabled: true
  retentionPolicyInDays: 30  # purge untagged manifests after a month of CI churn
  georeplications:
    - location: <secondary-azure-region>
      zoneRedundancyEnabled: true
