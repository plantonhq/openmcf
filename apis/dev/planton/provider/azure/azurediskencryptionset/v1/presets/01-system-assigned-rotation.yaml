apiVersion: azure.planton.dev/v1
kind: AzureDiskEncryptionSet
metadata:
  name: my-disk-encryption-set
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: prod-des
  keyVaultKeyId:
    valueFrom:
      name: <disk-cmk-key>
  autoKeyRotationEnabled: true
  identity:
    type: SYSTEM_ASSIGNED
  tags:
    cost-center: <cost-center>
