syntax = "proto3";

package dev.planton.provider.azure.azurecontainerappenvironmentcertificate.v1alpha1;

import "dev/planton/provider/azure/azurecontainerappenvironmentcertificate/v1alpha1/api.proto";
import "dev/planton/provider/azure/provider.proto";

// AzureContainerAppEnvironmentCertificateStackInput is the input to the IaC module.
