apiVersion: azure.planton.dev/v1
kind: AzureContainerAppEnvironmentCertificate
metadata:
  name: my-key-vault-certificate
spec:
  certificateName: app.example.com
  containerAppEnvironmentId:
    valueFrom:
      kind: AzureContainerAppEnvironment
      name: <your-environment>
      fieldPath: status.outputs.environment_id
  certificateKeyVault:
    # Versionless secret face: the environment follows certificate
    # renewals automatically. A versioned URL would pin one version
    # forever.
    keyVaultSecretId:
      valueFrom:
        kind: AzureKeyVaultCertificate
        name: <your-certificate>
        fieldPath: status.outputs.versionless_secret_id
