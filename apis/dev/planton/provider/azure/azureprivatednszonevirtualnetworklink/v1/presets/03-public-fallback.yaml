apiVersion: azure.planton.dev/v1
kind: AzurePrivateDnsZoneVirtualNetworkLink
metadata:
  name: shared-zone-link
spec:
  # Replace with the link name -- one per VNet, so the VNet's name is the
  # natural choice.
  name: shared-vnet-link
  privateDnsZoneId:
    value: <private-dns-zone-arm-id>
  virtualNetworkId:
    value: <virtual-network-arm-id>
  resolutionPolicy: NX_DOMAIN_REDIRECT
