apiVersion: azure.planton.dev/v1
kind: AzureServicePlan
metadata:
  name: my-consumption-plan
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  servicePlanName: my-consumption-plan
  # LINUX is the spec default -- stated here for clarity.
  osType: LINUX
  # Consumption: Function Apps pay-per-execution -- scales to 200
  # instances automatically, bills per GB-second, cold starts apply.
  # For pre-warmed instances (no cold start) use ELASTIC_PREMIUM_EP1.
  skuName: CONSUMPTION_Y1
