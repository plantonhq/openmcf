apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageTable
metadata:
  name: my-audit-trail
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # Append-heavy tables conventionally partition by time bucket or
  # tenant so writes spread and range scans stay cheap.
  # Replace: 3-63 alphanumerics starting with a letter (no hyphens; the
  # literal word "table" is reserved).
  tableName: AuditTrail
