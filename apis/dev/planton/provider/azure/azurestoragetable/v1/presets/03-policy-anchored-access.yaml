apiVersion: azure.planton.dev/v1
kind: AzureStorageTable
metadata:
  name: my-shared-readonly
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # Replace: 3-63 alphanumerics starting with a letter (no hyphens; the
  # literal word "table" is reserved).
  tableName: SharedEntities
  # Stored access policies anchor SAS tokens: shortening or deleting a
  # policy IMMEDIATELY revokes every token issued against it. Table
  # policies require the full validity window.
  acls:
    - id: external-readers
      accessPolicies:
        # r = read/query only -- external consumers can query entities
        # but never add, update, or delete.
        - permissions: r
          start: "<window-start-rfc3339>"
          expiry: "<window-expiry-rfc3339>"
