syntax = "proto3";

package dev.planton.provider.azure.azurestoragetable.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurestoragetable/v1/spec.proto";
import "dev/planton/provider/azure/azurestoragetable/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureStorageTable is the top-level API resource for a Storage table --
// the serverless NoSQL key/value store of Azure storage, living inside
// an AzureStorageAccount (referenced via storage_account_id).
// Applications store schemaless entities by partition + row key; stored
// access policies are set per table.
message AzureStorageTable {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureStorageTable'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureStorageTableSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureStorageTableStatus status = 5;
}

// AzureStorageTableStatus holds the deployment status and outputs.
message AzureStorageTableStatus {
  // stack-outputs
  AzureStorageTableStackOutputs outputs = 1;
}
