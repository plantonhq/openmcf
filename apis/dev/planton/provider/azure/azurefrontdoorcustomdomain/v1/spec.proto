syntax = "proto3";

package dev.planton.provider.azure.azurefrontdoorcustomdomain.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";

// **AzureFrontDoorCustomDomainSpec** defines the configuration for
// creating a custom domain inside an Azure Front Door (Standard/Premium)
// profile -- your own hostname (e.g. www.example.com) served by Front
// Door instead of the generated *.azurefd.net endpoint hostname.
//
// A custom domain has a two-step lifecycle:
//
//  1. **Create** -- the domain deploys immediately in a
//     pending-validation state and exports a validation_token.
//  2. **Validate** -- publish the token as a DNS TXT record at
//     `_dnsauth.<host_name>` (Azure checks it and flips the domain to
//     approved), then CNAME the hostname at your DNS provider to the
//     endpoint's host_name output so traffic actually arrives.
//
// When dns_zone_id references an AzureDnsZone, Azure watches that zone
// for the records; the records themselves are DNS resources you manage
// in the zone. After validation, attach the domain to routes via
// AzureFrontDoorRoute's custom_domain_ids -- the route side owns the
// attachment.
//
// TLS is always on for custom domains: either Azure manages the
// certificate end to end (MANAGED_CERTIFICATE, the default -- free,
// auto-rotated), or the domain uses a bring-your-own certificate wrapped
// by an AzureFrontDoorSecret (CUSTOMER_CERTIFICATE -- for EV/OV
// certificates, pinned chains, or org-mandated CAs).
//
// **ForceNew fields**: `profile_id`, `domain_name`, `host_name` -- they
// fix the domain's ARM identity and the hostname it proves ownership
// of. The TLS block and dns_zone_id update in place.
message AzureFrontDoorCustomDomainSpec {
  // The Front Door profile the custom domain lives in, by ARM ID.
  // References an AzureFrontDoorProfile's profile_id output so the
  // profile and its domains compose in one manifest set. Fixed at
  // creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef profile_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureFrontDoorProfile,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.profile_id"
  ];

  // The domain resource's name -- unique within the profile. This is
  // the ARM resource name, NOT the hostname (that is host_name);
  // convention is the hostname with dots replaced by hyphens, e.g.
  // "www-example-com".
  //
  // 2-260 characters; letters, digits, and hyphens; must start and end
  // with a letter or digit.
  //
  // **ForceNew**: changing the name replaces the domain (re-validation
  // required).
  string domain_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "front_door_custom_domain_name_format"
      message: "domain_name must be 2-260 characters, start and end with a letter or digit, and contain only letters, digits, and hyphens (dots are not allowed -- this is the resource name, not the hostname)"
      expression: "this.matches('^[a-zA-Z0-9][a-zA-Z0-9-]{0,258}[a-zA-Z0-9]$')"
    }
  ];

  // The hostname this domain serves, e.g. "www.example.com" or the
  // wildcard "*.example.com" (wildcards need a CUSTOMER_CERTIFICATE --
  // Azure's managed certificates do not cover them). Must be a fully
  // qualified domain name you control: validation publishes a TXT
  // record under it, and serving traffic requires a CNAME from it to
  // the endpoint's hostname.
  //
  // **ForceNew**: the hostname IS the domain's identity.
  string host_name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 253,
    (buf.validate.field).cel = {
      id: "front_door_custom_domain_host_name_format"
      message: "host_name must be a fully qualified domain name of dot-separated labels (each 1-63 characters, letters/digits/hyphens, not starting or ending with a hyphen); only the FIRST label may be the wildcard '*'"
      expression: "this.matches('^(\\\\*|[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)(\\\\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$')"
    }
  ];

  // The Azure DNS zone that hosts this hostname's records, by ARM ID.
  // References an AzureDnsZone's zone_id output. Optional -- set it
  // when the domain's DNS lives in Azure DNS so Front Door watches the
  // zone for the validation TXT record; leave unset when DNS is hosted
  // elsewhere (validation then relies on you publishing the token at
  // your external provider).
  dev.planton.shared.foreignkey.v1.StringValueOrRef dns_zone_id = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureDnsZone,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.zone_id"
  ];

  // The domain's TLS configuration. Required -- custom domains always
  // terminate TLS. Leave the block at its defaults for an Azure-managed
  // certificate.
  AzureFrontDoorCustomDomainTls tls = 5 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "front_door_custom_domain_managed_cert_host_name"
    message: "with an Azure-managed certificate the host_name cannot exceed 64 characters and cannot be a wildcard -- use a CUSTOMER_CERTIFICATE (an AzureFrontDoorSecret wrapping your own certificate) for wildcard or very long hostnames"
    expression: "(has(this.tls) && this.tls.certificate_type == 2) || (this.host_name.size() <= 64 && !this.host_name.startsWith('*'))"
  };
}

// AzureFrontDoorCustomDomainTls configures how the domain terminates
// TLS: who provides the certificate and, optionally, a hardened cipher
// suite policy. The minimum TLS version is not configurable -- Azure
// retired TLS 1.0/1.1 in March 2025, so every custom domain floors at
// TLS 1.2 (TLS 1.3 is always offered on top).
message AzureFrontDoorCustomDomainTls {
  // Who provides the certificate. MANAGED_CERTIFICATE (default when
  // unspecified): Azure issues, hosts, and auto-rotates a free DV
  // certificate for the exact hostname. CUSTOMER_CERTIFICATE: the
  // domain serves the certificate wrapped by the AzureFrontDoorSecret
  // referenced in secret_id -- required for wildcard hostnames and for
  // EV/OV or org-mandated certificates.
  AzureFrontDoorCustomDomainCertificateType certificate_type = 1 [(buf.validate.field).enum.defined_only = true];

  // The Front Door secret carrying the bring-your-own certificate, by
  // ARM ID. References an AzureFrontDoorSecret's secret_id output.
  // Required with CUSTOMER_CERTIFICATE; must stay unset with
  // MANAGED_CERTIFICATE (Azure provides the certificate -- there is
  // nothing to reference).
  dev.planton.shared.foreignkey.v1.StringValueOrRef secret_id = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureFrontDoorSecret,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_id"
  ];

  // A hardened cipher-suite policy for the domain's TLS handshakes.
  // Unset serves Azure's default suite set. Set it to pin one of
  // Azure's predefined suite sets or to hand-pick suites (CUSTOMIZED)
  // when a compliance baseline demands specific ciphers.
  AzureFrontDoorCustomDomainCipherSuite cipher_suite = 3;

  option (buf.validate.message).cel = {
    id: "front_door_custom_domain_tls_secret_pairing"
    message: "secret_id is required with CUSTOMER_CERTIFICATE (it names the certificate to serve) and must stay unset with MANAGED_CERTIFICATE (Azure provides the certificate)"
    expression: "this.certificate_type == 2 ? has(this.secret_id) : !has(this.secret_id)"
  };
}

// Who provides a custom domain's TLS certificate.
enum AzureFrontDoorCustomDomainCertificateType {
  // Not specified -- deploys MANAGED_CERTIFICATE, Azure's default.
  azure_front_door_custom_domain_certificate_type_unspecified = 0;

  // Azure issues, hosts, and auto-rotates a free DV certificate for the
  // exact hostname (no wildcards; hostname up to 64 characters).
  MANAGED_CERTIFICATE = 1;

  // The domain serves a bring-your-own certificate wrapped by the
  // AzureFrontDoorSecret referenced in secret_id.
  CUSTOMER_CERTIFICATE = 2;
}

// AzureFrontDoorCustomDomainCipherSuite pins the TLS cipher suites the
// domain negotiates -- either one of Azure's predefined sets or a
// hand-picked (CUSTOMIZED) selection.
message AzureFrontDoorCustomDomainCipherSuite {
  // The suite-set policy. TLS12_2022 and TLS12_2023 are Azure's
  // predefined hardened sets (year-versioned; the custom_ciphers lists
  // must stay unset with them). CUSTOMIZED serves exactly the suites
  // listed in custom_ciphers.
  AzureFrontDoorCustomDomainCipherSuiteSetType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The hand-picked suites for the CUSTOMIZED type. Required with
  // CUSTOMIZED; forbidden with the predefined sets.
  AzureFrontDoorCustomDomainCustomCiphers custom_ciphers = 2;

  option (buf.validate.message).cel = {
    id: "front_door_cipher_suite_customized_pairing"
    message: "custom_ciphers is required when type is CUSTOMIZED (it lists the suites to serve) and must stay unset with the predefined TLS12_2022 / TLS12_2023 sets"
    expression: "this.type == 3 ? has(this.custom_ciphers) : !has(this.custom_ciphers)"
  };
}

// Azure's cipher-suite set policies for Front Door custom domains.
enum AzureFrontDoorCustomDomainCipherSuiteSetType {
  // Not specified -- invalid; pick a predefined set or CUSTOMIZED.
  azure_front_door_custom_domain_cipher_suite_set_type_unspecified = 0;

  // Azure's 2022 hardened TLS 1.2 suite set.
  TLS12_2022 = 1;

  // Azure's 2023 hardened TLS 1.2 suite set (the most current
  // predefined policy).
  TLS12_2023 = 2;

  // Serve exactly the suites listed in custom_ciphers.
  CUSTOMIZED = 3;
}

// AzureFrontDoorCustomDomainCustomCiphers lists the exact suites a
// CUSTOMIZED cipher policy serves, per TLS version. At least one TLS 1.2
// suite is required (the domain floors at TLS 1.2, so an empty 1.2 list
// would leave nothing to negotiate below 1.3).
message AzureFrontDoorCustomDomainCustomCiphers {
  // The TLS 1.2 suites to serve, from Azure's allowed ECDHE-RSA set. At
  // least one.
  repeated string tls12 = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      cel: {
        id: "front_door_custom_cipher_tls12_value"
        message: "each TLS 1.2 suite must be one of Azure's allowed set: ECDHE_RSA_AES128_GCM_SHA256, ECDHE_RSA_AES256_GCM_SHA384, ECDHE_RSA_AES128_SHA256, ECDHE_RSA_AES256_SHA384"
        expression: "this in ['ECDHE_RSA_AES128_GCM_SHA256', 'ECDHE_RSA_AES256_GCM_SHA384', 'ECDHE_RSA_AES128_SHA256', 'ECDHE_RSA_AES256_SHA384']"
      }
    }
  }];

  // The TLS 1.3 suites to serve. Leave empty to let Azure serve its
  // TLS 1.3 defaults; when set explicitly, Azure requires BOTH suites
  // to be listed (TLS 1.3 mandates them).
  repeated string tls13 = 2 [
    (buf.validate.field).repeated = {
      unique: true
      items: {
        cel: {
          id: "front_door_custom_cipher_tls13_value"
          message: "each TLS 1.3 suite must be one of: TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384"
          expression: "this in ['TLS_AES_128_GCM_SHA256', 'TLS_AES_256_GCM_SHA384']"
        }
      }
    },
    (buf.validate.field).cel = {
      id: "front_door_custom_cipher_tls13_both"
      message: "when tls13 is set it must list BOTH TLS_AES_128_GCM_SHA256 and TLS_AES_256_GCM_SHA384 -- TLS 1.3 mandates both suites; leave the list empty to serve Azure's defaults"
      expression: "this.size() == 0 || this.size() == 2"
    }
  ];
}
