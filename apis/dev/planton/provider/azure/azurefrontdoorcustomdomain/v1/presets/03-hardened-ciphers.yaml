apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorCustomDomain
metadata:
  name: my-hardened-domain
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  domainName: secure-example-com
  hostName: secure.example.com
  tls:
    # Managed certificate with a pinned cipher policy -- certificate
    # provenance and cipher hardening are independent choices.
    cipherSuite:
      type: CUSTOMIZED
      customCiphers:
        # GCM-only TLS 1.2 suites (drops the CBC pair).
        tls12: [ECDHE_RSA_AES128_GCM_SHA256, ECDHE_RSA_AES256_GCM_SHA384]
        # When pinned explicitly, TLS 1.3 requires both suites.
        tls13: [TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384]
