apiVersion: azure.planton.dev/v1
kind: AzureNatGateway
metadata:
  name: my-prefix-nat-gateway
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: egress-nat
  zones:
    - "1"
  publicIpPrefixIds:
    - valueFrom:
        name: <your-public-ip-prefix-resource-name>
