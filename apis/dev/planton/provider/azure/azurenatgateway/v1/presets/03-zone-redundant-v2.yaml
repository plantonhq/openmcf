apiVersion: azure.planton.dev/v1
kind: AzureNatGateway
metadata:
  name: my-v2-nat-gateway
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: egress-nat-v2
  skuName: STANDARD_V2
  publicIpIds:
    - valueFrom:
        name: <your-standardv2-public-ip-resource-name>
