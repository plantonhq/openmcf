apiVersion: azure.planton.dev/v1
kind: AzureSubnet
metadata:
  name: my-container-apps-subnet
spec:
  virtualNetworkId:
    value: "<vnet-resource-id>"
  name: container-apps
  addressPrefixes:
    - 10.0.4.0/21  # /21 = 2,048 IPs — minimum recommended for Container Apps
  delegations:
    - name: container-apps-delegation
      serviceName: Microsoft.App/environments
      actions:
        - Microsoft.Network/virtualNetworks/subnets/join/action
