apiVersion: azure.planton.dev/v1
kind: AzureKeyVaultKey
metadata:
  name: prod-cmk
spec:
  name: prod-cmk
  keyVaultId:
    value: <key-vault-arm-id>
  keyType: RSA_HSM
  keySize: 2048
  keyOpts:
    - WRAP_KEY
    - UNWRAP_KEY
  rotationPolicy:
    expireAfter: P2Y
    notifyBeforeExpiry: P30D
    automatic:
      timeAfterCreation: P335D
  tags:
    purpose: <purpose>
