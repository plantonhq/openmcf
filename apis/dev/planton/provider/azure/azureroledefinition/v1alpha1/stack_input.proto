syntax = "proto3";

package dev.planton.provider.azure.azureroledefinition.v1alpha1;

import "dev/planton/provider/azure/azureroledefinition/v1alpha1/api.proto";
import "dev/planton/provider/azure/provider.proto";

// AzureRoleDefinitionStackInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureRoleDefinitionStackInput {
  // target cloud-resource to be deployed
  AzureRoleDefinition target = 1;
  // provider-config for Azure authentication
  dev.planton.provider.azure.AzureProviderConfig provider_config = 2;
}
