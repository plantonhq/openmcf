# AzureUserAssignedIdentity install profile used as a prerequisite by composed
# components (declared via prerequisites: [AzureUserAssignedIdentity] in the
# kind registry). The E2E harness deploys this document (via the identity's
# Pulumi module) after its own prerequisite (the fixture resource group, whose
# name the resource_group reference below addresses), and captures its outputs
# -- principal_id in particular -- for dependents' references to resolve
# against. The identity deliberately carries NO role assignments: a component
# that references an identity never mutates its grants, so any consumer that
# needs a grant (e.g. the role-assignment component under test) provisions it
# itself.
apiVersion: azure.planton.dev/v1
kind: AzureUserAssignedIdentity
metadata:
  name: planton-oss-e2e-azure-fixture-identity
  id: planton-oss-e2e-azure-fixture-identity
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: azureuserassignedidentity
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-identity
