apiVersion: azure.planton.dev/v1
kind: AzureStorageQueue
metadata:
  name: my-event-ingest
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # Replace: 3-63 lowercase letters, digits, and single hyphens.
  queueName: telemetry-ingest
  metadata:
    purpose: ingest-buffer
    producer: <producer-system>
