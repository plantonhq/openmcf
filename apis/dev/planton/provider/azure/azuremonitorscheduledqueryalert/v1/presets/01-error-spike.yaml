# Error-spike query alert -- the row-count shape: more than 10 error
# rows in 10 minutes fires the on-call action group. The bread-and-butter
# log alert every service carries.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorScheduledQueryAlert
metadata:
  name: my-error-spike
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  alertName: app-error-spike
  scope:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: my-platform-logs
      fieldPath: status.outputs.workspace_id
  displayName: Application error spike
  description: More than 10 application exceptions in 10 minutes -- check the latest deploy and the exception details in the workspace.
  severity: 2
  evaluationFrequency: PT5M
  windowDuration: PT10M
  criteria:
    - query: |
        AppExceptions
        | where TimeGenerated > ago(10m)
      timeAggregationMethod: COUNT
      operator: GREATER_THAN
      threshold: 10
      failingPeriods:
        minimumFailingPeriodsToTriggerAlert: 1
        numberOfEvaluationPeriods: 1
  autoMitigationEnabled: true
  action:
    actionGroupIds:
      - valueFrom:
          kind: AzureMonitorActionGroup
          name: my-platform-oncall
          fieldPath: status.outputs.action_group_id
    emailSubject: "[ALERT] Application error spike"
  tags:
    team: platform
