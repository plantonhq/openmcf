# Missing-heartbeat alert -- the absence-of-data pattern: fire when
# fewer heartbeats than expected arrive, catching dead agents and
# silent pipelines. Mutes repeats for an hour instead of auto-resolving
# (a thing that stopped reporting cannot report recovery).
apiVersion: azure.planton.dev/v1
kind: AzureMonitorScheduledQueryAlert
metadata:
  name: my-heartbeat-watch
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  alertName: agents-missing-heartbeat
  scope:
    valueFrom:
      kind: AzureLogAnalyticsWorkspace
      name: my-platform-logs
      fieldPath: status.outputs.workspace_id
  displayName: Agents stopped reporting
  description: Heartbeat volume dropped below the expected floor -- an agent, VM, or ingestion pipeline went silent.
  severity: 1
  evaluationFrequency: PT5M
  windowDuration: PT15M
  criteria:
    - query: |
        Heartbeat
        | where TimeGenerated > ago(15m)
      timeAggregationMethod: COUNT
      operator: LESS_THAN
      threshold: 1
  muteActionsAfterAlertDuration: PT1H
  action:
    actionGroupIds:
      - valueFrom:
          kind: AzureMonitorActionGroup
          name: my-platform-oncall
          fieldPath: status.outputs.action_group_id
  tags:
    team: platform
