apiVersion: azure.planton.dev/v1
kind: AzureCosmosdbSqlRoleDefinition
metadata:
  name: my-read-only-role
spec:
  cosmosdbAccountId:
    valueFrom:
      kind: AzureCosmosdbAccount
      name: <cosmosdb-account-resource-name>
      fieldPath: status.outputs.cosmosdb_account_id
  # The display name operators see when auditing grants -- unique
  # among the account's role definitions.
  roleName: read-only
  # Assignable anywhere in the account -- the common posture for a
  # general-purpose role.
  assignableScopes:
    - valueFrom:
        kind: AzureCosmosdbAccount
        name: <cosmosdb-account-resource-name>
        fieldPath: status.outputs.cosmosdb_account_id
  permissions:
    - dataActions:
        # SDKs read metadata before any data operation -- include it
        # in practically every role.
        - Microsoft.DocumentDB/databaseAccounts/readMetadata
        # Point reads, SQL queries, and the change feed -- the full
        # read surface, no writes.
        - Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/read
        - Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery
        - Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/readChangeFeed
