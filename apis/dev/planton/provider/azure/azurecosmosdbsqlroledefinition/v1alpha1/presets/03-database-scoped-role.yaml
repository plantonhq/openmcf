apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbSqlRoleDefinition
metadata:
  name: my-database-scoped-role
spec:
  cosmosdbAccountId:
    valueFrom:
      kind: AzureCosmosdbAccount
      name: <cosmosdb-account-resource-name>
      fieldPath: status.outputs.cosmosdb_account_id
  roleName: <database-name>-operator
  # Assignable ONLY inside one database: grants of this role at the
  # account level or in any other database are rejected by Azure.
  # Database paths are literals composed on the account's ARM ID
  # (references cannot append path suffixes).
  assignableScopes:
    - value: /subscriptions/<subscription-id>/resourceGroups/<resource-group-name>/providers/Microsoft.DocumentDB/databaseAccounts/<account-name>/dbs/<database-name>
  permissions:
    - dataActions:
        - Microsoft.DocumentDB/databaseAccounts/readMetadata
        # The full item surface -- reads, queries, change feed, and
        # all four write operations -- inside the one database this
        # role is assignable in.
        - Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/*
        - Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery
        - Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/readChangeFeed
