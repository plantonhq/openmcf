apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azurefrontdoorroute
spec:
  # The composed chain: the harness deploys the fixture resource group,
  # the Front Door profile, the endpoint, the origin group, and the
  # origin (registry prerequisites, transitively deduplicated), creates
  # the route with caching and HTTPS redirect, verifies it via the ARM
  # API, destroys it, and verifies it is gone -- on both provisioners.
  # This scenario live-proves the whole traffic-serving graph. Observed
  # runs ~25-27 min per engine (four fixtures + the route; teardown
  # dominated by the profile fixture's ~18-min deletion).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
