apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorRoute
metadata:
  name: my-api-route
spec:
  endpointId:
    valueFrom:
      kind: AzureFrontDoorEndpoint
      name: <endpoint-resource-name>
      fieldPath: status.outputs.endpoint_id
  routeName: api-route
  originGroupId:
    valueFrom:
      kind: AzureFrontDoorOriginGroup
      name: <origin-group-resource-name>
      fieldPath: status.outputs.origin_group_id
  patternsToMatch:
    - /api/*
  # HTTPS only, no redirect: API clients should fail loudly on HTTP,
  # not follow a 301 (many HTTP clients re-send POST bodies badly).
  supportedProtocols:
    - HTTPS
  httpsRedirectEnabled: false
  # Keep the origin leg encrypted regardless of anything else.
  forwardingProtocol: HTTPS_ONLY
  # Prepended on the origin side: a request for /api/users fetches
  # /v1/api/users from the backend -- how one origin hosts several
  # routes' content under distinct directories. Remove when the backend
  # serves the public paths as-is.
  originPath: /v1
