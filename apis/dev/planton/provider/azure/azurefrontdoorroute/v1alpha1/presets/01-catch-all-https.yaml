apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorRoute
metadata:
  name: my-default-route
spec:
  endpointId:
    valueFrom:
      kind: AzureFrontDoorEndpoint
      name: <endpoint-resource-name>
      fieldPath: status.outputs.endpoint_id
  routeName: default-route
  originGroupId:
    valueFrom:
      kind: AzureFrontDoorOriginGroup
      name: <origin-group-resource-name>
      fieldPath: status.outputs.origin_group_id
  # When deploying the whole chain together, list the group's origins so
  # the route provisions after they exist (ARM rejects a route whose
  # origin group is empty). Azure never receives this list.
  originIds:
    - valueFrom:
        kind: AzureFrontDoorOrigin
        name: <origin-resource-name>
        fieldPath: status.outputs.origin_id
  # Everything: the default route for the endpoint.
  patternsToMatch:
    - /*
  # Both protocols + the default HTTPS redirect: HTTP arrives only to be
  # 301'd to HTTPS.
  supportedProtocols:
    - HTTP
    - HTTPS
