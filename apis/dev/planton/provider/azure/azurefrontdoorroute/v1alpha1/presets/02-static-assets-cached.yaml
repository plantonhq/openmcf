apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorRoute
metadata:
  name: my-static-route
spec:
  endpointId:
    valueFrom:
      kind: AzureFrontDoorEndpoint
      name: <endpoint-resource-name>
      fieldPath: status.outputs.endpoint_id
  routeName: static-assets
  originGroupId:
    valueFrom:
      kind: AzureFrontDoorOriginGroup
      name: <origin-group-resource-name>
      fieldPath: status.outputs.origin_group_id
  # Only the static paths -- the catch-all route handles the rest.
  patternsToMatch:
    - /static/*
    - /assets/*
  supportedProtocols:
    - HTTP
    - HTTPS
  # Edge caching is the point of this route: one cache entry per URL
  # (query strings ignored -- static assets version by path), with
  # compression for the text-based types.
  cache:
    queryStringCachingBehavior: IGNORE_QUERY_STRING
    compressionEnabled: true
    contentTypesToCompress:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - image/svg+xml
      - font/ttf
      - font/otf
