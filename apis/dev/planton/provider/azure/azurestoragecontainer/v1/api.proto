syntax = "proto3";

package dev.planton.provider.azure.azurestoragecontainer.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurestoragecontainer/v1/spec.proto";
import "dev/planton/provider/azure/azurestoragecontainer/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureStorageContainer is the top-level API resource for a blob container
// -- the namespace unit of Azure blob storage, living inside an
// AzureStorageAccount (referenced via storage_account_id). Applications
// organize objects into containers per data domain; access posture,
// encryption scope, and RBAC data roles are set per container.
message AzureStorageContainer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureStorageContainer'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureStorageContainerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureStorageContainerStatus status = 5;
}

// AzureStorageContainerStatus holds the deployment status and outputs.
message AzureStorageContainerStatus {
  // stack-outputs
  AzureStorageContainerStackOutputs outputs = 1;
}
