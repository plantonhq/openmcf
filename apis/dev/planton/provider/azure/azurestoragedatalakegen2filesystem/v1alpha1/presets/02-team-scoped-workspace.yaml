apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: my-team-workspace
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  filesystemName: analytics-team
  # A named Entra group owns the workspace root -- team membership IS
  # the access list, managed in Entra instead of per-filesystem. (A
  # workload identity in the same graph would be referenced instead:
  # valueFrom an AzureUserAssignedIdentity's principal_id output.)
  group:
    value: <team-entra-group-object-id>
  aces:
    - type: USER
      permissions: rwx
    - type: GROUP
      permissions: rwx
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: GROUP
      permissions: rwx
  properties:
    team: YW5hbHl0aWNz
