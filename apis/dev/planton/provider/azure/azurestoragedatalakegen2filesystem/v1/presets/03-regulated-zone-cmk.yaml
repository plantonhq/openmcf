apiVersion: azure.planton.dev/v1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: my-regulated-zone
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  filesystemName: regulated-zone
  # Everything landing in this zone encrypts under the referenced
  # scope's customer-managed key -- key custody for just the regulated
  # subset while the rest of the lake stays on platform keys.
  defaultEncryptionScope:
    valueFrom:
      kind: AzureStorageEncryptionScope
      name: <encryption-scope-resource-name>
      fieldPath: status.outputs.encryption_scope_name
  aces:
    - type: USER
      permissions: rwx
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: OTHER
      permissions: "---"
