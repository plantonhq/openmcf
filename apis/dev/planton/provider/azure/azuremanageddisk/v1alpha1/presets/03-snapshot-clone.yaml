apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedDisk
metadata:
  name: my-managed-disk
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: workload-data-restored  # REPLACE: name the DATA, not the VM
  storageAccountType: PREMIUM_LRS
  createOption: COPY
  sourceResourceId: <snapshot-or-disk-arm-id>
  zone: "1"
