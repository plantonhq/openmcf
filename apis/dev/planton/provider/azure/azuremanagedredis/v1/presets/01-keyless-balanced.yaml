apiVersion: azure.planton.dev/v1
kind: AzureManagedRedis
metadata:
  name: my-app-cache
spec:
  region: <region>
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  clusterName: my-app-cache
  # BALANCED is the general-purpose family; B1 = 1 GB. Azure allows many
  # SKU changes in place -- start small and scale.
  skuName: BALANCED_B1
  # High availability (the default): a replica and the zone-redundant
  # SLA. Disable only for dev/test (it halves the cost).
  highAvailabilityEnabled: true
  defaultDatabase:
    # The keyless posture -- and the Managed Redis DEFAULT: access keys
    # stay off and clients authenticate with Entra tokens under
    # AzureManagedRedisAccessPolicyAssignment grants. No secret exists
    # to leak or rotate.
    accessKeysAuthenticationEnabled: false
    # Evict any key, least-recently-used first -- the right policy for a
    # pure cache where every key is re-derivable. Keep the default
    # VOLATILE_LRU for mixed workloads.
    evictionPolicy: ALL_KEYS_LRU
