apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorSecurityPolicy
metadata:
  name: my-waf-attach
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  securityPolicyName: waf-attach
  firewallPolicyId:
    valueFrom:
      kind: AzureFrontDoorFirewallPolicy
      name: <firewall-policy-resource-name>
      fieldPath: status.outputs.firewall_policy_id
  # Protect the endpoint's generated *.azurefd.net hostname. Add
  # custom-domain references here as they come online -- the list
  # updates in place.
  domainIds:
    - valueFrom:
        kind: AzureFrontDoorEndpoint
        name: <front-door-endpoint-resource-name>
        fieldPath: status.outputs.endpoint_id
