apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorRuleSet
metadata:
  name: my-security-headers
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  ruleSetName: securityheaders
  rules:
    # One condition-less rule: it applies to EVERY request on any route
    # that attaches this set -- the cheapest way to enforce a security
    # baseline across an entire Front Door profile.
    - name: baseline
      order: 1
      actions:
        responseHeaders:
          - headerAction: OVERWRITE
            headerName: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - headerAction: OVERWRITE
            headerName: X-Content-Type-Options
            value: nosniff
          - headerAction: OVERWRITE
            headerName: Referrer-Policy
            value: strict-origin-when-cross-origin
          # Strip the backend's technology fingerprint before responses
          # leave the edge.
          - headerAction: DELETE
            headerName: X-Powered-By
