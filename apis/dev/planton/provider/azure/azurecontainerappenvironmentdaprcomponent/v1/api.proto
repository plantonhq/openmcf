syntax = "proto3";

package dev.planton.provider.azure.azurecontainerappenvironmentdaprcomponent.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurecontainerappenvironmentdaprcomponent/v1/spec.proto";
import "dev/planton/provider/azure/azurecontainerappenvironmentdaprcomponent/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureContainerAppEnvironmentDaprComponent is the top-level API resource
// for a Dapr component registered on a Container App Environment -- the
// pluggable backend (state store, pub/sub broker, secret store, binding)
// behind Dapr's building blocks, consumed by Dapr-enabled Container Apps.
message AzureContainerAppEnvironmentDaprComponent {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureContainerAppEnvironmentDaprComponent'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureContainerAppEnvironmentDaprComponentSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureContainerAppEnvironmentDaprComponentStatus status = 5;
}

// AzureContainerAppEnvironmentDaprComponentStatus holds the deployment status and outputs.
message AzureContainerAppEnvironmentDaprComponentStatus {
  // stack-outputs
  AzureContainerAppEnvironmentDaprComponentStackOutputs outputs = 1;
}
