apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsZone
metadata:
  name: pg-privatelink-zone
spec:
  resourceGroup:
    value: <resource-group-name>
  # The Azure-defined privatelink zone for the target service -- the name
  # must match exactly or endpoint DNS registration misses the zone.
  # Swap for another service's zone (see the preset notes for the table).
  name: privatelink.postgres.database.azure.com
  tags:
    cost-center: <cost-center>
