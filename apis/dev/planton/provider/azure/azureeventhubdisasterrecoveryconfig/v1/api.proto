syntax = "proto3";

package dev.planton.provider.azure.azureeventhubdisasterrecoveryconfig.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azureeventhubdisasterrecoveryconfig/v1/spec.proto";
import "dev/planton/provider/azure/azureeventhubdisasterrecoveryconfig/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureEventHubDisasterRecoveryConfig is the top-level API resource for an
// Event Hubs geo-disaster-recovery pairing -- continuous metadata
// replication between two namespaces in different regions, fronted by a
// failover-stable alias DNS name.
message AzureEventHubDisasterRecoveryConfig {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventHubDisasterRecoveryConfig'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureEventHubDisasterRecoveryConfigSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureEventHubDisasterRecoveryConfigStatus status = 5;
}

// AzureEventHubDisasterRecoveryConfigStatus holds the deployment status
// and outputs.
message AzureEventHubDisasterRecoveryConfigStatus {
  // stack-outputs
  AzureEventHubDisasterRecoveryConfigStackOutputs outputs = 1;
}
