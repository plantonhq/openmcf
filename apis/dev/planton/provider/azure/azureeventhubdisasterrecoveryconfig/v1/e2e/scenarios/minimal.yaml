# Minimal AzureEventHubDisasterRecoveryConfig scenario: pair two
# scenario-local STANDARD namespaces (eastus primary, westus2 partner)
# under a failover-stable alias -- proving the primary-id parse, the
# pairing create-and-settle, and the break-pair/name-release destroy
# choreography on both engines.
apiVersion: azure.planton.dev/v1
kind: AzureEventHubDisasterRecoveryConfig
metadata:
  name: planton-oss-e2e-azureeventhubdisasterrecoveryconfig-smoke
  id: planton-oss-e2e-azureeventhubdisasterrecoveryconfig-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: azureeventhubdisasterrecoveryconfig
  annotations:
    planton.dev/e2e: "true"
    # Deploy order: primary, then partner (both scenario-local -- the
    # globally-unique-name discipline; the alias name shares that
    # uniqueness scope too).
    planton.dev/e2e-prerequisites: "apis/dev/planton/provider/azure/azureeventhubdisasterrecoveryconfig/v1/e2e/fixture-namespace-primary.yaml,apis/dev/planton/provider/azure/azureeventhubdisasterrecoveryconfig/v1/e2e/fixture-namespace-partner.yaml"
  tags:
    - planton-e2e
spec:
  aliasName: pltn-oss-e2e-ehdr-alias
  primaryNamespaceId:
    valueFrom:
      name: planton-oss-e2e-ehdr-fixture-primary
  partnerNamespaceId:
    valueFrom:
      name: planton-oss-e2e-ehdr-fixture-partner
