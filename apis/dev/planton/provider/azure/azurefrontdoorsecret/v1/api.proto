syntax = "proto3";

package dev.planton.provider.azure.azurefrontdoorsecret.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurefrontdoorsecret/v1/spec.proto";
import "dev/planton/provider/azure/azurefrontdoorsecret/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureFrontDoorSecret is the top-level API resource for a secret inside
// an Azure Front Door profile (referenced via profile_id) -- the
// bring-your-own TLS certificate node wrapping an AzureKeyVaultCertificate.
// Custom domains (AzureFrontDoorCustomDomain) reference the secret via
// tls.secret_id to terminate TLS with the wrapped certificate.
message AzureFrontDoorSecret {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorSecret'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorSecretSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorSecretStatus status = 5;
}

// AzureFrontDoorSecretStatus holds the deployment status and outputs.
message AzureFrontDoorSecretStatus {
  // stack-outputs
  AzureFrontDoorSecretStackOutputs outputs = 1;
}
