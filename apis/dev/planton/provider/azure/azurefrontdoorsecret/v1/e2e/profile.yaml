apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azurefrontdoorsecret
spec:
  # The harness deploys the fixture resource group, the fixture Front
  # Door profile (registry prerequisite), and the Key Vault certificate
  # fixture chain (scenario-declared extra prerequisite: vault +
  # self-signed certificate), then creates the secret wrapping the
  # certificate's versionless id, verifies it via the ARM API, destroys
  # everything in reverse, and verifies removal -- on both provisioners.
  # The harness Setup pre-grants Front Door's service principal
  # "Key Vault Secrets User" at the subscription scope (one-time
  # bootstrap). Expect ~30 min per engine: the profile's ~18-min delete
  # plus the vault fixture's ~10-min purge dominate.
  tier: 1
  status: pending
  validated_provisioners: []
  timeout_minutes: 60
