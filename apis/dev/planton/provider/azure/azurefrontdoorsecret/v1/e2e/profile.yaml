apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azurefrontdoorsecret
spec:
  # The scenario composes fixture RG -> Front Door profile (registry
  # prerequisite) -> Key Vault + self-signed certificate (scenario
  # extra fixture) -> the secret. The harness Setup pre-grants Front
  # Door's service principal "Key Vault Secrets User" at the
  # subscription scope (one-time bootstrap).
  #
  # DEFERRED on live evidence (both engines hit ARM's identical content
  # validator): Azure REJECTS self-signed certificates for Front Door
  # BYO TLS -- BadRequest "The certificate chain includes an invalid
  # number of certificates. The number of certificates should be at
  # least 2." A passing run therefore needs a CA-ISSUED certificate,
  # which the test tenant cannot mint: the Key Vault certificate kind
  # issues Self or commercial-CA enrollments only, and committing a
  # pre-built chain's private key to the repo is not acceptable. What
  # the live run DID prove before the content rejection: the full
  # fixture chain deploys, the AFD service-principal grant authorizes
  # the vault read (no access-denied), the module's create is
  # well-formed (ARM evaluated the certificate content), and teardown
  # incl. the vault purge runs clean. Unblocking: import a CA-issued
  # certificate (full chain) into the fixture vault and re-run
  # unchanged.
  tier: 1
  status: deferred
  validated_provisioners: []
  timeout_minutes: 60
