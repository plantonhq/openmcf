apiVersion: azure.planton.dev/v1
kind: AzureServiceBusQueue
metadata:
  name: my-fifo-queue
spec:
  namespaceId:
    valueFrom:
      kind: AzureServiceBusNamespace
      name: my-app-bus
      fieldPath: status.outputs.namespace_id
  queueName: account-transactions
  # Fixed at creation: sessions group related messages by SessionId for
  # strict FIFO with exclusive consumption.
  requiresSession: true
  # Fixed at creation: retried sends within the window are dropped, so
  # producers can retry safely.
  requiresDuplicateDetection: true
  duplicateDetectionHistoryTimeWindow: PT10M
  # Longer lock for stateful, per-session processing.
  lockDuration: PT2M
  maxDeliveryCount: 10
