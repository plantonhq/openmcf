apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorOriginGroup
metadata:
  name: my-web-backends
spec:
  profileId:
    valueFrom:
      kind: AzureFrontDoorProfile
      name: <front-door-profile-resource-name>
      fieldPath: status.outputs.profile_id
  originGroupName: web-backends
  healthProbe:
    protocol: HTTPS
    intervalInSeconds: 60
    path: /
  # Sticky sessions: subsequent requests from the same client land on
  # the same origin -- required when sessions live in origin memory.
  sessionAffinityEnabled: true
  # Ramp traffic back onto a recovered origin over 20 minutes instead
  # of the 10-minute default -- gentler on cold caches and connection
  # pools after an outage.
  restoreTrafficTimeToHealedOrNewEndpointInMinutes: 20
