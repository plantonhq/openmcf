syntax = "proto3";

package dev.planton.provider.azure.azurecosmosdbsqlcontainer.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurecosmosdbsqlcontainer/v1/spec.proto";
import "dev/planton/provider/azure/azurecosmosdbsqlcontainer/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureCosmosdbSqlContainer is the top-level API resource for a SQL
// (NoSQL) API container inside a Cosmos DB database (referenced via
// sql_database_id) -- the unit of storage, indexing, and scale-out where
// documents actually live. Partition key, indexing policy, TTL, unique
// keys, conflict resolution, and dedicated throughput are set per
// container.
message AzureCosmosdbSqlContainer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbSqlContainer'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbSqlContainerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbSqlContainerStatus status = 5;
}

// AzureCosmosdbSqlContainerStatus holds the deployment status and outputs.
message AzureCosmosdbSqlContainerStatus {
  // stack-outputs
  AzureCosmosdbSqlContainerStackOutputs outputs = 1;
}
