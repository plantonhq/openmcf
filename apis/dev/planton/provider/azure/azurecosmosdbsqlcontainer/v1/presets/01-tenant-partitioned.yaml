apiVersion: azure.planton.dev/v1
kind: AzureCosmosdbSqlContainer
metadata:
  name: my-orders
spec:
  sqlDatabaseId:
    valueFrom:
      kind: AzureCosmosdbSqlDatabase
      name: my-app-data
      fieldPath: status.outputs.sql_database_id
  containerName: orders
  # A single high-cardinality partition key -- the workhorse shape.
  partitionKeyPaths:
    - /tenantId
  # Autoscale between 400 and 4000 RU/s: Azure follows the traffic
  # curve instead of billing the peak all day.
  autoscaleMaxThroughput: 4000
  # Exclude the bulky payload subtree from indexing: writes stop
  # paying RU to index bytes no query filters on. The declared policy
  # replaces Azure's default wholesale, so /* is included explicitly.
  indexingPolicy:
    includedPaths:
      - path: /*
    excludedPaths:
      - path: /payload/*
