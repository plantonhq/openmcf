apiVersion: azure.planton.dev/v1
kind: AzureFunctionApp
metadata:
  name: my-enterprise-fn
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  functionAppName: my-enterprise-fn
  servicePlanId:
    value: "<your-elastic-premium-plan-id>"
  storageAccountName:
    value: "<your-storage-account-name>"
  # Credential-free storage access: the app's identity holds Storage
  # Blob Data Owner + Storage Queue Data Contributor on the account.
  storageUsesManagedIdentity: true
  applicationInsightsConnectionString:
    value: "<your-app-insights-connection-string>"
  httpsOnly: true
  builtinLoggingEnabled: false
  publicNetworkAccessEnabled: true
  virtualNetworkSubnetId:
    value: "<your-vnet-subnet-id>"
  identity:
    type: SYSTEM_ASSIGNED
  # Basic-auth publishing disabled: deployments go through
  # identity-based paths only.
  webdeployPublishBasicAuthenticationEnabled: false
  ftpPublishBasicAuthenticationEnabled: false
  appSettings:
    ENVIRONMENT: production
    SERVICE_BUS_CONNECTION: "@Microsoft.KeyVault(SecretUri=https://<your-keyvault>.vault.azure.net/secrets/sb-connection)"
  siteConfig:
    applicationStack:
      pythonVersion: "3.12"
    healthCheckPath: /api/health
    appScaleLimit: 30
    elasticInstanceMinimum: 2
    preWarmedInstanceCount: 3
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    http2Enabled: true
    vnetRouteAllEnabled: true
    runtimeScaleMonitoringEnabled: true
    ipRestrictions:
      - name: allow-office
        priority: 100
        action: ALLOW
        ipAddress: 203.0.113.0/24
        description: Corporate office CIDR
      - name: allow-vpn
        priority: 200
        action: ALLOW
        ipAddress: 198.51.100.0/24
        description: VPN gateway CIDR
    ipRestrictionDefaultAction: DENY
    scmUseMainIpRestriction: true
    cors:
      allowedOrigins:
        - https://portal.example.com
      supportCredentials: true
