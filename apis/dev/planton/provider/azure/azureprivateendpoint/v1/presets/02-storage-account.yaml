apiVersion: azure.planton.dev/v1
kind: AzurePrivateEndpoint
metadata:
  name: my-blob-private-endpoint
spec:
  region: <azure-region>
  resourceGroup:
    value: <your-resource-group-name>
  name: <your-pe-name>
  subnetId:
    value: <subnet-resource-id>
  privateServiceConnection:
    privateConnectionResourceId:
      value: <storage-account-resource-id>
    subresourceNames:
      - blob
  privateDnsZoneIds:
    - value: <privatelink-blob-core-windows-net-zone-id>
