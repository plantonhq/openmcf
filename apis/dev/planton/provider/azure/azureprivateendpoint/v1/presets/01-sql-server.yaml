apiVersion: azure.planton.dev/v1
kind: AzurePrivateEndpoint
metadata:
  name: my-sql-private-endpoint
spec:
  region: <azure-region>
  resourceGroup:
    value: <your-resource-group-name>
  # Replace with the endpoint name (alphanumerics, underscores, periods,
  # hyphens; starts alphanumeric, ends alphanumeric or underscore).
  name: sql-private-endpoint
  subnetId:
    value: <subnet-resource-id>
  privateServiceConnection:
    privateConnectionResourceId:
      value: <sql-server-resource-id>
    subresourceNames:
      - sqlServer
  privateDnsZoneIds:
    - value: <privatelink-database-windows-net-zone-id>
