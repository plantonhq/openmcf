apiVersion: azure.planton.dev/v1
kind: AzurePrivateEndpoint
metadata:
  name: my-kv-private-endpoint
spec:
  region: <azure-region>
  resourceGroup:
    value: <your-resource-group-name>
  name: <your-pe-name>
  subnetId:
    value: <subnet-resource-id>
  privateServiceConnection:
    privateConnectionResourceId:
      value: <key-vault-resource-id>
    subresourceNames:
      - vault
  privateDnsZoneIds:
    - value: <privatelink-vaultcore-azure-net-zone-id>
