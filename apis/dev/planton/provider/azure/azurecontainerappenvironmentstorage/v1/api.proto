syntax = "proto3";

package dev.planton.provider.azure.azurecontainerappenvironmentstorage.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurecontainerappenvironmentstorage/v1/spec.proto";
import "dev/planton/provider/azure/azurecontainerappenvironmentstorage/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureContainerAppEnvironmentStorage is the top-level API resource for a
// Container App Environment storage registration -- an Azure Files share
// (SMB or NFS) registered on the environment so apps and jobs can mount it
// as persistent volumes.
message AzureContainerAppEnvironmentStorage {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureContainerAppEnvironmentStorage'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureContainerAppEnvironmentStorageSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureContainerAppEnvironmentStorageStatus status = 5;
}

// AzureContainerAppEnvironmentStorageStatus holds the deployment status and outputs.
message AzureContainerAppEnvironmentStorageStatus {
  // stack-outputs
  AzureContainerAppEnvironmentStorageStackOutputs outputs = 1;
}
