apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironmentStorage
metadata:
  name: my-nfs-data
spec:
  containerAppEnvironmentId:
    value: "<container-app-environment-id>"
  storageName: nfs-data
  shareName:
    value: "<azure-files-share-name>"
  accessMode: READ_WRITE
  nfsServerUrl: "<storage-account-name>.file.core.windows.net"
