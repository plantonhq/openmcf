# Commitment-tier workspace -- discounted ingestion for sustained
# high-volume estates (100+ GB/day). Switching between PerGB2018 and
# CapacityReservation updates in place; raising the tier restarts
# Azure's 31-day commitment period.
apiVersion: azure.planton.dev/v1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: my-central-logs
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  workspaceName: my-central-logs
  sku: CAPACITY_RESERVATION
  reservationCapacityInGbPerDay: 100
  retentionInDays: 180
  tags:
    cost-center: platform
