# Private, hardened workspace -- ingestion and queries forced through
# Azure Monitor Private Link Scope (AMPLS), shared keys disabled
# (Entra-only), workspace-context query permissions, and immediate purge
# after the retention window. The regulated-estate posture.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: my-regulated-logs
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: my-observability-rg
      fieldPath: status.outputs.resource_group_name
  workspaceName: my-regulated-logs
  sku: PER_GB_2018
  retentionInDays: 365
  localAuthenticationEnabled: false
  internetIngestionEnabled: false
  internetQueryEnabled: false
  allowResourceOnlyPermissions: false
  immediateDataPurgeOn30DaysEnabled: true
  tags:
    data-classification: confidential
