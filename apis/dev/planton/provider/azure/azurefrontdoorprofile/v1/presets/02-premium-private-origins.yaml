apiVersion: azure.planton.dev/v1
kind: AzureFrontDoorProfile
metadata:
  name: my-secure-front-door
spec:
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-name>
      fieldPath: status.outputs.resource_group_name
  profileName: my-secure-front-door
  # PREMIUM unlocks Private Link to origins (backends with public access
  # fully disabled) and the managed WAF rule sets. One-way: Azure
  # refuses a downgrade back to STANDARD.
  sku: PREMIUM
  # A system-assigned identity so Front Door can later read
  # bring-your-own TLS certificates from Key Vault without a secret.
  # Grant it Key Vault access (e.g. an AzureRoleAssignment on the
  # vault) using the identity_principal_id output.
  identity:
    type: SYSTEM_ASSIGNED
