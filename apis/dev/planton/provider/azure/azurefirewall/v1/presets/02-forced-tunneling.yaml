apiVersion: azure.planton.dev/v1
kind: AzureFirewall
metadata:
  name: hub-tunneled-fw
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: <resource-group-name>
  name: hub-tunneled-fw
  skuName: AZFW_VNET
  skuTier: STANDARD
  ipConfigurations:
    - name: primary
      subnetId:
        valueFrom:
          name: <firewall-subnet-name>
  managementIpConfiguration:
    name: management
    subnetId:
      valueFrom:
        name: <firewall-mgmt-subnet-name>
    publicIpAddressId:
      valueFrom:
        name: <firewall-mgmt-pip-name>
  firewallPolicyId:
    valueFrom:
      name: <firewall-policy-name>
  tags:
    cost-center: <cost-center>
