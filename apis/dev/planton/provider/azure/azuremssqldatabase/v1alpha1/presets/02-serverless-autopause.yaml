apiVersion: azure.planton.dev/v1alpha1
kind: AzureMssqlDatabase
metadata:
  name: serverless-database
spec:
  serverId:
    valueFrom:
      kind: AzureMssqlServer
      name: <server-resource-name>
      fieldPath: status.outputs.server_id
  # Replace with your database name (no <>*%&:\/? characters).
  databaseName: dev-scratch-db
  # Serverless: per-second billing that scales between the min-capacity
  # floor and the sku's vCore ceiling, pausing entirely when idle.
  skuName: GP_S_Gen5_2
  # Pause after an hour idle; storage is the only cost while paused.
  autoPauseDelayInMinutes: 60
  # Keep half a vCore warm to soften cold starts while active.
  minCapacity: 0.5
  maxSizeGb: 32
  tags:
    cost-center: <cost-center>
