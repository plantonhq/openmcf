syntax = "proto3";

package dev.planton.provider.azure.azuremssqldatabase.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azuremssqldatabase/v1/spec.proto";
import "dev/planton/provider/azure/azuremssqldatabase/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureMssqlDatabase is the top-level API resource for an Azure SQL
// Database on an AzureMssqlServer logical server. In Azure SQL's model the
// database is the unit of compute and billing -- it carries its own SKU
// (DTU/vCore/serverless/Hyperscale), storage ceiling, availability
// posture, backup retention, and encryption, or joins an
// AzureMssqlElasticPool to share pooled compute.
message AzureMssqlDatabase {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureMssqlDatabase'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureMssqlDatabaseSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureMssqlDatabaseStatus status = 5;
}

// AzureMssqlDatabaseStatus holds the deployment status and outputs.
message AzureMssqlDatabaseStatus {
  // stack-outputs
  AzureMssqlDatabaseStackOutputs outputs = 1;
}
