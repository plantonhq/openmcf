apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azuremssqldatabase
spec:
  # The harness deploys the fixture resource group and the fixture logical
  # server (registry prerequisite chain), creates the database, verifies it
  # via the ARM API (generic GetByID on the database's ARM id), destroys
  # it, and verifies it is gone -- on both provisioners. The pool-attach
  # scenario additionally deploys the elastic-pool fixture (declared via
  # the extra-prerequisites annotation) and joins it.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 35
