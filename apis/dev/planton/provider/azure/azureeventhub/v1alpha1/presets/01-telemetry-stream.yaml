apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventHub
metadata:
  name: my-telemetry-stream
spec:
  namespaceId:
    valueFrom:
      kind: AzureEventHubNamespace
      name: my-telemetry-hubs
      fieldPath: status.outputs.namespace_id
  eventHubName: telemetry
  # 8 partitions: room for 8 parallel consumers -- size for peak up
  # front on shared namespaces (the count can never be decreased, and
  # only PREMIUM/dedicated namespaces can increase it later).
  partitionCount: 8
  # Replayable for 3 days: consumers that fall behind or need to
  # reprocess rewind within this window.
  messageRetention: 3
