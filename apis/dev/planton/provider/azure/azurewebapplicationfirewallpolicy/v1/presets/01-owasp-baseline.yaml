apiVersion: azure.planton.dev/v1
kind: AzureWebApplicationFirewallPolicy
metadata:
  name: waf-baseline
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  policyName: <policy-name>
  managedRules:
    managedRuleSets:
      # OWASP 3.2: the production-standard core rule set (SQLI, XSS, RCE,
      # LFI, protocol enforcement).
      - version: "3.2"
  tags:
    cost-center: <cost-center>
