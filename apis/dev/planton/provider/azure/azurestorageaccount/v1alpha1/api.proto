syntax = "proto3";

package dev.planton.provider.azure.azurestorageaccount.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurestorageaccount/v1alpha1/spec.proto";
import "dev/planton/provider/azure/azurestorageaccount/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureStorageAccount is the top-level API resource for an Azure Storage
// Account -- the multi-service storage primitive fronting Blob, Files,
// Queues, Tables, and Data Lake Storage Gen2 behind one globally-unique DNS
// name. Blob containers are first-class AzureStorageContainer resources
// referencing this account's storage_account_id output; app-hosting kinds
// (Function App, Linux Web App) bind to its name and access-key outputs.
message AzureStorageAccount {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureStorageAccount'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureStorageAccountSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureStorageAccountStatus status = 5;
}

// AzureStorageAccountStatus holds the deployment status and outputs.
message AzureStorageAccountStatus {
  // stack-outputs
  AzureStorageAccountStackOutputs outputs = 1;
}
