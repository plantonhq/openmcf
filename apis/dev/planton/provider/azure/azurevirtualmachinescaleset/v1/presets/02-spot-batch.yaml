apiVersion: azure.planton.dev/v1
kind: AzureVirtualMachineScaleSet
metadata:
  name: my-batch-fleet
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: <your-fleet-name>
  # "Mix" activates the mixed-SKU profile below: the fleet draws from
  # several sizes, which is THE capacity-resilience move for spot.
  skuName: Mix
  instances: 10
  platformFaultDomainCount: 1
  skuProfile:
    # Prefer whichever size is most likely to allocate -- spot capacity
    # comes and goes per size.
    allocationStrategy: CAPACITY_OPTIMIZED
    vmSizes:
      - name: Standard_D2s_v3
      - name: Standard_D2as_v4
      - name: Standard_D2ds_v5
  spot:
    # DELETE lets autoscaling replace evicted capacity cleanly; the
    # priority mix keeps a guaranteed on-demand base.
    evictionPolicy: DELETE
    priorityMix:
      baseRegularCount: 2
      regularPercentageAboveBase: 0
  osProfile:
    computerNamePrefix: batch
    linux:
      adminUsername: azureuser
      sshPublicKeys:
        - publicKey: "<your-ssh-public-key>"
  osDisk:
    caching: READ_ONLY
    storageAccountType: STANDARD_SSD_LRS
    diffDiskSettings: {}
  sourceImageReference:
    publisher: Canonical
    offer: ubuntu-24_04-lts
    sku: server
    version: latest
  networkInterfaces:
    - name: primary
      primary: true
      ipConfigurations:
        - name: internal
          primary: true
          subnetId:
            value: "<subnet-resource-id>"
  # Drain gracefully when Azure reclaims capacity: the scheduled event
  # fires up to 15 minutes before termination.
  terminationNotification:
    timeout: PT15M
  # Workers pull work; deliver bootstrap via cloud-init.
  customData: "<base64-encoded-cloud-init>"
