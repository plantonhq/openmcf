syntax = "proto3";

package dev.planton.provider.azure.azurefrontdoorfirewallpolicy.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";
import "dev/planton/shared/options/options.proto";

// **AzureFrontDoorFirewallPolicySpec** defines a Web Application
// Firewall (WAF) policy for Azure Front Door
// (Microsoft.Network/frontDoorWebApplicationFirewallPolicies) -- the
// rule set Front Door enforces on HTTP traffic at Microsoft's edge,
// before requests ever reach an origin.
//
// A policy has three layers, evaluated in order:
//
// 1. **Custom rules** (`custom_rules`) -- your own match and rate-limit
//    rules, evaluated first by ascending priority. Use them for IP/geo
//    allowlists, header-based exceptions, per-client rate limiting, and
//    (on PREMIUM) JavaScript-challenge or CAPTCHA bot gates.
// 2. **Managed rules** (`managed_rules`, PREMIUM only) -- Microsoft's
//    curated rule sets (Microsoft_DefaultRuleSet, Bot Manager), tuned
//    with scoped exclusions and per-rule overrides.
// 3. **Policy settings** -- the enforcement mode (Prevention vs
//    Detection), body inspection, block-response customization, and
//    access-log scrubbing.
//
// **The policy is global and resource-group-scoped** -- it is NOT
// nested under a Front Door profile (Azure deploys it once across all
// edge locations; no region field exists). It also does nothing on its
// own: attaching it to a profile's domains through an
// AzureFrontDoorSecurityPolicy (which references this policy's
// firewall_policy_id output) is what turns enforcement on. One policy
// is commonly shared by many profiles' security policies.
//
// **This is the FRONT DOOR policy type.** The regional WAF policy that
// Application Gateways attach is a different ARM resource with a
// different rule vocabulary (AzureWebApplicationFirewallPolicy).
//
// **SKU pairing**: the policy carries its own STANDARD/PREMIUM sku and
// Azure only allows it to be associated with Front Door profiles of the
// SAME sku -- decide the tier once, for the profile and its policies
// together. PREMIUM unlocks managed rules and the JS-challenge/CAPTCHA
// actions.
//
// **ForceNew fields**: `policy_name`, `sku` -- and Azure additionally
// rejects a PREMIUM -> STANDARD sku change outright (upgrades recreate;
// downgrades are not supported at all).
message AzureFrontDoorFirewallPolicySpec {
  // The Azure Resource Group the policy is created in. The policy is a
  // global resource (no region), but every ARM resource belongs to a
  // resource group for organization, RBAC scoping, and lifecycle
  // grouping.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_group = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_name"
  ];

  // The policy's name -- unique within the resource group. 1-128
  // characters; must begin with a letter and may contain only letters
  // and numbers (Azure allows no hyphens here, unlike most Front Door
  // names).
  //
  // **ForceNew**: changing the name replaces the policy, which detaches
  // it from every security policy that referenced it.
  string policy_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "front_door_firewall_policy_name_format"
      message: "policy_name must be 1-128 characters, begin with a letter, and contain only letters and numbers (no hyphens)"
      expression: "this.matches('^[a-zA-Z][0-9a-zA-Z]{0,127}$')"
    }
  ];

  // The pricing/capability tier. Unspecified deploys STANDARD -- the
  // right answer unless you need the managed rule sets or the
  // JS-challenge/CAPTCHA actions, which are PREMIUM-only. Must match
  // the sku of every Front Door profile this policy gets associated
  // with (Azure enforces the pairing at association time).
  //
  // **ForceNew** -- and Azure additionally refuses a PREMIUM ->
  // STANDARD downgrade even as a replace, so choose PREMIUM
  // deliberately.
  AzureFrontDoorFirewallPolicySku sku = 3 [(buf.validate.field).enum.defined_only = true];

  // The enforcement mode. PREVENTION blocks (or redirects/challenges)
  // matching requests -- the production posture. DETECTION only logs
  // matches -- the tuning mode for new policies watching real traffic
  // before they start blocking it.
  AzureFrontDoorFirewallPolicyMode mode = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Whether the policy is enforced at all. Azure's default is true;
  // false parks the policy without detaching it from its security
  // policies.
  optional bool enabled = 5 [(dev.planton.shared.options.default) = "true"];

  // Whether request bodies are inspected. Azure's default is true;
  // turning it off blinds the WAF to body-borne attacks (SQL injection
  // in POST forms, JSON payload attacks). In DETECTION mode the policy
  // only logs regardless.
  optional bool request_body_check_enabled = 6 [(dev.planton.shared.options.default) = "true"];

  // Where clients are sent when a rule's action is REDIRECT. Must be an
  // http:// or https:// URL. Azure requires this to be set when any
  // custom rule or managed-rule override uses the REDIRECT action
  // (enforced at deploy time -- the rule-to-URL pairing is not
  // statically checkable).
  string redirect_url = 7 [(buf.validate.field).cel = {
    id: "front_door_firewall_policy_redirect_url_scheme"
    message: "redirect_url must be an http:// or https:// URL"
    expression: "this == '' || this.matches('^https?://.+')"
  }];

  // The HTTP status code returned when a request is blocked. One of
  // 200, 403, 405, 406, 429, or 990-999 (the 99x codes are Azure
  // WAF-specific). Omit for Azure's default (403).
  optional int32 custom_block_response_status_code = 8 [(buf.validate.field).cel = {
    id: "front_door_firewall_policy_block_status_code"
    message: "custom_block_response_status_code must be one of 200, 403, 405, 406, 429, or 990-999"
    expression: "this in [200, 403, 405, 406, 429, 990, 991, 992, 993, 994, 995, 996, 997, 998, 999]"
  }];

  // The response body returned when a request is blocked, as a
  // base64-encoded string (e.g. a branded HTML error page). Omit for
  // Azure's default block page.
  string custom_block_response_body = 9 [(buf.validate.field).cel = {
    id: "front_door_firewall_policy_block_body_base64"
    message: "custom_block_response_body must be base64-encoded (encode your HTML/text before setting it)"
    expression: "this == '' || this.matches('^[A-Za-z0-9+/]+={0,2}$')"
  }];

  // How long a solved JavaScript challenge stays valid before the
  // client is re-challenged, in minutes (5-1440). **PREMIUM only** --
  // on PREMIUM, Azure always enables the JS-challenge policy and both
  // engines send 30 (Azure's default) when this is unset; this field
  // tunes that lifetime. Leave unset on STANDARD (Azure rejects it, so
  // the modules never send it there and no platform default applies).
  // The JavaScript challenge is an Azure PREVIEW feature.
  optional int32 js_challenge_cookie_expiration_in_minutes = 10 [(buf.validate.field).int32 = {
    gte: 5
    lte: 1440
  }];

  // How long a solved CAPTCHA stays valid before the client is
  // re-challenged, in minutes (5-1440). **PREMIUM only** -- on PREMIUM,
  // Azure always enables the CAPTCHA policy and both engines send 30
  // (Azure's default) when this is unset; this field tunes that
  // lifetime. Leave unset on STANDARD (Azure rejects it, so the modules
  // never send it there and no platform default applies). CAPTCHA is an
  // Azure PREVIEW feature.
  optional int32 captcha_cookie_expiration_in_minutes = 11 [(buf.validate.field).int32 = {
    gte: 5
    lte: 1440
  }];

  // Your own match and rate-limit rules, evaluated before the managed
  // rule sets in ascending priority order. Up to 100 rules.
  repeated AzureFrontDoorFirewallPolicyCustomRule custom_rules = 12 [(buf.validate.field).repeated.max_items = 100];

  // Microsoft's curated rule sets with per-rule tuning. **PREMIUM
  // only** (Azure rejects managed rules on STANDARD). The known set
  // types and versions: `Microsoft_DefaultRuleSet` (1.1, 2.0, 2.1 --
  // the OWASP successor with Microsoft threat-intelligence rules),
  // `Microsoft_BotManagerRuleSet` (1.0, 1.1 -- good/bad/unknown bot
  // classification), and the legacy `DefaultRuleSet` (1.0,
  // preview-0.1). Azure ships new types and versions server-side, so
  // the type is a string, not a closed list.
  repeated AzureFrontDoorFirewallPolicyManagedRuleSet managed_rules = 13 [(buf.validate.field).repeated.max_items = 100];

  // Scrub (mask) sensitive request data out of the WAF's logs before
  // they are written -- auth headers, PII query arguments, client IPs.
  // Omit to leave scrubbing off. WAF log scrubbing is an Azure PREVIEW
  // feature.
  AzureFrontDoorFirewallPolicyLogScrubbing log_scrubbing = 14;

  // Free-form tags applied to the policy, merged over the
  // Planton-derived resource tags (organization, environment, resource
  // id); a user tag with the same key wins. Tags are Azure's governance
  // surface -- Azure Policy enforces them and Microsoft Cost Management
  // groups by them. Updatable in place.
  map<string, string> tags = 15;

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_managed_rules_premium_only"
    message: "managed_rules are only supported on the PREMIUM sku -- Azure's managed rule sets (Microsoft_DefaultRuleSet, Bot Manager) are a Premium Front Door capability"
    expression: "this.sku == 2 || this.managed_rules.size() == 0"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_js_challenge_premium_only"
    message: "js_challenge_cookie_expiration_in_minutes is only supported on the PREMIUM sku -- the JavaScript challenge is a Premium Front Door capability"
    expression: "this.sku == 2 || !has(this.js_challenge_cookie_expiration_in_minutes)"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_captcha_premium_only"
    message: "captcha_cookie_expiration_in_minutes is only supported on the PREMIUM sku -- CAPTCHA is a Premium Front Door capability"
    expression: "this.sku == 2 || !has(this.captcha_cookie_expiration_in_minutes)"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_challenge_actions_premium_only"
    message: "custom rules with the JS_CHALLENGE or CAPTCHA action are only supported on the PREMIUM sku"
    expression: "this.sku == 2 || this.custom_rules.all(r, r.action != 5 && r.action != 6)"
  };
}

// The pricing/capability tier of the Front Door WAF policy. Must match
// the sku of the Front Door profiles it gets associated with.
enum AzureFrontDoorFirewallPolicySku {
  // Not specified -- deploys STANDARD, the production default.
  azure_front_door_firewall_policy_sku_unspecified = 0;

  // Custom match and rate-limit rules only. Up to 100 domains per
  // security-policy association.
  STANDARD = 1;

  // Everything in STANDARD plus Microsoft's managed rule sets
  // (Microsoft_DefaultRuleSet, Bot Manager) and the
  // JS-challenge/CAPTCHA custom-rule actions. Up to 500 domains per
  // security-policy association.
  PREMIUM = 2;
}

// The enforcement mode of the policy.
enum AzureFrontDoorFirewallPolicyMode {
  // Not specified -- invalid; choose the enforcement mode explicitly.
  azure_front_door_firewall_policy_mode_unspecified = 0;

  // Log matches without acting on them -- the tuning mode for new
  // policies watching real traffic.
  DETECTION = 1;

  // Act on matches (block, redirect, challenge) -- the production
  // posture.
  PREVENTION = 2;
}

// One custom rule: match conditions plus an action, optionally
// rate-limited.
message AzureFrontDoorFirewallPolicyCustomRule {
  // The rule's name, shown in WAF logs and metrics.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Whether the rule is evaluated. Azure's default is true; disable to
  // stage a rule without deleting it.
  optional bool enabled = 2 [(dev.planton.shared.options.default) = "true"];

  // Evaluation order among custom rules: LOWER runs first. Azure's
  // default is 1.
  optional int32 priority = 3 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 0
  ];

  // MATCH_RULE acts on every matching request; RATE_LIMIT_RULE acts
  // only when matching requests exceed rate_limit_threshold within
  // rate_limit_duration_in_minutes.
  AzureFrontDoorFirewallPolicyCustomRuleType rule_type = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // For RATE_LIMIT_RULE: the sliding window the threshold counts over,
  // in minutes. Azure's default is 1. Ignored by MATCH_RULE rules.
  optional int32 rate_limit_duration_in_minutes = 5 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  // For RATE_LIMIT_RULE: the number of matching requests allowed per
  // client within the window before the action fires. Azure's default
  // is 10. Ignored by MATCH_RULE rules.
  optional int32 rate_limit_threshold = 6 [
    (dev.planton.shared.options.default) = "10",
    (buf.validate.field).int32.gte = 1
  ];

  // What happens when the rule matches. LOG records the match and
  // continues evaluation; ALLOW lets the request through skipping the
  // remaining rules; BLOCK rejects it; REDIRECT sends the client to
  // the policy's redirect_url; JS_CHALLENGE and CAPTCHA (PREMIUM only)
  // gate the request behind a browser challenge.
  AzureFrontDoorFirewallPolicyCustomRuleAction action = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The conditions that select requests. ALL conditions must match for
  // the action to apply (conditions AND together; the values WITHIN one
  // condition OR together). Up to 10 conditions per rule.
  repeated AzureFrontDoorFirewallPolicyMatchCondition match_conditions = 8 [(buf.validate.field).repeated.max_items = 10];
}

// Custom-rule types.
enum AzureFrontDoorFirewallPolicyCustomRuleType {
  // Not specified -- invalid; declare the rule type.
  azure_front_door_firewall_policy_custom_rule_type_unspecified = 0;

  // Acts on every request matching the conditions.
  MATCH_RULE = 1;

  // Acts only when matching requests exceed the rate-limit threshold
  // within the window.
  RATE_LIMIT_RULE = 2;
}

// Custom-rule actions.
enum AzureFrontDoorFirewallPolicyCustomRuleAction {
  // Not specified -- invalid; declare the action.
  azure_front_door_firewall_policy_custom_rule_action_unspecified = 0;

  // Let the request through, skipping the remaining custom AND managed
  // rules -- the allowlist gesture.
  ALLOW = 1;

  // Reject the request with the policy's block response.
  BLOCK = 2;

  // Record the match and continue evaluating.
  LOG = 3;

  // Send the client to the policy's redirect_url.
  REDIRECT = 4;

  // Serve a JavaScript challenge; only real browsers that solve it
  // proceed (bot mitigation without user friction). PREMIUM only; an
  // Azure PREVIEW feature.
  JS_CHALLENGE = 5;

  // Serve a CAPTCHA; only humans that solve it proceed. PREMIUM only;
  // an Azure PREVIEW feature.
  CAPTCHA = 6;
}

// One match condition inside a custom rule.
message AzureFrontDoorFirewallPolicyMatchCondition {
  // The request part the condition inspects.
  AzureFrontDoorFirewallPolicyMatchVariable match_variable = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // For the keyed variables (COOKIES, POST_ARGS, QUERY_STRING,
  // REQUEST_HEADER): the specific key to inspect (e.g. "User-Agent"
  // with REQUEST_HEADER). Azure requires it for those variables and
  // ignores it elsewhere (enforced at deploy time).
  string selector = 2;

  // How the variable is compared against match_values.
  AzureFrontDoorFirewallPolicyOperator operator = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The values compared against (OR semantics). 1-600 values, each
  // 1-256 characters. IP_MATCH takes CIDRs or addresses; GEO_MATCH
  // takes two-letter ISO country codes.
  repeated string match_values = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 600
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];

  // Inverts the result: the condition matches when the comparison does
  // NOT hold. Azure's default is false.
  bool negate_condition = 5;

  // Normalizations applied to the variable before comparison (e.g.
  // LOWERCASE + URL_DECODE to catch encoding evasions). Up to 5.
  repeated AzureFrontDoorFirewallPolicyTransform transforms = 6 [(buf.validate.field).repeated = {
    max_items: 5
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

// Request parts a custom-rule match condition can inspect.
enum AzureFrontDoorFirewallPolicyMatchVariable {
  // Not specified -- invalid; declare the variable.
  azure_front_door_firewall_policy_match_variable_unspecified = 0;

  // Request cookies (selector picks one).
  COOKIES = 1;

  // POST form arguments (selector picks one).
  POST_ARGS = 2;

  // The raw query string (selector picks one argument).
  QUERY_STRING = 3;

  // The client's IP address.
  REMOTE_ADDR = 4;

  // The request body.
  REQUEST_BODY = 5;

  // Request headers (selector picks one).
  REQUEST_HEADER = 6;

  // The HTTP method.
  REQUEST_METHOD = 7;

  // The request URI (path + query).
  REQUEST_URI = 8;

  // The client's socket address (the direct TCP peer -- differs from
  // REMOTE_ADDR behind proxies that set X-Forwarded-For).
  SOCKET_ADDR = 9;
}

// Comparison operators for match conditions.
enum AzureFrontDoorFirewallPolicyOperator {
  // Not specified -- invalid; declare the operator.
  azure_front_door_firewall_policy_operator_unspecified = 0;

  // Matches every request carrying the variable.
  ANY = 1;

  // String prefix match.
  BEGINS_WITH = 2;

  // Substring containment.
  CONTAINS = 3;

  // String suffix match.
  ENDS_WITH = 4;

  // Exact string equality.
  EQUAL = 5;

  // The client's country matches (two-letter ISO codes in
  // match_values).
  GEO_MATCH = 6;

  // Numeric greater-than.
  GREATER_THAN = 7;

  // Numeric greater-than-or-equal.
  GREATER_THAN_OR_EQUAL = 8;

  // The variable is an IP inside one of the match_values
  // CIDRs/addresses.
  IP_MATCH = 9;

  // Numeric less-than.
  LESS_THAN = 10;

  // Numeric less-than-or-equal.
  LESS_THAN_OR_EQUAL = 11;

  // Regular-expression match.
  REG_EX = 12;
}

// Normalizations applied before comparison.
enum AzureFrontDoorFirewallPolicyTransform {
  // Not specified -- invalid; list only real transforms.
  azure_front_door_firewall_policy_transform_unspecified = 0;

  // Lowercase the value.
  LOWERCASE = 1;

  // Strip NULL bytes.
  REMOVE_NULLS = 2;

  // Trim leading/trailing whitespace.
  TRIM = 3;

  // Uppercase the value.
  UPPERCASE = 4;

  // URL-decode the value (%27 -> ').
  URL_DECODE = 5;

  // URL-encode the value.
  URL_ENCODE = 6;
}

// One managed (Microsoft-curated) rule set with optional per-group and
// per-rule tuning. PREMIUM only.
message AzureFrontDoorFirewallPolicyManagedRuleSet {
  // The rule-set family. Known values: `Microsoft_DefaultRuleSet` (the
  // OWASP successor with Microsoft threat-intelligence rules),
  // `Microsoft_BotManagerRuleSet` (bot classification), and the legacy
  // `DefaultRuleSet`. Azure ships new families server-side, so this is
  // a string, not a closed list.
  string type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The rule-set version. `Microsoft_DefaultRuleSet`: "1.1", "2.0",
  // "2.1" (2.x uses anomaly scoring); `Microsoft_BotManagerRuleSet`:
  // "1.0", "1.1"; the legacy `DefaultRuleSet`: "1.0", "preview-0.1".
  string version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The action for requests that trip the set. With
  // Microsoft_DefaultRuleSet 2.x (anomaly scoring), this is the action
  // taken when the accumulated anomaly score crosses the blocking
  // threshold.
  AzureFrontDoorFirewallPolicyManagedRuleSetAction action = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Set-wide exclusions: request parts (by key) that EVERY rule in the
  // set skips -- the tool for false positives on specific cookies,
  // headers, or form fields, without disabling rules. Up to 100.
  repeated AzureFrontDoorFirewallPolicyManagedRuleExclusion exclusions = 4 [(buf.validate.field).repeated.max_items = 100];

  // Per-rule-group tuning: disable individual rules, change their
  // action, or scope exclusions to a group or rule. Up to 100 groups.
  repeated AzureFrontDoorFirewallPolicyManagedRuleGroupOverride overrides = 5 [(buf.validate.field).repeated.max_items = 100];

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_default_rule_set_version"
    message: "the legacy DefaultRuleSet type only supports versions '1.0' and 'preview-0.1' -- for 1.1 and above use the Microsoft_DefaultRuleSet type"
    expression: "this.type != 'DefaultRuleSet' || this.version in ['1.0', 'preview-0.1']"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_microsoft_default_rule_set_version"
    message: "Microsoft_DefaultRuleSet starts at version '1.1' ('1.1', '2.0', '2.1') -- for 1.0 and below use the legacy DefaultRuleSet type"
    expression: "this.type != 'Microsoft_DefaultRuleSet' || !(this.version.startsWith('0.') || this.version == '1.0' || this.version == 'preview-0.1')"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_anomaly_scoring_version_gate"
    message: "rule overrides on 2.0+ rule sets must use OVERRIDE_ANOMALY_SCORING or OVERRIDE_LOG (the anomaly-scoring model); OVERRIDE_ANOMALY_SCORING is invalid below 2.0"
    expression: "(!this.version.startsWith('0.') && !this.version.startsWith('1.') && this.version != 'preview-0.1') ? this.overrides.all(o, o.rules.all(r, r.action in [2, 6])) : this.overrides.all(o, o.rules.all(r, r.action != 2))"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_js_challenge_bot_manager_only"
    message: "the OVERRIDE_JS_CHALLENGE action is only valid on bot-manager rule sets (Microsoft_BotManagerRuleSet)"
    expression: "this.type.lowerAscii().contains('botmanagerruleset') || this.overrides.all(o, o.rules.all(r, r.action != 5))"
  };
}

// Actions a managed rule set takes when tripped.
enum AzureFrontDoorFirewallPolicyManagedRuleSetAction {
  // Not specified -- invalid; declare the set's action.
  azure_front_door_firewall_policy_managed_rule_set_action_unspecified = 0;

  // Reject requests that trip the set.
  RULE_SET_BLOCK = 1;

  // Record matches without acting.
  RULE_SET_LOG = 2;

  // Send matching clients to the policy's redirect_url.
  RULE_SET_REDIRECT = 3;
}

// One exclusion: a request part (by key) the managed rules skip.
// Applied set-wide, group-wide, or per-rule depending on where it is
// declared.
message AzureFrontDoorFirewallPolicyManagedRuleExclusion {
  // The keyed request collection the exclusion applies to.
  AzureFrontDoorFirewallPolicyExclusionMatchVariable match_variable = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // How selector picks keys out of the collection.
  AzureFrontDoorFirewallPolicySelectorOperator operator = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The key (or key fragment, per the operator) to exclude -- e.g. a
  // session cookie name that trips SQL-injection rules.
  string selector = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// Keyed request collections a managed-rule exclusion can target.
enum AzureFrontDoorFirewallPolicyExclusionMatchVariable {
  // Not specified -- invalid; declare the collection.
  azure_front_door_firewall_policy_exclusion_match_variable_unspecified = 0;

  // Query-string argument names.
  EXCLUDE_QUERY_STRING_ARG_NAMES = 1;

  // JSON body argument names.
  EXCLUDE_REQUEST_BODY_JSON_ARG_NAMES = 2;

  // POST body argument names.
  EXCLUDE_REQUEST_BODY_POST_ARG_NAMES = 3;

  // Cookie names.
  EXCLUDE_REQUEST_COOKIE_NAMES = 4;

  // Header names.
  EXCLUDE_REQUEST_HEADER_NAMES = 5;
}

// How a selector picks keys (shared by managed-rule exclusions and log
// scrubbing; scrubbing rules use only SELECTOR_EQUALS /
// SELECTOR_EQUALS_ANY).
enum AzureFrontDoorFirewallPolicySelectorOperator {
  // Not specified -- invalid for exclusions; means SELECTOR_EQUALS for
  // log-scrubbing rules (Azure's default there).
  azure_front_door_firewall_policy_selector_operator_unspecified = 0;

  // The key contains the selector.
  SELECTOR_CONTAINS = 1;

  // The key ends with the selector.
  SELECTOR_ENDS_WITH = 2;

  // The key equals the selector exactly.
  SELECTOR_EQUALS = 3;

  // Every key in the collection matches (no selector).
  SELECTOR_EQUALS_ANY = 4;

  // The key starts with the selector.
  SELECTOR_STARTS_WITH = 5;
}

// Tuning for one rule group inside a managed rule set.
message AzureFrontDoorFirewallPolicyManagedRuleGroupOverride {
  // The rule group, using Azure's exact group names (e.g. "SQLI",
  // "XSS", "PROTOCOL-ATTACK" for Microsoft_DefaultRuleSet; "BadBots"
  // for the bot manager).
  string rule_group_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Group-scoped exclusions: request parts every rule IN THIS GROUP
  // skips. Up to 100.
  repeated AzureFrontDoorFirewallPolicyManagedRuleExclusion exclusions = 2 [(buf.validate.field).repeated.max_items = 100];

  // The individual rules to tune within the group. Up to 1000.
  repeated AzureFrontDoorFirewallPolicyManagedRuleOverride rules = 3 [(buf.validate.field).repeated.max_items = 1000];
}

// Tuning for one rule.
message AzureFrontDoorFirewallPolicyManagedRuleOverride {
  // The rule ID, from the rule set's documentation -- note each
  // family's own ID shape: Microsoft_DefaultRuleSet rules are numeric
  // (e.g. "942100" for the SQL-injection libinjection rule) while
  // Microsoft_BotManagerRuleSet rules carry a "Bot" prefix (e.g.
  // "Bot300700" for unknown bots). Azure rejects an ID that does not
  // exist in the chosen set and version.
  string rule_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Whether the rule runs. Azure's default here is FALSE -- listing a
  // rule without enabled=true DISABLES it, which is the common tuning
  // gesture for false positives.
  optional bool enabled = 2 [(dev.planton.shared.options.default) = "false"];

  // Replace the rule's action. On 2.0+ rule sets only
  // OVERRIDE_ANOMALY_SCORING and OVERRIDE_LOG are valid (the
  // anomaly-scoring model); OVERRIDE_JS_CHALLENGE only on the bot
  // manager set.
  AzureFrontDoorFirewallPolicyManagedRuleOverrideAction action = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Rule-scoped exclusions: request parts THIS RULE skips. Up to 100.
  repeated AzureFrontDoorFirewallPolicyManagedRuleExclusion exclusions = 4 [(buf.validate.field).repeated.max_items = 100];
}

// Actions a per-rule override can substitute.
enum AzureFrontDoorFirewallPolicyManagedRuleOverrideAction {
  // Not specified -- invalid; declare the substituted action.
  azure_front_door_firewall_policy_managed_rule_override_action_unspecified = 0;

  // Let matching requests through.
  OVERRIDE_ALLOW = 1;

  // Contribute to the anomaly score instead of acting directly -- the
  // only rule action (besides OVERRIDE_LOG) on 2.0+ rule sets.
  OVERRIDE_ANOMALY_SCORING = 2;

  // Reject matching requests.
  OVERRIDE_BLOCK = 3;

  // Serve a CAPTCHA.
  OVERRIDE_CAPTCHA = 4;

  // Serve a JavaScript challenge (Microsoft_BotManagerRuleSet only).
  OVERRIDE_JS_CHALLENGE = 5;

  // Record matches without acting.
  OVERRIDE_LOG = 6;

  // Send matching clients to the policy's redirect_url.
  OVERRIDE_REDIRECT = 7;
}

// Log-scrubbing configuration: redact sensitive request parts from the
// WAF's logs before they land in storage/Log Analytics.
message AzureFrontDoorFirewallPolicyLogScrubbing {
  // Whether scrubbing is active. Azure's default is true (when the
  // block is present); false stages the rules without applying them.
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  // The request parts to redact. At least one; up to 100.
  repeated AzureFrontDoorFirewallPolicyScrubbingRule scrubbing_rules = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// One log-scrubbing rule.
message AzureFrontDoorFirewallPolicyScrubbingRule {
  // Whether this rule is active. Azure's default is true.
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  // The request part to redact.
  AzureFrontDoorFirewallPolicyScrubbingMatchVariable match_variable = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // How selector picks keys: SELECTOR_EQUALS redacts one named key
  // (Azure's default), SELECTOR_EQUALS_ANY redacts every key in the
  // collection. SCRUB_REQUEST_IP_ADDRESS and SCRUB_REQUEST_URI only
  // accept SELECTOR_EQUALS_ANY (they are not keyed collections).
  AzureFrontDoorFirewallPolicySelectorOperator operator = 3 [(buf.validate.field).cel = {
    id: "front_door_firewall_policy_scrubbing_operator"
    message: "log-scrubbing rules support only SELECTOR_EQUALS and SELECTOR_EQUALS_ANY"
    expression: "this == 0 || this == 3 || this == 4"
  }];

  // The key to redact (e.g. "Authorization" with
  // SCRUB_REQUEST_HEADER_NAMES). Required with SELECTOR_EQUALS; must be
  // omitted with SELECTOR_EQUALS_ANY.
  string selector = 4;

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_scrubbing_ip_uri_equals_any"
    message: "SCRUB_REQUEST_IP_ADDRESS and SCRUB_REQUEST_URI are not keyed collections -- they only accept the SELECTOR_EQUALS_ANY operator"
    expression: "!(this.match_variable in [6, 7]) || this.operator == 4"
  };

  option (buf.validate.message).cel = {
    id: "front_door_firewall_policy_scrubbing_selector_pairing"
    message: "selector is required with SELECTOR_EQUALS (the default) and must be omitted with SELECTOR_EQUALS_ANY"
    expression: "this.operator == 4 ? this.selector == '' : this.selector != ''"
  };
}

// Request parts log scrubbing can redact.
enum AzureFrontDoorFirewallPolicyScrubbingMatchVariable {
  // Not specified -- invalid; declare the part to redact.
  azure_front_door_firewall_policy_scrubbing_match_variable_unspecified = 0;

  // Query-string argument names.
  SCRUB_QUERY_STRING_ARG_NAMES = 1;

  // JSON body argument names.
  SCRUB_REQUEST_BODY_JSON_ARG_NAMES = 2;

  // POST body argument names.
  SCRUB_REQUEST_BODY_POST_ARG_NAMES = 3;

  // Cookie names.
  SCRUB_REQUEST_COOKIE_NAMES = 4;

  // Header names.
  SCRUB_REQUEST_HEADER_NAMES = 5;

  // The client IP address (SELECTOR_EQUALS_ANY only).
  SCRUB_REQUEST_IP_ADDRESS = 6;

  // The request URI (SELECTOR_EQUALS_ANY only).
  SCRUB_REQUEST_URI = 7;
}
