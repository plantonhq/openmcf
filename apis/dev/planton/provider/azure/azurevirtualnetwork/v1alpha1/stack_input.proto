syntax = "proto3";

package dev.planton.provider.azure.azurevirtualnetwork.v1alpha1;

import "dev/planton/provider/azure/azurevirtualnetwork/v1alpha1/api.proto";
import "dev/planton/provider/azure/provider.proto";

// AzureVirtualNetworkStackInput is the input to the IaC modules (Pulumi/Terraform).
// It contains the target resource definition and Azure provider credentials.
message AzureVirtualNetworkStackInput {
  // The virtual network resource to deploy.
  AzureVirtualNetwork target = 1;

  // Azure provider configuration (credentials).
  dev.planton.provider.azure.AzureProviderConfig provider_config = 2;
}
