apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetwork
metadata:
  name: hub-network
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: hub-vnet
  addressSpaces:
    - "10.0.0.0/16"
    - "10.1.0.0/16"
  dnsServers:
    - "<dns-server-ip-1>"
    - "<dns-server-ip-2>"
  flowTimeoutInMinutes: 15
  tags:
    cost-center: <cost-center>
