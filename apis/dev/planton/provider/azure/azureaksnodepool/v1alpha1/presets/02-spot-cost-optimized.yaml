apiVersion: azure.planton.dev/v1alpha1
kind: AzureAksNodePool
metadata:
  name: my-spot-pool
spec:
  kubernetesClusterId:
    value: "<aks-cluster-arm-id>"
  name: spot
  vmSize: Standard_D4s_v5
  priority: SPOT
  evictionPolicy: EVICTION_DELETE
  autoScalingEnabled: true
  minCount: 0
  maxCount: 20
  zones:
    - "1"
    - "2"
    - "3"
  mode: USER
