syntax = "proto3";

package dev.planton.provider.azure.azurecontainerappcustomdomain.v1;

import "buf/validate/validate.proto";
import "dev/planton/shared/foreignkey/v1/foreign_key.proto";

// **AzureContainerAppCustomDomainSpec** binds a custom domain to a
// Container App: your own hostname (app.example.com) serving the app
// instead of the generated *.azurecontainerapps.io address.
//
// **DNS must prove ownership before the binding deploys.** Azure
// validates the domain during creation and the deployment fails without
// these records in place:
//
//  1. A TXT record at `asuid.{domain_name}` carrying the app's
//     custom_domain_verification_id output (domain ownership), AND
//  2. a CNAME from `domain_name` to the app's ingress_fqdn output (or an
//     A record to the environment's static IP for apex domains).
//
// With the domain's zone on Azure DNS, both are AzureDnsRecord resources
// composed in the same deployment; with external DNS, publish them at
// your provider first. The app must have ingress enabled -- a binding
// has nothing to attach to otherwise.
//
// **TLS comes one of two ways:**
//
// - **Azure-managed certificate** (the common path): leave the
//   certificate fields unset. The binding deploys certificate-less, then
//   an AzureContainerAppEnvironmentManagedCertificate for the same
//   hostname issues and Azure attaches it to this binding asynchronously.
//   Both engines ignore Azure's out-of-band certificate attachment so it
//   never reads as drift.
// - **Bring-your-own certificate**: set both
//   container_app_environment_certificate_id (an
//   AzureContainerAppEnvironmentCertificate on the app's environment)
//   and certificate_binding_type (SNI_ENABLED for TLS serving).
//
// **All fields replace the binding when changed** -- Azure models the
// binding as an entry in the app's ingress configuration with no update
// surface.
message AzureContainerAppCustomDomainSpec {
  // The custom hostname to bind, e.g. "app.example.com". Changing it
  // replaces the binding.
  string domain_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 253,
    // Regex: dot-separated labels of letters/digits/hyphens with at
    // least two labels. No wildcard label -- per-app bindings cover one
    // concrete hostname (environment-level custom DNS suffixes are the
    // wildcard mechanism).
    (buf.validate.field).cel = {
      id: "azure_container_app_custom_domain_name_format"
      message: "Domain name must be a fully qualified hostname like app.example.com -- lowercase labels of letters, digits, and hyphens; bind one concrete hostname per resource (the environment's custom DNS suffix is the wildcard mechanism)"
      expression: "this.matches('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')"
    }
  ];

  // The Container App the domain binds to, by ARM ID. References an
  // AzureContainerApp's container_app_id output. The app must have
  // ingress enabled. Changing it replaces the binding.
  dev.planton.shared.foreignkey.v1.StringValueOrRef container_app_id = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureContainerApp,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.container_app_id"
  ];

  // The bring-your-own certificate to serve TLS with, by ARM ID.
  // References an AzureContainerAppEnvironmentCertificate's
  // certificate_id output (the certificate must live on the app's own
  // environment). Set together with certificate_binding_type; leave BOTH
  // unset for the Azure-managed-certificate flow. Changing it replaces
  // the binding.
  dev.planton.shared.foreignkey.v1.StringValueOrRef container_app_environment_certificate_id = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureContainerAppEnvironmentCertificate,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.certificate_id"
  ];

  // How the certificate binds to the domain. Set together with
  // container_app_environment_certificate_id; leave BOTH unset for the
  // Azure-managed-certificate flow (Azure attaches the issued
  // certificate itself).
  AzureContainerAppCustomDomainCertificateBindingType certificate_binding_type = 4 [(buf.validate.field).enum.defined_only = true];

  // Azure rejects a certificate without its binding type and a binding
  // type without a certificate -- and in the managed-certificate flow
  // both must be absent. Pairing them here turns a mid-deploy failure
  // into an instant validation message.
  option (buf.validate.message).cel = {
    id: "azure_container_app_custom_domain_certificate_pairing"
    message: "Set container_app_environment_certificate_id and certificate_binding_type together for a bring-your-own certificate, or leave both unset to let an Azure-managed certificate attach to the binding"
    expression: "has(this.container_app_environment_certificate_id) == (this.certificate_binding_type != 0)"
  };
}

// How a bring-your-own certificate binds to the custom domain.
enum AzureContainerAppCustomDomainCertificateBindingType {
  // Not specified -- the Azure-managed-certificate flow (no certificate
  // reference; Azure attaches the issued certificate out of band).
  azure_container_app_custom_domain_certificate_binding_type_unspecified = 0;

  // Serve TLS for this hostname via SNI with the referenced certificate
  // -- the standard choice for every bring-your-own binding.
  SNI_ENABLED = 1;

  // Attach the domain without serving TLS from the referenced
  // certificate. A transitional state -- browsers reject the hostname
  // over HTTPS until a certificate binds.
  DISABLED = 2;

  // Let Azure pick the binding mode for the referenced certificate.
  AUTO = 3;
}
