syntax = "proto3";

package dev.planton.provider.azure.azurecontainerappcustomdomain.v1alpha1;

// **AzureContainerAppCustomDomainStackOutputs** captures the outputs of
// binding a custom domain to a Container App.
message AzureContainerAppCustomDomainStackOutputs {
  // The binding's resource ID. Azure models the binding as an entry in
  // the app's ingress configuration rather than a standalone ARM
  // resource, so this is the providers' synthetic identifier:
  // {container-app-id}/customDomainName/{domain}
  string custom_domain_id = 1;

  // The ARM ID of the Azure-managed certificate attached to this
  // binding, once one issues for the hostname. Empty for
  // bring-your-own-certificate bindings -- and empty until Azure
  // attaches the managed certificate, which happens asynchronously
  // after the certificate resource issues.
  string managed_certificate_id = 2;
}
