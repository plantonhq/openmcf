syntax = "proto3";

package dev.planton.provider.azure.azureroutetable.v1;

import "dev/planton/provider/azure/azureroutetable/v1/api.proto";
import "dev/planton/provider/azure/provider.proto";

// AzureRouteTableStackInput is the input to the IaC modules (Pulumi/Terraform).
// It contains the target resource definition and Azure provider credentials.
message AzureRouteTableStackInput {
  // The route table resource to deploy.
  AzureRouteTable target = 1;

  // Azure provider configuration (credentials).
  dev.planton.provider.azure.AzureProviderConfig provider_config = 2;
}
