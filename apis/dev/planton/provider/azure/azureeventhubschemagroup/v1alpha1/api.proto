syntax = "proto3";

package dev.planton.provider.azure.azureeventhubschemagroup.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azureeventhubschemagroup/v1alpha1/spec.proto";
import "dev/planton/provider/azure/azureeventhubschemagroup/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureEventHubSchemaGroup is the top-level API resource for a schema
// group in an Event Hubs namespace's schema registry -- a named schema
// collection with a shared format and evolution policy, addressed by
// schema-registry serializers at runtime.
message AzureEventHubSchemaGroup {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventHubSchemaGroup'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureEventHubSchemaGroupSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureEventHubSchemaGroupStatus status = 5;
}

// AzureEventHubSchemaGroupStatus holds the deployment status and outputs.
message AzureEventHubSchemaGroupStatus {
  // stack-outputs
  AzureEventHubSchemaGroupStackOutputs outputs = 1;
}
