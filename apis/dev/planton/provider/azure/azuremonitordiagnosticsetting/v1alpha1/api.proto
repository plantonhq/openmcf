syntax = "proto3";

package dev.planton.provider.azure.azuremonitordiagnosticsetting.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azuremonitordiagnosticsetting/v1alpha1/spec.proto";
import "dev/planton/provider/azure/azuremonitordiagnosticsetting/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureMonitorDiagnosticSetting is the top-level API resource for an Azure
// Monitor diagnostic setting -- the routing rule that selects which platform
// logs and metrics a target Azure resource emits and sends them to a Log
// Analytics Workspace, Storage Account, Event Hub, or partner solution.
message AzureMonitorDiagnosticSetting {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureMonitorDiagnosticSetting'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureMonitorDiagnosticSettingSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureMonitorDiagnosticSettingStatus status = 5;
}

// AzureMonitorDiagnosticSettingStatus holds the deployment status and outputs.
message AzureMonitorDiagnosticSettingStatus {
  // stack-outputs
  AzureMonitorDiagnosticSettingStackOutputs outputs = 1;
}
