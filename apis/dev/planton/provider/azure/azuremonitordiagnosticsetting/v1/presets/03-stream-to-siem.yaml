# Stream a resource's security-relevant logs to an Event Hub -- the
# integration path for external SIEMs (Splunk, QRadar, Elastic) and
# streaming pipelines. The rule and hub compose from the
# AzureEventHubAuthorizationRule and AzureEventHub kinds.
apiVersion: azure.planton.dev/v1
kind: AzureMonitorDiagnosticSetting
metadata:
  name: my-siem-stream
spec:
  settingName: stream-to-siem
  targetResourceId:
    valueFrom:
      kind: AzureKeyVault
      name: my-app-vault
      fieldPath: status.outputs.key_vault_id
  enabledLogs:
    - categoryGroup: audit
  enabledMetrics:
    - category: AllMetrics
  eventhubAuthorizationRuleId:
    valueFrom:
      kind: AzureEventHubAuthorizationRule
      name: my-siem-sender
      fieldPath: status.outputs.authorization_rule_id
  eventhubName:
    valueFrom:
      kind: AzureEventHub
      name: my-siem-hub
      fieldPath: status.outputs.event_hub_name
