apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: my-custom-role-grant
spec:
  scope:
    value: /subscriptions/<subscription-id>
  # Replace with your role definition's fully-scoped ID — or reference an
  # AzureRoleDefinition deployed in the same run
  # (valueFrom: { name: <resource-name> } — the reference is also the
  # deploy-ordering edge, so the custom role exists before this grant).
  roleDefinitionId:
    value: /subscriptions/<subscription-id>/providers/Microsoft.Authorization/roleDefinitions/<role-definition-guid>
  principalId:
    value: <principal-object-id>
  principalType: GROUP
  description: <why-this-grant-exists>
