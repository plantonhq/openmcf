apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: my-conditioned-grant
spec:
  scope:
    valueFrom:
      kind: AzureStorageAccount
      name: <your-storage-account>
      fieldPath: status.outputs.storage_account_id
  roleDefinitionName: Storage Blob Data Reader
  principalId:
    value: <principal-object-id>
  condition: >-
    ((!(ActionMatches{'Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read'}))
    OR (@Resource[Microsoft.Storage/storageAccounts/blobServices/containers/blobs/tags:<tag-name><$key_case_sensitive$>] StringEquals '<tag-value>'))
  conditionVersion: "2.0"
  description: <why-this-grant-exists>
