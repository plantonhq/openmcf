apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbSqlRoleAssignment
metadata:
  name: my-container-scoped-reader
spec:
  cosmosdbAccountId:
    valueFrom:
      kind: AzureCosmosdbAccount
      name: <cosmosdb-account-resource-name>
      fieldPath: status.outputs.cosmosdb_account_id
  # The built-in Data Reader by its well-known ID -- reads, queries,
  # and change feed; no writes.
  roleDefinitionId:
    value: /subscriptions/<subscription-id>/resourceGroups/<resource-group-name>/providers/Microsoft.DocumentDB/databaseAccounts/<account-name>/sqlRoleDefinitions/00000000-0000-0000-0000-000000000001
  principalId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: <identity-resource-name>
      fieldPath: status.outputs.principal_id
  # Least privilege: one container, not the account. Sub-account
  # scopes are literals composed on the account's ARM ID.
  scope:
    value: /subscriptions/<subscription-id>/resourceGroups/<resource-group-name>/providers/Microsoft.DocumentDB/databaseAccounts/<account-name>/dbs/<database-name>/colls/<container-name>
