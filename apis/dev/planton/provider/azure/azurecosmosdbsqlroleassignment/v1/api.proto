syntax = "proto3";

package dev.planton.provider.azure.azurecosmosdbsqlroleassignment.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurecosmosdbsqlroleassignment/v1/spec.proto";
import "dev/planton/provider/azure/azurecosmosdbsqlroleassignment/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureCosmosdbSqlRoleAssignment is the top-level API resource for a
// Cosmos DB SQL (NoSQL) API role assignment inside a Cosmos DB account
// (referenced via cosmosdb_account_id) -- the grant binding a Cosmos
// data-plane role (built-in or AzureCosmosdbSqlRoleDefinition) to a
// Microsoft Entra principal at an account, database, or container scope.
message AzureCosmosdbSqlRoleAssignment {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbSqlRoleAssignment'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbSqlRoleAssignmentSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbSqlRoleAssignmentStatus status = 5;
}

// AzureCosmosdbSqlRoleAssignmentStatus holds the deployment status and outputs.
message AzureCosmosdbSqlRoleAssignmentStatus {
  // stack-outputs
  AzureCosmosdbSqlRoleAssignmentStackOutputs outputs = 1;
}
