apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azureredislinkedserver
spec:
  # The harness deploys the fixture resource group and TWO scenario-local
  # PREMIUM P1 caches in different regions (Azure's requirements for a
  # geo pair), links them, verifies the link via the ARM API, destroys
  # the link (Azure's own failover operation -- proving it detaches
  # cleanly), and verifies it is gone before the caches tear down.
  #
  # This is the most expensive scenario in the Azure suite: two Premium
  # caches at the slowest provisioning time in the catalog (15-40
  # minutes EACH, sequential), plus several minutes to establish and
  # detach replication -- which sizes the timeout.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 150
