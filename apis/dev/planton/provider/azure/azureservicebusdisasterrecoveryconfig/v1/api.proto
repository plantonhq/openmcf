syntax = "proto3";

package dev.planton.provider.azure.azureservicebusdisasterrecoveryconfig.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azureservicebusdisasterrecoveryconfig/v1/spec.proto";
import "dev/planton/provider/azure/azureservicebusdisasterrecoveryconfig/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureServiceBusDisasterRecoveryConfig is the top-level API resource for
// a geo-disaster-recovery pairing between two PREMIUM Service Bus
// namespaces: continuous metadata replication plus a failover-stable
// alias DNS name clients connect through. Failover itself is an
// operational action taken on the secondary during an incident; deleting
// this resource breaks the pairing gracefully.
message AzureServiceBusDisasterRecoveryConfig {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureServiceBusDisasterRecoveryConfig'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureServiceBusDisasterRecoveryConfigSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureServiceBusDisasterRecoveryConfigStatus status = 5;
}

// AzureServiceBusDisasterRecoveryConfigStatus holds the deployment status
// and outputs.
message AzureServiceBusDisasterRecoveryConfigStatus {
  // stack-outputs
  AzureServiceBusDisasterRecoveryConfigStackOutputs outputs = 1;
}
