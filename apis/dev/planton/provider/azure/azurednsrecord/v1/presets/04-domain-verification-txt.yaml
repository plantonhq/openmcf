apiVersion: azure.planton.dev/v1
kind: AzureDnsRecord
metadata:
  name: my-domain-verification-txt
spec:
  resourceGroup:
    value: <your-resource-group>
  zoneName:
    value: example.com
  # Verification records live on service-defined names: asuid.{host} for
  # Container Apps custom domains, _dnsauth.{host} for Front Door.
  name: asuid.app
  # Short TTL so the validating service sees the record fast.
  ttlSeconds: 60
  txt:
    - <verification-token-from-app-output>
