apiVersion: azure.planton.dev/v1
kind: AzureDnsRecord
metadata:
  name: my-domain-verification-txt
spec:
  resourceGroup:
    value: <your-resource-group>
  zoneName:
    value: example.com
  # Verification records live on service-defined names: asuid.{host} for
  # Container Apps custom domains, _dnsauth.{host} for Front Door.
  name: asuid.app
  # Short TTL so the validating service sees the record fast.
  ttlSeconds: 60
  # Each TXT value is a literal or a reference. When the token is minted
  # at deploy time, reference the issuing resource's output directly --
  # e.g. an AzureFrontDoorCustomDomain's validation_token -- and the
  # record self-completes the domain validation.
  txt:
    - valueFrom:
        kind: AzureFrontDoorCustomDomain
        name: <your-custom-domain-resource-name>
        fieldPath: status.outputs.validation_token
