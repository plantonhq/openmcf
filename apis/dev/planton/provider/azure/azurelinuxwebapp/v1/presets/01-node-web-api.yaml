apiVersion: azure.planton.dev/v1
kind: AzureLinuxWebApp
metadata:
  name: my-node-api
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  webAppName: my-node-api
  servicePlanId:
    value: "<your-service-plan-id>"
  applicationInsightsConnectionString:
    value: "<your-app-insights-connection-string>"
  httpsOnly: true
  appSettings:
    NODE_ENV: production
  siteConfig:
    applicationStack:
      nodeVersion: "22-lts"
    healthCheckPath: /health
    http2Enabled: true
    # TLS_1_2 is the spec default -- stated here for clarity.
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    cors:
      allowedOrigins:
        - https://myapp.example.com
