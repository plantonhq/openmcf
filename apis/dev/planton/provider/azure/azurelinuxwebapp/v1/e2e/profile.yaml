apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: azurelinuxwebapp
spec:
  # The scenario deploys the fixture resource group and the fixture
  # Basic B1 plan (registry prerequisites), creates a Python web app
  # with always-on, a health probe, and enum dials, verifies it via the
  # ARM API, destroys it, and verifies it is gone. Site names release
  # immediately on delete, so both engine runs can own the same
  # globally-unique name sequentially.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
