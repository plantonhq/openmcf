apiVersion: azure.planton.dev/v1alpha1
kind: AzureLinuxWebApp
metadata:
  name: my-container-webapp
spec:
  region: eastus
  resourceGroup:
    value: "<your-resource-group-name>"
  webAppName: my-container-webapp
  servicePlanId:
    value: "<your-premium-plan-id>"
  httpsOnly: true
  identity:
    type: SYSTEM_ASSIGNED
  appSettings:
    WEBSITES_PORT: "8080"
  siteConfig:
    applicationStack:
      docker:
        registryUrl: https://<your-registry>.azurecr.io
        imageName: <your-org>/<your-web-app>
        imageTag: latest
    # Managed-identity image pulls: no registry password to manage.
    # Grant the app's identity AcrPull on the registry.
    containerRegistryUseManagedIdentity: true
    healthCheckPath: /health
    alwaysOn: true
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
