apiVersion: azure.planton.dev/v1
kind: AzureIpGroup
metadata:
  name: on-prem-datacenter
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: <resource-group-name>
  name: on-prem-datacenter
  cidrs:
    - "10.100.0.0/16"
    - "10.101.0.0/16"
    - "172.16.10.0/24"
  tags:
    environment-scope: hybrid
    cost-center: <cost-center>
