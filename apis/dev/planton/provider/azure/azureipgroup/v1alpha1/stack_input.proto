syntax = "proto3";

package dev.planton.provider.azure.azureipgroup.v1alpha1;

import "dev/planton/provider/azure/azureipgroup/v1alpha1/api.proto";
import "dev/planton/provider/azure/provider.proto";

// AzureIpGroupStackInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and Azure
// provider credentials.
message AzureIpGroupStackInput {
  // The IP Group resource to deploy.
  AzureIpGroup target = 1;

  // Azure provider configuration (credentials).
  dev.planton.provider.azure.AzureProviderConfig provider_config = 2;
}
