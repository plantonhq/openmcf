syntax = "proto3";

package dev.planton.provider.azure.azurepublicipprefix.v1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurepublicipprefix/v1/spec.proto";
import "dev/planton/provider/azure/azurepublicipprefix/v1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzurePublicIpPrefix is the top-level API resource for an Azure Public IP
// Prefix: a reserved, contiguous range of public IP addresses. It is
// modeled as a first-class composable resource because the range has its
// own lifecycle (reserved once, consumed by many) and is referenced by
// both AzurePublicIp (allocating individual addresses from it) and
// AzureNatGateway (associating whole prefixes for outbound SNAT).
message AzurePublicIpPrefix {
  // API version identifier. Must be "azure.planton.dev/v1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1'];

  // Resource kind. Must be "AzurePublicIpPrefix".
  string kind = 2 [(buf.validate.field).string.const = 'AzurePublicIpPrefix'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Public IP prefix specification.
  AzurePublicIpPrefixSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing stack outputs. Populated after deployment.
  AzurePublicIpPrefixStatus status = 5;
}

// AzurePublicIpPrefixStatus holds the deployment outputs.
message AzurePublicIpPrefixStatus {
  // Stack outputs from the IaC deployment.
  AzurePublicIpPrefixStackOutputs outputs = 1;
}
