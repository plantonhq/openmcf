apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCacheAccessPolicyAssignment
metadata:
  name: my-identity-reader-grant
spec:
  redisCacheId:
    valueFrom:
      kind: AzureRedisCache
      name: <cache-resource-name>
      fieldPath: status.outputs.redis_cache_id
  assignmentName: <assignmentName>
  # The built-in read-only policy -- referenced by literal name; no
  # policy resource exists for built-ins.
  accessPolicyName:
    value: Data Reader
  # The identity's PRINCIPAL id (never the client id -- that mistake
  # fails at connect time, not deploy time).
  objectId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: <identity-resource-name>
      fieldPath: status.outputs.principal_id
  objectIdAlias: <identity-resource-name>
