apiVersion: azure.planton.dev/v1
kind: AzureMssqlFailoverGroup
metadata:
  name: my-manual-failover-group
spec:
  name: prod-sql-fog-manual
  serverId:
    valueFrom:
      name: <primary-server>
  partnerServers:
    - serverId:
        valueFrom:
          name: <partner-server>
  databaseIds:
    - valueFrom:
        name: <database>
  readWriteEndpointFailoverPolicy:
    mode: MANUAL
  readonlyEndpointFailoverPolicyEnabled: false
  tags:
    cost-center: <cost-center>
