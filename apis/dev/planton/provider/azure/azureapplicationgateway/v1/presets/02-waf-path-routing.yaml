apiVersion: azure.planton.dev/v1
kind: AzureApplicationGateway
metadata:
  name: waf-gateway
spec:
  region: eastus
  resourceGroup:
    value: <resource-group-name>
  name: <gateway-name>
  subnetId:
    value: <gateway-subnet-arm-id>
  sku: WAF_V2
  autoscale:
    minCapacity: 2
    maxCapacity: 10
  zones: ["1", "2", "3"]
  identity:
    type: USER_ASSIGNED
    identityIds:
      - value: <gateway-identity-arm-id>
  # The org-standard WAF policy, enforced gateway-wide (listeners and
  # path rules can override with their own policies).
  firewallPolicyId:
    valueFrom:
      kind: AzureWebApplicationFirewallPolicy
      name: <waf-policy-resource-name>
      fieldPath: status.outputs.policy_id
  frontendIpConfigurations:
    - name: public
      publicIpAddressId:
        value: <public-ip-arm-id>
  frontendPorts:
    - name: https
      port: 443
  backendAddressPools:
    - name: web
    - name: api
  backendHttpSettings:
    - name: web-settings
      port: 8080
      protocol: HTTP
    - name: api-settings
      port: 8443
      protocol: HTTPS
      pickHostNameFromBackendAddress: true
  httpListeners:
    - name: https-listener
      frontendIpConfigurationName: public
      frontendPortName: https
      protocol: HTTPS
      sslCertificateName: tls-cert
      requireSni: true
      hostNames:
        - <public-host-name>
  requestRoutingRules:
    - name: path-routing
      ruleType: PATH_BASED_ROUTING
      httpListenerName: https-listener
      priority: 100
      urlPathMapName: paths
  urlPathMaps:
    - name: paths
      defaultBackendAddressPoolName: web
      defaultBackendHttpSettingsName: web-settings
      pathRules:
        - name: api
          paths:
            - /api/*
          backendAddressPoolName: api
          backendHttpSettingsName: api-settings
  sslCertificates:
    - name: tls-cert
      keyVaultSecretId:
        value: <key-vault-certificate-secret-id>
  tags:
    cost-center: <cost-center>
