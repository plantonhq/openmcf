# Subnet-scoped peering: only listed subnets are reachable across the link.
# Stamp a reciprocal resource on the remote network with networks and subnet
# lists swapped. Both directions must list the same subnet pairing.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualNetworkPeering
metadata:
  name: my-shared-to-app
spec:
  name: shared-to-app
  virtualNetworkId:
    valueFrom:
      name: <local-vnet-resource-name>
  remoteVirtualNetworkId:
    valueFrom:
      name: <remote-vnet-resource-name>
  # false = peer named subnets only, not full address spaces. Subnet name
  # lists are rejected when this is true (the default).
  peerCompleteVirtualNetworksEnabled: false
  # Subnets on the LOCAL network included in this peering.
  localSubnetNames:
    - <local-subnet-name>
  # Subnets on the REMOTE network included in this peering.
  remoteSubnetNames:
    - <remote-subnet-name>
