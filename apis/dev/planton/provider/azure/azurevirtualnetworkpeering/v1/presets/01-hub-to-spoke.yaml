# Hub-side peering: written ON the hub, pointing AT the spoke.
# One resource = one direction. Stamp 02-spoke-to-hub on the spoke to
# complete the pair before expecting bidirectional traffic.
apiVersion: azure.planton.dev/v1
kind: AzureVirtualNetworkPeering
metadata:
  name: my-hub-to-spoke1
spec:
  # Name within the hub VNet's peering list -- name it after the far side.
  name: hub-to-spoke1
  # LOCAL side: the network this peering is an ARM child of.
  virtualNetworkId:
    valueFrom:
      name: <hub-vnet-resource-name>
  # REMOTE side: the spoke to connect. ARM ID works cross-subscription/region.
  remoteVirtualNetworkId:
    valueFrom:
      name: <spoke-vnet-resource-name>
  # Admit traffic the spoke did not originate but the hub relayed (NVA/VPN).
  # Required for inspection topologies; pair with UDRs steering spoke egress
  # to the hub appliance.
  allowForwardedTraffic: true
  # Let the spoke use the hub's VPN/ExpressRoute gateway. Only meaningful when
  # the spoke-side peering sets useRemoteGateways: true and the spoke has
  # no gateway of its own. Omit both gateway flags for simple L3 peering.
  allowGatewayTransit: true
