syntax = "proto3";

package dev.planton.provider.azure.azureservicebusnamespace.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azureservicebusnamespace/v1alpha1/spec.proto";
import "dev/planton/provider/azure/azureservicebusnamespace/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// AzureServiceBusNamespace is the top-level API resource for an Azure Service
// Bus namespace -- the container and billing boundary for enterprise
// messaging. The namespace sets the pricing tier, network posture,
// encryption, and authentication mode; the messaging entities compose onto
// it as first-class kinds (AzureServiceBusQueue, AzureServiceBusTopic,
// AzureServiceBusSubscription, AzureServiceBusAuthorizationRule,
// AzureServiceBusDisasterRecoveryConfig).
message AzureServiceBusNamespace {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureServiceBusNamespace'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureServiceBusNamespaceSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureServiceBusNamespaceStatus status = 5;
}

// AzureServiceBusNamespaceStatus holds the deployment status and outputs.
message AzureServiceBusNamespaceStatus {
  // stack-outputs
  AzureServiceBusNamespaceStackOutputs outputs = 1;
}
