apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCache
metadata:
  name: my-dev-cache
spec:
  region: <region>
  resourceGroup:
    valueFrom:
      kind: AzureResourceGroup
      name: <resource-group-resource-name>
      fieldPath: status.outputs.resource_group_name
  # Replace: 1-63 letters, digits, and hyphens (no repeats), globally
  # unique -- it becomes {name}.redis.cache.windows.net.
  cacheName: myorg-dev-cache
  # BASIC: one node, no replica, NO SLA -- the cheapest tier, for
  # development and testing only.
  skuName: BASIC
  # C0 = 250 MB, the smallest size (also the default when omitted).
  capacity: 0
  # Lock the public endpoint to the office/VPN range even in dev --
  # a cache with data is a cache worth protecting.
  firewallRules:
    # Replace with your team's real IP range.
    - name: dev_allowlist
      startIp: 203.0.113.0
      endIp: 203.0.113.255
