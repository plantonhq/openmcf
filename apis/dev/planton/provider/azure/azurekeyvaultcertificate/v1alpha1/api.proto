syntax = "proto3";

package dev.planton.provider.azure.azurekeyvaultcertificate.v1alpha1;

import "buf/validate/validate.proto";
import "dev/planton/provider/azure/azurekeyvaultcertificate/v1alpha1/spec.proto";
import "dev/planton/provider/azure/azurekeyvaultcertificate/v1alpha1/stack_outputs.proto";
import "dev/planton/shared/metadata.proto";

// azure-key-vault-certificate
message AzureKeyVaultCertificate {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureKeyVaultCertificate'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureKeyVaultCertificateSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureKeyVaultCertificateStatus status = 5;
}

// azure-key-vault-certificate status
message AzureKeyVaultCertificateStatus {
  //stack-outputs
  //  azure-key-vault-certificate stack-outputs
  AzureKeyVaultCertificateStackOutputs outputs = 1;
}
