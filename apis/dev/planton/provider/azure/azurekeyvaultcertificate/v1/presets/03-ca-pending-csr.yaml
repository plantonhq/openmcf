apiVersion: azure.planton.dev/v1
kind: AzureKeyVaultCertificate
metadata:
  name: public-tls
spec:
  name: public-tls
  keyVaultId:
    value: <key-vault-arm-id>
  certificatePolicy:
    issuerName: Unknown
    keyProperties:
      exportable: false
      keyType: RSA
      keySize: 2048
    lifetimeActions:
      - actionType: EMAIL_CONTACTS
        trigger:
          daysBeforeExpiry: 30
    secretProperties:
      contentType: PEM
    x509CertificateProperties:
      subject: CN=<public-hostname>
      subjectAlternativeNames:
        dnsNames:
          - <public-hostname>
      keyUsage:
        - DIGITAL_SIGNATURE
        - KEY_ENCIPHERMENT
      extendedKeyUsage:
        - 1.3.6.1.5.5.7.3.1
      validityInMonths: 12
