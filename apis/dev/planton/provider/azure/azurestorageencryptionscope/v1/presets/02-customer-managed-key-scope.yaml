apiVersion: azure.planton.dev/v1
kind: AzureStorageEncryptionScope
metadata:
  name: my-regulated-scope
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  scopeName: <scopeName>
  # YOUR Key Vault key encrypts this scope's data -- you control
  # rotation, revocation, and access. The ACCOUNT must carry a managed
  # identity with wrap/unwrap access on the key's vault (the same
  # plumbing as the account-level customer-managed key).
  source: MICROSOFT_KEY_VAULT
  # The VERSIONLESS key reference: rotation propagates to the scope
  # with zero intervention.
  keyVaultKeyId:
    valueFrom:
      kind: AzureKeyVaultKey
      name: <key-vault-key-resource-name>
      fieldPath: status.outputs.versionless_id
