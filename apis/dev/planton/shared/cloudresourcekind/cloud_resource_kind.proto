syntax = "proto3";

package dev.planton.shared.cloudresourcekind;

import "dev/planton/shared/cloudresourcekind/cloud_resource_provider.proto";
import "google/protobuf/descriptor.proto";

//enum value options for api-resource-kind
extend google.protobuf.EnumValueOptions {
  CloudResourceKindMeta kind_meta = 10100;
}

//cloud-resource-kind version
enum CloudResourceKindVersion {
  cloud_resource_kind_version_unspecified = 0;
  v1 = 1;
}

//api-resource-kind cloud-resource meta
message CloudResourceKindMeta {
  //cloud-resource provider
  CloudResourceProvider provider = 1;

  //cloud-resource kind version
  CloudResourceKindVersion version = 2;

  //name of the kind. this might be different from the enum value.
  // ex: AwsVpcV2 enum will still have "kind: AwsVpc" but groupVersion will have "aws.planton.dev/v2".
  //this is only set in options when the name is different from enum value.
  string name = 3;

  //cloud-resource id-prefix
  string id_prefix = 4;

  //flag indicating whether the cloud-resource kind can be used to launch a service.
  bool is_service_kind = 5;

  //flag indicating whether the cloud-resource kind is a container kind.
  //container kinds are resources that logically contain other resources
  //(e.g., a Kubernetes namespace contains deployments, a VPC contains subnets).
  //used by the organization graph to render hierarchical architecture diagrams
  //where container resources visually enclose their child resources.
  bool container_kind = 6;

  //components that must be deployed before this component can function.
  //order matters: index 0 is deployed first. the E2E framework installs these
  //(resolved transitively) before the component under test and tears them down
  //in reverse order; a component may pin a prerequisite's exact config via an
  //e2e/fixtures/ override, which wins over the registry entry. this is also
  //used by the platform for dependency ordering in infra charts.
  //example: KubernetesPostgres needs KubernetesZalandoPostgresOperator
  //because it creates acid.zalan.do/v1 postgresql CRDs.
  repeated CloudResourceKind prerequisites = 7;

  //set ONLY for kinds whose spec is a direct projection of a single Kubernetes
  //custom resource -- i.e. the Terraform module is a thin `kubernetes_manifest`
  //passthrough rather than hand-written provider logic. its presence flips the
  //proto->tfvars converter to emit the manifest-shaped (camelCase, pruned) spec
  //and drives deterministic thin-module generation (see `planton tofu
  //generate-module`). absent for provider-abstraction kinds (aws/gcp/etc.),
  //which keep idiomatic snake_case typed variables. the api_version/kind here
  //are the UPSTREAM CRD's group-version-kind, distinct from the Planton
  //groupVersion returned by crkreflect.GroupVersion.
  KubernetesManifestProjection kubernetes_manifest_projection = 8;
}

//identifies the upstream Kubernetes custom resource that a CloudResourceKind
//projects onto. carried on CloudResourceKindMeta for projection kinds only.
message KubernetesManifestProjection {
  //upstream CRD groupVersion, e.g. "networking.istio.io/v1".
  string api_version = 1;
  //upstream CRD kind, e.g. "DestinationRule".
  string kind = 2;
}

enum CloudResourceKind {
  // 0: Default/unspecified
  unspecified = 0;

  // 1–49: Test/dev/custom
  TestCloudResourceGeneric = 1 [(kind_meta) = {
    provider: _test
    version: v1
    id_prefix: "tcrg"
  }];
  TestCloudResourceKubernetes = 2 [(kind_meta) = {
    provider: _test
    version: v1
    id_prefix: "tcrk"
  }];

  // 50–199: saas platform resources
  ConfluentKafka = 50 [(kind_meta) = {
    provider: confluent
    version: v1
    id_prefix: "conkaf"
  }];
  AtlasMongodb = 51 [(kind_meta) = {
    provider: atlas
    version: v1
    id_prefix: "atlmdb"
  }];
  SnowflakeDatabase = 52 [(kind_meta) = {
    provider: snowflake
    version: v1
    id_prefix: "snowdb"
  }];

  // 200–399: AWS resources
  // AwsSubnet is a prerequisite because an ALB requires at least two subnets
  // in different availability zones -- the spec's subnet references must
  // resolve before the load balancer can be created.
  AwsAlb = 200 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsalb"
    prerequisites: [AwsSubnet]
  }];
  AwsCertManagerCert = 201 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "acmcert"
  }];
  AwsCloudFront = 202 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscf"
  }];
  AwsDynamodb = 203 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsdyn"
  }];
  AwsEcrRepo = 204 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ecr"
  }];
  AwsEcsCluster = 205 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ecsclu"
    container_kind: true
  }];
  // AwsEcsCluster, AwsEcsTaskDefinition, and AwsSubnet are prerequisites
  // because a service schedules a referenced task-definition revision into
  // a referenced live cluster and places task network interfaces into
  // referenced subnets -- all three references must resolve first.
  AwsEcsService = 206 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ecssvc"
    prerequisites: [
      AwsEcsCluster,
      AwsEcsTaskDefinition,
      AwsSubnet
    ]
  }];
  // AwsSubnet and AwsIamRole are prerequisites because the control plane
  // attaches its network interfaces into referenced subnets and assumes a
  // referenced cluster role that must already carry AmazonEKSClusterPolicy.
  AwsEksCluster = 207 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "eks"
    container_kind: true
    prerequisites: [
      AwsSubnet,
      AwsIamRole
    ]
  }];
  AwsIamRole = 208 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "air"
  }];
  AwsLambda = 209 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "lambda"
    prerequisites: [AwsIamRole]
  }];
  AwsRdsCluster = 210 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "rdsclu"
    prerequisites: [AwsSubnet]
  }];
  AwsRdsInstance = 211 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "rdsins"
    prerequisites: [AwsSubnet]
  }];
  AwsRoute53Zone = 212 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "r53z"
  }];
  AwsS3Bucket = 213 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "s3bkt"
  }];
  // AwsVpc is a prerequisite because a target group's health checks and
  // target registrations live inside one VPC -- the spec's vpc_id reference
  // must resolve before the group can be created.
  AwsLbTargetGroup = 214 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "lbtg"
    prerequisites: [AwsVpc]
  }];
  // AwsVpc is a prerequisite because every security group is created in a
  // VPC; the E2E install profile resolves vpc_id against the VPC prerequisite.
  AwsSecurityGroup = 215 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awssg"
    prerequisites: [AwsVpc]
  }];
  AwsVpc = 216 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsvpc"
    container_kind: true
  }];
  // AwsEksCluster is a prerequisite because nodes register with a live
  // control plane; AwsIamRole and AwsSubnet back the node role and worker
  // subnet references.
  AwsEksNodeGroup = 217 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "eksng"
    prerequisites: [
      AwsEksCluster,
      AwsIamRole,
      AwsSubnet
    ]
  }];
  AwsIamUser = 218 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsuser"
  }];
  AwsKmsKey = 219 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awskms"
  }];
  AwsEc2Instance = 220 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ec2inst"
  }];
  // Every Client VPN endpoint requires an ACM server certificate at create
  // time; the imported self-signed fixture satisfies it. Subnets/VPC are
  // optional composition (a zero-association endpoint is valid) -- composed
  // scenarios declare them via the e2e-prerequisites annotation.
  AwsClientVpn = 221 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsvpn"
    prerequisites: [AwsCertManagerCert]
  }];
  AwsDocumentDb = 222 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "docdb"
    prerequisites: [AwsSubnet]
  }];
  // AwsRoute53Zone is a prerequisite because every record lives inside a
  // hosted zone -- the spec's zone_id reference must resolve before the
  // record can be created.
  AwsRoute53DnsRecord = 223 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "r53rec"
    prerequisites: [AwsRoute53Zone]
  }];
  // AwsS3Bucket is a prerequisite because the object set's bucket reference
  // is required -- objects cannot exist without the bucket that holds them.
  AwsS3ObjectSet = 224 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "s3objs"
    prerequisites: [AwsS3Bucket]
  }];
  AwsSqsQueue = 225 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awssqs"
  }];
  AwsSnsTopic = 226 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awssns"
  }];
  AwsEventBridgeBus = 227 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awseb"
  }];
  AwsEventBridgeRule = 228 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsebr"
  }];
  AwsIamOidcProvider = 229 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "oidcp"
  }];
  AwsIamPolicy = 230 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "iampol"
  }];
  // AwsIamRole is a prerequisite because an instance profile is a wrapper that
  // must contain a role to be useful -- the profile's spec requires a role
  // reference, so the role must be deployed first.
  AwsIamInstanceProfile = 231 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "iamip"
    prerequisites: [AwsIamRole]
  }];
  // AwsAlb and AwsLbTargetGroup are prerequisites because a listener is an
  // attachment point on a load balancer and its default action almost always
  // forwards to a target group -- both references must resolve before the
  // listener can be created.
  AwsLbListener = 232 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "lbl"
    prerequisites: [
      AwsAlb,
      AwsLbTargetGroup
    ]
  }];
  // AwsLbListener is a prerequisite because a rule only exists as an
  // attachment on a listener -- the listener_arn reference must resolve
  // before the rule can be created.
  AwsLbListenerRule = 233 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "lblr"
    prerequisites: [AwsLbListener]
  }];
  AwsLaunchTemplate = 234 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "lt"
  }];
  // AwsSubnet and AwsLaunchTemplate are prerequisites because a group
  // cannot exist without subnets to place capacity in and a launch
  // template to launch from -- the spec's subnets and launch_template
  // references must resolve before the group can be created.
  AwsAutoScalingGroup = 235 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "asg"
    prerequisites: [
      AwsSubnet,
      AwsLaunchTemplate
    ]
  }];
  // AwsEksCluster is a prerequisite because an add-on installs onto a live
  // control plane -- the spec's cluster_name reference must resolve before
  // the add-on can be created.
  AwsEksAddon = 236 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "eksaddon"
    prerequisites: [AwsEksCluster]
  }];
  // AwsEksCluster, AwsIamRole, and AwsSubnet are prerequisites because a
  // Fargate profile attaches to a live control plane, runs pods as a
  // referenced pod-execution role, and launches them into referenced
  // private subnets -- all three references must resolve first.
  AwsEksFargateProfile = 237 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "eksfp"
    prerequisites: [
      AwsEksCluster,
      AwsIamRole,
      AwsSubnet
    ]
  }];
  // AwsEksCluster and AwsIamRole are prerequisites because an access entry
  // grants a referenced IAM principal access to a live control plane --
  // both references must resolve before the entry can be created.
  AwsEksAccessEntry = 238 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "eksae"
    prerequisites: [
      AwsEksCluster,
      AwsIamRole
    ]
  }];
  // AwsIamRole is a prerequisite because the kind's default posture --
  // Fargate with the awslogs logging default -- is rejected by AWS at
  // registration time without an execution role the agent can assume.
  AwsEcsTaskDefinition = 239 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ecstd"
    prerequisites: [AwsIamRole]
  }];
  AwsHttpApiGateway = 240 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awshttpapigw"
  }];
  // AwsIamRole is a prerequisite because a state machine cannot be created
  // without an execution role it can assume -- the spec's role_arn reference
  // must resolve before the CreateStateMachine call.
  AwsStepFunction = 241 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awssfn"
    prerequisites: [AwsIamRole]
  }];
  // AwsSubnet is a prerequisite because a VPC link is a set of managed ENIs
  // provisioned into referenced subnets -- the subnet references must resolve
  // before the link can be created. Security groups are optional on the link,
  // so they compose per-scenario rather than as a registry prerequisite.
  AwsHttpApiVpcLink = 356 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awshttpvpcl"
    prerequisites: [AwsSubnet]
  }];
  // AwsCertManagerCert is a prerequisite because a custom domain cannot be
  // created without a TLS certificate in the same region covering the domain
  // -- the spec's certificate_arn reference must resolve first.
  AwsHttpApiDomain = 357 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awshttpdom"
    prerequisites: [AwsCertManagerCert]
  }];
  // AwsVpcEndpoint's composed E2E scenarios reference the AwsVpc
  // prerequisite's outputs (vpc_id + default_route_table_id for gateway
  // endpoints) and the AwsSubnet pair's subnet_id outputs (interface
  // endpoints), so both are genuine deploy-order prerequisites.
  AwsVpcEndpoint = 242 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "vpce"
    prerequisites: [
      AwsVpc,
      AwsSubnet
    ]
  }];
  AwsElasticacheUser = 243 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ecuser"
  }];
  // AwsElasticacheUser is a genuine prerequisite: AWS refuses to create a
  // user group that does not contain a user named "default", so a group's
  // composed E2E scenario must resolve a deployed user's outputs.
  AwsElasticacheUserGroup = 244 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "ecug"
    prerequisites: [AwsElasticacheUser]
  }];
  AwsRedshiftServerlessNamespace = 245 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "rsns"
  }];
  // The namespace is a genuine prerequisite: a workgroup attaches to
  // exactly one namespace by name at create time, so its composed E2E
  // scenario must resolve a deployed namespace's outputs. AwsSubnet is a
  // prerequisite because Redshift Serverless requires the workgroup's
  // subnets to span three availability zones.
  AwsRedshiftServerlessWorkgroup = 246 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "rswg"
    prerequisites: [
      AwsRedshiftServerlessNamespace,
      AwsSubnet
    ]
  }];
  // AwsSubnet is a prerequisite because the module builds an ElastiCache
  // subnet group from referenced subnets -- the spec's subnet references
  // must resolve before the replication group can deploy.
  AwsRedisElasticache = 250 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsredis"
    prerequisites: [AwsSubnet]
  }];
  AwsOpenSearchDomain = 251 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsos"
  }];
  AwsMemcachedElasticache = 252 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsmemcached"
    prerequisites: [AwsSubnet]
  }];
  AwsServerlessElasticache = 253 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsslselc"
    prerequisites: [AwsSubnet]
  }];
  // AwsSubnet is a prerequisite because an NLB requires at least one subnet
  // mapping -- the spec's subnet references must resolve before the load
  // balancer can be created.
  AwsNlb = 280 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsnlb"
    prerequisites: [AwsSubnet]
  }];
  AwsElasticIp = 281 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awseip"
  }];
  AwsTransitGateway = 282 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awstgw"
  }];
  AwsGlobalAccelerator = 283 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsga"
  }];
  AwsSubnet = 284 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awssn"
    prerequisites: [AwsVpc]
  }];
  AwsInternetGateway = 285 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsigw"
    prerequisites: [AwsVpc]
  }];
  // AwsInternetGateway is a prerequisite because a public NAT gateway can only
  // become available once the VPC it sits in has an internet gateway attached
  // (AWS rejects the create otherwise) -- so the gateway must be deployed first.
  AwsNatGateway = 286 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsnat"
    prerequisites: [
      AwsSubnet,
      AwsElasticIp,
      AwsInternetGateway
    ]
  }];
  AwsEgressOnlyInternetGateway = 287 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awseigw"
    prerequisites: [AwsVpc]
  }];

  // --- Storage ---

  // AwsSubnet and AwsSecurityGroup are prerequisites because mount targets
  // (required, min 1) place the file system's NFS endpoints into subnets and
  // attach security groups -- both references must resolve before the
  // CreateMountTarget calls.
  AwsElasticFileSystem = 290 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsefs"
    prerequisites: [
      AwsSubnet,
      AwsSecurityGroup
    ]
  }];

  // AwsElasticFileSystem is a prerequisite because an access point is created
  // INTO a file system -- the spec's required file_system_id reference must
  // resolve before the CreateAccessPoint call.
  AwsEfsAccessPoint = 360 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsefsap"
    prerequisites: [AwsElasticFileSystem]
  }];

  AwsFsxLustreFileSystem = 291 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxl"
    prerequisites: [AwsSubnet]
  }];

  AwsFsxOpenzfsFileSystem = 292 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxz"
    prerequisites: [AwsSubnet]
  }];

  // Every Windows file system must join an Active Directory domain; the
  // directory itself is external infrastructure (AWS Managed Microsoft AD or
  // a self-managed domain), so only the network dependency is a declarable
  // prerequisite.
  AwsFsxWindowsFileSystem = 293 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxw"
    prerequisites: [AwsSubnet]
  }];

  AwsFsxOntapFileSystem = 294 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxo"
    prerequisites: [AwsSubnet]
  }];

  AwsFsxOntapStorageVirtualMachine = 295 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxosvm"
    prerequisites: [AwsFsxOntapFileSystem]
  }];

  AwsFsxOntapVolume = 296 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxov"
    prerequisites: [AwsFsxOntapStorageVirtualMachine]
  }];

  AwsFsxDataRepositoryAssociation = 375 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awsfxdra"
    prerequisites: [AwsFsxLustreFileSystem]
  }];

  // --- Auth / Identity ---

  AwsCognitoUserPool = 300 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscog"
  }];

  // AwsCognitoUserPool is a prerequisite because an identity provider is
  // created INTO a pool -- the spec's required user_pool_id reference must
  // resolve before the CreateIdentityProvider call.
  AwsCognitoIdentityProvider = 302 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscogidp"
    prerequisites: [AwsCognitoUserPool]
  }];

  // AwsCognitoUserPool is a prerequisite because an app client is created
  // INTO a pool -- the spec's required user_pool_id reference must resolve
  // before the CreateUserPoolClient call.
  AwsCognitoUserPoolClient = 358 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscogclient"
    prerequisites: [AwsCognitoUserPool]
  }];

  // AwsCognitoUserPool is a prerequisite because a resource server is created
  // INTO a pool -- the spec's required user_pool_id reference must resolve
  // before the CreateResourceServer call.
  AwsCognitoResourceServer = 359 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscogrs"
    prerequisites: [AwsCognitoUserPool]
  }];

  // --- Security (WAF) ---

  AwsWafWebAcl = 301 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awswaf"
  }];

  AwsWafIpSet = 361 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awswafips"
  }];

  AwsWafRegexPatternSet = 362 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awswafregex"
  }];

  // --- Monitoring / Observability ---

  AwsCloudwatchLogGroup = 310 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscwlg"
  }];

  AwsCloudwatchAlarm = 311 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscwa"
  }];

  AwsCloudwatchCompositeAlarm = 355 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awscwca"
    prerequisites: [AwsCloudwatchAlarm]
  }];

  // --- Analytics / Streaming ---

  AwsKinesisStream = 260 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awskin"
  }];

  // Every Firehose destination requires an S3 configuration (the primary
  // target for extended_s3; the failed/all-document backup for the rest)
  // and an IAM role Firehose assumes to write to it, so both are hard
  // deploy prerequisites.
  AwsKinesisFirehose = 261 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awskfh"
    prerequisites: [
      AwsS3Bucket,
      AwsIamRole
    ]
  }];

  // A consumer registers against exactly one stream and cannot exist
  // without it.
  AwsKinesisStreamConsumer = 262 [(kind_meta) = {
    provider: aws
    version: v1
    id_prefix: "awskincon"
    prerequisites: [AwsKinesisStream]
  }];

  AwsAthenaWorkgroup = 263 [(kind_meta) = {
