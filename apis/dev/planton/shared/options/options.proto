syntax = "proto3";

package dev.planton.shared.options;

import "google/protobuf/descriptor.proto";

message KeyValuePair {
  string key = 1;
  string value = 2;
}

extend google.protobuf.FieldOptions {
  string default = 60001;
  string recommended_default = 60002;
  repeated KeyValuePair recommended_default_map = 60003;
  // Marks a field as holding a secret value (a credential, token, password, key,
  // etc.). Downstream platforms (e.g. Planton) use this to force the value to be
  // a reference to a managed secret rather than plaintext, and to resolve that
  // reference just-in-time at deploy. Applies to string fields and to the literal
  // value of StringValueOrRef fields.
  bool sensitive = 60004;

  // Justification that a field whose NAME matches the secret-coverage heuristic
  // (password|token|secret|key|credential|...) is intentionally NOT a secret
  // value -- e.g. a public key, an access-key *id*, a resource *name*, or a key
  // *algorithm*. A non-empty value exempts the field from the secret-coverage gap
  // report and records WHY (the value is the audit trail).
  //
  // This is read ONLY by secret-coverage tooling. It has NO effect on enforcement
  // or just-in-time resolution: a field is secret-by-default solely when
  // `sensitive` is true, so an exemption can never let a secret field accept
  // plaintext. Setting both `sensitive` and `sensitive_exempt_reason` on the same
  // field is a contradiction the coverage gate rejects.
  string sensitive_exempt_reason = 60005;

  // Human-authored label for the dependency edge this reference field creates in
  // architecture/deployment diagrams. Authored on the CONSUMER's reference field
  // (a StringValueOrRef/ValueFromRef-typed field, beside `default_kind`), because
  // only the consumer knows what the relationship MEANS: an AwsNatGateway's
  // subnet_id reads "in public subnet", not "subnet_id".
  //
  // Downstream platforms surface this on the rendered edge. When absent, clients
  // fall back to automatic humanization of the referenced field path, so coverage
  // is never required — author a label only where the automatic text is
  // inadequate. Keep labels short (2-4 words), lowercase, human: they are read on
  // a diagram at a glance, not in a form.
  string diagram_label = 60006;
}

extend google.protobuf.EnumValueOptions {
  string display_label = 60050;
}
