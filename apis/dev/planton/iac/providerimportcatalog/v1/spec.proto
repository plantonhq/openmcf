syntax = "proto3";

package dev.planton.iac.providerimportcatalog.v1;

// ProviderImportCatalogSpec maps a cloud provider's IaC resource types to the
// identifier format their state import requires. This is provider-level
// knowledge (stable across components): what value string `tofu import` /
// `pulumi import` expects for each resource type. Which concrete value fills
// each placeholder is component-level knowledge and lives in that component's
// ComponentImportMap.
message ProviderImportCatalogSpec {
  repeated ResourceTypeImportId resource_types = 1;
}

// ResourceTypeImportId declares the import identifier for one provider
// resource type, addressed by both engines' type names.
message ResourceTypeImportId {
  // Terraform/OpenTofu resource type (e.g. "aws_s3_bucket").
  string terraform_type = 1;
  // Pulumi type token for the same provider resource
  // (e.g. "aws:s3/bucketV2:BucketV2"). Empty when the component's Pulumi
  // module does not declare this resource.
  string pulumi_type = 2;
  // Import-ID template. Placeholders in {braces} name the values a
  // component's import map supplies (e.g. "{bucket}",
  // "{vpc_id}_{association_id}"). A template with no placeholders is a
  // literal ID.
  string id_format = 3;
  // Provider-documentation notes about the format -- optional variants
  // (e.g. a trailing ",{expected_bucket_owner}"), gotchas, or where the
  // provider documents the ID shape.
  string notes = 4;
  // Attributes that exist ONLY in IaC configuration, never on the cloud
  // resource (e.g. aws_s3_bucket.force_destroy). Import cannot read them
  // from the provider, so a plan after ANY import legitimately shows them
  // as in-place updates when the config sets a non-default value. The
  // round-trip conformance proof tolerates in-place updates touching only
  // these attributes; everything else fails it.
  repeated string config_only_attributes = 5;
}
